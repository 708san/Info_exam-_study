監査証跡をすべて破棄する"],"correct":0,"explain":"タスク実施時の迷い・誤操作・達成状況を観察して課題を見つける。"},{"id":"Q-07-X01","chapter":7,"kind":"applied","q":"実際の利用者に課題を実行してもらい成功率を測定する方法は？","options":["性能ベンチマーク","ユーザビリティテスト","構文解析","回帰分析"],"correct":1,"explain":"ユーザビリティテスト。"},{"id":"U-07-1","chapter":7,"kind":"applied","q":"利用者の状況を理解し試作品を評価・改善する考え方は？","options":["人間中心設計","線形計画法","構成管理","ハッシュ探索"],"correct":0,"explain":"利用者・利用状況の理解と評価を反復する。"},{"id":"U-07-2","chapter":7,"kind":"applied","q":"同じ操作で同じボタン名・配置を使う主目的は？","options":["通信速度向上","操作の一貫性向上","暗号強度向上","DB正規化"],"correct":1,"explain":"習得済みの操作を再利用でき迷いや誤操作を減らす。"},{"id":"U-07-3","chapter":7,"kind":"applied","q":"画面読み上げで画像の意味を伝える方法は？","options":["解像度向上","色数増加","代替テキスト","JPEG変換"],"correct":2,"explain":"代替テキストは画像を見られない利用者に内容を伝える。"},{"id":"U-07-X01","chapter":7,"kind":"applied","q":"専門家が設計原則に照らして評価する手法は？","options":["利用者テスト","負荷試験","単体テスト","ヒューリスティック評価"],"correct":3,"explain":"専門家が原則との不一致を探す手法。"}],"deepIntro":"使いやすさは「見た目の良さ」ではなく、利用者が目的を効率よく正確に達成できるかで評価する。","deep":[{"id":"07-1","title":"UX・ユーザビリティ・設計プロセス","explain":"\u003cp>UI（User Interface：操作画面・接点）はボタンや表示、UX（User Experience：利用体験）は利用前から利用後までを含む体験全体。ISO 9241-11のユーザビリティ概念は、特定の利用状況での有効さ、効率、満足度で捉える。利用者・業務・利用環境を調査し、ペルソナやカスタマージャーニーで仮説を可視化する。仮説は実際の利用者調査で検証する。\u003c/p>\n\u003cp>プロトタイプは低忠実度の紙画面から実動する試作品まで目的に応じて選ぶ。ヒューリスティック評価は専門家が原則に照らして問題を検討、ユーザビリティテストは利用者の行動を観察する。ABテストは無作為割付などの条件を設計し、比較指標と交絡要因に注意する。\u003c/p>\n","worked":"\u003cp>フォーム送信に平均30秒かかる改善案Aと20秒のBがあっても、Bで入力ミス率が2倍なら効率だけで優劣を決められない。有効さ（完了率・誤入力）も測る。\u003c/p>\n","prompt":"ペルソナに詳しい物語を書けば調査が不要か。","answer":"\u003cp>不要にはならない。根拠のない架空設定を事実扱いしない。\u003c/p>\n","beginner":{"scenario":"予約アプリの操作に平均5分かかるなら、観察で迷う場所を見つけ、試作品で2分になるか測る。","trap":"UX（利用者体験）は見た目だけではなく利用前後も含む。","quizId":"U-07-1"}},{"id":"07-2","title":"情報設計・操作の一貫性","explain":"\u003cp>認知負荷を減らすには、関連情報を近くに配置し、複数の作業を分断せず、必要なときに選択肢を示す。ナビゲーションは情報構造を反映し、現在地・戻り方・次の操作を明確にする。アフォーダンス（操作可能性の手掛かり）、フィードバック（操作結果の即時通知）、制約（誤操作防止）を使う。\u003c/p>\n\u003cp>Fittsの法則は目標までの距離と大きさがポインティング時間に関係する考え方。重要なボタンを押しやすい位置とサイズにするのに役立つ。入力の冗長な手間を減らす一方、破壊的操作には確認・取り消しを備える。\u003c/p>\n","worked":"\u003cp>「削除」ボタンを「保存」と同じ色・隣接配置にすると誤操作を誘発しやすい。削除を視覚的に区別し、取り消しや復元機能を用意する。\u003c/p>\n","prompt":"使いづらい画面を詳細マニュアルで補えば十分か。","answer":"\u003cp>まずUIで認知負荷と誤操作を減らすことが重要。\u003c/p>\n","beginner":{"scenario":"送信後に処理中と表示し二重送信を防ぐ。完了時に受付番号、失敗時に理由と再試行方法を示す。","trap":"警告が多いほど使いやすいわけではない。","quizId":"U-07-2"}},{"id":"07-3","title":"アクセシビリティ・国際化","explain":"\u003cp>アクセシビリティは障害の有無にかかわらず利用可能にする設計。画像の代替テキスト、キーボード操作、十分な色のコントラスト、フォームのラベル、明確なエラー表示、読み上げ順序を整える。WCAG（Web Content Accessibility Guidelines：Webコンテンツのアクセシビリティ指針）の考え方は知覚可能・操作可能・理解可能・堅ろう。\u003c/p>\n\u003cp>国際化（i18n）は言語・地域差へ対応しやすい構造、地域化（l10n）は各地域向けの翻訳や日付・通貨・書式の調整。文字コードUTF-8（Unicode Transformation Format 8-bit：Unicodeの符号化方式）を使っても、単位や住所形式の違いは自動的には解決しない。\u003c/p>\n","worked":"\u003cp>エラーを赤色の枠線だけで示すと色覚特性や音声読み上げで伝わりにくい。テキストで「必須項目です」を付け、入力欄と関連付ける。\u003c/p>\n","prompt":"読みやすい配色だけでアクセシビリティ対応が完了するか。","answer":"\u003cp>しない。操作・構造・支援技術への適合も必要。\u003c/p>\n","beginner":{"scenario":"赤と緑だけで合否を示さず、合格・不合格の文字と形を併用する。読み上げでも意味を伝える。","trap":"文字を画像にすると拡大や読み上げが難しくなることがある。","quizId":"U-07-3"}},{"id":"07-X01","title":"ユーザーインタフェース技術と評価","explain":"\u003cp>GUI（グラフィカルユーザーインタフェース）は画面の部品を使い、CUI（文字ユーザーインタフェース）はコマンドなど文字で操作する。音声認識・ジェスチャ・タッチ操作も入力手段で、用途に応じて選ぶ。画面設計では入力補助、操作の一貫性、フィードバック、エラー回復を考慮する。\u003c/p>\u003cp>ユーザー体験（UX）は利用前後を含む体験、ユーザビリティは特定の利用状況における目的達成のしやすさ。ユーザテストでは成功率、時間、誤操作などを測定する。ヒューリスティック評価は専門家が原則と照合する。アクセシビリティではキーボード操作、色以外の識別、代替テキスト、読み上げ対応を重視する。\u003c/p>","worked":"\u003cp>色だけでエラーを示す画面に文字とアイコンを追加し、読み上げでも通知されるように改善する。\u003c/p>","prompt":"実際の利用者に課題を実行してもらい成功率を測定する方法は？","answer":"\u003cp>ユーザビリティテスト。\u003c/p>","beginner":{"scenario":"20人中15人が購入完了したならタスク成功率75%。改善版でも同じ条件で時間・成功率を測る。","trap":"A/Bテストは指標や対象次第。全員の使いやすさを保証しない。","quizId":"U-07-X01"}}],"beginnerIntro":"利用者の目的や操作の迷いを理解し、実際の利用者による評価を考える。見た目だけでなく体験全体を扱う。"},{"id":8,"title":"情報メディア","group":"テクノロジ","priority":"A標準","summary":"画像・音声・動画のデータ量、圧縮、色表現、著作権の基礎。","lessons":[{"title":"画像のデータ量","body":"非圧縮画像の概算サイズは横画素×縦画素×色深度÷8バイト。RGB各8ビットなら1画素24ビット。解像度とファイル容量は同義ではない。","check":"圧縮率を使うときは圧縮前後の定義を確認。"},{"title":"可逆・非可逆圧縮","body":"可逆圧縮は元の情報を完全復元可能。JPEGなどの一般的な非可逆圧縮では一部の情報が失われる。PNGは一般に可逆圧縮を利用する。","check":"拡張子だけで全ての設定を断定しない。"},{"title":"音声と動画","body":"PCM（Pulse Code Modulation：パルス符号変調）の非圧縮音声データ量は標本化周波数×量子化ビット数×チャネル数×時間÷8。動画ではフレームレートと解像度が容量に影響。","check":"ビット毎秒とバイト毎秒に注意。"},{"title":"色空間と描画","body":"RGBは光の三原色による加法混色、CMYKは印刷で使う減法混色。ベクタ画像は形状記述により拡大しても原理上輪郭が荒れにくい。","check":"ラスターとベクタの用途を区別。"}],"terms":[{"term":"ラスター画像","definition":"画素の並びで画像を表現する方式"},{"term":"ベクタ画像","definition":"点・線・曲線などの形状情報で画像を表現する方式"},{"term":"RGB","definition":"赤・緑・青の光を加えて色を表現する方式"},{"term":"CMYK","definition":"シアン・マゼンタ・黄・黒のインキで色を表す方式"},{"term":"可逆圧縮","definition":"情報を損なわず元データを再現できる圧縮"},{"term":"非可逆圧縮","definition":"一部の情報を失う代わりに圧縮効率を高める方式"},{"term":"PCM","definition":"音声振幅を標本化して量子化し符号化する方式"},{"term":"フレームレート","definition":"1秒間に表示する映像の静止画枚数"},{"term":"標本化周波数","definition":"1秒間のアナログ信号測定回数"}],"questions":[{"id":"Q08-01","chapter":8,"kind":"applied","q":"800×600画素で1画素24ビットの非圧縮画像の容量は。","options":["約0.48MB","約1.44MB","約4.8MB","約14.4MB"],"correct":1,"explain":"800×600×24÷8=1,440,000バイト≒1.44MB（10進表記）。"},{"id":"Q08-02","chapter":8,"kind":"applied","q":"元データを完全に復元できる圧縮方式は。","options":["非可逆圧縮","可逆圧縮","量子化のみ","サンプリングのみ"],"correct":1,"explain":"可逆は情報を失わない。"},{"id":"Q08-03","chapter":8,"kind":"applied","q":"CD品質の音声を想定し44.1kHz・16ビット・2チャンネル・10秒の非圧縮量は。","options":["約0.88MB","約1.76MB","約8.82MB","約17.64MB"],"correct":1,"explain":"44,100×16×2×10÷8=1,764,000バイト。"},{"id":"D08-01","chapter":8,"kind":"applied","q":"1920×1080画素で24ビットの非圧縮RGB画像の画素データ量に最も近いものはどれか。","options":["約0.6MB","約2.1MB","約6.2MB","約24MB"],"correct":2,"explain":"1920×1080×24/8=6,220,800バイト。ヘッダや行パディングは除く。"},{"id":"D08-02","chapter":8,"kind":"applied","q":"44.1kHz、16ビット、ステレオの非圧縮PCMを60秒記録した容量に最も近いものはどれか。","options":["約1.3MB","約5.3MB","約10.6MB","約21.2MB"],"correct":2,"explain":"44,100×16×2×60/8=10,584,000バイト。圧縮コーデックの容量とは異なる。"},{"id":"D08-03","chapter":8,"kind":"applied","q":"ビットレート2Mbpsの映像を10分送る場合の映像データ量の理論値はどれか（付加情報は無視）。","options":["15MB","75MB","150MB","1200MB"],"correct":2,"explain":"2×10^6bit/秒×600秒÷8=150,000,000バイト=150MB。bitとByteを区別。"},{"id":"Q-08-X01","chapter":8,"kind":"applied","q":"画素を正確に保持して保存したいスクリーンショットに一般的に適する形式は？","options":["JPEG","PNG","MP3","H.264"],"correct":1,"explain":"PNG。可逆圧縮で画素を復元できる。"},{"id":"U-08-1","chapter":8,"kind":"applied","q":"400×200画素・16bit/画素の非圧縮容量は？","options":["160000B","80000B","1280000B","320000B"],"correct":0,"explain":"400×200×16÷8＝160000バイト。"},{"id":"U-08-2","chapter":8,"kind":"applied","q":"44.1kHz・16bit・2チャネルの非圧縮音声1秒の容量は？","options":["88200B","176400B","1411200B","44100B"],"correct":1,"explain":"44100×16×2÷8＝176400バイト。"},{"id":"U-08-3","chapter":8,"kind":"applied","q":"受信データの一時保存で短時間の通信変動を吸収する仕組みは？","options":["量子化","アンチエイリアス","バッファリング","カプセル化"],"correct":2,"explain":"先のデータを保持すれば短時間の遅れを吸収できる。"},{"id":"U-08-X01","chapter":8,"kind":"applied","q":"3次元モデル表面に画像を割り当てる技法は？","options":["量子化","正規化","パリティ検査","テクスチャマッピング"],"correct":3,"explain":"表面に模様・材質の見た目を付ける。"}],"deepIntro":"画像・音・動画は連続的な現実を離散的なデータにするため、品質と容量のトレードオフが生まれる。","deep":[{"id":"08-1","title":"画像の解像度・色と容量","explain":"\u003cp>ラスター画像は画素（ピクセル）の集合。幅W、高さH、1画素bビットなら非圧縮の概算容量はW×H×b/8バイト（ヘッダや行パディングを除く）。RGB（Red Green Blue：赤緑青）の各8ビットで24ビットカラーは1画素約3バイト。アルファ値（透明度）が8ビット追加されるRGBAは4バイト。色深度と解像度は別の概念。\u003c/p>\n\u003cp>ベクター画像は線・曲線・塗りを数式等で表し、拡大時も輪郭が劣化しにくい。JPEGは一般に非可逆圧縮、PNGは可逆圧縮（ただし元画像に変換が入っていない場合）。色空間RGBは光の加法混色、CMYKは印刷の減法混色に使う。\u003c/p>\n","worked":"\u003cp>1920×1080画素、24ビットの生画像は1920×1080×3＝6,220,800バイト、約6.22MB（10進）または約5.93MiB（2進）。MBとMiBの違いに注意。\u003c/p>\n","prompt":"画像のdpiを2倍にすれば画素数も必ず4倍か。","answer":"\u003cp>ならない。dpiは印刷・表示の密度指定に使われ、画素数そのものとは別。\u003c/p>\n","beginner":{"scenario":"画像は画素の集合。640×480画素・24bitなら640×480×24÷8＝921600バイト（非圧縮）。","trap":"縦横2倍は画素数4倍。圧縮やヘッダの条件を確認する。","quizId":"U-08-1","lab":{"title":"画像容量と圧縮率を求める","problem":"1200×800画素、RGB各8ビットの画像を、元の容量の1/5に圧縮する。容量は？","steps":["色深度は8×3=24bit/画素。","画素数は1200×800=960000。","元容量は960000×24÷8=2880000バイト。","圧縮後は2880000÷5=576000バイト。十進単位で576kB。"],"answer":"576000バイト","check":"圧縮率の定義が「元の何倍」か「削減率」かを確認する。今回は元の1/5。"}}},{"id":"08-2","title":"音声の標本化と量子化","explain":"\u003cp>連続音声をディジタル化するとき、サンプリング（標本化）で時間を離散化し、量子化で振幅を有限段階にする。最大周波数fmaxの帯域制限信号を復元するには、標本化周波数fsが通常2fmaxより高い必要がある（標本化定理）。満たさないとエイリアシング（折返しひずみ）が起こるため、入力側の低域通過フィルタが重要。\u003c/p>\n\u003cp>無圧縮PCM（Pulse Code Modulation：パルス符号変調）のデータ量は標本化周波数×量子化ビット数×チャンネル数×秒数/8。音声コーデックを使う場合はビットレートから計算する。\u003c/p>\n","worked":"\u003cp>44.1kHz、16ビット、ステレオ2ch、60秒のPCMは44,100×16×2×60/8＝10,584,000バイト（約10.6MB）。圧縮後容量ではない。\u003c/p>\n","prompt":"量子化ビット数を増やすと標本化周波数も増えるか。","answer":"\u003cp>増えない。振幅方向の分解能と時間方向の細かさは別。\u003c/p>\n","beginner":{"scenario":"音は連続した振動。8kHz、16bit、1チャネル、10秒なら8000×16×10÷8＝160000バイト。","trap":"標本化は時間方向、量子化は振幅方向の離散化。","quizId":"U-08-2"}},{"id":"08-3","title":"動画・圧縮・ストリーミング","explain":"\u003cp>動画は連続画像と音声の系列。フレームレートは1秒当たりの画像枚数、解像度は1フレームの画素数。非圧縮動画は容量が巨大なので、フレーム内圧縮とフレーム間の差分・動き補償を組み合わせる。Iフレーム（独立フレーム）、Pフレーム（過去参照）、Bフレーム（前後参照）の構成は、容量・遅延・ランダムアクセスのトレードオフ。\u003c/p>\n\u003cp>ストリーミングでは帯域とバッファを管理する。ABR（Adaptive Bitrate：適応ビットレート）配信は通信状態に応じて品質を切り替え再生停止を減らす。CDN（Content Delivery Network：コンテンツ配信網）は利用者に近い拠点から配信して遅延・負荷を抑える。\u003c/p>\n","worked":"\u003cp>動画が2Mbpsで10分なら理想的な映像データ量は2×10⁶×600/8＝150MB。音声・コンテナ等を除く概算。MbpsをMB/sと取り違えない。\u003c/p>\n","prompt":"圧縮率が高ければ視聴品質も必ず高いか。","answer":"\u003cp>ならない。情報を削り過ぎれば画質・音質が低下する。\u003c/p>\n","beginner":{"scenario":"映像4Mbit/s、音声0.2Mbit/s、10秒なら合計4.2×10÷8＝5.25MB（追加情報なし）。","trap":"フレームレートと画素解像度は異なる。","quizId":"U-08-3"}},{"id":"08-X01","title":"画像・音声・動画形式とマルチメディア応用","explain":"\u003cp>JPEGは一般に非可逆の写真圧縮、PNGは可逆圧縮と透過、GIFは最大256色のパレットや簡易アニメーションを扱う。MPEGは動画・音声圧縮等の規格群、H.264は動画符号化規格。YUV系の色表現は輝度と色差を分け、色差の解像度を下げることがある。PCM（パルス符号変調）は標本化・量子化した値を符号化する。\u003c/p>\u003cp>ラスタは画素、ベクタは図形の数式。アンチエイリアスは境界のぎざぎざを抑え、ディザリングは限られた色で中間調を表す。CG（コンピュータグラフィックス）のレンダリングはモデルから画像を生成し、レイトレーシングは光線を追跡する。テクスチャマッピングは表面に画像を貼る。ARは拡張現実、VRは仮想現実、MRは複合現実。\u003c/p>","worked":"\u003cp>ロゴの拡大縮小にはベクタ形式が適する場合が多い。写真をJPEG保存すると画質と容量のトレードオフがある。\u003c/p>","prompt":"画素を正確に保持して保存したいスクリーンショットに一般的に適する形式は？","answer":"\u003cp>PNG。可逆圧縮で画素を復元できる。\u003c/p>","beginner":{"scenario":"写真にはJPEG、文字入り図表には可逆のPNGやベクタ形式が適する場合がある。","trap":"可逆は元データを復元でき、非可逆は情報を一部失う。","quizId":"U-08-X01"}}],"beginnerIntro":"画像・音声・動画を数値化する。容量計算は単位、圧縮の有無、時間やチャネル数を確認する。"},{"id":9,"title":"データベース","group":"テクノロジ","priority":"B選択候補","summary":"ER図・正規化・SQL・結合・トランザクション・ロックを重点。","lessons":[{"title":"関係モデルとキー","body":"関係データベースは行と列からなる表で扱う。主キーは行を一意識別しNULL不可。外部キーは他表のキーを参照し参照整合性を支える。","check":"候補キー・主キー・外部キーを設計図上で明確にする。"},{"title":"正規化","body":"第1正規形は繰返し項目を排除、第2は複合主キーの一部にのみ依存する非キー属性を分離、第3は非キー属性を介した推移的関数従属を分離する。","check":"関数従属性を記号で書いて整理。"},{"title":"SQLの実行順序","body":"SQL（Structured Query Language：構造化問合せ言語）はFROM/JOIN→WHERE→GROUP BY→HAVING→SELECT→ORDER BYという論理的処理順序で考えると理解しやすい。WHEREはグループ化前、HAVINGは集約後の絞り込み。","check":"COUNT(*)とCOUNT(列)ではNULLの扱いが異なる。"},{"title":"結合","body":"内部結合は一致する行、左外部結合は左表の行を残す。一対多結合では件数が増えるのでCOUNTの集計粒度に注意する。","check":"LEFT JOIN後の右表条件をWHEREに置くと事実上内部結合になる場合がある。"},{"title":"ACIDと分離","body":"トランザクションのACIDは原子性・一貫性・独立性・永続性。分離レベルやロックでダーティリード・ノンリピータブルリード・ファントムリードを制御。","check":"「原子性」と「独立性」は異なる。"}],"terms":[{"term":"主キー","definition":"表の行を一意に識別しNULLを許さない列または列集合"},{"term":"外部キー","definition":"別の表の候補キー等を参照する列・列集合"},{"term":"関数従属","definition":"属性Xが決まると属性Yが一意に決まる関係"},{"term":"第2正規形","definition":"第1正規形かつ非キー属性の主キーの一部への部分関数従属がない状態"},{"term":"第3正規形","definition":"第2正規形を満たし非キー属性の推移的従属を除いた状態"},{"term":"INNER JOIN","definition":"結合条件を満たす行だけを結合するSQL操作"},{"term":"LEFT JOIN","definition":"左側の表の行を残し右表との一致を結合する操作"},{"term":"HAVING","definition":"GROUP BYで集約したグループに条件を掛ける句"},{"term":"ACID","definition":"トランザクションの原子性・一貫性・独立性・永続性"},{"term":"ダーティリード","definition":"未確定トランザクションの変更内容を読む現象"},{"term":"デッドロック","definition":"互いの資源やロックの解放を待ち続ける状態"},{"term":"B木インデックス","definition":"比較検索や範囲検索に適した平衡木型索引"}],"questions":[{"id":"Q09-01","chapter":9,"kind":"applied","q":"売上表から顧客ごとの売上合計が10万円以上の顧客だけ取り出すSQL句は。","options":["WHERE SUM(金額)>=100000","HAVING SUM(金額)>=100000","ORDER BY SUM(金額)>=100000","LIMIT SUM(金額)>=100000"],"correct":1,"explain":"集約後の条件はHAVINGに書く。"},{"id":"Q09-02","chapter":9,"kind":"applied","q":"主キー(注文番号,商品番号)の表で商品名が商品番号だけに従属する場合、問題となるのは。","options":["部分関数従属","外部結合","排他制御","可逆圧縮"],"correct":0,"explain":"複合キーの一部に従属するため第2正規形で分離を検討する。"},{"id":"Q09-03","chapter":9,"kind":"applied","q":"未コミットの別トランザクションの値を読んだ現象は。","options":["ファントムリード","ダーティリード","ロストアップデート","デッドロック"],"correct":1,"explain":"確定していないデータの読み取りはダーティリード。"},{"id":"D09-01","chapter":9,"kind":"applied","q":"受注が0件の顧客も含む集計で顧客ごとの受注件数を数えるとき、LEFT JOIN後に適切なのはどれか。","options":["COUNT(*)","COUNT(受注.受注ID)","SUM(顧客.ID)","GROUP BYは使えない"],"correct":1,"explain":"LEFT JOINは受注0件でも顧客行が1行残る。COUNT(*)では1と数えるので、NULLになった右側キーをCOUNTする。"},{"id":"D09-02","chapter":9,"kind":"applied","q":"社員ID→部署ID、部署ID→部署名という依存がある表で、部署名の重複更新を減らす設計はどれか。","options":["部署名を社員表へ複数追加する","全項目を文字列1列にする","社員表と部署表に分割する","社員IDを削除する"],"correct":2,"explain":"非キー属性の推移的関数従属を除く第三正規化の考え方に相当する。"},{"id":"D09-03","chapter":9,"kind":"applied","q":"非同期レプリケーションで、主DBの更新をコミット直後に障害が発生した場合のリスクはどれか。","options":["更新が必ず複製に反映される","複製先への反映前なら直近更新が失われ得る","バックアップは不要になる","通信遅延がゼロになる"],"correct":1,"explain":"非同期では複製完了前のコミットを切替先が保持していない可能性がありRPOに影響する。"},{"id":"Q-09-X01","chapter":9,"kind":"applied","q":"関係表から指定列だけ取り出す演算は？","options":["選択","射影","直積","差集合"],"correct":1,"explain":"射影。"},{"id":"Q-09-X02","chapter":9,"kind":"applied","q":"複数サーバに顧客IDの範囲ごとにデータを分割する方式は？","options":["レプリケーション","シャーディング","正規化","ロールバック"],"correct":1,"explain":"シャーディング。"},{"id":"U-09-1","chapter":9,"kind":"applied","q":"注文表の顧客IDが顧客表の主キーを参照するとき何というか？","options":["外部キー","必ず主キー","必ず候補キー","必ず索引"],"correct":0,"explain":"他表のキーを参照する列は外部キー。注文行の一意識別とは別。"},{"id":"U-09-2","chapter":9,"kind":"applied","q":"グループごとの合計値に対する抽出条件を書く句は？","options":["WHERE","HAVING","FROM","ORDER BY"],"correct":1,"explain":"WHEREは集計前の行、HAVINGは集計後のグループ。"},{"id":"U-09-3","chapter":9,"kind":"applied","q":"他取引の未コミットの値を読む現象は？","options":["ファントムリード","デッドロック","ダーティリード","ロールバック"],"correct":2,"explain":"ダーティリードは未確定データの読取り。"},{"id":"U-09-4","chapter":9,"kind":"applied","q":"B木系索引がハッシュ索引より一般に適する検索は？","options":["暗号解読","画像圧縮","全件削除","範囲検索"],"correct":3,"explain":"B木系は順序を利用できる。ハッシュは等値検索が主用途。"},{"id":"U-09-5","chapter":9,"kind":"applied","q":"確定済み更新をログから再適用する処理は？","options":["ロールフォワード","ロールバック","正規化","シャーディング"],"correct":0,"explain":"ロールフォワードは更新の再適用、ロールバックは取消し。"},{"id":"U-09-X01","chapter":9,"kind":"applied","q":"2つの関係の全行の組合せを生成する演算は？","options":["射影","直積","選択","差集合"],"correct":1,"explain":"m行とn行なら全組合せはm×n行。"},{"id":"U-09-X02","chapter":9,"kind":"applied","q":"元データを抽出・変換して分析基盤へ格納する処理は？","options":["OLTP","DDL","ETL","RAID"],"correct":2,"explain":"ETLはExtract・Transform・Load（抽出・変換・格納）。"}],"deepIntro":"データベースの問題は「何を保存するか」「矛盾をどう防ぐか」「どう高速に取り出すか」に分解する。科目BではSQLだけでなく、設計理由を文章で説明する力が必要。","deep":[{"id":"09-1","title":"関係モデル・主キー・外部キー・正規化","explain":"\u003cp>関係データベース（RDB: Relational Database）は表（関係）の行でデータを表す。主キーは行を一意に識別し、候補キーは一意性と最小性を満たす属性集合。外部キーは別表の候補キーなどを参照し、参照整合性を維持するために使う。NULL（値が不明・存在しないことなどを示すマーカー）は0や空文字とは異なり、比較演算でUNKNOWNを生む場合がある。\u003c/p>\n\u003cp>正規化は更新時の矛盾を防ぐ設計手法。第1正規形は各セルが原子的な値、第2正規形は候補キーの一部だけに依存する非キー属性を除く、第3正規形は非キー属性を経由した推移的関数従属を除く（厳密には各正規形の判定条件を確認）。例えば「注文明細(注文ID,商品ID,商品名,単価,数量)」で(注文ID,商品ID)が主キーなら、商品名と単価が商品IDだけに依存する設計では商品変更時に多数行を更新する必要があるため、商品表に分割する。\u003c/p>\n","worked":"\u003cp>社員(社員ID,部署ID,部署名)で社員ID→部署ID、部署ID→部署名と成り立つなら、社員ID→部署名は推移的依存。部署(部署ID,部署名)と社員(社員ID,部署ID)に分割すれば部署名の変更箇所を減らせる。\u003c/p>\n","prompt":"主キーが「注文ID＋商品ID」である明細表の「商品名」は、主キー全体に依存するか。","answer":"\u003cp>通常は商品IDだけで決まるため部分関数従属であり、商品表への分割を検討する。\u003c/p>\n","beginner":{"scenario":"注文行に顧客名が重複すると改名で全行修正が必要。顧客表に名前を置き、注文表には顧客IDだけを持たせる。","trap":"正規化は重複・矛盾を減らす。非正規化は整合性を別に管理する必要がある。","quizId":"U-09-1","lab":{"title":"正規化を実際の表で考える","problem":"注文明細（注文ID、商品ID、顧客名、商品名、数量）を設計する。複合主キーは注文IDと商品ID。注文ごとに顧客は一人、商品IDごとに商品名は一つ。","steps":["主キー全体で数量を決める。商品名は商品IDだけで決まり、顧客名は注文IDだけで決まるため部分関数従属がある。","注文表（注文ID、顧客ID）、商品表（商品ID、商品名）、顧客表（顧客ID、顧客名）に分離する。","明細表（注文ID、商品ID、数量）は複合主キーを持ち、注文・商品を外部キーで参照する。","顧客名の修正は顧客表1か所で済む。注文・商品との関連を結合で復元できる。"],"answer":"注文・商品・顧客・明細の4表に整理","check":"顧客IDを追加できる設計を仮定。実際には関数従属と業務ルールを確かめて分割する。"}}},{"id":"09-2","title":"SQL・結合・集計・NULL","explain":"\u003cp>SQL（Structured Query Language：構造化問合せ言語）はSELECTで行を取り出し、FROMで表、WHEREで行の絞り込み、GROUP BYでグループ化、HAVINGで集計後の条件、ORDER BYで並び替えを指定する。処理の概念的な順序はFROM/結合→WHERE→GROUP BY→HAVING→SELECT→ORDER BY。列別名をWHEREでそのまま使えるとは限らない。\u003c/p>\n\u003cp>INNER JOINは一致行のみ、LEFT OUTER JOINは左表の行をすべて残す。\u003ccode>WHERE 右表.列 = 'X'\u003c/code> を外部結合の後に置くと、右表が存在しないNULL行を取り除き、実質的に内部結合のような結果になることがある。COUNT(*)は行数、COUNT(列)はNULLでない値の数。\u003ccode>列 = NULL\u003c/code>ではなく\u003ccode>IS NULL\u003c/code>で判定する。\u003c/p>\n","worked":"\u003cp>受注がない顧客も含め顧客ごとの件数を数えるには \u003ccode>SELECT c.id, COUNT(o.id) FROM customer c LEFT JOIN orders o ON c.id=o.customer_id GROUP BY c.id;\u003c/code>。\u003ccode>COUNT(*)\u003c/code>だと受注ゼロの顧客も外部結合後に1行残るため1と数え得る。\u003ccode>COUNT(o.id)\u003c/code>が重要。\u003c/p>\n","prompt":"`WHERE COUNT(*) >= 2` と `HAVING COUNT(*) >= 2` のどちらが集計グループを絞るか。","answer":"\u003cp>HAVING。WHEREはグループ化前の行を選別する。\u003c/p>\n","beginner":{"scenario":"売上表から部門AだけならWHERE 部門='A'。部門別合計はGROUP BY 部門とSUM(金額)、合計100以上はHAVING SUM(金額)>=100。","trap":"NULLは0や空文字と異なる。IS NULLで判定する。","quizId":"U-09-2","lab":{"title":"SQLの結合・集計を結果から理解する","problem":"顧客表 C(id, name) は(1,佐藤),(2,田中),(3,鈴木)。注文表 O(cid, amount) は(1,100),(1,200),(2,50)。顧客別売上を注文ゼロも含めて出す。","steps":["C LEFT JOIN O ON C.id = O.cid により佐藤2行、田中1行、鈴木1行（注文列NULL）ができる。","GROUP BY C.id,C.name で顧客別グループを作る。","SUM(O.amount)は佐藤300、田中50、鈴木NULL。","COALESCE(SUM(O.amount),0)で鈴木を0にする。","SQL例：SELECT C.id,C.name,COALESCE(SUM(O.amount),0) FROM C LEFT JOIN O ON C.id=O.cid GROUP BY C.id,C.name。"],"answer":"佐藤300、田中50、鈴木0","check":"INNER JOINなら鈴木は消える。NULLと0は区別し、必要時に変換する。"}}},{"id":"09-3","title":"トランザクション・ACID・隔離レベル","explain":"\u003cp>トランザクションは複数操作を1つの論理的単位として扱う。ACIDはAtomicity（原子性：全部実施か全部取消し）、Consistency（一貫性：制約維持）、Isolation（隔離性：同時実行の影響を管理）、Durability（永続性：確定内容が保持される）。銀行口座からAを減額してBを増額する2操作は、片方だけ確定してはならない。\u003c/p>\n\u003cp>並行実行にはダーティリード（未確定変更を読む）、反復不能読取り（同じ行を再読したら変わる）、ファントムリード（条件に合う行集合が変化）などの異常がある。隔離レベルやMVCC（Multi-Version Concurrency Control：多版型同時実行制御）は製品ごとに具体的動作が異なる。ロックの取り方、デッドロック検出、タイムアウト、再試行も設計対象。\u003c/p>\n","worked":"\u003cp>T1が商品の在庫10を8に更新したが未コミット。T2が8を読み、T1がロールバックすると、T2は確定していない値を読んだ「ダーティリード」。Read Committedの標準的な目標はこれを防ぐこと。\u003c/p>\n","prompt":"ACIDのIsolationを満たせば同時実行で常に最高速になるか。","answer":"\u003cp>そうではない。強い隔離は競合や待ち時間を増やすことがある。\u003c/p>\n","beginner":{"scenario":"Aから100円引きBに入金する途中で止まると資金が消える。両方成功でコミット、失敗はロールバックする。","trap":"原子性だけでは競合を防げない。分離性・ロックなども必要。","quizId":"U-09-3","lab":{"title":"同時更新で何が壊れるか","problem":"在庫1個の商品をAとBが同時購入。両者が在庫1を読み、在庫0を書き、注文を登録する。問題と対策を考える。","steps":["AとBが別々に在庫1を読んでいるため両者とも購入可能と判断。","Aが在庫0を書き注文確定。Bも古い値を根拠に在庫0を書き注文確定。注文は2件だが商品は1個。","在庫をロックして在庫数を確認し、条件を満たす場合のみ減算・注文登録を同一取引にする。","あるいは在庫が1以上という条件付きの原子的更新を使い、成功件数を確認する。"],"answer":"在庫確認・引当て・注文を競合に耐える一連の処理にする","check":"COMMITするだけでは安全にならない。分離性と更新の条件が必要。"}}},{"id":"09-4","title":"索引・実行計画・性能設計","explain":"\u003cp>索引（インデックス）は検索条件に合う行へ効率よく到達する補助構造。B+木は範囲検索・整列に適し、ハッシュは等価検索に適することが多い。索引は読み取りを速くする一方、挿入・更新・削除時に維持コストと容量を要する。条件列の選択性、複合索引の列順、結合キー、統計情報を調べる。\u003c/p>\n\u003cp>\u003ccode>WHERE YEAR(order_date)=2025\u003c/code>のように索引列へ関数を適用すると通常の範囲索引が使いにくくなることがある。\u003ccode>order_date &gt;= '2025-01-01' AND order_date &lt; '2026-01-01'\u003c/code>の範囲条件に変えると使える可能性がある。ただし性能は製品や索引構造・統計情報に依存するので、EXPLAINで実行計画と実測を確認する。\u003c/p>\n","worked":"\u003cp>100万行中、customer_id=123が10行だけなら当該列の索引は有利なことが多い。性別のように値の種類が少なく大半が該当する列では、索引より全表走査が有利になる場合もある。\u003c/p>\n","prompt":"すべての列に索引を付けるのが最善か。","answer":"\u003cp>違う。更新負荷、容量、選択性、検索パターンを総合して決める。\u003c/p>\n","beginner":{"scenario":"100万件の商品からID=123を探すとき索引で絞れる。一方、半数以上を取得する場合は全表走査の方が速いこともある。","trap":"索引は検索を助けるが更新時にも維持コストがかかる。","quizId":"U-09-4"}},{"id":"09-5","title":"障害回復・レプリケーション・NoSQL","explain":"\u003cp>障害復旧ではチェックポイント、更新ログ、UNDO（未確定変更の取消し）、REDO（確定変更の再適用）の役割を区別する。ログ先行書込み（WAL：Write-Ahead Logging）はデータページの更新より先に回復に必要なログを永続化する設計原則。物理バックアップと論理バックアップ、フル/差分/増分の特徴を理解し、復元手順を試す。\u003c/p>\n\u003cp>レプリケーションは複数拠点への複製によって可用性や読み取り性能を高めるが、非同期方式では最新更新を失うリスクがある。NoSQL（Not Only SQL：非関係型を中心とするDB群）はキー値・文書・列指向・グラフ等のモデルがあり、要件に合うデータ構造を選ぶ。CAP定理はネットワーク分断時の一貫性と可用性の選択に関する制約であり、「3要素から常に2つだけ選ぶ」と単純化しない。\u003c/p>\n","worked":"\u003cp>コミット直後に主DBが故障し、非同期の複製先へまだ更新が伝搬していなければ、切替時に直近の更新が消える可能性がある。RPO=0を求めるなら書込み確定の条件まで設計し直す必要がある。\u003c/p>\n","prompt":"複製があるからバックアップは不要か。","answer":"\u003cp>不要にはならない。誤更新・論理削除も複製され得る。\u003c/p>\n","beginner":{"scenario":"昨日のバックアップを戻し、今日の確定済み更新ログを適用すれば障害直前へ近づける。未確定の変更は取り消す。","trap":"複製は誤削除も複製し得るのでバックアップと別。","quizId":"U-09-5"}},{"id":"09-X01","title":"関係代数とデータベースの方式","explain":"\u003cp>関係データベースでは選択は条件に合う行、射影は必要な列、結合は共通項目などで関係を組み合わせる演算である。和・差・積集合や直積も基本操作。SQL（構造化問い合わせ言語）は関係代数に基づく操作を記述する。ER図（実体関連図）は実体と関係を可視化する。\u003c/p>\u003cp>階層型は木、ネットワーク型は複雑な関連、関係型は表、オブジェクト型はオブジェクトでデータを表現する。NoSQLはキーバリュー、文書、列指向、グラフなどを含む。B木系の索引は範囲検索に適する一方、ハッシュ索引は等値検索に向く。\u003c/p>","worked":"\u003cp>社員表から営業部の社員名だけを求める場合、部門による選択の後に社員名への射影を行う。\u003c/p>","prompt":"関係表から指定列だけ取り出す演算は？","answer":"\u003cp>射影。\u003c/p>","beginner":{"scenario":"社員表から営業部の行を抽出して氏名列だけ取得する。前者が選択、後者が射影。","trap":"日常語の選択と関係代数の選択を混同しない。","quizId":"U-09-X01"}},{"id":"09-X02","title":"データウェアハウス・分散データベース","explain":"\u003cp>データウェアハウスは分析目的で履歴を統合する基盤。ETL（抽出・変換・ロード）で異なる元データを整える。OLTP（オンライン取引処理）は日常業務の更新、OLAP（オンライン分析処理）は多次元集計。データマートは特定部門向けの分析データ。スタースキーマは事実表と次元表を組み合わせる。\u003c/p>\u003cp>分散データベースは複数ノードにデータを分散し、シャーディングで異なる部分を分割、レプリケーションで複製する。2相コミットは参加者の準備確認後に確定を指示して分散取引の整合性を保つ。可用性・整合性・分断耐性の関係を示すCAP定理ではネットワーク分断中に強い整合性と可用性を同時保証できない。\u003c/p>","worked":"\u003cp>日々の売上登録はOLTP、月・地域・商品別に過去の売上を集計するのはOLAP。\u003c/p>","prompt":"複数サーバに顧客IDの範囲ごとにデータを分割する方式は？","answer":"\u003cp>シャーディング。\u003c/p>","beginner":{"scenario":"販売明細を店舗から集め、商品コードと日付形式を統一して分析基盤へ入れる。地域×月×商品別に売上集計できる。","trap":"OLTPは取引、OLAPは分析。複製と分割も別。","quizId":"U-09-X02"}}],"beginnerIntro":"表・行・列・キーの理解から、SQL、同時更新、障害復旧へ進む。"},{"id":10,"title":"ネットワーク","group":"テクノロジ","priority":"B選択候補","summary":"TCP/IP、IPアドレス、ルーティング、DNS、TLSと障害切り分け。","lessons":[{"title":"階層とプロトコル","body":"IP（Internet Protocol）はネットワーク層で宛先までパケットを運ぶ。TCP（Transmission Control Protocol）は順序制御・再送等で信頼性を実現し、UDP（User Datagram Protocol）は簡潔で即時性を優先する用途に使う。","check":"TCPはコネクション型、UDPはコネクションレス。"},{"title":"サブネット","body":"IPv4の/24は先頭24ビットがネットワーク部で末尾8ビットがホスト部。一般的な/24の利用可能ホスト数は2^8−2=254。CIDR（Classless Inter-Domain Routing）は可変長のプレフィックスを指定する。","check":"/31や/32は用途が特殊なので一般式を無条件に当てない。"},{"title":"名前解決","body":"DNS（Domain Name System：ドメイン名システム）はドメイン名とIPアドレス等を対応。AレコードはIPv4、AAAAはIPv6、MXはメール配送先、CNAMEは別名。","check":"DNSの情報はTTL（生存時間）によりキャッシュされる。"},{"title":"Webと暗号化","body":"HTTPはWeb通信、HTTPSはHTTPをTLS（Transport Layer Security：通信の暗号化・認証）で保護したもの。TLSの証明書検証で通信相手の正当性を確認する。","check":"HTTPSは相手のWebサイトの内容まで安全保証するものではない。"},{"title":"障害切り分け","body":"IP疎通→名前解決→TCP接続→アプリ応答の順に確認。pingはICMP、tracerouteは経路を調べる手段だがICMPを遮断している場合は不通断定できない。","check":"「pingが失敗した＝必ず通信不可」ではない。"}],"terms":[{"term":"TCP","definition":"順序制御・再送制御などで信頼性を確保する転送層プロトコル"},{"term":"UDP","definition":"低い制御負荷でデータグラムを送る転送層プロトコル"},{"term":"IPアドレス","definition":"ネットワーク上の通信先を論理的に識別する番号"},{"term":"サブネットマスク","definition":"IPアドレスのネットワーク部を示すビットマスク"},{"term":"CIDR","definition":"可変長プレフィックスでIPアドレス範囲を表現する方式"},{"term":"DNS","definition":"名前とIPアドレスなどを対応付ける分散システム"},{"term":"NAT","definition":"ネットワークアドレスを変換する仕組み"},{"term":"DHCP","definition":"端末にIP設定を自動配布するプロトコル"},{"term":"TLS","definition":"通信相手の認証・暗号化・完全性を提供する仕組み"},{"term":"HTTP","definition":"Webでリクエストとレスポンスを交換するアプリ層プロトコル"},{"term":"VPN","definition":"共有網上で安全な仮想通信路を作る技術"},{"term":"ルーティング","definition":"宛先ネットワークに応じてパケットの転送先を選ぶこと"}],"questions":[{"id":"Q10-01","chapter":10,"kind":"applied","q":"192.168.10.0/26の通常のホスト用アドレス数は。","options":["30","62","64","126"],"correct":1,"explain":"ホスト部は6ビットで2^6−2=62。"},{"id":"Q10-02","chapter":10,"kind":"applied","q":"名前からIPv6アドレスを得たい。DNSのレコード種別は。","options":["A","MX","AAAA","PTR"],"correct":2,"explain":"AAAAはIPv6を示す。"},{"id":"Q10-03","chapter":10,"kind":"applied","q":"TCPとUDPの違いとして正しいのは。","options":["UDPは必ず順序保証する","TCPは再送制御を持つ","TCPは接続確立しない","UDPはIPを使わない"],"correct":1,"explain":"TCPは再送・順序制御などを提供する。"},{"id":"D10-01","chapter":10,"kind":"applied","q":"192.168.1.96/27のサブネットにおける通常利用可能なIPv4ホスト範囲はどれか。","options":["192.168.1.96～127","192.168.1.97～126","192.168.1.97～128","192.168.1.64～95"],"correct":1,"explain":"/27は32アドレス。96はネットワーク、127はブロードキャスト、利用可能は97～126。"},{"id":"D10-02","chapter":10,"kind":"applied","q":"経路表に10.0.0.0/8と10.1.0.0/16があり、宛先10.1.2.3に送る際の経路選択はどれか。","options":["/8の方を優先","両方へ必ず複製","/16を優先","常にデフォルト経路"],"correct":2,"explain":"最長プレフィックス一致で、より具体的な/16の経路が選ばれる。"},{"id":"D10-03","chapter":10,"kind":"applied","q":"実効通信速度80Mbpsで100MBのファイルを送る理想的な転送時間はどれか。","options":["1秒","8秒","10秒","80秒"],"correct":2,"explain":"100MB×8=800Mbit、800/80=10秒。通信オーバーヘッドは無視。"},{"id":"Q-10-X01","chapter":10,"kind":"applied","q":"無線LANで主に使われる媒体アクセス制御は？","options":["CSMA/CD","CSMA/CA","SMTP","ARP"],"correct":1,"explain":"CSMA/CA。送信前に衝突を回避する。"},{"id":"Q-10-X02","chapter":10,"kind":"applied","q":"メール送信に使われる代表的なプロトコルは？","options":["IMAP","SNMP","SMTP","NTP"],"correct":2,"explain":"SMTP（簡易メール転送プロトコル）。"},{"id":"U-10-1","chapter":10,"kind":"applied","q":"宛先IPに基づきネットワーク間で転送する機器は？","options":["L2スイッチ","リピータ","USBハブ","ルータ"],"correct":3,"explain":"ルータは経路表により配送。L2スイッチは主にMACアドレスで転送。"},{"id":"U-10-2","chapter":10,"kind":"applied","q":"通常のIPv4 /28で利用可能なホストアドレス数は？","options":["14","16","28","30"],"correct":0,"explain":"2^(32−28)−2＝14。"},{"id":"U-10-3","chapter":10,"kind":"applied","q":"端末へIPアドレスやゲートウェイを自動配布するプロトコルは？","options":["DNS","DHCP","SMTP","HTTP"],"correct":1,"explain":"DHCPは設定配布、DNSは名前解決。"},{"id":"U-10-4","chapter":10,"kind":"applied","q":"一つの物理スイッチで論理的なLANを分ける技術は？","options":["VPN","DNS","VLAN","RAID"],"correct":2,"explain":"VLANは論理LANの分割。VPNは仮想的な私設通信路。"},{"id":"U-10-5","chapter":10,"kind":"applied","q":"外部IPに接続できるがドメイン名で接続できないとき最初に疑う機能は？","options":["DHCPの全停止","RAID","画像圧縮","DNS"],"correct":3,"explain":"IP到達性が確認できているため名前解決を優先する。"},{"id":"U-10-X01","chapter":10,"kind":"applied","q":"ネットワークの混雑に応じ送信量を調整する制御は？","options":["輻輳制御","フロー制御","誤り訂正","名前解決"],"correct":0,"explain":"輻輳制御は網の過負荷を抑える。"},{"id":"U-10-X02","chapter":10,"kind":"applied","q":"ネットワーク機器の状態を監視管理する代表的プロトコルは？","options":["SMTP","SNMP","POP3","NTP"],"correct":1,"explain":"SNMPは簡易ネットワーク管理プロトコル。SMTPはメール送信、NTPは時刻同期。"}],"deepIntro":"科目Bでは「どの層で、どの相手へ、何が通らないか」を表と経路図で整理する。","deep":[{"id":"10-1","title":"TCP/IPの階層とカプセル化","explain":"\u003cp>通信の機能を層に分けると障害箇所を推定しやすい。リンク層は同一リンク内のフレーム転送、IP（Internet Protocol：インターネットプロトコル）はネットワーク間のパケット配送、TCP（Transmission Control Protocol：伝送制御プロトコル）は順序・再送などによる信頼性の高いバイトストリーム、UDP（User Datagram Protocol：ユーザーデータグラムプロトコル）は軽量なデータグラム通信、HTTP（Hypertext Transfer Protocol：Web通信プロトコル）はアプリ層の要求・応答を担う。\u003c/p>\n\u003cp>送信時は上位データにヘッダを追加するカプセル化、受信時はヘッダを解釈して上位へ渡す。TCPはコネクション確立に通常3ウェイハンドシェイクを使うが、TLSやHTTPはさらに別の処理がある。IPアドレスは論理的な転送先、MACアドレスはリンク層での宛先識別。\u003c/p>\n","worked":"\u003cp>Webにアクセスできない場合、最初に物理リンク・IP設定・DNS・TCP接続・TLS/HTTP応答を順に分ける。\u003ccode>ping\u003c/code>が通らないことだけでHTTPサーバ故障とは断定できない。ICMPを遮断している場合もある。\u003c/p>\n","prompt":"HTTP/3はTCPを使うか。","answer":"\u003cp>一般にQUICを使い、その下位にはUDPが使われる。HTTP/1.1・HTTP/2の典型例との違いを押さえる。\u003c/p>\n","beginner":{"scenario":"Web要求を送るときTCPが通信の順序などを管理、IPが宛先への配送、リンク層が同一リンク上の転送を担当する。","trap":"IPアドレスはネットワークの宛先、ポート番号はサービス識別。","quizId":"U-10-1"}},{"id":"10-2","title":"IPアドレス・サブネット・経路選択","explain":"\u003cp>IPv4アドレスは32ビット。CIDR表記192.168.10.0/26ならネットワーク部26ビット、ホスト部6ビットでアドレス数64。通常のホスト利用ではネットワークアドレスとブロードキャストアドレスを除き最大62個（特殊用途を除く）。サブネットマスク255.255.255.192は/26を表す。同一ネットワークかどうかはアドレスとマスクのANDで判定する。\u003c/p>\n\u003cp>ルータは宛先IPと経路表を照合し、最長一致（ロンゲストプレフィックスマッチ）を優先する。LAN（Local Area Network：構内ネットワーク）内の隣接相手へのMAC解決にはIPv4ならARP、IPv6なら近隣探索（NDP）が使われる。NAT（Network Address Translation：アドレス変換）はアドレス、NAPTはポート番号を含めて変換し、複数端末の外部通信を可能にすることがある。\u003c/p>\n","worked":"\u003cp>/27はホスト部5ビットで32アドレス。192.168.1.96/27の範囲は192.168.1.96～127、通常使用可能なのは97～126。192.168.1.130は別サブネット。\u003c/p>\n","prompt":"10.0.0.0/8と10.1.0.0/16の両方が経路表にあるとき、宛先10.1.2.3はどちらか。","answer":"\u003cp>より具体的な/16に一致する経路を使う。\u003c/p>\n","beginner":{"scenario":"192.168.1.130/26はホスト部6ビット、64個刻み。130は128〜191の区間なのでネットワーク.128、通常ホスト.129〜.190。","trap":"/26はネットワーク部が26ビット。","quizId":"U-10-2","lab":{"title":"サブネットを2進数から求める","problem":"192.168.1.77/27のネットワークアドレス、ブロードキャスト、通常のホスト範囲を求める。","steps":["32−27=5ビットがホスト部。ブロック幅は2⁵=32。","サブネットマスクは255.255.255.224。最後の8ビットは11100000。","77は01001101。マスクとANDすると01000000=64。","ホスト部を全部1にすると01011111=95。","ネットワークは.64、ブロードキャストは.95、ホストは.65〜.94。"],"answer":"192.168.1.64、192.168.1.95、ホスト30個","check":"末尾の32刻み（0、32、64、96…）を使っても求められる。"}}},{"id":"10-3","title":"DNS・DHCP・HTTP・TLS","explain":"\u003cp>DNS（Domain Name System：ドメイン名の名前解決）はドメイン名からIPアドレス等のレコードを取得する仕組み。AはIPv4、AAAAはIPv6、MXはメール交換先、CNAMEは別名、TXTは文字列等を登録する。TTL（Time To Live：キャッシュ有効時間）を短くすると変更反映を早めやすいが、照会増加の可能性がある。DHCP（Dynamic Host Configuration Protocol：動的ホスト設定）はIP・DNS・デフォルトゲートウェイ等を自動配布する。\u003c/p>\n\u003cp>HTTPは要求メソッドGET/POST/PUT/DELETEと応答状態を用いる。認証・権限管理はHTTPメソッドだけでは実現されない。HTTPSはHTTPをTLS（Transport Layer Security：通信路の暗号化・認証）で保護する。証明書チェーンとホスト名の検証により通信先の正当性を確認し、鍵交換でセッション鍵を確立する。\u003c/p>\n","worked":"\u003cp>DNSで正しいIPを取得できるがブラウザが接続できない場合、IP到達性、TCP/443、サーバのTLS証明書、HTTPの応答を確認する。DNSを修正してもアプリ側の問題は直らない。\u003c/p>\n","prompt":"HTTPSはサーバの業務上の信用・コンテンツの正しさを保証するか。","answer":"\u003cp>保証しない。通信相手と通信路の検証と、サービスの安全性は別。\u003c/p>\n","beginner":{"scenario":"端末がDHCPで設定を受け、DNSで名前からIPを調べ、一般的なHTTPSではTLSで通信路を保護しHTTPで要求する。","trap":"名前解決成功はサーバ正常を意味しない。","quizId":"U-10-3","lab":{"title":"Web接続障害の切分け","problem":"社内端末AはIP設定を取得済み。外部のWebサーバIPへ接続できるが、ドメイン名で名前解決できない。別端末でも同じ。","steps":["IPアドレスとデフォルトゲートウェイが正常か確認。外部IPへ到達できるので経路全断は考えにくい。","DNS設定を確認し、指定DNSサーバへの接続と名前解決結果を調べる。","複数端末で同じなら共通DNSサーバ・上流DNS・設定変更を調べる。","名前解決成功後もHTTPSに失敗するなら証明書・TLS・Webサーバなどを別途調べる。"],"answer":"DNS関連の設定と稼働状況を優先して調査","check":"名前解決と通信経路とアプリの応答を分ける。観測だけで原因を断定しない。"}}},{"id":"10-4","title":"スイッチ・VLAN・無線・負荷分散","explain":"\u003cp>L2スイッチはMACアドレス表を学習してフレームを転送する。VLAN（Virtual LAN：仮想LAN）は物理的な配線によらず論理的にブロードキャストドメインを分割する。異なるVLAN間の通信には通常L3ルーティングが必要。STP（Spanning Tree Protocol：スパニングツリープロトコル）はL2のループを防ぐため一部リンクを論理的に遮断する。\u003c/p>\n\u003cp>Wi-Fiでは規格、周波数帯、チャネル干渉、アクセスポイント配置、暗号方式等が性能に影響する。ロードバランサは複数サーバへ要求を振り分ける。L4負荷分散は主にアドレス・ポート、L7負荷分散はHTTPパスやヘッダ等を見て振り分けられる。\u003c/p>\n","worked":"\u003cp>社内端末がVLAN10、DBがVLAN20に分離され、相互ルーティング設定がない場合はL2スイッチのポートをつなぐだけでは通常通信できない。ルータ/ L3スイッチの経路・ACLを調べる。\u003c/p>\n","prompt":"VLANを分けるだけで完全に機密保護できるか。","answer":"\u003cp>できない。ルーティング制御、ACL、認証、暗号化などの設計が必要。\u003c/p>\n","beginner":{"scenario":"営業と経理を別VLANにすると同じ物理スイッチでも論理的に別LANとなる。相互通信はルーティングと必要なアクセス制御を使う。","trap":"VLAN自体が暗号化や完全な安全性を保証するわけではない。","quizId":"U-10-4"}},{"id":"10-5","title":"通信性能・障害切分け・VPN","explain":"\u003cp>通信量と転送速度は単位に注意。ビット/秒（bps）とバイト/秒（B/s）は8倍違う。実効スループットは再送・ヘッダ・制御・混雑の影響を受け、回線の公称帯域より低くなる。RTT（Round Trip Time：往復遅延）は要求してから応答が返るまでの通信遅延の尺度。ウィンドウサイズや帯域遅延積もTCPの性能に影響する。\u003c/p>\n\u003cp>VPN（Virtual Private Network：仮想専用網）は公衆網等の上に論理的な保護通信路を構築する。IPsecはIP層、TLS-VPNはTLSなどを利用する。VPN接続が成功しても、接続後の権限・経路・DNSが適切とは限らない。\u003c/p>\n","worked":"\u003cp>100MBのファイルを実効80Mbpsで送る理想時間は100×8/80＝10秒。実際にはTCP等のオーバーヘッドや往復遅延で延びる。MbpsをMB/sに読み替えない。\u003c/p>\n","prompt":"`traceroute`で応答が途切れた地点は必ず障害箇所か。","answer":"\u003cp>断定できない。途中ルータが応答パケットを制限している可能性がある。\u003c/p>\n","beginner":{"scenario":"同じLANにはつながるが外部IPに接続できなければゲートウェイや経路を確認。外部IPは通るが名前が失敗する場合はDNSを調べる。","trap":"pingに応答しないだけでは故障と断定できない。","quizId":"U-10-5"}},{"id":"10-X01","title":"ネットワーク方式・通信制御","explain":"\u003cp>LAN（構内ネットワーク）は限定範囲、WAN（広域ネットワーク）は離れた拠点を接続する。イーサネットの従来型共有媒体はCSMA/CD（衝突検出付き搬送波感知多重アクセス）、無線LANはCSMA/CA（衝突回避）を用いる。全二重スイッチ接続では通常CSMA/CDを必要としない。\u003c/p>\u003cp>回線交換は専用回線を確保し、パケット交換は分割データを共有回線で転送する。MPLS（多重プロトコルラベルスイッチング）はラベルによる転送。QoS（通信品質制御）は遅延・損失などの要件に応じ優先制御や帯域制御を行う。フロー制御は受信側の処理能力、輻輳制御は網の混雑に合わせ送信を調整する。\u003c/p>","worked":"\u003cp>音声会議ではわずかな遅延が問題となりやすく、ファイル転送より優先する設計が考えられる。\u003c/p>","prompt":"無線LANで主に使われる媒体アクセス制御は？","answer":"\u003cp>CSMA/CA。送信前に衝突を回避する。\u003c/p>","beginner":{"scenario":"受信側のバッファが埋まるなら受信能力に合わせ送信を調整。網の途中が混雑するなら網の負荷に応じ送信量を抑える。","trap":"フロー制御は受信側、輻輳制御はネットワークの混雑。","quizId":"U-10-X01"}},{"id":"10-X02","title":"通信プロトコル・管理・ネットワーク応用","explain":"\u003cp>IPv6は128bitアドレス、IPv4は32bit。ARPはIPv4アドレスに対応するリンク層アドレスを調べる。IPv6では近隣探索が同様の役割を担う。ICMPはネットワーク制御・エラー通知、DNSは名前解決、DHCPはネットワーク設定の配布、NATはアドレス変換。\u003c/p>\u003cp>SMTPはメール送信、POP3はメール受信・取得、IMAPはサーバ上のメール管理、SNMPはネットワーク機器の監視管理、NTPは時刻同期、SSHは暗号化された遠隔操作。プロキシは通信を中継し、キャッシュやアクセス制御を行える。監視ではトラフィック、応答時間、パケット損失、機器ログを照合する。\u003c/p>","worked":"\u003cp>IPアドレスに直接接続できるのにドメイン名では失敗する場合はDNSを調査する。\u003c/p>","prompt":"メール送信に使われる代表的なプロトコルは？","answer":"\u003cp>SMTP（簡易メール転送プロトコル）。\u003c/p>","beginner":{"scenario":"メールサーバ間の送信はSMTP、サーバ上のメール管理はIMAP、機器監視はSNMP、時刻合わせはNTP。","trap":"ポート番号よりまず通信の目的・方向・暗号化の有無を区別する。","quizId":"U-10-X02"}}],"beginnerIntro":"端末からサーバまでの配送を階層別に理解する。アドレス、名前、ポート、機器の役割を分ける。"},{"id":11,"title":"情報セキュリティ","group":"テクノロジ","priority":"B必須","summary":"暗号・認証・脆弱性・ネットワーク防御・インシデント対応。必須の最重要領域。","lessons":[{"title":"CIAと脅威分析","body":"情報セキュリティの基本は機密性（Confidentiality）・完全性（Integrity）・可用性（Availability）。リスクは脅威・脆弱性・資産への影響を踏まえ評価。","check":"可用性はシステム稼働、完全性は無断改ざん防止。"},{"title":"共通鍵・公開鍵・ハッシュ","body":"共通鍵暗号は同じ秘密鍵で暗号化と復号。公開鍵暗号は公開鍵と秘密鍵のペア。ハッシュは固定長の要約であり復号不可。ディジタル署名では署名者の秘密鍵で署名し公開鍵で検証する。","check":"署名と暗号化で使用する鍵の向きを混同しない。"},{"title":"証明書と認証","body":"認証局CA（Certificate Authority）が発行する証明書を信頼の鎖で検証。多要素認証は知識・所持・生体など異なる要素を組み合わせる。パスワードと秘密の質問は同じ知識要素。","check":"二段階認証が必ず多要素とは限らない。"},{"title":"主要な脆弱性","body":"SQLインジェクションは入力がSQL構造を変える攻撃。対策はプレースホルダ等のパラメータ化クエリ。XSS（Cross-Site Scripting）はブラウザ側で不正スクリプトを実行し、出力時の適切なエスケープ等で防ぐ。CSRFは利用者の認証状態を悪用して意図しない要求を送らせる。","check":"入力検証と出力エスケープだけで全脅威を解決したと考えない。"},{"title":"防御の層と監視","body":"WAF（Web Application Firewall）はWebアプリへのリクエストを検査。IDS/IPSは侵入検知・防止。EDR（Endpoint Detection and Response）は端末上の挙動監視と対応。最小権限や多層防御を徹底。","check":"FW・WAF・EDRで監視する位置が異なる。"},{"title":"インシデント対応","body":"初動は影響範囲・証拠保全・封じ込め・根絶・復旧・再発防止を適切に計画。証拠ログの削除や無断の再起動は分析を妨げる場合がある。","check":"原因究明前に証拠が失われないよう保全する。"}],"terms":[{"term":"機密性","definition":"許可された人だけが情報にアクセスできる性質"},{"term":"完全性","definition":"情報が不正に改ざんされていない性質"},{"term":"可用性","definition":"必要なときに情報やサービスを利用できる性質"},{"term":"共通鍵暗号","definition":"暗号化と復号で同じ秘密鍵を用いる方式"},{"term":"公開鍵暗号","definition":"公開鍵と秘密鍵の組を利用する暗号方式"},{"term":"ハッシュ関数","definition":"入力から一方向の固定長要約値を作る関数"},{"term":"ディジタル署名","definition":"秘密鍵による署名と公開鍵による検証で真正性等を確認する仕組み"},{"term":"PKI","definition":"公開鍵と電子証明書の信頼関係を管理する基盤"},{"term":"多要素認証","definition":"異なる認証要素を二種類以上組み合わせる認証"},{"term":"SQLインジェクション","definition":"入力を通じて意図しないSQL文を実行させる攻撃"},{"term":"XSS","definition":"Webページに不正なスクリプトを混入し閲覧者のブラウザで実行させる攻撃"},{"term":"CSRF","definition":"認証中の利用者に意図しないWeb要求を送信させる攻撃"},{"term":"WAF","definition":"WebアプリへのHTTPリクエスト等を検査・遮断する装置や機能"},{"term":"EDR","definition":"端末上の不審な活動を検知して分析や対応を支援する技術"},{"term":"ゼロトラスト","definition":"接続元だけを信用せず要求ごとに検証・認可する設計思想"},{"term":"サプライチェーン攻撃","definition":"取引先や依存ソフトなどを踏み台に本来の標的を攻撃する手法"}],"questions":[{"id":"Q11-01","chapter":11,"kind":"applied","q":"ディジタル署名を検証する際に原則使用する鍵は。","options":["署名者の秘密鍵","署名者の公開鍵","受信者の秘密鍵","共通鍵"],"correct":1,"explain":"署名者の秘密鍵で署名し、対応する公開鍵で検証する。"},{"id":"Q11-02","chapter":11,"kind":"applied","q":"SQLインジェクションの根本的な対策として適切なのは。","options":["入力をすべて大文字化する","パラメータ化クエリを用いる","通信をHTTPに戻す","エラーログを無効化する"],"correct":1,"explain":"値とSQL文の構造を分離する。"},{"id":"Q11-03","chapter":11,"kind":"applied","q":"パスワードと秘密の質問を併用した認証は、一般に何要素か。","options":["1要素","2要素","3要素","4要素"],"correct":0,"explain":"いずれも知識要素であり、異なる要素の組み合わせではない。"},{"id":"D11-01","chapter":11,"kind":"applied","q":"AがBへ機密情報を公開鍵暗号で送りたい場合、暗号化に使う鍵はどれか。","options":["Aの公開鍵","Aの秘密鍵","Bの公開鍵","Bの秘密鍵"],"correct":2,"explain":"受信者Bの公開鍵で暗号化し、Bの秘密鍵で復号する。署名と混同しない。"},{"id":"D11-02","chapter":11,"kind":"applied","q":"WebアプリでSQLインジェクションを防ぐ根本対策として最も適切なものはどれか。","options":["入力をSQL文字列に連結する","全ユーザーに管理権限を与える","パラメータ化クエリを使用する","WAFを置くだけで入力処理を放置する"],"correct":2,"explain":"SQLの構造と値を分け、利用者入力を構文として解釈させない。WAFは多層防御の一部。"},{"id":"D11-03","chapter":11,"kind":"applied","q":"依存ライブラリ更新後に不審な外部通信が発生した初動として適切なものはどれか。","options":["端末を即座に初期化して証拠を消す","影響を隔離しログ・更新履歴を保全する","調査前に漏えいはなかったと発表する","不正通信を容認して更新を続ける"],"correct":1,"explain":"封じ込めと証拠保全を両立。原因・影響未確定なら断定を避ける。"},{"id":"Q-11-X01","chapter":11,"kind":"applied","q":"CVSSの主目的は？","options":["利用者本人確認","暗号鍵配布","脆弱性の深刻度評価","業務復旧時間の計測"],"correct":2,"explain":"脆弱性の深刻度を共通尺度で評価すること。"},{"id":"Q-11-X02","chapter":11,"kind":"applied","q":"WebアプリのHTTP要求を検査して攻撃を抑える装置は？","options":["UPS","WAF","DNS","DHCP"],"correct":1,"explain":"WAF（Webアプリケーションファイアウォール）。"},{"id":"U-11-1","chapter":11,"kind":"applied","q":"正規利用者が必要時に利用できる性質は？","options":["機密性","完全性","可用性","真正性"],"correct":2,"explain":"可用性は必要時に使えること。機密性は漏えい防止、完全性は正確さ・完全さ。"},{"id":"U-11-2","chapter":11,"kind":"applied","q":"デジタル署名を検証する鍵は？","options":["署名者の秘密鍵","受信者の公開鍵","受信者の秘密鍵","署名者の公開鍵"],"correct":3,"explain":"署名者の秘密鍵で署名し対応する公開鍵で検証。"},{"id":"U-11-3","chapter":11,"kind":"applied","q":"パスワードと所持する認証器を組み合わせる方式は？","options":["多要素認証","単一要素認証","認可のみ","暗号化のみ"],"correct":0,"explain":"知識要素と所持要素を組み合わせている。"},{"id":"U-11-4","chapter":11,"kind":"applied","q":"認証済み利用者に意図しない要求を送らせる攻撃への代表的対策は？","options":["SQLプレースホルダのみ","CSRFトークン","パスワード長変更のみ","画像圧縮"],"correct":1,"explain":"CSRFトークンを検証して意図しない要求を防ぐ。"},{"id":"U-11-5","chapter":11,"kind":"applied","q":"複数機器のログを集中・相関分析する仕組みは？","options":["DHCP","RAID","SIEM","コンパイラ"],"correct":2,"explain":"SIEMはセキュリティ情報・イベント管理。ログを統合分析する。"},{"id":"U-11-6","chapter":11,"kind":"applied","q":"退職者IDが有効なまま残る問題への直接的な対策は？","options":["画面解像度向上","DB索引追加","年1回パスワード変更のみ","退職情報と連動してIDを無効化"],"correct":3,"explain":"原因である退職者の有効なIDを直接無効化する。"},{"id":"U-11-X01","chapter":11,"kind":"applied","q":"対策後も残るリスクは？","options":["残留リスク","脅威","脆弱性","誤検知率"],"correct":0,"explain":"残留リスクを評価し追加対策または受容を判断する。"},{"id":"U-11-X02","chapter":11,"kind":"applied","q":"不審な通信を検知するだけでなく遮断する仕組みは？","options":["IDS","IPS","DNS","NTP"],"correct":1,"explain":"IPSは侵入防止、IDSは主に侵入検知。"}],"deepIntro":"セキュリティは暗号用語の暗記ではなく「脅威→脆弱性→侵害経路→影響→対策→監視・対応」の因果関係で理解する。科目B必須。","deep":[{"id":"11-1","title":"情報資産・リスク・管理策","explain":"\u003cp>情報セキュリティの3要素CIAはConfidentiality（機密性）、Integrity（完全性）、Availability（可用性）。機密性は不正閲覧防止、完全性は意図しない改変防止、可用性は必要なとき利用できること。脅威は攻撃・事故などの原因、脆弱性は悪用される弱点、リスクは結果として生じ得る損害の可能性を指す。資産価値・発生可能性・影響度に応じて優先度を決める。\u003c/p>\n\u003cp>リスク対応は回避（活動中止）、低減（管理策で可能性や影響を下げる）、移転/共有（保険・委託等）、受容（残余リスクを承認）。対策を導入してもリスクはゼロにならない。ISMS（Information Security Management System：情報セキュリティマネジメントシステム）は方針・リスク評価・管理策・監査・改善の継続活動。\u003c/p>\n","worked":"\u003cp>個人情報の入ったノートPC紛失リスクに対し、ディスク暗号化と持出し制限は低減、そもそも持ち出さない運用は回避になり得る。暗号化は紛失そのものを防がず、漏えいの影響を抑える。\u003c/p>\n","prompt":"パッチを当てたら「リスク＝ゼロ」か。","answer":"\u003cp>違う。設定不備、未知の脆弱性、人的誤操作などの残余リスクがある。\u003c/p>\n","beginner":{"scenario":"銀行で口座情報漏えいは機密性、残高改ざんは完全性、障害で送金不能は可用性の問題。守る性質に応じ対策を選ぶ。","trap":"脅威は被害の原因、脆弱性は弱点、リスクは影響や可能性を含む。","quizId":"U-11-1"}},{"id":"11-2","title":"暗号・ハッシュ・署名・公開鍵基盤","explain":"\u003cp>共通鍵暗号は同じ秘密鍵で暗号化と復号を行い、大量データの高速処理に適する。公開鍵暗号は公開鍵・秘密鍵の対を使い、鍵配送や電子署名の仕組みに用いる。実用的なTLSは公開鍵技術で認証や鍵共有を行い、データ通信は共通鍵で暗号化するなどの組合せを使う。鍵管理が不適切なら暗号方式だけ強くしても安全にならない。\u003c/p>\n\u003cp>ハッシュ関数は任意長データから固定長のダイジェストを求める一方向の関数。暗号学的ハッシュに求められる耐衝突性は「異なる入力で同じ値を作りにくい」性質。パスワード保管には単純ハッシュではなく、ソルトと計算コストを設けたArgon2等のパスワードハッシュ方式を使う。電子署名は秘密鍵で署名し、公開鍵で検証することで作成者認証や改ざん検出を助ける。公開鍵証明書はCA（Certification Authority：認証局）が公開鍵と主体情報の結び付きを保証する仕組み。\u003c/p>\n","worked":"\u003cp>AからBへ機密情報を送るとき、受信者Bの公開鍵で暗号化すれば対応するBの秘密鍵で復号できる。Aの「署名」はAの秘密鍵で行い、Aの公開鍵で検証する。暗号化と署名で鍵の向きが異なる。\u003c/p>\n","prompt":"SHA-256をパスワードに1回かけて保存すれば安全か。","answer":"\u003cp>不十分。パスワード推測への耐性を高める専用のパスワードハッシュ方式やソルトが必要。\u003c/p>\n","beginner":{"scenario":"Bへの秘密文書はBの公開鍵で暗号化しBの秘密鍵で復号する方式を使える。Aの署名はAの秘密鍵で作りAの公開鍵で検証する。","trap":"暗号化と署名では目的と鍵の使い方が違う。","quizId":"U-11-2","lab":{"title":"暗号化と署名の鍵を混同しない","problem":"AがBに秘密文書を送り、Bが送信者Aと改ざんの有無を確認したい。どの鍵を使うか。","steps":["Aは文書に対し自分の秘密鍵でデジタル署名を生成する。","文書と署名を秘密にするため、Bの公開鍵を使う暗号化方式などで保護する。実際には共通鍵と組み合わせる方式が多い。","Bは自分の秘密鍵で復号に必要な情報を取得し文書を復号する。","BはAの公開鍵で署名を検証する。証明書などで公開鍵がAのものか確認する。"],"answer":"暗号化は受信者Bの公開鍵系、署名は送信者Aの秘密鍵","check":"署名と暗号化の目的・鍵を別々に追う。具体的な鍵利用は方式によって異なる。"}}},{"id":"11-3","title":"認証・認可・アクセス制御","explain":"\u003cp>認証（Authentication）は「誰か」の確認、認可（Authorization）は「何をしてよいか」の判断。多要素認証MFA（Multi-Factor Authentication）は知識要素（パスワード）・所持要素（端末・鍵）・生体要素（指紋等）の異なる要素を組み合わせる。同じ種類のパスワードを2つ要求しても多要素にはならない。SSO（Single Sign-On：一度の認証で複数システムを利用）は利便性を高めるが、認証基盤の保護が重要。\u003c/p>\n\u003cp>アクセス制御はDAC（任意アクセス制御）、MAC（強制アクセス制御）、RBAC（Role-Based Access Control：役割ベース制御）など。最小権限は業務に必要な権限のみ付与する原則。ゼロトラストはネットワーク内だから信頼するのではなく、継続的に認証・端末状態・アクセス状況を評価する設計思想。認証済みでもすべての資源への権限を与えない。\u003c/p>\n","worked":"\u003cp>経理担当に請求書の閲覧は許可し、承認は責任者に限定する。ユーザーごとに例外を大量設定するより、RBACで役割に権限を紐付けると管理しやすい。\u003c/p>\n","prompt":"パスワード＋秘密の質問は必ずMFAか。","answer":"\u003cp>どちらも知識要素なので、異なる要素を組み合わせたとはいえない。\u003c/p>\n","beginner":{"scenario":"社員IDで本人確認し、給与担当者だけ給与データを更新できるようにする。異動時は旧権限を外し新業務の権限だけを与える。","trap":"パスワードと秘密の質問は両方知識要素。異なる種類の要素を使う。","quizId":"U-11-3"}},{"id":"11-4","title":"代表的な攻撃・Web脆弱性","explain":"\u003cp>SQLインジェクションは利用者入力をSQL文の構文として解釈させ、不正な問合せを実行させる攻撃。対策の基本はプレースホルダを用いたパラメータ化クエリ。XSS（Cross-Site Scripting：クロスサイトスクリプティング）は利用者ブラウザで意図しないスクリプトを実行させる攻撃で、文脈に応じた出力エスケープや安全なDOM操作を用いる。CSRF（Cross-Site Request Forgery：クロスサイトリクエストフォージェリ）はログイン状態を悪用して意図しない操作を送信させるため、トークンやSameSite Cookieなどで対処する。\u003c/p>\n\u003cp>標的型メール・フィッシングは認証情報を盗み、ランサムウェアは暗号化・窃取・恐喝を行うことがある。サプライチェーン攻撃は正規の依存先・更新経路を悪用する。DoS/DDoSは資源を過負荷にして可用性を損なう。WAF（Web Application Firewall：Webアプリ防御）やIDS/IPS（侵入検知/侵入防止）は補助策であり、根本的な脆弱性修正を代替しない。\u003c/p>\n","worked":"\u003cp>Webアプリが\u003ccode>SELECT * FROM user WHERE name='入力値'\u003c/code>の文字連結でクエリを生成すると、特殊文字を含む入力で構文が変わり得る。パラメータ化すれば入力は値として処理され、SQL命令として解釈されにくくなる。\u003c/p>\n","prompt":"全てのXSSを防ぐのに入力の`\u003c`だけ削除すれば十分か。","answer":"\u003cp>不十分。HTML・属性・URL・JavaScriptなど出力文脈に応じた適切な処理が必要。\u003c/p>\n","beginner":{"scenario":"入力をSQL文に直接連結すると入力が命令の一部として解釈され得る。プレースホルダで命令と値を分ける。画面出力は文脈に合うエスケープを使う。","trap":"SQLインジェクション、XSS、CSRFは原因・対策が異なる。","quizId":"U-11-4"}},{"id":"11-5","title":"ネットワーク防御・ログ・インシデント対応","explain":"\u003cp>ファイアウォールはIP・ポート・状態などに基づき通信を制御する。DMZ（非武装地帯）は外部公開サーバを内部ネットワークから分離するためのネットワーク区画。WAFはHTTP等のアプリ通信を検査し、IDSは不審通信を検知、IPSは条件に応じて遮断する。EDR（Endpoint Detection and Response：端末の検知・対応）は端末上の不審な挙動の記録と調査・隔離を助ける。SIEM（Security Information and Event Management：セキュリティ情報・イベント管理）はログを横断的に集約・相関分析する。\u003c/p>\n\u003cp>インシデント対応は準備→検知と分析→封じ込め→根絶と復旧→事後改善の順に考える。事実と推測を分離し、証拠保全・時刻同期・影響範囲特定を優先する。重要な認証情報が漏えいした恐れがあれば、無効化・再発行・権限確認・不正利用調査を行う。ログがない段階で「漏えいはなかった」と断定しない。\u003c/p>\n","worked":"\u003cp>依存パッケージ更新後に端末から不審な外部通信が発生。まず更新の配布停止、端末の適切な隔離、通信ログ/プロセス/更新履歴の保全、トークン無効化の要否判断を並行する。再インストールだけ先に行うと証拠を失う場合がある。\u003c/p>\n","prompt":"WAFで不正入力を遮断していればアプリのSQL構文連結を放置してよいか。","answer":"\u003cp>だめ。WAFの検知回避を前提に、アプリ側のパラメータ化等が必要。\u003c/p>\n","beginner":{"scenario":"不審通信を検知したら端末の隔離と証拠保全、影響調査、原因の除去、認証情報の処置、復旧を行う。","trap":"直ちに初期化すると証拠を失うことがある。","quizId":"U-11-5"}},{"id":"11-6","title":"科目Bの文章読解と対策選定","explain":"\u003cp>科目Bのセキュリティ問題は、文章と構成図から「事象の時系列」「信頼境界」「認証情報が届く範囲」「管理策の不足」を特定する。設問で「原因を答えよ」とあれば観測できた事実と因果関係を書く。「対策を答えよ」とあれば攻撃経路を断つ具体策を書く。「確認項目」なら必要なログや設定を挙げる。抽象的な「セキュリティ強化」「教育を徹底」は点になりにくい。\u003c/p>\n\u003cp>対策は予防・検知・封じ込め・復旧に分類し、問題のどこへ効くかを説明する。最小権限は侵害後の横展開を抑え、多要素認証は認証情報単独漏えいへの対抗、パッチは既知脆弱性の除去、ログ監視は発見までの時間短縮を狙う。脆弱性がないことや被害がなかったことは、証拠がなければ結論にしない。\u003c/p>\n","worked":"\u003cp>「攻撃者が委託先のVPNアカウントで社内へ入り、管理サーバへアクセスした。委託先アカウントには本番系の管理権限があった」。このとき再発防止策は「委託先へ必要最小限のアクセス権限だけ付与し、管理系へのアクセスを分離する」。本文にない「ウイルスメールを遮断する」は原因経路に対応していない。\u003c/p>\n","prompt":"「ログイン後に横展開した」の対策として「パスワードを複雑にする」だけで十分か。","answer":"\u003cp>十分ではない。横展開を抑えるアクセス権分離・ネットワーク分離・監視・多要素認証なども検討する。\u003c/p>\n","beginner":{"scenario":"退職者IDが残る事例では、資産は社内システム、脅威は不正利用、弱点はID削除漏れ。退職情報に連動してIDを停止する。","trap":"記述では対象と動作を書く。「強化する」だけでは不十分。","quizId":"U-11-6"}},{"id":"11-X01","title":"セキュリティ管理と技術評価","explain":"\u003cp>ISMS（情報セキュリティマネジメントシステム）は方針・リスク評価・対策・監視・改善を組織的に行う。リスクアセスメントは資産・脅威・脆弱性・影響・発生可能性を評価する。対応には回避・低減・移転（共有）・受容がある。残留リスクを確認して責任者が判断する。\u003c/p>\u003cp>CVSS（共通脆弱性評価システム）は脆弱性の深刻度を共通尺度で評価するが、組織固有の業務影響とは別。コモンクライテリア（ISO/IEC 15408）はIT製品のセキュリティ機能・保証を評価する枠組み。脆弱性診断とペネトレーションテストは目的や方法が異なる。ISMS認証は組織の管理の仕組みに対するもの。\u003c/p>","worked":"\u003cp>公開サーバの脆弱性のCVSSが高くても、対策順位は外部到達性、資産重要度、悪用状況などと合わせて判断する。\u003c/p>","prompt":"CVSSの主目的は？","answer":"\u003cp>脆弱性の深刻度を共通尺度で評価すること。\u003c/p>","beginner":{"scenario":"公開Webと隔離試験機に同じ脆弱性があっても外部到達性や業務影響が違うので対応順が異なる場合がある。","trap":"CVSSは脆弱性の深刻度で組織固有リスクそのものではない。","quizId":"U-11-X01"}},{"id":"11-X02","title":"暗号・認証実装・防御機器","explain":"\u003cp>AESは共通鍵暗号、RSAや楕円曲線暗号は公開鍵暗号の代表例。ハッシュはデータの要約値を生成し、署名の検証や完全性確認に使う。MAC（メッセージ認証コード）は共有鍵で完全性・認証を確認する。PKI（公開鍵基盤）では認証局の証明書を検証し公開鍵と主体を結び付ける。失効情報も確認する。\u003c/p>\u003cp>IDS（侵入検知システム）は異常を検知し、IPS（侵入防止システム）は遮断も行う。WAFはWebアプリへの攻撃を防御する。EDRは端末上の不審活動を監視し対応を支援する。認証においてパスワードだけでなく異なる要素を組み合わせる多要素認証、SSO（シングルサインオン）、アクセス権管理、ログ監視を適切に組み合わせる。\u003c/p>","worked":"\u003cp>認証局が発行した証明書でも有効期限・対象ホスト名・信頼連鎖などの確認が必要。暗号化だけでは相手が正規のサービスか保証しない。\u003c/p>","prompt":"WebアプリのHTTP要求を検査して攻撃を抑える装置は？","answer":"\u003cp>WAF（Webアプリケーションファイアウォール）。\u003c/p>","beginner":{"scenario":"通信保護にはTLS、公開鍵の所有者確認には証明書、Web要求検査にはWAF、端末監視にはEDRを組み合わせる。","trap":"ハッシュ値だけでは本文とハッシュの両方を改変されると真正性を保証できない。","quizId":"U-11-X02"}}],"beginnerIntro":"資産を誰からどう守るか考える。暗号・認証・防御機器の目的を整理し、科目Bの記述へつなげる。"},{"id":12,"title":"システム開発技術","group":"テクノロジ","priority":"B選択候補","summary":"要件定義、設計、テスト、品質指標、変更管理。","lessons":[{"title":"要件定義","body":"機能要件は「何ができるか」、非機能要件は性能・可用性・セキュリティ・運用など。関係者の要求を優先度と受入れ条件まで落とし込む。","check":"要件と設計手段（どう実装するか）を分ける。"},{"title":"設計の分割","body":"外部設計は利用者から見える仕様、内部設計は実現する構造。モジュールは凝集度を高く、結合度を低くすることで変更しやすくする。","check":"偶然的凝集は悪く、機能的凝集は良い。"},{"title":"テストと網羅","body":"単体→結合→システム→受入れという段階がある。命令網羅・分岐網羅・条件網羅は意味が異なり、境界値分析や同値分割を使う。","check":"命令網羅100%でもバグがないわけではない。"},{"title":"品質管理","body":"レビューや静的解析は実行前に欠陥を検出する。信頼性・性能効率性・保守性など品質特性ごとに測定指標を置く。","check":"検出した欠陥数の多さだけで品質の良し悪しを判断しない。"},{"title":"移行と保守","body":"切替方式は一斉移行・段階移行・並行運用など。切り戻し計画とデータ整合性確認を用意する。保守には是正・適応・完全化・予防がある。","check":"切替時点のデータ欠損や二重登録を防ぐ。"}],"terms":[{"term":"機能要件","definition":"システムが提供すべき機能や業務処理の要求"},{"term":"非機能要件","definition":"性能・信頼性・安全性・運用など機能以外の要求"},{"term":"モジュール凝集度","definition":"一つのモジュール内の機能がどれだけ密接に関連するか"},{"term":"モジュール結合度","definition":"モジュール同士の依存の強さ"},{"term":"単体テスト","definition":"個々の部品やモジュールの動作を確かめる試験"},{"term":"結合テスト","definition":"部品間のインタフェースや連携を検証する試験"},{"term":"境界値分析","definition":"値の範囲の境目とその近傍を重点的に試す手法"},{"term":"同値分割","definition":"同じ振る舞いと見なせる入力集合から代表値を選ぶ手法"},{"term":"分岐網羅","definition":"判断条件の真と偽の双方を実行する網羅基準"},{"term":"トレーサビリティ","definition":"要求から設計・実装・テストへ対応関係を追跡できること"},{"term":"受入れテスト","definition":"利用者などが業務要件を満たすか確認するテスト"}],"questions":[{"id":"Q12-01","chapter":12,"kind":"applied","q":"入力が1〜100の整数である画面の境界値分析として優先度が高い値の組は。","options":["20,40,60,80","0,1,100,101","10,30,50,70","5,15,25,35"],"correct":1,"explain":"有効・無効の境界近傍を選ぶ。"},{"id":"Q12-02","chapter":12,"kind":"applied","q":"変更容易性を高めるモジュールの性質は。","options":["凝集度低・結合度高","凝集度高・結合度低","凝集度低・結合度低のみ","凝集度高・結合度高"],"correct":1,"explain":"役割をまとめ依存を減らす。"},{"id":"Q12-03","chapter":12,"kind":"applied","q":"要件定義で「99.9%稼働させる」は何に分類されるか。","options":["業務ルール","機能要件","非機能要件","ユーザー操作"],"correct":2,"explain":"稼働率は可用性に関する非機能要件。"},{"id":"D12-01","chapter":12,"kind":"applied","q":"「通常時の95%の検索が2秒以内」という要件の特徴はどれか。","options":["検証可能な非機能要件","画面の色指定のみ","ソースコードの具体的アルゴリズム","会計上の資産"],"correct":0,"explain":"性能に関する非機能要件を測定可能な条件で示している。"},{"id":"D12-02","chapter":12,"kind":"applied","q":"年齢18歳以上を受け付ける入力検証の境界値テストとして適切なのはどれか。","options":["30,40,50","17,18,19","1,3,5","100,200,300"],"correct":1,"explain":"条件が切り替わる境界18の前後17/18/19を試す。"},{"id":"D12-03","chapter":12,"kind":"applied","q":"命令網羅率100%のテスト結果について正しい説明はどれか。","options":["すべてのバグが存在しない","すべての条件組合せが試されている","実行文がすべて少なくとも一度実行されたが、他の欠陥は残り得る","仕様の正しさが証明された"],"correct":2,"explain":"命令網羅はテスト対象の実行文の通過に関する指標で、仕様欠陥・条件組合せの保証ではない。"},{"id":"Q-12-X01","chapter":12,"kind":"applied","q":"オブジェクト間のメッセージを時間順に表現するUML図は？","options":["クラス図","シーケンス図","ER図","ガントチャート"],"correct":1,"explain":"シーケンス図。"},{"id":"Q-12-X02","chapter":12,"kind":"applied","q":"ボトムアップ結合テストで上位の呼出し元を代替するものは？","options":["スタブ","ドライバ","リンカ","スケジューラ"],"correct":1,"explain":"ドライバ。"},{"id":"U-12-1","chapter":12,"kind":"applied","q":"利用者の検索結果を2秒以内に返すという要求の分類は？","options":["機能要件","ソースコード","非機能要件","監査証拠"],"correct":2,"explain":"検索機能自体ではなく、その性能の要求なので非機能要件。"},{"id":"U-12-2","chapter":12,"kind":"applied","q":"モジュール間の依存を少なくする設計を何というか？","options":["低凝集","高結合","高冗長","低結合"],"correct":3,"explain":"低結合はモジュール間依存を小さくし変更の影響を抑える。凝集は内部のまとまり。"},{"id":"U-12-3","chapter":12,"kind":"applied","q":"判定条件の真・偽の両方の分岐を実行する基準は？","options":["分岐網羅","命令網羅","同値分割","負荷試験"],"correct":0,"explain":"分岐網羅は判定結果の両側を実行する。命令網羅は各命令の実行を確認する。"},{"id":"U-12-4","chapter":12,"kind":"applied","q":"頻繁なコード統合と自動検証を行う実践は？","options":["SLA（サービスレベル合意）","CI（継続的インテグレーション）","ETL（抽出・変換・格納）","BCP（事業継続計画）"],"correct":1,"explain":"CIは変更を継続的に統合し、不具合を早期に検出する。"},{"id":"U-12-X01","chapter":12,"kind":"applied","q":"データの移動元・処理・保存先の流れを表す図は？","options":["クラス図","ガントチャート","DFD（データフロー図）","パレート図"],"correct":2,"explain":"DFDはデータの流れを表す。時間順の相互作用はシーケンス図。"},{"id":"U-12-X02","chapter":12,"kind":"applied","q":"トップダウン結合テストで未完成の下位モジュールを代替する部品は？","options":["ドライバ","リンカ","ローダ","スタブ"],"correct":3,"explain":"スタブは呼び出される側を代替。ドライバは呼び出す側の代替。"}],"deepIntro":"システム開発は要求から運用までの整合性を保つ工程。試験では各工程の成果物と、欠陥を見つける手段を問われる。","deep":[{"id":"12-1","title":"要件定義・要求分析・非機能要件","explain":"\u003cp>業務要求は利用者や組織が達成したいこと、システム要件はシステムが実現すべき機能と品質を定義する。機能要件は「注文登録できる」などの振る舞い、非機能要件は性能、可用性、セキュリティ、拡張性、運用性など。要求を取りこぼさないには利用者、業務フロー、例外、外部連携、制約条件を明示する。\u003c/p>\n\u003cp>要件は検証可能な形にする。「速い」ではなく「通常時の95%の検索応答を2秒以内」など。曖昧な要求や利害関係者の認識差は後工程で大きな手戻りを招く。トレーサビリティは要求→設計→実装→テストの対応関係を追跡できる性質。\u003c/p>\n","worked":"\u003cp>「止まらない予約サイト」では合否判定できない。稼働率99.9%、RTO=1時間、RPO=15分、最大同時利用者数などに分解し、計測方法も定義する。\u003c/p>\n","prompt":"UIの色を決めれば非機能要件が満たされるか。","answer":"\u003cp>ならない。アクセシビリティ、性能、可用性などは別に検証する。\u003c/p>\n","beginner":{"scenario":"予約システムで「予約できる」は機能要件。「同時利用者100人で95%の検索を2秒以内に完了」は性能の非機能要件。要件を満たしたか検証できる形にする。","trap":"「高速」「使いやすい」だけでは合否を判定できない。","quizId":"U-12-1"}},{"id":"12-2","title":"設計・モデリング・アーキテクチャ","explain":"\u003cp>外部設計（基本設計）は利用者から見た機能・画面・帳票・外部インタフェースなど、内部設計（詳細設計）はモジュール・データ構造・処理手順などを具体化する。UML（Unified Modeling Language：統一モデリング言語）のユースケース図は利用主体と機能、クラス図は静的構造、シーケンス図は時間順のやりとり、状態遷移図は状態とイベントの変化を表す。\u003c/p>\n\u003cp>設計で重要なのは責務の分離、変更しやすさ、障害隔離、認証・認可の一貫性。3層アーキテクチャは画面・業務ロジック・データアクセスを分ける。マイクロサービス化は独立デプロイ等を助ける一方、通信・データ整合性・監視が複雑になり得る。\u003c/p>\n","worked":"\u003cp>「利用者が注文→在庫確保→決済→通知」をシーケンス図で表すと、在庫確保後の決済失敗時に何を戻すかという例外経路を可視化できる。\u003c/p>\n","prompt":"クラス図でメッセージの時間順を詳細に表すか。","answer":"\u003cp>時間順の相互作用はシーケンス図が適する。\u003c/p>\n","beginner":{"scenario":"ECサイトを画面・注文処理・データ保存に分けると、画面の見た目を変えても業務処理への変更を小さくできる。","trap":"三層は責務の分離であり、物理サーバ3台が必須ではない。","quizId":"U-12-2"}},{"id":"12-3","title":"テスト技法・網羅率・境界値","explain":"\u003cp>単体テストは部品内部、結合テストは部品間、システムテストはシステム全体、受入テストは業務要件の適合を利用側が確認する。ブラックボックス技法は仕様から入力・出力を検討し、同値分割と境界値分析が代表。ホワイトボックス技法はコード構造からテストを設計し、命令網羅、分岐網羅、条件網羅を区別する。\u003c/p>\n\u003cp>例えば「年齢18歳以上」が条件なら17,18,19を試し、区間の境界を確認する。テストケースが多数あっても重要な分岐が抜けていれば品質を保証できない。回帰テストは変更による既存機能への影響を検証する。\u003c/p>\n","worked":"\u003cp>条件 \u003ccode>(A AND B)\u003c/code> の真偽を網羅したい場合、分岐網羅（結果の真偽両方）だけではAとBがそれぞれ真偽に変化する影響を十分に調べられないことがある。条件網羅と分岐網羅は異なる。\u003c/p>\n","prompt":"100%命令網羅でバグが存在しないといえるか。","answer":"\u003cp>いえない。未検証の条件組合せや仕様そのものの欠陥が残る。\u003c/p>\n","beginner":{"scenario":"許容範囲1〜100の整数入力なら、0、1、2、99、100、101で境界前後を確認する。別途、文字や小数なども同値クラスに分ける。","trap":"テスト網羅率100%でもすべての入力や不具合を網羅したとは限らない。","quizId":"U-12-3","lab":{"title":"命令網羅と分岐網羅","problem":"処理：x>0ならa←1、それ以外はa←0。次にy>0ならb←1、それ以外はb←0。テスト(1,1)だけで十分か？","steps":["テスト(1,1)は2つの判定の真側だけを通る。偽側の命令a←0、b←0は未実行。","追加テスト(0,0)で両判定の偽側も通る。","この2件で記載された代入命令を実行し、各判定の真・偽を網羅できる。","しかし(1,0)と(0,1)という組合せは未検証である。要求に応じ組合せや境界も確認する。"],"answer":"1件では不足。例として(0,0)を追加すれば分岐網羅を満たす","check":"分岐網羅100%でも全経路・全組合せ・全入力を網羅したとはいえない。"}}},{"id":"12-4","title":"レビュー・品質測定・CI/CD","explain":"\u003cp>レビューはコードを実行せず欠陥を検出する静的手法。ウォークスルー、インスペクション、ペアレビューなど、形式や役割が異なる。静的解析は型・コーディング規約・潜在的な脆弱性などを検出するが、誤検知や見逃しもある。品質特性には機能適合性、信頼性、使用性、保守性、移植性などがあり、単純なバグ件数だけで総合品質は測れない。\u003c/p>\n\u003cp>CI（Continuous Integration：継続的インテグレーション）は変更を頻繁に統合し自動ビルド・テストを回す実践。CD（Continuous Delivery/Deployment：継続的デリバリ/デプロイ）はリリース可能状態を保つ・自動配備する実践。導入後も変更管理・権限管理・監査証跡を忘れない。\u003c/p>\n","worked":"\u003cp>仕様変更後に単体テストだけ通過した場合、複数サービスの連携や既存業務への影響を保証できない。結合・回帰・受入テストを設計する。\u003c/p>\n","prompt":"自動テストを実行すればレビューや要件検証は不要か。","answer":"\u003cp>不要にはならない。テストに書かれていない要求は検証されない。\u003c/p>\n","beginner":{"scenario":"コード変更後に自動ビルドし、テスト・静的解析を実行する。失敗した場合は統合や配布を止め、変更者へ通知する。","trap":"自動テストが通っても品質保証が完了するわけではない。レビューや受入条件も必要。","quizId":"U-12-4"}},{"id":"12-X01","title":"設計・実装・モデリング","explain":"\u003cp>外部設計は利用者から見える機能・画面・入出力、内部設計は内部構造・処理・データ構造などを具体化する。UML（統一モデリング言語）のクラス図は静的構造、シーケンス図は時間順の相互作用、状態遷移図は状態変化、ユースケース図は利用者と機能の関係。DFD（データフロー図）はデータの流れを表す。\u003c/p>\u003cp>モジュール凝集度は内部の機能のまとまり、結合度はモジュール間依存。高凝集・低結合が変更の局所化に役立つ。実装・構築ではコーディング規約、例外処理、入力検証、再利用、静的解析、ビルド、環境設定、単体テストなどを行い、設計との追跡可能性を保つ。\u003c/p>","worked":"\u003cp>注文処理のシーケンス図で画面→業務処理→DBの呼出しを示せば、データ更新の責務やエラー応答を確認できる。\u003c/p>","prompt":"オブジェクト間のメッセージを時間順に表現するUML図は？","answer":"\u003cp>シーケンス図。\u003c/p>","beginner":{"scenario":"注文画面、注文サービス、DBの間で送られるメッセージを時系列に並べると、注文失敗時にどの処理が応答するか検討できる。","trap":"クラス図は構造、シーケンス図は相互作用、状態遷移図は状態変化。","quizId":"U-12-X01"}},{"id":"12-X02","title":"統合試験・移行・保守と廃棄","explain":"\u003cp>単体テスト後の結合テストはインタフェースを検証する。トップダウンでは未完成の下位モジュールをスタブで代替、ボトムアップでは呼出し元をドライバで代替する。システムテストは全体の要求適合、受入テストは利用者の受入条件を確認する。回帰テストは変更で既存機能が壊れていないか調べる。\u003c/p>\u003cp>導入時はデータ移行計画、照合、切戻し条件、教育を用意する。一斉移行は切替が短いがリスクが集中し、並行稼働は旧新両方を運用する負担がある。保守は是正・適応・完全化・予防などの目的に分類される。廃棄ではデータ消去、証跡、契約終了、資産台帳更新を行う。\u003c/p>","worked":"\u003cp>給与システムで旧新の計算結果を1か月並行照合してから切り替えると、不一致を本番切替前に発見できる。\u003c/p>","prompt":"ボトムアップ結合テストで上位の呼出し元を代替するものは？","answer":"\u003cp>ドライバ。\u003c/p>","beginner":{"scenario":"旧給与システムと新システムを1か月並行稼働し計算結果を照合する。不一致時は原因修正まで旧システムを維持する。","trap":"件数一致だけでは移行データの内容や参照関係の正しさを保証できない。","quizId":"U-12-X02"}}],"beginnerIntro":"利用者が何を必要とするかを要求として整理し、設計、実装、試験、導入へつなげる。各工程で何を確認すべきかを考える。"},{"id":13,"title":"ソフトウェア開発管理技術","group":"テクノロジ","priority":"A標準","summary":"アジャイル、ウォーターフォール、CI/CD、構成管理、ライセンス。","lessons":[{"title":"開発プロセス","body":"ウォーターフォールは工程を段階的に進める。アジャイルは短い反復で顧客価値と学習を重視する。どちらも要件変更や品質の管理は必要。","check":"アジャイル＝計画なし・文書なしではない。"},{"title":"Scrumの基本","body":"Scrum（スクラム）ではプロダクトバックログを順序付けし、スプリントで増分を生み、レビューとレトロスペクティブで改善する。","check":"デイリースクラムは単なる進捗報告会にしない。"},{"title":"構成・変更管理","body":"バージョン管理は履歴を保つ。変更要求は影響分析・承認・実装・検証を経て反映する。ベースラインを定め、要求とコードと成果物の整合性を確保。","check":"版番号だけでなく変更理由と承認を追えるようにする。"},{"title":"CI/CD","body":"CI（Continuous Integration：継続的インテグレーション）は頻繁な統合と自動テスト。CD（Continuous Delivery/Deployment：継続的デリバリ／デプロイ）はリリース可能な状態を維持し必要に応じ自動配備する。","check":"テストが成功しても運用品質まで完全保証されない。"}],"terms":[{"term":"ウォーターフォール","definition":"開発工程を段階的に進めるプロセスモデル"},{"term":"アジャイル開発","definition":"短い反復と継続的なフィードバックを重視する開発手法"},{"term":"スクラム","definition":"役割・イベント・作成物を定めたアジャイル開発の枠組み"},{"term":"スプリント","definition":"スクラムで成果の増分を作る一定期間の活動"},{"term":"プロダクトバックログ","definition":"製品で実現すべき項目を優先順に並べた一覧"},{"term":"CI","definition":"頻繁なコード統合とビルド・テストの自動化"},{"term":"CD","definition":"ソフトウェアの配布やデプロイを継続的に行えるようにする仕組み"},{"term":"構成管理","definition":"成果物の構成・版・変更履歴を管理すること"},{"term":"ベースライン","definition":"管理・変更の基準となる確定された成果物の状態"},{"term":"技術的負債","definition":"短期的な実装上の妥協などが将来の変更費用を増やす状態"}],"questions":[{"id":"Q13-01","chapter":13,"kind":"applied","q":"CIの主目的として最も適切なのは。","options":["テストを省く","統合時の不整合を早期に検出する","承認手続きをすべてなくす","セキュリティ事故を完全防止する"],"correct":1,"explain":"頻繁な統合と自動テストにより問題を早く発見する。"},{"id":"Q13-02","chapter":13,"kind":"applied","q":"スクラムで利用者価値の優先順位が付いた要求一覧は。","options":["プロダクトバックログ","監査調書","変更ログのみ","決算書"],"correct":0,"explain":"プロダクトバックログは製品の仕事を表す。"},{"id":"Q13-03","chapter":13,"kind":"applied","q":"構成管理に適切なのは。","options":["最新版のみ保持し履歴を削除","版と変更履歴を追跡可能にする","本番のみでコード管理する","修正要求をすべて自動承認する"],"correct":1,"explain":"追跡可能性と整合性を保つ。"},{"id":"D13-01","chapter":13,"kind":"applied","q":"本番不具合が昨日のリリースから発生したとき、原因の再現性を高める情報はどれか。","options":["利用者の印象だけ","固定したコミットと依存バージョン・設定差分","常に最新のライブラリ","開発者数だけ"],"correct":1,"explain":"ソース・依存・設定・環境を特定できれば変更点を絞り込める。"},{"id":"D13-02","chapter":13,"kind":"applied","q":"FP法（ファンクションポイント法）で主に評価するものはどれか。","options":["ソースコードの行数","CPUのクロック周波数","利用者から見た機能規模","開発者の人数のみ"],"correct":2,"explain":"入力・出力・照会・論理ファイル・外部インタフェース等から機能規模を見積もる。"},{"id":"D13-03","chapter":13,"kind":"applied","q":"反復型開発の特徴として適切なものはどれか。","options":["変更を認めない","要件を一切書かない","試作と評価を繰り返し学習結果を反映する","品質テストを常に省く"],"correct":2,"explain":"小さな増分の評価を繰り返すが、テストや要件管理を不要にするわけではない。"},{"id":"Q-13-X01","chapter":13,"kind":"applied","q":"まず失敗するテストを書き、実装して通過させる開発技法は？","options":["TDD","RFI","EVM","OLAP"],"correct":0,"explain":"TDD（テスト駆動開発）。"},{"id":"U-13-1","chapter":13,"kind":"applied","q":"スクラムで次に開発する項目を優先順に並べる成果物は？","options":["プロダクトバックログ","監査調書","サービスカタログ","財務諸表"],"correct":0,"explain":"プロダクトバックログは製品に必要な作業の順序付きリスト。"},{"id":"U-13-2","chapter":13,"kind":"applied","q":"特定時点に承認済みの構成を固定し、以後の変更の基準とするものは？","options":["プロトタイプ","ベースライン","バックログ","ヒストグラム"],"correct":1,"explain":"ベースラインは正式に承認された構成の基準。"},{"id":"U-13-3","chapter":13,"kind":"applied","q":"入力・出力・ファイルなど利用者から見える機能の規模で見積る手法は？","options":["クリティカルパス法","最小二乗法","ファンクションポイント法","パリティ検査"],"correct":2,"explain":"機能量を複雑さなどで重み付けして規模を推定する。"},{"id":"U-13-X01","chapter":13,"kind":"applied","q":"開発と運用の協力・自動化・監視を重視する考え方は？","options":["ウォーターフォールのみ","SOA（サービス指向アーキテクチャ）","OLAP（オンライン分析処理）","DevOps"],"correct":3,"explain":"DevOpsは開発・運用の協力と継続改善を重視する。"}],"deepIntro":"開発プロセスや構成管理は、変更が多い環境でも品質と追跡可能性を保つ仕組み。","deep":[{"id":"13-1","title":"ウォーターフォール・反復・アジャイル","explain":"\u003cp>ウォーターフォールは工程を順に進め、成果物と承認を明確にしやすい。要件が安定し、検収条件を定めやすい案件と相性がよい。一方、後工程で要求が変わると手戻りが大きい。反復・増分型は小さく作って評価を反映し、アジャイルは顧客との協働と変化への適応を重視する価値観・実践の集合。\u003c/p>\n\u003cp>スクラムではプロダクトオーナーがプロダクトバックログの管理に責任を負い、スクラムマスターがフレームワークの理解と効果的な運用を支援し、開発者がインクリメントを作る。スプリントは固定長の反復で、レビューとレトロスペクティブの目的は異なる。\u003c/p>\n","worked":"\u003cp>利用者の操作方法を短期間で検証したいなら、画面のプロトタイプを小さく反復するのが合理的。ただし法令上の承認記録などは反復型でも省略しない。\u003c/p>\n","prompt":"アジャイルなら計画・文書・契約がすべて不要か。","answer":"\u003cp>違う。価値を生む範囲で必要な計画と記録を行う。\u003c/p>\n","beginner":{"scenario":"予約機能を短い反復で開発し、利用者が動く画面を試して次の優先順位を見直す。長期の仕様確定を待たず学習できる。","trap":"アジャイルでも計画、設計、テスト、記録が必要。無計画に実装する方法ではない。","quizId":"U-13-1"}},{"id":"13-2","title":"バージョン管理・構成管理・変更管理","explain":"\u003cp>構成管理はソースコードだけでなく仕様書・設定・依存ライブラリ・成果物などの版と関係を追跡する。Gitのコミットは変更履歴の識別、ブランチは独立した作業系列、タグは特定時点のリリース参照に利用する。リリースに使ったコミットや依存バージョンを固定すると、実際の利用環境での再現性を高められる。\u003c/p>\n\u003cp>変更管理では変更要求→影響調査→承認→実施→検証→記録の流れを整える。問題が発生したとき「誰がいつ何を変えたか」「どの環境へ配布したか」を特定できることが重要。SCA（Software Composition Analysis：ソフトウェア構成要素分析）で依存関係の脆弱性・ライセンスを確認する。\u003c/p>\n","worked":"\u003cp>本番不具合が「昨日のデプロイから」発生した場合、変更一覧・コミットSHA・設定差分・依存解決結果を比較し、必要なら前版へ戻す。\u003ccode>latest\u003c/code>の参照では実体の再現性が弱い。\u003c/p>\n","prompt":"Gitに入っているから本番動作が必ず再現できるか。","answer":"\u003cp>できない。外部依存、データ、環境変数、実行環境なども影響する。\u003c/p>\n","beginner":{"scenario":"本番で障害が起きたとき、配布したソースの版・依存ライブラリ・設定値を特定できれば再現しやすい。","trap":"バージョン管理だけでは承認や影響評価ができない。変更管理も必要。","quizId":"U-13-2"}},{"id":"13-3","title":"開発見積り・品質・リスク","explain":"\u003cp>工数見積りには類推、専門家判断、ファンクションポイント法、モデルによる推定などがある。ファンクションポイントは入力、出力、照会、内部論理ファイル、外部インタフェースファイル等を数え、機能規模の目安を算出する。COCOMO系のモデルは規模などから工数を推定する。どの方法も前提・不確実性を明示することが大切。\u003c/p>\n\u003cp>不具合密度は件数/規模などで示すが、検査条件の異なるチーム間で機械的に比較しない。リスクは発生可能性と影響度で評価し、優先順位に応じて予防・検知・回避策を計画する。\u003c/p>\n","worked":"\u003cp>作業量が40人日なら2人で20日とは限らない。タスクの並列化可能性、作業者の調整コスト、手戻りを加味する。短縮可能な工程とクリティカルパスを分ける。\u003c/p>\n","prompt":"ファンクションポイントの大きさはプログラミング言語と行数で決まるか。","answer":"\u003cp>主に利用者から見た機能の規模を測る。言語・コード行数とは異なる。\u003c/p>\n","beginner":{"scenario":"画面10個を1個2人日で作るなら実装見積り20人日。設計、試験、レビュー、調整などの作業も見積りに含める。","trap":"過去の生産性は条件が違うと使えない。見積りの前提と不確実性を明記する。","quizId":"U-13-3"}},{"id":"13-X01","title":"開発プロセス・知財・環境管理","explain":"\u003cp>XP（エクストリームプログラミング）はテスト駆動開発、ペアプログラミング、小さなリリースなどを重視する。スクラムでは短い反復で成果と計画を検査・適応する。DevOps（開発と運用の連携）は自動化・監視・協力で価値提供を改善する。リバースエンジニアリングは既存ソフトの構造を解析し、再構築に活用する場合がある。\u003c/p>\u003cp>知的財産適用管理では外部部品のライセンス・契約・利用条件・特許などを確認する。開発環境管理は開発・試験・本番の分離、ツールの版固定、依存関係、アクセス権、リポジトリ、再現可能なビルドを管理する。構成管理は成果物と版・関係を識別し、変更管理は要求・影響評価・承認・実施を管理する。\u003c/p>","worked":"\u003cp>開発チームが使用ライブラリの版とライセンスを一覧化し、本番の依存関係を再現できるようにする。\u003c/p>","prompt":"まず失敗するテストを書き、実装して通過させる開発技法は？","answer":"\u003cp>TDD（テスト駆動開発）。\u003c/p>","beginner":{"scenario":"本番環境だけで動かない不具合を避けるため、依存ライブラリの版を固定し、同じ条件でビルドと試験を行う。","trap":"外部コードを利用できることと自由に再配布できることは別。","quizId":"U-13-X01"}}],"beginnerIntro":"ソフトウェアをどの手順・体制で開発するかを学ぶ。開発手法、構成の識別、変更の承認を区別する。"},{"id":14,"title":"プロジェクトマネジメント","group":"マネジメント","priority":"B選択候補","summary":"WBS、PERT、クリティカルパス、EVM、リスク・品質・調達。","lessons":[{"title":"スコープとWBS","body":"WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を管理可能な単位に分解する。完了条件・責任分担・依存関係を明確にする。","check":"工数表とWBSは同一ではない。"},{"title":"工程とクリティカルパス","body":"PERT（Program Evaluation and Review Technique：工程計画・評価技法）のネットワーク図で最長の所要経路がクリティカルパス。この経路の遅延は余裕がなければ全体遅延につながる。","check":"並行タスクの所要時間は単純な合計ではない。"},{"title":"進捗の定量評価","body":"EVM（Earned Value Management：出来高管理）でPV（計画価値）、EV（出来高）、AC（実コスト）を比較。CV=EV−AC、SV=EV−PV、CPI=EV/AC、SPI=EV/PV。","check":"符号の意味と、値が1より大きいか小さいかを解釈。"},{"title":"リスクと調達","body":"リスクは発生確率×影響度などで優先付け。対応は回避・低減・移転・受容。契約形態が変わると発注者と受注者のリスク負担が変わる。","check":"問題が起きてからの対応と事前リスク対応を分ける。"},{"title":"ステークホルダ","body":"関係者の権限、関心、コミュニケーション要件を把握する。変更要求の影響分析では費用・日程・品質・セキュリティに波及する部分を検討。","check":"単に全員に同じ資料を配るだけでは不十分。"}],"terms":[{"term":"WBS","definition":"成果物や作業を小さな単位へ階層的に分解する図"},{"term":"クリティカルパス","definition":"工程ネットワーク上で全体期間を決める最長経路"},{"term":"フロート","definition":"作業が遅れても全体完了を遅らせない余裕時間"},{"term":"PV","definition":"計画時点までに完了予定の作業に対応する予算価値"},{"term":"EV","definition":"実際に完了した作業を予算で評価した出来高"},{"term":"AC","definition":"実際に発生したコスト"},{"term":"CPI","definition":"コスト効率指数。EV÷AC"},{"term":"SPI","definition":"スケジュール効率指数。EV÷PV"},{"term":"リスク低減","definition":"起こる確率や被害の大きさを抑える対応"},{"term":"ステークホルダ","definition":"プロジェクトに影響する・影響を受ける利害関係者"}],"questions":[{"id":"Q14-01","chapter":14,"kind":"applied","q":"EV=80、AC=100、PV=90のときCPIは。","options":["0.8","0.9","1.1","1.25"],"correct":0,"explain":"CPI=EV/AC=0.8。予算超過方向。"},{"id":"Q14-02","chapter":14,"kind":"applied","q":"クリティカルパスの説明で正しいのは。","options":["作業数が最少の経路","遅延が全体日程に直結する経路","費用が最多の経路","人員数が最多の経路"],"correct":1,"explain":"全体工期を規定する経路は余裕時間がゼロになる。"},{"id":"Q14-03","chapter":14,"kind":"applied","q":"リスクに備えて保険へ加入することは主に。","options":["回避","低減","移転","受容"],"correct":2,"explain":"被害の金銭的負担を保険会社へ移す。"},{"id":"D14-01","chapter":14,"kind":"applied","q":"PV=100万円、EV=80万円、AC=120万円のとき、費用差異CVはいくらか。","options":["−40万円","−20万円","20万円","40万円"],"correct":0,"explain":"CV=EV−AC=80−120=−40万円。負の値は費用超過を示す。"},{"id":"D14-02","chapter":14,"kind":"applied","q":"並行経路A→C→Eが9日、B→D→Eが10日なら、資源制約を無視した最低完了日数はどれか。","options":["8日","9日","10日","19日"],"correct":2,"explain":"最長経路が完了を支配するので10日。短縮対象はクリティカルパス。"},{"id":"D14-03","chapter":14,"kind":"applied","q":"クリティカルパス以外の余裕のある作業を1日短縮した場合、通常どうなるか。","options":["必ず1日早く終わる","全体工期が変わらないことがある","品質が必ず向上する","工数は必ず2倍になる"],"correct":1,"explain":"工期は余裕ゼロの経路に依存するため、非クリティカル作業の短縮は工期に影響しない場合がある。"},{"id":"Q-14-X01","chapter":14,"kind":"applied","q":"変更要求の費用・納期・品質への影響を全体として調整する管理は？","options":["統合管理","時間管理のみ","調達管理のみ","構成管理のみ"],"correct":0,"explain":"統合管理。"},{"id":"Q-14-X02","chapter":14,"kind":"applied","q":"リスクを保険により外部に移す対応は？","options":["回避","低減","移転","受容"],"correct":2,"explain":"リスク移転。"},{"id":"U-14-1","chapter":14,"kind":"applied","q":"A-B-Dが10日、A-C-Dが7日で他制約なし。Cの総余裕は？","options":["3日","7日","10日","0日"],"correct":0,"explain":"Cを3日遅らせてもDの開始は変わらない。"},{"id":"U-14-2","chapter":14,"kind":"applied","q":"PV100、EV80、AC90万円のSPI（スケジュール効率指数）は？","options":["0.89","0.8","1.25","1.125"],"correct":1,"explain":"SPI=EV/PV=0.8。0.89はCPI（コスト効率指数）に近い。"},{"id":"U-14-3","chapter":14,"kind":"applied","q":"作業ごとに実行・説明責任・相談・報告先を整理する表は？","options":["RAID","BSC（バランストスコアカード）","RACI（役割分担表）","ER図"],"correct":2,"explain":"RACIはResponsible、Accountable、Consulted、Informedの役割を整理する。"},{"id":"U-14-X01","chapter":14,"kind":"applied","q":"費用・期間・範囲・品質を横断して変更を調整する管理は？","options":["時間管理のみ","資源管理のみ","調達管理のみ","統合管理"],"correct":3,"explain":"統合管理は複数領域の計画や変更を整合させる。"},{"id":"U-14-X02","chapter":14,"kind":"applied","q":"6人全員が互いに直接連絡する組合せは？","options":["15","6","12","36"],"correct":0,"explain":"n(n−1)/2=6×5/2=15。方向を区別しない経路数。"}],"deepIntro":"計画を立てることだけが管理ではない。進捗・費用・品質・リスクを測り、変化が起きたときの意思決定まで行う。","deep":[{"id":"14-1","title":"WBS・スケジュール・クリティカルパス","explain":"\u003cp>WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を管理可能な単位に分解する。見積り、担当、実績を対応付ける基礎となる。ガントチャートは日程、アローダイアグラム（PERT）は作業の先行関係と所要時間を示す。最早開始時刻ESと最遅開始時刻LSの差が余裕（フロート）。プロジェクト完了までの所要時間を決める余裕ゼロの経路をクリティカルパスという。\u003c/p>\n","worked":"\u003cp>A(3日)→C(4日)→E(2日)で9日、B(5日)→D(3日)→E(2日)で10日の2経路があるとき、両経路のEが共通の作業なら最長経路10日が完了日を決める。短縮するなら原則クリティカルパス上の作業を対象にする。資源制約がある場合は単純な最長経路だけでは決まらない。\u003c/p>\n","prompt":"クリティカルパス以外の作業を1日短縮すると、必ず完成が1日早まるか。","answer":"\u003cp>ならない。余裕のある作業を短縮しても全体完了時間は変わらない場合がある。\u003c/p>\n","beginner":{"scenario":"Aが2日、A後にBが5日とCが2日を並行実施、両方終了後にDが3日。A-B-Dは10日、A-C-Dは7日。最長経路が全体工期を決める。","trap":"クリティカルパスは最短経路ではなく、依存関係上最長の所要時間の経路。","quizId":"U-14-1"}},{"id":"14-2","title":"EVM・進捗と費用の統合管理","explain":"\u003cp>EVM（Earned Value Management：出来高管理）は、計画価値PV（Planned Value：計画した作業の予算価値）、出来高EV（Earned Value：実際に完了した作業の予算価値）、実コストAC（Actual Cost：実際の支出）で管理する。進捗差異SV＝EV−PV、費用差異CV＝EV−AC。進捗効率SPI＝EV/PV、費用効率CPI＝EV/AC。負の差異や1未満の指数は予定超過・費用超過を示す。\u003c/p>\n\u003cp>BAC（Budget at Completion：完成時総予算）、EAC（Estimate at Completion：完成時総費用見積り）を使い、現在の効率が続くという\u003cstrong>仮定\u003c/strong>のもとでEAC≈BAC/CPIと予測することがある。\u003c/p>\n","worked":"\u003cp>PV=100万円、EV=80万円、AC=120万円ならSV=−20万円（計画に対し作業遅れ）、CV=−40万円（出来高に対し費用超過）。SPI=0.8、CPI≈0.667。ACとPVを直接比べて進捗を判断しない。\u003c/p>\n","prompt":"EV=PVであればコストは必ず予定どおりか。","answer":"\u003cp>違う。EVは出来高の予算価値。ACがEVより大きければ費用超過。\u003c/p>\n","beginner":{"scenario":"予算100万円分の作業を予定し、実際に80万円分を完成、費用90万円。計画との差EV−PV=−20万円、費用差EV−AC=−10万円。","trap":"EVは実際に使った金額ではなく、完成した作業の予算上の価値。","quizId":"U-14-2","lab":{"title":"EVMの値を一つずつ解釈する","problem":"PV（計画価値）120万円、EV（出来高）90万円、AC（実コスト）100万円。進捗・コストの差と効率を求める。","steps":["PVは現在までに予定した作業の予算価値、EVは実際に完了した作業の予算価値、ACは実際に支払った費用。","SV=EV−PV=90−120=−30万円。進捗が計画より遅れている。","CV=EV−AC=90−100=−10万円。費用効率が悪い。","SPI=EV/PV=0.75、CPI=EV/AC=0.9。どちらも1未満。"],"answer":"SV−30万円、CV−10万円、SPI0.75、CPI0.9","check":"EVを実費と取り違えない。SVは金額で表したスケジュール差であり遅延日数ではない。"}}},{"id":"14-3","title":"人的資源・コミュニケーション・ステークホルダー","explain":"\u003cp>プロジェクトには発注者、利用者、開発者、運用担当、監督官庁など立場の違う関係者がいる。利害・意思決定権限・期待・必要情報を整理し、コミュニケーション計画を定める。変更要求をそのまま実装するとスコープクリープ（範囲の無秩序な拡大）が起きるため、影響分析と承認を通す。\u003c/p>\n\u003cp>リスク登録簿には原因、発生確率、影響、兆候、責任者、対応策を記録する。品質・納期・予算のトレードオフで、何を守るべきか合意する。メンバー増員で必ず工期短縮するわけではなく、教育・調整・並列化の限界がある。\u003c/p>\n","worked":"\u003cp>開発終盤に追加帳票を要求された場合、工数・運用・受入試験への影響を見積り、変更管理で承認し、基準計画を更新する。担当者判断で納期を維持すると品質低下を招く可能性がある。\u003c/p>\n","prompt":"リスクが発生した後に記録するものだけをリスク登録簿と呼ぶか。","answer":"\u003cp>違う。未発生のリスクを先に特定し対策を計画する。\u003c/p>\n","beginner":{"scenario":"開発者と利用部門で要求の解釈が違えば手戻りが生じる。誰が実行・承認し、誰に相談・報告するかを明確にする。","trap":"関係者全員に全情報を送るだけでは適切なコミュニケーション管理にならない。","quizId":"U-14-3"}},{"id":"14-X01","title":"プロジェクト管理の体系と統合","explain":"\u003cp>プロジェクトは期限と独自の成果を持つ活動。PMBOK（プロジェクトマネジメント知識体系ガイド）は代表的な知識体系で、PMO（プロジェクト管理支援組織）は標準化や進捗支援を担う。立上げ・計画・実行・監視管理・終結を通じ、統合、ステークホルダ、スコープ、資源、時間、コスト、リスク、品質、調達、コミュニケーションを管理する。\u003c/p>\u003cp>統合管理は複数領域の計画・変更を整合させる。スコープは成果物と作業の範囲で、WBS（作業分解構成図）で作業を階層化する。資源管理では人材・設備の必要量・利用可能性を把握し平準化する。ステークホルダには関心と影響力に応じ情報共有や参画を調整する。\u003c/p>","worked":"\u003cp>納期短縮要求があれば人員費・品質・他プロジェクトへの影響を評価し、承認された変更を統合計画に反映する。\u003c/p>","prompt":"変更要求の費用・納期・品質への影響を全体として調整する管理は？","answer":"\u003cp>統合管理。\u003c/p>","beginner":{"scenario":"納期を1か月短縮すると追加費用や品質低下のリスクが生じる。変更要求を受けたら関連する計画を同時に見直す。","trap":"一つの指標だけ最適化してもプロジェクト全体が改善するとは限らない。","quizId":"U-14-X01"}},{"id":"14-X02","title":"リスク・品質・調達・コミュニケーション管理","explain":"\u003cp>リスクは発生可能性と影響を評価し、回避・低減・移転・受容などの対応を決め、担当・期限をリスク登録簿に記録する。品質管理では要求品質、品質保証、検査、改善を区別し、欠陥密度や管理図で異常を調べる。品質コストには予防・評価・内部失敗・外部失敗の費用がある。\u003c/p>\u003cp>調達管理では内製か外注か、契約方式、選定基準、検収、契約変更を扱う。固定価格契約では範囲変更の管理が重要、実費精算型はコストの監視が重要。コミュニケーション管理は誰に何をいつどの媒体で伝えるか決める。n人が全員相互通信する経路はn(n−1)/2。\u003c/p>","worked":"\u003cp>6人のチームの相互通信経路は15。1人追加すると21となり6経路増える。\u003c/p>","prompt":"リスクを保険により外部に移す対応は？","answer":"\u003cp>リスク移転。\u003c/p>","beginner":{"scenario":"外注先の遅延リスクに対し別業者を確保するのは低減、危険な機能を中止するのは回避、保険は移転の例。","trap":"リスクを受容する場合も判断者、条件、監視方法を決める。","quizId":"U-14-X02"}}],"beginnerIntro":"決められた範囲・期限・費用で成果を出すための管理を学ぶ。工程図と出来高管理では数値の意味を明確にする。"},{"id":15,"title":"サービスマネジメント","group":"マネジメント","priority":"B選択候補","summary":"SLA、インシデントと問題管理、変更・構成管理、BCP。","lessons":[{"title":"サービスレベル","body":"SLA（Service Level Agreement：サービス水準合意）は提供者と利用者が稼働率・応答時間などの目標を合意した文書。SLM（Service Level Management：サービスレベル管理）は監視・評価・改善する活動。","check":"SLAの数値は測定条件まで定める。"},{"title":"インシデントと問題","body":"インシデント管理は早期のサービス復旧を目標とし、問題管理は根本原因を特定して再発を防止する。回避策による暫定復旧と恒久対策を区別。","check":"原因不明でも暫定復旧してよい場合がある。"},{"title":"変更とリリース","body":"変更管理はリスクと影響を評価し承認する。リリース管理は変更内容を適切な時期・手順で展開する。CMDB（Configuration Management Database：構成管理データベース）は関連資産・構成の把握を支援。","check":"資産管理と構成管理は対象の関係性の扱いが異なる。"},{"title":"継続性","body":"BCP（Business Continuity Plan：事業継続計画）にはRTO（Recovery Time Objective：目標復旧時間）とRPO（Recovery Point Objective：目標復旧時点）が重要。RPOを短くするとデータ損失を小さくできる。","check":"RTOは時間、RPOはデータがどの時点まで戻るか。"}],"terms":[{"term":"SLA","definition":"サービス提供者と利用者が合意するサービス水準"},{"term":"SLM","definition":"サービスレベルを定義・測定・改善する管理活動"},{"term":"インシデント管理","definition":"障害等の影響を抑えサービスを早く復旧させる活動"},{"term":"問題管理","definition":"インシデントの根本原因を特定し再発を防ぐ活動"},{"term":"変更管理","definition":"システム変更の影響・リスク・承認を管理すること"},{"term":"CMDB","definition":"ITサービスの構成品目とそれらの関係を管理するデータベース"},{"term":"BCP","definition":"災害等でも重要業務を継続・早期再開する計画"},{"term":"RTO","definition":"重要業務を復旧すべき目標時間"},{"term":"RPO","definition":"データの復旧で許容する過去への戻り時点の目標"},{"term":"可用性管理","definition":"サービスを必要時に利用できるよう目標と実績を管理する活動"}],"questions":[{"id":"Q15-01","chapter":15,"kind":"applied","q":"障害直後、暫定回避策でサービスを早期復旧する活動は。","options":["問題管理","インシデント管理","調達管理","企業統治"],"correct":1,"explain":"まずサービスを復旧させるのはインシデント管理。"},{"id":"Q15-02","chapter":15,"kind":"applied","q":"毎日0時にバックアップし午後15時の障害で前日0時のデータまでしか戻せない。データ損失時間は。","options":["9時間","15時間","24時間","39時間"],"correct":3,"explain":"前日0時から当日15時なので39時間。最終バックアップ時刻を確認する。"},{"id":"Q15-03","chapter":15,"kind":"applied","q":"RTO=4時間の意味として適切なのは。","options":["データを4時間前まで戻す","目標として4時間以内に復旧する","障害は4時間に一回起こる","平均修理時間が常に4時間"],"correct":1,"explain":"RTOは復旧するまでの目標時間。"},{"id":"D15-01","chapter":15,"kind":"applied","q":"30日間のSLA稼働率99.9%で、計画停止等を除外しない単純計算の許容停止時間はどれか。","options":["4.32分","43.2分","72分","432分"],"correct":1,"explain":"30×24×60×(1−0.999)=43.2分。測定定義により実際のSLAの扱いは変わる。"},{"id":"D15-02","chapter":15,"kind":"applied","q":"DB接続枯渇でサービス停止中、接続プール拡張で暫定復旧する活動は何に近いか。","options":["インシデント管理","特許調査","研究開発","商標登録"],"correct":0,"explain":"早期のサービス復旧がインシデント管理の主目的。接続リークの根本原因調査は問題管理。"},{"id":"D15-03","chapter":15,"kind":"applied","q":"SLOとSLIの関係として適切なものはどれか。","options":["両方とも請求書","SLOは目標値、SLIは測定指標","SLOは測定値、SLIは目標値","両者は常に一致する"],"correct":1,"explain":"目標と観測値を区別し、SLA等で合意内容と測定方式を管理する。"},{"id":"Q-15-X01","chapter":15,"kind":"applied","q":"停電時に瞬時の電力供給を維持する設備は？","options":["DNS","UPS","WAF","CMDB"],"correct":1,"explain":"UPS。長時間運転には別途発電設備などを組み合わせる。"},{"id":"U-15-1","chapter":15,"kind":"applied","q":"サービス提供者と利用者の間でサービス水準を合意するものは？","options":["SLM","SLA","CMDB","WBS"],"correct":1,"explain":"SLAはService Level Agreement（サービスレベル合意）。SLMは水準管理。"},{"id":"U-15-2","chapter":15,"kind":"applied","q":"同一原因による障害再発を減らすため原因を分析する管理は？","options":["インシデント管理のみ","サービス要求管理","問題管理","容量管理"],"correct":2,"explain":"問題管理は根本原因の特定と再発防止を担う。"},{"id":"U-15-3","chapter":15,"kind":"applied","q":"利用者の問合せや障害報告を受け付ける一元窓口は？","options":["構成管理台帳","監査部門","DBMS","サービスデスク"],"correct":3,"explain":"サービスデスクは利用者との接点として問合せや要求を扱う。"},{"id":"U-15-X01","chapter":15,"kind":"applied","q":"電源、空調、入退室など施設設備を管理する活動は？","options":["ファシリティマネジメント","問題管理のみ","構成管理のみ","データ正規化"],"correct":0,"explain":"施設・設備を管理し、サービス運用の基盤を支える。"}],"deepIntro":"サービス管理は障害を直すだけでなく、利用者へ約束した価値を継続的に提供する営み。","deep":[{"id":"15-1","title":"ITIL・サービス価値・SLA","explain":"\u003cp>ITIL（Information Technology Infrastructure Library：ITサービス管理の実践指針）はサービスの価値共創、継続的改善、インシデント管理などを整理する。SLA（Service Level Agreement：サービス水準合意）は顧客と提供者の間で利用できる時間、応答時間、サポート範囲、測定方法などを定める合意。SLO（Service Level Objective：サービス目標値）は具体的な目標、SLI（Service Level Indicator：サービス指標）は実際の測定値。\u003c/p>\n\u003cp>合意値が99.9%なら、月30日で許容停止時間は30×24×60×0.001＝43.2分。ただし計画停止を含むかなどはSLA定義に依存する。「何を分母とするか」が重要。\u003c/p>\n","worked":"\u003cp>30日間で無停止を要求するなら99.9%のSLAは不十分。実稼働時間の定義、監視地点、計画停止除外の規則を確認し、現実的な合意にする。\u003c/p>\n","prompt":"SLOとSLIは同じか。","answer":"\u003cp>違う。SLOが目標、SLIが観測された指標。\u003c/p>\n","beginner":{"scenario":"月30日で稼働率99.9%の合意なら許容停止時間は30×24×60×0.001＝43.2分。対象外時間の条件があれば別途考える。","trap":"SLAは合意、SLMはその合意を管理する活動。測定条件も重要。","quizId":"U-15-1"}},{"id":"15-2","title":"インシデント・問題・変更管理","explain":"\u003cp>インシデントはサービスの中断や品質低下など、通常運用からの逸脱。最優先は早期のサービス復旧で、原因が未解明でも暫定回避策を使うことがある。問題管理は繰り返す障害等の根本原因を調査し、再発防止を図る。インシデント解決と根本原因除去は別の活動。\u003c/p>\n\u003cp>変更管理は本番変更のリスク・影響を評価し、承認・実施・結果を記録する。構成管理データベース（CMDB：Configuration Management Database）は構成アイテムと依存関係を管理し、障害影響や変更範囲の把握に役立つ。\u003c/p>\n","worked":"\u003cp>DB接続が枯渇し応答不能になった際、接続プールを一時拡張してサービス復旧するのはインシデント対応。接続リークをコード修正して再発を防ぐのは問題管理・変更管理にも関わる。\u003c/p>\n","prompt":"障害の原因が分かるまでサービス復旧を待つべきか。","answer":"\u003cp>必ずしもそうではない。影響・証拠保全を考慮しつつ暫定復旧と原因調査を並行する。\u003c/p>\n","beginner":{"scenario":"ネット通販が停止したらまず復旧し、繰返す障害なら原因を調べ、恒久修正は影響評価・承認してから配布する。","trap":"インシデント管理の主目的は早期復旧。原因究明は問題管理。","quizId":"U-15-2"}},{"id":"15-3","title":"キャパシティ・可用性・継続性・サービスデスク","explain":"\u003cp>キャパシティ管理は現在と将来の需要に対し資源が不足しないよう容量を計画する。可用性管理は単一障害点の分析や冗長化、保守計画で利用可能性を高める。サービス継続性管理は大規模障害・災害でも重要業務を再開するための計画・訓練。RTO・RPOは業務要件と技術的制約をつなぐ指標。\u003c/p>\n\u003cp>サービスデスクは利用者からの問合せやインシデント報告の窓口となり、優先度を付け、進捗と利用者への通知を管理する。優先度は一般に影響度と緊急度を組み合わせて決める。件数だけでなく復旧時間、一次解決率、満足度も計測する。\u003c/p>\n","worked":"\u003cp>1人の管理者にだけ影響する表示崩れより、全社の決済停止の方が影響度が大きい。緊急度と合わせて優先度を判定する。\u003c/p>\n","prompt":"障害対応の件数が少なくなれば品質が必ず改善したか。","answer":"\u003cp>判断できない。報告の欠落やユーザー数の変化を考える。\u003c/p>\n","beginner":{"scenario":"現在のCPU使用率が低くても来月の利用者増加で容量不足になるかもしれない。需要予測・監視で必要資源を計画する。","trap":"可用性管理と災害時のサービス継続管理は関連するが目的が異なる。","quizId":"U-15-3"}},{"id":"15-X01","title":"サービス管理システム・評価・設備","explain":"\u003cp>ITIL（ITサービス管理の実践体系）はサービス価値を重視する。ISO/IEC 20000-1はサービスマネジメントシステムの要求事項。サービスカタログは利用可能なサービスを示し、SLA（サービスレベル合意）は提供条件、SLO（サービスレベル目標）は測定目標を表す。サービス要求、構成、リリース、変更、インシデント、問題、供給者、可用性、容量、継続性を管理する。\u003c/p>\u003cp>PDCA（計画・実行・評価・改善）で運用を改善する。サービスデスクは利用者窓口、監視は異常を検知する。ファシリティマネジメントは電源・空調・設備・入退室・防災などを管理する。UPS（無停電電源装置）は停電直後の電力を一時供給し、自家発電への切替や安全停止を支援する。\u003c/p>","worked":"\u003cp>月30日の稼働率目標99.9%なら許容停止時間は43.2分（全時間が対象の場合）。\u003c/p>","prompt":"停電時に瞬時の電力供給を維持する設備は？","answer":"\u003cp>UPS。長時間運転には別途発電設備などを組み合わせる。\u003c/p>","beginner":{"scenario":"停電時にUPSがすぐ給電し、長期停電では発電機へ切替えるか安全に停止する。空調停止でもサーバ温度上昇に注意する。","trap":"UPSは通常、無期限に電力を供給する装置ではない。","quizId":"U-15-X01"}}],"beginnerIntro":"完成したシステムを安定提供する仕事を学ぶ。サービス水準、復旧、原因分析、変更、設備を目的別に整理する。"},{"id":16,"title":"システム監査・内部統制","group":"マネジメント","priority":"B選択候補","summary":"独立した評価、監査証拠、職務分掌、内部統制、改善提案。","lessons":[{"title":"監査の目的","body":"システム監査は情報システムのリスクに対する管理状況等を独立・客観的に評価し、保証や助言を提供する。監査人は業務執行そのものを代行しない。","check":"監査対象を自分で運用し自分で評価すると独立性が損なわれる。"},{"title":"監査手続","body":"リスク評価→監査計画→証拠収集（文書閲覧・インタビュー・観察・再実施など）→評価→報告→フォローアップ。証拠は十分性・適切性を判断する。","check":"担当者の口頭説明だけでは弱い場合がある。"},{"title":"内部統制","body":"業務の有効性・効率性、財務報告の信頼性、法令遵守、資産保全などを支える仕組み。職務分掌は申請・承認・実行などの権限を分離し不正リスクを減らす。","check":"統制目的に対して設計・運用が機能しているか検証。"},{"title":"監査意見","body":"発見事項には事実・基準・原因・影響・改善提案を示す。経営層が受け入れたリスクも明確に記録する。","check":"監査報告は命令ではなく、改善の実施責任は基本的に被監査側。"}],"terms":[{"term":"システム監査","definition":"情報システムのリスク管理などを独立して検証・評価する活動"},{"term":"監査証拠","definition":"監査人の判断や結論を裏付ける情報"},{"term":"独立性","definition":"監査対象から不当な影響を受けずに判断できる性質"},{"term":"客観性","definition":"先入観や利益相反に左右されず公平に評価する性質"},{"term":"職務分掌","definition":"申請・承認・実行等の業務権限を分ける統制"},{"term":"内部統制","definition":"組織の目標達成を支える方針・手続・仕組み"},{"term":"監査調書","definition":"監査手続・証拠・判断を記録した文書"},{"term":"フォローアップ","definition":"指摘に対する改善状況を後から確認する活動"},{"term":"リスクアプローチ","definition":"重要なリスクに監査資源を重点配分する方法"}],"questions":[{"id":"Q16-01","chapter":16,"kind":"applied","q":"監査人の独立性に問題があるのは。","options":["アクセス記録を調べる","自ら構築・運用した統制をそのまま独立評価する","資料を閲覧する","経営者へ意見を述べる"],"correct":1,"explain":"自己監査となり客観的な評価が難しい。"},{"id":"Q16-02","chapter":16,"kind":"applied","q":"不正送金の抑止として最も直接的な内部統制は。","options":["送金申請と承認を別人にする","送金データを毎年削除する","送金担当のみに全権限を渡す","ログを取得しない"],"correct":0,"explain":"職務分掌で一人の権限集中を避ける。"},{"id":"Q16-03","chapter":16,"kind":"applied","q":"監査後に改善実施状況を確認する活動は。","options":["スコープ定義","フォローアップ","プログラム開発","容量計画"],"correct":1,"explain":"指摘への対応結果を後から確認する。"},{"id":"D16-01","chapter":16,"kind":"applied","q":"監査対象部門の管理者が「権限を毎月見直している」と述べたとき、監査人が最優先で確認するものはどれか。","options":["管理者の役職名だけ","第三者の噂","実施記録・承認履歴等の証拠","監査人の気分"],"correct":2,"explain":"主張だけでなく、十分かつ適切な監査証拠を収集する。"},{"id":"D16-02","chapter":16,"kind":"applied","q":"申請・承認・支払実行を別担当にする内部統制は何か。","options":["職務分掌","暗号化","キャッシュ制御","標本化"],"correct":0,"explain":"複数役割で牽制することで単独の不正・誤りを抑える。"},{"id":"D16-03","chapter":16,"kind":"applied","q":"高リスクな管理者アカウント10件を重点抽出して問題がなかった場合に妥当な結論はどれか。","options":["全社の全権限が完全に適正","抽出対象では問題が見られなかったが全件には一般化できない","監査手続が不要","ログが不要"],"correct":1,"explain":"重点抽出は高リスク対象に有効だが、全母集団を代表するとは限らない。"},{"id":"Q-16-X01","chapter":16,"kind":"applied","q":"本番プログラム変更の承認手続は主にどちらか。","options":["IT全般統制","業務処理統制","財務分析","マーケティング"],"correct":0,"explain":"IT全般統制。"},{"id":"U-16-1","chapter":16,"kind":"applied","q":"監査人が評価の対象となる業務の実施責任を兼ねない主な理由は？","options":["監査費用を増やすため","独立性を確保するため","開発速度を上げるため","監査範囲を狭めるため"],"correct":1,"explain":"自己の業務を自分で評価する利害関係を避け、客観性を保つ。"},{"id":"U-16-2","chapter":16,"kind":"applied","q":"同じ担当者が申請・承認・支払をすべて行える問題への直接的対策は？","options":["圧縮率向上","バックアップの頻度増加のみ","職務分掌","業務処理速度向上"],"correct":2,"explain":"担当と権限を分離し、一人で不正を完結しにくくする。"},{"id":"U-16-3","chapter":16,"kind":"applied","q":"監査指摘に対する改善措置が実施されたか後日確認する手続は？","options":["要件定義","単体テスト","投資評価","フォローアップ"],"correct":3,"explain":"監査後の改善状況を確認する。"},{"id":"U-16-X01","chapter":16,"kind":"applied","q":"取引入力時の必須項目や金額の妥当性チェックは主に何に当たるか？","options":["業務処理統制","IT全般統制のみ","監査人の独立性","財務分析"],"correct":0,"explain":"個別業務で入力・処理の正確性を確保する統制。"}],"deepIntro":"監査で求めるのは「適切に管理されたという証拠」であり、担当者の主張だけではない。","deep":[{"id":"16-1","title":"監査の目的・独立性・監査証拠","explain":"\u003cp>システム監査は情報システムに関するリスクと管理状況を独立・客観的に評価し、改善を助言する活動。監査人は対象部門から独立して判断し、経営者や担当部門の管理責任を肩代わりしない。監査計画では目的・対象・範囲・基準・手続・時期を明確にし、重要性とリスクを考えて優先度を決める。\u003c/p>\n\u003cp>監査証拠は十分かつ適切である必要がある。口頭説明だけでなく、承認記録、ログ、操作証跡、設定、実地観察、サンプル抽出、再実施結果などを照合する。発見事項は基準・事実・原因・影響・改善提案を分けて記載する。\u003c/p>\n","worked":"\u003cp>「全従業員のアクセス権を毎月見直している」と担当者が述べても、実施証拠としてレビュー一覧・承認履歴・権限変更記録を確認する。記録の欠落を見つけたら影響範囲を調べる。\u003c/p>\n","prompt":"監査人が改善策を自ら実装し、その実装を自ら監査してよいか。","answer":"\u003cp>独立性・客観性を損なう恐れがあるため不適切。実装責任は被監査側にある。\u003c/p>\n","beginner":{"scenario":"監査人は「退職者IDを即日削除する」という規程と、実際の退職者一覧・ID無効化ログを照合する。","trap":"規程があるだけでは統制が運用されている証拠にならない。","quizId":"U-16-1"}},{"id":"16-2","title":"内部統制・職務分掌・リスク対応","explain":"\u003cp>内部統制は業務の有効性・効率性、財務報告等の信頼性、法令遵守、資産保全を支える仕組み。職務分掌は「申請・承認・実行・検証」を複数の役割に分け、不正や誤りの見逃しを減らす。アクセス権の定期棚卸し、変更承認、ログ保存、バックアップテストは代表的な統制。\u003c/p>\n\u003cp>予防的統制は不正を起こしにくくし、発見的統制は発生した異常を検知する。両方を設計することで制御の欠陥を補い合う。内部統制には人的誤り・共謀・権限濫用・費用対効果など限界があり、完全な保証ではない。\u003c/p>\n","worked":"\u003cp>仕入先登録と支払承認を同じ担当者ができると架空取引を承認できるリスクがある。担当を分け、支払先変更の承認・記録を残すことで低減する。\u003c/p>\n","prompt":"毎日ログを取っているだけで不正の発見統制は完成か。","answer":"\u003cp>ならない。ログの保全、監視ルール、異常調査、対応が必要。\u003c/p>\n","beginner":{"scenario":"購入申請、承認、支払、照合を別担当にすれば、一人が架空請求を作り支払って隠すことを難しくできる。","trap":"職務分掌だけでは共謀や権限悪用を完全には防げない。","quizId":"U-16-2"}},{"id":"16-3","title":"監査計画・サンプリング・フォローアップ","explain":"\u003cp>全件を調べられないとき、監査では標本抽出により対象を検証する。無作為抽出は代表性を重視し、重点抽出は高リスク項目を集中的に調べるが、結果の一般化には制限がある。リスク評価に応じて対象システムと監査手続を選び、検出できなかったリスクも含めて結論を検討する。\u003c/p>\n\u003cp>監査後の改善提案は被監査部門が対応計画を立て、監査側がフォローアップを行い改善状況を確認する。監査報告では証拠に裏付けられた事実と推測を区別し、改善要請の優先度を示す。\u003c/p>\n","worked":"\u003cp>高リスクな本番管理者アカウントだけ10件を重点抽出して全件適切でも、「全ユーザー権限が適正」とは結論できない。抽出範囲に見合う表現にする。\u003c/p>\n","prompt":"監査証拠を得られない場合、適切に管理されていると判断してよいか。","answer":"\u003cp>よくない。証拠不十分という監査上の制限を記録する。\u003c/p>\n","beginner":{"scenario":"1000件の変更申請からサンプルを抽出し、承認記録・本番反映時刻を照合する。例外があれば母集団への影響も検討する。","trap":"少数の正常サンプルだけで全件正常と断定しない。","quizId":"U-16-3"}},{"id":"16-X01","title":"内部統制と具体的な監査手続","explain":"\u003cp>IT全般統制は開発・変更・アクセス・運用など、複数業務システムの信頼性を支える共通統制。業務処理統制は個別業務の入力・処理・出力の正確性、完全性、承認を確保する。内部統制には業務の有効性・効率性、報告の信頼性、法令遵守、資産保全などの目的がある。\u003c/p>\u003cp>監査では質問、観察、閲覧、再実施、サンプリング、監査ツールによるデータ分析を使い、統制が設計されているか、実際に運用されているかを分けて評価する。監査人は独立性を保ち、改善の実施責任は監査対象側にある。\u003c/p>","worked":"\u003cp>退職者IDの無効化手続はIT全般統制、販売伝票の金額自動照合は業務処理統制。\u003c/p>","prompt":"本番プログラム変更の承認手続は主にどちらか。","answer":"\u003cp>IT全般統制。\u003c/p>","beginner":{"scenario":"本番変更の承認手続は複数システム共通のIT全般統制。注文金額が数量×単価と一致する自動確認は個別業務の処理統制。","trap":"共通基盤の統制と個別処理の統制は目的が異なるが互いに関係する。","quizId":"U-16-X01"}}],"beginnerIntro":"組織が定めた仕組みが実際に機能するかを独立した立場から検証する。規程・証拠・実態を区別する。"},{"id":17,"title":"システム戦略","group":"ストラテジ","priority":"A重要","summary":"業務改革、IT戦略、EA、クラウド・外部委託の効果とリスク。","lessons":[{"title":"経営とITの整合","body":"情報システム戦略は経営目標から逆算し、何をITで変えるか、どの指標で成果を測るかを定める。導入技術自体を目的にしない。","check":"IT投資効果は売上だけでなく品質・時間・リスクも含める。"},{"title":"業務プロセス改革","body":"BPR（Business Process Re-engineering：業務プロセス再設計）は既存の業務を抜本的に見直す。BPM（Business Process Management：業務プロセス管理）は継続的な測定・改善を重視。","check":"現行の非効率な業務をそのままシステム化しない。"},{"title":"EAと全体最適","body":"EA（Enterprise Architecture：エンタープライズアーキテクチャ）は業務、データ、アプリ、技術を組織全体で整合させる枠組み。部分最適によるデータの分断を回避する。","check":"各部門で指標が異なれば共通データ定義が必要。"},{"title":"サービス調達","body":"SaaS（Software as a Service：ソフトウェア提供サービス）、PaaS（Platform as a Service：開発実行基盤提供サービス）、IaaS（Infrastructure as a Service：基盤提供サービス）の責任分担を理解する。","check":"クラウド事業者がすべてのセキュリティ責任を負うわけではない。"}],"terms":[{"term":"情報システム戦略","definition":"経営目的を実現する情報システムの方針と計画"},{"term":"BPR","definition":"業務プロセスを抜本的に見直し再設計すること"},{"term":"BPM","definition":"業務プロセスを継続的に把握・改善する管理手法"},{"term":"EA","definition":"業務・データ・アプリ・技術を全社横断で設計する枠組み"},{"term":"SaaS","defini
