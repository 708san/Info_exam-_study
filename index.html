 #a8d7d3;border-radius:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-direction:column}.flash strong{font-size:clamp(20px,4vw,29px)}.flash small{color:var(--muted);margin-top:14px}.case-pass{background:#f5f8fa;border:1px solid #e1e7ee;padding:18px;border-radius:11px;white-space:pre-wrap}.answerbox{width:100%;border:1px solid #ccd6dd;border-radius:10px;min-height:80px;padding:12px;resize:vertical;background:#fff}.rubric{background:#e9f5f0;border-left:3px solid #198468;padding:14px;margin:12px 0;border-radius:6px}.tagline{font-size:12px;color:#56737e;font-weight:700}.timeline{display:grid;gap:8px}.week{display:grid;grid-template-columns:120px 1fr;gap:15px;border-bottom:1px solid var(--line);padding:13px 2px}.week b{color:#19435a}.formula{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;border-bottom:1px solid var(--line);padding:9px 0}.formula code{background:#eef4f6;white-space:normal;word-break:break-word;padding:3px 8px;border-radius:6px;color:#1d6072}.timer{padding:7px 12px;background:#f4e8da;border-radius:9px;font-weight:800;color:#99551e;display:inline-block}.warn{color:#94521f;background:#fbf0df;padding:11px 13px;border-radius:10px;font-size:13px}.btnline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.notice{font-size:12px;color:#647386}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}footer{padding:25px 0;color:#78889a;font-size:12px}.filter{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.search{width:100%;border:1px solid #cbd6df;border-radius:10px;padding:11px 13px;margin:10px 0 15px}.hidden{display:none!important}@media(max-width:850px){.layout{display:block}aside{position:sticky;top:58px;height:auto;display:flex;overflow-x:auto;white-space:nowrap;padding:7px 12px;border-bottom:1px solid var(--line);border-right:0;z-index:20;box-shadow:0 3px 8px #00000008}.side-label,.aside-note{display:none}.nav{width:auto;flex-shrink:0;margin:0 3px;padding:8px 11 <script id="course-data" type="application/json">{"title":"応用情報技術者 2027年3月対策｜学習＆演習","version":"1.0 / 2026-11-23","chapters":[{"id":1,"title":"基礎理論・数学","group":"テクノロジ","priority":"A重要","summary":"2進数、論理演算、確率、待ち行列、符号化、情報量など、計算問題の共通土台。","lessons":[{"title":"数の表現","body":"2進数の各桁は2の累乗。整数13は1101₂。負の整数は通常2の補数で表し、8ビットの−5は00000101を反転して1を足すので11111011。nビットの符号付き整数の範囲は−2^(n−1)〜2^(n−1)−1。","check":"符号付きと符号なしで範囲が違う。"},{"title":"論理と集合","body":"AND（論理積）は両方真のときだけ真、OR（論理和）はどちらかが真、XOR（排他的論理和）は異なるとき真。ド・モルガンの法則は NOT(A AND B) = (NOT A) OR (NOT B)。","check":"論理式は真理値表で必ず照合。"},{"title":"確率と期待値","body":"独立な事象がともに起きる確率は積。排反事象の「いずれか」は和。期待値は結果×確率の総和。条件付き確率はP(A|B)=P(A∩B)/P(B)。","check":"独立と排反を混同しない。"},{"title":"情報量と誤り検出","body":"同じ確率のN通りを識別するにはlog₂Nビット。パリティビットは奇数個の誤りを検出できるが単独で訂正はできない。ハミング距離dなら最大d−1個の誤りを検出し、⌊(d−1)/2⌋個を訂正。","check":"検出できる数と訂正できる数は異なる。"},{"title":"待ち行列","body":"平均到着率λ、平均サービス率μの安定なM/M/1では利用率ρ=λ/μ<1、平均系内滞在時間W=1/(μ−λ)。リトルの法則L=λWは一般的な定常系で成立。","check":"待ち時間（待機だけ）と滞在時間（処理を含む）を区別。"}],"terms":[{"term":"2の補数","definition":"負数をビット反転して1を足した形で表す方式"},{"term":"オーバーフロー","definition":"計算結果が表現可能な範囲からはみ出すこと"},{"term":"排他的論理和","definition":"入力の真偽が異なる場合だけ真となる演算"},{"term":"ド・モルガンの法則","definition":"論理積や論理和の否定を相互に変換する法則"},{"term":"条件付き確率","definition":"別の事象が起きた条件での確率"},{"term":"期待値","definition":"各結果に発生確率を乗じた値の総和"},{"term":"エントロピー","definition":"情報の不確実性の平均量"},{"term":"ハミング距離","definition":"二つの符号語で異なるビット位置の数"},{"term":"リトルの法則","definition":"平均系内数は平均到着率と平均滞在時間の積"},{"term":"M/M/1","definition":"到着と処理が指数分布で一つの処理窓口を持つ待ち行列モデル"}],"questions":[{"id":"Q01-01","chapter":1,"kind":"applied","q":"8ビットの2の補数で表せる最大整数はどれか。","options":["127","128","255","256"],"correct":0,"explain":"符号ビット1個を除く7ビットで正の最大は2^7−1=127。"},{"id":"Q01-02","chapter":1,"kind":"applied","q":"独立な装置AとBの稼働確率が0.9と0.8のとき、両方稼働する確率は。","options":["0.72","0.80","0.90","0.98"],"correct":0,"explain":"独立なら積を取るので0.9×0.8=0.72。"},{"id":"Q01-03","chapter":1,"kind":"applied","q":"毎秒8件到着し毎秒10件処理できるM/M/1の平均系内滞在時間は。","options":["0.1秒","0.2秒","0.5秒","2秒"],"correct":2,"explain":"1/(μ−λ)=1/(10−8)=0.5秒。"}]},{"id":2,"title":"アルゴリズム・プログラミング","group":"テクノロジ","priority":"B選択候補","summary":"データ構造・計算量・再帰・探索・整列・擬似言語を「手を動かして追う」。","lessons":[{"title":"計算量の考え方","body":"入力サイズnを増やしたときの処理の増加をO記法で表す。1回のループは概ねO(n)、二重ループはO(n²)、半分ずつ絞る二分探索はO(log n)。ただしループの範囲と条件を実際に確認する。","check":"表面上の二重ループでも常にO(n²)とは限らない。"},{"title":"主要なデータ構造","body":"スタックはLIFO（Last In First Out：後入れ先出し）、キューはFIFO（First In First Out：先入れ先出し）。連結リストは挿入・削除しやすいが位置への直接アクセスは苦手。","check":"ランダムアクセス、先頭操作、検索の計算量を区別。"},{"title":"探索とソート","body":"線形探索は順に見る。二分探索は整列済み配列の中央と比較して範囲を半分にする。マージソートはO(n log n)、クイックソートは平均O(n log n)でも最悪O(n²)の実装がある。","check":"二分探索の前提は整列済み。"},{"title":"再帰と動的計画法","body":"再帰は自分自身を呼ぶ処理で終了条件が必須。動的計画法は重複する部分問題の答えを保存して再利用し計算量を減らす。","check":"再帰の呼び出し順・戻り順を紙に書く。"},{"title":"擬似言語の追跡","body":"変数の更新順、添字の始点、ループ条件、整数除算を明記したトレース表を作る。短いコードを暗算しない。配列の範囲外アクセスや条件の境界値を確認。","check":"科目Bでは表の値を丁寧に追うことが得点に直結。"}],"terms":[{"term":"スタック","definition":"最後に追加した要素を最初に取り出すデータ構造"},{"term":"キュー","definition":"最初に追加した要素を最初に取り出すデータ構造"},{"term":"ハッシュ表","definition":"キーから計算した位置を用いて高速に検索する構造"},{"term":"二分探索","definition":"整列したデータの探索区間を半分ずつ狭める方法"},{"term":"計算量O記法","definition":"入力サイズ増加に対する計算資源増加の上限の尺度"},{"term":"安定ソート","definition":"等しいキーの要素の前後関係を保存する整列"},{"term":"再帰","definition":"処理の中で同じ処理を呼び出す構造"},{"term":"動的計画法","definition":"部分問題の結果を保存し再利用するアルゴリズム設計法"},{"term":"幅優先探索","definition":"近い階層から順に頂点を調べるグラフ探索"},{"term":"深さ優先探索","definition":"可能な限り深く進んでから戻るグラフ探索"}],"questions":[{"id":"Q02-01","chapter":2,"kind":"applied","q":"整列済みの1000件を二分探索したとき最大比較回数の目安は。","options":["約10回","約100回","約500回","約1000回"],"correct":0,"explain":"2^10=1024なので、おおむね10回程度の比較で絞れる（実装上の境界で±1程度）。"},{"id":"Q02-02","chapter":2,"kind":"applied","q":"キューに3,5,7を順に追加し、2回取り出すと順番は。","options":["7,5","3,5","5,7","3,7"],"correct":1,"explain":"FIFOなので最初に入れた3、次に5。"},{"id":"Q02-03","chapter":2,"kind":"applied","q":"平均O(n log n)でも分割の偏りで最悪O(n²)となり得る整列法は。","options":["マージソート","ヒープソート","クイックソート","バブルソート"],"correct":2,"explain":"典型的なクイックソートはピボットの選び方によって極端に偏る。"}]},{"id":3,"title":"コンピュータ構成要素","group":"テクノロジ","priority":"A重要","summary":"CPU・メモリ・キャッシュ・入出力の性能を数値と構造で理解。","lessons":[{"title":"CPUの性能","body":"CPU（Central Processing Unit：中央処理装置）の実行時間は命令数×平均CPI÷クロック周波数。CPI（Cycles Per Instruction：命令当たりの平均クロック数）が小さいほど同条件では速い。","check":"クロック周波数だけでCPUの優劣を決めない。"},{"title":"パイプライン","body":"命令を取得・解読・実行などに分割し重ねて処理する。分岐やデータ依存で停止が起きる。分岐予測・アウトオブオーダ実行はその影響を緩和。","check":"1命令の遅延と処理量を区別。"},{"title":"メモリ階層","body":"レジスタ→キャッシュ→主記憶→補助記憶の順に一般に遅く大容量。局所性を利用してよく使うデータを高速な階層に置く。キャッシュ平均アクセス時間はヒット率とミス時の時間から求める。","check":"ヒット率が上がってもミスの費用が大きいと影響する。"},{"title":"入出力と割込み","body":"DMA（Direct Memory Access：直接メモリアクセス）はCPUが全データを逐次転送せずに入出力を行う仕組み。割込みは実行中の処理を一時中断し、優先すべき事象に対応。","check":"DMAと割込みは別の機構。"},{"title":"記憶装置","body":"SSD（Solid State Drive：半導体記憶装置）は機械的なシークが不要。RAIDは冗長化や性能向上のため複数ディスクを組み合わせるが、バックアップの代替ではない。","check":"RAID 0は冗長性なし。"}],"terms":[{"term":"CPI","definition":"1命令を実行するのに必要な平均クロック数"},{"term":"クロック周波数","definition":"1秒間に発生するクロック周期の数"},{"term":"パイプライン","definition":"命令実行の段階を重ねて処理量を増やす方式"},{"term":"キャッシュメモリ","definition":"主記憶より高速で頻用データを置く小容量の記憶"},{"term":"局所性","definition":"近い時間やアドレスの情報が繰り返し使われやすい性質"},{"term":"DMA","definition":"CPUを介さず機器と主記憶の間でデータ転送する仕組み"},{"term":"割込み","definition":"事象発生時に現在の処理を中断して別処理を行うこと"},{"term":"仮想記憶","definition":"補助記憶を用いて大きな論理アドレス空間を提供する仕組み"},{"term":"RAID 0","definition":"データを分散して読み書き性能を狙うが冗長性を持たない構成"},{"term":"RAID 1","definition":"同じ内容を複数のディスクに複製するミラーリング"}],"questions":[{"id":"Q03-01","chapter":3,"kind":"applied","q":"命令数10億、CPI=2、動作周波数2GHzのCPUの実行時間は。","options":["0.5秒","1秒","2秒","4秒"],"correct":1,"explain":"10^9×2/(2×10^9)=1秒。"},{"id":"Q03-02","chapter":3,"kind":"applied","q":"ヒット率90%、ヒット時1ns、ミス時101nsの平均アクセス時間は。","options":["1.1ns","10ns","11ns","91ns"],"correct":2,"explain":"0.9×1+0.1×101=11ns。なおミス時時間は合計時間という設定。"},{"id":"Q03-03","chapter":3,"kind":"applied","q":"RAIDに関する説明として正しいものは。","options":["RAID 0は耐障害性が高い","RAID 1は複製する","RAIDはバックアップ不要にする","RAID 5はディスク1台で構成する"],"correct":1,"explain":"RAID 1はミラーリング。誤削除などには別途バックアップが必要。"}]},{"id":4,"title":"システム構成・性能評価","group":"テクノロジ","priority":"A重要","summary":"可用性、冗長構成、稼働率、処理能力・信頼性を定量評価。","lessons":[{"title":"性能の3指標","body":"スループットは単位時間の処理件数、レスポンスタイムは要求から応答まで、ターンアラウンドタイムは投入から完了まで。ボトルネックは最も制約の強い資源。","check":"それぞれの時間の始点と終点を図にする。"},{"title":"可用性の算出","body":"稼働率A=MTBF/(MTBF+MTTR)。MTBF（Mean Time Between Failures：平均故障間隔）が大きくMTTR（Mean Time To Repair：平均修復時間）が小さいほど高い。","check":"MTBFと平均故障時間を混同しない。"},{"title":"直列と並列の冗長化","body":"独立した機器の直列システムは全台稼働が必要なので稼働率の積。並列冗長でどれか1台動けばよい場合は1−故障率の積。","check":"冗長化は故障が独立という前提に依存。"},{"title":"システム構成","body":"負荷分散は複数装置に仕事を分配し、フェイルオーバーは故障時に待機側へ切り替える。ホットスタンバイは迅速に切り替えやすいが費用がかかる。","check":"負荷分散と冗長化は関連するが同じではない。"},{"title":"容量計画","body":"最大負荷に余裕を持たせたサイジングを行い、実測値で予測を修正する。CPU使用率が高まると待ち時間が非線形に増える場合がある。","check":"ピーク時と平均時の両方を試算。"}],"terms":[{"term":"スループット","definition":"単位時間に処理できる仕事量"},{"term":"レスポンスタイム","definition":"要求を出してから応答が得られるまでの時間"},{"term":"ターンアラウンドタイム","definition":"処理依頼から結果全体が完了するまでの時間"},{"term":"MTBF","definition":"修理可能な装置の故障と故障の間の平均動作時間"},{"term":"MTTR","definition":"故障後の修理に要する平均時間"},{"term":"可用性","definition":"必要なときにシステムが利用できる度合い"},{"term":"フェイルオーバー","definition":"障害発生時に待機系へ自動・手動で切り替えること"},{"term":"ロードバランサ","definition":"複数のサーバーに処理負荷を振り分ける装置・機能"},{"term":"ホットスタンバイ","definition":"待機系を稼働状態で準備し迅速に切り替える構成"},{"term":"スケールアウト","definition":"サーバーなどの台数を増やして能力を拡張する方法"}],"questions":[{"id":"Q04-01","chapter":4,"kind":"applied","q":"MTBF=990時間、MTTR=10時間の稼働率は。","options":["90%","95%","99%","99.9%"],"correct":2,"explain":"990/(990+10)=0.99。"},{"id":"Q04-02","chapter":4,"kind":"applied","q":"独立して稼働率0.9の装置2台を並列にし1台動けばよい場合の稼働率は。","options":["0.81","0.90","0.95","0.99"],"correct":3,"explain":"両方停止する確率0.1×0.1=0.01を1から引く。"},{"id":"Q04-03","chapter":4,"kind":"applied","q":"応答時間は変わらず1秒間の処理完了数が増えたとき改善した指標は。","options":["稼働率","スループット","故障率","平均修復時間"],"correct":1,"explain":"単位時間の処理件数はスループット。"}]},{"id":5,"title":"オペレーティングシステム・ソフトウェア","group":"テクノロジ","priority":"A重要","summary":"プロセス、スレッド、排他制御、仮想記憶、ファイルシステム、OSS。","lessons":[{"title":"プロセスとスレッド","body":"プロセスは実行中のプログラムの資源単位。スレッドは同一プロセスでメモリ空間などを共有する実行単位で、共有状態に競合が起きる。","check":"スレッド間共有とプロセス間分離を区別。"},{"title":"排他制御とデッドロック","body":"排他制御は共有資源を同時に不整合な形で変更しないための仕組み。デッドロックは互いに資源の解放を待ち永久に進まない状態。資源獲得順序の統一が予防に有効。","check":"ロックの取得順序を具体例で追う。"},{"title":"スケジューリング","body":"ラウンドロビンは一定のタイムスライスごとにCPU利用を交代する。優先度方式では低優先度タスクの飢餓に注意。","check":"応答性とスループットはトレードオフ。"},{"title":"仮想記憶","body":"ページ単位に主記憶と補助記憶を入れ替える。ページフォールトは必要ページが主記憶にない状態。頻発するとスラッシングで性能が大きく下がる。","check":"ページングは容量拡張のため、キャッシュは速度改善のためという違いも押さえる。"},{"title":"OSSとライセンス","body":"OSS（Open Source Software：オープンソースソフトウェア）はライセンスに基づき利用・改変・再配布ができる。GPLは条件次第で派生作品のソース公開義務が生じる一方、MITは比較的緩やかなライセンス。","check":"OSSだから著作権がないわけではない。"}],"terms":[{"term":"プロセス","definition":"実行中プログラムの資源管理単位"},{"term":"スレッド","definition":"同一プロセス内で動く軽量な実行単位"},{"term":"セマフォ","definition":"共有資源にアクセスできる数を制御する同期手段"},{"term":"ミューテックス","definition":"相互排他のためのロック"},{"term":"デッドロック","definition":"複数処理が互いの資源解放を待ち停止する状態"},{"term":"ラウンドロビン","definition":"一定時間ごとに実行中タスクを切り替える方式"},{"term":"ページフォールト","definition":"必要な仮想記憶ページが主記憶上にない事象"},{"term":"スラッシング","definition":"ページの入替えが多発して処理性能が著しく落ちる状態"},{"term":"GPL","definition":"改変や再配布に一定のソース提供等の条件を付す自由ソフトウェアライセンス"},{"term":"ミドルウェア","definition":"OSとアプリケーションの間で共通機能を提供するソフトウェア"}],"questions":[{"id":"Q05-01","chapter":5,"kind":"applied","q":"デッドロックを予防する方法として適切なのは。","options":["資源取得順を全処理で統一する","ロック時間を無制限に延ばす","全処理の優先度を同じにする","スレッドを増やす"],"correct":0,"explain":"循環待ちが起こらない順序を定義する。"},{"id":"Q05-02","chapter":5,"kind":"applied","q":"ページフォールトが頻発しディスク交換ばかり行う現象は。","options":["キャッシュヒット","スラッシング","スプーリング","ポーリング"],"correct":1,"explain":"ページングが過度に発生すると処理が進まなくなる。"},{"id":"Q05-03","chapter":5,"kind":"applied","q":"スレッドに関して正しいのは。","options":["常に別の主記憶空間を持つ","同一プロセスで資源を共有し得る","スレッド間では競合しない","独立した実行単位ではない"],"correct":1,"explain":"同一プロセスのスレッドは共有メモリの競合に注意。"}]},{"id":6,"title":"ハードウェア・組込み基礎","group":"テクノロジ","priority":"A標準","summary":"論理回路・半導体・センサ・割込み・組込み制御を理解。","lessons":[{"title":"論理回路","body":"AND/OR/NOTに加えてNANDとNORは任意の論理回路を構成可能。フリップフロップは1ビットの状態を保持する基本回路。","check":"組合せ回路と順序回路を区別。"},{"title":"マイコンとリアルタイム性","body":"組込み機器のマイコンはセンサ入力を読み、計算し、アクチュエータを制御する。リアルタイムシステムでは正しい計算結果だけでなく期限内の結果が必要。","check":"速さだけでなく締切保証が重要。"},{"title":"電源・通信・省電力","body":"割込みでイベントを処理し、不要なときは省電力状態へ遷移。低消費電力の設計では通信頻度やセンサ計測周期も検討する。","check":"電力とエネルギーは別単位。"},{"title":"故障安全の設計","body":"フェイルセーフは故障時に安全側へ倒す考え方。フォールトトレラントは一部故障しても機能継続できるようにする設計。","check":"安全性とサービス継続性の目的差。"}],"terms":[{"term":"フリップフロップ","definition":"1ビットの状態を保持する順序回路"},{"term":"NAND","definition":"ANDの結果を否定した論理演算"},{"term":"組込みシステム","definition":"機器の特定用途に組み込まれた制御用システム"},{"term":"リアルタイムOS","definition":"処理の応答期限を意識したOS"},{"term":"センサ","definition":"温度・位置などの物理量を信号として取得する素子"},{"term":"アクチュエータ","definition":"電気信号などを動作・力に変える装置"},{"term":"フェイルセーフ","definition":"故障した際に危険を避ける側へ状態を移す設計思想"},{"term":"フォールトトレラント","definition":"部分的な故障があっても機能を継続できる性質"},{"term":"ウォッチドッグタイマ","definition":"処理の異常停止を検出し再起動等を行う監視機構"}],"questions":[{"id":"Q06-01","chapter":6,"kind":"applied","q":"制御プログラムが正しくても期限を超過すると失敗になる特性は。","options":["可搬性","リアルタイム性","保守性","移植性"],"correct":1,"explain":"時間制約の遵守が機能の一部。"},{"id":"Q06-02","chapter":6,"kind":"applied","q":"故障時にエレベータを停止させて安全を確保する設計は。","options":["フェイルセーフ","ロードバランシング","多重化","スケールアップ"],"correct":0,"explain":"不具合時に安全側に遷移する。"},{"id":"Q06-03","chapter":6,"kind":"applied","q":"1ビットの状態記憶に使う回路は。","options":["加算器","デコーダ","フリップフロップ","マルチプレクサ"],"correct":2,"explain":"順序回路の代表。"}]},{"id":7,"title":"ユーザーインタフェース・UX","group":"テクノロジ","priority":"A標準","summary":"使いやすさと利用者体験を要求・設計・評価に落とし込む。","lessons":[{"title":"UIとUX","body":"UI（User Interface：利用者との接点）は表示や操作系、UX（User Experience：利用者体験）は利用の前後を含む体験全体。見た目が美しくても目的を達成できなければUXは低い。","check":"似た言葉を同義扱いしない。"},{"title":"人間中心設計","body":"利用状況を理解→利用者要求を明確化→設計案→評価を反復する。ペルソナとユーザージャーニーで対象者と利用文脈を可視化。","check":"作り手の好みより実ユーザーの観察が重要。"},{"title":"評価方法","body":"ユーザビリティテストは代表利用者に操作してもらう。A/Bテストは条件を比較するが標本・割付・指標設計が必要。","check":"主観的な感想だけで定量性能を断定しない。"},{"title":"アクセシビリティ","body":"キーボード操作、読み上げ、色のみに依存しない表示、適切な文字コントラストなどで多様な利用者を支援する。","check":"色覚・身体条件だけでなく利用環境の違いにも配慮。"}],"terms":[{"term":"UI","definition":"画面や操作部などシステムと利用者の接点"},{"term":"UX","definition":"利用中だけでなく前後を含めた利用者の体験"},{"term":"ペルソナ","definition":"典型的な利用者像を具体化したモデル"},{"term":"ユーザージャーニー","definition":"利用者の行動や感情を時間順に可視化したもの"},{"term":"プロトタイプ","definition":"設計案を早期に検証するための試作品"},{"term":"アクセシビリティ","definition":"多様な利用者が利用可能であること"},{"term":"ユーザビリティ","definition":"目的を有効・効率的・満足して達成できる程度"},{"term":"ヒューリスティック評価","definition":"経験則に照らして画面などの問題を専門家が点検する方法"},{"term":"A/Bテスト","definition":"異なる二案を割り付けて成果指標を比較する実験"}],"questions":[{"id":"Q07-01","chapter":7,"kind":"applied","q":"画面の操作性だけでなく利用前後の期待や感情まで含む概念は。","options":["UI","UX","API","CPU"],"correct":1,"explain":"UXは利用体験全体を扱う。"},{"id":"Q07-02","chapter":7,"kind":"applied","q":"操作を色だけで区別させないのは主に何のためか。","options":["暗号強度を上げる","可用性を上げる","アクセシビリティを高める","帯域を増やす"],"correct":2,"explain":"色覚などに依存しない操作を支援する。"},{"id":"Q07-03","chapter":7,"kind":"applied","q":"ユーザビリティテストとして最も適切なのは。","options":["画面を開発者だけで確認する","代表利用者が課題を操作する様子を観察する","サーバー稼働率を測る","コードの静的解析をする"],"correct":1,"explain":"実利用者の課題達成状況を観察する。"}]},{"id":8,"title":"情報メディア","group":"テクノロジ","priority":"A標準","summary":"画像・音声・動画のデータ量、圧縮、色表現、著作権の基礎。","lessons":[{"title":"画像のデータ量","body":"非圧縮画像の概算サイズは横画素×縦画素×色深度÷8バイト。RGB各8ビットなら1画素24ビット。解像度とファイル容量は同義ではない。","check":"圧縮率を使うときは圧縮前後の定義を確認。"},{"title":"可逆・非可逆圧縮","body":"可逆圧縮は元の情報を完全復元可能。JPEGなどの一般的な非可逆圧縮では一部の情報が失われる。PNGは一般に可逆圧縮を利用する。","check":"拡張子だけで全ての設定を断定しない。"},{"title":"音声と動画","body":"PCM（Pulse Code Modulation：パルス符号変調）の非圧縮音声データ量は標本化周波数×量子化ビット数×チャネル数×時間÷8。動画ではフレームレートと解像度が容量に影響。","check":"ビット毎秒とバイト毎秒に注意。"},{"title":"色空間と描画","body":"RGBは光の三原色による加法混色、CMYKは印刷で使う減法混色。ベクタ画像は形状記述により拡大しても原理上輪郭が荒れにくい。","check":"ラスターとベクタの用途を区別。"}],"terms":[{"term":"ラスター画像","definition":"画素の並びで画像を表現する方式"},{"term":"ベクタ画像","definition":"点・線・曲線などの形状情報で画像を表現する方式"},{"term":"RGB","definition":"赤・緑・青の光を加えて色を表現する方式"},{"term":"CMYK","definition":"シアン・マゼンタ・黄・黒のインキで色を表す方式"},{"term":"可逆圧縮","definition":"情報を損なわず元データを再現できる圧縮"},{"term":"非可逆圧縮","definition":"一部の情報を失う代わりに圧縮効率を高める方式"},{"term":"PCM","definition":"音声振幅を標本化して量子化し符号化する方式"},{"term":"フレームレート","definition":"1秒間に表示する映像の静止画枚数"},{"term":"標本化周波数","definition":"1秒間のアナログ信号測定回数"}],"questions":[{"id":"Q08-01","chapter":8,"kind":"applied","q":"800×600画素で1画素24ビットの非圧縮画像の容量は。","options":["約0.48MB","約1.44MB","約4.8MB","約14.4MB"],"correct":1,"explain":"800×600×24÷8=1,440,000バイト≒1.44MB（10進表記）。"},{"id":"Q08-02","chapter":8,"kind":"applied","q":"元データを完全に復元できる圧縮方式は。","options":["非可逆圧縮","可逆圧縮","量子化のみ","サンプリングのみ"],"correct":1,"explain":"可逆は情報を失わない。"},{"id":"Q08-03","chapter":8,"kind":"applied","q":"CD品質の音声を想定し44.1kHz・16ビット・2チャンネル・10秒の非圧縮量は。","options":["約0.88MB","約1.76MB","約8.82MB","約17.64MB"],"correct":1,"explain":"44,100×16×2×10÷8=1,764,000バイト。"}]},{"id":9,"title":"データベース","group":"テクノロジ","priority":"B選択候補","summary":"ER図・正規化・SQL・結合・トランザクション・ロックを重点。","lessons":[{"title":"関係モデルとキー","body":"関係データベースは行と列からなる表で扱う。主キーは行を一意識別しNULL不可。外部キーは他表のキーを参照し参照整合性を支える。","check":"候補キー・主キー・外部キーを設計図上で明確にする。"},{"title":"正規化","body":"第1正規形は繰返し項目を排除、第2は複合主キーの一部にのみ依存する非キー属性を分離、第3は非キー属性を介した推移的関数従属を分離する。","check":"関数従属性を記号で書いて整理。"},{"title":"SQLの実行順序","body":"SQL（Structured Query Language：構造化問合せ言語）はFROM/JOIN→WHERE→GROUP BY→HAVING→SELECT→ORDER BYという論理的処理順序で考えると理解しやすい。WHEREはグループ化前、HAVINGは集約後の絞り込み。","check":"COUNT(*)とCOUNT(列)ではNULLの扱いが異なる。"},{"title":"結合","body":"内部結合は一致する行、左外部結合は左表の行を残す。一対多結合では件数が増えるのでCOUNTの集計粒度に注意する。","check":"LEFT JOIN後の右表条件をWHEREに置くと事実上内部結合になる場合がある。"},{"title":"ACIDと分離","body":"トランザクションのACIDは原子性・一貫性・独立性・永続性。分離レベルやロックでダーティリード・ノンリピータブルリード・ファントムリードを制御。","check":"「原子性」と「独立性」は異なる。"}],"terms":[{"term":"主キー","definition":"表の行を一意に識別しNULLを許さない列または列集合"},{"term":"外部キー","definition":"別の表の候補キー等を参照する列・列集合"},{"term":"関数従属","definition":"属性Xが決まると属性Yが一意に決まる関係"},{"term":"第2正規形","definition":"第1正規形かつ非キー属性の主キーの一部への部分関数従属がない状態"},{"term":"第3正規形","definition":"第2正規形を満たし非キー属性の推移的従属を除いた状態"},{"term":"INNER JOIN","definition":"結合条件を満たす行だけを結合するSQL操作"},{"term":"LEFT JOIN","definition":"左側の表の行を残し右表との一致を結合する操作"},{"term":"HAVING","definition":"GROUP BYで集約したグループに条件を掛ける句"},{"term":"ACID","definition":"トランザクションの原子性・一貫性・独立性・永続性"},{"term":"ダーティリード","definition":"未確定トランザクションの変更内容を読む現象"},{"term":"デッドロック","definition":"互いの資源やロックの解放を待ち続ける状態"},{"term":"B木インデックス","definition":"比較検索や範囲検索に適した平衡木型索引"}],"questions":[{"id":"Q09-01","chapter":9,"kind":"applied","q":"売上表から顧客ごとの売上合計が10万円以上の顧客だけ取り出すSQL句は。","options":["WHERE SUM(金額)>=100000","HAVING SUM(金額)>=100000","ORDER BY SUM(金額)>=100000","LIMIT SUM(金額)>=100000"],"correct":1,"explain":"集約後の条件はHAVINGに書く。"},{"id":"Q09-02","chapter":9,"kind":"applied","q":"主キー(注文番号,商品番号)の表で商品名が商品番号だけに従属する場合、問題となるのは。","options":["部分関数従属","外部結合","排他制御","可逆圧縮"],"correct":0,"explain":"複合キーの一部に従属するため第2正規形で分離を検討する。"},{"id":"Q09-03","chapter":9,"kind":"applied","q":"未コミットの別トランザクションの値を読んだ現象は。","options":["ファントムリード","ダーティリード","ロストアップデート","デッドロック"],"correct":1,"explain":"確定していないデータの読み取りはダーティリード。"}]},{"id":10,"title":"ネットワーク","group":"テクノロジ","priority":"B選択候補","summary":"TCP/IP、IPアドレス、ルーティング、DNS、TLSと障害切り分け。","lessons":[{"title":"階層とプロトコル","body":"IP（Internet Protocol）はネットワーク層で宛先までパケットを運ぶ。TCP（Transmission Control Protocol）は順序制御・再送等で信頼性を実現し、UDP（User Datagram Protocol）は簡潔で即時性を優先する用途に使う。","check":"TCPはコネクション型、UDPはコネクションレス。"},{"title":"サブネット","body":"IPv4の/24は先頭24ビットがネットワーク部で末尾8ビットがホスト部。一般的な/24の利用可能ホスト数は2^8−2=254。CIDR（Classless Inter-Domain Routing）は可変長のプレフィックスを指定する。","check":"/31や/32は用途が特殊なので一般式を無条件に当てない。"},{"title":"名前解決","body":"DNS（Domain Name System：ドメイン名システム）はドメイン名とIPアドレス等を対応。AレコードはIPv4、AAAAはIPv6、MXはメール配送先、CNAMEは別名。","check":"DNSの情報はTTL（生存時間）によりキャッシュされる。"},{"title":"Webと暗号化","body":"HTTPはWeb通信、HTTPSはHTTPをTLS（Transport Layer Security：通信の暗号化・認証）で保護したもの。TLSの証明書検証で通信相手の正当性を確認する。","check":"HTTPSは相手のWebサイトの内容まで安全保証するものではない。"},{"title":"障害切り分け","body":"IP疎通→名前解決→TCP接続→アプリ応答の順に確認。pingはICMP、tracerouteは経路を調べる手段だがICMPを遮断している場合は不通断定できない。","check":"「pingが失敗した＝必ず通信不可」ではない。"}],"terms":[{"term":"TCP","definition":"順序制御・再送制御などで信頼性を確保する転送層プロトコル"},{"term":"UDP","definition":"低い制御負荷でデータグラムを送る転送層プロトコル"},{"term":"IPアドレス","definition":"ネットワーク上の通信先を論理的に識別する番号"},{"term":"サブネットマスク","definition":"IPアドレスのネットワーク部を示すビットマスク"},{"term":"CIDR","definition":"可変長プレフィックスでIPアドレス範囲を表現する方式"},{"term":"DNS","definition":"名前とIPアドレスなどを対応付ける分散システム"},{"term":"NAT","definition":"ネットワークアドレスを変換する仕組み"},{"term":"DHCP","definition":"端末にIP設定を自動配布するプロトコル"},{"term":"TLS","definition":"通信相手の認証・暗号化・完全性を提供する仕組み"},{"term":"HTTP","definition":"Webでリクエストとレスポンスを交換するアプリ層プロトコル"},{"term":"VPN","definition":"共有網上で安全な仮想通信路を作る技術"},{"term":"ルーティング","definition":"宛先ネットワークに応じてパケットの転送先を選ぶこと"}],"questions":[{"id":"Q10-01","chapter":10,"kind":"applied","q":"192.168.10.0/26の通常のホスト用アドレス数は。","options":["30","62","64","126"],"correct":1,"explain":"ホスト部は6ビットで2^6−2=62。"},{"id":"Q10-02","chapter":10,"kind":"applied","q":"名前からIPv6アドレスを得たい。DNSのレコード種別は。","options":["A","MX","AAAA","PTR"],"correct":2,"explain":"AAAAはIPv6を示す。"},{"id":"Q10-03","chapter":10,"kind":"applied","q":"TCPとUDPの違いとして正しいのは。","options":["UDPは必ず順序保証する","TCPは再送制御を持つ","TCPは接続確立しない","UDPはIPを使わない"],"correct":1,"explain":"TCPは再送・順序制御などを提供する。"}]},{"id":11,"title":"情報セキュリティ","group":"テクノロジ","priority":"B必須","summary":"暗号・認証・脆弱性・ネットワーク防御・インシデント対応。必須の最重要領域。","lessons":[{"title":"CIAと脅威分析","body":"情報セキュリティの基本は機密性（Confidentiality）・完全性（Integrity）・可用性（Availability）。リスクは脅威・脆弱性・資産への影響を踏まえ評価。","check":"可用性はシステム稼働、完全性は無断改ざん防止。"},{"title":"共通鍵・公開鍵・ハッシュ","body":"共通鍵暗号は同じ秘密鍵で暗号化と復号。公開鍵暗号は公開鍵と秘密鍵のペア。ハッシュは固定長の要約であり復号不可。ディジタル署名では署名者の秘密鍵で署名し公開鍵で検証する。","check":"署名と暗号化で使用する鍵の向きを混同しない。"},{"title":"証明書と認証","body":"認証局CA（Certificate Authority）が発行する証明書を信頼の鎖で検証。多要素認証は知識・所持・生体など異なる要素を組み合わせる。パスワードと秘密の質問は同じ知識要素。","check":"二段階認証が必ず多要素とは限らない。"},{"title":"主要な脆弱性","body":"SQLインジェクションは入力がSQL構造を変える攻撃。対策はプレースホルダ等のパラメータ化クエリ。XSS（Cross-Site Scripting）はブラウザ側で不正スクリプトを実行し、出力時の適切なエスケープ等で防ぐ。CSRFは利用者の認証状態を悪用して意図しない要求を送らせる。","check":"入力検証と出力エスケープだけで全脅威を解決したと考えない。"},{"title":"防御の層と監視","body":"WAF（Web Application Firewall）はWebアプリへのリクエストを検査。IDS/IPSは侵入検知・防止。EDR（Endpoint Detection and Response）は端末上の挙動監視と対応。最小権限や多層防御を徹底。","check":"FW・WAF・EDRで監視する位置が異なる。"},{"title":"インシデント対応","body":"初動は影響範囲・証拠保全・封じ込め・根絶・復旧・再発防止を適切に計画。証拠ログの削除や無断の再起動は分析を妨げる場合がある。","check":"原因究明前に証拠が失われないよう保全する。"}],"terms":[{"term":"機密性","definition":"許可された人だけが情報にアクセスできる性質"},{"term":"完全性","definition":"情報が不正に改ざんされていない性質"},{"term":"可用性","definition":"必要なときに情報やサービスを利用できる性質"},{"term":"共通鍵暗号","definition":"暗号化と復号で同じ秘密鍵を用いる方式"},{"term":"公開鍵暗号","definition":"公開鍵と秘密鍵の組を利用する暗号方式"},{"term":"ハッシュ関数","definition":"入力から一方向の固定長要約値を作る関数"},{"term":"ディジタル署名","definition":"秘密鍵による署名と公開鍵による検証で真正性等を確認する仕組み"},{"term":"PKI","definition":"公開鍵と電子証明書の信頼関係を管理する基盤"},{"term":"多要素認証","definition":"異なる認証要素を二種類以上組み合わせる認証"},{"term":"SQLインジェクション","definition":"入力を通じて意図しないSQL文を実行させる攻撃"},{"term":"XSS","definition":"Webページに不正なスクリプトを混入し閲覧者のブラウザで実行させる攻撃"},{"term":"CSRF","definition":"認証中の利用者に意図しないWeb要求を送信させる攻撃"},{"term":"WAF","definition":"WebアプリへのHTTPリクエスト等を検査・遮断する装置や機能"},{"term":"EDR","definition":"端末上の不審な活動を検知して分析や対応を支援する技術"},{"term":"ゼロトラスト","definition":"接続元だけを信用せず要求ごとに検証・認可する設計思想"},{"term":"サプライチェーン攻撃","definition":"取引先や依存ソフトなどを踏み台に本来の標的を攻撃する手法"}],"questions":[{"id":"Q11-01","chapter":11,"kind":"applied","q":"ディジタル署名を検証する際に原則使用する鍵は。","options":["署名者の秘密鍵","署名者の公開鍵","受信者の秘密鍵","共通鍵"],"correct":1,"explain":"署名者の秘密鍵で署名し、対応する公開鍵で検証する。"},{"id":"Q11-02","chapter":11,"kind":"applied","q":"SQLインジェクションの根本的な対策として適切なのは。","options":["入力をすべて大文字化する","パラメータ化クエリを用いる","通信をHTTPに戻す","エラーログを無効化する"],"correct":1,"explain":"値とSQL文の構造を分離する。"},{"id":"Q11-03","chapter":11,"kind":"applied","q":"パスワードと秘密の質問を併用した認証は、一般に何要素か。","options":["1要素","2要素","3要素","4要素"],"correct":0,"explain":"いずれも知識要素であり、異なる要素の組み合わせではない。"}]},{"id":12,"title":"システム開発技術","group":"テクノロジ","priority":"B選択候補","summary":"要件定義、設計、テスト、品質指標、変更管理。","lessons":[{"title":"要件定義","body":"機能要件は「何ができるか」、非機能要件は性能・可用性・セキュリティ・運用など。関係者の要求を優先度と受入れ条件まで落とし込む。","check":"要件と設計手段（どう実装するか）を分ける。"},{"title":"設計の分割","body":"外部設計は利用者から見える仕様、内部設計は実現する構造。モジュールは凝集度を高く、結合度を低くすることで変更しやすくする。","check":"偶然的凝集は悪く、機能的凝集は良い。"},{"title":"テストと網羅","body":"単体→結合→システム→受入れという段階がある。命令網羅・分岐網羅・条件網羅は意味が異なり、境界値分析や同値分割を使う。","check":"命令網羅100%でもバグがないわけではない。"},{"title":"品質管理","body":"レビューや静的解析は実行前に欠陥を検出する。信頼性・性能効率性・保守性など品質特性ごとに測定指標を置く。","check":"検出した欠陥数の多さだけで品質の良し悪しを判断しない。"},{"title":"移行と保守","body":"切替方式は一斉移行・段階移行・並行運用など。切り戻し計画とデータ整合性確認を用意する。保守には是正・適応・完全化・予防がある。","check":"切替時点のデータ欠損や二重登録を防ぐ。"}],"terms":[{"term":"機能要件","definition":"システムが提供すべき機能や業務処理の要求"},{"term":"非機能要件","definition":"性能・信頼性・安全性・運用など機能以外の要求"},{"term":"モジュール凝集度","definition":"一つのモジュール内の機能がどれだけ密接に関連するか"},{"term":"モジュール結合度","definition":"モジュール同士の依存の強さ"},{"term":"単体テスト","definition":"個々の部品やモジュールの動作を確かめる試験"},{"term":"結合テスト","definition":"部品間のインタフェースや連携を検証する試験"},{"term":"境界値分析","definition":"値の範囲の境目とその近傍を重点的に試す手法"},{"term":"同値分割","definition":"同じ振る舞いと見なせる入力集合から代表値を選ぶ手法"},{"term":"分岐網羅","definition":"判断条件の真と偽の双方を実行する網羅基準"},{"term":"トレーサビリティ","definition":"要求から設計・実装・テストへ対応関係を追跡できること"},{"term":"受入れテスト","definition":"利用者などが業務要件を満たすか確認するテスト"}],"questions":[{"id":"Q12-01","chapter":12,"kind":"applied","q":"入力が1〜100の整数である画面の境界値分析として優先度が高い値の組は。","options":["20,40,60,80","0,1,100,101","10,30,50,70","5,15,25,35"],"correct":1,"explain":"有効・無効の境界近傍を選ぶ。"},{"id":"Q12-02","chapter":12,"kind":"applied","q":"変更容易性を高めるモジュールの性質は。","options":["凝集度低・結合度高","凝集度高・結合度低","凝集度低・結合度低のみ","凝集度高・結合度高"],"correct":1,"explain":"役割をまとめ依存を減らす。"},{"id":"Q12-03","chapter":12,"kind":"applied","q":"要件定義で「99.9%稼働させる」は何に分類されるか。","options":["業務ルール","機能要件","非機能要件","ユーザー操作"],"correct":2,"explain":"稼働率は可用性に関する非機能要件。"}]},{"id":13,"title":"ソフトウェア開発管理技術","group":"テクノロジ","priority":"A標準","summary":"アジャイル、ウォーターフォール、CI/CD、構成管理、ライセンス。","lessons":[{"title":"開発プロセス","body":"ウォーターフォールは工程を段階的に進める。アジャイルは短い反復で顧客価値と学習を重視する。どちらも要件変更や品質の管理は必要。","check":"アジャイル＝計画なし・文書なしではない。"},{"title":"Scrumの基本","body":"Scrum（スクラム）ではプロダクトバックログを順序付けし、スプリントで増分を生み、レビューとレトロスペクティブで改善する。","check":"デイリースクラムは単なる進捗報告会にしない。"},{"title":"構成・変更管理","body":"バージョン管理は履歴を保つ。変更要求は影響分析・承認・実装・検証を経て反映する。ベースラインを定め、要求とコードと成果物の整合性を確保。","check":"版番号だけでなく変更理由と承認を追えるようにする。"},{"title":"CI/CD","body":"CI（Continuous Integration：継続的インテグレーション）は頻繁な統合と自動テスト。CD（Continuous Delivery/Deployment：継続的デリバリ／デプロイ）はリリース可能な状態を維持し必要に応じ自動配備する。","check":"テストが成功しても運用品質まで完全保証されない。"}],"terms":[{"term":"ウォーターフォール","definition":"開発工程を段階的に進めるプロセスモデル"},{"term":"アジャイル開発","definition":"短い反復と継続的なフィードバックを重視する開発手法"},{"term":"スクラム","definition":"役割・イベント・作成物を定めたアジャイル開発の枠組み"},{"term":"スプリント","definition":"スクラムで成果の増分を作る一定期間の活動"},{"term":"プロダクトバックログ","definition":"製品で実現すべき項目を優先順に並べた一覧"},{"term":"CI","definition":"頻繁なコード統合とビルド・テストの自動化"},{"term":"CD","definition":"ソフトウェアの配布やデプロイを継続的に行えるようにする仕組み"},{"term":"構成管理","definition":"成果物の構成・版・変更履歴を管理すること"},{"term":"ベースライン","definition":"管理・変更の基準となる確定された成果物の状態"},{"term":"技術的負債","definition":"短期的な実装上の妥協などが将来の変更費用を増やす状態"}],"questions":[{"id":"Q13-01","chapter":13,"kind":"applied","q":"CIの主目的として最も適切なのは。","options":["テストを省く","統合時の不整合を早期に検出する","承認手続きをすべてなくす","セキュリティ事故を完全防止する"],"correct":1,"explain":"頻繁な統合と自動テストにより問題を早く発見する。"},{"id":"Q13-02","chapter":13,"kind":"applied","q":"スクラムで利用者価値の優先順位が付いた要求一覧は。","options":["プロダクトバックログ","監査調書","変更ログのみ","決算書"],"correct":0,"explain":"プロダクトバックログは製品の仕事を表す。"},{"id":"Q13-03","chapter":13,"kind":"applied","q":"構成管理に適切なのは。","options":["最新版のみ保持し履歴を削除","版と変更履歴を追跡可能にする","本番のみでコード管理する","修正要求をすべて自動承認する"],"correct":1,"explain":"追跡可能性と整合性を保つ。"}]},{"id":14,"title":"プロジェクトマネジメント","group":"マネジメント","priority":"B選択候補","summary":"WBS、PERT、クリティカルパス、EVM、リスク・品質・調達。","lessons":[{"title":"スコープとWBS","body":"WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を管理可能な単位に分解する。完了条件・責任分担・依存関係を明確にする。","check":"工数表とWBSは同一ではない。"},{"title":"工程とクリティカルパス","body":"PERT（Program Evaluation and Review Technique：工程計画・評価技法）のネットワーク図で最長の所要経路がクリティカルパス。この経路の遅延は余裕がなければ全体遅延につながる。","check":"並行タスクの所要時間は単純な合計ではない。"},{"title":"進捗の定量評価","body":"EVM（Earned Value Management：出来高管理）でPV（計画価値）、EV（出来高）、AC（実コスト）を比較。CV=EV−AC、SV=EV−PV、CPI=EV/AC、SPI=EV/PV。","check":"符号の意味と、値が1より大きいか小さいかを解釈。"},{"title":"リスクと調達","body":"リスクは発生確率×影響度などで優先付け。対応は回避・低減・移転・受容。契約形態が変わると発注者と受注者のリスク負担が変わる。","check":"問題が起きてからの対応と事前リスク対応を分ける。"},{"title":"ステークホルダ","body":"関係者の権限、関心、コミュニケーション要件を把握する。変更要求の影響分析では費用・日程・品質・セキュリティに波及する部分を検討。","check":"単に全員に同じ資料を配るだけでは不十分。"}],"terms":[{"term":"WBS","definition":"成果物や作業を小さな単位へ階層的に分解する図"},{"term":"クリティカルパス","definition":"工程ネットワーク上で全体期間を決める最長経路"},{"term":"フロート","definition":"作業が遅れても全体完了を遅らせない余裕時間"},{"term":"PV","definition":"計画時点までに完了予定の作業に対応する予算価値"},{"term":"EV","definition":"実際に完了した作業を予算で評価した出来高"},{"term":"AC","definition":"実際に発生したコスト"},{"term":"CPI","definition":"コスト効率指数。EV÷AC"},{"term":"SPI","definition":"スケジュール効率指数。EV÷PV"},{"term":"リスク低減","definition":"起こる確率や被害の大きさを抑える対応"},{"term":"ステークホルダ","definition":"プロジェクトに影響する・影響を受ける利害関係者"}],"questions":[{"id":"Q14-01","chapter":14,"kind":"applied","q":"EV=80、AC=100、PV=90のときCPIは。","options":["0.8","0.9","1.1","1.25"],"correct":0,"explain":"CPI=EV/AC=0.8。予算超過方向。"},{"id":"Q14-02","chapter":14,"kind":"applied","q":"クリティカルパスの説明で正しいのは。","options":["作業数が最少の経路","遅延が全体日程に直結する経路","費用が最多の経路","人員数が最多の経路"],"correct":1,"explain":"全体工期を規定する経路は余裕時間がゼロになる。"},{"id":"Q14-03","chapter":14,"kind":"applied","q":"リスクに備えて保険へ加入することは主に。","options":["回避","低減","移転","受容"],"correct":2,"explain":"被害の金銭的負担を保険会社へ移す。"}]},{"id":15,"title":"サービスマネジメント","group":"マネジメント","priority":"B選択候補","summary":"SLA、インシデントと問題管理、変更・構成管理、BCP。","lessons":[{"title":"サービスレベル","body":"SLA（Service Level Agreement：サービス水準合意）は提供者と利用者が稼働率・応答時間などの目標を合意した文書。SLM（Service Level Management：サービスレベル管理）は監視・評価・改善する活動。","check":"SLAの数値は測定条件まで定める。"},{"title":"インシデントと問題","body":"インシデント管理は早期のサービス復旧を目標とし、問題管理は根本原因を特定して再発を防止する。回避策による暫定復旧と恒久対策を区別。","check":"原因不明でも暫定復旧してよい場合がある。"},{"title":"変更とリリース","body":"変更管理はリスクと影響を評価し承認する。リリース管理は変更内容を適切な時期・手順で展開する。CMDB（Configuration Management Database：構成管理データベース）は関連資産・構成の把握を支援。","check":"資産管理と構成管理は対象の関係性の扱いが異なる。"},{"title":"継続性","body":"BCP（Business Continuity Plan：事業継続計画）にはRTO（Recovery Time Objective：目標復旧時間）とRPO（Recovery Point Objective：目標復旧時点）が重要。RPOを短くするとデータ損失を小さくできる。","check":"RTOは時間、RPOはデータがどの時点まで戻るか。"}],"terms":[{"term":"SLA","definition":"サービス提供者と利用者が合意するサービス水準"},{"term":"SLM","definition":"サービスレベルを定義・測定・改善する管理活動"},{"term":"インシデント管理","definition":"障害等の影響を抑えサービスを早く復旧させる活動"},{"term":"問題管理","definition":"インシデントの根本原因を特定し再発を防ぐ活動"},{"term":"変更管理","definition":"システム変更の影響・リスク・承認を管理すること"},{"term":"CMDB","definition":"ITサービスの構成品目とそれらの関係を管理するデータベース"},{"term":"BCP","definition":"災害等でも重要業務を継続・早期再開する計画"},{"term":"RTO","definition":"重要業務を復旧すべき目標時間"},{"term":"RPO","definition":"データの復旧で許容する過去への戻り時点の目標"},{"term":"可用性管理","definition":"サービスを必要時に利用できるよう目標と実績を管理する活動"}],"questions":[{"id":"Q15-01","chapter":15,"kind":"applied","q":"障害直後、暫定回避策でサービスを早期復旧する活動は。","options":["問題管理","インシデント管理","調達管理","企業統治"],"correct":1,"explain":"まずサービスを復旧させるのはインシデント管理。"},{"id":"Q15-02","chapter":15,"kind":"applied","q":"毎日0時にバックアップし午後15時の障害で前日0時のデータまでしか戻せない。データ損失時間は。","options":["9時間","15時間","24時間","39時間"],"correct":3,"explain":"前日0時から当日15時なので39時間。最終バックアップ時刻を確認する。"},{"id":"Q15-03","chapter":15,"kind":"applied","q":"RTO=4時間の意味として適切なのは。","options":["データを4時間前まで戻す","目標として4時間以内に復旧する","障害は4時間に一回起こる","平均修理時間が常に4時間"],"correct":1,"explain":"RTOは復旧するまでの目標時間。"}]},{"id":16,"title":"システム監査・内部統制","group":"マネジメント","priority":"B選択候補","summary":"独立した評価、監査証拠、職務分掌、内部統制、改善提案。","lessons":[{"title":"監査の目的","body":"システム監査は情報システムのリスクに対する管理状況等を独立・客観的に評価し、保証や助言を提供する。監査人は業務執行そのものを代行しない。","check":"監査対象を自分で運用し自分で評価すると独立性が損なわれる。"},{"title":"監査手続","body":"リスク評価→監査計画→証拠収集（文書閲覧・インタビュー・観察・再実施など）→評価→報告→フォローアップ。証拠は十分性・適切性を判断する。","check":"担当者の口頭説明だけでは弱い場合がある。"},{"title":"内部統制","body":"業務の有効性・効率性、財務報告の信頼性、法令遵守、資産保全などを支える仕組み。職務分掌は申請・承認・実行などの権限を分離し不正リスクを減らす。","check":"統制目的に対して設計・運用が機能しているか検証。"},{"title":"監査意見","body":"発見事項には事実・基準・原因・影響・改善提案を示す。経営層が受け入れたリスクも明確に記録する。","check":"監査報告は命令ではなく、改善の実施責任は基本的に被監査側。"}],"terms":[{"term":"システム監査","definition":"情報システムのリスク管理などを独立して検証・評価する活動"},{"term":"監査証拠","definition":"監査人の判断や結論を裏付ける情報"},{"term":"独立性","definition":"監査対象から不当な影響を受けずに判断できる性質"},{"term":"客観性","definition":"先入観や利益相反に左右されず公平に評価する性質"},{"term":"職務分掌","definition":"申請・承認・実行等の業務権限を分ける統制"},{"term":"内部統制","definition":"組織の目標達成を支える方針・手続・仕組み"},{"term":"監査調書","definition":"監査手続・証拠・判断を記録した文書"},{"term":"フォローアップ","definition":"指摘に対する改善状況を後から確認する活動"},{"term":"リスクアプローチ","definition":"重要なリスクに監査資源を重点配分する方法"}],"questions":[{"id":"Q16-01","chapter":16,"kind":"applied","q":"監査人の独立性に問題があるのは。","options":["アクセス記録を調べる","自ら構築・運用した統制をそのまま独立評価する","資料を閲覧する","経営者へ意見を述べる"],"correct":1,"explain":"自己監査となり客観的な評価が難しい。"},{"id":"Q16-02","chapter":16,"kind":"applied","q":"不正送金の抑止として最も直接的な内部統制は。","options":["送金申請と承認を別人にする","送金データを毎年削除する","送金担当のみに全権限を渡す","ログを取得しない"],"correct":0,"explain":"職務分掌で一人の権限集中を避ける。"},{"id":"Q16-03","chapter":16,"kind":"applied","q":"監査後に改善実施状況を確認する活動は。","options":["スコープ定義","フォローアップ","プログラム開発","容量計画"],"correct":1,"explain":"指摘への対応結果を後から確認する。"}]},{"id":17,"title":"システム戦略","group":"ストラテジ","priority":"A重要","summary":"業務改革、IT戦略、EA、クラウド・外部委託の効果とリスク。","lessons":[{"title":"経営とITの整合","body":"情報システム戦略は経営目標から逆算し、何をITで変えるか、どの指標で成果を測るかを定める。導入技術自体を目的にしない。","check":"IT投資効果は売上だけでなく品質・時間・リスクも含める。"},{"title":"業務プロセス改革","body":"BPR（Business Process Re-engineering：業務プロセス再設計）は既存の業務を抜本的に見直す。BPM（Business Process Management：業務プロセス管理）は継続的な測定・改善を重視。","check":"現行の非効率な業務をそのままシステム化しない。"},{"title":"EAと全体最適","body":"EA（Enterprise Architecture：エンタープライズアーキテクチャ）は業務、データ、アプリ、技術を組織全体で整合させる枠組み。部分最適によるデータの分断を回避する。","check":"各部門で指標が異なれば共通データ定義が必要。"},{"title":"サービス調達","body":"SaaS（Software as a Service：ソフトウェア提供サービス）、PaaS（Platform as a Service：開発実行基盤提供サービス）、IaaS（Infrastructure as a Service：基盤提供サービス）の責任分担を理解する。","check":"クラウド事業者がすべてのセキュリティ責任を負うわけではない。"}],"terms":[{"term":"情報システム戦略","definition":"経営目的を実現する情報システムの方針と計画"},{"term":"BPR","definition":"業務プロセスを抜本的に見直し再設計すること"},{"term":"BPM","definition":"業務プロセスを継続的に把握・改善する管理手法"},{"term":"EA","definition":"業務・データ・アプリ・技術を全社横断で設計する枠組み"},{"term":"SaaS","definition":"完成したアプリケーションをサービスとして利用する形態"},{"term":"PaaS","definition":"アプリケーションの開発・実行基盤をサービスとして利用する形態"},{"term":"IaaS","definition":"仮想サーバー・ストレージ等のIT基盤を利用する形態"},{"term":"TCO","definition":"導入費用に加え運用・保守・廃棄まで含む総保有費用"},{"term":"アウトソーシング","definition":"業務や機能の一部を外部事業者に委託すること"}],"questions":[{"id":"Q17-01","chapter":17,"kind":"applied","q":"全社の業務・データ・アプリ・技術を整理して整合させる枠組みは。","options":["EA","MFA","TCP","RAID"],"correct":0,"explain":"EAは全社最適を図る構造化アプローチ。"},{"id":"Q17-02","chapter":17,"kind":"applied","q":"SaaS利用で利用者側に通常残る責任は。","options":["基盤の物理的な電源保守のみ","利用者アカウント・権限の適切な管理","クラウド事業者内部のディスク交換","通信回線の全物理設備修繕"],"correct":1,"explain":"責任共有モデルで利用者の設定・データ保護も重要。"},{"id":"Q17-03","chapter":17,"kind":"applied","q":"既存手順の微修正ではなく業務を根本から再設計するのは。","options":["BPR","バックアップ","単体テスト","容量計画"],"correct":0,"explain":"BPRは抜本的業務改革。"}]},{"id":18,"title":"システム企画・調達","group":"ストラテジ","priority":"A重要","summary":"RFP、ROI、要求、見積り、契約、ベンダー評価。","lessons":[{"title":"企画の流れ","body":"現状課題を可視化し、将来像・実現方法・費用対効果・リスクを比較する。定量的な効果と測りにくい定性的な効果を区別。","check":"導入前後の比較条件を揃える。"},{"title":"RFPと提案評価","body":"RFP（Request for Proposal：提案依頼書）は目的・要求・制約・評価基準等を示しベンダー提案を募る。選定では価格以外に品質・体制・実績・保守を評価。","check":"RFPと要件定義書・契約書は同じ役割ではない。"},{"title":"投資判断","body":"ROI（Return on Investment：投資利益率）は投資額に対する利益の比率。NPV（Net Present Value：正味現在価値）は将来キャッシュフローを割り引いて比較。","check":"ROIの利益と収益の定義を問題文で確かめる。"},{"title":"契約と受入れ","body":"準委任契約は一定の業務遂行を目的とし、請負契約は仕事の完成を目的とする。実際の契約内容・法令で責任は変わるため一律に決めつけない。","check":"検収基準と成果物責任を明確化する。"}],"terms":[{"term":"RFP","definition":"要求・条件を示して提案を依頼する文書"},{"term":"ROI","definition":"投資額に対する利益の比率"},{"term":"NPV","definition":"将来の現金収支を現在価値へ割り引いた純額"},{"term":"IRR","definition":"投資の正味現在価値がゼロとなる割引率"},{"term":"TCO","definition":"取得から運用・廃棄までの総費用"},{"term":"ベンダー評価","definition":"提供企業を価格・品質・体制などで比較すること"},{"term":"請負","definition":"原則として仕事の完成を目的とする契約"},{"term":"準委任","definition":"事務処理などの遂行を委託する契約"},{"term":"検収","definition":"納品物が契約や要件に適合するか受入れ確認すること"}],"questions":[{"id":"Q18-01","chapter":18,"kind":"applied","q":"投資額200万円、投資による正味利益50万円のROIは。","options":["10%","20%","25%","50%"],"correct":2,"explain":"50÷200×100=25%。"},{"id":"Q18-02","chapter":18,"kind":"applied","q":"RFPで最も重要なのは。","options":["自社の要求と制約を伝える","必ず最安値を指示する","受入れテストを不要とする","提案者に要件を無制限に追加させる"],"correct":0,"explain":"目的・要求・評価条件を明示する文書。"},{"id":"Q18-03","chapter":18,"kind":"applied","q":"将来の資金流入を割引率で現在価値に直す指標は。","options":["MTTR","CPI","NPV","RPO"],"correct":2,"explain":"NPVは時間価値を考慮する。"}]},{"id":19,"title":"経営戦略・マーケティング","group":"ストラテジ","priority":"A重要","summary":"SWOT、PPM、4P、競争戦略、KPI、財務の基礎。","lessons":[{"title":"経営分析","body":"SWOT分析はStrengths（強み）・Weaknesses（弱み）の内部要因とOpportunities（機会）・Threats（脅威）の外部要因を整理する。クロスSWOTで施策候補を考える。","check":"機会と強みを混同しない。"},{"title":"事業ポートフォリオ","body":"PPM（Product Portfolio Management：製品ポートフォリオ管理）は市場成長率と相対市場占有率で事業を分類する代表的枠組み。資金配分の議論に使うがそれだけで投資判断はできない。","check":"問題文の軸を見失わない。"},{"title":"マーケティングとKPI","body":"4PはProduct（製品）・Price（価格）・Place（流通）・Promotion（販売促進）。KGI（Key Goal Indicator：重要目標達成指標）を達成するための途中指標がKPI（Key Performance Indicator：重要業績評価指標）。","check":"成果指標と活動指標を使い分ける。"},{"title":"収益モデル","body":"売上高−変動費＝限界利益。損益分岐点売上高＝固定費÷限界利益率。価格・数量・単位変動費を変えて感度分析する。","check":"売上高ではなく限界利益が固定費を回収する。"}],"terms":[{"term":"SWOT分析","definition":"内部の強み・弱みと外部の機会・脅威を整理する手法"},{"term":"PPM","definition":"市場成長率と相対市場占有率で事業を分類する枠組み"},{"term":"4P","definition":"製品・価格・流通・販売促進の施策を組み合わせる考え方"},{"term":"STP","definition":"市場細分化・対象選択・位置付けを行うマーケティング手法"},{"term":"KGI","definition":"最終的な目標達成を測定する指標"},{"term":"KPI","definition":"目標達成に向けた途中の活動・成果を測る指標"},{"term":"限界利益","definition":"売上高から変動費を差し引いた利益"},{"term":"損益分岐点","definition":"売上と費用が一致し利益がゼロになる水準"},{"term":"ファイブフォース","definition":"業界の競争要因を五つの力で分析する枠組み"},{"term":"バランストスコアカード","definition":"財務・顧客・業務プロセス・学習と成長を多面的に評価する仕組み"}],"questions":[{"id":"Q19-01","chapter":19,"kind":"applied","q":"固定費300万円、限界利益率30%のとき損益分岐点売上高は。","options":["100万円","300万円","900万円","1000万円"],"correct":3,"explain":"300÷0.3=1000万円。"},{"id":"Q19-02","chapter":19,"kind":"applied","q":"SWOTの「新規規制で市場需要が減る」は。","options":["強み","弱み","機会","脅威"],"correct":3,"explain":"自社外部のマイナス要因なので脅威。"},{"id":"Q19-03","chapter":19,"kind":"applied","q":"最終目標「年間売上10億円」に対し商談数を週次管理する指標は主に。","options":["KGI","KPI","IRR","RPO"],"correct":1,"explain":"商談数は最終目標の先行・中間指標。"}]},{"id":20,"title":"技術戦略マネジメント","group":"ストラテジ","priority":"A標準","summary":"技術ロードマップ、研究開発、イノベーション、標準化と知財。","lessons":[{"title":"技術ロードマップ","body":"市場ニーズ、製品開発、基盤技術、研究開発の時間軸を結び付けて投資の優先順位を決める。技術が新しいだけでは顧客価値にならない。","check":"技術の成熟度と市場投入時期を分けて検討。"},{"title":"イノベーション","body":"破壊的イノベーションは既存市場の主流顧客だけでなく、当初は周縁の用途から競争構造を変え得る。オープンイノベーションは社外の知識や資源も活用する。","check":"単なる大型改良を必ず破壊的と呼ばない。"},{"title":"標準化とIP","body":"標準必須特許やライセンスを意識し、製品差別化と相互運用性のバランスを取る。知財ポートフォリオでは特許だけでなく営業秘密やノウハウも考える。","check":"標準化＝すべて無償提供ではない。"},{"title":"研究開発管理","body":"技術リスク、事業リスク、規制リスクを分け、ステージゲートで継続・中止を判断。学習に基づく仮説更新が必要。","check":"埋没費用を理由に赤字事業を無条件継続しない。"}],"terms":[{"term":"技術ロードマップ","definition":"技術・製品・市場の発展計画を時間軸で関連付けた図"},{"term":"オープンイノベーション","definition":"社内外の知識・技術を組み合わせて革新を目指すこと"},{"term":"破壊的イノベーション","definition":"既存の競争構造を周辺市場などから変化させ得る革新"},{"term":"ステージゲート","definition":"開発段階ごとに評価し継続・中止などを判断する方式"},{"term":"研究開発ポートフォリオ","definition":"リスク・収益・時間軸が異なる研究開発の組合せ"},{"term":"デファクトスタンダード","definition":"市場で広く普及し事実上の標準となった仕様"},{"term":"デジュールスタンダード","definition":"公的・正式な標準化手続で定められた規格"},{"term":"標準必須特許","definition":"ある標準規格の実装に不可欠とされる特許"}],"questions":[{"id":"Q20-01","chapter":20,"kind":"applied","q":"製品・技術・市場の時間軸を対応付ける図は。","options":["ER図","技術ロードマップ","ガントチャートだけ","DFD"],"correct":1,"explain":"研究開発投資と市場投入時期を整合させる。"},{"id":"Q20-02","chapter":20,"kind":"applied","q":"社外の研究成果を取り込んで事業化する考え方は。","options":["オープンイノベーション","密結合","デッドロック","バックアップ"],"correct":0,"explain":"組織外の知識と資源を活かす。"},{"id":"Q20-03","chapter":20,"kind":"applied","q":"開発段階ごとに成果を評価して次段階への進行を判断するのは。","options":["データ正規化","ステージゲート","サブネット分割","多要素認証"],"correct":1,"explain":"段階的な投資判断を行う。"}]},{"id":21,"title":"ビジネスインダストリ","group":"ストラテジ","priority":"A標準","summary":"EC、SCM、ERP、IoT、製造管理、電子決済など産業別ITの基本。","lessons":[{"title":"企業内・企業間システム","body":"ERP（Enterprise Resource Planning：統合基幹業務システム）は会計・人事・販売等を統合、SCM（Supply Chain Management：供給連鎖管理）は調達から販売までの流れを最適化する。","check":"ERPは社内統合、SCMは企業間連携まで視野。"},{"title":"顧客とデータ","body":"CRM（Customer Relationship Management：顧客関係管理）は顧客情報や接点を統合。POS（Point of Sales：販売時点情報管理）は売上・商品データを蓄積し需要分析等へ活用。","check":"個人情報の利用目的と最小限の管理が必要。"},{"title":"製造と物流","body":"CAD（Computer-Aided Design：コンピュータ支援設計）で設計、CAM（Computer-Aided Manufacturing：コンピュータ支援製造）で製造指示。IoT（Internet of Things：モノのインターネット）はセンサや機器のデータを活用。","check":"設計・製造・制御が異なる段階。"},{"title":"ECと決済","body":"EC（Electronic Commerce：電子商取引）では決済・注文・在庫・配送が連動する。EDI（Electronic Data Interchange：電子データ交換）は企業間取引データを標準形式でやり取りする。","check":"電子化はなりすましや改ざん対策も必要。"}],"terms":[{"term":"ERP","definition":"会計・人事・販売などの基幹業務を統合するシステム"},{"term":"SCM","definition":"調達・生産・物流・販売の供給連鎖を最適化する管理"},{"term":"CRM","definition":"顧客情報と接点を管理し関係を改善する仕組み"},{"term":"POS","definition":"販売時点で商品・数量・価格等の情報を取得する仕組み"},{"term":"CAD","definition":"コンピュータを用いた設計支援"},{"term":"CAM","definition":"コンピュータによる製造支援"},{"term":"IoT","definition":"モノをネットワークにつないでデータを収集・活用する仕組み"},{"term":"EDI","definition":"企業間の受発注などのデータを標準化して電子交換する仕組み"},{"term":"電子商取引","definition":"ネットワーク上で商品・サービス等を取引すること"},{"term":"デジタルツイン","definition":"実世界の対象の状態をデジタル空間に再現し分析等に活用する仕組み"}],"questions":[{"id":"Q21-01","chapter":21,"kind":"applied","q":"取引先を含む調達・生産・物流全体の最適化は。","options":["SCM","CRM","CAD","SLA"],"correct":0,"explain":"SCMは供給連鎖全体を扱う。"},{"id":"Q21-02","chapter":21,"kind":"applied","q":"販売時に商品別の売上を記録する仕組みは。","options":["CMDB","POS","VPN","PKI"],"correct":1,"explain":"POSは販売時点で取引情報を収集する。"},{"id":"Q21-03","chapter":21,"kind":"applied","q":"コンピュータ上の設計を支援する技術は。","options":["CAD","CAM","NAT","DNS"],"correct":0,"explain":"CADは設計、CAMは製造。"}]},{"id":22,"title":"企業活動・会計・データ分析","group":"ストラテジ","priority":"A重要","summary":"会計財務、財務諸表、在庫、意思決定、統計、組織。","lessons":[{"title":"財務諸表","body":"貸借対照表（BS：Balance Sheet）は一時点の資産・負債・純資産。損益計算書（PL：Profit and Loss Statement）は期間の収益・費用・利益。キャッシュフロー計算書は現金の動きを表す。","check":"利益が出ても資金繰りは悪化し得る。"},{"title":"財務分析","body":"流動比率=流動資産÷流動負債×100%、自己資本比率=自己資本÷総資産×100%、ROE（Return on Equity：自己資本利益率）=当期純利益÷自己資本。","check":"期末残高と平均残高のどちらを用いるかを確認。"},{"title":"統計","body":"平均・中央値・分散・標準偏差は分布の特徴を表す。相関係数は−1〜1だが因果関係は示さない。回帰は目的変数と説明変数の関係をモデル化する。","check":"相関があっても因果とは限らない。"},{"title":"在庫管理","body":"経済的発注量EOQ（Economic Order Quantity）は発注費用と在庫保管費用を均衡させる発注数量。一般形は√(2DS/H)（D需要量、S発注1回費用、H単位期間の1個当たり保管費用）。","check":"需要の変動や欠品費用など前提に注意。"}],"terms":[{"term":"貸借対照表","definition":"ある時点の資産・負債・純資産を表す財務諸表"},{"term":"損益計算書","definition":"一定期間の収益・費用・利益を表す財務諸表"},{"term":"キャッシュフロー","definition":"一定期間の現金の流入と流出"},{"term":"流動比率","definition":"流動資産を流動負債で割る短期支払能力の指標"},{"term":"自己資本比率","definition":"総資産に対する自己資本の割合"},{"term":"ROE","definition":"当期純利益を自己資本で割った利益率"},{"term":"標準偏差","definition":"分布の値のばらつきを元と同じ単位で示す統計量"},{"term":"相関係数","definition":"二変数の線形関係の向き・強さを示す−1〜1の指標"},{"term":"回帰分析","definition":"一方の変数を別の変数で説明・予測する手法"},{"term":"EOQ","definition":"発注費と在庫保管費の合計が小さくなる発注数量"}],"questions":[{"id":"Q22-01","chapter":22,"kind":"applied","q":"流動資産600、流動負債400の企業の流動比率は。","options":["67%","100%","150%","200%"],"correct":2,"explain":"600÷400×100=150%。"},{"id":"Q22-02","chapter":22,"kind":"applied","q":"「売上増加と広告費の相関が高い」から直ちに結論できるのは。","options":["広告費が売上増を必ず引き起こす","売上が広告費を必ず引き起こす","両者に線形関係が観測された","第三要因は存在しない"],"correct":2,"explain":"相関だけでは因果関係は確定しない。"},{"id":"Q22-03","chapter":22,"kind":"applied","q":"資産1000、負債600の場合の自己資本比率は。","options":["20%","40%","60%","100%"],"correct":1,"explain":"自己資本=1000−600=400、400÷1000=40%。"}]},{"id":23,"title":"法務・標準化・知的財産","group":"ストラテジ","priority":"A重要","summary":"著作権・特許・個人情報・契約・労務・不正アクセスと標準。","lessons":[{"title":"著作権と特許","body":"著作権は原則として創作時に発生し、表現を保護する。特許は出願・審査・登録を経て技術的思想の創作を一定期間保護する。アイデアそのものと表現を混同しない。","check":"ソフトウェアのソースコードは著作権の対象となり得る。"},{"title":"個人情報","body":"個人情報保護法では利用目的の特定・安全管理措置・第三者提供の規律等を理解する。匿名加工情報と仮名加工情報では本人識別や取扱いのルールが異なる。","check":"匿名化したつもりでも再識別可能性を考える。"},{"title":"情報セキュリティ法規","body":"不正アクセス禁止法は他人の識別符号の無断入力などを規制。電子署名、営業秘密、サイバー犯罪への対応も把握する。","check":"単なる規約違反と法律違反は区別。"},{"title":"標準と契約","body":"JIS（Japanese Industrial Standards：日本産業規格）やISO（International Organization for Standardization：国際標準化機構）の規格は品質・安全・互換性等の共通基準。契約では秘密保持・成果物権利・再委託・責任範囲を確認。","check":"最新の法改正や規格の版は直前に一次情報で確認。"}],"terms":[{"term":"著作権","definition":"文章・プログラムなどの創作的な表現を保護する権利"},{"term":"特許権","definit 個人の識別や復元ができないよう法定基準で加工した情報","他人のIDやパスワードの不正利用などを規制する法律"],"correct":2,"explain":"特定個人の識別や復元ができないよう法定基準で加工した情報。同じ分野の類似用語と区別する。"},{"id":"T23-08","chapter":23,"kind":"term","q":"「不正アクセス禁止法」の説明として最も適切なものはどれか。","options":["生存する個人に関する情報で特定個人を識別できるもの等","他人のIDやパスワードの不正利用などを規制する法律","秘密管理性・有用性・非公知性などを満たす事業上の情報","文章・プログラムなどの創作的な表現を保護する権利"],"correct":1,"explain":"他人のIDやパスワードの不正利用などを規制する法律。同じ分野の類似用語と区別する。"},{"id":"T23-09","chapter":23,"kind":"term","q":"「JIS」の説明として最も適切なものはどれか。","options":["商品・サービスの出所を識別する標識を保護する権利","日本の産業分野に関する国家規格","他人のIDやパスワードの不正利用などを規制する法律","秘密保持契約。Non-Disclosure Agreementの略"],"correct":1,"explain":"日本の産業分野に関する国家規格。同じ分野の類似用語と区別する。"},{"id":"T23-10","chapter":23,"kind":"term","q":"「ISO」の説明として最も適切なものはどれか。","options":["特定個人の識別や復元ができないよう法定基準で加工した情報","日本の産業分野に関する国家規格","秘密管理性・有用性・非公知性などを満たす事業上の情報","国際的な規格を制定する標準化団体"],"correct":3,"explain":"国際的な規格を制定する標準化団体。同じ分野の類似用語と区別する。"},{"id":"T23-11","chapter":23,"kind":"term","q":"「NDA」の説明として最も適切なものはどれか。","options":["秘密保持契約。Non-Disclosure Agreementの略","秘密管理性・有用性・非公知性などを満たす事業上の情報","他の情報と照合しない限り特定個人を識別できないよう加工した個人情報等","特定個人の識別や復元ができないよう法定基準で加工した情報"],"correct":0,"explain":"秘密保持契約。Non-Disclosure Agreementの略。同じ分野の類似用語と区別する。"}],"cases":[{"id":"B01","title":"外部ライブラリの改ざんと初動対応","domain":"情報セキュリティ","required":true,"passage":"医療機関向け予約システムA社は外部ライブラリLを利用している。開発端末で依存ライブラリを更新した翌日、外部の未知のドメインへの通信が急増した。更新に使ったパッケージ配布元では管理者アカウントの侵害が報告された。端末には接続先情報を含む認証トークンが保管されている。A社は本番環境への配布を一時停止したが、影響範囲と情報漏えいの有無は未確定である。","items":[{"q":"本事象で想定される攻撃の種類を答えよ。","answer":"ソフトウェアサプライチェーン攻撃","reason":"侵害された配布元を通じて正規の更新に悪意あるコードを混入できる。","keywords":["サプライチェーン攻撃"]},{"q":"初動で本番配布停止以外に実施すべきことを2つ挙げよ。","answer":"該当端末を適切に隔離し、通信ログ・更新履歴・端末状態などの証拠を保全する。","reason":"原因未確定の段階で証拠の消失を防ぎながら被害拡大を抑える。","keywords":["隔離","証拠保全"]},{"q":"漏えいの可能性がある認証トークンに対して何をするか。","answer":"影響するトークンを無効化・再発行し、権限と利用履歴を確認する。","reason":"侵害された認証情報の悪用継続を防ぐ。","keywords":["無効化","再発行"]}],"tips":"初動では「封じ込め」と「証拠保全」を両立させる。断定できない漏えいを発生済みと書かない。"},{"id":"B02","title":"経営戦略：EC導入と効果測定","domain":"情報戦略","required":false,"passage":"食品卸B社は電話注文をWeb注文へ移行したい。現在は月1万件の受注があり、1件の入力作業に平均6分かかる。新システムでは2分となる見込み。人件費は1時間当たり2,400円、年間維持費は600万円、初期費用は1,000万円とする。その他の費用と需要変動は無視する。顧客の利用率は導入前に確定しておらず、注文データの形式も顧客ごとに異なる。","items":[{"q":"月間で削減できる作業時間は何時間か。","answer":"約667時間","reason":"1万件×(6−2)分÷60=666.7時間。","keywords":["667","時間"]},{"q":"年間の人件費削減額と年間純効果を計算せよ。","answer":"削減額1,920万円、維持費を差し引く年間純効果1,320万円。","reason":"年間1万件×12×4/60×2,400=19,200,000円。","keywords":["1920","1320"]},{"q":"上記の試算に対する実務上の留意点を一つ挙げよ。","answer":"Web注文の利用率が100%とは限らないため、移行率を測定して削減効果を再試算する。","reason":"前提が実際と異なると投資効果は過大評価される。","keywords":["利用率","移行率"]}],"tips":"計算条件と未確認前提を分離し、問われた範囲だけを数値で回答。"},{"id":"B03","title":"性能設計：Web/API基盤のボトルネック","domain":"システムアーキテクチャ","required":false,"passage":"WebシステムCの処理は、Web層・業務API層・DB層を順に通る。1秒当たりの最大処理件数はWeb層100、API層80、DB層50である。1件の要求は各層を1回ずつ使用する。今後の利用者増加に備え、最初に1つの層だけを増強する方針である。可用性の要件は99.9%、既存実測値は99.7%とする。","items":[{"q":"現状の理論的な最大スループットを答えよ。","answer":"毎秒50件","reason":"直列の処理では最小能力の層が全体の上限。","keywords":["50"]},{"q":"最初に増強すべき層とその理由を答えよ。","answer":"DB層。1秒当たり50件で最も処理能力が低いため。","reason":"ボトルネックから改善すると全体上限を押し上げやすい。","keywords":["DB","ボトルネック"]},{"q":"稼働率99.7%から99.9%に引き上げるため、原因調査と並行して検討する手段を一つ述べよ。","answer":"単一障害点を特定して冗長化や自動フェイルオーバーを検討する。","reason":"可用性の改善には障害発生率低減または修復時間短縮が有効。","keywords":["冗長化","フェイルオーバー"]}],"tips":"性能と可用性は別要件。処理能力の改善だけでは稼働率要件を満たせない。"},{"id":"B04","title":"ネットワーク：名前解決不具合の切り分け","domain":"ネットワーク","required":false,"passage":"企業Dの社内端末から業務サーバー192.0.2.20へIPアドレス指定でHTTPS接続は成功する。一方、https://sales.example.test では名前解決エラーとなる。端末のDNSサーバーは192.0.2.53に設定されている。管理者がDNSサーバーを確認すると、sales.example.test のAレコードは誤って192.0.2.25を指していた。別の端末では正しいアドレスが表示されるため、キャッシュの影響も疑われる。","items":[{"q":"IPアドレス指定で接続できる事実から、優先的に疑う機能は何か。","answer":"DNSによる名前解決","reason":"IP接続が成功しており、名前を解決する過程でエラーが発生する。","keywords":["DNS","名前解決"]},{"q":"管理者が最初に修正する設定は何か。","answer":"sales.example.testのAレコードを192.0.2.20に修正する。","reason":"AレコードはIPv4アドレスを指定する。","keywords":["Aレコード","192.0.2.20"]},{"q":"修正直後も端末によって結果が異なる原因を挙げよ。","answer":"DNSキャッシュのTTLが残って古い解決結果を使うため。","reason":"DNS情報はTTLにより一定期間キャッシュされる。","keywords":["キャッシュ","TTL"]}],"tips":"疎通／DNS／TLS／アプリのどの層の異常か、与えられた証拠から絞る。"},{"id":"B05","title":"データベース：在庫更新の競合","domain":"データベース","required":false,"passage":"オンライン販売E社の在庫表は 商品ID と 在庫数 を保持する。商品Xの在庫は1個である。購入処理は「在庫数をSELECTで読む→1以上なら注文確定→在庫数を1減らす」の順に実行している。ほぼ同時に2つの購入処理が在庫数1を読み、両方が注文確定した。E社はトランザクション処理で再発を防ぎたい。","items":[{"q":"発生したデータ不整合の原因を説明せよ。","answer":"在庫の確認と更新が排他制御されず、複数処理が同じ在庫1を読んで注文確定したため。","reason":"読取りと更新を一体で制御していない。","keywords":["排他制御","同時"]},{"q":"防止するSQLの設計方針を一つ述べよ。","answer":"在庫数が1以上の行だけを原子的にUPDATEで減算し、更新件数が1のときだけ注文を確定する。","reason":"条件付き更新と影響行数の確認で同時購入競合を防げる。","keywords":["UPDATE","更新件数"]},{"q":"トランザクションに求められるACIDのうち、途中で失敗した更新を全体的に取り消す性質は。","answer":"原子性（Atomicity）","reason":"全部実行か全部取消しかを保証する。","keywords":["原子性"]}],"tips":"ロックを使う案も有効だが、読み取り・更新・確定をどの範囲でまとめるかまで書く。"},{"id":"B06","title":"組込み：周期タスクの実行可能性","domain":"組込みシステム開発","required":false,"passage":"制御装置Fは単一CPUで三つの周期タスクを動かす。タスクAは実行時間2ms・周期10ms、Bは実行時間3ms・周期20ms、Cは実行時間5ms・周期50ms。処理切替のオーバーヘッドは無視できるとする。各タスクは期限内完了が必要だが、現時点では優先度割当てや最悪実行時間の変動を十分評価していない。","items":[{"q":"タスクAのCPU利用率を求めよ。","answer":"20%","reason":"2/10=0.2。","keywords":["20"]},{"q":"全タスクのCPU利用率の合計を求めよ。","answer":"45%","reason":"2/10+3/20+5/50=0.20+0.15+0.10=0.45。","keywords":["45"]},{"q":"利用率が100%未満であることだけで締切を保証できるか。理由とともに答えよ。","answer":"保証できない。優先度・割込み・切替・実行時間の最悪値・スケジューリング方式が影響するため。","reason":"総利用率だけでは各タスクの応答時間が保証されない。","keywords":["保証できない","優先度"]}],"tips":"数値を計算した後、期限保証は別の検証が要ることを忘れない。"},{"id":"B07","title":"開発：受入れ試験と境界値","domain":"情報システム開発","required":false,"passage":"新規会員登録Gでは年齢を18〜65歳（両端含む）に制限する。テスト担当は25,35,45歳のみを試したが、開発後に17歳の登録が成功する欠陥が見つかった。さらに要件定義書には「ピーク時1000人が同時利用しても95パーセンタイル応答時間を2秒以内」と記載されている。","items":[{"q":"年齢入力について境界値を4つ挙げよ。","answer":"17、18、65、66","reason":"上限・下限の直前と境界そのものが重要。","keywords":["17","18","65","66"]},{"q":"上記の年齢バグを発見するのに適したテスト設計技法は何か。","answer":"境界値分析","reason":"有効範囲の境界前後に欠陥が集まりやすい。","keywords":["境界値分析"]},{"q":"応答時間に関する要件は機能要件と非機能要件のどちらか。","answer":"非機能要件","reason":"性能効率性に関する品質要件。","keywords":["非機能要件"]}],"tips":"テスト値の選び方を説明できると、単なる暗記より得点が安定する。"},{"id":"B08","title":"プログラミング：二分探索の追跡","domain":"プログラミング","required":false,"passage":"昇順配列A=[2,5,9,12,18,23,27,31,40]の添字は0〜8。値23を探すため、low=0、high=8から開始する。繰返しでmid=(low+high)//2（切捨て除算）とし、A[mid]が目標より小さければlow=mid+1、大きければhigh=mid−1、等しければ終了する。","items":[{"q":"最初のmidとA[mid]を答えよ。","answer":"mid=4、A[mid]=18","reason":"(0+8)//2=4。","keywords":["4","18"]},{"q":"1回目の比較後のlowとhighを答えよ。","answer":"low=5、high=8","reason":"18は23より小さいので左側を捨てる。","keywords":["5","8"]},{"q":"何回目の比較で23が見つかるか。","answer":"3回目","reason":"1回目mid4=18、2回目mid6=27、3回目mid5=23。","keywords":["3"]}],"tips":"トレース表にlow / high / mid / A[mid]を毎回書く。配列添字の基点を間違えない。"},{"id":"B09","title":"プロジェクト：EVMによる遅延判断","domain":"プロジェクトマネジメント","required":false,"passage":"案件Hの月末時点の計画価値PVは600万円、出来高EVは480万円、実コストACは540万円である。全体予算BACは1,200万円。品質に関する未完了作業は現時点のEVには算入していない。プロジェクトマネージャは進捗遅延とコスト超過を数値で説明する必要がある。","items":[{"q":"コスト差異CVを求め、その意味を答えよ。","answer":"CV=−60万円。出来高より実コストが60万円大きくコスト超過。","reason":"CV=EV−AC=480−540。","keywords":["−60","超過"]},{"q":"スケジュール差異SVとSPIを求めよ。","answer":"SV=−120万円、SPI=0.8。計画より進捗が遅れている。","reason":"SV=480−600、SPI=480/600。","keywords":["−120","0.8"]},{"q":"担当者の努力不足だけを原因として即断できるか。理由を述べよ。","answer":"できない。要件変更、作業見積り、待ち時間、未完了の検収条件など要因を調査する必要がある。","reason":"EVMは状態指標であって原因の特定まではしない。","keywords":["できない","原因"]}],"tips":"計算→進捗・費用の解釈→原因を断定しない、の順で書く。"},{"id":"B10","title":"サービス管理：復旧目標と再発防止","domain":"サービスマネジメント","required":false,"passage":"小売I社の基幹システムはバックアップを毎日深夜0時に取得する。木曜14時にDB破損が発生し、当日0時のバックアップから18時に復旧した。重要業務のRTOは3時間、RPOは2時間である。復旧後は同様の事象の原因究明が求められている。","items":[{"q":"実際の復旧時間とRTO達成状況を答えよ。","answer":"復旧時間4時間。RTO3時間を1時間超過して未達。","reason":"14時から18時まで4時間。","keywords":["4","未達"]},{"q":"実際のデータ損失時間とRPO達成状況を答えよ。","answer":"データ損失14時間。RPO2時間を超過して未達。","reason":"0時から14時までの更新が失われた。","keywords":["14","未達"]},{"q":"再発防止に向けてインシデント管理とは別に重視する活動は。","answer":"問題管理。根本原因を調査して恒久対策を立案する。","reason":"暫定的な復旧と原因除去は別。","keywords":["問題管理","根本原因"]}],"tips":"時間は同じ日の時計で計算し、復旧（RTO）とデータ喪失（RPO）を分ける。"},{"id":"B11","title":"システム監査：承認権限の不備","domain":"システム監査","required":false,"passage":"企業Jの購買システムでは、同一担当者が仕入先を登録し、支払先口座を変更し、支払承認まで実施できる。監査人は複数の口座変更履歴に承認記録がないことを確認した。管理者は「これまで不正が報告されていないので問題ない」と説明したが、監査人は内部統制上のリスクを評価する。","items":[{"q":"最も重要な統制上の不備を答えよ。","answer":"仕入先登録・口座変更・支払承認の職務が分離されていない。","reason":"一人で不正な支払先に変更・承認できてしまう。","keywords":["職務分掌","分離"]},{"q":"監査人が追加収集すべき客観的な証拠を一つ挙げよ。","answer":"権限設定一覧・変更ログ・承認履歴と実際の取引記録など。","reason":"説明だけでなく実際の運用証拠を確認する。","keywords":["ログ","権限"]},{"q":"監査報告で提示すべき改善案を一つ述べよ。","answer":"口座変更者と承認者を分離し、変更時の二重承認・定期的権限棚卸しを導入する。","reason":"不正の機会を抑える統制を設計・運用する。","keywords":["分離","承認"]}],"tips":"観察した事実・潜在的リスク・改善案を分けて書く。"}],"sources":[{"title":"IPA 2026年度後期の試験日程","url":"https://www.ipa.go.jp/shiken/mousikomi/moushikomi.html"},{"title":"IPA 応用情報技術者試験 公式概要","url":"https://www.ipa.go.jp/shiken/kubun/ap.html"},{"title":"IPA 応用情報技術者試験シラバス Ver.7.2","url":"https://www.ipa.go.jp/shiken/syllabus/omgdg50000005kq5-att/syllabus_ap_ver7_2.pdf"},{"title":"IPA 試験要綱 Ver.5.5","url":"https://www.ipa.go.jp/shiken/syllabus/omgdg50000005kle-att/youkou_ver5_5.pdf"},{"title":"IPA 2025年度 公式過去問題・解答例","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html"}]}</script>

エウアウエ","question":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_am_qs.pdf","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_am_ans.pdf","bQuestion":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_pm_qs.pdf","bAnswer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_pm_ans.pdf","bReview":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_pm_cmnt.pdf"}];

const KEY='ap-study-2027-v1'; const EMPTY=()=>({seen:{},stats:{},wrong:{},bookmarks:{},notes:{},self:{},log:[],visited:{},pastAnswers:{},pastResults:{},pastB:{},pastTimes:{},dailyTarget:20,dailyNotes:{},reviewSchedule:{}});
let S=load(), view='home', chapterId=1, quiz={type:'',ids:[],answers:{},index:0,finished:false,started:0}, chapterTestN=10, flashIndex=0, flashOpen=false, flashFilter='all', caseIndex=0, revealed={};

function accuracy(){let a=Object.values(S.stats),n=a.reduce((v,x)=>v+x.total,0),r=a.reduce((v,x)=>v+x.right,0);return {n,r,pct:n?Math.round(100*r/n):0}}

function stats(){let done=Object.values(S.seen).filter(Boolean).length,a=accuracy(),rev=Object.keys(S.wrong).filter(k=>S.wrong[k]).length;return `<div class="stats"><div class="stat"><span>講義の修了</span><strong>${done}<small style="font-size:14px;color:#687989">/ ${D.chapters.length}</small></strong><div class="progress"><div class="bar" style="width:${Math.round(done/D.chapters.length*100)}%"></div></div></div><div class="stat"><span>演習通算正答率</span><strong>${a.pct}%</strong><span>${a.r}/${a.n} 回</span></div><div class="stat"><span>要復習の問題</span><strong>${rev}問</strong><span>不正解・未習得</span></div></div>`}
function home(){let recent=[...S.log].slice(-6).reverse(),unfinished=D.chapters.find(c=>!S.seen[c.id])||D.chapters[0];return `<div class="page"><div class="summary"><div class="eyebrow" style="color:#90e3d8">2027 FEB–MAR / 2026年度後期</div><h1>理解する。解く。<br>間違いから仕上げる。</h1><p class="sub">23分野の講義、${D.chapters.reduce((n,c)=>n+c.lessons.length,0)}解説項目、${D.chapters.reduce((n,c)=>n+c.terms.length,0)}重要用語、科目A独自問題${D.questions.length}問、科目Bケース${D.cases.length}題。</p><div class="buttons"><button class="action" data-nav="chapters">学習を始める</button><button class="action secondary" data-nav="past">公式過去問に挑戦</button><button class="action secondary" data-nav="manage">学習の進捗を見る</button><button class="action secondary" data-start="wrong">弱点を解く</button></div></div>${stats()}<div class="grid"><div class="card"><div class="eyebrow">次の一歩</div><h3>第${unfinished.id}章　${E(unfinished.title)}</h3><p class="muted">${E(unfinished.summary)}</p><button class="action soft" data-ch="${unfinished.id}">この章を学ぶ</button></div><div class="card"><div class="eyebrow">科目Bの攻略</div><h3>セキュリティ必須 + 得意な4分野</h3><p class="muted">科目A対策と並行して、自分の得意・不得意を記述演習で確認。3月に5問分を本番形式で練習します。</p><button class="action soft" data-nav="cases">記述問題へ</button></div></div><h2>試験までの学習ロードマップ</h2>${schedule()}<div class="card"><h3>科目A / Bの区別と合格目標</h3><p>科目A：四肢択一80問 / 150分。科目B：記述式11問から5問 / 150分。両科目とも100点満点で基準点60点。安全圏を狙い、科目Aの演習は独自問題で80%以上、公式過去問で75%以上を自主目標に設定。</p><p class="notice">注意：本教材の短い独自問題だけで公式試験の難易度を完全には再現できません。最終的に必ずIPAの公式過去問を時間を測って解いてください。</p></div></div>`}
function management(){
  const today=dayKey();const target=Math.max(1,Math.min(200,Number(S.dailyTarget)||20));
  const byDay={};for(const v of S.log||[]){let k=dayKey(v.at);byDay[k]??={count:0,right:0};byDay[k].count++;if(v.ok)byDay[k].right++}
  const now=byDay[today]||{count:0,right:0};const last7=Array.from({length:7},(_,i)=>{let d=addDays(today,i-6);return {date:d,count:byDay[d]?.count||0}});

  const ready=chapterRows.filter(x=>S.seen[x.c.id]&&x.n>=10&&x.pct>=80).length;
