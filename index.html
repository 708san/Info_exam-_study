る。","trap":"回収期間だけでは回収後の収益やリスクを評価できない。","quizId":"U-17-2"},"textbook":[{"heading":"投資を評価する理由","body":"システム開発には初期費用と継続費用がかかり、人件費削減、売上増加、リスク低減などの便益を期待します。単純投資回収期間は初期投資÷年間純便益（一定の場合）。回収までの時間を把握できますが、回収後の便益や貨幣の時間価値は評価できません。"},{"heading":"利益と現在価値","body":"ROI（投資利益率）は利益を投資額で割る指標です。NPV（正味現在価値）は将来のキャッシュフローを割引いて初期投資を引きます。IRR（内部収益率）はNPVが0になる割引率です。投資比較では計算条件やリスク、評価期間をそろえます。"},{"heading":"複数の施策と評価指標","body":"投資ポートフォリオでは複数案件の価値・リスク・費用・資源制約を考慮して優先順位を決めます。KGI（重要目標達成指標）は最終目標、KPI（重要業績評価指標）は達成に向けた途中の成果を測ります。例えば利益率をKGI、処理時間や継続率をKPIにすることがあります。"}]},{"id":"17-3","title":"ITガバナンス・全体最適・データ戦略","explain":"<p>ITガバナンスは経営の責任のもとでITの価値・リスク・資源を方向付け、評価・監視する仕組み。現場最適で各部門が個別にシステムを購入すると、データ形式の不統一、セキュリティ水準の差、費用重複が生じ得る。標準化、共通基盤、データ品質管理、責任分担で全体最適を目指す。</p>\n<p>データ戦略では主データ（顧客・商品等）、取引データ、メタデータ、品質（正確性・完全性・適時性）を整理する。データを集めるだけでなく、利用目的、アクセス権、保持期限、プライバシー、責任者を決める。</p>\n","worked":"<p>営業部と経理部で「顧客ID」の定義が異なると売上集計が一致しない。共通マスタとデータ定義を整えることが経営指標の信頼性に直結する。</p>\n","prompt":"全てのシステムを1つに統合すれば常に最適か。","answer":"<p>そうとは限らない。柔軟性、事業ごとの要件、障害の波及範囲も評価する。</p>\n","beginner":{"scenario":"各部署が異なる顧客管理システムを導入すると重複・矛盾が生じる。全体のデータ定義やシステム配置を整理し共通化する。","trap":"全体最適は全機能を一つに集約することとは限らない。","quizId":"U-17-3"},"textbook":[{"heading":"全体最適が必要な理由","body":"各部門が独自に顧客コードとデータベースを作ると、同一顧客を別々に管理し集計や連携が難しくなります。EA（エンタープライズアーキテクチャ）は組織全体の業務、データ、アプリケーション、技術の構造を整理して現状と将来像を考える手法です。"},{"heading":"ITガバナンス","body":"ITガバナンスは経営目標に照らしITの利用・投資・リスクについて意思決定と監督を行う仕組みです。日々の運用管理とは区別し、責任、意思決定権、評価方法を明確にします。"},{"heading":"データの活用と管理","body":"データの定義、品質、所有者、利用権限、保存・廃棄条件を定めます。マスターデータ管理で顧客・商品等の基本情報を一貫させることは、部門間の分析や連携を助けます。全体最適は必ずしもすべての機能を一つのシステムへ集約することではありません。"}]},{"id":"17-Z03","title":"全社統治フレームワーク・IT投資と責任分界","explain":"<p>COBIT（Control Objectives for Information and Related Technologies：情報技術ガバナンス・管理の枠組み）は企業ITの統治と管理を支援する。ITILはITサービス管理の実践体系、COSOは内部統制の枠組み、TOGAFは全社アーキテクチャ構築・管理の枠組み。</p>","worked":"<p>投資委員会で事業成果に基づき優先度を決め、実施部門が改善する。</p>","prompt":"企業IT全体のガバナンスと管理を支援する枠組みは？","answer":"<p>COBITは企業ITの統治・管理を支援する。</p>","beginner":{"scenario":"経営陣が多数のIT投資をどの基準で選び、実行状況を確認するか決める。","trap":"COBIT・ITIL・COSO・TOGAFは同じ目的の規格ではない。","quizId":"U-17-Z03"},"textbook":[{"heading":"基本原理","body":"COBIT（Control Objectives for Information and Related Technologies：情報技術ガバナンス・管理の枠組み）は企業ITの統治と管理を支援する。ITILはITサービス管理の実践体系、COSOは内部統制の枠組み、TOGAFは全社アーキテクチャ構築・管理の枠組み。"},{"heading":"仕組み・判断","body":"投資方針を経営戦略に合わせ、効果、費用、リスク、期間、依存関係、実現性で優先順位を決める。プログラム管理で関連プロジェクト間の便益を調整し、進捗や成果指標の差異を分析する。統治は方向づけと監視、管理は計画・実行・改善を担う。"},{"heading":"応用と注意点","body":"情報システムの品質統制では開発・運用の標準、遵守状況、例外承認、レビューを整備する。システムオーナーとデータオーナー、事業部門、IT部門の責任を分け、意思決定を記録する。"}]},{"id":"17-Y04","title":"活用促進・効果測定・データ駆動改善","explain":"<p>導入の完了は目的達成と異なります。活用促進には教育、支援窓口、業務規則、使いやすさ、利用状況の測定が必要です。</p>","worked":"<p>売上向上をKGI、案件情報の入力率や商談化率をKPIとし、入力負担を調べて改善する。</p>","prompt":"利用定着を測る直接的な指標は？","answer":"<p>対象社員の月間利用率。利用状況を直接測定する指標。経営成果も別途測る。</p>","beginner":{"scenario":"新しい顧客管理システムを導入したが、営業担当が入力せず経営に使えない。","trap":"導入台数が増えたことだけで経営効果が出たとはいえない。","quizId":"U-17-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"導入の完了は目的達成と異なります。活用促進には教育、支援窓口、業務規則、使いやすさ、利用状況の測定が必要です。"},{"heading":"仕組みと使い分け","body":"KGI（Key Goal Indicator：重要目標達成指標）は最終成果、KPI（Key Performance Indicator：重要業績評価指標）はその進捗を測ります。基準値と目標、測定方法を決め、導入前後を比較します。データ品質や季節変動、外部要因にも注意します。"},{"heading":"具体的な判断と手順","body":"売上向上をKGI、案件情報の入力率や商談化率をKPIとし、入力負担を調べて改善する。"},{"heading":"指標の分母と因果関係","body":"月間利用率を計算する場合、対象社員100人中70人が利用したなら70％です。利用者数が増えても、対象社員自体が増えていれば比率が改善していないことがあります。導入後の売上増加も季節要因などで起きるため、比較期間や対象をそろえて評価します。"},{"heading":"重み付き評価の達成度","body":"項目の重みw、実績点s、目標点maxがあるなら達成度=Σ(w×s)/Σ(w×max)×100。例えば重み2,3、実績3,1、最高3なら(6+3)/(6+9)=60%。実績合計を重みの合計だけで割らない。"}]}],"beginnerIntro":"経営上の課題を業務・ITの施策に変え、導入後の成果を測る。IT自体を目的にしない。","studyGroups":[{"title":"経営から情報戦略へ","body":"経営目的を業務と情報システムの全体設計へつなげる。","ids":["17-1","17-C01","17-Y01","17-Z01","17-Z02"]},{"title":"業務改善とサービス","body":"現状業務を分析し、実現方式と責任を選択する。","ids":["17-X01","17-Y02","17-Y03"]},{"title":"投資・データ・統治","body":"投資効果、データ活用、統治と改善の指標を設計する。","ids":["17-2","17-3","17-Z03","17-Y04"]}]},{"id":18,"title":"システム企画・調達","group":"ストラテジ","priority":"A重要","summary":"RFP、ROI、要求、見積り、契約、ベンダー評価。","lessons":[{"title":"企画の流れ","body":"現状課題を可視化し、将来像・実現方法・費用対効果・リスクを比較する。定量的な効果と測りにくい定性的な効果を区別。","check":"導入前後の比較条件を揃える。"},{"title":"RFPと提案評価","body":"RFP（Request for Proposal：提案依頼書）は目的・要求・制約・評価基準等を示しベンダー提案を募る。選定では価格以外に品質・体制・実績・保守を評価。","check":"RFPと要件定義書・契約書は同じ役割ではない。"},{"title":"投資判断","body":"ROI（Return on Investment：投資利益率）は投資額に対する利益の比率。NPV（Net Present Value：正味現在価値）は将来キャッシュフローを割り引いて比較。","check":"ROIの利益と収益の定義を問題文で確かめる。"},{"title":"契約と受入れ","body":"準委任契約は一定の業務遂行を目的とし、請負契約は仕事の完成を目的とする。実際の契約内容・法令で責任は変わるため一律に決めつけない。","check":"検収基準と成果物責任を明確化する。"}],"terms":[{"term":"RFP","definition":"要求・条件を示して提案を依頼する文書"},{"term":"ROI","definition":"投資額に対する利益の比率"},{"term":"NPV","definition":"将来の現金収支を現在価値へ割り引いた純額"},{"term":"IRR","definition":"投資の正味現在価値がゼロとなる割引率"},{"term":"TCO","definition":"取得から運用・廃棄までの総費用"},{"term":"ベンダー評価","definition":"提供企業を価格・品質・体制などで比較すること"},{"term":"請負","definition":"原則として仕事の完成を目的とする契約"},{"term":"準委任","definition":"事務処理などの遂行を委託する契約"},{"term":"検収","definition":"納品物が契約や要件に適合するか受入れ確認すること"}],"questions":[{"id":"Q18-01","chapter":18,"kind":"applied","q":"投資額200万円、投資による正味利益50万円のROIは。","options":["10%","20%","25%","50%"],"correct":2,"explain":"50÷200×100=25%。"},{"id":"Q18-02","chapter":18,"kind":"applied","q":"RFPで最も重要なのは。","options":["自社の要求と制約を伝える","必ず最安値を指示する","受入れテストを不要とする","提案者に要件を無制限に追加させる"],"correct":0,"explain":"目的・要求・評価条件を明示する文書。"},{"id":"Q18-03","chapter":18,"kind":"applied","q":"将来の資金流入を割引率で現在価値に直す指標は。","options":["MTTR","CPI","NPV","RPO"],"correct":2,"explain":"NPVは時間価値を考慮する。"},{"id":"D18-01","chapter":18,"kind":"applied","q":"RFIとRFPの目的の組合せとして適切なものはどれか。","options":["RFIは提案取得、RFPは情報収集","両方は請求書","RFIは情報収集、RFPは具体的提案依頼","RFIは契約締結、RFPは検収"],"correct":2,"explain":"情報収集で候補や技術を把握したうえで、要件を明記した提案依頼を行う。"},{"id":"D18-02","chapter":18,"kind":"applied","q":"SaaSを導入するとき利用企業が引き続き負う可能性の高い責任はどれか。","options":["利用者の権限設定とデータの適切な取扱い","提供者のデータセンター建設","提供者のOSカーネル保守のすべて","提供者の営業活動"],"correct":0,"explain":"クラウドでも責任分界がある。利用側の権限やデータ管理責任は通常残る。"},{"id":"D18-03","chapter":18,"kind":"applied","q":"システム導入のTCO比較に含めるべき費用はどれか。","options":["初期費用のみ","導入・運用・教育・移行・撤退等の総費用","月額ライセンス料だけ","営業担当者の感想"],"correct":1,"explain":"TCOは総保有コスト。長期の運用と終了時費用まで考える。"},{"id":"Q-18-X01","chapter":18,"kind":"applied","q":"複数の事業者に具体的な解決案と費用の提示を求める文書は？","options":["RFI","RFP","SLA","NDA"],"correct":1,"explain":"RFP。"},{"id":"U-18-1","chapter":18,"kind":"applied","q":"市場にある製品や技術の情報を得る目的で送る文書は？","options":["RFP","RFI","SLA","NDA"],"correct":1,"explain":"RFI（Request for Information）は情報提供依頼書。"},{"id":"U-18-2","chapter":18,"kind":"applied","q":"納品された成果物が契約の条件を満たすか確認する行為は？","options":["構成管理","脆弱性評価のみ","検収","資本予算"],"correct":2,"explain":"検収では受入条件に照らして成果物を確認する。"},{"id":"U-18-3","chapter":18,"kind":"applied","q":"完成済みのアプリ機能をネット経由で利用するクラウドサービス分類は？","options":["PaaS","IaaS","オンプレミス","SaaS"],"correct":3,"explain":"SaaSはSoftware as a Service。PaaSは開発実行基盤、IaaSはインフラ資源。"},{"id":"U-18-X01","chapter":18,"kind":"applied","q":"計画の技術・経済・運用上の実現可能性を事前に調べる活動は？","options":["フィージビリティスタディ","回帰テスト","フォローアップ監査","パレート分析"],"correct":0,"explain":"実行可能性を複数観点から調べ、投資・計画判断に使う。"}],"deepIntro":"企画・調達の要点は、発注側が目的・要件・検収基準・責任分担を曖昧にしないこと。","deep":[{"id":"18-X01","title":"システム化計画・要件・調達の実現性","explain":"<p>システム化計画は経営課題、現行業務、対象範囲、目標、費用、スケジュール、移行・運用を整理する。フィージビリティスタディ（実現可能性調査）は技術・経済・法務・運用などの観点で実行可能かを検討する。グリーンITはエネルギーや資源消費を抑える観点。</p><p>要件定義では機能・非機能、優先順位、制約、受入条件を明確にし関係者と合意する。RFI（情報提供依頼）で候補を調査し、RFP（提案依頼）で具体的提案を求める。評価表で必須条件と評価項目を区別し、ベンダの実績、費用、リスク、運用体制を比較する。</p>","worked":"<p>導入費100万円、年の純便益40万円なら単純回収期間2.5年。経済性だけでなく移行リスクも確認する。</p>","prompt":"複数の事業者に具体的な解決案と費用の提示を求める文書は？","answer":"<p>RFP。</p>","beginner":{"scenario":"導入予定の技術が既存機器で動くか、予算内か、法令・運用に適合するか調べる。必要なら試行して不確実性を減らす。","trap":"実現可能性調査は技術だけでなく経済性・運用・法務も含む。","quizId":"U-18-X01"},"textbook":[{"heading":"実現可能性を調べる","body":"フィージビリティスタディ（実現可能性調査）は企画が技術的に可能か、経済的に妥当か、法令や運用条件に適合するかを事前に検討します。技術上の不確実性が大きければPoC（概念実証）で検証することもあります。"},{"heading":"システム化計画を作る","body":"現行業務と課題、将来業務の姿、対象範囲、要求、システム構成、費用、スケジュール、移行・運用方針を整理します。すべての要求を同時に実現する必要があるか優先順位を検討します。"},{"heading":"持続可能性と調達","body":"グリーンITはIT機器やサービスのエネルギー・資源消費を抑える考え方です。消費電力、機器更新、廃棄、データセンター等を評価します。調達時は技術・経済性だけでなく環境・情報管理・契約条件も確認します。"},{"heading":"フィージビリティスタディ","body":"フィージビリティスタディは投資や事業開始前に技術的・経済的・運用上・法的な実現可能性を調査する。デルファイ法は専門家への反復調査、ブレーンストーミングは発想を広げる方法、製品ライフサイクルは市場における製品の段階を表す。"}]},{"id":"18-Y01","title":"システム化計画・投資効果・導入リスク","explain":"<p>システム化計画では目的、対象範囲、実現方式、推進体制、日程、教育、投資・リスクを整理します。PBP（Payback Period：投資回収期間）は初期投資を回収するまでの期間です。</p>","worked":"<p>NPV=60/1.05+60/1.05²−100≈11.56万円。前提が妥当なら正のNPVは経済価値を生む見込みを示す。</p>","prompt":"100万円投資、1年後110万円の純収入、割引率10％のNPVは？","answer":"<p>0万円。110/1.1−100=0。</p>","beginner":{"scenario":"100万円を投資し、1年後60万円、2年後60万円の純収入を得る計画を評価する。","trap":"売上増だけでなく追加運用費や廃棄費用も含める。","quizId":"U-18-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"システム化計画では目的、対象範囲、実現方式、推進体制、日程、教育、投資・リスクを整理します。PBP（Payback Period：投資回収期間）は初期投資を回収するまでの期間です。"},{"heading":"仕組みと使い分け","body":"DCF（Discounted Cash Flow：割引キャッシュフロー）は将来の現金を現在価値に割り引きます。NPV（Net Present Value：正味現在価値）=将来キャッシュフローの現在価値合計−初期投資。割引率5％なら1年後の60は60/1.05です。"},{"heading":"具体的な判断と手順","body":"NPV=60/1.05+60/1.05²−100≈11.56万円。前提が妥当なら正のNPVは経済価値を生む見込みを示す。"},{"heading":"投資回収期間と現在価値","body":"PBP（Payback Period：投資回収期間）法は累積純キャッシュフローが初期投資に到達するまでの期間で評価する。通常のPBPでは時間価値と回収後の収益を考慮しない。割引PBPは別方式。NPV（正味現在価値）やIRR（内部収益率）では割引を考慮する。"}]},{"id":"18-Y02","title":"要求分析・要件定義・利害調整","explain":"<p>要求分析は利用者の課題、目的、制約を抽出し整理する活動です。現状指向は現状の業務から改善点を探し、目的指向は達成したい成果から必要な仕組みを逆算します。</p>","worked":"<p>在庫更新は一操作で行えるようにしつつ、更新者・時刻・旧値・新値を自動記録して監査要件を満たす。</p>","prompt":"「検索を速くする」を検証可能にする要件は？","answer":"<p>100人同時利用時に95％の検索を2秒以内にする。測定条件と合否基準が明確。</p>","beginner":{"scenario":"倉庫担当は在庫入力を簡単にしたいが、経理は正確な履歴が必要だと考える。","trap":"実装方式を先に決めると本来の要求を見失うことがある。","quizId":"U-18-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"要求分析は利用者の課題、目的、制約を抽出し整理する活動です。現状指向は現状の業務から改善点を探し、目的指向は達成したい成果から必要な仕組みを逆算します。"},{"heading":"仕組みと使い分け","body":"業務要件、機能要件、非機能要件、移行・運用条件を整理し優先順位を合意します。要求の衝突は代替案、費用、リスクを比較して解決し、検証可能な受入基準を定め、経営戦略との整合を確認します。"},{"heading":"具体的な判断と手順","body":"在庫更新は一操作で行えるようにしつつ、更新者・時刻・旧値・新値を自動記録して監査要件を満たす。"},{"heading":"要求の矛盾を解決する手順","body":"まず要求の背景と業務上の目的を確認し、次に必須条件と希望を区別します。例えば入力項目を減らす要求と監査記録を増やす要求は、システムが時刻や担当者を自動記録することで両立できる場合があります。決定した要件、理由、承認者、受入試験との対応を残します。"}]},{"id":"18-C01","title":"システム化構想・SoR/SoE/SoI","explain":"<p>販売管理を新しくする際に目的とシステムの役割を整理する。</p><p>シラバスVer.7.2 本文105–106頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>会計の正式記録はSoR、顧客アプリはSoE、購買予測はSoI。</p>","prompt":"標準パッケージの業務に自社業務を合わせる考え方は？","answer":"<p>正解は「Fit to Standard」。Fit to Standard・OOTB：Fit to Standardはパッケージ標準業務に業務プロセスを適合させ、独自改修を減らす考え方。OOTB（Out Of The Box）は製品が初めから持つ機能。法令・競争優位上の必要な差異は個別に評価する。</p>","beginner":{"scenario":"販売管理を新しくする際に目的とシステムの役割を整理する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-18-C01"},"textbook":[{"heading":"システム化構想書","body":"現行業務の課題、将来の業務・ビジネスモデル、システム方式の候補、期待効果、概算費用、制約をまとめ、戦略との整合と承認を得る。BABOK（Business Analysis Body of Knowledge：ビジネス分析知識体系）は要求や価値の分析を体系化する。"},{"heading":"SoR・SoE・SoI","body":"SoR（Systems of Record：記録管理システム）は取引・会計など正式記録、SoE（Systems of Engagement：顧客接点システム）は顧客等との関係・体験、SoI（Systems of Insight：洞察獲得システム）はデータ分析による意思決定支援。実システムは複数の役割を持ち得る。"},{"heading":"Fit to Standard・OOTB","body":"Fit to Standardはパッケージ標準業務に業務プロセスを適合させ、独自改修を減らす考え方。OOTB（Out Of The Box）は製品が初めから持つ機能。法令・競争優位上の必要な差異は個別に評価する。"}]},{"id":"18-1","title":"企画書・RFI・RFP","explain":"<p>システム企画は現状業務の課題、期待効果、対象範囲、予算、期限、制約を整理する。RFI（Request For Information：情報提供依頼書）は候補技術・製品・業者の情報収集に用い、RFP（Request For Proposal：提案依頼書）は要件・評価条件等を示して具体的な提案を求める。要件が不明確なら比較・契約・検収に問題が生じる。</p>\n<p>提案評価では価格だけでなく、機能、セキュリティ、保守体制、納期、実績、移行計画、契約条件、運用コストを重み付けする。評価基準と必須条件を事前に決め、恣意的判断を抑える。</p>\n","worked":"<p>「安いCRMを導入したい」だけでは提案を比較できない。利用者数、顧客データ量、既存連携、権限、障害時のRTO、運用費をRFPで明確にする。</p>\n","prompt":"RFIとRFPは同じ目的か。","answer":"<p>違う。RFIは情報収集、RFPは具体的な提案取得を目的とする。</p>\n","beginner":{"scenario":"市販システムで何が可能か不明ならRFIで情報収集し、要求を整理してからRFPで費用・構成・導入方法の提案を求める。","trap":"RFIは情報提供依頼、RFPは提案依頼。見積り依頼だけとは異なる。","quizId":"U-18-1"},"textbook":[{"heading":"企画から調達へ","body":"最初に経営課題、目的、対象業務、期待効果、制約を明確にします。市場の製品や技術が分からなければRFI（情報提供依頼）で情報を集め、要件が具体化したらRFP（提案依頼）で構成・費用・スケジュール等の提案を求めます。RFQは見積依頼です。"},{"heading":"提案を比較する","body":"価格だけで選ばず、必須要件の充足、機能・品質、導入実績、保守体制、移行リスク、セキュリティ等を比較します。評価基準や重みを事前に定めると恣意的な選定を減らせます。必須条件を満たさない案は別途判断します。"},{"heading":"投資判断と合意","body":"TCO（総保有費用）では初期購入費だけでなく運用・保守・移行・廃棄などを考慮します。費用対効果、契約条件、納品物、受入条件を確認して計画を承認します。技術的に優れていても予算や運用体制に合わない場合があります。"}]},{"id":"18-Y03","title":"RFI・RFP・提案評価・契約と検収","explain":"<p>RFI（Request for Information：情報提供依頼）は市場や製品情報の収集、RFP（Request for Proposal：提案依頼）は要件と評価条件を示して提案を求めるもの、RFQ（Request for Quotation：見積依頼）は価格等の見積りを求めるものです。</p>","worked":"<p>初期200万円・年運用100万円のAと初期350万円・年運用30万円のBでは3年の単純合計はA500万円、B440万円。</p>","prompt":"候補事業者に解決方法・実施体制・価格の提案を求める文書は？","answer":"<p>RFP。要件を示し解決策を提案してもらう文書。</p>","beginner":{"scenario":"複数事業者から販売管理システムの導入提案を募る。","trap":"RFIとRFPを同じものと考えない。","quizId":"U-18-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"RFI（Request for Information：情報提供依頼）は市場や製品情報の収集、RFP（Request for Proposal：提案依頼）は要件と評価条件を示して提案を求めるもの、RFQ（Request for Quotation：見積依頼）は価格等の見積りを求めるものです。"},{"heading":"仕組みと使い分け","body":"調達要件、提案評価基準、責任分界、知財、保守、移行、検収基準を契約に反映します。TCO（Total Cost of Ownership：総保有費用）で取得から運用・廃棄まで比較し、検収で納品内容が合意条件を満たすか確認します。"},{"heading":"具体的な判断と手順","body":"初期200万円・年運用100万円のAと初期350万円・年運用30万円のBでは3年の単純合計はA500万円、B440万円。"},{"heading":"評価基準と検収の分離","body":"提案段階では将来の実現方法や事業者の能力を比較し、納品段階では契約した機能や品質が実際に満たされたかを試験します。選定時に評価した画面のデザインや提案書の説明だけで検収してはいけません。受入条件、成果物、確認方法は契約前に具体化します。"}]},{"id":"18-2","title":"契約・SLA・検収・委託管理","explain":"<p>請負契約は仕事の完成を目的とし、準委任は事務処理などを委託する契約形態で、成果完成義務や責任の考え方が異なる。実際の権利義務は契約内容と適用法令に依存する。契約では成果物、知的財産、検収条件、変更時の手続、欠陥時対応、秘密保持、再委託、終了時のデータ返還などを定義する。</p>\n<p>検収は決めた受入基準に照らして成果物が要件を満たすか判断する。委託先の管理を完全に丸投げせず、アクセス権・再委託先・脆弱性対応・ログなどの管理を継続する。</p>\n","worked":"<p>発注側が口頭で機能追加を指示すると、追加費用や納期の認識がずれる。変更依頼と見積り、承認記録を残して契約上の扱いを確認する。</p>\n","prompt":"ベンダに委託したから個人情報保護やセキュリティの責任をすべて免れるか。","answer":"<p>免れない。委託元としての監督などの義務が残る。</p>\n","beginner":{"scenario":"委託したシステムの受入条件を契約前に決め、納品時に試験して成果物が条件を満たすか検収する。","trap":"委託しても委託元のリスク・成果管理責任が消えるわけではない。","quizId":"U-18-2"},"textbook":[{"heading":"契約で責任を明確にする","body":"請負は原則として仕事の完成を目的とし、準委任は業務を適切に遂行することを目的とする契約類型です。実際の権利義務は契約内容と法令に従います。委託する範囲、納期、成果物、費用、知的財産、秘密保持、再委託の条件などを明確にします。"},{"heading":"受入とサービス水準","body":"検収では納品物が合意した受入条件を満たすか確認します。運用サービスではSLA（サービスレベル合意）で稼働率や応答時間、サポート条件等を明確にします。不適合や障害時の対応手順も決めます。"},{"heading":"委託先の管理","body":"委託しても自社の業務リスクや情報管理責任が消えるわけではありません。委託先のアクセス権、データ保護、監査、契約終了後のデータ返却・消去を確認します。変更要求は影響を評価し合意した手続で扱います。"}]},{"id":"18-3","title":"サービス選定・クラウド・移行計画","explain":"<p>SaaS（Software as a Service：サービスとしてのソフトウェア）はアプリ利用、PaaS（Platform as a Service：サービスとしてのプラットフォーム）は実行基盤、IaaS（Infrastructure as a Service：サービスとしてのインフラ）は仮想機器等を提供する典型的な区分。いずれも利用者と提供者の責任分界点を確認する。クラウドでもデータ分類・アクセス権・利用者設定は利用側の責任が残る。</p>\n<p>移行はデータ変換、並行稼働、切替条件、ロールバック、利用者教育、運用引継ぎを計画する。TCO（Total Cost of Ownership：総保有コスト）は初期費用だけでなく運用、保守、教育、移行・撤退費用を含めた総額。</p>\n","worked":"<p>低料金のSaaSを導入しても、既存データの移行費が高く、エクスポート制約が強ければ5年間のTCOが大きくなる。初期費用だけで比較しない。</p>\n","prompt":"SaaSならユーザー権限の設定は全て提供事業者が責任を持つか。","answer":"<p>通常、利用企業側にも設定・利用管理の責任がある。</p>\n","beginner":{"scenario":"IaaSでは利用者がOSやアプリを管理する場合が多く、SaaSでは提供者がアプリを提供・運用する。利用者権限やデータ管理は利用者にも残る。","trap":"具体的な責任分界はサービス・契約に依存する。","quizId":"U-18-3"},"textbook":[{"heading":"クラウドの種類","body":"IaaS（インフラ資源のサービス）は仮想サーバ等、PaaS（開発・実行基盤のサービス）はアプリの実行環境、SaaS（ソフトウェアのサービス）は完成済みアプリを提供します。利用者が管理する範囲は順に減る傾向がありますが、データ・権限等の責任は残り得ます。"},{"heading":"選定時に見る点","body":"自社設備に導入するオンプレミス、クラウド、両者を組み合わせる方式を、費用、性能、可用性、法令、データ所在地、運用能力、移行性で比較します。特定提供者へ依存して切替が難しくなるベンダーロックインにも注意します。"},{"heading":"移行の計画","body":"現行の業務停止許容時間、データ量、依存システムを調べ、移行手順とリハーサル、照合方法、切戻し条件を用意します。サービス開始後の監視・教育・問い合わせ対応も必要です。"}]}],"beginnerIntro":"投資判断、要件、調達、契約、移行を計画する。誰が何を提供し、何を満たせば受入れるかを明確にする。","studyGroups":[{"title":"構想と要件","body":"課題を構想、計画、要求、調達条件へ落とし込む。","ids":["18-X01","18-Y01","18-Y02","18-C01"]},{"title":"調達・契約","body":"情報収集から提案依頼、評価、契約、検収へ進む。","ids":["18-1","18-Y03","18-2"]},{"title":"導入計画","body":"移行と運用体制を選択し、導入リスクを抑える。","ids":["18-3"]}]},{"id":19,"title":"経営戦略・マーケティング","group":"ストラテジ","priority":"A重要","summary":"SWOT、PPM、4P、競争戦略、KPI、財務の基礎。","lessons":[{"title":"経営分析","body":"SWOT分析はStrengths（強み）・Weaknesses（弱み）の内部要因とOpportunities（機会）・Threats（脅威）の外部要因を整理する。クロスSWOTで施策候補を考える。","check":"機会と強みを混同しない。"},{"title":"事業ポートフォリオ","body":"PPM（Product Portfolio Management：製品ポートフォリオ管理）は市場成長率と相対市場占有率で事業を分類する代表的枠組み。資金配分の議論に使うがそれだけで投資判断はできない。","check":"問題文の軸を見失わない。"},{"title":"マーケティングとKPI","body":"4PはProduct（製品）・Price（価格）・Place（流通）・Promotion（販売促進）。KGI（Key Goal Indicator：重要目標達成指標）を達成するための途中指標がKPI（Key Performance Indicator：重要業績評価指標）。","check":"成果指標と活動指標を使い分ける。"},{"title":"収益モデル","body":"売上高−変動費＝限界利益。損益分岐点売上高＝固定費÷限界利益率。価格・数量・単位変動費を変えて感度分析する。","check":"売上高ではなく限界利益が固定費を回収する。"}],"terms":[{"term":"SWOT分析","definition":"内部の強み・弱みと外部の機会・脅威を整理する手法"},{"term":"PPM","definition":"市場成長率と相対市場占有率で事業を分類する枠組み"},{"term":"4P","definition":"製品・価格・流通・販売促進の施策を組み合わせる考え方"},{"term":"STP","definition":"市場細分化・対象選択・位置付けを行うマーケティング手法"},{"term":"KGI","definition":"最終的な目標達成を測定する指標"},{"term":"KPI","definition":"目標達成に向けた途中の活動・成果を測る指標"},{"term":"限界利益","definition":"売上高から変動費を差し引いた利益"},{"term":"損益分岐点","definition":"売上と費用が一致し利益がゼロになる水準"},{"term":"ファイブフォース","definition":"業界の競争要因を五つの力で分析する枠組み"},{"term":"バランストスコアカード","definition":"財務・顧客・業務プロセス・学習と成長を多面的に評価する仕組み"}],"questions":[{"id":"Q19-01","chapter":19,"kind":"applied","q":"固定費300万円、限界利益率30%のとき損益分岐点売上高は。","options":["100万円","300万円","900万円","1000万円"],"correct":3,"explain":"300÷0.3=1000万円。"},{"id":"Q19-02","chapter":19,"kind":"applied","q":"SWOTの「新規規制で市場需要が減る」は。","options":["強み","弱み","機会","脅威"],"correct":3,"explain":"自社外部のマイナス要因なので脅威。"},{"id":"Q19-03","chapter":19,"kind":"applied","q":"最終目標「年間売上10億円」に対し商談数を週次管理する指標は主に。","options":["KGI","KPI","IRR","RPO"],"correct":1,"explain":"商談数は最終目標の先行・中間指標。"},{"id":"D19-01","chapter":19,"kind":"applied","q":"SWOT分析で「競合大手の低価格参入」はどの区分に当たるか。","options":["自社の強み","自社の弱み","外部の機会","外部の脅威"],"correct":3,"explain":"競合参入は外部環境に由来する脅威（Threat）。"},{"id":"D19-02","chapter":19,"kind":"applied","q":"STP分析の正しい順番はどれか。","options":["対象選択→細分化→位置付け","市場細分化→対象選択→位置付け","製品→価格→流通","販売→調達→製造"],"correct":1,"explain":"Segmentation→Targeting→Positioning。誰にどんな価値を提供するか決める。"},{"id":"D19-03","chapter":19,"kind":"applied","q":"ファイブフォース分析が主に扱う対象はどれか。","options":["企業会計の帳簿","ソフトウェアのテストケース","業界の競争構造と収益圧力","人的資源の勤怠"],"correct":2,"explain":"競合、新規参入、代替品、買い手、売り手の5つの競争圧力を分析する。"},{"id":"Q-19-X01","chapter":19,"kind":"applied","q":"暗黙知を言語化して形式知にするSECIの過程は？","options":["共同化","表出化","連結化","内面化"],"correct":1,"explain":"表出化。"},{"id":"U-19-1","chapter":19,"kind":"applied","q":"SWOT分析で新たな競合参入は通常どれに当たるか？","options":["強み（S）","脅威（T）","弱み（W）","機会（O）"],"correct":1,"explain":"外部環境の不利な要因は脅威。"},{"id":"U-19-2","chapter":19,"kind":"applied","q":"4Pで販売経路を表す要素は？","options":["Product（製品）","Price（価格）","Place（流通）","Promotion（販売促進）"],"correct":2,"explain":"Placeは商品・サービスを顧客へ届ける経路。"},{"id":"U-19-3","chapter":19,"kind":"applied","q":"PPMで低成長かつ相対シェアが高い事業は？","options":["花形","問題児","負け犬","金のなる木"],"correct":3,"explain":"低成長でも高シェアなら資金創出が期待される分類。"},{"id":"U-19-X01","chapter":19,"kind":"applied","q":"BSCの4視点に含まれないものは？","options":["競合企業の株価のみ","財務","顧客","学習と成長"],"correct":0,"explain":"BSCの4視点は財務、顧客、内部業務プロセス、学習と成長。"}],"deepIntro":"経営指標や分析フレームワークは名前を覚えるだけでなく、どんな意思決定に使えるかを考える。","deep":[{"id":"19-1","title":"3C・SWOT・ファイブフォース","explain":"<p>3C分析はCustomer（顧客）、Competitor（競合）、Company（自社）。SWOT分析はStrength（強み）、Weakness（弱み）、Opportunity（機会）、Threat（脅威）を整理し、内部要因と外部要因を分ける。ファイブフォース分析は競合間の敵対、売り手・買い手の交渉力、新規参入、代替品の脅威による業界の収益構造を分析する。</p>\n<p>PEST分析はPolitical（政治）、Economic（経済）、Social（社会）、Technological（技術）の外部環境。各フレームワークは答えを自動で出すものではなく、仮説整理と追加調査に使う。市場データや顧客調査で裏付ける。</p>\n","worked":"<p>「大手が低価格で参入」は自社の弱みではなく外部の脅威。「自社独自の技術者集団」は内部の強み。分類した上で、技術力をどの顧客課題へ使うかを考える。</p>\n","prompt":"SWOTのOpportunityは自社の能力そのものか。","answer":"<p>違う。市場拡大・規制変更など外部の機会。</p>\n","beginner":{"scenario":"自社の強い技術と弱い営業力は内部要因、市場の成長と競合参入は外部要因。内部と外部、好ましいか不利かを区別する。","trap":"SWOTの分類は自社との関係で考える。市場全体の成長は通常外部の機会。","quizId":"U-19-1"},"textbook":[{"heading":"自社を取り巻く環境","body":"3C分析はCustomer（顧客・市場）、Competitor（競合）、Company（自社）の3視点から事業の状況を整理します。顧客が求める価値、競合との違い、自社の強みを関連付けます。"},{"heading":"SWOT分析","body":"Strength（強み）とWeakness（弱み）は内部要因、Opportunity（機会）とThreat（脅威）は外部要因です。例えば独自技術は強み、販売網不足は弱み、市場拡大は機会、競合参入は脅威です。組合せから強みを活かす施策や脅威への対応を考えます。"},{"heading":"業界の利益構造","body":"ファイブフォース分析は既存競争、新規参入、代替品、買い手の交渉力、売り手の交渉力から業界の競争圧力を考えます。例えば代替品が容易に利用できると価格を上げにくくなります。SWOTは自社との関係、ファイブフォースは主に業界構造を見る手法です。"}],"walkthrough":{"heading":"一つの企業で3C・SWOT・5フォースを比較する","body":"学習アプリを売る企業を想定します。3Cでは受験者が何を求めるか、競合の教材はどんな機能を持つか、自社の教材編集力や開発力はどうかを調べます。SWOTでは内部の強みを「分かりやすい教材」、弱みを「認知度不足」、外部の機会を「試験方式の変化」、脅威を「無料教材の増加」と整理できます。ファイブフォースでは競合間の競争、新規参入の容易さ、無料動画等の代替品、利用者が乗換えやすいこと、教材供給者や配布基盤への依存を調べます。三つは同じ分析ではなく、異なる視点から事業の判断を支援します。","cols":["手法","主に答える問い"],"rows":[["3C","顧客・競合・自社はどうなっているか"],["SWOT","内部の強弱と外部の機会・脅威は何か"],["5フォース","業界で利益を得にくくする圧力は何か"]]}},{"id":"19-C01","title":"組織変革・経営資源・社会環境","explain":"<p>新しい事業環境に適応するため組織を変える。</p><p>シラバスVer.7.2 本文109頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>従業員が変革の必要性を知るだけでなく実行能力・定着を支援するのがADKARの考え方。</p>","prompt":"操作研修は済んだが従業員が必要性を理解せず利用を避ける。ADKARのどの観点を点検すべきか。","answer":"<p>必要性の認知（Awareness）と参加意欲（Desire）。研修は知識・能力を支援するが、必要性や意欲の問題を解消するとは限らない。</p>","beginner":{"scenario":"新しい事業環境に適応するため組織を変える。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-19-C01"},"textbook":[{"heading":"戦略を変える必要が生じる理由","body":"企業を取り巻く顧客ニーズ、競合、技術、制度は変化します。今まで利益を生んだ資源や手順が将来も有効とは限りません。VUCA（Volatility: 変動性、Uncertainty: 不確実性、Complexity: 複雑性、Ambiguity: 曖昧性）は、このような環境の特徴を表す言葉で、戦略そのものではありません。"},{"heading":"変化を見つけ、資源を組み替える","body":"ダイナミックケイパビリティは変化を察知し、機会を捉え、資源や組織を再構成する能力です。既存業務を効率よく行う能力と区別します。IPランドスケープ（知的財産情報を用いた戦略分析）は特許情報を市場・経営情報と組み合わせ、競合の技術方向や事業機会を分析する方法です。分析は機会を見つけるための手段であり、実際に資源を移す判断が別に必要です。"},{"heading":"顧客などと価値を共に作る","body":"コ・クリエーション（共創）は顧客・取引先・他企業などが価値の創出に関与することです。一方的に完成品を提供するのではなく、利用者の知識や外部の資源を活用して価値の仮説を改善します。共創は戦略を実現する方法の一つで、単なる意見募集と同一ではありません。"},{"heading":"組織の変化を個人へつなげる","body":"ADKARはAwareness（必要性の認知）、Desire（参加する意欲）、Knowledge（知識）、Ability（実行能力）、Reinforcement（定着）の五要素で個人の変革を考えるモデルです。新しい仕組みを入れるだけでは人は使い続けません。どこで変革が止まっているかを特定し、説明・教育・支援・定着策を選びます。チェンジマネジメントはこうした変革を計画的に進める活動です。"},{"heading":"社会環境も経営に反映する","body":"サーキュラーエコノミー（循環経済）は製品や資源の再利用・修理・再生などによって廃棄や新規資源投入を抑える考え方です。TCFD（Task Force on Climate-related Financial Disclosures: 気候関連財務情報開示タスクフォース）の提言は、気候関連のガバナンス、戦略、リスク管理、指標と目標の開示を整理しました。循環経済は資源利用の考え方、TCFD提言はリスク等の開示枠組みで、同じ施策ではありません。現行の開示義務の個別判断は制度を別途確認します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"19-3","title":"競争戦略・製品ポートフォリオ","explain":"<p>コストリーダーシップは低コスト構造、差別化は独自価値、集中戦略は特定市場へ資源を絞る考え方。PPM（Product Portfolio Management：製品ポートフォリオ管理）では市場成長率と相対市場シェア等の軸で「花形・金のなる木・問題児・負け犬」に分類する。ただし分類で投資の可否が自動決定されるわけではない。</p>\n<p>バリューチェーンは調達・製造・物流・販売・サービス等を活動単位で分析し、競争優位の源泉を探る。VRIO分析はValue（価値）、Rarity（希少性）、Imitability（模倣困難性）、Organization（組織）を検討する。</p>\n","worked":"<p>高い顧客継続率が強みでも、競合も同じ仕組みを容易に導入できるなら持続的優位とは限らない。模倣困難性と組織的活用を確認する。</p>\n","prompt":"PPMで成長率が高い事業は必ず利益が高いか。","answer":"<p>そうとは限らない。獲得投資で赤字の場合もある。</p>\n","beginner":{"scenario":"高成長・高シェア事業は花形、低成長・高シェアは金のなる木。収益を成長事業へ配分する判断材料にする。","trap":"PPMの分類だけで事業撤退を決めず、利益・相乗効果・将来性も見る。","quizId":"U-19-3"},"textbook":[{"heading":"競争優位を作る","body":"コストリーダーシップは低コスト構造、差別化は顧客が認める独自価値、集中戦略は特定市場に絞ることで競争優位を目指す考え方です。規模の経済は生産量拡大で単位当たり費用が下がること、範囲の経済は複数製品で資源を共有することで費用を抑えることです。"},{"heading":"事業ポートフォリオ","body":"PPM（Product Portfolio Management：製品・事業ポートフォリオ管理）は市場成長率と相対市場占有率で事業を分類します。高成長・高シェアは花形、低成長・高シェアは金のなる木、高成長・低シェアは問題児、低成長・低シェアは負け犬です。資金創出と投資配分を考える材料にします。"},{"heading":"成長の方向","body":"アンゾフの成長マトリクスは既存・新規の市場と製品を組み合わせ、市場浸透、市場開拓、製品開発、多角化を区別します。分類だけで投資や撤退を決めず、収益性、将来性、競争力、他事業との関係を評価します。"}]},{"id":"19-Y01","title":"競争戦略・成長戦略・事業ポートフォリオ","explain":"<p>アンゾフの成長マトリクスは既存・新規の市場と製品で市場浸透、市場開拓、製品開発、多角化を区別します。ポーターの基本戦略はコスト優位、差別化、集中を扱います。</p>","worked":"<p>既存ゲームを新地域へ販売するのは市場開拓。成長率が低く相対シェアが高い事業は金のなる木。</p>","prompt":"既存製品を新規市場へ売る戦略は？","answer":"<p>市場開拓。製品は既存、市場が新規。</p>","beginner":{"scenario":"既存のゲームを新しい地域へ販売するか、新しいサービスを既存顧客へ提供するか検討する。","trap":"市場シェアが高ければ常に成長市場とは限らない。","quizId":"U-19-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"アンゾフの成長マトリクスは既存・新規の市場と製品で市場浸透、市場開拓、製品開発、多角化を区別します。ポーターの基本戦略はコスト優位、差別化、集中を扱います。"},{"heading":"仕組みと使い分け","body":"PPM（Product Portfolio Management：製品ポートフォリオ管理）は市場成長率と相対的市場シェアで花形、金のなる木、問題児、負け犬に分類します。VRIOは価値、希少性、模倣困難性、組織を観点として経営資源を評価します。"},{"heading":"具体的な判断と手順","body":"既存ゲームを新地域へ販売するのは市場開拓。成長率が低く相対シェアが高い事業は金のなる木。"},{"heading":"市場浸透と市場開拓","body":"既存地域で既存商品の販促により購入者を増やすのは市場浸透。新地域で既存商品を販売するのは市場開拓。既存市場へ新製品を出すのは製品開発。新市場・新製品なら多角化。"}]},{"id":"19-C02","title":"全社戦略・競争・価値連鎖","explain":"<p>企業グループ全体の経営資源を配分する。</p><p>シラバスVer.7.2 本文109–110頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>グループ各社の給与計算を一つの共通部門へ集約する。</p>","prompt":"グループ各社の給与処理を共通部門に集約する施策と、新しい顧客価値によって未開拓市場を作る施策を、それぞれ何と呼ぶか。目的の違いも説明せよ。","answer":"<p>前者はシェアードサービスで共通業務の効率化、後者はブルーオーシャン戦略で新しい需要・価値の創出を狙う。内部業務の管理方式と市場戦略という異なる分類である。</p>","beginner":{"scenario":"企業グループ全体の経営資源を配分する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-19-C02"},"textbook":[{"heading":"企業全体と事業の戦略を分ける","body":"全社戦略はどの事業を行い、経営資源をどこへ配分するかを決めます。事業戦略は個別市場でどのように競合より価値を提供するかを決めます。ドメインは事業領域、コアコンピタンスは競争優位の中核となる能力です。複数事業で資源を活用し、単独の成果の合計を上回る効果をシナジー（相乗効果）と呼びます。"},{"heading":"外部資源を得る手段","body":"M&A（Mergers and Acquisitions: 合併・買収）は企業や事業の統合・取得、TOB（Takeover Bid: 公開買付け）は不特定多数の株主などに条件を示して株式を買い付ける手段、アライアンスは企業間の提携です。支配・独立性・費用・リスクの違いを考えます。インキュベーターは起業支援、クラウドファンディングは多数の人から資金を募る方法で、企業取得とは異なります。"},{"heading":"共通業務と費用の改善","body":"シェアードサービスはグループ企業の経理、人事など共通業務を集約し、重複や運用コストを減らす仕組みです。経験曲線は累積生産量が増えるにつれて単位費用が下がる経験的傾向で、学習・工程改善などが関係します。組織集約と経験による改善は異なる要因ですが、いずれも効率化に関係します。"},{"heading":"市場で価値をどう提供するか","body":"同質化戦略は競合の差別化要因に対し同等の価値を提供して優位の差を縮める考え方です。ブルーオーシャン戦略は競争の激しい既存市場で争うだけでなく、新しい価値や需要を開拓します。自社資源、顧客の求める価値、競争環境を考慮して選択します。"},{"heading":"価値連鎖分析で活動をつなげる","body":"バリューチェーン（価値連鎖）は調達・製造・物流・販売・サービスなどの主活動と、人事・技術開発などの支援活動を通じて価値が生まれると考える枠組みです。活動ごとの費用や顧客価値への寄与、そのつながりを分析して競争優位の源泉を探します。単なる部門一覧ではなく、どの活動を改善・統合すると価値が高まるかを検討します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"全社・事業・実行の分類軸を追加。"}},{"id":"19-2","title":"STP・4P・製品ライフサイクル","explain":"<p>STPはSegmentation（市場細分化）、Targeting（対象市場選択）、Positioning（選ばれる位置付け）の順に考える。4PはProduct（製品）、Price（価格）、Place（流通）、Promotion（販促）。顧客側からは4C（顧客価値・顧客コスト・利便性・コミュニケーション）で考える方法がある。</p>\n<p>製品ライフサイクルは導入・成長・成熟・衰退で、需要、競争、価格戦略が変わるというモデル。実際の製品は一律の曲線をたどるわけではない。LTV（Life Time Value：顧客生涯価値）は一定期間にわたる顧客からの価値、CAC（Customer Acquisition Cost：顧客獲得費用）は獲得コスト。計算の範囲を統一する。</p>\n","worked":"<p>開発者向け高機能ツールを学生のライト層へそのまま宣伝しても訴求がずれる。STPで対象を分け、重要価値（手間削減・カスタマイズ等）を選ぶ。</p>\n","prompt":"4PのPlaceは製品を置く物理的な棚だけを意味するか。","answer":"<p>違う。販売チャネル・流通・提供経路全体を含む。</p>\n","beginner":{"scenario":"学生向けに安価で使いやすいアプリを位置づけたら、月額、機能、販売経路、広告を決める。対象と提供価値から販売施策を組み立てる。","trap":"STPは市場選択と位置づけ、4Pは具体的なマーケティング施策。","quizId":"U-19-2"},"textbook":[{"heading":"誰に価値を届けるか","body":"STPはSegmentation（市場細分化）、Targeting（対象市場選択）、Positioning（位置づけ）です。年齢や利用目的、購買行動などで市場を分け、自社が価値を提供できる対象を選び、競合との違いを明確にします。"},{"heading":"施策に落とす","body":"4PはProduct（製品）、Price（価格）、Place（流通）、Promotion（販売促進）です。例えば学生向け低価格アプリなら機能、月額、提供経路、広告方法を一貫して決めます。顧客の立場から価値・費用・利便性・コミュニケーションなどを見る4Cという考え方もあります。"},{"heading":"製品の成長段階","body":"製品ライフサイクルは導入期、成長期、成熟期、衰退期などで市場の変化を考えます。導入期は認知、成長期は需要拡大への対応、成熟期は差別化や効率化などが重要になる場合があります。実際の製品が必ずこの順に進むとは限りません。"},{"heading":"売り手4Pと買い手4C","body":"Product（製品）↔Customer Value（顧客価値）、Price（価格）↔Cost（顧客コスト）、Place（流通）↔Convenience（利便性）、Promotion（販促）↔Communication（双方向の対話）。同じ施策を売手側と顧客側から見直す。"}]},{"id":"19-C03","title":"マーケティング調査・購買行動","explain":"<p>商品の選ばれる理由と価格への反応を調べる。</p><p>シラバスVer.7.2 本文110–111頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>直近購入が新しく購入回数・金額が多い層をRFMで抽出する。</p>","prompt":"機能と価格の組合せに対する選好から各属性の寄与を推定する手法は？","answer":"<p>正解は「コンジョイント分析」。調査・分析：コンジョイント分析は複数属性の組合せの選好から属性の寄与を推定する。価格感度測定法は価格に対する許容範囲を調査する。エスノグラフィー調査は生活・行動を観察し文脈を理解する。クロス集計はカテゴリ間の関係を表で見る。</p>","beginner":{"scenario":"商品の選ばれる理由と価格への反応を調べる。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-19-C03"},"textbook":[{"heading":"調査・分析","body":"コンジョイント分析は複数属性の組合せの選好から属性の寄与を推定する。価格感度測定法は価格に対する許容範囲を調査する。エスノグラフィー調査は生活・行動を観察し文脈を理解する。クロス集計はカテゴリ間の関係を表で見る。"},{"heading":"購買・顧客行動","body":"RFM（Recency, Frequency, Monetary：最終購買時期・頻度・金額）分析は顧客を購買実績で分類する。AIDMAは注意・関心・欲求・記憶・行動。アサエルの購買行動類型は関与度とブランド差で購買行動を捉える。"},{"heading":"ブランド・価値","body":"バリュープロポジションは顧客へ提供する価値、ブランドポジショニングは競合に対する認知上の位置、ブランドアイデンティティは企業が表現したいブランド像。DEARフレームワーク等の利用者理解の手法は目的に合わせて選ぶ。"}]},{"id":"19-Y02","title":"価格戦略・販売経路・Webマーケティング指標","explain":"<p>スキミング価格は初期に高い価格で支払意思の高い顧客を狙い、ペネトレーション価格は低い初期価格で普及を狙います。ダイナミック価格は需要等に応じ変え、コストプラス法は原価に利益を加えます。</p>","worked":"<p>訪問2000件、購入40件ならCVR=2％。ページA/B比較では対象を適切に割り付け、購入率などを評価する。</p>","prompt":"ページAは訪問1000件で30件購入、Bは訪問2000件で40件購入。転換率の高いページと、購入件数の多いページを答えよ。","answer":"<p>Aは3%、Bは2%なので転換率はA、購入件数はBが多い。母数が異なるので件数だけでページの転換性能を比較できない。利益や流入条件も確認する。</p>","beginner":{"scenario":"新製品を高価格から始めるか、低価格で普及させるかを検討する。","trap":"閲覧数が増えても購入率や利益が増えるとは限らない。","quizId":"U-19-Y02"},"textbook":[{"heading":"価格と販路は何を決めるか","body":"マーケティングではターゲット顧客と提供価値を決めた後、その価値をどの価格で、どの経路から、どのように伝えるか設計します。売上だけでなく利益、顧客獲得、継続購入など目的に合った評価指標を選ぶ必要があります。"},{"heading":"価格戦略の軸","body":"スキミング価格は高い支払意思を持つ顧客から初期に利益を得るため高価格を設定する方法です。ペネトレーション価格は低い価格で市場への浸透を進める方法です。ダイナミック価格は需要や時期等に応じ価格を変え、コストプラス法は原価に利益を加えて価格を決めます。目的、競合、需要、原価を考慮し、低価格だけが常に有利とは限りません。"},{"heading":"顧客が商品へ到達する経路","body":"オムニチャネルは店舗、電子商取引（EC: Electronic Commerce）、アプリ等を連携させ、一貫した顧客体験を提供する考え方です。複数販路を持つだけではなく、購入履歴や在庫、受取などを適切に連携させます。SEO（Search Engine Optimization: 検索エンジン最適化）は自然検索からの発見性、LPO（Landing Page Optimization: ランディングページ最適化）は到達後の行動を改善する手法です。"},{"heading":"転換率でボトルネックを探す","body":"CVR（Conversion Rate: 転換率）は定めた目的行動の数÷対象訪問数等です。購入が目標で訪問2000件・購入40件なら40/2000×100=2%です。訪問が増えても購入率や利益が低下することがあります。どの期間・母数・目的行動を使ったか明示して比較します。"},{"heading":"改善の効果を検証する","body":"A/Bテストではページなどの変更を異なる利用者群に割り当て、購入率等の差を比較します。比較条件、対象の偏り、標本数を考慮し、利益や返品率などの副作用も確認します。SEOで流入を増やす段階とLPOで転換率を改善する段階を混同しないようにします。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"指標の分母、施策と評価の接続。"}},{"id":"19-Z01","title":"顧客体験・サービスデザイン・仮説検証","explain":"<p>シラバス本文110–111頁（1）③④を根拠にした補強単元です。</p>","worked":"<p>予約後の待ち時間を調査し、受付画面と裏側の予約データ連携を改善して再来店率を比較する。</p>","prompt":"顧客の行動と、顧客から見えない裏側の業務を対応づける道具は？","answer":"<p>サービスブループリントは顧客接点と裏側の業務・支援システムの関係を表す。</p>","beginner":{"scenario":"予約サイトの画面は使いやすいが、来店後に予約情報が伝わらず顧客が待たされる。","trap":"見た目の改善だけでサービス全体の顧客体験が改善するとは限らない。","quizId":"U-19-Z01"},"textbook":[{"heading":"UXとCXの違い","body":"UX（User Experience：利用者体験）は製品やサービスを使う前、使用中、使用後に得る体験です。予期的、瞬間的、エピソード的、累積的な体験を区別できます。CX（Customer Experience：顧客体験）は広告、予約、来店、サポート等の企業との接点全体を対象にします。"},{"heading":"サービスの仕組みを描く","body":"カスタマージャーニーマップは顧客の行動、接点、感情、課題を時系列で可視化します。サービスブループリントは顧客に見える行動に加え、裏側の業務・支援システムを描きます。サービスデザインは人間中心、共創、反復、連続性、実際の根拠、全体性を重視します。"},{"heading":"仮説を検証する","body":"デザイン思考では利用者理解から課題を定義し、案を出して試作品を評価し改善します。ペルソナは調査に基づく代表的利用者像、アサンプションマップは未確認の仮説を重要性と根拠の程度で整理する方法です。LTV（Life Time Value：顧客生涯価値）、リテンション率（継続率）、転換率などを目的に応じて測ります。"}]},{"id":"19-X01","title":"経営管理システム・目標・知識管理","explain":"<p>BSC（バランストスコアカード）は財務、顧客、内部業務プロセス、学習と成長の4視点から戦略を指標に落とし込む。KGI（重要目標達成指標）は最終成果、KPI（重要業績評価指標）は途中の達成状況を測る。</p><p>ERPは企業資源計画、SFAは営業支援、CRMは顧客関係管理、SCMは供給連鎖管理、KMSは知識管理システム。SECIモデルは共同化・表出化・連結化・内面化で暗黙知と形式知が循環する。TOC（制約条件理論）は全体成果を制限する制約に注目する。</p>","worked":"<p>営業担当の訪問履歴と案件の進捗をSFAで共有し、顧客対応履歴をCRMで活用する。</p>","prompt":"暗黙知を言語化して形式知にするSECIの過程は？","answer":"<p>表出化。</p>","beginner":{"scenario":"営業利益を伸ばす戦略なら、顧客満足、処理時間、社員の技能などを先行指標として追い、最終的な財務成果との関係を検証する。","trap":"KPIは最終成果に結び付く指標を選ぶ。活動量だけを増やしても成果とは限らない。","quizId":"U-19-X01"},"textbook":[{"heading":"戦略を測定可能にする","body":"BSC（バランストスコアカード）は財務、顧客、内部業務プロセス、学習と成長の4視点で戦略を指標へ落とし込みます。財務成果だけでなく、その成果を生み出す顧客満足や業務改善、技能習得を考えます。KGIは最終成果、KPIは進捗や要因の指標です。"},{"heading":"業務を支える仕組み","body":"ERP（企業資源計画）は会計・販売・生産等の情報を統合し、CRM（顧客関係管理）は顧客との関係を管理、SFA（営業支援）は営業案件や活動を支援、SCM（供給連鎖管理）は供給・物流の全体最適を目指します。"},{"heading":"組織の知識を活かす","body":"SECIモデルは共同化（暗黙知の共有）、表出化（暗黙知の形式知化）、連結化（形式知の組合せ）、内面化（形式知を実践して暗黙知化）の循環です。TOC（制約条件理論）は全体の成果を制限する要因に注目し、そこを改善します。"}]},{"id":"19-Y03","title":"BSC・CSF・KPIによる戦略実行","explain":"<p>BSC（Balanced Scorecard：バランススコアカード）は財務、顧客、内部業務プロセス、学習と成長の四視点で戦略を具体化します。CSF（Critical Success Factor：重要成功要因）は達成に欠かせない条件です。</p>","worked":"<p>従業員教育→対応品質向上→顧客満足→継続利用・利益向上という仮説を各視点の指標で検証する。</p>","prompt":"BSCの学習と成長の視点に最も近い指標は？","answer":"<p>従業員の技能認定取得率。人材・組織能力は学習と成長。残りは財務、顧客、内部業務。</p>","beginner":{"scenario":"売上を伸ばしたい企業が、短期の利益だけでなく顧客満足や従業員の技能も管理する。","trap":"KPIを達成してもKGIが達成されるとは限らない。","quizId":"U-19-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"BSC（Balanced Scorecard：バランススコアカード）は財務、顧客、内部業務プロセス、学習と成長の四視点で戦略を具体化します。CSF（Critical Success Factor：重要成功要因）は達成に欠かせない条件です。"},{"heading":"仕組みと使い分け","body":"目標（KGI）、成功要因、活動とKPIを因果関係の仮説としてつなげます。目標値、期限、測定頻度、担当を設定し、結果が想定と違えば戦略や指標を見直します。"},{"heading":"具体的な判断と手順","body":"従業員教育→対応品質向上→顧客満足→継続利用・利益向上という仮説を各視点の指標で検証する。"},{"heading":"戦略指標の関係を数値で追う","body":"顧客の継続利用を伸ばしたい場合、問い合わせ解決率を内部業務の指標、再契約率を顧客の指標、利益率を財務の指標にできます。解決率が改善しても再契約率が変わらなければ、想定した因果関係を再検討し、製品品質や価格など他の要因を調べます。"},{"heading":"戦略マップ","body":"BSCの四つの視点にある戦略目標を因果関係の仮説としてつなぐ。教育→応対品質向上→顧客満足→利益改善というような関係を図で可視化し、各指標で検証する。市場での位置を2軸で示すポジショニングマップとは異なる。"}]},{"id":"19-Y04","title":"経営管理システム・知識管理","explain":"<p>ERP（Enterprise Resource Planning：企業資源計画）は会計、生産、販売などの基幹業務を統合します。CRM（Customer Relationship Management：顧客関係管理）は顧客との関係、SFA（Sales Force Automation：営業支援）は商談活動を支援します。</p>","worked":"<p>熟練担当者の判断基準を手順書に書き出すのは表出化。手順書を実践して技能を身につけるのは内面化。</p>","prompt":"熟練者の暗黙知を言語化するSECIの過程は？","answer":"<p>表出化。暗黙知→形式知が表出化。</p>","beginner":{"scenario":"営業が見込み客情報を管理し、経営者が事業全体を分析したい。","trap":"ERPとCRMは対象が異なり、相互連携して使う場合もある。","quizId":"U-19-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ERP（Enterprise Resource Planning：企業資源計画）は会計、生産、販売などの基幹業務を統合します。CRM（Customer Relationship Management：顧客関係管理）は顧客との関係、SFA（Sales Force Automation：営業支援）は商談活動を支援します。"},{"heading":"仕組みと使い分け","body":"BI（Business Intelligence：経営情報分析）はデータを集約し意思決定を支援します。KMS（Knowledge Management System：知識管理システム）は経験・知識を共有します。SECIモデルは共同化、表出化、連結化、内面化による暗黙知と形式知の変換を扱います。"},{"heading":"具体的な判断と手順","body":"熟練担当者の判断基準を手順書に書き出すのは表出化。手順書を実践して技能を身につけるのは内面化。"}]},{"id":"19-C04","title":"供給連携と企業内情報共有","explain":"<p>小売・メーカーの間で在庫と情報の流れを改善する。</p><p>シラバスVer.7.2 本文112–113頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>小売の販売実績を製造側が共有し補充計画を改善するのはECR。</p>","prompt":"小売とメーカーが販売情報を共有して補充を改善する活動と、社員が業務情報へ共通入口からアクセスする仕組みを区別せよ。","answer":"<p>前者はECR（効率的消費者対応）で企業間の供給連携、後者はEIP（企業内情報ポータル）で社内情報アクセスの改善。</p>","beginner":{"scenario":"小売・メーカーの間で在庫と情報の流れを改善する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-19-C04"},"textbook":[{"heading":"企業の内外で情報を共有する目的","body":"企業活動には、メーカー、物流会社、小売店など企業間の連携と、社内の部署・従業員間の連携があります。情報共有自体は手段であり、在庫や待ち時間の削減、意思決定の改善、知識創造など達成したい成果を明確にする必要があります。"},{"heading":"ECR：消費者の需要に供給側が連携する","body":"ECR（Efficient Consumer Response: 効率的消費者対応）は、小売店とメーカー等が販売情報や補充・物流を連携して、消費者需要に効率的に対応する考え方です。販売実績を共有すると供給側は需要を推定しやすくなり、欠品や過剰在庫を抑える判断に利用できます。単に電子的に受発注する仕組みではなく、供給全体の協働が目的です。"},{"heading":"EIP：企業内の情報への共通入口","body":"EIP（Enterprise Information Portal: 企業内情報ポータル）は、分散する業務情報やアプリを従業員が共通の入口から利用できるようにする仕組みです。検索、権限別表示、業務システムへのリンク等によって必要な情報を見つけやすくします。情報が更新される体制やアクセス権管理も必要です。"},{"heading":"制約条件と知識創造との違い","body":"TOC（Theory of Constraints: 制約条件理論）は全体の成果を制限している工程などに着目し、その制約を改善します。SECI（Socialization, Externalization, Combination, Internalization: 共同化・表出化・連結化・内面化）は暗黙知と形式知の変換を通じた知識創造のモデルです。EIPは情報アクセスを改善する道具であり、知識が自動で創造されたり、ボトルネックが解消されたりするわけではありません。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}}],"beginnerIntro":"市場と自社の立場を分析し、誰にどんな価値をどう届けるか考える。経営目標と施策・指標をつなげる。","studyGroups":[{"title":"環境・競争・全社戦略","body":"外部・内部環境を把握し、事業と競争の選択肢を比較する。","ids":["19-1","19-C01","19-3","19-Y01","19-C02"]},{"title":"顧客と価値提供","body":"市場の調査から顧客選択、価値提案、価格・販路へ進む。","ids":["19-2","19-C03","19-Y02","19-Z01"]},{"title":"実行と測定","body":"目標を指標、業務連携、知識管理に落とし込む。","ids":["19-X01","19-Y03","19-Y04","19-C04"]}]},{"id":20,"title":"技術戦略マネジメント","group":"ストラテジ","priority":"A標準","summary":"技術ロードマップ、研究開発、イノベーション、標準化と知財。","lessons":[{"title":"技術ロードマップ","body":"市場ニーズ、製品開発、基盤技術、研究開発の時間軸を結び付けて投資の優先順位を決める。技術が新しいだけでは顧客価値にならない。","check":"技術の成熟度と市場投入時期を分けて検討。"},{"title":"イノベーション","body":"破壊的イノベーションは既存市場の主流顧客だけでなく、当初は周縁の用途から競争構造を変え得る。オープンイノベーションは社外の知識や資源も活用する。","check":"単なる大型改良を必ず破壊的と呼ばない。"},{"title":"標準化とIP","body":"標準必須特許やライセンスを意識し、製品差別化と相互運用性のバランスを取る。知財ポートフォリオでは特許だけでなく営業秘密やノウハウも考える。","check":"標準化＝すべて無償提供ではない。"},{"title":"研究開発管理","body":"技術リスク、事業リスク、規制リスクを分け、ステージゲートで継続・中止を判断。学習に基づく仮説更新が必要。","check":"埋没費用を理由に赤字事業を無条件継続しない。"}],"terms":[{"term":"技術ロードマップ","definition":"技術・製品・市場の発展計画を時間軸で関連付けた図"},{"term":"オープンイノベーション","definition":"社内外の知識・技術を組み合わせて革新を目指すこと"},{"term":"破壊的イノベーション","definition":"既存の競争構造を周辺市場などから変化させ得る革新"},{"term":"ステージゲート","definition":"開発段階ごとに評価し継続・中止などを判断する方式"},{"term":"研究開発ポートフォリオ","definition":"リスク・収益・時間軸が異なる研究開発の組合せ"},{"term":"デファクトスタンダード","definition":"市場で広く普及し事実上の標準となった仕様"},{"term":"デジュールスタンダード","definition":"公的・正式な標準化手続で定められた規格"},{"term":"標準必須特許","definition":"ある標準規格の実装に不可欠とされる特許"}],"questions":[{"id":"Q20-01","chapter":20,"kind":"applied","q":"製品・技術・市場の時間軸を対応付ける図は。","options":["ER図","技術ロードマップ","ガントチャートだけ","DFD"],"correct":1,"explain":"研究開発投資と市場投入時期を整合させる。"},{"id":"Q20-02","chapter":20,"kind":"applied","q":"社外の研究成果を取り込んで事業化する考え方は。","options":["オープンイノベーション","密結合","デッドロック","バックアップ"],"correct":0,"explain":"組織外の知識と資源を活かす。"},{"id":"Q20-03","chapter":20,"kind":"applied","q":"開発段階ごとに成果を評価して次段階への進行を判断するのは。","options":["データ正規化","ステージゲート","サブネット分割","多要素認証"],"correct":1,"explain":"段階的な投資判断を行う。"},{"id":"D20-01","chapter":20,"kind":"applied","q":"技術的実現可能性を小規模で確認する段階として最も近いものはどれか。","options":["PoC","SLA","RPO","CMDB"],"correct":0,"explain":"PoCは概念実証。顧客価値・商用運用の成立は別の検証が必要。"},{"id":"D20-02","chapter":20,"kind":"applied","q":"AI分類器の全体正解率95%だけで商用化を判断できない理由はどれか。","options":["入力データは常に同じ","重要な誤判定の種類や実運用データ分布が不明だから","保守費は必ずゼロ","精度は定義できない"],"correct":1,"explain":"誤分類の影響、偽陰性・偽陽性、分布変化、人手運用などを検証する。"},{"id":"D20-03","chapter":20,"kind":"applied","q":"特許を出願したことと「他社の特許を侵害せず販売できること」の関係はどれか。","options":["出願時点で販売の自由が保証される","出願すれば競合の技術を自由に使用できる","別途実施の自由（FTO）の検討が必要","海外販売は常に無制限"],"correct":2,"explain":"自分の特許取得・出願は、他者権利の非侵害を保証しない。"},{"id":"Q-20-X01","chapter":20,"kind":"applied","q":"製品設計と生産工程設計を並行して進める方法は？","options":["ウォーターフォール","コンカレントエンジニアリング","正規化","デュプレックス"],"correct":1,"explain":"コンカレントエンジニアリング。"},{"id":"U-20-1","chapter":20,"kind":"applied","q":"技術・製品・市場の目標を時間軸で関連付けるものは？","options":["監査調書","技術ロードマップ","ER図","真理値表"],"correct":1,"explain":"技術ロードマップは将来目標と技術開発の時期を可視化する。"},{"id":"U-20-2","chapter":20,"kind":"applied","q":"新技術の実現可能性を小規模に確認する活動は？","options":["SLA（サービスレベル合意）","RPO（復旧時点目標）","PoC（概念実証）","MRP（資材所要量計画）"],"correct":2,"explain":"PoCは技術やアイデアが実現可能か検証する。"},{"id":"U-20-3","chapter":20,"kind":"applied","q":"市場で広く普及した結果として事実上の標準となるものは？","options":["デジュールスタンダード","特許査定","商標登録","デファクトスタンダード"],"correct":3,"explain":"デファクトは市場での普及、デジュールは公的な標準化手続による標準。"},{"id":"U-20-X01","chapter":20,"kind":"applied","q":"外部研究機関や企業の技術も取り込んで研究開発する考え方は？","options":["オープンイノベーション","クローズドイノベーション","ウォーターフォールのみ","データ正規化"],"correct":0,"explain":"外部の知識や技術を活用して革新を進める。"}],"deepIntro":"技術を開発することと、事業価値に結び付けることは異なる。研究開発投資や技術選択のリスクを管理する。","deep":[{"id":"20-1","title":"技術ロードマップ・研究開発管理","explain":"<p>技術ロードマップは市場・製品・技術・資源の時間的な関係を整理し、実用化に必要な技術課題や開発時期を見える化する。技術ポートフォリオでは将来性、成熟度、差別化、必要投資、依存関係を評価する。技術の不確実性と市場の不確実性は別に評価する。</p>\n<p>オープンイノベーションは外部企業・大学・顧客などの知識や技術を組み合わせて価値創出を図る。共同研究では知的財産の帰属、成果物の利用範囲、秘密保持、公開の可否を最初に検討する。</p>\n","worked":"<p>将来の製品を2年後に投入するには、半年前に量産評価、その前に技術実証が必要と逆算する。ロードマップは希望の日付を並べるだけでなく、依存関係と検証条件を定義する。</p>\n","prompt":"3年後の省電力製品発売という目標がある。ロードマップとステージゲートはそれぞれ何を決めるか。","answer":"<p>ロードマップは市場・製品目標と必要技術、検証・試作・量産の時期と依存関係をつなぐ。ステージゲートは各段階の達成条件を基に継続・変更・中止を判断する。</p>","beginner":{"scenario":"3年後に省電力製品を出す計画なら、必要なセンサ、半導体、試作時期、性能目標を逆算して並べる。","trap":"ロードマップは時間軸のある目標・技術計画であり、単なる技術一覧ではない。","quizId":"U-20-1"},"textbook":[{"heading":"技術戦略は研究テーマの選定だけではない","body":"技術戦略は事業の将来価値を実現するため、どの技術をいつ獲得し、どこへ研究開発資源を配分するかを決める活動です。市場ニーズは顧客が解決したい課題、技術シーズは新しい製品に活用し得る知識・技術の種です。ニーズから必要技術を探す方法と、シーズから用途を探す方法の双方があります。"},{"heading":"ロードマップの三層をつなげる","body":"技術ロードマップは市場・事業の目標、製品・サービスの計画、必要技術・研究開発を時間軸で結び付けます。3年後の製品投入を目指す場合、必要性能と市場条件を定義し、量産準備、試作評価、要素技術の検証を逆算します。日付だけでなく依存関係、達成条件、技術の成熟度を記述します。"},{"heading":"研究開発の不確実性を管理する","body":"技術開発は事前に成果が保証されないため、段階ごとに検証する仮説、実験、評価指標、予算を設定します。ステージゲートは各段階の成果を確認し、次の投資に進むか、方向転換するか、中止するかを判断する仕組みです。早い段階では実現可能性、後の段階では製品品質や市場価値などを重視します。"},{"heading":"ポートフォリオと継続的な更新","body":"短期の製品改良だけでは将来の新技術を獲得できない一方、不確実な長期研究だけでは事業継続が難しくなります。研究開発ポートフォリオではリスク、時間軸、事業への寄与、資源制約を考えて配分します。市場・競合・技術の変化に合わせロードマップや配分を更新します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-3","focus":"比較軸、因果、実務適用を明示"}},{"id":"20-X01","title":"技術開発戦略・投資計画","explain":"<p>MOT（技術経営）は技術を経営成果に結び付ける。技術開発戦略では市場ニーズと技術シーズ、競争優位、知財、投資資源を評価する。オープンイノベーションは外部の知識・技術も利用し、技術移転や共同開発を行う。</p><p>技術開発計画は人材・資金・設備・拠点・製品化時期を具体化し、技術ロードマップに技術・製品・市場の時間的な関係を表す。コンカレントエンジニアリングは設計・製造等を並行検討し手戻りを減らす。パイロット生産は本格量産前に工程や品質を検証する。</p>","worked":"<p>製造部門が設計初期から参加し部品組立性を評価すると、量産段階での設計変更を減らせる。</p>","prompt":"製品設計と生産工程設計を並行して進める方法は？","answer":"<p>コンカレントエンジニアリング。</p>","beginner":{"scenario":"製品設計の初期に生産部門が組立てやすさを確認することで、試作後に部品形状を大きく変更する手戻りを減らせる。","trap":"並行開発は情報共有なしに別々に作業することではない。","quizId":"U-20-X01"},"textbook":[{"heading":"研究開発の方法","body":"MOT（技術経営）は技術を経営資源として活用し事業価値につなげる考え方です。オープンイノベーションは外部企業や研究機関の知識を取り入れ、内部だけでは得にくい技術・市場機会を活用します。共同研究では成果や知財の帰属を明確にします。"},{"heading":"開発計画を具体化する","body":"必要人材、設備、資金、技術目標、試作・製品化の時期を整理し、リスクの大きい技術から検証します。コンカレントエンジニアリングは設計・製造などを並行して検討し、後工程からの手戻りを減らす方法です。"},{"heading":"量産への移行","body":"パイロット生産では本格量産前に工程、品質、歩留まり、コストを検証します。研究段階で一つ成功したことと、大量に安定して製造できることは別です。市場・技術・費用の状況に応じて計画を更新します。"}]},{"id":"20-C01","title":"イノベーション・事業投資・技術市場","explain":"<p>優れた技術をどう市場へ投入するか考える。</p><p>シラバスVer.7.2 本文114頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>高価格の既存品の改善に集中し低価格新市場を見落とす場合がジレンマの例。</p>","prompt":"市場・機能・技術を関連付ける枠組みは？","answer":"<p>正解は「MFT」。MFTフレームワーク：Market（市場）、Function（機能）、Technology（技術）の関係を整理し、顧客課題から必要機能と技術を結び付ける。市場創生、市場価値、R&amp;D（研究開発）を経営戦略と連携する。</p>","beginner":{"scenario":"優れた技術をどう市場へ投入するか考える。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-20-C01"},"textbook":[{"heading":"イノベーションの分類","body":"プロダクトは製品・サービスの革新、プロセスは作り方や提供方法の革新、ラディカルイノベーションは大きな非連続的変化。イノベーションのジレンマは既存優良顧客に適応する合理的行動が新市場・破壊的技術への対応を遅らせる現象。"},{"heading":"外部との価値創出","body":"メイカームーブメントは個人等のデジタル工作・試作活動の広がり。APIエコノミーは機能・データを公開接口で連携し事業価値を生む。リーンスタートアップは仮説を小規模検証し改善する。VC（ベンチャーキャピタル）は成長企業へ投資、CVC（事業会社によるベンチャー投資）は戦略的目的も持つ。"},{"heading":"MFTフレームワーク","body":"Market（市場）、Function（機能）、Technology（技術）の関係を整理し、顧客課題から必要機能と技術を結び付ける。市場創生、市場価値、R&D（研究開発）を経営戦略と連携する。"}]},{"id":"20-Y02","title":"技術ロードマップ・研究開発計画","explain":"<p>技術ロードマップは市場・製品・技術の目標を時間軸上に関連づけます。将来の望ましい状態から必要な行動を逆算するバックキャスティングと、現状から将来を推定するフォアキャスティングを使い分けます。</p>","worked":"<p>3年後発売→2年後量産試験→1年後試作→半年後基盤技術の選定という順で必要な期限を考える。</p>","prompt":"将来目標から逆算して必要な技術開発を決める手法は？","answer":"<p>バックキャスティング。望ましい将来像から現在の行動を逆算する。</p>","beginner":{"scenario":"3年後に省電力端末を発売するため、必要な技術と開発時期を逆算する。","trap":"ロードマップは単なる日程表ではなく技術と製品の関係も示す。","quizId":"U-20-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"技術ロードマップは市場・製品・技術の目標を時間軸上に関連づけます。将来の望ましい状態から必要な行動を逆算するバックキャスティングと、現状から将来を推定するフォアキャスティングを使い分けます。"},{"heading":"仕組みと使い分け","body":"技術開発計画は投資、人材、拠点、知財、試作・量産時期を決めます。コンカレントエンジニアリングは設計・生産などを並行・連携して手戻りを抑えます。段階ごとの評価で継続・中止を判断します。"},{"heading":"具体的な判断と手順","body":"3年後発売→2年後量産試験→1年後試作→半年後基盤技術の選定という順で必要な期限を考える。"},{"heading":"目標から技術課題を導く","body":"例えば電池駆動時間を2倍にする製品目標を掲げたら、消費電力の削減、電池容量、部品供給などの技術課題に分解し、それぞれの評価指標と期限を設定します。試作時に達成できない場合は、代替技術や製品要件の変更も検討し、事業上の判断へつなげます。"}]},{"id":"20-2","title":"事業化・価値検証・プロトタイプ","explain":"<p>PoC（Proof of Concept：概念実証）は技術的実現可能性等を確かめる試験、MVP（Minimum Viable Product：実用最小限の製品）は顧客へ価値を届けて仮説検証する最小の製品。PoCが成功しても業務導入コスト・法規制・顧客獲得等が成立するとは限らない。事業化では市場性、技術性、競争優位、収益性、実行体制を総合評価する。</p>\n<p>技術採用は試験環境での動作だけでなく、品質管理、保守、性能、セキュリティ、量産可能性まで検証する。撤退条件や次段階への移行基準を事前に定める。</p>\n","worked":"<p>AIで画像を分類できたPoCが成功しても、実運用ではデータ取得、誤判定時の人手確認、法令、計算費用が必要。顧客の業務時間削減を測るMVP検証が別に必要。</p>\n","prompt":"音声認識の精度は目標を達成したが、注文操作は従来より遅かった。どの仮説が支持され、どの仮説を再検証するべきか。","answer":"<p>認識の技術的実現可能性は一定支持されたが、顧客の注文時間短縮という価値仮説は支持されていない。操作の流れや対象顧客を見直し、実利用で時間・誤り・満足度などを比較する。</p>","beginner":{"scenario":"音声で注文できる試作を顧客に使ってもらう。認識精度が高くても既存操作より時間がかかるなら事業価値は弱い。","trap":"技術的に動くことと顧客が使い続け購入することは別。","quizId":"U-20-2"},"textbook":[{"heading":"技術的成功と顧客価値の違い","body":"事業化には技術が実現可能であること、顧客の課題を解決すること、継続的に提供して採算が取れることが必要です。精度や処理速度の改善は技術的な指標であり、それだけで顧客の時間短縮や購入意欲を保証しません。検証したい仮説に応じて手段を選びます。"},{"heading":"PoC・プロトタイプ・MVPの使い分け","body":"PoC（Proof of Concept: 概念実証）は技術やアイデアの実現可能性を検証する活動です。プロトタイプ（試作品）は構造・機能・操作などを確かめるために作る成果物です。MVP（Minimum Viable Product: 実用最小限の製品）は価値仮説を実際の利用から学べる最小限の製品です。PoCに試作品を使う場合もあり、これらは排他的な工程名ではありません。"},{"heading":"実証には指標と比較対象を設ける","body":"画像認識で業務を改善するなら、PoCで認識精度や処理速度を確認し、利用現場で作業時間、手動確認の負担、誤判定による損失、支払意思などを評価します。PoV（Proof of Value: 価値実証）は業務や顧客への価値を確認する観点です。従来の方法との比較や対象データの代表性を考慮し、成功条件を事前に定めます。"},{"heading":"事業として成立する条件","body":"商用化では量産性、運用費、安全性、法令、販売経路、利用継続、収益性を確認します。検証で仮説が否定された場合は、機能を改善する、対象顧客を変える、開発を中止するなどの判断が必要です。イノベーションは発明そのものだけでなく新しい価値の実現までを含む考え方です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-3","focus":"比較軸、因果、実務適用を明示"}},{"id":"20-Y01","title":"技術の事業化障壁・外部資源活用","explain":"<p>研究から開発へ進む障壁を魔の川、開発から事業化への障壁を死の谷、事業として市場競争を生き抜く障壁をダーウィンの海と呼ぶことがあります。技術のSカーブは性能改善が初期・成長・成熟で異なる傾向を示します。</p>","worked":"<p>センサの測定精度はPoC、現場での損失削減はPoV、最低限の販売可能製品はMVPで確かめる。</p>","prompt":"センサ試作機の精度は目標を満たしたが、実際の利用者が時間短縮や費用削減を得られるか不明である。次の実証で何を測るべきか。","answer":"<p>価値実証（PoV）として現場の作業時間・損失削減・利用費用などを比較し、顧客価値を検証する。精度を確かめるPoCとは目的が異なる。</p>","beginner":{"scenario":"研究室で新しいセンサを開発したが、量産と販売までには別の課題がある。","trap":"技術が動くことと事業が成立することは別。","quizId":"U-20-Y01"},"textbook":[{"heading":"研究成果と事業成功は別の段階","body":"技術が原理どおり動くこと、製品として安定して作れること、顧客が購入して採算が合うことは異なる達成条件です。技術の事業化では各段階で必要な知識、資金、人材、顧客、設備が変わります。障壁を区別すると何を検証・補強するべきか判断できます。"},{"heading":"魔の川・死の谷・ダーウィンの海","body":"魔の川は研究成果を開発へつなげる障壁、死の谷は開発成果を事業化へつなげる障壁、ダーウィンの海は市場に出た事業が競争を生き抜く障壁という代表的な区別です。境界の説明は資料によって異なることがありますが、研究、製品開発、事業化、市場競争の順に整理します。"},{"heading":"技術性能のSカーブ","body":"技術の性能は初期には改善が遅く、知識が蓄積されると急速に改善し、物理限界や成熟に近づくと改善が鈍化するというS字型の傾向を示すことがあります。これは性能の発展を表すモデルであり、顧客への普及率の曲線や売上を必ず表すものではありません。既存技術の改良と新技術への投資の判断に使います。"},{"heading":"実証の目的を分ける","body":"PoC（Proof of Concept: 概念実証）は技術・アイデアの実現可能性を検証します。PoV（Proof of Value: 価値実証）は顧客や業務への価値を確認します。MVP（Minimum Viable Product: 実用最小限の製品）は最低限の機能を備え、実際の利用から仮説を学ぶための製品です。それぞれ技術性能、価値、利用行動など異なる指標を設定します。"},{"heading":"外部の資源を使って障壁を越える","body":"共同研究で不足知識を補い、TLO（Technology Licensing Organization: 技術移転機関）やライセンス契約を通じて研究成果を企業の事業に活用する方法があります。知的財産、資金調達、量産体制、販売経路などどこが制約かを特定して協業先を選びます。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"事業化の障壁と実証を目的別に分離。"}},{"id":"20-C02","title":"価値創出・普及・事業実証","explain":"<p>研究成果を顧客価値と利益につなげる。</p><p>シラバスVer.7.2 本文114頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>試作品が動くのはPoC、顧客が対価を払う継続事業を検証するのはPoB。</p>","prompt":"技術の動作ではなく事業成立性を検証するのは？","answer":"<p>正解は「PoB」。検証と品質：PoC（概念実証）は実現可能性、PoV（価値実証）は顧客価値、PoB（事業実証）は事業としての成立性を調べる。QCDE（品質・価格・納期・環境）は評価観点。バックキャスティングは望ましい将来から必要施策を逆算する。</p>","beginner":{"scenario":"研究成果を顧客価値と利益につなげる。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-20-C02"},"textbook":[{"heading":"価値の三段階","body":"Value Creationは価値創造、Value Deliveryは価値実現・提供、Value Capture（価値利益化）は提供した価値を対価・利益として回収する。技術が高性能でも提供経路や収益モデルがなければ継続できない。"},{"heading":"普及と障壁","body":"技術のSカーブは性能向上が初期緩慢・中期急速・成熟期鈍化する傾向。キャズムは初期市場から主流市場への普及の隔たり。ハイプサイクルは期待の高まりと幻滅、理解・普及の変化を整理する。魔の川、死の谷、ダーウィンの海は研究・開発・事業化・市場競争間の障壁。"},{"heading":"検証と品質","body":"PoC（概念実証）は実現可能性、PoV（価値実証）は顧客価値、PoB（事業実証）は事業としての成立性を調べる。QCDE（品質・価格・納期・環境）は評価観点。バックキャスティングは望ましい将来から必要施策を逆算する。"}]},{"id":"20-3","title":"標準化・技術移転・知財戦略","explain":"<p>技術を守る手段には特許権、営業秘密、著作権、契約、先行者利益などがある。特許公開は技術情報の公開と引換えに一定期間の独占的権利を得る仕組みで、営業秘密は秘密管理・有用性・非公知性などが要件。すべての技術が特許化に適するとは限らない。</p>\n<p>標準化は互換性や市場拡大を助けるが、標準必須特許やライセンス、競争政策も考慮する。技術移転では権利範囲、地域、用途、改良成果、再許諾、対価などを定める。</p>\n","worked":"<p>製造ノウハウを公開すると模倣が容易になるが、秘密のまま運用で守れる場合もある。特許の新規性・進歩性と秘密管理可能性を比較して判断する。</p>\n","prompt":"特許を出願した時点で、他社の権利を侵害せず製造販売できるか。","answer":"<p>保証されない。実施の自由（FTO：Freedom To Operate）は別途調査が必要。</p>\n","beginner":{"scenario":"機器間の接続仕様を標準化して周辺製品を増やし、独自の性能改善技術は特許・秘密管理で保護する戦略を考えられる。","trap":"標準化はすべての技術を無償で公開することを意味しない。","quizId":"U-20-3"},"textbook":[{"heading":"標準化が価値を生む理由","body":"接続仕様が共通なら異なる企業の製品を組み合わせやすくなり、周辺製品や利用者が増える可能性があります。デジュールスタンダードは公的・正式な標準化手続による標準、デファクトスタンダードは市場で普及して事実上の標準となったものです。"},{"heading":"技術移転と知的財産","body":"技術移転は研究機関や企業の技術を別の組織へ移し実用化につなげる活動です。特許のライセンス、共同開発、ノウハウの提供などを利用します。特許、営業秘密、著作権等は保護する対象と方法が異なります。"},{"heading":"標準と独自性の組合せ","body":"互換性に必要な仕様を標準化し、独自の性能改善技術を保護する戦略もあります。標準必須特許は標準に準拠するため実施が必要となる特許を指します。標準化がすべての技術の無償利用を意味するわけではなく、ライセンス条件や競争法等も関係します。"}]},{"id":"20-C03","title":"外部技術・知的財産・研究開発ロードマップ","explain":"<p>複数社が標準技術を共同利用する。</p><p>シラバスVer.7.2 本文114–115頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>標準準拠に必要な複数企業の特許をまとめて許諾する仕組みはパテントプール。</p>","prompt":"当事者が互いの特許利用を許諾する契約は？","answer":"<p>正解は「クロスライセンス」。特許の活用：パテントプールは複数の特許をまとめてライセンスする仕組み。クロスライセンスは当事者間で相互に利用許諾する。防衛特許は競合からの権利主張への交渉力や事業自由度確保などの目的を持つ。早期審査制度は一定要件で審査を早める。</p>","beginner":{"scenario":"複数社が標準技術を共同利用する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-20-C03"},"textbook":[{"heading":"技術移転・外部資源","body":"TLO（Technology Licensing Organization：技術移転機関）は大学等の成果の実用化・ライセンスを支援する。共同研究、委託研究、技術提携では成果帰属、秘密保持、利用範囲を決める。"},{"heading":"特許の活用","body":"パテントプールは複数の特許をまとめてライセンスする仕組み。クロスライセンスは当事者間で相互に利用許諾する。防衛特許は競合からの権利主張への交渉力や事業自由度確保などの目的を持つ。早期審査制度は一定要件で審査を早める。"},{"heading":"ロードマップ","body":"技術ロードマップは技術性能・開発時期、製品応用ロードマップは製品への適用、特許取得ロードマップは出願・権利化計画を時間軸で結び付ける。アイディアソン・ハッカソンは短期間で発想や試作を進める活動。"}]}],"beginnerIntro":"技術を研究するだけでなく製品・事業として価値に変える方法を学ぶ。市場ニーズ、技術開発、標準化、知財を関連づける。","studyGroups":[{"title":"技術と市場の接続","body":"技術の可能性を市場課題と結び、研究開発の道筋を選ぶ。","ids":["20-1","20-X01","20-C01","20-Y02"]},{"title":"検証と普及","body":"試作、価値実証、事業化、普及障壁を整理する。","ids":["20-2","20-Y01","20-C02"]},{"title":"外部資源・標準・知財","body":"自社開発だけでなく協業、標準、知財を用いる戦略を考える。","ids":["20-3","20-C03"]}]},{"id":21,"title":"ビジネスインダストリ","group":"ストラテジ","priority":"A標準","summary":"EC、SCM、ERP、IoT、製造管理、電子決済など産業別ITの基本。","lessons":[{"title":"企業内・企業間システム","body":"ERP（Enterprise Resource Planning：統合基幹業務システム）は会計・人事・販売等を統合、SCM（Supply Chain Management：供給連鎖管理）は調達から販売までの流れを最適化する。","check":"ERPは社内統合、SCMは企業間連携まで視野。"},{"title":"顧客とデータ","body":"CRM（Customer Relationship Management：顧客関係管理）は顧客情報や接点を統合。POS（Point of Sales：販売時点情報管理）は売上・商品データを蓄積し需要分析等へ活用。","check":"個人情報の利用目的と最小限の管理が必要。"},{"title":"製造と物流","body":"CAD（Computer-Aided Design：コンピュータ支援設計）で設計、CAM（Computer-Aided Manufacturing：コンピュータ支援製造）で製造指示。IoT（Internet of Things：モノのインターネット）はセンサや機器のデータを活用。","check":"設計・製造・制御が異なる段階。"},{"title":"ECと決済","body":"EC（Electronic Commerce：電子商取引）では決済・注文・在庫・配送が連動する。EDI（Electronic Data Interchange：電子データ交換）は企業間取引データを標準形式でやり取りする。","check":"電子化はなりすましや改ざん対策も必要。"}],"terms":[{"term":"ERP","definition":"会計・人事・販売などの基幹業務を統合するシステム"},{"term":"SCM","definition":"調達・生産・物流・販売の供給連鎖を最適化する管理"},{"term":"CRM","definition":"顧客情報と接点を管理し関係を改善する仕組み"},{"term":"POS","definition":"販売時点で商品・数量・価格等の情報を取得する仕組み"},{"term":"CAD","definition":"コンピュータを用いた設計支援"},{"term":"CAM","definition":"コンピュータによる製造支援"},{"term":"IoT","definition":"モノをネットワークにつないでデータを収集・活用する仕組み"},{"term":"EDI","definition":"企業間の受発注などのデータを標準化して電子交換する仕組み"},{"term":"電子商取引","definition":"ネットワーク上で商品・サービス等を取引すること"},{"term":"デジタルツイン","definition":"実世界の対象の状態をデジタル空間に再現し分析等に活用する仕組み"}],"questions":[{"id":"Q21-01","chapter":21,"kind":"applied","q":"取引先を含む調達・生産・物流全体の最適化は。","options":["SCM","CRM","CAD","SLA"],"correct":0,"explain":"SCMは供給連鎖全体を扱う。"},{"id":"Q21-02","chapter":21,"kind":"applied","q":"販売時に商品別の売上を記録する仕組みは。","options":["CMDB","POS","VPN","PKI"],"correct":1,"explain":"POSは販売時点で取引情報を収集する。"},{"id":"Q21-03","chapter":21,"kind":"applied","q":"コンピュータ上の設計を支援する技術は。","options":["CAD","CAM","NAT","DNS"],"correct":0,"explain":"CADは設計、CAMは製造。"},{"id":"D21-01","chapter":21,"kind":"applied","q":"完成品100個に部品Aが各3個必要で、部品在庫50個の単純な正味所要量はどれか。","options":["50個","150個","250個","350個"],"correct":2,"explain":"100×3−50=250個。実務では発注残、安全在庫、リードタイムなども考慮する。"},{"id":"D21-02","chapter":21,"kind":"applied","q":"顧客データを部門横断で統合し関係維持を支援する仕組みはどれか。","options":["RAID","CRM","CRC","ADC"],"correct":1,"explain":"CRMは顧客関係管理。購買・問い合わせ等を統合して顧客接点を改善する。"},{"id":"D21-03","chapter":21,"kind":"applied","q":"工場AIの異常検知で重大異常の見逃しを測るとき、全体正解率より適切な指標はどれか。","options":["重大異常クラスの再現率","ソフトウェアの行数","端末の画面サイズ","平均社員年齢"],"correct":0,"explain":"見逃しは偽陰性。重大異常の再現率（感度）などを確認する。"},{"id":"Q-21-X01","chapter":21,"kind":"applied","q":"構造物の応力解析に主に使うシステムは？","options":["CAD","CAE","CAM","POS"],"correct":1,"explain":"CAE。"},{"id":"Q-21-X02","chapter":21,"kind":"applied","q":"消費者同士が取引するフリーマーケットアプリの分類は？","options":["BtoB","BtoC","CtoC","GtoB"],"correct":2,"explain":"CtoC。"},{"id":"U-21-1","chapter":21,"kind":"applied","q":"供給連鎖の上流ほど発注変動が増幅する現象は？","options":["ネットワーク効果","ブルウィップ効果","規模の経済","桁落ち"],"correct":1,"explain":"需要変化の予測・在庫調整などが連鎖し上流の発注変動を増幅する。"},{"id":"U-21-2","chapter":21,"kind":"applied","q":"企業間で注文書や請求書を電子データとして交換する仕組みは？","options":["CRM","POS","EDI","CAD"],"correct":2,"explain":"EDI（Electronic Data Interchange：電子データ交換）は企業間の取引情報交換。"},{"id":"U-21-3","chapter":21,"kind":"applied","q":"収集データを機器の近くで処理して通信遅延を抑える方式は？","options":["バッチ処理のみ","データ正規化","RAID","エッジコンピューティング"],"correct":3,"explain":"エッジ処理はデータ発生源の近くで処理する。"},{"id":"U-21-X01","chapter":21,"kind":"applied","q":"製品計画、部品表、在庫から部品の必要数量を求める方式は？","options":["MRP","CRM","SFA","BSC"],"correct":0,"explain":"MRP（Material Requirements Planning：資材所要量計画）は部品の必要量・時期を算出する。"},{"id":"U-21-X02","chapter":21,"kind":"applied","q":"企業が一般消費者に直接商品を販売するECの分類は？","options":["BtoB","BtoC","CtoC","GtoG"],"correct":1,"explain":"BtoCは企業対消費者、BtoBは企業間、CtoCは消費者間。"}],"deepIntro":"ITが実際の業務・産業に入るとき、データの流れ・取引の流れ・責任の所在を理解する。","deep":[{"id":"21-1","title":"製造・生産管理・サプライチェーン","explain":"<p>ERP（Enterprise Resource Planning：企業資源計画）は会計・販売・購買・生産などの企業資源を横断して管理する。MRP（Material Requirements Planning：資材所要量計画）は生産計画・部品表（BOM）・在庫から必要な材料量と時期を算出する。SCM（Supply Chain Management：供給連鎖管理）は仕入れから生産・物流・販売までを全体最適する。</p>\n<p>JIT（Just In Time：必要なものを必要なときに必要なだけ供給）は在庫削減を目指すが、需要変動・供給途絶に弱くなる可能性もある。トレーサビリティはロット・取引履歴を追跡し、不良品回収等で役立つ。</p>\n","worked":"<p>製品1個に部品Aが3個必要で100個生産、部品在庫が50個なら単純な正味所要量は300−50＝250個。実際のMRPではリードタイム、安全在庫、既発注残を加味する。</p>\n","prompt":"ERPを導入すると部門間のデータ定義の統一が不要か。","answer":"<p>むしろ導入時に統一・標準化の検討が必要。</p>\n","beginner":{"scenario":"店舗が需要増に備え余分に発注し、卸もさらに余分に発注すると、上流に行くほど実際の需要変動より大きな注文変動が生じる。","trap":"在庫を減らせば必ず全体の利益が増えるわけではない。欠品・調達期間も考慮する。","quizId":"U-21-1"},"textbook":[{"heading":"商品が顧客に届くまで","body":"製造業では需要予測、資材調達、生産、在庫、物流、販売が連携します。各工程だけを効率化すると全体の在庫や欠品が増える場合があります。SCM（供給連鎖管理）は企業間も含めた供給の流れ全体を管理します。"},{"heading":"必要量と時期","body":"MRP（資材所要量計画）は製品生産計画、部品表、在庫、調達期間から部品の必要量と発注時期を算出します。JIT（ジャストインタイム）は必要なものを必要な時に必要量供給する考え方です。在庫削減だけでなく欠品、供給遅延、品質を考慮します。"},{"heading":"全体を改善する","body":"ブルウィップ効果は需要変動が上流の発注量に増幅される現象です。販売情報の共有、発注周期の見直し等で抑制を目指します。ERP（企業資源計画）は販売・生産・会計等の情報を統合し、業務間の整合性を支援します。"}]},{"id":"21-X01","title":"製造・エンジニアリングシステム","explain":"<p>MRP（資材所要量計画）は生産計画、部品表、在庫、調達期間から必要な資材と発注時期を計算する。JIT（ジャストインタイム）は必要なものを必要な時に必要量供給する。生産管理では需要予測、在庫、工程、品質、納期を調整する。</p><p>CAD（コンピュータ支援設計）は図面・モデル作成、CAE（コンピュータ支援工学）はシミュレーションや解析、CAM（コンピュータ支援製造）は加工データ作成、CIM（コンピュータ統合生産）は設計・生産等の統合を指す。デジタルツインは実物とデジタルモデルを対応させる。</p>","worked":"<p>製品10個に部品Bを3個ずつ使用し在庫8個なら、他の入荷や安全在庫を無視した純所要量は22個。</p>","prompt":"構造物の応力解析に主に使うシステムは？","answer":"<p>CAE。</p>","beginner":{"scenario":"製品10個に部品を3個ずつ使い、在庫8個、他の入荷や安全在庫なしなら純所要量は10×3−8＝22個。納期に合わせ発注時期も考える。","trap":"MRPは必要量・時期の計画。JITは必要なものを必要な時に必要量供給する考え方。","quizId":"U-21-X01"},"textbook":[{"heading":"製造を計画する","body":"例えば製品10個に部品Aが3個ずつ必要で、在庫8個、追加の入荷なしなら純所要量は30−8＝22個です。MRPでは部品表を階層的に展開し、調達リードタイムを考慮して発注時期を逆算します。"},{"heading":"設計・解析・製造をつなぐ","body":"CAD（コンピュータ支援設計）は形状や図面を作り、CAE（コンピュータ支援工学）は強度・流体等を解析し、CAM（コンピュータ支援製造）は加工データを作るなど製造を支援します。CIM（コンピュータ統合生産）はこれらを含む生産活動を情報で統合する考え方です。"},{"heading":"現実とモデルの対応","body":"デジタルツインは実物の状態をデジタルモデルに対応させ、計測データから状態の把握や予測・シミュレーションに利用します。モデルが現実を完全に再現するわけではないため、実測との照合や更新を行います。"}]},{"id":"21-Y01","title":"生産・在庫・物流・販売管理","explain":"<p>MRP（Material Requirements Planning：資材所要量計画）は製品需要、部品表、在庫、リードタイムから資材量と発注時期を計算します。JIT（Just In Time：必要な物を必要な時に必要な量だけ）は在庫や無駄の抑制を狙います。</p>","worked":"<p>製品100個に部品Aが3個ずつ必要、在庫50個なら追加所要量は250個（他の入荷・安全在庫なし）。</p>","prompt":"製品計画と部品表から必要な資材を計算する仕組みは？","answer":"<p>MRP。資材所要量計画は製品需要から部品需要を展開する。</p>","beginner":{"scenario":"製造会社が納期遅延と過剰在庫を減らしたい。","trap":"在庫ゼロが常に最適とは限らず、欠品リスクも考慮する。","quizId":"U-21-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"MRP（Material Requirements Planning：資材所要量計画）は製品需要、部品表、在庫、リードタイムから資材量と発注時期を計算します。JIT（Just In Time：必要な物を必要な時に必要な量だけ）は在庫や無駄の抑制を狙います。"},{"heading":"仕組みと使い分け","body":"SCM（Supply Chain Management：供給連鎖管理）は調達から販売まで全体を最適化します。POS（Point of Sale：販売時点情報管理）は販売時の記録、EDI（Electronic Data Interchange：電子データ交換）は企業間取引情報の交換です。"},{"heading":"具体的な判断と手順","body":"製品100個に部品Aが3個ずつ必要、在庫50個なら追加所要量は250個（他の入荷・安全在庫なし）。"}]},{"id":"21-Y02","title":"CAD・CAM・CAE・MESと製造連携","explain":"<p>CAD（Computer Aided Design：コンピュータ支援設計）は設計、CAE（Computer Aided Engineering：コンピュータ支援工学）は強度や熱等の解析、CAM（Computer Aided Manufacturing：コンピュータ支援製造）は加工・製造を支援します。</p>","worked":"<p>CADで部品を設計し、CAEで応力を評価し、CAMで加工データを作り、MESで製造実績を追跡する。</p>","prompt":"設計した部品が荷重に耐えるか数値解析する仕組みは？","answer":"<p>CAE。CAEは工学的解析。CADは設計、CAMは製造支援。</p>","beginner":{"scenario":"製品設計をデジタル化し、強度検証から加工、工場の進捗まで連携させる。","trap":"CADとCAEは同じ機能ではない。","quizId":"U-21-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"CAD（Computer Aided Design：コンピュータ支援設計）は設計、CAE（Computer Aided Engineering：コンピュータ支援工学）は強度や熱等の解析、CAM（Computer Aided Manufacturing：コンピュータ支援製造）は加工・製造を支援します。"},{"heading":"仕組みと使い分け","body":"PDM（Product Data Management：製品データ管理）は図面や部品情報の版管理、PLM（Product Lifecycle Management：製品ライフサイクル管理）は企画から廃棄まで管理します。MES（Manufacturing Execution System：製造実行システム）は現場の生産指示・実績・品質を管理します。"},{"heading":"具体的な判断と手順","body":"CADで部品を設計し、CAEで応力を評価し、CAMで加工データを作り、MESで製造実績を追跡する。"},{"heading":"製造システムの階層","body":"計画層のERPやMRPで生産・資源計画、実行層のMES（Manufacturing Execution System：製造実行システム）で作業指示・進捗・品質・実績、制御層のPLC等で機器制御を行う。PLMは製品企画から廃棄・リサイクルまで製品情報を管理し、MRPやSCMとは対象が異なる。"}]},{"id":"21-C01","title":"社内・基幹業務システム","explain":"<p>企業内の情報の流れを目的別に整理する。</p><p>シラバスVer.7.2 本文116頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>在庫不足に応じて取引先に補充を電子発注するのはEOS。</p>","prompt":"財務報告の機械可読なデータ形式は？","answer":"<p>正解は「XBRL」。会計・人事・業務支援：XBRL（eXtensible Business Reporting Language：拡張可能な事業報告言語）は財務報告等のデータを機械可読にする。人事給与は雇用・給与、グループウェアは情報共有、ワークフローシステムは申請・承認を管理する。</p>","beginner":{"scenario":"企業内の情報の流れを目的別に整理する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-21-C01"},"textbook":[{"heading":"会計・人事・業務支援","body":"XBRL（eXtensible Business Reporting Language：拡張可能な事業報告言語）は財務報告等のデータを機械可読にする。人事給与は雇用・給与、グループウェアは情報共有、ワークフローシステムは申請・承認を管理する。"},{"heading":"流通・医療","body":"EOS（Electronic Ordering System：電子補充発注システム）は補充発注情報を電子化する。物流管理は保管・輸送、電子カルテは診療記録を電子管理する。患者情報のアクセス権、真正性、保存性を考慮する。"},{"heading":"CPS・ブロックチェーン","body":"CPS（Cyber-Physical System：サイバーフィジカルシステム）は現実のセンサ情報をデジタル空間で分析し現実へ制御を戻す。デジタルツインは現実に対応するデジタルモデル。スマートコントラクトは条件に応じ処理を自動実行する仕組みで、契約の法的効力や外部データの正しさは別問題。トレーサビリティは履歴を追跡できる性質。"}]},{"id":"21-2","title":"電子商取引・決済・顧客管理","explain":"<p>EC（Electronic Commerce：電子商取引）はBtoB（企業間）、BtoC（企業・消費者間）、CtoC（個人間）などの形態がある。EDI（Electronic Data Interchange：電子データ交換）は注文書・請求書等の取引データを標準的な形式で交換する仕組み。決済では本人認証、カード情報の保護、不正検知、返金・チャージバックなどの業務も考える。</p>\n<p>CRM（Customer Relationship Management：顧客関係管理）は顧客情報・接点・継続利用を統合して管理する。顧客データを集めるときは同意・利用目的・アクセス権・品質を考慮する。電子署名・電子契約・電子帳簿の適法要件は契約種別と制度に依存する。</p>\n","worked":"<p>注文が成功しても在庫更新に失敗した場合、顧客への通知・決済取消し・補償など例外処理が必要。システム図と業務フローを対応させる。</p>\n","prompt":"購買履歴を集めれば目的外利用に制限はないか。","answer":"<p>ないわけではない。個人情報保護や契約に基づく目的・同意・安全管理が必要。</p>\n","beginner":{"scenario":"Web注文の受付、決済承認、在庫引当、出荷は別の処理。途中失敗時は二重請求や過剰販売を防ぐ必要がある。","trap":"決済承認と売上確定は必ずしも同じではない。","quizId":"U-21-2"},"textbook":[{"heading":"電子商取引の仕組み","body":"EC（電子商取引）はネットワーク経由の取引で、BtoBは企業間、BtoCは企業と消費者、CtoCは消費者間です。EDI（電子データ交換）は企業間で注文・請求などの取引データを標準化して交換する仕組みです。POS（販売時点情報管理）は店舗での販売情報を収集します。"},{"heading":"注文と決済を分ける","body":"注文受付、決済承認、在庫引当て、出荷、売上確定は別の処理です。途中で通信が失敗して再試行する場合、二重請求や二重注文を防ぐ設計が必要です。決済情報と個人情報の保護、取引記録、返金手続を考えます。"},{"heading":"顧客との関係","body":"CRM（顧客関係管理）は購買履歴や問い合わせ情報を活用して顧客対応を改善します。SFA（営業支援）は案件の進捗や営業活動を管理します。データを集めるだけでなく利用目的、権限、品質を定めることが重要です。"}]},{"id":"21-Y03","title":"電子商取引・決済・EDI・メディア","explain":"<p>B2C（企業対消費者）、B2B（企業間）、C2C（消費者間）は取引主体の分類です。電子商取引では注文、決済、配送、返品、本人確認、個人情報を管理します。</p>","worked":"<p>小売から卸へ注文データを標準形式で送るのはB2BのEDI。個人間の中古品取引はC2C。</p>","prompt":"企業間の受発注データを標準形式で交換する仕組みは？","answer":"<p>EDI。EDIは電子データ交換。</p>","beginner":{"scenario":"ネットショップで顧客が注文し、店舗と卸売業者が電子的に発注情報を交換する。","trap":"B2BとB2Cは利用技術ではなく取引主体の違い。","quizId":"U-21-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"B2C（企業対消費者）、B2B（企業間）、C2C（消費者間）は取引主体の分類です。電子商取引では注文、決済、配送、返品、本人確認、個人情報を管理します。"},{"heading":"仕組みと使い分け","body":"EDIは企業間で標準化した取引情報を交換します。電子決済では前払い・即時払い・後払い等で資金移転時期が違います。CMS（Content Management System：コンテンツ管理システム）は記事等の管理、CGM（Consumer Generated Media：消費者生成メディア）は利用者がコンテンツを作る形態です。"},{"heading":"具体的な判断と手順","body":"小売から卸へ注文データを標準形式で送るのはB2BのEDI。個人間の中古品取引はC2C。"}]},{"id":"21-C04","title":"電子ビジネス・EDI標準・本人確認","explain":"<p>オンラインと店舗を連携して取引する。</p><p>シラバスVer.7.2 本文118–119頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>ネット注文と店舗受取り・返品を統合する例はOMO。</p>","prompt":"製品モデルデータを交換する標準は？","answer":"<p>正解は「STEP」。EDI・データ交換標準：EDI（電子データ交換）は取引データを標準形式で交換する。STEPは製品モデルデータ交換、流通BMSは流通ビジネスメッセージ標準、XML-EDIはXMLを利用する。UN/CEFACTは貿易円滑化・電子ビジネス標準を扱う。CMSはコンテンツ管理、CGMは消費者生成メディア。</p>","beginner":{"scenario":"オンラインと店舗を連携して取引する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-21-C04"},"textbook":[{"heading":"ビジネス形態","body":"DtoC（Direct to Consumer：消費者直接販売）はメーカー等が顧客へ直接販売する。GtoBは行政と企業、GtoCは行政と住民。OtoOはオンラインから実店舗への誘導、OMOはオンライン・オフラインの統合体験。フリーミアムは基本無料・追加有料、ロングテールは多数の小需要商品の総和を活用する。NFTは非代替性トークンで、著作権を自動的に移転しない。"},{"heading":"電子取引の安全","body":"eKYC（電子本人確認）はオンラインで本人確認を行う。AML・CFTはマネーロンダリング・テロ資金供与対策。アカウントアグリゲーションは複数口座等の情報を集約する。"},{"heading":"EDI・データ交換標準","body":"EDI（電子データ交換）は取引データを標準形式で交換する。STEPは製品モデルデータ交換、流通BMSは流通ビジネスメッセージ標準、XML-EDIはXMLを利用する。UN/CEFACTは貿易円滑化・電子ビジネス標準を扱う。CMSはコンテンツ管理、CGMは消費者生成メディア。"}]},{"id":"21-C02","title":"行政情報システム・電子政府","explain":"<p>住民や事業者が行政手続を電子的に行う。</p><p>シラバスVer.7.2 本文116頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>国の電子調達はGEPS、自治体間行政通信はLGWAN、企業の法定開示はEDINET。</p>","prompt":"地方公共団体を結ぶ行政ネットワークは？","answer":"<p>正解は「LGWAN」。行政ネットワーク・開示：LGWAN（Local Government Wide Area Network：総合行政ネットワーク）は地方公共団体の行政ネットワーク。EDINET（Electronic Disclosure for Investors' NETwork：電子開示システム）は有価証券報告書等の電子提出・閲覧。出入国管理、登記情報、社会保険オンラインシステムはそれぞれ行政目的が異なる。</p>","beginner":{"scenario":"住民や事業者が行政手続を電子的に行う。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-21-C02"},"textbook":[{"heading":"電子行政・調達","body":"デジタルガバメントは行政サービス・業務のデジタル化と改革。ガバメントクラウドは行政機関・自治体等のシステムで利用する共通的なクラウド環境。e-Govは行政情報検索や電子申請等の窓口。GEPS（Government Electronic Procurement System：政府電子調達システム）は政府調達手続を支援する。"},{"heading":"行政ネットワーク・開示","body":"LGWAN（Local Government Wide Area Network：総合行政ネットワーク）は地方公共団体の行政ネットワーク。EDINET（Electronic Disclosure for Investors' NETwork：電子開示システム）は有価証券報告書等の電子提出・閲覧。出入国管理、登記情報、社会保険オンラインシステムはそれぞれ行政目的が異なる。"},{"heading":"住民・防災・包摂","body":"住民基本台帳ネットワークは本人確認情報を連携する仕組み。公的個人認証サービスは電子証明書による本人確認等、マイナンバーは個人番号、マイナポータルは本人向け行政手続等のオンラインサービス。アメダスは気象観測、Jアラートは緊急情報の迅速伝達。デジタルディバイド（利用格差）を抑え、ユニバーサルデザインと代替窓口を確保する。"}]},{"id":"21-3","title":"IoT・AI・業務適用","explain":"<p>IoTは現実の装置をネットワークにつなぎ、収集したデータで監視・予測・制御を行う。エッジ処理は機器近くで処理して遅延・通信量を減らし、クラウド処理は大規模集約・分析などに向く。AI（Artificial Intelligence：人工知能）を業務へ導入するときは入力データ、学習と推論の分布差、説明可能性、人の確認、誤判定の責任を検討する。</p>\n<p>機械学習では教師あり学習が正解ラベルを使い、教師なし学習はデータ構造を発見し、強化学習は報酬に基づいて行動方針を学ぶ。学習データ上の精度が高くても未見の環境で性能が保たれるとは限らない（過学習・分布シフト）。</p>\n","worked":"<p>工場センサの異常検知を自動停止に直結する場合、偽陽性による停止損失・偽陰性による事故リスクがある。人手確認、しきい値、フェイルセーフ、ログを設計する。</p>\n","prompt":"AI分類器の全体正解率が99%なら、重大異常を99%見逃さないか。","answer":"<p>そうとは限らない。重大異常の再現率や偽陰性率を別に評価する。</p>\n","beginner":{"scenario":"工場の振動センサで値を取得し、エッジで異常を検出して保全担当に通知する。クラウドに全データを送らず遅延を抑える場合もある。","trap":"IoTは機器の接続・データ取得、AIはデータ分析の方法。両方が必須とは限らない。","quizId":"U-21-3"},"textbook":[{"heading":"IoTの全体像","body":"IoT（Internet of Things：モノのインターネット）はセンサなどの機器をネットワークへ接続し状態を取得・制御する仕組みです。工場設備の振動や温度を収集し、故障の兆候を分析する予知保全などに利用されます。"},{"heading":"エッジとクラウド","body":"データ発生源の近くで処理するエッジコンピューティングは通信遅延や送信量を抑えられる場合があります。クラウドでは複数拠点の大量データを統合して分析しやすくなります。リアルタイム制御、電力、通信障害時の動作から処理場所を選びます。"},{"heading":"AIの業務活用","body":"予測、分類、異常検知、生成などを業務へ適用します。モデルを導入しただけでは成果が出るとは限らないので、学習データの品質、未知データでの性能、誤判定時の影響、人による確認、継続的な監視を設計します。機器の認証、更新、ネットワーク分離も重要です。"}]},{"id":"21-X02","title":"民生機器・産業機器と電子ビジネス","explain":"<p>民生機器は家電、スマートフォン、ゲーム機、ウェアラブルなど。産業機器は工場ロボット、工作機械、プラント制御、医療・交通等の機器を含む。組込みシステムではリアルタイム性、消費電力、安全性、保守性、ネット接続のリスクが重要となる。</p><p>IoT（モノのインターネット）では端末、通信、クラウド・エッジ処理を組み合わせる。電子商取引（EC）にはBtoB（企業間）、BtoC（企業対消費者）、CtoC（消費者間）がある。EDIは企業間の電子データ交換、POSは販売時点情報管理。決済では認証、改ざん防止、個人情報保護、取引記録が必要。</p>","worked":"<p>工場設備の振動データから故障兆候を検出し点検を指示する予知保全は、産業機器におけるIoT活用例。</p>","prompt":"消費者同士が取引するフリーマーケットアプリの分類は？","answer":"<p>CtoC。</p>","beginner":{"scenario":"家電の温度制御では安全性や消費電力が重要。工場ロボットでは正確な位置制御に加え、停止時の安全・稼働率も重要。","trap":"民生と産業機器は用途が異なるが、共通の組込み技術を利用することもある。","quizId":"U-21-X02"},"textbook":[{"heading":"民生・産業機器の違い","body":"家電、スマートフォン、ゲーム機など一般利用者向けの機器を民生機器、工場ロボットや工作機械など産業用途の機器を産業機器と呼びます。どちらにもセンサ・制御回路・ソフトウェアが使われますが、安全性、耐環境性、応答期限、稼働期間などの要求が異なります。"},{"heading":"社会インフラへの応用","body":"交通、医療、電力などでは機器の故障が人命や重要サービスに影響し得ます。安全状態への移行、障害検知、冗長化、手動操作、保守計画などを用途に応じ設計します。"},{"heading":"接続された機器の管理","body":"遠隔監視や更新で保守を効率化できますが、ネット接続は新しい攻撃経路にもなります。機器IDと認証、ソフトウェア更新、権限分離、廃棄時のデータ消去を考えます。便益とリスクをライフサイクル全体で評価します。"}]},{"id":"21-Y04","title":"組込み・民生機器・屋内測位","explain":"<p>組込みシステムは機器に内蔵され特定機能を実現します。マイコン、センサ、アクチュエータ、ファームウェア、リアルタイムOS等で構成され、省電力、応答期限、安全性が重要です。</p>","worked":"<p>温度センサ→マイコンで設定値と比較→ヒータの制御→再測定という流れ。</p>","prompt":"温度センサで測定してヒータを制御する機器と、家庭内の複数機器の消費電力を管理するシステムの役割を区別せよ。","answer":"<p>前者は組込みシステムによる機器単位の制御、後者はHEMSによる家庭全体のエネルギー管理。HEMSは個別の組込み機器から情報を得たり制御指示を送ったりできるが、機器自身の安全制御とは別の役割。</p>","beginner":{"scenario":"スマート家電が温度を読み取り、設定温度に達したら加熱を停止する。","trap":"リアルタイム制御は単に平均処理速度が速いことではなく期限内の応答が重要。","quizId":"U-21-Y04"},"textbook":[{"heading":"組込みシステムの構成","body":"組込みシステムは家電や機械などに内蔵され、その機器の特定機能を実現する計算機システムです。センサは物理量を測定し、マイコン（マイクロコントローラ）は入力を処理し、アクチュエータは物理的な動作を起こします。ファームウェアは機器に組み込まれたソフトウェアです。リアルタイムOSは期限内の応答を管理する場合に用いられます。"},{"heading":"計測と制御の関係","body":"温度制御では温度センサの測定値を設定値と比較し、マイコンがヒータを制御します。結果を再測定して調整する仕組みがフィードバック制御です。測定精度、応答期限、消費電力、障害時の安全性が重要です。機器内の制御と機器外との通信は別の役割です。"},{"heading":"屋内で位置や近接を知る仕組み","body":"BLE（Bluetooth Low Energy: 低消費電力近距離通信）のビーコン（識別情報を発信する装置）は近接情報等に使えます。電波強度だけで距離を精密に決めるのは壁や反射の影響があるため難しい場合があります。AoA（Angle of Arrival: 到来角）は受信側で信号の到来方向を推定し、AoD（Angle of Departure: 出発角）は送信側からの方向情報を利用します。方向や複数の観測を組み合わせて位置を推定する方式があります。"},{"heading":"家庭全体のエネルギー管理","body":"HEMS（Home Energy Management System: 家庭エネルギー管理システム）は家庭の電力消費や発電などを可視化・管理し、機器の制御に利用する仕組みです。個々の家電を制御する組込みシステムと、複数機器や電力情報をまとめて管理するHEMSは扱う範囲が異なります。通信断でも必要な機能を安全に継続できる設計を検討します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-3","focus":"比較軸、因果、実務適用を明示"}},{"id":"21-C05","title":"民生機器・無線接続・屋内測位","explain":"<p>家庭内の機器を接続し位置や電力を管理する。</p><p>シラバスVer.7.2 本文119–120頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>ルータを経由せず対応する機器同士で直接通信する方式はWi-Fi Direct。</p>","prompt":"対応機器間でアクセスポイントを介さず接続する技術は？","answer":"<p>正解は「Wi-Fi Direct」。無線接続：WPS（Wi-Fi Protected Setup：無線LAN接続設定支援）は対応機器の接続設定を簡便にする仕組み。安全性を評価し必要な方式を選ぶ。Wi-Fi Directはアクセスポイントなしで対応機器間の直接通信を可能にする。Wi-Fi中継器は電波到達範囲を広げる。</p>","beginner":{"scenario":"家庭内の機器を接続し位置や電力を管理する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-21-C05"},"textbook":[{"heading":"無線接続","body":"WPS（Wi-Fi Protected Setup：無線LAN接続設定支援）は対応機器の接続設定を簡便にする仕組み。安全性を評価し必要な方式を選ぶ。Wi-Fi Directはアクセスポイントなしで対応機器間の直接通信を可能にする。Wi-Fi中継器は電波到達範囲を広げる。"},{"heading":"ワイヤレス給電・測位","body":"ワイヤレス給電は電磁誘導などで接点なしに電力を伝える。BLE（Bluetooth Low Energy：低消費電力Bluetooth）ビーコンは識別情報等を送る。AoA（到来角）・AoD（出発角）による測位は角度情報を利用する。"},{"heading":"民生機器","body":"スマートスピーカー、ウェアラブル、AR（拡張現実）グラス、MR（複合現実）グラス、VR（仮想現実）ゴーグル、セットトップボックス、HEMS等がある。個人情報と端末権限、安全性・省電力を考える。"}]},{"id":"21-Y05","title":"産業機器・PLC・AGV/AMR・スマート工場","explain":"<p>PLC（Programmable Logic Controller：プログラマブル論理制御装置）は入力信号を基に設備を制御します。FA（Factory Automation：工場自動化）は製造設備や工程の自動化です。</p>","worked":"<p>振動センサの値を監視し、故障兆候がある設備を計画停止して整備するのは予知保全の例。</p>","prompt":"周辺状況から搬送経路を動的に選ぶ能力を重視する機器は？","answer":"<p>AMR。AMRは自律的な移動・経路選択を行う搬送ロボット。</p>","beginner":{"scenario":"工場で部品を自動搬送し、センサ信号に応じて装置を制御する。","trap":"工場機器では通信便利性だけでなく安全停止や制御期限も重要。","quizId":"U-21-Y05"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"PLC（Programmable Logic Controller：プログラマブル論理制御装置）は入力信号を基に設備を制御します。FA（Factory Automation：工場自動化）は製造設備や工程の自動化です。"},{"heading":"仕組みと使い分け","body":"AGV（Automated Guided Vehicle：無人搬送車）は一般に定めた経路・誘導に従い、AMR（Autonomous Mobile Robot：自律移動ロボット）は周囲を認識し経路を動的に選ぶ能力を持ちます。M2M（Machine to Machine：機器間通信）やIoT（モノのインターネット）を活用し、設備異常を検知します。"},{"heading":"具体的な判断と手順","body":"振動センサの値を監視し、故障兆候がある設備を計画停止して整備するのは予知保全の例。"}]},{"id":"21-C03","title":"公共交通・エネルギー情報システム","explain":"<p>渋滞や電力需給の情報を収集して公共サービスを改善する。</p><p>シラバスVer.7.2 本文116–117頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>高速道路の料金決済はETC、渋滞情報提供はVICS。</p>","prompt":"道路の渋滞・規制情報を車載機器等へ提供するシステムは？","answer":"<p>正解は「VICS」。交通：ITS（Intelligent Transport Systems：高度道路交通システム）は情報通信で交通の安全・効率を高める総称。VICS（道路交通情報通信システム）は渋滞・規制などの道路交通情報を提供、ETC（自動料金支払システム）は通行料金を無線で処理する。GPS（全地球測位システム）は位置取得を支援する。</p>","beginner":{"scenario":"渋滞や電力需給の情報を収集して公共サービスを改善する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-21-C03"},"textbook":[{"heading":"交通","body":"ITS（Intelligent Transport Systems：高度道路交通システム）は情報通信で交通の安全・効率を高める総称。VICS（道路交通情報通信システム）は渋滞・規制などの道路交通情報を提供、ETC（自動料金支払システム）は通行料金を無線で処理する。GPS（全地球測位システム）は位置取得を支援する。"},{"heading":"電力","body":"スマートグリッドは通信・計測によって電力の需給を効率的に管理する電力網。EMS（Energy Management System：エネルギー管理システム）は消費・供給状況を計測・制御する。HEMSは家庭、BEMSは建物、CEMSは地域を対象とする。"},{"heading":"需要に応じたサービス","body":"AIオンデマンド交通は予約・需要に応じて運行経路等を調整する。座席予約システムは空席・予約・取消しを一貫管理する。二重予約を防ぐ取引制御や障害時の代替手段が必要。"}]},{"id":"21-C06","title":"産業機器・スマートシティ・自動車","explain":"<p>独立した機器と情報システムを組み合わせ社会インフラを運用する。</p><p>シラバスVer.7.2 本文120–121頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>複数家庭の蓄電池を統合制御して需給調整する例はVPP。</p>","prompt":"分散電源や蓄電池を統合制御する仕組みは？","answer":"<p>正解は「VPP」。エネルギー・移動：MaaS（Mobility as a Service：移動サービスの統合）は複数交通手段の検索・予約・決済などを一体化する。VPP（Virtual Power Plant：仮想発電所）は分散電源・蓄電池等を統合制御して一つの発電所のように活用する。スマート農業はセンサ・ロボット等で生産を支援する。</p>","beginner":{"scenario":"独立した機器と情報システムを組み合わせ社会インフラを運用する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-21-C06"},"textbook":[{"heading":"SoS・都市サービス","body":"SoS（System of Systems：システムの集合体）は独立したシステムが連携して新しい全体機能を実現する。スマートシティはデータ・技術で都市課題に対応し、都市OSは分野横断のデータ連携等を支援する基盤。M2Mは機器間通信、スーパーシティは複数領域の先端サービスを連携する考え方。"},{"heading":"エネルギー・移動","body":"MaaS（Mobility as a Service：移動サービスの統合）は複数交通手段の検索・予約・決済などを一体化する。VPP（Virtual Power Plant：仮想発電所）は分散電源・蓄電池等を統合制御して一つの発電所のように活用する。スマート農業はセンサ・ロボット等で生産を支援する。"},{"heading":"機器制御・ソフトウェアファースト","body":"ソフトウェアファーストはソフトウェアを中心に製品設計・価値向上を考える。SDV（Software Defined Vehicle：ソフトウェア定義車両）はソフトウェアによる機能定義・更新を重視する。CASEは接続、自動運転、共有・サービス、電動化。ADASは先進運転支援、CANは車載等の通信、SLAMは自己位置推定と地図作成を同時に行う。MT法は多変量データから正常状態との差を評価する方法。"}]},{"id":"21-Z01","title":"AIの社会実装・説明可能性・人間の関与","explain":"<p>シラバス本文117頁（5）①③を根拠にした補強単元です。</p>","worked":"<p>採用評価では属性別の誤判定率を調べ、個別理由を確認し、最終判断と異議申立てを人が担当する。</p>","prompt":"ある1人の審査結果について判断に影響した要因を示すのは？","answer":"<p>局所説明は個別の予測を対象とし、大局説明はモデル全体の傾向を対象とする。</p>","beginner":{"scenario":"採用候補者を評価するAIを導入するが、特定の属性の人に不公平な評価が集中していないか調べる。","trap":"説明可能性と精度、公平性は別々に確認する。","quizId":"U-21-Z01"},"textbook":[{"heading":"人間中心の原則","body":"AI（人工知能）を導入する目的は人間や社会に価値を届けることです。公平性、説明責任、透明性、安全性、プライバシーを検討します。AI-readyとは、データや人材、業務・組織がAIを利用できる準備を整えた状態を指す考え方です。AI倫理アセスメントでは想定する利用者、影響、リスクと対策を整理します。"},{"heading":"説明可能性の範囲","body":"XAI（Explainable AI：説明可能なAI）はモデルの判断を人が理解しやすくする技術や考え方です。大局説明はモデル全体の判断傾向、局所説明はある一件の予測理由を説明します。解釈可能性はモデルの振舞いを理解できる程度を指します。説明が付いたことだけで判断が正しい、公平であるとは限りません。"},{"heading":"人間による監督","body":"HITL（Human-in-the-Loop：人間が判断過程に関与する仕組み）では、誤判定が重大な影響を持つ場面で人が確認・訂正・承認します。ただし人の判断にも偏りがあり、AIの出力を無条件に信用する自動化バイアスにも注意します。AI RMF（AI Risk Management Framework：AIリスク管理枠組み）などでは、統治・リスク把握・測定・管理を継続する考え方を扱います。"}]},{"id":"21-Z02","title":"生成AIの出力リスク・利用目的・データ管理","explain":"<p>シラバス本文117頁（5）②③を根拠にした補強単元です。</p>","worked":"<p>最新の料金表を検索対象に限定し、出力された価格を担当者が原典と照合してから顧客へ送る。</p>","prompt":"生成AIを使った顧客回答の品質管理として適切なのは？","answer":"<p>人の確認と原典の照合で誤情報を抑える。入力管理や監視も別途必要。</p>","beginner":{"scenario":"会社で生成AIに顧客向け回答の下書きを作らせる。誤った製品仕様や秘密情報を出力する危険を減らす。","trap":"RAGを導入しても事実性や機密保持は自動保証されない。","quizId":"U-21-Z02"},"textbook":[{"heading":"目的に合わせたAI","body":"特化型AIは特定の課題を実行する仕組みで、汎用AIは多様な知的課題を柔軟に扱う概念です。チューリングテストは対話による知的振舞いの評価、フレーム問題は状況で考慮すべき事項を選ぶ難しさ、シンボルグラウンディング問題は記号と意味・実世界の対応の問題です。マルチモーダルAIは文章・画像など複数種類の情報を扱います。材料探索へのAI活用はマテリアルズインフォマティクスの例です。"},{"heading":"出力を検証する","body":"ハルシネーションは根拠のない内容がもっともらしく生成されることです。検索で情報を補うRAG（Retrieval-Augmented Generation：検索拡張生成）は根拠を利用しやすくしますが、検索失敗・古い資料・誤読が残り得ます。生成内容のランダム性やディープフェイク、差別表現、権利侵害にも注意します。出典・時点・原典・権利を確認してから使います。"},{"heading":"入力と運用を管理する","body":"顧客情報、営業秘密、未公開コードを外部AIに入力する場合、契約、保存、第三者提供、学習への利用、削除条件を確認します。オプトアウトは所定のデータ利用から除外を求める仕組みですが、保存や外部送信が一切なくなるとは限りません。情報分類、利用権限、レビュー、ログ、誤出力の報告・改善を設計します。"}]}],"beginnerIntro":"実際の企業や製造・流通・電子商取引がどうITを使うか学ぶ。略語を役割と業務の流れで整理する。","studyGroups":[{"title":"生産と企業業務","body":"調達・生産・販売・会計を情報で連携させる。","ids":["21-1","21-X01","21-Y01","21-Y02","21-C01"]},{"title":"商取引と行政","body":"企業間・顧客・行政との手続やデータ交換を理解する。","ids":["21-2","21-Y03","21-C04","21-C02"]},{"title":"機器・社会インフラ","body":"機器の計測・制御から工場、交通、都市システムへ進む。","ids":["21-3","21-X02","21-Y04","21-C05","21-Y05","21-C03","21-C06"]},{"title":"AIの責任ある活用","body":"業務目的、出力の検証、人間の関与を整理する。","ids":["21-Z01","21-Z02"]}]},{"id":22,"title":"企業活動・会計・データ分析","group":"ストラテジ","priority":"A重要","summary":"会計財務、財務諸表、在庫、意思決定、統計、組織。","lessons":[{"title":"財務諸表","body":"貸借対照表（BS：Balance Sheet）は一時点の資産・負債・純資産。損益計算書（PL：Profit and Loss Statement）は期間の収益・費用・利益。キャッシュフロー計算書は現金の動きを表す。","check":"利益が出ても資金繰りは悪化し得る。"},{"title":"財務分析","body":"流動比率=流動資産÷流動負債×100%、自己資本比率=自己資本÷総資産×100%、ROE（Return on Equity：自己資本利益率）=当期純利益÷自己資本。","check":"期末残高と平均残高のどちらを用いるかを確認。"},{"title":"統計","body":"平均・中央値・分散・標準偏差は分布の特徴を表す。相関係数は−1〜1だが因果関係は示さない。回帰は目的変数と説明変数の関係をモデル化する。","check":"相関があっても因果とは限らない。"},{"title":"在庫管理","body":"経済的発注量EOQ（Economic Order Quantity）は発注費用と在庫保管費用を均衡させる発注数量。一般形は√(2DS/H)（D需要量、S発注1回費用、H単位期間の1個当たり保管費用）。","check":"需要の変動や欠品費用など前提に注意。"}],"terms":[{"term":"貸借対照表","definition":"ある時点の資産・負債・純資産を表す財務諸表"},{"term":"損益計算書","definition":"一定期間の収益・費用・利益を表す財務諸表"},{"term":"キャッシュフロー","definition":"一定期間の現金の流入と流出"},{"term":"流動比率","definition":"流動資産を流動負債で割る短期支払能力の指標"},{"term":"自己資本比率","definition":"総資産に対する自己資本の割合"},{"term":"ROE","definition":"当期純利益を自己資本で割った利益率"},{"term":"標準偏差","definition":"分布の値のばらつきを元と同じ単位で示す統計量"},{"term":"相関係数","definition":"二変数の線形関係の向き・強さを示す−1〜1の指標"},{"term":"回帰分析","definition":"一方の変数を別の変数で説明・予測する手法"},{"term":"EOQ","definition":"発注費と在庫保管費の合計が小さくなる発注数量"}],"questions":[{"id":"Q22-01","chapter":22,"kind":"applied","q":"流動資産600、流動負債400の企業の流動比率は。","options":["67%","100%","150%","200%"],"correct":2,"explain":"600÷400×100=150%。"},{"id":"Q22-02","chapter":22,"kind":"applied","q":"「売上増加と広告費の相関が高い」から直ちに結論できるのは。","options":["広告費が売上増を必ず引き起こす","売上が広告費を必ず引き起こす","両者に線形関係が観測された","第三要因は存在しない"],"correct":2,"explain":"相関だけでは因果関係は確定しない。"},{"id":"Q22-03","chapter":22,"kind":"applied","q":"資産1000、負債600の場合の自己資本比率は。","options":["20%","40%","60%","100%"],"correct":1,"explain":"自己資本=1000−600=400、400÷1000=40%。"},{"id":"D22-01","chapter":22,"kind":"applied","q":"売上1,000万円、売上原価600万円、販管費250万円の場合の営業利益はどれか。","options":["150万円","250万円","400万円","750万円"],"correct":0,"explain":"売上総利益=1000−600=400万円、営業利益=400−250=150万円。"},{"id":"D22-02","chapter":22,"kind":"applied","q":"商品単価2,000円、変動費1,200円、固定費80万円の損益分岐点数量はどれか。","options":["400個","800個","1,000個","1,600個"],"correct":2,"explain":"限界利益=2,000−1,200=800円/個。800,000/800＝1,000個。"},{"id":"D22-03","chapter":22,"kind":"applied","q":"相関係数0.9の分析から判断できることはどれか。","options":["AがBの原因であることが証明された","線形の正の関連が強いが因果は確定しない","関係が一切ない","必ず外れ値が存在しない"],"correct":1,"explain":"相関は直線的関連の強さ。交絡・逆因果・非線形性を考慮する。"},{"id":"Q-22-X01","chapter":22,"kind":"applied","q":"多数の不良原因から優先改善対象を選ぶのに適した図は？","options":["散布図","パレート図","ER図","状態遷移図"],"correct":1,"explain":"パレート図。"},{"id":"Q-22-X02","chapter":22,"kind":"applied","q":"総資産500万円、利益25万円ならROAは？","options":["2%","5%","10%","20%"],"correct":1,"explain":"25/500×100＝5%。"},{"id":"U-22-1","chapter":22,"kind":"applied","q":"ある時点の資産・負債・純資産を示す財務諸表は？","options":["損益計算書","キャッシュフロー計算書","貸借対照表","売上予算表"],"correct":2,"explain":"貸借対照表は時点の財政状態、損益計算書は期間の経営成績。"},{"id":"U-22-2","chapter":22,"kind":"applied","q":"固定費30万円、限界利益率0.4の損益分岐点売上高は？","options":["12万円","120万円","30万円","75万円"],"correct":3,"explain":"固定費÷限界利益率=30/0.4=75万円。"},{"id":"U-22-3","chapter":22,"kind":"applied","q":"2変数の線形な関連の方向と強さを表す代表的指標は？","options":["相関係数","平均値","分散","中央値"],"correct":0,"explain":"相関係数は線形関係の方向・強さを示す。因果を保証しない。"},{"id":"U-22-4","chapter":22,"kind":"applied","q":"成功利益80万円が確率0.75、失敗損失40万円が0.25の期待値は？","options":["60万円","50万円","70万円","20万円"],"correct":1,"explain":"80×0.75＋(−40)×0.25＝60−10＝50万円。"},{"id":"U-22-X01","chapter":22,"kind":"applied","q":"原因候補を魚の骨のような形で整理するQC手法は？","options":["パレート図","散布図","特性要因図","ヒストグラム"],"correct":2,"explain":"特性要因図は結果と原因候補を分類して図示する。"},{"id":"U-22-X02","chapter":22,"kind":"applied","q":"自己資本200万円、純利益20万円のROEは？","options":["5%","20%","100%","10%"],"correct":3,"explain":"ROE（自己資本利益率）は純利益÷自己資本×100。"}],"deepIntro":"利益・現金・投資効率はそれぞれ違う尺度。データ分析は「数式が合っているか」と「結論が妥当か」を分けて考える。","deep":[{"id":"22-C01","title":"企業形態・経営資源・情報開示","explain":"<p>株主や従業員を含む関係者に企業の価値を説明する。</p><p>シラバスVer.7.2 本文122頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>人材教育・技能形成の投資と成果を事業戦略と結び付ける。</p>","prompt":"企業の財務と非財務情報を関連付け価値創造を説明する報告は？","answer":"<p>正解は「統合報告書」。統治と開示：コーポレートガバナンスは経営の監督・規律づけ。IR（投資家向け情報提供）、統合報告書は財務・非財務情報を結び付け長期価値創造を説明する。コーポレートアイデンティティは企業の理念・行動・表現による一貫した企業像。</p>","beginner":{"scenario":"株主や従業員を含む関係者に企業の価値を説明する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-22-C01"},"textbook":[{"heading":"経営資源と理念","body":"人的資本経営は人材の能力を資本として捉え価値向上への投資を重視する。パーパス経営は企業の存在意義を経営判断の軸とする。カーボンフットプリントは製品等のライフサイクルでの温室効果ガス排出量をCO2換算等で表す。"},{"heading":"企業形態","body":"株式会社は株主が出資し原則出資額を限度とする有限責任。持株会社は他社株式を保有してグループを統括する形態。IPO（Initial Public Offering：株式公開）は株式を公に取引できる市場へ上場等すること。ゴーイングコンサーンは事業を将来も継続する前提。"},{"heading":"統治と開示","body":"コーポレートガバナンスは経営の監督・規律づけ。IR（投資家向け情報提供）、統合報告書は財務・非財務情報を結び付け長期価値創造を説明する。コーポレートアイデンティティは企業の理念・行動・表現による一貫した企業像。"}]},{"id":"22-Y01","title":"組織構造・経営責任・社会とIT","explain":"<p>機能別組織は職能ごとに専門化し、事業部制は製品・地域等ごとに責任を分けます。マトリクス組織は複数の軸を組み合わせるため、調整力が重要です。</p>","worked":"<p>製品AとBに独立した売上・利益責任を持たせるのは事業部制。専門部門と製品責任者の双方から調整を受けるのはマトリクス型。</p>","prompt":"職能軸と製品軸を組み合わせた組織は？","answer":"<p>マトリクス組織。複数の管理軸を組み合わせる構造。</p>","beginner":{"scenario":"機能別部門が専門性を持つ一方、新製品の部門間調整に時間がかかる。","trap":"組織構造に万能な方式はない。","quizId":"U-22-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"機能別組織は職能ごとに専門化し、事業部制は製品・地域等ごとに責任を分けます。マトリクス組織は複数の軸を組み合わせるため、調整力が重要です。"},{"heading":"仕組みと使い分け","body":"CSR（Corporate Social Responsibility：企業の社会的責任）、IR（Investor Relations：投資家向け広報）、アカウンタビリティ（説明責任）を区別します。DX（デジタル変革）は技術利用により事業や組織を変革し、GX（グリーン変革）は脱炭素等に向けた変革です。DFFTは信頼性のある自由なデータ流通の考え方です。"},{"heading":"具体的な判断と手順","body":"製品AとBに独立した売上・利益責任を持たせるのは事業部制。専門部門と製品責任者の双方から調整を受けるのはマトリクス型。"}]},{"id":"22-X01","title":"経営・組織論と品質管理","explain":"<p>機能別組織は専門機能別、事業部制は製品や市場別、マトリックス組織は複数の指揮系統を組み合わせる。権限委譲は判断を現場に近づけるが責任範囲を明確にする。経営理念・目標、企業の社会的責任（CSR）、利害関係者との関係を理解する。</p><p>QC七つ道具（品質管理の基本手法）にはパレート図、特性要因図、ヒストグラム、散布図、チェックシート、管理図、層別（分類には流儀あり）がある。パレート図は頻度順と累積比率で重点を選ぶ。特性要因図は原因候補を分類し、管理図は時系列変動と管理限界を比較する。PDCAで改善する。</p>","worked":"<p>不良100件のうち傷60、寸法30、その他10なら傷と寸法の改善で90%の不良件数に対応できる。</p>","prompt":"多数の不良原因から優先改善対象を選ぶのに適した図は？","answer":"<p>パレート図。</p>","beginner":{"scenario":"不良100件の内訳が傷60、寸法30、その他10なら、頻度の大きい項目から改善を考える。パレート図は件数と累積比率を示す。","trap":"件数が多い原因が最も重大とは限らない。影響の大きさも評価する。","quizId":"U-22-X01"},"textbook":[{"heading":"組織の構成","body":"機能別組織は営業・開発・製造など専門機能ごとに分け、事業部制は製品・地域等の事業単位に分けます。マトリックス組織は機能と事業・プロジェクトなど複数の指揮系統を組み合わせます。専門性、意思決定速度、調整負担などの違いがあります。"},{"heading":"QC七つ道具","body":"パレート図は頻度順と累積比率、特性要因図は原因候補の関係、ヒストグラムは分布、散布図は二変数の関係、チェックシートはデータ収集、管理図は時系列の変動、層別は属性ごとに分けた分析に用います。分類には流儀があります。例えば不良件数60、30、10の順なら上位2種類で90%を占めます。"},{"heading":"改善を繰り返す","body":"管理図の管理限界は通常の変動から外れた兆候を調べるもので、製品の規格限界とは別です。PDCAで原因分析、対策、効果測定、標準化を行います。件数だけでなく被害の重大性や改善費用も考えます。"}]},{"id":"22-C02","title":"経営管理理論・行動科学","explain":"<p>組織の意思決定とチームの動機づけを改善する。</p><p>シラバスVer.7.2 本文122–123頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>情報や時間が限られる中で十分な選択肢を選ぶのはサイモンの満足化。</p>","prompt":"担当者が時間と情報の制約から最適案を全て探索せず基準を満たす案を選んだ。理論・人物と科学的管理法との違いを答えよ。","answer":"<p>サイモンの限定合理性・満足化。意思決定の制約に着目する。テイラーの科学的管理法は作業を測定して標準化し、効率を高める考え方。</p>","beginner":{"scenario":"組織の意思決定とチームの動機づけを改善する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-22-C02"},"textbook":[{"heading":"経営管理理論が扱う問い","body":"組織は複数の人が共通の目的を達成する仕組みです。作業をどう設計するか、人がなぜ協力するか、限られた情報でどのように判断するかは、互いに関係するものの別の問いです。各経営管理理論はその問いへの答えとして理解します。"},{"heading":"テイラー：仕事の方法を標準化する","body":"科学的管理法は作業を観察・測定し、効率的な手順を見つけて標準化する考え方です。時間研究などによって経験や勘だけに頼らず作業を設計し、計画と実行の役割を分けます。定型作業の効率には有用ですが、人の動機や複雑な協働をこれだけで説明することはできません。"},{"heading":"バーナード：協働が成立する条件","body":"バーナードは組織を意識的に調整された協働の体系として捉え、共通目的、貢献意欲、コミュニケーションを組織成立の条件としました。構成員が組織に参加し続けるには、提供する誘因と本人の貢献の均衡が重要です。作業標準の設計より、人々が協働する仕組みに注目します。"},{"heading":"サイモン：意思決定の限界","body":"サイモンは人が全ての選択肢と結果を知り完全に最適化するという想定を批判し、限定合理性を示しました。情報、時間、認知能力に制約があるため、十分に満足できる選択肢で意思決定する満足化が起こります。組織のルールや情報システムは意思決定を支援する仕組みとも考えられます。"},{"heading":"OODA：変化に応じて判断する","body":"OODAはObserve（観察）、Orient（状況判断・方向付け）、Decide（意思決定）、Act（行動）の循環です。行動の結果を再観察し、判断を更新します。変化の速い環境で有用です。PDCA（Plan: 計画、Do: 実行、Check: 評価、Act: 改善）は計画と結果の比較を軸に改善する枠組みで、両者は目的・利用場面を考えて使い分けます。"},{"heading":"経営活動と組織全体を捉える視点","body":"経営過程論は計画・組織化・指揮・統制など管理者の活動を機能別に整理します。一般システム理論は組織を要素と相互関係からなるシステムとして捉え、全体の振舞いに注目します。作業効率、協働、意思決定、管理活動、全体の関係は別の分析軸です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"22-C03","t
