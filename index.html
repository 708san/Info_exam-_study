求・応答などを利用します。DNSは名前解決、DHCPは設定配布、NTPは時刻同期です。"},{"heading":"メールと遠隔操作","body":"SMTP（簡易メール転送プロトコル）は送信側からメールを転送します。POP3はメール取得、IMAPはサーバ上のメール管理に適します。SSHは暗号化した遠隔ログイン等に用いられます。FTPはファイル転送の方式で、暗号化の有無は方式によります。"},{"heading":"ネットワーク管理","body":"SNMP（簡易ネットワーク管理プロトコル）は管理側が機器の状態情報を取得したり機器から通知を受けたりする方式です。監視では通信量・応答時間・パケット損失・機器ログを記録し、障害時に時系列で比較します。プロキシは通信を中継し、アクセス制御やキャッシュ等を提供できます。リバースプロキシはサーバ側の前段で要求を受ける構成です。"},{"heading":"プロキシの方向","body":"フォワードプロキシは利用者側の代理として外部へ要求を送り、リバースプロキシはサーバ側の入口として外部要求を受けて背後のWebサーバへ中継する。負荷分散やTLS終端を組み合わせる場合もある。"}]},{"id":"10-5","title":"通信性能・障害切分け・VPN","explain":"<p>通信量と転送速度は単位に注意。ビット/秒（bps）とバイト/秒（B/s）は8倍違う。実効スループットは再送・ヘッダ・制御・混雑の影響を受け、回線の公称帯域より低くなる。RTT（Round Trip Time：往復遅延）は要求してから応答が返るまでの通信遅延の尺度。ウィンドウサイズや帯域遅延積もTCPの性能に影響する。</p>\n<p>VPN（Virtual Private Network：仮想専用網）は公衆網等の上に論理的な保護通信路を構築する。IPsecはIP層、TLS-VPNはTLSなどを利用する。VPN接続が成功しても、接続後の権限・経路・DNSが適切とは限らない。</p>\n","worked":"<p>100MBのファイルを実効80Mbpsで送る理想時間は100×8/80＝10秒。実際にはTCP等のオーバーヘッドや往復遅延で延びる。MbpsをMB/sに読み替えない。</p>\n","prompt":"`traceroute`で応答が途切れた地点は必ず障害箇所か。","answer":"<p>断定できない。途中ルータが応答パケットを制限している可能性がある。</p>\n","beginner":{"scenario":"同じLANにはつながるが外部IPに接続できなければゲートウェイや経路を確認。外部IPは通るが名前が失敗する場合はDNSを調べる。","trap":"pingに応答しないだけでは故障と断定できない。","quizId":"U-10-5"},"textbook":[{"heading":"通信時間の内訳","body":"通信にはデータを回線へ送出する伝送時間、信号が進む伝搬時間、機器処理や待ち行列による遅延があります。100Mbit/sで10MBを送る理論伝送時間は10×8/100＝0.8秒です。実際にはヘッダ、再送、混雑、相手処理で増えます。往復時間（RTT）は要求を送り応答が返るまでの往復の時間の指標です。"},{"heading":"障害切分けの順序","body":"物理接続と無線の状態→端末のIP設定→同一ネットワークへの通信→外部IPへの経路→DNS名前解決→TLS・HTTPなどのアプリ層を調べます。複数端末で起きるか、特定宛先だけか、いつからかを確認し、共通する原因候補を絞ります。pingが通らないだけでは故障と断定できません。"},{"heading":"VPNの意味","body":"VPN（仮想私設網）は共有網上などで私設ネットワークのような通信経路を作ります。IPsecはIP層での保護、TLSを利用するVPNはリモートアクセスなどで使われます。通信経路の暗号化だけで端末や利用者の安全が保証されるわけではなく、認証・アクセス制御・ログ管理も必要です。"}]},{"id":"10-Z01","title":"パケット送信時間・ビット誤り率","explain":"<p>パケットLバイトのビット数は8L。回線速度Rビット/秒なら直列化時間8L/R秒。N個を連続送信しパケット間隔gが一定なら総時間はN×8L/R+(N−1)g（最後の間隔を含める仕様ならN g）。同じ間隔を持つ2回線の時間差では間隔項が相殺される。</p>","worked":"<p>500バイト×100個、10Mbpsと20Mbpsでは差100×(400−200)μs=20ms。</p>","prompt":"1000バイト、ビット誤り率0.0001%、10000パケット。独立かつ小確率の近似で誤りパケット数は？","answer":"<p>8000×10^-6×10000=80。厳密値は約79.68。</p>","beginner":{"scenario":"回線を高速化したときの送信時間差と誤り件数を見積もる。","trap":"ビット誤り率とパケット誤り率は同じではない。","quizId":"U-10-Z01"},"textbook":[{"heading":"基本原理","body":"パケットLバイトのビット数は8L。回線速度Rビット/秒なら直列化時間8L/R秒。N個を連続送信しパケット間隔gが一定なら総時間はN×8L/R+(N−1)g（最後の間隔を含める仕様ならN g）。同じ間隔を持つ2回線の時間差では間隔項が相殺される。"},{"heading":"仕組み・判断","body":"ビット誤り率pで各ビットの誤りが独立なら、bビットのパケットが1個以上誤る確率は1−(1−p)^b。bpが十分小さい場合は約bp。N個の誤りパケット数の期待値はN×その確率。百分率は100で割って確率へ変換する。"},{"heading":"応用と注意点","body":"1000バイト、100Mbpsと1Gbpsでは1個当たり80μsと8μs、差72μs。50個で3.6ms。1000バイト、p=0.0001%=10^-6ならパケット誤り率は約0.8%。1000個なら約8個。バースト誤りでは独立仮定が成立しない。"}]},{"id":"10-Y05","title":"ネットワーク監視・SNMP・仮想ネットワーク","explain":"<p>ネットワーク図、機器の設定・版・接続・変更履歴を管理する。pingは疎通の手掛かり、tracerouteは経由する機器の情報、ipやifconfigはインタフェース設定、arpはIPv4アドレスとMACの対応、ssやnetstatは通信接続等、digはDNS応答を調べる。tcpdumpやWiresharkは許可された通信のパケットを観測する。暗号化された内容を常に読めるわけではない。観測する範囲・権限・個人情報を管理する。</p>","worked":"<p><b>監視カウンタが10秒で25MB増えた。</b></p><p>十進単位で25×8/10＝20Mbit/s。</p>","prompt":"機器が障害を管理側へ自発的に通知するSNMPの機能は？","answer":"<p>TRAP。管理側の周期的なGETとは異なる。</p>","textbook":[{"heading":"障害と構成を調べる","body":"ネットワーク図、機器の設定・版・接続・変更履歴を管理する。pingは疎通の手掛かり、tracerouteは経由する機器の情報、ipやifconfigはインタフェース設定、arpはIPv4アドレスとMACの対応、ssやnetstatは通信接続等、digはDNS応答を調べる。tcpdumpやWiresharkは許可された通信のパケットを観測する。暗号化された内容を常に読めるわけではない。観測する範囲・権限・個人情報を管理する。"},{"heading":"SNMPで機器を監視する","body":"SNMP（簡易ネットワーク管理プロトコル）では管理ステーションが機器側のエージェントへ状態を問い合わせる。MIB（管理情報ベース）は管理対象の項目を体系化しOID（オブジェクト識別子）で特定する。GETは値の取得、SETは設定変更、TRAPは機器側からの非同期通知。例えばインタフェースの送信バイト数を60秒間隔で読み、差が300MBなら平均40Mbit/s。カウンタの桁あふれ・再起動も考慮する。SNMPv3等で認証・暗号化を適切に設定する。"},{"heading":"ネットワークをソフトウェアで管理する","body":"SDN（ソフトウェア定義ネットワーク）は制御面と転送面を分離し、ソフトウェアで転送規則を管理する考え方。OpenFlowは制御器と転送機器間の規則設定等に用いられる規格の例。NFV（ネットワーク機能仮想化）はファイアウォールやルータ等の機能を仮想化基盤上で実行する。SD-WAN（ソフトウェア定義WAN）は拠点間回線を集中管理し用途・品質に応じ経路を選ぶ。トンネリングはある通信を別の通信の中に包んで転送するが、それだけで暗号化を意味しない。"}],"beginner":{"scenario":"障害と構成を調べるから順に、SNMPで機器を監視する、ネットワークをソフトウェアで管理するを理解する。","trap":"Network Functions Virtualization（ネットワーク機能仮想化）。","quizId":"U-10-Y05"}},{"id":"10-Y07","title":"通信サービス・携帯網・IoT通信","explain":"<p>専用線は特定拠点間に通信回線を提供するサービス、IP-VPNは通信事業者のIP網を利用する私設網サービス、広域Ethernetは拠点間をイーサネットのように接続する。FTTHは家庭等まで光ファイバ、xDSLは既存電話線等を利用する方式、衛星通信は地上回線が届きにくい地域等で役立つ。ベストエフォートは最大速度を目安に提供し個別の実効速度を常に保証するものではない。IP電話やVoIPはIP網で音声を運ぶ。</p>","worked":"<p><b>電池式の農地センサから数分ごとに温度を少量送る。</b></p><p>通信範囲、電池寿命、網の提供状況に応じLPWA等を検討する。動画送信とは要求が異なる。</p>","prompt":"移動中に接続する基地局が変わる仕組みは？","answer":"<p>ハンドオーバー。ローミングは別の事業者網等の利用を指す。</p>","textbook":[{"heading":"サービスの選択","body":"専用線は特定拠点間に通信回線を提供するサービス、IP-VPNは通信事業者のIP網を利用する私設網サービス、広域Ethernetは拠点間をイーサネットのように接続する。FTTHは家庭等まで光ファイバ、xDSLは既存電話線等を利用する方式、衛星通信は地上回線が届きにくい地域等で役立つ。ベストエフォートは最大速度を目安に提供し個別の実効速度を常に保証するものではない。IP電話やVoIPはIP網で音声を運ぶ。"},{"heading":"携帯網が移動に対応する","body":"基地局は無線端末を通信網へ接続し、フェムトセルは小範囲の基地局。ハンドオーバーは移動時に接続先基地局等を切り替え、ローミングは契約網以外の事業者網等を利用する。SIM/eSIMは加入者識別情報等を扱い、テザリングは携帯端末の通信を他機器へ共有する。MVNO（仮想移動体通信事業者）は他事業者の設備等を利用しサービス提供する。LTE上の音声通話がVoLTE。5GのSA方式は5Gコアを使い、NSA方式は既存LTE等と連携する。ネットワークスライシングは用途別の論理的なネットワークを構成する。"},{"heading":"無線の性能と省電力","body":"MIMOは複数アンテナを使い通信品質・容量を改善する。ビームフォーミングは電波の指向性を制御、キャリアアグリゲーションは複数周波数帯等を束ねる。間欠受信等は必要時だけ動作して省電力化する。LPWA（低消費電力広域通信）は少量データを長距離・低電力で送る用途に適し、LTE-M、NB-IoT、Wi-SUN、LoRaWANなどがある。MQTTは発行・購読型の軽量メッセージ通信、CoAPは制約のある機器向けの通信規約。Wi-Fi HaLowはIEEE 802.11ahに基づく低電力・広範囲向け無線技術。"},{"heading":"LPWAの特性","body":"LPWA（Low Power Wide Area：低消費電力広域通信）は長距離・低消費電力で少量のデータを送るIoT機器等に向く。センサの定期送信などが例。大容量映像には通常向かない。電力線通信や基板内の有線シリアル通信とは区別する。"}],"beginner":{"scenario":"サービスの選択から順に、携帯網が移動に対応する、無線の性能と省電力を理解する。","trap":"発行者と購読者の間をブローカ等が仲介する。","quizId":"U-10-Y07"}}],"beginnerIntro":"端末からサーバまでの配送を階層別に理解する。アドレス、名前、ポート、機器の役割を分ける。","studyGroups":[{"title":"通信の基本と物理・リンク","body":"階層ごとの役割と隣接機器間の配送を理解する。","ids":["10-1","10-X01","10-Y01","10-4","10-Y02"]},{"title":"ネットワーク層と経路","body":"宛先ネットワークと次の転送先を判断する。","ids":["10-2","10-Y04"]},{"title":"トランスポートとアプリ","body":"端末間の通信を確立し、名前解決とアプリの要求・応答へ進む。","ids":["10-Y03","10-Z02","10-3","10-Y06","10-C01","10-X02"]},{"title":"性能・運用・サービス","body":"遅延・誤り・監視・仮想化・通信サービスを学ぶ。","ids":["10-5","10-Z01","10-Y05","10-Y07"]}]},{"id":11,"title":"情報セキュリティ","group":"テクノロジ","priority":"B必須","summary":"暗号・認証・脆弱性・ネットワーク防御・インシデント対応。必須の最重要領域。","lessons":[{"title":"CIAと脅威分析","body":"情報セキュリティの基本は機密性（Confidentiality）・完全性（Integrity）・可用性（Availability）。リスクは脅威・脆弱性・資産への影響を踏まえ評価。","check":"可用性はシステム稼働、完全性は無断改ざん防止。"},{"title":"共通鍵・公開鍵・ハッシュ","body":"共通鍵暗号は同じ秘密鍵で暗号化と復号。公開鍵暗号は公開鍵と秘密鍵のペア。ハッシュは固定長の要約であり復号不可。ディジタル署名では署名者の秘密鍵で署名し公開鍵で検証する。","check":"署名と暗号化で使用する鍵の向きを混同しない。"},{"title":"証明書と認証","body":"認証局CA（Certificate Authority）が発行する証明書を信頼の鎖で検証。多要素認証は知識・所持・生体など異なる要素を組み合わせる。パスワードと秘密の質問は同じ知識要素。","check":"二段階認証が必ず多要素とは限らない。"},{"title":"主要な脆弱性","body":"SQLインジェクションは入力がSQL構造を変える攻撃。対策はプレースホルダ等のパラメータ化クエリ。XSS（Cross-Site Scripting）はブラウザ側で不正スクリプトを実行し、出力時の適切なエスケープ等で防ぐ。CSRFは利用者の認証状態を悪用して意図しない要求を送らせる。","check":"入力検証と出力エスケープだけで全脅威を解決したと考えない。"},{"title":"防御の層と監視","body":"WAF（Web Application Firewall）はWebアプリへのリクエストを検査。IDS/IPSは侵入検知・防止。EDR（Endpoint Detection and Response）は端末上の挙動監視と対応。最小権限や多層防御を徹底。","check":"FW・WAF・EDRで監視する位置が異なる。"},{"title":"インシデント対応","body":"初動は影響範囲・証拠保全・封じ込め・根絶・復旧・再発防止を適切に計画。証拠ログの削除や無断の再起動は分析を妨げる場合がある。","check":"原因究明前に証拠が失われないよう保全する。"}],"terms":[{"term":"機密性","definition":"許可された人だけが情報にアクセスできる性質"},{"term":"完全性","definition":"情報が不正に改ざんされていない性質"},{"term":"可用性","definition":"必要なときに情報やサービスを利用できる性質"},{"term":"共通鍵暗号","definition":"暗号化と復号で同じ秘密鍵を用いる方式"},{"term":"公開鍵暗号","definition":"公開鍵と秘密鍵の組を利用する暗号方式"},{"term":"ハッシュ関数","definition":"入力から一方向の固定長要約値を作る関数"},{"term":"ディジタル署名","definition":"秘密鍵による署名と公開鍵による検証で真正性等を確認する仕組み"},{"term":"PKI","definition":"公開鍵と電子証明書の信頼関係を管理する基盤"},{"term":"多要素認証","definition":"異なる認証要素を二種類以上組み合わせる認証"},{"term":"SQLインジェクション","definition":"入力を通じて意図しないSQL文を実行させる攻撃"},{"term":"XSS","definition":"Webページに不正なスクリプトを混入し閲覧者のブラウザで実行させる攻撃"},{"term":"CSRF","definition":"認証中の利用者に意図しないWeb要求を送信させる攻撃"},{"term":"WAF","definition":"WebアプリへのHTTPリクエスト等を検査・遮断する装置や機能"},{"term":"EDR","definition":"端末上の不審な活動を検知して分析や対応を支援する技術"},{"term":"ゼロトラスト","definition":"接続元だけを信用せず要求ごとに検証・認可する設計思想"},{"term":"サプライチェーン攻撃","definition":"取引先や依存ソフトなどを踏み台に本来の標的を攻撃する手法"}],"questions":[{"id":"Q11-01","chapter":11,"kind":"applied","q":"ディジタル署名を検証する際に原則使用する鍵は。","options":["署名者の秘密鍵","署名者の公開鍵","受信者の秘密鍵","共通鍵"],"correct":1,"explain":"署名者の秘密鍵で署名し、対応する公開鍵で検証する。"},{"id":"Q11-02","chapter":11,"kind":"applied","q":"SQLインジェクションの根本的な対策として適切なのは。","options":["入力をすべて大文字化する","パラメータ化クエリを用いる","通信をHTTPに戻す","エラーログを無効化する"],"correct":1,"explain":"値とSQL文の構造を分離する。"},{"id":"Q11-03","chapter":11,"kind":"applied","q":"パスワードと秘密の質問を併用した認証は、一般に何要素か。","options":["1要素","2要素","3要素","4要素"],"correct":0,"explain":"いずれも知識要素であり、異なる要素の組み合わせではない。"},{"id":"D11-01","chapter":11,"kind":"applied","q":"AがBへ機密情報を公開鍵暗号で送りたい場合、暗号化に使う鍵はどれか。","options":["Aの公開鍵","Aの秘密鍵","Bの公開鍵","Bの秘密鍵"],"correct":2,"explain":"受信者Bの公開鍵で暗号化し、Bの秘密鍵で復号する。署名と混同しない。"},{"id":"D11-02","chapter":11,"kind":"applied","q":"WebアプリでSQLインジェクションを防ぐ根本対策として最も適切なものはどれか。","options":["入力をSQL文字列に連結する","全ユーザーに管理権限を与える","パラメータ化クエリを使用する","WAFを置くだけで入力処理を放置する"],"correct":2,"explain":"SQLの構造と値を分け、利用者入力を構文として解釈させない。WAFは多層防御の一部。"},{"id":"D11-03","chapter":11,"kind":"applied","q":"依存ライブラリ更新後に不審な外部通信が発生した初動として適切なものはどれか。","options":["端末を即座に初期化して証拠を消す","影響を隔離しログ・更新履歴を保全する","調査前に漏えいはなかったと発表する","不正通信を容認して更新を続ける"],"correct":1,"explain":"封じ込めと証拠保全を両立。原因・影響未確定なら断定を避ける。"},{"id":"Q-11-X01","chapter":11,"kind":"applied","q":"CVSSの主目的は？","options":["利用者本人確認","暗号鍵配布","脆弱性の深刻度評価","業務復旧時間の計測"],"correct":2,"explain":"脆弱性の深刻度を共通尺度で評価すること。"},{"id":"Q-11-X02","chapter":11,"kind":"applied","q":"WebアプリのHTTP要求を検査して攻撃を抑える装置は？","options":["UPS","WAF","DNS","DHCP"],"correct":1,"explain":"WAF（Webアプリケーションファイアウォール）。"},{"id":"U-11-1","chapter":11,"kind":"applied","q":"正規利用者が必要時に利用できる性質は？","options":["機密性","完全性","可用性","真正性"],"correct":2,"explain":"可用性は必要時に使えること。機密性は漏えい防止、完全性は正確さ・完全さ。"},{"id":"U-11-2","chapter":11,"kind":"applied","q":"デジタル署名を検証する鍵は？","options":["署名者の秘密鍵","受信者の公開鍵","受信者の秘密鍵","署名者の公開鍵"],"correct":3,"explain":"署名者の秘密鍵で署名し対応する公開鍵で検証。"},{"id":"U-11-3","chapter":11,"kind":"applied","q":"パスワードと所持する認証器を組み合わせる方式は？","options":["多要素認証","単一要素認証","認可のみ","暗号化のみ"],"correct":0,"explain":"知識要素と所持要素を組み合わせている。"},{"id":"U-11-4","chapter":11,"kind":"applied","q":"認証済み利用者に意図しない要求を送らせる攻撃への代表的対策は？","options":["SQLプレースホルダのみ","CSRFトークン","パスワード長変更のみ","画像圧縮"],"correct":1,"explain":"CSRFトークンを検証して意図しない要求を防ぐ。"},{"id":"U-11-5","chapter":11,"kind":"applied","q":"複数機器のログを集中・相関分析する仕組みは？","options":["DHCP","RAID","SIEM","コンパイラ"],"correct":2,"explain":"SIEMはセキュリティ情報・イベント管理。ログを統合分析する。"},{"id":"U-11-6","chapter":11,"kind":"applied","q":"退職者IDが有効なまま残る問題への直接的な対策は？","options":["画面解像度向上","DB索引追加","年1回パスワード変更のみ","退職情報と連動してIDを無効化"],"correct":3,"explain":"原因である退職者の有効なIDを直接無効化する。"},{"id":"U-11-X01","chapter":11,"kind":"applied","q":"対策後も残るリスクは？","options":["残留リスク","脅威","脆弱性","誤検知率"],"correct":0,"explain":"残留リスクを評価し追加対策または受容を判断する。"},{"id":"U-11-X02","chapter":11,"kind":"applied","q":"不審な通信を検知するだけでなく遮断する仕組みは？","options":["IDS","IPS","DNS","NTP"],"correct":1,"explain":"IPSは侵入防止、IDSは主に侵入検知。"},{"id":"U-11-Y01","chapter":11,"kind":"applied","q":"内部不正のトライアングルの三要素は？","options":["機会・動機・正当化","機密性・完全性・可用性","計画・実行・改善","認証・認可・監査"],"correct":0,"explain":"不正が生じる要因を理解し機会等を減らす。"},{"id":"U-11-Y02","chapter":11,"kind":"applied","q":"過去の正当な通信を再利用する攻撃への対策として有用なものは？","options":["通信内容の圧縮のみ","使い捨ての乱数等による鮮度確認","画面色の変更","ログの削除"],"correct":1,"explain":"同じ認証要求が再利用されないよう鮮度を確認する。"},{"id":"U-11-Y03","chapter":11,"kind":"applied","q":"同じハッシュ値を持つ任意の二つの入力を見つけにくい性質は？","options":["原像発見困難性だけ","可逆性","衝突発見困難性","可用性"],"correct":2,"explain":"衝突は任意の異なる二入力のハッシュ値が等しいこと。"},{"id":"U-11-Y04","chapter":11,"kind":"applied","q":"証明書が失効していないか個別に問い合わせる方式は？","options":["SMTP","NAT","SJF","OCSP"],"correct":3,"explain":"Online Certificate Status Protocol（オンライン証明書状態確認プロトコル）。"},{"id":"U-11-Y05","chapter":11,"kind":"applied","q":"1回300万円の損失、年間発生頻度0.2回の年間予想損失額は？","options":["60万円","1500万円","300万円","6万円"],"correct":0,"explain":"300×0.2＝60万円。"},{"id":"U-11-Y06","chapter":11,"kind":"applied","q":"カード会員データの保護に関する代表的な業界基準は？","options":["ISO 9001のみ","PCI DSS","IEEE 802.1Q","SQL"],"correct":1,"explain":"決済カード業界のデータセキュリティ基準。"},{"id":"U-11-Y07","chapter":11,"kind":"applied","q":"コモンクライテリアの評価保証レベルを示す略称は？","options":["RPO","FAR","EAL","MIB"],"correct":2,"explain":"Evaluation Assurance Level（評価保証レベル）。"},{"id":"U-11-Y08","chapter":11,"kind":"applied","q":"ソフトウェアの構成部品や版の情報を整理するものは？","options":["SLA","MIB","RACI","SBOM"],"correct":3,"explain":"ソフトウェア部品表により依存関係等を把握する。"},{"id":"U-11-Y09","chapter":11,"kind":"applied","q":"メールの表示Fromと認証ドメインの整合性を確認する仕組みは？","options":["DMARC","NTP","IMAP","ARP"],"correct":0,"explain":"SPF/DKIMの認証結果と表示Fromのドメイン整合性等を評価する。"},{"id":"U-11-Y10","chapter":11,"kind":"applied","q":"ブラウザの異なるオリジン間の資源共有をサーバが許可する仕組みは？","options":["HSTS","CORS","DKIM","SNMP"],"correct":1,"explain":"CORSはブラウザのオリジン間アクセス制限を許可に従って緩和する。"}],"deepIntro":"セキュリティは暗号用語の暗記ではなく「脅威→脆弱性→侵害経路→影響→対策→監視・対応」の因果関係で理解する。科目B必須。","deep":[{"id":"11-1","title":"情報資産・リスク・管理策","explain":"<p>情報セキュリティの3要素CIAはConfidentiality（機密性）、Integrity（完全性）、Availability（可用性）。機密性は不正閲覧防止、完全性は意図しない改変防止、可用性は必要なとき利用できること。脅威は攻撃・事故などの原因、脆弱性は悪用される弱点、リスクは結果として生じ得る損害の可能性を指す。資産価値・発生可能性・影響度に応じて優先度を決める。</p>\n<p>リスク対応は回避（活動中止）、低減（管理策で可能性や影響を下げる）、移転/共有（保険・委託等）、受容（残余リスクを承認）。対策を導入してもリスクはゼロにならない。ISMS（Information Security Management System：情報セキュリティマネジメントシステム）は方針・リスク評価・管理策・監査・改善の継続活動。</p>\n","worked":"<p>個人情報の入ったノートPC紛失リスクに対し、ディスク暗号化と持出し制限は低減、そもそも持ち出さない運用は回避になり得る。暗号化は紛失そのものを防がず、漏えいの影響を抑える。</p>\n","prompt":"パッチを当てたら「リスク＝ゼロ」か。","answer":"<p>違う。設定不備、未知の脆弱性、人的誤操作などの残余リスクがある。</p>\n","beginner":{"scenario":"銀行で口座情報漏えいは機密性、残高改ざんは完全性、障害で送金不能は可用性の問題。守る性質に応じ対策を選ぶ。","trap":"脅威は被害の原因、脆弱性は弱点、リスクは影響や可能性を含む。","quizId":"U-11-1"},"textbook":[{"heading":"何を守るのか","body":"情報セキュリティの基本は機密性（許可された者だけが情報へアクセスできる）、完全性（情報が正確・完全に保たれる）、可用性（必要時に利用できる）のCIAです。真正性は主体やデータが主張通りか確認できる性質、否認防止は後から行為を否定しにくくする性質です。"},{"heading":"リスクを構造化する","body":"資産は保護対象（顧客データ・端末・サービスなど）、脅威は被害をもたらす可能性のある事象、脆弱性は悪用され得る弱点です。例えば顧客データが資産、窃取が脅威、過剰な閲覧権限が脆弱性です。リスク評価では発生可能性や影響を考慮し対策の優先度を決めます。"},{"heading":"対策を組み合わせる","body":"技術的対策は暗号やアクセス制御、人的対策は教育、組織的対策は方針・手続、物理的対策は入退室管理などです。予防だけでなく検知・対応・復旧も設計します。リスク回避は危険な活動を中止、低減は可能性・影響を小さくし、移転・共有は保険等、受容は残るリスクを認める判断です。"},{"heading":"真正性と信頼性","body":"真正性は主体が主張する本人・物であるという特性。信頼性は意図した動作と結果が一貫する特性。機密性は権限のない者への非開示、完全性は正確さと完全さ、可用性は権限のある者が必要時に利用可能な特性。"}]},{"id":"11-Y05","title":"情報セキュリティのリスク分析・規程・継続","explain":"<p>資産の所有者と機密性・完全性・可用性の重要度を台帳に記録する。リスク特定は何が起こり得るか、分析は発生可能性と影響を把握、評価は受容基準と比較する。定性的評価は高・中・低などの尺度、定量的評価は金額や確率等を用いる。年間予想損失額は単一事象の予想損失額×年間発生頻度で計算する基本モデルがある。1回の損失100万円で年0.2回なら20万円。対策で年0.05回なら5万円、期待損失の減少は15万円だが重大被害・法令・不確実性も考える。</p>","worked":"<p><b>1回200万円の損失が年0.5回の見込み。対策後は年0.1回、対策費年30万円。</b></p><p>期待損失は100万円から20万円へ減少し、対策費込み50万円。単純な期待値では50万円改善する。</p>","prompt":"発生可能性と影響を分析した後、リスク評価で行うことは？","answer":"<p>事前に定めたリスク基準と比較し、受容可能性や対応の優先度を判断する。</p>","textbook":[{"heading":"リスクを測る","body":"資産の所有者と機密性・完全性・可用性の重要度を台帳に記録する。リスク特定は何が起こり得るか、分析は発生可能性と影響を把握、評価は受容基準と比較する。定性的評価は高・中・低などの尺度、定量的評価は金額や確率等を用いる。年間予想損失額は単一事象の予想損失額×年間発生頻度で計算する基本モデルがある。1回の損失100万円で年0.2回なら20万円。対策で年0.05回なら5万円、期待損失の減少は15万円だが重大被害・法令・不確実性も考える。"},{"heading":"リスクを扱う責任","body":"回避は活動を中止、低減は発生可能性や影響を減らし、共有・移転は保険や契約等で負担を分け、保有・受容は残るリスクを引き受ける。残留リスクを責任者が承認し、リスク登録簿に対応、期限、責任、監視項目を記録する。クラウドの責任共有モデルは提供者と利用者が管理する範囲を区別する。委託しても利用者のデータ・権限等の責任が消えるとは限らない。"},{"heading":"規程と事業継続","body":"情報セキュリティ基本方針で方向を示し、対策基準で守る条件、実施手順で具体的な作業を定める。例外の承認、教育、監査、規程更新を管理する。サイバーハイジーンは更新、不要アカウント削除、資産把握等の日常的な衛生管理。コンティンジェンシー計画は緊急事態への対応、災害復旧計画は復旧方法を定める。事業継続の中でもセキュリティを維持し、訓練で実現可能性を検証する。"}],"beginner":{"scenario":"リスクを測るから順に、リスクを扱う責任、規程と事業継続を理解する。","trap":"300×0.2＝60万円。","quizId":"U-11-Y05"}},{"id":"11-Z03","title":"情報資産のリスク評価・年間予想損失額","explain":"<p>資産台帳に資産名、所有者、保存場所、重要度を記録する。機密性・完全性・可用性に対する脅威と脆弱性を特定し、発生可能性と影響を分析する。リスク基準と比較し対策の要否を決める。リスク所有者は管理責任を持つ。</p>","worked":"<p>損失100万円・年0.3回のALEは30万円。</p>","prompt":"損失300万円、年間発生頻度0.1回のALEは？","answer":"<p>300×0.1=30万円/年。</p>","beginner":{"scenario":"重要データを保護する対策にどれだけ費用を掛けるべきか評価する。","trap":"発生頻度と確率を混同せず期間をそろえる。","quizId":"U-11-Z03"},"textbook":[{"heading":"基本原理","body":"資産台帳に資産名、所有者、保存場所、重要度を記録する。機密性・完全性・可用性に対する脅威と脆弱性を特定し、発生可能性と影響を分析する。リスク基準と比較し対策の要否を決める。リスク所有者は管理責任を持つ。"},{"heading":"仕組み・判断","body":"年間予想損失額ALE（Annualized Loss Expectancy）は1件当たり損失額SLE（Single Loss Expectancy）×年間発生頻度ARO（Annualized Rate of Occurrence）。例として損失200万円・年0.2回なら年間40万円。対策費15万円で年0.05回へ下がるなら対策後の合計25万円、期待費用は15万円低下する。"},{"heading":"応用と注意点","body":"回避は危険な活動をやめる、低減は発生確率や影響を減らす、共有は保険などで負担を分担、保有は基準に照らして受容する。複数リスクの依存関係や集中（リスク集約）も評価する。法令・重大事故は期待金額だけで判断しない。"}]},{"id":"11-C01","title":"リスク源・リスク選好・資金管理","explain":"<p>情報漏えいへの対策と保険を比較する。</p><p>シラバスVer.7.2 本文52頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>防火設備は損失低減、保険は資金面の備え。</p>","prompt":"アクセス権の削減とサイバー保険を分類し、保険だけでは不十分な理由を説明せよ。","answer":"<p>アクセス権の削減はリスクコントロール、保険はリスクファイナンシング。保険は事故後の資金負担を軽減するが漏えいを防がない。</p>","beginner":{"scenario":"情報漏えいへの対策と保険を比較する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-11-C01"},"textbook":[{"heading":"事故と事故を起こしやすくする条件","body":"リスクを管理するには、何が損失を直接起こし、その発生確率や損失の大きさを何が高めるかを区別します。ペリルは火災や盗難等の損失を直接もたらす事故・原因、ハザードは事故の発生や損失を増やす条件です。モラルハザードは保険などで本人の損失負担が減り、注意や行動が変化して危険を増やす問題です。"},{"heading":"リスクを評価する尺度","body":"リスクの評価では、発生可能性と影響度を見積もります。金額や頻度を十分に推定できない場合は、尺度で採点する得点法により優先順位を比較できます。点数は物理的な金額や確率と同じではなく、評価基準を明示して使います。対策後にも残るものを残留リスクと呼びます。"},{"heading":"どこまで引き受けるか","body":"リスク選好は目的を達成するために引き受ける意思のあるリスクの種類や量を表します。リスク忌避は不確実性を避ける傾向です。全てのリスクをゼロにするには費用がかかり、事業機会まで失うことがあるため、影響、許容範囲、対策費用を比較して判断します。"},{"heading":"リスクコントロールとファイナンシング","body":"リスクコントロールは事故の発生や損害を抑える対策で、アクセス制限、設備改善、バックアップなどが関係します。リスクファイナンシングは事故後の損失に備えて保険や資金を用意する方法です。保険に入っても事故自体は防げません。対策と資金手当を組み合わせ、残留リスクを管理します。"},{"heading":"情報アクセスを必要性で制限する","body":"need-to-know（知る必要性）の原則では、業務に必要な情報へのアクセスだけを許可します。最小権限は必要な操作権限だけを付与する原則です。従業員の役職だけで全データへの閲覧を認めず、業務目的に応じて情報と操作の権限を設計します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"11-Y06","title":"ISMS・セキュリティ組織・基準","explain":"<p>ISMS（情報セキュリティマネジメントシステム）では適用範囲、方針、責任、リスク対応、運用、内部監査、経営層による見直し、改善を体系化する。ISO/IEC 27001（JIS Q 27001）は要求事項、27002は管理策の指針、27014はガバナンス、27017はクラウドの管理策に関する指針。適用宣言書では必要な管理策と適用の理由等を整理する。認証は一定の範囲の仕組みを評価するもので事故ゼロの保証ではない。</p>","worked":"<p><b>販売したソフトウェアの脆弱性報告を受け取り修正版を調整する。</b></p><p>製品セキュリティ対応のPSIRTが中心となり、開発・顧客対応等と連携する。</p>","prompt":"SOCとCSIRTは同じ役割か。","answer":"<p>重なる場合もあるが、SOCは主に監視・分析、CSIRTは事故対応・調整を担当する。</p>","textbook":[{"heading":"組織の仕組みを評価する","body":"ISMS（情報セキュリティマネジメントシステム）では適用範囲、方針、責任、リスク対応、運用、内部監査、経営層による見直し、改善を体系化する。ISO/IEC 27001（JIS Q 27001）は要求事項、27002は管理策の指針、27014はガバナンス、27017はクラウドの管理策に関する指針。適用宣言書では必要な管理策と適用の理由等を整理する。認証は一定の範囲の仕組みを評価するもので事故ゼロの保証ではない。"},{"heading":"事故に対応する組織","body":"SOC（セキュリティ運用センター）は監視・検知・分析、CSIRT（コンピュータセキュリティ事故対応チーム）は事故の受付、調査、調整、対応等、PSIRT（製品セキュリティ事故対応チーム）は製品の脆弱性や事故対応等を担う。トリアージは情報を整理し優先順位を決める。テイクダウンは不正サイト等の停止・削除を関係者と調整する活動。JPCERT/CCは事故対応調整や情報共有等、IPAは脆弱性情報の受付や対策情報等、JVNは脆弱性対策情報を提供する。J-CSIPはサイバー情報共有、J-CRATは標的型攻撃等への支援、ISACは業界等の情報共有・分析組織。"},{"heading":"基準を使い分ける","body":"PCI DSSはカード会員データ等の保護に関する業界基準、ISMAPは政府情報システムのためのクラウドサービスのセキュリティ評価制度。NIST CSF（サイバーセキュリティフレームワーク）は組織のリスク管理の枠組みで、現行2.0では統治・識別・防御・検知・対応・復旧の機能を持つ。サイバーセキュリティ経営ガイドラインは経営層の責任等を扱う。SECURITY ACTIONは中小企業等の自己宣言制度。基準、法令、認証、自己宣言は拘束力と確認方法が異なる。"}],"beginner":{"scenario":"組織の仕組みを評価するから順に、事故に対応する組織、基準を使い分けるを理解する。","trap":"決済カード業界のデータセキュリティ基準。","quizId":"U-11-Y06"}},{"id":"11-Z04","title":"セキュリティ規程・ISMS・継続運用","explain":"<p>ISMS（Information Security Management System：情報セキュリティ管理システム）は組織のリスクに応じ管理策を計画・運用・評価・改善する。方針は経営の方向、対策基準は守る条件、実施手順は担当者の具体的な作業を定める。適用範囲、責任者、例外承認、教育、見直しを明確化する。</p>","worked":"<p>退職日とアカウント無効化日時を突合し、例外を記録して是正する。</p>","prompt":"ISMSの要求事項に関する規格は？","answer":"<p>27001は情報セキュリティ管理システムの要求事項。</p>","beginner":{"scenario":"社内規程はあるが、退職者のアカウントが消されず放置されている。","trap":"認証取得だけでは管理策が常に有効だとはいえない。","quizId":"U-11-Z04"},"textbook":[{"heading":"基本原理","body":"ISMS（Information Security Management System：情報セキュリティ管理システム）は組織のリスクに応じ管理策を計画・運用・評価・改善する。方針は経営の方向、対策基準は守る条件、実施手順は担当者の具体的な作業を定める。適用範囲、責任者、例外承認、教育、見直しを明確化する。"},{"heading":"仕組み・判断","body":"ISO/IEC 27001はISMSの要求事項、27002は管理策の手引、27014は情報セキュリティガバナンス、27017はクラウド向け管理策の指針。組織的・人的・物理的・技術的管理策を選択し、適用宣言書に必要な管理策と適用理由等を記録する。"},{"heading":"応用と注意点","body":"サイバーハイジーンは更新、資産把握、不要アカウント削除、設定点検など基本的な衛生管理を継続する考え方。緊急時も連絡先、代替手段、復旧目標、バックアップの復元試験を準備する。監査と経営者レビューで運用の証拠を確認する。"}]},{"id":"11-X01","title":"セキュリティ管理と技術評価","explain":"<p>ISMS（情報セキュリティマネジメントシステム）は方針・リスク評価・対策・監視・改善を組織的に行う。リスクアセスメントは資産・脅威・脆弱性・影響・発生可能性を評価する。対応には回避・低減・移転（共有）・受容がある。残留リスクを確認して責任者が判断する。</p><p>CVSS（共通脆弱性評価システム）は脆弱性の深刻度を共通尺度で評価するが、組織固有の業務影響とは別。コモンクライテリア（ISO/IEC 15408）はIT製品のセキュリティ機能・保証を評価する枠組み。脆弱性診断とペネトレーションテストは目的や方法が異なる。ISMS認証は組織の管理の仕組みに対するもの。</p>","worked":"<p>公開サーバの脆弱性のCVSSが高くても、対策順位は外部到達性、資産重要度、悪用状況などと合わせて判断する。</p>","prompt":"CVSSの主目的は？","answer":"<p>脆弱性の深刻度を共通尺度で評価すること。</p>","beginner":{"scenario":"公開Webと隔離試験機に同じ脆弱性があっても外部到達性や業務影響が違うので対応順が異なる場合がある。","trap":"CVSSは脆弱性の深刻度で組織固有リスクそのものではない。","quizId":"U-11-X01"},"textbook":[{"heading":"セキュリティを組織で管理する","body":"ISMS（情報セキュリティマネジメントシステム）は方針、責任、リスク評価、対策、監視、継続改善を組織として運用する仕組みです。ISO/IEC 27001はその要求事項を定め、27002は管理策の指針を提供します。適用範囲を定め、資産・脅威・弱点を確認してリスク対応を選びます。"},{"heading":"脆弱性の深刻度と業務リスク","body":"CVSS（共通脆弱性評価システム）は悪用条件や影響などから脆弱性の深刻度を評価します。公開サーバの重大な脆弱性と隔離された試験機の同じ脆弱性では、実際の業務リスクや対処の優先度が異なり得ます。残留リスクは対策後も残るリスクで、責任者が受容または追加対応を判断します。"},{"heading":"評価と改善","body":"脆弱性診断は既知の弱点等を検出し、ペネトレーションテストは許可された範囲で攻撃者の観点から実際に弱点を検証します。コモンクライテリア（ISO/IEC 15408）はIT製品のセキュリティ機能と保証を評価する枠組みです。ISMS認証は組織の管理の仕組みを評価し、個々の製品の完全な安全を保証するものではありません。"}]},{"id":"11-Y07","title":"脆弱性識別・製品の評価と認証","explain":"<p>CVE（共通脆弱性識別子）は個々の公開された脆弱性の識別番号、CWE（共通脆弱性タイプ）は弱点の種類の分類、CVSS（共通脆弱性評価システム）は脆弱性の深刻度を共通尺度で評価する枠組み。例えば特定製品の不具合にCVE番号が付与され、原因となる弱点の型がCWEに関連付けられ、CVSSで深刻度を評価する。CVSSの点数だけで自社の優先順位は決まらず、公開範囲、悪用状況、事業影響、対策可能性を考慮する。</p>","worked":"<p><b>CVSSが高い脆弱性が隔離した試験機に、やや低い脆弱性が公開サーバにある。</b></p><p>点数のみで決めず、露出、悪用状況、事業影響を評価し対応の順序を決める。</p>","prompt":"CVEとCWEは何が異なるか。","answer":"<p>CVEは個々の脆弱性の識別子、CWEは弱点の種類の分類。</p>","textbook":[{"heading":"脆弱性を区別する","body":"CVE（共通脆弱性識別子）は個々の公開された脆弱性の識別番号、CWE（共通脆弱性タイプ）は弱点の種類の分類、CVSS（共通脆弱性評価システム）は脆弱性の深刻度を共通尺度で評価する枠組み。例えば特定製品の不具合にCVE番号が付与され、原因となる弱点の型がCWEに関連付けられ、CVSSで深刻度を評価する。CVSSの点数だけで自社の優先順位は決まらず、公開範囲、悪用状況、事業影響、対策可能性を考慮する。"},{"heading":"製品を評価する","body":"CC（コモンクライテリア、ISO/IEC 15408）はIT製品等のセキュリティ機能と保証を評価するための基準。PP（プロテクションプロファイル）は製品種別のセキュリティ要求を示す文書、ST（セキュリティターゲット）は評価対象の具体的な要求等を記述する。EAL（評価保証レベル）は評価の厳密さ等に関わる保証要求のまとまりで、値が高いからあらゆる攻撃に強いという意味ではない。CEM（共通評価方法、ISO/IEC 18045）は評価方法を定める。JISECは日本のITセキュリティ評価・認証制度。JCMVPは暗号モジュールの試験・認証制度。"},{"heading":"診断の目的を決める","body":"脆弱性診断は設定やコード等の弱点を調べ、ペネトレーションテストは許可範囲内で実際に弱点が悪用され得るか確認する。脆弱性報奨金制度は定められた範囲の報告を受け付ける。耐タンパ性は機器や情報への物理的な解析・改変等への耐性。調達ではセキュリティ機能、評価対象・版、保証範囲、運用条件を確認する。"}],"beginner":{"scenario":"脆弱性を区別するから順に、製品を評価する、診断の目的を決めるを理解する。","trap":"Evaluation Assurance Level（評価保証レベル）。","quizId":"U-11-Y07"}},{"id":"11-Z05","title":"セキュリティ技術評価・認証・脆弱性の識別","explain":"<p>CVE（Common Vulnerabilities and Exposures：共通脆弱性識別子）は個別の脆弱性を識別する番号、CWE（Common Weakness Enumeration：共通脆弱性タイプ）は弱点の種類の分類、CVSS（Common Vulnerability Scoring System：共通脆弱性評価システム）は深刻度を評価する枠組み。</p>","worked":"<p>同じCVSSでも外部公開された重要サーバの脆弱性を優先する場合がある。</p>","prompt":"個別脆弱性の識別番号に相当するのは？","answer":"<p>CVEは個々の脆弱性を識別する。</p>","beginner":{"scenario":"複数の製品に脆弱性情報が出た。どの対策から行うべきか判断する。","trap":"EALが高いことはあらゆる攻撃に対し安全である保証ではない。","quizId":"U-11-Z05"},"textbook":[{"heading":"基本原理","body":"CVE（Common Vulnerabilities and Exposures：共通脆弱性識別子）は個別の脆弱性を識別する番号、CWE（Common Weakness Enumeration：共通脆弱性タイプ）は弱点の種類の分類、CVSS（Common Vulnerability Scoring System：共通脆弱性評価システム）は深刻度を評価する枠組み。"},{"heading":"仕組み・判断","body":"CVSSは技術的な深刻度を示すが、組織の優先度は資産重要度、実際の悪用状況、公開範囲、代替策なども含めて決める。脆弱性診断は弱点の発見、ペネトレーションテストは許可された範囲で実際の影響や防御の有効性を確認する。"},{"heading":"応用と注意点","body":"ISO/IEC 15408（Common Criteria：コモンクライテリア）はIT製品等のセキュリティ評価基準、ISO/IEC 18045は共通評価方法。PP（Protection Profile：プロテクションプロファイル）は製品種類の要求を定義し、EAL（Evaluation Assurance Level：評価保証レベル）は評価の厳密さの尺度。JISECはITセキュリティ評価・認証制度、JCMVPは暗号モジュール試験・認証制度。"}]},{"id":"11-2","title":"暗号・ハッシュ・署名・公開鍵基盤","explain":"<p>共通鍵暗号は同じ秘密鍵で暗号化と復号を行い、大量データの高速処理に適する。公開鍵暗号は公開鍵・秘密鍵の対を使い、鍵配送や電子署名の仕組みに用いる。実用的なTLSは公開鍵技術で認証や鍵共有を行い、データ通信は共通鍵で暗号化するなどの組合せを使う。鍵管理が不適切なら暗号方式だけ強くしても安全にならない。</p>\n<p>ハッシュ関数は任意長データから固定長のダイジェストを求める一方向の関数。暗号学的ハッシュに求められる耐衝突性は「異なる入力で同じ値を作りにくい」性質。パスワード保管には単純ハッシュではなく、ソルトと計算コストを設けたArgon2等のパスワードハッシュ方式を使う。電子署名は秘密鍵で署名し、公開鍵で検証することで作成者認証や改ざん検出を助ける。公開鍵証明書はCA（Certification Authority：認証局）が公開鍵と主体情報の結び付きを保証する仕組み。</p>\n","worked":"<p>AからBへ機密情報を送るとき、受信者Bの公開鍵で暗号化すれば対応するBの秘密鍵で復号できる。Aの「署名」はAの秘密鍵で行い、Aの公開鍵で検証する。暗号化と署名で鍵の向きが異なる。</p>\n","prompt":"SHA-256をパスワードに1回かけて保存すれば安全か。","answer":"<p>不十分。パスワード推測への耐性を高める専用のパスワードハッシュ方式やソルトが必要。</p>\n","beginner":{"scenario":"Bへの秘密文書はBの公開鍵で暗号化しBの秘密鍵で復号する方式を使える。Aの署名はAの秘密鍵で作りAの公開鍵で検証する。","trap":"暗号化と署名では目的と鍵の使い方が違う。","quizId":"U-11-2","lab":{"title":"暗号化と署名の鍵を混同しない","problem":"AがBに秘密文書を送り、Bが送信者Aと改ざんの有無を確認したい。どの鍵を使うか。","steps":["Aは文書に対し自分の秘密鍵でデジタル署名を生成する。","文書と署名を秘密にするため、Bの公開鍵を使う暗号化方式などで保護する。実際には共通鍵と組み合わせる方式が多い。","Bは自分の秘密鍵で復号に必要な情報を取得し文書を復号する。","BはAの公開鍵で署名を検証する。証明書などで公開鍵がAのものか確認する。"],"answer":"暗号化は受信者Bの公開鍵系、署名は送信者Aの秘密鍵","check":"署名と暗号化の目的・鍵を別々に追う。具体的な鍵利用は方式によって異なる。"}},"textbook":[{"heading":"暗号技術は何を守るのか","body":"情報を送るときに、第三者に内容を読まれないこと（機密性）、途中で変えられていないこと（完全性）、相手やデータの出所を確かめること（真正性）は異なる目的です。一つの暗号技術だけで全てを満たすとは限りません。まず目的を分けると鍵の使い方を間違えなくなります。"},{"heading":"共通鍵暗号と鍵配布の問題","body":"共通鍵暗号は暗号化と復号に同じ秘密鍵を使います。AES（Advanced Encryption Standard: 高度暗号化標準）が代表例です。大量のデータを効率よく暗号化できますが、相手と同じ鍵を秘密に共有する必要があります。鍵が漏れれば第三者にも復号され得ます。"},{"heading":"公開鍵技術で信頼を確立する","body":"公開鍵と秘密鍵は対応する鍵の組です。公開鍵は公開でき、秘密鍵は所有者だけが保持します。公開鍵暗号では受信者の公開鍵を使って暗号化し、受信者の秘密鍵で復号する方式があります。鍵交換では双方が共有秘密を確立する方式もあります。公開鍵技術と共通鍵暗号を組み合わせると、鍵確立と大量データ処理の役割を分担できます。"},{"heading":"ハッシュは暗号化と異なる","body":"暗号学的ハッシュ関数は任意長の入力から固定長の値を作ります。元データを復元する機能はなく、入力を少し変えると出力は大きく変わるよう設計されます。異なる入力が同じ値になる衝突は理論上存在しますが、実用上容易に見つからない性質が重要です。データとハッシュ値を両方置換できる攻撃者には単独では不十分です。"},{"heading":"署名とMAC：誰が作ったか","body":"デジタル署名は署名者の秘密鍵で生成し、対応する公開鍵で検証します。典型的にはメッセージのハッシュ値に基づいて署名を作ります。改ざんと署名鍵の所有者との対応を検証しますが、内容は秘匿しません。MAC（Message Authentication Code: メッセージ認証コード）は共有秘密鍵で生成・検証するため、鍵を共有する当事者のどちらが作ったかを第三者に区別させる用途には適しません。"},{"heading":"PKI：公開鍵は本物か","body":"攻撃者が自分の公開鍵を受信者の鍵だと偽れば、公開鍵暗号だけでは安全になりません。PKI（Public Key Infrastructure: 公開鍵基盤）では認証局が主体と公開鍵を結び付けた証明書を発行し、検証者は信頼できる認証局までの署名連鎖、対象名、有効期限、必要に応じて失効状態を確認します。証明書による認証と通信内容の暗号化は別の役割です。"}],"walkthrough":{"heading":"暗号・署名・ハッシュを使い分ける","body":"AがBに文書を送るとき、盗み見を防ぐには暗号化します。Bだけが復号できる仕組みとしてBの公開鍵を用いる暗号方式があります。Aが作ったことを確認したい場合はAの秘密鍵でデジタル署名を作り、BがAの公開鍵で検証します。単なるハッシュ値を添付すると途中の偶発的な変化は検出できますが、攻撃者が文書もハッシュ値も変更できる場合は不十分です。共通の秘密鍵を共有するならMAC（メッセージ認証コード）を用いて改ざんと認証を確認できます。ただし両者が同じ鍵を持つので、第三者に対する署名者の区別という点でデジタル署名と違います。","cols":["目的","技術","鍵"],"rows":[["秘密にする","共通鍵暗号","共有秘密鍵"],["秘密にする","公開鍵暗号の例","受信者の公開鍵・秘密鍵"],["送信者と改ざんを検証","デジタル署名","署名者の秘密鍵・公開鍵"],["共有鍵で改ざんと認証を確認","MAC","共有秘密鍵"],["データの要約","ハッシュ","通常は鍵なし"]]},"pedagogyReviewed":true},{"id":"11-Y03","title":"暗号方式・鍵交換・ハッシュの安全性","explain":"<p>ブロック暗号は固定長のブロックに対する変換を行う。AES（高度暗号化標準）は128ビットブロックを扱う共通鍵暗号。CBCモードは前の暗号文ブロック等を利用して連鎖させ、CTRモードはカウンタ等を暗号化した値と平文を組み合わせる。同一鍵での初期化値等の扱いは方式の仕様に従い、CTRでは同じ鍵とノンスの再利用を避ける。ストリーム暗号は鍵ストリームとデータを組み合わせる。暗号化だけでは改ざん検出を保証しないため認証付き暗号等を用いる。</p>","worked":"<p><b>暗号文を第三者が変更していないことも確認したい。</b></p><p>認証付き暗号や適切なメッセージ認証等を使用し、鍵・初期化値も仕様に沿って管理する。</p>","prompt":"DH鍵共有だけでは何が保証されないか。","answer":"<p>通信相手の真正性。認証なしでは中間者攻撃等への対策が不足する。</p>","textbook":[{"heading":"共通鍵でどのように暗号化するか","body":"ブロック暗号は固定長のブロックに対する変換を行う。AES（高度暗号化標準）は128ビットブロックを扱う共通鍵暗号。CBCモードは前の暗号文ブロック等を利用して連鎖させ、CTRモードはカウンタ等を暗号化した値と平文を組み合わせる。同一鍵での初期化値等の扱いは方式の仕様に従い、CTRでは同じ鍵とノンスの再利用を避ける。ストリーム暗号は鍵ストリームとデータを組み合わせる。暗号化だけでは改ざん検出を保証しないため認証付き暗号等を用いる。"},{"heading":"鍵を共有する","body":"Diffie-Hellman（DH）鍵共有は公開情報を交換し共通の秘密を得る方式。単独では相手の本人性を確認できないので署名等による認証と組み合わせる。公開鍵方式と高速な共通鍵方式を組み合わせるハイブリッド暗号は、通信やファイル保護に使われる。RSAは整数の素因数分解の困難性に関連し、楕円曲線暗号は楕円曲線上の離散対数問題の困難性等に基づく。鍵の生成、配布、保管、更新、失効、廃棄を管理する。危殆化は暗号の安全性や鍵の秘密性が失われること。CRYPTREC暗号リストは電子政府等で用いる暗号技術の評価・選定を支援する。"},{"heading":"ハッシュと証明","body":"SHA-256は256ビットのハッシュ値を出力するSHA-2系列、SHA-3は異なる構造のハッシュ規格。原像発見困難性はハッシュ値から対応入力を求めにくいこと、第二原像発見困難性は特定入力と同じ値の別入力を探しにくいこと、衝突発見困難性は同じ値となる任意の二入力を探しにくいこと。HMACはハッシュと共通鍵を利用するメッセージ認証方式。ゼロ知識証明は秘密そのものを明かさず知識等を証明する考え方、秘密計算は秘密を保護したまま計算する技術群。"}],"beginner":{"scenario":"共通鍵でどのように暗号化するかから順に、鍵を共有する、ハッシュと証明を理解する。","trap":"衝突は任意の異なる二入力のハッシュ値が等しいこと。","quizId":"U-11-Y03"}},{"id":"11-3","title":"認証・認可・アクセス制御","explain":"<p>認証（Authentication）は「誰か」の確認、認可（Authorization）は「何をしてよいか」の判断。多要素認証MFA（Multi-Factor Authentication）は知識要素（パスワード）・所持要素（端末・鍵）・生体要素（指紋等）の異なる要素を組み合わせる。同じ種類のパスワードを2つ要求しても多要素にはならない。SSO（Single Sign-On：一度の認証で複数システムを利用）は利便性を高めるが、認証基盤の保護が重要。</p>\n<p>アクセス制御はDAC（任意アクセス制御）、MAC（強制アクセス制御）、RBAC（Role-Based Access Control：役割ベース制御）など。最小権限は業務に必要な権限のみ付与する原則。ゼロトラストはネットワーク内だから信頼するのではなく、継続的に認証・端末状態・アクセス状況を評価する設計思想。認証済みでもすべての資源への権限を与えない。</p>\n","worked":"<p>経理担当に請求書の閲覧は許可し、承認は責任者に限定する。ユーザーごとに例外を大量設定するより、RBACで役割に権限を紐付けると管理しやすい。</p>\n","prompt":"パスワード＋秘密の質問は必ずMFAか。","answer":"<p>どちらも知識要素なので、異なる要素を組み合わせたとはいえない。</p>\n","beginner":{"scenario":"社員IDで本人確認し、給与担当者だけ給与データを更新できるようにする。異動時は旧権限を外し新業務の権限だけを与える。","trap":"パスワードと秘密の質問は両方知識要素。異なる種類の要素を使う。","quizId":"U-11-3"},"textbook":[{"heading":"認証と認可の違い","body":"認証は誰かを確かめ、認可はその人が何をしてよいかを判定します。社員が正しくログインしても、人事データを読む権限がなければアクセスを拒否します。本人確認には知識（パスワード）、所持（認証器）、生体（指紋等）などの要素を用い、異なる種類を組み合わせるのが多要素認証です。"},{"heading":"権限を管理する","body":"最小権限は業務に必要な最小限の権限だけを付与する考え方です。RBAC（役割に基づくアクセス制御）は職務などの役割へ権限を割り当てます。アクセス制御リストは資源ごとに誰がどの操作をできるか管理します。異動・退職時は不要な権限を解除し、定期的な棚卸しで過剰権限を確認します。"},{"heading":"認証の連携","body":"SSO（シングルサインオン）は一度の認証で複数サービスを利用しやすくする仕組みです。SAMLは認証情報等の連携に用いる標準、OAuth 2.0は第三者アプリへの権限委譲の枠組み、OpenID ConnectはOAuth 2.0の上で認証を行う仕組みです。SSOが侵害されると影響が広がり得るので多要素認証や監視が重要です。"}]},{"id":"11-Y04","title":"本人確認・認証連携・証明書","explain":"<p>チャレンジレスポンス認証は検証側が毎回変わる課題を送り、利用者側が秘密等を用いた応答を返す。ワンタイムパスワードは一回または短時間だけ有効。Kerberosは信頼する認証サーバが発行するチケット等でサービス認証を行い、時刻の管理も重要。パスワードレス認証のFIDO2/WebAuthn等は公開鍵方式で認証器が署名を作り、サービス側は公開鍵で検証する。認証器の秘密鍵をサービスへ送らない。多段階認証は段階数、多要素認証は知識・所持・生体など異なる要素の組合せに注目する。</p>","worked":"<p><b>本人1000回の試行中20回拒否、他人2000回の試行中2回受入れ。</b></p><p>FRR＝20/1000＝2%、FAR＝2/2000＝0.1%。</p>","prompt":"FARを低くするよう判定を厳しくすると、通常FRRはどうなるか。","answer":"<p>上昇する傾向があり、セキュリティと利便性の調整が必要。</p>","textbook":[{"heading":"秘密を送らず確認する","body":"チャレンジレスポンス認証は検証側が毎回変わる課題を送り、利用者側が秘密等を用いた応答を返す。ワンタイムパスワードは一回または短時間だけ有効。Kerberosは信頼する認証サーバが発行するチケット等でサービス認証を行い、時刻の管理も重要。パスワードレス認証のFIDO2/WebAuthn等は公開鍵方式で認証器が署名を作り、サービス側は公開鍵で検証する。認証器の秘密鍵をサービスへ送らない。多段階認証は段階数、多要素認証は知識・所持・生体など異なる要素の組合せに注目する。"},{"heading":"生体認証の誤りを測る","body":"指紋、静脈、虹彩、顔、網膜は身体的特徴、声紋や署名の動きなどは行動的特徴も利用する。FAR（他人受入率）は他人を本人として受入れる割合、FRR（本人拒否率）は本人を拒否する割合。一般に判定基準を厳しくするとFARは低くなりFRRは高くなる傾向。生体情報は容易に変更できないため、保存方法、なりすまし対策、代替手段も必要。CAPTCHAは人と自動プログラムの識別を補助する。"},{"heading":"証明書と信頼連鎖","body":"認証局CAは公開鍵と主体を結び付ける証明書を発行する。端末は信頼するルート証明書をトラストアンカーとして中間CA、サーバ証明書等の署名を検証する。CRL（証明書失効リスト）は失効情報の一覧、OCSPは個別の証明書の状態を問合せる規約。タイムスタンプは特定時点の存在等の証明、コードサイニングはプログラムの発行元と完全性の検証を支援する。IdP（アイデンティティ提供者）は認証情報を提供し、IDaaSはクラウド等でID管理・認証機能を提供するサービス。3Dセキュアはオンラインカード決済で追加認証等を行う仕組み。"},{"heading":"署名用証明書と失効情報","body":"コードサイニング証明書はソフトウェア発行者の公開鍵と主体を結び付け、署名を検証するために使う。サーバ証明書は通信相手のサーバを認証する。CRL（Certificate Revocation List：証明書失効リスト）は有効期間内に失効した証明書のシリアル番号等を認証局が署名して公開する。OCSP（オンライン証明書状態プロトコル）は証明書の状態を問い合わせる方式。"}],"beginner":{"scenario":"秘密を送らず確認するから順に、生体認証の誤りを測る、証明書と信頼連鎖を理解する。","trap":"Online Certificate Status Protocol（オンライン証明書状態確認プロトコル）。","quizId":"U-11-Y04"}},{"id":"11-X02","title":"暗号・認証実装・防御機器","explain":"<p>AESは共通鍵暗号、RSAや楕円曲線暗号は公開鍵暗号の代表例。ハッシュはデータの要約値を生成し、署名の検証や完全性確認に使う。MAC（メッセージ認証コード）は共有鍵で完全性・認証を確認する。PKI（公開鍵基盤）では認証局の証明書を検証し公開鍵と主体を結び付ける。失効情報も確認する。</p><p>IDS（侵入検知システム）は異常を検知し、IPS（侵入防止システム）は遮断も行う。WAFはWebアプリへの攻撃を防御する。EDRは端末上の不審活動を監視し対応を支援する。認証においてパスワードだけでなく異なる要素を組み合わせる多要素認証、SSO（シングルサインオン）、アクセス権管理、ログ監視を適切に組み合わせる。</p>","worked":"<p>認証局が発行した証明書でも有効期限・対象ホスト名・信頼連鎖などの確認が必要。暗号化だけでは相手が正規のサービスか保証しない。</p>","prompt":"WebアプリのHTTP要求を検査して攻撃を抑える装置は？","answer":"<p>WAF（Webアプリケーションファイアウォール）。</p>","beginner":{"scenario":"通信保護にはTLS、公開鍵の所有者確認には証明書、Web要求検査にはWAF、端末監視にはEDRを組み合わせる。","trap":"ハッシュ値だけでは本文とハッシュの両方を改変されると真正性を保証できない。","quizId":"U-11-X02"},"textbook":[{"heading":"通信路を保護する実装","body":"TLSはサーバ証明書の検証や鍵交換などで安全な通信路を確立し、共通鍵を用いてデータの機密性・完全性等を保護します。証明書の検証を無効にすると偽サーバを識別できなくなる恐れがあります。暗号化された通信でも接続先の正当性確認、端末やサーバの管理が必要です。"},{"heading":"認証器とセッション","body":"パスワードの使い回しは流出時の影響を広げます。多要素認証やフィッシング耐性を持つ認証方式などを採用し、セッションIDは推測困難な値にして保護し、ログアウトや期限切れで無効化します。CookieのSecure・HttpOnly・SameSiteなどの属性は用途に応じて設定します。"},{"heading":"多層防御とゼロトラスト","body":"ネットワーク内にいるから信頼するのではなく、利用者・端末・要求ごとに必要な権限や状態を確認するゼロトラストの考え方があります。ネットワーク分割、WAF、端末監視、最小権限、ログ、バックアップを組み合わせ、単独対策が破られても影響を限定します。暗号の選択は標準・鍵管理・更新手順を含めて考えます。"}]},{"id":"11-Y09","title":"メール・無線・ネットワークの認証実装","explain":"<p>SPF（送信元ポリシーフレームワーク）はメール送信に使用したIPが対象ドメインの許可するものか確認する。DKIM（ドメイン鍵識別メール）は署名を検証し送信ドメイン等との関係と改ざんの有無を確認する。DMARC（ドメインベースのメッセージ認証・報告・適合）は表示上のFromドメインとSPFまたはDKIMで認証されたドメインの整合性等を確認し、失敗時の方針や報告を提供する。SMTP-AUTHはメール送信時の利用者認証、OP25Bは利用者側ネットワークから外部の25番ポートへの直接送信を制限する迷惑メール対策。S/MIMEとPGPはメール内容の暗号化・署名等に利用する。</p>","worked":"<p><b>攻撃者が正規組織を表示Fromに偽装したメールを送った。</b></p><p>SPF・DKIMに加えDMARCのドメイン整合性とポリシーで検証する。ただし全ての詐欺を防ぐわけではない。</p>","prompt":"DNSSECは名前解決の問い合わせ内容を秘密にするものか。","answer":"<p>いいえ。署名で応答データの出所と完全性を検証する。</p>","textbook":[{"heading":"送信元を検証する","body":"SPF（送信元ポリシーフレームワーク）はメール送信に使用したIPが対象ドメインの許可するものか確認する。DKIM（ドメイン鍵識別メール）は署名を検証し送信ドメイン等との関係と改ざんの有無を確認する。DMARC（ドメインベースのメッセージ認証・報告・適合）は表示上のFromドメインとSPFまたはDKIMで認証されたドメインの整合性等を確認し、失敗時の方針や報告を提供する。SMTP-AUTHはメール送信時の利用者認証、OP25Bは利用者側ネットワークから外部の25番ポートへの直接送信を制限する迷惑メール対策。S/MIMEとPGPはメール内容の暗号化・署名等に利用する。"},{"heading":"ネットワークへの接続を認証する","body":"IEEE 802.1Xは端末（サプリカント）、スイッチ等（認証装置）、認証サーバを用いたポートベース認証の規格。EAP（拡張認証プロトコル）は認証方式を運ぶ枠組み、EAP-TLSは証明書を用いる方式、PEAPはTLSトンネル内で認証を行う方式。RADIUSはネットワーク接続の認証・認可・利用記録等を扱うプロトコル、Diameterは関連する後継的規約。WPA2/WPA3は無線LANの保護方式で、個人向けWPA3ではSAEによる認証・鍵確立を利用する。Enhanced Openは認証なしの無線接続の暗号化を提供するが相手の真正性を保証しない。"},{"heading":"通信を分けて検査する","body":"パケットフィルタはアドレス・ポート等で許可を決め、ステートフル方式は接続状態も利用する。アプリケーションゲートウェイはアプリ層を中継・検査する。DMZ（非武装地帯）は外部公開サーバ等を内部網と分離する領域。認証VLANは認証結果に応じ論理網を割り当てる。ハニーポットはおとり環境で不審な活動の観測等に用いる。DNSSECはDNS応答の出所と完全性を検証する署名技術で、DNS通信内容の暗号化ではない。MACアドレスフィルタのみで強い本人確認はできない。"},{"heading":"メール認証方式の比較","body":"DKIM（DomainKeys Identified Mail：ドメイン鍵によるメール認証）は送信側が署名し受信側がDNS上の公開鍵で検証する。SPF（Sender Policy Framework：送信元認証）は送信元IPが送信ドメインの許可リストに合うか確認。DMARCはFromドメインとの整合性と処理方針・報告を扱う。S/MIMEは利用者間の署名・暗号化、OP25Bは未承認の外向きSMTP通信制限。"}],"beginner":{"scenario":"送信元を検証するから順に、ネットワークへの接続を認証する、通信を分けて検査するを理解する。","trap":"SPF/DKIMの認証結果と表示Fromのドメイン整合性等を評価する。","quizId":"U-11-Y09"}},{"id":"11-4","title":"代表的な攻撃・Web脆弱性","explain":"<p>SQLインジェクションは利用者入力をSQL文の構文として解釈させ、不正な問合せを実行させる攻撃。対策の基本はプレースホルダを用いたパラメータ化クエリ。XSS（Cross-Site Scripting：クロスサイトスクリプティング）は利用者ブラウザで意図しないスクリプトを実行させる攻撃で、文脈に応じた出力エスケープや安全なDOM操作を用いる。CSRF（Cross-Site Request Forgery：クロスサイトリクエストフォージェリ）はログイン状態を悪用して意図しない操作を送信させるため、トークンやSameSite Cookieなどで対処する。</p>\n<p>標的型メール・フィッシングは認証情報を盗み、ランサムウェアは暗号化・窃取・恐喝を行うことがある。サプライチェーン攻撃は正規の依存先・更新経路を悪用する。DoS/DDoSは資源を過負荷にして可用性を損なう。WAF（Web Application Firewall：Webアプリ防御）やIDS/IPS（侵入検知/侵入防止）は補助策であり、根本的な脆弱性修正を代替しない。</p>\n","worked":"<p>Webアプリが<code>SELECT * FROM user WHERE name='入力値'</code>の文字連結でクエリを生成すると、特殊文字を含む入力で構文が変わり得る。パラメータ化すれば入力は値として処理され、SQL命令として解釈されにくくなる。</p>\n","prompt":"全てのXSSを防ぐのに入力の`<`だけ削除すれば十分か。","answer":"<p>不十分。HTML・属性・URL・JavaScriptなど出力文脈に応じた適切な処理が必要。</p>\n","beginner":{"scenario":"入力をSQL文に直接連結すると入力が命令の一部として解釈され得る。プレースホルダで命令と値を分ける。画面出力は文脈に合うエスケープを使う。","trap":"SQLインジェクション、XSS、CSRFは原因・対策が異なる。","quizId":"U-11-4"},"textbook":[{"heading":"攻撃を原因別に理解する","body":"マルウェアは悪意のあるソフトウェアの総称で、ランサムウェアはデータ暗号化や窃取等による脅迫を行います。フィッシングは偽のメール・サイトなどで認証情報をだまし取る手法、総当たり攻撃は多数の候補を試し、パスワードリスト攻撃は流出済み認証情報の使い回しを狙います。教育、多要素認証、更新、アクセス制限等を組み合わせます。"},{"heading":"Webアプリの代表的脆弱性","body":"SQLインジェクションは入力がSQL命令として解釈される問題で、プレースホルダによる命令と値の分離が基本対策です。XSS（クロスサイトスクリプティング）は入力などがブラウザで意図しないスクリプトとして解釈される問題で、出力先に応じたエスケープ等を行います。CSRF（クロスサイトリクエストフォージェリ）は認証済み利用者のブラウザに意図しない要求を送らせる問題で、トークン検証やCookieの適切な設定等を用います。"},{"heading":"他の攻撃との比較","body":"DoSはサービスの利用を妨げ、DDoSは多数の発信元を利用する分散型です。サプライチェーン攻撃は委託先やソフトウェア供給経路の侵害を通じ影響を及ぼします。ゼロデイ攻撃は修正手段が十分普及していない脆弱性を狙うものなどを指します。パッチ適用だけでなくネットワーク分離、権限管理、監視、バックアップを組み合わせます。"}],"walkthrough":{"heading":"攻撃の原因と対策を対応させる","body":"問題文に「入力値がデータベースの命令として解釈された」とあればSQLインジェクションを考えます。「閲覧者のブラウザで意図しないスクリプトが実行された」ならXSSです。「ログイン済み利用者が知らないうちに操作要求を送った」ならCSRFを考えます。対策が違うのは、悪意ある情報が解釈される場所と、攻撃が成立する条件が違うからです。SQLでは命令と値を分離、XSSでは出力の文脈に合ったエスケープ等、CSRFでは意図しない要求を検証します。すべての問題を入力検証だけで解決できると考えず、原因に直接対応する対策を選びます。","cols":["攻撃","問題が起こる場所","基本対策"],"rows":[["SQLインジェクション","DBの問い合わせ処理","パラメータ化"],["XSS","利用者のブラウザ","文脈に合う出力エスケープ等"],["CSRF","認証済みの要求","トークン検証等"],["パスワードリスト攻撃","認証機能","使い回し防止・多要素認証"]]}},{"id":"11-Y01","title":"マルウェア・内部不正・攻撃の分類","explain":"<p>ウイルスは他のファイル等に寄生して増殖するもの、ワームはネットワーク等で自己拡散するもの、トロイの木馬は正規ソフトのように見せかける不正プログラム。ボットは外部から制御される端末等、ボットネットはその集団、C&amp;Cサーバは指令や通信を行う基盤。RAT（遠隔操作型トロイの木馬）、スパイウェア、キーロガーは遠隔操作や情報収集等に使われ得る。ルートキットは不正活動の隠蔽等、バックドアは正規手続を経ずアクセスする経路。ファイルレスマルウェアはメモリや既存機能を悪用するなど実行ファイルだけの検査で発見しにくい場合がある。</p>","worked":"<p><b>取引先から振込先変更を求めるメールが届いた。</b></p><p>既知の電話番号など別の信頼できる経路で確認し、複数人の承認手順を適用する。</p>","prompt":"不正のトライアングルの機会を減らす対策を一つ挙げよ。","answer":"<p>申請者と承認者を分ける職務分掌など。</p>","textbook":[{"heading":"被害の原因を理解する","body":"ウイルスは他のファイル等に寄生して増殖するもの、ワームはネットワーク等で自己拡散するもの、トロイの木馬は正規ソフトのように見せかける不正プログラム。ボットは外部から制御される端末等、ボットネットはその集団、C&Cサーバは指令や通信を行う基盤。RAT（遠隔操作型トロイの木馬）、スパイウェア、キーロガーは遠隔操作や情報収集等に使われ得る。ルートキットは不正活動の隠蔽等、バックドアは正規手続を経ずアクセスする経路。ファイルレスマルウェアはメモリや既存機能を悪用するなど実行ファイルだけの検査で発見しにくい場合がある。"},{"heading":"人と組織に起因する被害","body":"BEC（ビジネスメール詐欺）は取引先や経営者を装い送金などを誘導する。スミッシングはSMSを用いたフィッシング。ソーシャルエンジニアリングは人の心理や行動を悪用する。内部不正のトライアングルは機会、動機、正当化の三要素。職務分掌、権限最小化、相談・通報の仕組み、ログ監査を組み合わせる。シャドーITは組織が把握・承認していないIT利用で、データ管理等にリスクがある。"},{"heading":"異なる攻撃の目的","body":"ランサムウェアはデータ暗号化や窃取などで脅迫し、二重脅迫は暗号化に加え公開等を脅す。RaaSはランサムウェアをサービスとして提供する犯罪モデル。APT（持続的標的型脅威）は特定組織等を長期間狙う活動を指し、ラテラルムーブメントは侵入後の内部での移動。水飲み場型攻撃は標的が利用するサイト等を悪用する。サイドチャネル攻撃は時間・電力等の副次情報を利用する。脅威モデリングで資産・信頼境界・想定脅威を整理し、設計段階から対策する。"},{"heading":"サイバーキルチェーンとサイドチャネル","body":"サイバーキルチェーンは偵察、準備、配送、エクスプロイト（脆弱性の悪用）、インストール、指令通信、目的実行といった段階で攻撃を捉え、防御の機会を整理するモデル。サイドチャネル攻撃は処理時間・消費電力・電磁波など実装から漏れる副次的情報を利用する。暗号の数学的強度だけでなく実装の漏えい対策も必要。"}],"beginner":{"scenario":"被害の原因を理解するから順に、人と組織に起因する被害、異なる攻撃の目的を理解する。","trap":"不正が生じる要因を理解し機会等を減らす。","quizId":"U-11-Y01"}},{"id":"11-Y02","title":"認証・Web・通信・AIへの脅威","explain":"<p>辞書攻撃はよく使われる語等の候補、総当たりは多数の組合せ、リバースブルートフォースは一つのパスワードを多数のアカウントに試す攻撃。レインボーテーブルは事前計算したハッシュの対応を利用する。流出済み認証情報の使い回しを狙うのはパスワードリスト攻撃。専用パスワードハッシュとソルト、試行制限、多要素認証、使い回し防止を組み合わせる。クリックジャッキングは意図しない画面操作を誘導する攻撃で、フレーム埋込み制限等が対策。ディレクトリトラバーサルは意図しないファイル参照、OSコマンドインジェクションは入力がOS命令として解釈される問題。入力を命令と分離し権限を限定する。</p>","worked":"<p><b>メールで届いたリンクから偽のログイン画面へ誘導された。</b></p><p>フィッシングの例。既知の公式経路へ直接アクセスし、組織へ報告する。</p>","prompt":"使い回した漏えいパスワードを悪用する攻撃は？","answer":"<p>パスワードリスト攻撃。サービスごとに異なるパスワードと多要素認証が対策になる。</p>","textbook":[{"heading":"攻撃と対策を対応付ける","body":"辞書攻撃はよく使われる語等の候補、総当たりは多数の組合せ、リバースブルートフォースは一つのパスワードを多数のアカウントに試す攻撃。レインボーテーブルは事前計算したハッシュの対応を利用する。流出済み認証情報の使い回しを狙うのはパスワードリスト攻撃。専用パスワードハッシュとソルト、試行制限、多要素認証、使い回し防止を組み合わせる。クリックジャッキングは意図しない画面操作を誘導する攻撃で、フレーム埋込み制限等が対策。ディレクトリトラバーサルは意図しないファイル参照、OSコマンドインジェクションは入力がOS命令として解釈される問題。入力を命令と分離し権限を限定する。"},{"heading":"通信経路の脅威","body":"中間者攻撃は通信相手の間に介在して盗聴・改ざん等を行う。MITB（ブラウザ内の中間者攻撃）は端末のブラウザ内で処理を改変するため通信路暗号だけでは不十分。IPスプーフィングは送信元IPを偽装、DNSキャッシュポイズニングは名前解決情報を不正に変える。セッションハイジャックはセッション情報を悪用、リプレイ攻撃は過去の正当な通信を再利用する。リフレクション攻撃は他サーバの応答を標的へ集中させるサービス妨害等。暗号化、認証、使い捨て値、通信制御、監視を目的別に用いる。"},{"heading":"AIに関わる脅威","body":"ディープフェイクは生成・改変された音声や映像で、本人確認には別経路での確認等が重要。敵対的サンプルはモデルの誤判断を誘う入力、データ汚染は学習データ等に悪影響を与える。プロンプトインジェクションはモデルが処理する指示・外部情報により意図しない動作を誘う問題。AIの出力を直接権限のある操作へ接続せず、入力・出力の検証、権限の制限、人の承認等を組み合わせる。AIを利用した検知技術とAIそのものを守る技術を区別する。"}],"beginner":{"scenario":"攻撃と対策を対応付けるから順に、通信経路の脅威、AIに関わる脅威を理解する。","trap":"同じ認証要求が再利用されないよう鮮度を確認する。","quizId":"U-11-Y02"}},{"id":"11-Y08","title":"端末・データ・供給網の防御","explain":"<p>パターンマッチングは既知の特徴と照合し、振舞い検知は実行時の不審な動作、ヒューリスティックは疑わしい特徴等から判断する。静的解析は実行せず調べ、動的解析は隔離環境等で動作を観察する。サンドボックスは実行環境を分離して影響を抑える。フォールスポジティブ（偽陽性）は正常を異常と判定、フォールスネガティブ（偽陰性）は異常を見逃す。EDRは端末の検知・調査・対応を支援、UEBAは利用者や機器等の振舞いの異常を分析する。</p>","worked":"<p><b>自社の製品がどの版の外部ライブラリを含むか把握したい。</b></p><p>SBOMを整備し脆弱性情報と照合する。</p>","prompt":"同じ環境内にオンラインで複製しただけのバックアップの問題点は？","answer":"<p>同じ侵害や誤操作で複製も影響を受け得る。独立保管と復元試験を考える。</p>","textbook":[{"heading":"検知と対応を組み合わせる","body":"パターンマッチングは既知の特徴と照合し、振舞い検知は実行時の不審な動作、ヒューリスティックは疑わしい特徴等から判断する。静的解析は実行せず調べ、動的解析は隔離環境等で動作を観察する。サンドボックスは実行環境を分離して影響を抑える。フォールスポジティブ（偽陽性）は正常を異常と判定、フォールスネガティブ（偽陰性）は異常を見逃す。EDRは端末の検知・調査・対応を支援、UEBAは利用者や機器等の振舞いの異常を分析する。"},{"heading":"データと機器を守る","body":"3-2-1ルールは元データを含め3コピー、2種類の媒体、1コピーを別の場所に置く考え方。WORM（1回書込み・複数回読出し）やイミュータブルバックアップは指定期間の変更・削除を防ぐ。k-匿名化は準識別子の組合せごとに少なくともk件が存在するよう一般化等を行う考え方だが、他情報との照合リスクは残る。データマスキングは機密値を隠す。暗号化消去は適切な暗号化と鍵破棄により復号できなくする方法。TPM（トラステッドプラットフォームモジュール）は鍵等の保護、セキュアブートは信頼された起動コードの検証を支援する。"},{"heading":"供給網・クラウド・物理対策","body":"SBOM（ソフトウェア部品表）は構成部品と版を把握し脆弱性対応等を支援する。DLP（情報漏えい防止）は機密情報の不適切な送信等を検知・制御、CASB（クラウドアクセスセキュリティ仲介）はクラウド利用の可視化・制御、MDM（モバイル端末管理）は端末設定や紛失時の管理。物理対策ではアンチパスバック（入退室の順序制御）、インターロック（二重扉等の連動制御）、監視カメラ、施錠、UPS、遠隔バックアップを組み合わせる。デジタルフォレンジックスでは証拠を保全し改変を避け、調査・引渡しの記録を残す。"},{"heading":"フォレンジックスと証拠の保全","body":"デジタルフォレンジックスは電子的証拠を適切に収集・検査・分析・報告し、事実を明らかにする。原本を変更しない方法で複製し、ハッシュ値や取得時刻・担当者・保管履歴を記録する。削除ファイルの復元やログの時系列整理は検査・分析の例。リアルタイムログ相関による検知とは目的が異なる。"}],"beginner":{"scenario":"検知と対応を組み合わせるから順に、データと機器を守る、供給網・クラウド・物理対策を理解する。","trap":"ソフトウェア部品表により依存関係等を把握する。","quizId":"U-11-Y08"}},{"id":"11-Y10","title":"アプリ・OS・クラウドの安全な実装","explain":"<p>オリジンは原則としてスキーム、ホスト、ポートの組。Same Origin Policy（同一オリジンポリシー）は異なるオリジンのデータへのスクリプトからのアクセス等を制限する。CORS（オリジン間資源共有）はサーバが許可するオリジン等を応答で示し、ブラウザによる制約を緩和する仕組み。CORSはサーバの認証・認可を代替しない。HSTS（HTTP厳格トランスポートセキュリティ）は対応ブラウザに以後HTTPSのみ利用するよう指示する仕組み。TLSは通信経路を保護するが入力の安全性は別途対策する。</p>","worked":"<p><b>他オリジンのWeb画面から自社APIの応答を読みたい。</b></p><p>サーバで許可するオリジン等をCORSで適切に指定し、別途認証・認可を実施する。</p>","prompt":"HSTSはSQLインジェクション対策になるか。","answer":"<p>ならない。HTTPSの利用を強制する仕組みであり、SQLの命令と値を分離する対策が必要。</p>","textbook":[{"heading":"ブラウザの制約を理解する","body":"オリジンは原則としてスキーム、ホスト、ポートの組。Same Origin Policy（同一オリジンポリシー）は異なるオリジンのデータへのスクリプトからのアクセス等を制限する。CORS（オリジン間資源共有）はサーバが許可するオリジン等を応答で示し、ブラウザによる制約を緩和する仕組み。CORSはサーバの認証・認可を代替しない。HSTS（HTTP厳格トランスポートセキュリティ）は対応ブラウザに以後HTTPSのみ利用するよう指示する仕組み。TLSは通信経路を保護するが入力の安全性は別途対策する。"},{"heading":"アプリの弱点を減らす","body":"SQLのプレースホルダは値を命令と分離する。バッファオーバーフローは確保した記憶域の範囲を超えた書込み等で起こり得るので、境界検査やメモリ安全性を持つ言語、実行時防御等を検討する。静的検査はコード等から、動的検査は実行中の挙動から問題を調べ、ファジングは様々な入力で想定外の動作を検出する。コンテナでは信頼できるイメージ、依存部品の更新、最小権限、秘密情報の保護を行う。ソルトはパスワードごとの乱数等、ストレッチングは計算コストを増やす考え方で、専用のパスワードハッシュ方式を使用する。"},{"heading":"OSとサービスに防御を重ねる","body":"MAC（強制アクセス制御）は管理者が定めた方針でアクセスを強制し、DAC（任意アクセス制御）は所有者等の判断を許す方式。セキュアOSはアクセス制御等を強化する。RASP（実行時アプリケーション自己防御）は実行中のアプリ内部の情報を利用して攻撃を検知・防御する考え方。UTM（統合脅威管理）は複数防御機能を統合、Webアイソレーションは閲覧処理を隔離して影響を抑える。クラウド・IoT・制御システムでは責任範囲、通信分離、更新、監視、停止時の安全を考慮する。"}],"beginner":{"scenario":"ブラウザの制約を理解するから順に、アプリの弱点を減らす、OSとサービスに防御を重ねるを理解する。","trap":"CORSはブラウザのオリジン間アクセス制限を許可に従って緩和する。","quizId":"U-11-Y10"}},{"id":"11-Z02","title":"クラウド安全管理：CSPM・CASB・責任共有","explain":"<p>CSPM（Cloud Security Posture Management：クラウドセキュリティ設定管理）はクラウド環境の公開設定、暗号化、権限などを継続的に評価し、不備を検出して修正を支援する。設定変更の自動修正を行う製品もある。</p>","worked":"<p>公開バケットや過大権限を検出するのはCSPM。従業員の未承認SaaS利用を可視化するのはCASB。</p>","prompt":"クラウド環境の構成が安全基準に合うか継続監視する仕組みは？","answer":"<p>CSPMはクラウド構成のセキュリティ状態を評価する。</p>","beginner":{"scenario":"クラウドのストレージを誤って公開しないよう設定を監視したい。","trap":"クラウドを使うだけで設定不備がなくなるわけではない。","quizId":"U-11-Z02"},"textbook":[{"heading":"基本原理","body":"CSPM（Cloud Security Posture Management：クラウドセキュリティ設定管理）はクラウド環境の公開設定、暗号化、権限などを継続的に評価し、不備を検出して修正を支援する。設定変更の自動修正を行う製品もある。"},{"heading":"仕組み・判断","body":"CASB（Cloud Access Security Broker：クラウドアクセスセキュリティ仲介）はSaaS等の利用状況可視化、アクセス制御、情報漏えい防止を支援する。WAF（Web Application Firewall：Webアプリ防火壁）はWeb通信の攻撃を検知・遮断する。EDR（Endpoint Detection and Response：端末検知・対応）は端末上の活動を監視する。"},{"heading":"応用と注意点","body":"責任共有モデルではサービス形態に応じて事業者と利用組織が管理を分担する。IaaSでは利用者側がOSなども管理し、SaaSでは管理対象が減るが、アカウント、データ、利用設定の責任は残る。具体的な分担は契約・仕様による。"}]},{"id":"11-5","title":"ネットワーク防御・ログ・インシデント対応","explain":"<p>ファイアウォールはIP・ポート・状態などに基づき通信を制御する。DMZ（非武装地帯）は外部公開サーバを内部ネットワークから分離するためのネットワーク区画。WAFはHTTP等のアプリ通信を検査し、IDSは不審通信を検知、IPSは条件に応じて遮断する。EDR（Endpoint Detection and Response：端末の検知・対応）は端末上の不審な挙動の記録と調査・隔離を助ける。SIEM（Security Information and Event Management：セキュリティ情報・イベント管理）はログを横断的に集約・相関分析する。</p>\n<p>インシデント対応は準備→検知と分析→封じ込め→根絶と復旧→事後改善の順に考える。事実と推測を分離し、証拠保全・時刻同期・影響範囲特定を優先する。重要な認証情報が漏えいした恐れがあれば、無効化・再発行・権限確認・不正利用調査を行う。ログがない段階で「漏えいはなかった」と断定しない。</p>\n","worked":"<p>依存パッケージ更新後に端末から不審な外部通信が発生。まず更新の配布停止、端末の適切な隔離、通信ログ/プロセス/更新履歴の保全、トークン無効化の要否判断を並行する。再インストールだけ先に行うと証拠を失う場合がある。</p>\n","prompt":"WAFで不正入力を遮断していればアプリのSQL構文連結を放置してよいか。","answer":"<p>だめ。WAFの検知回避を前提に、アプリ側のパラメータ化等が必要。</p>\n","beginner":{"scenario":"不審通信を検知したら端末の隔離と証拠保全、影響調査、原因の除去、認証情報の処置、復旧を行う。","trap":"直ちに初期化すると証拠を失うことがある。","quizId":"U-11-5"},"textbook":[{"heading":"防御の層を分ける","body":"ファイアウォールは通信の許可・拒否を制御します。IDS（侵入検知システム）は不審な通信等を検出し、IPS（侵入防止システム）は遮断等も行います。WAF（ウェブアプリケーションファイアウォール）はHTTP要求等を検査しWebアプリを保護、EDR（端末の検知・対応）は端末の挙動を監視・調査します。守る場所が異なるため併用します。"},{"heading":"ログを集める理由","body":"単独の異常ログでは原因を判断できないことがあります。認証、端末、通信、サーバのログを時系列で突き合わせると影響範囲を調べやすくなります。SIEM（セキュリティ情報・イベント管理）はログの集約・分析を支援します。時刻同期、改ざん防止、保存期間、閲覧権限を整えます。"},{"heading":"事故対応の流れ","body":"事前準備、検知・分析、封じ込め、根絶・復旧、事後改善を行います。不審端末は適切に隔離して証拠保全し、侵害された認証情報を無効化し原因と範囲を確認します。必要に応じ関係者や法令に基づく報告を行います。復旧では安全なバックアップや修正済み環境を使い再侵害を防ぎます。CSIRTは事故対応を組織的に進める体制です。"}]},{"id":"11-Z01","title":"セキュリティ組織・脆弱性情報・対外対応","explain":"<p>SOC（Security Operations Center：セキュリティ監視センター）はログ監視と検知・分析を行う。CSIRT（Computer Security Incident Response Team：コンピュータセキュリティ事故対応チーム）は組織のインシデントへの調整・対応を行う。PSIRT（Product Security Incident Response Team：製品セキュリティ事故対応チーム）は提供製品に関する脆弱性受付・修正・顧客通知等を扱う。</p>","worked":"<p>販売した機器の脆弱性を受け付け修正を調整する主担当はPSIRT。</p>","prompt":"顧客へ提供したソフトウェアの脆弱性対応を主に担当するのは？","answer":"<p>PSIRTは製品のセキュリティ対応。</p>","beginner":{"scenario":"製品に脆弱性が見つかり、同時に社内PCの不審な活動が検知された。","trap":"CSIRT・PSIRTは対象が違うが連携する。","quizId":"U-11-Z01"},"textbook":[{"heading":"基本原理","body":"SOC（Security Operations Center：セキュリティ監視センター）はログ監視と検知・分析を行う。CSIRT（Computer Security Incident Response Team：コンピュータセキュリティ事故対応チーム）は組織のインシデントへの調整・対応を行う。PSIRT（Product Security Incident Response Team：製品セキュリティ事故対応チーム）は提供製品に関する脆弱性受付・修正・顧客通知等を扱う。"},{"heading":"仕組み・判断","body":"JVN（Japan Vulnerability Notes）は脆弱性関連情報を公開するポータル。JPCERT/CCはインシデント対応や脆弱性情報の調整を行う。ISAC（Information Sharing and Analysis Center：情報共有分析組織）は業界等で脅威情報を共有する。ISMAP（政府情報システムのためのセキュリティ評価制度）は政府調達のクラウド評価に関係する。"},{"heading":"応用と注意点","body":"製品の脆弱性報告はPSIRTが影響版を調査して開発・顧客対応を調整し、社内侵害はCSIRTが封じ込め・復旧を調整する。SOCの検知情報を双方が利用する場合もある。部署の境界は組織により異なる。"}]},{"id":"11-Z06","title":"インシデント対応・統治・サイバー保険","explain":"<p>インシデントハンドリングは検知・受付、トリアージ（重要度に応じた振分け）、対応、報告・情報公開、振り返りを含む。封じ込めで影響を抑え、証拠を保全し、原因を調査する。根絶後に安全な状態へ復旧し再発防止を行う。</p>","worked":"<p>ログを保持して端末を隔離し、事業影響を評価して復旧する。</p>","prompt":"トリアージの主な目的は？","answer":"<p>影響・緊急度で優先順位を決め、適切な担当へつなぐ。</p>","beginner":{"scenario":"不審な端末通信が発見され、影響範囲が不明である。","trap":"証拠を消す再初期化を初動で無条件に実行しない。","quizId":"U-11-Z06"},"textbook":[{"heading":"基本原理","body":"インシデントハンドリングは検知・受付、トリアージ（重要度に応じた振分け）、対応、報告・情報公開、振り返りを含む。封じ込めで影響を抑え、証拠を保全し、原因を調査する。根絶後に安全な状態へ復旧し再発防止を行う。"},{"heading":"仕組み・判断","body":"テイクダウンは悪性サイト等の停止を関係事業者へ求める対応。事業継続では業務影響、復旧優先度、代替運用、復元試験を設計する。サイバー保険は契約範囲の損失を共有する手段であり、防御策そのものではない。"},{"heading":"応用と注意点","body":"経営層はリスク許容度と資源配分を定め、担当者は管理策を運用し、監査が実施状況を確認する。CSF（Cybersecurity Framework：サイバーセキュリティ枠組み）などの考え方を用い、統治・識別・防御・検知・対応・復旧を継続的に評価する。"}]},{"id":"11-6","title":"科目Bの文章読解と対策選定","explain":"<p>科目Bのセキュリティ問題は、文章と構成図から「事象の時系列」「信頼境界」「認証情報が届く範囲」「管理策の不足」を特定する。設問で「原因を答えよ」とあれば観測できた事実と因果関係を書く。「対策を答えよ」とあれば攻撃経路を断つ具体策を書く。「確認項目」なら必要なログや設定を挙げる。抽象的な「セキュリティ強化」「教育を徹底」は点になりにくい。</p>\n<p>対策は予防・検知・封じ込め・復旧に分類し、問題のどこへ効くかを説明する。最小権限は侵害後の横展開を抑え、多要素認証は認証情報単独漏えいへの対抗、パッチは既知脆弱性の除去、ログ監視は発見までの時間短縮を狙う。脆弱性がないことや被害がなかったことは、証拠がなければ結論にしない。</p>\n","worked":"<p>「攻撃者が委託先のVPNアカウントで社内へ入り、管理サーバへアクセスした。委託先アカウントには本番系の管理権限があった」。このとき再発防止策は「委託先へ必要最小限のアクセス権限だけ付与し、管理系へのアクセスを分離する」。本文にない「ウイルスメールを遮断する」は原因経路に対応していない。</p>\n","prompt":"「ログイン後に横展開した」の対策として「パスワードを複雑にする」だけで十分か。","answer":"<p>十分ではない。横展開を抑えるアクセス権分離・ネットワーク分離・監視・多要素認証なども検討する。</p>\n","beginner":{"scenario":"退職者IDが残る事例では、資産は社内システム、脅威は不正利用、弱点はID削除漏れ。退職情報に連動してIDを停止する。","trap":"記述では対象と動作を書く。「強化する」だけでは不十分。","quizId":"U-11-6"},"textbook":[{"heading":"科目Bの問題文は何を聞いているか","body":"セキュリティ事例では資産、構成、利用者、権限、ログ、発生した事象が問題文に示されます。まず正常時にどう動くべきか理解し、異常時の事実との差を探します。文章中の事実から原因を特定し、断定できない場合は可能性と追加確認を区別します。"},{"heading":"答えの作り方","body":"設問が「原因」を聞くなら、どの条件・設定がなぜ問題を起こすか書きます。「対策」を聞くなら対象・動作・目的を具体化します。退職者IDの事例なら「人事の退職情報と連携して退職日にアカウントを無効化し、不正利用を防ぐ」と書けます。「アクセス制御を強化する」だけでは対象も手順も曖昧です。"},{"heading":"記述を自己採点する","body":"模範解答と単語が完全一致する必要はありませんが、設問の要求した原因・動作・対象を含み、問題文の条件と矛盾しないことを確認します。文字数制限は結論と根拠を短くまとめるための制約です。実際の本試験過去問で長文と資料を読む練習も行います。"}]}],"beginnerIntro":"資産を誰からどう守るか考える。暗号・認証・防御機器の目的を整理し、科目Bの記述へつなげる。","studyGroups":[{"title":"守る対象とリスク","body":"資産・脅威・脆弱性からリスク評価と組織の管理策を導く。","ids":["11-1","11-Y05","11-Z03","11-C01","11-Y06","11-Z04","11-X01","11-Y07","11-Z05"]},{"title":"暗号と信頼","body":"秘密性、完全性、本人性、権限を区別し実装につなげる。","ids":["11-2","11-Y03","11-3","11-Y04","11-X02","11-Y09"]},{"title":"攻撃と防御","body":"攻撃経路と原因を理解し、技術的・組織的な予防策を選ぶ。","ids":["11-4","11-Y01","11-Y02","11-Y08","11-Y10","11-Z02"]},{"title":"監視・対応・記述","body":"検知から封じ込め・復旧・再発防止へ進み、設問で根拠を説明する。","ids":["11-5","11-Z01","11-Z06","11-6"]}]},{"id":12,"title":"システム開発技術","group":"テクノロジ","priority":"B選択候補","summary":"要件定義、設計、テスト、品質指標、変更管理。","lessons":[{"title":"要件定義","body":"機能要件は「何ができるか」、非機能要件は性能・可用性・セキュリティ・運用など。関係者の要求を優先度と受入れ条件まで落とし込む。","check":"要件と設計手段（どう実装するか）を分ける。"},{"title":"設計の分割","body":"外部設計は利用者から見える仕様、内部設計は実現する構造。モジュールは凝集度を高く、結合度を低くすることで変更しやすくする。","check":"偶然的凝集は悪く、機能的凝集は良い。"},{"title":"テストと網羅","body":"単体→結合→システム→受入れという段階がある。命令網羅・分岐網羅・条件網羅は意味が異なり、境界値分析や同値分割を使う。","check":"命令網羅100%でもバグがないわけではない。"},{"title":"品質管理","body":"レビューや静的解析は実行前に欠陥を検出する。信頼性・性能効率性・保守性など品質特性ごとに測定指標を置く。","check":"検出した欠陥数の多さだけで品質の良し悪しを判断しない。"},{"title":"移行と保守","body":"切替方式は一斉移行・段階移行・並行運用など。切り戻し計画とデータ整合性確認を用意する。保守には是正・適応・完全化・予防がある。","check":"切替時点のデータ欠損や二重登録を防ぐ。"}],"terms":[{"term":"機能要件","definition":"システムが提供すべき機能や業務処理の要求"},{"term":"非機能要件","definition":"性能・信頼性・安全性・運用など機能以外の要求"},{"term":"モジュール凝集度","definition":"一つのモジュール内の機能がどれだけ密接に関連するか"},{"term":"モジュール結合度","definition":"モジュール同士の依存の強さ"},{"term":"単体テスト","definition":"個々の部品やモジュールの動作を確かめる試験"},{"term":"結合テスト","definition":"部品間のインタフェースや連携を検証する試験"},{"term":"境界値分析","definition":"値の範囲の境目とその近傍を重点的に試す手法"},{"term":"同値分割","definition":"同じ振る舞いと見なせる入力集合から代表値を選ぶ手法"},{"term":"分岐網羅","definition":"判断条件の真と偽の双方を実行する網羅基準"},{"term":"トレーサビリティ","definition":"要求から設計・実装・テストへ対応関係を追跡できること"},{"term":"受入れテスト","definition":"利用者などが業務要件を満たすか確認するテスト"}],"questions":[{"id":"Q12-01","chapter":12,"kind":"applied","q":"入力が1〜100の整数である画面の境界値分析として優先度が高い値の組は。","options":["20,40,60,80","0,1,100,101","10,30,50,70","5,15,25,35"],"correct":1,"explain":"有効・無効の境界近傍を選ぶ。"},{"id":"Q12-02","chapter":12,"kind":"applied","q":"変更容易性を高めるモジュールの性質は。","options":["凝集度低・結合度高","凝集度高・結合度低","凝集度低・結合度低のみ","凝集度高・結合度高"],"correct":1,"explain":"役割をまとめ依存を減らす。"},{"id":"Q12-03","chapter":12,"kind":"applied","q":"要件定義で「99.9%稼働させる」は何に分類されるか。","options":["業務ルール","機能要件","非機能要件","ユーザー操作"],"correct":2,"explain":"稼働率は可用性に関する非機能要件。"},{"id":"D12-01","chapter":12,"kind":"applied","q":"「通常時の95%の検索が2秒以内」という要件の特徴はどれか。","options":["検証可能な非機能要件","画面の色指定のみ","ソースコードの具体的アルゴリズム","会計上の資産"],"correct":0,"explain":"性能に関する非機能要件を測定可能な条件で示している。"},{"id":"D12-02","chapter":12,"kind":"applied","q":"年齢18歳以上を受け付ける入力検証の境界値テストとして適切なのはどれか。","options":["30,40,50","17,18,19","1,3,5","100,200,300"],"correct":1,"explain":"条件が切り替わる境界18の前後17/18/19を試す。"},{"id":"D12-03","chapter":12,"kind":"applied","q":"命令網羅率100%のテスト結果について正しい説明はどれか。","options":["すべてのバグが存在しない","すべての条件組合せが試されている","実行文がすべて少なくとも一度実行されたが、他の欠陥は残り得る","仕様の正しさが証明された"],"correct":2,"explain":"命令網羅はテスト対象の実行文の通過に関する指標で、仕様欠陥・条件組合せの保証ではない。"},{"id":"Q-12-X01","chapter":12,"kind":"applied","q":"オブジェクト間のメッセージを時間順に表現するUML図は？","options":["クラス図","シーケンス図","ER図","ガントチャート"],"correct":1,"explain":"シーケンス図。"},{"id":"Q-12-X02","chapter":12,"kind":"applied","q":"ボトムアップ結合テストで上位の呼出し元を代替するものは？","options":["スタブ","ドライバ","リンカ","スケジューラ"],"correct":1,"explain":"ドライバ。"},{"id":"U-12-1","chapter":12,"kind":"applied","q":"利用者の検索結果を2秒以内に返すという要求の分類は？","options":["機能要件","ソースコード","非機能要件","監査証拠"],"correct":2,"explain":"検索機能自体ではなく、その性能の要求なので非機能要件。"},{"id":"U-12-2","chapter":12,"kind":"applied","q":"モジュール間の依存を少なくする設計を何というか？","options":["低凝集","高結合","高冗長","低結合"],"correct":3,"explain":"低結合はモジュール間依存を小さくし変更の影響を抑える。凝集は内部のまとまり。"},{"id":"U-12-3","chapter":12,"kind":"applied","q":"判定条件の真・偽の両方の分岐を実行する基準は？","options":["分岐網羅","命令網羅","同値分割","負荷試験"],"correct":0,"explain":"分岐網羅は判定結果の両側を実行する。命令網羅は各命令の実行を確認する。"},{"id":"U-12-4","chapter":12,"kind":"applied","q":"頻繁なコード統合と自動検証を行う実践は？","options":["SLA（サービスレベル合意）","CI（継続的インテグレーション）","ETL（抽出・変換・格納）","BCP（事業継続計画）"],"correct":1,"explain":"CIは変更を継続的に統合し、不具合を早期に検出する。"},{"id":"U-12-X01","chapter":12,"kind":"applied","q":"データの移動元・処理・保存先の流れを表す図は？","options":["クラス図","ガントチャート","DFD（データフロー図）","パレート図"],"correct":2,"explain":"DFDはデータの流れを表す。時間順の相互作用はシーケンス図。"},{"id":"U-12-X02","chapter":12,"kind":"applied","q":"トップダウン結合テストで未完成の下位モジュールを代替する部品は？","options":["ドライバ","リンカ","ローダ","スタブ"],"correct":3,"explain":"スタブは呼び出される側を代替。ドライバは呼び出す側の代替。"}],"deepIntro":"システム開発は要求から運用までの整合性を保つ工程。試験では各工程の成果物と、欠陥を見つける手段を問われる。","deep":[{"id":"12-1","title":"要件定義・要求分析・非機能要件","explain":"<p>業務要求は利用者や組織が達成したいこと、システム要件はシステムが実現すべき機能と品質を定義する。機能要件は「注文登録できる」などの振る舞い、非機能要件は性能、可用性、セキュリティ、拡張性、運用性など。要求を取りこぼさないには利用者、業務フロー、例外、外部連携、制約条件を明示する。</p>\n<p>要件は検証可能な形にする。「速い」ではなく「通常時の95%の検索応答を2秒以内」など。曖昧な要求や利害関係者の認識差は後工程で大きな手戻りを招く。トレーサビリティは要求→設計→実装→テストの対応関係を追跡できる性質。</p>\n","worked":"<p>「止まらない予約サイト」では合否判定できない。稼働率99.9%、RTO=1時間、RPO=15分、最大同時利用者数などに分解し、計測方法も定義する。</p>\n","prompt":"UIの色を決めれば非機能要件が満たされるか。","answer":"<p>ならない。アクセシビリティ、性能、可用性などは別に検証する。</p>\n","beginner":{"scenario":"予約システムで「予約できる」は機能要件。「同時利用者100人で95%の検索を2秒以内に完了」は性能の非機能要件。要件を満たしたか検証できる形にする。","trap":"「高速」「使いやすい」だけでは合否を判定できない。","quizId":"U-12-1"},"textbook":[{"heading":"要求と要件の違い","body":"店舗が「在庫を把握したい」と考えるのは要求です。システムが商品ごとの在庫数を表示する、在庫更新から5秒以内に反映する、など実現すべき条件に具体化したものが要件です。現行業務を調査し、利用者・管理者・開発者の要求を整理して合意します。"},{"heading":"機能と品質","body":"機能要件は何をできるようにするか、非機能要件はその機能をどのような品質・制約で提供するかです。性能、可用性、安全性、操作性、保守性などが後者に当たります。応答が速いという曖昧な要件は、例えば同時利用100人で検索の95%が2秒以内と測定可能にします。"},{"heading":"要件を管理する","body":"要求から設計、実装、テストへの対応を記録することをトレーサビリティ（追跡可能性）と呼びます。要求が変更された場合にどの設計とテストを見直すか分かります。必須と希望を区別して優先順位を決め、受入条件を合意することが重要です。"},{"heading":"ペルソナと要件","body":"ペルソナは調査に基づく代表的な架空の利用者像。利用場面、目的、制約を具体化して要求を考える。ステークホルダーは影響を与え又は受ける人・組織。プロダクトオーナーは価値最大化に責任を持つ役割、エピックは大きな要求や作業のまとまり。"}]},{"id":"12-Y01","title":"要求分析の道具とシステム境界","explain":"<p>境界と要件・図の使い分け・合意と追跡を区別する。</p>","worked":"<p>履修取消時、履修データを削除するのか、取消状態に更新するのかをCRUD表で確認する。履歴を保存するなら後者が適することがある。</p>","prompt":"学生と科目の多対多関係を示す図は？","answer":"<p>ER図。DFDはデータの流れを示す。</p>","beginner":{"scenario":"大学の履修登録サービスを新しく作る。既存の認証サービスは作り直さないが、ログインの接続条件は決めなければならない。","trap":"データの流れとデータ構造は異なる。","quizId":"U-12-Y01"},"textbook":[{"heading":"境界と要件","body":"システム境界とは今回作る仕組みと、外部の人・システムを分ける線です。外部認証サービスの内部は対象外でも、接続仕様や障害時の対応は要件になります。5W2H（誰が、何を、なぜ、いつ、どこで、どのように、いくらで）を使い業務と例外を調べます。"},{"heading":"図の使い分け","body":"DFD（Data Flow Diagram：データフロー図）は処理、データの流れ、保管先、外部主体を表します。ER図（Entity Relationship Diagram：実体関連図）は学生と科目などのデータ間の関係を表します。CRUD（Create, Read, Update, Delete：作成・参照・更新・削除）表は業務とデータ操作を対応させ、操作漏れや矛盾を発見します。"},{"heading":"合意と追跡","body":"ユースケースは利用者が目標を達成する正常・例外のやり取り、ユーザーストーリーは誰が何をしたいかと価値を短く記述する方法です。水平型試作品は画面など広い範囲、垂直型試作品は一部機能の実現性を深く検証します。要件IDを設計とテストへ対応づけることで双方向の追跡が可能になります。"}]},{"id":"12-Y02","title":"品質特性とシステム構成の決定","explain":"<p>設計の対象・八つの品質特性・構成と費用を区別する。</p>","worked":"<p>検索を2秒以内にするのは性能効率性、読み上げソフトで操作できるようにするのは使用性（アクセシビリティ）に関係する。</p>","prompt":"別のOSへ移すための修正を減らす品質特性は？","answer":"<p>移植性。</p>","beginner":{"scenario":"図書館の貸出を自動化する。身分確認は職員に任せ、貸出記録はシステムに保存する。","trap":"速さ、信頼性、保守性を区別する。","quizId":"U-12-Y02"},"textbook":[{"heading":"設計の対象","body":"システム設計では要件を機器、ソフトウェア、外部サービス、人の作業に配分します。ソフトウェア設計は画面、データ、処理、部品、接続仕様を具体化します。機器を追加すれば性能が改善する場合がありますが、費用と運用負担も考えます。"},{"heading":"八つの品質特性","body":"シラバスの八分類では機能適合性は必要機能の実現、性能効率性は時間・資源の効率、互換性は他製品との共存や情報交換、使用性は操作しやすさ、信頼性は故障への強さ、セキュリティは情報保護、保守性は修正しやすさ、移植性は他環境への移しやすさです。規格の版による名称の違いに注意します。"},{"heading":"構成と費用","body":"冗長化は停止の危険を減らせる一方、設備費・運用負担が増えます。IaaS（基盤提供）、PaaS（実行環境提供）、SaaS（アプリ提供）では利用者が管理する範囲も異なります。要求、リスク、費用、保守可能性を設計レビューで比較します。"}]},{"id":"12-2","title":"設計・モデリング・アーキテクチャ","explain":"<p>外部設計（基本設計）は利用者から見た機能・画面・帳票・外部インタフェースなど、内部設計（詳細設計）はモジュール・データ構造・処理手順などを具体化する。UML（Unified Modeling Language：統一モデリング言語）のユースケース図は利用主体と機能、クラス図は静的構造、シーケンス図は時間順のやりとり、状態遷移図は状態とイベントの変化を表す。</p>\n<p>設計で重要なのは責務の分離、変更しやすさ、障害隔離、認証・認可の一貫性。3層アーキテクチャは画面・業務ロジック・データアクセスを分ける。マイクロサービス化は独立デプロイ等を助ける一方、通信・データ整合性・監視が複雑になり得る。</p>\n","worked":"<p>「利用者が注文→在庫確保→決済→通知」をシーケンス図で表すと、在庫確保後の決済失敗時に何を戻すかという例外経路を可視化できる。</p>\n","prompt":"クラス図でメッセージの時間順を詳細に表すか。","answer":"<p>時間順の相互作用はシーケンス図が適する。</p>\n","beginner":{"scenario":"ECサイトを画面・注文処理・データ保存に分けると、画面の見た目を変えても業務処理への変更を小さくできる。","trap":"三層は責務の分離であり、物理サーバ3台が必須ではない。","quizId":"U-12-2"},"textbook":[{"heading":"設計とは何を決めるか","body":"外部設計では利用者から見える画面、入出力、機能、外部システムとの接続などを決め、内部設計ではデータ構造、処理手順、モジュール分割などを決めます。用語や工程の区切りは開発方法によって異なります。設計書は要求を実現するための具体的な方針です。"},{"heading":"役割を分ける","body":"表示、業務処理、データ管理を分ける3層構造なら、画面変更とデータ保存方式の変更を独立させやすくなります。モジュール内部が一つの目的にまとまる性質が凝集度、モジュール間の依存の強さが結合度です。高凝集・低結合を目指し、接続仕様を明確にします。"},{"heading":"図で設計を表現する","body":"UML（統一モデリング言語）のクラス図は型と関係、シーケンス図は対象間のメッセージの順序、状態遷移図は状態と変化条件を表します。DFD（データフロー図）はデータの流れを表します。何を確認したいかに応じて図を選びます。"}]},{"id":"12-X01","title":"設計・実装・モデリング","explain":"<p>外部設計は利用者から見える機能・画面・入出力、内部設計は内部構造・処理・データ構造などを具体化する。UML（統一モデリング言語）のクラス図は静的構造、シーケンス図は時間順の相互作用、状態遷移図は状態変化、ユースケース図は利用者と機能の関係。DFD（データフロー図）はデータの流れを表す。</p><p>モジュール凝集度は内部の機能のまとまり、結合度はモジュール間依存。高凝集・低結合が変更の局所化に役立つ。実装・構築ではコーディング規約、例外処理、入力検証、再利用、静的解析、ビルド、環境設定、単体テストなどを行い、設計との追跡可能性を保つ。</p>","worked":"<p>注文処理のシーケンス図で画面→業務処理→DBの呼出しを示せば、データ更新の責務やエラー応答を確認できる。</p>","prompt":"オブジェクト間のメッセージを時間順に表現するUML図は？","answer":"<p>シーケンス図。</p>","beginner":{"scenario":"注文画面、注文サービス、DBの間で送られるメッセージを時系列に並べると、注文失敗時にどの処理が応答するか検討できる。","trap":"クラス図は構造、シーケンス図は相互作用、状態遷移図は状態変化。","quizId":"U-12-X01"},"textbook":[{"heading":"モデルを使う理由","body":"現実の業務やシステムには多くの要素があります。すべてを文章に書くと関連が分かりにくいため、着目点ごとにモデルを作ります。ユースケース図は利用者と提供機能の関係、クラス図はデータ構造等、シーケンス図は処理の順序、状態遷移図は状態の変化を示します。"},{"heading":"設計を実装につなげる","body":"コーディングでは変数名や関数の役割を明確にし、入力検証、例外処理、ログ、アクセス制御を考えます。共通機能は再利用し、依存ライブラリの利用条件と版を確認します。ビルドはソースを実行・配布可能な成果物へ変換する処理です。"},{"heading":"構成を選ぶ","body":"一体型のアプリは運用が単純な場合がありますが、大規模になると変更の影響が広がることがあります。マイクロサービスは機能ごとに独立したサービスへ分割する考え方ですが、通信、整合性、監視が複雑になります。設計は流行ではなく規模・品質要件・運用体制で選択します。"}]},{"id":"12-Y03","title":"モジュールの結束性・結合度と設計手法","explain":"<p>部品を分ける理由・結合の種類・分割手法を区別する。</p>","worked":"<p>料金計算関数に商品価格と税率だけを渡せば、メール送信の仕組みを知らずに試験できる。</p>","prompt":"全モジュールで書換え可能な大域変数を共有すると独立性は上がるか？","answer":"<p>一般には下がる。</p>","beginner":{"scenario":"注文処理の中にメール送信と料金計算が混ざっている。税率変更で通知が壊れないように分割する。","trap":"結束性は内側、結合度は外側。","quizId":"U-12-Y03"},"textbook":[{"heading":"部品を分ける理由","body":"モジュールは役割を持つプログラムのまとまりです。結束性（強度）は内部の処理が同一目的に集約される程度、結合度は部品同士の依存の程度です。一般には高い結束性と低い結合度を目指します。変更の影響を局所化できるためです。"},{"heading":"結合の種類","body":"機能的結束は一つの機能に必要な処理を集めることで、偶発的結束は無関係な処理を集めることです。データ結合は必要な値を引数で渡し、制御結合は相手の動作を指定するフラグなどを渡し、共通結合は共通領域を使います。共通データを書換える構造は変更影響が広がりやすくなります。"},{"heading":"分割手法","body":"プロセス中心設計は業務処理を起点に、DOA（Data Oriented Approach：データ中心アプローチ）はデータ構造を起点に設計します。STS（Source Transform Sink）分割は入力・変換・出力、TR（Transaction）分割は取引の種類別に分けます。共通機能分割では重複処理をまとめます。"}]},{"id":"12-Y04","title":"オブジェクト指向・ドメイン駆動設計・パターン","explain":"<p>オブジェクトの基本・設計原則とパターン・ドメインをモデル化するを区別する。</p>","worked":"<p>注文ID101の注文は住所を変更しても同じ注文。1,000円という金額は値が同じなら等しいと扱える。</p>","prompt":"支払方法によってアルゴリズムを取り替えるパターンは？","answer":"<p>Strategy（戦略）。</p>","beginner":{"scenario":"決済方法が現金・カード・ポイントへ増える。注文処理を毎回全面修正しない設計を考える。","trap":"継承を用いれば自動的に良い設計になるわけではない。","quizId":"U-12-Y04"},"textbook":[{"heading":"オブジェクトの基本","body":"クラスは属性（データ）とメソッド（操作）の定義、インスタンスは具体的な実体です。カプセル化は内部を隠して公開操作で扱うこと、継承は親の性質を引き継ぐこと、多相性は共通の操作を異なる型で実行できることです。集約は全体と部分、汎化は共通概念を上位に抽出する関係です。"},{"heading":"設計原則とパターン","body":"SOLIDは単一責任、開放閉鎖、リスコフの置換、インタフェース分離、依存性逆転の五原則です。注文が決済の共通インタフェースに依存すれば方式を追加しやすくなります。生成パターンは作り方（Factory Method等）、構造パターンは組合せ方（Adapter等）、振舞いパターンは動作の切替（Strategy等）を整理します。"},{"heading":"ドメインをモデル化する","body":"DDD（Domain-Driven Design：ドメイン駆動設計）では業務専門家と共通の言葉を使って対象業務をモデル化します。エンティティはIDで同一性を判断し、値オブジェクトは値で判断します。境界づけられたコンテキストは用語やモデルの意味が一貫する範囲で、コンテキストマップは範囲間の関係を示します。"}]},{"id":"12-C01","title":"SysML・分散サービスの障害設計","explain":"<p>複数サービスを連携させ、一部の障害が全体へ広がるのを抑える。</p><p>シラバスVer.7.2 本文61–65頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>決済障害時に繰返し呼出しで負荷を増やさず一時停止する。</p>","prompt":"下流サービスの障害が上流に波及した。サーキットブレーカーの開・半開・閉とサービスメッシュとの違いを説明せよ。","answer":"<p>開は呼出し停止、半開は限定的な試験呼出し、閉は通常呼出し。障害波及を抑える制御。サービスメッシュはサービス間通信の共通管理基盤で、こうした制御を提供する場合もある。</p>","beginner":{"scenario":"複数サービスを連携させ、一部の障害が全体へ広がるのを抑える。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-12-C01"},"textbook":[{"heading":"分散システムの設計で考えること","body":"一つの製品にハードウェア、ソフトウェア、外部サービスが含まれると、各部分の要求、構造、動作と相互関係を明確にする必要があります。さらにサービスを分ければ、通信障害や負荷集中が他の機能へ波及する可能性もあります。設計では構造の表現と障害対策の両方を扱います。"},{"heading":"SysMLでシステム全体を記述する","body":"SysML（Systems Modeling Language: システムモデリング言語）はシステムの要求、構造、振舞い、関係を表現します。ソフトウェアだけでなくハードウェアや人・外部環境との関係も対象にできます。UML（Unified Modeling Language: 統一モデリング言語）との関係や具体的な記法は版によって異なります。モデルを用いてどの要素がどの要求を満たすか検討します。"},{"heading":"サービスメッシュで共通の通信機能を管理する","body":"サービスが多数ある場合、各アプリに認証・暗号化・通信制御・監視の処理を個別実装すると管理が複雑になります。サービスメッシュはサービス間通信の共通基盤を設け、通信に関わる機能をアプリ本体から分離しやすくする仕組みです。実装によってはプロキシ等を利用します。業務処理そのものを肩代わりするわけではありません。"},{"heading":"サーキットブレーカーで障害連鎖を止める","body":"下流サービスが故障しているときに呼出しを繰り返すと、待ち時間や再試行が増えて上流の資源も枯渇します。サーキットブレーカーは失敗が一定条件を超えると呼出しを停止する方式です。通常（閉）、呼出し停止（開）、限定的に試して復旧を判断（半開）という状態で整理できます。必要に応じて代替応答を返します。"},{"heading":"責務と権限を設計する","body":"各サービスに役割と責任を割り当て、必要な資源だけへの特権を認めます。障害時の代替動作、タイムアウト、監視、最小権限を設計段階から検討します。SysMLは設計内容を記述する言語で、サービスメッシュとサーキットブレーカーは実行時の通信・障害を管理する仕組みです。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"12-Y05","title":"実装標準・単体テスト・ミューテーション","explain":"<p>実装とレビュー・入力と期待結果・テスト自体の評価を区別する。</p>","worked":"<p>18歳以上を18歳超に変異させる。17歳と19歳の試験だけでは見つからないが18歳を含めると検出できる。</p>","prompt":"変異後も全テストが通ったらどう考える？","answer":"<p>対象の変異についてテスト不足を疑う。</p>","beginner":{"scenario":"年齢判定を実装し、コードだけでなくテストが誤りを発見できるか調べる。","trap":"行の実行と誤りの検出は違う。","quizId":"U-12-Y05"},"textbook":[{"heading":"実装とレビュー","body":"モジュール仕様からコードを書き、単体試験、レビュー、文書更新を行います。命名、インデント、ネスト、禁止命令などをコーディング標準で統一します。静的解析は実行せずコードを調べ、デバッガは実行を停止して変数などを確認します。"},{"heading":"入力と期待結果","body":"テストオラクルは正否判定の根拠となる仕様や期待値です。原因結果グラフ法は入力条件と結果の論理関係から試験を作り、決定表は条件の組合せと結果を表にします。境界値分析は条件切替付近を、ファジングは多様な入力による異常を調べます。"},{"heading":"テスト自体の評価","body":"ミューテーションテストは小さな変更を入れたプログラムを作り、既存のテストで変異を検出できるか確かめます。命令網羅率100%でも、条件の境界や判定結果の組合せを十分検証したとは限りません。元と同じ振舞いの等価変異にも注意します。"}]},{"id":"12-3","title":"テスト技法・網羅率・境界値","explain":"<p>単体テストは部品内部、結合テストは部品間、システムテストはシステム全体、受入テストは業務要件の適合を利用側が確認する。ブラックボックス技法は仕様から入力・出力を検討し、同値分割と境界値分析が代表。ホワイトボックス技法はコード構造からテストを設計し、命令網羅、分岐網羅、条件網羅を区別する。</p>\n<p>例えば「年齢18歳以上」が条件なら17,18,19を試し、区間の境界を確認する。テストケースが多数あっても重要な分岐が抜けていれば品質を保証できない。回帰テストは変更による既存機能への影響を検証する。</p>\n","worked":"<p>条件 <code>(A AND B)</code> の真偽を網羅したい場合、分岐網羅（結果の真偽両方）だけではAとBがそれぞれ真偽に変化する影響を十分に調べられないことがある。条件網羅と分岐網羅は異なる。</p>\n","prompt":"100%命令網羅でバグが存在しないといえるか。","answer":"<p>いえない。未検証の条件組合せや仕様そのものの欠陥が残る。</p>\n","beginner":{"scenario":"許容範囲1〜100の整数入力なら、0、1、2、99、100、101で境界前後を確認する。別途、文字や小数なども同値クラスに分ける。","trap":"テスト網羅率100%でもすべての入力や不具合を網羅したとは限らない。","quizId":"U-12-3","lab":{"title":"命令網羅と分岐網羅","problem":"処理：x>0ならa←1、それ以外はa←0。次にy>0ならb←1、それ以外はb←0。テスト(1,1)だけで十分か？","steps":["テスト(1,1)は2つの判定の真側だけを通る。偽側の命令a←0、b←0は未実行。","追加テスト(0,0)で両判定の偽側も通る。","この2件で記載された代入命令を実行し、各判定の真・偽を網羅できる。","しかし(1,0)と(0,1)という組合せは未検証である。要求に応じ組合せや境界も確認する。"],"answer":"1件では不足。例として(0,0)を追加すれば分岐網羅を満たす","check":"分岐網羅100%でも全経路・全組合せ・全入力を網羅したとはいえない。"}},"textbook":[{"heading":"テストは何を確かめるか","body":"プログラムが要求を満たすか、失敗時も正しく処理するかを確かめます。ブラックボックステストは内部のコードに着目せず入力と出力を検証し、ホワイトボックステストは内部の分岐や経路を考えてテストします。"},{"heading":"入力を選ぶ","body":"同値分割は同じ振る舞いを期待できる入力をグループにし代表値を選びます。1〜100の整数が有効なら、0以下、1〜100、101以上などに分けます。境界値分析では間違いが出やすい境界の前後を選び、0,1,2,99,100,101などを試します。文字や小数の無効入力も別に検証します。"},{"heading":"網羅率の意味","body":"命令網羅は各命令が実行されたか、分岐網羅は各判定の真偽を通ったか、条件網羅は複合条件内の各条件が真偽になったかを調べます。分岐網羅100%でも全経路・全入力を試したとは限りません。要求に対応したテスト、異常系、回帰テストも必要です。"}],"walkthrough":{"heading":"同値分割と境界値を実際に作る","body":"年齢が18〜65の整数なら登録可能、それ以外は登録不可とする機能を考えます。等価な振る舞いの範囲を18未満、18〜65、65超と分け、各グループの代表値を17、30、66などとします。境界値分析では17、18、19、64、65、66を試します。さらに整数以外、空欄、非常に大きな値、文字列などが入力可能なら別のクラスとして追加します。テストでは入力だけでなく期待結果を先に決め、実際の結果と比較します。仕様が整数限定でもUIが入力を止めるのか、サーバが拒否するのかを確認します。","cols":["入力","期待結果","選定理由"],"rows":[["17","拒否","下限直前"],["18","許可","下限"],["19","許可","下限直後"],["64","許可","上限直前"],["65","許可","上限"],["66","拒否","上限直後"]]}},{"id":"12-Y06","title":"統合・検証・回帰テストと品質評価","explain":"<p>試験対象の違い・回帰と再テスト・品質評価を区別する。</p>","worked":"<p>料金誤りを修正したら該当計算を再テストし、割引・取消・返金なども回帰試験する。</p>","prompt":"上位機能から試験する場合の未完成の下位機能の代替は？","answer":"<p>スタブ。</p>","beginner":{"scenario":"在庫と注文のサービスを接続する。個別には動いても、通信形式が違えば注文は失敗する。","trap":"回帰試験は修正箇所だけの確認ではない。","quizId":"U-12-Y06"},"textbook":[{"heading":"試験対象の違い","body":"単体試験は部品、統合試験は部品間の接続、ソフトウェア検証試験はソフトウェア要件、システム検証試験はシステム全体の要件との適合を確認します。トップダウン結合では呼出し先をスタブで、ボトムアップ結合では呼出し元をドライバで代用します。"},{"heading":"回帰と再テスト","body":"再テストは修正した不具合が直ったか、回帰試験は変更で既存機能が壊れていないかを調べます。負荷試験は利用量を増やし性能を確認します。どの試験も入力、環境、期待結果、担当者、実施記録を管理します。"},{"heading":"品質評価","body":"テスト密度は規模に対する試験数、欠陥密度は規模に対する欠陥数です。欠陥が少なくても試験が弱いだけかもしれません。試験範囲、欠陥傾向、重大度、要件との追跡関係を併せて評価し、修正と再試験、文書更新を行います。"}]},{"id":"12-4","title":"レビュー・品質測定・CI/CD","explain":"<p>レビューはコードを実行せず欠陥を検出する静的手法。ウォークスルー、インスペクション、ペアレビューなど、形式や役割が異なる。静的解析は型・コーディング規約・潜在的な脆弱性などを検出するが、誤検知や見逃しもある。品質特性には機能適合性、信頼性、使用性、保守性、移植性などがあり、単純なバグ件数だけで総合品質は測れない。</p>\n<p>CI（Continuous Integration：継続的インテグレーション）は変更を頻繁に統合し自動ビルド・テストを回す実践。CD（Continuous Delivery/Deployment：継続的デリバリ/デプロイ）はリリース可能状態を保つ・自動配備する実践。導入後も変更管理・権限管理・監査証跡を忘れない。</p>\n","worked":"<p>仕様変更後に単体テストだけ通過した場合、複数サービスの連携や既存業務への影響を保証できない。結合・回帰・受入テストを設計する。</p>\n","prompt":"自動テストを実行すればレビューや要件検証は不要か。","answer":"<p>不要にはならない。テストに書かれていない要求は検証されない。</p>\n","beginner":{"scenario":"コード変更後に自動ビルドし、テスト・静的解析を実行する。失敗した場合は統合や配布を止め、変更者へ通知する。","trap":"自動テストが通っても品質保証が完了するわけではない。レビューや受入条件も必要。","quizId":"U-12-4"},"textbook":[{"heading":"実行前に誤りを見つける","body":"レビューは成果物を人が調べ、仕様漏れや設計上の問題を早い段階で発見します。ウォークスルーは作成者が説明しながら確認する方式、インスペクションは役割や手順を定めて体系的に検査する方式です。静的解析はコードを実行せず規則違反や潜在的な不具合を調べます。"},{"heading":"自動化で品質を維持する","body":"CI（継続的インテグレーション）は変更を頻繁に統合しビルド・テストを自動化する実践です。CDは継続的デリバリーまたは継続的デプロイを指し、配布可能な状態を維持することや実際の配布の自動化に関係します。自動化の前に合否基準と失敗時の処理を定めます。"},{"heading":"品質指標を読む","body":"欠陥密度は欠陥数を規模で割った指標で、例えば20件/10千行＝2件/千行です。試験の進捗や検出欠陥数を時系列で把握します。欠陥が少ないのは品質が高い場合も、検査が不十分な場合もあるため、複数の指標と要求を合わせて判断します。"}]},{"id":"12-Z01","title":"エラー埋込み法：残存欠陥の推定","explain":"<p>エラー埋込み法は既知の人工欠陥を試験用プログラムに入れ、人工欠陥が発見される割合を真の欠陥の発見割合の推定に利用する。埋込み数をS、発見した埋込み数をs、発見した真の欠陥数をtとする。</p>","worked":"<p>人工欠陥20件中10件を発見し真の欠陥15件発見なら総数30、残存15。</p>","prompt":"人工欠陥30件中20件、真の欠陥18件を発見。残存する真の欠陥の推定は？","answer":"<p>18×30/20−18=9。</p>","beginner":{"scenario":"試験で見つからなかった不具合の数を推定したい。","trap":"総数と残存数は異なる。","quizId":"U-12-Z01"},"textbook":[{"heading":"基本原理","body":"エラー埋込み法は既知の人工欠陥を試験用プログラムに入れ、人工欠陥が発見される割合を真の欠陥の発見割合の推定に利用する。埋込み数をS、発見した埋込み数をs、発見した真の欠陥数をtとする。"},{"heading":"仕組み・判断","body":"人工欠陥と真の欠陥の発見しやすさが同等という仮定で、発見率p=s/S。真の欠陥総数の推定はt/p=tS/s。残存する真の欠陥は総数から発見済みtを引き、t(S−s)/sとなる。"},{"heading":"応用と注意点","body":"人工欠陥50件のうち40件を発見、真の欠陥を24件発見したなら発見率80%、総数30件、残存6件。発見率が0ならこの式で推定できない。欠陥の種類や試験の偏りにより推定がずれる。人工欠陥は製品に混入させない。"}]},{"id":"12-X02","title":"統合試験・移行・保守と廃棄","explain":"<p>単体テスト後の結合テストはインタフェースを検証する。トップダウンでは未完成の下位モジュールをスタブで代替、ボトムアップでは呼出し元をドライバで代替する。システムテストは全体の要求適合、受入テストは利用者の受入条件を確認する。回帰テストは変更で既存機能が壊れていないか調べる。</p><p>導入時はデータ移行計画、照合、切戻し条件、教育を用意する。一斉移行は切替が短いがリスクが集中し、並行稼働は旧新両方を運用する負担がある。保守は是正・適応・完全化・予防などの目的に分類される。廃棄ではデータ消去、証跡、契約終了、資産台帳更新を行う。</p>","worked":"<p>給与システムで旧新の計算結果を1か月並行照合してから切り替えると、不一致を本番切替前に発見できる。</p>","prompt":"ボトムアップ結合テストで上位の呼出し元を代替するものは？","answer":"<p>ドライバ。</p>","beginner":{"scenario":"旧給与システムと新システムを1か月並行稼働し計算結果を照合する。不一致時は原因修正まで旧システムを維持する。","trap":"件数一致だけでは移行データの内容や参照関係の正しさを保証できない。","quizId":"U-12-X02"},"textbook":[{"heading":"テストを段階的に行う","body":"単体テストで個別部品、結合テストで部品同士の接続、システムテストでシステム全体、受入テストで利用者側の受入条件を確認します。トップダウン結合テストでは未完成の下位部品をスタブで代替し、ボトムアップでは呼出し元をドライバで代替します。"},{"heading":"移行で失敗しないために","body":"旧システムのデータを新形式へ変換し、件数だけでなく値の正しさ、一意性、参照整合性を確認します。一斉移行は一度で切替、段階移行は機能や拠点ごとに切替、並行稼働は旧新の結果を比較しながら切替を判断します。障害時の切戻し条件と手順を事前に決めます。"},{"heading":"保守から廃棄まで","body":"是正保守は不具合修正、適応保守は環境変化への対応、完全化保守は性能・機能などの改善、予防保守は将来の問題の予防を目的とします。廃棄では必要な記録を保全し、不要データを安全に消去し、契約や資産台帳を整理します。"}]},{"id":"12-Y07","title":"移行計画・検証と妥当性確認・受入れ","explain":"<p>検証と妥当性確認・移行方式・移行の成功条件を区別する。</p>","worked":"<p>利用者100人のうち5人だけに新版を提供しエラー率を観測してから拡大する。</p>","prompt":"仕様どおりだが利用目的が達成できない。何を確認する？","answer":"<p>妥当性確認。</p>","beginner":{"scenario":"新しい予約サービスへ移行する。仕様どおりでも窓口業務が終わらなければ成功とはいえない。","trap":"検証と妥当性確認は別の問い。","quizId":"U-12-Y07"},"textbook":[{"heading":"検証と妥当性確認","body":"検証（Verification）は定めた仕様に適合して作れているか、妥当性確認（Validation）は実際の利用状況で目的を満たすかを評価します。受入試験は取得者が受入基準に照らして判断し、供給者は資料、環境、訓練等を提供して支援します。"},{"heading":"移行方式","body":"一斉移行は全体を一度に、段階移行は拠点や機能ごとに切替えます。並行稼働では新旧を同時運用します。カナリアリリースは一部利用者へ先行公開し、ブルーグリーンデプロイメントは二環境間でトラフィックを切替えます。データの互換性と切戻し可能性を別途確認します。"},{"heading":"移行の成功条件","body":"移行リハーサル、件数・金額・参照整合性の照合、バックアップ、切戻し条件、責任分担を事前に定めます。利用者訓練、窓口、運用文書も用意します。不合格事項は原因、修正、再試験を記録し、契約に沿って検収します。"}]},{"id":"12-Y08","title":"保守の分類・リファクタリングと安全な廃棄","explain":"<p>目的で分類する・保守の流れ・廃棄の計画を区別する。</p>","worked":"<p>新OSに合わせる作業は適応保守。潜在的なメモリリークを障害前に直すのは予防保守。</p>","prompt":"画面の動作を変えず重複コードを整理する作業は？","answer":"<p>リファクタリング。</p>","beginner":{"scenario":"古い会計システムの改修と終了を計画する。動作中でも将来の障害を防ぐ作業が必要になる。","trap":"保守はすべてバグ修正ではない。","quizId":"U-12-Y08"},"textbook":[{"heading":"目的で分類する","body":"是正保守は既知の不具合修正、適応保守はOSや制度等の環境変化への対応、完全化保守は機能・性能・保守性の改善、予防保守は潜在的な問題を障害発生前に直すことです。作業内容だけでなく目的で区別します。"},{"heading":"保守の流れ","body":"問題登録、原因・影響・費用評価、承認、修正、試験、配布、記録を行います。リファクタリングは外部から観測できる振舞いを保ちつつ内部構造を改善します。リバースエンジニアリングは既存物の仕様等を解析し、リエンジニアリングは解析を踏まえ再構成します。"},{"heading":"廃棄の計画","body":"依存先、保存義務、利用者通知、代替サービスを確認します。必要データを移管し復元を検証し、不要記録・媒体を情報分類に合った方法で消去します。アカウント、鍵、ライセンス、資産台帳も整理します。"}]}],"beginnerIntro":"利用者が何を必要とするかを要求として整理し、設計、実装、試験、導入へつなげる。各工程で何を確認すべきかを考える。","studyGroups":[{"title":"要求と品質","body":"目的から要求・制約・品質を明確にする。","ids":["12-1","12-Y01","12-Y02"]},{"title":"設計と実装","body":"構成、部品、責任、依存関係を整理して実装する。","ids":["12-2","12-X01","12-Y03","12-Y04","12-C01","12-Y05"]},{"title":"検証と品質評価","body":"テストの観点・網羅性と品質の測定を学ぶ。","ids":["12-3","12-Y06","12-4","12-Z01"]},{"title":"移行・保守・廃棄","body":"導入から運用後の変更、終了までの安全性を考える。","ids":["12-X02","12-Y07","12-Y08"]}]},{"id":13,"title":"ソフトウェア開発管理技術","group":"テクノロジ","priority":"A標準","summary":"アジャイル、ウォーターフォール、CI/CD、構成管理、ライセンス。","lessons":[{"title":"開発プロセス","body":"ウォーターフォールは工程を段階的に進める。アジャイルは短い反復で顧客価値と学習を重視する。どちらも要件変更や品質の管理は必要。","check":"アジャイル＝計画なし・文書なしではない。"},{"title":"Scrumの基本","body":"Scrum（スクラム）ではプロダクトバックログを順序付けし、スプリントで増分を生み、レビューとレトロスペクティブで改善する。","check":"デイリースクラムは単なる進捗報告会にしない。"},{"title":"構成・変更管理","body":"バージョン管理は履歴を保つ。変更要求は影響分析・承認・実装・検証を経て反映する。ベースラインを定め、要求とコードと成果物の整合性を確保。","check":"版番号だけでなく変更理由と承認を追えるようにする。"},{"title":"CI/CD","body":"CI（Continuous Integration：継続的インテグレーション）は頻繁な統合と自動テスト。CD（Continuous Delivery/Deployment：継続的デリバリ／デプロイ）はリリース可能な状態を維持し必要に応じ自動配備する。","check":"テストが成功しても運用品質まで完全保証されない。"}],"terms":[{"term":"ウォーターフォール","definition":"開発工程を段階的に進めるプロセスモデル"},{"term":"アジャイル開発","definition":"短い反復と継続的なフィードバックを重視する開発手法"},{"term":"スクラム","definition":"役割・イベント・作成物を定めたアジャイル開発の枠組み"},{"term":"スプリント","definition":"スクラムで成果の増分を作る一定期間の活動"},{"term":"プロダクトバックログ","definition":"製品で実現すべき項目を優先順に並べた一覧"},{"term":"CI","definition":"頻繁なコード統合とビルド・テストの自動化"},{"term":"CD","definition":"ソフトウェアの配布やデプロイを継続的に行えるようにする仕組み"},{"term":"構成管理","definition":"成果物の構成・版・変更履歴を管理すること"},{"term":"ベースライン","definition":"管理・変更の基準となる確定された成果物の状態"},{"term":"技術的負債","definition":"短期的な実装上の妥協などが将来の変更費用を増やす状態"}],"questions":[{"id":"Q13-01","chapter":13,"kind":"applied","q":"CIの主目的として最も適切なのは。","options":["テストを省く","統合時の不整合を早期に検出する","承認手続きをすべてなくす","セキュリティ事故を完全防止する"],"correct":1,"explain":"頻繁な統合と自動テストにより問題を早く発見する。"},{"id":"Q13-02","chapter":13,"kind":"applied","q":"スクラムで利用者価値の優先順位が付いた要求一覧は。","options":["プロダクトバックログ","監査調書","変更ログのみ","決算書"],"correct":0,"explain":"プロダクトバックログは製品の仕事を表す。"},{"id":"Q13-03","chapter":13,"kind":"applied","q":"構成管理に適切なのは。","options":["最新版のみ保持し履歴を削除","版と変更履歴を追跡可能にする","本番のみでコード管理する","修正要求をすべて自動承認する"],"correct":1,"explain":"追跡可能性と整合性を保つ。"},{"id":"D13-01","chapter":13,"kind":"applied","q":"本番不具合が昨日のリリースから発生したとき、原因の再現性を高める情報はどれか。","options":["利用者の印象だけ","固定したコミットと依存バージョン・設定差分","常に最新のライブラリ","開発者数だけ"],"correct":1,"explain":"ソース・依存・設定・環境を特定できれば変更点を絞り込める。"},{"id":"D13-02","chapter":13,"kind":"applied","q":"FP法（ファンクションポイント法）で主に評価するものはどれか。","options":["ソースコードの行数","CPUのクロック周波数","利用者から見た機能規模","開発者の人数のみ"],"correct":2,"explain":"入力・出力・照会・論理ファイル・外部インタフェース等から機能規模を見積もる。"},{"id":"D13-03","chapter":13,"kind":"applied","q":"反復型開発の特徴として適切なものはどれか。","options":["変更を認めない","要件を一切書かない","試作と評価を繰り返し学習結果を反映する","品質テストを常に省く"],"correct":2,"explain":"小さな増分の評価を繰り返すが、テストや要件管理を不要にするわけではない。"},{"id":"Q-13-X01","chapter":13,"kind":"applied","q":"まず失敗するテストを書き、実装して通過させる開発技法は？","options":["TDD","RFI","EVM","OLAP"],"correct":0,"explain":"TDD（テスト駆動開発）。"},{"id":"U-13-1","chapter":13,"kind":"applied","q":"スクラムで次に開発する項目を優先順に並べる成果物は？","options":["プロダクトバックログ","監査調書","サービスカタログ","財務諸表"],"correct":0,"explain":"プロダクトバックログは製品に必要な作業の順序付きリスト。"},{"id":"U-13-2","chapter":13,"kind":"applied","q":"特定時点に承認済みの構成を固定し、以後の変更の基準とするものは？","options":["プロトタイプ","ベースライン","バックログ","ヒストグラム"],"correct":1,"explain":"ベースラインは正式に承認された構成の基準。"},{"id":"U-13-3","chapter":13,"kind":"applied","q":"入力・出力・ファイルなど利用者から見える機能の規模で見積る手法は？","options":["クリティカルパス法","最小二乗法","ファンクションポイント法","パリティ検査"],"correct":2,"explain":"機能量を複雑さなどで重み付けして規模を推定する。"},{"id":"U-13-X01","chapter":13,"kind":"applied","q":"開発と運用の協力・自動化・監視を重視する考え方は？","options":["ウォーターフォールのみ","SOA（サービス指向アーキテクチャ）","OLAP（オンライン分析処理）","DevOps"],"correct":3,"explain":"DevOpsは開発・運用の協力と継続改善を重視する。"}],"deepIntro":"開発プロセスや構成管理は、変更が多い環境でも品質と追跡可能性を保つ仕組み。","deep":[{"id":"13-1","title":"ウォーターフォール・反復・アジャイル","explain":"<p>ウォーターフォールは工程を順に進め、成果物と承認を明確にしやすい。要件が安定し、検収条件を定めやすい案件と相性がよい。一方、後工程で要求が変わると手戻りが大きい。反復・増分型は小さく作って評価を反映し、アジャイルは顧客との協働と変化への適応を重視する価値観・実践の集合。</p>\n<p>スクラムではプロダクトオーナーがプロダクトバックログの管理に責任を負い、スクラムマスターがフレームワークの理解と効果的な運用を支援し、開発者がインクリメントを作る。スプリントは固定長の反復で、レビューとレトロスペクティブの目的は異なる。</p>\n","worked":"<p>利用者の操作方法を短期間で検証したいなら、画面のプロトタイプを小さく反復するのが合理的。ただし法令上の承認記録などは反復型でも省略しない。</p>\n","prompt":"アジャイルなら計画・文書・契約がすべて不要か。","answer":"<p>違う。価値を生む範囲で必要な計画と記録を行う。</p>\n","beginner":{"scenario":"予約機能を短い反復で開発し、利用者が動く画面を試して次の優先順位を見直す。長期の仕様確定を待たず学習できる。","trap":"アジャイルでも計画、設計、テスト、記録が必要。無計画に実装する方法ではない。","quizId":"U-13-1"},"textbook":[{"heading":"開発手法の違い","body":"ウォーターフォールは要件、設計、実装、試験などの工程を順に進め、各段階の成果を確認します。要求が明確な場合に管理しやすい一方、後から大きく変わると手戻りが増えることがあります。反復型開発は短い周期で機能を実装し評価して見直します。"},{"heading":"アジャイルの仕組み","body":"アジャイルは変更に対応しながら利用可能な価値を継続的に届ける考え方です。スクラムではプロダクトバックログ（必要な作業の順序付き一覧）を管理し、スプリント（一定期間の反復）で成果を作り、レビューや振り返りで改善します。プロダクトオーナーは価値とバックログ、スクラムマスターはスクラムの有効性、開発者は成果の作成を担います。"},{"heading":"手法を選ぶ","body":"XP（エクストリームプログラミング）はペアプログラミング、テスト駆動開発、継続的統合等を重視します。プロトタイピングは試作品から要求を具体化し、スパイラルモデルは反復しながらリスクを分析します。アジャイルであっても品質・契約・安全性に必要な記録と検証は省略できません。"}]},{"id":"13-Y01","title":"開発プロセス・形式手法・成熟度","explain":"<p>共通の作業体系・数学的に仕様を表す・プロセス改善を区別する。</p>","worked":"<p>担当者が替わっても品質を保てるよう、標準の試験手順と記録を整え、欠陥傾向を分析して改善する。</p>","prompt":"モデル検査に成功すれば現実の実装も必ず安全か？","answer":"<p>モデルと実装・環境の一致は別途確認が必要。</p>","beginner":{"scenario":"開発品質が担当者の経験に左右される。個人だけでなく組織の作り方を改善する。","trap":"成熟度はソフトウェアの版番号ではない。","quizId":"U-13-Y01"},"textbook":[{"heading":"共通の作業体系","body":"SLCP（Software Life Cycle Process：ソフトウェアライフサイクルプロセス）は取得・供給・開発・運用・保守などの活動を体系化します。共通フレームは関係者の役割認識をそろえます。テーラリング（修整）は規模・契約・リスクに応じプロセスを適合させることです。"},{"heading":"数学的に仕様を表す","body":"形式手法は数学的記法で仕様や性質を明確にします。VDM-SL（Vienna Development Method Specification Language）やZ言語は形式仕様記述の例です。モデル検査は状態と遷移を調べ、性質を破る反例を探します。モデル自体が現実と異なる可能性には注意します。"},{"heading":"プロセス改善","body":"プロセス能力は未達成、実施、管理、確立、予測可能、革新へ段階的に高まる考え方があります。CMMI（Capability Maturity Model Integration：能力成熟度モデル統合）は組織のプロセス改善に使われます。能力水準と成熟度レベルは評価モデルにより区別されるため、段階数を一律に同じとみなしません。"}]},{"id":"13-C01","title":"アジャイルの要求・見積り・実践","explain":"<p>小さな機能を優先しチームで見積りを行う。</p><p>シラバスVer.7.2 本文74頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>3反復の完了ポイントが20,22,18なら平均20。見積りの参考にするが別チームの生産性比較には使わない。</p>","prompt":"要求が不確実で見積りに大きな差がある。要求の分割、見積りの合意、次の反復計画に使う手法を説明せよ。","answer":"<p>INVESTの観点でストーリーを小さく分割し、プランニングポーカーで見積り差の理由を議論する。完了作業量の実績であるベロシティで次の反復を予測する。</p>","beginner":{"scenario":"小さな機能を優先しチームで見積りを行う。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-13-C01"},"textbook":[{"heading":"アジャイルはなぜ必要か","body":"要求が初めから完全には分からないとき、長期間かけて全機能を作ると、完成時点で不要なものが多くなる恐れがあります。アジャイル開発は短い周期で動く成果を作り、利用者の反応をもとに次の作業を調整する考え方です。計画をしないのではなく、得た知識によって計画を更新します。"},{"heading":"目標を共有して要求を分割する","body":"インセプションデッキは、プロジェクトの目的、対象、制約、優先順位などを関係者で共有するための資料です。ユーザーストーリーは利用者の立場、目的、価値を短く表します。INVESTは良いストーリーの条件で、Independent（独立）、Negotiable（交渉可能）、Valuable（価値）、Estimable（見積可能）、Small（小さい）、Testable（検証可能）です。小さく検証できる単位に分けることが反復開発を可能にします。"},{"heading":"規模を見積もって計画する","body":"プランニングポーカーは、チームの各人が作業規模の見積りを同時に示し、差の理由を議論する手法です。ストーリーポイントは相対的な規模・複雑さ・不確実性を表す尺度として使われます。ベロシティは一定期間にチームが完了したポイント等の量で、次の期間に取り組める量の予測に使います。チーム間の人事評価の単純比較に使う尺度ではありません。"},{"heading":"開発中の実践","body":"FDD（Feature-Driven Development: 機能駆動開発）は、機能の一覧を作り、機能単位で計画・設計・構築する方法です。モブプログラミングは複数人が同じ課題に協力し、一つの作業環境で開発する方法です。YAGNI（You Aren’t Gonna Need It: 今必要でない機能は作らない）は、将来の予想だけで不要な実装を増やさない原則です。これらはそれぞれ開発の進め方、協働方法、設計判断という別の役割を持ちます。"},{"heading":"反復の学習をつなげる","body":"目的共有→小さな価値の単位→見積りと優先順位→実装・テスト→利用者の評価→次の計画という循環が基本です。手法の名前ではなく、この循環のどの段階を改善するかを区別します。必要な安全性・法令対応・設計上の備えは現在の要求なので、YAGNIを理由に省略してはいけません。"},{"heading":"反復中の残作業と時間制約","body":"バーンダウンチャートは残作業量を縦軸、時間を横軸に表示します。ベロシティは反復期間に完了した量の実績で、残作業量そのものではありません。タイムボックスは会議や反復などの活動時間の上限を固定し、その範囲で優先順位を調整する考え方です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"13-C02","title":"大規模アジャイル・開発モデル","explain":"<p>多数のチームが同じ製品を開発する。</p><p>シラバスVer.7.2 本文74頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>複数チーム間でAPI仕様の依存を調整する会合はScrum of Scrumsの例。</p>","prompt":"単一製品のスクラムを複数チームに拡張する枠組みは？","answer":"<p>正解は「LeSS」。SAFe・LeSS：SAFe（Scaled Agile Framework：大規模アジャイルの枠組み）は複数チームやポートフォリオの計画・連携を体系化する。LeSS（Large-Scale Scrum：大規模スクラム）は単一製品に対してスクラムを複数チームへ拡張する。</p>","beginner":{"scenario":"多数のチームが同じ製品を開発する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-13-C02"},"textbook":[{"heading":"SAFe・LeSS","body":"SAFe（Scaled Agile Framework：大規模アジャイルの枠組み）は複数チームやポートフォリオの計画・連携を体系化する。LeSS（Large-Scale Scrum：大規模スクラム）は単一製品に対してスクラムを複数チームへ拡張する。"},{"heading":"Scrum of Scrums・DA","body":"Scrum of Scrumsはチーム代表等が依存関係や統合課題を調整する会合。DA（Disciplined Agile：規律あるアジャイル）は状況に応じて方法を選択するツールキット。"},{"heading":"開発モデル","body":"段階的モデルは機能を分割して順次提供、進展的モデルは理解や要件を更新しながら製品を進化させる。ソフトウェアプロダクトラインは共通資産を再利用し関連製品群を効率的に作る。"}]},{"id":"13-X01","title":"開発プロセス・知財・環境管理","explain":"<p>XP（エクストリームプログラミング）はテスト駆動開発、ペアプログラミング、小さなリリースなどを重視する。スクラムでは短い反復で成果と計画を検査・適応する。DevOps（開発と運用の連携）は自動化・監視・協力で価値提供を改善する。リバースエンジニアリングは既存ソフトの構造を解析し、再構築に活用する場合がある。</p><p>知的財産適用管理では外部部品のライセンス・契約・利用条件・特許などを確認する。開発環境管理は開発・試験・本番の分離、ツールの版固定、依存関係、アクセス権、リポジトリ、再現可能なビルドを管理する。構成管理は成果物と版・関係を識別し、変更管理は要求・影響評価・承認・実施を管理する。</p>","worked":"<p>開発チームが使用ライブラリの版とライセンスを一覧化し、本番の依存関係を再現できるようにする。</p>","prompt":"まず失敗するテストを書き、実装して通過させる開発技法は？","answer":"<p>TDD（テスト駆動開発）。</p>","beginner":{"scenario":"本番環境だけで動かない不具合を避けるため、依存ライブラリの版を固定し、同じ条件でビルドと試験を行う。","trap":"外部コードを利用できることと自由に再配布できることは別。","quizId":"U-13-X01"},"textbook":[{"heading":"開発と運用をつなぐ","body":"開発チームが機能を作り運用チームが受け取るだけでは、配布時の設定不一致や障害時の調査不足が起きやすくなります。DevOps（開発と運用の連携）は共通の目標、情報共有、自動化、監視、改善を重視します。"},{"heading":"再現可能な環境","body":"開発・試験・本番環境を分離し、設定やツールの版、依存関係、ビルド手順を管理します。本番の秘密情報を公開リポジトリに保存しないようにします。自動テストや配布を行う際も承認・権限・障害時の切戻しを考えます。"},{"heading":"知的財産と既存資産","body":"外部ソフトウェアのライセンス、契約、特許等の利用条件を確認します。リバースエンジニアリングは既存成果物の構造や仕様を解析すること、リエンジニアリングは解析結果を基に改善・再構築することです。利用の可否は契約や法令を含め判断します。"}]},{"id":"13-2","title":"バージョン管理・構成管理・変更管理","explain":"<p>構成管理はソースコードだけでなく仕様書・設定・依存ライブラリ・成果物などの版と関係を追跡する。Gitのコミットは変更履歴の識別、ブランチは独立した作業系列、タグは特定時点のリリース参照に利用する。リリースに使ったコミットや依存バージョンを固定すると、実際の利用環境での再現性を高められる。</p>\n<p>変更管理では変更要求→影響調査→承認→実施→検証→記録の流れを整える。問題が発生したとき「誰がいつ何を変えたか」「どの環境へ配布したか」を特定できることが重要。SCA（Software Composition Analysis：ソフトウェア構成要素分析）で依存関係の脆弱性・ライセンスを確認する。</p>\n","worked":"<p>本番不具合が「昨日のデプロイから」発生した場合、変更一覧・コミットSHA・設定差分・依存解決結果を比較し、必要なら前版へ戻す。<code>latest</code>の参照では実体の再現性が弱い。</p>\n","prompt":"Gitに入っているから本番動作が必ず再現できるか。","answer":"<p>できない。外部依存、データ、環境変数、実行環境なども影響する。</p>\n","beginner":{"scenario":"本番で障害が起きたとき、配布したソースの版・依存ライブラリ・設定値を特定できれば再現しやすい。","trap":"バージョン管理だけでは承認や影響評価ができない。変更管理も必要。","quizId":"U-13-2"},"textbook":[{"heading":"変更履歴だけでは足りない理由","body":"同じプログラムでも版、設定、依存ライブラリが異なれば動作が変わります。構成管理は成果物を識別し、それらの版や関係、状態を管理する活動です。ベースラインは承認済みの構成を基準として固定したものです。"},{"heading":"バージョン管理","body":"Gitなどでは変更のまとまりをコミットとして記録し、ブランチで作業を分け、マージで変更を統合します。コンフリクトが発生した場合は内容を確認して解決します。いつ誰が何を変えたか追跡でき、必要に応じて以前の版へ戻せます。"},{"heading":"変更管理","body":"変更要求を受けたら目的、影響範囲、費用、リスク、試験方法を評価し、権限者の承認を得ます。実施後に構成情報・文書を更新し結果を確認します。変更履歴を保存するだけでは変更の妥当性や承認は保証されません。"}]},{"id":"13-Y04","title":"開発環境・ツール・設計データ管理","explain":"<p>環境を分離する・再現可能な構成・利用実態の管理を区別する。</p>","worked":"<p>5人分の利用者ライセンスを7人が使う場合、契約に照らし追加購入や利用停止を検討する。</p>","prompt":"ソースだけ保存すればビルドは必ず再現できるか？","answer":"<p>依存関係、版、設定、手順も必要。</p>","beginner":{"scenario":"同じコードでも担当者のPCによって動作が異なる。","trap":"本番相当と本番は異なる。","quizId":"U-13-Y04"},"textbook":[{"heading":"環境を分離する","body":"開発環境は実装、試験環境は検証、ステージング環境は本番に近い最終確認、本番環境は実利用のために用います。本番への直接変更権限を制限し、試験データの個人情報はマスクします。環境差は明示して管理します。"},{"heading":"再現可能な構成","body":"コンパイラ、依存ライブラリ、OS、設定、ツールの版を管理し、ビルド手順を記録します。SCM（So
