の連動制御）、監視カメラ、施錠、UPS、遠隔バックアップを組み合わせる。デジタルフォレンジックスでは証拠を保全し改変を避け、調査・引渡しの記録を残す。"}],"beginner":{"scenario":"検知と対応を組み合わせるから順に、データと機器を守る、供給網・クラウド・物理対策を理解する。","trap":"ソフトウェア部品表により依存関係等を把握する。","quizId":"U-11-Y08"}},{"id":"11-Y09","title":"メール・無線・ネットワークの認証実装","explain":"\u003cp>SPF（送信元ポリシーフレームワーク）はメール送信に使用したIPが対象ドメインの許可するものか確認する。DKIM（ドメイン鍵識別メール）は署名を検証し送信ドメイン等との関係と改ざんの有無を確認する。DMARC（ドメインベースのメッセージ認証・報告・適合）は表示上のFromドメインとSPFまたはDKIMで認証されたドメインの整合性等を確認し、失敗時の方針や報告を提供する。SMTP-AUTHはメール送信時の利用者認証、OP25Bは利用者側ネットワークから外部の25番ポートへの直接送信を制限する迷惑メール対策。S/MIMEとPGPはメール内容の暗号化・署名等に利用する。\u003c/p>","worked":"\u003cp>\u003cb>攻撃者が正規組織を表示Fromに偽装したメールを送った。\u003c/b>\u003c/p>\u003cp>SPF・DKIMに加えDMARCのドメイン整合性とポリシーで検証する。ただし全ての詐欺を防ぐわけではない。\u003c/p>","prompt":"DNSSECは名前解決の問い合わせ内容を秘密にするものか。","answer":"\u003cp>いいえ。署名で応答データの出所と完全性を検証する。\u003c/p>","textbook":[{"heading":"送信元を検証する","body":"SPF（送信元ポリシーフレームワーク）はメール送信に使用したIPが対象ドメインの許可するものか確認する。DKIM（ドメイン鍵識別メール）は署名を検証し送信ドメイン等との関係と改ざんの有無を確認する。DMARC（ドメインベースのメッセージ認証・報告・適合）は表示上のFromドメインとSPFまたはDKIMで認証されたドメインの整合性等を確認し、失敗時の方針や報告を提供する。SMTP-AUTHはメール送信時の利用者認証、OP25Bは利用者側ネットワークから外部の25番ポートへの直接送信を制限する迷惑メール対策。S/MIMEとPGPはメール内容の暗号化・署名等に利用する。"},{"heading":"ネットワークへの接続を認証する","body":"IEEE 802.1Xは端末（サプリカント）、スイッチ等（認証装置）、認証サーバを用いたポートベース認証の規格。EAP（拡張認証プロトコル）は認証方式を運ぶ枠組み、EAP-TLSは証明書を用いる方式、PEAPはTLSトンネル内で認証を行う方式。RADIUSはネットワーク接続の認証・認可・利用記録等を扱うプロトコル、Diameterは関連する後継的規約。WPA2/WPA3は無線LANの保護方式で、個人向けWPA3ではSAEによる認証・鍵確立を利用する。Enhanced Openは認証なしの無線接続の暗号化を提供するが相手の真正性を保証しない。"},{"heading":"通信を分けて検査する","body":"パケットフィルタはアドレス・ポート等で許可を決め、ステートフル方式は接続状態も利用する。アプリケーションゲートウェイはアプリ層を中継・検査する。DMZ（非武装地帯）は外部公開サーバ等を内部網と分離する領域。認証VLANは認証結果に応じ論理網を割り当てる。ハニーポットはおとり環境で不審な活動の観測等に用いる。DNSSECはDNS応答の出所と完全性を検証する署名技術で、DNS通信内容の暗号化ではない。MACアドレスフィルタのみで強い本人確認はできない。"}],"beginner":{"scenario":"送信元を検証するから順に、ネットワークへの接続を認証する、通信を分けて検査するを理解する。","trap":"SPF/DKIMの認証結果と表示Fromのドメイン整合性等を評価する。","quizId":"U-11-Y09"}},{"id":"11-Y10","title":"アプリ・OS・クラウドの安全な実装","explain":"\u003cp>オリジンは原則としてスキーム、ホスト、ポートの組。Same Origin Policy（同一オリジンポリシー）は異なるオリジンのデータへのスクリプトからのアクセス等を制限する。CORS（オリジン間資源共有）はサーバが許可するオリジン等を応答で示し、ブラウザによる制約を緩和する仕組み。CORSはサーバの認証・認可を代替しない。HSTS（HTTP厳格トランスポートセキュリティ）は対応ブラウザに以後HTTPSのみ利用するよう指示する仕組み。TLSは通信経路を保護するが入力の安全性は別途対策する。\u003c/p>","worked":"\u003cp>\u003cb>他オリジンのWeb画面から自社APIの応答を読みたい。\u003c/b>\u003c/p>\u003cp>サーバで許可するオリジン等をCORSで適切に指定し、別途認証・認可を実施する。\u003c/p>","prompt":"HSTSはSQLインジェクション対策になるか。","answer":"\u003cp>ならない。HTTPSの利用を強制する仕組みであり、SQLの命令と値を分離する対策が必要。\u003c/p>","textbook":[{"heading":"ブラウザの制約を理解する","body":"オリジンは原則としてスキーム、ホスト、ポートの組。Same Origin Policy（同一オリジンポリシー）は異なるオリジンのデータへのスクリプトからのアクセス等を制限する。CORS（オリジン間資源共有）はサーバが許可するオリジン等を応答で示し、ブラウザによる制約を緩和する仕組み。CORSはサーバの認証・認可を代替しない。HSTS（HTTP厳格トランスポートセキュリティ）は対応ブラウザに以後HTTPSのみ利用するよう指示する仕組み。TLSは通信経路を保護するが入力の安全性は別途対策する。"},{"heading":"アプリの弱点を減らす","body":"SQLのプレースホルダは値を命令と分離する。バッファオーバーフローは確保した記憶域の範囲を超えた書込み等で起こり得るので、境界検査やメモリ安全性を持つ言語、実行時防御等を検討する。静的検査はコード等から、動的検査は実行中の挙動から問題を調べ、ファジングは様々な入力で想定外の動作を検出する。コンテナでは信頼できるイメージ、依存部品の更新、最小権限、秘密情報の保護を行う。ソルトはパスワードごとの乱数等、ストレッチングは計算コストを増やす考え方で、専用のパスワードハッシュ方式を使用する。"},{"heading":"OSとサービスに防御を重ねる","body":"MAC（強制アクセス制御）は管理者が定めた方針でアクセスを強制し、DAC（任意アクセス制御）は所有者等の判断を許す方式。セキュアOSはアクセス制御等を強化する。RASP（実行時アプリケーション自己防御）は実行中のアプリ内部の情報を利用して攻撃を検知・防御する考え方。UTM（統合脅威管理）は複数防御機能を統合、Webアイソレーションは閲覧処理を隔離して影響を抑える。クラウド・IoT・制御システムでは責任範囲、通信分離、更新、監視、停止時の安全を考慮する。"}],"beginner":{"scenario":"ブラウザの制約を理解するから順に、アプリの弱点を減らす、OSとサービスに防御を重ねるを理解する。","trap":"CORSはブラウザのオリジン間アクセス制限を許可に従って緩和する。","quizId":"U-11-Y10"}}],"beginnerIntro":"資産を誰からどう守るか考える。暗号・認証・防御機器の目的を整理し、科目Bの記述へつなげる。"},{"id":12,"title":"システム開発技術","group":"テクノロジ","priority":"B選択候補","summary":"要件定義、設計、テスト、品質指標、変更管理。","lessons":[{"title":"要件定義","body":"機能要件は「何ができるか」、非機能要件は性能・可用性・セキュリティ・運用など。関係者の要求を優先度と受入れ条件まで落とし込む。","check":"要件と設計手段（どう実装するか）を分ける。"},{"title":"設計の分割","body":"外部設計は利用者から見える仕様、内部設計は実現する構造。モジュールは凝集度を高く、結合度を低くすることで変更しやすくする。","check":"偶然的凝集は悪く、機能的凝集は良い。"},{"title":"テストと網羅","body":"単体→結合→システム→受入れという段階がある。命令網羅・分岐網羅・条件網羅は意味が異なり、境界値分析や同値分割を使う。","check":"命令網羅100%でもバグがないわけではない。"},{"title":"品質管理","body":"レビューや静的解析は実行前に欠陥を検出する。信頼性・性能効率性・保守性など品質特性ごとに測定指標を置く。","check":"検出した欠陥数の多さだけで品質の良し悪しを判断しない。"},{"title":"移行と保守","body":"切替方式は一斉移行・段階移行・並行運用など。切り戻し計画とデータ整合性確認を用意する。保守には是正・適応・完全化・予防がある。","check":"切替時点のデータ欠損や二重登録を防ぐ。"}],"terms":[{"term":"機能要件","definition":"システムが提供すべき機能や業務処理の要求"},{"term":"非機能要件","definition":"性能・信頼性・安全性・運用など機能以外の要求"},{"term":"モジュール凝集度","definition":"一つのモジュール内の機能がどれだけ密接に関連するか"},{"term":"モジュール結合度","definition":"モジュール同士の依存の強さ"},{"term":"単体テスト","definition":"個々の部品やモジュールの動作を確かめる試験"},{"term":"結合テスト","definition":"部品間のインタフェースや連携を検証する試験"},{"term":"境界値分析","definition":"値の範囲の境目とその近傍を重点的に試す手法"},{"term":"同値分割","definition":"同じ振る舞いと見なせる入力集合から代表値を選ぶ手法"},{"term":"分岐網羅","definition":"判断条件の真と偽の双方を実行する網羅基準"},{"term":"トレーサビリティ","definition":"要求から設計・実装・テストへ対応関係を追跡できること"},{"term":"受入れテスト","definition":"利用者などが業務要件を満たすか確認するテスト"}],"questions":[{"id":"Q12-01","chapter":12,"kind":"applied","q":"入力が1〜100の整数である画面の境界値分析として優先度が高い値の組は。","options":["20,40,60,80","0,1,100,101","10,30,50,70","5,15,25,35"],"correct":1,"explain":"有効・無効の境界近傍を選ぶ。"},{"id":"Q12-02","chapter":12,"kind":"applied","q":"変更容易性を高めるモジュールの性質は。","options":["凝集度低・結合度高","凝集度高・結合度低","凝集度低・結合度低のみ","凝集度高・結合度高"],"correct":1,"explain":"役割をまとめ依存を減らす。"},{"id":"Q12-03","chapter":12,"kind":"applied","q":"要件定義で「99.9%稼働させる」は何に分類されるか。","options":["業務ルール","機能要件","非機能要件","ユーザー操作"],"correct":2,"explain":"稼働率は可用性に関する非機能要件。"},{"id":"D12-01","chapter":12,"kind":"applied","q":"「通常時の95%の検索が2秒以内」という要件の特徴はどれか。","options":["検証可能な非機能要件","画面の色指定のみ","ソースコードの具体的アルゴリズム","会計上の資産"],"correct":0,"explain":"性能に関する非機能要件を測定可能な条件で示している。"},{"id":"D12-02","chapter":12,"kind":"applied","q":"年齢18歳以上を受け付ける入力検証の境界値テストとして適切なのはどれか。","options":["30,40,50","17,18,19","1,3,5","100,200,300"],"correct":1,"explain":"条件が切り替わる境界18の前後17/18/19を試す。"},{"id":"D12-03","chapter":12,"kind":"applied","q":"命令網羅率100%のテスト結果について正しい説明はどれか。","options":["すべてのバグが存在しない","すべての条件組合せが試されている","実行文がすべて少なくとも一度実行されたが、他の欠陥は残り得る","仕様の正しさが証明された"],"correct":2,"explain":"命令網羅はテスト対象の実行文の通過に関する指標で、仕様欠陥・条件組合せの保証ではない。"},{"id":"Q-12-X01","chapter":12,"kind":"applied","q":"オブジェクト間のメッセージを時間順に表現するUML図は？","options":["クラス図","シーケンス図","ER図","ガントチャート"],"correct":1,"explain":"シーケンス図。"},{"id":"Q-12-X02","chapter":12,"kind":"applied","q":"ボトムアップ結合テストで上位の呼出し元を代替するものは？","options":["スタブ","ドライバ","リンカ","スケジューラ"],"correct":1,"explain":"ドライバ。"},{"id":"U-12-1","chapter":12,"kind":"applied","q":"利用者の検索結果を2秒以内に返すという要求の分類は？","options":["機能要件","ソースコード","非機能要件","監査証拠"],"correct":2,"explain":"検索機能自体ではなく、その性能の要求なので非機能要件。"},{"id":"U-12-2","chapter":12,"kind":"applied","q":"モジュール間の依存を少なくする設計を何というか？","options":["低凝集","高結合","高冗長","低結合"],"correct":3,"explain":"低結合はモジュール間依存を小さくし変更の影響を抑える。凝集は内部のまとまり。"},{"id":"U-12-3","chapter":12,"kind":"applied","q":"判定条件の真・偽の両方の分岐を実行する基準は？","options":["分岐網羅","命令網羅","同値分割","負荷試験"],"correct":0,"explain":"分岐網羅は判定結果の両側を実行する。命令網羅は各命令の実行を確認する。"},{"id":"U-12-4","chapter":12,"kind":"applied","q":"頻繁なコード統合と自動検証を行う実践は？","options":["SLA（サービスレベル合意）","CI（継続的インテグレーション）","ETL（抽出・変換・格納）","BCP（事業継続計画）"],"correct":1,"explain":"CIは変更を継続的に統合し、不具合を早期に検出する。"},{"id":"U-12-X01","chapter":12,"kind":"applied","q":"データの移動元・処理・保存先の流れを表す図は？","options":["クラス図","ガントチャート","DFD（データフロー図）","パレート図"],"correct":2,"explain":"DFDはデータの流れを表す。時間順の相互作用はシーケンス図。"},{"id":"U-12-X02","chapter":12,"kind":"applied","q":"トップダウン結合テストで未完成の下位モジュールを代替する部品は？","options":["ドライバ","リンカ","ローダ","スタブ"],"correct":3,"explain":"スタブは呼び出される側を代替。ドライバは呼び出す側の代替。"}],"deepIntro":"システム開発は要求から運用までの整合性を保つ工程。試験では各工程の成果物と、欠陥を見つける手段を問われる。","deep":[{"id":"12-1","title":"要件定義・要求分析・非機能要件","explain":"\u003cp>業務要求は利用者や組織が達成したいこと、システム要件はシステムが実現すべき機能と品質を定義する。機能要件は「注文登録できる」などの振る舞い、非機能要件は性能、可用性、セキュリティ、拡張性、運用性など。要求を取りこぼさないには利用者、業務フロー、例外、外部連携、制約条件を明示する。\u003c/p>\n\u003cp>要件は検証可能な形にする。「速い」ではなく「通常時の95%の検索応答を2秒以内」など。曖昧な要求や利害関係者の認識差は後工程で大きな手戻りを招く。トレーサビリティは要求→設計→実装→テストの対応関係を追跡できる性質。\u003c/p>\n","worked":"\u003cp>「止まらない予約サイト」では合否判定できない。稼働率99.9%、RTO=1時間、RPO=15分、最大同時利用者数などに分解し、計測方法も定義する。\u003c/p>\n","prompt":"UIの色を決めれば非機能要件が満たされるか。","answer":"\u003cp>ならない。アクセシビリティ、性能、可用性などは別に検証する。\u003c/p>\n","beginner":{"scenario":"予約システムで「予約できる」は機能要件。「同時利用者100人で95%の検索を2秒以内に完了」は性能の非機能要件。要件を満たしたか検証できる形にする。","trap":"「高速」「使いやすい」だけでは合否を判定できない。","quizId":"U-12-1"},"textbook":[{"heading":"要求と要件の違い","body":"店舗が「在庫を把握したい」と考えるのは要求です。システムが商品ごとの在庫数を表示する、在庫更新から5秒以内に反映する、など実現すべき条件に具体化したものが要件です。現行業務を調査し、利用者・管理者・開発者の要求を整理して合意します。"},{"heading":"機能と品質","body":"機能要件は何をできるようにするか、非機能要件はその機能をどのような品質・制約で提供するかです。性能、可用性、安全性、操作性、保守性などが後者に当たります。応答が速いという曖昧な要件は、例えば同時利用100人で検索の95%が2秒以内と測定可能にします。"},{"heading":"要件を管理する","body":"要求から設計、実装、テストへの対応を記録することをトレーサビリティ（追跡可能性）と呼びます。要求が変更された場合にどの設計とテストを見直すか分かります。必須と希望を区別して優先順位を決め、受入条件を合意することが重要です。"}]},{"id":"12-2","title":"設計・モデリング・アーキテクチャ","explain":"\u003cp>外部設計（基本設計）は利用者から見た機能・画面・帳票・外部インタフェースなど、内部設計（詳細設計）はモジュール・データ構造・処理手順などを具体化する。UML（Unified Modeling Language：統一モデリング言語）のユースケース図は利用主体と機能、クラス図は静的構造、シーケンス図は時間順のやりとり、状態遷移図は状態とイベントの変化を表す。\u003c/p>\n\u003cp>設計で重要なのは責務の分離、変更しやすさ、障害隔離、認証・認可の一貫性。3層アーキテクチャは画面・業務ロジック・データアクセスを分ける。マイクロサービス化は独立デプロイ等を助ける一方、通信・データ整合性・監視が複雑になり得る。\u003c/p>\n","worked":"\u003cp>「利用者が注文→在庫確保→決済→通知」をシーケンス図で表すと、在庫確保後の決済失敗時に何を戻すかという例外経路を可視化できる。\u003c/p>\n","prompt":"クラス図でメッセージの時間順を詳細に表すか。","answer":"\u003cp>時間順の相互作用はシーケンス図が適する。\u003c/p>\n","beginner":{"scenario":"ECサイトを画面・注文処理・データ保存に分けると、画面の見た目を変えても業務処理への変更を小さくできる。","trap":"三層は責務の分離であり、物理サーバ3台が必須ではない。","quizId":"U-12-2"},"textbook":[{"heading":"設計とは何を決めるか","body":"外部設計では利用者から見える画面、入出力、機能、外部システムとの接続などを決め、内部設計ではデータ構造、処理手順、モジュール分割などを決めます。用語や工程の区切りは開発方法によって異なります。設計書は要求を実現するための具体的な方針です。"},{"heading":"役割を分ける","body":"表示、業務処理、データ管理を分ける3層構造なら、画面変更とデータ保存方式の変更を独立させやすくなります。モジュール内部が一つの目的にまとまる性質が凝集度、モジュール間の依存の強さが結合度です。高凝集・低結合を目指し、接続仕様を明確にします。"},{"heading":"図で設計を表現する","body":"UML（統一モデリング言語）のクラス図は型と関係、シーケンス図は対象間のメッセージの順序、状態遷移図は状態と変化条件を表します。DFD（データフロー図）はデータの流れを表します。何を確認したいかに応じて図を選びます。"}]},{"id":"12-3","title":"テスト技法・網羅率・境界値","explain":"\u003cp>単体テストは部品内部、結合テストは部品間、システムテストはシステム全体、受入テストは業務要件の適合を利用側が確認する。ブラックボックス技法は仕様から入力・出力を検討し、同値分割と境界値分析が代表。ホワイトボックス技法はコード構造からテストを設計し、命令網羅、分岐網羅、条件網羅を区別する。\u003c/p>\n\u003cp>例えば「年齢18歳以上」が条件なら17,18,19を試し、区間の境界を確認する。テストケースが多数あっても重要な分岐が抜けていれば品質を保証できない。回帰テストは変更による既存機能への影響を検証する。\u003c/p>\n","worked":"\u003cp>条件 \u003ccode>(A AND B)\u003c/code> の真偽を網羅したい場合、分岐網羅（結果の真偽両方）だけではAとBがそれぞれ真偽に変化する影響を十分に調べられないことがある。条件網羅と分岐網羅は異なる。\u003c/p>\n","prompt":"100%命令網羅でバグが存在しないといえるか。","answer":"\u003cp>いえない。未検証の条件組合せや仕様そのものの欠陥が残る。\u003c/p>\n","beginner":{"scenario":"許容範囲1〜100の整数入力なら、0、1、2、99、100、101で境界前後を確認する。別途、文字や小数なども同値クラスに分ける。","trap":"テスト網羅率100%でもすべての入力や不具合を網羅したとは限らない。","quizId":"U-12-3","lab":{"title":"命令網羅と分岐網羅","problem":"処理：x>0ならa←1、それ以外はa←0。次にy>0ならb←1、それ以外はb←0。テスト(1,1)だけで十分か？","steps":["テスト(1,1)は2つの判定の真側だけを通る。偽側の命令a←0、b←0は未実行。","追加テスト(0,0)で両判定の偽側も通る。","この2件で記載された代入命令を実行し、各判定の真・偽を網羅できる。","しかし(1,0)と(0,1)という組合せは未検証である。要求に応じ組合せや境界も確認する。"],"answer":"1件では不足。例として(0,0)を追加すれば分岐網羅を満たす","check":"分岐網羅100%でも全経路・全組合せ・全入力を網羅したとはいえない。"}},"textbook":[{"heading":"テストは何を確かめるか","body":"プログラムが要求を満たすか、失敗時も正しく処理するかを確かめます。ブラックボックステストは内部のコードに着目せず入力と出力を検証し、ホワイトボックステストは内部の分岐や経路を考えてテストします。"},{"heading":"入力を選ぶ","body":"同値分割は同じ振る舞いを期待できる入力をグループにし代表値を選びます。1〜100の整数が有効なら、0以下、1〜100、101以上などに分けます。境界値分析では間違いが出やすい境界の前後を選び、0,1,2,99,100,101などを試します。文字や小数の無効入力も別に検証します。"},{"heading":"網羅率の意味","body":"命令網羅は各命令が実行されたか、分岐網羅は各判定の真偽を通ったか、条件網羅は複合条件内の各条件が真偽になったかを調べます。分岐網羅100%でも全経路・全入力を試したとは限りません。要求に対応したテスト、異常系、回帰テストも必要です。"}],"walkthrough":{"heading":"同値分割と境界値を実際に作る","body":"年齢が18〜65の整数なら登録可能、それ以外は登録不可とする機能を考えます。等価な振る舞いの範囲を18未満、18〜65、65超と分け、各グループの代表値を17、30、66などとします。境界値分析では17、18、19、64、65、66を試します。さらに整数以外、空欄、非常に大きな値、文字列などが入力可能なら別のクラスとして追加します。テストでは入力だけでなく期待結果を先に決め、実際の結果と比較します。仕様が整数限定でもUIが入力を止めるのか、サーバが拒否するのかを確認します。","cols":["入力","期待結果","選定理由"],"rows":[["17","拒否","下限直前"],["18","許可","下限"],["19","許可","下限直後"],["64","許可","上限直前"],["65","許可","上限"],["66","拒否","上限直後"]]}},{"id":"12-4","title":"レビュー・品質測定・CI/CD","explain":"\u003cp>レビューはコードを実行せず欠陥を検出する静的手法。ウォークスルー、インスペクション、ペアレビューなど、形式や役割が異なる。静的解析は型・コーディング規約・潜在的な脆弱性などを検出するが、誤検知や見逃しもある。品質特性には機能適合性、信頼性、使用性、保守性、移植性などがあり、単純なバグ件数だけで総合品質は測れない。\u003c/p>\n\u003cp>CI（Continuous Integration：継続的インテグレーション）は変更を頻繁に統合し自動ビルド・テストを回す実践。CD（Continuous Delivery/Deployment：継続的デリバリ/デプロイ）はリリース可能状態を保つ・自動配備する実践。導入後も変更管理・権限管理・監査証跡を忘れない。\u003c/p>\n","worked":"\u003cp>仕様変更後に単体テストだけ通過した場合、複数サービスの連携や既存業務への影響を保証できない。結合・回帰・受入テストを設計する。\u003c/p>\n","prompt":"自動テストを実行すればレビューや要件検証は不要か。","answer":"\u003cp>不要にはならない。テストに書かれていない要求は検証されない。\u003c/p>\n","beginner":{"scenario":"コード変更後に自動ビルドし、テスト・静的解析を実行する。失敗した場合は統合や配布を止め、変更者へ通知する。","trap":"自動テストが通っても品質保証が完了するわけではない。レビューや受入条件も必要。","quizId":"U-12-4"},"textbook":[{"heading":"実行前に誤りを見つける","body":"レビューは成果物を人が調べ、仕様漏れや設計上の問題を早い段階で発見します。ウォークスルーは作成者が説明しながら確認する方式、インスペクションは役割や手順を定めて体系的に検査する方式です。静的解析はコードを実行せず規則違反や潜在的な不具合を調べます。"},{"heading":"自動化で品質を維持する","body":"CI（継続的インテグレーション）は変更を頻繁に統合しビルド・テストを自動化する実践です。CDは継続的デリバリーまたは継続的デプロイを指し、配布可能な状態を維持することや実際の配布の自動化に関係します。自動化の前に合否基準と失敗時の処理を定めます。"},{"heading":"品質指標を読む","body":"欠陥密度は欠陥数を規模で割った指標で、例えば20件/10千行＝2件/千行です。試験の進捗や検出欠陥数を時系列で把握します。欠陥が少ないのは品質が高い場合も、検査が不十分な場合もあるため、複数の指標と要求を合わせて判断します。"}]},{"id":"12-X01","title":"設計・実装・モデリング","explain":"\u003cp>外部設計は利用者から見える機能・画面・入出力、内部設計は内部構造・処理・データ構造などを具体化する。UML（統一モデリング言語）のクラス図は静的構造、シーケンス図は時間順の相互作用、状態遷移図は状態変化、ユースケース図は利用者と機能の関係。DFD（データフロー図）はデータの流れを表す。\u003c/p>\u003cp>モジュール凝集度は内部の機能のまとまり、結合度はモジュール間依存。高凝集・低結合が変更の局所化に役立つ。実装・構築ではコーディング規約、例外処理、入力検証、再利用、静的解析、ビルド、環境設定、単体テストなどを行い、設計との追跡可能性を保つ。\u003c/p>","worked":"\u003cp>注文処理のシーケンス図で画面→業務処理→DBの呼出しを示せば、データ更新の責務やエラー応答を確認できる。\u003c/p>","prompt":"オブジェクト間のメッセージを時間順に表現するUML図は？","answer":"\u003cp>シーケンス図。\u003c/p>","beginner":{"scenario":"注文画面、注文サービス、DBの間で送られるメッセージを時系列に並べると、注文失敗時にどの処理が応答するか検討できる。","trap":"クラス図は構造、シーケンス図は相互作用、状態遷移図は状態変化。","quizId":"U-12-X01"},"textbook":[{"heading":"モデルを使う理由","body":"現実の業務やシステムには多くの要素があります。すべてを文章に書くと関連が分かりにくいため、着目点ごとにモデルを作ります。ユースケース図は利用者と提供機能の関係、クラス図はデータ構造等、シーケンス図は処理の順序、状態遷移図は状態の変化を示します。"},{"heading":"設計を実装につなげる","body":"コーディングでは変数名や関数の役割を明確にし、入力検証、例外処理、ログ、アクセス制御を考えます。共通機能は再利用し、依存ライブラリの利用条件と版を確認します。ビルドはソースを実行・配布可能な成果物へ変換する処理です。"},{"heading":"構成を選ぶ","body":"一体型のアプリは運用が単純な場合がありますが、大規模になると変更の影響が広がることがあります。マイクロサービスは機能ごとに独立したサービスへ分割する考え方ですが、通信、整合性、監視が複雑になります。設計は流行ではなく規模・品質要件・運用体制で選択します。"}]},{"id":"12-X02","title":"統合試験・移行・保守と廃棄","explain":"\u003cp>単体テスト後の結合テストはインタフェースを検証する。トップダウンでは未完成の下位モジュールをスタブで代替、ボトムアップでは呼出し元をドライバで代替する。システムテストは全体の要求適合、受入テストは利用者の受入条件を確認する。回帰テストは変更で既存機能が壊れていないか調べる。\u003c/p>\u003cp>導入時はデータ移行計画、照合、切戻し条件、教育を用意する。一斉移行は切替が短いがリスクが集中し、並行稼働は旧新両方を運用する負担がある。保守は是正・適応・完全化・予防などの目的に分類される。廃棄ではデータ消去、証跡、契約終了、資産台帳更新を行う。\u003c/p>","worked":"\u003cp>給与システムで旧新の計算結果を1か月並行照合してから切り替えると、不一致を本番切替前に発見できる。\u003c/p>","prompt":"ボトムアップ結合テストで上位の呼出し元を代替するものは？","answer":"\u003cp>ドライバ。\u003c/p>","beginner":{"scenario":"旧給与システムと新システムを1か月並行稼働し計算結果を照合する。不一致時は原因修正まで旧システムを維持する。","trap":"件数一致だけでは移行データの内容や参照関係の正しさを保証できない。","quizId":"U-12-X02"},"textbook":[{"heading":"テストを段階的に行う","body":"単体テストで個別部品、結合テストで部品同士の接続、システムテストでシステム全体、受入テストで利用者側の受入条件を確認します。トップダウン結合テストでは未完成の下位部品をスタブで代替し、ボトムアップでは呼出し元をドライバで代替します。"},{"heading":"移行で失敗しないために","body":"旧システムのデータを新形式へ変換し、件数だけでなく値の正しさ、一意性、参照整合性を確認します。一斉移行は一度で切替、段階移行は機能や拠点ごとに切替、並行稼働は旧新の結果を比較しながら切替を判断します。障害時の切戻し条件と手順を事前に決めます。"},{"heading":"保守から廃棄まで","body":"是正保守は不具合修正、適応保守は環境変化への対応、完全化保守は性能・機能などの改善、予防保守は将来の問題の予防を目的とします。廃棄では必要な記録を保全し、不要データを安全に消去し、契約や資産台帳を整理します。"}]},{"id":"12-Y01","title":"要求分析の道具とシステム境界","explain":"\u003cp>境界と要件・図の使い分け・合意と追跡を区別する。\u003c/p>","worked":"\u003cp>履修取消時、履修データを削除するのか、取消状態に更新するのかをCRUD表で確認する。履歴を保存するなら後者が適することがある。\u003c/p>","prompt":"学生と科目の多対多関係を示す図は？","answer":"\u003cp>ER図。DFDはデータの流れを示す。\u003c/p>","beginner":{"scenario":"大学の履修登録サービスを新しく作る。既存の認証サービスは作り直さないが、ログインの接続条件は決めなければならない。","trap":"データの流れとデータ構造は異なる。","quizId":"U-12-Y01"},"textbook":[{"heading":"境界と要件","body":"システム境界とは今回作る仕組みと、外部の人・システムを分ける線です。外部認証サービスの内部は対象外でも、接続仕様や障害時の対応は要件になります。5W2H（誰が、何を、なぜ、いつ、どこで、どのように、いくらで）を使い業務と例外を調べます。"},{"heading":"図の使い分け","body":"DFD（Data Flow Diagram：データフロー図）は処理、データの流れ、保管先、外部主体を表します。ER図（Entity Relationship Diagram：実体関連図）は学生と科目などのデータ間の関係を表します。CRUD（Create, Read, Update, Delete：作成・参照・更新・削除）表は業務とデータ操作を対応させ、操作漏れや矛盾を発見します。"},{"heading":"合意と追跡","body":"ユースケースは利用者が目標を達成する正常・例外のやり取り、ユーザーストーリーは誰が何をしたいかと価値を短く記述する方法です。水平型試作品は画面など広い範囲、垂直型試作品は一部機能の実現性を深く検証します。要件IDを設計とテストへ対応づけることで双方向の追跡が可能になります。"}]},{"id":"12-Y02","title":"品質特性とシステム構成の決定","explain":"\u003cp>設計の対象・八つの品質特性・構成と費用を区別する。\u003c/p>","worked":"\u003cp>検索を2秒以内にするのは性能効率性、読み上げソフトで操作できるようにするのは使用性（アクセシビリティ）に関係する。\u003c/p>","prompt":"別のOSへ移すための修正を減らす品質特性は？","answer":"\u003cp>移植性。\u003c/p>","beginner":{"scenario":"図書館の貸出を自動化する。身分確認は職員に任せ、貸出記録はシステムに保存する。","trap":"速さ、信頼性、保守性を区別する。","quizId":"U-12-Y02"},"textbook":[{"heading":"設計の対象","body":"システム設計では要件を機器、ソフトウェア、外部サービス、人の作業に配分します。ソフトウェア設計は画面、データ、処理、部品、接続仕様を具体化します。機器を追加すれば性能が改善する場合がありますが、費用と運用負担も考えます。"},{"heading":"八つの品質特性","body":"シラバスの八分類では機能適合性は必要機能の実現、性能効率性は時間・資源の効率、互換性は他製品との共存や情報交換、使用性は操作しやすさ、信頼性は故障への強さ、セキュリティは情報保護、保守性は修正しやすさ、移植性は他環境への移しやすさです。規格の版による名称の違いに注意します。"},{"heading":"構成と費用","body":"冗長化は停止の危険を減らせる一方、設備費・運用負担が増えます。IaaS（基盤提供）、PaaS（実行環境提供）、SaaS（アプリ提供）では利用者が管理する範囲も異なります。要求、リスク、費用、保守可能性を設計レビューで比較します。"}]},{"id":"12-Y03","title":"モジュールの結束性・結合度と設計手法","explain":"\u003cp>部品を分ける理由・結合の種類・分割手法を区別する。\u003c/p>","worked":"\u003cp>料金計算関数に商品価格と税率だけを渡せば、メール送信の仕組みを知らずに試験できる。\u003c/p>","prompt":"全モジュールで書換え可能な大域変数を共有すると独立性は上がるか？","answer":"\u003cp>一般には下がる。\u003c/p>","beginner":{"scenario":"注文処理の中にメール送信と料金計算が混ざっている。税率変更で通知が壊れないように分割する。","trap":"結束性は内側、結合度は外側。","quizId":"U-12-Y03"},"textbook":[{"heading":"部品を分ける理由","body":"モジュールは役割を持つプログラムのまとまりです。結束性（強度）は内部の処理が同一目的に集約される程度、結合度は部品同士の依存の程度です。一般には高い結束性と低い結合度を目指します。変更の影響を局所化できるためです。"},{"heading":"結合の種類","body":"機能的結束は一つの機能に必要な処理を集めることで、偶発的結束は無関係な処理を集めることです。データ結合は必要な値を引数で渡し、制御結合は相手の動作を指定するフラグなどを渡し、共通結合は共通領域を使います。共通データを書換える構造は変更影響が広がりやすくなります。"},{"heading":"分割手法","body":"プロセス中心設計は業務処理を起点に、DOA（Data Oriented Approach：データ中心アプローチ）はデータ構造を起点に設計します。STS（Source Transform Sink）分割は入力・変換・出力、TR（Transaction）分割は取引の種類別に分けます。共通機能分割では重複処理をまとめます。"}]},{"id":"12-Y04","title":"オブジェクト指向・ドメイン駆動設計・パターン","explain":"\u003cp>オブジェクトの基本・設計原則とパターン・ドメインをモデル化するを区別する。\u003c/p>","worked":"\u003cp>注文ID101の注文は住所を変更しても同じ注文。1,000円という金額は値が同じなら等しいと扱える。\u003c/p>","prompt":"支払方法によってアルゴリズムを取り替えるパターンは？","answer":"\u003cp>Strategy（戦略）。\u003c/p>","beginner":{"scenario":"決済方法が現金・カード・ポイントへ増える。注文処理を毎回全面修正しない設計を考える。","trap":"継承を用いれば自動的に良い設計になるわけではない。","quizId":"U-12-Y04"},"textbook":[{"heading":"オブジェクトの基本","body":"クラスは属性（データ）とメソッド（操作）の定義、インスタンスは具体的な実体です。カプセル化は内部を隠して公開操作で扱うこと、継承は親の性質を引き継ぐこと、多相性は共通の操作を異なる型で実行できることです。集約は全体と部分、汎化は共通概念を上位に抽出する関係です。"},{"heading":"設計原則とパターン","body":"SOLIDは単一責任、開放閉鎖、リスコフの置換、インタフェース分離、依存性逆転の五原則です。注文が決済の共通インタフェースに依存すれば方式を追加しやすくなります。生成パターンは作り方（Factory Method等）、構造パターンは組合せ方（Adapter等）、振舞いパターンは動作の切替（Strategy等）を整理します。"},{"heading":"ドメインをモデル化する","body":"DDD（Domain-Driven Design：ドメイン駆動設計）では業務専門家と共通の言葉を使って対象業務をモデル化します。エンティティはIDで同一性を判断し、値オブジェクトは値で判断します。境界づけられたコンテキストは用語やモデルの意味が一貫する範囲で、コンテキストマップは範囲間の関係を示します。"}]},{"id":"12-Y05","title":"実装標準・単体テスト・ミューテーション","explain":"\u003cp>実装とレビュー・入力と期待結果・テスト自体の評価を区別する。\u003c/p>","worked":"\u003cp>18歳以上を18歳超に変異させる。17歳と19歳の試験だけでは見つからないが18歳を含めると検出できる。\u003c/p>","prompt":"変異後も全テストが通ったらどう考える？","answer":"\u003cp>対象の変異についてテスト不足を疑う。\u003c/p>","beginner":{"scenario":"年齢判定を実装し、コードだけでなくテストが誤りを発見できるか調べる。","trap":"行の実行と誤りの検出は違う。","quizId":"U-12-Y05"},"textbook":[{"heading":"実装とレビュー","body":"モジュール仕様からコードを書き、単体試験、レビュー、文書更新を行います。命名、インデント、ネスト、禁止命令などをコーディング標準で統一します。静的解析は実行せずコードを調べ、デバッガは実行を停止して変数などを確認します。"},{"heading":"入力と期待結果","body":"テストオラクルは正否判定の根拠となる仕様や期待値です。原因結果グラフ法は入力条件と結果の論理関係から試験を作り、決定表は条件の組合せと結果を表にします。境界値分析は条件切替付近を、ファジングは多様な入力による異常を調べます。"},{"heading":"テスト自体の評価","body":"ミューテーションテストは小さな変更を入れたプログラムを作り、既存のテストで変異を検出できるか確かめます。命令網羅率100%でも、条件の境界や判定結果の組合せを十分検証したとは限りません。元と同じ振舞いの等価変異にも注意します。"}]},{"id":"12-Y06","title":"統合・検証・回帰テストと品質評価","explain":"\u003cp>試験対象の違い・回帰と再テスト・品質評価を区別する。\u003c/p>","worked":"\u003cp>料金誤りを修正したら該当計算を再テストし、割引・取消・返金なども回帰試験する。\u003c/p>","prompt":"上位機能から試験する場合の未完成の下位機能の代替は？","answer":"\u003cp>スタブ。\u003c/p>","beginner":{"scenario":"在庫と注文のサービスを接続する。個別には動いても、通信形式が違えば注文は失敗する。","trap":"回帰試験は修正箇所だけの確認ではない。","quizId":"U-12-Y06"},"textbook":[{"heading":"試験対象の違い","body":"単体試験は部品、統合試験は部品間の接続、ソフトウェア検証試験はソフトウェア要件、システム検証試験はシステム全体の要件との適合を確認します。トップダウン結合では呼出し先をスタブで、ボトムアップ結合では呼出し元をドライバで代用します。"},{"heading":"回帰と再テスト","body":"再テストは修正した不具合が直ったか、回帰試験は変更で既存機能が壊れていないかを調べます。負荷試験は利用量を増やし性能を確認します。どの試験も入力、環境、期待結果、担当者、実施記録を管理します。"},{"heading":"品質評価","body":"テスト密度は規模に対する試験数、欠陥密度は規模に対する欠陥数です。欠陥が少なくても試験が弱いだけかもしれません。試験範囲、欠陥傾向、重大度、要件との追跡関係を併せて評価し、修正と再試験、文書更新を行います。"}]},{"id":"12-Y07","title":"移行計画・検証と妥当性確認・受入れ","explain":"\u003cp>検証と妥当性確認・移行方式・移行の成功条件を区別する。\u003c/p>","worked":"\u003cp>利用者100人のうち5人だけに新版を提供しエラー率を観測してから拡大する。\u003c/p>","prompt":"仕様どおりだが利用目的が達成できない。何を確認する？","answer":"\u003cp>妥当性確認。\u003c/p>","beginner":{"scenario":"新しい予約サービスへ移行する。仕様どおりでも窓口業務が終わらなければ成功とはいえない。","trap":"検証と妥当性確認は別の問い。","quizId":"U-12-Y07"},"textbook":[{"heading":"検証と妥当性確認","body":"検証（Verification）は定めた仕様に適合して作れているか、妥当性確認（Validation）は実際の利用状況で目的を満たすかを評価します。受入試験は取得者が受入基準に照らして判断し、供給者は資料、環境、訓練等を提供して支援します。"},{"heading":"移行方式","body":"一斉移行は全体を一度に、段階移行は拠点や機能ごとに切替えます。並行稼働では新旧を同時運用します。カナリアリリースは一部利用者へ先行公開し、ブルーグリーンデプロイメントは二環境間でトラフィックを切替えます。データの互換性と切戻し可能性を別途確認します。"},{"heading":"移行の成功条件","body":"移行リハーサル、件数・金額・参照整合性の照合、バックアップ、切戻し条件、責任分担を事前に定めます。利用者訓練、窓口、運用文書も用意します。不合格事項は原因、修正、再試験を記録し、契約に沿って検収します。"}]},{"id":"12-Y08","title":"保守の分類・リファクタリングと安全な廃棄","explain":"\u003cp>目的で分類する・保守の流れ・廃棄の計画を区別する。\u003c/p>","worked":"\u003cp>新OSに合わせる作業は適応保守。潜在的なメモリリークを障害前に直すのは予防保守。\u003c/p>","prompt":"画面の動作を変えず重複コードを整理する作業は？","answer":"\u003cp>リファクタリング。\u003c/p>","beginner":{"scenario":"古い会計システムの改修と終了を計画する。動作中でも将来の障害を防ぐ作業が必要になる。","trap":"保守はすべてバグ修正ではない。","quizId":"U-12-Y08"},"textbook":[{"heading":"目的で分類する","body":"是正保守は既知の不具合修正、適応保守はOSや制度等の環境変化への対応、完全化保守は機能・性能・保守性の改善、予防保守は潜在的な問題を障害発生前に直すことです。作業内容だけでなく目的で区別します。"},{"heading":"保守の流れ","body":"問題登録、原因・影響・費用評価、承認、修正、試験、配布、記録を行います。リファクタリングは外部から観測できる振舞いを保ちつつ内部構造を改善します。リバースエンジニアリングは既存物の仕様等を解析し、リエンジニアリングは解析を踏まえ再構成します。"},{"heading":"廃棄の計画","body":"依存先、保存義務、利用者通知、代替サービスを確認します。必要データを移管し復元を検証し、不要記録・媒体を情報分類に合った方法で消去します。アカウント、鍵、ライセンス、資産台帳も整理します。"}]}],"beginnerIntro":"利用者が何を必要とするかを要求として整理し、設計、実装、試験、導入へつなげる。各工程で何を確認すべきかを考える。"},{"id":13,"title":"ソフトウェア開発管理技術","group":"テクノロジ","priority":"A標準","summary":"アジャイル、ウォーターフォール、CI/CD、構成管理、ライセンス。","lessons":[{"title":"開発プロセス","body":"ウォーターフォールは工程を段階的に進める。アジャイルは短い反復で顧客価値と学習を重視する。どちらも要件変更や品質の管理は必要。","check":"アジャイル＝計画なし・文書なしではない。"},{"title":"Scrumの基本","body":"Scrum（スクラム）ではプロダクトバックログを順序付けし、スプリントで増分を生み、レビューとレトロスペクティブで改善する。","check":"デイリースクラムは単なる進捗報告会にしない。"},{"title":"構成・変更管理","body":"バージョン管理は履歴を保つ。変更要求は影響分析・承認・実装・検証を経て反映する。ベースラインを定め、要求とコードと成果物の整合性を確保。","check":"版番号だけでなく変更理由と承認を追えるようにする。"},{"title":"CI/CD","body":"CI（Continuous Integration：継続的インテグレーション）は頻繁な統合と自動テスト。CD（Continuous Delivery/Deployment：継続的デリバリ／デプロイ）はリリース可能な状態を維持し必要に応じ自動配備する。","check":"テストが成功しても運用品質まで完全保証されない。"}],"terms":[{"term":"ウォーターフォール","definition":"開発工程を段階的に進めるプロセスモデル"},{"term":"アジャイル開発","definition":"短い反復と継続的なフィードバックを重視する開発手法"},{"term":"スクラム","definition":"役割・イベント・作成物を定めたアジャイル開発の枠組み"},{"term":"スプリント","definition":"スクラムで成果の増分を作る一定期間の活動"},{"term":"プロダクトバックログ","definition":"製品で実現すべき項目を優先順に並べた一覧"},{"term":"CI","definition":"頻繁なコード統合とビルド・テストの自動化"},{"term":"CD","definition":"ソフトウェアの配布やデプロイを継続的に行えるようにする仕組み"},{"term":"構成管理","definition":"成果物の構成・版・変更履歴を管理すること"},{"term":"ベースライン","definition":"管理・変更の基準となる確定された成果物の状態"},{"term":"技術的負債","definition":"短期的な実装上の妥協などが将来の変更費用を増やす状態"}],"questions":[{"id":"Q13-01","chapter":13,"kind":"applied","q":"CIの主目的として最も適切なのは。","options":["テストを省く","統合時の不整合を早期に検出する","承認手続きをすべてなくす","セキュリティ事故を完全防止する"],"correct":1,"explain":"頻繁な統合と自動テストにより問題を早く発見する。"},{"id":"Q13-02","chapter":13,"kind":"applied","q":"スクラムで利用者価値の優先順位が付いた要求一覧は。","options":["プロダクトバックログ","監査調書","変更ログのみ","決算書"],"correct":0,"explain":"プロダクトバックログは製品の仕事を表す。"},{"id":"Q13-03","chapter":13,"kind":"applied","q":"構成管理に適切なのは。","options":["最新版のみ保持し履歴を削除","版と変更履歴を追跡可能にする","本番のみでコード管理する","修正要求をすべて自動承認する"],"correct":1,"explain":"追跡可能性と整合性を保つ。"},{"id":"D13-01","chapter":13,"kind":"applied","q":"本番不具合が昨日のリリースから発生したとき、原因の再現性を高める情報はどれか。","options":["利用者の印象だけ","固定したコミットと依存バージョン・設定差分","常に最新のライブラリ","開発者数だけ"],"correct":1,"explain":"ソース・依存・設定・環境を特定できれば変更点を絞り込める。"},{"id":"D13-02","chapter":13,"kind":"applied","q":"FP法（ファンクションポイント法）で主に評価するものはどれか。","options":["ソースコードの行数","CPUのクロック周波数","利用者から見た機能規模","開発者の人数のみ"],"correct":2,"explain":"入力・出力・照会・論理ファイル・外部インタフェース等から機能規模を見積もる。"},{"id":"D13-03","chapter":13,"kind":"applied","q":"反復型開発の特徴として適切なものはどれか。","options":["変更を認めない","要件を一切書かない","試作と評価を繰り返し学習結果を反映する","品質テストを常に省く"],"correct":2,"explain":"小さな増分の評価を繰り返すが、テストや要件管理を不要にするわけではない。"},{"id":"Q-13-X01","chapter":13,"kind":"applied","q":"まず失敗するテストを書き、実装して通過させる開発技法は？","options":["TDD","RFI","EVM","OLAP"],"correct":0,"explain":"TDD（テスト駆動開発）。"},{"id":"U-13-1","chapter":13,"kind":"applied","q":"スクラムで次に開発する項目を優先順に並べる成果物は？","options":["プロダクトバックログ","監査調書","サービスカタログ","財務諸表"],"correct":0,"explain":"プロダクトバックログは製品に必要な作業の順序付きリスト。"},{"id":"U-13-2","chapter":13,"kind":"applied","q":"特定時点に承認済みの構成を固定し、以後の変更の基準とするものは？","options":["プロトタイプ","ベースライン","バックログ","ヒストグラム"],"correct":1,"explain":"ベースラインは正式に承認された構成の基準。"},{"id":"U-13-3","chapter":13,"kind":"applied","q":"入力・出力・ファイルなど利用者から見える機能の規模で見積る手法は？","options":["クリティカルパス法","最小二乗法","ファンクションポイント法","パリティ検査"],"correct":2,"explain":"機能量を複雑さなどで重み付けして規模を推定する。"},{"id":"U-13-X01","chapter":13,"kind":"applied","q":"開発と運用の協力・自動化・監視を重視する考え方は？","options":["ウォーターフォールのみ","SOA（サービス指向アーキテクチャ）","OLAP（オンライン分析処理）","DevOps"],"correct":3,"explain":"DevOpsは開発・運用の協力と継続改善を重視する。"}],"deepIntro":"開発プロセスや構成管理は、変更が多い環境でも品質と追跡可能性を保つ仕組み。","deep":[{"id":"13-1","title":"ウォーターフォール・反復・アジャイル","explain":"\u003cp>ウォーターフォールは工程を順に進め、成果物と承認を明確にしやすい。要件が安定し、検収条件を定めやすい案件と相性がよい。一方、後工程で要求が変わると手戻りが大きい。反復・増分型は小さく作って評価を反映し、アジャイルは顧客との協働と変化への適応を重視する価値観・実践の集合。\u003c/p>\n\u003cp>スクラムではプロダクトオーナーがプロダクトバックログの管理に責任を負い、スクラムマスターがフレームワークの理解と効果的な運用を支援し、開発者がインクリメントを作る。スプリントは固定長の反復で、レビューとレトロスペクティブの目的は異なる。\u003c/p>\n","worked":"\u003cp>利用者の操作方法を短期間で検証したいなら、画面のプロトタイプを小さく反復するのが合理的。ただし法令上の承認記録などは反復型でも省略しない。\u003c/p>\n","prompt":"アジャイルなら計画・文書・契約がすべて不要か。","answer":"\u003cp>違う。価値を生む範囲で必要な計画と記録を行う。\u003c/p>\n","beginner":{"scenario":"予約機能を短い反復で開発し、利用者が動く画面を試して次の優先順位を見直す。長期の仕様確定を待たず学習できる。","trap":"アジャイルでも計画、設計、テスト、記録が必要。無計画に実装する方法ではない。","quizId":"U-13-1"},"textbook":[{"heading":"開発手法の違い","body":"ウォーターフォールは要件、設計、実装、試験などの工程を順に進め、各段階の成果を確認します。要求が明確な場合に管理しやすい一方、後から大きく変わると手戻りが増えることがあります。反復型開発は短い周期で機能を実装し評価して見直します。"},{"heading":"アジャイルの仕組み","body":"アジャイルは変更に対応しながら利用可能な価値を継続的に届ける考え方です。スクラムではプロダクトバックログ（必要な作業の順序付き一覧）を管理し、スプリント（一定期間の反復）で成果を作り、レビューや振り返りで改善します。プロダクトオーナーは価値とバックログ、スクラムマスターはスクラムの有効性、開発者は成果の作成を担います。"},{"heading":"手法を選ぶ","body":"XP（エクストリームプログラミング）はペアプログラミング、テスト駆動開発、継続的統合等を重視します。プロトタイピングは試作品から要求を具体化し、スパイラルモデルは反復しながらリスクを分析します。アジャイルであっても品質・契約・安全性に必要な記録と検証は省略できません。"}]},{"id":"13-2","title":"バージョン管理・構成管理・変更管理","explain":"\u003cp>構成管理はソースコードだけでなく仕様書・設定・依存ライブラリ・成果物などの版と関係を追跡する。Gitのコミットは変更履歴の識別、ブランチは独立した作業系列、タグは特定時点のリリース参照に利用する。リリースに使ったコミットや依存バージョンを固定すると、実際の利用環境での再現性を高められる。\u003c/p>\n\u003cp>変更管理では変更要求→影響調査→承認→実施→検証→記録の流れを整える。問題が発生したとき「誰がいつ何を変えたか」「どの環境へ配布したか」を特定できることが重要。SCA（Software Composition Analysis：ソフトウェア構成要素分析）で依存関係の脆弱性・ライセンスを確認する。\u003c/p>\n","worked":"\u003cp>本番不具合が「昨日のデプロイから」発生した場合、変更一覧・コミットSHA・設定差分・依存解決結果を比較し、必要なら前版へ戻す。\u003ccode>latest\u003c/code>の参照では実体の再現性が弱い。\u003c/p>\n","prompt":"Gitに入っているから本番動作が必ず再現できるか。","answer":"\u003cp>できない。外部依存、データ、環境変数、実行環境なども影響する。\u003c/p>\n","beginner":{"scenario":"本番で障害が起きたとき、配布したソースの版・依存ライブラリ・設定値を特定できれば再現しやすい。","trap":"バージョン管理だけでは承認や影響評価ができない。変更管理も必要。","quizId":"U-13-2"},"textbook":[{"heading":"変更履歴だけでは足りない理由","body":"同じプログラムでも版、設定、依存ライブラリが異なれば動作が変わります。構成管理は成果物を識別し、それらの版や関係、状態を管理する活動です。ベースラインは承認済みの構成を基準として固定したものです。"},{"heading":"バージョン管理","body":"Gitなどでは変更のまとまりをコミットとして記録し、ブランチで作業を分け、マージで変更を統合します。コンフリクトが発生した場合は内容を確認して解決します。いつ誰が何を変えたか追跡でき、必要に応じて以前の版へ戻せます。"},{"heading":"変更管理","body":"変更要求を受けたら目的、影響範囲、費用、リスク、試験方法を評価し、権限者の承認を得ます。実施後に構成情報・文書を更新し結果を確認します。変更履歴を保存するだけでは変更の妥当性や承認は保証されません。"}]},{"id":"13-3","title":"開発見積り・品質・リスク","explain":"\u003cp>工数見積りには類推、専門家判断、ファンクションポイント法、モデルによる推定などがある。ファンクションポイントは入力、出力、照会、内部論理ファイル、外部インタフェースファイル等を数え、機能規模の目安を算出する。COCOMO系のモデルは規模などから工数を推定する。どの方法も前提・不確実性を明示することが大切。\u003c/p>\n\u003cp>不具合密度は件数/規模などで示すが、検査条件の異なるチーム間で機械的に比較しない。リスクは発生可能性と影響度で評価し、優先順位に応じて予防・検知・回避策を計画する。\u003c/p>\n","worked":"\u003cp>作業量が40人日なら2人で20日とは限らない。タスクの並列化可能性、作業者の調整コスト、手戻りを加味する。短縮可能な工程とクリティカルパスを分ける。\u003c/p>\n","prompt":"ファンクションポイントの大きさはプログラミング言語と行数で決まるか。","answer":"\u003cp>主に利用者から見た機能の規模を測る。言語・コード行数とは異なる。\u003c/p>\n","beginner":{"scenario":"画面10個を1個2人日で作るなら実装見積り20人日。設計、試験、レビュー、調整などの作業も見積りに含める。","trap":"過去の生産性は条件が違うと使えない。見積りの前提と不確実性を明記する。","quizId":"U-13-3"},"textbook":[{"heading":"何を見積もるか","body":"規模は成果物の大きさ、工数は人が作業する量、期間は開始から終了までの時間、費用は人件費や設備等の支出です。40人日を4人で作業しても必ず10日で終わるわけではなく、作業依存関係や調整時間があります。"},{"heading":"見積りの方法","body":"類推見積りは似た過去案件を参考にし、積上げ見積りは作業ごとに見積って合計します。ファンクションポイント法は入力・出力・照会・論理ファイル等の機能量を数え、複雑さなどで重み付けして規模を推定します。COCOMOはソフトウェア規模等を使う経験的な工数推定モデルです。"},{"heading":"不確実性への対応","body":"楽観値、最頻値、悲観値など複数の想定で見積り、前提条件を記録します。リスクの高い技術を先に試し、実績から計画を更新します。見積りを確定値と扱わず、進捗や品質指標とともに管理します。"}]},{"id":"13-X01","title":"開発プロセス・知財・環境管理","explain":"\u003cp>XP（エクストリームプログラミング）はテスト駆動開発、ペアプログラミング、小さなリリースなどを重視する。スクラムでは短い反復で成果と計画を検査・適応する。DevOps（開発と運用の連携）は自動化・監視・協力で価値提供を改善する。リバースエンジニアリングは既存ソフトの構造を解析し、再構築に活用する場合がある。\u003c/p>\u003cp>知的財産適用管理では外部部品のライセンス・契約・利用条件・特許などを確認する。開発環境管理は開発・試験・本番の分離、ツールの版固定、依存関係、アクセス権、リポジトリ、再現可能なビルドを管理する。構成管理は成果物と版・関係を識別し、変更管理は要求・影響評価・承認・実施を管理する。\u003c/p>","worked":"\u003cp>開発チームが使用ライブラリの版とライセンスを一覧化し、本番の依存関係を再現できるようにする。\u003c/p>","prompt":"まず失敗するテストを書き、実装して通過させる開発技法は？","answer":"\u003cp>TDD（テスト駆動開発）。\u003c/p>","beginner":{"scenario":"本番環境だけで動かない不具合を避けるため、依存ライブラリの版を固定し、同じ条件でビルドと試験を行う。","trap":"外部コードを利用できることと自由に再配布できることは別。","quizId":"U-13-X01"},"textbook":[{"heading":"開発と運用をつなぐ","body":"開発チームが機能を作り運用チームが受け取るだけでは、配布時の設定不一致や障害時の調査不足が起きやすくなります。DevOps（開発と運用の連携）は共通の目標、情報共有、自動化、監視、改善を重視します。"},{"heading":"再現可能な環境","body":"開発・試験・本番環境を分離し、設定やツールの版、依存関係、ビルド手順を管理します。本番の秘密情報を公開リポジトリに保存しないようにします。自動テストや配布を行う際も承認・権限・障害時の切戻しを考えます。"},{"heading":"知的財産と既存資産","body":"外部ソフトウェアのライセンス、契約、特許等の利用条件を確認します。リバースエンジニアリングは既存成果物の構造や仕様を解析すること、リエンジニアリングは解析結果を基に改善・再構築することです。利用の可否は契約や法令を含め判断します。"}]},{"id":"13-Y01","title":"開発プロセス・形式手法・成熟度","explain":"\u003cp>共通の作業体系・数学的に仕様を表す・プロセス改善を区別する。\u003c/p>","worked":"\u003cp>担当者が替わっても品質を保てるよう、標準の試験手順と記録を整え、欠陥傾向を分析して改善する。\u003c/p>","prompt":"モデル検査に成功すれば現実の実装も必ず安全か？","answer":"\u003cp>モデルと実装・環境の一致は別途確認が必要。\u003c/p>","beginner":{"scenario":"開発品質が担当者の経験に左右される。個人だけでなく組織の作り方を改善する。","trap":"成熟度はソフトウェアの版番号ではない。","quizId":"U-13-Y01"},"textbook":[{"heading":"共通の作業体系","body":"SLCP（Software Life Cycle Process：ソフトウェアライフサイクルプロセス）は取得・供給・開発・運用・保守などの活動を体系化します。共通フレームは関係者の役割認識をそろえます。テーラリング（修整）は規模・契約・リスクに応じプロセスを適合させることです。"},{"heading":"数学的に仕様を表す","body":"形式手法は数学的記法で仕様や性質を明確にします。VDM-SL（Vienna Development Method Specification Language）やZ言語は形式仕様記述の例です。モデル検査は状態と遷移を調べ、性質を破る反例を探します。モデル自体が現実と異なる可能性には注意します。"},{"heading":"プロセス改善","body":"プロセス能力は未達成、実施、管理、確立、予測可能、革新へ段階的に高まる考え方があります。CMMI（Capability Maturity Model Integration：能力成熟度モデル統合）は組織のプロセス改善に使われます。能力水準と成熟度レベルは評価モデルにより区別されるため、段階数を一律に同じとみなしません。"}]},{"id":"13-Y02","title":"再利用・マッシュアップ・モバイル開発","explain":"\u003cp>再利用の種類・サービス連携・モバイル開発を区別する。\u003c/p>","worked":"\u003cp>店舗情報APIの障害時にも地図画面は表示し、店舗一覧が取得できないと通知する。\u003c/p>","prompt":"PWAなら全端末機能に無条件でアクセスできるか？","answer":"\u003cp>できない。OS・ブラウザ対応や権限による。\u003c/p>","beginner":{"scenario":"地図と店舗情報のサービスを組み合わせてアプリを開発する。","trap":"再利用でも品質と権利の確認が必要。","quizId":"U-13-Y02"},"textbook":[{"heading":"再利用の種類","body":"ブラックボックス部品は内部を知らず公開仕様で利用し、ホワイトボックス部品は内部を理解・修正して利用します。ライブラリ、クラス、データ、業務処理の再利用は工数を減らせますが、仕様適合性、品質、保守期限、ライセンスの確認は必要です。"},{"heading":"サービス連携","body":"マッシュアップは複数提供元のAPI（Application Programming Interface：機能やデータを外部から利用する接点）を組み合わせ新しいサービスを作る方法です。呼出し回数制限、応答遅延、契約変更、外部障害に備えます。"},{"heading":"モバイル開発","body":"ネイティブアプリは端末OS向け、Webアプリはブラウザで動き、ハイブリッドアプリはWeb技術とネイティブ機能を組み合わせます。PWA（Progressive Web Apps：プログレッシブWebアプリ）は対応環境でホーム画面追加やオフライン機能を提供できます。画面サイズ、通信断、権限、配布条件も考慮します。"}]},{"id":"13-Y03","title":"ソフトウェア知財とライセンス・技術的保護","explain":"\u003cp>著作権と特許権・ライセンス管理・技術的保護を区別する。\u003c/p>","worked":"\u003cp>外注プログラムの納品を受けただけでは著作権を当然に取得したとはいえない。\u003c/p>","prompt":"無料ライブラリの著作権表示は自由に削除できるか？","answer":"\u003cp>ライセンスによる。\u003c/p>","beginner":{"scenario":"外注したプログラムと外部ライブラリを商品へ組み込む。","trap":"無償利用と無条件利用は異なる。","quizId":"U-13-Y03"},"textbook":[{"heading":"著作権と特許権","body":"プログラムの具体的表現は著作権の保護対象になり得ます。職務著作は法定要件を満たすと法人等が著作者になります。外注では権利帰属、譲渡範囲、利用許諾を契約で確認します。特許は技術的発明の登録による権利で、自社で独立に実装しても他人の特許を侵害し得ます。"},{"heading":"ライセンス管理","body":"ライセンサーは許諾する側、ライセンシーは受ける側です。用途、再配布、改変、利用人数、期間、表示義務などを調べます。OSS（Open Source Software：オープンソースソフトウェア）も条件があります。MITライセンスは所定の著作権・許諾表示を維持し、GPL系は配布形態に応じソース提供などの義務が生じる場合があります。"},{"heading":"技術的保護","body":"DRM（Digital Rights Management：デジタル著作権管理）は暗号化や利用権確認で複製・再生等を制御します。アクティベーションは正規利用の登録・確認、コピーガードは無断複製の抑制を目的とします。技術的保護と権利・契約の管理は別です。"}]},{"id":"13-Y04","title":"開発環境・ツール・設計データ管理","explain":"\u003cp>環境を分離する・再現可能な構成・利用実態の管理を区別する。\u003c/p>","worked":"\u003cp>5人分の利用者ライセンスを7人が使う場合、契約に照らし追加購入や利用停止を検討する。\u003c/p>","prompt":"ソースだけ保存すればビルドは必ず再現できるか？","answer":"\u003cp>依存関係、版、設定、手順も必要。\u003c/p>","beginner":{"scenario":"同じコードでも担当者のPCによって動作が異なる。","trap":"本番相当と本番は異なる。","quizId":"U-13-Y04"},"textbook":[{"heading":"環境を分離する","body":"開発環境は実装、試験環境は検証、ステージング環境は本番に近い最終確認、本番環境は実利用のために用います。本番への直接変更権限を制限し、試験データの個人情報はマスクします。環境差は明示して管理します。"},{"heading":"再現可能な構成","body":"コンパイラ、依存ライブラリ、OS、設定、ツールの版を管理し、ビルド手順を記録します。SCM（Source Code Management：ソースコード管理）は変更履歴を追跡します。計算資源の稼働状況や不足も管理し、ツールの脆弱性にも対応します。"},{"heading":"利用実態の管理","body":"設計書や試験データの版、更新者、権限、持出し、変更履歴を記録します。ライセンスは利用者、機器、同時利用など契約単位に応じて使用状況を棚卸しします。構築の自動化に使う秘密鍵やトークンは公開せず安全に管理します。"}]},{"id":"13-Y05","title":"構成管理・SBOM・リリースの完全性","explain":"\u003cp>構成識別とベースライン・SBOMの目的・完全性とリリースを区別する。\u003c/p>","worked":"\u003cp>部品X2.0に問題があり、部品表でアプリv1.4がX2.0を使うと分かった。v1.4を優先調査する。\u003c/p>","prompt":"試験済みコードと配布されたコードの版が違うとき何を確認する？","answer":"\u003cp>構成の物理的完全性とリリースの版の一致。\u003c/p>","beginner":{"scenario":"ライブラリの脆弱性が発覚した。配布中のどの版が影響を受けるか確認する。","trap":"SBOMは自動修正機能ではない。","quizId":"U-13-Y05"},"textbook":[{"heading":"構成識別とベースライン","body":"構成品目は管理対象として識別されたソース、設定、設計書、試験結果などです。ベースラインはレビューや承認を経て変更管理の基準として確立した構成です。品目の版、対応関係、変更理由、承認者、配布先を記録します。バージョン管理は履歴、構成管理は製品全体の組合せを扱います。"},{"heading":"SBOMの目的","body":"SBOM（Software Bill of Materials：ソフトウェア部品表）は製品に含まれる部品と版などを一覧化したものです。間接依存関係も追跡すれば脆弱性公表時に影響を絞れます。ただし部品表だけで脆弱性は解消されません。影響分析、更新、試験が別途必要です。"},{"heading":"完全性とリリース","body":"変更要求を登録、影響分析、承認、実装、試験し構成を更新します。機能的完全性は要求された機能等を満たすか、物理的完全性は必要なファイル・版・文書が揃い実物と記録が一致するかです。配布成果物を試験済みの版と対応づけ、切戻し可能にします。"}]}],"beginnerIntro":"ソフトウェアをどの手順・体制で開発するかを学ぶ。開発手法、構成の識別、変更の承認を区別する。"},{"id":14,"title":"プロジェクトマネジメント","group":"マネジメント","priority":"B選択候補","summary":"WBS、PERT、クリティカルパス、EVM、リスク・品質・調達。","lessons":[{"title":"スコープとWBS","body":"WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を管理可能な単位に分解する。完了条件・責任分担・依存関係を明確にする。","check":"工数表とWBSは同一ではない。"},{"title":"工程とクリティカルパス","body":"PERT（Program Evaluation and Review Technique：工程計画・評価技法）のネットワーク図で最長の所要経路がクリティカルパス。この経路の遅延は余裕がなければ全体遅延につながる。","check":"並行タスクの所要時間は単純な合計ではない。"},{"title":"進捗の定量評価","body":"EVM（Earned Value Management：出来高管理）でPV（計画価値）、EV（出来高）、AC（実コスト）を比較。CV=EV−AC、SV=EV−PV、CPI=EV/AC、SPI=EV/PV。","check":"符号の意味と、値が1より大きいか小さいかを解釈。"},{"title":"リスクと調達","body":"リスクは発生確率×影響度などで優先付け。対応は回避・低減・移転・受容。契約形態が変わると発注者と受注者のリスク負担が変わる。","check":"問題が起きてからの対応と事前リスク対応を分ける。"},{"title":"ステークホルダ","body":"関係者の権限、関心、コミュニケーション要件を把握する。変更要求の影響分析では費用・日程・品質・セキュリティに波及する部分を検討。","check":"単に全員に同じ資料を配るだけでは不十分。"}],"terms":[{"term":"WBS","definition":"成果物や作業を小さな単位へ階層的に分解する図"},{"term":"クリティカルパス","definition":"工程ネットワーク上で全体期間を決める最長経路"},{"term":"フロート","definition":"作業が遅れても全体完了を遅らせない余裕時間"},{"term":"PV","definition":"計画時点までに完了予定の作業に対応する予算価値"},{"term":"EV","definition":"実際に完了した作業を予算で評価した出来高"},{"term":"AC","definition":"実際に発生したコスト"},{"term":"CPI","definition":"コスト効率指数。EV÷AC"},{"term":"SPI","definition":"スケジュール効率指数。EV÷PV"},{"term":"リスク低減","definition":"起こる確率や被害の大きさを抑える対応"},{"term":"ステークホルダ","definition":"プロジェクトに影響する・影響を受ける利害関係者"}],"questions":[{"id":"Q14-01","chapter":14,"kind":"applied","q":"EV=80、AC=100、PV=90のときCPIは。","options":["0.8","0.9","1.1","1.25"],"correct":0,"explain":"CPI=EV/AC=0.8。予算超過方向。"},{"id":"Q14-02","chapter":14,"kind":"applied","q":"クリティカルパスの説明で正しいのは。","options":["作業数が最少の経路","遅延が全体日程に直結する経路","費用が最多の経路","人員数が最多の経路"],"correct":1,"explain":"全体工期を規定する経路は余裕時間がゼロになる。"},{"id":"Q14-03","chapter":14,"kind":"applied","q":"リスクに備えて保険へ加入することは主に。","options":["回避","低減","移転","受容"],"correct":2,"explain":"被害の金銭的負担を保険会社へ移す。"},{"id":"D14-01","chapter":14,"kind":"applied","q":"PV=100万円、EV=80万円、AC=120万円のとき、費用差異CVはいくらか。","options":["−40万円","−20万円","20万円","40万円"],"correct":0,"explain":"CV=EV−AC=80−120=−40万円。負の値は費用超過を示す。"},{"id":"D14-02","chapter":14,"kind":"applied","q":"並行経路A→C→Eが9日、B→D→Eが10日なら、資源制約を無視した最低完了日数はどれか。","options":["8日","9日","10日","19日"],"correct":2,"explain":"最長経路が完了を支配するので10日。短縮対象はクリティカルパス。"},{"id":"D14-03","chapter":14,"kind":"applied","q":"クリティカルパス以外の余裕のある作業を1日短縮した場合、通常どうなるか。","options":["必ず1日早く終わる","全体工期が変わらないことがある","品質が必ず向上する","工数は必ず2倍になる"],"correct":1,"explain":"工期は余裕ゼロの経路に依存するため、非クリティカル作業の短縮は工期に影響しない場合がある。"},{"id":"Q-14-X01","chapter":14,"kind":"applied","q":"変更要求の費用・納期・品質への影響を全体として調整する管理は？","options":["統合管理","時間管理のみ","調達管理のみ","構成管理のみ"],"correct":0,"explain":"統合管理。"},{"id":"Q-14-X02","chapter":14,"kind":"applied","q":"リスクを保険により外部に移す対応は？","options":["回避","低減","移転","受容"],"correct":2,"explain":"リスク移転。"},{"id":"U-14-1","chapter":14,"kind":"applied","q":"A-B-Dが10日、A-C-Dが7日で他制約なし。Cの総余裕は？","options":["3日","7日","10日","0日"],"correct":0,"explain":"Cを3日遅らせてもDの開始は変わらない。"},{"id":"U-14-2","chapter":14,"kind":"applied","q":"PV100、EV80、AC90万円のSPI（スケジュール効率指数）は？","options":["0.89","0.8","1.25","1.125"],"correct":1,"explain":"SPI=EV/PV=0.8。0.89はCPI（コスト効率指数）に近い。"},{"id":"U-14-3","chapter":14,"kind":"applied","q":"作業ごとに実行・説明責任・相談・報告先を整理する表は？","options":["RAID","BSC（バランストスコアカード）","RACI（役割分担表）","ER図"],"correct":2,"explain":"RACIはResponsible、Accountable、Consulted、Informedの役割を整理する。"},{"id":"U-14-X01","chapter":14,"kind":"applied","q":"費用・期間・範囲・品質を横断して変更を調整する管理は？","options":["時間管理のみ","資源管理のみ","調達管理のみ","統合管理"],"correct":3,"explain":"統合管理は複数領域の計画や変更を整合させる。"},{"id":"U-14-X02","chapter":14,"kind":"applied","q":"6人全員が互いに直接連絡する組合せは？","options":["15","6","12","36"],"correct":0,"explain":"n(n−1)/2=6×5/2=15。方向を区別しない経路数。"}],"deepIntro":"計画を立てることだけが管理ではない。進捗・費用・品質・リスクを測り、変化が起きたときの意思決定まで行う。","deep":[{"id":"14-1","title":"WBS・スケジュール・クリティカルパス","explain":"\u003cp>WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を管理可能な単位に分解する。見積り、担当、実績を対応付ける基礎となる。ガントチャートは日程、アローダイアグラム（PERT）は作業の先行関係と所要時間を示す。最早開始時刻ESと最遅開始時刻LSの差が余裕（フロート）。プロジェクト完了までの所要時間を決める余裕ゼロの経路をクリティカルパスという。\u003c/p>\n","worked":"\u003cp>A(3日)→C(4日)→E(2日)で9日、B(5日)→D(3日)→E(2日)で10日の2経路があるとき、両経路のEが共通の作業なら最長経路10日が完了日を決める。短縮するなら原則クリティカルパス上の作業を対象にする。資源制約がある場合は単純な最長経路だけでは決まらない。\u003c/p>\n","prompt":"クリティカルパス以外の作業を1日短縮すると、必ず完成が1日早まるか。","answer":"\u003cp>ならない。余裕のある作業を短縮しても全体完了時間は変わらない場合がある。\u003c/p>\n","beginner":{"scenario":"Aが2日、A後にBが5日とCが2日を並行実施、両方終了後にDが3日。A-B-Dは10日、A-C-Dは7日。最長経路が全体工期を決める。","trap":"クリティカルパスは最短経路ではなく、依存関係上最長の所要時間の経路。","quizId":"U-14-1"},"textbook":[{"heading":"作業を分けて依存関係を描く","body":"WBS（Work Breakdown Structure：作業分解構成図）は成果物や必要な作業を階層的に分け、担当と見積りを具体化するためのものです。作業間の開始・終了条件はネットワーク図で表し、ガントチャートは横棒で期間を示します。"},{"heading":"クリティカルパスを計算する","body":"Aの終了後にBとCを並行し、両方の終了後にDを実施する場合、各経路の期間を足します。A=2日、B=5日、C=2日、D=3日ならA-B-Dは10日、A-C-Dは7日。全体工期は最長の10日です。Cを3日遅らせてもDの開始は変わらないので余裕があります。"},{"heading":"工期を短縮する","body":"クリティカルパス上の作業を短縮することが基本です。クラッシングは追加資源で作業を短縮、ファストトラッキングは本来順次の作業を一部並行化する方法です。費用増加や手戻りのリスクを評価し、短縮後はクリティカルパスを再計算します。"}],"walkthrough":{"heading":"最早時刻と最遅時刻を計算する","body":"Aは2日、A後にB（5日）とC（2日）、BとCの両方が終わってからD（3日）を実施します。時刻0から始め、最早開始はA=0、B=C=2、D=max(7,4)=7、終了10です。終了時刻10を固定して後ろから戻るとDは7開始、Bは2開始、Cは5開始まで許容されます。AはBとCの両方に間に合わせる必要があるので最遅開始0です。最遅開始と最早開始の差が総余裕時間です。Cは3日、それ以外は0日なのでA-B-Dがクリティカルパスです。","cols":["作業","所要日数","最早開始","最遅開始","総余裕"],"rows":[["A","2","0","0","0"],["B","5","2","2","0"],["C","2","2","5","3"],["D","3","7","7","0"]]}},{"id":"14-2","title":"EVM・進捗と費用の統合管理","explain":"\u003cp>EVM（Earned Value Management：出来高管理）は、計画価値PV（Planned Value：計画した作業の予算価値）、出来高EV（Earned Value：実際に完了した作業の予算価値）、実コストAC（Actual Cost：実際の支出）で管理する。進捗差異SV＝EV−PV、費用差異CV＝EV−AC。進捗効率SPI＝EV/PV、費用効率CPI＝EV/AC。負の差異や1未満の指数は予定超過・費用超過を示す。\u003c/p>\n\u003cp>BAC（Budget at Completion：完成時総予算）、EAC（Estimate at Completion：完成時総費用見積り）を使い、現在の効率が続くという\u003cstrong>仮定\u003c/strong>のもとでEAC≈BAC/CPIと予測することがある。\u003c/p>\n","worked":"\u003cp>PV=100万円、EV=80万円、AC=120万円ならSV=−20万円（計画に対し作業遅れ）、CV=−40万円（出来高に対し費用超過）。SPI=0.8、CPI≈0.667。ACとPVを直接比べて進捗を判断しない。\u003c/p>\n","prompt":"EV=PVであればコストは必ず予定どおりか。","answer":"\u003cp>違う。EVは出来高の予算価値。ACがEVより大きければ費用超過。\u003c/p>\n","beginner":{"scenario":"予算100万円分の作業を予定し、実際に80万円分を完成、費用90万円。計画との差EV−PV=−20万円、費用差EV−AC=−10万円。","trap":"EVは実際に使った金額ではなく、完成した作業の予算上の価値。","quizId":"U-14-2","lab":{"title":"EVMの値を一つずつ解釈する","problem":"PV（計画価値）120万円、EV（出来高）90万円、AC（実コスト）100万円。進捗・コストの差と効率を求める。","steps":["PVは現在までに予定した作業の予算価値、EVは実際に完了した作業の予算価値、ACは実際に支払った費用。","SV=EV−PV=90−120=−30万円。進捗が計画より遅れている。","CV=EV−AC=90−100=−10万円。費用効率が悪い。","SPI=EV/PV=0.75、CPI=EV/AC=0.9。どちらも1未満。"],"answer":"SV−30万円、CV−10万円、SPI0.75、CPI0.9","check":"EVを実費と取り違えない。SVは金額で表したスケジュール差であり遅延日数ではない。"}},"textbook":[{"heading":"出来高を金額で表す理由","body":"作業ごとに規模と予算が違うため、単に作業数で進捗を測ると正確ではないことがあります。EVM（Earned Value Management：出来高管理）は計画・実績を予算上の価値で比較します。PVは現在までに予定した作業の予算価値、EVは完了した作業の予算価値、ACは実際に掛かった費用です。"},{"heading":"差と効率を計算する","body":"SV=EV−PVはスケジュール差、CV=EV−ACはコスト差です。SPI=EV/PV、CPI=EV/ACは効率指数で、1未満は計画に対する遅れ・コスト効率悪化を示します。PV100、EV80、AC90ならSV−20、CV−10、SPI0.8、CPI約0.89。SVは金額単位で日数ではありません。"},{"heading":"将来の費用を見積もる","body":"BACは完了時の予算総額、EACは完了時の見積り総費用、ETCは残作業の見積り費用です。現在の費用効率が続くと仮定する場合、EAC=BAC/CPIなどで予測します。残作業の条件が変わる場合は別の見積り方法を使います。式の前提を問題文で確認します。"}]},{"id":"14-3","title":"人的資源・コミュニケーション・ステークホルダー","explain":"\u003cp>プロジェクトには発注者、利用者、開発者、運用担当、監督官庁など立場の違う関係者がいる。利害・意思決定権限・期待・必要情報を整理し、コミュニケーション計画を定める。変更要求をそのまま実装するとスコープクリープ（範囲の無秩序な拡大）が起きるため、影響分析と承認を通す。\u003c/p>\n\u003cp>リスク登録簿には原因、発生確率、影響、兆候、責任者、対応策を記録する。品質・納期・予算のトレードオフで、何を守るべきか合意する。メンバー増員で必ず工期短縮するわけではなく、教育・調整・並列化の限界がある。\u003c/p>\n","worked":"\u003cp>開発終盤に追加帳票を要求された場合、工数・運用・受入試験への影響を見積り、変更管理で承認し、基準計画を更新する。担当者判断で納期を維持すると品質低下を招く可能性がある。\u003c/p>\n","prompt":"リスクが発生した後に記録するものだけをリスク登録簿と呼ぶか。","answer":"\u003cp>違う。未発生のリスクを先に特定し対策を計画する。\u003c/p>\n","beginner":{"scenario":"開発者と利用部門で要求の解釈が違えば手戻りが生じる。誰が実行・承認し、誰に相談・報告するかを明確にする。","trap":"関係者全員に全情報を送るだけでは適切なコミュニケーション管理にならない。","quizId":"U-14-3"},"textbook":[{"heading":"誰が何をするか","body":"プロジェクトには開発者、利用部門、責任者、委託先など多くのステークホルダ（利害関係者）がいます。必要な技能・人数・時期を計画し、過負荷や待ち時間を調整します。作業の実行者、最終責任者、相談先、報告先をRACI（役割分担表）などで明確にします。"},{"heading":"情報共有の設計","body":"全員に全情報を送るのではなく、相手ごとに必要な情報・頻度・方法を決めます。問題や変更要求を早期に記録し、責任者が判断できる形で報告します。n人の全組合せの通信経路はn(n−1)/2なので人数増加に伴い調整の負担も増えます。"},{"heading":"対立を解決する","body":"期限、費用、品質などに関する利害の違いを整理し、目的と判断基準を共有します。要求変更時には承認と影響評価を行い、決定事項と未決事項を区別します。人的資源の追加が必ず工期短縮になるわけではありません。"}]},{"id":"14-X01","title":"プロジェクト管理の体系と統合","explain":"\u003cp>プロジェクトは期限と独自の成果を持つ活動。PMBOK（プロジェクトマネジメント知識体系ガイド）は代表的な知識体系で、PMO（プロジェクト管理支援組織）は標準化や進捗支援を担う。立上げ・計画・実行・監視管理・終結を通じ、統合、ステークホルダ、スコープ、資源、時間、コスト、リスク、品質、調達、コミュニケーションを管理する。\u003c/p>\u003cp>統合管理は複数領域の計画・変更を整合させる。スコープは成果物と作業の範囲で、WBS（作業分解構成図）で作業を階層化する。資源管理では人材・設備の必要量・利用可能性を把握し平準化する。ステークホルダには関心と影響力に応じ情報共有や参画を調整する。\u003c/p>","worked":"\u003cp>納期短縮要求があれば人員費・品質・他プロジェクトへの影響を評価し、承認された変更を統合計画に反映する。\u003c/p>","prompt":"変更要求の費用・納期・品質への影響を全体として調整する管理は？","answer":"\u003cp>統合管理。\u003c/p>","beginner":{"scenario":"納期を1か月短縮すると追加費用や品質低下のリスクが生じる。変更要求を受けたら関連する計画を同時に見直す。","trap":"一つの指標だけ最適化してもプロジェクト全体が改善するとは限らない。","quizId":"U-14-X01"},"textbook":[{"heading":"プロジェクトと定常業務","body":"プロジェクトは期限を持ち独自の成果を作る活動、定常業務は継続的に繰返される活動です。立上げで目的・責任者・権限を明確にし、計画で範囲、日程、費用、品質等を決めます。実行・監視で実績と計画を比較し、終結で成果の受入・記録・教訓を整理します。"},{"heading":"管理体系","body":"PMBOKはプロジェクトマネジメントの知識体系ガイド、PMOは組織内で標準化・支援・監視等を担うプロジェクト管理支援組織です。統合管理は個別計画と変更を整合させます。スコープ管理では成果物・作業の範囲を決め、承認されない範囲拡大を防ぎます。"},{"heading":"変更の判断","body":"利用者から機能追加の要求が来たら、必要性だけでなく期間、費用、品質、リスク、資源への影響を評価します。承認された場合は計画・設計・テストを更新します。要求の受付と実施決定を区別することで無計画な追加を防ぎます。"}]},{"id":"14-X02","title":"リスク・品質・調達・コミュニケーション管理","explain":"\u003cp>リスクは発生可能性と影響を評価し、回避・低減・移転・受容などの対応を決め、担当・期限をリスク登録簿に記録する。品質管理では要求品質、品質保証、検査、改善を区別し、欠陥密度や管理図で異常を調べる。品質コストには予防・評価・内部失敗・外部失敗の費用がある。\u003c/p>\u003cp>調達管理では内製か外注か、契約方式、選定基準、検収、契約変更を扱う。固定価格契約では範囲変更の管理が重要、実費精算型はコストの監視が重要。コミュニケーション管理は誰に何をいつどの媒体で伝えるか決める。n人が全員相互通信する経路はn(n−1)/2。\u003c/p>","worked":"\u003cp>6人のチームの相互通信経路は15。1人追加すると21となり6経路増える。\u003c/p>","prompt":"リスクを保険により外部に移す対応は？","answer":"\u003cp>リスク移転。\u003c/p>","beginner":{"scenario":"外注先の遅延リスクに対し別業者を確保するのは低減、危険な機能を中止するのは回避、保険は移転の例。","trap":"リスクを受容する場合も判断者、条件、監視方法を決める。","quizId":"U-14-X02"},"textbook":[{"heading":"リスクを扱う","body":"リスクは将来の不確実な事象で、発生可能性と影響から優先度を決めます。回避は原因となる活動をやめ、低減は可能性・影響を抑え、移転は保険や契約等で分担し、受容は対策費との比較などから認める判断です。リスク登録簿に担当者・対応・監視条件を記録します。"},{"heading":"品質の計画と評価","body":"品質管理では要求する品質基準と測定方法を定め、プロセスの妥当性を確認し、成果物を検査します。品質コストは予防、評価、内部失敗、外部失敗に分けられます。早期のレビューや試験で後工程の修正費用を抑えられる場合があります。"},{"heading":"調達と連絡","body":"外部調達では内製との比較、契約方式、選定基準、成果物の受入、変更手続を決めます。固定価格契約は費用を予測しやすい一方、範囲変更の管理が重要です。実費精算型では費用実績の監視が重要です。関係者との連絡では責任・頻度・伝達内容を明示します。"}]},{"id":"14-Y01","title":"プロジェクト・プログラム・ポートフォリオ","explain":"\u003cp>プロジェクトは期限と独自の成果を持つ活動です。プログラムは関連プロジェクトを協調して管理し、ポートフォリオは戦略に沿って投資対象を選び資源を配分する仕組みです。定常業務は繰り返し行います。\u003c/p>","worked":"\u003cp>予約アプリと会員基盤の開発を共通の顧客体験改善のため統合するならプログラム。複数の投資案件から優先するものを選ぶのはポートフォリオ管理。\u003c/p>","prompt":"関連する複数のプロジェクトを一体管理し共通の便益を得る管理は？","answer":"\u003cp>プログラムマネジメント。個別成果ではなく関連案件の協調による便益を目的とする。\u003c/p>","beginner":{"scenario":"店舗の予約アプリを3か月で開発する。公開後の日常運用とは管理の目的が異なる。","trap":"プロジェクトの完了とサービス運用の終了は同じではない。","quizId":"U-14-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"プロジェクトは期限と独自の成果を持つ活動です。プログラムは関連プロジェクトを協調して管理し、ポートフォリオは戦略に沿って投資対象を選び資源を配分する仕組みです。定常業務は繰り返し行います。"},{"heading":"仕組みと使い分け","body":"立上げ、計画、実行、監視・管理、終結という活動を通じて目標、制約、役割を調整します。スポンサーは資源や重要な意思決定を支援し、プロジェクト管理者は計画と実績を調整します。テーラリングは案件に応じ管理方法を調整することです。"},{"heading":"具体的な判断と手順","body":"予約アプリと会員基盤の開発を共通の顧客体験改善のため統合するならプログラム。複数の投資案件から優先するものを選ぶのはポートフォリオ管理。"}]},{"id":"14-Y02","title":"プロジェクト憲章・統合変更管理","explain":"\u003cp>プロジェクト憲章はプロジェクトを正式に認め、目的、主要制約、管理者の権限等を明確にします。全体計画は範囲・日程・費用・品質などの計画を整合させます。\u003c/p>","worked":"\u003cp>追加機能に10人日必要なら、納期延長、別機能削減、追加資源などを比較して承認を得る。\u003c/p>","prompt":"承認済み計画に影響する要求を受けた直後の適切な対応は？","answer":"\u003cp>要求を記録し影響を分析する。変更の影響を評価してから権限者の承認を受ける。\u003c/p>","beginner":{"scenario":"開発途中に顧客が新機能を求めた。納期と予算も影響するため担当者だけで約束できない。","trap":"顧客の希望が出た時点で無条件に計画変更しない。","quizId":"U-14-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"プロジェクト憲章はプロジェクトを正式に認め、目的、主要制約、管理者の権限等を明確にします。全体計画は範囲・日程・費用・品質などの計画を整合させます。"},{"heading":"仕組みと使い分け","body":"変更要求は記録し、費用・納期・品質・リスクへの影響を評価します。CCB（Change Control Board：変更管理委員会）など所定の権限者が判断し、承認後に計画、ベースライン（承認済み基準）、要件、試験を更新します。終結時には教訓を記録します。"},{"heading":"具体的な判断と手順","body":"追加機能に10人日必要なら、納期延長、別機能削減、追加資源などを比較して承認を得る。"}]},{"id":"14-Y03","title":"ステークホルダーの分析と関与","explain":"\u003cp>ステークホルダーは成果や活動に影響を及ぼす、または影響を受ける人・組織です。要求、影響力、関心、期待、反対理由を特定します。\u003c/p>","worked":"\u003cp>経営者には費用対効果、事務担当には業務フロー、患者には操作性の評価を求める。\u003c/p>","prompt":"関係者の関心と影響力を整理する主な目的は？","answer":"\u003cp>関与方法を適切に設計する。必要な関与、協議、情報提供を相手に合わせるため。\u003c/p>","beginner":{"scenario":"病院の予約システムでは患者、医師、事務、経営者が異なる希望を持つ。","trap":"役職が高い人だけがステークホルダーではない。","quizId":"U-14-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ステークホルダーは成果や活動に影響を及ぼす、または影響を受ける人・組織です。要求、影響力、関心、期待、反対理由を特定します。"},{"heading":"仕組みと使い分け","body":"登録簿に役割・関心・影響を記録し、影響力と関心が高い人には密な協議を行います。影響力が低くても利用者の要求や権利を無視しません。関与の状態は計画中にも変化するため更新します。"},{"heading":"具体的な判断と手順","body":"経営者には費用対効果、事務担当には業務フロー、患者には操作性の評価を求める。"}]},{"id":"14-Y04","title":"スコープ・WBS・受入基準","explain":"\u003cp>プロダクトスコープは成果物の機能や特性、プロジェクトスコープは成果を作るための作業範囲です。WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を階層的に分解します。\u003c/p>","worked":"\u003cp>決済機能を設計、実装、試験に分解し、試験完了条件を正常・異常系の合格とする。\u003c/p>","prompt":"作業範囲を漏れなく階層的に整理する道具は？","answer":"\u003cp>WBS。WBSは成果物・作業の分解。日程や依存は別途管理する。\u003c/p>","beginner":{"scenario":"ECサイトの改修を依頼され、決済だけでなく在庫連携も含むかを明確にする。","trap":"WBSは作業の階層構造であり、それだけでは日付や依存関係を表さない。","quizId":"U-14-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"プロダクトスコープは成果物の機能や特性、プロジェクトスコープは成果を作るための作業範囲です。WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を階層的に分解します。"},{"heading":"仕組みと使い分け","body":"最下位の管理単位であるワークパッケージに担当、費用、完了条件を設定します。WBS辞書に詳細を記録し、受入基準で成果を確認します。追加要求が正式承認なく増えることをスコープクリープといいます。"},{"heading":"具体的な判断と手順","body":"決済機能を設計、実装、試験に分解し、試験完了条件を正常・異常系の合格とする。"}]},{"id":"14-Y05","title":"資源計画・責任分担・チーム形成","explain":"\u003cp>資源には人材、機器、設備、予算などがあります。必要量、時期、能力、利用可能量を照合し、確保と配分を行います。\u003c/p>","worked":"\u003cp>同じ技術者が同時に二作業を担当する場合、一方を遅らせるか別の技術者を確保する。\u003c/p>","prompt":"RACIのAが示すものは？","answer":"\u003cp>最終説明責任を負う者。AはAccountable、RはResponsible。責任と作業を分ける。\u003c/p>","beginner":{"scenario":"設計と試験が同じ担当者に集中して納期に間に合わない。","trap":"人を増やせば工期が必ず反比例して短くなるわけではない。","quizId":"U-14-Y05"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"資源には人材、機器、設備、予算などがあります。必要量、時期、能力、利用可能量を照合し、確保と配分を行います。"},{"heading":"仕組みと使い分け","body":"RACIは実行責任（Responsible）、最終説明責任（Accountable）、相談先（Consulted）、報告先（Informed）を区別する責任分担表です。資源平準化は資源制約に合わせて日程を調整するため、終了日が変わる場合もあります。"},{"heading":"具体的な判断と手順","body":"同じ技術者が同時に二作業を担当する場合、一方を遅らせるか別の技術者を確保する。"}]},{"id":"14-Y06","title":"PERT・余裕時間・日程短縮","explain":"\u003cp>依存関係をネットワーク図にし、開始から終了までの各経路の所要時間を合計します。最長経路がクリティカルパスで、標準的な前提ではその遅れが全体の遅れにつながります。\u003c/p>","worked":"\u003cp>A→B→Dは9日、A→C→Dは11日。Bには2日の余裕がある。Cを2日短縮すると両経路が9日で並ぶ。\u003c/p>","prompt":"上の例の最短完了日数は？","answer":"\u003cp>11日。並行するBとCの両方を待つため3+max(4,6)+2=11日。\u003c/p>","beginner":{"scenario":"Aが3日、その後Bが4日またはCが6日で、両方が終わるとDが2日かかる。","trap":"最短経路がクリティカルパスではない。","quizId":"U-14-Y06"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"依存関係をネットワーク図にし、開始から終了までの各経路の所要時間を合計します。最長経路がクリティカルパスで、標準的な前提ではその遅れが全体の遅れにつながります。"},{"heading":"仕組みと使い分け","body":"PERT（Program Evaluation and Review Technique：計画評価技法）の三点見積りでは楽観a、最頻m、悲観bから期待時間(a+4m+b)/6を求めます。クラッシングは資源追加、ファストトラッキングは作業重複により日程を短縮する手法です。"},{"heading":"具体的な判断と手順","body":"A→B→Dは9日、A→C→Dは11日。Bには2日の余裕がある。Cを2日短縮すると両経路が9日で並ぶ。"}]},{"id":"14-Y07","title":"コスト予測・EVMの計算","explain":"\u003cp>EVM（Earned Value Management：出来高管理）ではPV（計画価値）、EV（出来高）、AC（実コスト）を比較します。SV=EV−PVは日程差異、CV=EV−ACはコスト差異です。\u003c/p>","worked":"\u003cp>PV=100、EV=80、AC=120万円ならSV=−20、CV=−40、SPI=0.8、CPI=約0.67。遅延かつ予算超過傾向。\u003c/p>","prompt":"EV=80万円、AC=100万円のCPIは？","answer":"\u003cp>0.8。CPI=EV/AC=80/100=0.8。\u003c/p>","beginner":{"scenario":"計画では100万円分の作業を終える時点だが、実際に完了した作業の予算価値は80万円、支出は120万円だった。","trap":"ACが小さいだけでは順調とはいえない。出来高との比較が必要。","quizId":"U-14-Y07"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"EVM（Earned Value Management：出来高管理）ではPV（計画価値）、EV（出来高）、AC（実コスト）を比較します。SV=EV−PVは日程差異、CV=EV−ACはコスト差異です。"},{"heading":"仕組みと使い分け","body":"SPI=EV/PV、CPI=EV/ACはそれぞれ日程・費用の効率を示し、1未満は不利です。BAC（完了時総予算）と同じ費用効率が続くと仮定する場合、EAC（完了時総費用見積り）=BAC/CPI。仮定によって式は変わります。"},{"heading":"具体的な判断と手順","body":"PV=100、EV=80、AC=120万円ならSV=−20、CV=−40、SPI=0.8、CPI=約0.67。遅延かつ予算超過傾向。"}]},{"id":"14-Y08","title":"リスク登録簿・定量評価・対応","explain":"\u003cp>リスクは不確実な出来事が目標に影響する可能性です。発生確率、影響、担当、対応策、兆候をリスク登録簿に記録します。すでに起きた事象は課題として扱います。\u003c/p>","worked":"\u003cp>10％×200万円=20万円の期待損失。代替APIの準備は停止リスクの軽減策になる。\u003c/p>","prompt":"外部委託契約で一部の損失負担を相手へ移す対応は？","answer":"\u003cp>リスク移転。損失負担の一部を他者へ移す。残留リスクは残り得る。\u003c/p>","beginner":{"scenario":"外部API停止の可能性が10％あり、そのときの追加費用は200万円と見積もられた。","trap":"保険への加入はリスクの原因自体をなくすわけではない。","quizId":"U-14-Y08"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"リスクは不確実な出来事が目標に影響する可能性です。発生確率、影響、担当、対応策、兆候をリスク登録簿に記録します。すでに起きた事象は課題として扱います。"},{"heading":"仕組みと使い分け","body":"負のリスクへの代表的な対応は回避、軽減、移転、受容です。期待金額は確率×影響額で比較できますが、重大事故などは期待値だけで判断しません。対策後に残る残留リスクも追跡します。"},{"heading":"具体的な判断と手順","body":"10％×200万円=20万円の期待損失。代替APIの準備は停止リスクの軽減策になる。"}]},{"id":"14-Y09","title":"品質計画・品質保証・品質管理","explain":"\u003cp>品質計画は目標と評価方法を決める活動です。品質保証は適切なプロセスや基準が整い実施されるよう確かめ、品質管理は成果物の測定と不適合への処置を行います。\u003c/p>","worked":"\u003cp>不具合の60％が入力検証に集中していれば、その原因を分析して設計レビューとテストを改善する。\u003c/p>","prompt":"原因別の不良件数を降順で表示し優先対策を選ぶ図は？","answer":"\u003cp>パレート図。頻度の大きい原因を可視化し、優先的に対策する。\u003c/p>","beginner":{"scenario":"納品されたアプリに不具合が多い。検査を増やすだけでなく作り方も見直す。","trap":"品質保証と最後の動作試験は同義ではない。","quizId":"U-14-Y09"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"品質計画は目標と評価方法を決める活動です。品質保証は適切なプロセスや基準が整い実施されるよう確かめ、品質管理は成果物の測定と不適合への処置を行います。"},{"heading":"仕組みと使い分け","body":"特性要因図は原因候補、パレート図は重要な原因の優先順位、管理図は工程の異常を調べます。品質コストは予防・評価・内部失敗・外部失敗に区分できます。検査のみでなく再発防止を行います。"},{"heading":"具体的な判断と手順","body":"不具合の60％が入力検証に集中していれば、その原因を分析して設計レビューとテストを改善する。"}]},{"id":"14-Y10","title":"調達判断・契約形態・供給者評価","explain":"\u003cp>自製・購入分析では自社の能力、費用、納期、機密性、保守を比較します。調達計画では仕様書、選定基準、契約条件、受入条件、供給者管理を定めます。\u003c/p>","worked":"\u003cp>価格だけでなく技術適合性、保守体制、実績、セキュリティ、撤退時の対応を点数化して選ぶ。\u003c/p>","prompt":"外部調達の評価で最も適切な方法は？","answer":"\u003cp>事前に定めた複数の基準で比較する。価格・品質・保守等を合意した基準で比較する。\u003c/p>","beginner":{"scenario":"開発の一部を委託する。仕様の確実性と費用の予測可能性から契約を選ぶ。","trap":"最安値を選べば必ず総費用が最低になるとは限らない。","quizId":"U-14-Y10"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"自製・購入分析では自社の能力、費用、納期、機密性、保守を比較します。調達計画では仕様書、選定基準、契約条件、受入条件、供給者管理を定めます。"},{"heading":"仕組みと使い分け","body":"固定価格契約は範囲が明確なら費用を見通しやすい一方、変更時の調整が必要です。実費精算型は不確実な仕事に対応しやすいが支出の監視が必要です。契約の価格方式と日本法上の請負・準委任は別の分類です。"},{"heading":"具体的な判断と手順","body":"価格だけでなく技術適合性、保守体制、実績、セキュリティ、撤退時の対応を点数化して選ぶ。"}]},{"id":"14-Y11","title":"コミュニケーション計画と伝達経路","explain":"\u003cp>誰に、何を、いつ、どの手段で、誰が提供するかを決めるのがコミュニケーション計画です。進捗、問題、決定事項を記録し、重要な問題を権限者へ報告します。\u003c/p>","worked":"\u003cp>5人なら5×4÷2=10経路、6人なら15経路。人数増加に合わせ連絡経路を整理する。\u003c/p>","prompt":"8人の全員同士の通信経路数は？","answer":"\u003cp>28。8×7÷2=28。組を二重計上しない。\u003c/p>","beginner":{"scenario":"10人のチームで全員が全員と直接連絡すると情報の重複や漏れが生じる。","trap":"メール送信だけでは相手の理解を保証しない。","quizId":"U-14-Y11"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"誰に、何を、いつ、どの手段で、誰が提供するかを決めるのがコミュニケーション計画です。進捗、問題、決定事項を記録し、重要な問題を権限者へ報告します。"},{"heading":"仕組みと使い分け","body":"双方向型は会議などで相互確認、プッシュ型はメール等で送信、プル型は共有サイト等から必要な人が取得します。全員同士の双方向経路数はn(n−1)/2です。"},{"heading":"具体的な判断と手順","body":"5人なら5×4÷2=10経路、6人なら15経路。人数増加に合わせ連絡経路を整理する。"}]}],"beginnerIntro":"決められた範囲・期限・費用で成果を出すための管理を学ぶ。工程図と出来高管理では数値の意味を明確にする。"},{"id":15,"title":"サービスマネジメント","group":"マネジメント","priority":"B選択候補","summary":"SLA、インシデントと問題管理、変更・構成管理、BCP。","lessons":[{"title":"サービスレベル","body":"SLA（Service Level Agreement：サービス水準合意）は提供者と利用者が稼働率・応答時間などの目標を合意した文書。SLM（Service Level Management：サービスレベル管理）は監視・評価・改善する活動。","check":"SLAの数値は測定条件まで定める。"},{"title":"インシデントと問題","body":"インシデント管理は早期のサービス復旧を目標とし、問題管理は根本原因を特定して再発を防止する。回避策による暫定復旧と恒久対策を区別。","check":"原因不明でも暫定復旧してよい場合がある。"},{"title":"変更とリリース","body":"変更管理はリスクと影響を評価し承認する。リリース管理は変更内容を適切な時期・手順で展開する。CMDB（Configuration Management Database：構成管理データベース）は関連資産・構成の把握を支援。","check":"資産管理と構成管理は対象の関係性の扱いが異なる。"},{"title":"継続性","body":"BCP（Business Continuity Plan：事業継続計画）にはRTO（Recovery Time Objective：目標復旧時間）とRPO（Recovery Point Objective：目標復旧時点）が重要。RPOを短くするとデータ損失を小さくできる。","check":"RTOは時間、RPOはデータがどの時点まで戻るか。"}],"terms":[{"term":"SLA","definition":"サービス提供者と利用者が合意するサービス水準"},{"term":"SLM","definition":"サービスレベルを定義・測定・改善する管理活動"},{"term":"インシデント管理","definition":"障害等の影響を抑えサービスを早く復旧させる活動"},{"term":"問題管理","definition":"インシデントの根本原因を特定し再発を防ぐ活動"},{"term":"変更管理","definition":"システム変更の影響・リスク・承認を管理すること"},{"term":"CMDB","definition":"ITサービスの構成品目とそれらの関係を管理するデータベース"},{"term":"BCP","definition":"災害等でも重要業務を継続・早期再開する計画"},{"term":"RTO","definition":"重要業務を復旧すべき目標時間"},{"term":"RPO","definition":"データの復旧で許容する過去への戻り時点の目標"},{"term":"可用性管理","definition":"サービスを必要時に利用できるよう目標と実績を管理する活動"}],"questions":[{"id":"Q15-01","chapter":15,"kind":"applied","q":"障害直後、暫定回避策でサービスを早期復旧する活動は。","options":["問題管理","インシデント管理","調達管理","企業統治"],"correct":1,"explain":"まずサービスを復旧させるのはインシデント管理。"},{"id":"Q15-02","chapter":15,"kind":"applied","q":"毎日0時にバックアップし午後15時の障害で前日0時のデータまでしか戻せない。データ損失時間は。","options":["9時間","15時間","24時間","39時間"],"correct":3,"explain":"前日0時から当日15時なので39時間。最終バックアップ時刻を確認する。"},{"id":"Q15-03","chapter":15,"kind":"applied","q":"RTO=4時間の意味として適切なのは。","options":["データを4時間前まで戻す","目標として4時間以内に復旧する","障害は4時間に一回起こる","平均修理時間が常に4時間"],"correct":1,"explain":"RTOは復旧するまでの目標時間。"},{"id":"D15-01","chapter":15,"kind":"applied","q":"30日間のSLA稼働率99.9%で、計画停止等を除外しない単純計算の許容停止時間はどれか。","options":["4.32分","43.2分","72分","432分"],"correct":1,"explain":"30×24×60×(1−0.999)=43.2分。測定定義により実際のSLAの扱いは変わる。"},{"id":"D15-02","chapter":15,"kind":"applied","q":"DB接続枯渇でサービス停止中、接続プール拡張で暫定復旧する活動は何に近いか。","options":["インシデント管理","特許調査","研究開発","商標登録"],"correct":0,"explain":"早期のサービス復旧がインシデント管理の主目的。接続リークの根本原因調査は問題管理。"},{"id":"D15-03","chapter":15,"kind":"applied","q":"SLOとSLIの関係として適切なものはどれか。","options":["両方とも請求書","SLOは目標値、SLIは測定指標","SLOは測定値、SLIは目標値","両者は常に一致する"],"correct":1,"explain":"目標と観測値を区別し、SLA等で合意内容と測定方式を管理する。"},{"id":"Q-15-X01","chapter":15,"kind":"applied","q":"停電時に瞬時の電力供給を維持する設備は？","options":["DNS","UPS","WAF","CMDB"],"correct":1,"explain":"UPS。長時間運転には別途発電設備などを組み合わせる。"},{"id":"U-15-1","chapter":15,"kind":"applied","q":"サービス提供者と利用者の間でサービス水準を合意するものは？","options":["SLM","SLA","CMDB","WBS"],"correct":1,"explain":"SLAはService Level Agreement（サービスレベル合意）。SLMは水準管理。"},{"id":"U-15-2","chapter":15,"kind":"applied","q":"同一原因による障害再発を減らすため原因を分析する管理は？","options":["インシデント管理のみ","サービス要求管理","問題管理","容量管理"],"correct":2,"explain":"問題管理は根本原因の特定と再発防止を担う。"},{"id":"U-15-3","chapter":15,"kind":"applied","q":"利用者の問合せや障害報告を受け付ける一元窓口は？","options":["構成管理台帳","監査部門","DBMS","サービスデスク"],"correct":3,"explain":"サービスデスクは利用者との接点として問合せや要求を扱う。"},{"id":"U-15-X01","chapter":15,"kind":"applied","q":"電源、空調、入退室など施設設備を管理する活動は？","options":["ファシリティマネジメント","問題管理のみ","構成管理のみ","データ正規化"],"correct":0,"explain":"施設・設備を管理し、サービス運用の基盤を支える。"}],"deepIntro":"サービス管理は障害を直すだけでなく、利用者へ約束した価値を継続的に提供する営み。","deep":[{"id":"15-1","title":"ITIL・サービス価値・SLA","explain":"\u003cp>ITIL（Information Technology Infrastructure Library：ITサービス管理の実践指針）はサービスの価値共創、継続的改善、インシデント管理などを整理する。SLA（Service Level Agreement：サービス水準合意）は顧客と提供者の間で利用できる時間、応答時間、サポート範囲、測定方法などを定める合意。SLO（Service Level Objective：サービス目標値）は具体的な目標、SLI（Service Level Indicator：サービス指標）は実際の測定値。\u003c/p>\n\u003cp>合意値が99.9%なら、月30日で許容停止時間は30×24×60×0.001＝43.2分。ただし計画停止を含むかなどはSLA定義に依存する。「何を分母とするか」が重要。\u003c/p>\n","worked":"\u003cp>30日間で無停止を要求するなら99.9%のSLAは不十分。実稼働時間の定義、監視地点、計画停止除外の規則を確認し、現実的な合意にする。\u003c/p>\n","prompt":"SLOとSLIは同じか。","answer":"\u003cp>違う。SLOが目標、SLIが観測された指標。\u003c/p>\n","beginner":{"scenario":"月30日で稼働率99.9%の合意なら許容停止時間は30×24×60×0.001＝43.2分。対象外時間の条件があれば別途考える。","trap":"SLAは合意、SLMはその合意を管理する活動。測定条件も重要。","quizId":"U-15-1"},"textbook":[{"heading":"サービスの価値とは","body":"ITサービスは利用者が目的を達成できるよう機能や運用を提供するものです。システムを納品するだけでなく、使える状態を維持し利用者に価値を届けることが重要です。ITIL（ITサービスマネジメントの実践体系）はサービス価値と継続的改善を重視します。"},{"heading":"サービス水準を測る","body":"SLA（サービスレベル合意）は提供者と利用者が合意する水準、SLO（サービスレベル目標）は具体的な目標値、SLI（サービスレベル指標）は実測する指標です。稼働率99.9%なら30日全時間を対象として許容停止43.2分です。計画停止を含むかなど測定条件を合意します。"},{"heading":"継続的に管理する","body":"SLM（サービスレベル管理）は合意した水準を監視・報告・改善する活動です。サービスカタログは利用可能なサービスや条件を示します。顧客への報告では目標未達の事実、原因、対応、改善計画を区別し、単に平均値だけで品質を評価しません。"}],"walkthrough":{"heading":"稼働率を停止時間に変換する","body":"月30日の全時間を対象とし、障害が12分、18分、24分発生し重複しなかったとします。対象時間は30×24×60＝43200分、停止は54分なので稼働率は(43200−54)/43200＝0.99875、99.875%です。目標99.9%は許容停止時間43.2分で、実績54分は超過しています。複数障害の停止時間が重なるときは二重に数えないこと、計画停止を除外する契約なら分母・分子をその条件に合わせることが重要です。","cols":["項目","計算結果"],"rows":[["対象時間","43200分"],["許容停止時間","43.2分"],["実際の停止時間","54分"],["稼働率","99.875%"],["目標達成","未達"]]}},{"id":"15-2","title":"インシデント・問題・変更管理","explain":"\u003cp>インシデントはサービスの中断や品質低下など、通常運用からの逸脱。最優先は早期のサービス復旧で、原因が未解明でも暫定回避策を使うことがある。問題管理は繰り返す障害等の根本原因を調査し、再発防止を図る。インシデント解決と根本原因除去は別の活動。\u003c/p>\n\u003cp>変更管理は本番変更のリスク・影響を評価し、承認・実施・結果を記録する。構成管理データベース（CMDB：Configuration Management Database）は構成アイテムと依存関係を管理し、障害影響や変更範囲の把握に役立つ。\u003c/p>\n","worked":"\u003cp>DB接続が枯渇し応答不能になった際、接続プールを一時拡張してサービス復旧するのはインシデント対応。接続リークをコード修正して再発を防ぐのは問題管理・変更管理にも関わる。\u003c/p>\n","prompt":"障害の原因が分かるまでサービス復旧を待つべきか。","answer":"\u003cp>必ずしもそうではない。影響・証拠保全を考慮しつつ暫定復旧と原因調査を並行する。\u003c/p>\n","beginner":{"scenario":"ネット通販が停止したらまず復旧し、繰返す障害なら原因を調べ、恒久修正は影響評価・承認してから配布する。","trap":"インシデント管理の主目的は早期復旧。原因究明は問題管理。","quizId":"U-15-2"},"textbook":[{"heading":"障害時にまずすべきこと","body":"インシデントはサービスの中断や品質低下などです。インシデント管理は利用者への影響を抑え正常なサービスを速やかに回復する活動です。受付、分類、優先度決定、担当への割当て、復旧、記録を行います。"},{"heading":"同じ障害を繰り返さない","body":"問題管理はインシデントの原因を分析し再発を防ぎます。例えばメモリ不足で停止するアプリを再起動するのは復旧、メモリが解放されない欠陥を調査・修正するのは根本原因への対応です。既知のエラーや回避策を記録して復旧を速めます。"},{"heading":"変更の失敗を防ぐ","body":"変更管理では変更理由、影響、リスク、試験、承認、切戻しを確認します。リリース管理は提供する新しい版や機能を計画し、展開管理は実際に環境へ配置します。CMDB（構成管理データベース）は機器、ソフトウェア、設定や関係を管理し、変更・障害の影響分析を助けます。"}]},{"id":"15-3","title":"キャパシティ・可用性・継続性・サービスデスク","explain":"\u003cp>キャパシティ管理は現在と将来の需要に対し資源が不足しないよう容量を計画する。可用性管理は単一障害点の分析や冗長化、保守計画で利用可能性を高める。サービス継続性管理は大規模障害・災害でも重要業務を再開するための計画・訓練。RTO・RPOは業務要件と技術的制約をつなぐ指標。\u003c/p>\n\u003cp>サービスデスクは利用者からの問合せやインシデント報告の窓口となり、優先度を付け、進捗と利用者への通知を管理する。優先度は一般に影響度と緊急度を組み合わせて決める。件数だけでなく復旧時間、一次解決率、満足度も計測する。\u003c/p>\n","worked":"\u003cp>1人の管理者にだけ影響する表示崩れより、全社の決済停止の方が影響度が大きい。緊急度と合わせて優先度を判定する。\u003c/p>\n","prompt":"障害対応の件数が少なくなれば品質が必ず改善したか。","answer":"\u003cp>判断できない。報告の欠落やユーザー数の変化を考える。\u003c/p>\n","beginner":{"scenario":"現在のCPU使用率が低くても来月の利用者増加で容量不足になるかもしれない。需要予測・監視で必要資源を計画する。","trap":"可用性管理と災害時のサービス継続管理は関連するが目的が異なる。","quizId":"U-15-3"},"textbook":[{"heading":"現在と将来の負荷","body":"キャパシティ管理は現在・将来の利用需要に対して必要な処理能力を確保します。利用率や応答時間、データ増加を測り、需要予測と増強計画を作ります。可用性管理はサービスが合意した時間に利用可能になるよう冗長化・保守・復旧などを計画します。"},{"heading":"災害時の継続","body":"サービス継続管理は大きな障害や災害が発生しても重要なサービスを継続・復旧できるよう備えます。事業影響分析から重要業務を特定し、RTO（復旧時間目標）とRPO（復旧時点目標）を設定し、代替拠点やバックアップを用意して訓練します。"},{"heading":"窓口と運用","body":"サービスデスクは利用者からの問合せ、サービス要求、障害報告を一元的に受け付けます。運用監視で異常を検知し、定めた連絡経路に沿って対応します。利用者への情報提供と技術的な障害復旧は両方必要です。"}]},{"id":"15-X01","title":"サービス管理システム・評価・設備","explain":"\u003cp>ITIL（ITサービス管理の実践体系）はサービス価値を重視する。ISO/IEC 20000-1はサービスマネジメントシステムの要求事項。サービスカタログは利用可能なサービスを示し、SLA（サービスレベル合意）は提供条件、SLO（サービスレベル目標）は測定目標を表す。サービス要求、構成、リリース、変更、インシデント、問題、供給者、可用性、容量、継続性を管理する。\u003c/p>\u003cp>PDCA（計画・実行・評価・改善）で運用を改善する。サービスデスクは利用者窓口、監視は異常を検知する。ファシリティマネジメントは電源・空調・設備・入退室・防災などを管理する。UPS（無停電電源装置）は停電直後の電力を一時供給し、自家発電への切替や安全停止を支援する。\u003c/p>","worked":"\u003cp>月30日の稼働率目標99.9%なら許容停止時間は43.2分（全時間が対象の場合）。\u003c/p>","prompt":"停電時に瞬時の電力供給を維持する設備は？","answer":"\u003cp>UPS。長時間運転には別途発電設備などを組み合わせる。\u003c/p>","beginner":{"scenario":"停電時にUPSがすぐ給電し、長期停電では発電機へ切替えるか安全に停止する。空調停止でもサーバ温度上昇に注意する。","trap":"UPSは通常、無期限に電力を供給する装置ではない。","quizId":"U-15-X01"},"textbook":[{"heading":"サービス管理を仕組みにする","body":"ISO/IEC 20000-1はサービスマネジメントシステムの要求事項を定めます。組織の方針と目標を設定し、計画・運用・評価・改善を繰返すことで一貫したサービス管理を行います。PDCA（計画・実行・評価・改善）は改善の考え方の一つです。"},{"heading":"設備の管理","body":"ファシリティマネジメントは施設・設備・環境を管理します。サーバ室では電源、空調、入退室管理、火災対策などが重要です。UPS（無停電電源装置）は停電直後の給電を支援し、発電機へ切替えるまでの時間や安全停止に必要な時間を確保します。"},{"heading":"改善を評価する","body":"稼働率、復旧時間、同一原因の再発件数、変更失敗率などを測り改善を確認します。問い合わせ数の増減だけでは障害の増減を判断できないため、何を数えるかを明確にします。監視データを使って設備容量・運用手順を見直します。"}]},{"id":"15-Y01","title":"サービス価値・SLA/SLO/SLI","explain":"\u003cp>サービスマネジメントは利用者の成果を支援するため、人・技術・手順を管理する活動です。ITIL（IT Infrastructure Library：ITサービス管理の実践体系）は価値の共創や改善を扱い、ISO/IEC 20000はサービス管理システムの規格群です。\u003c/p>","worked":"\u003cp>月間の成功応答率を指標として測り99.9％を目標にし、顧客との契約に条件を定める。\u003c/p>","prompt":"サービスの実際の成功応答率を表すものは？","answer":"\u003cp>SLI。SLIは観測する指標。SLOは目標、SLAは合意。\u003c/p>","beginner":{"scenario":"予約サービスが稼働していても検索が30秒かかれば利用者は困る。","trap":"SLAは測定値そのものではない。","quizId":"U-15-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"サービスマネジメントは利用者の成果を支援するため、人・技術・手順を管理する活動です。ITIL（IT Infrastructure Library：ITサービス管理の実践体系）は価値の共創や改善を扱い、ISO/IEC 20000はサービス管理システムの規格群です。"},{"heading":"仕組みと使い分け","body":"SLA（Service Level Agreement：サービスレベル合意）は合意内容、SLO（Service Level Objective：目標）は達成目標、SLI（Service Level Indicator：指標）は測定値・測定方法です。対象、時間帯、測定点、除外条件も定めます。"},{"heading":"具体的な判断と手順","body":"月間の成功応答率を指標として測り99.9％を目標にし、顧客との契約に条件を定める。"}]},{"id":"15-Y02","title":"サービス計画・資産・構成・供給者管理","explain":"\u003cp>サービスポートフォリオは計画中、運用中、廃止などのサービス全体を管理し、サービスカタログは利用可能なサービス、条件、依存関係を示します。資産管理は所有・費用・契約などを扱います。\u003c/p>","worked":"\u003cp>障害時、構成管理情報で停止したDBを使うサービスを特定し、カタログで利用部門を調べる。\u003c/p>","prompt":"サーバ故障によるサービスの影響範囲を調べるのに最適な情報は？","answer":"\u003cp>構成品目間の依存関係。構成管理は依存関係を把握し影響分析を可能にする。\u003c/p>","beginner":{"scenario":"社内IT部門が新しいチャットとファイル共有サービスを提供する。","trap":"資産台帳と構成管理情報は目的が異なる。","quizId":"U-15-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"サービスポートフォリオは計画中、運用中、廃止などのサービス全体を管理し、サービスカタログは利用可能なサービス、条件、依存関係を示します。資産管理は所有・費用・契約などを扱います。"},{"heading":"仕組みと使い分け","body":"構成管理は構成品目と依存関係をCMDB（Configuration Management Database：構成管理データベース）等に記録します。需要、予算、供給者、サービスレベル、容量、変更、リリース、インシデント、要求、問題、可用性、継続、セキュリティを管理し、新規サービスの設計・移行を統制します。"},{"heading":"具体的な判断と手順","body":"障害時、構成管理情報で停止したDBを使うサービスを特定し、カタログで利用部門を調べる。"}]},{"id":"15-Y03","title":"サービス評価・是正措置・継続的改善","explain":"\u003cp>サービス管理では測定、分析、評価、内部監査、マネジメントレビューを通して、目標と実績の差や管理の有効性を判断します。\u003c/p>","worked":"\u003cp>応答時間悪化の原因がDB索引の不足なら、索引を改善して同一条件で応答時間を再測定する。\u003c/p>","prompt":"是正措置の実施後に必要な活動は？","answer":"\u003cp>測定して効果を評価する。原因への対策が有効か、測定結果で検証する。\u003c/p>","beginner":{"scenario":"SLOの達成率が3か月連続で低下した。管理者は結果と改善策を確認する。","trap":"改善策を実施しただけでは効果が確認されたことにならない。","quizId":"U-15-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"サービス管理では測定、分析、評価、内部監査、マネジメントレビューを通して、目標と実績の差や管理の有効性を判断します。"},{"heading":"仕組みと使い分け","body":"PDCA（Plan-Do-Check-Act：計画・実行・評価・改善）で不適合を記録し、原因分析、是正措置、効果確認を行います。改善は優先順位と担当、期限、期待効果を管理します。応急復旧と再発防止を区別します。"},{"heading":"具体的な判断と手順","body":"応答時間悪化の原因がDB索引の不足なら、索引を改善して同一条件で応答時間を再測定する。"}]},{"id":"15-Y04","title":"運用監視・ジョブ・バックアップ・サービスデスク","explain":"\u003cp>ジョブ管理では処理の順序、実行時刻、依存、異常終了時の対応を定めます。運用監視は稼働状態、ログ、資源、応答時間を観測し、異常を検知して対応します。\u003c/p>","worked":"\u003cp>取込ジョブが失敗したら集計を保留し、担当へ通知して原因解消後に再実行する。二重登録を防ぐ仕組みも確認する。\u003c/p>","prompt":"バックアップの有効性を直接確かめる方法は？","answer":"\u003cp>実際に復元し整合性を確認する。復元試験で利用可能なデータか確認する。\u003c/p>","beginner":{"scenario":"毎夜、売上集計を行う。前段の注文データ取込が失敗すると集計を実行してはいけない。","trap":"バックアップ成功ログだけで復旧可能性を証明できない。","quizId":"U-15-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ジョブ管理では処理の順序、実行時刻、依存、異常終了時の対応を定めます。運用監視は稼働状態、ログ、資源、応答時間を観測し、異常を検知して対応します。"},{"heading":"仕組みと使い分け","body":"サービスデスクは利用者との単一窓口となり、問合せやサービス要求、障害を記録・分類・優先付けします。バックアップは取得だけでなく復元試験、保存期間、別障害領域への保管が必要です。"},{"heading":"具体的な判断と手順","body":"取込ジョブが失敗したら集計を保留し、担当へ通知して原因解消後に再実行する。二重登録を防ぐ仕組みも確認する。"}]},{"id":"15-Y05","title":"設備管理・電源・データセンター効率","explain":"\u003cp>ファシリティマネジメントは建物、電源、空調、入退室などの設備を効率的・安全に管理します。UPS（Uninterruptible Power Supply：無停電電源装置）は短時間の電源確保や安全停止を支援し、発電機はより長期の供給に利用できます。\u003c/p>","worked":"\u003cp>施設全体150kW、IT機器100kWならPUE=1.5。残り50kWは冷却などの設備負荷。\u003c/p>","prompt":"施設200kW、IT機器125kWのPUEは？","answer":"\u003cp>1.6。200÷125=1.6。\u003c/p>","beginner":{"scenario":"サーバ室では停電だけでなく冷却停止による過熱にも備える。","trap":"UPSだけで無期限に運転できるわけではない。","quizId":"U-15-Y05"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ファシリティマネジメントは建物、電源、空調、入退室などの設備を効率的・安全に管理します。UPS（Uninterruptible Power Supply：無停電電源装置）は短時間の電源確保や安全停止を支援し、発電機はより長期の供給に利用できます。"},{"heading":"仕組みと使い分け","body":"PUE（Power Usage Effectiveness：電力使用効率）は施設全体の電力使用量÷IT機器の電力使用量です。1に近いほどIT機器以外に使う比率が小さいですが、計測境界やIT機器自体の効率にも注意します。"},{"heading":"具体的な判断と手順","body":"施設全体150kW、IT機器100kWならPUE=1.5。残り50kWは冷却などの設備負荷。"}]}],"beginnerIntro":"完成したシステムを安定提供する仕事を学ぶ。サービス水準、復旧、原因分析、変更、設備を目的別に整理する。"},{"id":16,"title":"システム監査・内部統制","group":"マネジメント","priority":"B選択候補","summary":"独立した評価、監査証拠、職務分掌、内部統制、改善提案。","lessons":[{"title":"監査の目的","body":"システム監査は情報システムのリスクに対する管理状況等を独立・客観的に評価し、保証や助言を提供する。監査人は業務執行そのものを代行しない。","check":"監査対象を自分で運用し自分で評価すると独立性が損なわれる。"},{"title":"監査手続","body":"リスク評価→監査計画→証拠収集（文書閲覧・インタビュー・観察・再実施など）→評価→報告→フォローアップ。証拠は十分性・適切性を判断する。","check":"担当者の口頭説明だけでは弱い場合がある。"},{"title":"内部統制","body":"業務の有効性・効率性、財務報告の信頼性、法令遵守、資産保全などを支える仕組み。職務分掌は申請・承認・実行などの権限を分離し不正リスクを減らす。","check":"統制目的に対して設計・運用が機能しているか検証。"},{"title":"監査意見","body":"発見事項には事実・基準・原因・影響・改善提案を示す。経営層が受け入れたリスクも明確に記録する。","check":"監査報告は命令ではなく、改善の実施責任は基本的に被監査側。"}],"terms":[{"term":"システム監査","definition":"情報システムのリスク管理などを独立して検証・評価する活動"},{"term":"監査証拠","definition":"監査人の判断や結論を裏付ける情報"},{"term":"独立性","definition":"監査対象から不当な影響を受けずに判断できる性質"},{"term":"客観性","definition":"先入観や利益相反に左右されず公平に評価する性質"},{"term":"職務分掌","definition":"申請・承認・実行等の業務権限を分ける統制"},{"term":"内部統制","definition":"組織の目標達成を支える方針・手続・仕組み"},{"term":"監査調書","definition":"監査手続・証拠・判断を記録した文書"},{"term":"フォローアップ","definition":"指摘に対する改善状況を後から確認する活動"},{"term":"リスクアプローチ","definition":"重要なリスクに監査資源を重点配分する方法"}],"questions":[{"id":"Q16-01","chapter":16,"kind":"applied","q":"監査人の独立性に問題があるのは。","options":["アクセス記録を調べる","自ら構築・運用した統制をそのまま独立評価する","資料を閲覧する","経営者へ意見を述べる"],"correct":1,"explain":"自己監査となり客観的な評価が難しい。"},{"id":"Q16-02","chapter":16,"kind":"applied","q":"不正送金の抑止として最も直接的な内部統制は。","options":["送金申請と承認を別人にする","送金データを毎年削除する","送金担当のみに全権限を渡す","ログを取得しない"],"correct":0,"explain":"職務分掌で一人の権限集中を避ける。"},{"id":"Q16-03","chapter":16,"kind":"applied","q":"監査後に改善実施状況を確認する活動は。","options":["スコープ定義","フォローアップ","プログラム開発","容量計画"],"correct":1,"explain":"指摘への対応結果を後から確認する。"},{"id":"D16-01","chapter":16,"kind":"applied","q":"監査対象部門の管理者が「権限を毎月見直している」と述べたとき、監査人が最優先で確認するものはどれか。","options":["管理者の役職名だけ","第三者の噂","実施記録・承認履歴等の証拠","監査人の気分"],"correct":2,"explain":"主張だけでなく、十分かつ適切な監査証拠を収集する。"},{"id":"D16-02","chapter":16,"kind":"applied","q":"申請・承認・支払実行を別担当にする内部統制は何か。","options":["職務分掌","暗号化","キャッシュ制御","標本化"],"correct":0,"explain":"複数役割で牽制することで単独の不正・誤りを抑える。"},{"id":"D16-03","chapter":16,"kind":"applied","q":"高リスクな管理者アカウント10件を重点抽出して問題がなかった場合に妥当な結論はどれか。","options":["全社の全権限が完全に適正","抽出対象では問題が見られなかったが全件には一般化できない","監査手続が不要","ログが不要"],"correct":1,"explain":"重点抽出は高リスク対象に有効だが、全母集団を代表するとは限らない。"},{"id":"Q-16-X01","chapter":16,"kind":"applied","q":"本番プログラム変更の承認手続は主にどちらか。","options":["IT全般統制","業務処理統制","財務分析","マーケティング"],"correct":0,"explain":"IT全般統制。"},{"id":"U-16-1","chapter":16,"kind":"applied","q":"監査人が評価の対象となる業務の実施責任を兼ねない主な理由は？","options":["監査費用を増やすため","独立性を確保するため","開発速度を上げるため","監査範囲を狭めるため"],"correct":1,"explain":"自己の業務を自分で評価する利害関係を避け、客観性を保つ。"},{"id":"U-16-2","chapter":16,"kind":"applied","q":"同じ担当者が申請・承認・支払をすべて行える問題への直接的対策は？","options":["圧縮率向上","バックアップの頻度増加のみ","職務分掌","業務処理速度向上"],"correct":2,"explain":"担当と権限を分離し、一人で不正を完結しにくくする。"},{"id":"U-16-3","chapter":16,"kind":"applied","q":"監査指摘に対する改善措置が実施されたか後日確認する手続は？","options":["要件定義","単体テスト","投資評価","フォローアップ"],"correct":3,"explain":"監査後の改善状況を確認する。"},{"id":"U-16-X01","chapter":16,"kind":"applied","q":"取引入力時の必須項目や金額の妥当性チェックは主に何に当たるか？","options":["業務処理統制","IT全般統制のみ","監査人の独立性","財務分析"],"correct":0,"explain":"個別業務で入力・処理の正確性を確保する統制。"}],"deepIntro":"監査で求めるのは「適切に管理されたという証拠」であり、担当者の主張だけではない。","deep":[{"id":"16-1","title":"監査の目的・独立性・監査証拠","explain":"\u003cp>システム監査は情報システムに関するリスクと管理状況を独立・客観的に評価し、改善を助言する活動。監査人は対象部門から独立して判断し、経営者や担当部門の管理責任を肩代わりしない。監査計画では目的・対象・範囲・基準・手続・時期を明確にし、重要性とリスクを考えて優先度を決める。\u003c/p>\n\u003cp>監査証拠は十分かつ適切である必要がある。口頭説明だけでなく、承認記録、ログ、操作証跡、設定、実地観察、サンプル抽出、再実施結果などを照合する。発見事項は基準・事実・原因・影響・改善提案を分けて記載する。\u003c/p>\n","worked":"\u003cp>「全従業員のアクセス権を毎月見直している」と担当者が述べても、実施証拠としてレビュー一覧・承認履歴・権限変更記録を確認する。記録の欠落を見つけたら影響範囲を調べる。\u003c/p>\n","prompt":"監査人が改善策を自ら実装し、その実装を自ら監査してよいか。","answer":"\u003cp>独立性・客観性を損なう恐れがあるため不適切。実装責任は被監査側にある。\u003c/p>\n","beginner":{"scenario":"監査人は「退職者IDを即日削除する」という規程と、実際の退職者一覧・ID無効化ログを照合する。","trap":"規程があるだけでは統制が運用されている証拠にならない。","quizId":"U-16-1"},"textbook":[{"heading":"監査は何をする活動か","body":"システム監査は情報システムに関わるリスクと管理の仕組みを、独立した立場から検証・評価する活動です。監査対象の業務を行う人が自分で評価すると利害の影響を受けるため、監査人は独立性・客観性を確保します。"},{"heading":"監査証拠を集める","body":"規程に「退職時にIDを停止する」と書いてあることは設計の証拠になりますが、実際に実施した証拠ではありません。退職者一覧、ID停止記録、承認記録を照合し運用実態を調べます。質問、観察、文書閲覧、再実施などの手続を使います。"},{"heading":"監査結果の伝え方","body":"評価基準と観測された事実を比較し、問題点、リスク、改善の必要性を報告します。改善の実施責任は監査対象組織にあり、監査人は改善状況を確認します。監査報告と日常の業務管理を区別します。"}]},{"id":"16-2","title":"内部統制・職務分掌・リスク対応","explain":"\u003cp>内部統制は業務の有効性・効率性、財務報告等の信頼性、法令遵守、資産保全を支える仕組み。職務分掌は「申請・承認・実行・検証」を複数の役割に分け、不正や誤りの見逃しを減らす。アクセス権の定期棚卸し、変更承認、ログ保存、バックアップテストは代表的な統制。\u003c/p>\n\u003cp>予防的統制は不正を起こしにくくし、発見的統制は発生した異常を検知する。両方を設計することで制御の欠陥を補い合う。内部統制には人的誤り・共謀・権限濫用・費用対効果など限界があり、完全な保証ではない。\u003c/p>\n","worked":"\u003cp>仕入先登録と支払承認を同じ担当者ができると架空取引を承認できるリスクがある。担当を分け、支払先変更の承認・記録を残すことで低減する。\u003c/p>\n","prompt":"毎日ログを取っているだけで不正の発見統制は完成か。","answer":"\u003cp>ならない。ログの保全、監視ルール、異常調査、対応が必要。\u003c/p>\n","beginner":{"scenario":"購入申請、承認、支払、照合を別担当にすれば、一人が架空請求を作り支払って隠すことを難しくできる。","trap":"職務分掌だけでは共謀や権限悪用を完全には防げない。","quizId":"U-16-2"},"textbook":[{"heading":"内部統制を設計する理由","body":"内部統制は組織の業務目的を達成し、報告の信頼性、法令遵守、資産保全などを確保するため組織内に整備される仕組みです。例えば一人で購入申請から承認・支払まで行えると不正を発見しにくくなります。"},{"heading":"予防・発見・是正","body":"予防的統制は不適切な処理を未然に防ぐ承認や権限分離、発見的統制はログの照合や棚卸しで問題を発見、是正的統制は発見した問題を修正する活動です。職務分掌は申請、承認、実行、記録等を適切に分ける考え方です。"},{"heading":"リスクに応じる","body":"すべての処理に同じ厳格な手続を設けると業務が遅くなります。金額やデータの重要度に応じ承認段階を設定し、例外手続も管理します。統制を設計しただけでなく実際に継続して運用されているかを確認します。"}]},{"id":"16-3","title":"監査計画・サンプリング・フォローアップ","explain":"\u003cp>全件を調べられないとき、監査では標本抽出により対象を検証する。無作為抽出は代表性を重視し、重点抽出は高リスク項目を集中的に調べるが、結果の一般化には制限がある。リスク評価に応じて対象システムと監査手続を選び、検出できなかったリスクも含めて結論を検討する。\u003c/p>\n\u003cp>監査後の改善提案は被監査部門が対応計画を立て、監査側がフォローアップを行い改善状況を確認する。監査報告では証拠に裏付けられた事実と推測を区別し、改善要請の優先度を示す。\u003c/p>\n","worked":"\u003cp>高リスクな本番管理者アカウントだけ10件を重点抽出して全件適切でも、「全ユーザー権限が適正」とは結論できない。抽出範囲に見合う表現にする。\u003c/p>\n","prompt":"監査証拠を得られない場合、適切に管理されていると判断してよいか。","answer":"\u003cp>よくない。証拠不十分という監査上の制限を記録する。\u003c/p>\n","beginner":{"scenario":"1000件の変更申請からサンプルを抽出し、承認記録・本番反映時刻を照合する。例外があれば母集団への影響も検討する。","trap":"少数の正常サンプルだけで全件正常と断定しない。","quizId":"U-16-3"},"textbook":[{"heading":"監査計画を立てる","body":"監査では目的、範囲、評価基準、対象期間、手続、担当を決めます。リスクの高い領域に重点を置くリスクアプローチを採り、過去の監査指摘や障害、変更状況などを考慮します。"},{"heading":"サンプルを調べる","body":"大量の取引を全件調べられない場合はサンプリングで一部を抽出し検証します。抽出の偏りを抑え、必要な証拠を収集し、例外があれば原因や他の取引への影響を評価します。監査調書には実施した手続、証拠、判断根拠を記録します。"},{"heading":"報告とフォローアップ","body":"指摘事項は具体的な事実、基準との差、リスクを示します。監査対象側が改善計画を作り、監査側は後日改善が行われたかフォローアップします。証拠なしに問題なしと断定しないことが重要です。"}]},{"id":"16-X01","title":"内部統制と具体的な監査手続","explain":"\u003cp>IT全般統制は開発・変更・アクセス・運用など、複数業務システムの信頼性を支える共通統制。業務処理統制は個別業務の入力・処理・出力の正確性、完全性、承認を確保する。内部統制には業務の有効性・効率性、報告の信頼性、法令遵守、資産保全などの目的がある。\u003c/p>\u003cp>監査では質問、観察、閲覧、再実施、サンプリング、監査ツールによるデータ分析を使い、統制が設計されているか、実際に運用されているかを分けて評価する。監査人は独立性を保ち、改善の実施責任は監査対象側にある。\u003c/p>","worked":"\u003cp>退職者IDの無効化手続はIT全般統制、販売伝票の金額自動照合は業務処理統制。\u003c/p>","prompt":"本番プログラム変更の承認手続は主にどちらか。","answer":"\u003cp>IT全般統制。\u003c/p>","beginner":{"scenario":"本番変更の承認手続は複数システム共通のIT全般統制。注文金額が数量×単価と一致する自動確認は個別業務の処理統制。","trap":"共通基盤の統制と個別処理の統制は目的が異なるが互いに関係する。","quizId":"U-16-X01"},"textbook":[{"heading":"IT全般統制と業務処理統制","body":"IT全般統制は複数のシステムを支える共通の管理で、アクセス管理、変更管理、運用管理などが含まれます。業務処理統制は個々の業務処理で入力・処理・出力の正確性、完全性、承認を確保します。例えば本番プログラム変更の承認は全般統制、注文金額の自動照合は業務処理統制です。"},{"heading":"統制が機能するか確認する","body":"設計の有効性は統制手続が目的に合っているか、運用の有効性は実際にその手続が実施されているかです。無効なIDを定期的に調べる手続が適切でも、実施されていなければリスクが残ります。"},{"heading":"具体的な監査手続","body":"質問だけで判断せず、承認記録の閲覧、実際の処理の観察、テスト用取引の再実施、ログの分析などを組み合わせます。監査証拠は十分な量と適切な質を備える必要があり、監査人自身の推測だけを根拠にしません。"}]},{"id":"16-Y01","title":"監査手続・証拠・保証と助言","explain":"\u003cp>システム監査はリスクと統制を独立かつ客観的に評価し、保証や助言を行います。監査計画、予備調査、本調査、証拠評価、報告、フォローアップの流れです。\u003c/p>","worked":"\u003cp>退職者一覧とアカウント一覧を突合し、残存アカウントの権限・無効化日時を確認する。\u003c/p>","prompt":"退職者のアカウント残存を調べる有効な監査手続は？","answer":"\u003cp>人事記録とアカウント一覧の突合。独立した記録を比較して例外を特定する。\u003c/p>","beginner":{"scenario":"会計システムのアクセス権が退職者から削除されているか独立した立場で確かめる。","trap":"監査人が被監査部門の管理責任を引き受けると独立性を損なう。","quizId":"U-16-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"システム監査はリスクと統制を独立かつ客観的に評価し、保証や助言を行います。監査計画、予備調査、本調査、証拠評価、報告、フォローアップの流れです。"},{"heading":"仕組みと使い分け","body":"ウォークスルーは一取引を開始から記録まで追い、突合は異なる記録を照合します。CAAT（Computer Assisted Audit Techniques：コンピュータ支援監査技法）はデータ分析やテストデータ法等を使います。証拠は十分性と適切性が必要で、口頭説明だけでは弱い場合があります。"},{"heading":"具体的な判断と手順","body":"退職者一覧とアカウント一覧を突合し、残存アカウントの権限・無効化日時を確認する。"}]},{"id":"16-Y02","title":"内部統制の六要素とIT統制","explain":"\u003cp>内部統制は組織が業務の有効性・効率性、報告の信頼性、法令等の遵守、資産保全を図る仕組みです。基本要素は統制環境、リスク評価と対応、統制活動、情報と伝達、モニタリング、ITへの対応です。\u003c/p>","worked":"\u003cp>支払承認を別人にするのは予防統制、日次の不一致照合は発見統制、誤記録を修正するのは是正統制。\u003c/p>","prompt":"本番プログラムの変更承認を管理する統制は主にどれ？","answer":"\u003cp>IT全般統制。複数業務に共通するシステム変更管理は全般統制。\u003c/p>","beginner":{"scenario":"支払担当者が自分で発注・検収・支払いを完結できると不正の危険が増える。","trap":"内部統制は共謀や経営者による無効化などの限界を持つ。","quizId":"U-16-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"内部統制は組織が業務の有効性・効率性、報告の信頼性、法令等の遵守、資産保全を図る仕組みです。基本要素は統制環境、リスク評価と対応、統制活動、情報と伝達、モニタリング、ITへの対応です。"},{"heading":"仕組みと使い分け","body":"IT全般統制はアクセス管理、変更管理、運用管理など広いシステム基盤を支えます。IT業務処理統制は入力の正確性、処理の完全性、出力確認など個々の業務処理を対象にします。予防・発見・是正統制も区別します。"},{"heading":"具体的な判断と手順","body":"支払承認を別人にするのは予防統制、日次の不一致照合は発見統制、誤記録を修正するのは是正統制。"}]}],"beginnerIntro":"組織が定めた仕組みが実際に機能するかを独立した立場から検証する。規程・証拠・実態を区別する。"},{"id":17,"title":"システム戦略","group":"ストラテジ","priority":"A重要","summary":"業務改革、IT戦略、EA、クラウド・外部委託の効果とリスク。","lessons":[{"title":"経営とITの整合","body":"情報システム戦略は経営目標から逆算し、何をITで変えるか、どの指標で成果を測るかを定める。導入技術自体を目的にしない。","check":"IT投資効果は売上だけでなく品質・時間・リスクも含める。"},{"title":"業務プロセス改革","body":"BPR（Business Process Re-engineering：業務プロセス再設計）は既存の業務を抜本的に見直す。BPM（Business Process Management：業務プロセス管理）は継続的な測定・改善を重視。","check":"現行の非効率な業務をそのままシステム化しない。"},{"title":"EAと全体最適","body":"EA（Enterprise Architecture：エンタープライズアーキテクチャ）は業務、データ、アプリ、技術を組織全体で整合させる枠組み。部分最適によるデータの分断を回避する。","check":"各部門で指標が異なれば共通データ定義が必要。"},{"title":"サービス調達","body":"SaaS（Software as a Service：ソフトウェア提供サービス）、PaaS（Platform as a Service：開発実行基盤提供サービス）、IaaS（Infrastructure as a Service：基盤提供サービス）の責任分担を理解する。","check":"クラウド事業者がすべてのセキュリティ責任を負うわけではない。"}],"terms":[{"term":"情報システム戦略","definition":"経営目的を実現する情報システムの方針と計画"},{"term":"BPR","definition":"業務プロセスを抜本的に見直し再設計すること"},{"term":"BPM","definition":"業務プロセスを継続的に把握・改善する管理手法"},{"term":"EA","definition":"業務・データ・アプリ・技術を全社横断で設計する枠組み"},{"term":"SaaS","definition":"完成したアプリケーションをサービスとして利用する形態"},{"term":"PaaS","definition":"アプリケーションの開発・実行基盤をサービスとして利用する形態"},{"term":"IaaS","definition":"仮想サーバー・ストレージ等のIT基盤を利用する形態"},{"term":"TCO","definition":"導入費用に加え運用・保守・廃棄まで含む総保有費用"},{"term":"アウトソーシング","definition":"業務や機能の一部を外部事業者に委託すること"}],"questions":[{"id":"Q17-01","chapter":17,"kind":"applied","q":"全社の業務・データ・アプリ・技術を整理して整合させる枠組みは。","options":["EA","MFA","TCP","RAID"],"correct":0,"explain":"EAは全社最適を図る構造化アプローチ。"},{"id":"Q17-02","chapter":17,"kind":"applied","q":"SaaS利用で利用者側に通常残る責任は。","options":["基盤の物理的な電源保守のみ","利用者アカウント・権限の適切な管理","クラウド事業者内部のディスク交換","通信回線の全物理設備修繕"],"correct":1,"explain":"責任共有モデルで利用者の設定・データ保護も重要。"},{"id":"Q17-03","chapter":17,"kind":"applied","q":"既存手順の微修正ではなく業務を根本から再設計するのは。","options":["BPR","バックアップ","単体テスト","容量計画"],"correct":0,"explain":"BPRは抜本的業務改革。"},{"id":"D17-01","chapter":17,"kind":"applied","q":"初期投資100万円、翌年と翌々年に各60万円のCF、割引率10%の場合のNPVに最も近いものはどれか。","options":["−20万円","0万円","4.1万円","20万円"],"correct":2,"explain":"−100＋60/1.1＋60/1.1²≈4.13万円。将来収入の現在価値を計算してから投資額を引く。"},{"id":"D17-02","chapter":17,"kind":"applied","q":"紙の申請書をPDF化するだけで業務の承認手順を変えない場合、最も近い説明はどれか。","options":["業務プロセスの根本再設計","アナログ情報のデジタル化","完全なDXの達成","必ず生産性が2倍"],"correct":1,"explain":"紙から電子データへの変換に近く、業務改革や事業変革の成否は別途評価が必要。"},{"id":"D17-03","chapter":17,"kind":"applied","q":"KGIとKPIの説明として適切なのはどれか。","options":["KGIは最終目標指標、KPIはプロセス等の重要指標","両者は測定できない","KPIは常に売上だけ","KGIは必ずシステムの処理時間"],"correct":0,"explain":"最終成果と、その達成に関係する活動指標を区別する。"},{"id":"Q-17-X01","chapter":17,"kind":"applied","q":"既存業務の流れを抜本的に再設計する手法は？","options":["BPR","DNS","RACI","CVSS"],"correct":0,"explain":"BPR。"},{"id":"U-17-1","chapter":17,"kind":"applied","q":"業務や事業モデルをデジタル技術で変革する考え方は？","options":["紙の電子化のみ","DX（デジタルトランスフォーメーション）","ファイル圧縮","単体テスト"],"correct":1,"explain":"DXはデジタル技術による業務・組織・事業等の変革を重視する。"},{"id":"U-17-2","chapter":17,"kind":"applied","q":"初期投資200万円、年間純便益50万円の単純回収期間は？","options":["0.25年","2年","4年","5年"],"correct":2,"explain":"初期投資÷年間純便益=200/50=4年。"},{"id":"U-17-3","chapter":17,"kind":"applied","q":"業務・データ・アプリ・技術の全体構造を整理する手法は？","options":["EVM（出来高管理）","RAID","CRC","EA（エンタープライズアーキテクチャ）"],"correct":3,"explain":"EAは組織全体の構造を整理し、戦略との整合を図る。"},{"id":"U-17-X01","chapter":17,"kind":"applied","q":"業務プロセスを抜本的に再設計する活動は？","options":["BPR","BPMのみ","DNS","CVSS"],"correct":0,"explain":"BPR（Business Process Reengineering：業務プロセス再設計）は抜本改革を指す。"}],"deepIntro":"IT投資の判断は「技術が新しいか」ではなく、経営目標と業務課題をどう改善するかを評価する。","deep":[{"id":"17-1","title":"経営戦略・IT戦略・DX","explain":"\u003cp>IT戦略は企業の経営目的を支えるため、システム投資、データ活用、体制、ガバナンス、リスク対処の方向性を定める。DX（Digital Transformation：デジタル変革）は単なる紙の電子化にとどまらず、データと技術による業務・顧客体験・ビジネスモデルの変革を指す。デジタイゼーションはアナログのデジタル化、デジタライゼーションは業務工程のデジタル化と区別することがある。\u003c/p>\n\u003cp>EA（Enterprise Architecture：エンタープライズアーキテクチャ）は業務・データ・アプリ・技術基盤などの全体構造を可視化し、重複・連携・改善方向を整理する。BPR（Business Process Re-engineering：業務プロセス再設計）は既存の仕事の流れを根本から見直す。\u003c/p>\n","worked":"\u003cp>紙の申請書をPDFにするだけでは申請・承認が遅い問題が残る。入力重複をなくし承認権限・順路を設計し直し、処理日数を測定するのが業務改革に近い。\u003c/p>\n","prompt":"DX施策の成果を導入したソフトウェア数だけで評価できるか。","answer":"\u003cp>できない。業務時間、品質、顧客価値、収益等の指標が必要。\u003c/p>\n","beginner":{"scenario":"在庫の過剰が経営課題なら、販売・在庫データを統合して発注精度を改善する。導入前後の在庫回転率と欠品率を比較する。","trap":"IT導入や紙の電子化自体が経営成果とは限らない。","quizId":"U-17-1"},"textbook":[{"heading":"経営とITをつなぐ","body":"経営戦略が「在庫削減と欠品防止」を目指すなら、IT戦略は在庫情報の共有や需要予測など、目標達成に必要な仕組みを考えます。ITを導入すること自体が目的ではなく、現行業務の課題と施策、成果指標を対応させます。"},{"heading":"DXとは何か","body":"既存の紙文書をデータ化するデジタイゼーション、デジタル技術で業務を改善するデジタライゼーション、業務・組織・事業モデルを変革するDX（デジタルトランスフォーメーション）という区別が使われます。単なる電子化でも価値がある場合はありますが、変革とは目的が異なります。"},{"heading":"成果を検証する","body":"施策前の欠品率や処理時間を測定し、導入後と比較します。売上の増加がシステムの効果か市場の変化か区別するため比較対象や条件を考えます。経営方針が変われば情報システム計画も見直します。"}]},{"id":"17-2","title":"投資評価・ポートフォリオ・KPI","explain":"\u003cp>ROI（Return On Investmen
