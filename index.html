雑な命令も備える。スーパースカラは複数命令を同時発行し、VLIW（超長命令語）は並列実行する操作を長い命令語にまとめる。SIMD（単一命令・複数データ）は同一演算を複数データに適用する。</p><p>ライトスルー方式はキャッシュ更新と主記憶更新を同時に行う。ライトバック方式は変更をキャッシュに保持し、必要時に主記憶へ書く。直接マップ・セットアソシアティブ・フルアソシアティブは配置候補の違い。SRAMは高速でキャッシュ、DRAMは高密度で主記憶に適する。フラッシュは不揮発性。</p>","worked":"<p>ヒット率90%、キャッシュ10ns、ミス時総時間100nsなら平均10×0.9＋100×0.1＝19ns。</p>","prompt":"キャッシュから追い出す際に変更内容を書き戻す方式は？","answer":"<p>ライトバック。</p>","beginner":{"scenario":"キャッシュのxを5から7に変えるとき、ライトスルーは主記憶も更新、ライトバックは変更を保持して後で書き戻す。","trap":"RISCとCISCの区別だけで実機の速度は決まらない。","quizId":"U-03-X01"},"textbook":[{"heading":"命令体系と実行並列性","body":"RISC（縮小命令セットコンピュータ）は比較的単純な命令体系を用い、CISC（複合命令セットコンピュータ）は複雑な操作を表す命令も持ちます。現代の実装は単純な二分では説明できません。スーパースカラは同じサイクルに複数命令を発行する仕組み、VLIW（超長命令語）は並列操作を長い命令語にまとめる方式、SIMD（単一命令・複数データ）は一命令で複数データを処理する方式です。"},{"heading":"キャッシュの配置","body":"直接マップはメモリブロックの格納候補が1箇所、セットアソシアティブは候補が複数、フルアソシアティブは任意の枠へ格納できます。候補が多いほど競合ミスを減らせる場合がありますが、検索回路は複雑になります。"},{"heading":"書込みの方式","body":"ライトスルーはキャッシュに書くとき主記憶も更新し、ライトバックは変更済みを記録して必要時にまとめて書き戻します。前者は主記憶との整合を保ちやすく、後者は書込み回数を減らせることがあります。複数CPUのキャッシュ間でデータの一貫性を保つ仕組みも必要です。"},{"heading":"命令の並列性を誰が決めるか","body":"VLIW（Very Long Instruction Word：超長命令語）はコンパイラが独立した複数の操作を同時実行できるようまとめて長い命令語を作ります。スーパースカラではプロセッサ側が実行可能な複数命令を発行します。MIMD（Multiple Instruction Multiple Data：複数命令・複数データ）は複数の処理装置が異なる命令列を実行する並列計算の分類です。"}]},{"id":"03-Y03","title":"並列処理・パイプライン・性能の限界","explain":"<p>フリンの分類は命令の流れとデータの流れの数で区別する。SISD（単一命令・単一データ）は通常の逐次実行、SIMD（単一命令・複数データ）は同じ演算を複数データに適用、MISD（複数命令・単一データ）は同じデータに複数の命令流を適用する稀な分類、MIMD（複数命令・複数データ）は複数プロセッサが独立に処理する構成。ベクトル処理は配列の要素をまとめて処理する。</p>","worked":"<p><b>5段パイプラインで10命令を理想的に処理する。</b></p><p>最初は5サイクル、残り9命令は各1サイクル。合計14サイクル。</p>","prompt":"5段パイプラインで10命令を理想的に処理する。","answer":"<p>最初は5サイクル、残り9命令は各1サイクル。合計14サイクル。</p>","textbook":[{"heading":"並列処理を分類する","body":"フリンの分類は命令の流れとデータの流れの数で区別する。SISD（単一命令・単一データ）は通常の逐次実行、SIMD（単一命令・複数データ）は同じ演算を複数データに適用、MISD（複数命令・単一データ）は同じデータに複数の命令流を適用する稀な分類、MIMD（複数命令・複数データ）は複数プロセッサが独立に処理する構成。ベクトル処理は配列の要素をまとめて処理する。"},{"heading":"パイプラインが止まる理由","body":"命令を取出し・解読・実行などに分割して重ねると、理想的にk段・n命令ならk+n−1サイクル。データハザードは先行命令の結果待ち、構造ハザードは同じ回路の競合、制御ハザードは分岐先が未確定な問題。フォワーディング、分岐予測、資源追加等で待ちを減らす。スーパーパイプラインは段を細分化、スーパースカラは複数命令を同時発行する。FLOPSは毎秒の浮動小数点演算数、命令ミックスは命令の構成比で性能に影響する。"},{"heading":"複数プロセッサを接続する","body":"密結合では主記憶等を共有し、SMP（対称型マルチプロセッシング）では複数CPUが概ね対等にOS等を実行する。疎結合では各計算機が独自の記憶を持ち通信する。タンデム結合は直列的な処理の協調などに用いられる。クラスタ・アレイコンピュータの接続にはトーラス、ハイパーキューブ、ハイパーツリー等がある。マルチコア、マルチスレッディング、高性能・省電力コアを組み合わせる異種マルチコアでは共有資源や同期が性能の制約になる。"}],"beginner":{"scenario":"並列処理を分類するから順に、パイプラインが止まる理由、複数プロセッサを接続するを理解する。","trap":"最初4サイクル、残り7サイクルで計11。","quizId":"U-03-Y03"}},{"id":"03-C01","title":"積和演算器と並列演算装置","explain":"<p>画像フィルタで積の和を繰り返し計算する。</p><p>シラバスVer.7.2 本文14頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>画像の3画素に重み2,1,3を掛けて加算する処理は積和演算。</p>","prompt":"画像フィルタで積和計算を多数行う。一回の計算を効率化する装置と、多数の画素を同時処理する構成を区別せよ。","answer":"<p>前者は積和演算器、後者はアレイプロセッサ等。頻出演算の効率化とデータ並列化は異なる粒度で、組み合わせられる。</p>","beginner":{"scenario":"画像フィルタで積の和を繰り返し計算する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-03-C01"},"textbook":[{"heading":"処理速度を上げる三つの観点","body":"処理装置の性能を上げる方法には、頻出の計算を専用回路で効率化する方法、多数の計算を同時に実行する方法、複数の装置で仕事を分ける方法があります。積和演算器、アレイプロセッサ、ロードシェアリングはそれぞれ異なる粒度の改善です。"},{"heading":"積和演算器：よく使う計算を効率化する","body":"積和演算はa×b+cのように乗算結果を加算する演算です。ベクトルの内積ではこの演算を繰り返し、ニューラルネットワークでは大量の内積を計算します。積和演算器はこうした演算を効率よく行う回路です。DSP（Digital Signal Processor: デジタル信号処理プロセッサ）やAI向け演算器でよく使われます。積和演算には途中の丸めを一回にまとめるFMA（融合積和演算）もありますが、全ての積和回路が同一とは限りません。"},{"heading":"アレイプロセッサ：多くの計算を並列化する","body":"行列や画像のように同種の計算を多数のデータに適用するなら、演算要素を複数配置して同時に処理できます。アレイプロセッサはこのような構成です。SIMD（Single Instruction Multiple Data: 単一命令複数データ）に代表されるデータ並列処理と関係します。ただし要素間の依存やメモリ帯域がボトルネックになれば演算器の数に比例して速くなるとは限りません。"},{"heading":"ロードシェアリング：仕事を装置間で分担する","body":"複数の処理装置が別々の仕事を引き受けることで、特定の装置に負荷が集中するのを抑え、全体の処理能力を上げます。負荷を分散する目的と、故障時のために待機系を確保する冗長化の目的を区別します。両方を実現する設計もあります。"},{"heading":"何を改善するかで方式を選ぶ","body":"一回の計算の効率が問題なら専用回路、同じ計算が大量にあるならデータ並列、互いに独立な要求が大量にあるなら仕事の分担を考えます。全体の処理時間は演算だけでなくデータ転送・待ち時間・逐次部分にも依存します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"03-Z02","title":"高性能計算：ノード・コア・FLOPS","explain":"<p>HPC（High Performance Computing：高性能計算）では複数の計算ノードやCPU・GPUのコアを使い、大量の演算を行います。ノード数をN、ノード当たりのコア数をC、コア当たりの演算性能をPとすると、総コア数=N×C、全コアの理論ピーク性能=N×C×Pです。</p>","worked":"<p>500ノード×16コア×25GFLOPS=200000GFLOPS=200TFLOPS。</p>","prompt":"100ノード、8コア/ノード、10GFLOPS/コア。総コア数を3倍、コア性能を2倍にすると理論性能は？","answer":"<p>元は100×8×10=8000GFLOPS=8TFLOPS。3×2倍で48TFLOPS。</p>","beginner":{"scenario":"並列計算機のノード数や1コアの性能を変更したとき、理論性能の変化を調べる。","trap":"総コア数の倍率とノード当たりコア数の倍率を重ねて掛けない。","quizId":"U-03-Z02"},"textbook":[{"heading":"基本原理","body":"HPC（High Performance Computing：高性能計算）では複数の計算ノードやCPU・GPUのコアを使い、大量の演算を行います。ノード数をN、ノード当たりのコア数をC、コア当たりの演算性能をPとすると、総コア数=N×C、全コアの理論ピーク性能=N×C×Pです。"},{"heading":"仕組み・計算","body":"FLOPS（Floating-point Operations Per Second：1秒当たり浮動小数点演算回数）は演算性能の指標です。GFLOPSは10の9乗、TFLOPSは10の12乗なので1000GFLOPS=1TFLOPSです。コア数を4倍、ノード当たりコア数を2倍にするなら、ノード数は4÷2=2倍です。"},{"heading":"応用と注意点","body":"理論性能は理想的に全コアを利用できる場合の上限です。実測値は通信や同期、メモリ帯域、並列化できない処理の影響を受けます。アムダールの法則は並列化できない割合による速度向上の上限を考えるものです。"}]},{"id":"03-2","title":"キャッシュ・主記憶・仮想記憶","explain":"<p>レジスタ、キャッシュ、主記憶、SSDは速度・容量・コストが異なる階層。キャッシュは時間的局所性（同じデータを再利用）と空間的局所性（近くのデータも使う）を利用する。キャッシュヒット率h、ヒット時のアクセス時間t₁、ミス時の追加ペナルティpなら平均時間はt₁＋(1−h)p（<strong>ペナルティが追加時間</strong>のとき）。表現によってはh×t₁＋(1−h)×t₂（ミス時の総時間）を用いる。</p>\n<p>仮想記憶はプロセスごとに仮想アドレス空間を与え、ページ表で物理メモリへ変換する。TLB（Translation Lookaside Buffer：アドレス変換キャッシュ）が変換を高速化する。ページフォールトが多く、ページの退避・読み込みに時間を奪われる状態がスラッシング。主記憶の不足を単なるCPU増強で解決できない。</p>\n","worked":"<p>ヒット率95%、ヒット5ns、ミス時の<strong>総</strong>アクセス105nsなら平均は0.95×5＋0.05×105＝10ns。105nsが追加ペナルティなら式が変わる点に注意。</p>\n","prompt":"TLBはデータ本体をキャッシュするか。","answer":"<p>基本的に仮想ページと物理フレームの変換情報を保持する。一般のCPUデータキャッシュとは役割が違う。</p>\n","beginner":{"scenario":"配列を順に読むと近くのデータがキャッシュに入っている場合がある（空間的局所性）。同じ変数を反復利用するのは時間的局所性。","trap":"キャッシュミスとページフォールトは別。前者で必ずディスクを読むわけではない。","quizId":"U-03-2","lab":{"title":"キャッシュのミス時の定義を読む","problem":"ヒット率95%、キャッシュ参照10ns。ミス時はキャッシュ参照の後、主記憶から100nsで取得する。平均アクセス時間は？","steps":["ヒット時は10ns。ミス時総時間は10＋100＝110ns。","ミス率は1−0.95＝0.05。","加重平均は0.95×10＋0.05×110＝9.5＋5.5＝15ns。","または常に10nsかかり、ミス時だけ100ns追加として10＋0.05×100＝15ns。"],"answer":"15ns","check":"ミス時の時間が総時間なのか追加時間なのか確認する。"}},"textbook":[{"heading":"なぜメモリに階層があるのか","body":"CPU内部のレジスタは速いが少量、キャッシュはその次、主記憶はより大容量、SSDやHDDはさらに大容量で電源を切っても保持できます。高速・大容量・低価格をすべて同時に満たしにくいため組み合わせます。主記憶のDRAMは定期的な再充電が必要で高密度、キャッシュのSRAMは高速ですが面積当たりの容量が小さくなりやすいです。"},{"heading":"キャッシュの仕組み","body":"必要なデータがキャッシュにあればヒット、なければミスで下位から取得します。時間的局所性は最近使ったデータをまた使う傾向、空間的局所性は近いアドレスを使う傾向です。キャッシュは近いデータをまとめて取り込みます。平均アクセス時間はヒット時時間とミス時総時間を確率で重み付けします。"},{"heading":"仮想記憶の仕組み","body":"プログラムが使う仮想アドレスをページ単位で物理メモリへ対応付けます。ページ表がその対応を記録し、TLB（アドレス変換キャッシュ）が変換を高速化します。必要なページが未配置ならページフォールトが起こりOSが処理します。ページを頻繁に入れ替えるスラッシングは性能を悪化させます。キャッシュはデータアクセス高速化、仮想記憶はアドレス空間と資源管理が主目的です。"}],"walkthrough":{"heading":"仮想アドレスと物理アドレスの対応","body":"ページの大きさを4096バイト（2¹²）とします。仮想アドレスはページ番号とページ内位置（オフセット）に分けます。例えば仮想アドレス5000なら、ページ番号は5000÷4096の整数部分1、オフセットは904です。ページ表で仮想ページ1が物理ページ枠7に対応するなら物理アドレスは7×4096＋904＝29576です。プログラムが見ている番号と実際のメモリ位置を分離することで、異なるプロセスが同じ仮想アドレスを利用でき、互いのメモリを保護できます。ページ表の参照自体もコストがあるため変換結果をTLB（アドレス変換キャッシュ）に保存します。","cols":["項目","値"],"rows":[["ページサイズ","4096B"],["仮想アドレス","5000"],["仮想ページ番号","1"],["オフセット","904"],["物理ページ枠","7"],["物理アドレス","29576"]]}},{"id":"03-Y04","title":"半導体メモリ・記憶形式・アクセス性能","explain":"<p>RAM（随時読書き可能な記憶）は主記憶等で使い、DRAMは電荷保持にリフレッシュが必要、SRAMは保持回路で高速。ROM（読出し専用記憶）系は不揮発性で、マスクROMは製造時固定、PROMは後から原則一度書込み、EPROMは紫外線等で消去、EEPROMは電気的消去・書換え、フラッシュは一般にブロック単位で消去する。NAND型は大容量記憶、NOR型はランダム読出し等に適する。FeRAM（強誘電体メモリ）は分極を利用する不揮発性記憶。</p>","worked":"<p><b>0x1234を16ビットのリトルエンディアンで格納する。</b></p><p>低アドレスに34、高アドレスに12を置く。</p>","prompt":"0x1234を16ビットのリトルエンディアンで格納する。","answer":"<p>低アドレスに34、高アドレスに12を置く。</p>","textbook":[{"heading":"電源を切るとどうなるか","body":"RAM（随時読書き可能な記憶）は主記憶等で使い、DRAMは電荷保持にリフレッシュが必要、SRAMは保持回路で高速。ROM（読出し専用記憶）系は不揮発性で、マスクROMは製造時固定、PROMは後から原則一度書込み、EPROMは紫外線等で消去、EEPROMは電気的消去・書換え、フラッシュは一般にブロック単位で消去する。NAND型は大容量記憶、NOR型はランダム読出し等に適する。FeRAM（強誘電体メモリ）は分極を利用する不揮発性記憶。"},{"heading":"主記憶へのアクセス","body":"SDRAM（同期型DRAM）はクロックに同期、DDR SDRAMはクロックの両エッジ等を使いデータ転送を高速化する。DDR2〜DDR5は世代が異なり互換性を確認する。DIMMはメモリモジュール、SO-DIMMは小型。主記憶のアドレス選択回路が位置を特定し読書き回路がデータを転送する。パリティやECC（誤り訂正符号）で誤りを検出・訂正する。メモリインタリーブは複数バンクへ連続アドレスを分散しアクセスを重ねる。アクセス時間は要求から応答、サイクル時間は次のアクセスが可能になるまでの間隔。"},{"heading":"バイト順と連想記憶","body":"32ビットの値0x12345678を低いアドレスから置くとビッグエンディアンは12 34 56 78、リトルエンディアンは78 56 34 12。値自体ではなくメモリ上のバイト順が違う。連想メモリはアドレスでなく内容から該当項目を探す。命令キャッシュとデータキャッシュを分ける構成は同時アクセスを可能にする場合がある。"}],"beginner":{"scenario":"電源を切るとどうなるかから順に、主記憶へのアクセス、バイト順と連想記憶を理解する。","trap":"複数バンクの処理を重ねメモリ帯域を改善する。","quizId":"U-03-Y04"}},{"id":"03-Z03","title":"キャッシュ置換：FIFO・LRU・LFU","explain":"<p>キャッシュは頻繁に使うデータの複製を高速な記憶装置へ置く仕組み。新しいブロックの格納先が埋まっている場合に追い出すブロックを決める。FIFO（First In First Out：先入れ先出し）は最も早く格納したもの、LIFO（Last In First Out：後入れ先出し）は最後に格納したものを追い出す。</p>","worked":"<p>A(1,8,10)、B(2,6,1)、C(3,4,3)ならLRUはC。</p>","prompt":"最終参照時刻が最も古いブロックを置換する方式は？","answer":"<p>LRUは最後に使った時刻を比較する。</p>","beginner":{"scenario":"新しいデータをキャッシュに入れたいが全枠が埋まっている。","trap":"ロード時刻が古いものと最後の参照が古いものは異なる。","quizId":"U-03-Z03"},"textbook":[{"heading":"基本原理","body":"キャッシュは頻繁に使うデータの複製を高速な記憶装置へ置く仕組み。新しいブロックの格納先が埋まっている場合に追い出すブロックを決める。FIFO（First In First Out：先入れ先出し）は最も早く格納したもの、LIFO（Last In First Out：後入れ先出し）は最後に格納したものを追い出す。"},{"heading":"仕組み・判断","body":"LRU（Least Recently Used：最長時間未使用）は最後に参照した時刻が最も古いもの、LFU（Least Frequently Used：最少使用頻度）は参照回数が最少のものを選ぶ。ロード時刻、最終参照時刻、参照回数の列を区別する。"},{"heading":"応用と注意点","body":"Aは時刻1にロード、最後の参照8、参照10回。Bは時刻2、最後の参照6、参照1回。Cは時刻3、最後の参照4、参照3回。FIFOはA、LIFOとLRUはC、LFUはB。実際の実装では近似法も使われる。"}]},{"id":"03-3","title":"ディスク・RAID・記憶装置","explain":"<p>HDD（Hard Disk Drive：磁気ディスク）は機械的なシーク時間と回転待ち時間が効く。平均回転待ち時間は1回転時間の約半分。7200rpmなら1回転8.33ms、平均回転待ち約4.17ms。さらにシーク・転送時間を加算する。SSD（Solid State Drive：半導体ドライブ）は機械的回転を伴わず、ランダムアクセスで有利なことが多いが、書込み寿命やコントローラ設計にも依存する。</p>\n<p>RAID（Redundant Array of Independent Disks：独立ディスクの冗長配列）は性能・冗長性を組み合わせる。RAID 0はストライピングで冗長性なし、RAID 1はミラーリング、RAID 5は分散パリティで最低3台、RAID 6は二重パリティで最低4台。RAIDはバックアップの代替ではなく、誤削除やランサムウェアへの復旧を保証しない。</p>\n","worked":"<p>4TB×5台のRAID5の単純な利用可能容量は(5−1)×4＝16TB（管理領域などは除く）。同容量RAID6なら(5−2)×4＝12TB。</p>\n","prompt":"RAID1だけで別拠点バックアップは不要か。","answer":"<p>不要とはいえない。論理削除・同時破損・災害・不正暗号化に備える別系統のバックアップが必要。</p>\n","beginner":{"scenario":"2TBディスク4台をRAID5にすると理論容量は(4−1)×2＝6TB。故障1台分の冗長性がある。","trap":"RAIDは誤削除やランサムウェアから復元するバックアップの代わりにならない。","quizId":"U-03-3"},"textbook":[{"heading":"記憶装置の違い","body":"HDD（磁気ディスク装置）は回転する円盤の位置にヘッドを移動して読み書きするため、シーク時間、回転待ち時間、データ転送時間がかかります。SSD（半導体記憶装置）は主にフラッシュメモリを利用し機械的移動がありません。書込み寿命や消去単位などの特性もあります。"},{"heading":"RAIDの仕組み","body":"RAIDは複数ディスクを一つの論理記憶装置のように使います。RAID0は分散書込み（ストライピング）で容量と並列性を得ますが冗長性なし。RAID1は同じ内容を複製（ミラーリング）。RAID5は分散パリティで1台、RAID6は二重パリティで2台の故障に耐える構成です。同容量n台ならRAID5の容量は(n−1)台分、RAID6は(n−2)台分です。"},{"heading":"バックアップとの違い","body":"ディスク故障からの継続・再構築を目的とするRAIDでも、利用者の誤削除や悪意ある暗号化は全体に反映され得ます。別の場所・媒体・時点のバックアップを作り、実際に復元できるか試します。容量の計算では十進TBと二進TiB、冗長化や管理領域を区別します。"}]},{"id":"03-Y08","title":"補助記憶装置・媒体とアクセス時間","explain":"<p>磁気ディスクの同心円がトラック、同じ半径のトラック群がシリンダ、トラックの分割がセクタ。仮に4記録面、各1000トラック、各200セクタ、1セクタ512Bなら容量は4×1000×200×512＝409600000B。実機は記録位置によってセクタ数が異なることもある。アクセスアームが磁気ヘッドを移動しスピンドルがディスクを回転させる。</p>","worked":"<p><b>7200rpmの平均回転待ちは？</b></p><p>1回転60000/7200＝約8.33ms、その半分で約4.17ms。</p>","prompt":"7200rpmの平均回転待ちは？","answer":"<p>1回転60000/7200＝約8.33ms、その半分で約4.17ms。</p>","textbook":[{"heading":"HDDの位置と容量","body":"磁気ディスクの同心円がトラック、同じ半径のトラック群がシリンダ、トラックの分割がセクタ。仮に4記録面、各1000トラック、各200セクタ、1セクタ512Bなら容量は4×1000×200×512＝409600000B。実機は記録位置によってセクタ数が異なることもある。アクセスアームが磁気ヘッドを移動しスピンドルがディスクを回転させる。"},{"heading":"アクセス時間を求める","body":"平均アクセス時間は通常、平均シーク時間＋平均回転待ち時間＋データ転送時間。6000rpmなら毎秒100回転、1回転10ms、平均回転待ち5ms。シーク8ms、転送1msなら計14ms。デフラグメンテーションは断片化したデータを整理しHDDの移動を減らす場合がある。SSDではウェアレベリングで書込みを分散し、書換え寿命の偏りを抑える。"},{"heading":"媒体の使い分け","body":"CD-ROMやDVD-ROMは読出し専用、CD-R等は追記型、CD-RWやDVD-RAM等は書換型。ブルーレイは光ディスク。SD/SDHC/SDXCは容量等の規格が異なる。磁気テープやDATは主に順次アクセスで長期保管等に利用し、ブロック間隔（IBG）やブロック化因数が容量・効率に関係する。ボリュームは論理的な記憶単位、ラベルは識別情報。MAID（休止ディスクを多数用いる記憶構成）はアクセスが少ないディスクを休止させ電力を削減する考え方。"}],"beginner":{"scenario":"HDDの位置と容量から順に、アクセス時間を求める、媒体の使い分けを理解する。","trap":"平均回転待ちは5ms。7＋5＋2＝14ms。","quizId":"U-03-Y08"}},{"id":"03-Z01","title":"フレームバッファと共有メモリ方式","explain":"<p>フレームバッファは画面へ表示する画素データの領域です。画素ごとに色などを記録し、表示回路が読み出します。画像の容量は幅×高さ×画素当たりビット数÷8で求めます。行の詰め物や複数バッファなどの実装上の追加容量は別です。</p>","worked":"<p>1280×720画素、32ビット/画素なら1画面は3,686,400バイト。2画面分なら7,372,800バイト。</p>","prompt":"ユニファイドメモリ方式のフレームバッファの特徴は？","answer":"<p>主記憶と表示領域を共有する方式。</p>","beginner":{"scenario":"画面を表示する画像データを、CPUとGPUがどのメモリに置くか比較する。","trap":"共有メモリは専用VRAMの追加を意味しない。","quizId":"U-03-Z01"},"textbook":[{"heading":"基本原理","body":"フレームバッファは画面へ表示する画素データの領域です。画素ごとに色などを記録し、表示回路が読み出します。画像の容量は幅×高さ×画素当たりビット数÷8で求めます。行の詰め物や複数バッファなどの実装上の追加容量は別です。"},{"heading":"仕組み・計算","body":"専用ビデオメモリ方式は表示・描画専用のメモリを持ちます。ユニファイドメモリ方式（共有メモリ方式）では主記憶の一部を画面表示領域として使用します。別の専用記憶が不要となる一方、一般処理と描画がメモリ帯域や容量を共有します。統合GPUで採用されることがあります。"},{"heading":"応用と注意点","body":"ダブルバッファリングでは一方を表示しながら別のバッファに次の画像を描き、切替えでちらつきを抑えます。メモリ共有の方式と、画面更新の方式は別です。共有メモリを使っても表示のリフレッシュが不要になるわけではありません。"}]},{"id":"03-4","title":"割込み・入出力・バス","explain":"<p>割込みはCPUが実行中の処理を一時中断して、優先度の高い事象に対応する仕組み。ハードウェア割込みは装置から、ソフトウェア割込みは命令や例外から起こる。DMA（Direct Memory Access：直接メモリアクセス）はCPUを介さず装置と主記憶間のデータ転送を助け、CPU負荷を軽減する。</p>\n<p>バスはCPU・メモリ・周辺機器の通信路。帯域幅とレイテンシ（処理開始から応答までの遅延）は別の性能指標。例えば帯域1GB/sでも1回の小さな転送が1nsで終わるとは限らない。GPU（Graphics Processing Unit：画像処理装置）は多数の演算を並列処理するのに適するが、データ転送や分岐の多い処理では必ずしも有利ではない。</p>\n","worked":"<p>100MBの連続転送を理論上200MB/sで行うなら転送時間0.5秒。実際には初期待ち・プロトコル処理・共有資源などが追加される。</p>\n","prompt":"DMAを使えばCPUはまったく関与しなくなるか。","answer":"<p>ならない。通常は転送設定や完了通知などでCPUが関与する。</p>\n","beginner":{"scenario":"CPUが印刷完了を何度も尋ねるのはポーリング、機器が完了時に通知するのは割込み。大量転送にはDMAを利用できる。","trap":"割込みは通知、DMAは転送方法。併用できる。","quizId":"U-03-4"},"textbook":[{"heading":"CPUと周辺機器の速度差","body":"キーボードやディスクの処理はCPUに比べ遅い場合があります。CPUが常に機器の完了を待っていては無駄です。ポーリングはCPUが定期的に装置の状態を確認し、割込みは装置やタイマなどがCPUへイベントを通知します。"},{"heading":"割込みの流れ","body":"CPUが通常処理中に割込み要求を受けると、必要な実行状態を保存し、割込み処理ルーチンを実行してから元の処理へ戻ります。優先度やマスクで通知の扱いを調整できます。例外は実行命令に起因する内部イベントなどを含みます。"},{"heading":"データを転送する方法","body":"プログラム制御入出力ではCPUが転送に関与し、DMA（Direct Memory Access：直接メモリアクセス）では制御器が主記憶と装置間のデータ転送を担当します。CPUは条件設定と完了処理などを行います。バスはデータ・アドレス・制御情報の経路で、幅と転送回数から理論帯域を求められます。割込みとDMAは競合する概念ではなく併用できます。"}]},{"id":"03-X02","title":"バス・入出力デバイスと装置","explain":"<p>バスはデータ、アドレス、制御情報を伝える共通経路。バス幅と転送周波数から理論帯域を計算できる。PCI Expressは高速なシリアル接続、USBは周辺機器の接続、SATAは記憶装置接続の規格。DMA（直接メモリアクセス）はCPUが各データを逐次転送する負担を減らす。</p><p>入出力装置のうち入力装置にはキーボード、光学式文字読取装置（OCR）、バーコードリーダ、タッチパネルなど、出力装置には表示装置、プリンタなどがある。SSDは半導体記憶、HDDは磁気ディスクであり、ディスクにはシーク時間・回転待ち・転送時間が生じる。</p>","worked":"<p>32bit幅で毎秒100万回転送なら理論上4MB/s。</p>","prompt":"CPUが各バイトを転送せず周辺装置と主記憶の間で転送する機構は？","answer":"<p>DMA。</p>","beginner":{"scenario":"64ビット幅は8バイト。毎秒1億回転送なら理論800MB/s。制御情報や待ち時間で実効値は下がる。","trap":"ビットとバイトを混同しない。接続規格の最大値と実効値は別。","quizId":"U-03-X02"},"textbook":[{"heading":"装置を接続する規格","body":"PCI Expressは内部機器の高速シリアル接続、USBは周辺機器の汎用接続、SATAは記憶装置の接続規格です。シリアル転送は信号線で順次送る方式、パラレル転送は複数ビットを並行して送る方式です。規格ごとに最大帯域や接続の条件が異なります。"},{"heading":"転送量を求める","body":"32ビットを毎回転送し毎秒5000万回なら32×5000万＝16億bit/s。8で割ると2億バイト/秒＝200MB/s（十進）。制御情報や符号化、待ち時間で実際のデータ量は減ります。周波数と毎秒転送回数は方式によって一致しないため問題の条件に従います。"},{"heading":"入出力の役割","body":"キーボード、タッチパネル、画像センサなどは情報を入力し、ディスプレイやプリンタは人に出力します。OCR（光学式文字認識）は画像中の文字を認識してテキストにする技術です。GPU（画像処理装置）は並列計算に利用されます。機器の特性を用途に合わせて選びます。"}]},{"id":"03-Y05","title":"バスの構造・調停・転送規格","explain":"<p>アドレスバスは対象位置、データバスは値、制御バスは読書き等の指示を伝える。内部バス、メモリバス、入出力バス、拡張バスなどは接続対象が異なる。プリンストン（フォンノイマン）型は命令とデータを共通の記憶・経路で扱い、ハーバード型は両者を分離して同時アクセスしやすくする。実機ではキャッシュのみ分離する等の混合構成もある。</p>","worked":"<p><b>32ビット幅で毎秒5000万回転送すると理論帯域は？</b></p><p>32×5000万÷8＝2億バイト/秒＝200MB/s。</p>","prompt":"32ビット幅で毎秒5000万回転送すると理論帯域は？","answer":"<p>32×5000万÷8＝2億バイト/秒＝200MB/s。</p>","textbook":[{"heading":"命令とデータの通り道","body":"アドレスバスは対象位置、データバスは値、制御バスは読書き等の指示を伝える。内部バス、メモリバス、入出力バス、拡張バスなどは接続対象が異なる。プリンストン（フォンノイマン）型は命令とデータを共通の記憶・経路で扱い、ハーバード型は両者を分離して同時アクセスしやすくする。実機ではキャッシュのみ分離する等の混合構成もある。"},{"heading":"共有経路の利用者を決める","body":"複数装置が同時にバスを使うと競合するため、バスアービタ（調停器）が使用権を割当てる。バスマスタは転送を開始する主体。集中制御では一つの調停器が要求と許可を管理する。ポーリングは順に要求を調べ、割込み方式は要求を通知する。バスアクセスモードで外部データ幅等を指定する機種もあり、指定幅やアラインメント（境界）によって必要転送回数が変わる。"},{"heading":"転送速度と規格","body":"理論帯域は転送幅×毎秒転送回数。64ビットを毎秒1億回送るなら800MB/s。PCIは拡張バス、PCI Expressは高速シリアル接続、NVMeは不揮発性記憶向けの通信規約で一般にPCI Express上等で使う。SCSIは周辺装置のコマンド・接続規格群、IEEE 1394はシリアル接続規格、USB（汎用シリアルバス）は周辺機器接続。規格世代、レーン数、符号化等によって実効性能は変わる。"}],"beginner":{"scenario":"命令とデータの通り道から順に、共有経路の利用者を決める、転送速度と規格を理解する。","trap":"命令読出しとデータアクセスを分離する。","quizId":"U-03-Y05"}},{"id":"03-Y06","title":"入出力インタフェース・接続形態・ドライバ","explain":"<p>USBは汎用機器、Thunderboltは高速周辺機器、RS-232Cはシリアル通信、HDMIとDisplayPortは映像・音声等、SATAは記憶装置、FC（ファイバチャネル）はストレージネットワーク等で使う。無線PAN（個人範囲網）のBluetoothやBLE（低消費電力Bluetooth）、ZigBeeやWi-SUNは近距離機器・センサ等に利用する。IrDAは赤外線、NFC（近距離無線通信）はごく近距離の通信。距離・消費電力・帯域・接続台数で選ぶ。</p>","worked":"<p><b>USB機器を接続すると自動認識し、電源を切らず取り外せる。この二つの機能は？</b></p><p>自動認識・設定はプラグアンドプレイ、通電中の着脱はホットプラグ。</p>","prompt":"USB機器を接続すると自動認識し、電源を切らず取り外せる。この二つの機能は？","answer":"<p>自動認識・設定はプラグアンドプレイ、通電中の着脱はホットプラグ。</p>","textbook":[{"heading":"装置に合わせた接続","body":"USBは汎用機器、Thunderboltは高速周辺機器、RS-232Cはシリアル通信、HDMIとDisplayPortは映像・音声等、SATAは記憶装置、FC（ファイバチャネル）はストレージネットワーク等で使う。無線PAN（個人範囲網）のBluetoothやBLE（低消費電力Bluetooth）、ZigBeeやWi-SUNは近距離機器・センサ等に利用する。IrDAは赤外線、NFC（近距離無線通信）はごく近距離の通信。距離・消費電力・帯域・接続台数で選ぶ。"},{"heading":"接続形態と転送方式","body":"スター接続は中心機器に各装置を接続、ツリー接続は階層化、カスケードは機器を段階接続、デイジーチェーンは装置を順につなぐ。ターミネータは伝送路端で反射を抑えるために使う場合がある。UART（汎用非同期送受信器）は非同期シリアルデータの送受信を担う。アナログは連続値、デジタルは離散値を扱う。"},{"heading":"OSと装置の橋渡し","body":"デバイスドライバはOSの要求を機器固有の制御へ変換する。プラグアンドプレイは接続機器を自動認識して資源やドライバを設定する仕組み、ホットプラグは電源を切らず着脱可能な性質。両者は同じではない。DMA（直接記憶アクセス）ではCPUの代わりに制御器がデータ転送し、チャネル制御方式では専用の入出力処理装置が複数の入出力操作を制御する。"}],"beginner":{"scenario":"装置に合わせた接続から順に、接続形態と転送方式、OSと装置の橋渡しを理解する。","trap":"OSの要求を機器固有の処理に変換する。","quizId":"U-03-Y06"}},{"id":"03-Y07","title":"入力・表示・印刷装置の原理","explain":"<p>マウスやトラックボールは位置指定、デジタイザやペンタブレットは座標・筆圧等、ジョイスティックは方向等を入力する。Nキーロールオーバーは同時押下を認識する能力。OCR（光学式文字認識）は文字画像を文字列に、OMR（光学式マーク読取）は塗りつぶされた位置等を読み取る。バーコードは光学的な符号、磁気カードは磁気記録、ICカードは半導体回路の情報を読む。生体認証装置は指紋等の特徴を取得する。</p>","worked":"<p><b>マークシートの塗りつぶしと手書き文字を読む。</b></p><p>塗りつぶし位置はOMR、文字そのものの認識はOCRが代表的。</p>","prompt":"マークシートの塗りつぶしと手書き文字を読む。","answer":"<p>塗りつぶし位置はOMR、文字そのものの認識はOCRが代表的。</p>","textbook":[{"heading":"人から機械への入力","body":"マウスやトラックボールは位置指定、デジタイザやペンタブレットは座標・筆圧等、ジョイスティックは方向等を入力する。Nキーロールオーバーは同時押下を認識する能力。OCR（光学式文字認識）は文字画像を文字列に、OMR（光学式マーク読取）は塗りつぶされた位置等を読み取る。バーコードは光学的な符号、磁気カードは磁気記録、ICカードは半導体回路の情報を読む。生体認証装置は指紋等の特徴を取得する。"},{"heading":"画面に画像を出す","body":"液晶は光の透過を制御し、TFT（薄膜トランジスタ）は画素の能動制御、STN液晶は液晶分子のねじれを利用する方式。OLED（有機EL）は画素自体が発光し、電子ペーパーは低電力で表示を保持しやすい。インタレースは走査線を交互に、ノンインタレースは順次描画する。パックトピクセルは各画素の色成分をまとめ、プレーナピクセルは成分やビット面ごとに分ける。VGA等の解像度規格、HMD（頭部装着表示器）、視線追跡、触覚提示も用途で区別する。"},{"heading":"印刷・音声・出力","body":"インパクトプリンタは打撃で印字、ノンインパクトは打撃を用いない。シリアルは文字単位、ラインは行単位、ページプリンタはページ単位の処理を行う分類。レーザーはトナーを用い、インクジェットはインクを噴射、3Dプリンタは材料を積層等して立体を作る。プロッタは図面出力等、D/A変換器は数値をアナログ信号へ変換し音声等に利用する。"}],"beginner":{"scenario":"人から機械への入力から順に、画面に画像を出す、印刷・音声・出力を理解する。","trap":"有機ELは発光材料で画素を発光させる。","quizId":"U-03-Y07"}}],"beginnerIntro":"CPU・メモリ・入出力装置がどう協力するかを学ぶ。速度計算では秒、Hz、ビットとバイトをそろえる。","studyGroups":[{"title":"CPUと命令","body":"命令の実行を理解し、並列化による速度向上と限界を考える。","ids":["03-1","03-Y01","03-Y02","03-X01","03-Y03","03-C01","03-Z02"]},{"title":"メモリとストレージ","body":"記憶階層とデータ配置を学び、アクセス速度と容量を整理する。","ids":["03-2","03-Y04","03-Z03","03-3","03-Y08","03-Z01"]},{"title":"入出力","body":"装置間のデータ移動、割込み、転送規格、表示・入力装置の順に理解する。","ids":["03-4","03-X02","03-Y05","03-Y06","03-Y07"]}]},{"id":4,"title":"システム構成・性能評価","group":"テクノロジ","priority":"A重要","summary":"可用性、冗長構成、稼働率、処理能力・信頼性を定量評価。","lessons":[{"title":"性能の3指標","body":"スループットは単位時間の処理件数、レスポンスタイムは要求から応答まで、ターンアラウンドタイムは投入から完了まで。ボトルネックは最も制約の強い資源。","check":"それぞれの時間の始点と終点を図にする。"},{"title":"可用性の算出","body":"稼働率A=MTBF/(MTBF+MTTR)。MTBF（Mean Time Between Failures：平均故障間隔）が大きくMTTR（Mean Time To Repair：平均修復時間）が小さいほど高い。","check":"MTBFと平均故障時間を混同しない。"},{"title":"直列と並列の冗長化","body":"独立した機器の直列システムは全台稼働が必要なので稼働率の積。並列冗長でどれか1台動けばよい場合は1−故障率の積。","check":"冗長化は故障が独立という前提に依存。"},{"title":"システム構成","body":"負荷分散は複数装置に仕事を分配し、フェイルオーバーは故障時に待機側へ切り替える。ホットスタンバイは迅速に切り替えやすいが費用がかかる。","check":"負荷分散と冗長化は関連するが同じではない。"},{"title":"容量計画","body":"最大負荷に余裕を持たせたサイジングを行い、実測値で予測を修正する。CPU使用率が高まると待ち時間が非線形に増える場合がある。","check":"ピーク時と平均時の両方を試算。"}],"terms":[{"term":"スループット","definition":"単位時間に処理できる仕事量"},{"term":"レスポンスタイム","definition":"要求を出してから応答が得られるまでの時間"},{"term":"ターンアラウンドタイム","definition":"処理依頼から結果全体が完了するまでの時間"},{"term":"MTBF","definition":"修理可能な装置の故障と故障の間の平均動作時間"},{"term":"MTTR","definition":"故障後の修理に要する平均時間"},{"term":"可用性","definition":"必要なときにシステムが利用できる度合い"},{"term":"フェイルオーバー","definition":"障害発生時に待機系へ自動・手動で切り替えること"},{"term":"ロードバランサ","definition":"複数のサーバーに処理負荷を振り分ける装置・機能"},{"term":"ホットスタンバイ","definition":"待機系を稼働状態で準備し迅速に切り替える構成"},{"term":"スケールアウト","definition":"サーバーなどの台数を増やして能力を拡張する方法"}],"questions":[{"id":"Q04-01","chapter":4,"kind":"applied","q":"MTBF=990時間、MTTR=10時間の稼働率は。","options":["90%","95%","99%","99.9%"],"correct":2,"explain":"990/(990+10)=0.99。"},{"id":"Q04-02","chapter":4,"kind":"applied","q":"独立して稼働率0.9の装置2台を並列にし1台動けばよい場合の稼働率は。","options":["0.81","0.90","0.95","0.99"],"correct":3,"explain":"両方停止する確率0.1×0.1=0.01を1から引く。"},{"id":"Q04-03","chapter":4,"kind":"applied","q":"応答時間は変わらず1秒間の処理完了数が増えたとき改善した指標は。","options":["稼働率","スループット","故障率","平均修復時間"],"correct":1,"explain":"単位時間の処理件数はスループット。"},{"id":"D04-01","chapter":4,"kind":"applied","q":"並列化できる部分が80%、4台並列で追加コストを無視した理論的な速度向上比はどれか。","options":["1.25倍","2.5倍","3.2倍","4倍"],"correct":1,"explain":"Amdahlの法則1/(0.2＋0.8/4)=2.5倍。直列部分が高速化を制限する。"},{"id":"D04-02","chapter":4,"kind":"applied","q":"故障が独立で、装置Aの稼働率0.90、Bの稼働率0.80の並列冗長構成の稼働率はどれか。","options":["0.72","0.80","0.90","0.98"],"correct":3,"explain":"どちらかが稼働すればよいので1−(1−0.9)(1−0.8)=0.98。"},{"id":"D04-03","chapter":4,"kind":"applied","q":"RPOが15分、RTOが2時間のシステムで目標としているものはどれか。","options":["最大2時間前のデータに戻し15分以内に復旧","最大15分前のデータに戻し2時間以内に復旧","必ずデータ損失ゼロで2時間以内に復旧","停止が2時間以内ならデータ損失は任意"],"correct":1,"explain":"RPOは目標復旧時点（許容するデータ損失の時間幅）、RTOは目標復旧時間。"},{"id":"Q-04-X01","chapter":4,"kind":"applied","q":"サーバを追加するのではなく既存機のメモリを増やすことは？","options":["スケールアウト","スケールアップ","フェイルオーバー","バックアップ"],"correct":1,"explain":"スケールアップ。"},{"id":"U-04-1","chapter":4,"kind":"applied","q":"単位時間当たりの処理完了件数は？","options":["レスポンスタイム","MTTR","スループット","稼働率"],"correct":2,"explain":"スループットは処理件数/時間、応答時間は一要求の所要時間。"},{"id":"U-04-2","chapter":4,"kind":"applied","q":"直列部分25%の処理を無限に並列化した場合の理論最大高速化率は？","options":["25倍","0.25倍","無限倍","4倍"],"correct":3,"explain":"残る時間比0.25の逆数は4。"},{"id":"U-04-3","chapter":4,"kind":"applied","q":"独立で稼働率0.8の2台が両方必要なシステムの稼働率は？","options":["0.64","0.96","0.8","0.4"],"correct":0,"explain":"直列は両方正常なので0.8×0.8。0.96は並列。"},{"id":"U-04-4","chapter":4,"kind":"applied","q":"復元40分、ログ適用15分、確認10分を順次実施。RTO60分は達成できるか？","options":["達成（40分）","未達（65分）","達成（55分）","達成（15分）"],"correct":1,"explain":"作業時間を合計すると65分で目標を超える。"},{"id":"U-04-X01","chapter":4,"kind":"applied","q":"複数の仮想マシンを実行・管理する基盤は？","options":["コンパイラ","デバッガ","ハイパーバイザ","ロードバランサ"],"correct":2,"explain":"ハイパーバイザは物理資源を仮想機へ割り当てる。"},{"id":"U-04-Y01","chapter":4,"kind":"applied","q":"インフラ構成をコードで管理し再現可能にする実践は？","options":["IaC","RPO","SJF","OCR"],"correct":0,"explain":"構成をコードで定義し自動化・版管理する。"},{"id":"U-04-Y02","chapter":4,"kind":"applied","q":"ファイル単位で共有するネットワーク接続記憶装置は？","options":["SANのみ","NAS","CPU","FPU"],"correct":1,"explain":"NASはファイル共有を提供する。"},{"id":"U-04-Y03","chapter":4,"kind":"applied","q":"故障率が初期に高く低下し、その後摩耗により上昇する特性は？","options":["ROC曲線","パレート図","バスタブ曲線","損益分岐点"],"correct":2,"explain":"初期・偶発・摩耗故障期の故障率の変化を示す。"}],"deepIntro":"システム性能は「処理能力」「待ち」「壊れたときの振る舞い」を分けて評価する。","deep":[{"id":"04-X01","title":"システム方式・分散処理・仮想化","explain":"<p>集中処理は一つの計算機に処理を集め、クライアントサーバ方式は要求側と提供側に分ける。シンクライアントは端末の処理・保存機能を抑え、サーバ側に集約する。クラスタは複数の計算機を協調させ、負荷分散や可用性向上を狙う。デュアルシステムは結果の照合など、デュプレックスシステムは主系と待機系の切替などを利用する。</p><p>ハイパーバイザは仮想マシンを実行し、コンテナは一般にホストOSのカーネルを共有する。スケールアップは一台の能力向上、スケールアウトは台数追加。RASISは信頼性・可用性・保守性・完全性・安全性を示す。ベンチマークで性能を測り、TCO（総保有費用）では導入から運用・廃棄までの費用を考える。</p>","worked":"<p>アクセス急増に対し同一Webサーバを3台から5台に増やし負荷分散するのはスケールアウト。DBが限界ならWebサーバ増加だけでは改善しない。</p>","prompt":"サーバを追加するのではなく既存機のメモリを増やすことは？","answer":"<p>スケールアップ。</p>","beginner":{"scenario":"Web画面は端末、業務処理はサーバ、データはDBサーバに分担できる。Webの負荷が増えればサーバを追加して振り分ける。","trap":"同一物理機上の仮想機は物理機の共通故障に弱い。","quizId":"U-04-X01"},"textbook":[{"heading":"機能をどこに置くか","body":"集中処理は中心計算機へ処理を集めます。クライアントサーバ方式は利用側と提供側を分離し、3層構成では表示・業務処理・データ管理を分けます。シンクライアントは端末の処理・保存を抑え、中心側で管理する方式です。分散処理は複数機器へ仕事を分けます。"},{"heading":"可用性と性能のための構成","body":"クラスタは複数計算機の協調で性能や可用性を向上させます。ロードバランサは要求を複数サーバへ分配。スケールアップは一台を強化、スケールアウトは台数追加です。デュアルシステムは同じ処理の結果照合など、デュプレックスは主系・待機系の切替などを利用します。"},{"heading":"仮想化と費用","body":"ハイパーバイザは物理機上で複数の仮想マシンを動かし、それぞれに資源を割り当てます。コンテナは一般にOSのカーネルを共有し実行環境を分離します。仮想化しても物理故障は共通になり得ます。TCO（総保有費用）は購入・導入・運用・保守・廃棄の費用を合計します。RASISは信頼性・可用性・保守性・完全性・安全性の評価観点です。"}]},{"id":"04-Y01","title":"分散システム・仮想化・クラウドの設計","explain":"<p>水平負荷分散は同種処理を複数機器で分担、水平機能分散は部門や業務など同じ階層で機能を分け、垂直機能分散は画面・業務・DB等の階層間で機能を分ける。ピアツーピアは端末同士が対等に通信、グリッドは分散した計算資源をまとめて利用する。HPC（高性能計算）は大規模並列等で科学計算などを実行する。RPC（遠隔手続呼出し）は別計算機の処理を呼び出す。ストアドプロシージャはDB側で保存・実行する処理。</p>","worked":"<p><b>仮想マシンを動かしたまま別ホストへ移したい。</b></p><p>ライブマイグレーションが候補。対応する共有記憶・ネットワーク等の条件を確認する。</p>","prompt":"仮想マシンを動かしたまま別ホストへ移したい。","answer":"<p>ライブマイグレーションが候補。対応する共有記憶・ネットワーク等の条件を確認する。</p>","textbook":[{"heading":"分散する対象を区別する","body":"水平負荷分散は同種処理を複数機器で分担、水平機能分散は部門や業務など同じ階層で機能を分け、垂直機能分散は画面・業務・DB等の階層間で機能を分ける。ピアツーピアは端末同士が対等に通信、グリッドは分散した計算資源をまとめて利用する。HPC（高性能計算）は大規模並列等で科学計算などを実行する。RPC（遠隔手続呼出し）は別計算機の処理を呼び出す。ストアドプロシージャはDB側で保存・実行する処理。"},{"heading":"共有の度合いと仮想化","body":"シェアードエブリシングは記憶等を広く共有し整合性管理が必要、シェアードナッシングはノードごとに資源を分け拡張性を得やすい。ホスト型仮想化はホストOS上で、ハイパーバイザ型は物理機上などで仮想マシンを管理する。VDI（デスクトップ仮想化基盤）は端末から中央の仮想デスクトップを利用する。ライブマイグレーションは稼働中の仮想マシンを別ホストへ移す技術で短い停止等が生じ得る。サーバコンソリデーションは複数の業務を少数の物理機へ集約する。"},{"heading":"クラウドの自動化","body":"IaC（Infrastructure as Code：インフラのコード化）は構成をコードで記述し再現・変更管理をしやすくする。FaaS（機能実行サービス）はイベントなどで関数を実行する方式、サーバレスはサーバ管理を利用者から抽象化する考え方。物理サーバが存在しないという意味ではない。エッジ計算は発生源の近くで処理し、クラウドとの間で遅延や通信量、運用性を比較する。"},{"heading":"IaCの再現可能なインフラ構築","body":"例えばサーバ2台とネットワーク、アクセス権限のあるべき構成をコードで定義し、専用ツールで実環境に反映します。手動の構築手順書だけの場合と違い、差分レビュー・版管理・再現性を得やすくなります。秘密情報はコードへ直接書かず、変更計画を確認し承認後に適用します。"}],"beginner":{"scenario":"分散する対象を区別するから順に、共有の度合いと仮想化、クラウドの自動化を理解する。","trap":"構成をコードで定義し自動化・版管理する。","quizId":"U-04-Y01"}},{"id":"04-Y02","title":"ストレージネットワーク・RAID・障害時の継続","explain":"<p>NAS（ネットワーク接続ストレージ）はファイル単位で共有し、SAN（ストレージ専用ネットワーク）は一般にブロック単位の記憶を提供する。FC-SANはファイバチャネル、IP-SANはIP網を利用する。ブロックストレージは固定長ブロックを読み書きしOS等がファイルを管理、オブジェクトストレージはデータ・識別子・メタデータをオブジェクトとして管理する。</p>","worked":"<p><b>2TBのディスク4台をRAID10で構成する。</b></p><p>通常2組のミラーをストライピングするので4TB。各組から1台ずつなら2台故障に耐え得るが同じ組の2台は不可。</p>","prompt":"2TBのディスク4台をRAID10で構成する。","answer":"<p>通常2組のミラーをストライピングするので4TB。各組から1台ずつなら2台故障に耐え得るが同じ組の2台は不可。</p>","textbook":[{"heading":"ストレージへの接続単位","body":"NAS（ネットワーク接続ストレージ）はファイル単位で共有し、SAN（ストレージ専用ネットワーク）は一般にブロック単位の記憶を提供する。FC-SANはファイバチャネル、IP-SANはIP網を利用する。ブロックストレージは固定長ブロックを読み書きしOS等がファイルを管理、オブジェクトストレージはデータ・識別子・メタデータをオブジェクトとして管理する。"},{"heading":"RAIDの追加方式","body":"RAID10はミラーの組をストライピングする構成で、4台なら容量は通常2台分。RAID2はハミング符号、RAID3はバイト単位等の分散と専用パリティ、RAID4はブロック単位の分散と専用パリティ、RAID5は分散パリティ。RAID6は二重パリティ。チャンクサイズは分散の単位。RAID10は同じミラー組の全台が故障すると失われ得るため単純に故障台数だけで耐性を決めない。"},{"heading":"障害対策の目的","body":"アクティブ・スタンバイは稼働系と待機系、アクティブ・アクティブは複数系を通常時も利用する。ホットサイトは災害時に即時に近く切替可能な設備、ウォームサイトは一定の準備、コールドサイトは設備等の立上げが必要。フォールトマスキングは故障の影響を隠す仕組み、フォールトアボイダンスは故障を起こしにくくする設計。フェールソフトは機能を縮退して継続、フェールセーフは安全状態へ移行する。"}],"beginner":{"scenario":"ストレージへの接続単位から順に、RAIDの追加方式、障害対策の目的を理解する。","trap":"NASはファイル共有を提供する。","quizId":"U-04-Y02"}},{"id":"04-1","title":"性能指標とボトルネック","explain":"<p>応答時間は要求から結果を受け取るまでの時間、スループットは単位時間の処理件数、ターンアラウンドタイムは投入から完了までの時間。利用率が上がれば処理能力が上がったように見えるが、待ち行列による応答時間悪化がある。ボトルネックはCPU、メモリ、ディスク、ネットワーク、ロック、外部APIなど複数候補を測って特定する。</p>\n<p>ベンチマークでは同じ負荷条件、データ量、測定時間、ウォームアップ条件を揃える。ピーク性能だけでなくp95（95パーセンタイル）応答時間を見れば「大多数は速いが一部は極端に遅い」状態も見つかる。</p>\n","worked":"<p>毎秒100件到着し、平均滞在時間が0.2秒の定常システムなら、リトルの法則L＝λW＝100×0.2＝平均20件が処理中または待機中。CPUが20個という意味ではない。</p>\n","prompt":"CPU使用率30%なのに応答時間が長い場合、CPU増設だけで改善するか。","answer":"<p>断定できない。I/O待ち、ロック、下流システムの遅延を調べる。</p>\n","beginner":{"scenario":"受付100件/秒、決済30件/秒、発送80件/秒の直列工程は最大30件/秒。受付を増強しても全体の能力は改善しない。","trap":"応答時間の短さとスループットの高さは別。","quizId":"U-04-1"},"textbook":[{"heading":"性能指標を分けて考える","body":"レストランで一人が入店から料理を受け取る時間と、1時間に提供できる料理数は別です。レスポンスタイムは要求から応答まで、ターンアラウンドタイムは処理依頼から全処理完了まで、スループットは単位時間に完了する件数です。バッチ処理はまとめて処理し、オンライン処理は個別要求に応答します。"},{"heading":"ボトルネックを探す","body":"受付毎秒100件、処理毎秒40件、保存毎秒80件なら、直列の全体能力は毎秒40件です。受付を200件にしても改善しません。各工程の利用率や待ち時間、CPU・メモリ・ディスク・ネットワークの測定から制約を探します。"},{"heading":"測定条件を確認する","body":"ベンチマークは一定の負荷条件で性能を測ることです。平均応答時間だけでは遅い一部の要求を見落とすため、95パーセンタイルなどの指標も使います。負荷試験では想定利用者数や要求パターンを再現し、性能が不足する箇所を確認します。"}]},{"id":"04-2","title":"直列・並列・Amdahlの法則","explain":"<p>並列化できる割合p、プロセッサ数n、並列化以外の追加コストを無視すると、速度向上比はS(n)=1/[(1−p)+p/n]。直列部分(1−p)が並列化による改善を制限する（Amdahlの法則）。スケールアップは単体装置の増強、スケールアウトは装置の台数増。分散システムでは通信コスト・同期・障害処理があるので理論式は上限の目安である。</p>\n","worked":"<p>80%が並列化可能で4台使うならS=1/(0.2+0.8/4)=2.5倍。100台にしても極限は1/0.2=5倍。80%×4=3.2倍と単純計算しない。</p>\n","prompt":"並列可能率が50%の場合、台数を無限に増やした理論上限は。","answer":"<p>2倍。</p>\n","beginner":{"scenario":"10秒の処理のうち直列2秒、並列8秒。4台なら2＋8/4＝4秒、速度向上10/4＝2.5倍。","trap":"台数を増やしても直列部分は残る。","quizId":"U-04-2"},"textbook":[{"heading":"並列化できる仕事とできない仕事","body":"料理を4人で作ってもオーブンが一つで順にしか焼けなければ、焼く時間は減りません。プログラムでもデータ依存や順次処理のため並列化できない部分があります。元の処理時間を1、並列化できる割合をp、並列数をNとすると新しい処理時間比は(1−p)＋p/Nです。"},{"heading":"高速化率の計算","body":"元の処理10秒のうち8秒を4台に均等分割すると、並列部分2秒＋直列部分2秒＝4秒。高速化率は10/4＝2.5倍。一般式はS=1/((1−p)＋p/N)です。無限に台数を増やしても直列部分が残るので、最大値は1/(1−p)です。"},{"heading":"現実との差","body":"通信、同期、分割の偏り、資源競合には時間がかかります。Amdahlの法則は問題の規模を一定にして理想的な並列化を考えるモデルなので、現実の速度を保証しません。台数を増やすより直列部分そのものを改善する方が有効な場合があります。"}]},{"id":"04-3","title":"可用性・直列並列冗長化・信頼性","explain":"<p>稼働率Aは利用可能時間/全時間の割合。平均故障間隔MTBF（Mean Time Between Failures）と平均修復時間MTTR（Mean Time To Repair）を用いる単純モデルではA＝MTBF/(MTBF+MTTR)。部品が独立して故障するなら、全て必要な直列構成はA全体＝A₁×A₂、いずれか稼働すれば動く並列冗長構成はA全体＝1−(1−A₁)(1−A₂)。共通原因故障があると独立の仮定は崩れる。</p>\n<p>フェイルオーバーは障害発生時に待機系へ切り替えること。ホットスタンバイは待機系を動作状態に近く保ち、切替時間を短くできる。負荷分散装置が単一障害点にならないよう設計する。</p>\n","worked":"<p>独立した装置A=0.9、B=0.8の並列稼働率は1−0.1×0.2=0.98。直列なら0.9×0.8＝0.72。「並列＝掛け算」と誤らない。</p>\n","prompt":"99.9%稼働率なら年間停止許容時間は約何時間か。","answer":"<p>365×24×0.001＝8.76時間（単純計算）。</p>\n","beginner":{"scenario":"平均90時間稼働し10時間修復する機器の稼働率は90/(90＋10)＝0.9。独立な2台のどちらかが動けば0.99。","trap":"共通電源の故障などで独立性が成り立たない場合がある。","quizId":"U-04-3","lab":{"title":"直列・並列が混ざるシステム","problem":"ルータ稼働率0.99、その先のWebサーバ2台は各0.9で少なくとも1台必要。DB稼働率0.98。独立故障を仮定。全体稼働率は？","steps":["Web群は両方停止が0.1×0.1＝0.01なので稼働率0.99。","ルータ、Web群、DBのすべてが稼働する必要があるため直列。","0.99×0.99×0.98＝0.960498。","約96.05%。サーバ群だけ冗長化しても他の単一障害点が残る。"],"answer":"約96.05%","check":"並列部分を一つの装置として先に計算し、直列部分と掛け合わせる。"}},"textbook":[{"heading":"故障と修復を時間で考える","body":"機器は正常稼働と停止・修復を繰り返します。MTBF（平均故障間隔）は修理可能な機器の平均稼働時間の指標、MTTR（平均修復時間）は復旧までの平均時間です。定常的な基本モデルの稼働率はMTBF/(MTBF＋MTTR)。故障を減らすか修復を速くすると稼働率が上がります。"},{"heading":"直列・並列の違い","body":"二つとも正常でないと動かない直列構成では独立なら稼働率A×B。どちらか動けばよい並列構成では両方停止する確率(1−A)(1−B)を1から引きます。稼働率0.9の2台なら直列0.81、並列0.99です。"},{"heading":"冗長化の設計","body":"ホットスタンバイは待機系を稼働状態に近く保ち、コールドスタンバイは必要時に起動します。フェイルオーバーは故障時の切替、フェイルバックは復旧後の戻しです。共通の電源やネットワークが単一障害点なら独立故障の計算は成立しません。切替時間・失敗の可能性も評価します。"},{"heading":"稼働率の分母と故障指標","body":"MTBF（Mean Time Between Failures：平均故障間隔）は修理可能な機器の故障から次の故障までの平均稼働時間として試験では扱います。MTTR（Mean Time To Repair：平均修復時間）は停止から修復までの平均です。MTTF（Mean Time To Failure：平均故障時間）は修理しない機器などの故障までの平均時間です。MTBF=99時間、MTTR=1時間なら稼働率99/(99+1)=99％。単にMTBF−MTTRとはしません。"}]},{"id":"04-4","title":"バックアップ・復旧目標・容量設計","explain":"<p>RTO（Recovery Time Objective：目標復旧時間）は事故から業務を再開するまでの目標時間。RPO（Recovery Point Objective：目標復旧時点）は何分・何時間前までのデータ損失を許容するかを示す。例：RTO=2時間、RPO=15分なら、2時間以内の再開と最大15分前までへのデータ復旧を設計する。RPOを短くするには同期・非同期レプリケーションやログ転送、RTOを短くするには待機環境や復旧手順の自動化が効く。</p>\n<p>容量計画は平均負荷だけでなくピーク、成長率、冗長化時の片系運転、バックアップ容量を考える。バックアップは復旧訓練で実際に読めるかを確かめる。障害対応の「稼働率」と「データ損失量」は別の軸である。</p>\n","worked":"<p>1日10GB増えるDBを60日保持し、日次差分と週次フルを併用する場合、必要容量は単純な10×60だけでは求められない。フルの時点・変更量・圧縮・世代数を明示して合計する。</p>\n","prompt":"RTOを1時間から15分に改善したらRPOも改善するか。","answer":"<p>別指標なので必ずしも改善しない。</p>\n","beginner":{"scenario":"12時に障害、最終保全11時50分、復旧12時40分なら失う更新は最大10分、復旧時間40分。","trap":"RPOは許容するデータ損失時間、RTOは許容復旧時間。","quizId":"U-04-4"},"textbook":[{"heading":"障害から何を取り戻すか","body":"RTO（Recovery Time Objective：復旧時間目標）は停止から何時間以内に戻すか、RPO（Recovery Point Objective：復旧時点目標）はどの時点までのデータを回復するかです。1日1回のバックアップだけなら最悪約1日分の変更を失う可能性があります。ログを頻繁に保全すればRPOを短くできる場合があります。"},{"heading":"バックアップの方式","body":"フルは全データ、差分は直近フル以降の変更、増分は直近バックアップ以降の変更を保存します。差分復元はフルと最新差分、増分復元はフルと必要なすべての増分が基本です。取得時間・容量・復元時間が異なります。"},{"heading":"容量と事業継続","body":"毎日20GB増え30日保持するなら変更量だけで600GBを見込み、圧縮率、冗長化、世代数、増加傾向を追加します。遠隔地への保全、アクセス権分離、復元試験も必要です。BCP（事業継続計画）は災害などで重要業務を継続・復旧する計画で、ITの復旧はその一部です。"}]},{"id":"04-Y03","title":"性能評価・容量計画・信頼性と経済性","explain":"<p>SPEC（標準性能評価団体）のベンチマークには整数・浮動小数点処理等の評価があり、TPCは取引処理等のベンチマークを策定する。ギブソンミックスは命令の構成比による性能評価の考え方。システムモニタで実際の負荷と応答時間を把握し、サイジング（必要資源の見積り）、プロビジョニング（資源の準備・割当て）を行う。例えば平均40件/秒の能力に対しピーク60件/秒が来るなら処理増強か待ち許容時間を検討する。</p>","worked":"<p><b>A初期100、年40、B初期180、年20万円。どの年で同額になる？</b></p><p>100＋40n＝180＋20nよりn＝4年。</p>","prompt":"A初期100、年40、B初期180、年20万円。どの年で同額になる？","answer":"<p>100＋40n＝180＋20nよりn＝4年。</p>","textbook":[{"heading":"性能を測って計画する","body":"SPEC（標準性能評価団体）のベンチマークには整数・浮動小数点処理等の評価があり、TPCは取引処理等のベンチマークを策定する。ギブソンミックスは命令の構成比による性能評価の考え方。システムモニタで実際の負荷と応答時間を把握し、サイジング（必要資源の見積り）、プロビジョニング（資源の準備・割当て）を行う。例えば平均40件/秒の能力に対しピーク60件/秒が来るなら処理増強か待ち許容時間を検討する。"},{"heading":"故障率の時間変化","body":"バスタブ曲線では初期故障期に故障率が低下、偶発故障期は概ね一定、摩耗故障期は上昇する。初期不良検査、予防交換等を故障特性に合わせる。RASIS（信頼性・可用性・保守性・完全性・安全性）は止まりにくさだけでなく復旧しやすさやデータ保護も評価する。稼働率は故障率そのものとは異なり修復時間にも依存する。"},{"heading":"総費用で比較する","body":"TCO（総保有費用）は導入・運用・保守・廃棄等を含む。初期費用A100万円・年費用40万円、B180万円・年費用20万円なら5年総額はA300万円、B280万円。初期コストだけでは判断できない。直接コストは購入・保守など直接帰属できる費用、間接コストは利用者の教育や停止に伴う業務負担等も考える。"},{"heading":"キャパシティプランニングと性能改善の違い","body":"現在の応答時間・使用率・件数を継続的に測り、利用者数やデータ量の将来増加を予測して、必要な能力と増強時期を計画するのがキャパシティプランニングです。ボトルネック解消やチューニングは現時点の性能改善手段です。将来の負荷に対する応答時間・費用・余裕を評価してから増設や改善を判断します。"}],"beginner":{"scenario":"性能を測って計画するから順に、故障率の時間変化、総費用で比較するを理解する。","trap":"初期・偶発・摩耗故障期の故障率の変化を示す。","quizId":"U-04-Y03"}}],"beginnerIntro":"複数機器でサービスを実現する構成を学ぶ。処理能力、可用性、復旧時間を区別して全体を図にする。","studyGroups":[{"title":"システムの構成","body":"どこに処理・記憶を置くかを決め、仮想化と分散を理解する。","ids":["04-X01","04-Y01","04-Y02"]},{"title":"性能と並列化","body":"処理能力、待ち時間、並列化の限界を定量評価する。","ids":["04-1","04-2"]},{"title":"信頼性と復旧","body":"故障の確率、継続性、復旧と費用の均衡を設計する。","ids":["04-3","04-4","04-Y03"]}]},{"id":5,"title":"オペレーティングシステム・ソフトウェア","group":"テクノロジ","priority":"A重要","summary":"プロセス、スレッド、排他制御、仮想記憶、ファイルシステム、OSS。","lessons":[{"title":"プロセスとスレッド","body":"プロセスは実行中のプログラムの資源単位。スレッドは同一プロセスでメモリ空間などを共有する実行単位で、共有状態に競合が起きる。","check":"スレッド間共有とプロセス間分離を区別。"},{"title":"排他制御とデッドロック","body":"排他制御は共有資源を同時に不整合な形で変更しないための仕組み。デッドロックは互いに資源の解放を待ち永久に進まない状態。資源獲得順序の統一が予防に有効。","check":"ロックの取得順序を具体例で追う。"},{"title":"スケジューリング","body":"ラウンドロビンは一定のタイムスライスごとにCPU利用を交代する。優先度方式では低優先度タスクの飢餓に注意。","check":"応答性とスループットはトレードオフ。"},{"title":"仮想記憶","body":"ページ単位に主記憶と補助記憶を入れ替える。ページフォールトは必要ページが主記憶にない状態。頻発するとスラッシングで性能が大きく下がる。","check":"ページングは容量拡張のため、キャッシュは速度改善のためという違いも押さえる。"},{"title":"OSSとライセンス","body":"OSS（Open Source Software：オープンソースソフトウェア）はライセンスに基づき利用・改変・再配布ができる。GPLは条件次第で派生作品のソース公開義務が生じる一方、MITは比較的緩やかなライセンス。","check":"OSSだから著作権がないわけではない。"}],"terms":[{"term":"プロセス","definition":"実行中プログラムの資源管理単位"},{"term":"スレッド","definition":"同一プロセス内で動く軽量な実行単位"},{"term":"セマフォ","definition":"共有資源にアクセスできる数を制御する同期手段"},{"term":"ミューテックス","definition":"相互排他のためのロック"},{"term":"デッドロック","definition":"複数処理が互いの資源解放を待ち停止する状態"},{"term":"ラウンドロビン","definition":"一定時間ごとに実行中タスクを切り替える方式"},{"term":"ページフォールト","definition":"必要な仮想記憶ページが主記憶上にない事象"},{"term":"スラッシング","definition":"ページの入替えが多発して処理性能が著しく落ちる状態"},{"term":"GPL","definition":"改変や再配布に一定のソース提供等の条件を付す自由ソフトウェアライセンス"},{"term":"ミドルウェア","definition":"OSとアプリケーションの間で共通機能を提供するソフトウェア"}],"questions":[{"id":"Q05-01","chapter":5,"kind":"applied","q":"デッドロックを予防する方法として適切なのは。","options":["資源取得順を全処理で統一する","ロック時間を無制限に延ばす","全処理の優先度を同じにする","スレッドを増やす"],"correct":0,"explain":"循環待ちが起こらない順序を定義する。"},{"id":"Q05-02","chapter":5,"kind":"applied","q":"ページフォールトが頻発しディスク交換ばかり行う現象は。","options":["キャッシュヒット","スラッシング","スプーリング","ポーリング"],"correct":1,"explain":"ページングが過度に発生すると処理が進まなくなる。"},{"id":"Q05-03","chapter":5,"kind":"applied","q":"スレッドに関して正しいのは。","options":["常に別の主記憶空間を持つ","同一プロセスで資源を共有し得る","スレッド間では競合しない","独立した実行単位ではない"],"correct":1,"explain":"同一プロセスのスレッドは共有メモリの競合に注意。"},{"id":"D05-01","chapter":5,"kind":"applied","q":"タスクAがXロックを保持してYを待ち、BがYを保持してXを待つときの問題はどれか。","options":["スラッシング","デッドロック","ページフォールト","キャッシュミス"],"correct":1,"explain":"循環待ちが形成され互いに進めない。ロック獲得順を統一するなどで防止する。"},{"id":"D05-02","chapter":5,"kind":"applied","q":"ページ枠が3つあり、参照列1,2,3,1,4をLRU方式で処理するとき、4の到着時に追い出すページはどれか。","options":["1","2","3","4"],"correct":1,"explain":"1を再参照したため最も長く参照されていないのは2。FIFO方式なら1を追い出す。"},{"id":"D05-03","chapter":5,"kind":"applied","q":"スレッドとプロセスの説明として適切なものはどれか。","options":["異なるプロセスは常に同じ仮想アドレス空間を共有する","同一プロセスのスレッドは通常アドレス空間を共有する","スレッドはCPU資源を消費しない","プロセス間通信は不要である"],"correct":1,"explain":"同一プロセス内のスレッドは通常アドレス空間を共有し、共有変数の競合に注意する。"},{"id":"Q-05-X01","chapter":5,"kind":"applied","q":"ブレークポイントでプログラムを止めて変数を調べるツールは？","options":["リンカ","デバッガ","ローダ","スプーラ"],"correct":1,"explain":"デバッガ。"},{"id":"U-05-1","chapter":5,"kind":"applied","q":"一定時間ずつ順番にCPUを割り当てる方式は？","options":["最短経路法","LRU","ライトバック","ラウンドロビン"],"correct":3,"explain":"タイムスライスごとに実行を切り替える方式。"},{"id":"U-05-2","chapter":5,"kind":"applied","q":"AはX保持でY待ち、BはY保持でX待ち。現象は？","options":["デッドロック","スラッシング","ページフォールト","オーバーフロー"],"correct":0,"explain":"互いに相手の資源解放を待ち進行不能になる。"},{"id":"U-05-3","chapter":5,"kind":"applied","q":"最も以前に読み込んだページを追い出す方式は？","options":["LRU","FIFO","ラウンドロビン","二分探索"],"correct":1,"explain":"FIFOは読込順、LRUは最後の参照時刻で決める。"},{"id":"U-05-4","chapter":5,"kind":"applied","q":"目的コードの外部参照を解決して結合するツールは？","options":["エディタ","デバッガ","リンカ","シェル"],"correct":2,"explain":"リンカは目的コードやライブラリを結合する。"},{"id":"U-05-X01","chapter":5,"kind":"applied","q":"ファイルシステム変更の記録を障害回復に利用する機能は？","options":["スプーリング","コンパイル","スケジューリング","ジャーナリング"],"correct":3,"explain":"変更の記録から整合性回復を支援する。スプーリングは入出力要求の蓄積。"},{"id":"U-05-Y01","chapter":5,"kind":"applied","q":"実行可能タスクにCPUを割り当てる機能は？","options":["リンカ","プロッタ","ハッシュ関数","ディスパッチャ"],"correct":3,"explain":"ディスパッチャは選択されたタスクを実行状態にする。"},{"id":"U-05-Y02","chapter":5,"kind":"applied","q":"可変区画で空き領域が離れてしまい十分な連続領域が得られない現象は？","options":["外部断片化","内部断片化のみ","デッドロック","キャッシュヒット"],"correct":0,"explain":"総空き量が足りても連続領域が不足する現象。"},{"id":"U-05-Y03","chapter":5,"kind":"applied","q":"メモリと同じアドレス空間に機器制御レジスタを配置する方式は？","options":["I/OマップドI/Oのみ","メモリマップドI/O","仮想マシン移行","スプーリング"],"correct":1,"explain":"メモリアクセス命令等で機器レジスタにアクセスする。"},{"id":"U-05-Y04","chapter":5,"kind":"applied","q":"アプリの骨組みや実行制御を提供する再利用基盤は？","options":["磁気テープ","メモリバンク","開発フレームワーク","パリティ"],"correct":2,"explain":"共通構造を提供して開発を支援する。"},{"id":"U-05-Y05","chapter":5,"kind":"applied","q":"論理レコードをまとめて物理レコードにする処理は？","options":["デブロッキング","コンパイル","ポーリング","ブロッキング"],"correct":3,"explain":"複数の論理レコードを一つの物理転送単位にする。"},{"id":"U-05-Y06","chapter":5,"kind":"applied","q":"プログラムを実行せず変数の未初期化等の疑いを調べる方法は？","options":["静的解析","負荷試験のみ","実機の動的追跡","増分バックアップ"],"correct":0,"explain":"静的解析はコード等から潜在的問題を検出する。"},{"id":"U-05-Y07","chapter":5,"kind":"applied","q":"コンテナの配置・スケーリング等を管理するOSSは？","options":["Grafana","Kubernetes","Selenium","Git"],"correct":1,"explain":"Kubernetesはコンテナオーケストレーション基盤。"}],"deepIntro":"OSはアプリとハードウェアの間で、CPU・メモリ・ファイル・入出力資源を安全に分配する。","deep":[{"id":"05-Y01","title":"OSの構成・起動・ジョブと特権","explain":"<p>カーネルは資源管理などOSの中心機能。モノリシックカーネルは多くの機能をカーネル側で実行、マイクロカーネルは必要最小限をカーネルに置き他機能を外部サービスに分ける考え方。UNIX系、PC用、モバイル、組込み、リアルタイムOSは用途・制約が異なる。起動時はファームウェアからブートストラップ（初期起動処理）でOSを読み込む。ネットワークブートはネット経由、マルチブートは複数OSから選択し、フラッシュブートローダはフラッシュ上の起動処理等に用いる。</p>","worked":"<p><b>アプリが直接ディスクを操作せずOSに依頼する理由は？</b></p><p>OSが権限や資源競合を管理し、機器固有の処理を共通の窓口で提供するため。</p>","prompt":"アプリが直接ディスクを操作せずOSに依頼する理由は？","answer":"<p>OSが権限や資源競合を管理し、機器固有の処理を共通の窓口で提供するため。</p>","textbook":[{"heading":"OSの内部と起動","body":"カーネルは資源管理などOSの中心機能。モノリシックカーネルは多くの機能をカーネル側で実行、マイクロカーネルは必要最小限をカーネルに置き他機能を外部サービスに分ける考え方。UNIX系、PC用、モバイル、組込み、リアルタイムOSは用途・制約が異なる。起動時はファームウェアからブートストラップ（初期起動処理）でOSを読み込む。ネットワークブートはネット経由、マルチブートは複数OSから選択し、フラッシュブートローダはフラッシュ上の起動処理等に用いる。"},{"heading":"特権と保護","body":"ユーザーモードでは通常アプリが機器・他プロセスの記憶を勝手に操作できない。カーネルモード（特権モード）はOSの制御処理を行う。アプリがファイルを読むときはシステムコールを通じOSへ要求し、OSが権限を確認して処理する。SVC（監督プログラム呼出し）割込みはその実現方法の一つ。"},{"heading":"ジョブと実行の単位","body":"ジョブは給与計算など一まとまりの仕事、ジョブステップはその工程、タスクは実行管理の単位。ジョブスケジューラは実行順・条件を管理し、ディスパッチャは実行可能なタスクへCPUを割り当てる。マスタスケジューラはジョブ管理の中心的な制御を行う概念。cronはUNIX系で時刻条件による定期実行に利用する。バックグラウンドジョブは対話操作と独立して処理を進める。"}],"beginner":{"scenario":"OSの内部と起動から順に、特権と保護、ジョブと実行の単位を理解する。","trap":"ディスパッチャは選択されたタスクを実行状態にする。","quizId":"U-05-Y01"}},{"id":"05-1","title":"プロセス・スレッド・スケジューリング","explain":"<p>プロセスは実行中プログラムの独立した資源管理単位で、仮想メモリ空間などを持つ。スレッドはプロセス内の実行単位で、アドレス空間を共有するため通信しやすい反面、共有データの競合が起きる。コンテキストスイッチは実行状態を保存・復元する切替で、時間を消費する。</p>\n<p>CPUスケジューリングは先着順（FCFS）、短いジョブ優先、ラウンドロビン、優先度方式など。ラウンドロビンは各タスクにタイムクォンタムを割り当て、応答性と切替オーバーヘッドのバランスを取る。高優先度に待たされ続ける低優先度タスクは飢餓状態（starvation）になる。</p>\n","worked":"<p>到着時刻が同じでCPU時間が2,5,3のタスクをFCFSで2→5→3の順に処理すると完了時刻は2,7,10、平均待ち時間は(0+2+7)/3=3。処理時間を待ち時間に含めない。</p>\n","prompt":"スレッドを増やすとCPUバウンド処理が必ず速くなるか。","answer":"<p>CPUコア数、同期、実行環境、切替負荷で制約される。</p>\n","beginner":{"scenario":"1台のCPUでAとBを交互に短時間実行すると同時に動くように見える。Aが入出力を待つ間にBを動かせばCPUを活用できる。","trap":"実行可能はCPU待ち、待ち状態は入出力・イベント待ち。","quizId":"U-05-1"},"textbook":[{"heading":"OSがないと何が困るか","body":"複数アプリが直接CPUやメモリ、画面、ディスクを使えば互いの処理を邪魔する可能性があります。OS（Operating System：基本ソフトウェア）は資源の割当てと保護、ファイル管理、入出力などを共通提供します。プロセスは実行中のプログラムの管理単位、スレッドはその内部の実行の流れです。同一プロセスのスレッドは通常アドレス空間を共有します。"},{"heading":"状態の移り変わり","body":"実行可能状態はCPUの割当てを待つ状態、実行状態はCPU上で動作中、待ち状態は入出力やイベントの完了を待つ状態です。実行中に入出力を要求すると待ち状態へ、完了通知で実行可能状態へ、スケジューラの割当てで実行へ移ります。"},{"heading":"スケジューリングの比較","body":"先着順は到着順で単純ですが長い処理が後続を待たせます。ラウンドロビンは短い時間ずつ交代し応答性を確保します。優先度方式は重要な処理を先に実行しますが、低優先度が長く待つ飢餓状態に注意します。プリエンプションはOSが実行中の処理を中断し別処理へ切り替えることです。"}],"walkthrough":{"heading":"CPUの割当てを時系列で追う","body":"タスクAの実行時間5ms、Bの実行時間3ms、双方が時刻0に到着し、Aを先に実行するとします。先着順ならAが0〜5ms、Bが5〜8msに実行され、完了時刻はA=5、B=8です。ラウンドロビンでタイムスライス2msならA(0〜2)、B(2〜4)、A(4〜6)、B(6〜7)、A(7〜8)となります。Bの応答開始は2msに改善しますが、Aの完了は遅くなります。切替コストを無視した例であり、実際は切替頻度を高くすると負担も増えます。","cols":["時刻(ms)","実行タスク","A残り","B残り"],"rows":[["0","開始","5","3"],["2","A完了区間","3","3"],["4","B完了区間","3","1"],["6","A完了区間","1","1"],["7","B完了","1","0"],["8","A完了","0","0"]]}},{"id":"05-Y02","title":"タスクの優先順位・記憶領域の管理","explain":"<p>FCFS（先着順）は到着順、SJF（最短ジョブ優先）は予測処理時間の短いものを先に実行。プリエンプティブ方式は実行中のタスクを中断でき、ノンプリエンプティブ方式は自発的な終了や待ち等まで続ける。静的優先度は固定、動的優先度は待ち時間等に応じ変える。多段フィードバック待ち行列は実行特性に応じ優先度等を変更する。長時間CPUを得られないリソーススタベーション（資源飢餓）を抑えるため待ち時間で優先度を上げる方法がある。</p>","worked":"<p><b>空き40、100、60KBの順に並び、50KB要求をbest fitで割り当てる。</b></p><p>十分な100と60のうち最小の60KB領域を選ぶ。</p>","prompt":"空き40、100、60KBの順に並び、50KB要求をbest fitで割り当てる。","answer":"<p>十分な100と60のうち最小の60KB領域を選ぶ。</p>","textbook":[{"heading":"スケジューリングの選択","body":"FCFS（先着順）は到着順、SJF（最短ジョブ優先）は予測処理時間の短いものを先に実行。プリエンプティブ方式は実行中のタスクを中断でき、ノンプリエンプティブ方式は自発的な終了や待ち等まで続ける。静的優先度は固定、動的優先度は待ち時間等に応じ変える。多段フィードバック待ち行列は実行特性に応じ優先度等を変更する。長時間CPUを得られないリソーススタベーション（資源飢餓）を抑えるため待ち時間で優先度を上げる方法がある。"},{"heading":"実記憶の割当て","body":"固定区画は決めた区画に割り当てるため内部断片化が起き得る。可変区画は必要量に合わせるが小さな空きが分散する外部断片化が起き得る。空き40KBと60KBが離れていると合計100KBでも連続80KBを割り当てられない。メモリコンパクションは配置を移動して空きをまとめる。first fitは最初の十分な空き、best fitは十分な空きの中で最小、worst fitは最大の空きを選ぶ。"},{"heading":"仮想記憶と入替え","body":"オーバーレイはプログラムを部分に分け必要な部分を同じ領域へ順次ロードする方式。スワッピングはプロセス等の記憶内容を補助記憶と入替える。セグメントはコード・データ等の論理単位、ページは固定長単位。デマンドページングは必要時にページインし、追い出す場合はページアウトする。ワーキングセットは最近参照したページの集合で、その保持が不足するとスラッシングが起きやすい。DAT（動的アドレス変換）は実行時に仮想アドレスを物理アドレスへ変換する。"}],"beginner":{"scenario":"スケジューリングの選択から順に、実記憶の割当て、仮想記憶と入替えを理解する。","trap":"総空き量が足りても連続領域が不足する現象。","quizId":"U-05-Y02"}},{"id":"05-Z02","title":"処理時間順スケジューリングとターンアラウンド","explain":"<p>SJF（Shortest Job First：処理時間順方式）は実行可能なジョブの中から処理時間が短いものを優先します。非プリエンプティブ（実行途中で他ジョブへ切り替えない）なら、現在のジョブが終了した時刻で待機中の候補を比較します。将来到着するジョブを先に実行することはできません。</p>","worked":"<p>A0→3、C3→5、B5→10。Bのターンアラウンドは9秒、待ち4秒。</p>","prompt":"非プリエンプティブSJFでA(到着0,処理4)、B(到着1,処理3)、C(到着2,処理1)。Bのターンアラウンドは？","answer":"<p>A0〜4、C4〜5、B5〜8。Bは8−1=7秒。</p>","beginner":{"scenario":"複数のジョブが時刻の違うタイミングで到着する。どの順に実行すると各ジョブがいつ終わるか調べる。","trap":"終了時刻そのものと到着からの経過時間は違う。","quizId":"U-05-Z02"},"textbook":[{"heading":"基本原理","body":"SJF（Shortest Job First：処理時間順方式）は実行可能なジョブの中から処理時間が短いものを優先します。非プリエンプティブ（実行途中で他ジョブへ切り替えない）なら、現在のジョブが終了した時刻で待機中の候補を比較します。将来到着するジョブを先に実行することはできません。"},{"heading":"仕組み・計算","body":"ジョブAが時刻0に到着し処理3秒、Bが時刻1に到着し処理5秒、Cが時刻2に到着し処理2秒なら、Aを0〜3、Cを3〜5、Bを5〜10に実行します。Bのターンアラウンドタイム（到着から終了まで）は10−1=9秒。待ち時間は開始5−到着1=4秒です。"},{"heading":"応用と注意点","body":"SRTF（Shortest Remaining Time First：残り処理時間順方式）は実行途中の切替えを許す方式です。FCFS（First Come First Served：到着順方式）は到着順、ラウンドロビンは時間片ごとに実行権を交代します。短いジョブが次々に来ると長いジョブが長時間待つ飢餓状態が起こり得ます。"}]},{"id":"05-2","title":"排他制御・デッドロック・同期","explain":"<p>共有変数への読み書きが同時に行われ結果が実行順に依存する競合状態（race condition）には、ロック、セマフォ、メッセージパッシング、原子的操作などで対応する。ミューテックスは共有資源に1主体ずつアクセスするための排他、セマフォは許可数をカウントする同期機構。クリティカルセクションは排他的に実行すべき区間を指す。</p>\n<p>デッドロックは互いが保持資源を解放せず、相手の資源を待ち続ける状態。典型的な成立条件は相互排除・保持と待機・横取り不可・循環待ち。全てのロックを一定順に獲得する設計で循環待ちを防げる。ライブロックは互いに動いているのに仕事が進まない状態。</p>\n","worked":"<p>タスクAがロックXを取得後Yを待ち、タスクBがYを取得後Xを待てばデッドロックの可能性がある。両方が必ずX→Yの順で取る規約なら循環待ちを減らせる。</p>\n","prompt":"`x=x+1`は常に原子的か。","answer":"<p>保証されない。読み取り・加算・書込みに分かれ得るため、環境に応じて同期が必要。</p>\n","beginner":{"scenario":"残高100をAが30、Bが20減らす。両者が先に100を読むとAが70、Bが80を書き、正しい50にならない。読取から書込まで保護する。","trap":"ロックは取得順序や保持時間を考える。増やせばよいわけではない。","quizId":"U-05-2"},"textbook":[{"heading":"なぜ排他制御が必要か","body":"共有変数の更新は読取り・計算・書込みの複数段階になることがあります。二つの処理が同じ古い値を読んで別々に書くと変更が失われます。クリティカルセクション（排他区間）を一度に一処理だけが実行できるようにします。ミューテックスは排他ロック、セマフォは利用可能な資源数などを管理する仕組みです。"},{"heading":"デッドロックが起こる条件","body":"資源を排他的に使い、保持したまま別資源を待ち、強制的に奪えず、循環待ちがあるとデッドロックが成立し得ます。例えばAが鍵Xを持ちYを待ち、BがYを持ちXを待つ場合です。全処理で資源の取得順を統一するなど循環待ちを防ぎます。"},{"heading":"同期と性能","body":"処理間の順序を調整する同期と、同時アクセスを防ぐ排他は関連しますが目的が異なります。ロックを長く持つと待ち時間が増え、優先度逆転が起きることもあります。保持範囲を必要最小限にし、例外時にも解放される設計にします。"}]},{"id":"05-Z03","title":"セマフォ・スレッドセーフ・競合状態","explain":"<p>競合状態（race condition）は並行処理の順序次第で結果が変わる問題です。例えば共有カウンタが0のとき2スレッドが同時に0を読み、それぞれ1を書けば最終値は1となり、期待する2になりません。共有資源に対する一連の操作を排他区間として保護します。</p>","worked":"<p>タスクAがバスを取得し通信完了後に解放するまで、タスクBは取得待ちにする。</p>","prompt":"複数スレッドが同時に関数を呼び出しても仕様どおりに動く性質は？","answer":"<p>並行呼出し時にも整合した動作が保証される性質。</p>","beginner":{"scenario":"2つのタスクが同じバスや共有変数へ同時にアクセスすると、結果が不安定になる。","trap":"スレッドセーフは単一スレッド専用という意味ではない。","quizId":"U-05-Z03"},"textbook":[{"heading":"基本原理","body":"競合状態（race condition）は並行処理の順序次第で結果が変わる問題です。例えば共有カウンタが0のとき2スレッドが同時に0を読み、それぞれ1を書けば最終値は1となり、期待する2になりません。共有資源に対する一連の操作を排他区間として保護します。"},{"heading":"仕組み・計算","body":"セマフォは利用可能な資源数をカウントし、取得時に減らし解放時に増やします。値が0なら取得できるまで待つ設計が代表的です。初期値1のバイナリセマフォは排他に使え、ミューテックスは通常、取得した所有者が解放する排他ロックです。I²C（Inter-Integrated Circuit：集積回路間通信）の共有バスでは一連の通信を排他的に行います。"},{"heading":"応用と注意点","body":"スレッドセーフは複数のスレッドから同時に利用しても、定義された動作やデータの整合性が保たれる性質です。不変データ、スレッドごとの領域、適切なロックなどで実現します。複数ロックの取得順を全タスクで統一すると循環待ちを防げます。優先度だけ変えてもデッドロック防止にはなりません。"}]},{"id":"05-3","title":"仮想記憶・ページ置換・ファイル","explain":"<p>仮想記憶はページ単位で主記憶に割り当て、アクセス先ページが主記憶にないとページフォールトが発生する。FIFO（先入れ先出し）ページ置換は古いページを追い出す。LRU（Least Recently Used：最近最も使用されていない）方式は直近の参照履歴を使う。局所性の高いアクセスではキャッシュ効果が得られる。スラッシングは必要なページ入替えが頻発し、実際の計算が進まない現象。</p>\n<p>ファイルシステムはディレクトリ、権限、メタデータ、空き領域を管理する。ジャーナリングはファイルシステムの更新操作の記録を保持し、障害後の整合性回復を助けるが、ユーザーデータの完全な保護を意味しない。</p>\n","worked":"<p>ページ枠3つ、参照列1,2,3,1,4の場合、LRUでは最初の1,2,3で枠が埋まり、再参照1で最近使用が更新される。4が来たら最も古い2を置換する。FIFOなら最初に入った1を置換する。</p>\n","prompt":"仮想記憶を使う目的は単にHDDをRAMとして追加することか。","answer":"<p>それだけではない。プロセスの独立したアドレス空間、保護、効率的なメモリ割当ても重要。</p>\n","beginner":{"scenario":"メモリをページという一定サイズに分け、必要なページを読み込む。A→B→Aと参照した場合、LRUで次に追い出すのはB。","trap":"スラッシングはページ入替えが頻発し処理が進まない状態。","quizId":"U-05-3","lab":{"title":"ページ置換を手で追う","problem":"ページ枠3個、初期空。参照列A,B,C,A,D,BをLRUで処理する。ページフォールト回数を求める。","steps":["A,B,Cを順に読み込み、3回フォールト。枠は[A,B,C]。","次のAはヒット。最終参照が最も古いのはBになる。","D参照でBを追い出してDを読み込む。4回目。枠[A,D,C]。","B参照で最終参照が最も古いCを追い出す。5回目。"],"answer":"5回","check":"LRUは最終使用時刻を更新する。ヒットしたページも順序が変わる。"}},"textbook":[{"heading":"仮想記憶を図として考える","body":"各プロセスは自分専用に見える仮想アドレス空間を持ちます。ページ単位で物理メモリに割り当て、ページ表で対応付けます。必要なページが現在使える状態にないとページフォールトが起き、OSが割当てや読込みを行います。"},{"heading":"ページ置換の違い","body":"空き枠がなければ置換対象を選びます。FIFO（先入れ先出し）は最初に読み込んだページ、LRU（最近最少使用）は最終参照が最も古いページ、LFU（最少頻度使用）は利用回数が少ないページを選ぶ考え方です。参照列と枠の状態を1回ずつ表に書けばフォールト数を計算できます。"},{"heading":"ファイル管理","body":"ファイルは名前を持つ永続データ、ディレクトリはファイルを階層的に整理する構造です。絶対パスはルートから、相対パスは現在位置からの指定です。アクセス権は読取り・書込み・実行等を管理します。ジャーナリングは変更記録で障害回復を支援します。仮想記憶は実行中のアドレス管理、ファイルは永続データ管理です。"}]},{"id":"05-Z01","title":"空きメモリ領域の割当てと断片化","explain":"<p>可変長のメモリ割当てでは要求以上の連続した空き領域を探します。ファーストフィットは先頭から探して最初に入る場所、ベストフィットは入る場所のうち最小のもの、ワーストフィットは最大のものを選びます。次の探索を前回位置付近から始めるネクストフィットもあります。</p>","worked":"<p>空きが40、20、32KBで18KB要求ならベストフィットは20KB。残り2KB。</p>","prompt":"空きが12、36、25、20KBの順にある。19KBの要求に対するベストフィットの割当て先は？","answer":"<p>19KB以上の中で最小の20KB。12KBには入らない。</p>","beginner":{"scenario":"連続したメモリを18KB確保したい。空き領域が40、20、32KBの順で並んでいる。","trap":"ベストフィットは空き全体を最大化するのではなく、収まる最小の空き領域を選ぶ。","quizId":"U-05-Z01"},"textbook":[{"heading":"基本原理","body":"可変長のメモリ割当てでは要求以上の連続した空き領域を探します。ファーストフィットは先頭から探して最初に入る場所、ベストフィットは入る場所のうち最小のもの、ワーストフィットは最大のものを選びます。次の探索を前回位置付近から始めるネクストフィットもあります。"},{"heading":"仕組み・計算","body":"要求18KBに対して、ファーストフィットは40KBから18KBを取って22KBを残します。ベストフィットは20KBから取って2KBを残します。小さな穴が多数できると、合計空き容量が十分でも連続した大きな要求が入らない外部断片化が発生します。割当て単位の内部に未使用領域が生じる内部断片化とは区別します。"},{"heading":"応用と注意点","body":"隣接する空き領域の結合や、再配置可能ならコンパクション（領域の詰め直し）で外部断片化を減らせます。ページングでは固定長のページ枠へ割り当てるため物理的に連続する大領域を要求しない一方、最後のページに内部断片化が生じ得ます。"}]},{"id":"05-Y05","title":"ファイルシステム・ファイル編成と検索","explain":"<p>ディレクトリは名前とファイルの管理情報を対応付ける。ファイル制御ブロック等には位置・属性・権限等が記録される。ファイルハンドルやファイル記述子は開いたファイルを識別する値、ファイルポインタは現在の読書き位置。ルートは階層の頂点、カレントは現在位置、ホームは利用者の基準位置。シンボリックリンクは別のパスを参照する。FATは領域の連鎖を表で管理、NTFSはWindows系でアクセス制御等に対応、ReFSは回復性等を重視、NFSはネットワーク経由のファイルアクセス規約。</p>","worked":"<p><b>200Bの論理レコードを2000Bブロックへ詰め、300件保存する。</b></p><p>管理領域を無視すれば1ブロック10件なので30ブロック。</p>","prompt":"200Bの論理レコードを2000Bブロックへ詰め、300件保存する。","answer":"<p>管理領域を無視すれば1ブロック10件なので30ブロック。</p>","textbook":[{"heading":"ファイルを識別する仕組み","body":"ディレクトリは名前とファイルの管理情報を対応付ける。ファイル制御ブロック等には位置・属性・権限等が記録される。ファイルハンドルやファイル記述子は開いたファイルを識別する値、ファイルポインタは現在の読書き位置。ルートは階層の頂点、カレントは現在位置、ホームは利用者の基準位置。シンボリックリンクは別のパスを参照する。FATは領域の連鎖を表で管理、NTFSはWindows系でアクセス制御等に対応、ReFSは回復性等を重視、NFSはネットワーク経由のファイルアクセス規約。"},{"heading":"論理レコードと物理ブロック","body":"利用者が扱う1件の明細が論理レコード、記憶装置へ転送する単位が物理ブロック。100Bのレコードを1000Bブロックに固定長で詰めるならブロック化因数10。100件なら10ブロックで読める（管理情報等を無視）。ブロッキングはまとめる、デブロッキングは分離する処理。順次アクセスは先頭から順番に、直接アクセスは位置等を指定して読書きする。"},{"heading":"検索と更新","body":"索引編成はキーと格納位置の対応を別に管理し、順次検索と直接検索を支援する方式がある。ハッシュ編成はキーから格納候補を計算し、衝突時はあふれ域等を使う。ファイルの追加・削除・変更によって索引や空き領域の更新も必要になる。世代管理では複数時点のバックアップを保持し、障害や誤削除から復元できる範囲を確保する。"}],"beginner":{"scenario":"ファイルを識別する仕組みから順に、論理レコードと物理ブロック、検索と更新を理解する。","trap":"複数の論理レコードを一つの物理転送単位にする。","quizId":"U-05-Y05"}},{"id":"05-Y03","title":"OSの入出力・利用者管理・障害回復","explain":"<p>バッファは通信速度差などを吸収する一時記憶。スプールは印刷などの処理要求を補助記憶へ保存して順に処理する。チャネル制御は入出力専用処理装置を利用する。メモリマップドI/Oでは機器の制御レジスタ等をメモリアドレス空間に割当て、通常のメモリ命令等で操作する。I/OマップドI/Oは独立した入出力空間と専用命令等を使う。</p>","worked":"<p><b>一般利用者の保存容量を10GBに制限したい。</b></p><p>ディスククォータを設定する。</p>","prompt":"一般利用者の保存容量を10GBに制限したい。","answer":"<p>ディスククォータを設定する。</p>","textbook":[{"heading":"低速装置を効率よく使う","body":"バッファは通信速度差などを吸収する一時記憶。スプールは印刷などの処理要求を補助記憶へ保存して順に処理する。チャネル制御は入出力専用処理装置を利用する。メモリマップドI/Oでは機器の制御レジスタ等をメモリアドレス空間に割当て、通常のメモリ命令等で操作する。I/OマップドI/Oは独立した入出力空間と専用命令等を使う。"},{"heading":"利用者とアクセスを管理する","body":"rootやAdministratorは強い管理権限を持つ代表的なアカウント。ゲストは限定利用、ディスククォータは利用者等の記憶容量を制限する。LDAP（軽量ディレクトリアクセスプロトコル）はディレクトリ情報へのアクセス規約、Active Directoryは利用者や機器等の管理に用いられる仕組み。BLP（ベル・ラパデュラ）モデルは機密性を守るため原則として上位機密の読取りと下位機密への書込みを制限する。ログや監査証跡でアカウンタビリティ（説明責任）を支援する。"},{"heading":"異常検出から回復へ","body":"タイマ監視やウォッチドッグで停止を検出し、記録・診断・切替・再起動・原因修正を行う。動的装置再構成は故障機器等を切離し構成を変更する。二重化や予備系を用いて処理継続を図る。リエントラント（再入可能）なプログラムは中断や複数の実行が重なっても安全に使えるよう状態を管理し、逐次再使用可能は前の実行完了後に繰返し利用できる性質。ABI（アプリケーションバイナリインタフェース）はバイナリレベルの呼出し・型等の規約、POSIXはOS間の移植性に関するインタフェース標準群。ユーティリティは整列・併合・アーカイブ・バックアップ等を支援する。"}],"beginner":{"scenario":"低速装置を効率よく使うから順に、利用者とアクセスを管理する、異常検出から回復へを理解する。","trap":"メモリアクセス命令等で機器レジスタにアクセスする。","quizId":"U-05-Y03"}},{"id":"05-C01","title":"OSの保護・資源制限","explain":"<p>複数利用者が共用するOSで、他人の情報を推測したり容量を使い切ったりするのを防ぐ。</p><p>シラバスVer.7.2 本文23–25頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>集計結果が1人しか含まない場合に公開を制限するのは推論制御の例。</p>","prompt":"書込み権限を持つ利用者がディスクを使い切った。アクセス制御だけでは防げない理由と対策は？","answer":"<p>アクセス制御は操作の許否を判定するが、許された書込みの総量までは通常制限しない。ディスククオータで利用者ごとに容量等の上限を設ける。</p>","beginner":{"scenario":"複数利用者が共用するOSで、他人の情報を推測したり容量を使い切ったりするのを防ぐ。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-05-C01"},"textbook":[{"heading":"OSが保護するもの","body":"OS（Operating System: 基本ソフトウェア）は、複数のアプリや利用者がCPU、メモリ、ファイルなどを安全に共有できるよう管理します。各プログラムが自由に他者の記憶領域やファイルを操作できれば秘密の漏えい、改ざん、資源枯渇が生じます。保護は利用権限と利用量の両方を管理する必要があります。"},{"heading":"参照モニタとセキュリティカーネル","body":"参照モニタは主体が資源へアクセスするたびに方針に照らして許可を判定する抽象的な概念です。セキュリティカーネルはそのような安全方針を強制する信頼できる中核部分です。利用者モードから特権が必要な処理を直接実行させず、OSが制御するシステムコールなどを経由させる設計と関連します。"},{"heading":"情報フロー制御","body":"ファイルを読めるかという一回のアクセス判定だけでは、読んだ機密情報が後で公開領域へ書き出されることを防げない場合があります。情報フロー制御は情報が許されない主体や領域へ流れる経路を制約します。ここでいうフローは情報の機密性の問題で、ネットワークの送信速度を調節するフロー制御とは区別します。"},{"heading":"推論制御","body":"集計結果の公開を許しても、複数の集計を比較すると個人の値を推測できる場合があります。推論制御は直接公開していない保護対象情報が、許された結果から導かれるリスクを抑える考え方です。小規模な集団の集計を制限するなど、データベースや分析システムの設計とも関係します。"},{"heading":"ディスククオータで資源を管理する","body":"ディスククオータは利用者やグループごとに使用容量などの上限を定める仕組みです。書込み権限が正しくても一人が容量を使い切れば他の利用者が操作できなくなります。クオータは許可された操作の利用量を制限し、資源の公平な利用と可用性を守ります。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"05-4","title":"システムソフトウェア・言語処理・ライセンス","explain":"<p>コンパイラはソースコードを解析して機械語などへ変換する。字句解析でトークンを抽出し、構文解析で文法構造を作り、意味解析で型・宣言の整合性を調べ、最適化やコード生成を行う。インタプリタは実行時に命令を逐次解釈する方式の総称だが、仮想機械・JIT（Just In Time：実行時コンパイル）などを組み合わせる実装もある。</p>\n<p>OSS（Open Source Software：オープンソースソフトウェア）は利用許諾条件に従って使用・改変・再配布する。ソース開示などの条件はライセンスごとに違い、無条件で自由に使えるわけではない。パッケージ管理では依存バージョン固定・脆弱性確認・来歴の検証が重要。</p>\n","worked":"<p>型が不一致な関数呼出しを静的に検出するのは意味解析の仕事。「括弧が閉じていない」は構文解析の問題。</p>\n","prompt":"コンパイルを通過すれば仕様どおり動くか。","answer":"<p>保証されない。実行時例外、論理バグ、性能やセキュリティの問題が残る。</p>\n","beginner":{"scenario":"Cのソースをコンパイルして目的コードを作り、ライブラリ等とリンクして実行形式を得る。ローダが実行時にメモリへ読み込む。","trap":"OSSでも著作権があり、ライセンス条件を守る。","quizId":"U-05-4"},"textbook":[{"heading":"実行までの道筋","body":"人が書いたソースコードはコンパイルで目的コード等になり、リンカがライブラリと結合し、ローダが実行に必要な内容をメモリへ配置します。インタプリタは解釈しながら実行する方式です。デバッガではブレークポイントで実行を止め、変数の値や呼出しの順序を確認します。"},{"heading":"共通ソフトウェア","body":"ミドルウェアはOSと業務アプリの間の共通機能で、データベース管理、メッセージ交換、アプリケーション実行基盤などを提供します。API（アプリケーションプログラミングインタフェース）は機能の呼出し方法を定めます。シェルはコマンドを解釈してOS機能を利用するインタフェースです。"},{"heading":"ライセンスの考え方","body":"OSS（オープンソースソフトウェア）はソース利用・改変・再配布などをライセンス条件で認めるソフトウェアです。無条件で著作権が消えるわけではありません。GPLなどでは配布形態に応じソース提供等の義務が生じ得ます。許諾条件、著作権表示、他ライセンスとの互換性を確認します。"}]},{"id":"05-X01","title":"ミドルウェア・ファイル・開発環境","explain":"<p>ミドルウェアはOSとアプリの間で共通機能を提供する。DBMSはデータ管理、アプリケーションサーバは業務処理実行、メッセージキューは非同期連携、TPモニタはトランザクション処理を支援する。API（アプリケーション間の接続仕様）は呼出し方法を定める。</p><p>ファイルシステムはディレクトリ、ファイル属性、アクセス権、領域割当てを管理する。ジャーナリングは変更の記録を使って障害回復を支援する。シェルはコマンド実行環境、デバッガは実行停止・変数確認、リンカは目的コードを結合、ローダは実行可能な形でメモリへ読み込む。OSS（オープンソースソフトウェア）でもライセンス遵守が必要。GPLは一定の再配布にソース提供等の条件がある。</p>","worked":"<p>印刷要求を補助記憶に一時蓄積し順に出力するスプーリングで、CPUは印刷の完了を待たず次の処理ができる。</p>","prompt":"ブレークポイントでプログラムを止めて変数を調べるツールは？","answer":"<p>デバッガ。</p>","beginner":{"scenario":"注文受付がメッセージキューに依頼を積み、発送処理が後から受け取る設計なら、発送の一時停止と注文受付を分離できる。","trap":"再配信・順序・消失への対策は別途必要。","quizId":"U-05-X01"},"textbook":[{"heading":"ミドルウェアを使う理由","body":"アプリが毎回データ保存、通信、ログ、実行環境を作り直すと重複が増えます。DBMS（データベース管理システム）は保存・検索・整合性、アプリケーションサーバは業務処理の実行基盤、メッセージキューは非同期の依頼受渡し、TPモニタは取引処理の管理を支援します。"},{"heading":"ファイルの内部管理","body":"ファイルシステムはデータの保存位置、名前、属性、アクセス権を管理します。連続領域への配置は順次読込みが効率的ですが拡張が難しい場合があり、分散配置には管理情報が必要です。ジャーナリングは変更を記録して障害時の整合性回復を支援します。"},{"heading":"開発・入出力支援","body":"エディタはソース編集、コンパイラは翻訳、デバッガは実行状態調査、ビルドツールは生成手順自動化、バージョン管理は変更履歴を管理します。スプーリングは印刷など低速機器への要求を補助記憶に一時保存して順に処理する仕組みです。ファイル管理・実行管理・開発支援は目的が異なります。"}]},{"id":"05-Y04","title":"シェル・API・ライブラリ・部品化","explain":"<p>シェルはコマンドを解釈してOS機能を呼び出す。Bシェル、Cシェル、cmd.exeなどがある。例えばファイル一覧表示やコピーの命令を解釈して必要な処理を起動する。パイプは前のコマンドの出力を次の入力へ渡す仕組み。API（アプリケーションプログラミングインタフェース）は機能の呼出し方法を定義し、Web APIはネットワーク越しにサービスを利用する窓口。</p>","worked":"<p><b>計算機Aのアプリが別サーバの在庫情報を取得する。</b></p><p>相手が公開するWeb APIを仕様に沿って呼び出す構成が考えられる。</p>","prompt":"計算機Aのアプリが別サーバの在庫情報を取得する。","answer":"<p>相手が公開するWeb APIを仕様に沿って呼び出す構成が考えられる。</p>","textbook":[{"heading":"OSを操作する窓口","body":"シェルはコマンドを解釈してOS機能を呼び出す。Bシェル、Cシェル、cmd.exeなどがある。例えばファイル一覧表示やコピーの命令を解釈して必要な処理を起動する。パイプは前のコマンドの出力を次の入力へ渡す仕組み。API（アプリケーションプログラミングインタフェース）は機能の呼出し方法を定義し、Web APIはネットワーク越しにサービスを利用する窓口。"},{"heading":"プログラム部品を再利用する","body":"ソースライブラリはソース、オブジェクトライブラリは翻訳済み部品、ロードライブラリは実行可能な部品等を管理する。静的リンクは実行ファイルに部品を結合、動的リンクは実行時等に部品を結合する。クラスライブラリは再利用するクラス等を提供する。DLL（動的リンクライブラリ）の更新時は互換性と依存関係を確認する。"},{"heading":"部品とフレームワーク","body":"コンポーネントウェアは明確な接続仕様を持つ部品の組合せで開発する考え方。JavaBeansはJavaの再利用可能な部品規約、CORBAは異なる環境の分散オブジェクト間連携、OSGiはJava等の動的モジュール管理。フレームワークはアプリの骨組みを提供し決められた拡張箇所に処理を書く。Spring、Struts、CakePHP、Ruby on Railsは代表例。ライブラリは一般に利用側が呼出し、フレームワークでは枠組み側が利用者の処理を呼ぶことも多い。"}],"beginner":{"scenario":"OSを操作する窓口から順に、プログラム部品を再利用する、部品とフレームワークを理解する。","trap":"共通構造を提供して開発を支援する。","quizId":"U-05-Y04"}},{"id":"05-Y06","title":"開発支援ツール・翻訳・デバッグ","explain":"<p>IDE（統合開発環境）はエディタ、ビルド、デバッグ等を統合する。SADTは構造化分析・設計、SREMは要求工学の方法、PSL/PSAは要求記述・分析の支援に関する手法・ツール。設計ツール、文書生成、構築支援、ローコード・ノーコードは工程や必要な記述量が異なる。ツールチェーンは複数の開発ツールを連携させた構成。</p>","worked":"<p><b>PC上で組込み機器向けの機械語を生成する。</b></p><p>クロスコンパイラを利用する。対象の命令体系やライブラリに合わせる。</p>","prompt":"PC上で組込み機器向けの機械語を生成する。","answer":"<p>クロスコンパイラを利用する。対象の命令体系やライブラリに合わせる。</p>","textbook":[{"heading":"どの工程を支援するか","body":"IDE（統合開発環境）はエディタ、ビルド、デバッグ等を統合する。SADTは構造化分析・設計、SREMは要求工学の方法、PSL/PSAは要求記述・分析の支援に関する手法・ツール。設計ツール、文書生成、構築支援、ローコード・ノーコードは工程や必要な記述量が異なる。ツールチェーンは複数の開発ツールを連携させた構成。"},{"heading":"実行する前と後の調査","body":"静的解析は実行せず構造・規則違反等を調べ、クロスリファレンスは定義と参照箇所の対応、プリティプリンタはコード整形等を支援する。動的解析は実行時の挙動を調べ、トレーサは実行経路、スナップショットはある時点の状態、アサーションチェッカは指定条件が成立するか確認する。テストカバレージツールは実行された命令や分岐等を測る。テストベッドは試験用環境。ICE（インサーキットエミュレータ）は実機の回路と連携したデバッグに利用される。"},{"heading":"翻訳と実行","body":"アセンブラはアセンブリ言語を機械語等へ、コンパイラは高水準言語を別形式へ、リンカは外部参照を解決、ローダは実行用に配置する。JIT（実行時コンパイラ）は実行時にコードを翻訳し、クロスコンパイラは開発機とは異なる機種向けコードを生成する。プリプロセッサは翻訳前のマクロ展開等、ジェネレータは仕様等からコードを生成する。エミュレータは対象機器等の動作を模倣し、シミュレータはモデルで挙動を再現する。"}],"beginner":{"scenario":"どの工程を支援するかから順に、実行する前と後の調査、翻訳と実行を理解する。","trap":"静的解析はコード等から潜在的問題を検出する。","quizId":"U-05-Y06"}},{"id":"05-Y07","title":"OSSのライセンスと用途別ツール","explain":"<p>OSS（オープンソースソフトウェア）は条件に従い利用・改変・再配布等が可能。GPL（一般公衆利用許諾）は対象の派生物を配布する場合等に対応するソースの提供などを求めるコピーレフト型。BSD系ライセンスは著作権表示等を条件に広い利用を認め、MPLは対象ファイル単位のコピーレフトを持つ。Apacheライセンス2.0には明示的な特許許諾等がある。デュアルライセンスは複数の許諾条件から選択可能な方式。具体的な義務は版・配布形態・組合せを確認する。</p>","worked":"<p><b>OSSだから社内利用も配布も条件を確認しなくてよいか。</b></p><p>いいえ。ライセンスの対象、配布形態、表示・ソース提供等の義務、サポートや脆弱性対応を確認する。</p>","prompt":"OSSだから社内利用も配布も条件を確認しなくてよいか。","answer":"<p>いいえ。ライセンスの対象、配布形態、表示・ソース提供等の義務、サポートや脆弱性対応を確認する。</p>","textbook":[{"heading":"利用条件の違い","body":"OSS（オープンソースソフトウェア）は条件に従い利用・改変・再配布等が可能。GPL（一般公衆利用許諾）は対象の派生物を配布する場合等に対応するソースの提供などを求めるコピーレフト型。BSD系ライセンスは著作権表示等を条件に広い利用を認め、MPLは対象ファイル単位のコピーレフトを持つ。Apacheライセンス2.0には明示的な特許許諾等がある。デュアルライセンスは複数の許諾条件から選択可能な方式。具体的な義務は版・配布形態・組合せを確認する。"},{"heading":"用途別の構成","body":"LAMPはLinux、Apache、MySQL、PHP等、LAPPはPostgreSQLを用いる構成。LinuxやFreeBSD、NetBSD、OpenBSDはUNIX系の代表例。Xenは仮想化、Dockerはコンテナ、Kubernetesはコンテナの配置・管理、Terraformはインフラ構成管理、OpenStackはクラウド基盤、Istioはサービス間通信管理等。PyTorch、TensorFlow、Keras、Chainer、Deeplearning4jは機械学習・深層学習、OpenCVは画像処理等。試験に掲載された名称と現時点の推奨技術は区別する。"},{"heading":"開発・運用・コミュニティ","body":"GitとSubversionは版管理、Eclipseは統合開発環境、SonarQubeはコード品質分析、Jenkinsは自動ビルド等、Redmineは課題管理、Seleniumはブラウザ自動操作・試験、Ansible・Chef・Puppetは構成管理等、Prometheus・Zabbixは監視、Grafanaはデータ可視化。OSI（オープンソース推進組織）、FSF（自由ソフトウェア財団）、Linux Foundation、Apache Software Foundation、OpenSSF（OSSセキュリティ推進組織）は開発・普及・安全性等を支える。OSSでも保守費用・脆弱性・開発継続性を評価する。"}],"beginner":{"scenario":"利用条件の違いから順に、用途別の構成、開発・運用・コミュニティを理解する。","trap":"Kubernetesはコンテナオーケストレーション基盤。","quizId":"U-05-Y07"}}],"beginnerIntro":"アプリを同時に動かす資源管理と共通ソフトウェアを学ぶ。プロセスの状態とロックを図にして考える。","studyGroups":[{"title":"OSの役割と実行管理","body":"OSの特権と資源管理から、実行順序と共有資源の競合へ。","ids":["05-Y01","05-1","05-Y02","05-Z02","05-2","05-Z03"]},{"title":"メモリ・ファイル・保護","body":"記憶領域の割当て、永続化、アクセス制限と障害回復を学ぶ。","ids":["05-3","05-Z01","05-Y05","05-Y03","05-C01"]},{"title":"共通ソフトウェアと開発環境","body":"OSとアプリの間の部品、翻訳、開発支援、ライセンスを区別する。","ids":["05-4","05-X01","05-Y04","05-Y06","05-Y07"]}]},{"id":6,"title":"ハードウェア・組込み基礎","group":"テクノロジ","priority":"A標準","summary":"論理回路・半導体・センサ・割込み・組込み制御を理解。","lessons":[{"title":"論理回路","body":"AND/OR/NOTに加えてNANDとNORは任意の論理回路を構成可能。フリップフロップは1ビットの状態を保持する基本回路。","check":"組合せ回路と順序回路を区別。"},{"title":"マイコンとリアルタイム性","body":"組込み機器のマイコンはセンサ入力を読み、計算し、アクチュエータを制御する。リアルタイムシステムでは正しい計算結果だけでなく期限内の結果が必要。","check":"速さだけでなく締切保証が重要。"},{"title":"電源・通信・省電力","body":"割込みでイベントを処理し、不要なときは省電力状態へ遷移。低消費電力の設計では通信頻度やセンサ計測周期も検討する。","check":"電力とエネルギーは別単位。"},{"title":"故障安全の設計","body":"フェイルセーフは故障時に安全側へ倒す考え方。フォールトトレラントは一部故障しても機能継続できるようにする設計。","check":"安全性とサービス継続性の目的差。"}],"terms":[{"term":"フリップフロップ","definition":"1ビットの状態を保持する順序回路"},{"term":"NAND","definition":"ANDの結果を否定した論理演算"},{"term":"組込みシステム","definition":"機器の特定用途に組み込まれた制御用システム"},{"term":"リアルタイムOS","definition":"処理の応答期限を意識したOS"},{"term":"センサ","definition":"温度・位置などの物理量を信号として取得する素子"},{"term":"アクチュエータ","definition":"電気信号などを動作・力に変える装置"},{"term":"フェイルセーフ","definition":"故障した際に危険を避ける側へ状態を移す設計思想"},{"term":"フォールトトレラント","definition":"部分的な故障があっても機能を継続できる性質"},{"term":"ウォッチドッグタイマ","definition":"処理の異常停止を検出し再起動等を行う監視機構"}],"questions":[{"id":"Q06-01","chapter":6,"kind":"applied","q":"制御プログラムが正しくても期限を超過すると失敗になる特性は。","options":["可搬性","リアルタイム性","保守性","移植性"],"correct":1,"explain":"時間制約の遵守が機能の一部。"},{"id":"Q06-02","chapter":6,"kind":"applied","q":"故障時にエレベータを停止させて安全を確保する設計は。","options":["フェイルセーフ","ロードバランシング","多重化","スケールアップ"],"correct":0,"explain":"不具合時に安全側に遷移する。"},{"id":"Q06-03","chapter":6,"kind":"applied","q":"1ビットの状態記憶に使う回路は。","options":["加算器","デコーダ","フリップフロップ","マルチプレクサ"],"correct":2,"explain":"順序回路の代表。"},{"id":"D06-01","chapter":6,"kind":"applied","q":"8ビットADCで0～5Vを256段階に量子化する理想的な1段階の電圧幅に最も近い値はどれか。","options":["0.002V","0.020V","0.20V","0.50V"],"correct":1,"explain":"5/256≈0.0195V。分解能は量子化段数で決まるが実測精度は雑音等にも左右される。"},{"id":"D06-02","chapter":6,"kind":"applied","q":"周期20msで実行5msのタスクAと周期10msで実行3msのタスクBの合計CPU利用率はどれか。","options":["25%","30%","55%","80%"],"correct":2,"explain":"5/20＋3/10=0.25+0.30=0.55。これだけで期限を守ることを証明できるわけではない。"},{"id":"D06-03","chapter":6,"kind":"applied","q":"ハードリアルタイムシステムの特徴として最も適切なものはどれか。","options":["平均処理時間の短さだけを保証すればよい","一定の期限超過が重大な失敗になり得る","全タスクを必ず同時実行する","CPU周波数が高いことが定義である"],"correct":1,"explain":"重要なのは締切までの確実な応答。平均速度が速いだけでは保証できない。"},{"id":"Q-06-X01","chapter":6,"kind":"applied","q":"出荷後に論理回路を再構成できるデバイスは？","options":["ASIC","DRAM","FPGA","HDD"],"correct":2,"explain":"FPGA。"},{"id":"U-06-1","chapter":6,"kind":"applied","q":"現在入力に加え過去の状態に依存する回路は？","options":["順序回路","組合せ回路","整流回路","増幅回路"],"correct":0,"explain":"順序回路には記憶要素がある。"},{"id":"U-06-2","chapter":6,"kind":"applied","q":"2ms/10msと5ms/25msの2タスクのCPU利用率合計は？","options":["20%","40%","70%","7%"],"correct":1,"explain":"2/10＋5/25＝0.4。"},{"id":"U-06-3","chapter":6,"kind":"applied","q":"応答が途絶えた装置を監視し異常処理を促すタイマは？","options":["リトルの法則","パリティビット","ウォッチドッグタイマ","ロードバランサ"],"correct":2,"explain":"正常動作の通知が途絶えるとタイムアウトして異常処理を行う。"},{"id":"U-06-X01","chapter":6,"kind":"applied","q":"PWM周期20ms、ON時間5msのデューティ比は？","options":["5%","20%","75%","25%"],"correct":3,"explain":"ON時間÷周期＝5/20。"},{"id":"U-06-Y01","chapter":6,"kind":"applied","q":"光を介して回路間を電気的に絶縁し信号を伝える部品は？","options":["抵抗器","サーミスタ","フォトカプラ","トライアック"],"correct":2,"explain":"発光部と受光部を使って信号を伝える。"},{"id":"U-06-Y02","chapter":6,"kind":"applied","q":"回路への電源供給を遮断し主にリーク電流を抑える方法は？","options":["クロックゲーティングのみ","インタリーブ","パリティ","パワーゲーティング"],"correct":3,"explain":"電源を遮断することで待機時の漏れ電流を抑える。"}],"deepIntro":"組込みは限られた電力・容量と、現実世界のタイミング制約の中で動くシステム。","deep":[{"id":"06-1","title":"ディジタル回路・半導体・制御","explain":"<p>論理回路はAND/OR/NOTをトランジスタ等で実現する。組合せ回路は現在の入力だけで出力が決まり、順序回路はフリップフロップなどで過去の状態を保持する。加算器、デコーダ、マルチプレクサは組合せ回路の例。発振回路・クロックは同期処理の基準となる。</p>\n<p>センサが温度や加速度などを測定し、ADC（Analog-to-Digital Converter：アナログ・ディジタル変換器）で離散値に変換する。アクチュエータは制御信号を物理的な動きに変える。フィードバック制御は出力を測って目標との差を補正し、外乱に対処する。</p>\n","worked":"<p>8ビットADCで0～5Vを256段階に量子化する単純モデルでは1段階約5/256＝0.0195V。精度は量子化段数だけでなくノイズ、基準電圧にも左右される。</p>\n","prompt":"センサの生データを細かくサンプリングすれば必ず正しい物理量になるか。","answer":"<p>ならない。校正、雑音、分解能、サンプリング周波数、エイリアシングを考える。</p>\n","beginner":{"scenario":"非常停止解除と安全扉閉鎖が両方確認されたときだけモータを許可する条件はANDで表せる。センサが入力、モータが出力。","trap":"論理条件だけでは故障時の安全性は保証できない。","quizId":"U-06-1"},"textbook":[{"heading":"組込み機器とは","body":"洗濯機や自動車のように、特定の目的を果たす装置に内蔵された計算機です。温度や位置をセンサで測り、プログラムで判断してモータなどのアクチュエータを動かします。汎用パソコンとは異なり、電力、価格、応答期限、安全性などの制約を強く受けます。"},{"heading":"論理回路の基本","body":"トランジスタを使い0と1を表す電気状態を切り替え、AND、OR、NOTなどの論理回路を作ります。組合せ回路は現在の入力だけで出力が決まり、順序回路は過去の状態も利用します。フリップフロップは1ビットの状態を保持する回路です。半加算器の和はXOR、桁上がりはANDで求められ、全加算器では下位桁からの桁上がりも加えます。"},{"heading":"制御の流れ","body":"センサ入力は必要に応じA/D変換で数値化し、CPU（中央処理装置）が条件や制御式を計算します。出力はデジタル信号、D/A変換によるアナログ信号、PWM（パルス幅変調）などで機器を制御します。誤作動が危険につながる機器では通常動作だけでなく、故障時の動作も設計します。"}]},{"id":"06-X01","title":"回路・半導体・組込みハードウェア","explain":"<p>AND、OR、NOTを組み合わせた組合せ回路は現在入力で出力が決まり、フリップフロップを含む順序回路は状態を記憶する。半加算器は和と桁上がりを生成し、全加算器は下位からの桁上がりも扱う。ASICは特定用途向けに設計した集積回路、FPGAは製造後に回路構成を変更可能なデバイス。マイコンはCPU、メモリ、周辺回路を統合する。</p><p>センサからのアナログ出力をA/D変換（AD変換）し、D/A変換で数値をアナログ信号へ戻す。PWM（パルス幅変調）はON時間の比率で平均出力を制御する。ウォッチドッグタイマは異常停止を検知し再起動等を行う。フェイルセーフは故障時に安全な状態へ、フォールトトレランスは故障しても機能継続を目指す。</p>","worked":"<p>周期10msでONが3msならデューティ比30%。理想的な5V出力の平均は1.5V。</p>","prompt":"出荷後に論理回路を再構成できるデバイスは？","answer":"<p>FPGA。</p>","beginner":{"scenario":"8ビットA/D変換で0〜255が0〜5Vに対応すると仮定すると127は127/255×5≒2.49V。","trap":"A/Dは数値化、D/Aはアナログ化、PWMはON時間比を変える。","quizId":"U-06-X01"},"textbook":[{"heading":"半導体と回路の種類","body":"ASIC（特定用途向け集積回路）は特定の処理用に設計し量産時の効率を高められます。FPGA（書換え可能な論理デバイス）は製造後に論理回路の構成を変更でき、試作や変更可能性を重視する用途に向きます。マイクロコントローラはCPU・メモリ・入出力などを一つにまとめた制御用集積回路です。"},{"heading":"アナログとデジタルの変換","body":"温度センサが0〜5Vを出し、8ビットA/D変換で0〜255の整数を出すとします。端点を対応させた近似換算では値51は1Vに相当します。ビット数を1増やせば表せる段階数は2倍になり量子化の幅は小さくなります。実機の変換精度にはセンサ誤差や雑音も影響します。"},{"heading":"PWMで出力を調整する","body":"PWMは一定周期のうちONの割合（デューティ比）を変える方式です。周期10msのうち2msがONなら20%。理想的に5Vと0Vを切り替える場合、平均電圧は1Vです。モータや照明では負荷の特性を利用して出力を調整できます。アナログ電圧そのものを連続的に出すD/A変換とは異なります。"}]},{"id":"06-Y01","title":"電子部品・論理回路・タイミング設計","explain":"<p>抵抗は電流を制限し電圧と電流にV=RIの関係を持つ。コンデンサは電荷、コイルは磁界にエネルギーを蓄え、トランスは交流電圧等を変換する。ダイオードは主に一方向へ電流を流し、LED（発光ダイオード）は発光する。トランジスタは信号で電流を制御しスイッチや増幅に使う。フォトトランジスタは光を検知、フォトカプラは光で信号を伝え電気的に絶縁、フォトインタラプタは光の遮断を検出する。トライアックは交流電力制御などに利用する。パワー半導体は大電力の変換・制御を担う。</p>","worked":"<p><b>AとBのANDの否定を求める。</b></p><p>両方1の時だけ0、他は1。NAND回路。</p>","prompt":"AとBのANDの否定を求める。","answer":"<p>両方1の時だけ0、他は1。NAND回路。</p>","textbook":[{"heading":"電気回路の部品","body":"抵抗は電流を制限し電圧と電流にV=RIの関係を持つ。コンデンサは電荷、コイルは磁界にエネルギーを蓄え、トランスは交流電圧等を変換する。ダイオードは主に一方向へ電流を流し、LED（発光ダイオード）は発光する。トランジスタは信号で電流を制御しスイッチや増幅に使う。フォトトランジスタは光を検知、フォトカプラは光で信号を伝え電気的に絶縁、フォトインタラプタは光の遮断を検出する。トライアックは交流電力制御などに利用する。パワー半導体は大電力の変換・制御を担う。"},{"heading":"集積回路と論理設計","body":"IC（集積回路）は多数の素子をまとめ、LSI/VLSIは大規模・超大規模集積回路の呼称。CMOS（相補型MOS）はp型・n型のトランジスタを組み合わせる。バイポーラは別のトランジスタ構造、BiCMOSは両者を組み合わせる。NANDはANDの否定、NORはORの否定。正論理は高電圧を1、負論理は低電圧を1に対応させる。同期式設計はクロックに合わせて状態を更新し、非同期式は共通クロックに依存しない。タイミングチャートで信号の変化時刻と遅延を確認する。"},{"heading":"論理式の簡単化","body":"加法標準形は積項をORで結ぶ形。例えばA AND BとA AND NOT BのORはA AND (B OR NOT B)=Aとなる。カルノー図などの論理圧縮で必要回路を減らせる。HDL（ハードウェア記述言語）で回路や動作を記述し合成・検証する。CORDICは回転に関する演算を加減算・シフトなどで近似する方式。SoC（システムオンチップ）はCPU、入出力等のシステム機能を一つのチップへ統合し、コデザインはハードとソフトを協調設計する。MEMS（微小電気機械システム）は小型機械構造と電子技術を組み合わせる。"}],"beginner":{"scenario":"電気回路の部品から順に、集積回路と論理設計、論理式の簡単化を理解する。","trap":"発光部と受光部を使って信号を伝える。","quizId":"U-06-Y01"}},{"id":"06-Z02","title":"論理回路・エッジ検出・波形","explain":"<p>現在値aと前回値bを保存する。立上り（0→1）だけを検出する条件はa AND NOT b。立下り（1→0）はNOT a AND b。変化の有無はa XOR b（排他的論理和）。接点の短時間の揺れはチャタリングといい、適切な時間処理などで抑える。</p>","worked":"<p>入力が00,01,10,11の順ならNAND出力は1,1,1,0。</p>","prompt":"前回値b、現在値aについて、押し始めと離した瞬間の両方を検出したい。式を求め、押し続ける間に出力が0になる理由も説明せよ。","answer":"<p>a XOR b（排他的論理和）。前回と今回が異なるときだけ1になる。押し続ける間はa=b=1なので0となる。</p>","beginner":{"scenario":"ボタンを押し続けても最初の瞬間だけ処理を起動したい。","trap":"現在と前回の変数の意味を反転しない。","quizId":"U-06-Z02"},"textbook":[{"heading":"状態と変化は違う","body":"ボタンが押されている状態を1、離されている状態を0とします。現在値が1という条件では、押し続けている間も繰り返し反応します。押した瞬間だけ処理したいなら、現在値と前回値の変化を判定する必要があります。前回値は記憶素子や変数に保存します。"},{"heading":"四つの組合せで論理式を作る","body":"現在値a、前回値bには(a,b)=(0,0),(0,1),(1,0),(1,1)の四通りがあります。立上りは(1,0)だけなのでa AND NOT b、立下りは(0,1)だけなのでNOT a AND bです。どちらかの変化を検出するならa XOR b（排他的論理和）になります。真理値表を作れば式を暗記する必要はありません。"},{"heading":"論理ゲートの出力を追う","body":"AND（論理積）は両方1、OR（論理和）は少なくとも一方1、XORは異なる値のとき1を返します。NOTは否定です。NAND、NOR、XNORはそれぞれAND、OR、XORの出力を反転します。入力の変化点で区間を分け、各区間の値を真理値表に当てはめればタイミングチャートを読めます。"},{"heading":"現実の入力では何に注意するか","body":"接点の開閉時には短時間に0と1が繰り返されるチャタリングが起こる場合があります。立上り検出だけでは何回も反応するため、一定時間安定した状態を確認するなどの対策が必要です。論理回路には伝搬遅延もあります。問題で遅延を無視するか、指定値を考慮するかを確認します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"状態とエッジの区別、真理値表で式を導く。"}},{"id":"06-2","title":"リアルタイムOS・スケジューリング","explain":"<p>リアルタイム性は「処理速度が高いこと」ではなく「決められた期限までに確実に結果が出ること」。ハードリアルタイムは締切超過が重大な失敗となり、ソフトリアルタイムは品質低下として扱う。優先度ベースのスケジューラでは、高優先度タスクが低優先度タスクの持つロックを待つ優先度逆転が起こり得る。優先度継承などで緩和する。</p>\n<p>周期タスクは処理時間C、周期T、期限Dを考慮する。単純な単一プロセッサ・独立周期タスクでCPU利用率Σ(Cᵢ/Tᵢ)を概算し、1を超えればスケジュール不可能。ただし1以下でも割込みや優先度条件で期限を守れるとは限らない。</p>\n","worked":"<p>タスクAが5ms/20ms、Bが3ms/10msを必要とするとCPU利用率は5/20＋3/10＝0.55（55%）。残り45%に割込み・OS処理等を見込む必要がある。</p>\n","prompt":"処理平均が5msで期限10msならリアルタイム要件を満たすか。","answer":"<p>平均だけでは判断できず、最悪実行時間や実測遅延が必要。</p>\n","beginner":{"scenario":"10msごとに1ms処理するタスクのCPU利用率10%、20msごとに4msなら20%、合計30%。","trap":"周期、期限、CPU実行時間は別。利用率だけでは期限保証にならない。","quizId":"U-06-2"},"textbook":[{"heading":"速さより期限を守る","body":"自動車の制動や工場の制御は、平均で高速でも必要な時刻に処理が終わらなければ危険です。リアルタイムOS（基本ソフトウェア）はタスクの期限や優先度を考慮してCPUを配分します。ハードリアルタイムでは期限違反が許容されず、ソフトリアルタイムでは多少の違反で品質が低下する場合があります。"},{"heading":"周期タスクを計算する","body":"実行時間C、周期TのタスクのCPU利用率はC/Tです。例えば周期10msで2ms実行する制御は20%、周期20msで3ms実行する記録は15%。合計35%です。ただし共有資源のロック、割込み、最悪実行時間も考えないと期限を守れるとはいえません。レートモノトニックは周期が短いタスクを優先し、EDF（最早期限優先）は現在の期限が近いタスクを優先します。"},{"heading":"優先度逆転","body":"高優先度タスクが低優先度タスクの保持するロックを待ち、中優先度タスクが低優先度タスクを妨げると、高優先度タスクの実行が遅れます。優先度継承ではロック保持者の優先度を一時的に上げ、ロック解放を促します。排他区間を短くすることも重要です。"}]},{"id":"06-Z03","title":"ハードウェアタイマ・分周・割込み","explain":"<p>クロック周波数fは毎秒の周期数。分周器は入力周波数を指定倍率dで割り、タイマ周波数f/dを作る。タイマの1カウント時間はd/f秒。ダウンカウンタが初期値Nから0になるまでN回減算する仕様なら時間はNd/f秒。</p>","worked":"<p>24MHzを48分周、初期値100なら200マイクロ秒。</p>","prompt":"8MHzを16分周したタイマで1ms後に0到達割込みを発生させたい。何回の減算が必要か。また分周数を2倍にすると同じ初期値で時間はどう変わるか。","answer":"<p>500回。分周後は500kHzなので1回2μs、1ms=1000μs、1000÷2=500。分周数を2倍にすると刻み時間が2倍になるので、同じ初期値なら2msになる。</p>","beginner":{"scenario":"一定時間後にマイコンへ割込みを発生させたい。","trap":"分周すると周波数は低くなり、周期は長くなる。","quizId":"U-06-Z03"},"textbook":[{"heading":"一定時間後に処理を始める仕組み","body":"マイクロコントローラ（マイコン）が一定時間後に処理を行うには時間を数える必要があります。CPUが空のループを回して待つと別の仕事ができず、命令の実行速度にも依存します。ハードウェアタイマはクロック信号を数える専用回路で、設定した時刻になったことを割込みなどでCPUへ知らせます。"},{"heading":"周波数と分周","body":"周波数f（Hz）は1秒間の周期数です。1周期は1/f秒です。分周器は元のクロックd周期につきタイマへ1周期を渡すので、タイマ周波数はf/d、1カウントの時間はd/f秒となります。例えば8MHz（毎秒800万周期）を16分周すると500kHz（毎秒50万周期）です。"},{"heading":"カウンタと割込み","body":"ダウンカウンタはクロックごとに値を1減らします。初期値Nから0になるまでN回減る仕様なら、経過時間T=N×d/f秒です。500kHzなら1回2μs（マイクロ秒）なので、250回で500μsになります。割込みはCPUに処理すべき事象を通知する仕組みで、タイマがCPUの全処理を停止するという意味ではありません。"},{"heading":"値の範囲と境界条件","body":"nビットの符号なしカウンタの最大値は2ⁿ−1です。オーバーフローで割込みを出す方式では最大値から0へ戻るまでの回数を考えます。0到達か0からの次の減算かによって1回分違う場合があり、必ず問題の仕様を確認します。周波数・周期・カウント数の単位をそろえて検算します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"式の暗記ではなく周波数→周期→カウント→割込みの因果と逆算。"}},{"id":"06-3","title":"通信・電力・信頼性","explain":"<p>組込み装置の通信にはI²C、SPI、UART、CAN、Ethernetなどがあり、距離、速度、ノイズ耐性、配線、リアルタイム性で使い分ける。車載CANは複数ノード間でフレームを共有し、優先順位による調停を行う。無線IoT（Internet of Things：モノのインターネット）では省電力と通信頻度のトレードオフが大きい。</p>\n<p>機器の故障は物理故障、ソフトウェア欠陥、誤操作や通信不調など多岐にわたる。ウォッチドッグタイマは応答がないソフトウェアを検知して再起動などを促す。二重化は可用性を改善するが、同一不具合で同時故障する可能性も評価する。</p>\n","worked":"<p>10mAで1時間、1mAで23時間動く装置なら1日平均電流は(10×1＋1×23)/24＝1.375mA。電池容量を平均電流で割ると理想的な稼働時間の目安が出るが、電池の実効容量や温度を考慮する。</p>\n","prompt":"ウォッチドッグで必ず障害原因が解消するか。","answer":"<p>再起動で一時回復する場合があるが、根本原因の修正やログ保全は別途必要。</p>\n","beginner":{"scenario":"電池式センサを1秒起動・9秒休止にすると起動時間割合は10%。休止時の電力が小さければ平均消費電力を減らせる。","trap":"安全に停止するフェイルセーフと機能を維持するフォールトトレランスは別。","quizId":"U-06-3"},"textbook":[{"heading":"電力の制約","body":"電池式センサでは常にCPUを動かす必要がないことがあります。定期的に起動し測定してから休止すると平均消費電力を減らせます。起動時100mW、休止時1mW、起動時間10%なら平均100×0.1＋1×0.9＝10.9mW。電池寿命を考える際は通信や起動時の消費も含めます。"},{"heading":"通信方式の選択","body":"I²CやSPIは機器内部でセンサなどを接続する方式、UARTは非同期シリアル通信、CANは複数制御機器が通信するために自動車等で使われる方式です。無線では通信距離・消費電力・帯域を考えます。用途により信頼性と応答期限も評価します。"},{"heading":"故障への備え","body":"フェイルセーフは故障時に安全な状態へ移ること。フォールトトレランスは故障しても必要な機能を継続すること。フールプルーフは誤操作しても危険になりにくい設計です。ウォッチドッグタイマは定期的な正常通知が途絶えた際に再起動等を行います。ただし再起動そのものが安全とは限らず、出力の安全状態を確保する必要があります。"}]},{"id":"06-Y02","title":"消費電力の計算・低電力回路設計","explain":"<p>電力は単位時間のエネルギー消費でP=VI（W）、電力量は電力×時間。3Vで20mAなら0.06W=60mW、10時間なら0.6Wh。容量2000mAhの電池を平均20mAで使えば理想的な動作時間は100時間だが、電圧・変換効率・温度・電池特性を考慮する。</p>","worked":"<p><b>電圧を0.9倍、周波数を0.8倍にする。動的電力の比は？</b></p><p>他条件一定なら0.9²×0.8＝0.648。元の64.8%。</p>","prompt":"電圧を0.9倍、周波数を0.8倍にする。動的電力の比は？","answer":"<p>他条件一定なら0.9²×0.8＝0.648。元の64.8%。</p>","textbook":[{"heading":"電力と電力量を区別する","body":"電力は単位時間のエネルギー消費でP=VI（W）、電力量は電力×時間。3Vで20mAなら0.06W=60mW、10時間なら0.6Wh。容量2000mAhの電池を平均20mAで使えば理想的な動作時間は100時間だが、電圧・変換効率・温度・電池特性を考慮する。"},{"heading":"回路が電力を消費する理由","body":"CMOS回路の動的消費電力は概ねαCV²fに比例する。αはスイッチング活動率、Cは負荷容量、Vは電圧、fは周波数。電圧を0.8倍にすると他条件一定で動的電力は0.64倍。停止中にもリーク電流による消費がある。クロックゲーティングは不要なクロックを止め動的消費を抑え、パワーゲーティングは不要回路への電源供給を遮断しリークを抑える。DVFS（動的電圧周波数制御）は負荷に合わせ電圧と周波数を変える。"},{"heading":"電源と動作の設計","body":"エネルギーハーベスティングは光・振動・温度差など環境エネルギーから電力を得る。シーケンス制御はあらかじめ決めた順序や条件に従い動作を進める。監視回路・診断プログラムで異常を確認し、電源回路・電池の制約も考える。低電力化で処理時間や応答期限、安全性が悪化しないか検証する。"}],"beginner":{"scenario":"電力と電力量を区別するから順に、回路が電力を消費する理由、電源と動作の設計を理解する。","trap":"電源を遮断することで待機時の漏れ電流を抑える。","quizId":"U-06-Y02"}},{"id":"06-Z01","title":"直列回路・LEDの電力と抵抗","explain":"<p>直列回路では各部品に同じ電流Iが流れ、各部品の電圧降下を合計すると電源電圧になる。電力P=VI（W）、抵抗のオームの法則V=RIを使う。LEDには順方向電圧があり、電流を制限する抵抗が必要。</p>","worked":"<p>9V電源、LED3Vなら全体に対するLEDの電力割合は約33.3%。</p>","prompt":"電源6V、LEDの順方向電圧2V、目標電流10mAの場合、直列抵抗の値とLEDの消費電力を求めよ。","answer":"<p>抵抗の電圧は6−2=4V、10mA=0.01AなのでR=4/0.01=400Ω。LED電力は2×0.01=0.02W。抵抗は0.04W、合計0.06Wで電源電力とも一致する。</p>","beginner":{"scenario":"電源と発光ダイオード（LED）と抵抗を直列につなぐ。","trap":"mAはAへ換算する。電圧降下の合計と電流を別々に扱う。","quizId":"U-06-Z01"},"textbook":[{"heading":"電圧・電流・抵抗の意味","body":"電圧V（ボルト）は単位電荷当たりのエネルギー差、電流I（アンペア）は単位時間当たりに流れる電荷量、抵抗R（オーム）は電流の流れにくさを表します。抵抗ではV=RI（オームの法則）が成り立ちます。電力P（ワット）は単位時間に消費するエネルギーで、P=VIです。"},{"heading":"直列回路の二つの関係","body":"部品が一つの経路に並ぶ直列回路では各部品を流れる電流は共通です。また電源電圧は各部品の電圧降下の和になります。LED（Light Emitting Diode: 発光ダイオード）は順方向に電流を流すと発光します。電流を制限する抵抗を直列に入れ、LEDの順方向電圧を考慮して抵抗値を決めます。"},{"heading":"抵抗値と消費電力を計算する","body":"電源9V、LEDの順方向電圧3V、目標電流20mA（0.02A）なら、抵抗にかかる電圧は9−3=6Vです。R=6÷0.02=300Ωです。LEDの電力は3×0.02=0.06W、抵抗は6×0.02=0.12W、合計0.18Wとなり電源の9×0.02と一致します。"},{"heading":"電力の比を式から導く","body":"同じ電流Iが流れるため、LEDの電力割合は(V_LED×I)/(V_電源×I)=V_LED/V_電源です。上の条件なら3/9=1/3となり、電流の具体値がなくても割合を求められます。並列回路では共通なのは電圧であり、この導出をそのまま使えません。実際の設計では抵抗の定格電力やLEDの特性・公差も確認します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"回路の前提と式の導出、単位変換。"}}],"beginnerIntro":"物理世界の計測と制御を扱う。センサ→変換→演算→出力の流れと故障時の安全を理解する。","studyGroups":[{"title":"電子回路と論理","body":"電気信号を論理値に対応させ、回路で処理を実現する。","ids":["06-1","06-X01","06-Y01","06-Z02"]},{"title":"計測・リアルタイム制御","body":"時間制約のある処理をタイマと割込みで制御する。","ids":["06-2","06-Z03"]},{"title":"電力・信頼性","body":"電力計算、効率、安全性を設計に結びつける。","ids":["06-3","06-Y02","06-Z01"]}]},{"id":7,"title":"ユーザーインタフェース・UX","group":"テクノロジ","priority":"A標準","summary":"使いやすさと利用者体験を要求・設計・評価に落とし込む。","lessons":[{"title":"UIとUX","body":"UI（User Interface：利用者との接点）は表示や操作系、UX（User Experience：利用者体験）は利用の前後を含む体験全体。見た目が美しくても目的を達成できなければUXは低い。","check":"似た言葉を同義扱いしない。"},{"title":"人間中心設計","body":"利用状況を理解→利用者要求を明確化→設計案→評価を反復する。ペルソナとユーザージャーニーで対象者と利用文脈を可視化。","check":"作り手の好みより実ユーザーの観察が重要。"},{"title":"評価方法","body":"ユーザビリティテストは代表利用者に操作してもらう。A/Bテストは条件を比較するが標本・割付・指標設計が必要。","check":"主観的な感想だけで定量性能を断定しない。"},{"title":"アクセシビリティ","body":"キーボード操作、読み上げ、色のみに依存しない表示、適切な文字コントラストなどで多様な利用者を支援する。","check":"色覚・身体条件だけでなく利用環境の違いにも配慮。"}],"terms":[{"term":"UI","definition":"画面や操作部などシステムと利用者の接点"},{"term":"UX","definition":"利用中だけでなく前後を含めた利用者の体験"},{"term":"ペルソナ","definition":"典型的な利用者像を具体化したモデル"},{"term":"ユーザージャーニー","definition":"利用者の行動や感情を時間順に可視化したもの"},{"term":"プロトタイプ","definition":"設計案を早期に検証するための試作品"},{"term":"アクセシビリティ","definition":"多様な利用者が利用可能であること"},{"term":"ユーザビリティ","definition":"目的を有効・効率的・満足して達成できる程度"},{"term":"ヒューリスティック評価","definition":"経験則に照らして画面などの問題を専門家が点検する方法"},{"term":"A/Bテスト","definition":"異なる二案を割り付けて成果指標を比較する実験"}],"questions":[{"id":"Q07-01","chapter":7,"kind":"applied","q":"画面の操作性だけでなく利用前後の期待や感情まで含む概念は。","options":["UI","UX","API","CPU"],"correct":1,"explain":"UXは利用体験全体を扱う。"},{"id":"Q07-02","chapter":7,"kind":"applied","q":"操作を色だけで区別させないのは主に何のためか。","options":["暗号強度を上げる","可用性を上げる","アクセシビリティを高める","帯域を増やす"],"correct":2,"explain":"色覚などに依存しない操作を支援する。"},{"id":"Q07-03","chapter":7,"kind":"applied","q":"ユーザビリティテストとして最も適切なのは。","options":["画面を開発者だけで確認する","代表利用者が課題を操作する様子を観察する","サーバー稼働率を測る","コードの静的解析をする"],"correct":1,"explain":"実利用者の課題達成状況を観察する。"},{"id":"D07-01","chapter":7,"kind":"applied","q":"フォームの入力誤りを赤色の枠線だけで示したときの改善策として適切なものはどれか。","options":["赤色をさらに濃くする","入力欄をすべて無効化する","エラー文を入力欄と関連付けて表示する","確認をすべて省略する"],"correct":2,"explain":"色だけに依存せず、文章・スクリーンリーダー対応等で伝える。"},{"id":"D07-02","chapter":7,"kind":"applied","q":"使いやすさの評価で操作時間が短くなったが入力誤りが増えた場合、何を検討すべきか。","options":["速度だけで優劣を決める","エラー率や完了率も合わせて評価する","テスト参加者を減らす","利用者の意見は無視する"],"correct":1,"explain":"ユーザビリティは有効さ・効率・満足度など複数尺度で評価する。"},{"id":"D07-03","chapter":7,"kind":"applied","q":"ユーザビリティテストの説明として適切なものはどれか。","options":["利用者による実際の操作を観察する","必ずプログラムのソースコードを読む","利用者の操作を調べない","監査証跡をすべて破棄する"],"correct":0,"explain":"タスク実施時の迷い・誤操作・達成状況を観察して課題を見つける。"},{"id":"Q-07-X01","chapter":7,"kind":"applied","q":"実際の利用者に課題を実行してもらい成功率を測定する方法は？","options":["性能ベンチマーク","ユーザビリティテスト","構文解析","回帰分析"],"correct":1,"explain":"ユーザビリティテスト。"},{"id":"U-07-1","chapter":7,"kind":"applied","q":"利用者の状況を理解し試作品を評価・改善する考え方は？","options":["人間中心設計","線形計画法","構成管理","ハッシュ探索"],"correct":0,"explain":"利用者・利用状況の理解と評価を反復する。"},{"id":"U-07-2","chapter":7,"kind":"applied","q":"同じ操作で同じボタン名・配置を使う主目的は？","options":["通信速度向上","操作の一貫性向上","暗号強度向上","DB正規化"],"correct":1,"explain":"習得済みの操作を再利用でき迷いや誤操作を減らす。"},{"id":"U-07-3","chapter":7,"kind":"applied","q":"画面読み上げで画像の意味を伝える方法は？","options":["解像度向上","色数増加","代替テキスト","JPEG変換"],"correct":2,"explain":"代替テキストは画像を見られない利用者に内容を伝える。"},{"id":"U-07-X01","chapter":7,"kind":"applied","q":"専門家が設計原則に照らして評価する手法は？","options":["利用者テスト","負荷試験","単体テスト","ヒューリスティック評価"],"correct":3,"explain":"専門家が原則との不一致を探す手法。"},{"id":"U-07-Y01","chapter":7,"kind":"applied","q":"カテゴリだけでなく利用者の自由なタグで分類する方式は？","options":["フォークソノミー","直線型","ラジオボタン","順番コード"],"correct":0,"explain":"利用者が付与したタグで情報を分類する方式。"},{"id":"U-07-Y02","chapter":7,"kind":"applied","q":"初心者と熟練者の操作時間の比に着目する評価法は？","options":["LATCH","NEM","PPM","CRC"],"correct":1,"explain":"NEMは操作時間比などから使いにくい箇所を探す。"},{"id":"U-07-Y03","chapter":7,"kind":"applied","q":"明細金額の合計と請求合計が一致するか確かめる検査は？","options":["数値チェックのみ","フォーマットチェックのみ","バランスチェック","桁別コード"],"correct":2,"explain":"相互に対応する集計値の整合性を確かめる。"}],"deepIntro":"使いやすさは「見た目の良さ」ではなく、利用者が目的を効率よく正確に達成できるかで評価する。","deep":[{"id":"07-1","title":"UX・ユーザビリティ・設計プロセス","explain":"<p>UI（User Interface：操作画面・接点）はボタンや表示、UX（User Experience：利用体験）は利用前から利用後までを含む体験全体。ISO 9241-11のユーザビリティ概念は、特定の利用状況での有効さ、効率、満足度で捉える。利用者・業務・利用環境を調査し、ペルソナやカスタマージャーニーで仮説を可視化する。仮説は実際の利用者調査で検証する。</p>\n<p>プロトタイプは低忠実度の紙画面から実動する試作品まで目的に応じて選ぶ。ヒューリスティック評価は専門家が原則に照らして問題を検討、ユーザビリティテストは利用者の行動を観察する。ABテストは無作為割付などの条件を設計し、比較指標と交絡要因に注意する。</p>\n","worked":"<p>フォーム送信に平均30秒かかる改善案Aと20秒のBがあっても、Bで入力ミス率が2倍なら効率だけで優劣を決められない。有効さ（完了率・誤入力）も測る。</p>\n","prompt":"ペルソナに詳しい物語を書けば調査が不要か。","answer":"<p>不要にはならない。根拠のない架空設定を事実扱いしない。</p>\n","beginner":{"scenario":"予約アプリの操作に平均5分かかるなら、観察で迷う場所を見つけ、試作品で2分になるか測る。","trap":"UX（利用者体験）は見た目だけではなく利用前後も含む。","quizId":"U-07-1"},"textbook":[{"heading":"使いやすさとは何か","body":"アプリが仕様通り動いても利用者が目的を達成できなければ役に立ちません。UI（User Interface：利用者との接点）は画面や入力操作など、UX（User Experience：利用者体験）は利用前の期待、利用中の操作、利用後の満足まで含む体験です。ユーザビリティは特定の利用者が特定の状況で目標を達成する有効さ、効率、満足度などを評価します。"},{"heading":"人間中心設計の進め方","body":"まず利用者が何をどの環境で行うか観察し、利用者の要求を明確にします。画面案を作り、試作品（プロトタイプ）を試してもらい、問題を見つけ改善を繰り返します。ペルソナは調査に基づく代表的利用者像、ユーザージャーニーは目的達成までの行動と体験の流れを表します。"},{"heading":"評価する指標","body":"購入画面なら完了率、完了までの時間、入力ミス、満足度を測ります。利用者の発言だけでなく行動を観察し、目的を妨げる要因を探します。好みの画面を多数決で選ぶだけではなく、誰が何を達成するための設計か考えます。"}]},{"id":"07-X01","title":"ユーザーインタフェース技術と評価","explain":"<p>GUI（グラフィカルユーザーインタフェース）は画面の部品を使い、CUI（文字ユーザーインタフェース）はコマンドなど文字で操作する。音声認識・ジェスチャ・タッチ操作も入力手段で、用途に応じて選ぶ。画面設計では入力補助、操作の一貫性、フィードバック、エラー回復を考慮する。</p><p>ユーザー体験（UX）は利用前後を含む体験、ユーザビリティは特定の利用状況における目的達成のしやすさ。ユーザテストでは成功率、時間、誤操作などを測定する。ヒューリスティック評価は専門家が原則と照合する。アクセシビリティではキーボード操作、色以外の識別、代替テキスト、読み上げ対応を重視する。</p>","worked":"<p>色だけでエラーを示す画面に文字とアイコンを追加し、読み上げでも通知されるように改善する。</p>","prompt":"実際の利用者に課題を実行してもらい成功率を測定する方法は？","answer":"<p>ユーザビリティテスト。</p>","beginner":{"scenario":"20人中15人が購入完了したならタスク成功率75%。改善版でも同じ条件で時間・成功率を測る。","trap":"A/Bテストは指標や対象次第。全員の使いやすさを保証しない。","quizId":"U-07-X01"},"textbook":[{"heading":"入力方式を選ぶ","body":"GUI（グラフィカルユーザーインタフェース）は画面上の部品で操作し、CUI（文字ユーザーインタフェース）はコマンドなど文字で指示します。タッチ、音声認識、ジェスチャなども用途に応じて選びます。手袋を着ける工場ではタッチ操作に制約があり、騒音のある場所では音声認識が難しい場合があります。"},{"heading":"評価方法を選ぶ","body":"ユーザビリティテストは実際の利用者に課題を実行してもらい、成功率、時間、誤操作を観察します。ヒューリスティック評価は専門家が設計原則に照らして問題を発見します。認知的ウォークスルーは初めて使う利用者が操作を理解できるか手順ごとに検討します。"},{"heading":"A/Bテストの注意","body":"利用者を比較可能な条件で二つの設計案へ割り当て、購入率などを比較します。一方が優れていると判断するには十分な標本、適切な指標、偏りのない条件が必要です。売上の改善がアクセシビリティの改善を意味するとは限りません。"}]},{"id":"07-Y02","title":"体験設計・情
