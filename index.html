  const note=E(S.dailyNotes?.[today]||'');
  return `<div class="page"><div class="eyebrow">LEARNING CONTROL / ON DEVICE</div><h1>学習管理</h1><p class="sub">このアプリだけで進捗・今日の目標・復習予定・公式過去問の成績を管理できます。記録はこの端末のブラウザに保存され、他の端末とは自動同期されません。</p>
  <div class="card"><div class="btnline"><div><div class="tagline">今日の学習 · ${E(today)}</div><h2 style="margin:6px 0">${now.count} / ${target}問</h2><div class="muted small">今日の正答 ${now.right}問 / 目標は練習問題の回答数</div></div><label class="small" style="display:flex;flex-direction:column;gap:5px">1日の演習目標<input id="daily-target" class="ctrl" inputmode="numeric" type="number" min="1" max="200" value="${target}" style="width:110px"></label></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><p class="small muted">目標達成 ${pct}%（復習用の回答も含む）</p><label class="small"><b>今日の振り返り</b><textarea class="answerbox" id="daily-note" style="min-height:92px" placeholder="今日は何を理解した？ 明日は何を復習する？">${note}</textarea></label><div class="buttons"><button class="action soft" data-nav="quiz">問題を解く</button><button class="action secondary" data-export>学習記録のバックアップ</button></div></div>
  <div class="grid"><div class="card"><h3>直近7日の回答数</h3><div class="daybars">${last7.map(x=>`<div class="daybar"><strong>${x.count}</strong><div class="daybartrack"><div class="daybarfill" style="height:${Math.round(100*Math.min(x.count,target)/target)}%"></div></div><span>${x.date.slice(5).replace('-','/')}</span></div>`).join('')}</div><p class="small muted">学習履歴をリセットするとこの表示も消えます。</p></div><div class="card"><h3>総合到達度の目安</h3><p><b>${Object.values(S.seen).filter(Boolean).length}/${D.chapters.length}</b>章を読了として記録</p><p><b>${ready}/${D.chapters.length}</b>章で「読了＋10問以上＋正答率80％以上」</p><p><b>${Object.keys(S.wrong).filter(k=>S.wrong[k]).length}</b>問が誤答リストに残っています</p><p><b>${due.length}</b>問が今日までに復習予定です</p><div class="buttons"><button class="action secondary" data-nav="review">弱点・計画を確認</button><button class="action soft" data-start="wrong">誤答を解く</button></div><p class="small muted">学習目標であり、合格認定ではありません。公式過去問の成績も確認してください。</p></div></div>
  <h2>復習予定</h2><div class="card">${!scheduled.length?'<p class="muted">復習予定はまだありません。問題を間違えると翌日、正解後に3日後・7日後の復習を設定します。</p>':`<p class="muted">今日まで ${due.length}問 / 予定全体 ${scheduled.length}問。予定日は自動で更新します。</p>${scheduled.slice(0,15).map(([id,item])=>`<div class="manage-row"><span class="pill ${item.due<=today?'high':''}">${E(item.due)}${item.due<=today?' 要復習':''}</span><div style="min-width:0">${E(qById[id].q).slice(0,80)}</div></div>`).join('')}`}</div>
  <h2>23分野の習熟状況</h2><div class="card" style="padding:10px 14px">${chapterRows.map(({c,n,r,pct})=>`<div class="manage-row"><div style="flex:1;min-width:150px"><b>${String(c.id).padStart(2,'0')} ${E(c.title)}</b><div class="small muted">${S.seen[c.id]?'読了':'未読了'} · 演習${n}回 · ${pct===null?'未測定':`正答率${pct}%`}</div></div><button class="action secondary" style="font-size:12px;padding:7px 9px" data-ch="${c.id}">講義・演習</button></div>`).join('')}</div>
  <h2>公式問題による本番対策</h2><div class="card"><p class="muted">科目Aは実際の問題冊子を開いて80問解き、アプリ内で採点できます。科目Bは記述答案を公式解答と照合して自己評価を保存します。</p>${official.map(p=>`<div class="manage-row"><strong>${E(p.title)}</strong><span class="muted small">A：${p.a?`${p.a.score}/80`:'未実施'}　B：${p.b?.score!=null?`${p.b.score}/100（自己採点）`:'未記録'}</span></div>`).join('')}<div class="buttons"><button class="action" data-nav="past">公式過去問へ</button></div></div>
  <div class="warn">この進捗管理は端末内保存です。毎週「学習記録のバックアップ」でJSONファイルを書き出し、iPhoneの「ファイル」アプリやiCloud Driveに保管してください。サイトのデータ削除・プライベートモード・別ブラウザへの移動では記録が引き継がれない場合があります。</div></div>`;
}
function schedule(){let rows=[['11/23–12/13','基礎固め','1〜8章を中心に数学、計算量、OS、構成要素を理解。毎日20問。'],['12/14–01/03','技術重点','9〜13章でDB・ネットワーク・セキュリティ・開発を強化。記述も週2題。'],['01/04–01/24','管理・戦略','14〜23章を網羅。科目A公式過去問を2回分以上。記述選択分野を仮決定。'],['01/25–02/05','科目A仕上げ','80問・150分の模試と誤答復習。計算・法務・用語を最終点検。'],['02/06–02/19','科目A受験','予約した会場・日時で受験。受験後は科目Bの選択分野へ集中。'],['02/20–03/02','科目B集中','必須セキュリティと得意4分野の長文演習。公式過去問を3回分以上。'],['03/03–03/15','科目B受験','150分で5問解く練習後、受験。問題選択と文字数制約に注意。']];return `<div class="card timeline">${rows.map(r=>`<div class="week"><b>${r[0]}</b><div><b>${r[1]}</b><div class="muted small">${r[2]}</div></div></div>`).join('')}</div>`}
function chapterCards(filter=''){let cs=D.chapters.filter(c=>(c.title+c.group+c.summary).toLowerCase().includes(filter.toLowerCase()));return `<div class="grid">${cs.map(c=>`<div class="chap-card"><div class="tagline">CHAPTER ${String(c.id).padStart(2,'0')} · ${E(c.group)}</div><h3 style="margin:1px 0">${E(c.title)}</h3><div>${c.priority.includes('必須')?'<span class="pill must">B必須</span>':''}<span class="pill ${c.priority.includes('重要')?'high':''}">${E(c.priority)}</span>${S.seen[c.id]?'<span class="pill done">修了</span>':''}</div><div class="small muted">${E(c.summary)}</div><div class="buttons" style="margin-top:auto"><button class="action soft" data-ch="${c.id}">講義を見る</button><button class="action secondary" data-drill="${c.id}">演習</button></div></div>`).join('')}</div>`}
function chapters(){return `<div class="page"><div class="eyebrow">INPUT / 23 AREAS</div><h1>全23章の講義・用語集</h1><p class="sub">公式シラバスの中分類を網羅するための要点整理です。講義を読み、用語を確認したら章末演習へ進んでください。</p><input id="chapter-search" class="search" placeholder="章名・キーワードで検索" aria-label="章を検索"><div id="chap-grid">${chapterCards()}</div></div>`}
function chapter(){let c=D.chapters[chapterId-1];if(!c)return '';let num=c.questions.length+c.terms.length;return `<div class="page"><div class="eyebrow">CHAPTER ${String(c.id).padStart(2,'0')} / ${E(c.group)}</div><div class="btnline"><h1>${E(c.title)}</h1><span class="pill ${c.priority.includes('必須')?'must':'high'}">${E(c.priority)}</span></div><p class="sub">${E(c.summary)}</p><div class="buttons"><button class="action soft" data-drill="${c.id}">章の確認問題 ${num}問</button><button class="action secondary" data-nav="chapters">章一覧に戻る</button></div><h2>01｜知識を理解する</h2>${c.lessons.map((v,i)=>`<section class="lesson"><h3>${String(i+1).padStart(2,'0')}　${E(v.title)}</h3><p>${E(v.body)}</p><div class="tip"><b>試験での注意：</b>${E(v.check)}</div></section>`).join('')}<h2>02｜重要用語を押さえる</h2><div class="termgrid">${c.terms.map(t=>`<div class="term"><b>${E(t.term)}</b>${E(t.definition)}</div>`).join('')}</div><h2>03｜理解を確認する</h2><p class="muted">用語識別問題と応用問題を繰り返し解き、説明できない項目を復習してください。</p><div class="buttons"><button class="action" data-drill="${c.id}">この章の問題を解く</button><button class="action secondary" data-complete="${c.id}">${S.seen[c.id]?'✓ 修了済み':'講義を修了にする'}</button><button class="action secondary" data-ch="${Math.min(23,c.id+1)}">次の章へ</button></div></div>`}
function qSelect(){return `<div class="page"><div class="eyebrow">OUTPUT / SUBJECT A</div><h1>科目A 知識・計算の演習</h1><p class="sub">定義確認${D.questions.filter(q=>q.kind==='term').length}問と判断・計算${D.questions.filter(q=>q.kind==='applied').length}問。解答後すぐに根拠を表示し、誤答を自動記録します。</p>${stats()}<div class="card"><h3>演習メニュー</h3><div class="filter"><select class="ctrl" id="qchapter"><option value="all">全分野から</option>${D.chapters.map(c=>`<option value="${c.id}">${String(c.id).padStart(2,'0')} ${E(c.title)}</option>`).join('')}</select><select class="ctrl" id="qtype"><option value="mix">用語+判断・計算</option><option value="applied">判断・計算のみ</option><option value="term">用語のみ</option></select><select class="ctrl" id="qcount"><option value="10">10問</option><option value="20">20問</option><option value="30">30問</option><option value="all">全問</option></select></div><div class="buttons"><button class="action" data-start="custom">演習を開始</button><button class="action secondary" data-start="wrong">誤答を優先して復習</button></div></div><div class="card"><h3>解き方のポイント</h3><p>先に選択肢を見る前に自分の答えを予測します。正答しても根拠を説明できなければ「要復習」に。学習初期は用語問題、仕上げでは判断・計算問題と公式過去問を中心にします。</p></div></div>`}
function shuffled(xs){let a=xs.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(type,ids){if(!ids.length){alert('対象の問題がありません。まず演習を進めてください。');return}quiz={type,ids,answers:{},index:0,finished:false,started:Date.now()};navigate('taking')}
function dayKey(date=new Date()){const x=new Date(date);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}
function addDays(base,days){const d=new Date(`${base}T12:00:00`);d.setDate(d.getDate()+days);return dayKey(d)}
function record(qid,correct){let st=S.stats[qid]||{total:0,right:0};st.total++;S.reviewSchedule??={};let rv=S.reviewSchedule[qid];if(correct){st.right++;delete S.wrong[qid];if(rv){let stage=(rv.stage||0)+1;if(stage>=3)delete S.reviewSchedule[qid];else S.reviewSchedule[qid]={stage,due:addDays(dayKey(),stage===1?3:7)};}}else{S.wrong[qid]=true;S.reviewSchedule[qid]={stage:0,due:addDays(dayKey(),1)};}S.stats[qid]=st;S.log.push({q:qid,ok:correct,at:new Date().toISOString()});if(S.log.length>1200)S.log=S.log.slice(-1200);save()}
function taking(){let isMock=quiz.type==='mock', total=quiz.ids.length, answered=Object.keys(quiz.answers).length, q=qById[quiz.ids[quiz.index]], a=quiz.answers[q.id],show=!isMock&&a!==undefined;return `<div class="page"><div class="eyebrow">${isMock?'FULL-LENGTH MOCK':'PRACTICE'}</div><div class="btnline"><h1 style="font-size:25px">${isMock?'科目A 80問 模擬演習':'確認問題'}</h1>${isMock?`<span class="timer" id="timer">150:00</span>`:''}</div><div class="btnline"><span class="muted">${quiz.index+1} / ${total}問　回答済み ${answered}問</span>${isMock?'<span class="pill high">解答は終了後に表示</span>':''}</div><div class="progress"><div class="bar" style="width:${answered/total*100}%"></div></div><div class="question"><div class="qnum">${E(D.chapters[q.chapter-1].title)} · ${q.kind==='term'?'用語':'判断・計算'}</div><div class="qtxt">${E(q.q)}</div><div class="options">${q.options.map((opt,i)=>`<button class="option ${a===i?'selected':''} ${show&&i===q.correct?'right':''} ${show&&a===i&&a!==q.correct?'wrong':''}" data-answer="${i}" ${show?'disabled':''}><span class="choice">${['ア','イ','ウ','エ'][i]}</span><span>${E(opt)}</span></button>`).join('')}</div>${show?`<div class="explain"><div class="${a===q.correct?'good':'bad'}">${a===q.correct?'正解':'不正解'} · 正答：${['ア','イ','ウ','エ'][q.correct]}</div><p>${E(q.explain)}</p></div>`:''}</div><div class="buttons"><button class="action secondary" data-q-prev ${quiz.index===0?'disabled':''}>前へ</button><button class="action" data-q-next>${quiz.index===total-1?'採点・終了':'次の問題へ'}</button><button class="action secondary" data-q-review="${q.id}">${S.wrong[q.id]?'復習から外す':'要復習に追加'}</button></div><p class="notice">${isMock?'150分の自主模擬形式。問題は独自作成で、実際の科目Aより短い用語問題も含まれます。':'解答するとすぐに根拠が表示され、正誤が端末内に記録されます。'}</p></div>`}
function finishQuiz(){if(quiz.finished)return;const isMock=quiz.type==='mock';let wrong=[];let good=0;for(let id of quiz.ids){let a=quiz.answers[id],q=qById[id];if(a===q.correct)good++;else wrong.push(id);if(isMock&&a!==undefined)record(id,a===q.correct)}quiz.finished=true;view='result';render()}
function result(){let good=quiz.ids.filter(id=>quiz.answers[id]===qById[id].correct).length, total=quiz.ids.length, pct=Math.round(good/total*100),t=quiz.ids.filter(id=>quiz.answers[id]!==qById[id].correct);return `<div class="page"><div class="eyebrow">RESULT / 自己評価</div><h1>演習結果</h1><div class="card" style="text-align:center"><div class="tagline">正答数 / 対象問題数</div><div style="font-size:45px;font-weight:800;color:var(--teal)">${good} / ${total}</div><div style="font-size:21px">${pct}% 正解</div><p class="muted">${pct>=80?'知識は安定しています。判断根拠と公式過去問へ進みましょう。':pct>=60?'合格ライン相当の正答率ですが、独自問題と本試験の難易度は異なります。誤答を復習しましょう。':'まず間違えた用語・計算を講義へ戻って確認しましょう。'}</p></div><div class="buttons"><button class="action" data-start="wrong">弱点を解く</button><button class="action secondary" data-nav="quiz">別の演習</button><button class="action secondary" data-nav="home">トップへ</button></div><h2>間違えた・未回答の問題（${t.length}）</h2>${t.slice(0,120).map((id,i)=>{let q=qById[id],a=quiz.answers[id];return `<div class="question"><div class="qnum">${E(D.chapters[q.chapter-1].title)} / ${E(id)}</div><div class="qtxt">${E(q.q)}</div><div class="small">あなたの解答：${a===undefined?'未回答':E(q.options[a])}</div><div class="good small">正答：${E(q.options[q.correct])}</div><p class="muted">${E(q.explain)}</p></div>`}).join('')||'<p>間違いはありません。</p>'}</div>`}
function mock(){return `<div class="page"><div class="eyebrow">80 QUESTIONS / 150 MINUTES</div><h1>科目A 80問 模擬演習</h1><div class="card"><h3>模擬演習の内容</h3><p>独自作成の判断・計算問題を優先し、残りを用語識別問題で補った<strong>80問・150分</strong>の練習です。全問解答後に採点し、解説と弱点リストを確認できます。</p><div class="warn">公式問題を再現したものではありません。制限時間や全範囲の知識確認に使い、合格判定はIPA公式過去問の成績を重視してください。</div><div class="buttons"><button class="action" data-start="mock">80問・150分を開始</button><button class="action secondary" data-nav="quiz">短い演習から始める</button></div></div></div>`}
function flash(){let terms=[];D.chapters.forEach(c=>c.terms.forEach((t,i)=>terms.push({...t,chapter:c.id,id:`${c.id}-${i}`})));if(flashFilter!=='all')terms=terms.filter(t=>t.chapter===+flashFilter);if(!terms.length)return '';flashIndex=(flashIndex+terms.length)%terms.length;let t=terms[flashIndex];return `<div class="page"><div class="eyebrow">ACTIVE RECALL / 重要用語</div><h1>暗記カード</h1><p class="sub">カードをタップして説明を確認。説明を見る前に声に出して説明してみてください。</p><select class="ctrl" id="flash-filter"><option value="all">全分野（${D.chapters.reduce((n,c)=>n+c.terms.length,0)}語）</option>${D.chapters.map(c=>`<option value="${c.id}" ${flashFilter==c.id?'selected':''}>${E(c.title)}</option>`).join('')}</select><p class="muted small">カード ${flashIndex+1} / ${terms.length} · ${E(D.chapters[t.chapter-1].title)}</p><button class="flash" style="width:100%" data-flip><strong>${E(flashOpen?t.definition:t.term)}</strong><small>${flashOpen?'もう一度タップで用語に戻る':'タップして意味を見る'}</small></button><div class="buttons"><button class="action secondary" data-flash-prev>前へ</button><button class="action" data-flash-next>次へ</button></div></div>`}
function cases(){return `<div class="page"><div class="eyebrow">OUTPUT / SUBJECT B</div><h1>科目B 記述トレーニング</h1><p class="sub">情報セキュリティは必須。残りは得意な4分野を選ぶ練習をします。全${D.cases.length}ケースは独自の短縮教材で、公式過去問より短く構成されています。</p><div class="grid">${D.cases.map((c,i)=>`<div class="chap-card"><div class="tagline">CASE ${i+1} / ${E(c.domain)}</div><h3>${E(c.title)}</h3>${c.required?'<div><span class="pill must">必須分野</span></div>':''}<div class="muted small">記述設問${c.items.length}問・模範解答つき</div><button class="action soft" data-case="${i}">解いてみる</button></div>`).join('')}</div></div>`}
function caseDetail(){let c=D.cases[caseIndex];return `<div class="page"><div class="eyebrow">CASE ${caseIndex+1} / ${E(c.domain)}</div><h1>${E(c.title)}</h1><p class="sub">読解→自分の言葉で記述→模範解答と照合→自己採点。<strong>採点は自動ではありません。</strong></p><h2>問題文</h2><div class="case-pass">${E(c.passage)}</div>${c.items.map((it,i)=>{let id=`${c.id}-${i}`,shown=!!revealed[id],self=S.self[id];return `<div class="card"><div class="qnum">設問 ${i+1}</div><h3>${E(it.q)}</h3><textarea class="answerbox" data-case-input="${id}" placeholder="ここにあなたの解答を入力">${E(S.notes[id]||'')}</textarea><div class="buttons"><button class="action soft" data-reveal="${id}">${shown?'模範解答を隠す':'模範解答を表示'}</button></div>${shown?`<div class="rubric"><b>模範解答</b><p>${E(it.answer)}</p><b>根拠</b><p>${E(it.reason)}</p><div class="small">自己採点の観点：${E(it.keywords.join(' / '))}</div></div><div class="buttons"><button class="action secondary" data-self="${id}:pass">${self==='pass'?'✓ ':''}自分で正答と判定</button><button class="action red" data-self="${id}:fail">${self==='fail'?'✓ ':''}要復習</button></div>`:''}</div>`}).join('')}<div class="tip"><b>記述のコツ：</b>${E(c.tips)}</div><div class="buttons"><button class="action secondary" data-nav="cases">ケース一覧へ</button><button class="action" data-case="${(caseIndex+1)%D.cases.length}">次のケースへ</button></div></div>`}
const formulas=[['2の補数','負数 = ビット反転 + 1（固定ビット幅）','固定ビット幅でオーバーフロー確認。'],['符号付きnビット範囲','−2^(n−1) 〜 2^(n−1)−1','n=8なら−128〜127。'],['確率：独立','P(A∩B)=P(A)×P(B)','独立という条件が必要。'],['期待値','E[X]=Σ(値×確率)','確率の総和が1か確認。'],['情報量','log₂N ビット','N通り同確率なら。'],['待ち行列M/M/1','W=1/(μ−λ)','μ＞λ。Wは系内の平均滞在時間。'],['リトルの法則','L=λW','定常状態の平均系内数。'],['CPU実行時間','命令数×CPI÷周波数','GHzは10^9Hz。'],['キャッシュ平均時間','ヒット率×ヒット時間＋ミス率×ミス時間','ミス時時間の定義に注意。'],['稼働率','MTBF/(MTBF+MTTR)','可用性。'],['並列冗長','1−(1−A₁)(1−A₂)','独立・どちらか動けばよい場合。'],['画像容量','横×縦×色深度÷8','ビットをバイトへ変換。'],['音声容量','サンプル/秒×ビット数×ch×秒÷8','PCM非圧縮の概算。'],['IPv4ホスト数','2^(32−プレフィックス長)−2','通常のサブネットでの値。/31・/32は例外。'],['CPI (出来高管理)','EV÷AC','1未満でコスト効率悪化。'],['SPI (出来高管理)','EV÷PV','1未満で計画比進捗遅れ。'],['CV / SV','CV=EV−AC、SV=EV−PV','マイナスはコスト超過・進捗遅れ。'],['損益分岐点売上高','固定費÷限界利益率','限界利益率=(売上−変動費)/売上。'],['ROI','利益÷投資額×100%','何を利益と呼ぶか確認。'],['流動比率','流動資産÷流動負債×100%','短期支払能力。'],['自己資本比率','自己資本÷総資産×100%','自己資本=資産−負債。'],['EOQ','√(2DS/H)','需要D、発注費S、在庫保管費H。']];
function review(){let ws=Object.keys(S.wrong).filter(id=>S.wrong[id]&&qById[id]);return `<div class="page"><div class="eyebrow">REVIEW / PLANNING</div><h1>弱点・公式・学習計画</h1><div class="card"><h3>誤答リスト：${ws.length}問</h3><p class="muted">正答後は自動的に要復習から外れます。間違えた問題を再出題して、根拠まで説明できるようにします。</p><button class="action" data-start="wrong">弱点から演習する</button>${ws.slice(0,12).map(id=>`<div class="term"><b>${E(qById[id].q)}</b>${E(qById[id].explain)}</div>`).join('')}</div><h2>頻出計算公式</h2><div class="card">${formulas.map(f=>`<div class="formula"><b>${E(f[0])}</b><div><code>${E(f[1])}</code><div class="small muted">${E(f[2])}</div></div></div>`).join('')}</div><h2>週次計画</h2>${schedule()}</div>`}
function settings(){let a=accuracy();return `<div class="page"><div class="eyebrow">DATA / SOURCES</div><h1>データ・公式出典</h1><div class="card"><h3>学習記録</h3><p>講義修了、演習の正誤、誤答、記述解答は端末のブラウザに保存されます。外部送信しません。プライベートブラウズやブラウザデータ消去では失われる場合があります。</p><p class="muted small">通算解答${a.n}回 / 正答${a.r}回</p><div class="buttons"><button class="action" data-export>記録をJSONで書き出す</button><label class="action secondary" for="import-file">記録を読み込む</label><input id="import-file" type="file" accept="application/json,.json" style="display:none"><button class="action red" data-reset>学習記録を削除</button></div></div><div class="card"><h3>アプリの使い方</h3><p><a href="./textbook.pdf" target="_blank" rel="noopener">64ページの教科書（PDF）</a>を読み、講義・用語→科目A演習→公式過去問→科目Bの順で練習してください。「学習管理」で日ごとの目標と復習予定を確認できます。</p><p>iPhoneでSafariから開き、「共有」→「ホーム画面に追加」を選ぶとアプリのように起動できます。ブラウザ履歴やサイトデータを削除すると記録が失われることがあるため、定期的にJSONを「ファイル」に書き出してください。端末間の自動同期・アカウントログインには未対応です。</p></div><div class="card"><h3>一次資料・公式過去問題</h3>${D.sources.map(v=>`<p>・<a href="${E(v.url)}" target="_blank" rel="noopener noreferrer">${E(v.title)}</a></p>`).join('')}<p class="notice">受験申込み期間などは変更され得ます。申込前にIPA公式サイトで最新情報をご確認ください。</p></div><div class="card"><h3>この教材の範囲と限界</h3><p>公式シラバスVer.7.2の23中分類を基準に、重要論点を自主学習向けに整理したオリジナル教材です。<strong>公式シラバスの全細目を逐語的に転載したものでも、出題され得る全問題を収録したものでもありません。</strong> 科目Bのケースは本番より短く、記述の自動採点はありません。直前期には必ずこのアプリの「IPA公式過去問」から旧午後を含む公式問題で長文読解・本番の時間配分を訓練してください。</p><p>Ver 1.0 / 2026年11月23日。2026年度後期の制度に合わせて構成しました。2027年度以降の制度は別途確認が必要です。</p></div></div>`}
 
let pastActive='2025a';
const PA='アイウエ';
function past(){
 let p=PAST.find(x=>x.id===pastActive)||PAST[0];
 let answers=(S.pastAnswers||{})[p.id]||{};let result=(S.pastResults||{})[p.id];
 let n=Object.keys(answers).length;let elapsed=S.pastTimes?.[p.id]?Math.floor((Date.now()-S.pastTimes[p.id])/60000):0;
 let bRec=(S.pastB||{})[p.id]||{};
 return `<div class="page"><div class="eyebrow">OFFICIAL IPA / PAST EXAM</div><h1>公式過去問・自動採点</h1><p class="sub">IPA公開の実際の科目A（旧午前）問題をPDFで開いて解き、この画面で解答を記録します。解答例に基づき80問を自動採点。科目B（旧午後）も同じ年度の公式問題で演習できます。</p>
 <div class="card"><h3>過去問の選択</h3><div class="filter">${PAST.map(x=>{let r=S.pastResults?.[x.id];return `<button class="action ${x.id===p.id?'':'secondary'}" data-past-exam="${x.id}">${E(x.title)} ${r?`（${r.score}/80）`:''}</button>`}).join('')}</div><div class="tip">最新4回分：合計320問。本番同様に、150分で80問を解いてください。旧試験の問題を使っていますが、2026年度後期の出題範囲・形式は従来と同じです。</div></div>
 <div class="card"><div class="eyebrow">${E(p.title)} · 科目A</div><h3>問題冊子と解答シート</h3><div class="buttons"><a class="action" target="_blank" rel="noopener noreferrer" href="${E(p.question)}">IPA問題冊子（PDF）を開く</a>${result?`<a class="action secondary" target="_blank" rel="noopener noreferrer" href="${E(p.answer)}">公式解答例を開く</a>`:''}</div><p class="muted small">回答済み ${n}/80問 · 開始から約${elapsed}分。${result?`前回採点 ${result.score}/80（${Math.round(100*result.score/80)}%）`:'採点前は正解を非表示にします。'}ブラウザ上の操作記録は端末内に保存されます。</p>
 <div class="pastgrid">${Array.from({length:80},(_,i)=>{let a=answers[i+1],correct=p.answers[i],flag=result&&a!==correct;return `<div class="pastcell ${flag?'incorrect':''}"><b>${String(i+1).padStart(2,'0')}</b><div class="pastopts">${Array.from(PA,(ch,j)=>`<label class="pastchoice ${a===ch?'selected':''}"><input type="radio" name="ap_${p.id}_${i}" value="${ch}" data-past-answer="${i+1}" ${a===ch?'checked':''}>${ch}</label>`).join('')}</div>${result?`<small>正解：${correct} ${flag?'×':'✓'}</small>`:''}</div>`}).join('')}</div>
 <div class="buttons"><button class="action" data-past-grade>採点・結果を保存</button><button class="action secondary" data-past-clear>この年度の解答を消去</button></div>${result?pastResultView(p,answers,result):''}</div>
 <h2>同じ年度の科目B（記述）に挑戦</h2><div class="card"><p>公式の長文ケースを読んで、本番どおり<strong>5問（必須の情報セキュリティ＋選択4問）</strong>を150分で解きます。記述の自動採点は難しいため、公式解答例・採点講評で照合し、自己評価を記録します。</p><div class="buttons"><a href="${E(p.bQuestion)}" target="_blank" rel="noopener noreferrer" class="action">科目B 公式問題冊子（PDF）</a><a href="${E(p.bAnswer)}" target="_blank" rel="noopener noreferrer" class="action secondary">公式解答例</a></div><div class="filter" style="margin-top:16px"><label class="small">自己採点の目安（0〜100点）<input id="bPastScore" class="ctrl" type="number" min="0" max="100" placeholder="例：65" value="${E(bRec.score??'')}"></label><label class="small">実施日<input class="ctrl" id="bPastDate" type="date" value="${E(bRec.date??'')}"></label></div><textarea class="answerbox" id="bPastMemo" placeholder="選択した問番号、誤答理由、今後の改善点">${E(bRec.memo??'')}</textarea><div class="buttons"><button class="action" data-past-bsave>科目Bの振り返りを保存</button></div><p class="muted small">自己採点は公式得点とは異なり、採点基準の一部は非公開です。単なる正答例との一致だけで正確な点数は出せません。</p></div>
 <h2>さらに解く（追加の公式問題）</h2><div class="card"><p>4回分を終えたら、2023年度以前の公式問題にも進みます。以下は公式の問題・解答一覧へのリンクで、この画面ではまだ自動採点できません。</p><div class="buttons"><a class="action secondary" target="_blank" rel="noopener noreferrer" href="https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html">2023年度（春・秋）</a><a class="action secondary" target="_blank" rel="noopener noreferrer" href="https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html">2022年度（春・秋）</a><a class="action secondary" target="_blank" rel="noopener noreferrer" href="https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html">2021年度</a></div></div></div>`;
}
function pastResultView(p,ans,result){let scores=[0,0,0],counts=[0,0,0];Array.from(p.answers).forEach((c,i)=>{let g=i<50?0:i<60?1:2;counts[g]++;if(ans[i+1]===c)scores[g]++});return `<div class="rubric"><h3>採点結果：${result.score}/80問 · ${Math.round(100*result.score/80)}%</h3><p>テクノロジ系 ${scores[0]}/50、マネジメント系 ${scores[1]}/10、ストラテジ系 ${scores[2]}/20</p><p class="small">間違えた問題：${Array.from({length:80},(_,i)=>ans[i+1]===p.answers[i]?null:i+1).filter(Boolean).join('、')||'なし'}。正答率70％以上を安定させることを目標に復習します（目標値であり公式の合格基準とは別）。</p></div>`}
function selectPast(id){pastActive=id;navigate('past')}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-past-exam],[data-past-grade],[data-past-clear],[data-past-bsave]');if(!t)return;
 if(t.dataset.pastExam){selectPast(t.dataset.pastExam);return}
 const p=PAST.find(x=>x.id===pastActive),a=(S.pastAnswers||{})[p.id]||{};
 if(t.hasAttribute('data-past-grade')){let n=Object.keys(a).length;if(n<80&&!confirm(`未回答が${80-n}問あります。採点しますか？`))return;let score=Array.from(p.answers).filter((c,i)=>a[i+1]===c).length;S.pastResults[p.id]={score,date:new Date().toISOString(),answered:n};save();render();return}
 if(t.hasAttribute('data-past-clear')){if(!confirm('この年度の選択肢と採点結果を消去しますか？'))return;delete S.pastAnswers[p.id];delete S.pastResults[p.id];delete S.pastTimes[p.id];save();render();return}
 if(t.hasAttribute('data-past-bsave')){let v=$('#bPastScore').value,score=v===''?null:Number(v);if(score!==null&&(!Number.isFinite(score)||score<0||score>100)){alert('0〜100で入力してください。');return}S.pastB[p.id]={score,date:$('#bPastDate').value,memo:$('#bPastMemo').value};save();render();return}
});
document.addEventListener('change',e=>{if(!e.target.matches('[data-past-answer]'))return;let p=PAST.find(x=>x.id===pastActive),n=e.target.dataset.pastAnswer;S.pastAnswers[p.id]??={};S.pastAnswers[p.id][n]=e.target.value;S.pastTimes[p.id]??=Date.now();delete S.pastResults[p.id];save();render()});

function render(){nav();let html='';switch(view){case'home':html=home();break;case'manage':html=management();break;case'chapters':html=chapters();break;case'chapter':html=chapter();break;case'quiz':html=qSelect();break;case'mock':html=mock();break;case'past':html=past();break;case'flash':html=flash();break;case'cases':html=cases();break;case'case':html=caseDetail();break;case'taking':html=taking();break;case'result':html=result();break;case'review':html=review();break;case'settings':html=settings();break;default:html=home()}APP.innerHTML=html+'<footer>AP Study Lab 2027 · 非公式・オリジナル学習教材 · IPAの公式教材ではありません。</footer>';let sr=$('#chapter-search');if(sr)sr.addEventListener('input',e=>$('#chap-grid').innerHTML=chapterCards(e.target.value));if(view==='taking'&&quiz.type==='mock')updateTimer()}
function buildCustom(ch='all',type='mix',count='10'){let qs=D.questions.filter(q=>(ch==='all'||q.chapter===+ch)&&(type==='mix'||q.kind===type));let n=count==='all'?qs.length:Number(count);start('practice',shuffled(qs).slice(0,n).map(q=>q.id))}
function startFromButton(t){if(t==='wrong'){let w=Object.keys(S.wrong).filter(k=>S.wrong[k]&&qById[k]);start('practice',shuffled(w));return}if(t==='mock'){let applied=shuffled(D.questions.filter(q=>q.kind==='applied'));let terms=shuffled(D.questions.filter(q=>q.kind==='term'));let ids=shuffled([...applied,...terms.slice(0,Math.max(0,80-applied.length))]).slice(0,80).map(q=>q.id);start('mock',ids);return}buildCustom($('#qchapter')?.value||'all',$('#qtype')?.value||'mix',$('#qcount')?.value||'10')}
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav],[data-ch],[data-drill],[data-complete],[data-start],[data-answer],[data-q-prev],[data-q-next],[data-q-review],[data-flip],[data-flash-next],[data-flash-prev],[data-case],[data-reveal],[data-self],[data-export],[data-reset]');if(!t)return;if(t.hasAttribute('data-nav'))return navigate(t.dataset.nav);if(t.hasAttribute('data-ch'))return navigate('chapter',{chapter:+t.dataset.ch});if(t.hasAttribute('data-drill'))return buildCustom(t.dataset.drill,'mix','all');if(t.hasAttribute('data-complete')){S.seen[t.dataset.complete]=!S.seen[t.dataset.complete];save();render();return}if(t.hasAttribute('data-start'))return startFromButton(t.dataset.start);if(t.hasAttribute('data-answer')){let q=qById[quiz.ids[quiz.index]],a=Number(t.dataset.answer);if(quiz.type!=='mock'&&quiz.answers[q.id]!==undefined)return;if(quiz.type==='mock'&&quiz.finished)return;let first=quiz.answers[q.id]===undefined;quiz.answers[q.id]=a;if(first&&quiz.type!=='mock')record(q.id,a===q.correct);render();return}if(t.hasAttribute('data-q-prev')){quiz.index=Math.max(0,quiz.index-1);render();return}if(t.hasAttribute('data-q-next')){if(quiz.index===quiz.ids.length-1){if(quiz.type==='mock'&&Object.keys(quiz.answers).length<quiz.ids.length){if(!confirm('未回答の問題があります。採点しますか？'))return}return finishQuiz()}quiz.index++;render();return}if(t.hasAttribute('data-q-review')){let id=t.dataset.qReview;if(S.wrong[id])delete S.wrong[id];else S.wrong[id]=true;save();render();return}if(t.hasAttribute('data-flip')){flashOpen=!flashOpen;render();return}if(t.hasAttribute('data-flash-next')){flashIndex++;flashOpen=false;render();return}if(t.hasAttribute('data-flash-prev')){flashIndex--;flashOpen=false;render();return}if(t.hasAttribute('data-case'))return navigate('case',{caseIndex:+t.dataset.case});if(t.hasAttribute('data-reveal')){let id=t.dataset.reveal;revealed[id]=!revealed[id];render();return}if(t.hasAttribute('data-self')){let [id,val]=t.dataset.self.split(':');S.self[id]=val;save();render();return}if(t.hasAttribute('data-export')){let blob=new Blob([JSON.stringify({app:'ap-study-2027',version:1,data:S},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ap_study_progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}if(t.hasAttribute('data-reset')){if(confirm('学習記録をすべて削除しますか？')){S=EMPTY();save();navigate('home')}return}});
document.addEventListener('input',e=>{if(e.target.id==='daily-note'){S.dailyNotes??={};S.dailyNotes[dayKey()]=e.target.value;save()}if(e.target.matches('[data-case-input]')){S.notes[e.target.dataset.caseInput]=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.id==='daily-target'){let n=Number(e.target.value);if(!Number.isFinite(n)||n<1||n>200){alert('1〜200問で設定してください');render();return}S.dailyTarget=Math.round(n);save();render()}if(e.target.id==='flash-filter'){flashFilter=e.target.value;flashIndex=0;flashOpen=false;render()}if(e.target.id==='import-file'){let f=e.target.files?.[0];if(!f)return;f.text().then(t=>{let v=JSON.parse(t);if(v.app!=='ap-study-2027'||!v.data)throw Error('形式が違います');if(!confirm('現在の記録を読み込んだ記録で置き換えますか？'))return;S={...EMPTY(),...v.data};save();navigate('home')}).catch(e=>alert('読込みに失敗：'+e.message))}});
function updateTimer(){let el=$('#timer');if(!el||view!=='taking'||quiz.type!=='mock'||quiz.finished)return;let sec=Math.max(0,9000-Math.floor((Date.now()-quiz.started)/1000));el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(sec===0)finishQuiz()}
setInterval(updateTimer,1000);
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
