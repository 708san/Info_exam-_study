-09-Y07","chapter":9,"kind":"applied","q":"生データを保存先に格納してから変換する処理方式は？","options":["ETL","2相ロッキング","RAID1","ELT"],"correct":3,"explain":"ELTはExtract・Load・Transformの順で処理する。"}],"deepIntro":"データベースの問題は「何を保存するか」「矛盾をどう防ぐか」「どう高速に取り出すか」に分解する。科目BではSQLだけでなく、設計理由を文章で説明する力が必要。","deep":[{"id":"09-1","title":"関係モデル・主キー・外部キー・正規化","explain":"\u003cp>関係データベース（RDB: Relational Database）は表（関係）の行でデータを表す。主キーは行を一意に識別し、候補キーは一意性と最小性を満たす属性集合。外部キーは別表の候補キーなどを参照し、参照整合性を維持するために使う。NULL（値が不明・存在しないことなどを示すマーカー）は0や空文字とは異なり、比較演算でUNKNOWNを生む場合がある。\u003c/p>\n\u003cp>正規化は更新時の矛盾を防ぐ設計手法。第1正規形は各セルが原子的な値、第2正規形は候補キーの一部だけに依存する非キー属性を除く、第3正規形は非キー属性を経由した推移的関数従属を除く（厳密には各正規形の判定条件を確認）。例えば「注文明細(注文ID,商品ID,商品名,単価,数量)」で(注文ID,商品ID)が主キーなら、商品名と単価が商品IDだけに依存する設計では商品変更時に多数行を更新する必要があるため、商品表に分割する。\u003c/p>\n","worked":"\u003cp>社員(社員ID,部署ID,部署名)で社員ID→部署ID、部署ID→部署名と成り立つなら、社員ID→部署名は推移的依存。部署(部署ID,部署名)と社員(社員ID,部署ID)に分割すれば部署名の変更箇所を減らせる。\u003c/p>\n","prompt":"主キーが「注文ID＋商品ID」である明細表の「商品名」は、主キー全体に依存するか。","answer":"\u003cp>通常は商品IDだけで決まるため部分関数従属であり、商品表への分割を検討する。\u003c/p>\n","beginner":{"scenario":"注文行に顧客名が重複すると改名で全行修正が必要。顧客表に名前を置き、注文表には顧客IDだけを持たせる。","trap":"正規化は重複・矛盾を減らす。非正規化は整合性を別に管理する必要がある。","quizId":"U-09-1","lab":{"title":"正規化を実際の表で考える","problem":"注文明細（注文ID、商品ID、顧客名、商品名、数量）を設計する。複合主キーは注文IDと商品ID。注文ごとに顧客は一人、商品IDごとに商品名は一つ。","steps":["主キー全体で数量を決める。商品名は商品IDだけで決まり、顧客名は注文IDだけで決まるため部分関数従属がある。","注文表（注文ID、顧客ID）、商品表（商品ID、商品名）、顧客表（顧客ID、顧客名）に分離する。","明細表（注文ID、商品ID、数量）は複合主キーを持ち、注文・商品を外部キーで参照する。","顧客名の修正は顧客表1か所で済む。注文・商品との関連を結合で復元できる。"],"answer":"注文・商品・顧客・明細の4表に整理","check":"顧客IDを追加できる設計を仮定。実際には関数従属と業務ルールを確かめて分割する。"}},"textbook":[{"heading":"なぜ表を分けるのか","body":"注文表に顧客名・住所・商品名を全て記録すると、同じ顧客の住所が何度も現れます。変更時に一部だけ修正すると矛盾が生じます。関係データベースでは情報を行（レコード）と列（属性）からなる表として整理し、識別子で表を関連付けます。主キーは各行を一意に識別し、候補キーは主キー候補となる最小の属性集合です。外部キーは別表等のキーを参照し、存在しない顧客IDを注文に登録するなどの矛盾を防ぐ参照整合性を設定できます。"},{"heading":"関数従属を理解する","body":"顧客IDが決まれば顧客名が一つに決まるという関係を顧客ID→顧客名と書きます。これが関数従属です。主キーが注文IDと商品IDの組なら、商品名は商品IDだけで決まるので部分関数従属です。注文ID→顧客ID→顧客住所のように間接的に決まる関係は推移的従属です。"},{"heading":"正規化を段階的に進める","body":"第1正規形は各セルに繰返しの集合などを持たず原子的な値を置く形。第2正規形は候補キーの一部だけで非キー属性が決まる部分関数従属を除きます。第3正規形では典型的には非キー属性を経由する推移的従属を除きます（厳密な定義には候補キー等も考慮）。注文、商品、顧客、注文明細に分けると更新の重複を減らせます。ER図（実体関連図）は顧客1人が注文を複数持つなど実体間の関係を表します。"}],"walkthrough":{"heading":"第1・第2・第3正規形を順に作る","body":"一つのセルに「鉛筆,消しゴム」と複数商品を入れる注文表では、商品ごとの数量や検索が困難です。まず商品ごとに行を作り第1正規形へ近づけます。次に注文番号と商品番号が複合キーなら、注文日や顧客番号は注文番号だけ、商品名や標準価格は商品番号だけで決まります。これらを注文表と商品表へ分けることで部分関数従属を除きます。注文表に顧客番号と顧客住所が残っていれば、注文番号→顧客番号→住所という推移的従属があるので顧客表へ分離します。販売時の実際の単価を保存するなら、後から標準価格が変わっても履歴が変わらないよう明細に取引単価を保持することがあります。正規化は機械的に列を消すのではなく、何が何を決定するかという業務ルールに基づきます。","cols":["表","主キー","属性・外部キー"],"rows":[["顧客","顧客ID","氏名、住所"],["注文","注文ID","顧客ID、注文日"],["商品","商品ID","商品名、標準価格"],["明細","注文ID＋商品ID","数量、取引単価"]]}},{"id":"09-2","title":"SQL・結合・集計・NULL","explain":"\u003cp>SQL（Structured Query Language：構造化問合せ言語）はSELECTで行を取り出し、FROMで表、WHEREで行の絞り込み、GROUP BYでグループ化、HAVINGで集計後の条件、ORDER BYで並び替えを指定する。処理の概念的な順序はFROM/結合→WHERE→GROUP BY→HAVING→SELECT→ORDER BY。列別名をWHEREでそのまま使えるとは限らない。\u003c/p>\n\u003cp>INNER JOINは一致行のみ、LEFT OUTER JOINは左表の行をすべて残す。\u003ccode>WHERE 右表.列 = 'X'\u003c/code> を外部結合の後に置くと、右表が存在しないNULL行を取り除き、実質的に内部結合のような結果になることがある。COUNT(*)は行数、COUNT(列)はNULLでない値の数。\u003ccode>列 = NULL\u003c/code>ではなく\u003ccode>IS NULL\u003c/code>で判定する。\u003c/p>\n","worked":"\u003cp>受注がない顧客も含め顧客ごとの件数を数えるには \u003ccode>SELECT c.id, COUNT(o.id) FROM customer c LEFT JOIN orders o ON c.id=o.customer_id GROUP BY c.id;\u003c/code>。\u003ccode>COUNT(*)\u003c/code>だと受注ゼロの顧客も外部結合後に1行残るため1と数え得る。\u003ccode>COUNT(o.id)\u003c/code>が重要。\u003c/p>\n","prompt":"`WHERE COUNT(*) >= 2` と `HAVING COUNT(*) >= 2` のどちらが集計グループを絞るか。","answer":"\u003cp>HAVING。WHEREはグループ化前の行を選別する。\u003c/p>\n","beginner":{"scenario":"売上表から部門AだけならWHERE 部門='A'。部門別合計はGROUP BY 部門とSUM(金額)、合計100以上はHAVING SUM(金額)>=100。","trap":"NULLは0や空文字と異なる。IS NULLで判定する。","quizId":"U-09-2","lab":{"title":"SQLの結合・集計を結果から理解する","problem":"顧客表 C(id, name) は(1,佐藤),(2,田中),(3,鈴木)。注文表 O(cid, amount) は(1,100),(1,200),(2,50)。顧客別売上を注文ゼロも含めて出す。","steps":["C LEFT JOIN O ON C.id = O.cid により佐藤2行、田中1行、鈴木1行（注文列NULL）ができる。","GROUP BY C.id,C.name で顧客別グループを作る。","SUM(O.amount)は佐藤300、田中50、鈴木NULL。","COALESCE(SUM(O.amount),0)で鈴木を0にする。","SQL例：SELECT C.id,C.name,COALESCE(SUM(O.amount),0) FROM C LEFT JOIN O ON C.id=O.cid GROUP BY C.id,C.name。"],"answer":"佐藤300、田中50、鈴木0","check":"INNER JOINなら鈴木は消える。NULLと0は区別し、必要時に変換する。"}},"textbook":[{"heading":"SQLは何を指示する言語か","body":"SQL（Structured Query Language：構造化問い合わせ言語）は必要なデータを宣言的に指定します。SELECTは取得する列、FROMは表、WHEREは抽出条件です。INSERTは追加、UPDATEは更新、DELETEは削除、CREATE TABLEなどは表の定義です。操作の具体的な実行方法は通常DBMS（データベース管理システム）が決めます。"},{"heading":"表を結合する","body":"顧客表(id,name)と注文表(customer_id,amount)があるとき、INNER JOINでidが一致する行を結合します。注文のない顧客は消えます。LEFT JOINでは左表の顧客を全て残し、対応する注文がなければ右表の列はNULLになります。1対多の結合では元の顧客1行が複数行になるので、集計時の二重計上に注意します。"},{"heading":"集計とNULL","body":"論理的な処理順は概ねFROM・JOIN→WHERE→GROUP BY→HAVING→SELECT→ORDER BYです。GROUP BYは同じ値で行をまとめ、SUMやCOUNTなどで集計します。WHEREは集計前、HAVINGは集計後の条件。NULLは未知・欠損等を示す特別な値で、=NULLではなくIS NULLで判定します。COUNT(*)は行数、COUNT(列)はNULLでない値の数です。SUMはNULLを除き、対象が全てNULLならNULLを返すため必要に応じCOALESCEで0にします。"}],"walkthrough":{"heading":"結合後の表を一行ずつ見る","body":"顧客表には1:佐藤、2:田中、3:鈴木の3人があり、注文表には顧客1の100円、200円、顧客2の50円があります。LEFT JOINの結合後には下の4行が作られます。GROUP BY 顧客IDで顧客1の2行を同じグループとしSUMで300円にします。顧客3の注文列はNULLで、COUNT(*)なら1行と数えますがCOUNT(金額)なら0件です。顧客3も売上0と表示したいときはCOALESCE(SUM(金額),0)を用います。またLEFT JOIN後のWHERE 注文.金額>0はNULL行を除くため、未注文顧客を残す目的と矛盾し得ます。条件を結合のON句へ置く場合との違いも、結合結果を紙に書いて確かめます。","cols":["顧客ID","氏名","注文金額"],"rows":[["1","佐藤","100"],["1","佐藤","200"],["2","田中","50"],["3","鈴木","NULL"]]}},{"id":"09-3","title":"トランザクション・ACID・隔離レベル","explain":"\u003cp>トランザクションは複数操作を1つの論理的単位として扱う。ACIDはAtomicity（原子性：全部実施か全部取消し）、Consistency（一貫性：制約維持）、Isolation（隔離性：同時実行の影響を管理）、Durability（永続性：確定内容が保持される）。銀行口座からAを減額してBを増額する2操作は、片方だけ確定してはならない。\u003c/p>\n\u003cp>並行実行にはダーティリード（未確定変更を読む）、反復不能読取り（同じ行を再読したら変わる）、ファントムリード（条件に合う行集合が変化）などの異常がある。隔離レベルやMVCC（Multi-Version Concurrency Control：多版型同時実行制御）は製品ごとに具体的動作が異なる。ロックの取り方、デッドロック検出、タイムアウト、再試行も設計対象。\u003c/p>\n","worked":"\u003cp>T1が商品の在庫10を8に更新したが未コミット。T2が8を読み、T1がロールバックすると、T2は確定していない値を読んだ「ダーティリード」。Read Committedの標準的な目標はこれを防ぐこと。\u003c/p>\n","prompt":"ACIDのIsolationを満たせば同時実行で常に最高速になるか。","answer":"\u003cp>そうではない。強い隔離は競合や待ち時間を増やすことがある。\u003c/p>\n","beginner":{"scenario":"Aから100円引きBに入金する途中で止まると資金が消える。両方成功でコミット、失敗はロールバックする。","trap":"原子性だけでは競合を防げない。分離性・ロックなども必要。","quizId":"U-09-3","lab":{"title":"同時更新で何が壊れるか","problem":"在庫1個の商品をAとBが同時購入。両者が在庫1を読み、在庫0を書き、注文を登録する。問題と対策を考える。","steps":["AとBが別々に在庫1を読んでいるため両者とも購入可能と判断。","Aが在庫0を書き注文確定。Bも古い値を根拠に在庫0を書き注文確定。注文は2件だが商品は1個。","在庫をロックして在庫数を確認し、条件を満たす場合のみ減算・注文登録を同一取引にする。","あるいは在庫が1以上という条件付きの原子的更新を使い、成功件数を確認する。"],"answer":"在庫確認・引当て・注文を競合に耐える一連の処理にする","check":"COMMITするだけでは安全にならない。分離性と更新の条件が必要。"}},"textbook":[{"heading":"トランザクションの必要性","body":"送金で口座Aから100円引き、口座Bへ100円足すとき、途中で停止して引落しだけ成功すれば不整合になります。一連の処理をトランザクション（取引処理）として扱い、成功時はCOMMITで確定し、失敗時はROLLBACKで取り消します。"},{"heading":"ACIDの意味","body":"原子性（Atomicity）は一連の処理が全て成立するか取り消されること、整合性（Consistency）は定めた制約を守ること、分離性（Isolation）は並行取引が互いに不適切な影響を与えないこと、耐久性（Durability）は確定結果が障害後も保持されることです。"},{"heading":"並行実行と隔離","body":"未確定値を読むダーティリード、同一行を再読すると確定値が変わるノンリピータブルリード、条件検索を再実行すると該当行集合が変わるファントムリードがあります。隔離レベルは許される現象を制御し、実装によってロックやMVCC（多版型同時実行制御）などを使います。ロックの循環待ちでデッドロックが発生するため、取得順や再試行の設計が重要です。"},{"heading":"ログと復旧","body":"更新ログを記録し、確定前の更新を取り消すUNDO、確定済み更新を再適用するREDOを利用する方式があります。書込み前ログ（WAL）はデータページより先に必要なログを永続化します。バックアップとログの保全は耐久性・復旧の設計にも関係します。"}],"walkthrough":{"heading":"隔離レベルを現象と結び付ける","body":"取引Aが商品の価格を100から120へ変更してまだ確定していないとき、Bが120を読むとダーティリードです。その後Aが取消せばBは実在しなかった確定値に基づいて処理したことになります。一方、Bが100を読み、Aが120に変更してコミットした後にBが同じ行を読み120になるのがノンリピータブルリードです。Bが条件検索で10行取得し、Aが条件に合う行を挿入して確定、Bの再検索で11行になるのがファントムリードです。SQL標準の概念的な隔離レベルは下表の通りですが、実際のデータベースではより強い保証や異なる実装があり得ます。","cols":["隔離レベル","ダーティリード","再読時の値変化","ファントム"],"rows":[["READ UNCOMMITTED","許容","許容","許容"],["READ COMMITTED","防止","許容","許容"],["REPEATABLE READ","防止","防止","許容"],["SERIALIZABLE","防止","防止","防止"]]}},{"id":"09-4","title":"索引・実行計画・性能設計","explain":"\u003cp>索引（インデックス）は検索条件に合う行へ効率よく到達する補助構造。B+木は範囲検索・整列に適し、ハッシュは等価検索に適することが多い。索引は読み取りを速くする一方、挿入・更新・削除時に維持コストと容量を要する。条件列の選択性、複合索引の列順、結合キー、統計情報を調べる。\u003c/p>\n\u003cp>\u003ccode>WHERE YEAR(order_date)=2025\u003c/code>のように索引列へ関数を適用すると通常の範囲索引が使いにくくなることがある。\u003ccode>order_date &gt;= '2025-01-01' AND order_date &lt; '2026-01-01'\u003c/code>の範囲条件に変えると使える可能性がある。ただし性能は製品や索引構造・統計情報に依存するので、EXPLAINで実行計画と実測を確認する。\u003c/p>\n","worked":"\u003cp>100万行中、customer_id=123が10行だけなら当該列の索引は有利なことが多い。性別のように値の種類が少なく大半が該当する列では、索引より全表走査が有利になる場合もある。\u003c/p>\n","prompt":"すべての列に索引を付けるのが最善か。","answer":"\u003cp>違う。更新負荷、容量、選択性、検索パターンを総合して決める。\u003c/p>\n","beginner":{"scenario":"100万件の商品からID=123を探すとき索引で絞れる。一方、半数以上を取得する場合は全表走査の方が速いこともある。","trap":"索引は検索を助けるが更新時にも維持コストがかかる。","quizId":"U-09-4"},"textbook":[{"heading":"索引が検索を速める理由","body":"本の索引は全ページを読む代わりに語句から位置を探せます。データベースの索引も検索キーと行への参照を管理します。B木系索引はキー順の木構造で検索範囲を絞り、等値検索や範囲検索に使えます。ハッシュ索引はハッシュ値で格納候補を探し、主に等値検索に向きます。"},{"heading":"複合索引と実行計画","body":"(顧客ID,注文日)の順で索引を作ると、特定顧客の注文日範囲を検索しやすくなります。顧客IDを指定せず注文日だけを検索すると一般にこの索引の先頭列を活用しにくい場合があります。DBMSは統計情報を利用し全表走査、索引走査、結合方式などを選びます。EXPLAIN等で実行計画を確認できます。"},{"heading":"コストの比較","body":"取得件数が非常に多い場合、索引で多数の場所へアクセスするより全表走査が効率的なことがあります。索引は記憶容量を消費し、挿入・更新・削除の際に維持処理が必要です。検索速度だけでなく実際の負荷を測定して選択します。"}]},{"id":"09-5","title":"障害回復・レプリケーション・NoSQL","explain":"\u003cp>障害復旧ではチェックポイント、更新ログ、UNDO（未確定変更の取消し）、REDO（確定変更の再適用）の役割を区別する。ログ先行書込み（WAL：Write-Ahead Logging）はデータページの更新より先に回復に必要なログを永続化する設計原則。物理バックアップと論理バックアップ、フル/差分/増分の特徴を理解し、復元手順を試す。\u003c/p>\n\u003cp>レプリケーションは複数拠点への複製によって可用性や読み取り性能を高めるが、非同期方式では最新更新を失うリスクがある。NoSQL（Not Only SQL：非関係型を中心とするDB群）はキー値・文書・列指向・グラフ等のモデルがあり、要件に合うデータ構造を選ぶ。CAP定理はネットワーク分断時の一貫性と可用性の選択に関する制約であり、「3要素から常に2つだけ選ぶ」と単純化しない。\u003c/p>\n","worked":"\u003cp>コミット直後に主DBが故障し、非同期の複製先へまだ更新が伝搬していなければ、切替時に直近の更新が消える可能性がある。RPO=0を求めるなら書込み確定の条件まで設計し直す必要がある。\u003c/p>\n","prompt":"複製があるからバックアップは不要か。","answer":"\u003cp>不要にはならない。誤更新・論理削除も複製され得る。\u003c/p>\n","beginner":{"scenario":"昨日のバックアップを戻し、今日の確定済み更新ログを適用すれば障害直前へ近づける。未確定の変更は取り消す。","trap":"複製は誤削除も複製し得るのでバックアップと別。","quizId":"U-09-5"},"textbook":[{"heading":"障害の種類を分ける","body":"処理の途中失敗、OSやDBの停止、記憶装置故障、拠点災害は回復方法が異なります。トランザクションの取消し、ログによる回復、バックアップ復元、待機系への切替を組み合わせます。ロールバックは変更の取消し、ロールフォワードはバックアップ等にログを適用して新しい時点へ進めることです。"},{"heading":"レプリケーションの特徴","body":"データを別ノードへ複製すると読取負荷の分散や障害時の切替に利用できます。同期複製は相手への反映を確認して処理を確定する方式で、非同期複製では遅延中の更新が障害で失われる可能性があります。複製は誤操作も伝えることがあるので過去時点のバックアップと別です。"},{"heading":"NoSQLの選択","body":"NoSQLは関係表以外のデータモデルなどを扱うデータベース群です。キーと値、JSON等の文書、グラフ、列指向などの方式があり、データの形状・検索・整合性・規模に合わせます。SQLを使えないことやトランザクションがないことを一律に意味しません。"}]},{"id":"09-X01","title":"関係代数とデータベースの方式","explain":"\u003cp>関係データベースでは選択は条件に合う行、射影は必要な列、結合は共通項目などで関係を組み合わせる演算である。和・差・積集合や直積も基本操作。SQL（構造化問い合わせ言語）は関係代数に基づく操作を記述する。ER図（実体関連図）は実体と関係を可視化する。\u003c/p>\u003cp>階層型は木、ネットワーク型は複雑な関連、関係型は表、オブジェクト型はオブジェクトでデータを表現する。NoSQLはキーバリュー、文書、列指向、グラフなどを含む。B木系の索引は範囲検索に適する一方、ハッシュ索引は等値検索に向く。\u003c/p>","worked":"\u003cp>社員表から営業部の社員名だけを求める場合、部門による選択の後に社員名への射影を行う。\u003c/p>","prompt":"関係表から指定列だけ取り出す演算は？","answer":"\u003cp>射影。\u003c/p>","beginner":{"scenario":"社員表から営業部の行を抽出して氏名列だけ取得する。前者が選択、後者が射影。","trap":"日常語の選択と関係代数の選択を混同しない。","quizId":"U-09-X01"},"textbook":[{"heading":"関係代数はSQLの土台","body":"表の一部を取り出す基本操作を考えます。選択は条件に合う行を取り出し、射影は指定した列を取り出します。結合は関連する行を組み合わせ、直積は全ての組合せです。例えば社員表100行と部門表5行の直積は500行になりますが、部門IDの一致条件を加えると社員に対応する部門だけに絞れます。"},{"heading":"集合演算と重複","body":"和集合は双方の要素、積集合は共通要素、差集合は一方にだけある要素です。純粋な関係モデルは集合として重複を扱いませんが、SQLは通常重複を保持する場合があります。SELECT DISTINCTは取得結果の重複を除き、UNIONは通常重複除去、UNION ALLは重複を保持します。"},{"heading":"データモデルの比較","body":"階層型は木構造、ネットワーク型は多様な関連、関係型は表、オブジェクト型はデータと操作をまとめた対象として表現します。グラフ型データベースはノードと関係の探索に適します。表を選ぶ際は構造だけでなく検索・更新の必要性を考えます。"}]},{"id":"09-X02","title":"データウェアハウス・分散データベース","explain":"\u003cp>データウェアハウスは分析目的で履歴を統合する基盤。ETL（抽出・変換・ロード）で異なる元データを整える。OLTP（オンライン取引処理）は日常業務の更新、OLAP（オンライン分析処理）は多次元集計。データマートは特定部門向けの分析データ。スタースキーマは事実表と次元表を組み合わせる。\u003c/p>\u003cp>分散データベースは複数ノードにデータを分散し、シャーディングで異なる部分を分割、レプリケーションで複製する。2相コミットは参加者の準備確認後に確定を指示して分散取引の整合性を保つ。可用性・整合性・分断耐性の関係を示すCAP定理ではネットワーク分断中に強い整合性と可用性を同時保証できない。\u003c/p>","worked":"\u003cp>日々の売上登録はOLTP、月・地域・商品別に過去の売上を集計するのはOLAP。\u003c/p>","prompt":"複数サーバに顧客IDの範囲ごとにデータを分割する方式は？","answer":"\u003cp>シャーディング。\u003c/p>","beginner":{"scenario":"販売明細を店舗から集め、商品コードと日付形式を統一して分析基盤へ入れる。地域×月×商品別に売上集計できる。","trap":"OLTPは取引、OLAPは分析。複製と分割も別。","quizId":"U-09-X02"},"textbook":[{"heading":"日常業務と分析を分ける","body":"注文受付のように少数行を頻繁に更新する処理がOLTP（オンライン取引処理）です。月別・地域別・商品別売上を大量に集計するOLAP（オンライン分析処理）は目的が異なります。業務DBから履歴を統合したデータウェアハウスを作ることで分析負荷を分離できます。ETL（抽出・変換・格納）はデータを収集してコードや日付形式を統一し保存します。"},{"heading":"分析用の表設計","body":"スタースキーマでは売上金額・数量など測定値を持つ事実表と、商品・地域・日付など分析軸を持つ次元表を組み合わせます。データマートは特定部門などに用途を絞った分析データです。"},{"heading":"分散データの整合性","body":"シャーディングは顧客ID等でデータを複数ノードへ分割し、レプリケーションは複製します。分散取引の2相コミットは各参加者に確定可能か確認し、全員が準備できれば確定を指示します。調整役の故障等で待ちが生じることがあります。CAP定理はネットワーク分断中に強い整合性と可用性を同時に保証できないことを示します。用途によって一時的不整合の許容などを設計します。"}]},{"id":"09-Y01","title":"3層スキーマとデータベース方式の選択","explain":"\u003cp>外部スキーマは利用者・プログラムから見たデータの定義、概念スキーマは全体の論理構造、内部スキーマは物理的な保存構造。営業担当には顧客名と注文、経理には請求情報だけを見せても、全体では共通の顧客表を使える。索引やファイル配置を変えてもアプリ側の見え方を維持できるのが物理的データ独立性。概念構造を変更しても外部スキーマを保つ考え方が論理的データ独立性。\u003c/p>","worked":"\u003cp>\u003cb>物理ディスク上の索引を追加しても検索プログラムのSQLを変更しなくてよい。\u003c/b>\u003c/p>\u003cp>物理的データ独立性の例。内部スキーマの変更を上位層から隠す。\u003c/p>","prompt":"営業部門に顧客の住所を見せず氏名だけを提供するスキーマはどれか。","answer":"\u003cp>外部スキーマ。利用者ごとの見え方を定義する。\u003c/p>","textbook":[{"heading":"データの見え方と保存を分ける","body":"外部スキーマは利用者・プログラムから見たデータの定義、概念スキーマは全体の論理構造、内部スキーマは物理的な保存構造。営業担当には顧客名と注文、経理には請求情報だけを見せても、全体では共通の顧客表を使える。索引やファイル配置を変えてもアプリ側の見え方を維持できるのが物理的データ独立性。概念構造を変更しても外部スキーマを保つ考え方が論理的データ独立性。"},{"heading":"モデルを比較する","body":"関係型は表とキー、階層型は親子の木、網型はレコード間の多様な関連、オブジェクト型は属性と操作を持つ対象、XML型は階層的文書を扱う。キー・バリュー型はキーから値を取得、文書型はJSON等の文書、列指向は列ごとの保存・集計や列族の構成、グラフ型はノードと辺で関係を辿る。プロパティグラフはノード・辺に属性を持ち、トリプルストアは主語・述語・目的語の組で関係を表す。インメモリDBは主記憶上で処理するため高速な場合がある。永続性の仕組みは別途確認する。"},{"heading":"管理機能と製品例","body":"DBMS（データベース管理システム）は構造定義、検索更新、同時実行制御、復旧、権限を提供する。関係型にはPostgreSQL、MySQL、SQLite、文書型にはMongoDB、CouchDB、キー・バリュー型にはRedis、列族型にはCassandra、グラフ型にはNeo4jがある。SQLiteは一般にアプリ内に組み込む方式。関係モデルの行はタプル、列は属性、取り得る値の集合はドメイン。関係スキーマは属性などの構造定義。"}],"beginner":{"scenario":"データの見え方と保存を分けるから順に、モデルを比較する、管理機能と製品例を理解する。","trap":"内部スキーマを変更しても上位の構造を維持できる性質。","quizId":"U-09-Y01"}},{"id":"09-Y02","title":"データ分析・制約・物理設計","explain":"\u003cp>店舗によって「顧客番号」と「会員ID」が同じ意味なら異音同義語、同じ「金額」が税込と税抜で異なるなら同音異義語。データ辞書で意味、型、単位を定義する。トップダウンは業務全体から実体や関係を整理、ボトムアップは既存帳票・データ等から共通項をまとめる。DOA（データ中心アプローチ）は業務で共有するデータ構造を重視する。ER図では顧客と注文の1対多、商品と注文の多対多などを表す。多対多は中間表で二つの1対多に分解できる。\u003c/p>","worked":"\u003cp>\u003cb>会員番号のほかにメールアドレスも重複禁止としたい。\u003c/b>\u003c/p>\u003cp>主キーとは別にメール列に一意性制約を設定し、必要ならNULL禁止も設定する。\u003c/p>","prompt":"非正規化で結合を減らす代わりに注意することは？","answer":"\u003cp>重複データを更新した際の不整合を防ぐ仕組みが必要。\u003c/p>","textbook":[{"heading":"業務の意味をモデル化する","body":"店舗によって「顧客番号」と「会員ID」が同じ意味なら異音同義語、同じ「金額」が税込と税抜で異なるなら同音異義語。データ辞書で意味、型、単位を定義する。トップダウンは業務全体から実体や関係を整理、ボトムアップは既存帳票・データ等から共通項をまとめる。DOA（データ中心アプローチ）は業務で共有するデータ構造を重視する。ER図では顧客と注文の1対多、商品と注文の多対多などを表す。多対多は中間表で二つの1対多に分解できる。"},{"heading":"論理設計で矛盾を防ぐ","body":"主キーは行を一意に識別、UNIQUEは値の一意性、NOT NULLは欠損禁止、CHECKは指定条件、FOREIGN KEYは参照先の存在を保証する制約。自然キーは業務上の識別子、サロゲートキーは人工的な識別子。人工キーを使っても業務上の重複禁止条件は別に必要。ビューは問合せ結果を仮想表として提供する。集約などを含むビューは一般に直接更新できない場合がある。非正規化は結合を減らす等の目的で重複を意図的に持つが、更新の整合性管理が必要になる。"},{"heading":"物理設計と移行","body":"保存領域は行数×平均行サイズを基本に、索引、管理情報、ログ、空き領域、将来の増加を考慮する。パーティションは日付などで表を分割し、範囲検索や保守を効率化する場合がある。インバーテッドファイル（転置ファイル）は値や語から該当するレコードを引ける構造。DB作成は環境準備、スキーマ定義、データ変換・登録、件数・制約・業務結果の検証、性能評価、運用へ進む。"}],"beginner":{"scenario":"業務の意味をモデル化するから順に、論理設計で矛盾を防ぐ、物理設計と移行を理解する。","trap":"参照整合性を保証する外部キー制約を用いる。","quizId":"U-09-Y02"}},{"id":"09-Y03","title":"SQLの条件・副問合せ・集合演算","explain":"\u003cp>BETWEEN 10 AND 20は通常両端を含む。IN (10,20)は列挙した値のいずれかと一致、LIKE 'A%'はAで始まる文字列（%は任意長、_は1文字）。SQLではNULLとの比較がUNKNOWNになる場合があるのでIS NULLで調べる。NOT INの副問合せにNULLがあると想定外の結果になり得るためNOT EXISTSなどを検討する。相関名は表の別名で、同じ表を複数回使う自己結合にも必要となる。\u003c/p>","worked":"\u003cp>\u003cb>社員給与が300、400、500万円の場合、平均より高い社員の給与は？\u003c/b>\u003c/p>\u003cp>平均400万円を副問合せで求め、厳密に超える500万円のみ抽出する。\u003c/p>","prompt":"必修がAとBのとき、Aのみ履修した学生は商の結果に含まれるか。","answer":"\u003cp>含まれない。全ての必修科目との対応が必要。\u003c/p>","textbook":[{"heading":"条件で行を絞る","body":"BETWEEN 10 AND 20は通常両端を含む。IN (10,20)は列挙した値のいずれかと一致、LIKE 'A%'はAで始まる文字列（%は任意長、_は1文字）。SQLではNULLとの比較がUNKNOWNになる場合があるのでIS NULLで調べる。NOT INの副問合せにNULLがあると想定外の結果になり得るためNOT EXISTSなどを検討する。相関名は表の別名で、同じ表を複数回使う自己結合にも必要となる。"},{"heading":"副問合せの意味","body":"SELECT name FROM Employee WHERE salary > (SELECT AVG(salary) FROM Employee) は全社員の平均給与を計算し、その値を超える社員を抽出する。相関副問合せは内側が外側の行の値を参照する。例えば各部署の平均給与と各社員の給与を比較する。EXISTSは副問合せに条件を満たす行があるかを判定する。実際の実行順はDBMSの最適化により異なる。"},{"heading":"関係代数の商と集合演算","body":"全ての必修科目を履修した学生を求めるとき、学生・科目の組の表を必修科目表で割る関係演算の商が考えられる。必修科目がA,Bで、学生1がA,B、学生2がAなら学生1のみ該当。SQLでは「履修していない必修科目が存在しない」という二重NOT EXISTSなどで表現できる。UNIONは和、INTERSECTは積、EXCEPTは差に対応し、通常重複を除く。"}],"beginner":{"scenario":"条件で行を絞るから順に、副問合せの意味、関係代数の商と集合演算を理解する。","trap":"商は指定された集合の全要素と関連する対象を求める。","quizId":"U-09-Y03"}},{"id":"09-Y04","title":"SQLの定義・更新・ウィンドウ関数","explain":"\u003cp>DDL（データ定義言語）はCREATE TABLEやALTER TABLE等で構造を定義する。DML（データ操作言語）はSELECT、INSERT、UPDATE、DELETE等でデータを操作する。権限付与のGRANTと取消しのREVOKEはDCL（データ制御言語）と呼ぶ分類もある。例えばCREATE TABLE Product(id INT PRIMARY KEY, price INT CHECK(price&gt;=0))なら負価格を拒否する。UPDATE Product SET price=120 WHERE id=1は対象IDだけ変更する。WHEREを省くと全行が対象になる。\u003c/p>","worked":"\u003cp>\u003cb>部署Aの給与100,200、部署Bの給与300。AVG(salary) OVER(PARTITION BY dept)の結果は？\u003c/b>\u003c/p>\u003cp>元の3行を残しAの2行に150、Bの1行に300を追加する。\u003c/p>","prompt":"各部署の平均を求めつつ社員1人ずつの行も残したい。","answer":"\u003cp>ウィンドウ関数AVGのPARTITION BYを利用する。\u003c/p>","textbook":[{"heading":"データを定義して操作する","body":"DDL（データ定義言語）はCREATE TABLEやALTER TABLE等で構造を定義する。DML（データ操作言語）はSELECT、INSERT、UPDATE、DELETE等でデータを操作する。権限付与のGRANTと取消しのREVOKEはDCL（データ制御言語）と呼ぶ分類もある。例えばCREATE TABLE Product(id INT PRIMARY KEY, price INT CHECK(price>=0))なら負価格を拒否する。UPDATE Product SET price=120 WHERE id=1は対象IDだけ変更する。WHEREを省くと全行が対象になる。"},{"heading":"ビュー・トリガ・カーソル","body":"CREATE VIEWで特定列や条件の結果をビューとして定義する。CASCADEは親の削除等に連動し子を削除・更新する参照動作で、意図しない連鎖に注意。TRIGGER（トリガ）は指定イベント時に自動実行する処理。埋込みSQLは親言語からSQLを利用する方法。カーソルは問合せ結果の行を順に扱う仕組みで、宣言、OPEN、FETCH、CLOSE等の操作がある。集合単位の処理が適する場合は行ごとの処理より効率的になり得る。"},{"heading":"グループ化とウィンドウの違い","body":"GROUP BYで部署別平均を出すと部署ごとに1行になる。AVG(salary) OVER(PARTITION BY dept) は各社員の行を残しながら部署平均を追加する。ROW_NUMBER() OVER(PARTITION BY dept ORDER BY salary DESC) は部署ごとに給与順の番号を付ける。同順位の扱いはRANK等の関数で異なり、同じ給与の場合の順番を確定するなら追加の並べ替え条件を指定する。"}],"beginner":{"scenario":"データを定義して操作するから順に、ビュー・トリガ・カーソル、グループ化とウィンドウの違いを理解する。","trap":"ウィンドウ関数は関連する行の集合で計算し各行へ結果を付けられる。","quizId":"U-09-Y04"}},{"id":"09-Y05","title":"ロックと分散取引の整合性","explain":"\u003cp>共有ロックは一般に複数の読取りを許し、専有ロックは他の読取り・書込みを制限する。ロック粒度が表単位なら管理は簡単だが競合が増え、行単位なら並行性が高まるが管理負荷が増える。2相ロッキングではロック取得段階と解放段階を分け、解放後は新たなロックを取得しない。直列化可能性を確保する基本方式だがデッドロックは起こり得る。MVCC（多版型同時実行制御）は複数版を保持して読取りと更新の競合を減らす。\u003c/p>","worked":"\u003cp>\u003cb>取引Aが商品1を、Bが商品2をロックし互いに相手のロックを待つ。\u003c/b>\u003c/p>\u003cp>デッドロック。統一したロック取得順等で循環待ちを防ぎ、発生時は一方を中止・再試行する。\u003c/p>","prompt":"2相ロッキングと2相コミットの目的の違いは？","answer":"\u003cp>前者は同時実行制御、後者は分散取引の確定を調整する。\u003c/p>","textbook":[{"heading":"同時実行で矛盾を防ぐ","body":"共有ロックは一般に複数の読取りを許し、専有ロックは他の読取り・書込みを制限する。ロック粒度が表単位なら管理は簡単だが競合が増え、行単位なら並行性が高まるが管理負荷が増える。2相ロッキングではロック取得段階と解放段階を分け、解放後は新たなロックを取得しない。直列化可能性を確保する基本方式だがデッドロックは起こり得る。MVCC（多版型同時実行制御）は複数版を保持して読取りと更新の競合を減らす。"},{"heading":"待ち方と異常な更新","body":"Wait-Die方式は古い取引が若い取引を待つことを許し、若い取引は古い取引のロックを待たず中止する。Wound-Wait方式は古い取引が若い取引を中止させ、若い取引は古い取引を待つ。いずれも時刻順を使い循環待ちを防ぐ。書込みスキューは別々の行を更新しても全体の制約を破ることがある現象。例えば当番が最低1人必要なとき、互いに相手が当番だと確認して両者が自分を外すと0人になる。"},{"heading":"複数サービスの取引","body":"2相コミットは全参加者に準備可否を確認し、全員が準備できれば確定を指示する。調整役の障害等で待つ可能性がある。Sagaパターンは複数の局所取引を順に確定し、途中失敗時に補償取引で業務上の取消しを行う。TCC（試行・確認・取消し）は先に予約し、成功時確定、失敗時取消す。補償は元の状態を完全に戻せるとは限らないため業務ルールが重要。"}],"beginner":{"scenario":"同時実行で矛盾を防ぐから順に、待ち方と異常な更新、複数サービスの取引を理解する。","trap":"取得段階と解放段階を分ける。","quizId":"U-09-Y05"}},{"id":"09-Y06","title":"ログによる復旧・索引・アクセス権","explain":"\u003cp>チェックポイントはデータベース状態やログの処理位置を記録し回復時の探索範囲を減らす。例えば保存済み残高100、確定済み更新＋20、未確定更新−30の後に障害が起きた場合、必要なREDO（再実行）で＋20を反映し、必要なUNDO（取消し）で未確定−30を除く。最終的に120となる。実際の復旧手順は書込み方式で異なる。シャドウページ法は元のページを保持し、新しいページを作って確定時に参照先を切り替える。ウォームスタートは既存状態等を利用する再起動、コールドスタートは初期化を伴う起動の意味で使われる。\u003c/p>","worked":"\u003cp>\u003cb>商品名と価格だけを取得する検索で、索引に両列が含まれる。\u003c/b>\u003c/p>\u003cp>DBMSが索引だけで問合せを完了できれば、表本体のアクセスを減らせる。\u003c/p>","prompt":"未確定取引の変更を障害回復で取り消す操作は？","answer":"\u003cp>UNDO（取消し）。\u003c/p>","textbook":[{"heading":"障害発生時の復旧を追う","body":"チェックポイントはデータベース状態やログの処理位置を記録し回復時の探索範囲を減らす。例えば保存済み残高100、確定済み更新＋20、未確定更新−30の後に障害が起きた場合、必要なREDO（再実行）で＋20を反映し、必要なUNDO（取消し）で未確定−30を除く。最終的に120となる。実際の復旧手順は書込み方式で異なる。シャドウページ法は元のページを保持し、新しいページを作って確定時に参照先を切り替える。ウォームスタートは既存状態等を利用する再起動、コールドスタートは初期化を伴う起動の意味で使われる。"},{"heading":"索引の種類を選ぶ","body":"ユニーク索引は重複を制限、クラスタ化索引はデータの配置とキー順を関連付ける。B-tree系は範囲・等値検索に、ハッシュ索引は等値検索に適する。ビットマップ索引は値ごとにビット集合で行の該当を表し論理演算で絞れる。カバリング索引は問合せに必要な列を含み表本体の読取りを減らせる場合がある。転置索引は語から文書を探す全文検索等で使う。索引が多いと更新負荷が増える。"},{"heading":"権限を最小限にする","body":"データ参照・挿入・更新・削除の権限を分ける。閲覧専用の担当にはSELECTのみ付与し、必要に応じビューで列や行を制限する。GRANTで付与、REVOKEで取消す。権限、暗号化、監査ログ、バックアップは異なる目的を持つ。DB内を暗号化しても正規権限で誤操作する危険は残る。"}],"beginner":{"scenario":"障害発生時の復旧を追うから順に、索引の種類を選ぶ、権限を最小限にするを理解する。","trap":"必要列を索引から取得できる場合に利用する。","quizId":"U-09-Y06"}},{"id":"09-Y07","title":"分散DB・データ基盤・メタデータ管理","explain":"\u003cp>水平分散は行を顧客ID等で分け、垂直分散は列を分ける。透過性は利用者が配置を意識せずアクセスできる性質。分散問合せではネットワーク越しの転送量が性能に影響する。スプリットブレインは通信断などで両系が自分を主系と判断して更新する状態。クォーラム（必要数の合意）などで防止する。BASEは基本的可用性、柔軟な状態、結果整合性を重視する考え方。結果整合性では更新が止まれば複製間の値が最終的に一致することを目指す。ブロックチェーンのコンセンサスは参加者間の合意、ファイナリティは取引の確定性を指す。\u003c/p>","worked":"\u003cp>\u003cb>顧客100万人をIDの範囲で複数ノードへ分ける。\u003c/b>\u003c/p>\u003cp>水平分散・シャーディングの例。特定範囲にアクセスが偏らないか検討する。\u003c/p>","prompt":"データ辞書を設けると何を確認できるか。","answer":"\u003cp>項目の意味・型・単位・格納場所等を共有し、異なる解釈や重複を減らす。\u003c/p>","textbook":[{"heading":"分散配置と整合性","body":"水平分散は行を顧客ID等で分け、垂直分散は列を分ける。透過性は利用者が配置を意識せずアクセスできる性質。分散問合せではネットワーク越しの転送量が性能に影響する。スプリットブレインは通信断などで両系が自分を主系と判断して更新する状態。クォーラム（必要数の合意）などで防止する。BASEは基本的可用性、柔軟な状態、結果整合性を重視する考え方。結果整合性では更新が止まれば複製間の値が最終的に一致することを目指す。ブロックチェーンのコンセンサスは参加者間の合意、ファイナリティは取引の確定性を指す。"},{"heading":"蓄積と分析の流れ","body":"ETL（抽出・変換・格納）は変換後に保存、ELT（抽出・格納・変換）は保存先で変換する。データクレンジングは表記の統一、欠損・重複等の処理。データレイクは構造化・半構造化・非構造化データ等を広く保存する。データマイニングはデータから規則やパターンを見つける。例えば購入品の組合せ分析で同時購入傾向を調べる。Hadoopは分散処理の基盤、Sparkは分散データ処理エンジン、HDFSは分散ファイルシステム、CephやGlusterFSは分散記憶の仕組み。HiveやPrestoは大規模データを問い合わせる技術の例。"},{"heading":"データそのものと管理情報","body":"データディクショナリは列名、型、意味、所在などのメタデータを管理する。リポジトリは設計・ソフトウェア成果物・関連情報等を一元管理する。IRDS（情報資源辞書システム）は情報資源の記述・管理に関する規格の考え方。ファクトDBは事実データ、リファレンスDBは文献等の参照情報を扱う。ストリーミングデータは継続して到着するデータで、処理時刻と発生時刻の差や遅延到着に注意する。"}],"beginner":{"scenario":"分散配置と整合性から順に、蓄積と分析の流れ、データそのものと管理情報を理解する。","trap":"ELTはExtract・Load・Transformの順で処理する。","quizId":"U-09-Y07"}}],"beginnerIntro":"表・行・列・キーの理解から、SQL、同時更新、障害復旧へ進む。"},{"id":10,"title":"ネットワーク","group":"テクノロジ","priority":"B選択候補","summary":"TCP/IP、IPアドレス、ルーティング、DNS、TLSと障害切り分け。","lessons":[{"title":"階層とプロトコル","body":"IP（Internet Protocol）はネットワーク層で宛先までパケットを運ぶ。TCP（Transmission Control Protocol）は順序制御・再送等で信頼性を実現し、UDP（User Datagram Protocol）は簡潔で即時性を優先する用途に使う。","check":"TCPはコネクション型、UDPはコネクションレス。"},{"title":"サブネット","body":"IPv4の/24は先頭24ビットがネットワーク部で末尾8ビットがホスト部。一般的な/24の利用可能ホスト数は2^8−2=254。CIDR（Classless Inter-Domain Routing）は可変長のプレフィックスを指定する。","check":"/31や/32は用途が特殊なので一般式を無条件に当てない。"},{"title":"名前解決","body":"DNS（Domain Name System：ドメイン名システム）はドメイン名とIPアドレス等を対応。AレコードはIPv4、AAAAはIPv6、MXはメール配送先、CNAMEは別名。","check":"DNSの情報はTTL（生存時間）によりキャッシュされる。"},{"title":"Webと暗号化","body":"HTTPはWeb通信、HTTPSはHTTPをTLS（Transport Layer Security：通信の暗号化・認証）で保護したもの。TLSの証明書検証で通信相手の正当性を確認する。","check":"HTTPSは相手のWebサイトの内容まで安全保証するものではない。"},{"title":"障害切り分け","body":"IP疎通→名前解決→TCP接続→アプリ応答の順に確認。pingはICMP、tracerouteは経路を調べる手段だがICMPを遮断している場合は不通断定できない。","check":"「pingが失敗した＝必ず通信不可」ではない。"}],"terms":[{"term":"TCP","definition":"順序制御・再送制御などで信頼性を確保する転送層プロトコル"},{"term":"UDP","definition":"低い制御負荷でデータグラムを送る転送層プロトコル"},{"term":"IPアドレス","definition":"ネットワーク上の通信先を論理的に識別する番号"},{"term":"サブネットマスク","definition":"IPアドレスのネットワーク部を示すビットマスク"},{"term":"CIDR","definition":"可変長プレフィックスでIPアドレス範囲を表現する方式"},{"term":"DNS","definition":"名前とIPアドレスなどを対応付ける分散システム"},{"term":"NAT","definition":"ネットワークアドレスを変換する仕組み"},{"term":"DHCP","definition":"端末にIP設定を自動配布するプロトコル"},{"term":"TLS","definition":"通信相手の認証・暗号化・完全性を提供する仕組み"},{"term":"HTTP","definition":"Webでリクエストとレスポンスを交換するアプリ層プロトコル"},{"term":"VPN","definition":"共有網上で安全な仮想通信路を作る技術"},{"term":"ルーティング","definition":"宛先ネットワークに応じてパケットの転送先を選ぶこと"}],"questions":[{"id":"Q10-01","chapter":10,"kind":"applied","q":"192.168.10.0/26の通常のホスト用アドレス数は。","options":["30","62","64","126"],"correct":1,"explain":"ホスト部は6ビットで2^6−2=62。"},{"id":"Q10-02","chapter":10,"kind":"applied","q":"名前からIPv6アドレスを得たい。DNSのレコード種別は。","options":["A","MX","AAAA","PTR"],"correct":2,"explain":"AAAAはIPv6を示す。"},{"id":"Q10-03","chapter":10,"kind":"applied","q":"TCPとUDPの違いとして正しいのは。","options":["UDPは必ず順序保証する","TCPは再送制御を持つ","TCPは接続確立しない","UDPはIPを使わない"],"correct":1,"explain":"TCPは再送・順序制御などを提供する。"},{"id":"D10-01","chapter":10,"kind":"applied","q":"192.168.1.96/27のサブネットにおける通常利用可能なIPv4ホスト範囲はどれか。","options":["192.168.1.96～127","192.168.1.97～126","192.168.1.97～128","192.168.1.64～95"],"correct":1,"explain":"/27は32アドレス。96はネットワーク、127はブロードキャスト、利用可能は97～126。"},{"id":"D10-02","chapter":10,"kind":"applied","q":"経路表に10.0.0.0/8と10.1.0.0/16があり、宛先10.1.2.3に送る際の経路選択はどれか。","options":["/8の方を優先","両方へ必ず複製","/16を優先","常にデフォルト経路"],"correct":2,"explain":"最長プレフィックス一致で、より具体的な/16の経路が選ばれる。"},{"id":"D10-03","chapter":10,"kind":"applied","q":"実効通信速度80Mbpsで100MBのファイルを送る理想的な転送時間はどれか。","options":["1秒","8秒","10秒","80秒"],"correct":2,"explain":"100MB×8=800Mbit、800/80=10秒。通信オーバーヘッドは無視。"},{"id":"Q-10-X01","chapter":10,"kind":"applied","q":"無線LANで主に使われる媒体アクセス制御は？","options":["CSMA/CD","CSMA/CA","SMTP","ARP"],"correct":1,"explain":"CSMA/CA。送信前に衝突を回避する。"},{"id":"Q-10-X02","chapter":10,"kind":"applied","q":"メール送信に使われる代表的なプロトコルは？","options":["IMAP","SNMP","SMTP","NTP"],"correct":2,"explain":"SMTP（簡易メール転送プロトコル）。"},{"id":"U-10-1","chapter":10,"kind":"applied","q":"宛先IPに基づきネットワーク間で転送する機器は？","options":["L2スイッチ","リピータ","USBハブ","ルータ"],"correct":3,"explain":"ルータは経路表により配送。L2スイッチは主にMACアドレスで転送。"},{"id":"U-10-2","chapter":10,"kind":"applied","q":"通常のIPv4 /28で利用可能なホストアドレス数は？","options":["14","16","28","30"],"correct":0,"explain":"2^(32−28)−2＝14。"},{"id":"U-10-3","chapter":10,"kind":"applied","q":"端末へIPアドレスやゲートウェイを自動配布するプロトコルは？","options":["DNS","DHCP","SMTP","HTTP"],"correct":1,"explain":"DHCPは設定配布、DNSは名前解決。"},{"id":"U-10-4","chapter":10,"kind":"applied","q":"一つの物理スイッチで論理的なLANを分ける技術は？","options":["VPN","DNS","VLAN","RAID"],"correct":2,"explain":"VLANは論理LANの分割。VPNは仮想的な私設通信路。"},{"id":"U-10-5","chapter":10,"kind":"applied","q":"外部IPに接続できるがドメイン名で接続できないとき最初に疑う機能は？","options":["DHCPの全停止","RAID","画像圧縮","DNS"],"correct":3,"explain":"IP到達性が確認できているため名前解決を優先する。"},{"id":"U-10-X01","chapter":10,"kind":"applied","q":"ネットワークの混雑に応じ送信量を調整する制御は？","options":["輻輳制御","フロー制御","誤り訂正","名前解決"],"correct":0,"explain":"輻輳制御は網の過負荷を抑える。"},{"id":"U-10-X02","chapter":10,"kind":"applied","q":"ネットワーク機器の状態を監視管理する代表的プロトコルは？","options":["SMTP","SNMP","POP3","NTP"],"correct":1,"explain":"SNMPは簡易ネットワーク管理プロトコル。SMTPはメール送信、NTPは時刻同期。"},{"id":"U-10-Y01","chapter":10,"kind":"applied","q":"回線が1本、提供呼量1アーラン、待ちなしのアーランBモデルで呼損率は？","options":["0.25","0.5","0.1","1"],"correct":1,"explain":"B(1,1)＝1/(1+1)＝0.5。"},{"id":"U-10-Y02","chapter":10,"kind":"applied","q":"冗長なL2ネットワークのループを防ぐ代表的方式は？","options":["DNS","NAT","スパニングツリー","DHCP"],"correct":2,"explain":"論理的な木構造を作ってループを防ぐ。"},{"id":"U-10-Y03","chapter":10,"kind":"applied","q":"通常のDNS名前解決で利用する既定のポートは？","options":["22","25","123","53"],"correct":3,"explain":"DNSはUDP/TCPの53番を一般に用いる。"},{"id":"U-10-Y04","chapter":10,"kind":"applied","q":"リンク状態とコストをもとに最短経路を求める代表的な経路制御方式は？","options":["OSPF","POP3","DHCP","SMTP"],"correct":0,"explain":"OSPFはリンク状態型のルーティングプロトコル。"},{"id":"U-10-Y05","chapter":10,"kind":"applied","q":"ネットワーク機能を汎用計算機上の仮想環境で実行する考え方は？","options":["DNS","NFV","MIB","WDM"],"correct":1,"explain":"Network Functions Virtualization（ネットワーク機能仮想化）。"},{"id":"U-10-Y06","chapter":10,"kind":"applied","q":"添付画像などをメールで扱うための拡張規則は？","options":["NTP","STP","MIME","RIP"],"correct":2,"explain":"MIMEは本文の形式や添付等を扱う規則。"},{"id":"U-10-Y07","chapter":10,"kind":"applied","q":"発行・購読型でIoTセンサ等に利用されるメッセージ通信規約は？","options":["HDMI","RAID","MIME","MQTT"],"correct":3,"explain":"発行者と購読者の間をブローカ等が仲介する。"}],"deepIntro":"科目Bでは「どの層で、どの相手へ、何が通らないか」を表と経路図で整理する。","deep":[{"id":"10-1","title":"TCP/IPの階層とカプセル化","explain":"\u003cp>通信の機能を層に分けると障害箇所を推定しやすい。リンク層は同一リンク内のフレーム転送、IP（Internet Protocol：インターネットプロトコル）はネットワーク間のパケット配送、TCP（Transmission Control Protocol：伝送制御プロトコル）は順序・再送などによる信頼性の高いバイトストリーム、UDP（User Datagram Protocol：ユーザーデータグラムプロトコル）は軽量なデータグラム通信、HTTP（Hypertext Transfer Protocol：Web通信プロトコル）はアプリ層の要求・応答を担う。\u003c/p>\n\u003cp>送信時は上位データにヘッダを追加するカプセル化、受信時はヘッダを解釈して上位へ渡す。TCPはコネクション確立に通常3ウェイハンドシェイクを使うが、TLSやHTTPはさらに別の処理がある。IPアドレスは論理的な転送先、MACアドレスはリンク層での宛先識別。\u003c/p>\n","worked":"\u003cp>Webにアクセスできない場合、最初に物理リンク・IP設定・DNS・TCP接続・TLS/HTTP応答を順に分ける。\u003ccode>ping\u003c/code>が通らないことだけでHTTPサーバ故障とは断定できない。ICMPを遮断している場合もある。\u003c/p>\n","prompt":"HTTP/3はTCPを使うか。","answer":"\u003cp>一般にQUICを使い、その下位にはUDPが使われる。HTTP/1.1・HTTP/2の典型例との違いを押さえる。\u003c/p>\n","beginner":{"scenario":"Web要求を送るときTCPが通信の順序などを管理、IPが宛先への配送、リンク層が同一リンク上の転送を担当する。","trap":"IPアドレスはネットワークの宛先、ポート番号はサービス識別。","quizId":"U-10-1"},"textbook":[{"heading":"なぜ通信を階層に分けるのか","body":"ブラウザでページを開くには、要求の内容、相手のアプリ、相手の機器への経路、隣の機器への転送などを別々に考えます。OSI参照モデルは物理・データリンク・ネットワーク・トランスポート・セッション・プレゼンテーション・アプリケーションの7層に分けた概念モデルです。TCP/IP体系は実際のインターネットのプロトコル群で、分類は必ずしもOSIと一対一ではありません。"},{"heading":"アドレスとポート","body":"データリンク層ではMACアドレスなどを使って同一リンク上の機器へ転送し、ネットワーク層のIPは異なるネットワーク間の宛先と経路を扱います。トランスポート層ではポート番号でアプリケーションの通信先を識別します。TCP（伝送制御プロトコル）は接続、順序、再送等で信頼性のあるバイトストリームを提供し、UDP（ユーザデータグラムプロトコル）は接続確立や再送を自身では保証しない軽量な方式です。"},{"heading":"カプセル化を追う","body":"HTTPの要求データにTCPヘッダ、IPヘッダ、リンク層のヘッダ等を順に付加して送ります。受信側は逆順に解釈します。ルータを越えるとリンク層の宛先等は次の区間に合わせて変わります。アプリの内容を運ぶ役割と、配送先を決める役割を区別します。"}],"walkthrough":{"heading":"一つのパケットがルータを通るとき","body":"端末A（IP 192.168.1.10）が別ネットワークのサーバB（IP 203.0.113.20）に通信する例です。Aは宛先IPが自分のサブネット外だと判断し、最初のリンクではデフォルトゲートウェイRへフレームを送ります。IPパケットの宛先はBのままですが、最初のフレームの宛先MACはRになります。RはフレームからIPパケットを取り出し、経路表に従って次の区間用のフレームを生成します。IPのTTL（生存時間）は転送ごとに減少し、ループによる永続転送を防ぎます。NAT等がない基本例では、宛先IPは最終サーバを示し、リンク層の宛先は各区間の次の機器を示すのが重要です。","cols":["区間","IP宛先","リンク層宛先"],"rows":[["端末A→ルータR","サーバB","ルータR"],["ルータR→次ルータ","サーバB","次ルータ"],["最後のルータ→B","サーバB","サーバB"]]}},{"id":"10-2","title":"IPアドレス・サブネット・経路選択","explain":"\u003cp>IPv4アドレスは32ビット。CIDR表記192.168.10.0/26ならネットワーク部26ビット、ホスト部6ビットでアドレス数64。通常のホスト利用ではネットワークアドレスとブロードキャストアドレスを除き最大62個（特殊用途を除く）。サブネットマスク255.255.255.192は/26を表す。同一ネットワークかどうかはアドレスとマスクのANDで判定する。\u003c/p>\n\u003cp>ルータは宛先IPと経路表を照合し、最長一致（ロンゲストプレフィックスマッチ）を優先する。LAN（Local Area Network：構内ネットワーク）内の隣接相手へのMAC解決にはIPv4ならARP、IPv6なら近隣探索（NDP）が使われる。NAT（Network Address Translation：アドレス変換）はアドレス、NAPTはポート番号を含めて変換し、複数端末の外部通信を可能にすることがある。\u003c/p>\n","worked":"\u003cp>/27はホスト部5ビットで32アドレス。192.168.1.96/27の範囲は192.168.1.96～127、通常使用可能なのは97～126。192.168.1.130は別サブネット。\u003c/p>\n","prompt":"10.0.0.0/8と10.1.0.0/16の両方が経路表にあるとき、宛先10.1.2.3はどちらか。","answer":"\u003cp>より具体的な/16に一致する経路を使う。\u003c/p>\n","beginner":{"scenario":"192.168.1.130/26はホスト部6ビット、64個刻み。130は128〜191の区間なのでネットワーク.128、通常ホスト.129〜.190。","trap":"/26はネットワーク部が26ビット。","quizId":"U-10-2","lab":{"title":"サブネットを2進数から求める","problem":"192.168.1.77/27のネットワークアドレス、ブロードキャスト、通常のホスト範囲を求める。","steps":["32−27=5ビットがホスト部。ブロック幅は2⁵=32。","サブネットマスクは255.255.255.224。最後の8ビットは11100000。","77は01001101。マスクとANDすると01000000=64。","ホスト部を全部1にすると01011111=95。","ネットワークは.64、ブロードキャストは.95、ホストは.65〜.94。"],"answer":"192.168.1.64、192.168.1.95、ホスト30個","check":"末尾の32刻み（0、32、64、96…）を使っても求められる。"}},"textbook":[{"heading":"IPアドレスの構造","body":"IPv4アドレスは32ビットを8ビットずつ区切った4つの十進数で表します。先頭のネットワーク部と残りのホスト部をプレフィックス長で区別します。/24なら先頭24ビットがネットワーク部、最後8ビットがホスト部です。サブネットマスク255.255.255.0はネットワーク部が全て1、ホスト部が全て0です。"},{"heading":"ネットワークを求める","body":"192.168.1.77/26なら残り6ビットで64アドレスの区間です。77は64〜127に属し、ネットワークは192.168.1.64、ブロードキャストは192.168.1.127、通常利用できるホストは.65〜.126の62個です。AND演算でホスト部を0にしても求められます。/31・/32は特殊な用途があり通常の2ⁿ−2を機械的に適用しません。"},{"heading":"経路とアドレス変換","body":"端末は同じサブネットなら直接転送し、別ネットワークならルータ（通常はデフォルトゲートウェイ）へ渡します。ルータは経路表の中から宛先に合う最長プレフィックスの経路を選ぶのが基本です。NAT（ネットワークアドレス変換）はアドレスを変換し、NAPTはポート番号も利用して複数端末の通信を対応付けます。IPv6は128ビットでより広いアドレス空間を持ちます。"}],"walkthrough":{"heading":"経路表は一番具体的な住所を選ぶ","body":"ルータに0.0.0.0/0（既定経路）、192.168.0.0/16（経路A）、192.168.1.0/24（経路B）、192.168.1.128/25（経路C）が登録されているとします。宛先192.168.1.150は/16、/24、/25の全てに一致します。その中でネットワーク部が最も長く具体的な/25の経路Cを選ぶのが最長一致です。192.168.1.30は/25の128〜255に含まれないので/24のBを選びます。どの個別経路にも一致しなければ既定経路を利用します。これは経路の優先度やメトリックを比較する以前の基本的な宛先照合です。","cols":["宛先","一致する経路","選択"],"rows":[["192.168.1.150","/0、/16、/24、/25","C（/25）"],["192.168.1.30","/0、/16、/24","B（/24）"],["192.168.2.10","/0、/16","A（/16）"],["203.0.113.20","/0","既定経路"]]}},{"id":"10-3","title":"DNS・DHCP・HTTP・TLS","explain":"\u003cp>DNS（Domain Name System：ドメイン名の名前解決）はドメイン名からIPアドレス等のレコードを取得する仕組み。AはIPv4、AAAAはIPv6、MXはメール交換先、CNAMEは別名、TXTは文字列等を登録する。TTL（Time To Live：キャッシュ有効時間）を短くすると変更反映を早めやすいが、照会増加の可能性がある。DHCP（Dynamic Host Configuration Protocol：動的ホスト設定）はIP・DNS・デフォルトゲートウェイ等を自動配布する。\u003c/p>\n\u003cp>HTTPは要求メソッドGET/POST/PUT/DELETEと応答状態を用いる。認証・権限管理はHTTPメソッドだけでは実現されない。HTTPSはHTTPをTLS（Transport Layer Security：通信路の暗号化・認証）で保護する。証明書チェーンとホスト名の検証により通信先の正当性を確認し、鍵交換でセッション鍵を確立する。\u003c/p>\n","worked":"\u003cp>DNSで正しいIPを取得できるがブラウザが接続できない場合、IP到達性、TCP/443、サーバのTLS証明書、HTTPの応答を確認する。DNSを修正してもアプリ側の問題は直らない。\u003c/p>\n","prompt":"HTTPSはサーバの業務上の信用・コンテンツの正しさを保証するか。","answer":"\u003cp>保証しない。通信相手と通信路の検証と、サービスの安全性は別。\u003c/p>\n","beginner":{"scenario":"端末がDHCPで設定を受け、DNSで名前からIPを調べ、一般的なHTTPSではTLSで通信路を保護しHTTPで要求する。","trap":"名前解決成功はサーバ正常を意味しない。","quizId":"U-10-3","lab":{"title":"Web接続障害の切分け","problem":"社内端末AはIP設定を取得済み。外部のWebサーバIPへ接続できるが、ドメイン名で名前解決できない。別端末でも同じ。","steps":["IPアドレスとデフォルトゲートウェイが正常か確認。外部IPへ到達できるので経路全断は考えにくい。","DNS設定を確認し、指定DNSサーバへの接続と名前解決結果を調べる。","複数端末で同じなら共通DNSサーバ・上流DNS・設定変更を調べる。","名前解決成功後もHTTPSに失敗するなら証明書・TLS・Webサーバなどを別途調べる。"],"answer":"DNS関連の設定と稼働状況を優先して調査","check":"名前解決と通信経路とアプリの応答を分ける。観測だけで原因を断定しない。"}},"textbook":[{"heading":"Webページを開くまで","body":"端末には自分のIPアドレス、サブネットマスク、デフォルトゲートウェイ、DNSサーバ等の設定が必要です。DHCP（動的ホスト構成プロトコル）はこれらを自動配布できます。利用者がドメイン名を入力するとDNS（ドメイン名システム）が対応するIPアドレス等を調べます。名前解決ではキャッシュや複数のDNSサーバが利用されます。"},{"heading":"安全な通信路を作る","body":"一般的なHTTPSはTLS（通信路の暗号化と相手認証を行うプロトコル）でHTTP通信を保護します。ブラウザはサーバ証明書の対象名、期限、信頼連鎖等を確認し、鍵交換で共通の通信鍵を確立します。HTTPSでもサイトの内容が正しい、詐欺サイトでないと保証されるわけではありません。"},{"heading":"HTTPの要求と状態","body":"HTTP（ハイパーテキスト転送プロトコル）は要求と応答を定めます。GETは取得、POSTはデータ送信などに使い、状態コード200は成功、404は対象なし、500はサーバ内部エラーを示す代表例です。HTTP自体は各要求間の状態を通常保持しないため、Cookie（端末側に保存する情報）やサーバ側セッションでログイン状態などを管理します。"}],"walkthrough":{"heading":"DNSとDHCPの処理を分けて追う","body":"新しい端末がネットワークにつながったとき、IPv4のDHCPでは一般にDiscover（サーバ探索）、Offer（設定の提案）、Request（利用要求）、ACK（承認）という流れで設定を受け取ります。取得したIPアドレスやDNSサーバの情報を使い、今度はWebサイトの名前解決を行います。DNSの再帰リゾルバはキャッシュに答えがなければ、ルート、トップレベルドメイン、権威DNSなどへ問い合わせて答えを取得します。AレコードはIPv4、AAAAはIPv6、MXはメール配送先、CNAMEは別名を表します。TTLはDNS情報をキャッシュできる時間の目安です。DHCPが提供するのは端末の設定、DNSが提供するのは名前に対応した情報という違いを押さえます。","cols":["目的","代表的な仕組み"],"rows":[["端末が自分のIP設定を得る","DHCP"],["サイト名からIPv4を得る","DNS Aレコード"],["サイト名からIPv6を得る","DNS AAAAレコード"],["メールの配送先を調べる","DNS MXレコード"],["Web要求を送る","HTTP／HTTPS"]]}},{"id":"10-4","title":"スイッチ・VLAN・無線・負荷分散","explain":"\u003cp>L2スイッチはMACアドレス表を学習してフレームを転送する。VLAN（Virtual LAN：仮想LAN）は物理的な配線によらず論理的にブロードキャストドメインを分割する。異なるVLAN間の通信には通常L3ルーティングが必要。STP（Spanning Tree Protocol：スパニングツリープロトコル）はL2のループを防ぐため一部リンクを論理的に遮断する。\u003c/p>\n\u003cp>Wi-Fiでは規格、周波数帯、チャネル干渉、アクセスポイント配置、暗号方式等が性能に影響する。ロードバランサは複数サーバへ要求を振り分ける。L4負荷分散は主にアドレス・ポート、L7負荷分散はHTTPパスやヘッダ等を見て振り分けられる。\u003c/p>\n","worked":"\u003cp>社内端末がVLAN10、DBがVLAN20に分離され、相互ルーティング設定がない場合はL2スイッチのポートをつなぐだけでは通常通信できない。ルータ/ L3スイッチの経路・ACLを調べる。\u003c/p>\n","prompt":"VLANを分けるだけで完全に機密保護できるか。","answer":"\u003cp>できない。ルーティング制御、ACL、認証、暗号化などの設計が必要。\u003c/p>\n","beginner":{"scenario":"営業と経理を別VLANにすると同じ物理スイッチでも論理的に別LANとなる。相互通信はルーティングと必要なアクセス制御を使う。","trap":"VLAN自体が暗号化や完全な安全性を保証するわけではない。","quizId":"U-10-4"},"textbook":[{"heading":"ネットワーク機器の役割","body":"リピータは信号を再生・中継、L2スイッチはMACアドレスに基づいてフレームを転送、ルータはIPアドレスに基づいて異なるネットワーク間のパケットを転送します。スイッチは受信フレームの送信元MACアドレスを学習し、対応ポートへ転送します。未学習宛先などは同じ論理LAN内に広く送る場合があります。"},{"heading":"論理的に分けるVLAN","body":"VLAN（仮想LAN）は同じ物理スイッチ上でも複数の論理ネットワークに分ける技術です。営業部と経理部を分けるとブロードキャスト範囲を分離できます。異なるVLAN間で通信するにはルーティング等が必要で、アクセス制御と組み合わせます。VLANを設定するだけで暗号化されるわけではありません。"},{"heading":"無線と負荷分散","body":"無線LANではアクセスポイントが端末とネットワークを接続します。電波の競合、障害物、干渉、暗号化・認証を考えます。ロードバランサは複数サーバへ要求を分配し、正常性確認で停止サーバを除外するなどの機能を持ちます。処理負荷、セッション保持、単一障害点を設計します。"}]},{"id":"10-5","title":"通信性能・障害切分け・VPN","explain":"\u003cp>通信量と転送速度は単位に注意。ビット/秒（bps）とバイト/秒（B/s）は8倍違う。実効スループットは再送・ヘッダ・制御・混雑の影響を受け、回線の公称帯域より低くなる。RTT（Round Trip Time：往復遅延）は要求してから応答が返るまでの通信遅延の尺度。ウィンドウサイズや帯域遅延積もTCPの性能に影響する。\u003c/p>\n\u003cp>VPN（Virtual Private Network：仮想専用網）は公衆網等の上に論理的な保護通信路を構築する。IPsecはIP層、TLS-VPNはTLSなどを利用する。VPN接続が成功しても、接続後の権限・経路・DNSが適切とは限らない。\u003c/p>\n","worked":"\u003cp>100MBのファイルを実効80Mbpsで送る理想時間は100×8/80＝10秒。実際にはTCP等のオーバーヘッドや往復遅延で延びる。MbpsをMB/sに読み替えない。\u003c/p>\n","prompt":"`traceroute`で応答が途切れた地点は必ず障害箇所か。","answer":"\u003cp>断定できない。途中ルータが応答パケットを制限している可能性がある。\u003c/p>\n","beginner":{"scenario":"同じLANにはつながるが外部IPに接続できなければゲートウェイや経路を確認。外部IPは通るが名前が失敗する場合はDNSを調べる。","trap":"pingに応答しないだけでは故障と断定できない。","quizId":"U-10-5"},"textbook":[{"heading":"通信時間の内訳","body":"通信にはデータを回線へ送出する伝送時間、信号が進む伝搬時間、機器処理や待ち行列による遅延があります。100Mbit/sで10MBを送る理論伝送時間は10×8/100＝0.8秒です。実際にはヘッダ、再送、混雑、相手処理で増えます。往復時間（RTT）は要求を送り応答が返るまでの往復の時間の指標です。"},{"heading":"障害切分けの順序","body":"物理接続と無線の状態→端末のIP設定→同一ネットワークへの通信→外部IPへの経路→DNS名前解決→TLS・HTTPなどのアプリ層を調べます。複数端末で起きるか、特定宛先だけか、いつからかを確認し、共通する原因候補を絞ります。pingが通らないだけでは故障と断定できません。"},{"heading":"VPNの意味","body":"VPN（仮想私設網）は共有網上などで私設ネットワークのような通信経路を作ります。IPsecはIP層での保護、TLSを利用するVPNはリモートアクセスなどで使われます。通信経路の暗号化だけで端末や利用者の安全が保証されるわけではなく、認証・アクセス制御・ログ管理も必要です。"}]},{"id":"10-X01","title":"ネットワーク方式・通信制御","explain":"\u003cp>LAN（構内ネットワーク）は限定範囲、WAN（広域ネットワーク）は離れた拠点を接続する。イーサネットの従来型共有媒体はCSMA/CD（衝突検出付き搬送波感知多重アクセス）、無線LANはCSMA/CA（衝突回避）を用いる。全二重スイッチ接続では通常CSMA/CDを必要としない。\u003c/p>\u003cp>回線交換は専用回線を確保し、パケット交換は分割データを共有回線で転送する。MPLS（多重プロトコルラベルスイッチング）はラベルによる転送。QoS（通信品質制御）は遅延・損失などの要件に応じ優先制御や帯域制御を行う。フロー制御は受信側の処理能力、輻輳制御は網の混雑に合わせ送信を調整する。\u003c/p>","worked":"\u003cp>音声会議ではわずかな遅延が問題となりやすく、ファイル転送より優先する設計が考えられる。\u003c/p>","prompt":"無線LANで主に使われる媒体アクセス制御は？","answer":"\u003cp>CSMA/CA。送信前に衝突を回避する。\u003c/p>","beginner":{"scenario":"受信側のバッファが埋まるなら受信能力に合わせ送信を調整。網の途中が混雑するなら網の負荷に応じ送信量を抑える。","trap":"フロー制御は受信側、輻輳制御はネットワークの混雑。","quizId":"U-10-X01"},"textbook":[{"heading":"通信路の共有方法","body":"回線交換は通信中に経路の資源を確保し、パケット交換はデータを小さな単位に分け共有網で送ります。パケット方式は回線を効率よく共有できますが混雑で待ち時間が発生します。MPLS（多重プロトコルラベルスイッチング）はラベルに基づく転送方式です。"},{"heading":"媒体アクセス制御","body":"従来の共有イーサネットで使うCSMA/CDは送信前に媒体を確認し衝突を検出したら再送します。スイッチによる全二重通信では通常不要です。無線LANのCSMA/CAは送信前の待機などで衝突を回避する方式です。無線では送信中に衝突を検出するのが難しいためです。"},{"heading":"通信量を調整する仕組み","body":"フロー制御は受信側が処理できる量に合わせ、輻輳制御はネットワーク全体の混雑に合わせ送信量を調整します。QoS（サービス品質制御）は音声の遅延や映像の帯域など要求に合わせ優先度・帯域を管理します。帯域を優先配分しても物理的な回線容量が増えるわけではありません。"}]},{"id":"10-X02","title":"通信プロトコル・管理・ネットワーク応用","explain":"\u003cp>IPv6は128bitアドレス、IPv4は32bit。ARPはIPv4アドレスに対応するリンク層アドレスを調べる。IPv6では近隣探索が同様の役割を担う。ICMPはネットワーク制御・エラー通知、DNSは名前解決、DHCPはネットワーク設定の配布、NATはアドレス変換。\u003c/p>\u003cp>SMTPはメール送信、POP3はメール受信・取得、IMAPはサーバ上のメール管理、SNMPはネットワーク機器の監視管理、NTPは時刻同期、SSHは暗号化された遠隔操作。プロキシは通信を中継し、キャッシュやアクセス制御を行える。監視ではトラフィック、応答時間、パケット損失、機器ログを照合する。\u003c/p>","worked":"\u003cp>IPアドレスに直接接続できるのにドメイン名では失敗する場合はDNSを調査する。\u003c/p>","prompt":"メール送信に使われる代表的なプロトコルは？","answer":"\u003cp>SMTP（簡易メール転送プロトコル）。\u003c/p>","beginner":{"scenario":"メールサーバ間の送信はSMTP、サーバ上のメール管理はIMAP、機器監視はSNMP、時刻合わせはNTP。","trap":"ポート番号よりまず通信の目的・方向・暗号化の有無を区別する。","quizId":"U-10-X02"},"textbook":[{"heading":"各プロトコルの目的","body":"IPv4のARPはIPアドレスから同じリンク上のMACアドレスを取得し、IPv6では近隣探索が同様の役割を担います。ICMPは配送上のエラーや制御情報を伝え、pingはそのエコー要求・応答などを利用します。DNSは名前解決、DHCPは設定配布、NTPは時刻同期です。"},{"heading":"メールと遠隔操作","body":"SMTP（簡易メール転送プロトコル）は送信側からメールを転送します。POP3はメール取得、IMAPはサーバ上のメール管理に適します。SSHは暗号化した遠隔ログイン等に用いられます。FTPはファイル転送の方式で、暗号化の有無は方式によります。"},{"heading":"ネットワーク管理","body":"SNMP（簡易ネットワーク管理プロトコル）は管理側が機器の状態情報を取得したり機器から通知を受けたりする方式です。監視では通信量・応答時間・パケット損失・機器ログを記録し、障害時に時系列で比較します。プロキシは通信を中継し、アクセス制御やキャッシュ等を提供できます。リバースプロキシはサーバ側の前段で要求を受ける構成です。"}]},{"id":"10-Y01","title":"回線・無線LAN・トラフィック計算","explain":"\u003cp>LAN（構内ネットワーク）は施設等の限定範囲、WAN（広域ネットワーク）は離れた拠点間を接続する。ISP（インターネット接続事業者）はインターネットへの接続等を提供する。MDF（主配線盤）、IDF（中間配線盤）は建物内配線の接続・整理に使う。より対線は対の導線をねじって雑音の影響を減らし、同軸ケーブルは中心導体と外側導体、光ファイバは光で信号を伝える。距離・帯域・電磁雑音・費用を比較する。\u003c/p>","worked":"\u003cp>\u003cb>50Mbit/sの回線で利用率80%、200MBを送る。\u003c/b>\u003c/p>\u003cp>実効速度40Mbit/s。200×8÷40＝40秒。\u003c/p>","prompt":"毎時120件の呼が平均2分続く場合の提供呼量を求める。","answer":"\u003cp>120×2/60＝4アーラン。\u003c/p>","textbook":[{"heading":"接続範囲と媒体","body":"LAN（構内ネットワーク）は施設等の限定範囲、WAN（広域ネットワーク）は離れた拠点間を接続する。ISP（インターネット接続事業者）はインターネットへの接続等を提供する。MDF（主配線盤）、IDF（中間配線盤）は建物内配線の接続・整理に使う。より対線は対の導線をねじって雑音の影響を減らし、同軸ケーブルは中心導体と外側導体、光ファイバは光で信号を伝える。距離・帯域・電磁雑音・費用を比較する。"},{"heading":"無線の競合","body":"インフラストラクチャモードでは端末がアクセスポイントを介して通信し、アドホックモードでは端末同士が直接通信する。SSID（無線LANのネットワーク識別子）はネットワーク名であり、暗号鍵ではない。隠れ端末問題は互いの電波が届かない二端末が同じアクセスポイントへ同時送信し衝突すること。さらし端末問題は本来別々の受信先へ同時送信可能な端末が他端末の送信を検知し不要に待つこと。無線ではCSMA/CA（衝突回避型の媒体アクセス制御）やRTS/CTS（送信要求・送信許可）等で競合を抑える。"},{"heading":"通信量を計算する","body":"利用率を考慮した転送速度は例えば100Mbit/s×0.4＝40Mbit/s。100MBは800Mbitなので20秒。毎時600件の電話が平均3分続く場合、提供呼量A＝600×3/60＝30アーラン。アーランは平均して同時に占有を要求する回線数に相当する量。待ち行列がなく満杯時に拒否されるモデルではアーランB式B(A,n)＝(Aⁿ/n!)/(Σₖ₌₀ⁿ Aᵏ/k!)で呼損率を求める。A=1、回線2本なら0.5/(1+1+0.5)=0.2。適用条件は待ち行列モデルと異なる。"}],"beginner":{"scenario":"接続範囲と媒体から順に、無線の競合、通信量を計算するを理解する。","trap":"B(1,1)＝1/(1+1)＝0.5。","quizId":"U-10-Y01"}},{"id":"10-Y02","title":"ネットワーク構成・転送制御・ループ防止","explain":"\u003cp>ポイントツーポイントは2地点間、スター型は中心機器を介して接続、バス型は共通の伝送路、リング型は輪、ツリー型は階層で接続する。スター型は1本の端末配線の断線の影響を限定しやすいが中心機器が単一障害点となり得る。冗長なL2（データリンク層）接続では転送ループが生じ得る。スパニングツリープロトコル（STP）はルートブリッジを選び、ループのない論理的な木を形成するため一部のポートを転送しない状態にし、障害時に経路を再構成する。\u003c/p>","worked":"\u003cp>\u003cb>3台のL2スイッチを三角形に接続した。\u003c/b>\u003c/p>\u003cp>冗長経路は有用だがフレームのループを防ぐ必要があり、STP等で通常時の転送経路を制御する。\u003c/p>","prompt":"トークンパッシングではなぜ複数端末の同時送信が抑えられるか。","answer":"\u003cp>トークンを持つ端末に送信権を与えるため。\u003c/p>","textbook":[{"heading":"配線形態と障害","body":"ポイントツーポイントは2地点間、スター型は中心機器を介して接続、バス型は共通の伝送路、リング型は輪、ツリー型は階層で接続する。スター型は1本の端末配線の断線の影響を限定しやすいが中心機器が単一障害点となり得る。冗長なL2（データリンク層）接続では転送ループが生じ得る。スパニングツリープロトコル（STP）はルートブリッジを選び、ループのない論理的な木を形成するため一部のポートを転送しない状態にし、障害時に経路を再構成する。"},{"heading":"伝送を調整する","body":"コンテンション方式は各端末が送信を競う。ポーリングは制御局が順に送信要求を確認、セレクティングは相手局を選んで送信。トークンパッシングは送信権を示すトークンを順に渡す。HDLC（高水準データリンク制御）はフレーム単位で同期・誤り検出・制御などを行う。フロー制御は受信側の処理能力に合わせ、ルーティング制御は宛先への経路を決定する。コネクション型は通信開始前に論理的接続を確立し、コネクションレス型は個々のデータ単位を送る。"},{"heading":"機器と回線の役割","body":"ハブやリピータは物理信号を中継し、ブリッジやL2スイッチはMACアドレスで転送、L3スイッチやルータはIPアドレスで転送する。ゲートウェイは異なる方式の接続・変換など広い意味を持つ。TDMA（時分割多元接続）は時間を分け複数局が共有、WDM（波長分割多重）は光の波長を分ける。PLC（電力線通信）は電力線を通信にも使う。ITU-Tは国際電気通信連合の標準化部門でX・V・Iシリーズ等の勧告を制定している。"}],"beginner":{"scenario":"配線形態と障害から順に、伝送を調整する、機器と回線の役割を理解する。","trap":"論理的な木構造を作ってループを防ぐ。","quizId":"U-10-Y02"}},{"id":"10-Y03","title":"TCPの通信手順・ポート・IPアドレスの補足","explain":"\u003cp>ポート番号は通信相手のアプリケーション等を識別する。代表的な既定ポートはHTTP TCP80、HTTPS TCP443（HTTP/3は通常UDP443）、SSH TCP22、DNS UDP/TCP53、SMTP TCP25（サーバ間配送）、メール送信用587、POP3 TCP110、IMAP TCP143、NTP UDP123。DHCPは通常UDP67（サーバ）、68（クライアント）。ポート番号は設定で変わる場合があり、番号だけでサービスの安全性は判断できない。RARPはMACアドレスからIPアドレスを求める古い方式、PPPは2地点間の通信規約、PPPoEはイーサネット上でPPPを使う。IPoEはイーサネット上でIPを直接扱う。IEEE 802.1QはVLANタグ等の規格。\u003c/p>","worked":"\u003cp>\u003cb>TCPで順序番号1000から200バイトのデータを順に受け取った。\u003c/b>\u003c/p>\u003cp>他の条件を無視すれば次に期待する番号は1200。ACKでその位置を通知する。\u003c/p>","prompt":"HTTP/3はUDP上で動くため必ずデータが欠落したまま再生されるか。","answer":"\u003cp>いいえ。QUICが必要な信頼性等を提供する。\u003c/p>","textbook":[{"heading":"ポート番号とプロトコル","body":"ポート番号は通信相手のアプリケーション等を識別する。代表的な既定ポートはHTTP TCP80、HTTPS TCP443（HTTP/3は通常UDP443）、SSH TCP22、DNS UDP/TCP53、SMTP TCP25（サーバ間配送）、メール送信用587、POP3 TCP110、IMAP TCP143、NTP UDP123。DHCPは通常UDP67（サーバ）、68（クライアント）。ポート番号は設定で変わる場合があり、番号だけでサービスの安全性は判断できない。RARPはMACアドレスからIPアドレスを求める古い方式、PPPは2地点間の通信規約、PPPoEはイーサネット上でPPPを使う。IPoEはイーサネット上でIPを直接扱う。IEEE 802.1QはVLANタグ等の規格。"},{"heading":"TCPが信頼性を実現する仕組み","body":"TCP（伝送制御プロトコル）は接続確立時にSYN（同期要求）、SYN+ACK（同期と確認応答）、ACK（確認応答）の3ウェイハンドシェイクを行う。送信データに順序番号を付け、受信側が次に期待する番号等を通知する。未確認のデータは再送され得る。受信ウィンドウで流量を調整し、輻輳制御でネットワーク混雑に対応する。UDP（ユーザデータグラムプロトコル）はこれらを自身では保証しない。HTTP/2は一つの接続上で複数のストリームを多重化し、HTTP/3はUDP上のQUICを利用する。QUICは暗号化・接続・信頼性等の機能を持つ。"},{"heading":"IPの宛先の種類","body":"ユニキャストは1対1、ブロードキャストは同一範囲の全端末向け、マルチキャストはグループ向け。IPv6にはIPv4のようなブロードキャストはなくマルチキャスト等を利用する。IPv4の歴史的なクラスA/B/Cは標準ネットワーク部が8/16/24ビットだがCIDR（クラスレス経路制御）は任意のプレフィックス長を使う。プライベートIPv4の代表範囲は10/8、172.16/12、192.168/16で、インターネット上に直接経路広告しない。IPv6のリンクローカルアドレスは同一リンク上で用いる。"}],"beginner":{"scenario":"ポート番号とプロトコルから順に、TCPが信頼性を実現する仕組み、IPの宛先の種類を理解する。","trap":"DNSはUDP/TCPの53番を一般に用いる。","quizId":"U-10-Y03"}},{"id":"10-Y04","title":"経路制御・LAN規格・分散オブジェクト","explain":"\u003cp>静的ルーティングは管理者が経路を設定し、動的ルーティングはルータが情報を交換して経路を学ぶ。RIPはホップ数を基準とする距離ベクトル型、OSPFはリンク状態を共有しコストを基に最短経路を計算する方式、BGPは自律システム（AS）間で経路と経路方針を交換する方式。経路表の最長一致と、同じ宛先範囲の候補を選択する規則は区別する。\u003c/p>","worked":"\u003cp>\u003cb>経路候補Aが2ホップで合計コスト20、Bが3ホップで合計コスト5。\u003c/b>\u003c/p>\u003cp>ホップ数のみを基準にすればA、コスト合計を基準にすればB。実際は使用する経路制御方式の規則に従う。\u003c/p>","prompt":"AS間で経路方針に基づき経路情報を交換する代表的プロトコルは？","answer":"\u003cp>BGP（境界ゲートウェイプロトコル）。\u003c/p>","textbook":[{"heading":"経路の決定方法","body":"静的ルーティングは管理者が経路を設定し、動的ルーティングはルータが情報を交換して経路を学ぶ。RIPはホップ数を基準とする距離ベクトル型、OSPFはリンク状態を共有しコストを基に最短経路を計算する方式、BGPは自律システム（AS）間で経路と経路方針を交換する方式。経路表の最長一致と、同じ宛先範囲の候補を選択する規則は区別する。"},{"heading":"通信規格を読む","body":"10BASE-Tは10Mbit/s、100BASE-TXは100Mbit/s、1000BASE-Tは1Gbit/s、10GBASE-Tは10Gbit/sのより対線系イーサネット規格の例。Wi-Fi 4/5/6は一般にIEEE 802.11n/ac/axに対応し、6Eは6GHz帯への拡張。メッシュWi-Fiは複数の接続点を組み合わせ通信範囲を広げる。ISDN（総合デジタル通信網）はデジタル回線サービス、PRIは一次群インタフェース。実際の速度は電波・ケーブル・距離・混雑等に左右される。"},{"heading":"遠隔の機能を呼び出す","body":"CORBA（共通オブジェクト要求ブローカアーキテクチャ）は異なる言語・機器で実装した分散オブジェクト間の連携を可能にする規格。クライアントは要求を出し、ORB（オブジェクト要求ブローカ）が対象オブジェクトへの呼出しを仲介する。ネットワーク上の処理でも通信失敗・遅延・認証を考慮する必要がある。REST（表現状態転送）はWeb APIの設計原則、SOAPは構造化メッセージの交換規約である。"}],"beginner":{"scenario":"経路の決定方法から順に、通信規格を読む、遠隔の機能を呼び出すを理解する。","trap":"OSPFはリンク状態型のルーティングプロトコル。","quizId":"U-10-Y04"}},{"id":"10-Y05","title":"ネットワーク監視・SNMP・仮想ネットワーク","explain":"\u003cp>ネットワーク図、機器の設定・版・接続・変更履歴を管理する。pingは疎通の手掛かり、tracerouteは経由する機器の情報、ipやifconfigはインタフェース設定、arpはIPv4アドレスとMACの対応、ssやnetstatは通信接続等、digはDNS応答を調べる。tcpdumpやWiresharkは許可された通信のパケットを観測する。暗号化された内容を常に読めるわけではない。観測する範囲・権限・個人情報を管理する。\u003c/p>","worked":"\u003cp>\u003cb>監視カウンタが10秒で25MB増えた。\u003c/b>\u003c/p>\u003cp>十進単位で25×8/10＝20Mbit/s。\u003c/p>","prompt":"機器が障害を管理側へ自発的に通知するSNMPの機能は？","answer":"\u003cp>TRAP。管理側の周期的なGETとは異なる。\u003c/p>","textbook":[{"heading":"障害と構成を調べる","body":"ネットワーク図、機器の設定・版・接続・変更履歴を管理する。pingは疎通の手掛かり、tracerouteは経由する機器の情報、ipやifconfigはインタフェース設定、arpはIPv4アドレスとMACの対応、ssやnetstatは通信接続等、digはDNS応答を調べる。tcpdumpやWiresharkは許可された通信のパケットを観測する。暗号化された内容を常に読めるわけではない。観測する範囲・権限・個人情報を管理する。"},{"heading":"SNMPで機器を監視する","body":"SNMP（簡易ネットワーク管理プロトコル）では管理ステーションが機器側のエージェントへ状態を問い合わせる。MIB（管理情報ベース）は管理対象の項目を体系化しOID（オブジェクト識別子）で特定する。GETは値の取得、SETは設定変更、TRAPは機器側からの非同期通知。例えばインタフェースの送信バイト数を60秒間隔で読み、差が300MBなら平均40Mbit/s。カウンタの桁あふれ・再起動も考慮する。SNMPv3等で認証・暗号化を適切に設定する。"},{"heading":"ネットワークをソフトウェアで管理する","body":"SDN（ソフトウェア定義ネットワーク）は制御面と転送面を分離し、ソフトウェアで転送規則を管理する考え方。OpenFlowは制御器と転送機器間の規則設定等に用いられる規格の例。NFV（ネットワーク機能仮想化）はファイアウォールやルータ等の機能を仮想化基盤上で実行する。SD-WAN（ソフトウェア定義WAN）は拠点間回線を集中管理し用途・品質に応じ経路を選ぶ。トンネリングはある通信を別の通信の中に包んで転送するが、それだけで暗号化を意味しない。"}],"beginner":{"scenario":"障害と構成を調べるから順に、SNMPで機器を監視する、ネットワークをソフトウェアで管理するを理解する。","trap":"Network Functions Virtualization（ネットワーク機能仮想化）。","quizId":"U-10-Y05"}},{"id":"10-Y06","title":"電子メール・Web・ファイル転送の仕組み","explain":"\u003cp>送信者のメールクライアントが送信サーバへ提出し、SMTP（簡易メール転送プロトコル）で宛先ドメインのメールサーバへ配送する。DNSのMXレコードで配送先を調べる。受信者はPOP3で取得またはIMAPでサーバ上のメールを管理する。MIME（多目的インターネットメール拡張）は添付や文字種等を表現する規則。Base64は3バイトを4文字に変換する方式で、暗号化ではなくバイナリを文字として表す。HTMLメールは画像やリンク等を含められるが外部読込み等の安全性に配慮する。\u003c/p>","worked":"\u003cp>\u003cb>写真300バイトをBase64だけで表す。\u003c/b>\u003c/p>\u003cp>3バイトを4文字にするので400文字。添付の他の情報は別途必要。\u003c/p>","prompt":"複数端末で同じメールの既読やフォルダを管理したい。","answer":"\u003cp>IMAPが候補。サーバ側のメール状態を利用する。\u003c/p>","textbook":[{"heading":"メールが届くまで","body":"送信者のメールクライアントが送信サーバへ提出し、SMTP（簡易メール転送プロトコル）で宛先ドメインのメールサーバへ配送する。DNSのMXレコードで配送先を調べる。受信者はPOP3で取得またはIMAPでサーバ上のメールを管理する。MIME（多目的インターネットメール拡張）は添付や文字種等を表現する規則。Base64は3バイトを4文字に変換する方式で、暗号化ではなくバイナリを文字として表す。HTMLメールは画像やリンク等を含められるが外部読込み等の安全性に配慮する。"},{"heading":"Webの資源と状態","body":"URL（統一資源位置指定子）は方式、ホスト、パス等で資源の位置を示す。CGIはWebサーバから外部プログラムを実行するための規約。CookieとセッションIDでログイン状態などを管理する。RESTは資源をURIで識別し統一的な操作等を用いる設計原則、WebDAVはHTTPを拡張し遠隔の文書管理・編集を支援する。検索エンジンはクローラで情報を収集し索引を作り問合せに応答する。"},{"heading":"ファイルを転送する","body":"FTP（ファイル転送プロトコル）は制御接続とデータ接続を使い分ける。アクティブモードではサーバからクライアントへのデータ接続、パッシブモードではクライアントからサーバへのデータ接続を行う。後者はクライアント側のNATやファイアウォールと相性がよい場合がある。標準FTPは通信を暗号化しないため安全な方式を選ぶ。TFTPは簡易ファイル転送でUDPを利用する。イントラネットは社内網、エクストラネットは取引先等との限定的な接続を含む。"}],"beginner":{"scenario":"メールが届くまでから順に、Webの資源と状態、ファイルを転送するを理解する。","trap":"MIMEは本文の形式や添付等を扱う規則。","quizId":"U-10-Y06"}},{"id":"10-Y07","title":"通信サービス・携帯網・IoT通信","explain":"\u003cp>専用線は特定拠点間に通信回線を提供するサービス、IP-VPNは通信事業者のIP網を利用する私設網サービス、広域Ethernetは拠点間をイーサネットのように接続する。FTTHは家庭等まで光ファイバ、xDSLは既存電話線等を利用する方式、衛星通信は地上回線が届きにくい地域等で役立つ。ベストエフォートは最大速度を目安に提供し個別の実効速度を常に保証するものではない。IP電話やVoIPはIP網で音声を運ぶ。\u003c/p>","worked":"\u003cp>\u003cb>電池式の農地センサから数分ごとに温度を少量送る。\u003c/b>\u003c/p>\u003cp>通信範囲、電池寿命、網の提供状況に応じLPWA等を検討する。動画送信とは要求が異なる。\u003c/p>","prompt":"移動中に接続する基地局が変わる仕組みは？","answer":"\u003cp>ハンドオーバー。ローミングは別の事業者網等の利用を指す。\u003c/p>","textbook":[{"heading":"サービスの選択","body":"専用線は特定拠点間に通信回線を提供するサービス、IP-VPNは通信事業者のIP網を利用する私設網サービス、広域Ethernetは拠点間をイーサネットのように接続する。FTTHは家庭等まで光ファイバ、xDSLは既存電話線等を利用する方式、衛星通信は地上回線が届きにくい地域等で役立つ。ベストエフォートは最大速度を目安に提供し個別の実効速度を常に保証するものではない。IP電話やVoIPはIP網で音声を運ぶ。"},{"heading":"携帯網が移動に対応する","body":"基地局は無線端末を通信網へ接続し、フェムトセルは小範囲の基地局。ハンドオーバーは移動時に接続先基地局等を切り替え、ローミングは契約網以外の事業者網等を利用する。SIM/eSIMは加入者識別情報等を扱い、テザリングは携帯端末の通信を他機器へ共有する。MVNO（仮想移動体通信事業者）は他事業者の設備等を利用しサービス提供する。LTE上の音声通話がVoLTE。5GのSA方式は5Gコアを使い、NSA方式は既存LTE等と連携する。ネットワークスライシングは用途別の論理的なネットワークを構成する。"},{"heading":"無線の性能と省電力","body":"MIMOは複数アンテナを使い通信品質・容量を改善する。ビームフォーミングは電波の指向性を制御、キャリアアグリゲーションは複数周波数帯等を束ねる。間欠受信等は必要時だけ動作して省電力化する。LPWA（低消費電力広域通信）は少量データを長距離・低電力で送る用途に適し、LTE-M、NB-IoT、Wi-SUN、LoRaWANなどがある。MQTTは発行・購読型の軽量メッセージ通信、CoAPは制約のある機器向けの通信規約。Wi-Fi HaLowはIEEE 802.11ahに基づく低電力・広範囲向け無線技術。"}],"beginner":{"scenario":"サービスの選択から順に、携帯網が移動に対応する、無線の性能と省電力を理解する。","trap":"発行者と購読者の間をブローカ等が仲介する。","quizId":"U-10-Y07"}}],"beginnerIntro":"端末からサーバまでの配送を階層別に理解する。アドレス、名前、ポート、機器の役割を分ける。"},{"id":11,"title":"情報セキュリティ","group":"テクノロジ","priority":"B必須","summary":"暗号・認証・脆弱性・ネットワーク防御・インシデント対応。必須の最重要領域。","lessons":[{"title":"CIAと脅威分析","body":"情報セキュリティの基本は機密性（Confidentiality）・完全性（Integrity）・可用性（Availability）。リスクは脅威・脆弱性・資産への影響を踏まえ評価。","check":"可用性はシステム稼働、完全性は無断改ざん防止。"},{"title":"共通鍵・公開鍵・ハッシュ","body":"共通鍵暗号は同じ秘密鍵で暗号化と復号。公開鍵暗号は公開鍵と秘密鍵のペア。ハッシュは固定長の要約であり復号不可。ディジタル署名では署名者の秘密鍵で署名し公開鍵で検証する。","check":"署名と暗号化で使用する鍵の向きを混同しない。"},{"title":"証明書と認証","body":"認証局CA（Certificate Authority）が発行する証明書を信頼の鎖で検証。多要素認証は知識・所持・生体など異なる要素を組み合わせる。パスワードと秘密の質問は同じ知識要素。","check":"二段階認証が必ず多要素とは限らない。"},{"title":"主要な脆弱性","body":"SQLインジェクションは入力がSQL構造を変える攻撃。対策はプレースホルダ等のパラメータ化クエリ。XSS（Cross-Site Scripting）はブラウザ側で不正スクリプトを実行し、出力時の適切なエスケープ等で防ぐ。CSRFは利用者の認証状態を悪用して意図しない要求を送らせる。","check":"入力検証と出力エスケープだけで全脅威を解決したと考えない。"},{"title":"防御の層と監視","body":"WAF（Web Application Firewall）はWebアプリへのリクエストを検査。IDS/IPSは侵入検知・防止。EDR（Endpoint Detection and Response）は端末上の挙動監視と対応。最小権限や多層防御を徹底。","check":"FW・WAF・EDRで監視する位置が異なる。"},{"title":"インシデント対応","body":"初動は影響範囲・証拠保全・封じ込め・根絶・復旧・再発防止を適切に計画。証拠ログの削除や無断の再起動は分析を妨げる場合がある。","check":"原因究明前に証拠が失われないよう保全する。"}],"terms":[{"term":"機密性","definition":"許可された人だけが情報にアクセスできる性質"},{"term":"完全性","definition":"情報が不正に改ざんされていない性質"},{"term":"可用性","definition":"必要なときに情報やサービスを利用できる性質"},{"term":"共通鍵暗号","definition":"暗号化と復号で同じ秘密鍵を用いる方式"},{"term":"公開鍵暗号","definition":"公開鍵と秘密鍵の組を利用する暗号方式"},{"term":"ハッシュ関数","definition":"入力から一方向の固定長要約値を作る関数"},{"term":"ディジタル署名","definition":"秘密鍵による署名と公開鍵による検証で真正性等を確認する仕組み"},{"term":"PKI","definition":"公開鍵と電子証明書の信頼関係を管理する基盤"},{"term":"多要素認証","definition":"異なる認証要素を二種類以上組み合わせる認証"},{"term":"SQLインジェクション","definition":"入力を通じて意図しないSQL文を実行させる攻撃"},{"term":"XSS","definition":"Webページに不正なスクリプトを混入し閲覧者のブラウザで実行させる攻撃"},{"term":"CSRF","definition":"認証中の利用者に意図しないWeb要求を送信させる攻撃"},{"term":"WAF","definition":"WebアプリへのHTTPリクエスト等を検査・遮断する装置や機能"},{"term":"EDR","definition":"端末上の不審な活動を検知して分析や対応を支援する技術"},{"term":"ゼロトラスト","definition":"接続元だけを信用せず要求ごとに検証・認可する設計思想"},{"term":"サプライチェーン攻撃","definition":"取引先や依存ソフトなどを踏み台に本来の標的を攻撃する手法"}],"questions":[{"id":"Q11-01","chapter":11,"kind":"applied","q":"ディジタル署名を検証する際に原則使用する鍵は。","options":["署名者の秘密鍵","署名者の公開鍵","受信者の秘密鍵","共通鍵"],"correct":1,"explain":"署名者の秘密鍵で署名し、対応する公開鍵で検証する。"},{"id":"Q11-02","chapter":11,"kind":"applied","q":"SQLインジェクションの根本的な対策として適切なのは。","options":["入力をすべて大文字化する","パラメータ化クエリを用いる","通信をHTTPに戻す","エラーログを無効化する"],"correct":1,"explain":"値とSQL文の構造を分離する。"},{"id":"Q11-03","chapter":11,"kind":"applied","q":"パスワードと秘密の質問を併用した認証は、一般に何要素か。","options":["1要素","2要素","3要素","4要素"],"correct":0,"explain":"いずれも知識要素であり、異なる要素の組み合わせではない。"},{"id":"D11-01","chapter":11,"kind":"applied","q":"AがBへ機密情報を公開鍵暗号で送りたい場合、暗号化に使う鍵はどれか。","options":["Aの公開鍵","Aの秘密鍵","Bの公開鍵","Bの秘密鍵"],"correct":2,"explain":"受信者Bの公開鍵で暗号化し、Bの秘密鍵で復号する。署名と混同しない。"},{"id":"D11-02","chapter":11,"kind":"applied","q":"WebアプリでSQLインジェクションを防ぐ根本対策として最も適切なものはどれか。","options":["入力をSQL文字列に連結する","全ユーザーに管理権限を与える","パラメータ化クエリを使用する","WAFを置くだけで入力処理を放置する"],"correct":2,"explain":"SQLの構造と値を分け、利用者入力を構文として解釈させない。WAFは多層防御の一部。"},{"id":"D11-03","chapter":11,"kind":"applied","q":"依存ライブラリ更新後に不審な外部通信が発生した初動として適切なものはどれか。","options":["端末を即座に初期化して証拠を消す","影響を隔離しログ・更新履歴を保全する","調査前に漏えいはなかったと発表する","不正通信を容認して更新を続ける"],"correct":1,"explain":"封じ込めと証拠保全を両立。原因・影響未確定なら断定を避ける。"},{"id":"Q-11-X01","chapter":11,"kind":"applied","q":"CVSSの主目的は？","options":["利用者本人確認","暗号鍵配布","脆弱性の深刻度評価","業務復旧時間の計測"],"correct":2,"explain":"脆弱性の深刻度を共通尺度で評価すること。"},{"id":"Q-11-X02","chapter":11,"kind":"applied","q":"WebアプリのHTTP要求を検査して攻撃を抑える装置は？","options":["UPS","WAF","DNS","DHCP"],"correct":1,"explain":"WAF（Webアプリケーションファイアウォール）。"},{"id":"U-11-1","chapter":11,"kind":"applied","q":"正規利用者が必要時に利用できる性質は？","options":["機密性","完全性","可用性","真正性"],"correct":2,"explain":"可用性は必要時に使えること。機密性は漏えい防止、完全性は正確さ・完全さ。"},{"id":"U-11-2","chapter":11,"kind":"applied","q":"デジタル署名を検証する鍵は？","options":["署名者の秘密鍵","受信者の公開鍵","受信者の秘密鍵","署名者の公開鍵"],"correct":3,"explain":"署名者の秘密鍵で署名し対応する公開鍵で検証。"},{"id":"U-11-3","chapter":11,"kind":"applied","q":"パスワードと所持する認証器を組み合わせる方式は？","options":["多要素認証","単一要素認証","認可のみ","暗号化のみ"],"correct":0,"explain":"知識要素と所持要素を組み合わせている。"},{"id":"U-11-4","chapter":11,"kind":"applied","q":"認証済み利用者に意図しない要求を送らせる攻撃への代表的対策は？","options":["SQLプレースホルダのみ","CSRFトークン","パスワード長変更のみ","画像圧縮"],"correct":1,"explain":"CSRFトークンを検証して意図しない要求を防ぐ。"},{"id":"U-11-5","chapter":11,"kind":"applied","q":"複数機器のログを集中・相関分析する仕組みは？","options":["DHCP","RAID","SIEM","コンパイラ"],"correct":2,"explain":"SIEMはセキュリティ情報・イベント管理。ログを統合分析する。"},{"id":"U-11-6","chapter":11,"kind":"applied","q":"退職者IDが有効なまま残る問題への直接的な対策は？","options":["画面解像度向上","DB索引追加","年1回パスワード変更のみ","退職情報と連動してIDを無効化"],"correct":3,"explain":"原因である退職者の有効なIDを直接無効化する。"},{"id":"U-11-X01","chapter":11,"kind":"applied","q":"対策後も残るリスクは？","options":["残留リスク","脅威","脆弱性","誤検知率"],"correct":0,"explain":"残留リスクを評価し追加対策または受容を判断する。"},{"id":"U-11-X02","chapter":11,"kind":"applied","q":"不審な通信を検知するだけでなく遮断する仕組みは？","options":["IDS","IPS","DNS","NTP"],"correct":1,"explain":"IPSは侵入防止、IDSは主に侵入検知。"},{"id":"U-11-Y01","chapter":11,"kind":"applied","q":"内部不正のトライアングルの三要素は？","options":["機会・動機・正当化","機密性・完全性・可用性","計画・実行・改善","認証・認可・監査"],"correct":0,"explain":"不正が生じる要因を理解し機会等を減らす。"},{"id":"U-11-Y02","chapter":11,"kind":"applied","q":"過去の正当な通信を再利用する攻撃への対策として有用なものは？","options":["通信内容の圧縮のみ","使い捨ての乱数等による鮮度確認","画面色の変更","ログの削除"],"correct":1,"explain":"同じ認証要求が再利用されないよう鮮度を確認する。"},{"id":"U-11-Y03","chapter":11,"kind":"applied","q":"同じハッシュ値を持つ任意の二つの入力を見つけにくい性質は？","options":["原像発見困難性だけ","可逆性","衝突発見困難性","可用性"],"correct":2,"explain":"衝突は任意の異なる二入力のハッシュ値が等しいこと。"},{"id":"U-11-Y04","chapter":11,"kind":"applied","q":"証明書が失効していないか個別に問い合わせる方式は？","options":["SMTP","NAT","SJF","OCSP"],"correct":3,"explain":"Online Certificate Status Protocol（オンライン証明書状態確認プロトコル）。"},{"id":"U-11-Y05","chapter":11,"kind":"applied","q":"1回300万円の損失、年間発生頻度0.2回の年間予想損失額は？","options":["60万円","1500万円","300万円","6万円"],"correct":0,"explain":"300×0.2＝60万円。"},{"id":"U-11-Y06","chapter":11,"kind":"applied","q":"カード会員データの保護に関する代表的な業界基準は？","options":["ISO 9001のみ","PCI DSS","IEEE 802.1Q","SQL"],"correct":1,"explain":"決済カード業界のデータセキュリティ基準。"},{"id":"U-11-Y07","chapter":11,"kind":"applied","q":"コモンクライテリアの評価保証レベルを示す略称は？","options":["RPO","FAR","EAL","MIB"],"correct":2,"explain":"Evaluation Assurance Level（評価保証レベル）。"},{"id":"U-11-Y08","chapter":11,"kind":"applied","q":"ソフトウェアの構成部品や版の情報を整理するものは？","options":["SLA","MIB","RACI","SBOM"],"correct":3,"explain":"ソフトウェア部品表により依存関係等を把握する。"},{"id":"U-11-Y09","chapter":11,"kind":"applied","q":"メールの表示Fromと認証ドメインの整合性を確認する仕組みは？","options":["DMARC","NTP","IMAP","ARP"],"correct":0,"explain":"SPF/DKIMの認証結果と表示Fromのドメイン整合性等を評価する。"},{"id":"U-11-Y10","chapter":11,"kind":"applied","q":"ブラウザの異なるオリジン間の資源共有をサーバが許可する仕組みは？","options":["HSTS","CORS","DKIM","SNMP"],"correct":1,"explain":"CORSはブラウザのオリジン間アクセス制限を許可に従って緩和する。"}],"deepIntro":"セキュリティは暗号用語の暗記ではなく「脅威→脆弱性→侵害経路→影響→対策→監視・対応」の因果関係で理解する。科目B必須。","deep":[{"id":"11-1","title":"情報資産・リスク・管理策","explain":"\u003cp>情報セキュリティの3要素CIAはConfidentiality（機密性）、Integrity（完全性）、Availability（可用性）。機密性は不正閲覧防止、完全性は意図しない改変防止、可用性は必要なとき利用できること。脅威は攻撃・事故などの原因、脆弱性は悪用される弱点、リスクは結果として生じ得る損害の可能性を指す。資産価値・発生可能性・影響度に応じて優先度を決める。\u003c/p>\n\u003cp>リスク対応は回避（活動中止）、低減（管理策で可能性や影響を下げる）、移転/共有（保険・委託等）、受容（残余リスクを承認）。対策を導入してもリスクはゼロにならない。ISMS（Information Security Management System：情報セキュリティマネジメントシステム）は方針・リスク評価・管理策・監査・改善の継続活動。\u003c/p>\n","worked":"\u003cp>個人情報の入ったノートPC紛失リスクに対し、ディスク暗号化と持出し制限は低減、そもそも持ち出さない運用は回避になり得る。暗号化は紛失そのものを防がず、漏えいの影響を抑える。\u003c/p>\n","prompt":"パッチを当てたら「リスク＝ゼロ」か。","answer":"\u003cp>違う。設定不備、未知の脆弱性、人的誤操作などの残余リスクがある。\u003c/p>\n","beginner":{"scenario":"銀行で口座情報漏えいは機密性、残高改ざんは完全性、障害で送金不能は可用性の問題。守る性質に応じ対策を選ぶ。","trap":"脅威は被害の原因、脆弱性は弱点、リスクは影響や可能性を含む。","quizId":"U-11-1"},"textbook":[{"heading":"何を守るのか","body":"情報セキュリティの基本は機密性（許可された者だけが情報へアクセスできる）、完全性（情報が正確・完全に保たれる）、可用性（必要時に利用できる）のCIAです。真正性は主体やデータが主張通りか確認できる性質、否認防止は後から行為を否定しにくくする性質です。"},{"heading":"リスクを構造化する","body":"資産は保護対象（顧客データ・端末・サービスなど）、脅威は被害をもたらす可能性のある事象、脆弱性は悪用され得る弱点です。例えば顧客データが資産、窃取が脅威、過剰な閲覧権限が脆弱性です。リスク評価では発生可能性や影響を考慮し対策の優先度を決めます。"},{"heading":"対策を組み合わせる","body":"技術的対策は暗号やアクセス制御、人的対策は教育、組織的対策は方針・手続、物理的対策は入退室管理などです。予防だけでなく検知・対応・復旧も設計します。リスク回避は危険な活動を中止、低減は可能性・影響を小さくし、移転・共有は保険等、受容は残るリスクを認める判断です。"}]},{"id":"11-2","title":"暗号・ハッシュ・署名・公開鍵基盤","explain":"\u003cp>共通鍵暗号は同じ秘密鍵で暗号化と復号を行い、大量データの高速処理に適する。公開鍵暗号は公開鍵・秘密鍵の対を使い、鍵配送や電子署名の仕組みに用いる。実用的なTLSは公開鍵技術で認証や鍵共有を行い、データ通信は共通鍵で暗号化するなどの組合せを使う。鍵管理が不適切なら暗号方式だけ強くしても安全にならない。\u003c/p>\n\u003cp>ハッシュ関数は任意長データから固定長のダイジェストを求める一方向の関数。暗号学的ハッシュに求められる耐衝突性は「異なる入力で同じ値を作りにくい」性質。パスワード保管には単純ハッシュではなく、ソルトと計算コストを設けたArgon2等のパスワードハッシュ方式を使う。電子署名は秘密鍵で署名し、公開鍵で検証することで作成者認証や改ざん検出を助ける。公開鍵証明書はCA（Certification Authority：認証局）が公開鍵と主体情報の結び付きを保証する仕組み。\u003c/p>\n","worked":"\u003cp>AからBへ機密情報を送るとき、受信者Bの公開鍵で暗号化すれば対応するBの秘密鍵で復号できる。Aの「署名」はAの秘密鍵で行い、Aの公開鍵で検証する。暗号化と署名で鍵の向きが異なる。\u003c/p>\n","prompt":"SHA-256をパスワードに1回かけて保存すれば安全か。","answer":"\u003cp>不十分。パスワード推測への耐性を高める専用のパスワードハッシュ方式やソルトが必要。\u003c/p>\n","beginner":{"scenario":"Bへの秘密文書はBの公開鍵で暗号化しBの秘密鍵で復号する方式を使える。Aの署名はAの秘密鍵で作りAの公開鍵で検証する。","trap":"暗号化と署名では目的と鍵の使い方が違う。","quizId":"U-11-2","lab":{"title":"暗号化と署名の鍵を混同しない","problem":"AがBに秘密文書を送り、Bが送信者Aと改ざんの有無を確認したい。どの鍵を使うか。","steps":["Aは文書に対し自分の秘密鍵でデジタル署名を生成する。","文書と署名を秘密にするため、Bの公開鍵を使う暗号化方式などで保護する。実際には共通鍵と組み合わせる方式が多い。","Bは自分の秘密鍵で復号に必要な情報を取得し文書を復号する。","BはAの公開鍵で署名を検証する。証明書などで公開鍵がAのものか確認する。"],"answer":"暗号化は受信者Bの公開鍵系、署名は送信者Aの秘密鍵","check":"署名と暗号化の目的・鍵を別々に追う。具体的な鍵利用は方式によって異なる。"}},"textbook":[{"heading":"暗号化は内容を守る","body":"共通鍵暗号は暗号化と復号に同じ秘密鍵を使います。AES（高度暗号化標準）が代表例で高速ですが、通信相手との鍵共有が課題です。公開鍵暗号は公開鍵と秘密鍵の組を使い、公開鍵で暗号化された情報を対応する秘密鍵で復号できる方式などがあります。RSAや楕円曲線を利用した暗号方式が代表例です。実際の通信は公開鍵技術による鍵確立と共通鍵暗号を組み合わせます。"},{"heading":"ハッシュと署名","body":"ハッシュ関数は任意長データから固定長の要約値を計算し、元データの小さな変化で出力が変わります。暗号化のように元へ戻す仕組みではありません。デジタル署名は署名者の秘密鍵で署名を生成し、公開鍵で検証します。内容を秘密にすることが目的ではなく、署名者との関連と改ざんの有無を確認します。MAC（メッセージ認証コード）は共通の秘密鍵を使って完全性と認証を確認します。"},{"heading":"公開鍵が本人のものか","body":"攻撃者が偽の公開鍵を配れば暗号や署名を悪用できるため、PKI（公開鍵基盤）では認証局が公開鍵と主体を結び付けた証明書を発行します。利用側は信頼連鎖、期限、対象名、失効情報などを確認します。パスワード保存ではソルト付きの専用ハッシュ処理などで総当たりに対する耐性を確保します。"}],"walkthrough":{"heading":"暗号・署名・ハッシュを使い分ける","body":"AがBに文書を送るとき、盗み見を防ぐには暗号化します。Bだけが復号できる仕組みとしてBの公開鍵を用いる暗号方式があります。Aが作ったことを確認したい場合はAの秘密鍵でデジタル署名を作り、BがAの公開鍵で検証します。単なるハッシュ値を添付すると途中の偶発的な変化は検出できますが、攻撃者が文書もハッシュ値も変更できる場合は不十分です。共通の秘密鍵を共有するならMAC（メッセージ認証コード）を用いて改ざんと認証を確認できます。ただし両者が同じ鍵を持つので、第三者に対する署名者の区別という点でデジタル署名と違います。","cols":["目的","技術","鍵"],"rows":[["秘密にする","共通鍵暗号","共有秘密鍵"],["秘密にする","公開鍵暗号の例","受信者の公開鍵・秘密鍵"],["送信者と改ざんを検証","デジタル署名","署名者の秘密鍵・公開鍵"],["共有鍵で改ざんと認証を確認","MAC","共有秘密鍵"],["データの要約","ハッシュ","通常は鍵なし"]]}},{"id":"11-3","title":"認証・認可・アクセス制御","explain":"\u003cp>認証（Authentication）は「誰か」の確認、認可（Authorization）は「何をしてよいか」の判断。多要素認証MFA（Multi-Factor Authentication）は知識要素（パスワード）・所持要素（端末・鍵）・生体要素（指紋等）の異なる要素を組み合わせる。同じ種類のパスワードを2つ要求しても多要素にはならない。SSO（Single Sign-On：一度の認証で複数システムを利用）は利便性を高めるが、認証基盤の保護が重要。\u003c/p>\n\u003cp>アクセス制御はDAC（任意アクセス制御）、MAC（強制アクセス制御）、RBAC（Role-Based Access Control：役割ベース制御）など。最小権限は業務に必要な権限のみ付与する原則。ゼロトラストはネットワーク内だから信頼するのではなく、継続的に認証・端末状態・アクセス状況を評価する設計思想。認証済みでもすべての資源への権限を与えない。\u003c/p>\n","worked":"\u003cp>経理担当に請求書の閲覧は許可し、承認は責任者に限定する。ユーザーごとに例外を大量設定するより、RBACで役割に権限を紐付けると管理しやすい。\u003c/p>\n","prompt":"パスワード＋秘密の質問は必ずMFAか。","answer":"\u003cp>どちらも知識要素なので、異なる要素を組み合わせたとはいえない。\u003c/p>\n","beginner":{"scenario":"社員IDで本人確認し、給与担当者だけ給与データを更新できるようにする。異動時は旧権限を外し新業務の権限だけを与える。","trap":"パスワードと秘密の質問は両方知識要素。異なる種類の要素を使う。","quizId":"U-11-3"},"textbook":[{"heading":"認証と認可の違い","body":"認証は誰かを確かめ、認可はその人が何をしてよいかを判定します。社員が正しくログインしても、人事データを読む権限がなければアクセスを拒否します。本人確認には知識（パスワード）、所持（認証器）、生体（指紋等）などの要素を用い、異なる種類を組み合わせるのが多要素認証です。"},{"heading":"権限を管理する","body":"最小権限は業務に必要な最小限の権限だけを付与する考え方です。RBAC（役割に基づくアクセス制御）は職務などの役割へ権限を割り当てます。アクセス制御リストは資源ごとに誰がどの操作をできるか管理します。異動・退職時は不要な権限を解除し、定期的な棚卸しで過剰権限を確認します。"},{"heading":"認証の連携","body":"SSO（シングルサインオン）は一度の認証で複数サービスを利用しやすくする仕組みです。SAMLは認証情報等の連携に用いる標準、OAuth 2.0は第三者アプリへの権限委譲の枠組み、OpenID ConnectはOAuth 2.0の上で認証を行う仕組みです。SSOが侵害されると影響が広がり得るので多要素認証や監視が重要です。"}]},{"id":"11-4","title":"代表的な攻撃・Web脆弱性","explain":"\u003cp>SQLインジェクションは利用者入力をSQL文の構文として解釈させ、不正な問合せを実行させる攻撃。対策の基本はプレースホルダを用いたパラメータ化クエリ。XSS（Cross-Site Scripting：クロスサイトスクリプティング）は利用者ブラウザで意図しないスクリプトを実行させる攻撃で、文脈に応じた出力エスケープや安全なDOM操作を用いる。CSRF（Cross-Site Request Forgery：クロスサイトリクエストフォージェリ）はログイン状態を悪用して意図しない操作を送信させるため、トークンやSameSite Cookieなどで対処する。\u003c/p>\n\u003cp>標的型メール・フィッシングは認証情報を盗み、ランサムウェアは暗号化・窃取・恐喝を行うことがある。サプライチェーン攻撃は正規の依存先・更新経路を悪用する。DoS/DDoSは資源を過負荷にして可用性を損なう。WAF（Web Application Firewall：Webアプリ防御）やIDS/IPS（侵入検知/侵入防止）は補助策であり、根本的な脆弱性修正を代替しない。\u003c/p>\n","worked":"\u003cp>Webアプリが\u003ccode>SELECT * FROM user WHERE name='入力値'\u003c/code>の文字連結でクエリを生成すると、特殊文字を含む入力で構文が変わり得る。パラメータ化すれば入力は値として処理され、SQL命令として解釈されにくくなる。\u003c/p>\n","prompt":"全てのXSSを防ぐのに入力の`\u003c`だけ削除すれば十分か。","answer":"\u003cp>不十分。HTML・属性・URL・JavaScriptなど出力文脈に応じた適切な処理が必要。\u003c/p>\n","beginner":{"scenario":"入力をSQL文に直接連結すると入力が命令の一部として解釈され得る。プレースホルダで命令と値を分ける。画面出力は文脈に合うエスケープを使う。","trap":"SQLインジェクション、XSS、CSRFは原因・対策が異なる。","quizId":"U-11-4"},"textbook":[{"heading":"攻撃を原因別に理解する","body":"マルウェアは悪意のあるソフトウェアの総称で、ランサムウェアはデータ暗号化や窃取等による脅迫を行います。フィッシングは偽のメール・サイトなどで認証情報をだまし取る手法、総当たり攻撃は多数の候補を試し、パスワードリスト攻撃は流出済み認証情報の使い回しを狙います。教育、多要素認証、更新、アクセス制限等を組み合わせます。"},{"heading":"Webアプリの代表的脆弱性","body":"SQLインジェクションは入力がSQL命令として解釈される問題で、プレースホルダによる命令と値の分離が基本対策です。XSS（クロスサイトスクリプティング）は入力などがブラウザで意図しないスクリプトとして解釈される問題で、出力先に応じたエスケープ等を行います。CSRF（クロスサイトリクエストフォージェリ）は認証済み利用者のブラウザに意図しない要求を送らせる問題で、トークン検証やCookieの適切な設定等を用います。"},{"heading":"他の攻撃との比較","body":"DoSはサービスの利用を妨げ、DDoSは多数の発信元を利用する分散型です。サプライチェーン攻撃は委託先やソフトウェア供給経路の侵害を通じ影響を及ぼします。ゼロデイ攻撃は修正手段が十分普及していない脆弱性を狙うものなどを指します。パッチ適用だけでなくネットワーク分離、権限管理、監視、バックアップを組み合わせます。"}],"walkthrough":{"heading":"攻撃の原因と対策を対応させる","body":"問題文に「入力値がデータベースの命令として解釈された」とあればSQLインジェクションを考えます。「閲覧者のブラウザで意図しないスクリプトが実行された」ならXSSです。「ログイン済み利用者が知らないうちに操作要求を送った」ならCSRFを考えます。対策が違うのは、悪意ある情報が解釈される場所と、攻撃が成立する条件が違うからです。SQLでは命令と値を分離、XSSでは出力の文脈に合ったエスケープ等、CSRFでは意図しない要求を検証します。すべての問題を入力検証だけで解決できると考えず、原因に直接対応する対策を選びます。","cols":["攻撃","問題が起こる場所","基本対策"],"rows":[["SQLインジェクション","DBの問い合わせ処理","パラメータ化"],["XSS","利用者のブラウザ","文脈に合う出力エスケープ等"],["CSRF","認証済みの要求","トークン検証等"],["パスワードリスト攻撃","認証機能","使い回し防止・多要素認証"]]}},{"id":"11-5","title":"ネットワーク防御・ログ・インシデント対応","explain":"\u003cp>ファイアウォールはIP・ポート・状態などに基づき通信を制御する。DMZ（非武装地帯）は外部公開サーバを内部ネットワークから分離するためのネットワーク区画。WAFはHTTP等のアプリ通信を検査し、IDSは不審通信を検知、IPSは条件に応じて遮断する。EDR（Endpoint Detection and Response：端末の検知・対応）は端末上の不審な挙動の記録と調査・隔離を助ける。SIEM（Security Information and Event Management：セキュリティ情報・イベント管理）はログを横断的に集約・相関分析する。\u003c/p>\n\u003cp>インシデント対応は準備→検知と分析→封じ込め→根絶と復旧→事後改善の順に考える。事実と推測を分離し、証拠保全・時刻同期・影響範囲特定を優先する。重要な認証情報が漏えいした恐れがあれば、無効化・再発行・権限確認・不正利用調査を行う。ログがない段階で「漏えいはなかった」と断定しない。\u003c/p>\n","worked":"\u003cp>依存パッケージ更新後に端末から不審な外部通信が発生。まず更新の配布停止、端末の適切な隔離、通信ログ/プロセス/更新履歴の保全、トークン無効化の要否判断を並行する。再インストールだけ先に行うと証拠を失う場合がある。\u003c/p>\n","prompt":"WAFで不正入力を遮断していればアプリのSQL構文連結を放置してよいか。","answer":"\u003cp>だめ。WAFの検知回避を前提に、アプリ側のパラメータ化等が必要。\u003c/p>\n","beginner":{"scenario":"不審通信を検知したら端末の隔離と証拠保全、影響調査、原因の除去、認証情報の処置、復旧を行う。","trap":"直ちに初期化すると証拠を失うことがある。","quizId":"U-11-5"},"textbook":[{"heading":"防御の層を分ける","body":"ファイアウォールは通信の許可・拒否を制御します。IDS（侵入検知システム）は不審な通信等を検出し、IPS（侵入防止システム）は遮断等も行います。WAF（ウェブアプリケーションファイアウォール）はHTTP要求等を検査しWebアプリを保護、EDR（端末の検知・対応）は端末の挙動を監視・調査します。守る場所が異なるため併用します。"},{"heading":"ログを集める理由","body":"単独の異常ログでは原因を判断できないことがあります。認証、端末、通信、サーバのログを時系列で突き合わせると影響範囲を調べやすくなります。SIEM（セキュリティ情報・イベント管理）はログの集約・分析を支援します。時刻同期、改ざん防止、保存期間、閲覧権限を整えます。"},{"heading":"事故対応の流れ","body":"事前準備、検知・分析、封じ込め、根絶・復旧、事後改善を行います。不審端末は適切に隔離して証拠保全し、侵害された認証情報を無効化し原因と範囲を確認します。必要に応じ関係者や法令に基づく報告を行います。復旧では安全なバックアップや修正済み環境を使い再侵害を防ぎます。CSIRTは事故対応を組織的に進める体制です。"}]},{"id":"11-6","title":"科目Bの文章読解と対策選定","explain":"\u003cp>科目Bのセキュリティ問題は、文章と構成図から「事象の時系列」「信頼境界」「認証情報が届く範囲」「管理策の不足」を特定する。設問で「原因を答えよ」とあれば観測できた事実と因果関係を書く。「対策を答えよ」とあれば攻撃経路を断つ具体策を書く。「確認項目」なら必要なログや設定を挙げる。抽象的な「セキュリティ強化」「教育を徹底」は点になりにくい。\u003c/p>\n\u003cp>対策は予防・検知・封じ込め・復旧に分類し、問題のどこへ効くかを説明する。最小権限は侵害後の横展開を抑え、多要素認証は認証情報単独漏えいへの対抗、パッチは既知脆弱性の除去、ログ監視は発見までの時間短縮を狙う。脆弱性がないことや被害がなかったことは、証拠がなければ結論にしない。\u003c/p>\n","worked":"\u003cp>「攻撃者が委託先のVPNアカウントで社内へ入り、管理サーバへアクセスした。委託先アカウントには本番系の管理権限があった」。このとき再発防止策は「委託先へ必要最小限のアクセス権限だけ付与し、管理系へのアクセスを分離する」。本文にない「ウイルスメールを遮断する」は原因経路に対応していない。\u003c/p>\n","prompt":"「ログイン後に横展開した」の対策として「パスワードを複雑にする」だけで十分か。","answer":"\u003cp>十分ではない。横展開を抑えるアクセス権分離・ネットワーク分離・監視・多要素認証なども検討する。\u003c/p>\n","beginner":{"scenario":"退職者IDが残る事例では、資産は社内システム、脅威は不正利用、弱点はID削除漏れ。退職情報に連動してIDを停止する。","trap":"記述では対象と動作を書く。「強化する」だけでは不十分。","quizId":"U-11-6"},"textbook":[{"heading":"科目Bの問題文は何を聞いているか","body":"セキュリティ事例では資産、構成、利用者、権限、ログ、発生した事象が問題文に示されます。まず正常時にどう動くべきか理解し、異常時の事実との差を探します。文章中の事実から原因を特定し、断定できない場合は可能性と追加確認を区別します。"},{"heading":"答えの作り方","body":"設問が「原因」を聞くなら、どの条件・設定がなぜ問題を起こすか書きます。「対策」を聞くなら対象・動作・目的を具体化します。退職者IDの事例なら「人事の退職情報と連携して退職日にアカウントを無効化し、不正利用を防ぐ」と書けます。「アクセス制御を強化する」だけでは対象も手順も曖昧です。"},{"heading":"記述を自己採点する","body":"模範解答と単語が完全一致する必要はありませんが、設問の要求した原因・動作・対象を含み、問題文の条件と矛盾しないことを確認します。文字数制限は結論と根拠を短くまとめるための制約です。実際の本試験過去問で長文と資料を読む練習も行います。"}]},{"id":"11-X01","title":"セキュリティ管理と技術評価","explain":"\u003cp>ISMS（情報セキュリティマネジメントシステム）は方針・リスク評価・対策・監視・改善を組織的に行う。リスクアセスメントは資産・脅威・脆弱性・影響・発生可能性を評価する。対応には回避・低減・移転（共有）・受容がある。残留リスクを確認して責任者が判断する。\u003c/p>\u003cp>CVSS（共通脆弱性評価システム）は脆弱性の深刻度を共通尺度で評価するが、組織固有の業務影響とは別。コモンクライテリア（ISO/IEC 15408）はIT製品のセキュリティ機能・保証を評価する枠組み。脆弱性診断とペネトレーションテストは目的や方法が異なる。ISMS認証は組織の管理の仕組みに対するもの。\u003c/p>","worked":"\u003cp>公開サーバの脆弱性のCVSSが高くても、対策順位は外部到達性、資産重要度、悪用状況などと合わせて判断する。\u003c/p>","prompt":"CVSSの主目的は？","answer":"\u003cp>脆弱性の深刻度を共通尺度で評価すること。\u003c/p>","beginner":{"scenario":"公開Webと隔離試験機に同じ脆弱性があっても外部到達性や業務影響が違うので対応順が異なる場合がある。","trap":"CVSSは脆弱性の深刻度で組織固有リスクそのものではない。","quizId":"U-11-X01"},"textbook":[{"heading":"セキュリティを組織で管理する","body":"ISMS（情報セキュリティマネジメントシステム）は方針、責任、リスク評価、対策、監視、継続改善を組織として運用する仕組みです。ISO/IEC 27001はその要求事項を定め、27002は管理策の指針を提供します。適用範囲を定め、資産・脅威・弱点を確認してリスク対応を選びます。"},{"heading":"脆弱性の深刻度と業務リスク","body":"CVSS（共通脆弱性評価システム）は悪用条件や影響などから脆弱性の深刻度を評価します。公開サーバの重大な脆弱性と隔離された試験機の同じ脆弱性では、実際の業務リスクや対処の優先度が異なり得ます。残留リスクは対策後も残るリスクで、責任者が受容または追加対応を判断します。"},{"heading":"評価と改善","body":"脆弱性診断は既知の弱点等を検出し、ペネトレーションテストは許可された範囲で攻撃者の観点から実際に弱点を検証します。コモンクライテリア（ISO/IEC 15408）はIT製品のセキュリティ機能と保証を評価する枠組みです。ISMS認証は組織の管理の仕組みを評価し、個々の製品の完全な安全を保証するものではありません。"}]},{"id":"11-X02","title":"暗号・認証実装・防御機器","explain":"\u003cp>AESは共通鍵暗号、RSAや楕円曲線暗号は公開鍵暗号の代表例。ハッシュはデータの要約値を生成し、署名の検証や完全性確認に使う。MAC（メッセージ認証コード）は共有鍵で完全性・認証を確認する。PKI（公開鍵基盤）では認証局の証明書を検証し公開鍵と主体を結び付ける。失効情報も確認する。\u003c/p>\u003cp>IDS（侵入検知システム）は異常を検知し、IPS（侵入防止システム）は遮断も行う。WAFはWebアプリへの攻撃を防御する。EDRは端末上の不審活動を監視し対応を支援する。認証においてパスワードだけでなく異なる要素を組み合わせる多要素認証、SSO（シングルサインオン）、アクセス権管理、ログ監視を適切に組み合わせる。\u003c/p>","worked":"\u003cp>認証局が発行した証明書でも有効期限・対象ホスト名・信頼連鎖などの確認が必要。暗号化だけでは相手が正規のサービスか保証しない。\u003c/p>","prompt":"WebアプリのHTTP要求を検査して攻撃を抑える装置は？","answer":"\u003cp>WAF（Webアプリケーションファイアウォール）。\u003c/p>","beginner":{"scenario":"通信保護にはTLS、公開鍵の所有者確認には証明書、Web要求検査にはWAF、端末監視にはEDRを組み合わせる。","trap":"ハッシュ値だけでは本文とハッシュの両方を改変されると真正性を保証できない。","quizId":"U-11-X02"},"textbook":[{"heading":"通信路を保護する実装","body":"TLSはサーバ証明書の検証や鍵交換などで安全な通信路を確立し、共通鍵を用いてデータの機密性・完全性等を保護します。証明書の検証を無効にすると偽サーバを識別できなくなる恐れがあります。暗号化された通信でも接続先の正当性確認、端末やサーバの管理が必要です。"},{"heading":"認証器とセッション","body":"パスワードの使い回しは流出時の影響を広げます。多要素認証やフィッシング耐性を持つ認証方式などを採用し、セッションIDは推測困難な値にして保護し、ログアウトや期限切れで無効化します。CookieのSecure・HttpOnly・SameSiteなどの属性は用途に応じて設定します。"},{"heading":"多層防御とゼロトラスト","body":"ネットワーク内にいるから信頼するのではなく、利用者・端末・要求ごとに必要な権限や状態を確認するゼロトラストの考え方があります。ネットワーク分割、WAF、端末監視、最小権限、ログ、バックアップを組み合わせ、単独対策が破られても影響を限定します。暗号の選択は標準・鍵管理・更新手順を含めて考えます。"}]},{"id":"11-Y01","title":"マルウェア・内部不正・攻撃の分類","explain":"\u003cp>ウイルスは他のファイル等に寄生して増殖するもの、ワームはネットワーク等で自己拡散するもの、トロイの木馬は正規ソフトのように見せかける不正プログラム。ボットは外部から制御される端末等、ボットネットはその集団、C&amp;Cサーバは指令や通信を行う基盤。RAT（遠隔操作型トロイの木馬）、スパイウェア、キーロガーは遠隔操作や情報収集等に使われ得る。ルートキットは不正活動の隠蔽等、バックドアは正規手続を経ずアクセスする経路。ファイルレスマルウェアはメモリや既存機能を悪用するなど実行ファイルだけの検査で発見しにくい場合がある。\u003c/p>","worked":"\u003cp>\u003cb>取引先から振込先変更を求めるメールが届いた。\u003c/b>\u003c/p>\u003cp>既知の電話番号など別の信頼できる経路で確認し、複数人の承認手順を適用する。\u003c/p>","prompt":"不正のトライアングルの機会を減らす対策を一つ挙げよ。","answer":"\u003cp>申請者と承認者を分ける職務分掌など。\u003c/p>","textbook":[{"heading":"被害の原因を理解する","body":"ウイルスは他のファイル等に寄生して増殖するもの、ワームはネットワーク等で自己拡散するもの、トロイの木馬は正規ソフトのように見せかける不正プログラム。ボットは外部から制御される端末等、ボットネットはその集団、C&Cサーバは指令や通信を行う基盤。RAT（遠隔操作型トロイの木馬）、スパイウェア、キーロガーは遠隔操作や情報収集等に使われ得る。ルートキットは不正活動の隠蔽等、バックドアは正規手続を経ずアクセスする経路。ファイルレスマルウェアはメモリや既存機能を悪用するなど実行ファイルだけの検査で発見しにくい場合がある。"},{"heading":"人と組織に起因する被害","body":"BEC（ビジネスメール詐欺）は取引先や経営者を装い送金などを誘導する。スミッシングはSMSを用いたフィッシング。ソーシャルエンジニアリングは人の心理や行動を悪用する。内部不正のトライアングルは機会、動機、正当化の三要素。職務分掌、権限最小化、相談・通報の仕組み、ログ監査を組み合わせる。シャドーITは組織が把握・承認していないIT利用で、データ管理等にリスクがある。"},{"heading":"異なる攻撃の目的","body":"ランサムウェアはデータ暗号化や窃取などで脅迫し、二重脅迫は暗号化に加え公開等を脅す。RaaSはランサムウェアをサービスとして提供する犯罪モデル。APT（持続的標的型脅威）は特定組織等を長期間狙う活動を指し、ラテラルムーブメントは侵入後の内部での移動。水飲み場型攻撃は標的が利用するサイト等を悪用する。サイドチャネル攻撃は時間・電力等の副次情報を利用する。脅威モデリングで資産・信頼境界・想定脅威を整理し、設計段階から対策する。"}],"beginner":{"scenario":"被害の原因を理解するから順に、人と組織に起因する被害、異なる攻撃の目的を理解する。","trap":"不正が生じる要因を理解し機会等を減らす。","quizId":"U-11-Y01"}},{"id":"11-Y02","title":"認証・Web・通信・AIへの脅威","explain":"\u003cp>辞書攻撃はよく使われる語等の候補、総当たりは多数の組合せ、リバースブルートフォースは一つのパスワードを多数のアカウントに試す攻撃。レインボーテーブルは事前計算したハッシュの対応を利用する。流出済み認証情報の使い回しを狙うのはパスワードリスト攻撃。専用パスワードハッシュとソルト、試行制限、多要素認証、使い回し防止を組み合わせる。クリックジャッキングは意図しない画面操作を誘導する攻撃で、フレーム埋込み制限等が対策。ディレクトリトラバーサルは意図しないファイル参照、OSコマンドインジェクションは入力がOS命令として解釈される問題。入力を命令と分離し権限を限定する。\u003c/p>","worked":"\u003cp>\u003cb>メールで届いたリンクから偽のログイン画面へ誘導された。\u003c/b>\u003c/p>\u003cp>フィッシングの例。既知の公式経路へ直接アクセスし、組織へ報告する。\u003c/p>","prompt":"使い回した漏えいパスワードを悪用する攻撃は？","answer":"\u003cp>パスワードリスト攻撃。サービスごとに異なるパスワードと多要素認証が対策になる。\u003c/p>","textbook":[{"heading":"攻撃と対策を対応付ける","body":"辞書攻撃はよく使われる語等の候補、総当たりは多数の組合せ、リバースブルートフォースは一つのパスワードを多数のアカウントに試す攻撃。レインボーテーブルは事前計算したハッシュの対応を利用する。流出済み認証情報の使い回しを狙うのはパスワードリスト攻撃。専用パスワードハッシュとソルト、試行制限、多要素認証、使い回し防止を組み合わせる。クリックジャッキングは意図しない画面操作を誘導する攻撃で、フレーム埋込み制限等が対策。ディレクトリトラバーサルは意図しないファイル参照、OSコマンドインジェクションは入力がOS命令として解釈される問題。入力を命令と分離し権限を限定する。"},{"heading":"通信経路の脅威","body":"中間者攻撃は通信相手の間に介在して盗聴・改ざん等を行う。MITB（ブラウザ内の中間者攻撃）は端末のブラウザ内で処理を改変するため通信路暗号だけでは不十分。IPスプーフィングは送信元IPを偽装、DNSキャッシュポイズニングは名前解決情報を不正に変える。セッションハイジャックはセッション情報を悪用、リプレイ攻撃は過去の正当な通信を再利用する。リフレクション攻撃は他サーバの応答を標的へ集中させるサービス妨害等。暗号化、認証、使い捨て値、通信制御、監視を目的別に用いる。"},{"heading":"AIに関わる脅威","body":"ディープフェイクは生成・改変された音声や映像で、本人確認には別経路での確認等が重要。敵対的サンプルはモデルの誤判断を誘う入力、データ汚染は学習データ等に悪影響を与える。プロンプトインジェクションはモデルが処理する指示・外部情報により意図しない動作を誘う問題。AIの出力を直接権限のある操作へ接続せず、入力・出力の検証、権限の制限、人の承認等を組み合わせる。AIを利用した検知技術とAIそのものを守る技術を区別する。"}],"beginner":{"scenario":"攻撃と対策を対応付けるから順に、通信経路の脅威、AIに関わる脅威を理解する。","trap":"同じ認証要求が再利用されないよう鮮度を確認する。","quizId":"U-11-Y02"}},{"id":"11-Y03","title":"暗号方式・鍵交換・ハッシュの安全性","explain":"\u003cp>ブロック暗号は固定長のブロックに対する変換を行う。AES（高度暗号化標準）は128ビットブロックを扱う共通鍵暗号。CBCモードは前の暗号文ブロック等を利用して連鎖させ、CTRモードはカウンタ等を暗号化した値と平文を組み合わせる。同一鍵での初期化値等の扱いは方式の仕様に従い、CTRでは同じ鍵とノンスの再利用を避ける。ストリーム暗号は鍵ストリームとデータを組み合わせる。暗号化だけでは改ざん検出を保証しないため認証付き暗号等を用いる。\u003c/p>","worked":"\u003cp>\u003cb>暗号文を第三者が変更していないことも確認したい。\u003c/b>\u003c/p>\u003cp>認証付き暗号や適切なメッセージ認証等を使用し、鍵・初期化値も仕様に沿って管理する。\u003c/p>","prompt":"DH鍵共有だけでは何が保証されないか。","answer":"\u003cp>通信相手の真正性。認証なしでは中間者攻撃等への対策が不足する。\u003c/p>","textbook":[{"heading":"共通鍵でどのように暗号化するか","body":"ブロック暗号は固定長のブロックに対する変換を行う。AES（高度暗号化標準）は128ビットブロックを扱う共通鍵暗号。CBCモードは前の暗号文ブロック等を利用して連鎖させ、CTRモードはカウンタ等を暗号化した値と平文を組み合わせる。同一鍵での初期化値等の扱いは方式の仕様に従い、CTRでは同じ鍵とノンスの再利用を避ける。ストリーム暗号は鍵ストリームとデータを組み合わせる。暗号化だけでは改ざん検出を保証しないため認証付き暗号等を用いる。"},{"heading":"鍵を共有する","body":"Diffie-Hellman（DH）鍵共有は公開情報を交換し共通の秘密を得る方式。単独では相手の本人性を確認できないので署名等による認証と組み合わせる。公開鍵方式と高速な共通鍵方式を組み合わせるハイブリッド暗号は、通信やファイル保護に使われる。RSAは整数の素因数分解の困難性に関連し、楕円曲線暗号は楕円曲線上の離散対数問題の困難性等に基づく。鍵の生成、配布、保管、更新、失効、廃棄を管理する。危殆化は暗号の安全性や鍵の秘密性が失われること。CRYPTREC暗号リストは電子政府等で用いる暗号技術の評価・選定を支援する。"},{"heading":"ハッシュと証明","body":"SHA-256は256ビットのハッシュ値を出力するSHA-2系列、SHA-3は異なる構造のハッシュ規格。原像発見困難性はハッシュ値から対応入力を求めにくいこと、第二原像発見困難性は特定入力と同じ値の別入力を探しにくいこと、衝突発見困難性は同じ値となる任意の二入力を探しにくいこと。HMACはハッシュと共通鍵を利用するメッセージ認証方式。ゼロ知識証明は秘密そのものを明かさず知識等を証明する考え方、秘密計算は秘密を保護したまま計算する技術群。"}],"beginner":{"scenario":"共通鍵でどのように暗号化するかから順に、鍵を共有する、ハッシュと証明を理解する。","trap":"衝突は任意の異なる二入力のハッシュ値が等しいこと。","quizId":"U-11-Y03"}},{"id":"11-Y04","title":"本人確認・認証連携・証明書","explain":"\u003cp>チャレンジレスポンス認証は検証側が毎回変わる課題を送り、利用者側が秘密等を用いた応答を返す。ワンタイムパスワードは一回または短時間だけ有効。Kerberosは信頼する認証サーバが発行するチケット等でサービス認証を行い、時刻の管理も重要。パスワードレス認証のFIDO2/WebAuthn等は公開鍵方式で認証器が署名を作り、サービス側は公開鍵で検証する。認証器の秘密鍵をサービスへ送らない。多段階認証は段階数、多要素認証は知識・所持・生体など異なる要素の組合せに注目する。\u003c/p>","worked":"\u003cp>\u003cb>本人1000回の試行中20回拒否、他人2000回の試行中2回受入れ。\u003c/b>\u003c/p>\u003cp>FRR＝20/1000＝2%、FAR＝2/2000＝0.1%。\u003c/p>","prompt":"FARを低くするよう判定を厳しくすると、通常FRRはどうなるか。","answer":"\u003cp>上昇する傾向があり、セキュリティと利便性の調整が必要。\u003c/p>","textbook":[{"heading":"秘密を送らず確認する","body":"チャレンジレスポンス認証は検証側が毎回変わる課題を送り、利用者側が秘密等を用いた応答を返す。ワンタイムパスワードは一回または短時間だけ有効。Kerberosは信頼する認証サーバが発行するチケット等でサービス認証を行い、時刻の管理も重要。パスワードレス認証のFIDO2/WebAuthn等は公開鍵方式で認証器が署名を作り、サービス側は公開鍵で検証する。認証器の秘密鍵をサービスへ送らない。多段階認証は段階数、多要素認証は知識・所持・生体など異なる要素の組合せに注目する。"},{"heading":"生体認証の誤りを測る","body":"指紋、静脈、虹彩、顔、網膜は身体的特徴、声紋や署名の動きなどは行動的特徴も利用する。FAR（他人受入率）は他人を本人として受入れる割合、FRR（本人拒否率）は本人を拒否する割合。一般に判定基準を厳しくするとFARは低くなりFRRは高くなる傾向。生体情報は容易に変更できないため、保存方法、なりすまし対策、代替手段も必要。CAPTCHAは人と自動プログラムの識別を補助する。"},{"heading":"証明書と信頼連鎖","body":"認証局CAは公開鍵と主体を結び付ける証明書を発行する。端末は信頼するルート証明書をトラストアンカーとして中間CA、サーバ証明書等の署名を検証する。CRL（証明書失効リスト）は失効情報の一覧、OCSPは個別の証明書の状態を問合せる規約。タイムスタンプは特定時点の存在等の証明、コードサイニングはプログラムの発行元と完全性の検証を支援する。IdP（アイデンティティ提供者）は認証情報を提供し、IDaaSはクラウド等でID管理・認証機能を提供するサービス。3Dセキュアはオンラインカード決済で追加認証等を行う仕組み。"}],"beginner":{"scenario":"秘密を送らず確認するから順に、生体認証の誤りを測る、証明書と信頼連鎖を理解する。","trap":"Online Certificate Status Protocol（オンライン証明書状態確認プロトコル）。","quizId":"U-11-Y04"}},{"id":"11-Y05","title":"情報セキュリティのリスク分析・規程・継続","explain":"\u003cp>資産の所有者と機密性・完全性・可用性の重要度を台帳に記録する。リスク特定は何が起こり得るか、分析は発生可能性と影響を把握、評価は受容基準と比較する。定性的評価は高・中・低などの尺度、定量的評価は金額や確率等を用いる。年間予想損失額は単一事象の予想損失額×年間発生頻度で計算する基本モデルがある。1回の損失100万円で年0.2回なら20万円。対策で年0.05回なら5万円、期待損失の減少は15万円だが重大被害・法令・不確実性も考える。\u003c/p>","worked":"\u003cp>\u003cb>1回200万円の損失が年0.5回の見込み。対策後は年0.1回、対策費年30万円。\u003c/b>\u003c/p>\u003cp>期待損失は100万円から20万円へ減少し、対策費込み50万円。単純な期待値では50万円改善する。\u003c/p>","prompt":"発生可能性と影響を分析した後、リスク評価で行うことは？","answer":"\u003cp>事前に定めたリスク基準と比較し、受容可能性や対応の優先度を判断する。\u003c/p>","textbook":[{"heading":"リスクを測る","body":"資産の所有者と機密性・完全性・可用性の重要度を台帳に記録する。リスク特定は何が起こり得るか、分析は発生可能性と影響を把握、評価は受容基準と比較する。定性的評価は高・中・低などの尺度、定量的評価は金額や確率等を用いる。年間予想損失額は単一事象の予想損失額×年間発生頻度で計算する基本モデルがある。1回の損失100万円で年0.2回なら20万円。対策で年0.05回なら5万円、期待損失の減少は15万円だが重大被害・法令・不確実性も考える。"},{"heading":"リスクを扱う責任","body":"回避は活動を中止、低減は発生可能性や影響を減らし、共有・移転は保険や契約等で負担を分け、保有・受容は残るリスクを引き受ける。残留リスクを責任者が承認し、リスク登録簿に対応、期限、責任、監視項目を記録する。クラウドの責任共有モデルは提供者と利用者が管理する範囲を区別する。委託しても利用者のデータ・権限等の責任が消えるとは限らない。"},{"heading":"規程と事業継続","body":"情報セキュリティ基本方針で方向を示し、対策基準で守る条件、実施手順で具体的な作業を定める。例外の承認、教育、監査、規程更新を管理する。サイバーハイジーンは更新、不要アカウント削除、資産把握等の日常的な衛生管理。コンティンジェンシー計画は緊急事態への対応、災害復旧計画は復旧方法を定める。事業継続の中でもセキュリティを維持し、訓練で実現可能性を検証する。"}],"beginner":{"scenario":"リスクを測るから順に、リスクを扱う責任、規程と事業継続を理解する。","trap":"300×0.2＝60万円。","quizId":"U-11-Y05"}},{"id":"11-Y06","title":"ISMS・セキュリティ組織・基準","explain":"\u003cp>ISMS（情報セキュリティマネジメントシステム）では適用範囲、方針、責任、リスク対応、運用、内部監査、経営層による見直し、改善を体系化する。ISO/IEC 27001（JIS Q 27001）は要求事項、27002は管理策の指針、27014はガバナンス、27017はクラウドの管理策に関する指針。適用宣言書では必要な管理策と適用の理由等を整理する。認証は一定の範囲の仕組みを評価するもので事故ゼロの保証ではない。\u003c/p>","worked":"\u003cp>\u003cb>販売したソフトウェアの脆弱性報告を受け取り修正版を調整する。\u003c/b>\u003c/p>\u003cp>製品セキュリティ対応のPSIRTが中心となり、開発・顧客対応等と連携する。\u003c/p>","prompt":"SOCとCSIRTは同じ役割か。","answer":"\u003cp>重なる場合もあるが、SOCは主に監視・分析、CSIRTは事故対応・調整を担当する。\u003c/p>","textbook":[{"heading":"組織の仕組みを評価する","body":"ISMS（情報セキュリティマネジメントシステム）では適用範囲、方針、責任、リスク対応、運用、内部監査、経営層による見直し、改善を体系化する。ISO/IEC 27001（JIS Q 27001）は要求事項、27002は管理策の指針、27014はガバナンス、27017はクラウドの管理策に関する指針。適用宣言書では必要な管理策と適用の理由等を整理する。認証は一定の範囲の仕組みを評価するもので事故ゼロの保証ではない。"},{"heading":"事故に対応する組織","body":"SOC（セキュリティ運用センター）は監視・検知・分析、CSIRT（コンピュータセキュリティ事故対応チーム）は事故の受付、調査、調整、対応等、PSIRT（製品セキュリティ事故対応チーム）は製品の脆弱性や事故対応等を担う。トリアージは情報を整理し優先順位を決める。テイクダウンは不正サイト等の停止・削除を関係者と調整する活動。JPCERT/CCは事故対応調整や情報共有等、IPAは脆弱性情報の受付や対策情報等、JVNは脆弱性対策情報を提供する。J-CSIPはサイバー情報共有、J-CRATは標的型攻撃等への支援、ISACは業界等の情報共有・分析組織。"},{"heading":"基準を使い分ける","body":"PCI DSSはカード会員データ等の保護に関する業界基準、ISMAPは政府情報システムのためのクラウドサービスのセキュリティ評価制度。NIST CSF（サイバーセキュリティフレームワーク）は組織のリスク管理の枠組みで、現行2.0では統治・識別・防御・検知・対応・復旧の機能を持つ。サイバーセキュリティ経営ガイドラインは経営層の責任等を扱う。SECURITY ACTIONは中小企業等の自己宣言制度。基準、法令、認証、自己宣言は拘束力と確認方法が異なる。"}],"beginner":{"scenario":"組織の仕組みを評価するから順に、事故に対応する組織、基準を使い分けるを理解する。","trap":"決済カード業界のデータセキュリティ基準。","quizId":"U-11-Y06"}},{"id":"11-Y07","title":"脆弱性識別・製品の評価と認証","explain":"\u003cp>CVE（共通脆弱性識別子）は個々の公開された脆弱性の識別番号、CWE（共通脆弱性タイプ）は弱点の種類の分類、CVSS（共通脆弱性評価システム）は脆弱性の深刻度を共通尺度で評価する枠組み。例えば特定製品の不具合にCVE番号が付与され、原因となる弱点の型がCWEに関連付けられ、CVSSで深刻度を評価する。CVSSの点数だけで自社の優先順位は決まらず、公開範囲、悪用状況、事業影響、対策可能性を考慮する。\u003c/p>","worked":"\u003cp>\u003cb>CVSSが高い脆弱性が隔離した試験機に、やや低い脆弱性が公開サーバにある。\u003c/b>\u003c/p>\u003cp>点数のみで決めず、露出、悪用状況、事業影響を評価し対応の順序を決める。\u003c/p>","prompt":"CVEとCWEは何が異なるか。","answer":"\u003cp>CVEは個々の脆弱性の識別子、CWEは弱点の種類の分類。\u003c/p>","textbook":[{"heading":"脆弱性を区別する","body":"CVE（共通脆弱性識別子）は個々の公開された脆弱性の識別番号、CWE（共通脆弱性タイプ）は弱点の種類の分類、CVSS（共通脆弱性評価システム）は脆弱性の深刻度を共通尺度で評価する枠組み。例えば特定製品の不具合にCVE番号が付与され、原因となる弱点の型がCWEに関連付けられ、CVSSで深刻度を評価する。CVSSの点数だけで自社の優先順位は決まらず、公開範囲、悪用状況、事業影響、対策可能性を考慮する。"},{"heading":"製品を評価する","body":"CC（コモンクライテリア、ISO/IEC 15408）はIT製品等のセキュリティ機能と保証を評価するための基準。PP（プロテクションプロファイル）は製品種別のセキュリティ要求を示す文書、ST（セキュリティターゲット）は評価対象の具体的な要求等を記述する。EAL（評価保証レベル）は評価の厳密さ等に関わる保証要求のまとまりで、値が高いからあらゆる攻撃に強いという意味ではない。CEM（共通評価方法、ISO/IEC 18045）は評価方法を定める。JISECは日本のITセキュリティ評価・認証制度。JCMVPは暗号モジュールの試験・認証制度。"},{"heading":"診断の目的を決める","body":"脆弱性診断は設定やコード等の弱点を調べ、ペネトレーションテストは許可範囲内で実際に弱点が悪用され得るか確認する。脆弱性報奨金制度は定められた範囲の報告を受け付ける。耐タンパ性は機器や情報への物理的な解析・改変等への耐性。調達ではセキュリティ機能、評価対象・版、保証範囲、運用条件を確認する。"}],"beginner":{"scenario":"脆弱性を区別するから順に、製品を評価する、診断の目的を決めるを理解する。","trap":"Evaluation Assurance Level（評価保証レベル）。","quizId":"U-11-Y07"}},{"id":"11-Y08","title":"端末・データ・供給網の防御","explain":"\u003cp>パターンマッチングは既知の特徴と照合し、振舞い検知は実行時の不審な動作、ヒューリスティックは疑わしい特徴等から判断する。静的解析は実行せず調べ、動的解析は隔離環境等で動作を観察する。サンドボックスは実行環境を分離して影響を抑える。フォールスポジティブ（偽陽性）は正常を異常と判定、フォールスネガティブ（偽陰性）は異常を見逃す。EDRは端末の検知・調査・対応を支援、UEBAは利用者や機器等の振舞いの異常を分析する。\u003c/p>","worked":"\u003cp>\u003cb>自社の製品がどの版の外部ライブラリを含むか把握したい。\u003c/b>\u003c/p>\u003cp>SBOMを整備し脆弱性情報と照合する。\u003c/p>","prompt":"同じ環境内にオンラインで複製しただけのバックアップの問題点は？","answer":"\u003cp>同じ侵害や誤操作で複製も影響を受け得る。独立保管と復元試験を考える。\u003c/p>","textbook":[{"heading":"検知と対応を組み合わせる","body":"パターンマッチングは既知の特徴と照合し、振舞い検知は実行時の不審な動作、ヒューリスティックは疑わしい特徴等から判断する。静的解析は実行せず調べ、動的解析は隔離環境等で動作を観察する。サンドボックスは実行環境を分離して影響を抑える。フォールスポジティブ（偽陽性）は正常を異常と判定、フォールスネガティブ（偽陰性）は異常を見逃す。EDRは端末の検知・調査・対応を支援、UEBAは利用者や機器等の振舞いの異常を分析する。"},{"heading":"データと機器を守る","body":"3-2-1ルールは元データを含め3コピー、2種類の媒体、1コピーを別の場所に置く考え方。WORM（1回書込み・複数回読出し）やイミュータブルバックアップは指定期間の変更・削除を防ぐ。k-匿名化は準識別子の組合せごとに少なくともk件が存在するよう一般化等を行う考え方だが、他情報との照合リスクは残る。データマスキングは機密値を隠す。暗号化消去は適切な暗号化と鍵破棄により復号できなくする方法。TPM（トラステッドプラットフォームモジュール）は鍵等の保護、セキュアブートは信頼された起動コードの検証を支援する。"},{"heading":"供給網・クラウド・物理対策","body":"SBOM（ソフトウェア部品表）は構成部品と版を把握し脆弱性対応等を支援する。DLP（情報漏えい防止）は機密情報の不適切な送信等を検知・制御、CASB（クラウドアクセスセキュリティ仲介）はクラウド利用の可視化・制御、MDM（モバイル端末管理）は端末設定や紛失時の管理。物理対策ではアンチパスバック（入退室の順序制御）、インターロック（二重扉等
