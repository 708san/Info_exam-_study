t：投資利益率）は投資額に対する利益の比率。NPV（Net Present Value：正味現在価値）は将来キャッシュフローを割引率で現在価値に換算し、初期投資を差し引く。IRR（Internal Rate of Return：内部収益率）はNPVを0にする割引率。いずれも将来予測・割引率・リスクの仮定が評価結果を左右する。\u003c/p>\n\u003cp>KGI（Key Goal Indicator：重要目標達成指標）は最終目標、KPI（Key Performance Indicator：重要業績評価指標）は目標に向かうプロセス指標。先行指標と結果指標を混同せず、測定可能で施策に結び付く値を使う。IT投資ポートフォリオでは効果・緊急度・依存関係・リスクを比較する。\u003c/p>\n","worked":"\u003cp>初期投資100万円、翌年と翌々年にそれぞれ60万円の正味CF、割引率10%ならNPV＝−100＋60/1.1＋60/1.1²≈4.13万円。割引せず単純に20万円の利益とするのは誤り。\u003c/p>\n","prompt":"KPIが良ければKGIは必ず達成されるか。","answer":"\u003cp>必ずではない。因果関係の妥当性、外部環境、指標の偏りを検証する。\u003c/p>\n","beginner":{"scenario":"初期投資300万円、年間純便益100万円なら単純回収3年。将来のお金の価値を考慮したいなら割引現在価値を計算する。","trap":"回収期間だけでは回収後の収益やリスクを評価できない。","quizId":"U-17-2"},"textbook":[{"heading":"投資を評価する理由","body":"システム開発には初期費用と継続費用がかかり、人件費削減、売上増加、リスク低減などの便益を期待します。単純投資回収期間は初期投資÷年間純便益（一定の場合）。回収までの時間を把握できますが、回収後の便益や貨幣の時間価値は評価できません。"},{"heading":"利益と現在価値","body":"ROI（投資利益率）は利益を投資額で割る指標です。NPV（正味現在価値）は将来のキャッシュフローを割引いて初期投資を引きます。IRR（内部収益率）はNPVが0になる割引率です。投資比較では計算条件やリスク、評価期間をそろえます。"},{"heading":"複数の施策と評価指標","body":"投資ポートフォリオでは複数案件の価値・リスク・費用・資源制約を考慮して優先順位を決めます。KGI（重要目標達成指標）は最終目標、KPI（重要業績評価指標）は達成に向けた途中の成果を測ります。例えば利益率をKGI、処理時間や継続率をKPIにすることがあります。"}]},{"id":"17-3","title":"ITガバナンス・全体最適・データ戦略","explain":"\u003cp>ITガバナンスは経営の責任のもとでITの価値・リスク・資源を方向付け、評価・監視する仕組み。現場最適で各部門が個別にシステムを購入すると、データ形式の不統一、セキュリティ水準の差、費用重複が生じ得る。標準化、共通基盤、データ品質管理、責任分担で全体最適を目指す。\u003c/p>\n\u003cp>データ戦略では主データ（顧客・商品等）、取引データ、メタデータ、品質（正確性・完全性・適時性）を整理する。データを集めるだけでなく、利用目的、アクセス権、保持期限、プライバシー、責任者を決める。\u003c/p>\n","worked":"\u003cp>営業部と経理部で「顧客ID」の定義が異なると売上集計が一致しない。共通マスタとデータ定義を整えることが経営指標の信頼性に直結する。\u003c/p>\n","prompt":"全てのシステムを1つに統合すれば常に最適か。","answer":"\u003cp>そうとは限らない。柔軟性、事業ごとの要件、障害の波及範囲も評価する。\u003c/p>\n","beginner":{"scenario":"各部署が異なる顧客管理システムを導入すると重複・矛盾が生じる。全体のデータ定義やシステム配置を整理し共通化する。","trap":"全体最適は全機能を一つに集約することとは限らない。","quizId":"U-17-3"},"textbook":[{"heading":"全体最適が必要な理由","body":"各部門が独自に顧客コードとデータベースを作ると、同一顧客を別々に管理し集計や連携が難しくなります。EA（エンタープライズアーキテクチャ）は組織全体の業務、データ、アプリケーション、技術の構造を整理して現状と将来像を考える手法です。"},{"heading":"ITガバナンス","body":"ITガバナンスは経営目標に照らしITの利用・投資・リスクについて意思決定と監督を行う仕組みです。日々の運用管理とは区別し、責任、意思決定権、評価方法を明確にします。"},{"heading":"データの活用と管理","body":"データの定義、品質、所有者、利用権限、保存・廃棄条件を定めます。マスターデータ管理で顧客・商品等の基本情報を一貫させることは、部門間の分析や連携を助けます。全体最適は必ずしもすべての機能を一つのシステムへ集約することではありません。"}]},{"id":"17-X01","title":"システム戦略・業務プロセス・活用評価","explain":"\u003cp>EA（エンタープライズアーキテクチャ）は業務・データ・アプリケーション・技術の全体像を整理する。BPR（業務プロセス再設計）は抜本的改革、BPM（業務プロセス管理）は継続的に可視化・改善する。SOA（サービス指向アーキテクチャ）は機能を疎結合のサービスとして組み合わせる。\u003c/p>\u003cp>ソリューションビジネスは顧客課題に対し製品・サービス・運用を組み合わせる。アウトソーシングやクラウド利用では責任分界・コスト・情報管理を評価する。システム活用促進には教育、マニュアル、デジタルリテラシー、利用率や満足度の計測が必要。導入自体ではなく経営成果を検証する。\u003c/p>","worked":"\u003cp>在庫システム導入後に利用率80%でも欠品が改善しないなら、入力精度や発注業務などを再評価する。\u003c/p>","prompt":"既存業務の流れを抜本的に再設計する手法は？","answer":"\u003cp>BPR。\u003c/p>","beginner":{"scenario":"申請を紙からWebに変えるだけでなく、不要な承認を廃止しデータを再入力しないよう業務自体を見直す。","trap":"BPRは抜本的再設計、BPMは継続的な業務プロセス管理。","quizId":"U-17-X01"},"textbook":[{"heading":"業務の流れから見直す","body":"申請書をWeb化しても不要な承認や重複入力が残れば大きな改善にはなりません。BPR（業務プロセス再設計）は既存業務を抜本的に見直す活動、BPM（業務プロセス管理）は業務を可視化し継続的に測定・改善する活動です。"},{"heading":"機能をサービスとして組み合わせる","body":"SOA（サービス指向アーキテクチャ）は機能を明確な接続仕様を持つサービスとして疎結合に組み合わせます。例えば顧客情報照会を複数業務から利用できるようにします。ソリューションビジネスは顧客課題に応じ技術・製品・運用を組み合わせて解決策を提供します。"},{"heading":"導入後の活用を促進する","body":"利用者教育、操作手順、支援窓口、業務ルールを整備し、利用率や成果を測ります。導入したシステムが使われない場合は機能不足、業務との不整合、教育不足など原因を分析します。クラウドや外部委託では責任分界と費用・リスクを確認します。"}]},{"id":"17-Y01","title":"全社アーキテクチャ・IT戦略とデータ統合","explain":"\u003cp>EA（Enterprise Architecture：全社アーキテクチャ）は業務、データ、アプリケーション、技術基盤の四つの視点で現状（As-is）と目標（To-be）を整理します。経営目標に従って全体最適を図ります。\u003c/p>","worked":"\u003cp>顧客番号の共通化はDA、部門横断の受注処理はBA、連携するアプリ構成はAA、通信・実行基盤はTAで整理する。\u003c/p>","prompt":"全社の顧客データ定義やデータ間関係を整理するEAの領域は？","answer":"\u003cp>データアーキテクチャ。データの構造と関連を扱う領域。\u003c/p>","beginner":{"scenario":"営業と物流が別々の顧客番号を使用し、同じ顧客の状況をまとめられない。","trap":"各部門の個別最適を足しても全社最適になるとは限らない。","quizId":"U-17-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"EA（Enterprise Architecture：全社アーキテクチャ）は業務、データ、アプリケーション、技術基盤の四つの視点で現状（As-is）と目標（To-be）を整理します。経営目標に従って全体最適を図ります。"},{"heading":"仕組みと使い分け","body":"BA（業務）、DA（データ）、AA（アプリケーション）、TA（技術）の観点を対応づけます。共通マスタ、標準インタフェース、EAI（Enterprise Application Integration：企業内アプリ統合）を利用し、IT投資の優先順位と移行計画を設けます。"},{"heading":"具体的な判断と手順","body":"顧客番号の共通化はDA、部門横断の受注処理はBA、連携するアプリ構成はAA、通信・実行基盤はTAで整理する。"}]},{"id":"17-Y02","title":"BPR・BPM・業務プロセスの可視化","explain":"\u003cp>BPR（Business Process Reengineering：業務プロセス抜本改革）は業務の目的から流程や役割を再設計します。BPM（Business Process Management：業務プロセス管理）は業務を可視化・測定・継続改善する活動です。\u003c/p>","worked":"\u003cp>低額申請は規則に基づいて自動判定し、高額のみ追加承認することで待ち時間を減らす。\u003c/p>","prompt":"業務そのものを抜本的に再設計する手法は？","answer":"\u003cp>BPR。既存業務を前提とせず成果から再設計する。\u003c/p>","beginner":{"scenario":"紙の申請書を電子化したが、承認が5段階のままなので処理が遅い。","trap":"既存の紙を画面に変えるだけでは抜本改革とはいえない。","quizId":"U-17-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"BPR（Business Process Reengineering：業務プロセス抜本改革）は業務の目的から流程や役割を再設計します。BPM（Business Process Management：業務プロセス管理）は業務を可視化・測定・継続改善する活動です。"},{"heading":"仕組みと使い分け","body":"現状フローで待ち時間、重複入力、不要な承認を特定します。目標フローでは統制を維持しつつ不要手順を削減します。BPMN（Business Process Model and Notation：業務プロセス表記法）は作業、イベント、分岐等を図示します。"},{"heading":"具体的な判断と手順","body":"低額申請は規則に基づいて自動判定し、高額のみ追加承認することで待ち時間を減らす。"}]},{"id":"17-Y03","title":"ソリューションサービスとクラウドの責任分界","explain":"\u003cp>ソリューションビジネスは製品を売るだけでなく顧客課題を調査して解決策を提供します。SI（System Integration：システム統合）、業務パッケージ、BPO（Business Process Outsourcing：業務委託）などがあります。\u003c/p>","worked":"\u003cp>SaaS勤怠を利用しても従業員アカウントや権限、利用データの管理は利用組織側に残る。\u003c/p>","prompt":"利用者自身のサーバを事業者の施設に設置するサービスは？","answer":"\u003cp>ハウジング。施設を借りて自社機器を設置する形態。\u003c/p>","beginner":{"scenario":"会社が自社サーバ、クラウド、業務委託から新しい勤怠管理の構成を選ぶ。","trap":"クラウドに移せばすべての安全管理責任が提供者に移るわけではない。","quizId":"U-17-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ソリューションビジネスは製品を売るだけでなく顧客課題を調査して解決策を提供します。SI（System Integration：システム統合）、業務パッケージ、BPO（Business Process Outsourcing：業務委託）などがあります。"},{"heading":"仕組みと使い分け","body":"IaaSは基盤、PaaSはアプリ実行基盤、SaaSは完成したソフトウェアの利用です。ハウジングは利用者の機器を施設に置き、ホスティングは提供者のサーバ等を借ります。責任分界、データ所在、可搬性、解約時の取出し、障害対応を確認します。"},{"heading":"具体的な判断と手順","body":"SaaS勤怠を利用しても従業員アカウントや権限、利用データの管理は利用組織側に残る。"}]},{"id":"17-Y04","title":"活用促進・効果測定・データ駆動改善","explain":"\u003cp>導入の完了は目的達成と異なります。活用促進には教育、支援窓口、業務規則、使いやすさ、利用状況の測定が必要です。\u003c/p>","worked":"\u003cp>売上向上をKGI、案件情報の入力率や商談化率をKPIとし、入力負担を調べて改善する。\u003c/p>","prompt":"利用定着を測る直接的な指標は？","answer":"\u003cp>対象社員の月間利用率。利用状況を直接測定する指標。経営成果も別途測る。\u003c/p>","beginner":{"scenario":"新しい顧客管理システムを導入したが、営業担当が入力せず経営に使えない。","trap":"導入台数が増えたことだけで経営効果が出たとはいえない。","quizId":"U-17-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"導入の完了は目的達成と異なります。活用促進には教育、支援窓口、業務規則、使いやすさ、利用状況の測定が必要です。"},{"heading":"仕組みと使い分け","body":"KGI（Key Goal Indicator：重要目標達成指標）は最終成果、KPI（Key Performance Indicator：重要業績評価指標）はその進捗を測ります。基準値と目標、測定方法を決め、導入前後を比較します。データ品質や季節変動、外部要因にも注意します。"},{"heading":"具体的な判断と手順","body":"売上向上をKGI、案件情報の入力率や商談化率をKPIとし、入力負担を調べて改善する。"}]}],"beginnerIntro":"経営上の課題を業務・ITの施策に変え、導入後の成果を測る。IT自体を目的にしない。"},{"id":18,"title":"システム企画・調達","group":"ストラテジ","priority":"A重要","summary":"RFP、ROI、要求、見積り、契約、ベンダー評価。","lessons":[{"title":"企画の流れ","body":"現状課題を可視化し、将来像・実現方法・費用対効果・リスクを比較する。定量的な効果と測りにくい定性的な効果を区別。","check":"導入前後の比較条件を揃える。"},{"title":"RFPと提案評価","body":"RFP（Request for Proposal：提案依頼書）は目的・要求・制約・評価基準等を示しベンダー提案を募る。選定では価格以外に品質・体制・実績・保守を評価。","check":"RFPと要件定義書・契約書は同じ役割ではない。"},{"title":"投資判断","body":"ROI（Return on Investment：投資利益率）は投資額に対する利益の比率。NPV（Net Present Value：正味現在価値）は将来キャッシュフローを割り引いて比較。","check":"ROIの利益と収益の定義を問題文で確かめる。"},{"title":"契約と受入れ","body":"準委任契約は一定の業務遂行を目的とし、請負契約は仕事の完成を目的とする。実際の契約内容・法令で責任は変わるため一律に決めつけない。","check":"検収基準と成果物責任を明確化する。"}],"terms":[{"term":"RFP","definition":"要求・条件を示して提案を依頼する文書"},{"term":"ROI","definition":"投資額に対する利益の比率"},{"term":"NPV","definition":"将来の現金収支を現在価値へ割り引いた純額"},{"term":"IRR","definition":"投資の正味現在価値がゼロとなる割引率"},{"term":"TCO","definition":"取得から運用・廃棄までの総費用"},{"term":"ベンダー評価","definition":"提供企業を価格・品質・体制などで比較すること"},{"term":"請負","definition":"原則として仕事の完成を目的とする契約"},{"term":"準委任","definition":"事務処理などの遂行を委託する契約"},{"term":"検収","definition":"納品物が契約や要件に適合するか受入れ確認すること"}],"questions":[{"id":"Q18-01","chapter":18,"kind":"applied","q":"投資額200万円、投資による正味利益50万円のROIは。","options":["10%","20%","25%","50%"],"correct":2,"explain":"50÷200×100=25%。"},{"id":"Q18-02","chapter":18,"kind":"applied","q":"RFPで最も重要なのは。","options":["自社の要求と制約を伝える","必ず最安値を指示する","受入れテストを不要とする","提案者に要件を無制限に追加させる"],"correct":0,"explain":"目的・要求・評価条件を明示する文書。"},{"id":"Q18-03","chapter":18,"kind":"applied","q":"将来の資金流入を割引率で現在価値に直す指標は。","options":["MTTR","CPI","NPV","RPO"],"correct":2,"explain":"NPVは時間価値を考慮する。"},{"id":"D18-01","chapter":18,"kind":"applied","q":"RFIとRFPの目的の組合せとして適切なものはどれか。","options":["RFIは提案取得、RFPは情報収集","両方は請求書","RFIは情報収集、RFPは具体的提案依頼","RFIは契約締結、RFPは検収"],"correct":2,"explain":"情報収集で候補や技術を把握したうえで、要件を明記した提案依頼を行う。"},{"id":"D18-02","chapter":18,"kind":"applied","q":"SaaSを導入するとき利用企業が引き続き負う可能性の高い責任はどれか。","options":["利用者の権限設定とデータの適切な取扱い","提供者のデータセンター建設","提供者のOSカーネル保守のすべて","提供者の営業活動"],"correct":0,"explain":"クラウドでも責任分界がある。利用側の権限やデータ管理責任は通常残る。"},{"id":"D18-03","chapter":18,"kind":"applied","q":"システム導入のTCO比較に含めるべき費用はどれか。","options":["初期費用のみ","導入・運用・教育・移行・撤退等の総費用","月額ライセンス料だけ","営業担当者の感想"],"correct":1,"explain":"TCOは総保有コスト。長期の運用と終了時費用まで考える。"},{"id":"Q-18-X01","chapter":18,"kind":"applied","q":"複数の事業者に具体的な解決案と費用の提示を求める文書は？","options":["RFI","RFP","SLA","NDA"],"correct":1,"explain":"RFP。"},{"id":"U-18-1","chapter":18,"kind":"applied","q":"市場にある製品や技術の情報を得る目的で送る文書は？","options":["RFP","RFI","SLA","NDA"],"correct":1,"explain":"RFI（Request for Information）は情報提供依頼書。"},{"id":"U-18-2","chapter":18,"kind":"applied","q":"納品された成果物が契約の条件を満たすか確認する行為は？","options":["構成管理","脆弱性評価のみ","検収","資本予算"],"correct":2,"explain":"検収では受入条件に照らして成果物を確認する。"},{"id":"U-18-3","chapter":18,"kind":"applied","q":"完成済みのアプリ機能をネット経由で利用するクラウドサービス分類は？","options":["PaaS","IaaS","オンプレミス","SaaS"],"correct":3,"explain":"SaaSはSoftware as a Service。PaaSは開発実行基盤、IaaSはインフラ資源。"},{"id":"U-18-X01","chapter":18,"kind":"applied","q":"計画の技術・経済・運用上の実現可能性を事前に調べる活動は？","options":["フィージビリティスタディ","回帰テスト","フォローアップ監査","パレート分析"],"correct":0,"explain":"実行可能性を複数観点から調べ、投資・計画判断に使う。"}],"deepIntro":"企画・調達の要点は、発注側が目的・要件・検収基準・責任分担を曖昧にしないこと。","deep":[{"id":"18-1","title":"企画書・RFI・RFP","explain":"\u003cp>システム企画は現状業務の課題、期待効果、対象範囲、予算、期限、制約を整理する。RFI（Request For Information：情報提供依頼書）は候補技術・製品・業者の情報収集に用い、RFP（Request For Proposal：提案依頼書）は要件・評価条件等を示して具体的な提案を求める。要件が不明確なら比較・契約・検収に問題が生じる。\u003c/p>\n\u003cp>提案評価では価格だけでなく、機能、セキュリティ、保守体制、納期、実績、移行計画、契約条件、運用コストを重み付けする。評価基準と必須条件を事前に決め、恣意的判断を抑える。\u003c/p>\n","worked":"\u003cp>「安いCRMを導入したい」だけでは提案を比較できない。利用者数、顧客データ量、既存連携、権限、障害時のRTO、運用費をRFPで明確にする。\u003c/p>\n","prompt":"RFIとRFPは同じ目的か。","answer":"\u003cp>違う。RFIは情報収集、RFPは具体的な提案取得を目的とする。\u003c/p>\n","beginner":{"scenario":"市販システムで何が可能か不明ならRFIで情報収集し、要求を整理してからRFPで費用・構成・導入方法の提案を求める。","trap":"RFIは情報提供依頼、RFPは提案依頼。見積り依頼だけとは異なる。","quizId":"U-18-1"},"textbook":[{"heading":"企画から調達へ","body":"最初に経営課題、目的、対象業務、期待効果、制約を明確にします。市場の製品や技術が分からなければRFI（情報提供依頼）で情報を集め、要件が具体化したらRFP（提案依頼）で構成・費用・スケジュール等の提案を求めます。RFQは見積依頼です。"},{"heading":"提案を比較する","body":"価格だけで選ばず、必須要件の充足、機能・品質、導入実績、保守体制、移行リスク、セキュリティ等を比較します。評価基準や重みを事前に定めると恣意的な選定を減らせます。必須条件を満たさない案は別途判断します。"},{"heading":"投資判断と合意","body":"TCO（総保有費用）では初期購入費だけでなく運用・保守・移行・廃棄などを考慮します。費用対効果、契約条件、納品物、受入条件を確認して計画を承認します。技術的に優れていても予算や運用体制に合わない場合があります。"}]},{"id":"18-2","title":"契約・SLA・検収・委託管理","explain":"\u003cp>請負契約は仕事の完成を目的とし、準委任は事務処理などを委託する契約形態で、成果完成義務や責任の考え方が異なる。実際の権利義務は契約内容と適用法令に依存する。契約では成果物、知的財産、検収条件、変更時の手続、欠陥時対応、秘密保持、再委託、終了時のデータ返還などを定義する。\u003c/p>\n\u003cp>検収は決めた受入基準に照らして成果物が要件を満たすか判断する。委託先の管理を完全に丸投げせず、アクセス権・再委託先・脆弱性対応・ログなどの管理を継続する。\u003c/p>\n","worked":"\u003cp>発注側が口頭で機能追加を指示すると、追加費用や納期の認識がずれる。変更依頼と見積り、承認記録を残して契約上の扱いを確認する。\u003c/p>\n","prompt":"ベンダに委託したから個人情報保護やセキュリティの責任をすべて免れるか。","answer":"\u003cp>免れない。委託元としての監督などの義務が残る。\u003c/p>\n","beginner":{"scenario":"委託したシステムの受入条件を契約前に決め、納品時に試験して成果物が条件を満たすか検収する。","trap":"委託しても委託元のリスク・成果管理責任が消えるわけではない。","quizId":"U-18-2"},"textbook":[{"heading":"契約で責任を明確にする","body":"請負は原則として仕事の完成を目的とし、準委任は業務を適切に遂行することを目的とする契約類型です。実際の権利義務は契約内容と法令に従います。委託する範囲、納期、成果物、費用、知的財産、秘密保持、再委託の条件などを明確にします。"},{"heading":"受入とサービス水準","body":"検収では納品物が合意した受入条件を満たすか確認します。運用サービスではSLA（サービスレベル合意）で稼働率や応答時間、サポート条件等を明確にします。不適合や障害時の対応手順も決めます。"},{"heading":"委託先の管理","body":"委託しても自社の業務リスクや情報管理責任が消えるわけではありません。委託先のアクセス権、データ保護、監査、契約終了後のデータ返却・消去を確認します。変更要求は影響を評価し合意した手続で扱います。"}]},{"id":"18-3","title":"サービス選定・クラウド・移行計画","explain":"\u003cp>SaaS（Software as a Service：サービスとしてのソフトウェア）はアプリ利用、PaaS（Platform as a Service：サービスとしてのプラットフォーム）は実行基盤、IaaS（Infrastructure as a Service：サービスとしてのインフラ）は仮想機器等を提供する典型的な区分。いずれも利用者と提供者の責任分界点を確認する。クラウドでもデータ分類・アクセス権・利用者設定は利用側の責任が残る。\u003c/p>\n\u003cp>移行はデータ変換、並行稼働、切替条件、ロールバック、利用者教育、運用引継ぎを計画する。TCO（Total Cost of Ownership：総保有コスト）は初期費用だけでなく運用、保守、教育、移行・撤退費用を含めた総額。\u003c/p>\n","worked":"\u003cp>低料金のSaaSを導入しても、既存データの移行費が高く、エクスポート制約が強ければ5年間のTCOが大きくなる。初期費用だけで比較しない。\u003c/p>\n","prompt":"SaaSならユーザー権限の設定は全て提供事業者が責任を持つか。","answer":"\u003cp>通常、利用企業側にも設定・利用管理の責任がある。\u003c/p>\n","beginner":{"scenario":"IaaSでは利用者がOSやアプリを管理する場合が多く、SaaSでは提供者がアプリを提供・運用する。利用者権限やデータ管理は利用者にも残る。","trap":"具体的な責任分界はサービス・契約に依存する。","quizId":"U-18-3"},"textbook":[{"heading":"クラウドの種類","body":"IaaS（インフラ資源のサービス）は仮想サーバ等、PaaS（開発・実行基盤のサービス）はアプリの実行環境、SaaS（ソフトウェアのサービス）は完成済みアプリを提供します。利用者が管理する範囲は順に減る傾向がありますが、データ・権限等の責任は残り得ます。"},{"heading":"選定時に見る点","body":"自社設備に導入するオンプレミス、クラウド、両者を組み合わせる方式を、費用、性能、可用性、法令、データ所在地、運用能力、移行性で比較します。特定提供者へ依存して切替が難しくなるベンダーロックインにも注意します。"},{"heading":"移行の計画","body":"現行の業務停止許容時間、データ量、依存システムを調べ、移行手順とリハーサル、照合方法、切戻し条件を用意します。サービス開始後の監視・教育・問い合わせ対応も必要です。"}]},{"id":"18-X01","title":"システム化計画・要件・調達の実現性","explain":"\u003cp>システム化計画は経営課題、現行業務、対象範囲、目標、費用、スケジュール、移行・運用を整理する。フィージビリティスタディ（実現可能性調査）は技術・経済・法務・運用などの観点で実行可能かを検討する。グリーンITはエネルギーや資源消費を抑える観点。\u003c/p>\u003cp>要件定義では機能・非機能、優先順位、制約、受入条件を明確にし関係者と合意する。RFI（情報提供依頼）で候補を調査し、RFP（提案依頼）で具体的提案を求める。評価表で必須条件と評価項目を区別し、ベンダの実績、費用、リスク、運用体制を比較する。\u003c/p>","worked":"\u003cp>導入費100万円、年の純便益40万円なら単純回収期間2.5年。経済性だけでなく移行リスクも確認する。\u003c/p>","prompt":"複数の事業者に具体的な解決案と費用の提示を求める文書は？","answer":"\u003cp>RFP。\u003c/p>","beginner":{"scenario":"導入予定の技術が既存機器で動くか、予算内か、法令・運用に適合するか調べる。必要なら試行して不確実性を減らす。","trap":"実現可能性調査は技術だけでなく経済性・運用・法務も含む。","quizId":"U-18-X01"},"textbook":[{"heading":"実現可能性を調べる","body":"フィージビリティスタディ（実現可能性調査）は企画が技術的に可能か、経済的に妥当か、法令や運用条件に適合するかを事前に検討します。技術上の不確実性が大きければPoC（概念実証）で検証することもあります。"},{"heading":"システム化計画を作る","body":"現行業務と課題、将来業務の姿、対象範囲、要求、システム構成、費用、スケジュール、移行・運用方針を整理します。すべての要求を同時に実現する必要があるか優先順位を検討します。"},{"heading":"持続可能性と調達","body":"グリーンITはIT機器やサービスのエネルギー・資源消費を抑える考え方です。消費電力、機器更新、廃棄、データセンター等を評価します。調達時は技術・経済性だけでなく環境・情報管理・契約条件も確認します。"}]},{"id":"18-Y01","title":"システム化計画・投資効果・導入リスク","explain":"\u003cp>システム化計画では目的、対象範囲、実現方式、推進体制、日程、教育、投資・リスクを整理します。PBP（Payback Period：投資回収期間）は初期投資を回収するまでの期間です。\u003c/p>","worked":"\u003cp>NPV=60/1.05+60/1.05²−100≈11.56万円。前提が妥当なら正のNPVは経済価値を生む見込みを示す。\u003c/p>","prompt":"100万円投資、1年後110万円の純収入、割引率10％のNPVは？","answer":"\u003cp>0万円。110/1.1−100=0。\u003c/p>","beginner":{"scenario":"100万円を投資し、1年後60万円、2年後60万円の純収入を得る計画を評価する。","trap":"売上増だけでなく追加運用費や廃棄費用も含める。","quizId":"U-18-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"システム化計画では目的、対象範囲、実現方式、推進体制、日程、教育、投資・リスクを整理します。PBP（Payback Period：投資回収期間）は初期投資を回収するまでの期間です。"},{"heading":"仕組みと使い分け","body":"DCF（Discounted Cash Flow：割引キャッシュフロー）は将来の現金を現在価値に割り引きます。NPV（Net Present Value：正味現在価値）=将来キャッシュフローの現在価値合計−初期投資。割引率5％なら1年後の60は60/1.05です。"},{"heading":"具体的な判断と手順","body":"NPV=60/1.05+60/1.05²−100≈11.56万円。前提が妥当なら正のNPVは経済価値を生む見込みを示す。"}]},{"id":"18-Y02","title":"要求分析・要件定義・利害調整","explain":"\u003cp>要求分析は利用者の課題、目的、制約を抽出し整理する活動です。現状指向は現状の業務から改善点を探し、目的指向は達成したい成果から必要な仕組みを逆算します。\u003c/p>","worked":"\u003cp>在庫更新は一操作で行えるようにしつつ、更新者・時刻・旧値・新値を自動記録して監査要件を満たす。\u003c/p>","prompt":"「検索を速くする」を検証可能にする要件は？","answer":"\u003cp>100人同時利用時に95％の検索を2秒以内にする。測定条件と合否基準が明確。\u003c/p>","beginner":{"scenario":"倉庫担当は在庫入力を簡単にしたいが、経理は正確な履歴が必要だと考える。","trap":"実装方式を先に決めると本来の要求を見失うことがある。","quizId":"U-18-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"要求分析は利用者の課題、目的、制約を抽出し整理する活動です。現状指向は現状の業務から改善点を探し、目的指向は達成したい成果から必要な仕組みを逆算します。"},{"heading":"仕組みと使い分け","body":"業務要件、機能要件、非機能要件、移行・運用条件を整理し優先順位を合意します。要求の衝突は代替案、費用、リスクを比較して解決し、検証可能な受入基準を定め、経営戦略との整合を確認します。"},{"heading":"具体的な判断と手順","body":"在庫更新は一操作で行えるようにしつつ、更新者・時刻・旧値・新値を自動記録して監査要件を満たす。"}]},{"id":"18-Y03","title":"RFI・RFP・提案評価・契約と検収","explain":"\u003cp>RFI（Request for Information：情報提供依頼）は市場や製品情報の収集、RFP（Request for Proposal：提案依頼）は要件と評価条件を示して提案を求めるもの、RFQ（Request for Quotation：見積依頼）は価格等の見積りを求めるものです。\u003c/p>","worked":"\u003cp>初期200万円・年運用100万円のAと初期350万円・年運用30万円のBでは3年の単純合計はA500万円、B440万円。\u003c/p>","prompt":"候補事業者に解決方法・実施体制・価格の提案を求める文書は？","answer":"\u003cp>RFP。要件を示し解決策を提案してもらう文書。\u003c/p>","beginner":{"scenario":"複数事業者から販売管理システムの導入提案を募る。","trap":"RFIとRFPを同じものと考えない。","quizId":"U-18-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"RFI（Request for Information：情報提供依頼）は市場や製品情報の収集、RFP（Request for Proposal：提案依頼）は要件と評価条件を示して提案を求めるもの、RFQ（Request for Quotation：見積依頼）は価格等の見積りを求めるものです。"},{"heading":"仕組みと使い分け","body":"調達要件、提案評価基準、責任分界、知財、保守、移行、検収基準を契約に反映します。TCO（Total Cost of Ownership：総保有費用）で取得から運用・廃棄まで比較し、検収で納品内容が合意条件を満たすか確認します。"},{"heading":"具体的な判断と手順","body":"初期200万円・年運用100万円のAと初期350万円・年運用30万円のBでは3年の単純合計はA500万円、B440万円。"}]}],"beginnerIntro":"投資判断、要件、調達、契約、移行を計画する。誰が何を提供し、何を満たせば受入れるかを明確にする。"},{"id":19,"title":"経営戦略・マーケティング","group":"ストラテジ","priority":"A重要","summary":"SWOT、PPM、4P、競争戦略、KPI、財務の基礎。","lessons":[{"title":"経営分析","body":"SWOT分析はStrengths（強み）・Weaknesses（弱み）の内部要因とOpportunities（機会）・Threats（脅威）の外部要因を整理する。クロスSWOTで施策候補を考える。","check":"機会と強みを混同しない。"},{"title":"事業ポートフォリオ","body":"PPM（Product Portfolio Management：製品ポートフォリオ管理）は市場成長率と相対市場占有率で事業を分類する代表的枠組み。資金配分の議論に使うがそれだけで投資判断はできない。","check":"問題文の軸を見失わない。"},{"title":"マーケティングとKPI","body":"4PはProduct（製品）・Price（価格）・Place（流通）・Promotion（販売促進）。KGI（Key Goal Indicator：重要目標達成指標）を達成するための途中指標がKPI（Key Performance Indicator：重要業績評価指標）。","check":"成果指標と活動指標を使い分ける。"},{"title":"収益モデル","body":"売上高−変動費＝限界利益。損益分岐点売上高＝固定費÷限界利益率。価格・数量・単位変動費を変えて感度分析する。","check":"売上高ではなく限界利益が固定費を回収する。"}],"terms":[{"term":"SWOT分析","definition":"内部の強み・弱みと外部の機会・脅威を整理する手法"},{"term":"PPM","definition":"市場成長率と相対市場占有率で事業を分類する枠組み"},{"term":"4P","definition":"製品・価格・流通・販売促進の施策を組み合わせる考え方"},{"term":"STP","definition":"市場細分化・対象選択・位置付けを行うマーケティング手法"},{"term":"KGI","definition":"最終的な目標達成を測定する指標"},{"term":"KPI","definition":"目標達成に向けた途中の活動・成果を測る指標"},{"term":"限界利益","definition":"売上高から変動費を差し引いた利益"},{"term":"損益分岐点","definition":"売上と費用が一致し利益がゼロになる水準"},{"term":"ファイブフォース","definition":"業界の競争要因を五つの力で分析する枠組み"},{"term":"バランストスコアカード","definition":"財務・顧客・業務プロセス・学習と成長を多面的に評価する仕組み"}],"questions":[{"id":"Q19-01","chapter":19,"kind":"applied","q":"固定費300万円、限界利益率30%のとき損益分岐点売上高は。","options":["100万円","300万円","900万円","1000万円"],"correct":3,"explain":"300÷0.3=1000万円。"},{"id":"Q19-02","chapter":19,"kind":"applied","q":"SWOTの「新規規制で市場需要が減る」は。","options":["強み","弱み","機会","脅威"],"correct":3,"explain":"自社外部のマイナス要因なので脅威。"},{"id":"Q19-03","chapter":19,"kind":"applied","q":"最終目標「年間売上10億円」に対し商談数を週次管理する指標は主に。","options":["KGI","KPI","IRR","RPO"],"correct":1,"explain":"商談数は最終目標の先行・中間指標。"},{"id":"D19-01","chapter":19,"kind":"applied","q":"SWOT分析で「競合大手の低価格参入」はどの区分に当たるか。","options":["自社の強み","自社の弱み","外部の機会","外部の脅威"],"correct":3,"explain":"競合参入は外部環境に由来する脅威（Threat）。"},{"id":"D19-02","chapter":19,"kind":"applied","q":"STP分析の正しい順番はどれか。","options":["対象選択→細分化→位置付け","市場細分化→対象選択→位置付け","製品→価格→流通","販売→調達→製造"],"correct":1,"explain":"Segmentation→Targeting→Positioning。誰にどんな価値を提供するか決める。"},{"id":"D19-03","chapter":19,"kind":"applied","q":"ファイブフォース分析が主に扱う対象はどれか。","options":["企業会計の帳簿","ソフトウェアのテストケース","業界の競争構造と収益圧力","人的資源の勤怠"],"correct":2,"explain":"競合、新規参入、代替品、買い手、売り手の5つの競争圧力を分析する。"},{"id":"Q-19-X01","chapter":19,"kind":"applied","q":"暗黙知を言語化して形式知にするSECIの過程は？","options":["共同化","表出化","連結化","内面化"],"correct":1,"explain":"表出化。"},{"id":"U-19-1","chapter":19,"kind":"applied","q":"SWOT分析で新たな競合参入は通常どれに当たるか？","options":["強み（S）","脅威（T）","弱み（W）","機会（O）"],"correct":1,"explain":"外部環境の不利な要因は脅威。"},{"id":"U-19-2","chapter":19,"kind":"applied","q":"4Pで販売経路を表す要素は？","options":["Product（製品）","Price（価格）","Place（流通）","Promotion（販売促進）"],"correct":2,"explain":"Placeは商品・サービスを顧客へ届ける経路。"},{"id":"U-19-3","chapter":19,"kind":"applied","q":"PPMで低成長かつ相対シェアが高い事業は？","options":["花形","問題児","負け犬","金のなる木"],"correct":3,"explain":"低成長でも高シェアなら資金創出が期待される分類。"},{"id":"U-19-X01","chapter":19,"kind":"applied","q":"BSCの4視点に含まれないものは？","options":["競合企業の株価のみ","財務","顧客","学習と成長"],"correct":0,"explain":"BSCの4視点は財務、顧客、内部業務プロセス、学習と成長。"}],"deepIntro":"経営指標や分析フレームワークは名前を覚えるだけでなく、どんな意思決定に使えるかを考える。","deep":[{"id":"19-1","title":"3C・SWOT・ファイブフォース","explain":"\u003cp>3C分析はCustomer（顧客）、Competitor（競合）、Company（自社）。SWOT分析はStrength（強み）、Weakness（弱み）、Opportunity（機会）、Threat（脅威）を整理し、内部要因と外部要因を分ける。ファイブフォース分析は競合間の敵対、売り手・買い手の交渉力、新規参入、代替品の脅威による業界の収益構造を分析する。\u003c/p>\n\u003cp>PEST分析はPolitical（政治）、Economic（経済）、Social（社会）、Technological（技術）の外部環境。各フレームワークは答えを自動で出すものではなく、仮説整理と追加調査に使う。市場データや顧客調査で裏付ける。\u003c/p>\n","worked":"\u003cp>「大手が低価格で参入」は自社の弱みではなく外部の脅威。「自社独自の技術者集団」は内部の強み。分類した上で、技術力をどの顧客課題へ使うかを考える。\u003c/p>\n","prompt":"SWOTのOpportunityは自社の能力そのものか。","answer":"\u003cp>違う。市場拡大・規制変更など外部の機会。\u003c/p>\n","beginner":{"scenario":"自社の強い技術と弱い営業力は内部要因、市場の成長と競合参入は外部要因。内部と外部、好ましいか不利かを区別する。","trap":"SWOTの分類は自社との関係で考える。市場全体の成長は通常外部の機会。","quizId":"U-19-1"},"textbook":[{"heading":"自社を取り巻く環境","body":"3C分析はCustomer（顧客・市場）、Competitor（競合）、Company（自社）の3視点から事業の状況を整理します。顧客が求める価値、競合との違い、自社の強みを関連付けます。"},{"heading":"SWOT分析","body":"Strength（強み）とWeakness（弱み）は内部要因、Opportunity（機会）とThreat（脅威）は外部要因です。例えば独自技術は強み、販売網不足は弱み、市場拡大は機会、競合参入は脅威です。組合せから強みを活かす施策や脅威への対応を考えます。"},{"heading":"業界の利益構造","body":"ファイブフォース分析は既存競争、新規参入、代替品、買い手の交渉力、売り手の交渉力から業界の競争圧力を考えます。例えば代替品が容易に利用できると価格を上げにくくなります。SWOTは自社との関係、ファイブフォースは主に業界構造を見る手法です。"}],"walkthrough":{"heading":"一つの企業で3C・SWOT・5フォースを比較する","body":"学習アプリを売る企業を想定します。3Cでは受験者が何を求めるか、競合の教材はどんな機能を持つか、自社の教材編集力や開発力はどうかを調べます。SWOTでは内部の強みを「分かりやすい教材」、弱みを「認知度不足」、外部の機会を「試験方式の変化」、脅威を「無料教材の増加」と整理できます。ファイブフォースでは競合間の競争、新規参入の容易さ、無料動画等の代替品、利用者が乗換えやすいこと、教材供給者や配布基盤への依存を調べます。三つは同じ分析ではなく、異なる視点から事業の判断を支援します。","cols":["手法","主に答える問い"],"rows":[["3C","顧客・競合・自社はどうなっているか"],["SWOT","内部の強弱と外部の機会・脅威は何か"],["5フォース","業界で利益を得にくくする圧力は何か"]]}},{"id":"19-2","title":"STP・4P・製品ライフサイクル","explain":"\u003cp>STPはSegmentation（市場細分化）、Targeting（対象市場選択）、Positioning（選ばれる位置付け）の順に考える。4PはProduct（製品）、Price（価格）、Place（流通）、Promotion（販促）。顧客側からは4C（顧客価値・顧客コスト・利便性・コミュニケーション）で考える方法がある。\u003c/p>\n\u003cp>製品ライフサイクルは導入・成長・成熟・衰退で、需要、競争、価格戦略が変わるというモデル。実際の製品は一律の曲線をたどるわけではない。LTV（Life Time Value：顧客生涯価値）は一定期間にわたる顧客からの価値、CAC（Customer Acquisition Cost：顧客獲得費用）は獲得コスト。計算の範囲を統一する。\u003c/p>\n","worked":"\u003cp>開発者向け高機能ツールを学生のライト層へそのまま宣伝しても訴求がずれる。STPで対象を分け、重要価値（手間削減・カスタマイズ等）を選ぶ。\u003c/p>\n","prompt":"4PのPlaceは製品を置く物理的な棚だけを意味するか。","answer":"\u003cp>違う。販売チャネル・流通・提供経路全体を含む。\u003c/p>\n","beginner":{"scenario":"学生向けに安価で使いやすいアプリを位置づけたら、月額、機能、販売経路、広告を決める。対象と提供価値から販売施策を組み立てる。","trap":"STPは市場選択と位置づけ、4Pは具体的なマーケティング施策。","quizId":"U-19-2"},"textbook":[{"heading":"誰に価値を届けるか","body":"STPはSegmentation（市場細分化）、Targeting（対象市場選択）、Positioning（位置づけ）です。年齢や利用目的、購買行動などで市場を分け、自社が価値を提供できる対象を選び、競合との違いを明確にします。"},{"heading":"施策に落とす","body":"4PはProduct（製品）、Price（価格）、Place（流通）、Promotion（販売促進）です。例えば学生向け低価格アプリなら機能、月額、提供経路、広告方法を一貫して決めます。顧客の立場から価値・費用・利便性・コミュニケーションなどを見る4Cという考え方もあります。"},{"heading":"製品の成長段階","body":"製品ライフサイクルは導入期、成長期、成熟期、衰退期などで市場の変化を考えます。導入期は認知、成長期は需要拡大への対応、成熟期は差別化や効率化などが重要になる場合があります。実際の製品が必ずこの順に進むとは限りません。"}]},{"id":"19-3","title":"競争戦略・製品ポートフォリオ","explain":"\u003cp>コストリーダーシップは低コスト構造、差別化は独自価値、集中戦略は特定市場へ資源を絞る考え方。PPM（Product Portfolio Management：製品ポートフォリオ管理）では市場成長率と相対市場シェア等の軸で「花形・金のなる木・問題児・負け犬」に分類する。ただし分類で投資の可否が自動決定されるわけではない。\u003c/p>\n\u003cp>バリューチェーンは調達・製造・物流・販売・サービス等を活動単位で分析し、競争優位の源泉を探る。VRIO分析はValue（価値）、Rarity（希少性）、Imitability（模倣困難性）、Organization（組織）を検討する。\u003c/p>\n","worked":"\u003cp>高い顧客継続率が強みでも、競合も同じ仕組みを容易に導入できるなら持続的優位とは限らない。模倣困難性と組織的活用を確認する。\u003c/p>\n","prompt":"PPMで成長率が高い事業は必ず利益が高いか。","answer":"\u003cp>そうとは限らない。獲得投資で赤字の場合もある。\u003c/p>\n","beginner":{"scenario":"高成長・高シェア事業は花形、低成長・高シェアは金のなる木。収益を成長事業へ配分する判断材料にする。","trap":"PPMの分類だけで事業撤退を決めず、利益・相乗効果・将来性も見る。","quizId":"U-19-3"},"textbook":[{"heading":"競争優位を作る","body":"コストリーダーシップは低コスト構造、差別化は顧客が認める独自価値、集中戦略は特定市場に絞ることで競争優位を目指す考え方です。規模の経済は生産量拡大で単位当たり費用が下がること、範囲の経済は複数製品で資源を共有することで費用を抑えることです。"},{"heading":"事業ポートフォリオ","body":"PPM（Product Portfolio Management：製品・事業ポートフォリオ管理）は市場成長率と相対市場占有率で事業を分類します。高成長・高シェアは花形、低成長・高シェアは金のなる木、高成長・低シェアは問題児、低成長・低シェアは負け犬です。資金創出と投資配分を考える材料にします。"},{"heading":"成長の方向","body":"アンゾフの成長マトリクスは既存・新規の市場と製品を組み合わせ、市場浸透、市場開拓、製品開発、多角化を区別します。分類だけで投資や撤退を決めず、収益性、将来性、競争力、他事業との関係を評価します。"}]},{"id":"19-X01","title":"経営管理システム・目標・知識管理","explain":"\u003cp>BSC（バランストスコアカード）は財務、顧客、内部業務プロセス、学習と成長の4視点から戦略を指標に落とし込む。KGI（重要目標達成指標）は最終成果、KPI（重要業績評価指標）は途中の達成状況を測る。\u003c/p>\u003cp>ERPは企業資源計画、SFAは営業支援、CRMは顧客関係管理、SCMは供給連鎖管理、KMSは知識管理システム。SECIモデルは共同化・表出化・連結化・内面化で暗黙知と形式知が循環する。TOC（制約条件理論）は全体成果を制限する制約に注目する。\u003c/p>","worked":"\u003cp>営業担当の訪問履歴と案件の進捗をSFAで共有し、顧客対応履歴をCRMで活用する。\u003c/p>","prompt":"暗黙知を言語化して形式知にするSECIの過程は？","answer":"\u003cp>表出化。\u003c/p>","beginner":{"scenario":"営業利益を伸ばす戦略なら、顧客満足、処理時間、社員の技能などを先行指標として追い、最終的な財務成果との関係を検証する。","trap":"KPIは最終成果に結び付く指標を選ぶ。活動量だけを増やしても成果とは限らない。","quizId":"U-19-X01"},"textbook":[{"heading":"戦略を測定可能にする","body":"BSC（バランストスコアカード）は財務、顧客、内部業務プロセス、学習と成長の4視点で戦略を指標へ落とし込みます。財務成果だけでなく、その成果を生み出す顧客満足や業務改善、技能習得を考えます。KGIは最終成果、KPIは進捗や要因の指標です。"},{"heading":"業務を支える仕組み","body":"ERP（企業資源計画）は会計・販売・生産等の情報を統合し、CRM（顧客関係管理）は顧客との関係を管理、SFA（営業支援）は営業案件や活動を支援、SCM（供給連鎖管理）は供給・物流の全体最適を目指します。"},{"heading":"組織の知識を活かす","body":"SECIモデルは共同化（暗黙知の共有）、表出化（暗黙知の形式知化）、連結化（形式知の組合せ）、内面化（形式知を実践して暗黙知化）の循環です。TOC（制約条件理論）は全体の成果を制限する要因に注目し、そこを改善します。"}]},{"id":"19-Y01","title":"競争戦略・成長戦略・事業ポートフォリオ","explain":"\u003cp>アンゾフの成長マトリクスは既存・新規の市場と製品で市場浸透、市場開拓、製品開発、多角化を区別します。ポーターの基本戦略はコスト優位、差別化、集中を扱います。\u003c/p>","worked":"\u003cp>既存ゲームを新地域へ販売するのは市場開拓。成長率が低く相対シェアが高い事業は金のなる木。\u003c/p>","prompt":"既存製品を新規市場へ売る戦略は？","answer":"\u003cp>市場開拓。製品は既存、市場が新規。\u003c/p>","beginner":{"scenario":"既存のゲームを新しい地域へ販売するか、新しいサービスを既存顧客へ提供するか検討する。","trap":"市場シェアが高ければ常に成長市場とは限らない。","quizId":"U-19-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"アンゾフの成長マトリクスは既存・新規の市場と製品で市場浸透、市場開拓、製品開発、多角化を区別します。ポーターの基本戦略はコスト優位、差別化、集中を扱います。"},{"heading":"仕組みと使い分け","body":"PPM（Product Portfolio Management：製品ポートフォリオ管理）は市場成長率と相対的市場シェアで花形、金のなる木、問題児、負け犬に分類します。VRIOは価値、希少性、模倣困難性、組織を観点として経営資源を評価します。"},{"heading":"具体的な判断と手順","body":"既存ゲームを新地域へ販売するのは市場開拓。成長率が低く相対シェアが高い事業は金のなる木。"}]},{"id":"19-Y02","title":"価格戦略・販売経路・Webマーケティング指標","explain":"\u003cp>スキミング価格は初期に高い価格で支払意思の高い顧客を狙い、ペネトレーション価格は低い初期価格で普及を狙います。ダイナミック価格は需要等に応じ変え、コストプラス法は原価に利益を加えます。\u003c/p>","worked":"\u003cp>訪問2000件、購入40件ならCVR=2％。ページA/B比較では対象を適切に割り付け、購入率などを評価する。\u003c/p>","prompt":"訪問800件、購入24件のCVRは？","answer":"\u003cp>3％。24÷800×100=3％。\u003c/p>","beginner":{"scenario":"新製品を高価格から始めるか、低価格で普及させるかを検討する。","trap":"閲覧数が増えても購入率や利益が増えるとは限らない。","quizId":"U-19-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"スキミング価格は初期に高い価格で支払意思の高い顧客を狙い、ペネトレーション価格は低い初期価格で普及を狙います。ダイナミック価格は需要等に応じ変え、コストプラス法は原価に利益を加えます。"},{"heading":"仕組みと使い分け","body":"オムニチャネルは店舗・EC等の顧客体験を連携します。SEO（検索エンジン最適化）は自然検索での発見性、LPO（ランディングページ最適化）は訪問後の転換を改善します。CVR（Conversion Rate：顧客転換率）=転換数÷対象訪問数です。"},{"heading":"具体的な判断と手順","body":"訪問2000件、購入40件ならCVR=2％。ページA/B比較では対象を適切に割り付け、購入率などを評価する。"}]},{"id":"19-Y03","title":"BSC・CSF・KPIによる戦略実行","explain":"\u003cp>BSC（Balanced Scorecard：バランススコアカード）は財務、顧客、内部業務プロセス、学習と成長の四視点で戦略を具体化します。CSF（Critical Success Factor：重要成功要因）は達成に欠かせない条件です。\u003c/p>","worked":"\u003cp>従業員教育→対応品質向上→顧客満足→継続利用・利益向上という仮説を各視点の指標で検証する。\u003c/p>","prompt":"BSCの学習と成長の視点に最も近い指標は？","answer":"\u003cp>従業員の技能認定取得率。人材・組織能力は学習と成長。残りは財務、顧客、内部業務。\u003c/p>","beginner":{"scenario":"売上を伸ばしたい企業が、短期の利益だけでなく顧客満足や従業員の技能も管理する。","trap":"KPIを達成してもKGIが達成されるとは限らない。","quizId":"U-19-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"BSC（Balanced Scorecard：バランススコアカード）は財務、顧客、内部業務プロセス、学習と成長の四視点で戦略を具体化します。CSF（Critical Success Factor：重要成功要因）は達成に欠かせない条件です。"},{"heading":"仕組みと使い分け","body":"目標（KGI）、成功要因、活動とKPIを因果関係の仮説としてつなげます。目標値、期限、測定頻度、担当を設定し、結果が想定と違えば戦略や指標を見直します。"},{"heading":"具体的な判断と手順","body":"従業員教育→対応品質向上→顧客満足→継続利用・利益向上という仮説を各視点の指標で検証する。"}]},{"id":"19-Y04","title":"経営管理システム・知識管理","explain":"\u003cp>ERP（Enterprise Resource Planning：企業資源計画）は会計、生産、販売などの基幹業務を統合します。CRM（Customer Relationship Management：顧客関係管理）は顧客との関係、SFA（Sales Force Automation：営業支援）は商談活動を支援します。\u003c/p>","worked":"\u003cp>熟練担当者の判断基準を手順書に書き出すのは表出化。手順書を実践して技能を身につけるのは内面化。\u003c/p>","prompt":"熟練者の暗黙知を言語化するSECIの過程は？","answer":"\u003cp>表出化。暗黙知→形式知が表出化。\u003c/p>","beginner":{"scenario":"営業が見込み客情報を管理し、経営者が事業全体を分析したい。","trap":"ERPとCRMは対象が異なり、相互連携して使う場合もある。","quizId":"U-19-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ERP（Enterprise Resource Planning：企業資源計画）は会計、生産、販売などの基幹業務を統合します。CRM（Customer Relationship Management：顧客関係管理）は顧客との関係、SFA（Sales Force Automation：営業支援）は商談活動を支援します。"},{"heading":"仕組みと使い分け","body":"BI（Business Intelligence：経営情報分析）はデータを集約し意思決定を支援します。KMS（Knowledge Management System：知識管理システム）は経験・知識を共有します。SECIモデルは共同化、表出化、連結化、内面化による暗黙知と形式知の変換を扱います。"},{"heading":"具体的な判断と手順","body":"熟練担当者の判断基準を手順書に書き出すのは表出化。手順書を実践して技能を身につけるのは内面化。"}]}],"beginnerIntro":"市場と自社の立場を分析し、誰にどんな価値をどう届けるか考える。経営目標と施策・指標をつなげる。"},{"id":20,"title":"技術戦略マネジメント","group":"ストラテジ","priority":"A標準","summary":"技術ロードマップ、研究開発、イノベーション、標準化と知財。","lessons":[{"title":"技術ロードマップ","body":"市場ニーズ、製品開発、基盤技術、研究開発の時間軸を結び付けて投資の優先順位を決める。技術が新しいだけでは顧客価値にならない。","check":"技術の成熟度と市場投入時期を分けて検討。"},{"title":"イノベーション","body":"破壊的イノベーションは既存市場の主流顧客だけでなく、当初は周縁の用途から競争構造を変え得る。オープンイノベーションは社外の知識や資源も活用する。","check":"単なる大型改良を必ず破壊的と呼ばない。"},{"title":"標準化とIP","body":"標準必須特許やライセンスを意識し、製品差別化と相互運用性のバランスを取る。知財ポートフォリオでは特許だけでなく営業秘密やノウハウも考える。","check":"標準化＝すべて無償提供ではない。"},{"title":"研究開発管理","body":"技術リスク、事業リスク、規制リスクを分け、ステージゲートで継続・中止を判断。学習に基づく仮説更新が必要。","check":"埋没費用を理由に赤字事業を無条件継続しない。"}],"terms":[{"term":"技術ロードマップ","definition":"技術・製品・市場の発展計画を時間軸で関連付けた図"},{"term":"オープンイノベーション","definition":"社内外の知識・技術を組み合わせて革新を目指すこと"},{"term":"破壊的イノベーション","definition":"既存の競争構造を周辺市場などから変化させ得る革新"},{"term":"ステージゲート","definition":"開発段階ごとに評価し継続・中止などを判断する方式"},{"term":"研究開発ポートフォリオ","definition":"リスク・収益・時間軸が異なる研究開発の組合せ"},{"term":"デファクトスタンダード","definition":"市場で広く普及し事実上の標準となった仕様"},{"term":"デジュールスタンダード","definition":"公的・正式な標準化手続で定められた規格"},{"term":"標準必須特許","definition":"ある標準規格の実装に不可欠とされる特許"}],"questions":[{"id":"Q20-01","chapter":20,"kind":"applied","q":"製品・技術・市場の時間軸を対応付ける図は。","options":["ER図","技術ロードマップ","ガントチャートだけ","DFD"],"correct":1,"explain":"研究開発投資と市場投入時期を整合させる。"},{"id":"Q20-02","chapter":20,"kind":"applied","q":"社外の研究成果を取り込んで事業化する考え方は。","options":["オープンイノベーション","密結合","デッドロック","バックアップ"],"correct":0,"explain":"組織外の知識と資源を活かす。"},{"id":"Q20-03","chapter":20,"kind":"applied","q":"開発段階ごとに成果を評価して次段階への進行を判断するのは。","options":["データ正規化","ステージゲート","サブネット分割","多要素認証"],"correct":1,"explain":"段階的な投資判断を行う。"},{"id":"D20-01","chapter":20,"kind":"applied","q":"技術的実現可能性を小規模で確認する段階として最も近いものはどれか。","options":["PoC","SLA","RPO","CMDB"],"correct":0,"explain":"PoCは概念実証。顧客価値・商用運用の成立は別の検証が必要。"},{"id":"D20-02","chapter":20,"kind":"applied","q":"AI分類器の全体正解率95%だけで商用化を判断できない理由はどれか。","options":["入力データは常に同じ","重要な誤判定の種類や実運用データ分布が不明だから","保守費は必ずゼロ","精度は定義できない"],"correct":1,"explain":"誤分類の影響、偽陰性・偽陽性、分布変化、人手運用などを検証する。"},{"id":"D20-03","chapter":20,"kind":"applied","q":"特許を出願したことと「他社の特許を侵害せず販売できること」の関係はどれか。","options":["出願時点で販売の自由が保証される","出願すれば競合の技術を自由に使用できる","別途実施の自由（FTO）の検討が必要","海外販売は常に無制限"],"correct":2,"explain":"自分の特許取得・出願は、他者権利の非侵害を保証しない。"},{"id":"Q-20-X01","chapter":20,"kind":"applied","q":"製品設計と生産工程設計を並行して進める方法は？","options":["ウォーターフォール","コンカレントエンジニアリング","正規化","デュプレックス"],"correct":1,"explain":"コンカレントエンジニアリング。"},{"id":"U-20-1","chapter":20,"kind":"applied","q":"技術・製品・市場の目標を時間軸で関連付けるものは？","options":["監査調書","技術ロードマップ","ER図","真理値表"],"correct":1,"explain":"技術ロードマップは将来目標と技術開発の時期を可視化する。"},{"id":"U-20-2","chapter":20,"kind":"applied","q":"新技術の実現可能性を小規模に確認する活動は？","options":["SLA（サービスレベル合意）","RPO（復旧時点目標）","PoC（概念実証）","MRP（資材所要量計画）"],"correct":2,"explain":"PoCは技術やアイデアが実現可能か検証する。"},{"id":"U-20-3","chapter":20,"kind":"applied","q":"市場で広く普及した結果として事実上の標準となるものは？","options":["デジュールスタンダード","特許査定","商標登録","デファクトスタンダード"],"correct":3,"explain":"デファクトは市場での普及、デジュールは公的な標準化手続による標準。"},{"id":"U-20-X01","chapter":20,"kind":"applied","q":"外部研究機関や企業の技術も取り込んで研究開発する考え方は？","options":["オープンイノベーション","クローズドイノベーション","ウォーターフォールのみ","データ正規化"],"correct":0,"explain":"外部の知識や技術を活用して革新を進める。"}],"deepIntro":"技術を開発することと、事業価値に結び付けることは異なる。研究開発投資や技術選択のリスクを管理する。","deep":[{"id":"20-1","title":"技術ロードマップ・研究開発管理","explain":"\u003cp>技術ロードマップは市場・製品・技術・資源の時間的な関係を整理し、実用化に必要な技術課題や開発時期を見える化する。技術ポートフォリオでは将来性、成熟度、差別化、必要投資、依存関係を評価する。技術の不確実性と市場の不確実性は別に評価する。\u003c/p>\n\u003cp>オープンイノベーションは外部企業・大学・顧客などの知識や技術を組み合わせて価値創出を図る。共同研究では知的財産の帰属、成果物の利用範囲、秘密保持、公開の可否を最初に検討する。\u003c/p>\n","worked":"\u003cp>将来の製品を2年後に投入するには、半年前に量産評価、その前に技術実証が必要と逆算する。ロードマップは希望の日付を並べるだけでなく、依存関係と検証条件を定義する。\u003c/p>\n","prompt":"技術の成熟度が高ければ顧客ニーズも必ずあるか。","answer":"\u003cp>ない場合がある。技術検証と市場検証を分ける。\u003c/p>\n","beginner":{"scenario":"3年後に省電力製品を出す計画なら、必要なセンサ、半導体、試作時期、性能目標を逆算して並べる。","trap":"ロードマップは時間軸のある目標・技術計画であり、単なる技術一覧ではない。","quizId":"U-20-1"},"textbook":[{"heading":"技術を経営につなげる","body":"技術戦略は将来の事業価値に必要な技術を選び、研究開発の資源配分を決める活動です。市場ニーズは顧客の課題や需要、技術シーズは利用可能な技術の種です。両者を結び付けて製品やサービスを構想します。"},{"heading":"ロードマップの使い方","body":"技術ロードマップは市場の変化、製品計画、必要技術、研究開発の時期を時間軸で関連付けます。例えば3年後に省電力製品を出すため、2年後に試作、1年後に要素技術を検証するといった計画を立てます。"},{"heading":"研究開発を管理する","body":"不確実性が高い研究では目標、検証方法、中止・継続基準を決めます。ステージゲートは段階ごとに成果と投資継続を評価する方法です。研究開発ポートフォリオでは短期の改善と長期の新技術などの配分を考えます。"}]},{"id":"20-2","title":"事業化・価値検証・プロトタイプ","explain":"\u003cp>PoC（Proof of Concept：概念実証）は技術的実現可能性等を確かめる試験、MVP（Minimum Viable Product：実用最小限の製品）は顧客へ価値を届けて仮説検証する最小の製品。PoCが成功しても業務導入コスト・法規制・顧客獲得等が成立するとは限らない。事業化では市場性、技術性、競争優位、収益性、実行体制を総合評価する。\u003c/p>\n\u003cp>技術採用は試験環境での動作だけでなく、品質管理、保守、性能、セキュリティ、量産可能性まで検証する。撤退条件や次段階への移行基準を事前に定める。\u003c/p>\n","worked":"\u003cp>AIで画像を分類できたPoCが成功しても、実運用ではデータ取得、誤判定時の人手確認、法令、計算費用が必要。顧客の業務時間削減を測るMVP検証が別に必要。\u003c/p>\n","prompt":"PoCの精度が95%ならそのまま商用化してよいか。","answer":"\u003cp>断定できない。誤りの種類、重要度、実際のデータ分布、運用費や安全性を評価する。\u003c/p>\n","beginner":{"scenario":"音声で注文できる試作を顧客に使ってもらう。認識精度が高くても既存操作より時間がかかるなら事業価値は弱い。","trap":"技術的に動くことと顧客が使い続け購入することは別。","quizId":"U-20-2"},"textbook":[{"heading":"技術の成功と事業の成功","body":"高性能の技術が完成しても、顧客の課題を解決できなければ売れるとは限りません。誰のどの課題にどの程度価値を提供するかを仮説にし、技術的実現性と顧客の反応を分けて検証します。"},{"heading":"検証方法を選ぶ","body":"PoC（概念実証）は主にアイデアや技術が実現可能か確認し、プロトタイプは試作品として機能や操作を確認します。MVP（実用最小限の製品）は価値の仮説を検証するため必要最小限の製品・機能を提供する考え方です。"},{"heading":"事業化を判断する","body":"顧客の利用継続、支払意思、提供費用、量産性、法令、競争優位を評価します。イノベーションは技術の発明だけでなく新しい価値の実現を含みます。検証結果に基づき開発内容を変更、中止、拡大する判断をします。"}]},{"id":"20-3","title":"標準化・技術移転・知財戦略","explain":"\u003cp>技術を守る手段には特許権、営業秘密、著作権、契約、先行者利益などがある。特許公開は技術情報の公開と引換えに一定期間の独占的権利を得る仕組みで、営業秘密は秘密管理・有用性・非公知性などが要件。すべての技術が特許化に適するとは限らない。\u003c/p>\n\u003cp>標準化は互換性や市場拡大を助けるが、標準必須特許やライセンス、競争政策も考慮する。技術移転では権利範囲、地域、用途、改良成果、再許諾、対価などを定める。\u003c/p>\n","worked":"\u003cp>製造ノウハウを公開すると模倣が容易になるが、秘密のまま運用で守れる場合もある。特許の新規性・進歩性と秘密管理可能性を比較して判断する。\u003c/p>\n","prompt":"特許を出願した時点で、他社の権利を侵害せず製造販売できるか。","answer":"\u003cp>保証されない。実施の自由（FTO：Freedom To Operate）は別途調査が必要。\u003c/p>\n","beginner":{"scenario":"機器間の接続仕様を標準化して周辺製品を増やし、独自の性能改善技術は特許・秘密管理で保護する戦略を考えられる。","trap":"標準化はすべての技術を無償で公開することを意味しない。","quizId":"U-20-3"},"textbook":[{"heading":"標準化が価値を生む理由","body":"接続仕様が共通なら異なる企業の製品を組み合わせやすくなり、周辺製品や利用者が増える可能性があります。デジュールスタンダードは公的・正式な標準化手続による標準、デファクトスタンダードは市場で普及して事実上の標準となったものです。"},{"heading":"技術移転と知的財産","body":"技術移転は研究機関や企業の技術を別の組織へ移し実用化につなげる活動です。特許のライセンス、共同開発、ノウハウの提供などを利用します。特許、営業秘密、著作権等は保護する対象と方法が異なります。"},{"heading":"標準と独自性の組合せ","body":"互換性に必要な仕様を標準化し、独自の性能改善技術を保護する戦略もあります。標準必須特許は標準に準拠するため実施が必要となる特許を指します。標準化がすべての技術の無償利用を意味するわけではなく、ライセンス条件や競争法等も関係します。"}]},{"id":"20-X01","title":"技術開発戦略・投資計画","explain":"\u003cp>MOT（技術経営）は技術を経営成果に結び付ける。技術開発戦略では市場ニーズと技術シーズ、競争優位、知財、投資資源を評価する。オープンイノベーションは外部の知識・技術も利用し、技術移転や共同開発を行う。\u003c/p>\u003cp>技術開発計画は人材・資金・設備・拠点・製品化時期を具体化し、技術ロードマップに技術・製品・市場の時間的な関係を表す。コンカレントエンジニアリングは設計・製造等を並行検討し手戻りを減らす。パイロット生産は本格量産前に工程や品質を検証する。\u003c/p>","worked":"\u003cp>製造部門が設計初期から参加し部品組立性を評価すると、量産段階での設計変更を減らせる。\u003c/p>","prompt":"製品設計と生産工程設計を並行して進める方法は？","answer":"\u003cp>コンカレントエンジニアリング。\u003c/p>","beginner":{"scenario":"製品設計の初期に生産部門が組立てやすさを確認することで、試作後に部品形状を大きく変更する手戻りを減らせる。","trap":"並行開発は情報共有なしに別々に作業することではない。","quizId":"U-20-X01"},"textbook":[{"heading":"研究開発の方法","body":"MOT（技術経営）は技術を経営資源として活用し事業価値につなげる考え方です。オープンイノベーションは外部企業や研究機関の知識を取り入れ、内部だけでは得にくい技術・市場機会を活用します。共同研究では成果や知財の帰属を明確にします。"},{"heading":"開発計画を具体化する","body":"必要人材、設備、資金、技術目標、試作・製品化の時期を整理し、リスクの大きい技術から検証します。コンカレントエンジニアリングは設計・製造などを並行して検討し、後工程からの手戻りを減らす方法です。"},{"heading":"量産への移行","body":"パイロット生産では本格量産前に工程、品質、歩留まり、コストを検証します。研究段階で一つ成功したことと、大量に安定して製造できることは別です。市場・技術・費用の状況に応じて計画を更新します。"}]},{"id":"20-Y01","title":"技術の事業化障壁・外部資源活用","explain":"\u003cp>研究から開発へ進む障壁を魔の川、開発から事業化への障壁を死の谷、事業として市場競争を生き抜く障壁をダーウィンの海と呼ぶことがあります。技術のSカーブは性能改善が初期・成長・成熟で異なる傾向を示します。\u003c/p>","worked":"\u003cp>センサの測定精度はPoC、現場での損失削減はPoV、最低限の販売可能製品はMVPで確かめる。\u003c/p>","prompt":"技術が原理どおり実現できるかを検証する活動は？","answer":"\u003cp>PoC。PoCは技術的実現可能性の実証。\u003c/p>","beginner":{"scenario":"研究室で新しいセンサを開発したが、量産と販売までには別の課題がある。","trap":"技術が動くことと事業が成立することは別。","quizId":"U-20-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"研究から開発へ進む障壁を魔の川、開発から事業化への障壁を死の谷、事業として市場競争を生き抜く障壁をダーウィンの海と呼ぶことがあります。技術のSカーブは性能改善が初期・成長・成熟で異なる傾向を示します。"},{"heading":"仕組みと使い分け","body":"PoC（Proof of Concept：概念実証）は技術的実現性、PoV（Proof of Value：価値実証）は価値、MVP（Minimum Viable Product：実用最小限の製品）は必要最小限の製品で仮説を検証します。共同研究、TLO（技術移転機関）、ライセンス等で外部資源を活用します。"},{"heading":"具体的な判断と手順","body":"センサの測定精度はPoC、現場での損失削減はPoV、最低限の販売可能製品はMVPで確かめる。"}]},{"id":"20-Y02","title":"技術ロードマップ・研究開発計画","explain":"\u003cp>技術ロードマップは市場・製品・技術の目標を時間軸上に関連づけます。将来の望ましい状態から必要な行動を逆算するバックキャスティングと、現状から将来を推定するフォアキャスティングを使い分けます。\u003c/p>","worked":"\u003cp>3年後発売→2年後量産試験→1年後試作→半年後基盤技術の選定という順で必要な期限を考える。\u003c/p>","prompt":"将来目標から逆算して必要な技術開発を決める手法は？","answer":"\u003cp>バックキャスティング。望ましい将来像から現在の行動を逆算する。\u003c/p>","beginner":{"scenario":"3年後に省電力端末を発売するため、必要な技術と開発時期を逆算する。","trap":"ロードマップは単なる日程表ではなく技術と製品の関係も示す。","quizId":"U-20-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"技術ロードマップは市場・製品・技術の目標を時間軸上に関連づけます。将来の望ましい状態から必要な行動を逆算するバックキャスティングと、現状から将来を推定するフォアキャスティングを使い分けます。"},{"heading":"仕組みと使い分け","body":"技術開発計画は投資、人材、拠点、知財、試作・量産時期を決めます。コンカレントエンジニアリングは設計・生産などを並行・連携して手戻りを抑えます。段階ごとの評価で継続・中止を判断します。"},{"heading":"具体的な判断と手順","body":"3年後発売→2年後量産試験→1年後試作→半年後基盤技術の選定という順で必要な期限を考える。"}]}],"beginnerIntro":"技術を研究するだけでなく製品・事業として価値に変える方法を学ぶ。市場ニーズ、技術開発、標準化、知財を関連づける。"},{"id":21,"title":"ビジネスインダストリ","group":"ストラテジ","priority":"A標準","summary":"EC、SCM、ERP、IoT、製造管理、電子決済など産業別ITの基本。","lessons":[{"title":"企業内・企業間システム","body":"ERP（Enterprise Resource Planning：統合基幹業務システム）は会計・人事・販売等を統合、SCM（Supply Chain Management：供給連鎖管理）は調達から販売までの流れを最適化する。","check":"ERPは社内統合、SCMは企業間連携まで視野。"},{"title":"顧客とデータ","body":"CRM（Customer Relationship Management：顧客関係管理）は顧客情報や接点を統合。POS（Point of Sales：販売時点情報管理）は売上・商品データを蓄積し需要分析等へ活用。","check":"個人情報の利用目的と最小限の管理が必要。"},{"title":"製造と物流","body":"CAD（Computer-Aided Design：コンピュータ支援設計）で設計、CAM（Computer-Aided Manufacturing：コンピュータ支援製造）で製造指示。IoT（Internet of Things：モノのインターネット）はセンサや機器のデータを活用。","check":"設計・製造・制御が異なる段階。"},{"title":"ECと決済","body":"EC（Electronic Commerce：電子商取引）では決済・注文・在庫・配送が連動する。EDI（Electronic Data Interchange：電子データ交換）は企業間取引データを標準形式でやり取りする。","check":"電子化はなりすましや改ざん対策も必要。"}],"terms":[{"term":"ERP","definition":"会計・人事・販売などの基幹業務を統合するシステム"},{"term":"SCM","definition":"調達・生産・物流・販売の供給連鎖を最適化する管理"},{"term":"CRM","definition":"顧客情報と接点を管理し関係を改善する仕組み"},{"term":"POS","definition":"販売時点で商品・数量・価格等の情報を取得する仕組み"},{"term":"CAD","definition":"コンピュータを用いた設計支援"},{"term":"CAM","definition":"コンピュータによる製造支援"},{"term":"IoT","definition":"モノをネットワークにつないでデータを収集・活用する仕組み"},{"term":"EDI","definition":"企業間の受発注などのデータを標準化して電子交換する仕組み"},{"term":"電子商取引","definition":"ネットワーク上で商品・サービス等を取引すること"},{"term":"デジタルツイン","definition":"実世界の対象の状態をデジタル空間に再現し分析等に活用する仕組み"}],"questions":[{"id":"Q21-01","chapter":21,"kind":"applied","q":"取引先を含む調達・生産・物流全体の最適化は。","options":["SCM","CRM","CAD","SLA"],"correct":0,"explain":"SCMは供給連鎖全体を扱う。"},{"id":"Q21-02","chapter":21,"kind":"applied","q":"販売時に商品別の売上を記録する仕組みは。","options":["CMDB","POS","VPN","PKI"],"correct":1,"explain":"POSは販売時点で取引情報を収集する。"},{"id":"Q21-03","chapter":21,"kind":"applied","q":"コンピュータ上の設計を支援する技術は。","options":["CAD","CAM","NAT","DNS"],"correct":0,"explain":"CADは設計、CAMは製造。"},{"id":"D21-01","chapter":21,"kind":"applied","q":"完成品100個に部品Aが各3個必要で、部品在庫50個の単純な正味所要量はどれか。","options":["50個","150個","250個","350個"],"correct":2,"explain":"100×3−50=250個。実務では発注残、安全在庫、リードタイムなども考慮する。"},{"id":"D21-02","chapter":21,"kind":"applied","q":"顧客データを部門横断で統合し関係維持を支援する仕組みはどれか。","options":["RAID","CRM","CRC","ADC"],"correct":1,"explain":"CRMは顧客関係管理。購買・問い合わせ等を統合して顧客接点を改善する。"},{"id":"D21-03","chapter":21,"kind":"applied","q":"工場AIの異常検知で重大異常の見逃しを測るとき、全体正解率より適切な指標はどれか。","options":["重大異常クラスの再現率","ソフトウェアの行数","端末の画面サイズ","平均社員年齢"],"correct":0,"explain":"見逃しは偽陰性。重大異常の再現率（感度）などを確認する。"},{"id":"Q-21-X01","chapter":21,"kind":"applied","q":"構造物の応力解析に主に使うシステムは？","options":["CAD","CAE","CAM","POS"],"correct":1,"explain":"CAE。"},{"id":"Q-21-X02","chapter":21,"kind":"applied","q":"消費者同士が取引するフリーマーケットアプリの分類は？","options":["BtoB","BtoC","CtoC","GtoB"],"correct":2,"explain":"CtoC。"},{"id":"U-21-1","chapter":21,"kind":"applied","q":"供給連鎖の上流ほど発注変動が増幅する現象は？","options":["ネットワーク効果","ブルウィップ効果","規模の経済","桁落ち"],"correct":1,"explain":"需要変化の予測・在庫調整などが連鎖し上流の発注変動を増幅する。"},{"id":"U-21-2","chapter":21,"kind":"applied","q":"企業間で注文書や請求書を電子データとして交換する仕組みは？","options":["CRM","POS","EDI","CAD"],"correct":2,"explain":"EDI（Electronic Data Interchange：電子データ交換）は企業間の取引情報交換。"},{"id":"U-21-3","chapter":21,"kind":"applied","q":"収集データを機器の近くで処理して通信遅延を抑える方式は？","options":["バッチ処理のみ","データ正規化","RAID","エッジコンピューティング"],"correct":3,"explain":"エッジ処理はデータ発生源の近くで処理する。"},{"id":"U-21-X01","chapter":21,"kind":"applied","q":"製品計画、部品表、在庫から部品の必要数量を求める方式は？","options":["MRP","CRM","SFA","BSC"],"correct":0,"explain":"MRP（Material Requirements Planning：資材所要量計画）は部品の必要量・時期を算出する。"},{"id":"U-21-X02","chapter":21,"kind":"applied","q":"企業が一般消費者に直接商品を販売するECの分類は？","options":["BtoB","BtoC","CtoC","GtoG"],"correct":1,"explain":"BtoCは企業対消費者、BtoBは企業間、CtoCは消費者間。"}],"deepIntro":"ITが実際の業務・産業に入るとき、データの流れ・取引の流れ・責任の所在を理解する。","deep":[{"id":"21-1","title":"製造・生産管理・サプライチェーン","explain":"\u003cp>ERP（Enterprise Resource Planning：企業資源計画）は会計・販売・購買・生産などの企業資源を横断して管理する。MRP（Material Requirements Planning：資材所要量計画）は生産計画・部品表（BOM）・在庫から必要な材料量と時期を算出する。SCM（Supply Chain Management：供給連鎖管理）は仕入れから生産・物流・販売までを全体最適する。\u003c/p>\n\u003cp>JIT（Just In Time：必要なものを必要なときに必要なだけ供給）は在庫削減を目指すが、需要変動・供給途絶に弱くなる可能性もある。トレーサビリティはロット・取引履歴を追跡し、不良品回収等で役立つ。\u003c/p>\n","worked":"\u003cp>製品1個に部品Aが3個必要で100個生産、部品在庫が50個なら単純な正味所要量は300−50＝250個。実際のMRPではリードタイム、安全在庫、既発注残を加味する。\u003c/p>\n","prompt":"ERPを導入すると部門間のデータ定義の統一が不要か。","answer":"\u003cp>むしろ導入時に統一・標準化の検討が必要。\u003c/p>\n","beginner":{"scenario":"店舗が需要増に備え余分に発注し、卸もさらに余分に発注すると、上流に行くほど実際の需要変動より大きな注文変動が生じる。","trap":"在庫を減らせば必ず全体の利益が増えるわけではない。欠品・調達期間も考慮する。","quizId":"U-21-1"},"textbook":[{"heading":"商品が顧客に届くまで","body":"製造業では需要予測、資材調達、生産、在庫、物流、販売が連携します。各工程だけを効率化すると全体の在庫や欠品が増える場合があります。SCM（供給連鎖管理）は企業間も含めた供給の流れ全体を管理します。"},{"heading":"必要量と時期","body":"MRP（資材所要量計画）は製品生産計画、部品表、在庫、調達期間から部品の必要量と発注時期を算出します。JIT（ジャストインタイム）は必要なものを必要な時に必要量供給する考え方です。在庫削減だけでなく欠品、供給遅延、品質を考慮します。"},{"heading":"全体を改善する","body":"ブルウィップ効果は需要変動が上流の発注量に増幅される現象です。販売情報の共有、発注周期の見直し等で抑制を目指します。ERP（企業資源計画）は販売・生産・会計等の情報を統合し、業務間の整合性を支援します。"}]},{"id":"21-2","title":"電子商取引・決済・顧客管理","explain":"\u003cp>EC（Electronic Commerce：電子商取引）はBtoB（企業間）、BtoC（企業・消費者間）、CtoC（個人間）などの形態がある。EDI（Electronic Data Interchange：電子データ交換）は注文書・請求書等の取引データを標準的な形式で交換する仕組み。決済では本人認証、カード情報の保護、不正検知、返金・チャージバックなどの業務も考える。\u003c/p>\n\u003cp>CRM（Customer Relationship Management：顧客関係管理）は顧客情報・接点・継続利用を統合して管理する。顧客データを集めるときは同意・利用目的・アクセス権・品質を考慮する。電子署名・電子契約・電子帳簿の適法要件は契約種別と制度に依存する。\u003c/p>\n","worked":"\u003cp>注文が成功しても在庫更新に失敗した場合、顧客への通知・決済取消し・補償など例外処理が必要。システム図と業務フローを対応させる。\u003c/p>\n","prompt":"購買履歴を集めれば目的外利用に制限はないか。","answer":"\u003cp>ないわけではない。個人情報保護や契約に基づく目的・同意・安全管理が必要。\u003c/p>\n","beginner":{"scenario":"Web注文の受付、決済承認、在庫引当、出荷は別の処理。途中失敗時は二重請求や過剰販売を防ぐ必要がある。","trap":"決済承認と売上確定は必ずしも同じではない。","quizId":"U-21-2"},"textbook":[{"heading":"電子商取引の仕組み","body":"EC（電子商取引）はネットワーク経由の取引で、BtoBは企業間、BtoCは企業と消費者、CtoCは消費者間です。EDI（電子データ交換）は企業間で注文・請求などの取引データを標準化して交換する仕組みです。POS（販売時点情報管理）は店舗での販売情報を収集します。"},{"heading":"注文と決済を分ける","body":"注文受付、決済承認、在庫引当て、出荷、売上確定は別の処理です。途中で通信が失敗して再試行する場合、二重請求や二重注文を防ぐ設計が必要です。決済情報と個人情報の保護、取引記録、返金手続を考えます。"},{"heading":"顧客との関係","body":"CRM（顧客関係管理）は購買履歴や問い合わせ情報を活用して顧客対応を改善します。SFA（営業支援）は案件の進捗や営業活動を管理します。データを集めるだけでなく利用目的、権限、品質を定めることが重要です。"}]},{"id":"21-3","title":"IoT・AI・業務適用","explain":"\u003cp>IoTは現実の装置をネットワークにつなぎ、収集したデータで監視・予測・制御を行う。エッジ処理は機器近くで処理して遅延・通信量を減らし、クラウド処理は大規模集約・分析などに向く。AI（Artificial Intelligence：人工知能）を業務へ導入するときは入力データ、学習と推論の分布差、説明可能性、人の確認、誤判定の責任を検討する。\u003c/p>\n\u003cp>機械学習では教師あり学習が正解ラベルを使い、教師なし学習はデータ構造を発見し、強化学習は報酬に基づいて行動方針を学ぶ。学習データ上の精度が高くても未見の環境で性能が保たれるとは限らない（過学習・分布シフト）。\u003c/p>\n","worked":"\u003cp>工場センサの異常検知を自動停止に直結する場合、偽陽性による停止損失・偽陰性による事故リスクがある。人手確認、しきい値、フェイルセーフ、ログを設計する。\u003c/p>\n","prompt":"AI分類器の全体正解率が99%なら、重大異常を99%見逃さないか。","answer":"\u003cp>そうとは限らない。重大異常の再現率や偽陰性率を別に評価する。\u003c/p>\n","beginner":{"scenario":"工場の振動センサで値を取得し、エッジで異常を検出して保全担当に通知する。クラウドに全データを送らず遅延を抑える場合もある。","trap":"IoTは機器の接続・データ取得、AIはデータ分析の方法。両方が必須とは限らない。","quizId":"U-21-3"},"textbook":[{"heading":"IoTの全体像","body":"IoT（Internet of Things：モノのインターネット）はセンサなどの機器をネットワークへ接続し状態を取得・制御する仕組みです。工場設備の振動や温度を収集し、故障の兆候を分析する予知保全などに利用されます。"},{"heading":"エッジとクラウド","body":"データ発生源の近くで処理するエッジコンピューティングは通信遅延や送信量を抑えられる場合があります。クラウドでは複数拠点の大量データを統合して分析しやすくなります。リアルタイム制御、電力、通信障害時の動作から処理場所を選びます。"},{"heading":"AIの業務活用","body":"予測、分類、異常検知、生成などを業務へ適用します。モデルを導入しただけでは成果が出るとは限らないので、学習データの品質、未知データでの性能、誤判定時の影響、人による確認、継続的な監視を設計します。機器の認証、更新、ネットワーク分離も重要です。"}]},{"id":"21-X01","title":"製造・エンジニアリングシステム","explain":"\u003cp>MRP（資材所要量計画）は生産計画、部品表、在庫、調達期間から必要な資材と発注時期を計算する。JIT（ジャストインタイム）は必要なものを必要な時に必要量供給する。生産管理では需要予測、在庫、工程、品質、納期を調整する。\u003c/p>\u003cp>CAD（コンピュータ支援設計）は図面・モデル作成、CAE（コンピュータ支援工学）はシミュレーションや解析、CAM（コンピュータ支援製造）は加工データ作成、CIM（コンピュータ統合生産）は設計・生産等の統合を指す。デジタルツインは実物とデジタルモデルを対応させる。\u003c/p>","worked":"\u003cp>製品10個に部品Bを3個ずつ使用し在庫8個なら、他の入荷や安全在庫を無視した純所要量は22個。\u003c/p>","prompt":"構造物の応力解析に主に使うシステムは？","answer":"\u003cp>CAE。\u003c/p>","beginner":{"scenario":"製品10個に部品を3個ずつ使い、在庫8個、他の入荷や安全在庫なしなら純所要量は10×3−8＝22個。納期に合わせ発注時期も考える。","trap":"MRPは必要量・時期の計画。JITは必要なものを必要な時に必要量供給する考え方。","quizId":"U-21-X01"},"textbook":[{"heading":"製造を計画する","body":"例えば製品10個に部品Aが3個ずつ必要で、在庫8個、追加の入荷なしなら純所要量は30−8＝22個です。MRPでは部品表を階層的に展開し、調達リードタイムを考慮して発注時期を逆算します。"},{"heading":"設計・解析・製造をつなぐ","body":"CAD（コンピュータ支援設計）は形状や図面を作り、CAE（コンピュータ支援工学）は強度・流体等を解析し、CAM（コンピュータ支援製造）は加工データを作るなど製造を支援します。CIM（コンピュータ統合生産）はこれらを含む生産活動を情報で統合する考え方です。"},{"heading":"現実とモデルの対応","body":"デジタルツインは実物の状態をデジタルモデルに対応させ、計測データから状態の把握や予測・シミュレーションに利用します。モデルが現実を完全に再現するわけではないため、実測との照合や更新を行います。"}]},{"id":"21-X02","title":"民生機器・産業機器と電子ビジネス","explain":"\u003cp>民生機器は家電、スマートフォン、ゲーム機、ウェアラブルなど。産業機器は工場ロボット、工作機械、プラント制御、医療・交通等の機器を含む。組込みシステムではリアルタイム性、消費電力、安全性、保守性、ネット接続のリスクが重要となる。\u003c/p>\u003cp>IoT（モノのインターネット）では端末、通信、クラウド・エッジ処理を組み合わせる。電子商取引（EC）にはBtoB（企業間）、BtoC（企業対消費者）、CtoC（消費者間）がある。EDIは企業間の電子データ交換、POSは販売時点情報管理。決済では認証、改ざん防止、個人情報保護、取引記録が必要。\u003c/p>","worked":"\u003cp>工場設備の振動データから故障兆候を検出し点検を指示する予知保全は、産業機器におけるIoT活用例。\u003c/p>","prompt":"消費者同士が取引するフリーマーケットアプリの分類は？","answer":"\u003cp>CtoC。\u003c/p>","beginner":{"scenario":"家電の温度制御では安全性や消費電力が重要。工場ロボットでは正確な位置制御に加え、停止時の安全・稼働率も重要。","trap":"民生と産業機器は用途が異なるが、共通の組込み技術を利用することもある。","quizId":"U-21-X02"},"textbook":[{"heading":"民生・産業機器の違い","body":"家電、スマートフォン、ゲーム機など一般利用者向けの機器を民生機器、工場ロボットや工作機械など産業用途の機器を産業機器と呼びます。どちらにもセンサ・制御回路・ソフトウェアが使われますが、安全性、耐環境性、応答期限、稼働期間などの要求が異なります。"},{"heading":"社会インフラへの応用","body":"交通、医療、電力などでは機器の故障が人命や重要サービスに影響し得ます。安全状態への移行、障害検知、冗長化、手動操作、保守計画などを用途に応じ設計します。"},{"heading":"接続された機器の管理","body":"遠隔監視や更新で保守を効率化できますが、ネット接続は新しい攻撃経路にもなります。機器IDと認証、ソフトウェア更新、権限分離、廃棄時のデータ消去を考えます。便益とリスクをライフサイクル全体で評価します。"}]},{"id":"21-Y01","title":"生産・在庫・物流・販売管理","explain":"\u003cp>MRP（Material Requirements Planning：資材所要量計画）は製品需要、部品表、在庫、リードタイムから資材量と発注時期を計算します。JIT（Just In Time：必要な物を必要な時に必要な量だけ）は在庫や無駄の抑制を狙います。\u003c/p>","worked":"\u003cp>製品100個に部品Aが3個ずつ必要、在庫50個なら追加所要量は250個（他の入荷・安全在庫なし）。\u003c/p>","prompt":"製品計画と部品表から必要な資材を計算する仕組みは？","answer":"\u003cp>MRP。資材所要量計画は製品需要から部品需要を展開する。\u003c/p>","beginner":{"scenario":"製造会社が納期遅延と過剰在庫を減らしたい。","trap":"在庫ゼロが常に最適とは限らず、欠品リスクも考慮する。","quizId":"U-21-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"MRP（Material Requirements Planning：資材所要量計画）は製品需要、部品表、在庫、リードタイムから資材量と発注時期を計算します。JIT（Just In Time：必要な物を必要な時に必要な量だけ）は在庫や無駄の抑制を狙います。"},{"heading":"仕組みと使い分け","body":"SCM（Supply Chain Management：供給連鎖管理）は調達から販売まで全体を最適化します。POS（Point of Sale：販売時点情報管理）は販売時の記録、EDI（Electronic Data Interchange：電子データ交換）は企業間取引情報の交換です。"},{"heading":"具体的な判断と手順","body":"製品100個に部品Aが3個ずつ必要、在庫50個なら追加所要量は250個（他の入荷・安全在庫なし）。"}]},{"id":"21-Y02","title":"CAD・CAM・CAE・MESと製造連携","explain":"\u003cp>CAD（Computer Aided Design：コンピュータ支援設計）は設計、CAE（Computer Aided Engineering：コンピュータ支援工学）は強度や熱等の解析、CAM（Computer Aided Manufacturing：コンピュータ支援製造）は加工・製造を支援します。\u003c/p>","worked":"\u003cp>CADで部品を設計し、CAEで応力を評価し、CAMで加工データを作り、MESで製造実績を追跡する。\u003c/p>","prompt":"設計した部品が荷重に耐えるか数値解析する仕組みは？","answer":"\u003cp>CAE。CAEは工学的解析。CADは設計、CAMは製造支援。\u003c/p>","beginner":{"scenario":"製品設計をデジタル化し、強度検証から加工、工場の進捗まで連携させる。","trap":"CADとCAEは同じ機能ではない。","quizId":"U-21-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"CAD（Computer Aided Design：コンピュータ支援設計）は設計、CAE（Computer Aided Engineering：コンピュータ支援工学）は強度や熱等の解析、CAM（Computer Aided Manufacturing：コンピュータ支援製造）は加工・製造を支援します。"},{"heading":"仕組みと使い分け","body":"PDM（Product Data Management：製品データ管理）は図面や部品情報の版管理、PLM（Product Lifecycle Management：製品ライフサイクル管理）は企画から廃棄まで管理します。MES（Manufacturing Execution System：製造実行システム）は現場の生産指示・実績・品質を管理します。"},{"heading":"具体的な判断と手順","body":"CADで部品を設計し、CAEで応力を評価し、CAMで加工データを作り、MESで製造実績を追跡する。"}]},{"id":"21-Y03","title":"電子商取引・決済・EDI・メディア","explain":"\u003cp>B2C（企業対消費者）、B2B（企業間）、C2C（消費者間）は取引主体の分類です。電子商取引では注文、決済、配送、返品、本人確認、個人情報を管理します。\u003c/p>","worked":"\u003cp>小売から卸へ注文データを標準形式で送るのはB2BのEDI。個人間の中古品取引はC2C。\u003c/p>","prompt":"企業間の受発注データを標準形式で交換する仕組みは？","answer":"\u003cp>EDI。EDIは電子データ交換。\u003c/p>","beginner":{"scenario":"ネットショップで顧客が注文し、店舗と卸売業者が電子的に発注情報を交換する。","trap":"B2BとB2Cは利用技術ではなく取引主体の違い。","quizId":"U-21-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"B2C（企業対消費者）、B2B（企業間）、C2C（消費者間）は取引主体の分類です。電子商取引では注文、決済、配送、返品、本人確認、個人情報を管理します。"},{"heading":"仕組みと使い分け","body":"EDIは企業間で標準化した取引情報を交換します。電子決済では前払い・即時払い・後払い等で資金移転時期が違います。CMS（Content Management System：コンテンツ管理システム）は記事等の管理、CGM（Consumer Generated Media：消費者生成メディア）は利用者がコンテンツを作る形態です。"},{"heading":"具体的な判断と手順","body":"小売から卸へ注文データを標準形式で送るのはB2BのEDI。個人間の中古品取引はC2C。"}]},{"id":"21-Y04","title":"組込み・民生機器・屋内測位","explain":"\u003cp>組込みシステムは機器に内蔵され特定機能を実現します。マイコン、センサ、アクチュエータ、ファームウェア、リアルタイムOS等で構成され、省電力、応答期限、安全性が重要です。\u003c/p>","worked":"\u003cp>温度センサ→マイコンで設定値と比較→ヒータの制御→再測定という流れ。\u003c/p>","prompt":"家庭内のエネルギー使用を見える化・管理する仕組みは？","answer":"\u003cp>HEMS。HEMSは家庭エネルギー管理システム。\u003c/p>","beginner":{"scenario":"スマート家電が温度を読み取り、設定温度に達したら加熱を停止する。","trap":"リアルタイム制御は単に平均処理速度が速いことではなく期限内の応答が重要。","quizId":"U-21-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"組込みシステムは機器に内蔵され特定機能を実現します。マイコン、センサ、アクチュエータ、ファームウェア、リアルタイムOS等で構成され、省電力、応答期限、安全性が重要です。"},{"heading":"仕組みと使い分け","body":"BLE（Bluetooth Low Energy：低消費電力近距離通信）のビーコンは近接情報等に利用できます。AoA（Angle of Arrival：到来角）は受信信号の角度、AoD（Angle of Departure：出発角）は送信側からの方向情報を利用します。HEMS（家庭エネルギー管理システム）は家庭の消費電力等を管理します。"},{"heading":"具体的な判断と手順","body":"温度センサ→マイコンで設定値と比較→ヒータの制御→再測定という流れ。"}]},{"id":"21-Y05","title":"産業機器・PLC・AGV/AMR・スマート工場","explain":"\u003cp>PLC（Programmable Logic Controller：プログラマブル論理制御装置）は入力信号を基に設備を制御します。FA（Factory Automation：工場自動化）は製造設備や工程の自動化です。\u003c/p>","worked":"\u003cp>振動センサの値を監視し、故障兆候がある設備を計画停止して整備するのは予知保全の例。\u003c/p>","prompt":"周辺状況から搬送経路を動的に選ぶ能力を重視する機器は？","answer":"\u003cp>AMR。AMRは自律的な移動・経路選択を行う搬送ロボット。\u003c/p>","beginner":{"scenario":"工場で部品を自動搬送し、センサ信号に応じて装置を制御する。","trap":"工場機器では通信便利性だけでなく安全停止や制御期限も重要。","quizId":"U-21-Y05"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"PLC（Programmable Logic Controller：プログラマブル論理制御装置）は入力信号を基に設備を制御します。FA（Factory Automation：工場自動化）は製造設備や工程の自動化です。"},{"heading":"仕組みと使い分け","body":"AGV（Automated Guided Vehicle：無人搬送車）は一般に定めた経路・誘導に従い、AMR（Autonomous Mobile Robot：自律移動ロボット）は周囲を認識し経路を動的に選ぶ能力を持ちます。M2M（Machine to Machine：機器間通信）やIoT（モノのインターネット）を活用し、設備異常を検知します。"},{"heading":"具体的な判断と手順","body":"振動センサの値を監視し、故障兆候がある設備を計画停止して整備するのは予知保全の例。"}]}],"beginnerIntro":"実際の企業や製造・流通・電子商取引がどうITを使うか学ぶ。略語を役割と業務の流れで整理する。"},{"id":22,"title":"企業活動・会計・データ分析","group":"ストラテジ","priority":"A重要","summary":"会計財務、財務諸表、在庫、意思決定、統計、組織。","lessons":[{"title":"財務諸表","body":"貸借対照表（BS：Balance Sheet）は一時点の資産・負債・純資産。損益計算書（PL：Profit and Loss Statement）は期間の収益・費用・利益。キャッシュフロー計算書は現金の動きを表す。","check":"利益が出ても資金繰りは悪化し得る。"},{"title":"財務分析","body":"流動比率=流動資産÷流動負債×100%、自己資本比率=自己資本÷総資産×100%、ROE（Return on Equity：自己資本利益率）=当期純利益÷自己資本。","check":"期末残高と平均残高のどちらを用いるかを確認。"},{"title":"統計","body":"平均・中央値・分散・標準偏差は分布の特徴を表す。相関係数は−1〜1だが因果関係は示さない。回帰は目的変数と説明変数の関係をモデル化する。","check":"相関があっても因果とは限らない。"},{"title":"在庫管理","body":"経済的発注量EOQ（Economic Order Quantity）は発注費用と在庫保管費用を均衡させる発注数量。一般形は√(2DS/H)（D需要量、S発注1回費用、H単位期間の1個当たり保管費用）。","check":"需要の変動や欠品費用など前提に注意。"}],"terms":[{"term":"貸借対照表","definition":"ある時点の資産・負債・純資産を表す財務諸表"},{"term":"損益計算書","definition":"一定期間の収益・費用・利益を表す財務諸表"},{"term":"キャッシュフロー","definition":"一定期間の現金の流入と流出"},{"term":"流動比率","definition":"流動資産を流動負債で割る短期支払能力の指標"},{"term":"自己資本比率","definition":"総資産に対する自己資本の割合"},{"term":"ROE","definition":"当期純利益を自己資本で割った利益率"},{"term":"標準偏差","definition":"分布の値のばらつきを元と同じ単位で示す統計量"},{"term":"相関係数","definition":"二変数の線形関係の向き・強さを示す−1〜1の指標"},{"term":"回帰分析","definition":"一方の変数を別の変数で説明・予測する手法"},{"term":"EOQ","definition":"発注費と在庫保管費の合計が小さくなる発注数量"}],"questions":[{"id":"Q22-01","chapter":22,"kind":"applied","q":"流動資産600、流動負債400の企業の流動比率は。","options":["67%","100%","150%","200%"],"correct":2,"explain":"600÷400×100=150%。"},{"id":"Q22-02","chapter":22,"kind":"applied","q":"「売上増加と広告費の相関が高い」から直ちに結論できるのは。","options":["広告費が売上増を必ず引き起こす","売上が広告費を必ず引き起こす","両者に線形関係が観測された","第三要因は存在しない"],"correct":2,"explain":"相関だけでは因果関係は確定しない。"},{"id":"Q22-03","chapter":22,"kind":"applied","q":"資産1000、負債600の場合の自己資本比率は。","options":["20%","40%","60%","100%"],"correct":1,"explain":"自己資本=1000−600=400、400÷1000=40%。"},{"id":"D22-01","chapter":22,"kind":"applied","q":"売上1,000万円、売上原価600万円、販管費250万円の場合の営業利益はどれか。","options":["150万円","250万円","400万円","750万円"],"correct":0,"explain":"売上総利益=1000−600=400万円、営業利益=400−250=150万円。"},{"id":"D22-02","chapter":22,"kind":"applied","q":"商品単価2,000円、変動費1,200円、固定費80万円の損益分岐点数量はどれか。","options":["400個","800個","1,000個","1,600個"],"correct":2,"explain":"限界利益=2,000−1,200=800円/個。800,000/800＝1,000個。"},{"id":"D22-03","chapter":22,"kind":"applied","q":"相関係数0.9の分析から判断できることはどれか。","options":["AがBの原因であることが証明された","線形の正の関連が強いが因果は確定しない","関係が一切ない","必ず外れ値が存在しない"],"correct":1,"explain":"相関は直線的関連の強さ。交絡・逆因果・非線形性を考慮する。"},{"id":"Q-22-X01","chapter":22,"kind":"applied","q":"多数の不良原因から優先改善対象を選ぶのに適した図は？","options":["散布図","パレート図","ER図","状態遷移図"],"correct":1,"explain":"パレート図。"},{"id":"Q-22-X02","chapter":22,"kind":"applied","q":"総資産500万円、利益25万円ならROAは？","options":["2%","5%","10%","20%"],"correct":1,"explain":"25/500×100＝5%。"},{"id":"U-22-1","chapter":22,"kind":"applied","q":"ある時点の資産・負債・純資産を示す財務諸表は？","options":["損益計算書","キャッシュフロー計算書","貸借対照表","売上予算表"],"correct":2,"explain":"貸借対照表は時点の財政状態、損益計算書は期間の経営成績。"},{"id":"U-22-2","chapter":22,"kind":"applied","q":"固定費30万円、限界利益率0.4の損益分岐点売上高は？","options":["12万円","120万円","30万円","75万円"],"correct":3,"explain":"固定費÷限界利益率=30/0.4=75万円。"},{"id":"U-22-3","chapter":22,"kind":"applied","q":"2変数の線形な関連の方向と強さを表す代表的指標は？","options":["相関係数","平均値","分散","中央値"],"correct":0,"explain":"相関係数は線形関係の方向・強さを示す。因果を保証しない。"},{"id":"U-22-4","chapter":22,"kind":"applied","q":"成功利益80万円が確率0.75、失敗損失40万円が0.25の期待値は？","options":["60万円","50万円","70万円","20万円"],"correct":1,"explain":"80×0.75＋(−40)×0.25＝60−10＝50万円。"},{"id":"U-22-X01","chapter":22,"kind":"applied","q":"原因候補を魚の骨のような形で整理するQC手法は？","options":["パレート図","散布図","特性要因図","ヒストグラム"],"correct":2,"explain":"特性要因図は結果と原因候補を分類して図示する。"},{"id":"U-22-X02","chapter":22,"kind":"applied","q":"自己資本200万円、純利益20万円のROEは？","options":["5%","20%","100%","10%"],"correct":3,"explain":"ROE（自己資本利益率）は純利益÷自己資本×100。"}],"deepIntro":"利益・現金・投資効率はそれぞれ違う尺度。データ分析は「数式が合っているか」と「結論が妥当か」を分けて考える。","deep":[{"id":"22-1","title":"財務三表・損益・キャッシュフロー","explain":"\u003cp>PL（Profit and Loss Statement：損益計算書）は一定期間の収益と費用、BS（Balance Sheet：貸借対照表）は一定時点の資産・負債・純資産、CF（Cash Flow Statement：キャッシュフロー計算書）は現金の増減を示す。売上が増えても売掛金が増えれば現金はすぐ増えない。減価償却費は資産取得費用を利用期間へ配分する会計上の費用で、計上時に毎回現金が流出するわけではない。\u003c/p>\n\u003cp>売上総利益＝売上高−売上原価、営業利益＝売上総利益−販売費及び一般管理費。流動比率＝流動資産/流動負債×100%、自己資本比率＝自己資本/総資本×100%などは比率の分母を確認する。\u003c/p>\n","worked":"\u003cp>売上1,000万円、売上原価600万円、販管費250万円なら売上総利益400万円、営業利益150万円。ここから営業外損益や税金を考えて最終利益へ進む。\u003c/p>\n","prompt":"利益が出ている企業は資金繰りで倒産しないか。","answer":"\u003cp>倒産し得る。支払タイミングと現金残高が重要。\u003c/p>\n","beginner":{"scenario":"商品を掛売り100万円で販売し費用60万円を現金で払うと、利益40万円でも現金は60万円減少する。売掛金100万円が資産になる。","trap":"利益と現金増減は別。損益計算書は一定期間、貸借対照表は一時点。","quizId":"U-22-1"},"textbook":[{"heading":"企業の財務を3つの表で見る","body":"貸借対照表（B/S）はある時点の資産・負債・純資産を示し、資産＝負債＋純資産の関係が成り立ちます。損益計算書（P/L）は一定期間の収益・費用・利益を示します。キャッシュフロー計算書（C/F）は現金等の増減を営業・投資・財務活動などに分けて示します。"},{"heading":"利益と現金の違い","body":"100万円の商品を掛けで販売し、仕入費60万円を現金で払った場合、単純化すると利益40万円ですが現金は60万円減り、売掛金100万円が資産になります。利益が出ていても現金不足で支払えなくなる場合があるため両方を確認します。"},{"heading":"利益の段階","body":"売上高から売上原価を引くと売上総利益、販売費及び一般管理費を引くと営業利益、営業外損益を加減すると経常利益になります。さらに特別損益や税金等を考慮して当期純利益を求めます。減価償却は固定資産の取得費用を利用期間等に配分する会計処理です。"}],"walkthrough":{"heading":"小さな会社の財務諸表をつなげる","body":"現金100万円を出資して会社を始め、現金30万円で在庫を仕入れ、商品を50万円で掛売りし、販売した在庫の原価が30万円だったとします。税金その他の費用を無視すると、損益計算書では売上50−原価30＝利益20万円です。現金は70万円、売掛金50万円なので資産合計120万円、負債0、純資産は出資100＋利益20＝120万円です。売掛金を回収すると現金が120万円となり売掛金が0になりますが、回収時にもう一度売上や利益を計上するわけではありません。現金の移動、利益の認識、資産・負債の状態を分けると財務の計算が理解しやすくなります。","cols":["時点","現金","在庫","売掛金","純資産"],"rows":[["出資後","100","0","0","100"],["仕入後","70","30","0","100"],["掛売り後","70","0","50","120"],["回収後","120","0","0","120"]]}},{"id":"22-2","title":"損益分岐点・原価計算・利益計画","explain":"\u003cp>固定費は生産数量に関わらず一定範囲では変わりにくい費用、変動費は販売・生産量に伴って変わる費用。販売単価p、1個当たり変動費v、固定費Fなら損益分岐点数量Q＝F/(p−v)。限界利益率は(売上−変動費)/売上。売上高で計算するなら損益分岐点売上高＝固定費/限界利益率。\u003c/p>\n\u003cp>原価には直接材料費・直接労務費・製造間接費などがあり、活動基準原価計算（ABC：Activity-Based Costing）は活動を通じた原価配賦を考える。短期の意思決定と長期の費用管理では見るべき原価が異なる。\u003c/p>\n","worked":"\u003cp>商品単価2,000円、変動費1,200円、固定費80万円なら限界利益800円、損益分岐点数量800,000/800＝1,000個。900個では固定費を回収できない。\u003c/p>\n","prompt":"売上単価と変動費が同額なら、販売数量を増やしても固定費を回収できるか。","answer":"\u003cp>できない。限界利益が0だから。\u003c/p>\n","beginner":{"scenario":"販売価格1000円、変動費600円、固定費20万円。1個当たり限界利益400円なので500個で固定費を回収し利益が0になる。","trap":"固定費は販売量に比例しないと仮定する。限界利益と最終利益を区別する。","quizId":"U-22-2","lab":{"title":"利益計画から必要販売数を逆算","problem":"販売単価2000円、1個当たり変動費1200円、固定費40万円。利益20万円にする販売数は？","steps":["売上から変動費を引いた1個当たり限界利益は2000−1200＝800円。","全体利益=800×販売数−400000。","目標200000を代入すると800×販売数=600000。","販売数=600000÷800＝750個。損益分岐点は400000÷800＝500個。"],"answer":"750個","check":"損益分岐点は利益0、目標利益が指定されたら固定費に目標利益を足す。"}},"textbook":[{"heading":"費用を固定と変動に分ける","body":"固定費は一定の活動範囲では販売量等が変わっても変化しない費用、変動費は活動量に応じて増減する費用です。販売価格1000円、単位変動費600円なら1個当たり限界利益400円。販売数qのとき利益は400q−固定費となります。"},{"heading":"損益分岐点","body":"損益分岐点は利益が0になる売上または販売量です。固定費20万円なら販売数200000/400=500個。限界利益率は限界利益÷売上高なので0.4。売上高で求める場合は固定費÷0.4=50万円です。目標利益を得るには固定費に目標利益を足して計算します。"},{"heading":"原価計算","body":"直接費は特定製品へ直接対応できる費用、間接費は共通費用として合理的に配賦する費用です。直接・間接と固定・変動は別の分類です。標準原価と実際原価を比較し、価格差や数量差などから原因を分析することがあります。"}],"walkthrough":{"heading":"損益分岐点を図表の数字で理解する","body":"固定費20万円、販売単価1000円、変動費600円とします。販売数が0でも固定費20万円は発生します。売上は販売数×1000、総費用は200000＋販売数×600で増えます。売上線と総費用線が交わる500個が損益分岐点です。500個未満では売上より費用が大きく損失、超えると利益が出ます。販売価格が上がったり変動費が下がったりすれば1個当たり限界利益が増え、他の条件が同じなら損益分岐点は下がります。固定費の削減も分岐点を下げますが、品質や販売能力への影響も評価します。","cols":["販売個数","売上（万円）","総費用（万円）","利益（万円）"],"rows":[["0","0","20","−20"],["250","25","35","−10"],["500","50","50","0"],["750","75","65","10"],["1000","100","80","20"]]}},{"id":"22-3","title":"統計・相関・検定・データの読み方","explain":"\u003cp>平均は合計/個数、中央値は順序中央、最頻値は最も頻繁な値。極端な値が含まれると平均は大きく影響される。分散は値が平均からどれだけ散らばるかの尺度で、標準偏差は分散の平方根。相関係数は線形関係の強さを−1～1で表すが、\u003cstrong>相関は因果を意味しない\u003c/strong>。散布図で外れ値、非線形の関係、群の混合を確認する。\u003c/p>\n\u003cp>仮説検定では帰無仮説と対立仮説を設け、データが帰無仮説の下でどれほど珍しいかをp値で考える。p値は「帰無仮説が正しい確率」ではない。標本抽出の偏り、検出力、多重比較を考慮して結論を出す。\u003c/p>\n","worked":"\u003cp>商品購入者だけに満足度調査をすると非購入者の不満が欠落し、潜在顧客全体へ一般化できない。高い平均点でも標本の選び方を確認する。\u003c/p>\n","prompt":"相関係数0.9なら、Aを増やせばBが必ず増えるといえるか。","answer":"\u003cp>いえない。交絡要因や逆方向の因果があり得る。\u003c/p>\n","beginner":{"scenario":"データ1、2、3、4、100では平均22、中央値3。極端な値が平均を押し上げるので目的に応じ代表値を選ぶ。","trap":"相関があっても因果関係を示すとは限らない。標本の偏りも考える。","quizId":"U-22-3"},"textbook":[{"heading":"データの特徴を数値化する","body":"平均は値の合計÷個数、中央値は順序を並べた中央の値、最頻値は最も頻繁に現れる値です。分散は平均からの偏差の二乗の平均（目的に応じ分母が異なる）、標準偏差はその平方根で元の単位と同じです。外れ値がある場合は平均が大きく影響を受けるため中央値も確認します。"},{"heading":"関係を調べる","body":"散布図は2変数の組を点で表示します。相関係数は線形関係の強さと方向を−1〜1で表し、0に近くても非線形な関係がある場合があります。回帰分析は説明変数から目的変数を推定します。相関や回帰だけで因果関係を証明できるわけではありません。"},{"heading":"標本と検定","body":"標本が母集団を適切に代表していないと推定が偏ります。欠測・外れ値の扱いを明示し、仮説検定では有意水準、p値、効果の大きさを区別します。統計的有意性が実務上重要な差を意味するとは限りません。"}]},{"id":"22-4","title":"業務分析・意思決定・最適化","explain":"\u003cp>問題解決では現状を測り、目標との差を構造化し、原因仮説と検証指標を設定する。パレート図は頻度や影響の大きい項目を優先する手掛かり、特性要因図は原因候補の整理、管理図は時系列の変動や異常を監視する。ABC分析は売上・在庫金額等の寄与度に応じて重点管理する方法。\u003c/p>\n\u003cp>線形計画法は目的関数を制約条件の下で最大・最小にする手法。例えば製品A/Bの利益と材料・作業時間から最適な生産量を求める。決定木や期待値による意思決定では、選択肢ごとの結果と確率を明示する。\u003c/p>\n","worked":"\u003cp>商品100種類のうち売上上位10種類が全体売上の70%なら、発注管理や欠品対策を重点化する根拠になる。ただし利益率・戦略的重要性なども評価する。\u003c/p>\n","prompt":"管理図で工程が管理限界内なら製品仕様をすべて満たすか。","answer":"\u003cp>必ずではない。統計的な安定性と仕様適合は別。\u003c/p>\n","beginner":{"scenario":"商品Aの利益100が確率0.6、損失20が0.4なら期待値52。Bの利益60が0.9、損失10が0.1なら期待値53。","trap":"期待値が高くても最大損失や実行制約が許容できるとは限らない。","quizId":"U-22-4"},"textbook":[{"heading":"意思決定を数値で比べる","body":"将来の結果が不確実な場合、各結果の値と確率の積を合計した期待値が比較材料になります。ただし大きな損失の可能性、資源制約、実行可能性も考慮します。決定木は選択と不確実な事象を枝で表し、各分岐の結果を整理できます。"},{"heading":"在庫を最適化する","body":"発注回数を減らすと発注費は下がりますが、1回の発注量が増えて在庫保管費が上がります。EOQ（経済的発注量）は年間需要D、1回の発注費S、1個当たり年間保管費Hから√(2DS/H)で求める基本モデルです。需要一定などの仮定を確認します。"},{"heading":"業務分析を行う","body":"処理時間、滞留件数、費用、品質を測って改善対象を特定します。ABC分析は売上や使用金額等の大きい順に分類し重点管理を行う方法です。目的関数や制約を決めて線形計画法等で最適な資源配分を検討することもあります。"}]},{"id":"22-X01","title":"経営・組織論と品質管理","explain":"\u003cp>機能別組織は専門機能別、事業部制は製品や市場別、マトリックス組織は複数の指揮系統を組み合わせる。権限委譲は判断を現場に近づけるが責任範囲を明確にする。経営理念・目標、企業の社会的責任（CSR）、利害関係者との関係を理解する。\u003c/p>\u003cp>QC七つ道具（品質管理の基本手法）にはパレート図、特性要因図、ヒストグラム、散布図、チェックシート、管理図、層別（分類には流儀あり）がある。パレート図は頻度順と累積比率で重点を選ぶ。特性要因図は原因候補を分類し、管理図は時系列変動と管理限界を比較する。PDCAで改善する。\u003c/p>","worked":"\u003cp>不良100件のうち傷60、寸法30、その他10なら傷と寸法の改善で90%の不良件数に対応できる。\u003c/p>","prompt":"多数の不良原因から優先改善対象を選ぶのに適した図は？","answer":"\u003cp>パレート図。\u003c/p>","beginner":{"scenario":"不良100件の内訳が傷60、寸法30、その他10なら、頻度の大きい項目から改善を考える。パレート図は件数と累積比率を示す。","trap":"件数が多い原因が最も重大とは限らない。影響の大きさも評価する。","quizId":"U-22-X01"},"textbook":[{"heading":"組織の構成","body":"機能別組織は営業・開発・製造など専門機能ごとに分け、事業部制は製品・地域等の事業単位に分けます。マトリックス組織は機能と事業・プロジェクトなど複数の指揮系統を組み合わせます。専門性、意思決定速度、調整負担などの違いがあります。"},{"heading":"QC七つ道具","body":"パレート図は頻度順と累積比率、特性要因図は原因候補の関係、ヒストグラムは分布、散布図は二変数の関係、チェックシートはデータ収集、管理図は時系列の変動、層別は属性ごとに分けた分析に用います。分類には流儀があります。例えば不良件数60、30、10の順なら上位2種類で90%を占めます。"},{"heading":"改善を繰り返す","body":"管理図の管理限界は通常の変動から外れた兆候を調べるもので、製品の規格限界とは別です。PDCAで原因分析、対策、効果測定、標準化を行います。件数だけでなく被害の重大性や改善費用も考えます。"}]},{"id":"22-X02","title":"財務分析・投資評価・データ活用","explain":"\u003cp>ROA（総資産利益率）は利益を総資産で割り、ROE（自己資本利益率）は利益を自己資本で割る。流動比率は流動資産÷流動負債で短期支払能力の目安。総資産回転率は売上高÷総資産。売上高利益率との積は同じ利益定義ならROAとなる。\u003c/p>\u003cp>NPV（正味現在価値）は将来キャッシュフローを割引き初期投資を差し引く。IRR（内部収益率）はNPVを0にする割引率。損益分岐点、直接・間接費、固定・変動費、標準原価差異も理解する。データ分析では名義・順序・間隔・比例尺度を区別し、外れ値、欠測、選択バイアス、相関と因果に注意する。\u003c/p>","worked":"\u003cp>初期投資100万円、1年後110万円の回収、割引率10%ならNPV=110/1.1−100＝0万円。\u003c/p>","prompt":"総資産500万円、利益25万円ならROAは？","answer":"\u003cp>25/500×100＝5%。\u003c/p>","beginner":{"scenario":"1年後110万円を得る投資を割引率10%で評価すると現在価値100万円。初期投資90万円ならNPV=10万円。","trap":"割引率・キャッシュフローの仮定が変わると投資評価も変わる。","quizId":"U-22-X02","lab":{"title":"現在価値で投資判断する","problem":"初期投資100万円。1年後55万円、2年後60.5万円の純キャッシュフロー。割引率10%。NPVは？","steps":["1年後の55万円の現在価値は55/1.1=50万円。","2年後の60.5万円は60.5/(1.1²)=50万円。","現在価値合計100万円。初期投資100万円を引く。","NPV=0万円。仮定した割引率では経済的価値の増加が0。"],"answer":"0万円","check":"将来の現金をそのまま足さず、年数に応じ割引く。"}},"textbook":[{"heading":"財務指標を理解する","body":"ROA（総資産利益率）は総資産に対する利益、ROE（自己資本利益率）は自己資本に対する利益を示します。例えば総資産1000万円、自己資本400万円、純利益40万円なら純利益を使うROA4%、ROE10%です。利益定義や平均残高の扱いは問題の指定に従います。流動比率は流動資産÷流動負債、自己資本比率は自己資本÷総資産です。"},{"heading":"お金の時間価値","body":"年10%の割引率なら1年後110万円の現在価値は110/1.1=100万円、2年後121万円なら121/1.1²=100万円です。NPV（正味現在価値）は将来の純キャッシュフローの現在価値合計から初期投資を引きます。IRR（内部収益率）はNPVを0にする割引率です。"},{"heading":"数字の使い方","body":"収益性と支払能力は別で、利益率が高くても流動負債を払えないことがあります。投資評価では評価期間・割引率・将来収益の仮定を変えて結果の感度を調べます。数字の定義と目的を確かめて判断します。"}]},{"id":"22-Y01","title":"組織構造・経営責任・社会とIT","explain":"\u003cp>機能別組織は職能ごとに専門化し、事業部制は製品・地域等ごとに責任を分けます。マトリクス組織は複数の軸を組み合わせるため、調整力が重要です。\u003c/p>","worked":"\u003cp>製品AとBに独立した売上・利益責任を持たせるのは事業部制。専門部門と製品責任者の双方から調整を受けるのはマトリクス型。\u003c/p>","prompt":"職能軸と製品軸を組み合わせた組織は？","answer":"\u003cp>マトリクス組織。複数の管理軸を組み合わせる構造。\u003c/p>","beginner":{"scenario":"機能別部門が専門性を持つ一方、新製品の部門間調整に時間がかかる。","trap":"組織構造に万能な方式はない。","quizId":"U-22-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"機能別組織は職能ごとに専門化し、事業部制は製品・地域等ごとに責任を分けます。マトリクス組織は複数の軸を組み合わせるため、調整力が重要です。"},{"heading":"仕組みと使い分け","body":"CSR（Corporate Social Responsibility：企業の社会的責任）、IR（Investor Relations：投資家向け広報）、アカウンタビリティ（説明責任）を区別します。DX（デジタル変革）は技術利用により事業や組織を変革し、GX（グリーン変革）は脱炭素等に向けた変革です。DFFTは信頼性のある自由なデータ流通の考え方です。"},{"heading":"具体的な判断と手順","body":"製品AとBに独立した売上・利益責任を持たせるのは事業部制。専門部門と製品責任者の双方から調整を受けるのはマトリクス型。"}]},{"id":"22-Y02","title":"OR・IE・品質分析・データの判断","explain":"\u003cp>OR（Operations Research：数理的意思決定）は線形計画、待ち行列、在庫、ゲーム理論等を使い、IE（Industrial Engineering：経営工学）は作業測定・工程分析などで生産性を改善します。線形計画では目的関数と制約を設定します。\u003c/p>","worked":"\u003cp>A製品利益3、B製品利益5、制約A+B≤4、A,B≥0なら全てBで利益20（他の制約なし）。制約が増えれば候補点を比較する。\u003c/p>","prompt":"二つの数量の関係を点で可視化する図は？","answer":"\u003cp>散布図。散布図は二変量の関係や外れ値を把握する。\u003c/p>","beginner":{"scenario":"生産設備と人員の制約内で利益を最大にし、不良原因も特定したい。","trap":"相関があるだけで原因と結果の関係は証明できない。","quizId":"U-22-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"OR（Operations Research：数理的意思決定）は線形計画、待ち行列、在庫、ゲーム理論等を使い、IE（Industrial Engineering：経営工学）は作業測定・工程分析などで生産性を改善します。線形計画では目的関数と制約を設定します。"},{"heading":"仕組みと使い分け","body":"QC（Quality Control：品質管理）でパレート図、特性要因図、散布図、ヒストグラム、管理図などを使います。ABC分析は金額等の重要度で項目を分類します。データ分析では欠損、外れ値、標本偏り、相関と因果を区別し、可視化と判断を結びつけます。"},{"heading":"具体的な判断と手順","body":"A製品利益3、B製品利益5、制約A+B≤4、A,B≥0なら全てBで利益20（他の制約なし）。制約が増えれば候補点を比較する。"}]},{"id":"22-Y03","title":"財務比率・原価配賦・キャッシュフロー","explain":"\u003cp>貸借対照表はある時点の資産・負債・純資産、損益計算書は期間の収益・費用、キャッシュフロー計算書は現金の増減を示します。ROA（総資産利益率）とROE（自己資本利益率）は分母が異なり、利益の定義は問題の指定に従います。\u003c/p>","worked":"\u003cp>流動資産180、流動負債120万円なら流動比率150％。掛売上は利益を増やしても未回収なら直ちに現金は増えない。\u003c/p>","prompt":"流動資産240万円、流動負債160万円の流動比率は？","answer":"\u003cp>150％。240÷160×100=150％。\u003c/p>","beginner":{"scenario":"利益が出ているのに売掛金の回収が遅れて資金不足になる会社を分析する。","trap":"黒字なら資金繰りに問題がないとは限らない。","quizId":"U-22-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"貸借対照表はある時点の資産・負債・純資産、損益計算書は期間の収益・費用、キャッシュフロー計算書は現金の増減を示します。ROA（総資産利益率）とROE（自己資本利益率）は分母が異なり、利益の定義は問題の指定に従います。"},{"heading":"仕組みと使い分け","body":"流動比率=流動資産÷流動負債×100、自己資本比率=自己資本÷総資産×100。ABC（Activity Based Costing：活動基準原価計算）は活動の使用量等を基に間接費を配賦します。発生主義の利益と現金収支は一致しない場合があります。"},{"heading":"具体的な判断と手順","body":"流動資産180、流動負債120万円なら流動比率150％。掛売上は利益を増やしても未回収なら直ちに現金は増えない。"}]}],"beginnerIntro":"企業の数字と組織・業務の改善方法を学ぶ。会計は時点・期間、利益・現金、固定費・変動費を区別する。"},{"id":23,"title":"法務・標準化・知的財産","group":"ストラテジ","priority":"A重要","summary":"著作権・特許・個人情報・契約・労務・不正アクセスと標準。","lessons":[{"title":"著作権と特許","body":"著作権は原則として創作時に発生し、表現を保護する。特許は出願・審査・登録を経て技術的思想の創作を一定期間保護する。アイデアそのものと表現を混同しない。","check":"ソフトウェアのソースコードは著作権の対象となり得る。"},{"title":"個人情報","body":"個人情報保護法では利用目的の特定・安全管理措置・第三者提供の規律等を理解する。匿名加工情報と仮名加工情報では本人識別や取扱いのルールが異なる。","check":"匿名化したつもりでも再識別可能性を考える。"},{"title":"情報セキュリティ法規","body":"不正アクセス禁止法は他人の識別符号の無断入力などを規制。電子署名、営業秘密、サイバー犯罪への対応も把握する。","check":"単なる規約違反と法律違反は区別。"},{"title":"標準と契約","body":"JIS（Japanese Industrial Standards：日本産業規格）やISO（International Organization for Standardization：国際標準化機構）の規格は品質・安全・互換性等の共通基準。契約では秘密保持・成果物権利・再委託・責任範囲を確認。","check":"最新の法改正や規格の版は直前に一次情報で確認。"}],"terms":[{"term":"著作権","definition":"文章・プログラムなどの創作的な表現を保護する権利"},{"term":"特許権","definition":"一定の要件を満たす発明を出願・審査・登録によって保護する権利"},{"term":"商標権","definition":"商品・サービスの出所を識別する標識を保護する権利"},{"term":"営業秘密","definition":"秘密管理性・有用性・非公知性などを満たす事業上の情報"},{"term":"個人情報","definition":"生存する個人に関する情報で特定個人を識別できるもの等"},{"term":"仮名加工情報","definition":"他の情報と照合しない限り特定個人を識別できないよう加工した個人情報等"},{"term":"匿名加工情報","definition":"特定個人の識別や復元ができないよう法定基準で加工した情報"},{"term":"不正アクセス禁止法","definition":"他人のIDやパスワードの不正利用などを規制する法律"},{"term":"JIS","definition":"日本の産業分野に関する国家規格"},{"term":"ISO","definition":"国際的な規格を制定する標準化団体"},{"term":"NDA","definition":"秘密保持契約。Non-Disclosure Agreementの略"}],"questions":[{"id":"Q23-01","chapter":23,"kind":"applied","q":"一般に著作権が発生するタイミングは。","options":["創作時","特許庁への登録時","公開から10年後","販売開始時のみ"],"correct":0,"explain":"著作権は原則創作と同時に発生する。"},{"id":"Q23-02","chapter":23,"kind":"applied","q":"特許権と著作権の説明として正しいのは。","options":["著作権はアイデア自体を保護する","特許は出願・審査・登録を要する","特許は創作時に自動成立する","プログラムには著作権が生じない"],"correct":1,"explain":"特許は方式・審査を経て登録される。"},{"id":"Q23-03","chapter":23,"kind":"applied","q":"営業秘密の代表的な要件の組は。","options":["秘密管理性・有用性・非公知性","公開性・無料性・巨大性","即時性・配布性・広告性","計算性・確率性・可用性"],"correct":0,"explain":"不正競争防止法上の営業秘密の三要件。"},{"id":"D23-01","chapter":23,"kind":"applied","q":"他人が作ったWeb画像を自社サイトへ転載する際の原則的な考え方として適切なものはどれか。","options":["閲覧可能なら常に転載自由","画像には著作権がない","利用許諾や法定の例外等を確認する","出典を隠せばよい"],"correct":2,"explain":"閲覧可能性と転載許諾は別。権利者・条件・適用される例外を確認する。"},{"id":"D23-02","chapter":23,"kind":"applied","q":"営業秘密としての保護に一般に必要な条件の組合せはどれか。","options":["知名度・資本金・社員数","秘密管理性・有用性・非公知性","登録日・商標区分・発行部数","売上・広告費・生産量"],"correct":1,"explain":"不正競争防止法上の営業秘密の3要件を区別する。"},{"id":"D23-03","chapter":23,"kind":"applied","q":"請負契約と書かれていても、現場で発注者が請負先作業者に直接指揮命令する場合の懸念はどれか。","options":["必ず正当な請負になる","契約名で全ての実態が決まる","偽装請負等の問題につながる可能性がある","システム監査が不要になる"],"correct":2,"explain":"契約の名称だけでなく実際の指揮命令関係等が判断上重要になる。"},{"id":"Q-23-X01","chapter":23,"kind":"applied","q":"2026年1月施行の取適法で新たに禁止された支払方法は？","options":["期日内の現金振込","手形払い","事前合意した現金払い","期日内の口座振込"],"correct":1,"explain":"手形払い。適用対象取引では禁止される。"},{"id":"Q-23-X02","chapter":23,"kind":"applied","q":"一定の要件を満たす電子署名による電子文書の真正な成立の推定を定める法律は？","options":["電子署名法","労働基準法","独占禁止法","不正アクセス禁止法"],"correct":0,"explain":"電子署名法。"},{"id":"U-23-1","chapter":23,"kind":"applied","q":"商品やサービスの出所を識別する標識を登録により保護する権利は？","options":["商標権","特許権","著作権","実用新案権"],"correct":0,"explain":"商標権は商品・役務を識別する標識の保護。著作権は創作的表現を保護する。"},{"id":"U-23-2","chapter":23,"kind":"applied","q":"営業秘密の保護要件の組合せとして適切なのは？","options":["登録・売上・公開性","秘密管理性・有用性・非公知性","独自性・広告・知名度","特許査定・創作性・公知性"],"correct":1,"explain":"不正競争防止法上の営業秘密は3要件を満たす情報。"},{"id":"U-23-3","chapter":23,"kind":"applied","q":"派遣労働者に就業上の指揮命令を行うのは原則誰か？","options":["派遣元の顧客全員","取引先の監査人","派遣先","派遣労働者自身のみ"],"correct":2,"explain":"労働者派遣では派遣元が雇用し、派遣先の指揮命令下で就業する。"},{"id":"U-23-4","chapter":23,"kind":"applied","q":"情報セキュリティマネジメントシステムの要求事項を定める規格は？","options":["ISO 9001","ISO 22301","ISO/IEC 20000-1","ISO/IEC 27001"],"correct":3,"explain":"27001は情報セキュリティ、9001は品質、22301は事業継続、20000-1はITサービス管理。"},{"id":"U-23-X01","chapter":23,"kind":"applied","q":"取適法（2026年1月施行）で追加された事業者規模の判断基準は？","options":["従業員数基準","Webサイト閲覧数","広告費基準","商標登録件数"],"correct":0,"explain":"資本金基準に加え、取引類型に応じた従業員数基準が追加された。"},{"id":"U-23-X02","chapter":23,"kind":"applied","q":"電子署名法が一定の電子署名について定める効果は？","options":["全内容の真実性保証","電子文書の真正な成立の推定","特許権の自動発生","著作権の自動消滅"],"correct":1,"explain":"一定の本人による電子署名がある場合、文書の真正な成立が推定される。内容の真実性までは保証しない。"}],"deepIntro":"名称を覚えるだけでなく、どの対象に、何を、誰が、どの条件でしてよいかを区別する。","deep":[{"id":"23-1","title":"知的財産権・特許・著作権・商標","explain":"\u003cp>特許権は発明を一定期間保護する権利で、新規性・進歩性等の要件を満たして特許査定・登録等の手続を経る。著作権は思想・感情を創作的に表現した著作物を保護し、原則として創作時に発生する。商標権は商品・役務を識別する標識を登録等により保護する。意匠権は物品等のデザインに関する権利。保護対象、発生要件、期間、権利行使が異なる。\u003c/p>\n\u003cp>プログラムのソースコードは著作権の対象になり得るが、アルゴリズムやアイデアそのものが表現と同じように保護されるわけではない。ソフトウェアライセンスでは複製、改変、再配布、ソース開示義務を確認する。\u003c/p>\n","worked":"\u003cp>他社が作った画像をWebサイトに掲載する場合、インターネット上で閲覧できるだけでは自由利用の許諾にならない。権利者、許諾範囲、例外規定を確認する。\u003c/p>\n","prompt":"OSSなら必ず著作権を放棄しているか。","answer":"\u003cp>違う。著作権を前提に利用・改変・再配布の条件を許諾するライセンスが多い。\u003c/p>\n","beginner":{"scenario":"ゲームのプログラムの具体的表現は著作権、技術的な発明は要件を満たして登録されれば特許権、商品を識別するロゴは商標権で保護できる場合がある。","trap":"著作権は原則創作時に発生する。特許権は出願だけで発生するわけではない。","quizId":"U-23-1"},"textbook":[{"heading":"何を保護する権利か","body":"特許権は技術的な発明、実用新案権は物品の形状・構造・組合せに係る考案、意匠権はデザイン、商標権は商品・役務を識別する標識を保護する制度です。原則として登録によって権利が発生します。著作権は思想・感情を創作的に表現した著作物を保護し、原則創作時に発生します。"},{"heading":"プログラムと知財","body":"ソースコード等の創作的表現は著作権の対象となり得ますが、アイデアやアルゴリズムそのものを著作権で独占できるわけではありません。技術的思想が特許の要件を満たす場合には特許による保護を検討できます。特許には新規性・進歩性等の要件があり、出願だけで特許権が発生するわけではありません。"},{"heading":"利用時の確認","body":"複製、改変、配布、公開の許諾範囲を確認します。オープンソースソフトウェアにも著作権がありライセンス条件があります。営業秘密は秘密管理性・有用性・非公知性などの要件により不正競争防止法で保護され得ます。権利の種類、発生条件、保護対象を区別します。"}]},{"id":"23-2","title":"個人情報保護・情報セキュリティ法制","explain":"\u003cp>日本の個人情報保護法は個人情報・個人データ・保有個人データ等を区別し、利用目的、安全管理措置、第三者提供、本人の権利などを定める。仮名加工情報と匿名加工情報は加工方法、再識別、取扱い規律が異なる。特定個人情報（マイナンバー関係）には別途厳格な規律がある。対象事業・例外・最新法令の適用は必ず確認する。\u003c/p>\n\u003cp>不正アクセス禁止法は他人の識別符号の不正利用等によるアクセス行為などを規制する。不正競争防止法の営業秘密は秘密管理性・有用性・非公知性を満たす情報。不正取得・使用・開示に関する規律がある。情報の流出を防ぐ技術対策だけでなく、契約・教育・物理管理も必要。\u003c/p>\n","worked":"\u003cp>顧客データを外注先に渡す場合、「外注だから第三者提供は自由」と即断せず、委託先の監督、安全管理、利用目的の範囲、提供区分を確認する。\u003c/p>\n","prompt":"住所が含まれなければ個人情報ではないか。","answer":"\u003cp>そうとは限らない。氏名・識別子・容易に照合できる情報などにより特定個人を識別できる場合がある。\u003c/p>\n","beginner":{"scenario":"顧客データを外部の集計事業者に委託する場合、利用目的の範囲・委託先の監督・安全管理を確認する。","trap":"委託と第三者提供は同一の扱いではない。法的要件は具体的状況で確認する。","quizId":"U-23-2"},"textbook":[{"heading":"個人情報の取扱い","body":"個人情報保護法は個人情報、個人データ、保有個人データなどを区別し、利用目的、安全管理、提供、本人からの請求等について規律を定めます。個人情報には特定の生存する個人を識別できる情報等が含まれます。委託、第三者提供、共同利用は適用条件が異なります。"},{"heading":"加工した情報と安全管理","body":"仮名加工情報は他情報と照合しない限り特定個人を識別できないよう加工した情報等で、匿名加工情報は個人を識別・復元できないよう法定基準で加工した情報です。取扱いルールは異なり、単に名前を削除しただけで自由に利用できるとは限りません。"},{"heading":"不正利用を防ぐ法律","body":"不正アクセス禁止法は他人の識別符号の不正利用などによる不正アクセス行為等を規制します。不正競争防止法は営業秘密の不正取得・使用・開示等を規制します。法律の目的と事例の行為を対応させ、最新法令の具体的な適用要件は原典で確認します。"}]},{"id":"23-3","title":"労働・取引・契約・コンプライアンス","explain":"\u003cp>労働基準法は労働時間等の最低基準、労働者派遣法は派遣事業・派遣先の適正な運用に関する規律を含む。請負・準委任・労働者派遣は契約書の名称だけで決まるものではなく、実際の指揮命令関係等を踏まえる。発注者が請負先作業者に直接労務指揮することは偽装請負等の問題につながり得る。\u003c/p>\n\u003cp>下請取引の規律、独占禁止法、景品表示法、消費者保護などは取引類型と当事者の規模等で適用が異なる。コンプライアンスは「法律違反だけしなければよい」ではなく、倫理・契約・社内規程・説明責任を含む仕組みである。改正法があるため細かな適用条件は最新情報を確認する。\u003c/p>\n","worked":"\u003cp>委託契約なのに発注元が作業者へ日々直接指示し勤怠を管理していれば、契約実態に基づき問題となる可能性がある。職務分担と指揮命令系統を整理する。\u003c/p>\n","prompt":"契約書に「請負」と書けば常に請負になるか。","answer":"\u003cp>ならない。実態が重要。\u003c/p>\n","beginner":{"scenario":"請負契約で成果物の完成を求めても、発注者が受託側作業者へ日々直接指揮命令する場合は偽装請負等の問題につながり得る。","trap":"契約の名称だけで法的な実態は決まらない。","quizId":"U-23-3"},"textbook":[{"heading":"働き方と契約の違い","body":"労働基準法は労働時間、賃金など労働条件の最低基準を定めます。労働者派遣では派遣元が労働者を雇用し、派遣先の指揮命令を受けて働きます。請負では受託側が自ら業務を管理し仕事を完成させるのが基本です。"},{"heading":"契約名だけでは決まらない","body":"請負と書かれていても発注者が受託側作業者へ直接指揮命令する実態があれば偽装請負等の問題につながる可能性があります。準委任は一定の業務遂行を目的とする契約類型で、具体的な権利義務は契約内容と法令によります。"},{"heading":"取引の公正さ","body":"独占禁止法は公正かつ自由な競争を促進し、優越的地位の濫用などを規制します。取適法やフリーランス法は対象取引に応じ取引条件や支払等を規律します。どの法律が適用されるかは取引類型、当事者、行為の内容を確認します。"}]},{"id":"23-4","title":"標準化・品質・監査関連の規格","explain":"\u003cp>標準化は仕様の共通化により互換性、品質、調達のしやすさを高める。ISO（International Organization for Standardization：国際標準化機構）、IEC（International Electrotechnical Commission：国際電気標準会議）、JIS（Japanese Industrial Standards：日本産業規格）などがある。ISO 9001は品質マネジメント、ISO/IEC 27001は情報セキュリティマネジメントの要求事項、ISO/IEC 20000-1はITサービスマネジメントの要求事項を扱う。\u003c/p>\n\u003cp>規格への認証取得はシステムの全ての脆弱性が解消されたことを意味しない。適用範囲、審査時点、継続的な改善を確認する。監査証拠は規格・ポリシー・手順と実際の運用記録を照合する。\u003c/p>\n","worked":"\u003cp>「ISO/IEC 27001の認証を取得している」だけでは、特定WebアプリのSQLインジェクションが存在しないとはいえない。別途脆弱性診断と修正が必要。\u003c/p>\n","prompt":"JISとISOは同じ組織か。","answer":"\u003cp>違う。JISは日本の国家規格、ISOは国際的な標準化機関。\u003c/p>\n","beginner":{"scenario":"会社が情報セキュリティ管理の規格に認証されても、個別アプリに脆弱性がないとは限らない。個々のリスク評価や診断を続ける。","trap":"マネジメントシステム認証と製品の性能保証を混同しない。","quizId":"U-23-4"},"textbook":[{"heading":"標準を作る目的","body":"製品やシステムの仕様が共通なら互換性、品質の評価、調達の比較がしやすくなります。ISOは国際標準化機構、IECは国際電気標準会議、JISは日本産業規格です。規格によって技術仕様を定めるもの、組織の管理システムを定めるものなどがあります。"},{"heading":"主要な管理規格","body":"ISO 9001は品質マネジメントシステム、ISO/IEC 27001は情報セキュリティマネジメントシステム、ISO/IEC 20000-1はサービスマネジメントシステム、ISO 22301は事業継続マネジメントシステムの要求事項を定めます。数字だけでなく何を管理するかを覚えます。"},{"heading":"認証が示すこと","body":"マネジメントシステムの認証は一定の適用範囲で要求事項への適合を評価するもので、すべての製品の無欠陥や将来の事故ゼロを保証しません。日常運用での検証・改善と、製品ごとの評価も必要です。監査では適用される規格や規程を基準に証拠を確認します。"}]},{"id":"23-X01","title":"取適法・労働取引法規の改正","explain":"\u003cp>2026年1月1日施行の中小受託取引適正化法（取適法）は旧下請法を改正したもの。委託事業者と中小受託事業者の間の対象取引を適正化し、代金支払遅延や不当な減額等を防ぐ。適用対象は委託内容、資本金、従業員数などの基準で判断される。情報成果物作成委託も対象となり得る。\u003c/p>\u003cp>改正では従業員数基準の追加、一定の運送委託の追加、協議に応じない一方的な代金決定の禁止、手形払い等の禁止が重要。対象取引では受領日から原則60日以内でできる限り短い支払期日を定める。労働基準法、労働者派遣法、独占禁止法、フリーランス法は別の法規であり、適用条件を混同しない。出典：公正取引委員会 https://www.jftc.go.jp/toriteki/\u003c/p>","worked":"\u003cp>対象となるソフトウェア委託で、受託側が費用上昇を理由に協議を求めたのに発注側が協議せず一方的に価格を据え置く行為は問題となり得る。\u003c/p>","prompt":"2026年1月施行の取適法で新たに禁止された支払方法は？","answer":"\u003cp>手形払い。適用対象取引では禁止される。\u003c/p>","beginner":{"scenario":"対象となるソフトウェア委託で受託側が原材料・人件費上昇を理由に価格協議を申し出たとき、発注側が協議せず一方的に価格を決めることは規制対象となり得る。","trap":"取適法の適用は取引類型・規模等の法定基準で判断する。すべての委託契約に一律適用されない。","quizId":"U-23-X01"},"textbook":[{"heading":"法改正の背景と対象","body":"2026年1月1日施行の中小受託取引適正化法（取適法）は旧下請法を改正した法律です。委託事業者と中小受託事業者との対象取引を適正化し、中小受託事業者の利益を保護することを目的とします。対象は委託の内容と資本金・従業員数などの基準で判断します。"},{"heading":"改正の要点","body":"従業員数基準の追加、一定の運送委託の追加、協議に応じない一方的な代金決定の禁止、手形払等の禁止が主な改正点です。対象取引では原則として受領日から60日以内のできる限り短い期間内に支払期日を定めるなどの義務があります。"},{"heading":"試験で区別すること","body":"情報成果物作成委託などが対象となる場合がありますが、すべての委託に一律適用されるわけではありません。独占禁止法、労働者派遣法、フリーランス法と保護対象・規制行為・適用要件を区別します。公正取引委員会の取適法資料と公式シラバスを確認することが重要です。"}]},{"id":"23-X02","title":"その他の法令・ガイドライン・技術者倫理","explain":"\u003cp>電子署名法は一定の電子署名がなされた電子文書の真正な成立の推定等を定める。公益通報者保護法は法令違反の通報者保護等を扱う。個人情報保護法、不正アクセス禁止法、不正競争防止法、特定商取引法、景品表示法などの目的と適用場面を区別する。\u003c/p>\u003cp>技術者倫理は法令遵守だけでなく安全性、公平性、プライバシー、説明責任、利益相反、社会的影響を考慮すること。AIのバイアス、個人情報の目的外利用、秘密情報の漏えい、著作権侵害、生成内容の誤りを評価する。標準化では国際規格、国家規格、業界標準、事実上の標準を区別する。\u003c/p>","worked":"\u003cp>自動採用システムが特定集団に不利な判定をしていると分かったら、精度だけでなく公平性を評価し是正する。\u003c/p>","prompt":"一定の要件を満たす電子署名による電子文書の真正な成立の推定を定める法律は？","answer":"\u003cp>電子署名法。\u003c/p>","beginner":{"scenario":"採用AIが特定集団を不当に不利に扱う場合、精度だけでなくデータの偏り・公平性・説明可能性を確認し是正する。","trap":"法令遵守だけで技術者の責任を果たしたとは限らない。","quizId":"U-23-X02"},"textbook":[{"heading":"法律が保護するもの","body":"電子署名法は一定の電子署名がなされた電子文書について真正な成立の推定などを定めます。公益通報者保護法は一定の公益通報を行った人の保護等を扱います。景品表示法は不当表示・過大な景品類などを規制し、特定商取引法は一定の取引類型における消費者保護を扱います。"},{"heading":"倫理は法律の最低限を超える","body":"技術者は安全性、公平性、プライバシー、秘密保持、説明責任、利益相反に配慮します。法令上直ちに禁止されていなくても、重大な危険や不当な差別を見つけたら報告・改善する責任があり得ます。"},{"heading":"AIと情報の利用","body":"AIによる評価が特定集団に不利な場合、学習データやモデルの偏り、判断根拠、人による確認、異議申立ての仕組みを検討します。生成AIの出力は事実や著作権処理を保証しないため根拠・権利・秘密情報の取扱いを確認します。法令・ガイドライン・社内規程の性質を区別します。"}]},{"id":"23-Y01","title":"知的財産権の保護対象と利用許諾","explain":"\u003cp>著作権は創作的表現を保護し、原則として創作時に発生します。特許権は発明、実用新案権は物品の形状・構造・組合せに係る考案、意匠権はデザイン、商標権は商品・役務の識別標識を登録制度によって保護します。\u003c/p>","worked":"\u003cp>ゲームの名称は商標、創作的なキャラクター絵は著作権、技術的発明は特許の対象となり得る。\u003c/p>","prompt":"営業秘密の三要件に含まれないものは？","answer":"\u003cp>特許登録。営業秘密に特許登録は不要。三要件を区別する。\u003c/p>","beginner":{"scenario":"新しいゲームのプログラム、名称、外観、技術を保護したい。","trap":"著作権が技術的アイデアそのものを一般に独占させるわけではない。","quizId":"U-23-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"著作権は創作的表現を保護し、原則として創作時に発生します。特許権は発明、実用新案権は物品の形状・構造・組合せに係る考案、意匠権はデザイン、商標権は商品・役務の識別標識を登録制度によって保護します。"},{"heading":"仕組みと使い分け","body":"営業秘密は秘密管理性、有用性、非公知性が要件です。権利の帰属、許諾範囲、契約、第三者権利を確認します。特許権は原則出願日から20年（例外あり）、著作権は原則著作者の死後70年（法人・映画等には別規定）であり、すべての権利に同じ期間を適用しません。"},{"heading":"具体的な判断と手順","body":"ゲームの名称は商標、創作的なキャラクター絵は著作権、技術的発明は特許の対象となり得る。"}]},{"id":"23-Y02","title":"情報保護・不正アクセス・電子取引関連法","explain":"\u003cp>個人情報保護法は個人情報の適正な取扱いと権利利益の保護を目的とします。利用目的、適正取得、安全管理、第三者提供、開示等のルールを確認します。不正アクセス禁止法はアクセス制御を突破する不正アクセスや関連行為を規制します。\u003c/p>","worked":"\u003cp>本人同意なく他人のID・パスワードを用いて制限されたサービスへログインする行為は不正アクセス禁止法の対象となり得る。\u003c/p>","prompt":"アクセス制御されたシステムへの不正アクセスを主に規制する法は？","answer":"\u003cp>不正アクセス禁止法。アクセス制御に対する不正なアクセス等を規制する法律。\u003c/p>","beginner":{"scenario":"顧客情報を管理するWebサービスで、他人の認証情報を使ったアクセスと広告メールの苦情が発生した。","trap":"電子署名は暗号化による機密性保護と同じではない。","quizId":"U-23-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"個人情報保護法は個人情報の適正な取扱いと権利利益の保護を目的とします。利用目的、適正取得、安全管理、第三者提供、開示等のルールを確認します。不正アクセス禁止法はアクセス制御を突破する不正アクセスや関連行為を規制します。"},{"heading":"仕組みと使い分け","body":"電子署名法は一定要件の電子署名が付いた電磁的記録の真正な成立の推定などを定めます。特定電子メール法は広告宣伝メールを規制し、原則オプトイン等のルールがあります。情報流通プラットフォーム対処法は権利侵害情報への対応等を規律します。適用要件や例外は原典で確認します。"},{"heading":"具体的な判断と手順","body":"本人同意なく他人のID・パスワードを用いて制限されたサービスへログインする行為は不正アクセス禁止法の対象となり得る。"}]},{"id":"23-Y03","title":"派遣・請負・準委任・取適法","explain":"\u003cp>労働者派遣では派遣元との雇用関係の下で派遣先が指揮命令します。請負は仕事の完成を目的とし、準委任は事務処理を委託する契約です。請負・準委任名義でも実態が労働者派遣なら偽装請負等の問題になり得ます。\u003c/p>","worked":"\u003cp>派遣の場合は派遣先が指揮命令するが、請負の作業者への指示は原則として請負側の管理者が行う。\u003c/p>","prompt":"派遣労働者の日常の指揮命令を行うのは原則誰か？","answer":"
