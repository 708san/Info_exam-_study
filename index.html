報デザイン・評価法","explain":"<p>UX（利用者体験）の五段階モデルでは戦略で利用者・事業の目的、要件で機能や内容、構造で情報や操作の流れ、骨格で配置、表層で見た目を考える。画面の美しさだけを先に決めない。UXハニカムは有用、使いやすい、望ましい、見つけやすい、アクセス可能、信頼できる、価値があるなどの観点を持つ。エモーショナルデザインは感情や印象、インタラクションデザインは操作と応答を設計する。</p>","worked":"<p><b>初心者は操作に60秒、熟練者は15秒かかった。</b></p><p>時間比は4。操作の分かりにくさを疑い、観察や発話内容から原因を調べる。</p>","prompt":"色だけでエラーを通知する画面をどう改善するか。","answer":"<p>色に加えエラーの文字・アイコン・読み上げ可能な通知を提供する。</p>","textbook":[{"heading":"目的から画面へ","body":"UX（利用者体験）の五段階モデルでは戦略で利用者・事業の目的、要件で機能や内容、構造で情報や操作の流れ、骨格で配置、表層で見た目を考える。画面の美しさだけを先に決めない。UXハニカムは有用、使いやすい、望ましい、見つけやすい、アクセス可能、信頼できる、価値があるなどの観点を持つ。エモーショナルデザインは感情や印象、インタラクションデザインは操作と応答を設計する。"},{"heading":"情報と画面を整理する","body":"近接は関係する項目を近くに、整列は位置を揃え、反復は規則を繰返し、対比は差を目立たせる。LATCHは場所・五十音等の順序・時間・カテゴリ・階層で情報を整理する考え方。ワイヤーフレームは画面の骨格、ストーリーボードは場面の順序、ムードボードは視覚的方向性を示す。レスポンシブ設計は画面幅等に応じ配置を変える。プログレッシブエンハンスメントは基本機能を確保し対応環境で機能を加える。"},{"heading":"利用者の違いを考える","body":"ユニバーサルデザインの七原則は公平な利用、柔軟性、単純で直感的、知覚可能な情報、誤りへの寛容さ、少ない身体負担、接近・利用のための空間。インクルーシブデザインは多様な利用者を設計に巻き込む。思考発話法は操作中の考えを話してもらい、回顧法は操作後に振返る。NEM（初心者・熟練者の操作時間比による評価）は時間差が大きい箇所を発見する。視線追跡は注視位置などを測るが理解の有無は直接証明しない。"}],"beginner":{"scenario":"目的から画面へから順に、情報と画面を整理する、利用者の違いを考えるを理解する。","trap":"NEMは操作時間比などから使いにくい箇所を探す。","quizId":"U-07-Y02"}},{"id":"07-2","title":"情報設計・操作の一貫性","explain":"<p>認知負荷を減らすには、関連情報を近くに配置し、複数の作業を分断せず、必要なときに選択肢を示す。ナビゲーションは情報構造を反映し、現在地・戻り方・次の操作を明確にする。アフォーダンス（操作可能性の手掛かり）、フィードバック（操作結果の即時通知）、制約（誤操作防止）を使う。</p>\n<p>Fittsの法則は目標までの距離と大きさがポインティング時間に関係する考え方。重要なボタンを押しやすい位置とサイズにするのに役立つ。入力の冗長な手間を減らす一方、破壊的操作には確認・取り消しを備える。</p>\n","worked":"<p>「削除」ボタンを「保存」と同じ色・隣接配置にすると誤操作を誘発しやすい。削除を視覚的に区別し、取り消しや復元機能を用意する。</p>\n","prompt":"使いづらい画面を詳細マニュアルで補えば十分か。","answer":"<p>まずUIで認知負荷と誤操作を減らすことが重要。</p>\n","beginner":{"scenario":"送信後に処理中と表示し二重送信を防ぐ。完了時に受付番号、失敗時に理由と再試行方法を示す。","trap":"警告が多いほど使いやすいわけではない。","quizId":"U-07-2"},"textbook":[{"heading":"操作が予測できる設計","body":"同じ操作を異なる画面で別の名称や位置にすると、利用者は毎回学び直す必要があります。操作の一貫性を持たせ、意味の近い情報をグループにまとめます。入力欄には形式の例や単位を示し、入力の負担を減らします。"},{"heading":"操作の結果を知らせる","body":"ボタンを押した後に何も起きないと利用者は不安になり、再度押すことがあります。処理中の表示、完了通知、エラーの具体的な理由と回復方法を示すことがフィードバックです。破壊的な操作には確認や取り消しを用意します。"},{"heading":"情報の優先順位","body":"重要な情報を見つけやすい位置に置き、見出し、余白、文字の大きさで階層を示します。すべてを目立たせると優先順位が分からなくなります。選択肢を絞る、段階的に詳細を表示する、検索・絞込みを設けるなど、利用者の認知負荷を抑える方法があります。"}]},{"id":"07-Y01","title":"情報アーキテクチャと操作部品","explain":"<p>通販サイトの1000商品を全部一列に並べると探しにくい。商品をカテゴリ別に階層化し、価格・色などのタグでも探せるようにする。ラベルは情報の名称、チャンクは意味のあるまとまり、ナビゲーションは情報間を移動する仕組み。直線型は申込み手順のような順序、Webリンク型は関連ページを網状に結ぶ、フォークソノミーは利用者自身によるタグ分類。メタデータはデータを説明する情報で、セマンティックWebは意味や関係を機械でも利用しやすくする考え方。</p>","worked":"<p><b>配送方法を通常・速達のどちらか一つ、追加オプションを複数選ぶ画面を設計する。</b></p><p>配送方法はラジオボタン、オプションは独立したチェックボックスが適する。</p>","prompt":"一つの候補から選ぶ部品と複数を独立に選ぶ部品の違いを説明せよ。","answer":"<p>ラジオボタンはグループ内で排他的、チェックボックスは項目ごとに真偽を選ぶ。</p>","textbook":[{"heading":"情報を探せる構造にする","body":"通販サイトの1000商品を全部一列に並べると探しにくい。商品をカテゴリ別に階層化し、価格・色などのタグでも探せるようにする。ラベルは情報の名称、チャンクは意味のあるまとまり、ナビゲーションは情報間を移動する仕組み。直線型は申込み手順のような順序、Webリンク型は関連ページを網状に結ぶ、フォークソノミーは利用者自身によるタグ分類。メタデータはデータを説明する情報で、セマンティックWebは意味や関係を機械でも利用しやすくする考え方。"},{"heading":"操作の単位と入力方式","body":"OOUI（オブジェクト指向UI）は商品などの対象を先に選び、その対象への操作を選ぶ。タスク指向UIは「返品する」など目的を先に選び対象を指定する。NUI（自然な操作のインタフェース）は身振り・タッチ等、VUI（音声インタフェース）は音声操作、マルチモーダルは音声・画像・タッチ等を組み合わせる。シグニファイアは押せることなどを示す手掛かり、アフォーダンスは対象と利用者の関係で可能な行為を指す。"},{"heading":"操作部品を選ぶ","body":"GUI（グラフィカルユーザーインタフェース）ではアイコン、ウィンドウ、ラジオボタン（原則一択）、チェックボックス（複数選択可）、トグル（状態の切替）、リストボックス、プルダウン、ポップアップ、テキストボックスを使う。アコーディオンは詳細を開閉、ツールチップは短い補足。ホバーはポインタを重ねる操作なのでタッチ画面では代替が必要。タップ、スワイプ、フリック、ピンチ、長押しは意味が分かる設計にする。"}],"beginner":{"scenario":"情報を探せる構造にするから順に、操作の単位と入力方式、操作部品を選ぶを理解する。","trap":"利用者が付与したタグで情報を分類する方式。","quizId":"U-07-Y01"}},{"id":"07-Z01","title":"メニュー部品の使い分け","explain":"<p>ハンバーガーメニューは一般に三本線のアイコンからナビゲーションを開く方式。ドロップダウンは選択肢や項目を展開し、アコーディオンは複数の見出しを開閉して内容を表示する。ポップアップは別の小領域に情報や操作を提示する。</p>","worked":"<p>主要3操作は下部ナビゲーション、設定などを三本線メニューに入れる。</p>","prompt":"長いFAQの各質問を選択して同じ画面で回答を開閉できる部品と、画面間の移動先をまとめて表示する部品をそれぞれ答えよ。","answer":"<p>FAQはアコーディオン、移動先の収納にはハンバーガーメニュー等のナビゲーションメニュー。前者は本文の開閉、後者は移動先の選択が目的。主要な移動先は常時表示も検討する。</p>","beginner":{"scenario":"スマートフォンの画面が狭いためメニューを常時表示できない。","trap":"三本線アイコンと階層を開閉するアコーディオンは別。","quizId":"U-07-Z01"},"textbook":[{"heading":"メニューは情報を探し操作を選ぶための構造","body":"UI（User Interface: ユーザーインタフェース）でメニューを設ける目的は、利用者が現在可能な操作や移動先を見つけ、選べるようにすることです。画面に全てを表示すると混雑し、全て隠すと重要な操作が見つけにくくなります。表示面積、利用頻度、操作の重要性を考えて部品を選びます。"},{"heading":"四つの部品を機能で区別する","body":"ハンバーガーメニューは一般に三本線のアイコンからナビゲーションを展開します。ドロップダウンは選択肢や項目を展開して選択させます。アコーディオンは見出しごとに内容を開閉して同じ画面内の情報量を調整します。ポップアップは小さな別領域に情報や操作を提示する方式です。単に表示が開くという共通点だけで同じものと判断しません。"},{"heading":"何を隠すかを利用者の目的から決める","body":"頻繁に使う重要操作は常時表示するなど発見しやすさを優先し、まれに使う操作はメニューへ収納できます。長い説明はアコーディオンで必要な箇所を開けるようにすると便利な場合があります。比較しながら読む内容を隠すと不便になるため、全て折り畳めばよいわけではありません。"},{"heading":"操作できる人の範囲を広げる","body":"アイコンだけに意味を依存させず、名称を付けます。キーボードや読み上げで操作できるか、展開状態が伝わるか、フォーカスが適切に移動するか、閉じる操作が可能かを確認します。実際の利用者に課題を試してもらい、発見までの時間や誤操作などで選択した設計を評価します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-3","focus":"比較軸、因果、実務適用を明示"}},{"id":"07-Y03","title":"入力検査・帳票・識別コードの設計","explain":"<p>年齢欄にABCが入るのを防ぐ数値検査、日付の書式を確かめるフォーマットチェック、0〜120など範囲を検査するリミットチェック、開始日が終了日以前かを確認する組合せチェック、商品コードがマスタに存在するかを確かめる照合チェック、合計金額と明細合計の一致を確かめるバランスチェックがある。処理順の矛盾はシーケンスエラー。入力画面だけでなくサーバでも検証する。</p>","worked":"<p><b>商品IDが整数だが商品マスタにない場合に行う検査は？</b></p><p>照合チェック。数値形式が正しくても商品が存在するとは限らない。</p>","prompt":"注文の開始日が終了日より後になっていないか確認する検査は？","answer":"<p>組合せチェック。二つの項目の関係を検査する。</p>","textbook":[{"heading":"誤入力を検査する","body":"年齢欄にABCが入るのを防ぐ数値検査、日付の書式を確かめるフォーマットチェック、0〜120など範囲を検査するリミットチェック、開始日が終了日以前かを確認する組合せチェック、商品コードがマスタに存在するかを確かめる照合チェック、合計金額と明細合計の一致を確かめるバランスチェックがある。処理順の矛盾はシーケンスエラー。入力画面だけでなくサーバでも検証する。"},{"heading":"チェックディジットを計算する","body":"識別コードの末尾に検査用数字を追加すると転記ミスを検出できる。例として数字123に各桁の重み1,3,1を掛けると1＋6＋3＝10。合計を10の倍数にする検査桁は0。124に変わると合計11となり誤りを検出する。実際の規格ごとに重みや算出法は異なり、全ての誤りを検出するわけではない。順番コードは連番、区分コードはカテゴリ別範囲、桁別コードは桁ごとに意味、表意コードは名称等を連想させ、合成コードは複数の識別要素を組み合わせる。"},{"heading":"帳票とデータをつなぐ","body":"帳票は請求書など定型の出力。明細、見出し、合計、改ページ条件、印刷幅等を設計する。フォームオーバーレイは帳票の定型部分と可変データを重ねる。画面・帳票の項目をデータベースの列、計算ルール、権限に対応付け、同じ情報を不要に重複入力させない。利用者の用語やエラーからの回復を考える。"}],"beginner":{"scenario":"誤入力を検査するから順に、チェックディジットを計算する、帳票とデータをつなぐを理解する。","trap":"相互に対応する集計値の整合性を確かめる。","quizId":"U-07-Y03"}},{"id":"07-C01","title":"非言語インタフェース・ハイパーメディア","explain":"<p>音声以外の操作や情報間の移動を設計する。</p><p>シラバスVer.7.2 本文32頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>地図上の施設を押して動画や説明へ移る教材はハイパーメディアの例。</p>","prompt":"視線で図を選び関連動画へ移動する教材について、入力方式と情報構造を分類し、代替操作を一つ挙げよ。","answer":"<p>視線入力は非言語インタフェース、図と動画のリンク構造はハイパーメディア。キーボードやタッチ操作等を用意する。</p>","beginner":{"scenario":"音声以外の操作や情報間の移動を設計する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-07-C01"},"textbook":[{"heading":"インタフェースの役割","body":"ユーザーインタフェースは人がシステムに意図を伝え、結果を受け取る接点です。人の意図を伝える手段（入力）と、システムから情報を受け取る手段（出力）、情報の間を移動する構造を分けて考えると、多様なインタフェースを整理できます。"},{"heading":"非言語インタフェース","body":"ノンバーバル（非言語）インタフェースでは、ジェスチャー、視線、表情、触覚など、言葉そのもの以外の情報を操作や意思伝達に使います。センサで動きや状態を観測し、システムが意図に対応付けます。言語入力が難しい場面で有効ですが、意図しない動作を操作と誤認識することがあるため、確認・取消し・代替入力を設計します。"},{"heading":"ハイパーテキストからハイパーメディアへ","body":"ハイパーテキストは文書の部分同士をリンクで結び、先頭から順に読まず関連情報へ移動できる構造です。ハイパーメディアはこれを画像・音声・動画などの媒体にも広げた概念です。複数の媒体を載せるだけのマルチメディアと、情報間をリンクで移動できる構造とは区別します。"},{"heading":"利用者に選択肢と現在地を与える","body":"リンクを自由にたどれると関連情報を調べやすくなりますが、今どこを見ているか、前の画面にどう戻るかが不明だと迷います。リンク名、見出し、戻る操作を明確にし、画像や音声にも代替テキスト・字幕等を用意します。色やジェスチャーだけに意味を依存させないことも重要です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"07-3","title":"アクセシビリティ・国際化","explain":"<p>アクセシビリティは障害の有無にかかわらず利用可能にする設計。画像の代替テキスト、キーボード操作、十分な色のコントラスト、フォームのラベル、明確なエラー表示、読み上げ順序を整える。WCAG（Web Content Accessibility Guidelines：Webコンテンツのアクセシビリティ指針）の考え方は知覚可能・操作可能・理解可能・堅ろう。</p>\n<p>国際化（i18n）は言語・地域差へ対応しやすい構造、地域化（l10n）は各地域向けの翻訳や日付・通貨・書式の調整。文字コードUTF-8（Unicode Transformation Format 8-bit：Unicodeの符号化方式）を使っても、単位や住所形式の違いは自動的には解決しない。</p>\n","worked":"<p>エラーを赤色の枠線だけで示すと色覚特性や音声読み上げで伝わりにくい。テキストで「必須項目です」を付け、入力欄と関連付ける。</p>\n","prompt":"読みやすい配色だけでアクセシビリティ対応が完了するか。","answer":"<p>しない。操作・構造・支援技術への適合も必要。</p>\n","beginner":{"scenario":"赤と緑だけで合否を示さず、合格・不合格の文字と形を併用する。読み上げでも意味を伝える。","trap":"文字を画像にすると拡大や読み上げが難しくなることがある。","quizId":"U-07-3"},"textbook":[{"heading":"誰でも使えるという目標","body":"アクセシビリティは障害の有無や環境にかかわらず情報・機能にアクセスできるようにすることです。視覚に頼れない人には読み上げ、手で細かい操作が難しい人にはキーボード操作などを提供します。色だけで状態を表さず文字や形を併用し、画像には意味に応じた代替テキストを付けます。"},{"heading":"具体的な設計","body":"画面を拡大しても文字やボタンが重ならないようにし、操作対象にフォーカスが当たる順番を意味のある順序にします。入力欄にはラベルを付け、エラーを読み上げられる形で伝えます。WCAG（ウェブコンテンツアクセシビリティガイドライン）はウェブのアクセシビリティを評価する指針です。"},{"heading":"国際化と地域化","body":"国際化（i18n）は文言をプログラムから分離し、文字コードや日時・通貨の違いに対応できる設計にすることです。地域化（l10n）は特定地域の言語・表示慣習などへ具体的に適応することです。翻訳だけでは時差、文字列の長さ、右から左へ読む言語などへの対応はできません。"}]}],"beginnerIntro":"利用者の目的や操作の迷いを理解し、実際の利用者による評価を考える。見た目だけでなく体験全体を扱う。","studyGroups":[{"title":"利用者の目的と評価","body":"使いやすさを目的達成・効率・満足から評価する。","ids":["07-1","07-X01","07-Y02"]},{"title":"操作と情報構造","body":"情報の配置と入力・表示手段を設計する。","ids":["07-2","07-Y01","07-Z01","07-Y03","07-C01"]},{"title":"多様な利用者への対応","body":"障害や言語によらず使える設計を考える。","ids":["07-3"]}]},{"id":8,"title":"情報メディア","group":"テクノロジ","priority":"A標準","summary":"画像・音声・動画のデータ量、圧縮、色表現、著作権の基礎。","lessons":[{"title":"画像のデータ量","body":"非圧縮画像の概算サイズは横画素×縦画素×色深度÷8バイト。RGB各8ビットなら1画素24ビット。解像度とファイル容量は同義ではない。","check":"圧縮率を使うときは圧縮前後の定義を確認。"},{"title":"可逆・非可逆圧縮","body":"可逆圧縮は元の情報を完全復元可能。JPEGなどの一般的な非可逆圧縮では一部の情報が失われる。PNGは一般に可逆圧縮を利用する。","check":"拡張子だけで全ての設定を断定しない。"},{"title":"音声と動画","body":"PCM（Pulse Code Modulation：パルス符号変調）の非圧縮音声データ量は標本化周波数×量子化ビット数×チャネル数×時間÷8。動画ではフレームレートと解像度が容量に影響。","check":"ビット毎秒とバイト毎秒に注意。"},{"title":"色空間と描画","body":"RGBは光の三原色による加法混色、CMYKは印刷で使う減法混色。ベクタ画像は形状記述により拡大しても原理上輪郭が荒れにくい。","check":"ラスターとベクタの用途を区別。"}],"terms":[{"term":"ラスター画像","definition":"画素の並びで画像を表現する方式"},{"term":"ベクタ画像","definition":"点・線・曲線などの形状情報で画像を表現する方式"},{"term":"RGB","definition":"赤・緑・青の光を加えて色を表現する方式"},{"term":"CMYK","definition":"シアン・マゼンタ・黄・黒のインキで色を表す方式"},{"term":"可逆圧縮","definition":"情報を損なわず元データを再現できる圧縮"},{"term":"非可逆圧縮","definition":"一部の情報を失う代わりに圧縮効率を高める方式"},{"term":"PCM","definition":"音声振幅を標本化して量子化し符号化する方式"},{"term":"フレームレート","definition":"1秒間に表示する映像の静止画枚数"},{"term":"標本化周波数","definition":"1秒間のアナログ信号測定回数"}],"questions":[{"id":"Q08-01","chapter":8,"kind":"applied","q":"800×600画素で1画素24ビットの非圧縮画像の容量は。","options":["約0.48MB","約1.44MB","約4.8MB","約14.4MB"],"correct":1,"explain":"800×600×24÷8=1,440,000バイト≒1.44MB（10進表記）。"},{"id":"Q08-02","chapter":8,"kind":"applied","q":"元データを完全に復元できる圧縮方式は。","options":["非可逆圧縮","可逆圧縮","量子化のみ","サンプリングのみ"],"correct":1,"explain":"可逆は情報を失わない。"},{"id":"Q08-03","chapter":8,"kind":"applied","q":"CD品質の音声を想定し44.1kHz・16ビット・2チャンネル・10秒の非圧縮量は。","options":["約0.88MB","約1.76MB","約8.82MB","約17.64MB"],"correct":1,"explain":"44,100×16×2×10÷8=1,764,000バイト。"},{"id":"D08-01","chapter":8,"kind":"applied","q":"1920×1080画素で24ビットの非圧縮RGB画像の画素データ量に最も近いものはどれか。","options":["約0.6MB","約2.1MB","約6.2MB","約24MB"],"correct":2,"explain":"1920×1080×24/8=6,220,800バイト。ヘッダや行パディングは除く。"},{"id":"D08-02","chapter":8,"kind":"applied","q":"44.1kHz、16ビット、ステレオの非圧縮PCMを60秒記録した容量に最も近いものはどれか。","options":["約1.3MB","約5.3MB","約10.6MB","約21.2MB"],"correct":2,"explain":"44,100×16×2×60/8=10,584,000バイト。圧縮コーデックの容量とは異なる。"},{"id":"D08-03","chapter":8,"kind":"applied","q":"ビットレート2Mbpsの映像を10分送る場合の映像データ量の理論値はどれか（付加情報は無視）。","options":["15MB","75MB","150MB","1200MB"],"correct":2,"explain":"2×10^6bit/秒×600秒÷8=150,000,000バイト=150MB。bitとByteを区別。"},{"id":"Q-08-X01","chapter":8,"kind":"applied","q":"画素を正確に保持して保存したいスクリーンショットに一般的に適する形式は？","options":["JPEG","PNG","MP3","H.264"],"correct":1,"explain":"PNG。可逆圧縮で画素を復元できる。"},{"id":"U-08-1","chapter":8,"kind":"applied","q":"400×200画素・16bit/画素の非圧縮容量は？","options":["160000B","80000B","1280000B","320000B"],"correct":0,"explain":"400×200×16÷8＝160000バイト。"},{"id":"U-08-2","chapter":8,"kind":"applied","q":"44.1kHz・16bit・2チャネルの非圧縮音声1秒の容量は？","options":["88200B","176400B","1411200B","44100B"],"correct":1,"explain":"44100×16×2÷8＝176400バイト。"},{"id":"U-08-3","chapter":8,"kind":"applied","q":"受信データの一時保存で短時間の通信変動を吸収する仕組みは？","options":["量子化","アンチエイリアス","バッファリング","カプセル化"],"correct":2,"explain":"先のデータを保持すれば短時間の遅れを吸収できる。"},{"id":"U-08-X01","chapter":8,"kind":"applied","q":"3次元モデル表面に画像を割り当てる技法は？","options":["量子化","正規化","パリティ検査","テクスチャマッピング"],"correct":3,"explain":"表面に模様・材質の見た目を付ける。"},{"id":"U-08-Y01","chapter":8,"kind":"applied","q":"演奏する音の高さ・強さ・時刻等を表す方式は？","options":["PCM","BMP","Exif","MIDI"],"correct":3,"explain":"MIDIは演奏指示を表し、PCMは音声波形の数値表現。"},{"id":"U-08-Y02","chapter":8,"kind":"applied","q":"画素ごとに補間した法線を用い照明を計算する方式は？","options":["フォンシェーディング","グーローシェーディング","ランレングス符号化","MIDI"],"correct":0,"explain":"フォン方式は法線を補間し照明計算を行う。"}],"deepIntro":"画像・音・動画は連続的な現実を離散的なデータにするため、品質と容量のトレードオフが生まれる。","deep":[{"id":"08-1","title":"画像の解像度・色と容量","explain":"<p>ラスター画像は画素（ピクセル）の集合。幅W、高さH、1画素bビットなら非圧縮の概算容量はW×H×b/8バイト（ヘッダや行パディングを除く）。RGB（Red Green Blue：赤緑青）の各8ビットで24ビットカラーは1画素約3バイト。アルファ値（透明度）が8ビット追加されるRGBAは4バイト。色深度と解像度は別の概念。</p>\n<p>ベクター画像は線・曲線・塗りを数式等で表し、拡大時も輪郭が劣化しにくい。JPEGは一般に非可逆圧縮、PNGは可逆圧縮（ただし元画像に変換が入っていない場合）。色空間RGBは光の加法混色、CMYKは印刷の減法混色に使う。</p>\n","worked":"<p>1920×1080画素、24ビットの生画像は1920×1080×3＝6,220,800バイト、約6.22MB（10進）または約5.93MiB（2進）。MBとMiBの違いに注意。</p>\n","prompt":"画像のdpiを2倍にすれば画素数も必ず4倍か。","answer":"<p>ならない。dpiは印刷・表示の密度指定に使われ、画素数そのものとは別。</p>\n","beginner":{"scenario":"画像は画素の集合。640×480画素・24bitなら640×480×24÷8＝921600バイト（非圧縮）。","trap":"縦横2倍は画素数4倍。圧縮やヘッダの条件を確認する。","quizId":"U-08-1","lab":{"title":"画像容量と圧縮率を求める","problem":"1200×800画素、RGB各8ビットの画像を、元の容量の1/5に圧縮する。容量は？","steps":["色深度は8×3=24bit/画素。","画素数は1200×800=960000。","元容量は960000×24÷8=2880000バイト。","圧縮後は2880000÷5=576000バイト。十進単位で576kB。"],"answer":"576000バイト","check":"圧縮率の定義が「元の何倍」か「削減率」かを確認する。今回は元の1/5。"}},"textbook":[{"heading":"画像は数値の格子","body":"デジタル画像は横と縦に並ぶ画素（ピクセル）で表します。RGBは赤・緑・青の光を混ぜる加法混色で、各8ビットなら各256段階、全体256³＝16777216通りの組合せです。CMYKは印刷で用いるシアン・マゼンタ・イエロー・黒の色材の表現です。"},{"heading":"容量を導く","body":"横W画素、縦H画素、1画素bビットなら非圧縮容量はW×H×b/8バイトです。例えば1000×500画素、24ビットなら1500000バイト。透明度（アルファ）8ビットも持つ32ビット表現なら2000000バイトです。ヘッダや行のパディング、圧縮を含む場合は別途計算します。"},{"heading":"解像度と画像形式","body":"ラスタ画像は画素の集合なので拡大すると画素が目立ちます。ベクタ画像は線・曲線などの形状を数式で表すのでロゴや図面の拡大に向きます。dpiは1インチ当たりのドット数で印刷などに使う尺度、ppiは1インチ当たりの画素数です。画素数と物理的な表示サイズを区別します。"}]},{"id":"08-Y02","title":"色・画像編集・3次元描画","explain":"<p>色相は赤や青などの色の種類、明度は明るさ、彩度は鮮やかさ。加法混色はRGBの光を加え白へ、減法混色は色材で光を吸収し黒に近づく。キープレートは印刷の黒版。YUV系の表現では輝度と色差を分ける。映像で一般的なY'CbCrの4:4:4は色差を間引かず、4:2:2は横方向で半分、4:2:0は横・縦方向で概ね半分にする。人は一般に輝度の細かい変化に敏感なので色差の解像度を下げて容量を抑える。</p>","worked":"<p><b>8ビットの輝度と二つの8ビット色差成分を4:2:0で4画素分記録する。</b></p><p>輝度4値＋色差各1値で計6値、48ビット。平均12ビット/画素（追加情報を除く）。</p>","prompt":"4:4:4に比べ4:2:0の容量が小さい理由は？","answer":"<p>色差成分を空間的に間引いて、輝度より低い解像度で保持するため。</p>","textbook":[{"heading":"色と明るさを別に扱う","body":"色相は赤や青などの色の種類、明度は明るさ、彩度は鮮やかさ。加法混色はRGBの光を加え白へ、減法混色は色材で光を吸収し黒に近づく。キープレートは印刷の黒版。YUV系の表現では輝度と色差を分ける。映像で一般的なY'CbCrの4:4:4は色差を間引かず、4:2:2は横方向で半分、4:2:0は横・縦方向で概ね半分にする。人は一般に輝度の細かい変化に敏感なので色差の解像度を下げて容量を抑える。"},{"heading":"画像を編集する","body":"ペイント系は画素、ドロー系は図形を主に操作する。レイヤーは複数の画像を重ねる層、トリミングは必要領域の切出し。ルックアップテーブルは入力値から出力値への対応表。ガンマ補正は明るさの非線形な関係を調整する。アンチエイリアシングは輪郭のぎざぎざを抑え、ディザリングは少ない色で中間色らしく見せる。"},{"heading":"3次元の映像を作る","body":"形状と材質に光や視点を設定して画像を描くのがレンダリング。グーローシェーディングは頂点で求めた明るさ等を面内で補間、フォンシェーディングは法線を補間し画素ごとに照明を計算する。テクスチャマッピングは模様を貼る。モーションキャプチャは人などの動きを測定、ホログラムは光の波面情報を再現する技術。VR（仮想現実）、AR（拡張現実）、MR（複合現実）を包括する考え方がXR。VOD（要求時映像配信）は利用者が希望時に再生する。"}],"beginner":{"scenario":"色と明るさを別に扱うから順に、画像を編集する、3次元の映像を作るを理解する。","trap":"フォン方式は法線を補間し照明計算を行う。","quizId":"U-08-Y02"}},{"id":"08-2","title":"音声の標本化と量子化","explain":"<p>連続音声をディジタル化するとき、サンプリング（標本化）で時間を離散化し、量子化で振幅を有限段階にする。最大周波数fmaxの帯域制限信号を復元するには、標本化周波数fsが通常2fmaxより高い必要がある（標本化定理）。満たさないとエイリアシング（折返しひずみ）が起こるため、入力側の低域通過フィルタが重要。</p>\n<p>無圧縮PCM（Pulse Code Modulation：パルス符号変調）のデータ量は標本化周波数×量子化ビット数×チャンネル数×秒数/8。音声コーデックを使う場合はビットレートから計算する。</p>\n","worked":"<p>44.1kHz、16ビット、ステレオ2ch、60秒のPCMは44,100×16×2×60/8＝10,584,000バイト（約10.6MB）。圧縮後容量ではない。</p>\n","prompt":"量子化ビット数を増やすと標本化周波数も増えるか。","answer":"<p>増えない。振幅方向の分解能と時間方向の細かさは別。</p>\n","beginner":{"scenario":"音は連続した振動。8kHz、16bit、1チャネル、10秒なら8000×16×10÷8＝160000バイト。","trap":"標本化は時間方向、量子化は振幅方向の離散化。","quizId":"U-08-2"},"textbook":[{"heading":"連続する音を数値にする","body":"音の振幅を一定時間間隔で測るのが標本化、測った値を有限の段階に丸めるのが量子化、整数値をビット列へ変換するのが符号化です。これらを組み合わせた代表方式がPCM（パルス符号変調）です。標本化周波数は毎秒何回測るか、量子化ビット数は振幅を何段階に分けるかを決めます。"},{"heading":"標本化定理","body":"最高周波数がfの帯域制限信号を理想的に復元するには標本化周波数を2fより高くします。例えば人の音声を4kHzまでとすれば8kHzを超える標本化を選ぶなど、対象帯域に応じ設計します。事前に不要な高周波をフィルタで除くことも重要です。"},{"heading":"データ量","body":"標本化周波数×量子化ビット数×チャネル数×秒数÷8で非圧縮音声のバイト数を求めます。ステレオは2チャネル、モノラルは1チャネルです。44.1kHz・16ビット・ステレオは毎秒176400バイト。圧縮形式では指定されたビットレートを用いることがあります。"}]},{"id":"08-Z01","title":"標本化定理・サンプリング周期の上限","explain":"<p>連続信号を一定間隔で測る操作が標本化。理想的な帯域制限信号の再構成には標本化周波数fsが最高周波数fmaxの2倍以上という試験上の基準を使う。厳密な境界や実装では余裕を取る。</p>","worked":"<p>最高10kHzなら20kHz以上、最大周期50マイクロ秒。</p>","prompt":"最高周波数12kHzの信号に標本化周期50μsは適切か。量子化ビット数を増やせば解決するか。","answer":"<p>50μsの逆数は20kHzで必要な24kHz未満。周期を約41.7μs以下にする必要がある。量子化は振幅精度を変えるため標本化不足は解消できない。</p>","beginner":{"scenario":"音声の最高周波数から必要な標本化頻度を求める。","trap":"最大周期は最高周波数の逆数ではなくその2倍の逆数。","quizId":"U-08-Z01"},"textbook":[{"heading":"連続信号を離散的に扱う","body":"音のような信号は時間とともに連続的に変化します。コンピュータでは連続した全ての時刻の値を保存できないので、一定間隔で振幅を測ります。これが標本化（サンプリング）です。測った値を有限の段階に丸める量子化とは別の処理です。"},{"heading":"標本化周波数と周期","body":"標本化周波数fsは1秒間に測る回数、標本化周期Tsは測定と次の測定の時間間隔です。Ts=1/fsです。たとえばfs=1000Hzなら1秒に1000回、周期は0.001秒になります。周波数を大きくするほど周期は短くなります。"},{"heading":"標本化定理の条件","body":"最高周波数fmaxまでの成分を持つ理想的な帯域制限信号を再構成するには、試験ではfsが2fmax以上という基準を用います。厳密な境界条件や実際のフィルタ性能のため、実装では通常余裕を設けます。この条件を満たさないと、異なる高周波成分を同じ標本列として観測するエイリアシング（折返し）が起こります。"},{"heading":"周期の上限へ変換する","body":"fs≥2fmax、Ts=1/fsなので、Ts≤1/(2fmax)となります。最高8kHzなら2×8000=16000Hz、周期の上限は1/16000秒=0.0000625秒=62.5マイクロ秒です。周期を尋ねられたら周波数の逆数を取るため、不等号の向きにも注意します。"},{"heading":"実際の信号処理","body":"標本化前には不要な高周波成分を低域通過フィルタで除去することがあります。標本化周波数は時間方向の細かさを決め、量子化ビット数は振幅方向の細かさを決めます。標本化不足による折返しと、量子化による丸め誤差は別の問題です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"08-3","title":"動画・圧縮・ストリーミング","explain":"<p>動画は連続画像と音声の系列。フレームレートは1秒当たりの画像枚数、解像度は1フレームの画素数。非圧縮動画は容量が巨大なので、フレーム内圧縮とフレーム間の差分・動き補償を組み合わせる。Iフレーム（独立フレーム）、Pフレーム（過去参照）、Bフレーム（前後参照）の構成は、容量・遅延・ランダムアクセスのトレードオフ。</p>\n<p>ストリーミングでは帯域とバッファを管理する。ABR（Adaptive Bitrate：適応ビットレート）配信は通信状態に応じて品質を切り替え再生停止を減らす。CDN（Content Delivery Network：コンテンツ配信網）は利用者に近い拠点から配信して遅延・負荷を抑える。</p>\n","worked":"<p>動画が2Mbpsで10分なら理想的な映像データ量は2×10⁶×600/8＝150MB。音声・コンテナ等を除く概算。MbpsをMB/sと取り違えない。</p>\n","prompt":"圧縮率が高ければ視聴品質も必ず高いか。","answer":"<p>ならない。情報を削り過ぎれば画質・音質が低下する。</p>\n","beginner":{"scenario":"映像4Mbit/s、音声0.2Mbit/s、10秒なら合計4.2×10÷8＝5.25MB（追加情報なし）。","trap":"フレームレートと画素解像度は異なる。","quizId":"U-08-3"},"textbook":[{"heading":"動画をどう圧縮するか","body":"動画は時間順に並ぶフレーム（画像）と音声から成ります。毎秒30フレームなら1秒に30枚表示します。各フレームを独立に圧縮する方法と、前後のフレームの共通部分や動きの情報を利用する方法があり、後者は静止した背景などの重複を減らせます。"},{"heading":"ビットレートと通信","body":"ビットレートは1秒当たりのデータ量です。4Mbit/sの動画を60秒保存すれば、追加情報を無視した容量は4×60÷8＝30MBです。一定ビットレートは通信量を予測しやすく、可変ビットレートは場面の複雑さによって量を調整します。"},{"heading":"ストリーミング","body":"全データを受信してから再生するのではなく、受信しながら再生します。バッファに先のデータを一時保存し通信速度の短時間の変動を吸収します。適応型ストリーミングでは通信状態に応じ画質・ビットレートを切り替えます。低遅延と途切れにくさの間にはトレードオフがあります。"}]},{"id":"08-X01","title":"画像・音声・動画形式とマルチメディア応用","explain":"<p>JPEGは一般に非可逆の写真圧縮、PNGは可逆圧縮と透過、GIFは最大256色のパレットや簡易アニメーションを扱う。MPEGは動画・音声圧縮等の規格群、H.264は動画符号化規格。YUV系の色表現は輝度と色差を分け、色差の解像度を下げることがある。PCM（パルス符号変調）は標本化・量子化した値を符号化する。</p><p>ラスタは画素、ベクタは図形の数式。アンチエイリアスは境界のぎざぎざを抑え、ディザリングは限られた色で中間調を表す。CG（コンピュータグラフィックス）のレンダリングはモデルから画像を生成し、レイトレーシングは光線を追跡する。テクスチャマッピングは表面に画像を貼る。ARは拡張現実、VRは仮想現実、MRは複合現実。</p>","worked":"<p>ロゴの拡大縮小にはベクタ形式が適する場合が多い。写真をJPEG保存すると画質と容量のトレードオフがある。</p>","prompt":"画素を正確に保持して保存したいスクリーンショットに一般的に適する形式は？","answer":"<p>PNG。可逆圧縮で画素を復元できる。</p>","beginner":{"scenario":"写真にはJPEG、文字入り図表には可逆のPNGやベクタ形式が適する場合がある。","trap":"可逆は元データを復元でき、非可逆は情報を一部失う。","quizId":"U-08-X01"},"textbook":[{"heading":"用途と形式の対応","body":"JPEGは写真向きの非可逆圧縮が一般的で、PNGは可逆圧縮・透明度に対応、GIFは限定色の画像や簡単なアニメーションに使われます。MP3やAACは音声圧縮、H.264などは動画符号化規格です。コンテナ形式は動画・音声・字幕などをまとめる入れ物、コーデックは符号化・復号の方式です。"},{"heading":"画像処理の仕組み","body":"アンチエイリアスは斜線や曲線の境界のぎざぎざを周辺画素の色で滑らかに見せます。ディザリングは少ない色で中間調に見えるよう画素を配置します。画像フィルタは近傍画素を使って平滑化・輪郭抽出などを行います。"},{"heading":"3次元と仮想世界","body":"CG（コンピュータグラフィックス）では形状・材質・光・視点から画像を生成（レンダリング）します。テクスチャマッピングは表面に模様を割り当て、Zバッファは画素ごとに奥行きを比較して手前の物体を表示します。VRは仮想現実、ARは現実に情報を重ねる拡張現実、MRは現実と仮想の相互作用を含む複合現実です。"}]},{"id":"08-Y01","title":"メディアのファイル形式・圧縮・編集","explain":"<p>WAVやAIFF、AUは音声データを格納する形式で、WAV等は非圧縮PCMを含むことが多い。MP3は聴覚特性を利用して音声を非可逆圧縮する。MIDI（電子楽器のデジタルインタフェース）は発音する音符、強さ、時刻などの演奏指示を記録し、音源が音を生成する。録音された波形そのものではない。PDFは文書の見た目を保持しやすい形式、DTP（机上出版）はコンピュータで紙面を制作すること。オーサリングは文字・音声・画像等を編集し統合する。</p>","worked":"<p><b>100MBの画像を圧縮して20MBになった。</b></p><p>元の20%のサイズであり、削減率は80%。復元できるかは圧縮方式による。</p>","prompt":"同じ演奏指示でもMIDIの再生音が音源で変わる理由は？","answer":"<p>音波そのものではなく音符等の指示を保存し、音源が音を作るため。</p>","textbook":[{"heading":"音を保存するか演奏を記録するか","body":"WAVやAIFF、AUは音声データを格納する形式で、WAV等は非圧縮PCMを含むことが多い。MP3は聴覚特性を利用して音声を非可逆圧縮する。MIDI（電子楽器のデジタルインタフェース）は発音する音符、強さ、時刻などの演奏指示を記録し、音源が音を生成する。録音された波形そのものではない。PDFは文書の見た目を保持しやすい形式、DTP（机上出版）はコンピュータで紙面を制作すること。オーサリングは文字・音声・画像等を編集し統合する。"},{"heading":"静止画と動画を区別する","body":"BMPは典型的に画素の配列を持つ。TIFFは多様な画像情報や圧縮方式に対応。HEIFは画像等を格納するコンテナ形式。Exifは撮影日時・カメラ設定等のメタデータを記録する規格。H.264とH.265（HEVC）は動画符号化規格、AVIやQuickTimeは音声・動画等を格納するコンテナ。Motion JPEGは各フレームをJPEGとして圧縮する。インタレースは走査線を交互に描き、プログレッシブは順に描く。ノンリニア編集は任意の位置の素材を編集しやすい。"},{"heading":"圧縮方式を選ぶ","body":"可逆圧縮は元の情報を正確に復元する。ZIPは汎用の可逆圧縮等の形式。非可逆は情報を捨てて圧縮率を高めるが復元は近似。ファクシミリ画像のMH（修正ハフマン）は白黒の連続長、MR（修正READ）とMMR（修正修正READ）は前の走査線との差等も利用する。圧縮率の定義が元容量に対する圧縮後の比か、削減割合かを確認する。4K・8Kは画素数の多い映像で、容量・帯域・復号負荷が大きくなる。"}],"beginner":{"scenario":"音を保存するか演奏を記録するかから順に、静止画と動画を区別する、圧縮方式を選ぶを理解する。","trap":"MIDIは演奏指示を表し、PCMは音声波形の数値表現。","quizId":"U-08-Y01"}}],"beginnerIntro":"画像・音声・動画を数値化する。容量計算は単位、圧縮の有無、時間やチャネル数を確認する。","studyGroups":[{"title":"画像の表現","body":"画素・色・座標を数値として扱う。","ids":["08-1","08-Y02"]},{"title":"音声の表現","body":"連続信号を標本化・量子化する条件を理解する。","ids":["08-2","08-Z01"]},{"title":"圧縮と配信","body":"画像・音声・動画の情報量と保存・伝送方式を結ぶ。","ids":["08-3","08-X01","08-Y01"]}]},{"id":9,"title":"データベース","group":"テクノロジ","priority":"B選択候補","summary":"ER図・正規化・SQL・結合・トランザクション・ロックを重点。","lessons":[{"title":"関係モデルとキー","body":"関係データベースは行と列からなる表で扱う。主キーは行を一意識別しNULL不可。外部キーは他表のキーを参照し参照整合性を支える。","check":"候補キー・主キー・外部キーを設計図上で明確にする。"},{"title":"正規化","body":"第1正規形は繰返し項目を排除、第2は複合主キーの一部にのみ依存する非キー属性を分離、第3は非キー属性を介した推移的関数従属を分離する。","check":"関数従属性を記号で書いて整理。"},{"title":"SQLの実行順序","body":"SQL（Structured Query Language：構造化問合せ言語）はFROM/JOIN→WHERE→GROUP BY→HAVING→SELECT→ORDER BYという論理的処理順序で考えると理解しやすい。WHEREはグループ化前、HAVINGは集約後の絞り込み。","check":"COUNT(*)とCOUNT(列)ではNULLの扱いが異なる。"},{"title":"結合","body":"内部結合は一致する行、左外部結合は左表の行を残す。一対多結合では件数が増えるのでCOUNTの集計粒度に注意する。","check":"LEFT JOIN後の右表条件をWHEREに置くと事実上内部結合になる場合がある。"},{"title":"ACIDと分離","body":"トランザクションのACIDは原子性・一貫性・独立性・永続性。分離レベルやロックでダーティリード・ノンリピータブルリード・ファントムリードを制御。","check":"「原子性」と「独立性」は異なる。"}],"terms":[{"term":"主キー","definition":"表の行を一意に識別しNULLを許さない列または列集合"},{"term":"外部キー","definition":"別の表の候補キー等を参照する列・列集合"},{"term":"関数従属","definition":"属性Xが決まると属性Yが一意に決まる関係"},{"term":"第2正規形","definition":"第1正規形かつ非キー属性の主キーの一部への部分関数従属がない状態"},{"term":"第3正規形","definition":"第2正規形を満たし非キー属性の推移的従属を除いた状態"},{"term":"INNER JOIN","definition":"結合条件を満たす行だけを結合するSQL操作"},{"term":"LEFT JOIN","definition":"左側の表の行を残し右表との一致を結合する操作"},{"term":"HAVING","definition":"GROUP BYで集約したグループに条件を掛ける句"},{"term":"ACID","definition":"トランザクションの原子性・一貫性・独立性・永続性"},{"term":"ダーティリード","definition":"未確定トランザクションの変更内容を読む現象"},{"term":"デッドロック","definition":"互いの資源やロックの解放を待ち続ける状態"},{"term":"B木インデックス","definition":"比較検索や範囲検索に適した平衡木型索引"}],"questions":[{"id":"Q09-01","chapter":9,"kind":"applied","q":"売上表から顧客ごとの売上合計が10万円以上の顧客だけ取り出すSQL句は。","options":["WHERE SUM(金額)>=100000","HAVING SUM(金額)>=100000","ORDER BY SUM(金額)>=100000","LIMIT SUM(金額)>=100000"],"correct":1,"explain":"集約後の条件はHAVINGに書く。"},{"id":"Q09-02","chapter":9,"kind":"applied","q":"主キー(注文番号,商品番号)の表で商品名が商品番号だけに従属する場合、問題となるのは。","options":["部分関数従属","外部結合","排他制御","可逆圧縮"],"correct":0,"explain":"複合キーの一部に従属するため第2正規形で分離を検討する。"},{"id":"Q09-03","chapter":9,"kind":"applied","q":"未コミットの別トランザクションの値を読んだ現象は。","options":["ファントムリード","ダーティリード","ロストアップデート","デッドロック"],"correct":1,"explain":"確定していないデータの読み取りはダーティリード。"},{"id":"D09-01","chapter":9,"kind":"applied","q":"受注が0件の顧客も含む集計で顧客ごとの受注件数を数えるとき、LEFT JOIN後に適切なのはどれか。","options":["COUNT(*)","COUNT(受注.受注ID)","SUM(顧客.ID)","GROUP BYは使えない"],"correct":1,"explain":"LEFT JOINは受注0件でも顧客行が1行残る。COUNT(*)では1と数えるので、NULLになった右側キーをCOUNTする。"},{"id":"D09-02","chapter":9,"kind":"applied","q":"社員ID→部署ID、部署ID→部署名という依存がある表で、部署名の重複更新を減らす設計はどれか。","options":["部署名を社員表へ複数追加する","全項目を文字列1列にする","社員表と部署表に分割する","社員IDを削除する"],"correct":2,"explain":"非キー属性の推移的関数従属を除く第三正規化の考え方に相当する。"},{"id":"D09-03","chapter":9,"kind":"applied","q":"非同期レプリケーションで、主DBの更新をコミット直後に障害が発生した場合のリスクはどれか。","options":["更新が必ず複製に反映される","複製先への反映前なら直近更新が失われ得る","バックアップは不要になる","通信遅延がゼロになる"],"correct":1,"explain":"非同期では複製完了前のコミットを切替先が保持していない可能性がありRPOに影響する。"},{"id":"Q-09-X01","chapter":9,"kind":"applied","q":"関係表から指定列だけ取り出す演算は？","options":["選択","射影","直積","差集合"],"correct":1,"explain":"射影。"},{"id":"Q-09-X02","chapter":9,"kind":"applied","q":"複数サーバに顧客IDの範囲ごとにデータを分割する方式は？","options":["レプリケーション","シャーディング","正規化","ロールバック"],"correct":1,"explain":"シャーディング。"},{"id":"U-09-1","chapter":9,"kind":"applied","q":"注文表の顧客IDが顧客表の主キーを参照するとき何というか？","options":["外部キー","必ず主キー","必ず候補キー","必ず索引"],"correct":0,"explain":"他表のキーを参照する列は外部キー。注文行の一意識別とは別。"},{"id":"U-09-2","chapter":9,"kind":"applied","q":"グループごとの合計値に対する抽出条件を書く句は？","options":["WHERE","HAVING","FROM","ORDER BY"],"correct":1,"explain":"WHEREは集計前の行、HAVINGは集計後のグループ。"},{"id":"U-09-3","chapter":9,"kind":"applied","q":"他取引の未コミットの値を読む現象は？","options":["ファントムリード","デッドロック","ダーティリード","ロールバック"],"correct":2,"explain":"ダーティリードは未確定データの読取り。"},{"id":"U-09-4","chapter":9,"kind":"applied","q":"B木系索引がハッシュ索引より一般に適する検索は？","options":["暗号解読","画像圧縮","全件削除","範囲検索"],"correct":3,"explain":"B木系は順序を利用できる。ハッシュは等値検索が主用途。"},{"id":"U-09-5","chapter":9,"kind":"applied","q":"確定済み更新をログから再適用する処理は？","options":["ロールフォワード","ロールバック","正規化","シャーディング"],"correct":0,"explain":"ロールフォワードは更新の再適用、ロールバックは取消し。"},{"id":"U-09-X01","chapter":9,"kind":"applied","q":"2つの関係の全行の組合せを生成する演算は？","options":["射影","直積","選択","差集合"],"correct":1,"explain":"m行とn行なら全組合せはm×n行。"},{"id":"U-09-X02","chapter":9,"kind":"applied","q":"元データを抽出・変換して分析基盤へ格納する処理は？","options":["OLTP","DDL","ETL","RAID"],"correct":2,"explain":"ETLはExtract・Transform・Load（抽出・変換・格納）。"},{"id":"U-09-Y01","chapter":9,"kind":"applied","q":"DBの物理配置変更の影響を論理構造から隠す性質は？","options":["参照整合性","物理的データ独立性","原子性","データの重複"],"correct":1,"explain":"内部スキーマを変更しても上位の構造を維持できる性質。"},{"id":"U-09-Y02","chapter":9,"kind":"applied","q":"注文表に存在しない顧客IDを登録させない制約は？","options":["NOT NULLだけ","列の型指定だけ","外部キー制約","索引のみ"],"correct":2,"explain":"参照整合性を保証する外部キー制約を用いる。"},{"id":"U-09-Y03","chapter":9,"kind":"applied","q":"全ての指定科目を履修した学生を求める関係演算は？","options":["射影だけ","直積だけ","和集合のみ","商"],"correct":3,"explain":"商は指定された集合の全要素と関連する対象を求める。"},{"id":"U-09-Y04","chapter":9,"kind":"applied","q":"集計値を計算しても元の行数を保持できるSQL機能は？","options":["ウィンドウ関数","GROUP BYのみ","DELETE","CREATE TABLE"],"correct":0,"explain":"ウィンドウ関数は関連する行の集合で計算し各行へ結果を付けられる。"},{"id":"U-09-Y05","chapter":9,"kind":"applied","q":"2相ロッキングでロック解放を開始した後の規則は？","options":["すべてのロックを再取得する","新しいロックを取得しない","必ず全取引を確定する","共有ロックを禁止する"],"correct":1,"explain":"取得段階と解放段階を分ける。"},{"id":"U-09-Y06","chapter":9,"kind":"applied","q":"問合せに必要な列を含み表本体の読取りを省ける可能性がある索引は？","options":["転置索引のみ","ビットマップ索引のみ","カバリング索引","主キー制約だけ"],"correct":2,"explain":"必要列を索引から取得できる場合に利用する。"},{"id":"U-09-Y07","chapter":9,"kind":"applied","q":"生データを保存先に格納してから変換する処理方式は？","options":["ETL","2相ロッキング","RAID1","ELT"],"correct":3,"explain":"ELTはExtract・Load・Transformの順で処理する。"}],"deepIntro":"データベースの問題は「何を保存するか」「矛盾をどう防ぐか」「どう高速に取り出すか」に分解する。科目BではSQLだけでなく、設計理由を文章で説明する力が必要。","deep":[{"id":"09-Y01","title":"3層スキーマとデータベース方式の選択","explain":"<p>外部スキーマは利用者・プログラムから見たデータの定義、概念スキーマは全体の論理構造、内部スキーマは物理的な保存構造。営業担当には顧客名と注文、経理には請求情報だけを見せても、全体では共通の顧客表を使える。索引やファイル配置を変えてもアプリ側の見え方を維持できるのが物理的データ独立性。概念構造を変更しても外部スキーマを保つ考え方が論理的データ独立性。</p>","worked":"<p><b>物理ディスク上の索引を追加しても検索プログラムのSQLを変更しなくてよい。</b></p><p>物理的データ独立性の例。内部スキーマの変更を上位層から隠す。</p>","prompt":"営業部門に顧客の住所を見せず氏名だけを提供するスキーマはどれか。","answer":"<p>外部スキーマ。利用者ごとの見え方を定義する。</p>","textbook":[{"heading":"データの見え方と保存を分ける","body":"外部スキーマは利用者・プログラムから見たデータの定義、概念スキーマは全体の論理構造、内部スキーマは物理的な保存構造。営業担当には顧客名と注文、経理には請求情報だけを見せても、全体では共通の顧客表を使える。索引やファイル配置を変えてもアプリ側の見え方を維持できるのが物理的データ独立性。概念構造を変更しても外部スキーマを保つ考え方が論理的データ独立性。"},{"heading":"モデルを比較する","body":"関係型は表とキー、階層型は親子の木、網型はレコード間の多様な関連、オブジェクト型は属性と操作を持つ対象、XML型は階層的文書を扱う。キー・バリュー型はキーから値を取得、文書型はJSON等の文書、列指向は列ごとの保存・集計や列族の構成、グラフ型はノードと辺で関係を辿る。プロパティグラフはノード・辺に属性を持ち、トリプルストアは主語・述語・目的語の組で関係を表す。インメモリDBは主記憶上で処理するため高速な場合がある。永続性の仕組みは別途確認する。"},{"heading":"管理機能と製品例","body":"DBMS（データベース管理システム）は構造定義、検索更新、同時実行制御、復旧、権限を提供する。関係型にはPostgreSQL、MySQL、SQLite、文書型にはMongoDB、CouchDB、キー・バリュー型にはRedis、列族型にはCassandra、グラフ型にはNeo4jがある。SQLiteは一般にアプリ内に組み込む方式。関係モデルの行はタプル、列は属性、取り得る値の集合はドメイン。関係スキーマは属性などの構造定義。"}],"beginner":{"scenario":"データの見え方と保存を分けるから順に、モデルを比較する、管理機能と製品例を理解する。","trap":"内部スキーマを変更しても上位の構造を維持できる性質。","quizId":"U-09-Y01"}},{"id":"09-1","title":"関係モデル・主キー・外部キー・正規化","explain":"<p>関係データベース（RDB: Relational Database）は表（関係）の行でデータを表す。主キーは行を一意に識別し、候補キーは一意性と最小性を満たす属性集合。外部キーは別表の候補キーなどを参照し、参照整合性を維持するために使う。NULL（値が不明・存在しないことなどを示すマーカー）は0や空文字とは異なり、比較演算でUNKNOWNを生む場合がある。</p>\n<p>正規化は更新時の矛盾を防ぐ設計手法。第1正規形は各セルが原子的な値、第2正規形は候補キーの一部だけに依存する非キー属性を除く、第3正規形は非キー属性を経由した推移的関数従属を除く（厳密には各正規形の判定条件を確認）。例えば「注文明細(注文ID,商品ID,商品名,単価,数量)」で(注文ID,商品ID)が主キーなら、商品名と単価が商品IDだけに依存する設計では商品変更時に多数行を更新する必要があるため、商品表に分割する。</p>\n","worked":"<p>社員(社員ID,部署ID,部署名)で社員ID→部署ID、部署ID→部署名と成り立つなら、社員ID→部署名は推移的依存。部署(部署ID,部署名)と社員(社員ID,部署ID)に分割すれば部署名の変更箇所を減らせる。</p>\n","prompt":"主キーが「注文ID＋商品ID」である明細表の「商品名」は、主キー全体に依存するか。","answer":"<p>通常は商品IDだけで決まるため部分関数従属であり、商品表への分割を検討する。</p>\n","beginner":{"scenario":"注文行に顧客名が重複すると改名で全行修正が必要。顧客表に名前を置き、注文表には顧客IDだけを持たせる。","trap":"正規化は重複・矛盾を減らす。非正規化は整合性を別に管理する必要がある。","quizId":"U-09-1","lab":{"title":"正規化を実際の表で考える","problem":"注文明細（注文ID、商品ID、顧客名、商品名、数量）を設計する。複合主キーは注文IDと商品ID。注文ごとに顧客は一人、商品IDごとに商品名は一つ。","steps":["主キー全体で数量を決める。商品名は商品IDだけで決まり、顧客名は注文IDだけで決まるため部分関数従属がある。","注文表（注文ID、顧客ID）、商品表（商品ID、商品名）、顧客表（顧客ID、顧客名）に分離する。","明細表（注文ID、商品ID、数量）は複合主キーを持ち、注文・商品を外部キーで参照する。","顧客名の修正は顧客表1か所で済む。注文・商品との関連を結合で復元できる。"],"answer":"注文・商品・顧客・明細の4表に整理","check":"顧客IDを追加できる設計を仮定。実際には関数従属と業務ルールを確かめて分割する。"}},"textbook":[{"heading":"データベースは何を保証したいのか","body":"単に情報を保存するだけならファイルでも十分です。しかし複数の人が同じ情報を更新すると、重複や不整合が生じます。関係データベースは現実の対象とその関係を表（リレーション）で表し、ルールを設けて矛盾を防ぎます。行は対象の一件、列はその性質、列に入る値の集合をドメインと呼びます。"},{"heading":"キーは何のためにあるか","body":"行を一意に決められる属性の最小集合を候補キーと呼び、そのうち主に使うものが主キーです。注文番号だけで明細を区別できなければ、注文番号と明細番号の組をキーにします。外部キーは別の表などのキーを参照する列です。例えば顧客IDが実在する顧客を指すという参照整合性をデータベース管理システム（DBMS）が検査できます。"},{"heading":"関数従属：何が何を決めるか","body":"Xの値が同じなら必ずYの値も同じになる関係をX→Yと書きます。これは統計的な傾向ではなく、データの意味に基づく制約です。注文番号→顧客ID、顧客ID→住所といった関係を見抜くことが正規化の出発点です。氏名が同じ別人がいるなら氏名→顧客IDとはいえません。"},{"heading":"第1正規形から第2正規形へ","body":"第1正規形は各セルに原子的な値を入れ、繰返しの列や集合を避けます。注文番号と商品IDの組が候補キーで、商品名が商品IDだけで決まる場合、候補キーの一部に依存する非キー属性が存在します。第2正規形ではこれをなくし、商品表へ商品名を移します。これで商品名の変更を一か所で行えます。"},{"heading":"第3正規形と表の結合","body":"注文番号→顧客ID→顧客住所のように、典型的な非キー属性を経由する従属があれば、顧客住所を顧客表に移します。これが第3正規形を得る基本的な考え方です。厳密には候補キーも考慮します。分解後もキーで結合して必要な情報を復元できること（無損失分解）が重要です。"},{"heading":"設計から利用へ","body":"ER図（Entity Relationship Diagram: 実体関連図）は顧客と注文のような実体、関連、1対多などの多重度を記述します。主キー・外部キーとして実装し、正規化で更新時の矛盾を抑えます。正規化は処理速度を常に向上させる手法ではなく、結合の負担とデータ整合性の両方を考えて物理設計します。"}],"walkthrough":{"heading":"第1・第2・第3正規形を順に作る","body":"一つのセルに「鉛筆,消しゴム」と複数商品を入れる注文表では、商品ごとの数量や検索が困難です。まず商品ごとに行を作り第1正規形へ近づけます。次に注文番号と商品番号が複合キーなら、注文日や顧客番号は注文番号だけ、商品名や標準価格は商品番号だけで決まります。これらを注文表と商品表へ分けることで部分関数従属を除きます。注文表に顧客番号と顧客住所が残っていれば、注文番号→顧客番号→住所という推移的従属があるので顧客表へ分離します。販売時の実際の単価を保存するなら、後から標準価格が変わっても履歴が変わらないよう明細に取引単価を保持することがあります。正規化は機械的に列を消すのではなく、何が何を決定するかという業務ルールに基づきます。","cols":["表","主キー","属性・外部キー"],"rows":[["顧客","顧客ID","氏名、住所"],["注文","注文ID","顧客ID、注文日"],["商品","商品ID","商品名、標準価格"],["明細","注文ID＋商品ID","数量、取引単価"]]},"pedagogyReviewed":true},{"id":"09-X01","title":"関係代数とデータベースの方式","explain":"<p>関係データベースでは選択は条件に合う行、射影は必要な列、結合は共通項目などで関係を組み合わせる演算である。和・差・積集合や直積も基本操作。SQL（構造化問い合わせ言語）は関係代数に基づく操作を記述する。ER図（実体関連図）は実体と関係を可視化する。</p><p>階層型は木、ネットワーク型は複雑な関連、関係型は表、オブジェクト型はオブジェクトでデータを表現する。NoSQLはキーバリュー、文書、列指向、グラフなどを含む。B木系の索引は範囲検索に適する一方、ハッシュ索引は等値検索に向く。</p>","worked":"<p>社員表から営業部の社員名だけを求める場合、部門による選択の後に社員名への射影を行う。</p>","prompt":"関係表から指定列だけ取り出す演算は？","answer":"<p>射影。</p>","beginner":{"scenario":"社員表から営業部の行を抽出して氏名列だけ取得する。前者が選択、後者が射影。","trap":"日常語の選択と関係代数の選択を混同しない。","quizId":"U-09-X01"},"textbook":[{"heading":"関係代数はSQLの土台","body":"表の一部を取り出す基本操作を考えます。選択は条件に合う行を取り出し、射影は指定した列を取り出します。結合は関連する行を組み合わせ、直積は全ての組合せです。例えば社員表100行と部門表5行の直積は500行になりますが、部門IDの一致条件を加えると社員に対応する部門だけに絞れます。"},{"heading":"集合演算と重複","body":"和集合は双方の要素、積集合は共通要素、差集合は一方にだけある要素です。純粋な関係モデルは集合として重複を扱いませんが、SQLは通常重複を保持する場合があります。SELECT DISTINCTは取得結果の重複を除き、UNIONは通常重複除去、UNION ALLは重複を保持します。"},{"heading":"データモデルの比較","body":"階層型は木構造、ネットワーク型は多様な関連、関係型は表、オブジェクト型はデータと操作をまとめた対象として表現します。グラフ型データベースはノードと関係の探索に適します。表を選ぶ際は構造だけでなく検索・更新の必要性を考えます。"}]},{"id":"09-Y02","title":"データ分析・制約・物理設計","explain":"<p>店舗によって「顧客番号」と「会員ID」が同じ意味なら異音同義語、同じ「金額」が税込と税抜で異なるなら同音異義語。データ辞書で意味、型、単位を定義する。トップダウンは業務全体から実体や関係を整理、ボトムアップは既存帳票・データ等から共通項をまとめる。DOA（データ中心アプローチ）は業務で共有するデータ構造を重視する。ER図では顧客と注文の1対多、商品と注文の多対多などを表す。多対多は中間表で二つの1対多に分解できる。</p>","worked":"<p><b>会員番号のほかにメールアドレスも重複禁止としたい。</b></p><p>主キーとは別にメール列に一意性制約を設定し、必要ならNULL禁止も設定する。</p>","prompt":"非正規化で結合を減らす代わりに注意することは？","answer":"<p>重複データを更新した際の不整合を防ぐ仕組みが必要。</p>","textbook":[{"heading":"業務の意味をモデル化する","body":"店舗によって「顧客番号」と「会員ID」が同じ意味なら異音同義語、同じ「金額」が税込と税抜で異なるなら同音異義語。データ辞書で意味、型、単位を定義する。トップダウンは業務全体から実体や関係を整理、ボトムアップは既存帳票・データ等から共通項をまとめる。DOA（データ中心アプローチ）は業務で共有するデータ構造を重視する。ER図では顧客と注文の1対多、商品と注文の多対多などを表す。多対多は中間表で二つの1対多に分解できる。"},{"heading":"論理設計で矛盾を防ぐ","body":"主キーは行を一意に識別、UNIQUEは値の一意性、NOT NULLは欠損禁止、CHECKは指定条件、FOREIGN KEYは参照先の存在を保証する制約。自然キーは業務上の識別子、サロゲートキーは人工的な識別子。人工キーを使っても業務上の重複禁止条件は別に必要。ビューは問合せ結果を仮想表として提供する。集約などを含むビューは一般に直接更新できない場合がある。非正規化は結合を減らす等の目的で重複を意図的に持つが、更新の整合性管理が必要になる。"},{"heading":"物理設計と移行","body":"保存領域は行数×平均行サイズを基本に、索引、管理情報、ログ、空き領域、将来の増加を考慮する。パーティションは日付などで表を分割し、範囲検索や保守を効率化する場合がある。インバーテッドファイル（転置ファイル）は値や語から該当するレコードを引ける構造。DB作成は環境準備、スキーマ定義、データ変換・登録、件数・制約・業務結果の検証、性能評価、運用へ進む。"}],"beginner":{"scenario":"業務の意味をモデル化するから順に、論理設計で矛盾を防ぐ、物理設計と移行を理解する。","trap":"参照整合性を保証する外部キー制約を用いる。","quizId":"U-09-Y02"}},{"id":"09-2","title":"SQL・結合・集計・NULL","explain":"<p>SQL（Structured Query Language：構造化問合せ言語）はSELECTで行を取り出し、FROMで表、WHEREで行の絞り込み、GROUP BYでグループ化、HAVINGで集計後の条件、ORDER BYで並び替えを指定する。処理の概念的な順序はFROM/結合→WHERE→GROUP BY→HAVING→SELECT→ORDER BY。列別名をWHEREでそのまま使えるとは限らない。</p>\n<p>INNER JOINは一致行のみ、LEFT OUTER JOINは左表の行をすべて残す。<code>WHERE 右表.列 = 'X'</code> を外部結合の後に置くと、右表が存在しないNULL行を取り除き、実質的に内部結合のような結果になることがある。COUNT(*)は行数、COUNT(列)はNULLでない値の数。<code>列 = NULL</code>ではなく<code>IS NULL</code>で判定する。</p>\n","worked":"<p>受注がない顧客も含め顧客ごとの件数を数えるには <code>SELECT c.id, COUNT(o.id) FROM customer c LEFT JOIN orders o ON c.id=o.customer_id GROUP BY c.id;</code>。<code>COUNT(*)</code>だと受注ゼロの顧客も外部結合後に1行残るため1と数え得る。<code>COUNT(o.id)</code>が重要。</p>\n","prompt":"`WHERE COUNT(*) >= 2` と `HAVING COUNT(*) >= 2` のどちらが集計グループを絞るか。","answer":"<p>HAVING。WHEREはグループ化前の行を選別する。</p>\n","beginner":{"scenario":"売上表から部門AだけならWHERE 部門='A'。部門別合計はGROUP BY 部門とSUM(金額)、合計100以上はHAVING SUM(金額)>=100。","trap":"NULLは0や空文字と異なる。IS NULLで判定する。","quizId":"U-09-2","lab":{"title":"SQLの結合・集計を結果から理解する","problem":"顧客表 C(id, name) は(1,佐藤),(2,田中),(3,鈴木)。注文表 O(cid, amount) は(1,100),(1,200),(2,50)。顧客別売上を注文ゼロも含めて出す。","steps":["C LEFT JOIN O ON C.id = O.cid により佐藤2行、田中1行、鈴木1行（注文列NULL）ができる。","GROUP BY C.id,C.name で顧客別グループを作る。","SUM(O.amount)は佐藤300、田中50、鈴木NULL。","COALESCE(SUM(O.amount),0)で鈴木を0にする。","SQL例：SELECT C.id,C.name,COALESCE(SUM(O.amount),0) FROM C LEFT JOIN O ON C.id=O.cid GROUP BY C.id,C.name。"],"answer":"佐藤300、田中50、鈴木0","check":"INNER JOINなら鈴木は消える。NULLと0は区別し、必要時に変換する。"}},"textbook":[{"heading":"SQLの役割","body":"SQL（Structured Query Language: 構造化問い合わせ言語）はデータベースに欲しい結果を伝える宣言的な言語です。どの順にディスクを読むかはDBMS（データベース管理システム）が判断します。SELECTは検索、INSERTは追加、UPDATEは更新、DELETEは削除、CREATE TABLEは表の定義です。まず検索の処理順を理解します。"},{"heading":"結合と抽出","body":"FROMで元の表を選び、JOINで行の組を作ります。ONで結合条件を指定し、INNER JOINなら一致した行だけ、LEFT JOINなら左側の行を全て残します。その後WHEREで条件に合う行だけを残します。1対多の結合では1行が複数行に増えるので、元の表の件数を数えるつもりでも注意が必要です。"},{"heading":"集計の順序","body":"GROUP BYは同じキーを持つ行を集め、一つのグループにします。SUM、COUNT、AVGなどでグループを集計します。HAVINGは集計結果を条件にしてグループを絞り込みます。例えば売上合計が100以上の顧客を選ぶ条件はHAVING SUM(amount)>=100です。WHEREで指定するのは集計前の各行の条件です。"},{"heading":"NULLの扱い","body":"NULLは値が不明または存在しないことを示し、0や空文字ではありません。NULLとの通常の比較は真偽のどちらでもないUNKNOWNとなります。WHEREが残すのは真の行なのでIS NULLで判定します。COUNT(*)は行数、COUNT(列)はその列がNULLでない行数を数えます。LEFT JOINで注文がない顧客の注文数を数えるなら注文IDのCOUNTが適しています。"},{"heading":"SQLの論理的な実行順","body":"FROM・JOIN・ON → WHERE → GROUP BY → HAVING → SELECT → ORDER BYという順に中間結果を追うと、難しい検索も読み解けます。これは論理的な意味を理解する順であり、実際の処理順はDBMSが最適化することがあります。SELECTで別名を付けてもWHEREで使えるとは限らない点もこの順序から理解できます。"}],"walkthrough":{"heading":"結合後の表を一行ずつ見る","body":"顧客表には1:佐藤、2:田中、3:鈴木の3人があり、注文表には顧客1の100円、200円、顧客2の50円があります。LEFT JOINの結合後には下の4行が作られます。GROUP BY 顧客IDで顧客1の2行を同じグループとしSUMで300円にします。顧客3の注文列はNULLで、COUNT(*)なら1行と数えますがCOUNT(金額)なら0件です。顧客3も売上0と表示したいときはCOALESCE(SUM(金額),0)を用います。またLEFT JOIN後のWHERE 注文.金額>0はNULL行を除くため、未注文顧客を残す目的と矛盾し得ます。条件を結合のON句へ置く場合との違いも、結合結果を紙に書いて確かめます。","cols":["顧客ID","氏名","注文金額"],"rows":[["1","佐藤","100"],["1","佐藤","200"],["2","田中","50"],["3","鈴木","NULL"]]},"pedagogyReviewed":true},{"id":"09-Y03","title":"SQLの条件・副問合せ・集合演算","explain":"<p>BETWEEN 10 AND 20は通常両端を含む。IN (10,20)は列挙した値のいずれかと一致、LIKE 'A%'はAで始まる文字列（%は任意長、_は1文字）。SQLではNULLとの比較がUNKNOWNになる場合があるのでIS NULLで調べる。NOT INの副問合せにNULLがあると想定外の結果になり得るためNOT EXISTSなどを検討する。相関名は表の別名で、同じ表を複数回使う自己結合にも必要となる。</p>","worked":"<p><b>社員給与が300、400、500万円の場合、平均より高い社員の給与は？</b></p><p>平均400万円を副問合せで求め、厳密に超える500万円のみ抽出する。</p>","prompt":"必修がAとBのとき、Aのみ履修した学生は商の結果に含まれるか。","answer":"<p>含まれない。全ての必修科目との対応が必要。</p>","textbook":[{"heading":"条件で行を絞る","body":"BETWEEN 10 AND 20は通常両端を含む。IN (10,20)は列挙した値のいずれかと一致、LIKE 'A%'はAで始まる文字列（%は任意長、_は1文字）。SQLではNULLとの比較がUNKNOWNになる場合があるのでIS NULLで調べる。NOT INの副問合せにNULLがあると想定外の結果になり得るためNOT EXISTSなどを検討する。相関名は表の別名で、同じ表を複数回使う自己結合にも必要となる。"},{"heading":"副問合せの意味","body":"SELECT name FROM Employee WHERE salary > (SELECT AVG(salary) FROM Employee) は全社員の平均給与を計算し、その値を超える社員を抽出する。相関副問合せは内側が外側の行の値を参照する。例えば各部署の平均給与と各社員の給与を比較する。EXISTSは副問合せに条件を満たす行があるかを判定する。実際の実行順はDBMSの最適化により異なる。"},{"heading":"関係代数の商と集合演算","body":"全ての必修科目を履修した学生を求めるとき、学生・科目の組の表を必修科目表で割る関係演算の商が考えられる。必修科目がA,Bで、学生1がA,B、学生2がAなら学生1のみ該当。SQLでは「履修していない必修科目が存在しない」という二重NOT EXISTSなどで表現できる。UNIONは和、INTERSECTは積、EXCEPTは差に対応し、通常重複を除く。"}],"beginner":{"scenario":"条件で行を絞るから順に、副問合せの意味、関係代数の商と集合演算を理解する。","trap":"商は指定された集合の全要素と関連する対象を求める。","quizId":"U-09-Y03"}},{"id":"09-Y04","title":"SQLの定義・更新・ウィンドウ関数","explain":"<p>DDL（データ定義言語）はCREATE TABLEやALTER TABLE等で構造を定義する。DML（データ操作言語）はSELECT、INSERT、UPDATE、DELETE等でデータを操作する。権限付与のGRANTと取消しのREVOKEはDCL（データ制御言語）と呼ぶ分類もある。例えばCREATE TABLE Product(id INT PRIMARY KEY, price INT CHECK(price&gt;=0))なら負価格を拒否する。UPDATE Product SET price=120 WHERE id=1は対象IDだけ変更する。WHEREを省くと全行が対象になる。</p>","worked":"<p><b>部署Aの給与100,200、部署Bの給与300。AVG(salary) OVER(PARTITION BY dept)の結果は？</b></p><p>元の3行を残しAの2行に150、Bの1行に300を追加する。</p>","prompt":"各部署の平均を求めつつ社員1人ずつの行も残したい。","answer":"<p>ウィンドウ関数AVGのPARTITION BYを利用する。</p>","textbook":[{"heading":"データを定義して操作する","body":"DDL（データ定義言語）はCREATE TABLEやALTER TABLE等で構造を定義する。DML（データ操作言語）はSELECT、INSERT、UPDATE、DELETE等でデータを操作する。権限付与のGRANTと取消しのREVOKEはDCL（データ制御言語）と呼ぶ分類もある。例えばCREATE TABLE Product(id INT PRIMARY KEY, price INT CHECK(price>=0))なら負価格を拒否する。UPDATE Product SET price=120 WHERE id=1は対象IDだけ変更する。WHEREを省くと全行が対象になる。"},{"heading":"ビュー・トリガ・カーソル","body":"CREATE VIEWで特定列や条件の結果をビューとして定義する。CASCADEは親の削除等に連動し子を削除・更新する参照動作で、意図しない連鎖に注意。TRIGGER（トリガ）は指定イベント時に自動実行する処理。埋込みSQLは親言語からSQLを利用する方法。カーソルは問合せ結果の行を順に扱う仕組みで、宣言、OPEN、FETCH、CLOSE等の操作がある。集合単位の処理が適する場合は行ごとの処理より効率的になり得る。"},{"heading":"グループ化とウィンドウの違い","body":"GROUP BYで部署別平均を出すと部署ごとに1行になる。AVG(salary) OVER(PARTITION BY dept) は各社員の行を残しながら部署平均を追加する。ROW_NUMBER() OVER(PARTITION BY dept ORDER BY salary DESC) は部署ごとに給与順の番号を付ける。同順位の扱いはRANK等の関数で異なり、同じ給与の場合の順番を確定するなら追加の並べ替え条件を指定する。"}],"beginner":{"scenario":"データを定義して操作するから順に、ビュー・トリガ・カーソル、グループ化とウィンドウの違いを理解する。","trap":"ウィンドウ関数は関連する行の集合で計算し各行へ結果を付けられる。","quizId":"U-09-Y04"}},{"id":"09-4","title":"索引・実行計画・性能設計","explain":"<p>索引（インデックス）は検索条件に合う行へ効率よく到達する補助構造。B+木は範囲検索・整列に適し、ハッシュは等価検索に適することが多い。索引は読み取りを速くする一方、挿入・更新・削除時に維持コストと容量を要する。条件列の選択性、複合索引の列順、結合キー、統計情報を調べる。</p>\n<p><code>WHERE YEAR(order_date)=2025</code>のように索引列へ関数を適用すると通常の範囲索引が使いにくくなることがある。<code>order_date &gt;= '2025-01-01' AND order_date &lt; '2026-01-01'</code>の範囲条件に変えると使える可能性がある。ただし性能は製品や索引構造・統計情報に依存するので、EXPLAINで実行計画と実測を確認する。</p>\n","worked":"<p>100万行中、customer_id=123が10行だけなら当該列の索引は有利なことが多い。性別のように値の種類が少なく大半が該当する列では、索引より全表走査が有利になる場合もある。</p>\n","prompt":"すべての列に索引を付けるのが最善か。","answer":"<p>違う。更新負荷、容量、選択性、検索パターンを総合して決める。</p>\n","beginner":{"scenario":"100万件の商品からID=123を探すとき索引で絞れる。一方、半数以上を取得する場合は全表走査の方が速いこともある。","trap":"索引は検索を助けるが更新時にも維持コストがかかる。","quizId":"U-09-4"},"textbook":[{"heading":"索引が検索を速める理由","body":"本の索引は全ページを読む代わりに語句から位置を探せます。データベースの索引も検索キーと行への参照を管理します。B木系索引はキー順の木構造で検索範囲を絞り、等値検索や範囲検索に使えます。ハッシュ索引はハッシュ値で格納候補を探し、主に等値検索に向きます。"},{"heading":"複合索引と実行計画","body":"(顧客ID,注文日)の順で索引を作ると、特定顧客の注文日範囲を検索しやすくなります。顧客IDを指定せず注文日だけを検索すると一般にこの索引の先頭列を活用しにくい場合があります。DBMSは統計情報を利用し全表走査、索引走査、結合方式などを選びます。EXPLAIN等で実行計画を確認できます。"},{"heading":"コストの比較","body":"取得件数が非常に多い場合、索引で多数の場所へアクセスするより全表走査が効率的なことがあります。索引は記憶容量を消費し、挿入・更新・削除の際に維持処理が必要です。検索速度だけでなく実際の負荷を測定して選択します。"}]},{"id":"09-Z02","title":"索引の使い分けとビュー","explain":"<p>ハッシュ索引はキーをハッシュ値に変換して候補を探す。完全一致検索に適するが、一般的にキーの順序を保持しない。B+木索引はキーを順序付きの木に格納し、葉の連結などで範囲検索や前方一致、順序付き取得を支援する。実際の性能は分布やDB実装に依存する。</p>","worked":"<p>完全一致の顧客番号にはハッシュ、日付範囲にはB+木が候補。</p>","prompt":"日付の範囲検索に一般的に適する索引は？","answer":"<p>B+木はキーの順序を利用できる。</p>","beginner":{"scenario":"顧客番号での完全一致と、日付範囲での検索を高速化したい。","trap":"ビューは常に更新可能ではない。ハッシュ索引は範囲検索に適さない。","quizId":"U-09-Z02"},"textbook":[{"heading":"基本原理","body":"ハッシュ索引はキーをハッシュ値に変換して候補を探す。完全一致検索に適するが、一般的にキーの順序を保持しない。B+木索引はキーを順序付きの木に格納し、葉の連結などで範囲検索や前方一致、順序付き取得を支援する。実際の性能は分布やDB実装に依存する。"},{"heading":"仕組み・判断","body":"ビューはSELECTなどの問い合わせを名前付きで定義した仮想表。列名を別名にでき、WHEREで行を限定できる。結合や集合演算も使えるが、複雑なビューの更新可否は条件・製品に依存する。実体化ビューは結果を保存する別の方式。"},{"heading":"応用と注意点","body":"例：CREATE VIEW active AS SELECT customer_id AS id, name FROM customers WHERE enabled=1; という定義では行を限定し列名を変更する。アクセス権と組み合わせて利用者に不要な列を見せないようにする。基表の権限も確認する。"}]},{"id":"09-C01","title":"全文検索・転置インデックス","explain":"<p>大量の文書からキーワードを含む資料を探す。</p><p>シラバスVer.7.2 本文41–42頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>犬→A、猫→A,Bなら犬 AND 猫はA。</p>","prompt":"犬→文書A,C、猫→文書B,Cという転置索引がある。犬AND猫と犬OR猫の結果と、順位付けとの違いを答えよ。","answer":"<p>ANDは積集合でC、ORは和集合でA,B,C。候補集合から順位が一意に決まるわけではなく、語の頻度や文書長等による順位付けは別の処理。</p>","beginner":{"scenario":"大量の文書からキーワードを含む資料を探す。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-09-C01"},"textbook":[{"heading":"全文検索が必要な理由","body":"通常のデータベースでは主キーや列の値を条件に行を取得します。一方、文章中の語を含む文書を探すには、文書全体を調べる必要があります。毎回全ての文章を読むのは非効率なので、あらかじめ語がどの文書に現れるかを整理した転置インデックスを作ります。"},{"heading":"転置インデックスの構造","body":"文書Aに犬と猫、文書Bに猫と鳥が現れるとします。文書から語を列挙する関係を逆にして、犬→A、猫→A・B、鳥→Bという索引を作ります。各語に対応する文書IDの一覧をポスティングリストと呼びます。語の出現位置や頻度も持てば、語順を含む検索や順位付けに利用できます。"},{"heading":"索引を作成して問い合わせる","body":"文書を単語などの単位に分割し、必要に応じて大文字小文字の統一や表記の正規化を行い、索引を作ります。問い合わせも同様に処理します。犬AND猫なら犬の一覧と猫の一覧の積集合でA、犬OR鳥なら和集合でAとBです。日本語では単語の境界が明示されないため形態素解析や文字n-gramなどが用いられます。"},{"heading":"検索対象を選ぶ処理と順位付けを区別する","body":"索引で候補文書を取り出した後、語の頻度、珍しさ、文書長などを考慮して関連度を計算できます。意味ベクトルの類似性を用いる検索もありますが、語から文書への転置索引と同じ仕組みではありません。候補抽出と順位付けを分けると検索システムの設計を理解しやすくなります。"},{"heading":"更新との関係","body":"文書が追加・削除・変更されたとき、索引にも反映する必要があります。索引を構築して保持するには時間と容量がかかります。検索頻度、更新頻度、応答時間、索引更新の遅延を考慮して設計します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"09-3","title":"トランザクション・ACID・隔離レベル","explain":"<p>トランザクションは複数操作を1つの論理的単位として扱う。ACIDはAtomicity（原子性：全部実施か全部取消し）、Consistency（一貫性：制約維持）、Isolation（隔離性：同時実行の影響を管理）、Durability（永続性：確定内容が保持される）。銀行口座からAを減額してBを増額する2操作は、片方だけ確定してはならない。</p>\n<p>並行実行にはダーティリード（未確定変更を読む）、反復不能読取り（同じ行を再読したら変わる）、ファントムリード（条件に合う行集合が変化）などの異常がある。隔離レベルやMVCC（Multi-Version Concurrency Control：多版型同時実行制御）は製品ごとに具体的動作が異なる。ロックの取り方、デッドロック検出、タイムアウト、再試行も設計対象。</p>\n","worked":"<p>T1が商品の在庫10を8に更新したが未コミット。T2が8を読み、T1がロールバックすると、T2は確定していない値を読んだ「ダーティリード」。Read Committedの標準的な目標はこれを防ぐこと。</p>\n","prompt":"ACIDのIsolationを満たせば同時実行で常に最高速になるか。","answer":"<p>そうではない。強い隔離は競合や待ち時間を増やすことがある。</p>\n","beginner":{"scenario":"Aから100円引きBに入金する途中で止まると資金が消える。両方成功でコミット、失敗はロールバックする。","trap":"原子性だけでは競合を防げない。分離性・ロックなども必要。","quizId":"U-09-3","lab":{"title":"同時更新で何が壊れるか","problem":"在庫1個の商品をAとBが同時購入。両者が在庫1を読み、在庫0を書き、注文を登録する。問題と対策を考える。","steps":["AとBが別々に在庫1を読んでいるため両者とも購入可能と判断。","Aが在庫0を書き注文確定。Bも古い値を根拠に在庫0を書き注文確定。注文は2件だが商品は1個。","在庫をロックして在庫数を確認し、条件を満たす場合のみ減算・注文登録を同一取引にする。","あるいは在庫が1以上という条件付きの原子的更新を使い、成功件数を確認する。"],"answer":"在庫確認・引当て・注文を競合に耐える一連の処理にする","check":"COMMITするだけでは安全にならない。分離性と更新の条件が必要。"}},"textbook":[{"heading":"一連の更新を一つの仕事にする","body":"トランザクション（取引処理）は、途中の状態をそのまま確定してはならない一連の操作をまとめた単位です。送金でA口座を減らした後、B口座を増やす前に停止するとお金が消えます。両方が成功すればCOMMITで確定し、失敗すればROLLBACKで取り消すという境界を設けます。"},{"heading":"ACIDの四つの条件","body":"ACIDは原子性（Atomicity）、整合性（Consistency）、分離性（Isolation）、耐久性（Durability）の頭文字です。原子性は一連の操作の全成功か全取消し、整合性は定められた制約を保つこと、分離性は並行処理の干渉を制御すること、耐久性は確定した結果を障害後も保持することです。DBMSとアプリが役割を分担し、誤った業務ルールまで自動で修正されるわけではありません。"},{"heading":"並行実行で何が壊れるか","body":"処理Aが残高100を読んだ後に処理Bも100を読み、両者が別々に10を引いて90を書けば、一方の更新が失われます。未確定の値を読むダーティリード、同一行の再読で値が変わるノンリピータブルリード、同じ条件で再検索すると行集合が変わるファントムリードなどもあります。これらを防ぐ程度を隔離レベルで指定します。"},{"heading":"ロックと多版型制御","body":"ロックは資源への同時アクセスを制限します。共有ロック同士は通常両立しますが、排他ロックは競合する操作を待たせます。二者が互いのロック解放を待てばデッドロックです。MVCC（Multi-Version Concurrency Control: 多版型同時実行制御）は複数の版を持つことで読取りと書込みの競合を減らします。全ての競合がなくなるわけではありません。"},{"heading":"ログで障害から戻る","body":"WAL（Write-Ahead Logging: 書込み前ログ）は、データページに変更を反映する前に必要なログを永続化する原則です。障害後に未確定の更新を取り消すUNDO、確定した変更を再適用するREDOなどを使う方式があります。ロックと隔離は同時実行の正しさ、ログは障害後の正しさに主に関係します。バックアップは媒体障害への備えにも必要です。"}],"walkthrough":{"heading":"隔離レベルを現象と結び付ける","body":"取引Aが商品の価格を100から120へ変更してまだ確定していないとき、Bが120を読むとダーティリードです。その後Aが取消せばBは実在しなかった確定値に基づいて処理したことになります。一方、Bが100を読み、Aが120に変更してコミットした後にBが同じ行を読み120になるのがノンリピータブルリードです。Bが条件検索で10行取得し、Aが条件に合う行を挿入して確定、Bの再検索で11行になるのがファントムリードです。SQL標準の概念的な隔離レベルは下表の通りですが、実際のデータベースではより強い保証や異なる実装があり得ます。","cols":["隔離レベル","ダーティリード","再読時の値変化","ファントム"],"rows":[["READ UNCOMMITTED","許容","許容","許容"],["READ COMMITTED","防止","許容","許容"],["REPEATABLE READ","防止","防止","許容"],["SERIALIZABLE","防止","防止","防止"]]},"pedagogyReviewed":true},{"id":"09-Y05","title":"ロックと分散取引の整合性","explain":"<p>共有ロックは一般に複数の読取りを許し、専有ロックは他の読取り・書込みを制限する。ロック粒度が表単位なら管理は簡単だが競合が増え、行単位なら並行性が高まるが管理負荷が増える。2相ロッキングではロック取得段階と解放段階を分け、解放後は新たなロックを取得しない。直列化可能性を確保する基本方式だがデッドロックは起こり得る。MVCC（多版型同時実行制御）は複数版を保持して読取りと更新の競合を減らす。</p>","worked":"<p><b>取引Aが商品1を、Bが商品2をロックし互いに相手のロックを待つ。</b></p><p>デッドロック。統一したロック取得順等で循環待ちを防ぎ、発生時は一方を中止・再試行する。</p>","prompt":"2相ロッキングと2相コミットの目的の違いは？","answer":"<p>前者は同時実行制御、後者は分散取引の確定を調整する。</p>","textbook":[{"heading":"同時実行で矛盾を防ぐ","body":"共有ロックは一般に複数の読取りを許し、専有ロックは他の読取り・書込みを制限する。ロック粒度が表単位なら管理は簡単だが競合が増え、行単位なら並行性が高まるが管理負荷が増える。2相ロッキングではロック取得段階と解放段階を分け、解放後は新たなロックを取得しない。直列化可能性を確保する基本方式だがデッドロックは起こり得る。MVCC（多版型同時実行制御）は複数版を保持して読取りと更新の競合を減らす。"},{"heading":"待ち方と異常な更新","body":"Wait-Die方式は古い取引が若い取引を待つことを許し、若い取引は古い取引のロックを待たず中止する。Wound-Wait方式は古い取引が若い取引を中止させ、若い取引は古い取引を待つ。いずれも時刻順を使い循環待ちを防ぐ。書込みスキューは別々の行を更新しても全体の制約を破ることがある現象。例えば当番が最低1人必要なとき、互いに相手が当番だと確認して両者が自分を外すと0人になる。"},{"heading":"複数サービスの取引","body":"2相コミットは全参加者に準備可否を確認し、全員が準備できれば確定を指示する。調整役の障害等で待つ可能性がある。Sagaパターンは複数の局所取引を順に確定し、途中失敗時に補償取引で業務上の取消しを行う。TCC（試行・確認・取消し）は先に予約し、成功時確定、失敗時取消す。補償は元の状態を完全に戻せるとは限らないため業務ルールが重要。"}],"beginner":{"scenario":"同時実行で矛盾を防ぐから順に、待ち方と異常な更新、複数サービスの取引を理解する。","trap":"取得段階と解放段階を分ける。","quizId":"U-09-Y05"}},{"id":"09-Y06","title":"ログによる復旧・索引・アクセス権","explain":"<p>チェックポイントはデータベース状態やログの処理位置を記録し回復時の探索範囲を減らす。例えば保存済み残高100、確定済み更新＋20、未確定更新−30の後に障害が起きた場合、必要なREDO（再実行）で＋20を反映し、必要なUNDO（取消し）で未確定−30を除く。最終的に120となる。実際の復旧手順は書込み方式で異なる。シャドウページ法は元のページを保持し、新しいページを作って確定時に参照先を切り替える。ウォームスタートは既存状態等を利用する再起動、コールドスタートは初期化を伴う起動の意味で使われる。</p>","worked":"<p><b>商品名と価格だけを取得する検索で、索引に両列が含まれる。</b></p><p>DBMSが索引だけで問合せを完了できれば、表本体のアクセスを減らせる。</p>","prompt":"未確定取引の変更を障害回復で取り消す操作は？","answer":"<p>UNDO（取消し）。</p>","textbook":[{"heading":"障害発生時の復旧を追う","body":"チェックポイントはデータベース状態やログの処理位置を記録し回復時の探索範囲を減らす。例えば保存済み残高100、確定済み更新＋20、未確定更新−30の後に障害が起きた場合、必要なREDO（再実行）で＋20を反映し、必要なUNDO（取消し）で未確定−30を除く。最終的に120となる。実際の復旧手順は書込み方式で異なる。シャドウページ法は元のページを保持し、新しいページを作って確定時に参照先を切り替える。ウォームスタートは既存状態等を利用する再起動、コールドスタートは初期化を伴う起動の意味で使われる。"},{"heading":"索引の種類を選ぶ","body":"ユニーク索引は重複を制限、クラスタ化索引はデータの配置とキー順を関連付ける。B-tree系は範囲・等値検索に、ハッシュ索引は等値検索に適する。ビットマップ索引は値ごとにビット集合で行の該当を表し論理演算で絞れる。カバリング索引は問合せに必要な列を含み表本体の読取りを減らせる場合がある。転置索引は語から文書を探す全文検索等で使う。索引が多いと更新負荷が増える。"},{"heading":"権限を最小限にする","body":"データ参照・挿入・更新・削除の権限を分ける。閲覧専用の担当にはSELECTのみ付与し、必要に応じビューで列や行を制限する。GRANTで付与、REVOKEで取消す。権限、暗号化、監査ログ、バックアップは異なる目的を持つ。DB内を暗号化しても正規権限で誤操作する危険は残る。"}],"beginner":{"scenario":"障害発生時の復旧を追うから順に、索引の種類を選ぶ、権限を最小限にするを理解する。","trap":"必要列を索引から取得できる場合に利用する。","quizId":"U-09-Y06"}},{"id":"09-Z03","title":"MVCC・ロック・ログの役割","explain":"<p>MVCC（Multi-Version Concurrency Control：多版同時実行制御）は同じデータの複数バージョンを保持し、トランザクションの可視性規則に従う版を読ませる。読み取りと書込みの競合を減らせる。隔離レベルによりスナップショットが変わる。</p>","worked":"<p>更新前の版と更新後の版を保持し、読取り側に可視な版を選ぶのがMVCC。</p>","prompt":"複数版を使って読み書きの同時実行性を高める方式は？","answer":"<p>MVCCは版の可視性を制御する。</p>","beginner":{"scenario":"商品情報を更新中でも、他の利用者が確定済みの値を読みたい。","trap":"WALは複数版を使った読取り制御そのものではない。","quizId":"U-09-Z03"},"textbook":[{"heading":"基本原理","body":"MVCC（Multi-Version Concurrency Control：多版同時実行制御）は同じデータの複数バージョンを保持し、トランザクションの可視性規則に従う版を読ませる。読み取りと書込みの競合を減らせる。隔離レベルによりスナップショットが変わる。"},{"heading":"仕組み・判断","body":"二相ロッキングはロックを取得する段階と解放する段階を分ける。共有ロックは読み取りの共有を認める方式、排他ロックは更新などで他の競合アクセスを制限する。WAL（Write-Ahead Logging：先行書込みログ）はデータ本体より先にログを永続化し障害回復を支援する。"},{"heading":"応用と注意点","body":"Aが価格100から120へ更新中、Bが以前の確定版100を読むことが可能な場合がある。MVCCでも書込み競合やロック待ち、古い版の掃除、直列化異常への対策は必要。すべての処理が無条件に並行できるわけではない。"}]},{"id":"09-5","title":"障害回復・レプリケーション・NoSQL","explain":"<p>障害復旧ではチェックポイント、更新ログ、UNDO（未確定変更の取消し）、REDO（確定変更の再適用）の役割を区別する。ログ先行書込み（WAL：Write-Ahead Logging）はデータページの更新より先に回復に必要なログを永続化する設計原則。物理バックアップと論理バックアップ、フル/差分/増分の特徴を理解し、復元手順を試す。</p>\n<p>レプリケーションは複数拠点への複製によって可用性や読み取り性能を高めるが、非同期方式では最新更新を失うリスクがある。NoSQL（Not Only SQL：非関係型を中心とするDB群）はキー値・文書・列指向・グラフ等のモデルがあり、要件に合うデータ構造を選ぶ。CAP定理はネットワーク分断時の一貫性と可用性の選択に関する制約であり、「3要素から常に2つだけ選ぶ」と単純化しない。</p>\n","worked":"<p>コミット直後に主DBが故障し、非同期の複製先へまだ更新が伝搬していなければ、切替時に直近の更新が消える可能性がある。RPO=0を求めるなら書込み確定の条件まで設計し直す必要がある。</p>\n","prompt":"複製があるからバックアップは不要か。","answer":"<p>不要にはならない。誤更新・論理削除も複製され得る。</p>\n","beginner":{"scenario":"昨日のバックアップを戻し、今日の確定済み更新ログを適用すれば障害直前へ近づける。未確定の変更は取り消す。","trap":"複製は誤削除も複製し得るのでバックアップと別。","quizId":"U-09-5"},"textbook":[{"heading":"障害の種類を分ける","body":"処理の途中失敗、OSやDBの停止、記憶装置故障、拠点災害は回復方法が異なります。トランザクションの取消し、ログによる回復、バックアップ復元、待機系への切替を組み合わせます。ロールバックは変更の取消し、ロールフォワードはバックアップ等にログを適用して新しい時点へ進めることです。"},{"heading":"レプリケーションの特徴","body":"データを別ノードへ複製すると読取負荷の分散や障害時の切替に利用できます。同期複製は相手への反映を確認して処理を確定する方式で、非同期複製では遅延中の更新が障害で失われる可能性があります。複製は誤操作も伝えることがあるので過去時点のバックアップと別です。"},{"heading":"NoSQLの選択","body":"NoSQLは関係表以外のデータモデルなどを扱うデータベース群です。キーと値、JSON等の文書、グラフ、列指向などの方式があり、データの形状・検索・整合性・規模に合わせます。SQLを使えないことやトランザクションがないことを一律に意味しません。"}]},{"id":"09-X02","title":"データウェアハウス・分散データベース","explain":"<p>データウェアハウスは分析目的で履歴を統合する基盤。ETL（抽出・変換・ロード）で異なる元データを整える。OLTP（オンライン取引処理）は日常業務の更新、OLAP（オンライン分析処理）は多次元集計。データマートは特定部門向けの分析データ。スタースキーマは事実表と次元表を組み合わせる。</p><p>分散データベースは複数ノードにデータを分散し、シャーディングで異なる部分を分割、レプリケーションで複製する。2相コミットは参加者の準備確認後に確定を指示して分散取引の整合性を保つ。可用性・整合性・分断耐性の関係を示すCAP定理ではネットワーク分断中に強い整合性と可用性を同時保証できない。</p>","worked":"<p>日々の売上登録はOLTP、月・地域・商品別に過去の売上を集計するのはOLAP。</p>","prompt":"複数サーバに顧客IDの範囲ごとにデータを分割する方式は？","answer":"<p>シャーディング。</p>","beginner":{"scenario":"販売明細を店舗から集め、商品コードと日付形式を統一して分析基盤へ入れる。地域×月×商品別に売上集計できる。","trap":"OLTPは取引、OLAPは分析。複製と分割も別。","quizId":"U-09-X02"},"textbook":[{"heading":"日常業務と分析を分ける","body":"注文受付のように少数行を頻繁に更新する処理がOLTP（オンライン取引処理）です。月別・地域別・商品別売上を大量に集計するOLAP（オンライン分析処理）は目的が異なります。業務DBから履歴を統合したデータウェアハウスを作ることで分析負荷を分離できます。ETL（抽出・変換・格納）はデータを収集してコードや日付形式を統一し保存します。"},{"heading":"分析用の表設計","body":"スタースキーマでは売上金額・数量など測定値を持つ事実表と、商品・地域・日付など分析軸を持つ次元表を組み合わせます。データマートは特定部門などに用途を絞った分析データです。"},{"heading":"分散データの整合性","body":"シャーディングは顧客ID等でデータを複数ノードへ分割し、レプリケーションは複製します。分散取引の2相コミットは各参加者に確定可能か確認し、全員が準備できれば確定を指示します。調整役の故障等で待ちが生じることがあります。CAP定理はネットワーク分断中に強い整合性と可用性を同時に保証できないことを示します。用途によって一時的不整合の許容などを設計します。"}]},{"id":"09-Z01","title":"分散DB：BASE・結果整合性・CAP","explain":"<p>BASE（Basically Available, Soft state, Eventually consistent：基本的な可用性・柔軟な状態・結果整合性）は分散データベースで可用性を優先する設計の考え方。更新後、他のノードへ反映されるまで一時的に違う値を返し得る。新しい更新がなく障害が解消し伝播できれば最終的に収束する。</p>","worked":"<p>Aノードで商品説明を更新しBへの反映に数秒かかるが、更新が止まれば収束する。</p>","prompt":"結果整合性を採用する場合に許容される状態は？","answer":"<p>複製間の一時的な差異を許容し、条件が満たされれば収束する。</p>","beginner":{"scenario":"複数地域のサーバで同じ商品情報を提供する。","trap":"結果整合性は全ノードが常に同じ値を返すという意味ではない。","quizId":"U-09-Z01"},"textbook":[{"heading":"基本原理","body":"BASE（Basically Available, Soft state, Eventually consistent：基本的な可用性・柔軟な状態・結果整合性）は分散データベースで可用性を優先する設計の考え方。更新後、他のノードへ反映されるまで一時的に違う値を返し得る。新しい更新がなく障害が解消し伝播できれば最終的に収束する。"},{"heading":"仕組み・判断","body":"ACID（原子性・一貫性・隔離性・永続性）はトランザクションの性質。BASEと完全に排他的な製品分類ではなく、機能や設定によって整合性保証は変わる。CAPは通信分断時に強い一貫性と可用性の両方を完全には満たせないという制約。"},{"heading":"応用と注意点","body":"在庫の確定や送金には厳密な整合性が重要な場合がある。閲覧数など遅れを許容できる情報では結果整合性が候補。更新競合の解決や古い値の利用による業務影響も設計する。"}]},{"id":"09-Y07","title":"分散DB・データ基盤・メタデータ管理","explain":"<p>水平分散は行を顧客ID等で分け、垂直分散は列を分ける。透過性は利用者が配置を意識せずアクセスできる性質。分散問合せではネットワーク越しの転送量が性能に影響する。スプリットブレインは通信断などで両系が自分を主系と判断して更新する状態。クォーラム（必要数の合意）などで防止する。BASEは基本的可用性、柔軟な状態、結果整合性を重視する考え方。結果整合性では更新が止まれば複製間の値が最終的に一致することを目指す。ブロックチェーンのコンセンサスは参加者間の合意、ファイナリティは取引の確定性を指す。</p>","worked":"<p><b>顧客100万人をIDの範囲で複数ノードへ分ける。</b></p><p>水平分散・シャーディングの例。特定範囲にアクセスが偏らないか検討する。</p>","prompt":"データ辞書を設けると何を確認できるか。","answer":"<p>項目の意味・型・単位・格納場所等を共有し、異なる解釈や重複を減らす。</p>","textbook":[{"heading":"分散配置と整合性","body":"水平分散は行を顧客ID等で分け、垂直分散は列を分ける。透過性は利用者が配置を意識せずアクセスできる性質。分散問合せではネットワーク越しの転送量が性能に影響する。スプリットブレインは通信断などで両系が自分を主系と判断して更新する状態。クォーラム（必要数の合意）などで防止する。BASEは基本的可用性、柔軟な状態、結果整合性を重視する考え方。結果整合性では更新が止まれば複製間の値が最終的に一致することを目指す。ブロックチェーンのコンセンサスは参加者間の合意、ファイナリティは取引の確定性を指す。"},{"heading":"蓄積と分析の流れ","body":"ETL（抽出・変換・格納）は変換後に保存、ELT（抽出・格納・変換）は保存先で変換する。データクレンジングは表記の統一、欠損・重複等の処理。データレイクは構造化・半構造化・非構造化データ等を広く保存する。データマイニングはデータから規則やパターンを見つける。例えば購入品の組合せ分析で同時購入傾向を調べる。Hadoopは分散処理の基盤、Sparkは分散データ処理エンジン、HDFSは分散ファイルシステム、CephやGlusterFSは分散記憶の仕組み。HiveやPrestoは大規模データを問い合わせる技術の例。"},{"heading":"データそのものと管理情報","body":"データディクショナリは列名、型、意味、所在などのメタデータを管理する。リポジトリは設計・ソフトウェア成果物・関連情報等を一元管理する。IRDS（情報資源辞書システム）は情報資源の記述・管理に関する規格の考え方。ファクトDBは事実データ、リファレンスDBは文献等の参照情報を扱う。ストリーミングデータは継続して到着するデータで、処理時刻と発生時刻の差や遅延到着に注意する。"}],"beginner":{"scenario":"分散配置と整合性から順に、蓄積と分析の流れ、データそのものと管理情報を理解する。","trap":"ELTはExtract・Load・Transformの順で処理する。","quizId":"U-09-Y07"}}],"beginnerIntro":"表・行・列・キーの理解から、SQL、同時更新、障害復旧へ進む。","studyGroups":[{"title":"データモデルと設計","body":"現実の対象を表と制約に写し、関係と重複を整理する。","ids":["09-Y01","09-1","09-X01","09-Y02"]},{"title":"SQLによる操作","body":"行を選択・結合・集計する処理を実行順に理解する。","ids":["09-2","09-Y03","09-Y04"]},{"title":"性能と検索","body":"同じ問い合わせを効率よく処理するための索引や全文検索を学ぶ。","ids":["09-4","09-Z02","09-C01"]},{"title":"同時更新と障害回復","body":"正しさを保つ取引、並行制御、ログによる復旧を学ぶ。","ids":["09-3","09-Y05","09-Y06","09-Z03"]},{"title":"分散と分析基盤","body":"単一DBの限界から分散・分析向けの設計へ進む。","ids":["09-5","09-X02","09-Z01","09-Y07"]}]},{"id":10,"title":"ネットワーク","group":"テクノロジ","priority":"B選択候補","summary":"TCP/IP、IPアドレス、ルーティング、DNS、TLSと障害切り分け。","lessons":[{"title":"階層とプロトコル","body":"IP（Internet Protocol）はネットワーク層で宛先までパケットを運ぶ。TCP（Transmission Control Protocol）は順序制御・再送等で信頼性を実現し、UDP（User Datagram Protocol）は簡潔で即時性を優先する用途に使う。","check":"TCPはコネクション型、UDPはコネクションレス。"},{"title":"サブネット","body":"IPv4の/24は先頭24ビットがネットワーク部で末尾8ビットがホスト部。一般的な/24の利用可能ホスト数は2^8−2=254。CIDR（Classless Inter-Domain Routing）は可変長のプレフィックスを指定する。","check":"/31や/32は用途が特殊なので一般式を無条件に当てない。"},{"title":"名前解決","body":"DNS（Domain Name System：ドメイン名システム）はドメイン名とIPアドレス等を対応。AレコードはIPv4、AAAAはIPv6、MXはメール配送先、CNAMEは別名。","check":"DNSの情報はTTL（生存時間）によりキャッシュされる。"},{"title":"Webと暗号化","body":"HTTPはWeb通信、HTTPSはHTTPをTLS（Transport Layer Security：通信の暗号化・認証）で保護したもの。TLSの証明書検証で通信相手の正当性を確認する。","check":"HTTPSは相手のWebサイトの内容まで安全保証するものではない。"},{"title":"障害切り分け","body":"IP疎通→名前解決→TCP接続→アプリ応答の順に確認。pingはICMP、tracerouteは経路を調べる手段だがICMPを遮断している場合は不通断定できない。","check":"「pingが失敗した＝必ず通信不可」ではない。"}],"terms":[{"term":"TCP","definition":"順序制御・再送制御などで信頼性を確保する転送層プロトコル"},{"term":"UDP","definition":"低い制御負荷でデータグラムを送る転送層プロトコル"},{"term":"IPアドレス","definition":"ネットワーク上の通信先を論理的に識別する番号"},{"term":"サブネットマスク","definition":"IPアドレスのネットワーク部を示すビットマスク"},{"term":"CIDR","definition":"可変長プレフィックスでIPアドレス範囲を表現する方式"},{"term":"DNS","definition":"名前とIPアドレスなどを対応付ける分散システム"},{"term":"NAT","definition":"ネットワークアドレスを変換する仕組み"},{"term":"DHCP","definition":"端末にIP設定を自動配布するプロトコル"},{"term":"TLS","definition":"通信相手の認証・暗号化・完全性を提供する仕組み"},{"term":"HTTP","definition":"Webでリクエストとレスポンスを交換するアプリ層プロトコル"},{"term":"VPN","definition":"共有網上で安全な仮想通信路を作る技術"},{"term":"ルーティング","definition":"宛先ネットワークに応じてパケットの転送先を選ぶこと"}],"questions":[{"id":"Q10-01","chapter":10,"kind":"applied","q":"192.168.10.0/26の通常のホスト用アドレス数は。","options":["30","62","64","126"],"correct":1,"explain":"ホスト部は6ビットで2^6−2=62。"},{"id":"Q10-02","chapter":10,"kind":"applied","q":"名前からIPv6アドレスを得たい。DNSのレコード種別は。","options":["A","MX","AAAA","PTR"],"correct":2,"explain":"AAAAはIPv6を示す。"},{"id":"Q10-03","chapter":10,"kind":"applied","q":"TCPとUDPの違いとして正しいのは。","options":["UDPは必ず順序保証する","TCPは再送制御を持つ","TCPは接続確立しない","UDPはIPを使わない"],"correct":1,"explain":"TCPは再送・順序制御などを提供する。"},{"id":"D10-01","chapter":10,"kind":"applied","q":"192.168.1.96/27のサブネットにおける通常利用可能なIPv4ホスト範囲はどれか。","options":["192.168.1.96～127","192.168.1.97～126","192.168.1.97～128","192.168.1.64～95"],"correct":1,"explain":"/27は32アドレス。96はネットワーク、127はブロードキャスト、利用可能は97～126。"},{"id":"D10-02","chapter":10,"kind":"applied","q":"経路表に10.0.0.0/8と10.1.0.0/16があり、宛先10.1.2.3に送る際の経路選択はどれか。","options":["/8の方を優先","両方へ必ず複製","/16を優先","常にデフォルト経路"],"correct":2,"explain":"最長プレフィックス一致で、より具体的な/16の経路が選ばれる。"},{"id":"D10-03","chapter":10,"kind":"applied","q":"実効通信速度80Mbpsで100MBのファイルを送る理想的な転送時間はどれか。","options":["1秒","8秒","10秒","80秒"],"correct":2,"explain":"100MB×8=800Mbit、800/80=10秒。通信オーバーヘッドは無視。"},{"id":"Q-10-X01","chapter":10,"kind":"applied","q":"無線LANで主に使われる媒体アクセス制御は？","options":["CSMA/CD","CSMA/CA","SMTP","ARP"],"correct":1,"explain":"CSMA/CA。送信前に衝突を回避する。"},{"id":"Q-10-X02","chapter":10,"kind":"applied","q":"メール送信に使われる代表的なプロトコルは？","options":["IMAP","SNMP","SMTP","NTP"],"correct":2,"explain":"SMTP（簡易メール転送プロトコル）。"},{"id":"U-10-1","chapter":10,"kind":"applied","q":"宛先IPに基づきネットワーク間で転送する機器は？","options":["L2スイッチ","リピータ","USBハブ","ルータ"],"correct":3,"explain":"ルータは経路表により配送。L2スイッチは主にMACアドレスで転送。"},{"id":"U-10-2","chapter":10,"kind":"applied","q":"通常のIPv4 /28で利用可能なホストアドレス数は？","options":["14","16","28","30"],"correct":0,"explain":"2^(32−28)−2＝14。"},{"id":"U-10-3","chapter":10,"kind":"applied","q":"端末へIPアドレスやゲートウェイを自動配布するプロトコルは？","options":["DNS","DHCP","SMTP","HTTP"],"correct":1,"explain":"DHCPは設定配布、DNSは名前解決。"},{"id":"U-10-4","chapter":10,"kind":"applied","q":"一つの物理スイッチで論理的なLANを分ける技術は？","options":["VPN","DNS","VLAN","RAID"],"correct":2,"explain":"VLANは論理LANの分割。VPNは仮想的な私設通信路。"},{"id":"U-10-5","chapter":10,"kind":"applied","q":"外部IPに接続できるがドメイン名で接続できないとき最初に疑う機能は？","options":["DHCPの全停止","RAID","画像圧縮","DNS"],"correct":3,"explain":"IP到達性が確認できているため名前解決を優先する。"},{"id":"U-10-X01","chapter":10,"kind":"applied","q":"ネットワークの混雑に応じ送信量を調整する制御は？","options":["輻輳制御","フロー制御","誤り訂正","名前解決"],"correct":0,"explain":"輻輳制御は網の過負荷を抑える。"},{"id":"U-10-X02","chapter":10,"kind":"applied","q":"ネットワーク機器の状態を監視管理する代表的プロトコルは？","options":["SMTP","SNMP","POP3","NTP"],"correct":1,"explain":"SNMPは簡易ネットワーク管理プロトコル。SMTPはメール送信、NTPは時刻同期。"},{"id":"U-10-Y01","chapter":10,"kind":"applied","q":"回線が1本、提供呼量1アーラン、待ちなしのアーランBモデルで呼損率は？","options":["0.25","0.5","0.1","1"],"correct":1,"explain":"B(1,1)＝1/(1+1)＝0.5。"},{"id":"U-10-Y02","chapter":10,"kind":"applied","q":"冗長なL2ネットワークのループを防ぐ代表的方式は？","options":["DNS","NAT","スパニングツリー","DHCP"],"correct":2,"explain":"論理的な木構造を作ってループを防ぐ。"},{"id":"U-10-Y03","chapter":10,"kind":"applied","q":"通常のDNS名前解決で利用する既定のポートは？","options":["22","25","123","53"],"correct":3,"explain":"DNSはUDP/TCPの53番を一般に用いる。"},{"id":"U-10-Y04","chapter":10,"kind":"applied","q":"リンク状態とコストをもとに最短経路を求める代表的な経路制御方式は？","options":["OSPF","POP3","DHCP","SMTP"],"correct":0,"explain":"OSPFはリンク状態型のルーティングプロトコル。"},{"id":"U-10-Y05","chapter":10,"kind":"applied","q":"ネットワーク機能を汎用計算機上の仮想環境で実行する考え方は？","options":["DNS","NFV","MIB","WDM"],"correct":1,"explain":"Network Functions Virtualization（ネットワーク機能仮想化）。"},{"id":"U-10-Y06","chapter":10,"kind":"applied","q":"添付画像などをメールで扱うための拡張規則は？","options":["NTP","STP","MIME","RIP"],"correct":2,"explain":"MIMEは本文の形式や添付等を扱う規則。"},{"id":"U-10-Y07","chapter":10,"kind":"applied","q":"発行・購読型でIoTセンサ等に利用されるメッセージ通信規約は？","options":["HDMI","RAID","MIME","MQTT"],"correct":3,"explain":"発行者と購読者の間をブローカ等が仲介する。"}],"deepIntro":"科目Bでは「どの層で、どの相手へ、何が通らないか」を表と経路図で整理する。","deep":[{"id":"10-1","title":"TCP/IPの階層とカプセル化","explain":"<p>通信の機能を層に分けると障害箇所を推定しやすい。リンク層は同一リンク内のフレーム転送、IP（Internet Protocol：インターネットプロトコル）はネットワーク間のパケット配送、TCP（Transmission Control Protocol：伝送制御プロトコル）は順序・再送などによる信頼性の高いバイトストリーム、UDP（User Datagram Protocol：ユーザーデータグラムプロトコル）は軽量なデータグラム通信、HTTP（Hypertext Transfer Protocol：Web通信プロトコル）はアプリ層の要求・応答を担う。</p>\n<p>送信時は上位データにヘッダを追加するカプセル化、受信時はヘッダを解釈して上位へ渡す。TCPはコネクション確立に通常3ウェイハンドシェイクを使うが、TLSやHTTPはさらに別の処理がある。IPアドレスは論理的な転送先、MACアドレスはリンク層での宛先識別。</p>\n","worked":"<p>Webにアクセスできない場合、最初に物理リンク・IP設定・DNS・TCP接続・TLS/HTTP応答を順に分ける。<code>ping</code>が通らないことだけでHTTPサーバ故障とは断定できない。ICMPを遮断している場合もある。</p>\n","prompt":"HTTP/3はTCPを使うか。","answer":"<p>一般にQUICを使い、その下位にはUDPが使われる。HTTP/1.1・HTTP/2の典型例との違いを押さえる。</p>\n","beginner":{"scenario":"Web要求を送るときTCPが通信の順序などを管理、IPが宛先への配送、リンク層が同一リンク上の転送を担当する。","trap":"IPアドレスはネットワークの宛先、ポート番号はサービス識別。","quizId":"U-10-1"},"textbook":[{"heading":"なぜ通信を階層に分けるのか","body":"ブラウザでページを開くには、要求の内容、相手のアプリ、相手の機器への経路、隣の機器への転送などを別々に考えます。OSI参照モデルは物理・データリンク・ネットワーク・トランスポート・セッション・プレゼンテーション・アプリケーションの7層に分けた概念モデルです。TCP/IP体系は実際のインターネットのプロトコル群で、分類は必ずしもOSIと一対一ではありません。"},{"heading":"アドレスとポート","body":"データリンク層ではMACアドレスなどを使って同一リンク上の機器へ転送し、ネットワーク層のIPは異なるネットワーク間の宛先と経路を扱います。トランスポート層ではポート番号でアプリケーションの通信先を識別します。TCP（伝送制御プロトコル）は接続、順序、再送等で信頼性のあるバイトストリームを提供し、UDP（ユーザデータグラムプロトコル）は接続確立や再送を自身では保証しない軽量な方式です。"},{"heading":"カプセル化を追う","body":"HTTPの要求データにTCPヘッダ、IPヘッダ、リンク層のヘッダ等を順に付加して送ります。受信側は逆順に解釈します。ルータを越えるとリンク層の宛先等は次の区間に合わせて変わります。アプリの内容を運ぶ役割と、配送先を決める役割を区別します。"}],"walkthrough":{"heading":"一つのパケットがルータを通るとき","body":"端末A（IP 192.168.1.10）が別ネットワークのサーバB（IP 203.0.113.20）に通信する例です。Aは宛先IPが自分のサブネット外だと判断し、最初のリンクではデフォルトゲートウェイRへフレームを送ります。IPパケットの宛先はBのままですが、最初のフレームの宛先MACはRになります。RはフレームからIPパケットを取り出し、経路表に従って次の区間用のフレームを生成します。IPのTTL（生存時間）は転送ごとに減少し、ループによる永続転送を防ぎます。NAT等がない基本例では、宛先IPは最終サーバを示し、リンク層の宛先は各区間の次の機器を示すのが重要です。","cols":["区間","IP宛先","リンク層宛先"],"rows":[["端末A→ルータR","サーバB","ルータR"],["ルータR→次ルータ","サーバB","次ルータ"],["最後のルータ→B","サーバB","サーバB"]]}},{"id":"10-X01","title":"ネットワーク方式・通信制御","explain":"<p>LAN（構内ネットワーク）は限定範囲、WAN（広域ネットワーク）は離れた拠点を接続する。イーサネットの従来型共有媒体はCSMA/CD（衝突検出付き搬送波感知多重アクセス）、無線LANはCSMA/CA（衝突回避）を用いる。全二重スイッチ接続では通常CSMA/CDを必要としない。</p><p>回線交換は専用回線を確保し、パケット交換は分割データを共有回線で転送する。MPLS（多重プロトコルラベルスイッチング）はラベルによる転送。QoS（通信品質制御）は遅延・損失などの要件に応じ優先制御や帯域制御を行う。フロー制御は受信側の処理能力、輻輳制御は網の混雑に合わせ送信を調整する。</p>","worked":"<p>音声会議ではわずかな遅延が問題となりやすく、ファイル転送より優先する設計が考えられる。</p>","prompt":"無線LANで主に使われる媒体アクセス制御は？","answer":"<p>CSMA/CA。送信前に衝突を回避する。</p>","beginner":{"scenario":"受信側のバッファが埋まるなら受信能力に合わせ送信を調整。網の途中が混雑するなら網の負荷に応じ送信量を抑える。","trap":"フロー制御は受信側、輻輳制御はネットワークの混雑。","quizId":"U-10-X01"},"textbook":[{"heading":"通信路の共有方法","body":"回線交換は通信中に経路の資源を確保し、パケット交換はデータを小さな単位に分け共有網で送ります。パケット方式は回線を効率よく共有できますが混雑で待ち時間が発生します。MPLS（多重プロトコルラベルスイッチング）はラベルに基づく転送方式です。"},{"heading":"媒体アクセス制御","body":"従来の共有イーサネットで使うCSMA/CDは送信前に媒体を確認し衝突を検出したら再送します。スイッチによる全二重通信では通常不要です。無線LANのCSMA/CAは送信前の待機などで衝突を回避する方式です。無線では送信中に衝突を検出するのが難しいためです。"},{"heading":"通信量を調整する仕組み","body":"フロー制御は受信側が処理できる量に合わせ、輻輳制御はネットワーク全体の混雑に合わせ送信量を調整します。QoS（サービス品質制御）は音声の遅延や映像の帯域など要求に合わせ優先度・帯域を管理します。帯域を優先配分しても物理的な回線容量が増えるわけではありません。"}]},{"id":"10-Y01","title":"回線・無線LAN・トラフィック計算","explain":"<p>LAN（構内ネットワーク）は施設等の限定範囲、WAN（広域ネットワーク）は離れた拠点間を接続する。ISP（インターネット接続事業者）はインターネットへの接続等を提供する。MDF（主配線盤）、IDF（中間配線盤）は建物内配線の接続・整理に使う。より対線は対の導線をねじって雑音の影響を減らし、同軸ケーブルは中心導体と外側導体、光ファイバは光で信号を伝える。距離・帯域・電磁雑音・費用を比較する。</p>","worked":"<p><b>50Mbit/sの回線で利用率80%、200MBを送る。</b></p><p>実効速度40Mbit/s。200×8÷40＝40秒。</p>","prompt":"毎時120件の呼が平均2分続く場合の提供呼量を求める。","answer":"<p>120×2/60＝4アーラン。</p>","textbook":[{"heading":"接続範囲と媒体","body":"LAN（構内ネットワーク）は施設等の限定範囲、WAN（広域ネットワーク）は離れた拠点間を接続する。ISP（インターネット接続事業者）はインターネットへの接続等を提供する。MDF（主配線盤）、IDF（中間配線盤）は建物内配線の接続・整理に使う。より対線は対の導線をねじって雑音の影響を減らし、同軸ケーブルは中心導体と外側導体、光ファイバは光で信号を伝える。距離・帯域・電磁雑音・費用を比較する。"},{"heading":"無線の競合","body":"インフラストラクチャモードでは端末がアクセスポイントを介して通信し、アドホックモードでは端末同士が直接通信する。SSID（無線LANのネットワーク識別子）はネットワーク名であり、暗号鍵ではない。隠れ端末問題は互いの電波が届かない二端末が同じアクセスポイントへ同時送信し衝突すること。さらし端末問題は本来別々の受信先へ同時送信可能な端末が他端末の送信を検知し不要に待つこと。無線ではCSMA/CA（衝突回避型の媒体アクセス制御）やRTS/CTS（送信要求・送信許可）等で競合を抑える。"},{"heading":"通信量を計算する","body":"利用率を考慮した転送速度は例えば100Mbit/s×0.4＝40Mbit/s。100MBは800Mbitなので20秒。毎時600件の電話が平均3分続く場合、提供呼量A＝600×3/60＝30アーラン。アーランは平均して同時に占有を要求する回線数に相当する量。待ち行列がなく満杯時に拒否されるモデルではアーランB式B(A,n)＝(Aⁿ/n!)/(Σₖ₌₀ⁿ Aᵏ/k!)で呼損率を求める。A=1、回線2本なら0.5/(1+1+0.5)=0.2。適用条件は待ち行列モデルと異なる。"}],"beginner":{"scenario":"接続範囲と媒体から順に、無線の競合、通信量を計算するを理解する。","trap":"B(1,1)＝1/(1+1)＝0.5。","quizId":"U-10-Y01"}},{"id":"10-4","title":"スイッチ・VLAN・無線・負荷分散","explain":"<p>L2スイッチはMACアドレス表を学習してフレームを転送する。VLAN（Virtual LAN：仮想LAN）は物理的な配線によらず論理的にブロードキャストドメインを分割する。異なるVLAN間の通信には通常L3ルーティングが必要。STP（Spanning Tree Protocol：スパニングツリープロトコル）はL2のループを防ぐため一部リンクを論理的に遮断する。</p>\n<p>Wi-Fiでは規格、周波数帯、チャネル干渉、アクセスポイント配置、暗号方式等が性能に影響する。ロードバランサは複数サーバへ要求を振り分ける。L4負荷分散は主にアドレス・ポート、L7負荷分散はHTTPパスやヘッダ等を見て振り分けられる。</p>\n","worked":"<p>社内端末がVLAN10、DBがVLAN20に分離され、相互ルーティング設定がない場合はL2スイッチのポートをつなぐだけでは通常通信できない。ルータ/ L3スイッチの経路・ACLを調べる。</p>\n","prompt":"VLANを分けるだけで完全に機密保護できるか。","answer":"<p>できない。ルーティング制御、ACL、認証、暗号化などの設計が必要。</p>\n","beginner":{"scenario":"営業と経理を別VLANにすると同じ物理スイッチでも論理的に別LANとなる。相互通信はルーティングと必要なアクセス制御を使う。","trap":"VLAN自体が暗号化や完全な安全性を保証するわけではない。","quizId":"U-10-4"},"textbook":[{"heading":"ネットワーク機器の役割","body":"リピータは信号を再生・中継、L2スイッチはMACアドレスに基づいてフレームを転送、ルータはIPアドレスに基づいて異なるネットワーク間のパケットを転送します。スイッチは受信フレームの送信元MACアドレスを学習し、対応ポートへ転送します。未学習宛先などは同じ論理LAN内に広く送る場合があります。"},{"heading":"論理的に分けるVLAN","body":"VLAN（仮想LAN）は同じ物理スイッチ上でも複数の論理ネットワークに分ける技術です。営業部と経理部を分けるとブロードキャスト範囲を分離できます。異なるVLAN間で通信するにはルーティング等が必要で、アクセス制御と組み合わせます。VLANを設定するだけで暗号化されるわけではありません。"},{"heading":"無線と負荷分散","body":"無線LANではアクセスポイントが端末とネットワークを接続します。電波の競合、障害物、干渉、暗号化・認証を考えます。ロードバランサは複数サーバへ要求を分配し、正常性確認で停止サーバを除外するなどの機能を持ちます。処理負荷、セッション保持、単一障害点を設計します。"}]},{"id":"10-Y02","title":"ネットワーク構成・転送制御・ループ防止","explain":"<p>ポイントツーポイントは2地点間、スター型は中心機器を介して接続、バス型は共通の伝送路、リング型は輪、ツリー型は階層で接続する。スター型は1本の端末配線の断線の影響を限定しやすいが中心機器が単一障害点となり得る。冗長なL2（データリンク層）接続では転送ループが生じ得る。スパニングツリープロトコル（STP）はルートブリッジを選び、ループのない論理的な木を形成するため一部のポートを転送しない状態にし、障害時に経路を再構成する。</p>","worked":"<p><b>3台のL2スイッチを三角形に接続した。</b></p><p>冗長経路は有用だがフレームのループを防ぐ必要があり、STP等で通常時の転送経路を制御する。</p>","prompt":"トークンパッシングではなぜ複数端末の同時送信が抑えられるか。","answer":"<p>トークンを持つ端末に送信権を与えるため。</p>","textbook":[{"heading":"配線形態と障害","body":"ポイントツーポイントは2地点間、スター型は中心機器を介して接続、バス型は共通の伝送路、リング型は輪、ツリー型は階層で接続する。スター型は1本の端末配線の断線の影響を限定しやすいが中心機器が単一障害点となり得る。冗長なL2（データリンク層）接続では転送ループが生じ得る。スパニングツリープロトコル（STP）はルートブリッジを選び、ループのない論理的な木を形成するため一部のポートを転送しない状態にし、障害時に経路を再構成する。"},{"heading":"伝送を調整する","body":"コンテンション方式は各端末が送信を競う。ポーリングは制御局が順に送信要求を確認、セレクティングは相手局を選んで送信。トークンパッシングは送信権を示すトークンを順に渡す。HDLC（高水準データリンク制御）はフレーム単位で同期・誤り検出・制御などを行う。フロー制御は受信側の処理能力に合わせ、ルーティング制御は宛先への経路を決定する。コネクション型は通信開始前に論理的接続を確立し、コネクションレス型は個々のデータ単位を送る。"},{"heading":"機器と回線の役割","body":"ハブやリピータは物理信号を中継し、ブリッジやL2スイッチはMACアドレスで転送、L3スイッチやルータはIPアドレスで転送する。ゲートウェイは異なる方式の接続・変換など広い意味を持つ。TDMA（時分割多元接続）は時間を分け複数局が共有、WDM（波長分割多重）は光の波長を分ける。PLC（電力線通信）は電力線を通信にも使う。ITU-Tは国際電気通信連合の標準化部門でX・V・Iシリーズ等の勧告を制定している。"},{"heading":"ループ防止","body":"STP（Spanning Tree Protocol：スパニングツリープロトコル）はレイヤ2の冗長なリンクから論理的な木構造を作り、ループになる経路を通常転送から外す。ループはブロードキャストストーム等を招く。RIPは経路制御、IGMPはマルチキャスト参加管理、SIPはセッション開始制御。"}],"beginner":{"scenario":"配線形態と障害から順に、伝送を調整する、機器と回線の役割を理解する。","trap":"論理的な木構造を作ってループを防ぐ。","quizId":"U-10-Y02"}},{"id":"10-2","title":"IPアドレス・サブネット・経路選択","explain":"<p>IPv4アドレスは32ビット。CIDR表記192.168.10.0/26ならネットワーク部26ビット、ホスト部6ビットでアドレス数64。通常のホスト利用ではネットワークアドレスとブロードキャストアドレスを除き最大62個（特殊用途を除く）。サブネットマスク255.255.255.192は/26を表す。同一ネットワークかどうかはアドレスとマスクのANDで判定する。</p>\n<p>ルータは宛先IPと経路表を照合し、最長一致（ロンゲストプレフィックスマッチ）を優先する。LAN（Local Area Network：構内ネットワーク）内の隣接相手へのMAC解決にはIPv4ならARP、IPv6なら近隣探索（NDP）が使われる。NAT（Network Address Translation：アドレス変換）はアドレス、NAPTはポート番号を含めて変換し、複数端末の外部通信を可能にすることがある。</p>\n","worked":"<p>/27はホスト部5ビットで32アドレス。192.168.1.96/27の範囲は192.168.1.96～127、通常使用可能なのは97～126。192.168.1.130は別サブネット。</p>\n","prompt":"10.0.0.0/8と10.1.0.0/16の両方が経路表にあるとき、宛先10.1.2.3はどちらか。","answer":"<p>より具体的な/16に一致する経路を使う。</p>\n","beginner":{"scenario":"192.168.1.130/26はホスト部6ビット、64個刻み。130は128〜191の区間なのでネットワーク.128、通常ホスト.129〜.190。","trap":"/26はネットワーク部が26ビット。","quizId":"U-10-2","lab":{"title":"サブネットを2進数から求める","problem":"192.168.1.77/27のネットワークアドレス、ブロードキャスト、通常のホスト範囲を求める。","steps":["32−27=5ビットがホスト部。ブロック幅は2⁵=32。","サブネットマスクは255.255.255.224。最後の8ビットは11100000。","77は01001101。マスクとANDすると01000000=64。","ホスト部を全部1にすると01011111=95。","ネットワークは.64、ブロードキャストは.95、ホストは.65〜.94。"],"answer":"192.168.1.64、192.168.1.95、ホスト30個","check":"末尾の32刻み（0、32、64、96…）を使っても求められる。"}},"textbook":[{"heading":"IPアドレスの構造","body":"IPv4アドレスは32ビットを8ビットずつ区切った4つの十進数で表します。先頭のネットワーク部と残りのホスト部をプレフィックス長で区別します。/24なら先頭24ビットがネットワーク部、最後8ビットがホスト部です。サブネットマスク255.255.255.0はネットワーク部が全て1、ホスト部が全て0です。"},{"heading":"ネットワークを求める","body":"192.168.1.77/26なら残り6ビットで64アドレスの区間です。77は64〜127に属し、ネットワークは192.168.1.64、ブロードキャストは192.168.1.127、通常利用できるホストは.65〜.126の62個です。AND演算でホスト部を0にしても求められます。/31・/32は特殊な用途があり通常の2ⁿ−2を機械的に適用しません。"},{"heading":"経路とアドレス変換","body":"端末は同じサブネットなら直接転送し、別ネットワークならルータ（通常はデフォルトゲートウェイ）へ渡します。ルータは経路表の中から宛先に合う最長プレフィックスの経路を選ぶのが基本です。NAT（ネットワークアドレス変換）はアドレスを変換し、NAPTはポート番号も利用して複数端末の通信を対応付けます。IPv6は128ビットでより広いアドレス空間を持ちます。"},{"heading":"CIDRのプレフィックス","body":"CIDR（Classless Inter-Domain Routing：クラスレスドメイン間経路制御）はクラスA〜Cに固定せず、プレフィックス長でネットワーク部を指定する。IPv4の/26ならホスト部6ビットで64アドレス。通常のサブネットでネットワークとブロードキャストを除けば62ホスト。"}],"walkthrough":{"heading":"経路表は一番具体的な住所を選ぶ","body":"ルータに0.0.0.0/0（既定経路）、192.168.0.0/16（経路A）、192.168.1.0/24（経路B）、192.168.1.128/25（経路C）が登録されているとします。宛先192.168.1.150は/16、/24、/25の全てに一致します。その中でネットワーク部が最も長く具体的な/25の経路Cを選ぶのが最長一致です。192.168.1.30は/25の128〜255に含まれないので/24のBを選びます。どの個別経路にも一致しなければ既定経路を利用します。これは経路の優先度やメトリックを比較する以前の基本的な宛先照合です。","cols":["宛先","一致する経路","選択"],"rows":[["192.168.1.150","/0、/16、/24、/25","C（/25）"],["192.168.1.30","/0、/16、/24","B（/24）"],["192.168.2.10","/0、/16","A（/16）"],["203.0.113.20","/0","既定経路"]]}},{"id":"10-Y04","title":"経路制御・LAN規格・分散オブジェクト","explain":"<p>静的ルーティングは管理者が経路を設定し、動的ルーティングはルータが情報を交換して経路を学ぶ。RIPはホップ数を基準とする距離ベクトル型、OSPFはリンク状態を共有しコストを基に最短経路を計算する方式、BGPは自律システム（AS）間で経路と経路方針を交換する方式。経路表の最長一致と、同じ宛先範囲の候補を選択する規則は区別する。</p>","worked":"<p><b>経路候補Aが2ホップで合計コスト20、Bが3ホップで合計コスト5。</b></p><p>ホップ数のみを基準にすればA、コスト合計を基準にすればB。実際は使用する経路制御方式の規則に従う。</p>","prompt":"AS間で経路方針に基づき経路情報を交換する代表的プロトコルは？","answer":"<p>BGP（境界ゲートウェイプロトコル）。</p>","textbook":[{"heading":"経路の決定方法","body":"静的ルーティングは管理者が経路を設定し、動的ルーティングはルータが情報を交換して経路を学ぶ。RIPはホップ数を基準とする距離ベクトル型、OSPFはリンク状態を共有しコストを基に最短経路を計算する方式、BGPは自律システム（AS）間で経路と経路方針を交換する方式。経路表の最長一致と、同じ宛先範囲の候補を選択する規則は区別する。"},{"heading":"通信規格を読む","body":"10BASE-Tは10Mbit/s、100BASE-TXは100Mbit/s、1000BASE-Tは1Gbit/s、10GBASE-Tは10Gbit/sのより対線系イーサネット規格の例。Wi-Fi 4/5/6は一般にIEEE 802.11n/ac/axに対応し、6Eは6GHz帯への拡張。メッシュWi-Fiは複数の接続点を組み合わせ通信範囲を広げる。ISDN（総合デジタル通信網）はデジタル回線サービス、PRIは一次群インタフェース。実際の速度は電波・ケーブル・距離・混雑等に左右される。"},{"heading":"遠隔の機能を呼び出す","body":"CORBA（共通オブジェクト要求ブローカアーキテクチャ）は異なる言語・機器で実装した分散オブジェクト間の連携を可能にする規格。クライアントは要求を出し、ORB（オブジェクト要求ブローカ）が対象オブジェクトへの呼出しを仲介する。ネットワーク上の処理でも通信失敗・遅延・認証を考慮する必要がある。REST（表現状態転送）はWeb APIの設計原則、SOAPは構造化メッセージの交換規約である。"}],"beginner":{"scenario":"経路の決定方法から順に、通信規格を読む、遠隔の機能を呼び出すを理解する。","trap":"OSPFはリンク状態型のルーティングプロトコル。","quizId":"U-10-Y04"}},{"id":"10-Y03","title":"TCPの通信手順・ポート・IPアドレスの補足","explain":"<p>ポート番号は通信相手のアプリケーション等を識別する。代表的な既定ポートはHTTP TCP80、HTTPS TCP443（HTTP/3は通常UDP443）、SSH TCP22、DNS UDP/TCP53、SMTP TCP25（サーバ間配送）、メール送信用587、POP3 TCP110、IMAP TCP143、NTP UDP123。DHCPは通常UDP67（サーバ）、68（クライアント）。ポート番号は設定で変わる場合があり、番号だけでサービスの安全性は判断できない。RARPはMACアドレスからIPアドレスを求める古い方式、PPPは2地点間の通信規約、PPPoEはイーサネット上でPPPを使う。IPoEはイーサネット上でIPを直接扱う。IEEE 802.1QはVLANタグ等の規格。</p>","worked":"<p><b>TCPで順序番号1000から200バイトのデータを順に受け取った。</b></p><p>他の条件を無視すれば次に期待する番号は1200。ACKでその位置を通知する。</p>","prompt":"HTTP/3はUDP上で動くため必ずデータが欠落したまま再生されるか。","answer":"<p>いいえ。QUICが必要な信頼性等を提供する。</p>","textbook":[{"heading":"ポート番号とプロトコル","body":"ポート番号は通信相手のアプリケーション等を識別する。代表的な既定ポートはHTTP TCP80、HTTPS TCP443（HTTP/3は通常UDP443）、SSH TCP22、DNS UDP/TCP53、SMTP TCP25（サーバ間配送）、メール送信用587、POP3 TCP110、IMAP TCP143、NTP UDP123。DHCPは通常UDP67（サーバ）、68（クライアント）。ポート番号は設定で変わる場合があり、番号だけでサービスの安全性は判断できない。RARPはMACアドレスからIPアドレスを求める古い方式、PPPは2地点間の通信規約、PPPoEはイーサネット上でPPPを使う。IPoEはイーサネット上でIPを直接扱う。IEEE 802.1QはVLANタグ等の規格。"},{"heading":"TCPが信頼性を実現する仕組み","body":"TCP（伝送制御プロトコル）は接続確立時にSYN（同期要求）、SYN+ACK（同期と確認応答）、ACK（確認応答）の3ウェイハンドシェイクを行う。送信データに順序番号を付け、受信側が次に期待する番号等を通知する。未確認のデータは再送され得る。受信ウィンドウで流量を調整し、輻輳制御でネットワーク混雑に対応する。UDP（ユーザデータグラムプロトコル）はこれらを自身では保証しない。HTTP/2は一つの接続上で複数のストリームを多重化し、HTTP/3はUDP上のQUICを利用する。QUICは暗号化・接続・信頼性等の機能を持つ。"},{"heading":"IPの宛先の種類","body":"ユニキャストは1対1、ブロードキャストは同一範囲の全端末向け、マルチキャストはグループ向け。IPv6にはIPv4のようなブロードキャストはなくマルチキャスト等を利用する。IPv4の歴史的なクラスA/B/Cは標準ネットワーク部が8/16/24ビットだがCIDR（クラスレス経路制御）は任意のプレフィックス長を使う。プライベートIPv4の代表範囲は10/8、172.16/12、192.168/16で、インターネット上に直接経路広告しない。IPv6のリンクローカルアドレスは同一リンク上で用いる。"}],"beginner":{"scenario":"ポート番号とプロトコルから順に、TCPが信頼性を実現する仕組み、IPの宛先の種類を理解する。","trap":"DNSはUDP/TCPの53番を一般に用いる。","quizId":"U-10-Y03"}},{"id":"10-Z02","title":"TCP・UDPヘッダとポートの状態","explain":"<p>TCP（Transmission Control Protocol：伝送制御プロトコル）は接続を確立し、シーケンス番号でバイト列の順序を管理し、確認応答や再送を行う。UDP（User Datagram Protocol：利用者データグラムプロトコル）は接続確立なしでデータグラムを送る。両方に送信元・宛先ポートとチェックサムがある。</p>","worked":"<p>TCPにありUDPにはない代表的なヘッダ項目はシーケンス番号。</p>","prompt":"TCPとUDPの双方のヘッダに含まれるのは？","answer":"<p>ポート番号はどちらもアプリケーションを識別する。</p>","beginner":{"scenario":"通信ができない原因を調べるため、応答の意味を理解する。","trap":"UDPに応答がないことは開いている証明ではない。","quizId":"U-10-Z02"},"textbook":[{"heading":"基本原理","body":"TCP（Transmission Control Protocol：伝送制御プロトコル）は接続を確立し、シーケンス番号でバイト列の順序を管理し、確認応答や再送を行う。UDP（User Datagram Protocol：利用者データグラムプロトコル）は接続確立なしでデータグラムを送る。両方に送信元・宛先ポートとチェックサムがある。"},{"heading":"仕組み・判断","body":"TCPのSYNは接続開始要求、SYN/ACKは応答、ACKは確認応答。RSTは接続のリセットや拒否を示す。UDPでは宛先ポートが閉じている場合にICMP（Internet Control Message Protocol：インターネット制御メッセージプロトコル）のport unreachableが返ることがある。"},{"heading":"応用と注意点","body":"許可された管理対象で通信診断する場合も、応答なしだけで開閉を断定しない。ファイアウォールや通信損失が原因となり得る。TCPのシーケンス番号とIPアドレスは別の役割を持つ。"}]},{"id":"10-3","title":"DNS・DHCP・HTTP・TLS","explain":"<p>DNS（Domain Name System：ドメイン名の名前解決）はドメイン名からIPアドレス等のレコードを取得する仕組み。AはIPv4、AAAAはIPv6、MXはメール交換先、CNAMEは別名、TXTは文字列等を登録する。TTL（Time To Live：キャッシュ有効時間）を短くすると変更反映を早めやすいが、照会増加の可能性がある。DHCP（Dynamic Host Configuration Protocol：動的ホスト設定）はIP・DNS・デフォルトゲートウェイ等を自動配布する。</p>\n<p>HTTPは要求メソッドGET/POST/PUT/DELETEと応答状態を用いる。認証・権限管理はHTTPメソッドだけでは実現されない。HTTPSはHTTPをTLS（Transport Layer Security：通信路の暗号化・認証）で保護する。証明書チェーンとホスト名の検証により通信先の正当性を確認し、鍵交換でセッション鍵を確立する。</p>\n","worked":"<p>DNSで正しいIPを取得できるがブラウザが接続できない場合、IP到達性、TCP/443、サーバのTLS証明書、HTTPの応答を確認する。DNSを修正してもアプリ側の問題は直らない。</p>\n","prompt":"HTTPSはサーバの業務上の信用・コンテンツの正しさを保証するか。","answer":"<p>保証しない。通信相手と通信路の検証と、サービスの安全性は別。</p>\n","beginner":{"scenario":"端末がDHCPで設定を受け、DNSで名前からIPを調べ、一般的なHTTPSではTLSで通信路を保護しHTTPで要求する。","trap":"名前解決成功はサーバ正常を意味しない。","quizId":"U-10-3","lab":{"title":"Web接続障害の切分け","problem":"社内端末AはIP設定を取得済み。外部のWebサーバIPへ接続できるが、ドメイン名で名前解決できない。別端末でも同じ。","steps":["IPアドレスとデフォルトゲートウェイが正常か確認。外部IPへ到達できるので経路全断は考えにくい。","DNS設定を確認し、指定DNSサーバへの接続と名前解決結果を調べる。","複数端末で同じなら共通DNSサーバ・上流DNS・設定変更を調べる。","名前解決成功後もHTTPSに失敗するなら証明書・TLS・Webサーバなどを別途調べる。"],"answer":"DNS関連の設定と稼働状況を優先して調査","check":"名前解決と通信経路とアプリの応答を分ける。観測だけで原因を断定しない。"}},"textbook":[{"heading":"通信には複数の役割がある","body":"Webページを読むには、端末自身が通信できる状態になること、目的地の住所を知ること、必要なら安全な通信路を確立すること、欲しい情報を要求することが必要です。DHCP、DNS、TLS、HTTPはこの四つの異なる問題を解決する規約（プロトコル）です。"},{"heading":"DHCP：端末の初期設定","body":"DHCP（Dynamic Host Configuration Protocol: 動的ホスト構成プロトコル）は、IPアドレス、サブネットマスク、デフォルトゲートウェイ、DNSサーバなどを配布します。IPv4の代表的手順では、端末がサーバを探索し（Discover）、提示（Offer）を受け、要求（Request）し、承認（ACK）を受けます。アドレスは通常期限付きで貸し出されます。DNSとは違い、通信する端末自身の設定を行います。"},{"heading":"DNS：名前を通信先に変換する","body":"DNS（Domain Name System: ドメイン名システム）は、人間が使う名前をIPアドレスなどの情報に対応付ける分散型の仕組みです。端末は通常、再帰問い合わせを受けるリゾルバに質問し、キャッシュになければリゾルバがルート・トップレベルドメイン・権威サーバを順に参照します。AレコードはIPv4アドレス、AAAAはIPv6、MXはメール配送先を表します。名前解決はWebページそのものを取得する処理ではありません。"},{"heading":"TLS：安全な通信路を作る","body":"TLS（Transport Layer Security: 通信路の保護）は、盗聴と改ざんを防ぎ、通常はサーバを認証します。サーバ証明書の名前、期限、信頼連鎖を検証し、鍵交換を行って共通の通信鍵を得ます。その後は効率のよい共通鍵の暗号化・認証を利用します。HTTPSはHTTPをTLSなどで保護した通信です。証明書はサイトの内容や商取引の信頼性まで保証するものではありません。"},{"heading":"HTTP：要求と応答","body":"HTTP（Hypertext Transfer Protocol: ハイパーテキスト転送プロトコル）は、リソースを要求し、状態コードやヘッダ、本文を受け取るための規約です。GETは取得、POSTは送信などに使います。200は成功、404は対象が見つからない、500はサーバ内部エラーの代表例です。HTTPは基本的にステートレス（要求間で状態を自動保持しない）なので、CookieやセッションIDを使ってログイン状態などを関連付けます。"},{"heading":"全体を一つの順序でつなぐ","body":"初めてネットワークへ参加する端末はDHCP等で設定を得ます。URLを入力するとDNSで宛先を調べ、TCP接続とTLSを確立してHTTPSで要求するのが代表的な流れです。HTTP/3ではQUIC（UDP上の通信プロトコル）を用いるためTCPとは限りません。名前だけ解決できないならDNS、IP通信自体ができないならアドレスや経路、証明書警告ならTLS、404ならHTTPの要求先を疑います。"}],"walkthrough":{"heading":"DNSとDHCPの処理を分けて追う","body":"新しい端末がネットワークにつながったとき、IPv4のDHCPでは一般にDiscover（サーバ探索）、Offer（設定の提案）、Request（利用要求）、ACK（承認）という流れで設定を受け取ります。取得したIPアドレスやDNSサーバの情報を使い、今度はWebサイトの名前解決を行います。DNSの再帰リゾルバはキャッシュに答えがなければ、ルート、トップレベルドメイン、権威DNSなどへ問い合わせて答えを取得します。AレコードはIPv4、AAAAはIPv6、MXはメール配送先、CNAMEは別名を表します。TTLはDNS情報をキャッシュできる時間の目安です。DHCPが提供するのは端末の設定、DNSが提供するのは名前に対応した情報という違いを押さえます。","cols":["目的","代表的な仕組み"],"rows":[["端末が自分のIP設定を得る","DHCP"],["サイト名からIPv4を得る","DNS Aレコード"],["サイト名からIPv6を得る","DNS AAAAレコード"],["メールの配送先を調べる","DNS MXレコード"],["Web要求を送る","HTTP／HTTPS"]]},"pedagogyReviewed":true},{"id":"10-Y06","title":"電子メール・Web・ファイル転送の仕組み","explain":"<p>送信者のメールクライアントが送信サーバへ提出し、SMTP（簡易メール転送プロトコル）で宛先ドメインのメールサーバへ配送する。DNSのMXレコードで配送先を調べる。受信者はPOP3で取得またはIMAPでサーバ上のメールを管理する。MIME（多目的インターネットメール拡張）は添付や文字種等を表現する規則。Base64は3バイトを4文字に変換する方式で、暗号化ではなくバイナリを文字として表す。HTMLメールは画像やリンク等を含められるが外部読込み等の安全性に配慮する。</p>","worked":"<p><b>写真300バイトをBase64だけで表す。</b></p><p>3バイトを4文字にするので400文字。添付の他の情報は別途必要。</p>","prompt":"複数端末で同じメールの既読やフォルダを管理したい。","answer":"<p>IMAPが候補。サーバ側のメール状態を利用する。</p>","textbook":[{"heading":"メールが届くまで","body":"送信者のメールクライアントが送信サーバへ提出し、SMTP（簡易メール転送プロトコル）で宛先ドメインのメールサーバへ配送する。DNSのMXレコードで配送先を調べる。受信者はPOP3で取得またはIMAPでサーバ上のメールを管理する。MIME（多目的インターネットメール拡張）は添付や文字種等を表現する規則。Base64は3バイトを4文字に変換する方式で、暗号化ではなくバイナリを文字として表す。HTMLメールは画像やリンク等を含められるが外部読込み等の安全性に配慮する。"},{"heading":"Webの資源と状態","body":"URL（統一資源位置指定子）は方式、ホスト、パス等で資源の位置を示す。CGIはWebサーバから外部プログラムを実行するための規約。CookieとセッションIDでログイン状態などを管理する。RESTは資源をURIで識別し統一的な操作等を用いる設計原則、WebDAVはHTTPを拡張し遠隔の文書管理・編集を支援する。検索エンジンはクローラで情報を収集し索引を作り問合せに応答する。"},{"heading":"ファイルを転送する","body":"FTP（ファイル転送プロトコル）は制御接続とデータ接続を使い分ける。アクティブモードではサーバからクライアントへのデータ接続、パッシブモードではクライアントからサーバへのデータ接続を行う。後者はクライアント側のNATやファイアウォールと相性がよい場合がある。標準FTPは通信を暗号化しないため安全な方式を選ぶ。TFTPは簡易ファイル転送でUDPを利用する。イントラネットは社内網、エクストラネットは取引先等との限定的な接続を含む。"}],"beginner":{"scenario":"メールが届くまでから順に、Webの資源と状態、ファイルを転送するを理解する。","trap":"MIMEは本文の形式や添付等を扱う規則。","quizId":"U-10-Y06"}},{"id":"10-C01","title":"ネットワークOS・MHTML","explain":"<p>ネットワーク共有資源とWeb文書の保存方法を区別する。</p><p>シラバスVer.7.2 本文47–48頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>Webページを画像と一緒に一つのアーカイブとして保存する例がMHTML。</p>","prompt":"画像付きWebページを一ファイルに保存する場合とサーバ上の文書を遠隔編集する場合の方式を区別せよ。","answer":"<p>前者はMHTML、後者はWebDAV。文書と関連資源をまとめる保存形式と、HTTPを拡張した遠隔操作の規約は役割が違う。</p>","beginner":{"scenario":"ネットワーク共有資源とWeb文書の保存方法を区別する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-10-C01"},"textbook":[{"heading":"ネットワークを通じて資源を使う","body":"ネットワーク上のファイルやプリンタを共有するには、接続できるだけでなく、誰がどの資源を利用できるかを管理する必要があります。ネットワークOS（ネットワークオペレーティングシステム）はファイル・プリンタ共有、利用者認証、アクセス制御などを提供するOSまたはOS機能です。単なるIPアドレス設定とは役割が異なります。"},{"heading":"MIME：異なる形式のデータを識別する","body":"MIME（Multipurpose Internet Mail Extensions: 多目的インターネットメール拡張）はメールで文字以外の画像やファイル等を扱えるよう、Content-Typeなどでデータ形式を識別し、複数部分をまとめる形式を定めます。この形式はメール以外でも活用されます。"},{"heading":"MHTML：Web文書と関連ファイルをまとめる","body":"HTML文書には別ファイルの画像等への参照が含まれます。HTMLだけ保存すると関連ファイルがなくなって表示できない場合があります。MHTML（MIME HTML）はHTMLと関連資源をMIMEの形式で一つにまとめる方式です。保存された画像等を再現しやすくなりますが、外部通信を必要とする動作まで完全保存するわけではありません。"},{"heading":"WebDAV：遠隔資源を編集する","body":"WebDAV（Web Distributed Authoring and Versioning: Web分散オーサリングと版管理）はHTTPを拡張し、遠隔の資源の編集・管理等を支援する規約です。MHTMLは文書を保存する形式、MIMEはデータ形式の識別・構成、WebDAVはネットワーク越しの操作、ネットワークOSは共有資源の提供・管理という異なる役割です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"10-X02","title":"通信プロトコル・管理・ネットワーク応用","explain":"<p>IPv6は128bitアドレス、IPv4は32bit。ARPはIPv4アドレスに対応するリンク層アドレスを調べる。IPv6では近隣探索が同様の役割を担う。ICMPはネットワーク制御・エラー通知、DNSは名前解決、DHCPはネットワーク設定の配布、NATはアドレス変換。</p><p>SMTPはメール送信、POP3はメール受信・取得、IMAPはサーバ上のメール管理、SNMPはネットワーク機器の監視管理、NTPは時刻同期、SSHは暗号化された遠隔操作。プロキシは通信を中継し、キャッシュやアクセス制御を行える。監視ではトラフィック、応答時間、パケット損失、機器ログを照合する。</p>","worked":"<p>IPアドレスに直接接続できるのにドメイン名では失敗する場合はDNSを調査する。</p>","prompt":"メール送信に使われる代表的なプロトコルは？","answer":"<p>SMTP（簡易メール転送プロトコル）。</p>","beginner":{"scenario":"メールサーバ間の送信はSMTP、サーバ上のメール管理はIMAP、機器監視はSNMP、時刻合わせはNTP。","trap":"ポート番号よりまず通信の目的・方向・暗号化の有無を区別する。","quizId":"U-10-X02"},"textbook":[{"heading":"各プロトコルの目的","body":"IPv4のARPはIPアドレスから同じリンク上のMACアドレスを取得し、IPv6では近隣探索が同様の役割を担います。ICMPは配送上のエラーや制御情報を伝え、pingはそのエコー要
