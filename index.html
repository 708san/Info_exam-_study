c/p>","textbook":[{"heading":"命令とデータの通り道","body":"アドレスバスは対象位置、データバスは値、制御バスは読書き等の指示を伝える。内部バス、メモリバス、入出力バス、拡張バスなどは接続対象が異なる。プリンストン（フォンノイマン）型は命令とデータを共通の記憶・経路で扱い、ハーバード型は両者を分離して同時アクセスしやすくする。実機ではキャッシュのみ分離する等の混合構成もある。"},{"heading":"共有経路の利用者を決める","body":"複数装置が同時にバスを使うと競合するため、バスアービタ（調停器）が使用権を割当てる。バスマスタは転送を開始する主体。集中制御では一つの調停器が要求と許可を管理する。ポーリングは順に要求を調べ、割込み方式は要求を通知する。バスアクセスモードで外部データ幅等を指定する機種もあり、指定幅やアラインメント（境界）によって必要転送回数が変わる。"},{"heading":"転送速度と規格","body":"理論帯域は転送幅×毎秒転送回数。64ビットを毎秒1億回送るなら800MB/s。PCIは拡張バス、PCI Expressは高速シリアル接続、NVMeは不揮発性記憶向けの通信規約で一般にPCI Express上等で使う。SCSIは周辺装置のコマンド・接続規格群、IEEE 1394はシリアル接続規格、USB（汎用シリアルバス）は周辺機器接続。規格世代、レーン数、符号化等によって実効性能は変わる。"}],"beginner":{"scenario":"命令とデータの通り道から順に、共有経路の利用者を決める、転送速度と規格を理解する。","trap":"命令読出しとデータアクセスを分離する。","quizId":"U-03-Y05"}},{"id":"03-Y06","title":"入出力インタフェース・接続形態・ドライバ","explain":"\u003cp>USBは汎用機器、Thunderboltは高速周辺機器、RS-232Cはシリアル通信、HDMIとDisplayPortは映像・音声等、SATAは記憶装置、FC（ファイバチャネル）はストレージネットワーク等で使う。無線PAN（個人範囲網）のBluetoothやBLE（低消費電力Bluetooth）、ZigBeeやWi-SUNは近距離機器・センサ等に利用する。IrDAは赤外線、NFC（近距離無線通信）はごく近距離の通信。距離・消費電力・帯域・接続台数で選ぶ。\u003c/p>","worked":"\u003cp>\u003cb>USB機器を接続すると自動認識し、電源を切らず取り外せる。この二つの機能は？\u003c/b>\u003c/p>\u003cp>自動認識・設定はプラグアンドプレイ、通電中の着脱はホットプラグ。\u003c/p>","prompt":"USB機器を接続すると自動認識し、電源を切らず取り外せる。この二つの機能は？","answer":"\u003cp>自動認識・設定はプラグアンドプレイ、通電中の着脱はホットプラグ。\u003c/p>","textbook":[{"heading":"装置に合わせた接続","body":"USBは汎用機器、Thunderboltは高速周辺機器、RS-232Cはシリアル通信、HDMIとDisplayPortは映像・音声等、SATAは記憶装置、FC（ファイバチャネル）はストレージネットワーク等で使う。無線PAN（個人範囲網）のBluetoothやBLE（低消費電力Bluetooth）、ZigBeeやWi-SUNは近距離機器・センサ等に利用する。IrDAは赤外線、NFC（近距離無線通信）はごく近距離の通信。距離・消費電力・帯域・接続台数で選ぶ。"},{"heading":"接続形態と転送方式","body":"スター接続は中心機器に各装置を接続、ツリー接続は階層化、カスケードは機器を段階接続、デイジーチェーンは装置を順につなぐ。ターミネータは伝送路端で反射を抑えるために使う場合がある。UART（汎用非同期送受信器）は非同期シリアルデータの送受信を担う。アナログは連続値、デジタルは離散値を扱う。"},{"heading":"OSと装置の橋渡し","body":"デバイスドライバはOSの要求を機器固有の制御へ変換する。プラグアンドプレイは接続機器を自動認識して資源やドライバを設定する仕組み、ホットプラグは電源を切らず着脱可能な性質。両者は同じではない。DMA（直接記憶アクセス）ではCPUの代わりに制御器がデータ転送し、チャネル制御方式では専用の入出力処理装置が複数の入出力操作を制御する。"}],"beginner":{"scenario":"装置に合わせた接続から順に、接続形態と転送方式、OSと装置の橋渡しを理解する。","trap":"OSの要求を機器固有の処理に変換する。","quizId":"U-03-Y06"}},{"id":"03-Y07","title":"入力・表示・印刷装置の原理","explain":"\u003cp>マウスやトラックボールは位置指定、デジタイザやペンタブレットは座標・筆圧等、ジョイスティックは方向等を入力する。Nキーロールオーバーは同時押下を認識する能力。OCR（光学式文字認識）は文字画像を文字列に、OMR（光学式マーク読取）は塗りつぶされた位置等を読み取る。バーコードは光学的な符号、磁気カードは磁気記録、ICカードは半導体回路の情報を読む。生体認証装置は指紋等の特徴を取得する。\u003c/p>","worked":"\u003cp>\u003cb>マークシートの塗りつぶしと手書き文字を読む。\u003c/b>\u003c/p>\u003cp>塗りつぶし位置はOMR、文字そのものの認識はOCRが代表的。\u003c/p>","prompt":"マークシートの塗りつぶしと手書き文字を読む。","answer":"\u003cp>塗りつぶし位置はOMR、文字そのものの認識はOCRが代表的。\u003c/p>","textbook":[{"heading":"人から機械への入力","body":"マウスやトラックボールは位置指定、デジタイザやペンタブレットは座標・筆圧等、ジョイスティックは方向等を入力する。Nキーロールオーバーは同時押下を認識する能力。OCR（光学式文字認識）は文字画像を文字列に、OMR（光学式マーク読取）は塗りつぶされた位置等を読み取る。バーコードは光学的な符号、磁気カードは磁気記録、ICカードは半導体回路の情報を読む。生体認証装置は指紋等の特徴を取得する。"},{"heading":"画面に画像を出す","body":"液晶は光の透過を制御し、TFT（薄膜トランジスタ）は画素の能動制御、STN液晶は液晶分子のねじれを利用する方式。OLED（有機EL）は画素自体が発光し、電子ペーパーは低電力で表示を保持しやすい。インタレースは走査線を交互に、ノンインタレースは順次描画する。パックトピクセルは各画素の色成分をまとめ、プレーナピクセルは成分やビット面ごとに分ける。VGA等の解像度規格、HMD（頭部装着表示器）、視線追跡、触覚提示も用途で区別する。"},{"heading":"印刷・音声・出力","body":"インパクトプリンタは打撃で印字、ノンインパクトは打撃を用いない。シリアルは文字単位、ラインは行単位、ページプリンタはページ単位の処理を行う分類。レーザーはトナーを用い、インクジェットはインクを噴射、3Dプリンタは材料を積層等して立体を作る。プロッタは図面出力等、D/A変換器は数値をアナログ信号へ変換し音声等に利用する。"}],"beginner":{"scenario":"人から機械への入力から順に、画面に画像を出す、印刷・音声・出力を理解する。","trap":"有機ELは発光材料で画素を発光させる。","quizId":"U-03-Y07"}},{"id":"03-Y08","title":"補助記憶装置・媒体とアクセス時間","explain":"\u003cp>磁気ディスクの同心円がトラック、同じ半径のトラック群がシリンダ、トラックの分割がセクタ。仮に4記録面、各1000トラック、各200セクタ、1セクタ512Bなら容量は4×1000×200×512＝409600000B。実機は記録位置によってセクタ数が異なることもある。アクセスアームが磁気ヘッドを移動しスピンドルがディスクを回転させる。\u003c/p>","worked":"\u003cp>\u003cb>7200rpmの平均回転待ちは？\u003c/b>\u003c/p>\u003cp>1回転60000/7200＝約8.33ms、その半分で約4.17ms。\u003c/p>","prompt":"7200rpmの平均回転待ちは？","answer":"\u003cp>1回転60000/7200＝約8.33ms、その半分で約4.17ms。\u003c/p>","textbook":[{"heading":"HDDの位置と容量","body":"磁気ディスクの同心円がトラック、同じ半径のトラック群がシリンダ、トラックの分割がセクタ。仮に4記録面、各1000トラック、各200セクタ、1セクタ512Bなら容量は4×1000×200×512＝409600000B。実機は記録位置によってセクタ数が異なることもある。アクセスアームが磁気ヘッドを移動しスピンドルがディスクを回転させる。"},{"heading":"アクセス時間を求める","body":"平均アクセス時間は通常、平均シーク時間＋平均回転待ち時間＋データ転送時間。6000rpmなら毎秒100回転、1回転10ms、平均回転待ち5ms。シーク8ms、転送1msなら計14ms。デフラグメンテーションは断片化したデータを整理しHDDの移動を減らす場合がある。SSDではウェアレベリングで書込みを分散し、書換え寿命の偏りを抑える。"},{"heading":"媒体の使い分け","body":"CD-ROMやDVD-ROMは読出し専用、CD-R等は追記型、CD-RWやDVD-RAM等は書換型。ブルーレイは光ディスク。SD/SDHC/SDXCは容量等の規格が異なる。磁気テープやDATは主に順次アクセスで長期保管等に利用し、ブロック間隔（IBG）やブロック化因数が容量・効率に関係する。ボリュームは論理的な記憶単位、ラベルは識別情報。MAID（休止ディスクを多数用いる記憶構成）はアクセスが少ないディスクを休止させ電力を削減する考え方。"}],"beginner":{"scenario":"HDDの位置と容量から順に、アクセス時間を求める、媒体の使い分けを理解する。","trap":"平均回転待ちは5ms。7＋5＋2＝14ms。","quizId":"U-03-Y08"}}],"beginnerIntro":"CPU・メモリ・入出力装置がどう協力するかを学ぶ。速度計算では秒、Hz、ビットとバイトをそろえる。"},{"id":4,"title":"システム構成・性能評価","group":"テクノロジ","priority":"A重要","summary":"可用性、冗長構成、稼働率、処理能力・信頼性を定量評価。","lessons":[{"title":"性能の3指標","body":"スループットは単位時間の処理件数、レスポンスタイムは要求から応答まで、ターンアラウンドタイムは投入から完了まで。ボトルネックは最も制約の強い資源。","check":"それぞれの時間の始点と終点を図にする。"},{"title":"可用性の算出","body":"稼働率A=MTBF/(MTBF+MTTR)。MTBF（Mean Time Between Failures：平均故障間隔）が大きくMTTR（Mean Time To Repair：平均修復時間）が小さいほど高い。","check":"MTBFと平均故障時間を混同しない。"},{"title":"直列と並列の冗長化","body":"独立した機器の直列システムは全台稼働が必要なので稼働率の積。並列冗長でどれか1台動けばよい場合は1−故障率の積。","check":"冗長化は故障が独立という前提に依存。"},{"title":"システム構成","body":"負荷分散は複数装置に仕事を分配し、フェイルオーバーは故障時に待機側へ切り替える。ホットスタンバイは迅速に切り替えやすいが費用がかかる。","check":"負荷分散と冗長化は関連するが同じではない。"},{"title":"容量計画","body":"最大負荷に余裕を持たせたサイジングを行い、実測値で予測を修正する。CPU使用率が高まると待ち時間が非線形に増える場合がある。","check":"ピーク時と平均時の両方を試算。"}],"terms":[{"term":"スループット","definition":"単位時間に処理できる仕事量"},{"term":"レスポンスタイム","definition":"要求を出してから応答が得られるまでの時間"},{"term":"ターンアラウンドタイム","definition":"処理依頼から結果全体が完了するまでの時間"},{"term":"MTBF","definition":"修理可能な装置の故障と故障の間の平均動作時間"},{"term":"MTTR","definition":"故障後の修理に要する平均時間"},{"term":"可用性","definition":"必要なときにシステムが利用できる度合い"},{"term":"フェイルオーバー","definition":"障害発生時に待機系へ自動・手動で切り替えること"},{"term":"ロードバランサ","definition":"複数のサーバーに処理負荷を振り分ける装置・機能"},{"term":"ホットスタンバイ","definition":"待機系を稼働状態で準備し迅速に切り替える構成"},{"term":"スケールアウト","definition":"サーバーなどの台数を増やして能力を拡張する方法"}],"questions":[{"id":"Q04-01","chapter":4,"kind":"applied","q":"MTBF=990時間、MTTR=10時間の稼働率は。","options":["90%","95%","99%","99.9%"],"correct":2,"explain":"990/(990+10)=0.99。"},{"id":"Q04-02","chapter":4,"kind":"applied","q":"独立して稼働率0.9の装置2台を並列にし1台動けばよい場合の稼働率は。","options":["0.81","0.90","0.95","0.99"],"correct":3,"explain":"両方停止する確率0.1×0.1=0.01を1から引く。"},{"id":"Q04-03","chapter":4,"kind":"applied","q":"応答時間は変わらず1秒間の処理完了数が増えたとき改善した指標は。","options":["稼働率","スループット","故障率","平均修復時間"],"correct":1,"explain":"単位時間の処理件数はスループット。"},{"id":"D04-01","chapter":4,"kind":"applied","q":"並列化できる部分が80%、4台並列で追加コストを無視した理論的な速度向上比はどれか。","options":["1.25倍","2.5倍","3.2倍","4倍"],"correct":1,"explain":"Amdahlの法則1/(0.2＋0.8/4)=2.5倍。直列部分が高速化を制限する。"},{"id":"D04-02","chapter":4,"kind":"applied","q":"故障が独立で、装置Aの稼働率0.90、Bの稼働率0.80の並列冗長構成の稼働率はどれか。","options":["0.72","0.80","0.90","0.98"],"correct":3,"explain":"どちらかが稼働すればよいので1−(1−0.9)(1−0.8)=0.98。"},{"id":"D04-03","chapter":4,"kind":"applied","q":"RPOが15分、RTOが2時間のシステムで目標としているものはどれか。","options":["最大2時間前のデータに戻し15分以内に復旧","最大15分前のデータに戻し2時間以内に復旧","必ずデータ損失ゼロで2時間以内に復旧","停止が2時間以内ならデータ損失は任意"],"correct":1,"explain":"RPOは目標復旧時点（許容するデータ損失の時間幅）、RTOは目標復旧時間。"},{"id":"Q-04-X01","chapter":4,"kind":"applied","q":"サーバを追加するのではなく既存機のメモリを増やすことは？","options":["スケールアウト","スケールアップ","フェイルオーバー","バックアップ"],"correct":1,"explain":"スケールアップ。"},{"id":"U-04-1","chapter":4,"kind":"applied","q":"単位時間当たりの処理完了件数は？","options":["レスポンスタイム","MTTR","スループット","稼働率"],"correct":2,"explain":"スループットは処理件数/時間、応答時間は一要求の所要時間。"},{"id":"U-04-2","chapter":4,"kind":"applied","q":"直列部分25%の処理を無限に並列化した場合の理論最大高速化率は？","options":["25倍","0.25倍","無限倍","4倍"],"correct":3,"explain":"残る時間比0.25の逆数は4。"},{"id":"U-04-3","chapter":4,"kind":"applied","q":"独立で稼働率0.8の2台が両方必要なシステムの稼働率は？","options":["0.64","0.96","0.8","0.4"],"correct":0,"explain":"直列は両方正常なので0.8×0.8。0.96は並列。"},{"id":"U-04-4","chapter":4,"kind":"applied","q":"復元40分、ログ適用15分、確認10分を順次実施。RTO60分は達成できるか？","options":["達成（40分）","未達（65分）","達成（55分）","達成（15分）"],"correct":1,"explain":"作業時間を合計すると65分で目標を超える。"},{"id":"U-04-X01","chapter":4,"kind":"applied","q":"複数の仮想マシンを実行・管理する基盤は？","options":["コンパイラ","デバッガ","ハイパーバイザ","ロードバランサ"],"correct":2,"explain":"ハイパーバイザは物理資源を仮想機へ割り当てる。"},{"id":"U-04-Y01","chapter":4,"kind":"applied","q":"インフラ構成をコードで管理し再現可能にする実践は？","options":["IaC","RPO","SJF","OCR"],"correct":0,"explain":"構成をコードで定義し自動化・版管理する。"},{"id":"U-04-Y02","chapter":4,"kind":"applied","q":"ファイル単位で共有するネットワーク接続記憶装置は？","options":["SANのみ","NAS","CPU","FPU"],"correct":1,"explain":"NASはファイル共有を提供する。"},{"id":"U-04-Y03","chapter":4,"kind":"applied","q":"故障率が初期に高く低下し、その後摩耗により上昇する特性は？","options":["ROC曲線","パレート図","バスタブ曲線","損益分岐点"],"correct":2,"explain":"初期・偶発・摩耗故障期の故障率の変化を示す。"}],"deepIntro":"システム性能は「処理能力」「待ち」「壊れたときの振る舞い」を分けて評価する。","deep":[{"id":"04-1","title":"性能指標とボトルネック","explain":"\u003cp>応答時間は要求から結果を受け取るまでの時間、スループットは単位時間の処理件数、ターンアラウンドタイムは投入から完了までの時間。利用率が上がれば処理能力が上がったように見えるが、待ち行列による応答時間悪化がある。ボトルネックはCPU、メモリ、ディスク、ネットワーク、ロック、外部APIなど複数候補を測って特定する。\u003c/p>\n\u003cp>ベンチマークでは同じ負荷条件、データ量、測定時間、ウォームアップ条件を揃える。ピーク性能だけでなくp95（95パーセンタイル）応答時間を見れば「大多数は速いが一部は極端に遅い」状態も見つかる。\u003c/p>\n","worked":"\u003cp>毎秒100件到着し、平均滞在時間が0.2秒の定常システムなら、リトルの法則L＝λW＝100×0.2＝平均20件が処理中または待機中。CPUが20個という意味ではない。\u003c/p>\n","prompt":"CPU使用率30%なのに応答時間が長い場合、CPU増設だけで改善するか。","answer":"\u003cp>断定できない。I/O待ち、ロック、下流システムの遅延を調べる。\u003c/p>\n","beginner":{"scenario":"受付100件/秒、決済30件/秒、発送80件/秒の直列工程は最大30件/秒。受付を増強しても全体の能力は改善しない。","trap":"応答時間の短さとスループットの高さは別。","quizId":"U-04-1"},"textbook":[{"heading":"性能指標を分けて考える","body":"レストランで一人が入店から料理を受け取る時間と、1時間に提供できる料理数は別です。レスポンスタイムは要求から応答まで、ターンアラウンドタイムは処理依頼から全処理完了まで、スループットは単位時間に完了する件数です。バッチ処理はまとめて処理し、オンライン処理は個別要求に応答します。"},{"heading":"ボトルネックを探す","body":"受付毎秒100件、処理毎秒40件、保存毎秒80件なら、直列の全体能力は毎秒40件です。受付を200件にしても改善しません。各工程の利用率や待ち時間、CPU・メモリ・ディスク・ネットワークの測定から制約を探します。"},{"heading":"測定条件を確認する","body":"ベンチマークは一定の負荷条件で性能を測ることです。平均応答時間だけでは遅い一部の要求を見落とすため、95パーセンタイルなどの指標も使います。負荷試験では想定利用者数や要求パターンを再現し、性能が不足する箇所を確認します。"}]},{"id":"04-2","title":"直列・並列・Amdahlの法則","explain":"\u003cp>並列化できる割合p、プロセッサ数n、並列化以外の追加コストを無視すると、速度向上比はS(n)=1/[(1−p)+p/n]。直列部分(1−p)が並列化による改善を制限する（Amdahlの法則）。スケールアップは単体装置の増強、スケールアウトは装置の台数増。分散システムでは通信コスト・同期・障害処理があるので理論式は上限の目安である。\u003c/p>\n","worked":"\u003cp>80%が並列化可能で4台使うならS=1/(0.2+0.8/4)=2.5倍。100台にしても極限は1/0.2=5倍。80%×4=3.2倍と単純計算しない。\u003c/p>\n","prompt":"並列可能率が50%の場合、台数を無限に増やした理論上限は。","answer":"\u003cp>2倍。\u003c/p>\n","beginner":{"scenario":"10秒の処理のうち直列2秒、並列8秒。4台なら2＋8/4＝4秒、速度向上10/4＝2.5倍。","trap":"台数を増やしても直列部分は残る。","quizId":"U-04-2"},"textbook":[{"heading":"並列化できる仕事とできない仕事","body":"料理を4人で作ってもオーブンが一つで順にしか焼けなければ、焼く時間は減りません。プログラムでもデータ依存や順次処理のため並列化できない部分があります。元の処理時間を1、並列化できる割合をp、並列数をNとすると新しい処理時間比は(1−p)＋p/Nです。"},{"heading":"高速化率の計算","body":"元の処理10秒のうち8秒を4台に均等分割すると、並列部分2秒＋直列部分2秒＝4秒。高速化率は10/4＝2.5倍。一般式はS=1/((1−p)＋p/N)です。無限に台数を増やしても直列部分が残るので、最大値は1/(1−p)です。"},{"heading":"現実との差","body":"通信、同期、分割の偏り、資源競合には時間がかかります。Amdahlの法則は問題の規模を一定にして理想的な並列化を考えるモデルなので、現実の速度を保証しません。台数を増やすより直列部分そのものを改善する方が有効な場合があります。"}]},{"id":"04-3","title":"可用性・直列並列冗長化・信頼性","explain":"\u003cp>稼働率Aは利用可能時間/全時間の割合。平均故障間隔MTBF（Mean Time Between Failures）と平均修復時間MTTR（Mean Time To Repair）を用いる単純モデルではA＝MTBF/(MTBF+MTTR)。部品が独立して故障するなら、全て必要な直列構成はA全体＝A₁×A₂、いずれか稼働すれば動く並列冗長構成はA全体＝1−(1−A₁)(1−A₂)。共通原因故障があると独立の仮定は崩れる。\u003c/p>\n\u003cp>フェイルオーバーは障害発生時に待機系へ切り替えること。ホットスタンバイは待機系を動作状態に近く保ち、切替時間を短くできる。負荷分散装置が単一障害点にならないよう設計する。\u003c/p>\n","worked":"\u003cp>独立した装置A=0.9、B=0.8の並列稼働率は1−0.1×0.2=0.98。直列なら0.9×0.8＝0.72。「並列＝掛け算」と誤らない。\u003c/p>\n","prompt":"99.9%稼働率なら年間停止許容時間は約何時間か。","answer":"\u003cp>365×24×0.001＝8.76時間（単純計算）。\u003c/p>\n","beginner":{"scenario":"平均90時間稼働し10時間修復する機器の稼働率は90/(90＋10)＝0.9。独立な2台のどちらかが動けば0.99。","trap":"共通電源の故障などで独立性が成り立たない場合がある。","quizId":"U-04-3","lab":{"title":"直列・並列が混ざるシステム","problem":"ルータ稼働率0.99、その先のWebサーバ2台は各0.9で少なくとも1台必要。DB稼働率0.98。独立故障を仮定。全体稼働率は？","steps":["Web群は両方停止が0.1×0.1＝0.01なので稼働率0.99。","ルータ、Web群、DBのすべてが稼働する必要があるため直列。","0.99×0.99×0.98＝0.960498。","約96.05%。サーバ群だけ冗長化しても他の単一障害点が残る。"],"answer":"約96.05%","check":"並列部分を一つの装置として先に計算し、直列部分と掛け合わせる。"}},"textbook":[{"heading":"故障と修復を時間で考える","body":"機器は正常稼働と停止・修復を繰り返します。MTBF（平均故障間隔）は修理可能な機器の平均稼働時間の指標、MTTR（平均修復時間）は復旧までの平均時間です。定常的な基本モデルの稼働率はMTBF/(MTBF＋MTTR)。故障を減らすか修復を速くすると稼働率が上がります。"},{"heading":"直列・並列の違い","body":"二つとも正常でないと動かない直列構成では独立なら稼働率A×B。どちらか動けばよい並列構成では両方停止する確率(1−A)(1−B)を1から引きます。稼働率0.9の2台なら直列0.81、並列0.99です。"},{"heading":"冗長化の設計","body":"ホットスタンバイは待機系を稼働状態に近く保ち、コールドスタンバイは必要時に起動します。フェイルオーバーは故障時の切替、フェイルバックは復旧後の戻しです。共通の電源やネットワークが単一障害点なら独立故障の計算は成立しません。切替時間・失敗の可能性も評価します。"}]},{"id":"04-4","title":"バックアップ・復旧目標・容量設計","explain":"\u003cp>RTO（Recovery Time Objective：目標復旧時間）は事故から業務を再開するまでの目標時間。RPO（Recovery Point Objective：目標復旧時点）は何分・何時間前までのデータ損失を許容するかを示す。例：RTO=2時間、RPO=15分なら、2時間以内の再開と最大15分前までへのデータ復旧を設計する。RPOを短くするには同期・非同期レプリケーションやログ転送、RTOを短くするには待機環境や復旧手順の自動化が効く。\u003c/p>\n\u003cp>容量計画は平均負荷だけでなくピーク、成長率、冗長化時の片系運転、バックアップ容量を考える。バックアップは復旧訓練で実際に読めるかを確かめる。障害対応の「稼働率」と「データ損失量」は別の軸である。\u003c/p>\n","worked":"\u003cp>1日10GB増えるDBを60日保持し、日次差分と週次フルを併用する場合、必要容量は単純な10×60だけでは求められない。フルの時点・変更量・圧縮・世代数を明示して合計する。\u003c/p>\n","prompt":"RTOを1時間から15分に改善したらRPOも改善するか。","answer":"\u003cp>別指標なので必ずしも改善しない。\u003c/p>\n","beginner":{"scenario":"12時に障害、最終保全11時50分、復旧12時40分なら失う更新は最大10分、復旧時間40分。","trap":"RPOは許容するデータ損失時間、RTOは許容復旧時間。","quizId":"U-04-4"},"textbook":[{"heading":"障害から何を取り戻すか","body":"RTO（Recovery Time Objective：復旧時間目標）は停止から何時間以内に戻すか、RPO（Recovery Point Objective：復旧時点目標）はどの時点までのデータを回復するかです。1日1回のバックアップだけなら最悪約1日分の変更を失う可能性があります。ログを頻繁に保全すればRPOを短くできる場合があります。"},{"heading":"バックアップの方式","body":"フルは全データ、差分は直近フル以降の変更、増分は直近バックアップ以降の変更を保存します。差分復元はフルと最新差分、増分復元はフルと必要なすべての増分が基本です。取得時間・容量・復元時間が異なります。"},{"heading":"容量と事業継続","body":"毎日20GB増え30日保持するなら変更量だけで600GBを見込み、圧縮率、冗長化、世代数、増加傾向を追加します。遠隔地への保全、アクセス権分離、復元試験も必要です。BCP（事業継続計画）は災害などで重要業務を継続・復旧する計画で、ITの復旧はその一部です。"}]},{"id":"04-X01","title":"システム方式・分散処理・仮想化","explain":"\u003cp>集中処理は一つの計算機に処理を集め、クライアントサーバ方式は要求側と提供側に分ける。シンクライアントは端末の処理・保存機能を抑え、サーバ側に集約する。クラスタは複数の計算機を協調させ、負荷分散や可用性向上を狙う。デュアルシステムは結果の照合など、デュプレックスシステムは主系と待機系の切替などを利用する。\u003c/p>\u003cp>ハイパーバイザは仮想マシンを実行し、コンテナは一般にホストOSのカーネルを共有する。スケールアップは一台の能力向上、スケールアウトは台数追加。RASISは信頼性・可用性・保守性・完全性・安全性を示す。ベンチマークで性能を測り、TCO（総保有費用）では導入から運用・廃棄までの費用を考える。\u003c/p>","worked":"\u003cp>アクセス急増に対し同一Webサーバを3台から5台に増やし負荷分散するのはスケールアウト。DBが限界ならWebサーバ増加だけでは改善しない。\u003c/p>","prompt":"サーバを追加するのではなく既存機のメモリを増やすことは？","answer":"\u003cp>スケールアップ。\u003c/p>","beginner":{"scenario":"Web画面は端末、業務処理はサーバ、データはDBサーバに分担できる。Webの負荷が増えればサーバを追加して振り分ける。","trap":"同一物理機上の仮想機は物理機の共通故障に弱い。","quizId":"U-04-X01"},"textbook":[{"heading":"機能をどこに置くか","body":"集中処理は中心計算機へ処理を集めます。クライアントサーバ方式は利用側と提供側を分離し、3層構成では表示・業務処理・データ管理を分けます。シンクライアントは端末の処理・保存を抑え、中心側で管理する方式です。分散処理は複数機器へ仕事を分けます。"},{"heading":"可用性と性能のための構成","body":"クラスタは複数計算機の協調で性能や可用性を向上させます。ロードバランサは要求を複数サーバへ分配。スケールアップは一台を強化、スケールアウトは台数追加です。デュアルシステムは同じ処理の結果照合など、デュプレックスは主系・待機系の切替などを利用します。"},{"heading":"仮想化と費用","body":"ハイパーバイザは物理機上で複数の仮想マシンを動かし、それぞれに資源を割り当てます。コンテナは一般にOSのカーネルを共有し実行環境を分離します。仮想化しても物理故障は共通になり得ます。TCO（総保有費用）は購入・導入・運用・保守・廃棄の費用を合計します。RASISは信頼性・可用性・保守性・完全性・安全性の評価観点です。"}]},{"id":"04-Y01","title":"分散システム・仮想化・クラウドの設計","explain":"\u003cp>水平負荷分散は同種処理を複数機器で分担、水平機能分散は部門や業務など同じ階層で機能を分け、垂直機能分散は画面・業務・DB等の階層間で機能を分ける。ピアツーピアは端末同士が対等に通信、グリッドは分散した計算資源をまとめて利用する。HPC（高性能計算）は大規模並列等で科学計算などを実行する。RPC（遠隔手続呼出し）は別計算機の処理を呼び出す。ストアドプロシージャはDB側で保存・実行する処理。\u003c/p>","worked":"\u003cp>\u003cb>仮想マシンを動かしたまま別ホストへ移したい。\u003c/b>\u003c/p>\u003cp>ライブマイグレーションが候補。対応する共有記憶・ネットワーク等の条件を確認する。\u003c/p>","prompt":"仮想マシンを動かしたまま別ホストへ移したい。","answer":"\u003cp>ライブマイグレーションが候補。対応する共有記憶・ネットワーク等の条件を確認する。\u003c/p>","textbook":[{"heading":"分散する対象を区別する","body":"水平負荷分散は同種処理を複数機器で分担、水平機能分散は部門や業務など同じ階層で機能を分け、垂直機能分散は画面・業務・DB等の階層間で機能を分ける。ピアツーピアは端末同士が対等に通信、グリッドは分散した計算資源をまとめて利用する。HPC（高性能計算）は大規模並列等で科学計算などを実行する。RPC（遠隔手続呼出し）は別計算機の処理を呼び出す。ストアドプロシージャはDB側で保存・実行する処理。"},{"heading":"共有の度合いと仮想化","body":"シェアードエブリシングは記憶等を広く共有し整合性管理が必要、シェアードナッシングはノードごとに資源を分け拡張性を得やすい。ホスト型仮想化はホストOS上で、ハイパーバイザ型は物理機上などで仮想マシンを管理する。VDI（デスクトップ仮想化基盤）は端末から中央の仮想デスクトップを利用する。ライブマイグレーションは稼働中の仮想マシンを別ホストへ移す技術で短い停止等が生じ得る。サーバコンソリデーションは複数の業務を少数の物理機へ集約する。"},{"heading":"クラウドの自動化","body":"IaC（Infrastructure as Code：インフラのコード化）は構成をコードで記述し再現・変更管理をしやすくする。FaaS（機能実行サービス）はイベントなどで関数を実行する方式、サーバレスはサーバ管理を利用者から抽象化する考え方。物理サーバが存在しないという意味ではない。エッジ計算は発生源の近くで処理し、クラウドとの間で遅延や通信量、運用性を比較する。"}],"beginner":{"scenario":"分散する対象を区別するから順に、共有の度合いと仮想化、クラウドの自動化を理解する。","trap":"構成をコードで定義し自動化・版管理する。","quizId":"U-04-Y01"}},{"id":"04-Y02","title":"ストレージネットワーク・RAID・障害時の継続","explain":"\u003cp>NAS（ネットワーク接続ストレージ）はファイル単位で共有し、SAN（ストレージ専用ネットワーク）は一般にブロック単位の記憶を提供する。FC-SANはファイバチャネル、IP-SANはIP網を利用する。ブロックストレージは固定長ブロックを読み書きしOS等がファイルを管理、オブジェクトストレージはデータ・識別子・メタデータをオブジェクトとして管理する。\u003c/p>","worked":"\u003cp>\u003cb>2TBのディスク4台をRAID10で構成する。\u003c/b>\u003c/p>\u003cp>通常2組のミラーをストライピングするので4TB。各組から1台ずつなら2台故障に耐え得るが同じ組の2台は不可。\u003c/p>","prompt":"2TBのディスク4台をRAID10で構成する。","answer":"\u003cp>通常2組のミラーをストライピングするので4TB。各組から1台ずつなら2台故障に耐え得るが同じ組の2台は不可。\u003c/p>","textbook":[{"heading":"ストレージへの接続単位","body":"NAS（ネットワーク接続ストレージ）はファイル単位で共有し、SAN（ストレージ専用ネットワーク）は一般にブロック単位の記憶を提供する。FC-SANはファイバチャネル、IP-SANはIP網を利用する。ブロックストレージは固定長ブロックを読み書きしOS等がファイルを管理、オブジェクトストレージはデータ・識別子・メタデータをオブジェクトとして管理する。"},{"heading":"RAIDの追加方式","body":"RAID10はミラーの組をストライピングする構成で、4台なら容量は通常2台分。RAID2はハミング符号、RAID3はバイト単位等の分散と専用パリティ、RAID4はブロック単位の分散と専用パリティ、RAID5は分散パリティ。RAID6は二重パリティ。チャンクサイズは分散の単位。RAID10は同じミラー組の全台が故障すると失われ得るため単純に故障台数だけで耐性を決めない。"},{"heading":"障害対策の目的","body":"アクティブ・スタンバイは稼働系と待機系、アクティブ・アクティブは複数系を通常時も利用する。ホットサイトは災害時に即時に近く切替可能な設備、ウォームサイトは一定の準備、コールドサイトは設備等の立上げが必要。フォールトマスキングは故障の影響を隠す仕組み、フォールトアボイダンスは故障を起こしにくくする設計。フェールソフトは機能を縮退して継続、フェールセーフは安全状態へ移行する。"}],"beginner":{"scenario":"ストレージへの接続単位から順に、RAIDの追加方式、障害対策の目的を理解する。","trap":"NASはファイル共有を提供する。","quizId":"U-04-Y02"}},{"id":"04-Y03","title":"性能評価・容量計画・信頼性と経済性","explain":"\u003cp>SPEC（標準性能評価団体）のベンチマークには整数・浮動小数点処理等の評価があり、TPCは取引処理等のベンチマークを策定する。ギブソンミックスは命令の構成比による性能評価の考え方。システムモニタで実際の負荷と応答時間を把握し、サイジング（必要資源の見積り）、プロビジョニング（資源の準備・割当て）を行う。例えば平均40件/秒の能力に対しピーク60件/秒が来るなら処理増強か待ち許容時間を検討する。\u003c/p>","worked":"\u003cp>\u003cb>A初期100、年40、B初期180、年20万円。どの年で同額になる？\u003c/b>\u003c/p>\u003cp>100＋40n＝180＋20nよりn＝4年。\u003c/p>","prompt":"A初期100、年40、B初期180、年20万円。どの年で同額になる？","answer":"\u003cp>100＋40n＝180＋20nよりn＝4年。\u003c/p>","textbook":[{"heading":"性能を測って計画する","body":"SPEC（標準性能評価団体）のベンチマークには整数・浮動小数点処理等の評価があり、TPCは取引処理等のベンチマークを策定する。ギブソンミックスは命令の構成比による性能評価の考え方。システムモニタで実際の負荷と応答時間を把握し、サイジング（必要資源の見積り）、プロビジョニング（資源の準備・割当て）を行う。例えば平均40件/秒の能力に対しピーク60件/秒が来るなら処理増強か待ち許容時間を検討する。"},{"heading":"故障率の時間変化","body":"バスタブ曲線では初期故障期に故障率が低下、偶発故障期は概ね一定、摩耗故障期は上昇する。初期不良検査、予防交換等を故障特性に合わせる。RASIS（信頼性・可用性・保守性・完全性・安全性）は止まりにくさだけでなく復旧しやすさやデータ保護も評価する。稼働率は故障率そのものとは異なり修復時間にも依存する。"},{"heading":"総費用で比較する","body":"TCO（総保有費用）は導入・運用・保守・廃棄等を含む。初期費用A100万円・年費用40万円、B180万円・年費用20万円なら5年総額はA300万円、B280万円。初期コストだけでは判断できない。直接コストは購入・保守など直接帰属できる費用、間接コストは利用者の教育や停止に伴う業務負担等も考える。"}],"beginner":{"scenario":"性能を測って計画するから順に、故障率の時間変化、総費用で比較するを理解する。","trap":"初期・偶発・摩耗故障期の故障率の変化を示す。","quizId":"U-04-Y03"}}],"beginnerIntro":"複数機器でサービスを実現する構成を学ぶ。処理能力、可用性、復旧時間を区別して全体を図にする。"},{"id":5,"title":"オペレーティングシステム・ソフトウェア","group":"テクノロジ","priority":"A重要","summary":"プロセス、スレッド、排他制御、仮想記憶、ファイルシステム、OSS。","lessons":[{"title":"プロセスとスレッド","body":"プロセスは実行中のプログラムの資源単位。スレッドは同一プロセスでメモリ空間などを共有する実行単位で、共有状態に競合が起きる。","check":"スレッド間共有とプロセス間分離を区別。"},{"title":"排他制御とデッドロック","body":"排他制御は共有資源を同時に不整合な形で変更しないための仕組み。デッドロックは互いに資源の解放を待ち永久に進まない状態。資源獲得順序の統一が予防に有効。","check":"ロックの取得順序を具体例で追う。"},{"title":"スケジューリング","body":"ラウンドロビンは一定のタイムスライスごとにCPU利用を交代する。優先度方式では低優先度タスクの飢餓に注意。","check":"応答性とスループットはトレードオフ。"},{"title":"仮想記憶","body":"ページ単位に主記憶と補助記憶を入れ替える。ページフォールトは必要ページが主記憶にない状態。頻発するとスラッシングで性能が大きく下がる。","check":"ページングは容量拡張のため、キャッシュは速度改善のためという違いも押さえる。"},{"title":"OSSとライセンス","body":"OSS（Open Source Software：オープンソースソフトウェア）はライセンスに基づき利用・改変・再配布ができる。GPLは条件次第で派生作品のソース公開義務が生じる一方、MITは比較的緩やかなライセンス。","check":"OSSだから著作権がないわけではない。"}],"terms":[{"term":"プロセス","definition":"実行中プログラムの資源管理単位"},{"term":"スレッド","definition":"同一プロセス内で動く軽量な実行単位"},{"term":"セマフォ","definition":"共有資源にアクセスできる数を制御する同期手段"},{"term":"ミューテックス","definition":"相互排他のためのロック"},{"term":"デッドロック","definition":"複数処理が互いの資源解放を待ち停止する状態"},{"term":"ラウンドロビン","definition":"一定時間ごとに実行中タスクを切り替える方式"},{"term":"ページフォールト","definition":"必要な仮想記憶ページが主記憶上にない事象"},{"term":"スラッシング","definition":"ページの入替えが多発して処理性能が著しく落ちる状態"},{"term":"GPL","definition":"改変や再配布に一定のソース提供等の条件を付す自由ソフトウェアライセンス"},{"term":"ミドルウェア","definition":"OSとアプリケーションの間で共通機能を提供するソフトウェア"}],"questions":[{"id":"Q05-01","chapter":5,"kind":"applied","q":"デッドロックを予防する方法として適切なのは。","options":["資源取得順を全処理で統一する","ロック時間を無制限に延ばす","全処理の優先度を同じにする","スレッドを増やす"],"correct":0,"explain":"循環待ちが起こらない順序を定義する。"},{"id":"Q05-02","chapter":5,"kind":"applied","q":"ページフォールトが頻発しディスク交換ばかり行う現象は。","options":["キャッシュヒット","スラッシング","スプーリング","ポーリング"],"correct":1,"explain":"ページングが過度に発生すると処理が進まなくなる。"},{"id":"Q05-03","chapter":5,"kind":"applied","q":"スレッドに関して正しいのは。","options":["常に別の主記憶空間を持つ","同一プロセスで資源を共有し得る","スレッド間では競合しない","独立した実行単位ではない"],"correct":1,"explain":"同一プロセスのスレッドは共有メモリの競合に注意。"},{"id":"D05-01","chapter":5,"kind":"applied","q":"タスクAがXロックを保持してYを待ち、BがYを保持してXを待つときの問題はどれか。","options":["スラッシング","デッドロック","ページフォールト","キャッシュミス"],"correct":1,"explain":"循環待ちが形成され互いに進めない。ロック獲得順を統一するなどで防止する。"},{"id":"D05-02","chapter":5,"kind":"applied","q":"ページ枠が3つあり、参照列1,2,3,1,4をLRU方式で処理するとき、4の到着時に追い出すページはどれか。","options":["1","2","3","4"],"correct":1,"explain":"1を再参照したため最も長く参照されていないのは2。FIFO方式なら1を追い出す。"},{"id":"D05-03","chapter":5,"kind":"applied","q":"スレッドとプロセスの説明として適切なものはどれか。","options":["異なるプロセスは常に同じ仮想アドレス空間を共有する","同一プロセスのスレッドは通常アドレス空間を共有する","スレッドはCPU資源を消費しない","プロセス間通信は不要である"],"correct":1,"explain":"同一プロセス内のスレッドは通常アドレス空間を共有し、共有変数の競合に注意する。"},{"id":"Q-05-X01","chapter":5,"kind":"applied","q":"ブレークポイントでプログラムを止めて変数を調べるツールは？","options":["リンカ","デバッガ","ローダ","スプーラ"],"correct":1,"explain":"デバッガ。"},{"id":"U-05-1","chapter":5,"kind":"applied","q":"一定時間ずつ順番にCPUを割り当てる方式は？","options":["最短経路法","LRU","ライトバック","ラウンドロビン"],"correct":3,"explain":"タイムスライスごとに実行を切り替える方式。"},{"id":"U-05-2","chapter":5,"kind":"applied","q":"AはX保持でY待ち、BはY保持でX待ち。現象は？","options":["デッドロック","スラッシング","ページフォールト","オーバーフロー"],"correct":0,"explain":"互いに相手の資源解放を待ち進行不能になる。"},{"id":"U-05-3","chapter":5,"kind":"applied","q":"最も以前に読み込んだページを追い出す方式は？","options":["LRU","FIFO","ラウンドロビン","二分探索"],"correct":1,"explain":"FIFOは読込順、LRUは最後の参照時刻で決める。"},{"id":"U-05-4","chapter":5,"kind":"applied","q":"目的コードの外部参照を解決して結合するツールは？","options":["エディタ","デバッガ","リンカ","シェル"],"correct":2,"explain":"リンカは目的コードやライブラリを結合する。"},{"id":"U-05-X01","chapter":5,"kind":"applied","q":"ファイルシステム変更の記録を障害回復に利用する機能は？","options":["スプーリング","コンパイル","スケジューリング","ジャーナリング"],"correct":3,"explain":"変更の記録から整合性回復を支援する。スプーリングは入出力要求の蓄積。"},{"id":"U-05-Y01","chapter":5,"kind":"applied","q":"実行可能タスクにCPUを割り当てる機能は？","options":["リンカ","プロッタ","ハッシュ関数","ディスパッチャ"],"correct":3,"explain":"ディスパッチャは選択されたタスクを実行状態にする。"},{"id":"U-05-Y02","chapter":5,"kind":"applied","q":"可変区画で空き領域が離れてしまい十分な連続領域が得られない現象は？","options":["外部断片化","内部断片化のみ","デッドロック","キャッシュヒット"],"correct":0,"explain":"総空き量が足りても連続領域が不足する現象。"},{"id":"U-05-Y03","chapter":5,"kind":"applied","q":"メモリと同じアドレス空間に機器制御レジスタを配置する方式は？","options":["I/OマップドI/Oのみ","メモリマップドI/O","仮想マシン移行","スプーリング"],"correct":1,"explain":"メモリアクセス命令等で機器レジスタにアクセスする。"},{"id":"U-05-Y04","chapter":5,"kind":"applied","q":"アプリの骨組みや実行制御を提供する再利用基盤は？","options":["磁気テープ","メモリバンク","開発フレームワーク","パリティ"],"correct":2,"explain":"共通構造を提供して開発を支援する。"},{"id":"U-05-Y05","chapter":5,"kind":"applied","q":"論理レコードをまとめて物理レコードにする処理は？","options":["デブロッキング","コンパイル","ポーリング","ブロッキング"],"correct":3,"explain":"複数の論理レコードを一つの物理転送単位にする。"},{"id":"U-05-Y06","chapter":5,"kind":"applied","q":"プログラムを実行せず変数の未初期化等の疑いを調べる方法は？","options":["静的解析","負荷試験のみ","実機の動的追跡","増分バックアップ"],"correct":0,"explain":"静的解析はコード等から潜在的問題を検出する。"},{"id":"U-05-Y07","chapter":5,"kind":"applied","q":"コンテナの配置・スケーリング等を管理するOSSは？","options":["Grafana","Kubernetes","Selenium","Git"],"correct":1,"explain":"Kubernetesはコンテナオーケストレーション基盤。"}],"deepIntro":"OSはアプリとハードウェアの間で、CPU・メモリ・ファイル・入出力資源を安全に分配する。","deep":[{"id":"05-1","title":"プロセス・スレッド・スケジューリング","explain":"\u003cp>プロセスは実行中プログラムの独立した資源管理単位で、仮想メモリ空間などを持つ。スレッドはプロセス内の実行単位で、アドレス空間を共有するため通信しやすい反面、共有データの競合が起きる。コンテキストスイッチは実行状態を保存・復元する切替で、時間を消費する。\u003c/p>\n\u003cp>CPUスケジューリングは先着順（FCFS）、短いジョブ優先、ラウンドロビン、優先度方式など。ラウンドロビンは各タスクにタイムクォンタムを割り当て、応答性と切替オーバーヘッドのバランスを取る。高優先度に待たされ続ける低優先度タスクは飢餓状態（starvation）になる。\u003c/p>\n","worked":"\u003cp>到着時刻が同じでCPU時間が2,5,3のタスクをFCFSで2→5→3の順に処理すると完了時刻は2,7,10、平均待ち時間は(0+2+7)/3=3。処理時間を待ち時間に含めない。\u003c/p>\n","prompt":"スレッドを増やすとCPUバウンド処理が必ず速くなるか。","answer":"\u003cp>CPUコア数、同期、実行環境、切替負荷で制約される。\u003c/p>\n","beginner":{"scenario":"1台のCPUでAとBを交互に短時間実行すると同時に動くように見える。Aが入出力を待つ間にBを動かせばCPUを活用できる。","trap":"実行可能はCPU待ち、待ち状態は入出力・イベント待ち。","quizId":"U-05-1"},"textbook":[{"heading":"OSがないと何が困るか","body":"複数アプリが直接CPUやメモリ、画面、ディスクを使えば互いの処理を邪魔する可能性があります。OS（Operating System：基本ソフトウェア）は資源の割当てと保護、ファイル管理、入出力などを共通提供します。プロセスは実行中のプログラムの管理単位、スレッドはその内部の実行の流れです。同一プロセスのスレッドは通常アドレス空間を共有します。"},{"heading":"状態の移り変わり","body":"実行可能状態はCPUの割当てを待つ状態、実行状態はCPU上で動作中、待ち状態は入出力やイベントの完了を待つ状態です。実行中に入出力を要求すると待ち状態へ、完了通知で実行可能状態へ、スケジューラの割当てで実行へ移ります。"},{"heading":"スケジューリングの比較","body":"先着順は到着順で単純ですが長い処理が後続を待たせます。ラウンドロビンは短い時間ずつ交代し応答性を確保します。優先度方式は重要な処理を先に実行しますが、低優先度が長く待つ飢餓状態に注意します。プリエンプションはOSが実行中の処理を中断し別処理へ切り替えることです。"}],"walkthrough":{"heading":"CPUの割当てを時系列で追う","body":"タスクAの実行時間5ms、Bの実行時間3ms、双方が時刻0に到着し、Aを先に実行するとします。先着順ならAが0〜5ms、Bが5〜8msに実行され、完了時刻はA=5、B=8です。ラウンドロビンでタイムスライス2msならA(0〜2)、B(2〜4)、A(4〜6)、B(6〜7)、A(7〜8)となります。Bの応答開始は2msに改善しますが、Aの完了は遅くなります。切替コストを無視した例であり、実際は切替頻度を高くすると負担も増えます。","cols":["時刻(ms)","実行タスク","A残り","B残り"],"rows":[["0","開始","5","3"],["2","A完了区間","3","3"],["4","B完了区間","3","1"],["6","A完了区間","1","1"],["7","B完了","1","0"],["8","A完了","0","0"]]}},{"id":"05-2","title":"排他制御・デッドロック・同期","explain":"\u003cp>共有変数への読み書きが同時に行われ結果が実行順に依存する競合状態（race condition）には、ロック、セマフォ、メッセージパッシング、原子的操作などで対応する。ミューテックスは共有資源に1主体ずつアクセスするための排他、セマフォは許可数をカウントする同期機構。クリティカルセクションは排他的に実行すべき区間を指す。\u003c/p>\n\u003cp>デッドロックは互いが保持資源を解放せず、相手の資源を待ち続ける状態。典型的な成立条件は相互排除・保持と待機・横取り不可・循環待ち。全てのロックを一定順に獲得する設計で循環待ちを防げる。ライブロックは互いに動いているのに仕事が進まない状態。\u003c/p>\n","worked":"\u003cp>タスクAがロックXを取得後Yを待ち、タスクBがYを取得後Xを待てばデッドロックの可能性がある。両方が必ずX→Yの順で取る規約なら循環待ちを減らせる。\u003c/p>\n","prompt":"`x=x+1`は常に原子的か。","answer":"\u003cp>保証されない。読み取り・加算・書込みに分かれ得るため、環境に応じて同期が必要。\u003c/p>\n","beginner":{"scenario":"残高100をAが30、Bが20減らす。両者が先に100を読むとAが70、Bが80を書き、正しい50にならない。読取から書込まで保護する。","trap":"ロックは取得順序や保持時間を考える。増やせばよいわけではない。","quizId":"U-05-2"},"textbook":[{"heading":"なぜ排他制御が必要か","body":"共有変数の更新は読取り・計算・書込みの複数段階になることがあります。二つの処理が同じ古い値を読んで別々に書くと変更が失われます。クリティカルセクション（排他区間）を一度に一処理だけが実行できるようにします。ミューテックスは排他ロック、セマフォは利用可能な資源数などを管理する仕組みです。"},{"heading":"デッドロックが起こる条件","body":"資源を排他的に使い、保持したまま別資源を待ち、強制的に奪えず、循環待ちがあるとデッドロックが成立し得ます。例えばAが鍵Xを持ちYを待ち、BがYを持ちXを待つ場合です。全処理で資源の取得順を統一するなど循環待ちを防ぎます。"},{"heading":"同期と性能","body":"処理間の順序を調整する同期と、同時アクセスを防ぐ排他は関連しますが目的が異なります。ロックを長く持つと待ち時間が増え、優先度逆転が起きることもあります。保持範囲を必要最小限にし、例外時にも解放される設計にします。"}]},{"id":"05-3","title":"仮想記憶・ページ置換・ファイル","explain":"\u003cp>仮想記憶はページ単位で主記憶に割り当て、アクセス先ページが主記憶にないとページフォールトが発生する。FIFO（先入れ先出し）ページ置換は古いページを追い出す。LRU（Least Recently Used：最近最も使用されていない）方式は直近の参照履歴を使う。局所性の高いアクセスではキャッシュ効果が得られる。スラッシングは必要なページ入替えが頻発し、実際の計算が進まない現象。\u003c/p>\n\u003cp>ファイルシステムはディレクトリ、権限、メタデータ、空き領域を管理する。ジャーナリングはファイルシステムの更新操作の記録を保持し、障害後の整合性回復を助けるが、ユーザーデータの完全な保護を意味しない。\u003c/p>\n","worked":"\u003cp>ページ枠3つ、参照列1,2,3,1,4の場合、LRUでは最初の1,2,3で枠が埋まり、再参照1で最近使用が更新される。4が来たら最も古い2を置換する。FIFOなら最初に入った1を置換する。\u003c/p>\n","prompt":"仮想記憶を使う目的は単にHDDをRAMとして追加することか。","answer":"\u003cp>それだけではない。プロセスの独立したアドレス空間、保護、効率的なメモリ割当ても重要。\u003c/p>\n","beginner":{"scenario":"メモリをページという一定サイズに分け、必要なページを読み込む。A→B→Aと参照した場合、LRUで次に追い出すのはB。","trap":"スラッシングはページ入替えが頻発し処理が進まない状態。","quizId":"U-05-3","lab":{"title":"ページ置換を手で追う","problem":"ページ枠3個、初期空。参照列A,B,C,A,D,BをLRUで処理する。ページフォールト回数を求める。","steps":["A,B,Cを順に読み込み、3回フォールト。枠は[A,B,C]。","次のAはヒット。最終参照が最も古いのはBになる。","D参照でBを追い出してDを読み込む。4回目。枠[A,D,C]。","B参照で最終参照が最も古いCを追い出す。5回目。"],"answer":"5回","check":"LRUは最終使用時刻を更新する。ヒットしたページも順序が変わる。"}},"textbook":[{"heading":"仮想記憶を図として考える","body":"各プロセスは自分専用に見える仮想アドレス空間を持ちます。ページ単位で物理メモリに割り当て、ページ表で対応付けます。必要なページが現在使える状態にないとページフォールトが起き、OSが割当てや読込みを行います。"},{"heading":"ページ置換の違い","body":"空き枠がなければ置換対象を選びます。FIFO（先入れ先出し）は最初に読み込んだページ、LRU（最近最少使用）は最終参照が最も古いページ、LFU（最少頻度使用）は利用回数が少ないページを選ぶ考え方です。参照列と枠の状態を1回ずつ表に書けばフォールト数を計算できます。"},{"heading":"ファイル管理","body":"ファイルは名前を持つ永続データ、ディレクトリはファイルを階層的に整理する構造です。絶対パスはルートから、相対パスは現在位置からの指定です。アクセス権は読取り・書込み・実行等を管理します。ジャーナリングは変更記録で障害回復を支援します。仮想記憶は実行中のアドレス管理、ファイルは永続データ管理です。"}]},{"id":"05-4","title":"システムソフトウェア・言語処理・ライセンス","explain":"\u003cp>コンパイラはソースコードを解析して機械語などへ変換する。字句解析でトークンを抽出し、構文解析で文法構造を作り、意味解析で型・宣言の整合性を調べ、最適化やコード生成を行う。インタプリタは実行時に命令を逐次解釈する方式の総称だが、仮想機械・JIT（Just In Time：実行時コンパイル）などを組み合わせる実装もある。\u003c/p>\n\u003cp>OSS（Open Source Software：オープンソースソフトウェア）は利用許諾条件に従って使用・改変・再配布する。ソース開示などの条件はライセンスごとに違い、無条件で自由に使えるわけではない。パッケージ管理では依存バージョン固定・脆弱性確認・来歴の検証が重要。\u003c/p>\n","worked":"\u003cp>型が不一致な関数呼出しを静的に検出するのは意味解析の仕事。「括弧が閉じていない」は構文解析の問題。\u003c/p>\n","prompt":"コンパイルを通過すれば仕様どおり動くか。","answer":"\u003cp>保証されない。実行時例外、論理バグ、性能やセキュリティの問題が残る。\u003c/p>\n","beginner":{"scenario":"Cのソースをコンパイルして目的コードを作り、ライブラリ等とリンクして実行形式を得る。ローダが実行時にメモリへ読み込む。","trap":"OSSでも著作権があり、ライセンス条件を守る。","quizId":"U-05-4"},"textbook":[{"heading":"実行までの道筋","body":"人が書いたソースコードはコンパイルで目的コード等になり、リンカがライブラリと結合し、ローダが実行に必要な内容をメモリへ配置します。インタプリタは解釈しながら実行する方式です。デバッガではブレークポイントで実行を止め、変数の値や呼出しの順序を確認します。"},{"heading":"共通ソフトウェア","body":"ミドルウェアはOSと業務アプリの間の共通機能で、データベース管理、メッセージ交換、アプリケーション実行基盤などを提供します。API（アプリケーションプログラミングインタフェース）は機能の呼出し方法を定めます。シェルはコマンドを解釈してOS機能を利用するインタフェースです。"},{"heading":"ライセンスの考え方","body":"OSS（オープンソースソフトウェア）はソース利用・改変・再配布などをライセンス条件で認めるソフトウェアです。無条件で著作権が消えるわけではありません。GPLなどでは配布形態に応じソース提供等の義務が生じ得ます。許諾条件、著作権表示、他ライセンスとの互換性を確認します。"}]},{"id":"05-X01","title":"ミドルウェア・ファイル・開発環境","explain":"\u003cp>ミドルウェアはOSとアプリの間で共通機能を提供する。DBMSはデータ管理、アプリケーションサーバは業務処理実行、メッセージキューは非同期連携、TPモニタはトランザクション処理を支援する。API（アプリケーション間の接続仕様）は呼出し方法を定める。\u003c/p>\u003cp>ファイルシステムはディレクトリ、ファイル属性、アクセス権、領域割当てを管理する。ジャーナリングは変更の記録を使って障害回復を支援する。シェルはコマンド実行環境、デバッガは実行停止・変数確認、リンカは目的コードを結合、ローダは実行可能な形でメモリへ読み込む。OSS（オープンソースソフトウェア）でもライセンス遵守が必要。GPLは一定の再配布にソース提供等の条件がある。\u003c/p>","worked":"\u003cp>印刷要求を補助記憶に一時蓄積し順に出力するスプーリングで、CPUは印刷の完了を待たず次の処理ができる。\u003c/p>","prompt":"ブレークポイントでプログラムを止めて変数を調べるツールは？","answer":"\u003cp>デバッガ。\u003c/p>","beginner":{"scenario":"注文受付がメッセージキューに依頼を積み、発送処理が後から受け取る設計なら、発送の一時停止と注文受付を分離できる。","trap":"再配信・順序・消失への対策は別途必要。","quizId":"U-05-X01"},"textbook":[{"heading":"ミドルウェアを使う理由","body":"アプリが毎回データ保存、通信、ログ、実行環境を作り直すと重複が増えます。DBMS（データベース管理システム）は保存・検索・整合性、アプリケーションサーバは業務処理の実行基盤、メッセージキューは非同期の依頼受渡し、TPモニタは取引処理の管理を支援します。"},{"heading":"ファイルの内部管理","body":"ファイルシステムはデータの保存位置、名前、属性、アクセス権を管理します。連続領域への配置は順次読込みが効率的ですが拡張が難しい場合があり、分散配置には管理情報が必要です。ジャーナリングは変更を記録して障害時の整合性回復を支援します。"},{"heading":"開発・入出力支援","body":"エディタはソース編集、コンパイラは翻訳、デバッガは実行状態調査、ビルドツールは生成手順自動化、バージョン管理は変更履歴を管理します。スプーリングは印刷など低速機器への要求を補助記憶に一時保存して順に処理する仕組みです。ファイル管理・実行管理・開発支援は目的が異なります。"}]},{"id":"05-Y01","title":"OSの構成・起動・ジョブと特権","explain":"\u003cp>カーネルは資源管理などOSの中心機能。モノリシックカーネルは多くの機能をカーネル側で実行、マイクロカーネルは必要最小限をカーネルに置き他機能を外部サービスに分ける考え方。UNIX系、PC用、モバイル、組込み、リアルタイムOSは用途・制約が異なる。起動時はファームウェアからブートストラップ（初期起動処理）でOSを読み込む。ネットワークブートはネット経由、マルチブートは複数OSから選択し、フラッシュブートローダはフラッシュ上の起動処理等に用いる。\u003c/p>","worked":"\u003cp>\u003cb>アプリが直接ディスクを操作せずOSに依頼する理由は？\u003c/b>\u003c/p>\u003cp>OSが権限や資源競合を管理し、機器固有の処理を共通の窓口で提供するため。\u003c/p>","prompt":"アプリが直接ディスクを操作せずOSに依頼する理由は？","answer":"\u003cp>OSが権限や資源競合を管理し、機器固有の処理を共通の窓口で提供するため。\u003c/p>","textbook":[{"heading":"OSの内部と起動","body":"カーネルは資源管理などOSの中心機能。モノリシックカーネルは多くの機能をカーネル側で実行、マイクロカーネルは必要最小限をカーネルに置き他機能を外部サービスに分ける考え方。UNIX系、PC用、モバイル、組込み、リアルタイムOSは用途・制約が異なる。起動時はファームウェアからブートストラップ（初期起動処理）でOSを読み込む。ネットワークブートはネット経由、マルチブートは複数OSから選択し、フラッシュブートローダはフラッシュ上の起動処理等に用いる。"},{"heading":"特権と保護","body":"ユーザーモードでは通常アプリが機器・他プロセスの記憶を勝手に操作できない。カーネルモード（特権モード）はOSの制御処理を行う。アプリがファイルを読むときはシステムコールを通じOSへ要求し、OSが権限を確認して処理する。SVC（監督プログラム呼出し）割込みはその実現方法の一つ。"},{"heading":"ジョブと実行の単位","body":"ジョブは給与計算など一まとまりの仕事、ジョブステップはその工程、タスクは実行管理の単位。ジョブスケジューラは実行順・条件を管理し、ディスパッチャは実行可能なタスクへCPUを割り当てる。マスタスケジューラはジョブ管理の中心的な制御を行う概念。cronはUNIX系で時刻条件による定期実行に利用する。バックグラウンドジョブは対話操作と独立して処理を進める。"}],"beginner":{"scenario":"OSの内部と起動から順に、特権と保護、ジョブと実行の単位を理解する。","trap":"ディスパッチャは選択されたタスクを実行状態にする。","quizId":"U-05-Y01"}},{"id":"05-Y02","title":"タスクの優先順位・記憶領域の管理","explain":"\u003cp>FCFS（先着順）は到着順、SJF（最短ジョブ優先）は予測処理時間の短いものを先に実行。プリエンプティブ方式は実行中のタスクを中断でき、ノンプリエンプティブ方式は自発的な終了や待ち等まで続ける。静的優先度は固定、動的優先度は待ち時間等に応じ変える。多段フィードバック待ち行列は実行特性に応じ優先度等を変更する。長時間CPUを得られないリソーススタベーション（資源飢餓）を抑えるため待ち時間で優先度を上げる方法がある。\u003c/p>","worked":"\u003cp>\u003cb>空き40、100、60KBの順に並び、50KB要求をbest fitで割り当てる。\u003c/b>\u003c/p>\u003cp>十分な100と60のうち最小の60KB領域を選ぶ。\u003c/p>","prompt":"空き40、100、60KBの順に並び、50KB要求をbest fitで割り当てる。","answer":"\u003cp>十分な100と60のうち最小の60KB領域を選ぶ。\u003c/p>","textbook":[{"heading":"スケジューリングの選択","body":"FCFS（先着順）は到着順、SJF（最短ジョブ優先）は予測処理時間の短いものを先に実行。プリエンプティブ方式は実行中のタスクを中断でき、ノンプリエンプティブ方式は自発的な終了や待ち等まで続ける。静的優先度は固定、動的優先度は待ち時間等に応じ変える。多段フィードバック待ち行列は実行特性に応じ優先度等を変更する。長時間CPUを得られないリソーススタベーション（資源飢餓）を抑えるため待ち時間で優先度を上げる方法がある。"},{"heading":"実記憶の割当て","body":"固定区画は決めた区画に割り当てるため内部断片化が起き得る。可変区画は必要量に合わせるが小さな空きが分散する外部断片化が起き得る。空き40KBと60KBが離れていると合計100KBでも連続80KBを割り当てられない。メモリコンパクションは配置を移動して空きをまとめる。first fitは最初の十分な空き、best fitは十分な空きの中で最小、worst fitは最大の空きを選ぶ。"},{"heading":"仮想記憶と入替え","body":"オーバーレイはプログラムを部分に分け必要な部分を同じ領域へ順次ロードする方式。スワッピングはプロセス等の記憶内容を補助記憶と入替える。セグメントはコード・データ等の論理単位、ページは固定長単位。デマンドページングは必要時にページインし、追い出す場合はページアウトする。ワーキングセットは最近参照したページの集合で、その保持が不足するとスラッシングが起きやすい。DAT（動的アドレス変換）は実行時に仮想アドレスを物理アドレスへ変換する。"}],"beginner":{"scenario":"スケジューリングの選択から順に、実記憶の割当て、仮想記憶と入替えを理解する。","trap":"総空き量が足りても連続領域が不足する現象。","quizId":"U-05-Y02"}},{"id":"05-Y03","title":"OSの入出力・利用者管理・障害回復","explain":"\u003cp>バッファは通信速度差などを吸収する一時記憶。スプールは印刷などの処理要求を補助記憶へ保存して順に処理する。チャネル制御は入出力専用処理装置を利用する。メモリマップドI/Oでは機器の制御レジスタ等をメモリアドレス空間に割当て、通常のメモリ命令等で操作する。I/OマップドI/Oは独立した入出力空間と専用命令等を使う。\u003c/p>","worked":"\u003cp>\u003cb>一般利用者の保存容量を10GBに制限したい。\u003c/b>\u003c/p>\u003cp>ディスククォータを設定する。\u003c/p>","prompt":"一般利用者の保存容量を10GBに制限したい。","answer":"\u003cp>ディスククォータを設定する。\u003c/p>","textbook":[{"heading":"低速装置を効率よく使う","body":"バッファは通信速度差などを吸収する一時記憶。スプールは印刷などの処理要求を補助記憶へ保存して順に処理する。チャネル制御は入出力専用処理装置を利用する。メモリマップドI/Oでは機器の制御レジスタ等をメモリアドレス空間に割当て、通常のメモリ命令等で操作する。I/OマップドI/Oは独立した入出力空間と専用命令等を使う。"},{"heading":"利用者とアクセスを管理する","body":"rootやAdministratorは強い管理権限を持つ代表的なアカウント。ゲストは限定利用、ディスククォータは利用者等の記憶容量を制限する。LDAP（軽量ディレクトリアクセスプロトコル）はディレクトリ情報へのアクセス規約、Active Directoryは利用者や機器等の管理に用いられる仕組み。BLP（ベル・ラパデュラ）モデルは機密性を守るため原則として上位機密の読取りと下位機密への書込みを制限する。ログや監査証跡でアカウンタビリティ（説明責任）を支援する。"},{"heading":"異常検出から回復へ","body":"タイマ監視やウォッチドッグで停止を検出し、記録・診断・切替・再起動・原因修正を行う。動的装置再構成は故障機器等を切離し構成を変更する。二重化や予備系を用いて処理継続を図る。リエントラント（再入可能）なプログラムは中断や複数の実行が重なっても安全に使えるよう状態を管理し、逐次再使用可能は前の実行完了後に繰返し利用できる性質。ABI（アプリケーションバイナリインタフェース）はバイナリレベルの呼出し・型等の規約、POSIXはOS間の移植性に関するインタフェース標準群。ユーティリティは整列・併合・アーカイブ・バックアップ等を支援する。"}],"beginner":{"scenario":"低速装置を効率よく使うから順に、利用者とアクセスを管理する、異常検出から回復へを理解する。","trap":"メモリアクセス命令等で機器レジスタにアクセスする。","quizId":"U-05-Y03"}},{"id":"05-Y04","title":"シェル・API・ライブラリ・部品化","explain":"\u003cp>シェルはコマンドを解釈してOS機能を呼び出す。Bシェル、Cシェル、cmd.exeなどがある。例えばファイル一覧表示やコピーの命令を解釈して必要な処理を起動する。パイプは前のコマンドの出力を次の入力へ渡す仕組み。API（アプリケーションプログラミングインタフェース）は機能の呼出し方法を定義し、Web APIはネットワーク越しにサービスを利用する窓口。\u003c/p>","worked":"\u003cp>\u003cb>計算機Aのアプリが別サーバの在庫情報を取得する。\u003c/b>\u003c/p>\u003cp>相手が公開するWeb APIを仕様に沿って呼び出す構成が考えられる。\u003c/p>","prompt":"計算機Aのアプリが別サーバの在庫情報を取得する。","answer":"\u003cp>相手が公開するWeb APIを仕様に沿って呼び出す構成が考えられる。\u003c/p>","textbook":[{"heading":"OSを操作する窓口","body":"シェルはコマンドを解釈してOS機能を呼び出す。Bシェル、Cシェル、cmd.exeなどがある。例えばファイル一覧表示やコピーの命令を解釈して必要な処理を起動する。パイプは前のコマンドの出力を次の入力へ渡す仕組み。API（アプリケーションプログラミングインタフェース）は機能の呼出し方法を定義し、Web APIはネットワーク越しにサービスを利用する窓口。"},{"heading":"プログラム部品を再利用する","body":"ソースライブラリはソース、オブジェクトライブラリは翻訳済み部品、ロードライブラリは実行可能な部品等を管理する。静的リンクは実行ファイルに部品を結合、動的リンクは実行時等に部品を結合する。クラスライブラリは再利用するクラス等を提供する。DLL（動的リンクライブラリ）の更新時は互換性と依存関係を確認する。"},{"heading":"部品とフレームワーク","body":"コンポーネントウェアは明確な接続仕様を持つ部品の組合せで開発する考え方。JavaBeansはJavaの再利用可能な部品規約、CORBAは異なる環境の分散オブジェクト間連携、OSGiはJava等の動的モジュール管理。フレームワークはアプリの骨組みを提供し決められた拡張箇所に処理を書く。Spring、Struts、CakePHP、Ruby on Railsは代表例。ライブラリは一般に利用側が呼出し、フレームワークでは枠組み側が利用者の処理を呼ぶことも多い。"}],"beginner":{"scenario":"OSを操作する窓口から順に、プログラム部品を再利用する、部品とフレームワークを理解する。","trap":"共通構造を提供して開発を支援する。","quizId":"U-05-Y04"}},{"id":"05-Y05","title":"ファイルシステム・ファイル編成と検索","explain":"\u003cp>ディレクトリは名前とファイルの管理情報を対応付ける。ファイル制御ブロック等には位置・属性・権限等が記録される。ファイルハンドルやファイル記述子は開いたファイルを識別する値、ファイルポインタは現在の読書き位置。ルートは階層の頂点、カレントは現在位置、ホームは利用者の基準位置。シンボリックリンクは別のパスを参照する。FATは領域の連鎖を表で管理、NTFSはWindows系でアクセス制御等に対応、ReFSは回復性等を重視、NFSはネットワーク経由のファイルアクセス規約。\u003c/p>","worked":"\u003cp>\u003cb>200Bの論理レコードを2000Bブロックへ詰め、300件保存する。\u003c/b>\u003c/p>\u003cp>管理領域を無視すれば1ブロック10件なので30ブロック。\u003c/p>","prompt":"200Bの論理レコードを2000Bブロックへ詰め、300件保存する。","answer":"\u003cp>管理領域を無視すれば1ブロック10件なので30ブロック。\u003c/p>","textbook":[{"heading":"ファイルを識別する仕組み","body":"ディレクトリは名前とファイルの管理情報を対応付ける。ファイル制御ブロック等には位置・属性・権限等が記録される。ファイルハンドルやファイル記述子は開いたファイルを識別する値、ファイルポインタは現在の読書き位置。ルートは階層の頂点、カレントは現在位置、ホームは利用者の基準位置。シンボリックリンクは別のパスを参照する。FATは領域の連鎖を表で管理、NTFSはWindows系でアクセス制御等に対応、ReFSは回復性等を重視、NFSはネットワーク経由のファイルアクセス規約。"},{"heading":"論理レコードと物理ブロック","body":"利用者が扱う1件の明細が論理レコード、記憶装置へ転送する単位が物理ブロック。100Bのレコードを1000Bブロックに固定長で詰めるならブロック化因数10。100件なら10ブロックで読める（管理情報等を無視）。ブロッキングはまとめる、デブロッキングは分離する処理。順次アクセスは先頭から順番に、直接アクセスは位置等を指定して読書きする。"},{"heading":"検索と更新","body":"索引編成はキーと格納位置の対応を別に管理し、順次検索と直接検索を支援する方式がある。ハッシュ編成はキーから格納候補を計算し、衝突時はあふれ域等を使う。ファイルの追加・削除・変更によって索引や空き領域の更新も必要になる。世代管理では複数時点のバックアップを保持し、障害や誤削除から復元できる範囲を確保する。"}],"beginner":{"scenario":"ファイルを識別する仕組みから順に、論理レコードと物理ブロック、検索と更新を理解する。","trap":"複数の論理レコードを一つの物理転送単位にする。","quizId":"U-05-Y05"}},{"id":"05-Y06","title":"開発支援ツール・翻訳・デバッグ","explain":"\u003cp>IDE（統合開発環境）はエディタ、ビルド、デバッグ等を統合する。SADTは構造化分析・設計、SREMは要求工学の方法、PSL/PSAは要求記述・分析の支援に関する手法・ツール。設計ツール、文書生成、構築支援、ローコード・ノーコードは工程や必要な記述量が異なる。ツールチェーンは複数の開発ツールを連携させた構成。\u003c/p>","worked":"\u003cp>\u003cb>PC上で組込み機器向けの機械語を生成する。\u003c/b>\u003c/p>\u003cp>クロスコンパイラを利用する。対象の命令体系やライブラリに合わせる。\u003c/p>","prompt":"PC上で組込み機器向けの機械語を生成する。","answer":"\u003cp>クロスコンパイラを利用する。対象の命令体系やライブラリに合わせる。\u003c/p>","textbook":[{"heading":"どの工程を支援するか","body":"IDE（統合開発環境）はエディタ、ビルド、デバッグ等を統合する。SADTは構造化分析・設計、SREMは要求工学の方法、PSL/PSAは要求記述・分析の支援に関する手法・ツール。設計ツール、文書生成、構築支援、ローコード・ノーコードは工程や必要な記述量が異なる。ツールチェーンは複数の開発ツールを連携させた構成。"},{"heading":"実行する前と後の調査","body":"静的解析は実行せず構造・規則違反等を調べ、クロスリファレンスは定義と参照箇所の対応、プリティプリンタはコード整形等を支援する。動的解析は実行時の挙動を調べ、トレーサは実行経路、スナップショットはある時点の状態、アサーションチェッカは指定条件が成立するか確認する。テストカバレージツールは実行された命令や分岐等を測る。テストベッドは試験用環境。ICE（インサーキットエミュレータ）は実機の回路と連携したデバッグに利用される。"},{"heading":"翻訳と実行","body":"アセンブラはアセンブリ言語を機械語等へ、コンパイラは高水準言語を別形式へ、リンカは外部参照を解決、ローダは実行用に配置する。JIT（実行時コンパイラ）は実行時にコードを翻訳し、クロスコンパイラは開発機とは異なる機種向けコードを生成する。プリプロセッサは翻訳前のマクロ展開等、ジェネレータは仕様等からコードを生成する。エミュレータは対象機器等の動作を模倣し、シミュレータはモデルで挙動を再現する。"}],"beginner":{"scenario":"どの工程を支援するかから順に、実行する前と後の調査、翻訳と実行を理解する。","trap":"静的解析はコード等から潜在的問題を検出する。","quizId":"U-05-Y06"}},{"id":"05-Y07","title":"OSSのライセンスと用途別ツール","explain":"\u003cp>OSS（オープンソースソフトウェア）は条件に従い利用・改変・再配布等が可能。GPL（一般公衆利用許諾）は対象の派生物を配布する場合等に対応するソースの提供などを求めるコピーレフト型。BSD系ライセンスは著作権表示等を条件に広い利用を認め、MPLは対象ファイル単位のコピーレフトを持つ。Apacheライセンス2.0には明示的な特許許諾等がある。デュアルライセンスは複数の許諾条件から選択可能な方式。具体的な義務は版・配布形態・組合せを確認する。\u003c/p>","worked":"\u003cp>\u003cb>OSSだから社内利用も配布も条件を確認しなくてよいか。\u003c/b>\u003c/p>\u003cp>いいえ。ライセンスの対象、配布形態、表示・ソース提供等の義務、サポートや脆弱性対応を確認する。\u003c/p>","prompt":"OSSだから社内利用も配布も条件を確認しなくてよいか。","answer":"\u003cp>いいえ。ライセンスの対象、配布形態、表示・ソース提供等の義務、サポートや脆弱性対応を確認する。\u003c/p>","textbook":[{"heading":"利用条件の違い","body":"OSS（オープンソースソフトウェア）は条件に従い利用・改変・再配布等が可能。GPL（一般公衆利用許諾）は対象の派生物を配布する場合等に対応するソースの提供などを求めるコピーレフト型。BSD系ライセンスは著作権表示等を条件に広い利用を認め、MPLは対象ファイル単位のコピーレフトを持つ。Apacheライセンス2.0には明示的な特許許諾等がある。デュアルライセンスは複数の許諾条件から選択可能な方式。具体的な義務は版・配布形態・組合せを確認する。"},{"heading":"用途別の構成","body":"LAMPはLinux、Apache、MySQL、PHP等、LAPPはPostgreSQLを用いる構成。LinuxやFreeBSD、NetBSD、OpenBSDはUNIX系の代表例。Xenは仮想化、Dockerはコンテナ、Kubernetesはコンテナの配置・管理、Terraformはインフラ構成管理、OpenStackはクラウド基盤、Istioはサービス間通信管理等。PyTorch、TensorFlow、Keras、Chainer、Deeplearning4jは機械学習・深層学習、OpenCVは画像処理等。試験に掲載された名称と現時点の推奨技術は区別する。"},{"heading":"開発・運用・コミュニティ","body":"GitとSubversionは版管理、Eclipseは統合開発環境、SonarQubeはコード品質分析、Jenkinsは自動ビルド等、Redmineは課題管理、Seleniumはブラウザ自動操作・試験、Ansible・Chef・Puppetは構成管理等、Prometheus・Zabbixは監視、Grafanaはデータ可視化。OSI（オープンソース推進組織）、FSF（自由ソフトウェア財団）、Linux Foundation、Apache Software Foundation、OpenSSF（OSSセキュリティ推進組織）は開発・普及・安全性等を支える。OSSでも保守費用・脆弱性・開発継続性を評価する。"}],"beginner":{"scenario":"利用条件の違いから順に、用途別の構成、開発・運用・コミュニティを理解する。","trap":"Kubernetesはコンテナオーケストレーション基盤。","quizId":"U-05-Y07"}}],"beginnerIntro":"アプリを同時に動かす資源管理と共通ソフトウェアを学ぶ。プロセスの状態とロックを図にして考える。"},{"id":6,"title":"ハードウェア・組込み基礎","group":"テクノロジ","priority":"A標準","summary":"論理回路・半導体・センサ・割込み・組込み制御を理解。","lessons":[{"title":"論理回路","body":"AND/OR/NOTに加えてNANDとNORは任意の論理回路を構成可能。フリップフロップは1ビットの状態を保持する基本回路。","check":"組合せ回路と順序回路を区別。"},{"title":"マイコンとリアルタイム性","body":"組込み機器のマイコンはセンサ入力を読み、計算し、アクチュエータを制御する。リアルタイムシステムでは正しい計算結果だけでなく期限内の結果が必要。","check":"速さだけでなく締切保証が重要。"},{"title":"電源・通信・省電力","body":"割込みでイベントを処理し、不要なときは省電力状態へ遷移。低消費電力の設計では通信頻度やセンサ計測周期も検討する。","check":"電力とエネルギーは別単位。"},{"title":"故障安全の設計","body":"フェイルセーフは故障時に安全側へ倒す考え方。フォールトトレラントは一部故障しても機能継続できるようにする設計。","check":"安全性とサービス継続性の目的差。"}],"terms":[{"term":"フリップフロップ","definition":"1ビットの状態を保持する順序回路"},{"term":"NAND","definition":"ANDの結果を否定した論理演算"},{"term":"組込みシステム","definition":"機器の特定用途に組み込まれた制御用システム"},{"term":"リアルタイムOS","definition":"処理の応答期限を意識したOS"},{"term":"センサ","definition":"温度・位置などの物理量を信号として取得する素子"},{"term":"アクチュエータ","definition":"電気信号などを動作・力に変える装置"},{"term":"フェイルセーフ","definition":"故障した際に危険を避ける側へ状態を移す設計思想"},{"term":"フォールトトレラント","definition":"部分的な故障があっても機能を継続できる性質"},{"term":"ウォッチドッグタイマ","definition":"処理の異常停止を検出し再起動等を行う監視機構"}],"questions":[{"id":"Q06-01","chapter":6,"kind":"applied","q":"制御プログラムが正しくても期限を超過すると失敗になる特性は。","options":["可搬性","リアルタイム性","保守性","移植性"],"correct":1,"explain":"時間制約の遵守が機能の一部。"},{"id":"Q06-02","chapter":6,"kind":"applied","q":"故障時にエレベータを停止させて安全を確保する設計は。","options":["フェイルセーフ","ロードバランシング","多重化","スケールアップ"],"correct":0,"explain":"不具合時に安全側に遷移する。"},{"id":"Q06-03","chapter":6,"kind":"applied","q":"1ビットの状態記憶に使う回路は。","options":["加算器","デコーダ","フリップフロップ","マルチプレクサ"],"correct":2,"explain":"順序回路の代表。"},{"id":"D06-01","chapter":6,"kind":"applied","q":"8ビットADCで0～5Vを256段階に量子化する理想的な1段階の電圧幅に最も近い値はどれか。","options":["0.002V","0.020V","0.20V","0.50V"],"correct":1,"explain":"5/256≈0.0195V。分解能は量子化段数で決まるが実測精度は雑音等にも左右される。"},{"id":"D06-02","chapter":6,"kind":"applied","q":"周期20msで実行5msのタスクAと周期10msで実行3msのタスクBの合計CPU利用率はどれか。","options":["25%","30%","55%","80%"],"correct":2,"explain":"5/20＋3/10=0.25+0.30=0.55。これだけで期限を守ることを証明できるわけではない。"},{"id":"D06-03","chapter":6,"kind":"applied","q":"ハードリアルタイムシステムの特徴として最も適切なものはどれか。","options":["平均処理時間の短さだけを保証すればよい","一定の期限超過が重大な失敗になり得る","全タスクを必ず同時実行する","CPU周波数が高いことが定義である"],"correct":1,"explain":"重要なのは締切までの確実な応答。平均速度が速いだけでは保証できない。"},{"id":"Q-06-X01","chapter":6,"kind":"applied","q":"出荷後に論理回路を再構成できるデバイスは？","options":["ASIC","DRAM","FPGA","HDD"],"correct":2,"explain":"FPGA。"},{"id":"U-06-1","chapter":6,"kind":"applied","q":"現在入力に加え過去の状態に依存する回路は？","options":["順序回路","組合せ回路","整流回路","増幅回路"],"correct":0,"explain":"順序回路には記憶要素がある。"},{"id":"U-06-2","chapter":6,"kind":"applied","q":"2ms/10msと5ms/25msの2タスクのCPU利用率合計は？","options":["20%","40%","70%","7%"],"correct":1,"explain":"2/10＋5/25＝0.4。"},{"id":"U-06-3","chapter":6,"kind":"applied","q":"応答が途絶えた装置を監視し異常処理を促すタイマは？","options":["リトルの法則","パリティビット","ウォッチドッグタイマ","ロードバランサ"],"correct":2,"explain":"正常動作の通知が途絶えるとタイムアウトして異常処理を行う。"},{"id":"U-06-X01","chapter":6,"kind":"applied","q":"PWM周期20ms、ON時間5msのデューティ比は？","options":["5%","20%","75%","25%"],"correct":3,"explain":"ON時間÷周期＝5/20。"},{"id":"U-06-Y01","chapter":6,"kind":"applied","q":"光を介して回路間を電気的に絶縁し信号を伝える部品は？","options":["抵抗器","サーミスタ","フォトカプラ","トライアック"],"correct":2,"explain":"発光部と受光部を使って信号を伝える。"},{"id":"U-06-Y02","chapter":6,"kind":"applied","q":"回路への電源供給を遮断し主にリーク電流を抑える方法は？","options":["クロックゲーティングのみ","インタリーブ","パリティ","パワーゲーティング"],"correct":3,"explain":"電源を遮断することで待機時の漏れ電流を抑える。"}],"deepIntro":"組込みは限られた電力・容量と、現実世界のタイミング制約の中で動くシステム。","deep":[{"id":"06-1","title":"ディジタル回路・半導体・制御","explain":"\u003cp>論理回路はAND/OR/NOTをトランジスタ等で実現する。組合せ回路は現在の入力だけで出力が決まり、順序回路はフリップフロップなどで過去の状態を保持する。加算器、デコーダ、マルチプレクサは組合せ回路の例。発振回路・クロックは同期処理の基準となる。\u003c/p>\n\u003cp>センサが温度や加速度などを測定し、ADC（Analog-to-Digital Converter：アナログ・ディジタル変換器）で離散値に変換する。アクチュエータは制御信号を物理的な動きに変える。フィードバック制御は出力を測って目標との差を補正し、外乱に対処する。\u003c/p>\n","worked":"\u003cp>8ビットADCで0～5Vを256段階に量子化する単純モデルでは1段階約5/256＝0.0195V。精度は量子化段数だけでなくノイズ、基準電圧にも左右される。\u003c/p>\n","prompt":"センサの生データを細かくサンプリングすれば必ず正しい物理量になるか。","answer":"\u003cp>ならない。校正、雑音、分解能、サンプリング周波数、エイリアシングを考える。\u003c/p>\n","beginner":{"scenario":"非常停止解除と安全扉閉鎖が両方確認されたときだけモータを許可する条件はANDで表せる。センサが入力、モータが出力。","trap":"論理条件だけでは故障時の安全性は保証できない。","quizId":"U-06-1"},"textbook":[{"heading":"組込み機器とは","body":"洗濯機や自動車のように、特定の目的を果たす装置に内蔵された計算機です。温度や位置をセンサで測り、プログラムで判断してモータなどのアクチュエータを動かします。汎用パソコンとは異なり、電力、価格、応答期限、安全性などの制約を強く受けます。"},{"heading":"論理回路の基本","body":"トランジスタを使い0と1を表す電気状態を切り替え、AND、OR、NOTなどの論理回路を作ります。組合せ回路は現在の入力だけで出力が決まり、順序回路は過去の状態も利用します。フリップフロップは1ビットの状態を保持する回路です。半加算器の和はXOR、桁上がりはANDで求められ、全加算器では下位桁からの桁上がりも加えます。"},{"heading":"制御の流れ","body":"センサ入力は必要に応じA/D変換で数値化し、CPU（中央処理装置）が条件や制御式を計算します。出力はデジタル信号、D/A変換によるアナログ信号、PWM（パルス幅変調）などで機器を制御します。誤作動が危険につながる機器では通常動作だけでなく、故障時の動作も設計します。"}]},{"id":"06-2","title":"リアルタイムOS・スケジューリング","explain":"\u003cp>リアルタイム性は「処理速度が高いこと」ではなく「決められた期限までに確実に結果が出ること」。ハードリアルタイムは締切超過が重大な失敗となり、ソフトリアルタイムは品質低下として扱う。優先度ベースのスケジューラでは、高優先度タスクが低優先度タスクの持つロックを待つ優先度逆転が起こり得る。優先度継承などで緩和する。\u003c/p>\n\u003cp>周期タスクは処理時間C、周期T、期限Dを考慮する。単純な単一プロセッサ・独立周期タスクでCPU利用率Σ(Cᵢ/Tᵢ)を概算し、1を超えればスケジュール不可能。ただし1以下でも割込みや優先度条件で期限を守れるとは限らない。\u003c/p>\n","worked":"\u003cp>タスクAが5ms/20ms、Bが3ms/10msを必要とするとCPU利用率は5/20＋3/10＝0.55（55%）。残り45%に割込み・OS処理等を見込む必要がある。\u003c/p>\n","prompt":"処理平均が5msで期限10msならリアルタイム要件を満たすか。","answer":"\u003cp>平均だけでは判断できず、最悪実行時間や実測遅延が必要。\u003c/p>\n","beginner":{"scenario":"10msごとに1ms処理するタスクのCPU利用率10%、20msごとに4msなら20%、合計30%。","trap":"周期、期限、CPU実行時間は別。利用率だけでは期限保証にならない。","quizId":"U-06-2"},"textbook":[{"heading":"速さより期限を守る","body":"自動車の制動や工場の制御は、平均で高速でも必要な時刻に処理が終わらなければ危険です。リアルタイムOS（基本ソフトウェア）はタスクの期限や優先度を考慮してCPUを配分します。ハードリアルタイムでは期限違反が許容されず、ソフトリアルタイムでは多少の違反で品質が低下する場合があります。"},{"heading":"周期タスクを計算する","body":"実行時間C、周期TのタスクのCPU利用率はC/Tです。例えば周期10msで2ms実行する制御は20%、周期20msで3ms実行する記録は15%。合計35%です。ただし共有資源のロック、割込み、最悪実行時間も考えないと期限を守れるとはいえません。レートモノトニックは周期が短いタスクを優先し、EDF（最早期限優先）は現在の期限が近いタスクを優先します。"},{"heading":"優先度逆転","body":"高優先度タスクが低優先度タスクの保持するロックを待ち、中優先度タスクが低優先度タスクを妨げると、高優先度タスクの実行が遅れます。優先度継承ではロック保持者の優先度を一時的に上げ、ロック解放を促します。排他区間を短くすることも重要です。"}]},{"id":"06-3","title":"通信・電力・信頼性","explain":"\u003cp>組込み装置の通信にはI²C、SPI、UART、CAN、Ethernetなどがあり、距離、速度、ノイズ耐性、配線、リアルタイム性で使い分ける。車載CANは複数ノード間でフレームを共有し、優先順位による調停を行う。無線IoT（Internet of Things：モノのインターネット）では省電力と通信頻度のトレードオフが大きい。\u003c/p>\n\u003cp>機器の故障は物理故障、ソフトウェア欠陥、誤操作や通信不調など多岐にわたる。ウォッチドッグタイマは応答がないソフトウェアを検知して再起動などを促す。二重化は可用性を改善するが、同一不具合で同時故障する可能性も評価する。\u003c/p>\n","worked":"\u003cp>10mAで1時間、1mAで23時間動く装置なら1日平均電流は(10×1＋1×23)/24＝1.375mA。電池容量を平均電流で割ると理想的な稼働時間の目安が出るが、電池の実効容量や温度を考慮する。\u003c/p>\n","prompt":"ウォッチドッグで必ず障害原因が解消するか。","answer":"\u003cp>再起動で一時回復する場合があるが、根本原因の修正やログ保全は別途必要。\u003c/p>\n","beginner":{"scenario":"電池式センサを1秒起動・9秒休止にすると起動時間割合は10%。休止時の電力が小さければ平均消費電力を減らせる。","trap":"安全に停止するフェイルセーフと機能を維持するフォールトトレランスは別。","quizId":"U-06-3"},"textbook":[{"heading":"電力の制約","body":"電池式センサでは常にCPUを動かす必要がないことがあります。定期的に起動し測定してから休止すると平均消費電力を減らせます。起動時100mW、休止時1mW、起動時間10%なら平均100×0.1＋1×0.9＝10.9mW。電池寿命を考える際は通信や起動時の消費も含めます。"},{"heading":"通信方式の選択","body":"I²CやSPIは機器内部でセンサなどを接続する方式、UARTは非同期シリアル通信、CANは複数制御機器が通信するために自動車等で使われる方式です。無線では通信距離・消費電力・帯域を考えます。用途により信頼性と応答期限も評価します。"},{"heading":"故障への備え","body":"フェイルセーフは故障時に安全な状態へ移ること。フォールトトレランスは故障しても必要な機能を継続すること。フールプルーフは誤操作しても危険になりにくい設計です。ウォッチドッグタイマは定期的な正常通知が途絶えた際に再起動等を行います。ただし再起動そのものが安全とは限らず、出力の安全状態を確保する必要があります。"}]},{"id":"06-X01","title":"回路・半導体・組込みハードウェア","explain":"\u003cp>AND、OR、NOTを組み合わせた組合せ回路は現在入力で出力が決まり、フリップフロップを含む順序回路は状態を記憶する。半加算器は和と桁上がりを生成し、全加算器は下位からの桁上がりも扱う。ASICは特定用途向けに設計した集積回路、FPGAは製造後に回路構成を変更可能なデバイス。マイコンはCPU、メモリ、周辺回路を統合する。\u003c/p>\u003cp>センサからのアナログ出力をA/D変換（AD変換）し、D/A変換で数値をアナログ信号へ戻す。PWM（パルス幅変調）はON時間の比率で平均出力を制御する。ウォッチドッグタイマは異常停止を検知し再起動等を行う。フェイルセーフは故障時に安全な状態へ、フォールトトレランスは故障しても機能継続を目指す。\u003c/p>","worked":"\u003cp>周期10msでONが3msならデューティ比30%。理想的な5V出力の平均は1.5V。\u003c/p>","prompt":"出荷後に論理回路を再構成できるデバイスは？","answer":"\u003cp>FPGA。\u003c/p>","beginner":{"scenario":"8ビットA/D変換で0〜255が0〜5Vに対応すると仮定すると127は127/255×5≒2.49V。","trap":"A/Dは数値化、D/Aはアナログ化、PWMはON時間比を変える。","quizId":"U-06-X01"},"textbook":[{"heading":"半導体と回路の種類","body":"ASIC（特定用途向け集積回路）は特定の処理用に設計し量産時の効率を高められます。FPGA（書換え可能な論理デバイス）は製造後に論理回路の構成を変更でき、試作や変更可能性を重視する用途に向きます。マイクロコントローラはCPU・メモリ・入出力などを一つにまとめた制御用集積回路です。"},{"heading":"アナログとデジタルの変換","body":"温度センサが0〜5Vを出し、8ビットA/D変換で0〜255の整数を出すとします。端点を対応させた近似換算では値51は1Vに相当します。ビット数を1増やせば表せる段階数は2倍になり量子化の幅は小さくなります。実機の変換精度にはセンサ誤差や雑音も影響します。"},{"heading":"PWMで出力を調整する","body":"PWMは一定周期のうちONの割合（デューティ比）を変える方式です。周期10msのうち2msがONなら20%。理想的に5Vと0Vを切り替える場合、平均電圧は1Vです。モータや照明では負荷の特性を利用して出力を調整できます。アナログ電圧そのものを連続的に出すD/A変換とは異なります。"}]},{"id":"06-Y01","title":"電子部品・論理回路・タイミング設計","explain":"\u003cp>抵抗は電流を制限し電圧と電流にV=RIの関係を持つ。コンデンサは電荷、コイルは磁界にエネルギーを蓄え、トランスは交流電圧等を変換する。ダイオードは主に一方向へ電流を流し、LED（発光ダイオード）は発光する。トランジスタは信号で電流を制御しスイッチや増幅に使う。フォトトランジスタは光を検知、フォトカプラは光で信号を伝え電気的に絶縁、フォトインタラプタは光の遮断を検出する。トライアックは交流電力制御などに利用する。パワー半導体は大電力の変換・制御を担う。\u003c/p>","worked":"\u003cp>\u003cb>AとBのANDの否定を求める。\u003c/b>\u003c/p>\u003cp>両方1の時だけ0、他は1。NAND回路。\u003c/p>","prompt":"AとBのANDの否定を求める。","answer":"\u003cp>両方1の時だけ0、他は1。NAND回路。\u003c/p>","textbook":[{"heading":"電気回路の部品","body":"抵抗は電流を制限し電圧と電流にV=RIの関係を持つ。コンデンサは電荷、コイルは磁界にエネルギーを蓄え、トランスは交流電圧等を変換する。ダイオードは主に一方向へ電流を流し、LED（発光ダイオード）は発光する。トランジスタは信号で電流を制御しスイッチや増幅に使う。フォトトランジスタは光を検知、フォトカプラは光で信号を伝え電気的に絶縁、フォトインタラプタは光の遮断を検出する。トライアックは交流電力制御などに利用する。パワー半導体は大電力の変換・制御を担う。"},{"heading":"集積回路と論理設計","body":"IC（集積回路）は多数の素子をまとめ、LSI/VLSIは大規模・超大規模集積回路の呼称。CMOS（相補型MOS）はp型・n型のトランジスタを組み合わせる。バイポーラは別のトランジスタ構造、BiCMOSは両者を組み合わせる。NANDはANDの否定、NORはORの否定。正論理は高電圧を1、負論理は低電圧を1に対応させる。同期式設計はクロックに合わせて状態を更新し、非同期式は共通クロックに依存しない。タイミングチャートで信号の変化時刻と遅延を確認する。"},{"heading":"論理式の簡単化","body":"加法標準形は積項をORで結ぶ形。例えばA AND BとA AND NOT BのORはA AND (B OR NOT B)=Aとなる。カルノー図などの論理圧縮で必要回路を減らせる。HDL（ハードウェア記述言語）で回路や動作を記述し合成・検証する。CORDICは回転に関する演算を加減算・シフトなどで近似する方式。SoC（システムオンチップ）はCPU、入出力等のシステム機能を一つのチップへ統合し、コデザインはハードとソフトを協調設計する。MEMS（微小電気機械システム）は小型機械構造と電子技術を組み合わせる。"}],"beginner":{"scenario":"電気回路の部品から順に、集積回路と論理設計、論理式の簡単化を理解する。","trap":"発光部と受光部を使って信号を伝える。","quizId":"U-06-Y01"}},{"id":"06-Y02","title":"消費電力の計算・低電力回路設計","explain":"\u003cp>電力は単位時間のエネルギー消費でP=VI（W）、電力量は電力×時間。3Vで20mAなら0.06W=60mW、10時間なら0.6Wh。容量2000mAhの電池を平均20mAで使えば理想的な動作時間は100時間だが、電圧・変換効率・温度・電池特性を考慮する。\u003c/p>","worked":"\u003cp>\u003cb>電圧を0.9倍、周波数を0.8倍にする。動的電力の比は？\u003c/b>\u003c/p>\u003cp>他条件一定なら0.9²×0.8＝0.648。元の64.8%。\u003c/p>","prompt":"電圧を0.9倍、周波数を0.8倍にする。動的電力の比は？","answer":"\u003cp>他条件一定なら0.9²×0.8＝0.648。元の64.8%。\u003c/p>","textbook":[{"heading":"電力と電力量を区別する","body":"電力は単位時間のエネルギー消費でP=VI（W）、電力量は電力×時間。3Vで20mAなら0.06W=60mW、10時間なら0.6Wh。容量2000mAhの電池を平均20mAで使えば理想的な動作時間は100時間だが、電圧・変換効率・温度・電池特性を考慮する。"},{"heading":"回路が電力を消費する理由","body":"CMOS回路の動的消費電力は概ねαCV²fに比例する。αはスイッチング活動率、Cは負荷容量、Vは電圧、fは周波数。電圧を0.8倍にすると他条件一定で動的電力は0.64倍。停止中にもリーク電流による消費がある。クロックゲーティングは不要なクロックを止め動的消費を抑え、パワーゲーティングは不要回路への電源供給を遮断しリークを抑える。DVFS（動的電圧周波数制御）は負荷に合わせ電圧と周波数を変える。"},{"heading":"電源と動作の設計","body":"エネルギーハーベスティングは光・振動・温度差など環境エネルギーから電力を得る。シーケンス制御はあらかじめ決めた順序や条件に従い動作を進める。監視回路・診断プログラムで異常を確認し、電源回路・電池の制約も考える。低電力化で処理時間や応答期限、安全性が悪化しないか検証する。"}],"beginner":{"scenario":"電力と電力量を区別するから順に、回路が電力を消費する理由、電源と動作の設計を理解する。","trap":"電源を遮断することで待機時の漏れ電流を抑える。","quizId":"U-06-Y02"}}],"beginnerIntro":"物理世界の計測と制御を扱う。センサ→変換→演算→出力の流れと故障時の安全を理解する。"},{"id":7,"title":"ユーザーインタフェース・UX","group":"テクノロジ","priority":"A標準","summary":"使いやすさと利用者体験を要求・設計・評価に落とし込む。","lessons":[{"title":"UIとUX","body":"UI（User Interface：利用者との接点）は表示や操作系、UX（User Experience：利用者体験）は利用の前後を含む体験全体。見た目が美しくても目的を達成できなければUXは低い。","check":"似た言葉を同義扱いしない。"},{"title":"人間中心設計","body":"利用状況を理解→利用者要求を明確化→設計案→評価を反復する。ペルソナとユーザージャーニーで対象者と利用文脈を可視化。","check":"作り手の好みより実ユーザーの観察が重要。"},{"title":"評価方法","body":"ユーザビリティテストは代表利用者に操作してもらう。A/Bテストは条件を比較するが標本・割付・指標設計が必要。","check":"主観的な感想だけで定量性能を断定しない。"},{"title":"アクセシビリティ","body":"キーボード操作、読み上げ、色のみに依存しない表示、適切な文字コントラストなどで多様な利用者を支援する。","check":"色覚・身体条件だけでなく利用環境の違いにも配慮。"}],"terms":[{"term":"UI","definition":"画面や操作部などシステムと利用者の接点"},{"term":"UX","definition":"利用中だけでなく前後を含めた利用者の体験"},{"term":"ペルソナ","definition":"典型的な利用者像を具体化したモデル"},{"term":"ユーザージャーニー","definition":"利用者の行動や感情を時間順に可視化したもの"},{"term":"プロトタイプ","definition":"設計案を早期に検証するための試作品"},{"term":"アクセシビリティ","definition":"多様な利用者が利用可能であること"},{"term":"ユーザビリティ","definition":"目的を有効・効率的・満足して達成できる程度"},{"term":"ヒューリスティック評価","definition":"経験則に照らして画面などの問題を専門家が点検する方法"},{"term":"A/Bテスト","definition":"異なる二案を割り付けて成果指標を比較する実験"}],"questions":[{"id":"Q07-01","chapter":7,"kind":"applied","q":"画面の操作性だけでなく利用前後の期待や感情まで含む概念は。","options":["UI","UX","API","CPU"],"correct":1,"explain":"UXは利用体験全体を扱う。"},{"id":"Q07-02","chapter":7,"kind":"applied","q":"操作を色だけで区別させないのは主に何のためか。","options":["暗号強度を上げる","可用性を上げる","アクセシビリティを高める","帯域を増やす"],"correct":2,"explain":"色覚などに依存しない操作を支援する。"},{"id":"Q07-03","chapter":7,"kind":"applied","q":"ユーザビリティテストとして最も適切なのは。","options":["画面を開発者だけで確認する","代表利用者が課題を操作する様子を観察する","サーバー稼働率を測る","コードの静的解析をする"],"correct":1,"explain":"実利用者の課題達成状況を観察する。"},{"id":"D07-01","chapter":7,"kind":"applied","q":"フォームの入力誤りを赤色の枠線だけで示したときの改善策として適切なものはどれか。","options":["赤色をさらに濃くする","入力欄をすべて無効化する","エラー文を入力欄と関連付けて表示する","確認をすべて省略する"],"correct":2,"explain":"色だけに依存せず、文章・スクリーンリーダー対応等で伝える。"},{"id":"D07-02","chapter":7,"kind":"applied","q":"使いやすさの評価で操作時間が短くなったが入力誤りが増えた場合、何を検討すべきか。","options":["速度だけで優劣を決める","エラー率や完了率も合わせて評価する","テスト参加者を減らす","利用者の意見は無視する"],"correct":1,"explain":"ユーザビリティは有効さ・効率・満足度など複数尺度で評価する。"},{"id":"D07-03","chapter":7,"kind":"applied","q":"ユーザビリティテストの説明として適切なものはどれか。","options":["利用者による実際の操作を観察する","必ずプログラムのソースコードを読む","利用者の操作を調べない","監査証跡をすべて破棄する"],"correct":0,"explain":"タスク実施時の迷い・誤操作・達成状況を観察して課題を見つける。"},{"id":"Q-07-X01","chapter":7,"kind":"applied","q":"実際の利用者に課題を実行してもらい成功率を測定する方法は？","options":["性能ベンチマーク","ユーザビリティテスト","構文解析","回帰分析"],"correct":1,"explain":"ユーザビリティテスト。"},{"id":"U-07-1","chapter":7,"kind":"applied","q":"利用者の状況を理解し試作品を評価・改善する考え方は？","options":["人間中心設計","線形計画法","構成管理","ハッシュ探索"],"correct":0,"explain":"利用者・利用状況の理解と評価を反復する。"},{"id":"U-07-2","chapter":7,"kind":"applied","q":"同じ操作で同じボタン名・配置を使う主目的は？","options":["通信速度向上","操作の一貫性向上","暗号強度向上","DB正規化"],"correct":1,"explain":"習得済みの操作を再利用でき迷いや誤操作を減らす。"},{"id":"U-07-3","chapter":7,"kind":"applied","q":"画面読み上げで画像の意味を伝える方法は？","options":["解像度向上","色数増加","代替テキスト","JPEG変換"],"correct":2,"explain":"代替テキストは画像を見られない利用者に内容を伝える。"},{"id":"U-07-X01","chapter":7,"kind":"applied","q":"専門家が設計原則に照らして評価する手法は？","options":["利用者テスト","負荷試験","単体テスト","ヒューリスティック評価"],"correct":3,"explain":"専門家が原則との不一致を探す手法。"},{"id":"U-07-Y01","chapter":7,"kind":"applied","q":"カテゴリだけでなく利用者の自由なタグで分類する方式は？","options":["フォークソノミー","直線型","ラジオボタン","順番コード"],"correct":0,"explain":"利用者が付与したタグで情報を分類する方式。"},{"id":"U-07-Y02","chapter":7,"kind":"applied","q":"初心者と熟練者の操作時間の比に着目する評価法は？","options":["LATCH","NEM","PPM","CRC"],"correct":1,"explain":"NEMは操作時間比などから使いにくい箇所を探す。"},{"id":"U-07-Y03","chapter":7,"kind":"applied","q":"明細金額の合計と請求合計が一致するか確かめる検査は？","options":["数値チェックのみ","フォーマットチェックのみ","バランスチェック","桁別コード"],"correct":2,"explain":"相互に対応する集計値の整合性を確かめる。"}],"deepIntro":"使いやすさは「見た目の良さ」ではなく、利用者が目的を効率よく正確に達成できるかで評価する。","deep":[{"id":"07-1","title":"UX・ユーザビリティ・設計プロセス","explain":"\u003cp>UI（User Interface：操作画面・接点）はボタンや表示、UX（User Experience：利用体験）は利用前から利用後までを含む体験全体。ISO 9241-11のユーザビリティ概念は、特定の利用状況での有効さ、効率、満足度で捉える。利用者・業務・利用環境を調査し、ペルソナやカスタマージャーニーで仮説を可視化する。仮説は実際の利用者調査で検証する。\u003c/p>\n\u003cp>プロトタイプは低忠実度の紙画面から実動する試作品まで目的に応じて選ぶ。ヒューリスティック評価は専門家が原則に照らして問題を検討、ユーザビリティテストは利用者の行動を観察する。ABテストは無作為割付などの条件を設計し、比較指標と交絡要因に注意する。\u003c/p>\n","worked":"\u003cp>フォーム送信に平均30秒かかる改善案Aと20秒のBがあっても、Bで入力ミス率が2倍なら効率だけで優劣を決められない。有効さ（完了率・誤入力）も測る。\u003c/p>\n","prompt":"ペルソナに詳しい物語を書けば調査が不要か。","answer":"\u003cp>不要にはならない。根拠のない架空設定を事実扱いしない。\u003c/p>\n","beginner":{"scenario":"予約アプリの操作に平均5分かかるなら、観察で迷う場所を見つけ、試作品で2分になるか測る。","trap":"UX（利用者体験）は見た目だけではなく利用前後も含む。","quizId":"U-07-1"},"textbook":[{"heading":"使いやすさとは何か","body":"アプリが仕様通り動いても利用者が目的を達成できなければ役に立ちません。UI（User Interface：利用者との接点）は画面や入力操作など、UX（User Experience：利用者体験）は利用前の期待、利用中の操作、利用後の満足まで含む体験です。ユーザビリティは特定の利用者が特定の状況で目標を達成する有効さ、効率、満足度などを評価します。"},{"heading":"人間中心設計の進め方","body":"まず利用者が何をどの環境で行うか観察し、利用者の要求を明確にします。画面案を作り、試作品（プロトタイプ）を試してもらい、問題を見つけ改善を繰り返します。ペルソナは調査に基づく代表的利用者像、ユーザージャーニーは目的達成までの行動と体験の流れを表します。"},{"heading":"評価する指標","body":"購入画面なら完了率、完了までの時間、入力ミス、満足度を測ります。利用者の発言だけでなく行動を観察し、目的を妨げる要因を探します。好みの画面を多数決で選ぶだけではなく、誰が何を達成するための設計か考えます。"}]},{"id":"07-2","title":"情報設計・操作の一貫性","explain":"\u003cp>認知負荷を減らすには、関連情報を近くに配置し、複数の作業を分断せず、必要なときに選択肢を示す。ナビゲーションは情報構造を反映し、現在地・戻り方・次の操作を明確にする。アフォーダンス（操作可能性の手掛かり）、フィードバック（操作結果の即時通知）、制約（誤操作防止）を使う。\u003c/p>\n\u003cp>Fittsの法則は目標までの距離と大きさがポインティング時間に関係する考え方。重要なボタンを押しやすい位置とサイズにするのに役立つ。入力の冗長な手間を減らす一方、破壊的操作には確認・取り消しを備える。\u003c/p>\n","worked":"\u003cp>「削除」ボタンを「保存」と同じ色・隣接配置にすると誤操作を誘発しやすい。削除を視覚的に区別し、取り消しや復元機能を用意する。\u003c/p>\n","prompt":"使いづらい画面を詳細マニュアルで補えば十分か。","answer":"\u003cp>まずUIで認知負荷と誤操作を減らすことが重要。\u003c/p>\n","beginner":{"scenario":"送信後に処理中と表示し二重送信を防ぐ。完了時に受付番号、失敗時に理由と再試行方法を示す。","trap":"警告が多いほど使いやすいわけではない。","quizId":"U-07-2"},"textbook":[{"heading":"操作が予測できる設計","body":"同じ操作を異なる画面で別の名称や位置にすると、利用者は毎回学び直す必要があります。操作の一貫性を持たせ、意味の近い情報をグループにまとめます。入力欄には形式の例や単位を示し、入力の負担を減らします。"},{"heading":"操作の結果を知らせる","body":"ボタンを押した後に何も起きないと利用者は不安になり、再度押すことがあります。処理中の表示、完了通知、エラーの具体的な理由と回復方法を示すことがフィードバックです。破壊的な操作には確認や取り消しを用意します。"},{"heading":"情報の優先順位","body":"重要な情報を見つけやすい位置に置き、見出し、余白、文字の大きさで階層を示します。すべてを目立たせると優先順位が分からなくなります。選択肢を絞る、段階的に詳細を表示する、検索・絞込みを設けるなど、利用者の認知負荷を抑える方法があります。"}]},{"id":"07-3","title":"アクセシビリティ・国際化","explain":"\u003cp>アクセシビリティは障害の有無にかかわらず利用可能にする設計。画像の代替テキスト、キーボード操作、十分な色のコントラスト、フォームのラベル、明確なエラー表示、読み上げ順序を整える。WCAG（Web Content Accessibility Guidelines：Webコンテンツのアクセシビリティ指針）の考え方は知覚可能・操作可能・理解可能・堅ろう。\u003c/p>\n\u003cp>国際化（i18n）は言語・地域差へ対応しやすい構造、地域化（l10n）は各地域向けの翻訳や日付・通貨・書式の調整。文字コードUTF-8（Unicode Transformation Format 8-bit：Unicodeの符号化方式）を使っても、単位や住所形式の違いは自動的には解決しない。\u003c/p>\n","worked":"\u003cp>エラーを赤色の枠線だけで示すと色覚特性や音声読み上げで伝わりにくい。テキストで「必須項目です」を付け、入力欄と関連付ける。\u003c/p>\n","prompt":"読みやすい配色だけでアクセシビリティ対応が完了するか。","answer":"\u003cp>しない。操作・構造・支援技術への適合も必要。\u003c/p>\n","beginner":{"scenario":"赤と緑だけで合否を示さず、合格・不合格の文字と形を併用する。読み上げでも意味を伝える。","trap":"文字を画像にすると拡大や読み上げが難しくなることがある。","quizId":"U-07-3"},"textbook":[{"heading":"誰でも使えるという目標","body":"アクセシビリティは障害の有無や環境にかかわらず情報・機能にアクセスできるようにすることです。視覚に頼れない人には読み上げ、手で細かい操作が難しい人にはキーボード操作などを提供します。色だけで状態を表さず文字や形を併用し、画像には意味に応じた代替テキストを付けます。"},{"heading":"具体的な設計","body":"画面を拡大しても文字やボタンが重ならないようにし、操作対象にフォーカスが当たる順番を意味のある順序にします。入力欄にはラベルを付け、エラーを読み上げられる形で伝えます。WCAG（ウェブコンテンツアクセシビリティガイドライン）はウェブのアクセシビリティを評価する指針です。"},{"heading":"国際化と地域化","body":"国際化（i18n）は文言をプログラムから分離し、文字コードや日時・通貨の違いに対応できる設計にすることです。地域化（l10n）は特定地域の言語・表示慣習などへ具体的に適応することです。翻訳だけでは時差、文字列の長さ、右から左へ読む言語などへの対応はできません。"}]},{"id":"07-X01","title":"ユーザーインタフェース技術と評価","explain":"\u003cp>GUI（グラフィカルユーザーインタフェース）は画面の部品を使い、CUI（文字ユーザーインタフェース）はコマンドなど文字で操作する。音声認識・ジェスチャ・タッチ操作も入力手段で、用途に応じて選ぶ。画面設計では入力補助、操作の一貫性、フィードバック、エラー回復を考慮する。\u003c/p>\u003cp>ユーザー体験（UX）は利用前後を含む体験、ユーザビリティは特定の利用状況における目的達成のしやすさ。ユーザテストでは成功率、時間、誤操作などを測定する。ヒューリスティック評価は専門家が原則と照合する。アクセシビリティではキーボード操作、色以外の識別、代替テキスト、読み上げ対応を重視する。\u003c/p>","worked":"\u003cp>色だけでエラーを示す画面に文字とアイコンを追加し、読み上げでも通知されるように改善する。\u003c/p>","prompt":"実際の利用者に課題を実行してもらい成功率を測定する方法は？","answer":"\u003cp>ユーザビリティテスト。\u003c/p>","beginner":{"scenario":"20人中15人が購入完了したならタスク成功率75%。改善版でも同じ条件で時間・成功率を測る。","trap":"A/Bテストは指標や対象次第。全員の使いやすさを保証しない。","quizId":"U-07-X01"},"textbook":[{"heading":"入力方式を選ぶ","body":"GUI（グラフィカルユーザーインタフェース）は画面上の部品で操作し、CUI（文字ユーザーインタフェース）はコマンドなど文字で指示します。タッチ、音声認識、ジェスチャなども用途に応じて選びます。手袋を着ける工場ではタッチ操作に制約があり、騒音のある場所では音声認識が難しい場合があります。"},{"heading":"評価方法を選ぶ","body":"ユーザビリティテストは実際の利用者に課題を実行してもらい、成功率、時間、誤操作を観察します。ヒューリスティック評価は専門家が設計原則に照らして問題を発見します。認知的ウォークスルーは初めて使う利用者が操作を理解できるか手順ごとに検討します。"},{"heading":"A/Bテストの注意","body":"利用者を比較可能な条件で二つの設計案へ割り当て、購入率などを比較します。一方が優れていると判断するには十分な標本、適切な指標、偏りのない条件が必要です。売上の改善がアクセシビリティの改善を意味するとは限りません。"}]},{"id":"07-Y01","title":"情報アーキテクチャと操作部品","explain":"\u003cp>通販サイトの1000商品を全部一列に並べると探しにくい。商品をカテゴリ別に階層化し、価格・色などのタグでも探せるようにする。ラベルは情報の名称、チャンクは意味のあるまとまり、ナビゲーションは情報間を移動する仕組み。直線型は申込み手順のような順序、Webリンク型は関連ページを網状に結ぶ、フォークソノミーは利用者自身によるタグ分類。メタデータはデータを説明する情報で、セマンティックWebは意味や関係を機械でも利用しやすくする考え方。\u003c/p>","worked":"\u003cp>\u003cb>配送方法を通常・速達のどちらか一つ、追加オプションを複数選ぶ画面を設計する。\u003c/b>\u003c/p>\u003cp>配送方法はラジオボタン、オプションは独立したチェックボックスが適する。\u003c/p>","prompt":"一つの候補から選ぶ部品と複数を独立に選ぶ部品の違いを説明せよ。","answer":"\u003cp>ラジオボタンはグループ内で排他的、チェックボックスは項目ごとに真偽を選ぶ。\u003c/p>","textbook":[{"heading":"情報を探せる構造にする","body":"通販サイトの1000商品を全部一列に並べると探しにくい。商品をカテゴリ別に階層化し、価格・色などのタグでも探せるようにする。ラベルは情報の名称、チャンクは意味のあるまとまり、ナビゲーションは情報間を移動する仕組み。直線型は申込み手順のような順序、Webリンク型は関連ページを網状に結ぶ、フォークソノミーは利用者自身によるタグ分類。メタデータはデータを説明する情報で、セマンティックWebは意味や関係を機械でも利用しやすくする考え方。"},{"heading":"操作の単位と入力方式","body":"OOUI（オブジェクト指向UI）は商品などの対象を先に選び、その対象への操作を選ぶ。タスク指向UIは「返品する」など目的を先に選び対象を指定する。NUI（自然な操作のインタフェース）は身振り・タッチ等、VUI（音声インタフェース）は音声操作、マルチモーダルは音声・画像・タッチ等を組み合わせる。シグニファイアは押せることなどを示す手掛かり、アフォーダンスは対象と利用者の関係で可能な行為を指す。"},{"heading":"操作部品を選ぶ","body":"GUI（グラフィカルユーザーインタフェース）ではアイコン、ウィンドウ、ラジオボタン（原則一択）、チェックボックス（複数選択可）、トグル（状態の切替）、リストボックス、プルダウン、ポップアップ、テキストボックスを使う。アコーディオンは詳細を開閉、ツールチップは短い補足。ホバーはポインタを重ねる操作なのでタッチ画面では代替が必要。タップ、スワイプ、フリック、ピンチ、長押しは意味が分かる設計にする。"}],"beginner":{"scenario":"情報を探せる構造にするから順に、操作の単位と入力方式、操作部品を選ぶを理解する。","trap":"利用者が付与したタグで情報を分類する方式。","quizId":"U-07-Y01"}},{"id":"07-Y02","title":"体験設計・情報デザイン・評価法","explain":"\u003cp>UX（利用者体験）の五段階モデルでは戦略で利用者・事業の目的、要件で機能や内容、構造で情報や操作の流れ、骨格で配置、表層で見た目を考える。画面の美しさだけを先に決めない。UXハニカムは有用、使いやすい、望ましい、見つけやすい、アクセス可能、信頼できる、価値があるなどの観点を持つ。エモーショナルデザインは感情や印象、インタラクションデザインは操作と応答を設計する。\u003c/p>","worked":"\u003cp>\u003cb>初心者は操作に60秒、熟練者は15秒かかった。\u003c/b>\u003c/p>\u003cp>時間比は4。操作の分かりにくさを疑い、観察や発話内容から原因を調べる。\u003c/p>","prompt":"色だけでエラーを通知する画面をどう改善するか。","answer":"\u003cp>色に加えエラーの文字・アイコン・読み上げ可能な通知を提供する。\u003c/p>","textbook":[{"heading":"目的から画面へ","body":"UX（利用者体験）の五段階モデルでは戦略で利用者・事業の目的、要件で機能や内容、構造で情報や操作の流れ、骨格で配置、表層で見た目を考える。画面の美しさだけを先に決めない。UXハニカムは有用、使いやすい、望ましい、見つけやすい、アクセス可能、信頼できる、価値があるなどの観点を持つ。エモーショナルデザインは感情や印象、インタラクションデザインは操作と応答を設計する。"},{"heading":"情報と画面を整理する","body":"近接は関係する項目を近くに、整列は位置を揃え、反復は規則を繰返し、対比は差を目立たせる。LATCHは場所・五十音等の順序・時間・カテゴリ・階層で情報を整理する考え方。ワイヤーフレームは画面の骨格、ストーリーボードは場面の順序、ムードボードは視覚的方向性を示す。レスポンシブ設計は画面幅等に応じ配置を変える。プログレッシブエンハンスメントは基本機能を確保し対応環境で機能を加える。"},{"heading":"利用者の違いを考える","body":"ユニバーサルデザインの七原則は公平な利用、柔軟性、単純で直感的、知覚可能な情報、誤りへの寛容さ、少ない身体負担、接近・利用のための空間。インクルーシブデザインは多様な利用者を設計に巻き込む。思考発話法は操作中の考えを話してもらい、回顧法は操作後に振返る。NEM（初心者・熟練者の操作時間比による評価）は時間差が大きい箇所を発見する。視線追跡は注視位置などを測るが理解の有無は直接証明しない。"}],"beginner":{"scenario":"目的から画面へから順に、情報と画面を整理する、利用者の違いを考えるを理解する。","trap":"NEMは操作時間比などから使いにくい箇所を探す。","quizId":"U-07-Y02"}},{"id":"07-Y03","title":"入力検査・帳票・識別コードの設計","explain":"\u003cp>年齢欄にABCが入るのを防ぐ数値検査、日付の書式を確かめるフォーマットチェック、0〜120など範囲を検査するリミットチェック、開始日が終了日以前かを確認する組合せチェック、商品コードがマスタに存在するかを確かめる照合チェック、合計金額と明細合計の一致を確かめるバランスチェックがある。処理順の矛盾はシーケンスエラー。入力画面だけでなくサーバでも検証する。\u003c/p>","worked":"\u003cp>\u003cb>商品IDが整数だが商品マスタにない場合に行う検査は？\u003c/b>\u003c/p>\u003cp>照合チェック。数値形式が正しくても商品が存在するとは限らない。\u003c/p>","prompt":"注文の開始日が終了日より後になっていないか確認する検査は？","answer":"\u003cp>組合せチェック。二つの項目の関係を検査する。\u003c/p>","textbook":[{"heading":"誤入力を検査する","body":"年齢欄にABCが入るのを防ぐ数値検査、日付の書式を確かめるフォーマットチェック、0〜120など範囲を検査するリミットチェック、開始日が終了日以前かを確認する組合せチェック、商品コードがマスタに存在するかを確かめる照合チェック、合計金額と明細合計の一致を確かめるバランスチェックがある。処理順の矛盾はシーケンスエラー。入力画面だけでなくサーバでも検証する。"},{"heading":"チェックディジットを計算する","body":"識別コードの末尾に検査用数字を追加すると転記ミスを検出できる。例として数字123に各桁の重み1,3,1を掛けると1＋6＋3＝10。合計を10の倍数にする検査桁は0。124に変わると合計11となり誤りを検出する。実際の規格ごとに重みや算出法は異なり、全ての誤りを検出するわけではない。順番コードは連番、区分コードはカテゴリ別範囲、桁別コードは桁ごとに意味、表意コードは名称等を連想させ、合成コードは複数の識別要素を組み合わせる。"},{"heading":"帳票とデータをつなぐ","body":"帳票は請求書など定型の出力。明細、見出し、合計、改ページ条件、印刷幅等を設計する。フォームオーバーレイは帳票の定型部分と可変データを重ねる。画面・帳票の項目をデータベースの列、計算ルール、権限に対応付け、同じ情報を不要に重複入力させない。利用者の用語やエラーからの回復を考える。"}],"beginner":{"scenario":"誤入力を検査するから順に、チェックディジットを計算する、帳票とデータをつなぐを理解する。","trap":"相互に対応する集計値の整合性を確かめる。","quizId":"U-07-Y03"}}],"beginnerIntro":"利用者の目的や操作の迷いを理解し、実際の利用者による評価を考える。見た目だけでなく体験全体を扱う。"},{"id":8,"title":"情報メディア","group":"テクノロジ","priority":"A標準","summary":"画像・音声・動画のデータ量、圧縮、色表現、著作権の基礎。","lessons":[{"title":"画像のデータ量","body":"非圧縮画像の概算サイズは横画素×縦画素×色深度÷8バイト。RGB各8ビットなら1画素24ビット。解像度とファイル容量は同義ではない。","check":"圧縮率を使うときは圧縮前後の定義を確認。"},{"title":"可逆・非可逆圧縮","body":"可逆圧縮は元の情報を完全復元可能。JPEGなどの一般的な非可逆圧縮では一部の情報が失われる。PNGは一般に可逆圧縮を利用する。","check":"拡張子だけで全ての設定を断定しない。"},{"title":"音声と動画","body":"PCM（Pulse Code Modulation：パルス符号変調）の非圧縮音声データ量は標本化周波数×量子化ビット数×チャネル数×時間÷8。動画ではフレームレートと解像度が容量に影響。","check":"ビット毎秒とバイト毎秒に注意。"},{"title":"色空間と描画","body":"RGBは光の三原色による加法混色、CMYKは印刷で使う減法混色。ベクタ画像は形状記述により拡大しても原理上輪郭が荒れにくい。","check":"ラスターとベクタの用途を区別。"}],"terms":[{"term":"ラスター画像","definition":"画素の並びで画像を表現する方式"},{"term":"ベクタ画像","definition":"点・線・曲線などの形状情報で画像を表現する方式"},{"term":"RGB","definition":"赤・緑・青の光を加えて色を表現する方式"},{"term":"CMYK","definition":"シアン・マゼンタ・黄・黒のインキで色を表す方式"},{"term":"可逆圧縮","definition":"情報を損なわず元データを再現できる圧縮"},{"term":"非可逆圧縮","definition":"一部の情報を失う代わりに圧縮効率を高める方式"},{"term":"PCM","definition":"音声振幅を標本化して量子化し符号化する方式"},{"term":"フレームレート","definition":"1秒間に表示する映像の静止画枚数"},{"term":"標本化周波数","definition":"1秒間のアナログ信号測定回数"}],"questions":[{"id":"Q08-01","chapter":8,"kind":"applied","q":"800×600画素で1画素24ビットの非圧縮画像の容量は。","options":["約0.48MB","約1.44MB","約4.8MB","約14.4MB"],"correct":1,"explain":"800×600×24÷8=1,440,000バイト≒1.44MB（10進表記）。"},{"id":"Q08-02","chapter":8,"kind":"applied","q":"元データを完全に復元できる圧縮方式は。","options":["非可逆圧縮","可逆圧縮","量子化のみ","サンプリングのみ"],"correct":1,"explain":"可逆は情報を失わない。"},{"id":"Q08-03","chapter":8,"kind":"applied","q":"CD品質の音声を想定し44.1kHz・16ビット・2チャンネル・10秒の非圧縮量は。","options":["約0.88MB","約1.76MB","約8.82MB","約17.64MB"],"correct":1,"explain":"44,100×16×2×10÷8=1,764,000バイト。"},{"id":"D08-01","chapter":8,"kind":"applied","q":"1920×1080画素で24ビットの非圧縮RGB画像の画素データ量に最も近いものはどれか。","options":["約0.6MB","約2.1MB","約6.2MB","約24MB"],"correct":2,"explain":"1920×1080×24/8=6,220,800バイト。ヘッダや行パディングは除く。"},{"id":"D08-02","chapter":8,"kind":"applied","q":"44.1kHz、16ビット、ステレオの非圧縮PCMを60秒記録した容量に最も近いものはどれか。","options":["約1.3MB","約5.3MB","約10.6MB","約21.2MB"],"correct":2,"explain":"44,100×16×2×60/8=10,584,000バイト。圧縮コーデックの容量とは異なる。"},{"id":"D08-03","chapter":8,"kind":"applied","q":"ビットレート2Mbpsの映像を10分送る場合の映像データ量の理論値はどれか（付加情報は無視）。","options":["15MB","75MB","150MB","1200MB"],"correct":2,"explain":"2×10^6bit/秒×600秒÷8=150,000,000バイト=150MB。bitとByteを区別。"},{"id":"Q-08-X01","chapter":8,"kind":"applied","q":"画素を正確に保持して保存したいスクリーンショットに一般的に適する形式は？","options":["JPEG","PNG","MP3","H.264"],"correct":1,"explain":"PNG。可逆圧縮で画素を復元できる。"},{"id":"U-08-1","chapter":8,"kind":"applied","q":"400×200画素・16bit/画素の非圧縮容量は？","options":["160000B","80000B","1280000B","320000B"],"correct":0,"explain":"400×200×16÷8＝160000バイト。"},{"id":"U-08-2","chapter":8,"kind":"applied","q":"44.1kHz・16bit・2チャネルの非圧縮音声1秒の容量は？","options":["88200B","176400B","1411200B","44100B"],"correct":1,"explain":"44100×16×2÷8＝176400バイト。"},{"id":"U-08-3","chapter":8,"kind":"applied","q":"受信データの一時保存で短時間の通信変動を吸収する仕組みは？","options":["量子化","アンチエイリアス","バッファリング","カプセル化"],"correct":2,"explain":"先のデータを保持すれば短時間の遅れを吸収できる。"},{"id":"U-08-X01","chapter":8,"kind":"applied","q":"3次元モデル表面に画像を割り当てる技法は？","options":["量子化","正規化","パリティ検査","テクスチャマッピング"],"correct":3,"explain":"表面に模様・材質の見た目を付ける。"},{"id":"U-08-Y01","chapter":8,"kind":"applied","q":"演奏する音の高さ・強さ・時刻等を表す方式は？","options":["PCM","BMP","Exif","MIDI"],"correct":3,"explain":"MIDIは演奏指示を表し、PCMは音声波形の数値表現。"},{"id":"U-08-Y02","chapter":8,"kind":"applied","q":"画素ごとに補間した法線を用い照明を計算する方式は？","options":["フォンシェーディング","グーローシェーディング","ランレングス符号化","MIDI"],"correct":0,"explain":"フォン方式は法線を補間し照明計算を行う。"}],"deepIntro":"画像・音・動画は連続的な現実を離散的なデータにするため、品質と容量のトレードオフが生まれる。","deep":[{"id":"08-1","title":"画像の解像度・色と容量","explain":"\u003cp>ラスター画像は画素（ピクセル）の集合。幅W、高さH、1画素bビットなら非圧縮の概算容量はW×H×b/8バイト（ヘッダや行パディングを除く）。RGB（Red Green Blue：赤緑青）の各8ビットで24ビットカラーは1画素約3バイト。アルファ値（透明度）が8ビット追加されるRGBAは4バイト。色深度と解像度は別の概念。\u003c/p>\n\u003cp>ベクター画像は線・曲線・塗りを数式等で表し、拡大時も輪郭が劣化しにくい。JPEGは一般に非可逆圧縮、PNGは可逆圧縮（ただし元画像に変換が入っていない場合）。色空間RGBは光の加法混色、CMYKは印刷の減法混色に使う。\u003c/p>\n","worked":"\u003cp>1920×1080画素、24ビットの生画像は1920×1080×3＝6,220,800バイト、約6.22MB（10進）または約5.93MiB（2進）。MBとMiBの違いに注意。\u003c/p>\n","prompt":"画像のdpiを2倍にすれば画素数も必ず4倍か。","answer":"\u003cp>ならない。dpiは印刷・表示の密度指定に使われ、画素数そのものとは別。\u003c/p>\n","beginner":{"scenario":"画像は画素の集合。640×480画素・24bitなら640×480×24÷8＝921600バイト（非圧縮）。","trap":"縦横2倍は画素数4倍。圧縮やヘッダの条件を確認する。","quizId":"U-08-1","lab":{"title":"画像容量と圧縮率を求める","problem":"1200×800画素、RGB各8ビットの画像を、元の容量の1/5に圧縮する。容量は？","steps":["色深度は8×3=24bit/画素。","画素数は1200×800=960000。","元容量は960000×24÷8=2880000バイト。","圧縮後は2880000÷5=576000バイト。十進単位で576kB。"],"answer":"576000バイト","check":"圧縮率の定義が「元の何倍」か「削減率」かを確認する。今回は元の1/5。"}},"textbook":[{"heading":"画像は数値の格子","body":"デジタル画像は横と縦に並ぶ画素（ピクセル）で表します。RGBは赤・緑・青の光を混ぜる加法混色で、各8ビットなら各256段階、全体256³＝16777216通りの組合せです。CMYKは印刷で用いるシアン・マゼンタ・イエロー・黒の色材の表現です。"},{"heading":"容量を導く","body":"横W画素、縦H画素、1画素bビットなら非圧縮容量はW×H×b/8バイトです。例えば1000×500画素、24ビットなら1500000バイト。透明度（アルファ）8ビットも持つ32ビット表現なら2000000バイトです。ヘッダや行のパディング、圧縮を含む場合は別途計算します。"},{"heading":"解像度と画像形式","body":"ラスタ画像は画素の集合なので拡大すると画素が目立ちます。ベクタ画像は線・曲線などの形状を数式で表すのでロゴや図面の拡大に向きます。dpiは1インチ当たりのドット数で印刷などに使う尺度、ppiは1インチ当たりの画素数です。画素数と物理的な表示サイズを区別します。"}]},{"id":"08-2","title":"音声の標本化と量子化","explain":"\u003cp>連続音声をディジタル化するとき、サンプリング（標本化）で時間を離散化し、量子化で振幅を有限段階にする。最大周波数fmaxの帯域制限信号を復元するには、標本化周波数fsが通常2fmaxより高い必要がある（標本化定理）。満たさないとエイリアシング（折返しひずみ）が起こるため、入力側の低域通過フィルタが重要。\u003c/p>\n\u003cp>無圧縮PCM（Pulse Code Modulation：パルス符号変調）のデータ量は標本化周波数×量子化ビット数×チャンネル数×秒数/8。音声コーデックを使う場合はビットレートから計算する。\u003c/p>\n","worked":"\u003cp>44.1kHz、16ビット、ステレオ2ch、60秒のPCMは44,100×16×2×60/8＝10,584,000バイト（約10.6MB）。圧縮後容量ではない。\u003c/p>\n","prompt":"量子化ビット数を増やすと標本化周波数も増えるか。","answer":"\u003cp>増えない。振幅方向の分解能と時間方向の細かさは別。\u003c/p>\n","beginner":{"scenario":"音は連続した振動。8kHz、16bit、1チャネル、10秒なら8000×16×10÷8＝160000バイト。","trap":"標本化は時間方向、量子化は振幅方向の離散化。","quizId":"U-08-2"},"textbook":[{"heading":"連続する音を数値にする","body":"音の振幅を一定時間間隔で測るのが標本化、測った値を有限の段階に丸めるのが量子化、整数値をビット列へ変換するのが符号化です。これらを組み合わせた代表方式がPCM（パルス符号変調）です。標本化周波数は毎秒何回測るか、量子化ビット数は振幅を何段階に分けるかを決めます。"},{"heading":"標本化定理","body":"最高周波数がfの帯域制限信号を理想的に復元するには標本化周波数を2fより高くします。例えば人の音声を4kHzまでとすれば8kHzを超える標本化を選ぶなど、対象帯域に応じ設計します。事前に不要な高周波をフィルタで除くことも重要です。"},{"heading":"データ量","body":"標本化周波数×量子化ビット数×チャネル数×秒数÷8で非圧縮音声のバイト数を求めます。ステレオは2チャネル、モノラルは1チャネルです。44.1kHz・16ビット・ステレオは毎秒176400バイト。圧縮形式では指定されたビットレートを用いることがあります。"}]},{"id":"08-3","title":"動画・圧縮・ストリーミング","explain":"\u003cp>動画は連続画像と音声の系列。フレームレートは1秒当たりの画像枚数、解像度は1フレームの画素数。非圧縮動画は容量が巨大なので、フレーム内圧縮とフレーム間の差分・動き補償を組み合わせる。Iフレーム（独立フレーム）、Pフレーム（過去参照）、Bフレーム（前後参照）の構成は、容量・遅延・ランダムアクセスのトレードオフ。\u003c/p>\n\u003cp>ストリーミングでは帯域とバッファを管理する。ABR（Adaptive Bitrate：適応ビットレート）配信は通信状態に応じて品質を切り替え再生停止を減らす。CDN（Content Delivery Network：コンテンツ配信網）は利用者に近い拠点から配信して遅延・負荷を抑える。\u003c/p>\n","worked":"\u003cp>動画が2Mbpsで10分なら理想的な映像データ量は2×10⁶×600/8＝150MB。音声・コンテナ等を除く概算。MbpsをMB/sと取り違えない。\u003c/p>\n","prompt":"圧縮率が高ければ視聴品質も必ず高いか。","answer":"\u003cp>ならない。情報を削り過ぎれば画質・音質が低下する。\u003c/p>\n","beginner":{"scenario":"映像4Mbit/s、音声0.2Mbit/s、10秒なら合計4.2×10÷8＝5.25MB（追加情報なし）。","trap":"フレームレートと画素解像度は異なる。","quizId":"U-08-3"},"textbook":[{"heading":"動画をどう圧縮するか","body":"動画は時間順に並ぶフレーム（画像）と音声から成ります。毎秒30フレームなら1秒に30枚表示します。各フレームを独立に圧縮する方法と、前後のフレームの共通部分や動きの情報を利用する方法があり、後者は静止した背景などの重複を減らせます。"},{"heading":"ビットレートと通信","body":"ビットレートは1秒当たりのデータ量です。4Mbit/sの動画を60秒保存すれば、追加情報を無視した容量は4×60÷8＝30MBです。一定ビットレートは通信量を予測しやすく、可変ビットレートは場面の複雑さによって量を調整します。"},{"heading":"ストリーミング","body":"全データを受信してから再生するのではなく、受信しながら再生します。バッファに先のデータを一時保存し通信速度の短時間の変動を吸収します。適応型ストリーミングでは通信状態に応じ画質・ビットレートを切り替えます。低遅延と途切れにくさの間にはトレードオフがあります。"}]},{"id":"08-X01","title":"画像・音声・動画形式とマルチメディア応用","explain":"\u003cp>JPEGは一般に非可逆の写真圧縮、PNGは可逆圧縮と透過、GIFは最大256色のパレットや簡易アニメーションを扱う。MPEGは動画・音声圧縮等の規格群、H.264は動画符号化規格。YUV系の色表現は輝度と色差を分け、色差の解像度を下げることがある。PCM（パルス符号変調）は標本化・量子化した値を符号化する。\u003c/p>\u003cp>ラスタは画素、ベクタは図形の数式。アンチエイリアスは境界のぎざぎざを抑え、ディザリングは限られた色で中間調を表す。CG（コンピュータグラフィックス）のレンダリングはモデルから画像を生成し、レイトレーシングは光線を追跡する。テクスチャマッピングは表面に画像を貼る。ARは拡張現実、VRは仮想現実、MRは複合現実。\u003c/p>","worked":"\u003cp>ロゴの拡大縮小にはベクタ形式が適する場合が多い。写真をJPEG保存すると画質と容量のトレードオフがある。\u003c/p>","prompt":"画素を正確に保持して保存したいスクリーンショットに一般的に適する形式は？","answer":"\u003cp>PNG。可逆圧縮で画素を復元できる。\u003c/p>","beginner":{"scenario":"写真にはJPEG、文字入り図表には可逆のPNGやベクタ形式が適する場合がある。","trap":"可逆は元データを復元でき、非可逆は情報を一部失う。","quizId":"U-08-X01"},"textbook":[{"heading":"用途と形式の対応","body":"JPEGは写真向きの非可逆圧縮が一般的で、PNGは可逆圧縮・透明度に対応、GIFは限定色の画像や簡単なアニメーションに使われます。MP3やAACは音声圧縮、H.264などは動画符号化規格です。コンテナ形式は動画・音声・字幕などをまとめる入れ物、コーデックは符号化・復号の方式です。"},{"heading":"画像処理の仕組み","body":"アンチエイリアスは斜線や曲線の境界のぎざぎざを周辺画素の色で滑らかに見せます。ディザリングは少ない色で中間調に見えるよう画素を配置します。画像フィルタは近傍画素を使って平滑化・輪郭抽出などを行います。"},{"heading":"3次元と仮想世界","body":"CG（コンピュータグラフィックス）では形状・材質・光・視点から画像を生成（レンダリング）します。テクスチャマッピングは表面に模様を割り当て、Zバッファは画素ごとに奥行きを比較して手前の物体を表示します。VRは仮想現実、ARは現実に情報を重ねる拡張現実、MRは現実と仮想の相互作用を含む複合現実です。"}]},{"id":"08-Y01","title":"メディアのファイル形式・圧縮・編集","explain":"\u003cp>WAVやAIFF、AUは音声データを格納する形式で、WAV等は非圧縮PCMを含むことが多い。MP3は聴覚特性を利用して音声を非可逆圧縮する。MIDI（電子楽器のデジタルインタフェース）は発音する音符、強さ、時刻などの演奏指示を記録し、音源が音を生成する。録音された波形そのものではない。PDFは文書の見た目を保持しやすい形式、DTP（机上出版）はコンピュータで紙面を制作すること。オーサリングは文字・音声・画像等を編集し統合する。\u003c/p>","worked":"\u003cp>\u003cb>100MBの画像を圧縮して20MBになった。\u003c/b>\u003c/p>\u003cp>元の20%のサイズであり、削減率は80%。復元できるかは圧縮方式による。\u003c/p>","prompt":"同じ演奏指示でもMIDIの再生音が音源で変わる理由は？","answer":"\u003cp>音波そのものではなく音符等の指示を保存し、音源が音を作るため。\u003c/p>","textbook":[{"heading":"音を保存するか演奏を記録するか","body":"WAVやAIFF、AUは音声データを格納する形式で、WAV等は非圧縮PCMを含むことが多い。MP3は聴覚特性を利用して音声を非可逆圧縮する。MIDI（電子楽器のデジタルインタフェース）は発音する音符、強さ、時刻などの演奏指示を記録し、音源が音を生成する。録音された波形そのものではない。PDFは文書の見た目を保持しやすい形式、DTP（机上出版）はコンピュータで紙面を制作すること。オーサリングは文字・音声・画像等を編集し統合する。"},{"heading":"静止画と動画を区別する","body":"BMPは典型的に画素の配列を持つ。TIFFは多様な画像情報や圧縮方式に対応。HEIFは画像等を格納するコンテナ形式。Exifは撮影日時・カメラ設定等のメタデータを記録する規格。H.264とH.265（HEVC）は動画符号化規格、AVIやQuickTimeは音声・動画等を格納するコンテナ。Motion JPEGは各フレームをJPEGとして圧縮する。インタレースは走査線を交互に描き、プログレッシブは順に描く。ノンリニア編集は任意の位置の素材を編集しやすい。"},{"heading":"圧縮方式を選ぶ","body":"可逆圧縮は元の情報を正確に復元する。ZIPは汎用の可逆圧縮等の形式。非可逆は情報を捨てて圧縮率を高めるが復元は近似。ファクシミリ画像のMH（修正ハフマン）は白黒の連続長、MR（修正READ）とMMR（修正修正READ）は前の走査線との差等も利用する。圧縮率の定義が元容量に対する圧縮後の比か、削減割合かを確認する。4K・8Kは画素数の多い映像で、容量・帯域・復号負荷が大きくなる。"}],"beginner":{"scenario":"音を保存するか演奏を記録するかから順に、静止画と動画を区別する、圧縮方式を選ぶを理解する。","trap":"MIDIは演奏指示を表し、PCMは音声波形の数値表現。","quizId":"U-08-Y01"}},{"id":"08-Y02","title":"色・画像編集・3次元描画","explain":"\u003cp>色相は赤や青などの色の種類、明度は明るさ、彩度は鮮やかさ。加法混色はRGBの光を加え白へ、減法混色は色材で光を吸収し黒に近づく。キープレートは印刷の黒版。YUV系の表現では輝度と色差を分ける。映像で一般的なY'CbCrの4:4:4は色差を間引かず、4:2:2は横方向で半分、4:2:0は横・縦方向で概ね半分にする。人は一般に輝度の細かい変化に敏感なので色差の解像度を下げて容量を抑える。\u003c/p>","worked":"\u003cp>\u003cb>8ビットの輝度と二つの8ビット色差成分を4:2:0で4画素分記録する。\u003c/b>\u003c/p>\u003cp>輝度4値＋色差各1値で計6値、48ビット。平均12ビット/画素（追加情報を除く）。\u003c/p>","prompt":"4:4:4に比べ4:2:0の容量が小さい理由は？","answer":"\u003cp>色差成分を空間的に間引いて、輝度より低い解像度で保持するため。\u003c/p>","textbook":[{"heading":"色と明るさを別に扱う","body":"色相は赤や青などの色の種類、明度は明るさ、彩度は鮮やかさ。加法混色はRGBの光を加え白へ、減法混色は色材で光を吸収し黒に近づく。キープレートは印刷の黒版。YUV系の表現では輝度と色差を分ける。映像で一般的なY'CbCrの4:4:4は色差を間引かず、4:2:2は横方向で半分、4:2:0は横・縦方向で概ね半分にする。人は一般に輝度の細かい変化に敏感なので色差の解像度を下げて容量を抑える。"},{"heading":"画像を編集する","body":"ペイント系は画素、ドロー系は図形を主に操作する。レイヤーは複数の画像を重ねる層、トリミングは必要領域の切出し。ルックアップテーブルは入力値から出力値への対応表。ガンマ補正は明るさの非線形な関係を調整する。アンチエイリアシングは輪郭のぎざぎざを抑え、ディザリングは少ない色で中間色らしく見せる。"},{"heading":"3次元の映像を作る","body":"形状と材質に光や視点を設定して画像を描くのがレンダリング。グーローシェーディングは頂点で求めた明るさ等を面内で補間、フォンシェーディングは法線を補間し画素ごとに照明を計算する。テクスチャマッピングは模様を貼る。モーションキャプチャは人などの動きを測定、ホログラムは光の波面情報を再現する技術。VR（仮想現実）、AR（拡張現実）、MR（複合現実）を包括する考え方がXR。VOD（要求時映像配信）は利用者が希望時に再生する。"}],"beginner":{"scenario":"色と明るさを別に扱うから順に、画像を編集する、3次元の映像を作るを理解する。","trap":"フォン方式は法線を補間し照明計算を行う。","quizId":"U-08-Y02"}}],"beginnerIntro":"画像・音声・動画を数値化する。容量計算は単位、圧縮の有無、時間やチャネル数を確認する。"},{"id":9,"title":"データベース","group":"テクノロジ","priority":"B選択候補","summary":"ER図・正規化・SQL・結合・トランザクション・ロックを重点。","lessons":[{"title":"関係モデルとキー","body":"関係データベースは行と列からなる表で扱う。主キーは行を一意識別しNULL不可。外部キーは他表のキーを参照し参照整合性を支える。","check":"候補キー・主キー・外部キーを設計図上で明確にする。"},{"title":"正規化","body":"第1正規形は繰返し項目を排除、第2は複合主キーの一部にのみ依存する非キー属性を分離、第3は非キー属性を介した推移的関数従属を分離する。","check":"関数従属性を記号で書いて整理。"},{"title":"SQLの実行順序","body":"SQL（Structured Query Language：構造化問合せ言語）はFROM/JOIN→WHERE→GROUP BY→HAVING→SELECT→ORDER BYという論理的処理順序で考えると理解しやすい。WHEREはグループ化前、HAVINGは集約後の絞り込み。","check":"COUNT(*)とCOUNT(列)ではNULLの扱いが異なる。"},{"title":"結合","body":"内部結合は一致する行、左外部結合は左表の行を残す。一対多結合では件数が増えるのでCOUNTの集計粒度に注意する。","check":"LEFT JOIN後の右表条件をWHEREに置くと事実上内部結合になる場合がある。"},{"title":"ACIDと分離","body":"トランザクションのACIDは原子性・一貫性・独立性・永続性。分離レベルやロックでダーティリード・ノンリピータブルリード・ファントムリードを制御。","check":"「原子性」と「独立性」は異なる。"}],"terms":[{"term":"主キー","definition":"表の行を一意に識別しNULLを許さない列または列集合"},{"term":"外部キー","definition":"別の表の候補キー等を参照する列・列集合"},{"term":"関数従属","definition":"属性Xが決まると属性Yが一意に決まる関係"},{"term":"第2正規形","definition":"第1正規形かつ非キー属性の主キーの一部への部分関数従属がない状態"},{"term":"第3正規形","definition":"第2正規形を満たし非キー属性の推移的従属を除いた状態"},{"term":"INNER JOIN","definition":"結合条件を満たす行だけを結合するSQL操作"},{"term":"LEFT JOIN","definition":"左側の表の行を残し右表との一致を結合する操作"},{"term":"HAVING","definition":"GROUP BYで集約したグループに条件を掛ける句"},{"term":"ACID","definition":"トランザクションの原子性・一貫性・独立性・永続性"},{"term":"ダーティリード","definition":"未確定トランザクションの変更内容を読む現象"},{"term":"デッドロック","definition":"互いの資源やロックの解放を待ち続ける状態"},{"term":"B木インデックス","definition":"比較検索や範囲検索に適した平衡木型索引"}],"questions":[{"id":"Q09-01","chapter":9,"kind":"applied","q":"売上表から顧客ごとの売上合計が10万円以上の顧客だけ取り出すSQL句は。","options":["WHERE SUM(金額)>=100000","HAVING SUM(金額)>=100000","ORDER BY SUM(金額)>=100000","LIMIT SUM(金額)>=100000"],"correct":1,"explain":"集約後の条件はHAVINGに書く。"},{"id":"Q09-02","chapter":9,"kind":"applied","q":"主キー(注文番号,商品番号)の表で商品名が商品番号だけに従属する場合、問題となるのは。","options":["部分関数従属","外部結合","排他制御","可逆圧縮"],"correct":0,"explain":"複合キーの一部に従属するため第2正規形で分離を検討する。"},{"id":"Q09-03","chapter":9,"kind":"applied","q":"未コミットの別トランザクションの値を読んだ現象は。","options":["ファントムリード","ダーティリード","ロストアップデート","デッドロック"],"correct":1,"explain":"確定していないデータの読み取りはダーティリード。"},{"id":"D09-01","chapter":9,"kind":"applied","q":"受注が0件の顧客も含む集計で顧客ごとの受注件数を数えるとき、LEFT JOIN後に適切なのはどれか。","options":["COUNT(*)","COUNT(受注.受注ID)","SUM(顧客.ID)","GROUP BYは使えない"],"correct":1,"explain":"LEFT JOINは受注0件でも顧客行が1行残る。COUNT(*)では1と数えるので、NULLになった右側キーをCOUNTする。"},{"id":"D09-02","chapter":9,"kind":"applied","q":"社員ID→部署ID、部署ID→部署名という依存がある表で、部署名の重複更新を減らす設計はどれか。","options":["部署名を社員表へ複数追加する","全項目を文字列1列にする","社員表と部署表に分割する","社員IDを削除する"],"correct":2,"explain":"非キー属性の推移的関数従属を除く第三正規化の考え方に相当する。"},{"id":"D09-03","chapter":9,"kind":"applied","q":"非同期レプリケーションで、主DBの更新をコミット直後に障害が発生した場合のリスクはどれか。","options":["更新が必ず複製に反映される","複製先への反映前なら直近更新が失われ得る","バックアップは不要になる","通信遅延がゼロになる"],"correct":1,"explain":"非同期では複製完了前のコミットを切替先が保持していない可能性がありRPOに影響する。"},{"id":"Q-09-X01","chapter":9,"kind":"applied","q":"関係表から指定列だけ取り出す演算は？","options":["選択","射影","直積","差集合"],"correct":1,"explain":"射影。"},{"id":"Q-09-X02","chapter":9,"kind":"applied","q":"複数サーバに顧客IDの範囲ごとにデータを分割する方式は？","options":["レプリケーション","シャーディング","正規化","ロールバック"],"correct":1,"explain":"シャーディング。"},{"id":"U-09-1","chapter":9,"kind":"applied","q":"注文表の顧客IDが顧客表の主キーを参照するとき何というか？","options":["外部キー","必ず主キー","必ず候補キー","必ず索引"],"correct":0,"explain":"他表のキーを参照する列は外部キー。注文行の一意識別とは別。"},{"id":"U-09-2","chapter":9,"kind":"applied","q":"グループごとの合計値に対する抽出条件を書く句は？","options":["WHERE","HAVING","FROM","ORDER BY"],"correct":1,"explain":"WHEREは集計前の行、HAVINGは集計後のグループ。"},{"id":"U-09-3","chapter":9,"kind":"applied","q":"他取引の未コミットの値を読む現象は？","options":["ファントムリード","デッドロック","ダーティリード","ロールバック"],"correct":2,"explain":"ダーティリードは未確定データの読取り。"},{"id":"U-09-4","chapter":9,"kind":"applied","q":"B木系索引がハッシュ索引より一般に適する検索は？","options":["暗号解読","画像圧縮","全件削除","範囲検索"],"correct":3,"explain":"B木系は順序を利用できる。ハッシュは等値検索が主用途。"},{"id":"U-09-5","chapter":9,"kind":"applied","q":"確定済み更新をログから再適用する処理は？","options":["ロールフォワード","ロールバック","正規化","シャーディング"],"correct":0,"explain":"ロールフォワードは更新の再適用、ロールバックは取消し。"},{"id":"U-09-X01","chapter":9,"kind":"applied","q":"2つの関係の全行の組合せを生成する演算は？","options":["射影","直積","選択","差集合"],"correct":1,"explain":"m行とn行なら全組合せはm×n行。"},{"id":"U-09-X02","chapter":9,"kind":"applied","q":"元データを抽出・変換して分析基盤へ格納する処理は？","options":["OLTP","DDL","ETL","RAID"],"correct":2,"explain":"ETLはExtract・Transform・Load（抽出・変換・格納）。"},{"id":"U-09-Y01","chapter":9,"kind":"applied","q":"DBの物理配置変更の影響を論理構造から隠す性質は？","options":["参照整合性","物理的データ独立性","原子性","データの重複"],"correct":1,"explain":"内部スキーマを変更しても上位の構造を維持できる性質。"},{"id":"U-09-Y02","chapter":9,"kind":"applied","q":"注文表に存在しない顧客IDを登録させない制約は？","options":["NOT NULLだけ","列の型指定だけ","外部キー制約","索引のみ"],"correct":2,"explain":"参照整合性を保証する外部キー制約を用いる。"},{"id":"U-09-Y03","chapter":9,"kind":"applied","q":"全ての指定科目を履修した学生を求める関係演算は？","options":["射影だけ","直積だけ","和集合のみ","商"],"correct":3,"explain":"商は指定された集合の全要素と関連する対象を求める。"},{"id":"U-09-Y04","chapter":9,"kind":"applied","q":"集計値を計算しても元の行数を保持できるSQL機能は？","options":["ウィンドウ関数","GROUP BYのみ","DELETE","CREATE TABLE"],"correct":0,"explain":"ウィンドウ関数は関連する行の集合で計算し各行へ結果を付けられる。"},{"id":"U-09-Y05","chapter":9,"kind":"applied","q":"2相ロッキングでロック解放を開始した後の規則は？","options":["すべてのロックを再取得する","新しいロックを取得しない","必ず全取引を確定する","共有ロックを禁止する"],"correct":1,"explain":"取得段階と解放段階を分ける。"},{"id":"U-09-Y06","chapter":9,"kind":"applied","q":"問合せに必要な列を含み表本体の読取りを省ける可能性がある索引は？","options":["転置索引のみ","ビットマップ索引のみ","カバリング索引","主キー制約だけ"],"correct":2,"explain":"必要列を索引から取得できる場合に利用する。"},{"id":"U
