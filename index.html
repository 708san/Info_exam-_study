itle":"人的資源・経営組織・社会変化","explain":"<p>必要な能力を育て働きやすい組織を設計する。</p><p>シラバスVer.7.2 本文122–124頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>従業員の新技術習得を支援するのはリスキリング。</p>","prompt":"組織内に専門知識を集め横断支援する拠点は？","answer":"<p>正解は「CoE」。勤務・組織：裁量労働制は法定要件を満たす業務でみなし労働時間等を扱う制度。フラット型、ラインアンドスタッフ、カンパニー制、プロジェクト組織、DAO（分散型自律組織）など、意思決定と責任の所在が異なる。CEOは最高経営責任者、CFOは最高財務責任者、COOは最高執行責任者、CPOは最高プライバシー責任者、CoEは専門知識を集約する組織。</p>","beginner":{"scenario":"必要な能力を育て働きやすい組織を設計する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-22-C03"},"textbook":[{"heading":"人材管理","body":"OJT（職場内訓練）、リスキリング（新しい技能の習得）、コンピテンシー（成果に結び付く行動特性）、タレントマネジメント（人材の能力・配置・育成管理）、MBO（目標管理）、エンパワーメント（権限付与）、CDP（キャリア開発プログラム）を使い分ける。"},{"heading":"勤務・組織","body":"裁量労働制は法定要件を満たす業務でみなし労働時間等を扱う制度。フラット型、ラインアンドスタッフ、カンパニー制、プロジェクト組織、DAO（分散型自律組織）など、意思決定と責任の所在が異なる。CEOは最高経営責任者、CFOは最高財務責任者、COOは最高執行責任者、CPOは最高プライバシー責任者、CoEは専門知識を集約する組織。"},{"heading":"働き方と社会","body":"DE&I（多様性・公平性・包摂）、ウェルビーイング、ワークエンゲージメント、EAP（従業員支援プログラム）、テレワーク、ワークシェアリング等は働く環境・能力活用に関係する。BCM（事業継続管理）は災害等に備え、BIA（事業影響度分析）で重要業務を選ぶ。"}]},{"id":"22-1","title":"財務三表・損益・キャッシュフロー","explain":"<p>PL（Profit and Loss Statement：損益計算書）は一定期間の収益と費用、BS（Balance Sheet：貸借対照表）は一定時点の資産・負債・純資産、CF（Cash Flow Statement：キャッシュフロー計算書）は現金の増減を示す。売上が増えても売掛金が増えれば現金はすぐ増えない。減価償却費は資産取得費用を利用期間へ配分する会計上の費用で、計上時に毎回現金が流出するわけではない。</p>\n<p>売上総利益＝売上高−売上原価、営業利益＝売上総利益−販売費及び一般管理費。流動比率＝流動資産/流動負債×100%、自己資本比率＝自己資本/総資本×100%などは比率の分母を確認する。</p>\n","worked":"<p>売上1,000万円、売上原価600万円、販管費250万円なら売上総利益400万円、営業利益150万円。ここから営業外損益や税金を考えて最終利益へ進む。</p>\n","prompt":"利益が出ている企業は資金繰りで倒産しないか。","answer":"<p>倒産し得る。支払タイミングと現金残高が重要。</p>\n","beginner":{"scenario":"商品を掛売り100万円で販売し費用60万円を現金で払うと、利益40万円でも現金は60万円減少する。売掛金100万円が資産になる。","trap":"利益と現金増減は別。損益計算書は一定期間、貸借対照表は一時点。","quizId":"U-22-1"},"textbook":[{"heading":"企業の財務を3つの表で見る","body":"貸借対照表（B/S）はある時点の資産・負債・純資産を示し、資産＝負債＋純資産の関係が成り立ちます。損益計算書（P/L）は一定期間の収益・費用・利益を示します。キャッシュフロー計算書（C/F）は現金等の増減を営業・投資・財務活動などに分けて示します。"},{"heading":"利益と現金の違い","body":"100万円の商品を掛けで販売し、仕入費60万円を現金で払った場合、単純化すると利益40万円ですが現金は60万円減り、売掛金100万円が資産になります。利益が出ていても現金不足で支払えなくなる場合があるため両方を確認します。"},{"heading":"利益の段階","body":"売上高から売上原価を引くと売上総利益、販売費及び一般管理費を引くと営業利益、営業外損益を加減すると経常利益になります。さらに特別損益や税金等を考慮して当期純利益を求めます。減価償却は固定資産の取得費用を利用期間等に配分する会計処理です。"}],"walkthrough":{"heading":"小さな会社の財務諸表をつなげる","body":"現金100万円を出資して会社を始め、現金30万円で在庫を仕入れ、商品を50万円で掛売りし、販売した在庫の原価が30万円だったとします。税金その他の費用を無視すると、損益計算書では売上50−原価30＝利益20万円です。現金は70万円、売掛金50万円なので資産合計120万円、負債0、純資産は出資100＋利益20＝120万円です。売掛金を回収すると現金が120万円となり売掛金が0になりますが、回収時にもう一度売上や利益を計上するわけではありません。現金の移動、利益の認識、資産・負債の状態を分けると財務の計算が理解しやすくなります。","cols":["時点","現金","在庫","売掛金","純資産"],"rows":[["出資後","100","0","0","100"],["仕入後","70","30","0","100"],["掛売り後","70","0","50","120"],["回収後","120","0","0","120"]]}},{"id":"22-2","title":"損益分岐点・原価計算・利益計画","explain":"<p>固定費は生産数量に関わらず一定範囲では変わりにくい費用、変動費は販売・生産量に伴って変わる費用。販売単価p、1個当たり変動費v、固定費Fなら損益分岐点数量Q＝F/(p−v)。限界利益率は(売上−変動費)/売上。売上高で計算するなら損益分岐点売上高＝固定費/限界利益率。</p>\n<p>原価には直接材料費・直接労務費・製造間接費などがあり、活動基準原価計算（ABC：Activity-Based Costing）は活動を通じた原価配賦を考える。短期の意思決定と長期の費用管理では見るべき原価が異なる。</p>\n","worked":"<p>商品単価2,000円、変動費1,200円、固定費80万円なら限界利益800円、損益分岐点数量800,000/800＝1,000個。900個では固定費を回収できない。</p>\n","prompt":"売上単価と変動費が同額なら、販売数量を増やしても固定費を回収できるか。","answer":"<p>できない。限界利益が0だから。</p>\n","beginner":{"scenario":"販売価格1000円、変動費600円、固定費20万円。1個当たり限界利益400円なので500個で固定費を回収し利益が0になる。","trap":"固定費は販売量に比例しないと仮定する。限界利益と最終利益を区別する。","quizId":"U-22-2","lab":{"title":"利益計画から必要販売数を逆算","problem":"販売単価2000円、1個当たり変動費1200円、固定費40万円。利益20万円にする販売数は？","steps":["売上から変動費を引いた1個当たり限界利益は2000−1200＝800円。","全体利益=800×販売数−400000。","目標200000を代入すると800×販売数=600000。","販売数=600000÷800＝750個。損益分岐点は400000÷800＝500個。"],"answer":"750個","check":"損益分岐点は利益0、目標利益が指定されたら固定費に目標利益を足す。"}},"textbook":[{"heading":"費用を固定と変動に分ける","body":"固定費は一定の活動範囲では販売量等が変わっても変化しない費用、変動費は活動量に応じて増減する費用です。販売価格1000円、単位変動費600円なら1個当たり限界利益400円。販売数qのとき利益は400q−固定費となります。"},{"heading":"損益分岐点","body":"損益分岐点は利益が0になる売上または販売量です。固定費20万円なら販売数200000/400=500個。限界利益率は限界利益÷売上高なので0.4。売上高で求める場合は固定費÷0.4=50万円です。目標利益を得るには固定費に目標利益を足して計算します。"},{"heading":"原価計算","body":"直接費は特定製品へ直接対応できる費用、間接費は共通費用として合理的に配賦する費用です。直接・間接と固定・変動は別の分類です。標準原価と実際原価を比較し、価格差や数量差などから原因を分析することがあります。"}],"walkthrough":{"heading":"損益分岐点を図表の数字で理解する","body":"固定費20万円、販売単価1000円、変動費600円とします。販売数が0でも固定費20万円は発生します。売上は販売数×1000、総費用は200000＋販売数×600で増えます。売上線と総費用線が交わる500個が損益分岐点です。500個未満では売上より費用が大きく損失、超えると利益が出ます。販売価格が上がったり変動費が下がったりすれば1個当たり限界利益が増え、他の条件が同じなら損益分岐点は下がります。固定費の削減も分岐点を下げますが、品質や販売能力への影響も評価します。","cols":["販売個数","売上（万円）","総費用（万円）","利益（万円）"],"rows":[["0","0","20","−20"],["250","25","35","−10"],["500","50","50","0"],["750","75","65","10"],["1000","100","80","20"]]}},{"id":"22-Y03","title":"財務比率・原価配賦・キャッシュフロー","explain":"<p>貸借対照表はある時点の資産・負債・純資産、損益計算書は期間の収益・費用、キャッシュフロー計算書は現金の増減を示します。ROA（総資産利益率）とROE（自己資本利益率）は分母が異なり、利益の定義は問題の指定に従います。</p>","worked":"<p>流動資産180、流動負債120万円なら流動比率150％。掛売上は利益を増やしても未回収なら直ちに現金は増えない。</p>","prompt":"流動資産240万円、流動負債160万円の流動比率は？","answer":"<p>150％。240÷160×100=150％。</p>","beginner":{"scenario":"利益が出ているのに売掛金の回収が遅れて資金不足になる会社を分析する。","trap":"黒字なら資金繰りに問題がないとは限らない。","quizId":"U-22-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"貸借対照表はある時点の資産・負債・純資産、損益計算書は期間の収益・費用、キャッシュフロー計算書は現金の増減を示します。ROA（総資産利益率）とROE（自己資本利益率）は分母が異なり、利益の定義は問題の指定に従います。"},{"heading":"仕組みと使い分け","body":"流動比率=流動資産÷流動負債×100、自己資本比率=自己資本÷総資産×100。ABC（Activity Based Costing：活動基準原価計算）は活動の使用量等を基に間接費を配賦します。発生主義の利益と現金収支は一致しない場合があります。"},{"heading":"具体的な判断と手順","body":"流動資産180、流動負債120万円なら流動比率150％。掛売上は利益を増やしても未回収なら直ちに現金は増えない。"},{"heading":"自己資本比率","body":"自己資本÷総資産×100。単純な貸借対照表で資本金200、資本剰余金100、利益剰余金50、総資産1000なら350/1000=35%。負債や資本金だけを分子にしない。実際の連結財務諸表では非支配株主持分等の扱いを確認する。"}]},{"id":"22-X02","title":"財務分析・投資評価・データ活用","explain":"<p>ROA（総資産利益率）は利益を総資産で割り、ROE（自己資本利益率）は利益を自己資本で割る。流動比率は流動資産÷流動負債で短期支払能力の目安。総資産回転率は売上高÷総資産。売上高利益率との積は同じ利益定義ならROAとなる。</p><p>NPV（正味現在価値）は将来キャッシュフローを割引き初期投資を差し引く。IRR（内部収益率）はNPVを0にする割引率。損益分岐点、直接・間接費、固定・変動費、標準原価差異も理解する。データ分析では名義・順序・間隔・比例尺度を区別し、外れ値、欠測、選択バイアス、相関と因果に注意する。</p>","worked":"<p>初期投資100万円、1年後110万円の回収、割引率10%ならNPV=110/1.1−100＝0万円。</p>","prompt":"総資産500万円、利益25万円ならROAは？","answer":"<p>25/500×100＝5%。</p>","beginner":{"scenario":"1年後110万円を得る投資を割引率10%で評価すると現在価値100万円。初期投資90万円ならNPV=10万円。","trap":"割引率・キャッシュフローの仮定が変わると投資評価も変わる。","quizId":"U-22-X02","lab":{"title":"現在価値で投資判断する","problem":"初期投資100万円。1年後55万円、2年後60.5万円の純キャッシュフロー。割引率10%。NPVは？","steps":["1年後の55万円の現在価値は55/1.1=50万円。","2年後の60.5万円は60.5/(1.1²)=50万円。","現在価値合計100万円。初期投資100万円を引く。","NPV=0万円。仮定した割引率では経済的価値の増加が0。"],"answer":"0万円","check":"将来の現金をそのまま足さず、年数に応じ割引く。"}},"textbook":[{"heading":"財務指標を理解する","body":"ROA（総資産利益率）は総資産に対する利益、ROE（自己資本利益率）は自己資本に対する利益を示します。例えば総資産1000万円、自己資本400万円、純利益40万円なら純利益を使うROA4%、ROE10%です。利益定義や平均残高の扱いは問題の指定に従います。流動比率は流動資産÷流動負債、自己資本比率は自己資本÷総資産です。"},{"heading":"お金の時間価値","body":"年10%の割引率なら1年後110万円の現在価値は110/1.1=100万円、2年後121万円なら121/1.1²=100万円です。NPV（正味現在価値）は将来の純キャッシュフローの現在価値合計から初期投資を引きます。IRR（内部収益率）はNPVを0にする割引率です。"},{"heading":"数字の使い方","body":"収益性と支払能力は別で、利益率が高くても流動負債を払えないことがあります。投資評価では評価期間・割引率・将来収益の仮定を変えて結果の感度を調べます。数字の定義と目的を確かめて判断します。"}]},{"id":"22-Z07","title":"制約資源当たり限界利益・固定費","explain":"<p>単位当たり限界利益は販売価格−変動費。設備時間が制約なら単位当たり限界利益を製造時間で割って1時間当たり限界利益を比較する。固定費は製造数にかかわらず発生するという前提で最後に引く。</p>","worked":"<p>Aの1個利益はBより小さいが設備時間当たりでは大きい。</p>","prompt":"Aの限界利益は3000円/個、設備時間3時間/個。Bは1600円/個、1時間/個。設備時間12時間、需要制約なし、固定費4000円なら最大利益はいくらか。","answer":"<p>Aは1000円/時間、Bは1600円/時間。Bを12個生産すると合計限界利益19200円、固定費4000円を引き15200円。Aは限界利益/個が大きいが制約資源当たりでは低い。</p>","beginner":{"scenario":"限られた設備時間をどの製品へ配分するか決める。","trap":"売上高や1個当たり利益だけで判断しない。","quizId":"U-22-Z07"},"textbook":[{"heading":"売上と利益の違い","body":"販売価格から販売数量に応じて増える変動費を引いた額が限界利益です。固定費は生産数量にかかわらず発生する費用と仮定します。利益=合計限界利益−固定費となります。固定費が同じ生産案を比較するなら、合計限界利益が大きい案ほど利益も大きくなります。"},{"heading":"制約資源がある場合の比較","body":"設備の稼働時間が不足しているなら、1個当たり限界利益が高くても時間が長い製品ばかり作ると合計利益が小さくなることがあります。制約資源1単位当たりの限界利益=単位当たり限界利益÷1個当たりの資源使用量を計算します。設備時間なら単位は円/時間です。"},{"heading":"数値を使って計算する","body":"製品Aは販売価格5000円、変動費3000円、2時間/個なので限界利益2000円、1000円/時間です。Bは8000円、5000円、4時間/個なので3000円、750円/時間です。需要制約なし、利用可能1000時間ならAを500個作ると限界利益100万円、固定費30万円を引いた利益は70万円です。Bのみなら250個で限界利益75万円となります。"},{"heading":"単純な順位付けが使える範囲","body":"制約が一つで数量を連続的に選べる基本モデルでは、資源当たり限界利益の高いものから配分します。需要上限があるなら上限まで作って残りを次に配分します。整数単位の端数や複数資源制約があるときは単純な順位付けで最適にならないことがあり、線形計画・整数計画などを使います。固定費が案によって変わる場合も比較に含めます。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"比較の分母と整数・複数制約の条件。"}},{"id":"22-Z01","title":"データ収集の設計・種類・サイロ化","explain":"<p>最初に課題と分析単位、必要な期間、収集頻度を定めます。一次データは目的に合わせて自ら収集した調査・実験等のデータ、二次データは既存の統計や他の目的で集められたデータの再利用です。数量を表す量的データと、分類・記述を表す質的データを区別します。</p>","worked":"<p>30店舗の同じ日の売上はクロスセクション。1店舗の日次売上1年分は時系列。</p>","prompt":"部門ごとに顧客データが分かれて統合分析できない状態は？","answer":"<p>部門間のデータ分断がサイロ化。</p>","beginner":{"scenario":"売上低下の原因を調べるため、店舗の売上だけでなく天候、来店、広告データも使いたい。","trap":"データが多くても目的や単位が揃わなければ分析しにくい。","quizId":"U-22-Z01"},"textbook":[{"heading":"基本原理","body":"最初に課題と分析単位、必要な期間、収集頻度を定めます。一次データは目的に合わせて自ら収集した調査・実験等のデータ、二次データは既存の統計や他の目的で集められたデータの再利用です。数量を表す量的データと、分類・記述を表す質的データを区別します。"},{"heading":"仕組み・計算","body":"時系列データは同じ対象の時間的変化を、クロスセクションデータは同じ時点の複数対象の違いを表します。行動ログや機械ログは自動収集でき、GIS（Geographic Information System：地理情報システム）データは場所との関係を扱います。衛星画像や取引ログなどの従来型統計以外の情報はオルタナティブデータとして使われる場合があります。"},{"heading":"応用と注意点","body":"構造化データは列や型が明確な表など、非構造化データは画像や自由記述などです。メタデータに意味、単位、取得日時、出典を記録します。サイロ化とは部門ごとにデータが分断され、連携・比較が難しくなる状態です。データレイクは多様なデータを蓄積しますが、アクセス権限・品質・カタログが必要です。クローリングはページを巡回し、スクレイピングは必要な情報を取り出します。利用条件やプライバシーを守ります。"}]},{"id":"22-Z02","title":"前処理・特徴量・加工結果の検証","explain":"<p>データ結合ではキーを使って別の表を関連づけます。名寄せは表記揺れなどを考慮し、同じ実体を識別して統合する作業です。欠損値は理由を調べ、除外・補完などを選びます。外れ値は誤入力の場合も重要な異常の場合もあるので、無条件に捨てません。ドメイン知識（対象業務の知識）が判断に必要です。</p>","worked":"<p>訓練データの平均50、標準偏差10なら値70の標準化結果は2。</p>","prompt":"学習用データの平均100、標準偏差20のとき120を標準化した値は？","answer":"<p>(120−100)/20=1。</p>","beginner":{"scenario":"異なる部署の顧客台帳を統合し、購入予測モデル用の表を作る。","trap":"欠損を0と置けば常に正しいわけではない。評価データから変換係数を学ばない。","quizId":"U-22-Z02"},"textbook":[{"heading":"基本原理","body":"データ結合ではキーを使って別の表を関連づけます。名寄せは表記揺れなどを考慮し、同じ実体を識別して統合する作業です。欠損値は理由を調べ、除外・補完などを選びます。外れ値は誤入力の場合も重要な異常の場合もあるので、無条件に捨てません。ドメイン知識（対象業務の知識）が判断に必要です。"},{"heading":"仕組み・計算","body":"標準化はz=(x−平均)/標準偏差で尺度をそろえる方法。二値化は条件で0/1へ、離散化は連続値を区間へ、対数変換は正の値などで大きな値の広がりを圧縮します。アノテーションはデータへのラベル付け、ストップワード除去は分析に不要と判断した頻出語などを除く操作です。特徴量エンジニアリングは予測に役立つ変数を設計します。"},{"heading":"応用と注意点","body":"移動平均は一定区間の値を平均して短期変動を抑え、季節調整は周期的変動の影響を除くことを目指します。モデルの評価用データを使って前処理の平均・標準偏差を決めると情報漏えい（データリーケージ）になるため、訓練データで決めた変換を検証・テストへ適用します。結合前後の行数、重複、欠損、範囲、単位、ラベル時点を検証します。"}]},{"id":"22-3","title":"統計・相関・検定・データの読み方","explain":"<p>平均は合計/個数、中央値は順序中央、最頻値は最も頻繁な値。極端な値が含まれると平均は大きく影響される。分散は値が平均からどれだけ散らばるかの尺度で、標準偏差は分散の平方根。相関係数は線形関係の強さを−1～1で表すが、<strong>相関は因果を意味しない</strong>。散布図で外れ値、非線形の関係、群の混合を確認する。</p>\n<p>仮説検定では帰無仮説と対立仮説を設け、データが帰無仮説の下でどれほど珍しいかをp値で考える。p値は「帰無仮説が正しい確率」ではない。標本抽出の偏り、検出力、多重比較を考慮して結論を出す。</p>\n","worked":"<p>商品購入者だけに満足度調査をすると非購入者の不満が欠落し、潜在顧客全体へ一般化できない。高い平均点でも標本の選び方を確認する。</p>\n","prompt":"相関係数0.9なら、Aを増やせばBが必ず増えるといえるか。","answer":"<p>いえない。交絡要因や逆方向の因果があり得る。</p>\n","beginner":{"scenario":"データ1、2、3、4、100では平均22、中央値3。極端な値が平均を押し上げるので目的に応じ代表値を選ぶ。","trap":"相関があっても因果関係を示すとは限らない。標本の偏りも考える。","quizId":"U-22-3"},"textbook":[{"heading":"データの特徴を数値化する","body":"平均は値の合計÷個数、中央値は順序を並べた中央の値、最頻値は最も頻繁に現れる値です。分散は平均からの偏差の二乗の平均（目的に応じ分母が異なる）、標準偏差はその平方根で元の単位と同じです。外れ値がある場合は平均が大きく影響を受けるため中央値も確認します。"},{"heading":"関係を調べる","body":"散布図は2変数の組を点で表示します。相関係数は線形関係の強さと方向を−1〜1で表し、0に近くても非線形な関係がある場合があります。回帰分析は説明変数から目的変数を推定します。相関や回帰だけで因果関係を証明できるわけではありません。"},{"heading":"標本と検定","body":"標本が母集団を適切に代表していないと推定が偏ります。欠測・外れ値の扱いを明示し、仮説検定では有意水準、p値、効果の大きさを区別します。統計的有意性が実務上重要な差を意味するとは限りません。"}]},{"id":"22-Z04","title":"標本抽出・統計バイアス・可視化の読み方","explain":"<p>単純無作為抽出は母集団から無作為に標本を選ぶ方法、層別抽出は地域や年代などの層ごとに標本を選ぶ方法、多段抽出は店舗を選んでその店舗の利用者を選ぶなど段階を経る方法です。全数調査は母集団全体を調べます。精度（ばらつきの小ささ）と偏り（系統的なずれ）は別で、大標本でも選択が偏れば偏りは残ります。</p>","worked":"<p>売上100→105の増加は5％。縦軸を99から始めた棒グラフでは見た目の比が6倍になるが実際の売上比は1.05倍。</p>","prompt":"年代ごとに母集団を分け、それぞれ無作為に標本を抽出する方法は？","answer":"<p>層ごとに標本を抽出するのが層別抽出。</p>","beginner":{"scenario":"全店舗の利用者満足度を調べる。常連客だけのアンケートでは全利用者を代表できない。","trap":"無作為抽出と無作為割付けは異なる。非ゼロ起点は特に棒の長さ比較で注意する。","quizId":"U-22-Z04"},"textbook":[{"heading":"基本原理","body":"単純無作為抽出は母集団から無作為に標本を選ぶ方法、層別抽出は地域や年代などの層ごとに標本を選ぶ方法、多段抽出は店舗を選んでその店舗の利用者を選ぶなど段階を経る方法です。全数調査は母集団全体を調べます。精度（ばらつきの小ささ）と偏り（系統的なずれ）は別で、大標本でも選択が偏れば偏りは残ります。"},{"heading":"仕組み・計算","body":"選択バイアスは選ばれ方の偏り、情報バイアスは測定や記録の系統誤差、交絡バイアスは第三の要因が関係をゆがめることです。認知バイアスでは確証バイアス（都合の良い情報を重視）、ハロー効果（目立つ特性が全体評価に影響）、バンドワゴン効果（多数派に追随）、正常性バイアス（異常を過小評価）を区別します。"},{"heading":"応用と注意点","body":"棒グラフはカテゴリ間の量、折れ線は時間変化、箱ひげ図は分布、ヒートマップは値の大小を色で示します。モザイク図はカテゴリ組合せの比率、デンドログラムは階層的クラスタの関係を示します。2軸グラフは軸の設定で関係が強く見えることがあり、棒グラフの非ゼロ起点や不要な3D表現は差を誇張する場合があります。比較対象・分母・単位を確認します。"}]},{"id":"22-Z03","title":"アソシエーション分析・リフト値・分析サイクル","explain":"<p>アソシエーション分析は同時に出現する項目の関係を調べます。支持度support=P(A∩B)、確信度confidence=P(B|A)=P(A∩B)/P(A)、リフト値lift=P(B|A)/P(B)。リフト1はこの尺度で独立に相当し、1超ならA購入者のB購入割合が全体より高いことを示します。</p>","worked":"<p>1000件中A=200、B=300、共通120ならリフト2。</p>","prompt":"P(A)=0.4、P(B)=0.5、P(A∩B)=0.3のリフト値は？","answer":"<p>P(B|A)=0.3/0.4=0.75。0.75/0.5=1.5。</p>","beginner":{"scenario":"商品Aを購入した顧客が商品Bも買いやすいか、購買データで検証する。","trap":"確信度が高くてもB自体が人気ならリフトは1に近い。","quizId":"U-22-Z03"},"textbook":[{"heading":"基本原理","body":"アソシエーション分析は同時に出現する項目の関係を調べます。支持度support=P(A∩B)、確信度confidence=P(B|A)=P(A∩B)/P(A)、リフト値lift=P(B|A)/P(B)。リフト1はこの尺度で独立に相当し、1超ならA購入者のB購入割合が全体より高いことを示します。"},{"heading":"仕組み・計算","body":"1000件中Aが200、Bが300、両方が120件なら支持度=12％、確信度=60％、リフト=0.6/0.3=2。リフトが高くても件数が少なければ偶然の可能性があり、因果関係を直接示しません。テキストマイニングは文章の語や構造、コレスポンデンス分析はカテゴリ間の関係、アドホック分析は特定課題に応じた分析を扱います。"},{"heading":"応用と注意点","body":"データ活用では課題定義→収集・管理・加工→EDA（Exploratory Data Analysis：探索的データ解析）→分析・推論→共有→施策提案・検証を繰り返します。CDP（Customer Data Platform：顧客データ基盤）は顧客情報を統合して活用する仕組みです。シミュレーションのデータ同化は観測をモデルへ取り込み状態推定を更新すること。分析結果を施策の効果検証へ結びつけます。"},{"heading":"分析方法の違い","body":"アソシエーション分析は共起・関連ルールを支持度、確信度（信頼度）、リフトで評価する。回帰分析は目的変数と説明変数の関係、因子分析は潜在因子による説明、主成分分析は情報をなるべく保ちながら次元を縮約する。"}]},{"id":"22-4","title":"業務分析・意思決定・最適化","explain":"<p>問題解決では現状を測り、目標との差を構造化し、原因仮説と検証指標を設定する。パレート図は頻度や影響の大きい項目を優先する手掛かり、特性要因図は原因候補の整理、管理図は時系列の変動や異常を監視する。ABC分析は売上・在庫金額等の寄与度に応じて重点管理する方法。</p>\n<p>線形計画法は目的関数を制約条件の下で最大・最小にする手法。例えば製品A/Bの利益と材料・作業時間から最適な生産量を求める。決定木や期待値による意思決定では、選択肢ごとの結果と確率を明示する。</p>\n","worked":"<p>商品100種類のうち売上上位10種類が全体売上の70%なら、発注管理や欠品対策を重点化する根拠になる。ただし利益率・戦略的重要性なども評価する。</p>\n","prompt":"管理図で工程が管理限界内なら製品仕様をすべて満たすか。","answer":"<p>必ずではない。統計的な安定性と仕様適合は別。</p>\n","beginner":{"scenario":"商品Aの利益100が確率0.6、損失20が0.4なら期待値52。Bの利益60が0.9、損失10が0.1なら期待値53。","trap":"期待値が高くても最大損失や実行制約が許容できるとは限らない。","quizId":"U-22-4"},"textbook":[{"heading":"意思決定を数値で比べる","body":"将来の結果が不確実な場合、各結果の値と確率の積を合計した期待値が比較材料になります。ただし大きな損失の可能性、資源制約、実行可能性も考慮します。決定木は選択と不確実な事象を枝で表し、各分岐の結果を整理できます。"},{"heading":"在庫を最適化する","body":"発注回数を減らすと発注費は下がりますが、1回の発注量が増えて在庫保管費が上がります。EOQ（経済的発注量）は年間需要D、1回の発注費S、1個当たり年間保管費Hから√(2DS/H)で求める基本モデルです。需要一定などの仮定を確認します。"},{"heading":"業務分析を行う","body":"処理時間、滞留件数、費用、品質を測って改善対象を特定します。ABC分析は売上や使用金額等の大きい順に分類し重点管理を行う方法です。目的関数や制約を決めて線形計画法等で最適な資源配分を検討することもあります。"}]},{"id":"22-Y02","title":"OR・IE・品質分析・データの判断","explain":"<p>OR（Operations Research：数理的意思決定）は線形計画、待ち行列、在庫、ゲーム理論等を使い、IE（Industrial Engineering：経営工学）は作業測定・工程分析などで生産性を改善します。線形計画では目的関数と制約を設定します。</p>","worked":"<p>A製品利益3、B製品利益5、制約A+B≤4、A,B≥0なら全てBで利益20（他の制約なし）。制約が増えれば候補点を比較する。</p>","prompt":"二つの数量の関係を点で可視化する図は？","answer":"<p>散布図。散布図は二変量の関係や外れ値を把握する。</p>","beginner":{"scenario":"生産設備と人員の制約内で利益を最大にし、不良原因も特定したい。","trap":"相関があるだけで原因と結果の関係は証明できない。","quizId":"U-22-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"OR（Operations Research：数理的意思決定）は線形計画、待ち行列、在庫、ゲーム理論等を使い、IE（Industrial Engineering：経営工学）は作業測定・工程分析などで生産性を改善します。線形計画では目的関数と制約を設定します。"},{"heading":"仕組みと使い分け","body":"QC（Quality Control：品質管理）でパレート図、特性要因図、散布図、ヒストグラム、管理図などを使います。ABC分析は金額等の重要度で項目を分類します。データ分析では欠損、外れ値、標本偏り、相関と因果を区別し、可視化と判断を結びつけます。"},{"heading":"具体的な判断と手順","body":"A製品利益3、B製品利益5、制約A+B≤4、A,B≥0なら全てBで利益20（他の制約なし）。制約が増えれば候補点を比較する。"}]},{"id":"22-Z05","title":"経済的発注量：在庫保管と発注費の最適化","explain":"<p>EOQ（Economic Order Quantity：経済的発注量）は一定需要、一定発注費、即時補充、欠品なし等の基本モデルで年間発注費と年間保管費の合計を最小にする発注量。年間需要D、1回の発注費S、1個当たり年間保管費H、発注量Qとする。</p>","worked":"<p>D=8000、S=1000、H=100ならQ=400個。</p>","prompt":"年間需要D=12000個、発注費S=1500円、年間保管費H=100円/個とする。経済的発注量、平均在庫、年間発注費を求めよ。","answer":"<p>Q=√(2×12000×1500/100)=600個。平均在庫300個。年間20回発注するので発注費30000円。保管費も30000円になり最適条件を検算できる。</p>","beginner":{"scenario":"一年に一定数使う部品を何個ずつ発注すべきか決める。","trap":"保管費は平均在庫Q/2を使う。","quizId":"U-22-Z05"},"textbook":[{"heading":"在庫には相反する二つの費用がある","body":"少しずつ何度も発注すれば在庫は少なくなりますが、発注手続や運送などの費用が増えます。大量にまとめて発注すれば回数は減りますが、保管費が増えます。EOQ（Economic Order Quantity: 経済的発注量）はこの二つの年間費用の合計を最小にする発注量です。"},{"heading":"発注費を数量の関数にする","body":"年間需要D（個/年）、1回の発注費S（円/回）、1回の発注量Q（個/回）とします。需要を全て満たすには年間D/Q回発注するので、年間発注費はDS/Q円です。Qを大きくするとこの費用は減ります。"},{"heading":"平均在庫と保管費を求める","body":"需要が一定で、在庫が0になったとき即時にQ個補充する基本モデルでは在庫はQから0まで直線的に減ります。平均在庫は(Q+0)/2=Q/2個です。1個当たり年間保管費H（円/個/年）を掛けるとHQ/2円/年になります。"},{"heading":"最適な発注量を導く","body":"合計費用C(Q)=DS/Q+HQ/2です。Q>0において微分するとC'(Q)=−DS/Q²+H/2なので、0と置くとQ²=2DS/H、Q=√(2DS/H)です。ここでは発注費と保管費が等しく、前後で費用の傾きが負から正へ変わります。微分を使わない場合も相加相乗平均で同じ最小条件を導けます。"},{"heading":"モデルの適用条件","body":"D=10000、S=2000、H=100ならQ=√400000≈632個です。発注単位が整数なら近くの実行可能な数量で費用を比較します。需要変動、数量割引、欠品、リードタイム、補充速度がある場合は基本式だけでは最適化できません。発注点（いつ注文するか）と発注量（何個注文するか）も別の判断です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"EOQの式の由来・単位・仮定。"}},{"id":"22-Z06","title":"線形計画・制約条件・整数の確認","explain":"<p>線形計画では製品X,Yの数量x,yを変数とし、最大化する利益を目的関数、材料や時間の上限を不等式で表す。例えば2x+y≤12、x+2y≤12、x,y≥0、利益x+y。</p>","worked":"<p>交点(4,4)は2×4+4=12、4+2×4=12で実行可能。</p>","prompt":"x+2y≤8、2x+y≤10、x,y≥0で利益2x+yを最大化する。最大値とその値を取る実行可能な点を一つ示せ。","answer":"<p>目的関数そのものが2x+y≤10で制約されるので最大値は10以下。(5,0)はx+2y=5≤8、2x+y=10で実行可能。よって最大値10。(4,2)も最適で、最適解は一つとは限らない。</p>","beginner":{"scenario":"複数の材料制約のもとで製造数と利益を最大にする。","trap":"製品1個当たりの利益が大きい方が常に最適とは限らない。","quizId":"U-22-Z06"},"textbook":[{"heading":"目的と制約を数式にする","body":"線形計画法は、利益などを最大化・費用などを最小化するため、選択できる数量と制約を一次式で表す方法です。製品XとYをそれぞれx個、y個作る場合、x,yは決定変数です。利益x+yを目的関数、2x+y≤12、x+2y≤12を資源制約、x,y≥0を非負制約とします。"},{"heading":"実行可能領域とは何か","body":"2x+y≤12は直線2x+y=12の一方の側を表します。全ての不等式を満たす領域が実行可能領域です。領域外の点は利益が高くても採用できません。二変数の場合は制約線を描き、原点を代入してどちら側が条件を満たすか確かめると理解しやすくなります。"},{"heading":"なぜ頂点を調べるのか","body":"目的関数x+y=kは傾き−1の直線です。kを大きくすると直線が平行移動します。閉じた有界な実行可能領域では、最も遠くで接する点または辺に最適解が存在し、少なくとも一つの頂点で最適値を得られます。目的関数が制約辺と平行なら複数の最適解を持つこともあります。"},{"heading":"交点を計算する","body":"軸上の候補は(0,0),(6,0),(0,6)。二つの制約線2x+y=12、x+2y=12の差を取るとx=y、代入してx=y=4となります。目的関数は順に0,6,6,8なので最大8です。交点を求めたら必ず全制約に代入して確認します。"},{"heading":"整数制約と他の条件","body":"製品数量が整数なら、連続解を丸めただけでは制約違反や非最適解になる場合があります。整数計画として実行可能な整数解を比較します。候補が少ない試験問題では制約から各変数の範囲を求め、可能な組合せを確認できます。目的関数や制約が線形でない場合、同じ頂点法が成立するとは限りません。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"頂点法の根拠、目的関数平行時の複数最適解。"}}],"beginnerIntro":"企業の数字と組織・業務の改善方法を学ぶ。会計は時点・期間、利益・現金、固定費・変動費を区別する。","studyGroups":[{"title":"企業と経営組織","body":"企業の目的・組織・人材・経営責任を理解する。","ids":["22-C01","22-Y01","22-X01","22-C02","22-C03"]},{"title":"会計と投資評価","body":"資産・利益・現金と費用構造を区別して意思決定する。","ids":["22-1","22-2","22-Y03","22-X02","22-Z07"]},{"title":"データ分析","body":"収集、加工、推定、可視化、分析結果の検証を順に学ぶ。","ids":["22-Z01","22-Z02","22-3","22-Z04","22-Z03"]},{"title":"業務改善と最適化","body":"業務の制約・品質・費用をモデル化して改善する。","ids":["22-4","22-Y02","22-Z05","22-Z06"]}]},{"id":23,"title":"法務・標準化・知的財産","group":"ストラテジ","priority":"A重要","summary":"著作権・特許・個人情報・契約・労務・不正アクセスと標準。","lessons":[{"title":"著作権と特許","body":"著作権は原則として創作時に発生し、表現を保護する。特許は出願・審査・登録を経て技術的思想の創作を一定期間保護する。アイデアそのものと表現を混同しない。","check":"ソフトウェアのソースコードは著作権の対象となり得る。"},{"title":"個人情報","body":"個人情報保護法では利用目的の特定・安全管理措置・第三者提供の規律等を理解する。匿名加工情報と仮名加工情報では本人識別や取扱いのルールが異なる。","check":"匿名化したつもりでも再識別可能性を考える。"},{"title":"情報セキュリティ法規","body":"不正アクセス禁止法は他人の識別符号の無断入力などを規制。電子署名、営業秘密、サイバー犯罪への対応も把握する。","check":"単なる規約違反と法律違反は区別。"},{"title":"標準と契約","body":"JIS（Japanese Industrial Standards：日本産業規格）やISO（International Organization for Standardization：国際標準化機構）の規格は品質・安全・互換性等の共通基準。契約では秘密保持・成果物権利・再委託・責任範囲を確認。","check":"最新の法改正や規格の版は直前に一次情報で確認。"}],"terms":[{"term":"著作権","definition":"文章・プログラムなどの創作的な表現を保護する権利"},{"term":"特許権","definition":"一定の要件を満たす発明を出願・審査・登録によって保護する権利"},{"term":"商標権","definition":"商品・サービスの出所を識別する標識を保護する権利"},{"term":"営業秘密","definition":"秘密管理性・有用性・非公知性などを満たす事業上の情報"},{"term":"個人情報","definition":"生存する個人に関する情報で特定個人を識別できるもの等"},{"term":"仮名加工情報","definition":"他の情報と照合しない限り特定個人を識別できないよう加工した個人情報等"},{"term":"匿名加工情報","definition":"特定個人の識別や復元ができないよう法定基準で加工した情報"},{"term":"不正アクセス禁止法","definition":"他人のIDやパスワードの不正利用などを規制する法律"},{"term":"JIS","definition":"日本の産業分野に関する国家規格"},{"term":"ISO","definition":"国際的な規格を制定する標準化団体"},{"term":"NDA","definition":"秘密保持契約。Non-Disclosure Agreementの略"}],"questions":[{"id":"Q23-01","chapter":23,"kind":"applied","q":"一般に著作権が発生するタイミングは。","options":["創作時","特許庁への登録時","公開から10年後","販売開始時のみ"],"correct":0,"explain":"著作権は原則創作と同時に発生する。"},{"id":"Q23-02","chapter":23,"kind":"applied","q":"特許権と著作権の説明として正しいのは。","options":["著作権はアイデア自体を保護する","特許は出願・審査・登録を要する","特許は創作時に自動成立する","プログラムには著作権が生じない"],"correct":1,"explain":"特許は方式・審査を経て登録される。"},{"id":"Q23-03","chapter":23,"kind":"applied","q":"営業秘密の代表的な要件の組は。","options":["秘密管理性・有用性・非公知性","公開性・無料性・巨大性","即時性・配布性・広告性","計算性・確率性・可用性"],"correct":0,"explain":"不正競争防止法上の営業秘密の三要件。"},{"id":"D23-01","chapter":23,"kind":"applied","q":"他人が作ったWeb画像を自社サイトへ転載する際の原則的な考え方として適切なものはどれか。","options":["閲覧可能なら常に転載自由","画像には著作権がない","利用許諾や法定の例外等を確認する","出典を隠せばよい"],"correct":2,"explain":"閲覧可能性と転載許諾は別。権利者・条件・適用される例外を確認する。"},{"id":"D23-02","chapter":23,"kind":"applied","q":"営業秘密としての保護に一般に必要な条件の組合せはどれか。","options":["知名度・資本金・社員数","秘密管理性・有用性・非公知性","登録日・商標区分・発行部数","売上・広告費・生産量"],"correct":1,"explain":"不正競争防止法上の営業秘密の3要件を区別する。"},{"id":"D23-03","chapter":23,"kind":"applied","q":"請負契約と書かれていても、現場で発注者が請負先作業者に直接指揮命令する場合の懸念はどれか。","options":["必ず正当な請負になる","契約名で全ての実態が決まる","偽装請負等の問題につながる可能性がある","システム監査が不要になる"],"correct":2,"explain":"契約の名称だけでなく実際の指揮命令関係等が判断上重要になる。"},{"id":"Q-23-X01","chapter":23,"kind":"applied","q":"2026年1月施行の取適法で新たに禁止された支払方法は？","options":["期日内の現金振込","手形払い","事前合意した現金払い","期日内の口座振込"],"correct":1,"explain":"手形払い。適用対象取引では禁止される。"},{"id":"Q-23-X02","chapter":23,"kind":"applied","q":"一定の要件を満たす電子署名による電子文書の真正な成立の推定を定める法律は？","options":["電子署名法","労働基準法","独占禁止法","不正アクセス禁止法"],"correct":0,"explain":"電子署名法。"},{"id":"U-23-1","chapter":23,"kind":"applied","q":"商品やサービスの出所を識別する標識を登録により保護する権利は？","options":["商標権","特許権","著作権","実用新案権"],"correct":0,"explain":"商標権は商品・役務を識別する標識の保護。著作権は創作的表現を保護する。"},{"id":"U-23-2","chapter":23,"kind":"applied","q":"営業秘密の保護要件の組合せとして適切なのは？","options":["登録・売上・公開性","秘密管理性・有用性・非公知性","独自性・広告・知名度","特許査定・創作性・公知性"],"correct":1,"explain":"不正競争防止法上の営業秘密は3要件を満たす情報。"},{"id":"U-23-3","chapter":23,"kind":"applied","q":"派遣労働者に就業上の指揮命令を行うのは原則誰か？","options":["派遣元の顧客全員","取引先の監査人","派遣先","派遣労働者自身のみ"],"correct":2,"explain":"労働者派遣では派遣元が雇用し、派遣先の指揮命令下で就業する。"},{"id":"U-23-4","chapter":23,"kind":"applied","q":"情報セキュリティマネジメントシステムの要求事項を定める規格は？","options":["ISO 9001","ISO 22301","ISO/IEC 20000-1","ISO/IEC 27001"],"correct":3,"explain":"27001は情報セキュリティ、9001は品質、22301は事業継続、20000-1はITサービス管理。"},{"id":"U-23-X01","chapter":23,"kind":"applied","q":"取適法（2026年1月施行）で追加された事業者規模の判断基準は？","options":["従業員数基準","Webサイト閲覧数","広告費基準","商標登録件数"],"correct":0,"explain":"資本金基準に加え、取引類型に応じた従業員数基準が追加された。"},{"id":"U-23-X02","chapter":23,"kind":"applied","q":"電子署名法が一定の電子署名について定める効果は？","options":["全内容の真実性保証","電子文書の真正な成立の推定","特許権の自動発生","著作権の自動消滅"],"correct":1,"explain":"一定の本人による電子署名がある場合、文書の真正な成立が推定される。内容の真実性までは保証しない。"}],"deepIntro":"名称を覚えるだけでなく、どの対象に、何を、誰が、どの条件でしてよいかを区別する。","deep":[{"id":"23-1","title":"知的財産権・特許・著作権・商標","explain":"<p>特許権は発明を一定期間保護する権利で、新規性・進歩性等の要件を満たして特許査定・登録等の手続を経る。著作権は思想・感情を創作的に表現した著作物を保護し、原則として創作時に発生する。商標権は商品・役務を識別する標識を登録等により保護する。意匠権は物品等のデザインに関する権利。保護対象、発生要件、期間、権利行使が異なる。</p>\n<p>プログラムのソースコードは著作権の対象になり得るが、アルゴリズムやアイデアそのものが表現と同じように保護されるわけではない。ソフトウェアライセンスでは複製、改変、再配布、ソース開示義務を確認する。</p>\n","worked":"<p>他社が作った画像をWebサイトに掲載する場合、インターネット上で閲覧できるだけでは自由利用の許諾にならない。権利者、許諾範囲、例外規定を確認する。</p>\n","prompt":"OSSなら必ず著作権を放棄しているか。","answer":"<p>違う。著作権を前提に利用・改変・再配布の条件を許諾するライセンスが多い。</p>\n","beginner":{"scenario":"ゲームのプログラムの具体的表現は著作権、技術的な発明は要件を満たして登録されれば特許権、商品を識別するロゴは商標権で保護できる場合がある。","trap":"著作権は原則創作時に発生する。特許権は出願だけで発生するわけではない。","quizId":"U-23-1"},"textbook":[{"heading":"何を保護する権利か","body":"特許権は技術的な発明、実用新案権は物品の形状・構造・組合せに係る考案、意匠権はデザイン、商標権は商品・役務を識別する標識を保護する制度です。原則として登録によって権利が発生します。著作権は思想・感情を創作的に表現した著作物を保護し、原則創作時に発生します。"},{"heading":"プログラムと知財","body":"ソースコード等の創作的表現は著作権の対象となり得ますが、アイデアやアルゴリズムそのものを著作権で独占できるわけではありません。技術的思想が特許の要件を満たす場合には特許による保護を検討できます。特許には新規性・進歩性等の要件があり、出願だけで特許権が発生するわけではありません。"},{"heading":"利用時の確認","body":"複製、改変、配布、公開の許諾範囲を確認します。オープンソースソフトウェアにも著作権がありライセンス条件があります。営業秘密は秘密管理性・有用性・非公知性などの要件により不正競争防止法で保護され得ます。権利の種類、発生条件、保護対象を区別します。"}]},{"id":"23-Y01","title":"知的財産権の保護対象と利用許諾","explain":"<p>著作権は創作的表現を保護し、原則として創作時に発生します。特許権は発明、実用新案権は物品の形状・構造・組合せに係る考案、意匠権はデザイン、商標権は商品・役務の識別標識を登録制度によって保護します。</p>","worked":"<p>ゲームの名称は商標、創作的なキャラクター絵は著作権、技術的発明は特許の対象となり得る。</p>","prompt":"営業秘密の三要件に含まれないものは？","answer":"<p>特許登録。営業秘密に特許登録は不要。三要件を区別する。</p>","beginner":{"scenario":"新しいゲームのプログラム、名称、外観、技術を保護したい。","trap":"著作権が技術的アイデアそのものを一般に独占させるわけではない。","quizId":"U-23-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"著作権は創作的表現を保護し、原則として創作時に発生します。特許権は発明、実用新案権は物品の形状・構造・組合せに係る考案、意匠権はデザイン、商標権は商品・役務の識別標識を登録制度によって保護します。"},{"heading":"仕組みと使い分け","body":"営業秘密は秘密管理性、有用性、非公知性が要件です。権利の帰属、許諾範囲、契約、第三者権利を確認します。特許権は原則出願日から20年（例外あり）、著作権は原則著作者の死後70年（法人・映画等には別規定）であり、すべての権利に同じ期間を適用しません。"},{"heading":"具体的な判断と手順","body":"ゲームの名称は商標、創作的なキャラクター絵は著作権、技術的発明は特許の対象となり得る。"}]},{"id":"23-Z03","title":"著作権・著作者人格権・画像意匠","explain":"<p>著作権のうち財産権は譲渡できるが、著作者人格権は著作者に一身専属し譲渡できない。公表権・氏名表示権・同一性保持権がある。改修時の紛争を防ぐため、必要な範囲で人格権を行使しない旨の契約を定めることがある。権利の帰属・当事者・法定例外は別途確認する。</p>","worked":"<p>委託先から著作権を譲り受けても人格権は移らないため、改修のための契約条件も確認する。</p>","prompt":"譲渡できない権利は？","answer":"<p>人格権は著作者に一身専属する。</p>","beginner":{"scenario":"委託開発したソフトを納品後に自社で改修したい。","trap":"著作者人格権の不行使契約は人格権の譲渡ではない。","quizId":"U-23-Z03"},"textbook":[{"heading":"基本原理","body":"著作権のうち財産権は譲渡できるが、著作者人格権は著作者に一身専属し譲渡できない。公表権・氏名表示権・同一性保持権がある。改修時の紛争を防ぐため、必要な範囲で人格権を行使しない旨の契約を定めることがある。権利の帰属・当事者・法定例外は別途確認する。"},{"heading":"仕組み・判断","body":"創作的なプログラムや操作マニュアル、情報の選択又は体系的構成に創作性があるデータベースは保護対象になり得る。プログラム言語、規約、解法自体にはプログラム著作物の保護が及ばない。無料公開されていることは著作権放棄を意味しない。"},{"heading":"応用と注意点","body":"意匠法では要件を満たす画像のデザイン（GUIなど）も保護され得る。アルゴリズムや通信規約などの抽象的な仕組み自体は意匠の対象と異なる。特許・著作権・意匠・契約の役割を分ける。"}]},{"id":"23-2","title":"個人情報保護・情報セキュリティ法制","explain":"<p>日本の個人情報保護法は個人情報・個人データ・保有個人データ等を区別し、利用目的、安全管理措置、第三者提供、本人の権利などを定める。仮名加工情報と匿名加工情報は加工方法、再識別、取扱い規律が異なる。特定個人情報（マイナンバー関係）には別途厳格な規律がある。対象事業・例外・最新法令の適用は必ず確認する。</p>\n<p>不正アクセス禁止法は他人の識別符号の不正利用等によるアクセス行為などを規制する。不正競争防止法の営業秘密は秘密管理性・有用性・非公知性を満たす情報。不正取得・使用・開示に関する規律がある。情報の流出を防ぐ技術対策だけでなく、契約・教育・物理管理も必要。</p>\n","worked":"<p>顧客データを外注先に渡す場合、「外注だから第三者提供は自由」と即断せず、委託先の監督、安全管理、利用目的の範囲、提供区分を確認する。</p>\n","prompt":"住所が含まれなければ個人情報ではないか。","answer":"<p>そうとは限らない。氏名・識別子・容易に照合できる情報などにより特定個人を識別できる場合がある。</p>\n","beginner":{"scenario":"顧客データを外部の集計事業者に委託する場合、利用目的の範囲・委託先の監督・安全管理を確認する。","trap":"委託と第三者提供は同一の扱いではない。法的要件は具体的状況で確認する。","quizId":"U-23-2"},"textbook":[{"heading":"個人情報の取扱い","body":"個人情報保護法は個人情報、個人データ、保有個人データなどを区別し、利用目的、安全管理、提供、本人からの請求等について規律を定めます。個人情報には特定の生存する個人を識別できる情報等が含まれます。委託、第三者提供、共同利用は適用条件が異なります。"},{"heading":"加工した情報と安全管理","body":"仮名加工情報は他情報と照合しない限り特定個人を識別できないよう加工した情報等で、匿名加工情報は個人を識別・復元できないよう法定基準で加工した情報です。取扱いルールは異なり、単に名前を削除しただけで自由に利用できるとは限りません。"},{"heading":"不正利用を防ぐ法律","body":"不正アクセス禁止法は他人の識別符号の不正利用などによる不正アクセス行為等を規制します。不正競争防止法は営業秘密の不正取得・使用・開示等を規制します。法律の目的と事例の行為を対応させ、最新法令の具体的な適用要件は原典で確認します。"}]},{"id":"23-Y02","title":"情報保護・不正アクセス・電子取引関連法","explain":"<p>個人情報保護法は個人情報の適正な取扱いと権利利益の保護を目的とします。利用目的、適正取得、安全管理、第三者提供、開示等のルールを確認します。不正アクセス禁止法はアクセス制御を突破する不正アクセスや関連行為を規制します。</p>","worked":"<p>本人同意なく他人のID・パスワードを用いて制限されたサービスへログインする行為は不正アクセス禁止法の対象となり得る。</p>","prompt":"アクセス制御されたシステムへの不正アクセスを主に規制する法は？","answer":"<p>不正アクセス禁止法。アクセス制御に対する不正なアクセス等を規制する法律。</p>","beginner":{"scenario":"顧客情報を管理するWebサービスで、他人の認証情報を使ったアクセスと広告メールの苦情が発生した。","trap":"電子署名は暗号化による機密性保護と同じではない。","quizId":"U-23-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"個人情報保護法は個人情報の適正な取扱いと権利利益の保護を目的とします。利用目的、適正取得、安全管理、第三者提供、開示等のルールを確認します。不正アクセス禁止法はアクセス制御を突破する不正アクセスや関連行為を規制します。"},{"heading":"仕組みと使い分け","body":"電子署名法は一定要件の電子署名が付いた電磁的記録の真正な成立の推定などを定めます。特定電子メール法は広告宣伝メールを規制し、原則オプトイン等のルールがあります。情報流通プラットフォーム対処法は権利侵害情報への対応等を規律します。適用要件や例外は原典で確認します。"},{"heading":"具体的な判断と手順","body":"本人同意なく他人のID・パスワードを用いて制限されたサービスへログインする行為は不正アクセス禁止法の対象となり得る。"}]},{"id":"23-C01","title":"デジタル社会・データ活用・情報公開","explain":"<p>行政サービスをオンライン化し公開データを活用する。</p><p>シラバスVer.7.2 本文132–133頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>行政のオープンデータ活用と個人情報保護を両立する。</p>","prompt":"官民データ活用と情報利用機会の格差是正を推進する基本法は？","answer":"<p>正解は「官民データ活用推進基本法」。官民データ活用推進基本法：官民データの活用を総合的に推進するための基本法。行政手続のオンライン利用の原則化、データ活用促進、利用機会の格差是正等に関係する。個人情報を無条件に公開する制度ではない。</p>","beginner":{"scenario":"行政サービスをオンライン化し公開データを活用する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-23-C01"},"textbook":[{"heading":"デジタル社会形成基本法","body":"デジタル社会形成の基本理念・施策等を定める。公的基礎情報データベース（ベースレジストリ）は行政等で共通利用する基礎情報を整備する考え方。デジタル庁の設置はデジタル庁設置法による。"},{"heading":"官民データ活用推進基本法","body":"官民データの活用を総合的に推進するための基本法。行政手続のオンライン利用の原則化、データ活用促進、利用機会の格差是正等に関係する。個人情報を無条件に公開する制度ではない。"},{"heading":"情報公開法","body":"国の行政機関が保有する行政文書の開示請求制度を定める。独立行政法人等の法人文書は別の関連法。個人情報等の不開示情報や手続上の例外がある。個人情報保護法の本人開示請求と目的が違う。"}]},{"id":"23-C02","title":"情報倫理・誤情報・技術者の責任","explain":"<p>拡散された情報の信頼性と社会への影響を検討する。</p><p>シラバスVer.7.2 本文133頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>事実の一部を意図的に害する目的で公開する例はマルインフォメーション。</p>","prompt":"推薦で似た意見ばかり表示され、利用者間で同じ主張が増幅された。二つの現象を区別し、対策を挙げよ。","answer":"<p>前者はフィルターバブルで推薦の多様性や設定を改善する。後者はエコーチェンバーで異なる意見・根拠に触れる機会を設ける。情報選別と対人の増幅は別の仕組み。</p>","beginner":{"scenario":"拡散された情報の信頼性と社会への影響を検討する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-23-C02"},"textbook":[{"heading":"情報倫理が必要な理由","body":"法令に違反しない行為であっても、個人や社会への損害が生じることがあります。情報倫理は情報の作成、収集、利用、拡散に伴う責任を考える分野です。まず情報の正確さ、意図、公開範囲、当事者の権利を分けて考えます。"},{"heading":"誤情報の分類","body":"ミスインフォメーションは誤った情報が必ずしも害意なく共有されるもの、ディスインフォメーションは虚偽の情報を意図的に流すもの、マルインフォメーションは真正な情報を害を与える目的で用いるものを指す代表的な分類です。真偽だけでなく意図や文脈も区別します。被害や拡散を抑えるには情報源、根拠、公開の妥当性を確認します。"},{"heading":"情報環境と集団の判断","body":"フィルターバブルは個別最適化などにより接する情報が偏る現象です。エコーチェンバーは似た意見の人々が互いに意見を強める現象です。集団思考は集団の合意を優先するあまり異論や代替案の検討が弱まることです。技術による情報選別、対人の反響、組織の意思決定という異なる仕組みを区別します。"},{"heading":"個人の権利と長期の影響","body":"デジタルタトゥーは公開された情報が複製・保存され、後から完全に消しにくい問題を指します。インフォームドコンセントは、目的、方法、利益、リスクなどの十分な説明を受けた上で本人が自由に同意することです。単に同意欄をクリックさせれば十分とは限りません。収集目的、保存期間、二次利用、撤回可能性を考える必要があります。"},{"heading":"技術開発とELSI","body":"ELSI（Ethical, Legal and Social Issues: 倫理的・法的・社会的課題）は技術が社会で使われる際に生じる問題を考える観点です。開発者は精度だけでなくプライバシー、公平性、安全性、説明可能性、影響を受ける当事者を検討します。法令遵守と倫理的妥当性は重なる部分があっても同じではありません。"},{"heading":"情報へのアクセスを管理する手段","body":"フィルタリングは定めた基準に従って不適切な情報等へのアクセスを制限します。ペアレンタルコントロール（保護者による利用制御）は子どもの利用時間や閲覧対象等を管理する機能です。意図的に保護する仕組みであり、推薦等により意図せず情報が偏るフィルターバブルとは区別します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"23-Z02","title":"情報流通プラットフォーム対処法：責任と手続","explain":"<p>シラバス本文131頁（6）／e-Gov法令を根拠にした補強単元です。</p>","worked":"<p>被害申出を受けた指定事業者は、調査と判断を行い、法定の手続に沿って申出者へ通知する。削除の有無を機械的に決定するのではない。</p>","prompt":"情プラ法による指定大規模事業者の義務として適切なのは？","answer":"<p>指定事業者に対応手続の迅速化と透明性の確保が求められる。</p>","beginner":{"scenario":"SNSに他人のプライバシーを侵害する投稿があり、被害者が削除を申し出る。","trap":"大規模事業者に課される特別な義務をすべての個人サイトに一律適用しない。","quizId":"U-23-Z02"},"textbook":[{"heading":"旧法からの変更","body":"2025年4月施行の改正で旧プロバイダ責任制限法は情報流通プラットフォーム対処法に改称されました。投稿などによる権利侵害に関し、提供者の損害賠償責任の制限や発信者情報の開示の制度に加え、指定された大規模事業者への手続上の義務が設けられています。"},{"heading":"迅速化と透明性","body":"指定された大規模特定電気通信役務提供者は、権利侵害を受けた人からの申出方法の公表、調査、法令に従った判断と通知等を行います。削除等の措置の基準を公表し、実施状況の透明性を確保する義務もあります。全投稿の無条件・即時削除を求める制度ではありません。"},{"heading":"別の法律との区別","body":"個人情報保護法は事業者等の個人情報の取扱い、不正アクセス禁止法はアクセス制御に関する不正行為、特定電子メール法は広告宣伝メールなどを規律します。情プラ法の問題では投稿による権利侵害、発信者情報開示、提供者の責任と手続が主な着目点です。"}]},{"id":"23-3","title":"労働・取引・契約・コンプライアンス","explain":"<p>労働基準法は労働時間等の最低基準、労働者派遣法は派遣事業・派遣先の適正な運用に関する規律を含む。請負・準委任・労働者派遣は契約書の名称だけで決まるものではなく、実際の指揮命令関係等を踏まえる。発注者が請負先作業者に直接労務指揮することは偽装請負等の問題につながり得る。</p>\n<p>下請取引の規律、独占禁止法、景品表示法、消費者保護などは取引類型と当事者の規模等で適用が異なる。コンプライアンスは「法律違反だけしなければよい」ではなく、倫理・契約・社内規程・説明責任を含む仕組みである。改正法があるため細かな適用条件は最新情報を確認する。</p>\n","worked":"<p>委託契約なのに発注元が作業者へ日々直接指示し勤怠を管理していれば、契約実態に基づき問題となる可能性がある。職務分担と指揮命令系統を整理する。</p>\n","prompt":"契約書に「請負」と書けば常に請負になるか。","answer":"<p>ならない。実態が重要。</p>\n","beginner":{"scenario":"請負契約で成果物の完成を求めても、発注者が受託側作業者へ日々直接指揮命令する場合は偽装請負等の問題につながり得る。","trap":"契約の名称だけで法的な実態は決まらない。","quizId":"U-23-3"},"textbook":[{"heading":"働き方と契約の違い","body":"労働基準法は労働時間、賃金など労働条件の最低基準を定めます。労働者派遣では派遣元が労働者を雇用し、派遣先の指揮命令を受けて働きます。請負では受託側が自ら業務を管理し仕事を完成させるのが基本です。"},{"heading":"契約名だけでは決まらない","body":"請負と書かれていても発注者が受託側作業者へ直接指揮命令する実態があれば偽装請負等の問題につながる可能性があります。準委任は一定の業務遂行を目的とする契約類型で、具体的な権利義務は契約内容と法令によります。"},{"heading":"取引の公正さ","body":"独占禁止法は公正かつ自由な競争を促進し、優越的地位の濫用などを規制します。取適法やフリーランス法は対象取引に応じ取引条件や支払等を規律します。どの法律が適用されるかは取引類型、当事者、行為の内容を確認します。"}]},{"id":"23-X01","title":"取適法・労働取引法規の改正","explain":"<p>2026年1月1日施行の中小受託取引適正化法（取適法）は旧下請法を改正したもの。委託事業者と中小受託事業者の間の対象取引を適正化し、代金支払遅延や不当な減額等を防ぐ。適用対象は委託内容、資本金、従業員数などの基準で判断される。情報成果物作成委託も対象となり得る。</p><p>改正では従業員数基準の追加、一定の運送委託の追加、協議に応じない一方的な代金決定の禁止、手形払い等の禁止が重要。対象取引では受領日から原則60日以内でできる限り短い支払期日を定める。労働基準法、労働者派遣法、独占禁止法、フリーランス法は別の法規であり、適用条件を混同しない。出典：公正取引委員会 https://www.jftc.go.jp/toriteki/</p>","worked":"<p>対象となるソフトウェア委託で、受託側が費用上昇を理由に協議を求めたのに発注側が協議せず一方的に価格を据え置く行為は問題となり得る。</p>","prompt":"2026年1月施行の取適法で新たに禁止された支払方法は？","answer":"<p>手形払い。適用対象取引では禁止される。</p>","beginner":{"scenario":"対象となるソフトウェア委託で受託側が原材料・人件費上昇を理由に価格協議を申し出たとき、発注側が協議せず一方的に価格を決めることは規制対象となり得る。","trap":"取適法の適用は取引類型・規模等の法定基準で判断する。すべての委託契約に一律適用されない。","quizId":"U-23-X01"},"textbook":[{"heading":"法改正の背景と対象","body":"2026年1月1日施行の中小受託取引適正化法（取適法）は旧下請法を改正した法律です。委託事業者と中小受託事業者との対象取引を適正化し、中小受託事業者の利益を保護することを目的とします。対象は委託の内容と資本金・従業員数などの基準で判断します。"},{"heading":"改正の要点","body":"従業員数基準の追加、一定の運送委託の追加、協議に応じない一方的な代金決定の禁止、手形払等の禁止が主な改正点です。対象取引では原則として受領日から60日以内のできる限り短い期間内に支払期日を定めるなどの義務があります。"},{"heading":"試験で区別すること","body":"情報成果物作成委託などが対象となる場合がありますが、すべての委託に一律適用されるわけではありません。独占禁止法、労働者派遣法、フリーランス法と保護対象・規制行為・適用要件を区別します。公正取引委員会の取適法資料と公式シラバスを確認することが重要です。"}]},{"id":"23-Y03","title":"派遣・請負・準委任・取適法","explain":"<p>労働者派遣では派遣元との雇用関係の下で派遣先が指揮命令します。請負は仕事の完成を目的とし、準委任は事務処理を委託する契約です。請負・準委任名義でも実態が労働者派遣なら偽装請負等の問題になり得ます。</p>","worked":"<p>派遣の場合は派遣先が指揮命令するが、請負の作業者への指示は原則として請負側の管理者が行う。</p>","prompt":"派遣労働者の日常の指揮命令を行うのは原則誰か？","answer":"<p>派遣先。派遣元との雇用関係と派遣先の指揮命令を区別する。</p>","beginner":{"scenario":"発注企業が外部の開発者へ日常的に直接作業を指示する契約を検討する。","trap":"契約書の名称だけで適法な契約形態は決まらない。","quizId":"U-23-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"労働者派遣では派遣元との雇用関係の下で派遣先が指揮命令します。請負は仕事の完成を目的とし、準委任は事務処理を委託する契約です。請負・準委任名義でも実態が労働者派遣なら偽装請負等の問題になり得ます。"},{"heading":"仕組みと使い分け","body":"中小受託取引適正化法（取適法）は2026年1月1日施行の改正後の制度名称です。対象取引・事業者要件に該当する場合、取引条件明示、代金支払、禁止行為等が問題になります。フリーランス法は一定の業務委託で取引適正化・就業環境整備を図ります。個別適用は公式情報で確認します。"},{"heading":"具体的な判断と手順","body":"派遣の場合は派遣先が指揮命令するが、請負の作業者への指示は原則として請負側の管理者が行う。"}]},{"id":"23-Z01","title":"取適法：改正点・適用判定・支払管理","explain":"<p>シラバス本文131頁（2）①／公正取引委員会を根拠にした補強単元です。</p>","worked":"<p>対象取引の発注を2026年2月に行った場合、手形払いを従来の支払方法のまま続けない。適用基準、受領日、支払期日、条件明示の記録を確認する。</p>","prompt":"取適法における2026年改正の内容として適切なのは？","answer":"<p>資本金基準に加えて従業員数の基準が導入された。対象取引の手形払いは禁止。</p>","beginner":{"scenario":"大企業が小規模な開発会社に情報成果物の作成を委託し、納品後の支払方法を検討している。","trap":"旧法の資本金基準だけで適用外と決めない。60日を検収完了日から一律に数えない。","quizId":"U-23-Z01"},"textbook":[{"heading":"対象を判定する","body":"2026年1月1日施行の取適法（中小受託取引適正化法）は、対象となる委託取引の適正化と中小受託事業者の利益保護を目的とします。対象となる製造、修理、情報成果物作成、役務提供、特定運送の委託かを確認し、取引類型別の資本金または常時使用する従業員数の基準を照合します。すべての企業間契約を一律に対象としません。"},{"heading":"改正の意味","body":"旧下請法から名称を変更し、従業員数による基準や特定運送委託を追加しました。対象取引では手形による支払が禁止され、受託側からの協議の求めに応じない一方的な代金決定も禁止されます。対象となる新規発注時期や具体的要件は公正取引委員会の資料で確認します。"},{"heading":"発注から支払まで","body":"委託条件は発注時に明示し、給付の受領日（役務提供では提供日）から原則60日以内のできる限り短い期間に支払期日を定めます。検収が終わらないことだけを理由に起算日を遅らせないようにします。受領拒否、減額、買いたたき等の禁止行為と契約上の合意を区別し、取引記録を保存します。"}]},{"id":"23-Z04","title":"労働法規・ハラスメント防止措置","explain":"<p>労働施策総合推進法では職場のパワーハラスメント防止のため、事業主に相談への適切な対応体制の整備などを義務付ける。職場の優越的関係を背景とする言動で、業務上必要かつ相当な範囲を超え、就業環境を害するものが該当する。</p>","worked":"<p>相談を受ける体制を設け、相談したことを理由に不利益な扱いをしない。</p>","prompt":"職場のパワーハラスメント防止に必要な雇用管理措置を事業主に義務づける法律は？","answer":"<p>労働施策総合推進法は相談体制等の整備を求める。</p>","beginner":{"scenario":"職場でのパワーハラスメント相談を受け、会社が対応する。","trap":"相談の受付だけで対応措置が完了するわけではない。","quizId":"U-23-Z04"},"textbook":[{"heading":"基本原理","body":"労働施策総合推進法では職場のパワーハラスメント防止のため、事業主に相談への適切な対応体制の整備などを義務付ける。職場の優越的関係を背景とする言動で、業務上必要かつ相当な範囲を超え、就業環境を害するものが該当する。"},{"heading":"仕組み・判断","body":"方針の周知、相談窓口、事実確認、被害者への配慮、行為者への適切な対応、再発防止、プライバシー保護、相談等を理由とする不利益取扱いの禁止が重要。適切な業務指導とハラスメントは区別する。"},{"heading":"応用と注意点","body":"最低賃金法は賃金の最低額、労働基準法は労働条件の最低基準、労働組合法は団結・団体交渉等を扱う。法律名だけでなく保護対象・事業主の義務を対応づける。最新の改正や施行日は厚生労働省の資料で確認する。"}]},{"id":"23-C03","title":"会社法・税法・電子文書・通信関連法","explain":"<p>電子取引の証憑を保存し法令上の目的を区別する。</p><p>シラバスVer.7.2 本文133–134頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>税務関連の電子取引記録の保存ルールを確認するには電子帳簿保存法。</p>","prompt":"適格請求書等保存方式は主にどの税の仕入税額控除に関係する？","answer":"<p>正解は「消費税」。税・電子保存：法人税法は法人所得等への課税、消費税法は消費税。インボイス制度（適格請求書等保存方式）は仕入税額控除に関する請求書等の保存要件を定める。e-文書法は法令による保存義務のある文書の電子保存を可能とする枠組み。電子帳簿保存法は国税関係帳簿書類・電子取引データの保存等。具体的要件は税務当局で確認する。</p>","beginner":{"scenario":"電子取引の証憑を保存し法令上の目的を区別する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-23-C03"},"textbook":[{"heading":"会社法・金融商品取引法","body":"会社法は会社の設立・機関・運営・組織再編等。株主総会、取締役、監査役等の役割を定める。金融商品取引法は市場の公正・投資者保護のための開示等を規律する。有価証券報告書や内部統制報告書などが関係する。"},{"heading":"税・電子保存","body":"法人税法は法人所得等への課税、消費税法は消費税。インボイス制度（適格請求書等保存方式）は仕入税額控除に関する請求書等の保存要件を定める。e-文書法は法令による保存義務のある文書の電子保存を可能とする枠組み。電子帳簿保存法は国税関係帳簿書類・電子取引データの保存等。具体的要件は税務当局で確認する。"},{"heading":"通信傍受法","body":"犯罪捜査のための通信傍受について対象犯罪や手続などを定める。任意の企業監視を一般に許す法律ではない。通信の秘密や個人情報の保護も別途考える。"}]},{"id":"23-X02","title":"その他の法令・ガイドライン・技術者倫理","explain":"<p>電子署名法は一定の電子署名がなされた電子文書の真正な成立の推定等を定める。公益通報者保護法は法令違反の通報者保護等を扱う。個人情報保護法、不正アクセス禁止法、不正競争防止法、特定商取引法、景品表示法などの目的と適用場面を区別する。</p><p>技術者倫理は法令遵守だけでなく安全性、公平性、プライバシー、説明責任、利益相反、社会的影響を考慮すること。AIのバイアス、個人情報の目的外利用、秘密情報の漏えい、著作権侵害、生成内容の誤りを評価する。標準化では国際規格、国家規格、業界標準、事実上の標準を区別する。</p>","worked":"<p>自動採用システムが特定集団に不利な判定をしていると分かったら、精度だけでなく公平性を評価し是正する。</p>","prompt":"一定の要件を満たす電子署名による電子文書の真正な成立の推定を定める法律は？","answer":"<p>電子署名法。</p>","beginner":{"scenario":"採用AIが特定集団を不当に不利に扱う場合、精度だけでなくデータの偏り・公平性・説明可能性を確認し是正する。","trap":"法令遵守だけで技術者の責任を果たしたとは限らない。","quizId":"U-23-X02"},"textbook":[{"heading":"法律が保護するもの","body":"電子署名法は一定の電子署名がなされた電子文書について真正な成立の推定などを定めます。公益通報者保護法は一定の公益通報を行った人の保護等を扱います。景品表示法は不当表示・過大な景品類などを規制し、特定商取引法は一定の取引類型における消費者保護を扱います。"},{"heading":"倫理は法律の最低限を超える","body":"技術者は安全性、公平性、プライバシー、秘密保持、説明責任、利益相反に配慮します。法令上直ちに禁止されていなくても、重大な危険や不当な差別を見つけたら報告・改善する責任があり得ます。"},{"heading":"AIと情報の利用","body":"AIによる評価が特定集団に不利な場合、学習データやモデルの偏り、判断根拠、人による確認、異議申立ての仕組みを検討します。生成AIの出力は事実や著作権処理を保証しないため根拠・権利・秘密情報の取扱いを確認します。法令・ガイドライン・社内規程の性質を区別します。"}]},{"id":"23-Y04","title":"その他の関連法・ガイドライン・技術者倫理","explain":"<p>電子帳簿保存法は国税関係帳簿・書類の電子保存等を扱います。金融商品取引法は投資者保護や開示、会社法は会社の組織・運営等を規律します。電気通信事業法、電波法などは通信事業・電波利用の規律です。</p>","worked":"<p>AIが採用候補を選ぶ場合、偏り、個人情報、評価根拠、異議申立て、人による確認を設計する。</p>","prompt":"国税関係帳簿書類の電子保存等を規定する法律は？","answer":"<p>電子帳簿保存法。税務上の帳簿・書類の電子保存等に関する法律。</p>","beginner":{"scenario":"会計記録を電子保存し、生成AIを業務に導入する企業が法令と社内規則を整備する。","trap":"技術的に可能であることは法的・倫理的に許容されることと同じではない。","quizId":"U-23-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"電子帳簿保存法は国税関係帳簿・書類の電子保存等を扱います。金融商品取引法は投資者保護や開示、会社法は会社の組織・運営等を規律します。電気通信事業法、電波法などは通信事業・電波利用の規律です。"},{"heading":"仕組みと使い分け","body":"ガイドラインは法令と同じ拘束力を当然に持つわけではありませんが、安全・倫理・説明責任の判断に役立ちます。AIの利用では公平性、プライバシー、透明性、安全性、人間の関与、知財を検討し、事故や利益相反を適切に報告します。"},{"heading":"具体的な判断と手順","body":"AIが採用候補を選ぶ場合、偏り、個人情報、評価根拠、異議申立て、人による確認を設計する。"}]},{"id":"23-C04","title":"産業機器の安全・製造物責任","explain":"<p>組込み機器やドローンを安全に開発・運用する。</p><p>シラバスVer.7.2 本文134頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>制御ソフトの欠陥が組込み機器の事故を生じさせた場合、製造物の欠陥を検討する。</p>","prompt":"欠陥のある製造物による損害について製造業者等の責任を定める法は？","answer":"<p>正解は「PL法」。PL法（製造物責任法）：製造物の欠陥によって生命・身体・他の財産等に損害が生じた場合、製造業者等の責任を定める。ソフトウェア単体と、欠陥あるソフトを組み込んだ製造物は区別する。契約責任や他法令も関係する。</p>","beginner":{"scenario":"組込み機器やドローンを安全に開発・運用する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-23-C04"},"textbook":[{"heading":"車両・航空","body":"道路運送車両法は車両の保安基準や登録・検査等を規律する。航空法は航空機・無人航空機の安全等、小型無人機等飛行禁止法は重要施設周辺等の飛行を規制する。適用は機体・場所・飛行形態による。"},{"heading":"労働安全衛生法","body":"職場での労働者の安全・健康確保を目的とする。産業用ロボットの作業、保守、安全措置等に関連する。"},{"heading":"PL法（製造物責任法）","body":"製造物の欠陥によって生命・身体・他の財産等に損害が生じた場合、製造業者等の責任を定める。ソフトウェア単体と、欠陥あるソフトを組み込んだ製造物は区別する。契約責任や他法令も関係する。"}]},{"id":"23-C05","title":"環境・輸出規制・製品適合","explain":"<p>IT機器を調達・廃棄・輸出するときの規制を確認する。</p><p>シラバスVer.7.2 本文134頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>電子部品の有害物質含有を確認するときはRoHSの適用を検討する。</p>","prompt":"電気電子機器の特定有害物質を制限するEUの指令は？","answer":"<p>正解は「RoHS指令」。国際適合：CEマークは対象製品が適用されるEU法令の要求に適合することを表示する仕組み。RoHS指令は電気電子機器に含まれる特定有害物質を制限する。適用範囲や例外は製品ごとに確認する。</p>","beginner":{"scenario":"IT機器を調達・廃棄・輸出するときの規制を確認する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-23-C05"},"textbook":[{"heading":"環境関連法","body":"廃棄物処理法は廃棄物の適正処理、リサイクル法と呼ばれる各制度は再資源化等を促す。省エネ法はエネルギー使用の合理化等、GX推進法は脱炭素成長型経済構造への移行、GX脱炭素電源法は脱炭素電源の活用等に関する関連法改正を扱う。"},{"heading":"国際適合","body":"CEマークは対象製品が適用されるEU法令の要求に適合することを表示する仕組み。RoHS指令は電気電子機器に含まれる特定有害物質を制限する。適用範囲や例外は製品ごとに確認する。"},{"heading":"輸出管理","body":"外国為替及び外国貿易法（外為法）は安全保障貿易管理等を含む。対象貨物・技術、仕向地、需要者、用途を確認し必要なら許可を取得する。米国輸出関連法も取引内容によって関係する。"}]},{"id":"23-4","title":"標準化・品質・監査関連の規格","explain":"<p>標準化は仕様の共通化により互換性、品質、調達のしやすさを高める。ISO（International Organization for Standardization：国際標準化機構）、IEC（International Electrotechnical Commission：国際電気標準会議）、JIS（Japanese Industrial Standards：日本産業規格）などがある。ISO 9001は品質マネジメント、ISO/IEC 27001は情報セキュリティマネジメントの要求事項、ISO/IEC 20000-1はITサービスマネジメントの要求事項を扱う。</p>\n<p>規格への認証取得はシステムの全ての脆弱性が解消されたことを意味しない。適用範囲、審査時点、継続的な改善を確認する。監査証拠は規格・ポリシー・手順と実際の運用記録を照合する。</p>\n","worked":"<p>「ISO/IEC 27001の認証を取得している」だけでは、特定WebアプリのSQLインジェクションが存在しないとはいえない。別途脆弱性診断と修正が必要。</p>\n","prompt":"JISとISOは同じ組織か。","answer":"<p>違う。JISは日本の国家規格、ISOは国際的な標準化機関。</p>\n","beginner":{"scenario":"会社が情報セキュリティ管理の規格に認証されても、個別アプリに脆弱性がないとは限らない。個々のリスク評価や診断を続ける。","trap":"マネジメントシステム認証と製品の性能保証を混同しない。","quizId":"U-23-4"},"textbook":[{"heading":"標準を作る目的","body":"製品やシステムの仕様が共通なら互換性、品質の評価、調達の比較がしやすくなります。ISOは国際標準化機構、IECは国際電気標準会議、JISは日本産業規格です。規格によって技術仕様を定めるもの、組織の管理システムを定めるものなどがあります。"},{"heading":"主要な管理規格","body":"ISO 9001は品質マネジメントシステム、ISO/IEC 27001は情報セキュリティマネジメントシステム、ISO/IEC 20000-1はサービスマネジメントシステム、ISO 22301は事業継続マネジメントシステムの要求事項を定めます。数字だけでなく何を管理するかを覚えます。"},{"heading":"認証が示すこと","body":"マネジメントシステムの認証は一定の適用範囲で要求事項への適合を評価するもので、すべての製品の無欠陥や将来の事故ゼロを保証しません。日常運用での検証・改善と、製品ごとの評価も必要です。監査では適用される規格や規程を基準に証拠を確認します。"}]},{"id":"23-Y05","title":"規格・認証・適合性評価","explain":"<p>ISO（International Organization for Standardization：国際標準化機構）やIEC（国際電気標準会議）は国際規格を作成し、JIS（日本産業規格）は国内規格です。デジュール標準は公的な標準化手続による標準、デファクト標準は市場の普及によって事実上標準となったものです。</p>","worked":"<p>委託先の27001認証の範囲に対象業務・拠点が含まれるかを確認し、契約・運用の個別リスクは別途評価する。</p>","prompt":"情報セキュリティ管理システムの要求事項を規定する代表的な規格は？","answer":"<p>ISO/IEC 27001。27001はISMS（情報セキュリティマネジメントシステム）。</p>","beginner":{"scenario":"委託先が情報セキュリティ管理の認証を取得したと言っている。何が保証されるのか確認する。","trap":"認証取得は全製品の無欠陥・無事故を保証しない。","quizId":"U-23-Y05"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ISO（International Organization for Standardization：国際標準化機構）やIEC（国際電気標準会議）は国際規格を作成し、JIS（日本産業規格）は国内規格です。デジュール標準は公的な標準化手続による標準、デファクト標準は市場の普及によって事実上標準となったものです。"},{"heading":"仕組みと使い分け","body":"ISO 9001は品質管理システム、ISO/IEC 27001は情報セキュリティ管理システム、ISO/IEC 20000-1はサービス管理システムの要求事項です。認証は適用範囲と規格に対する適合を評価する仕組みで、認定は認証機関等の能力を評価する仕組みです。"},{"heading":"具体的な判断と手順","body":"委託先の27001認証の範囲に対象業務・拠点が含まれるかを確認し、契約・運用の個別リスクは別途評価する。"}]},{"id":"23-C06","title":"標準化団体・開発規格・データ標準","explain":"<p>標準の制定主体と対象を選び分ける。</p><p>シラバスVer.7.2 本文134–136頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>インターネットプロトコルの標準化を行う団体はIETF。</p>","prompt":"環境マネジメントシステムの要求事項の規格は？","answer":"<p>正解は「ISO 14001」。開発・環境・評価規格：JIS X 0160はソフトウェアライフサイクルプロセス、JIS X 0170はシステムライフサイクルプロセスの規格。ISO 14000は環境管理規格群、JIS Q 14001（ISO 14001）は環境マネジメント要求事項。ISO/IEC 15408はIT製品等のセキュリティ評価基準。CORBAは分散オブジェクトの相互運用、EJBはJavaの企業向けコンポーネント技術。</p>","beginner":{"scenario":"標準の制定主体と対象を選び分ける。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-23-C06"},"textbook":[{"heading":"標準化団体","body":"JISC（日本産業標準調査会）はJIS等を審議し、JSA（日本規格協会）は標準化支援・普及などを行う。ITUは国際電気通信連合、IECは国際電気標準会議、IETFはインターネット技術の標準化、NISTは米国国立標準技術研究所、ANSIは米国規格協会、IEEEは電気電子学会。OMGはモデル・分散技術等、W3CはWeb技術の標準化を扱う。"},{"heading":"開発・環境・評価規格","body":"JIS X 0160はソフトウェアライフサイクルプロセス、JIS X 0170はシステムライフサイクルプロセスの規格。ISO 14000は環境管理規格群、JIS Q 14001（ISO 14001）は環境マネジメント要求事項。ISO/IEC 15408はIT製品等のセキュリティ評価基準。CORBAは分散オブジェクトの相互運用、EJBはJavaの企業向けコンポーネント技術。"},{"heading":"データ標準と認証","body":"EBCDIC（拡張2進化10進符号）はIBM系で使われてきた文字コード。SYLKは表計算等のデータ交換形式。JAN・ITF・ISBN・QRコードは識別・表示用途が異なる。認証機関は対象の適合を評価し、認定機関は評価機関の能力等を認定する。試験機関は測定・試験を実施する。"}]}],"beginnerIntro":"技術を適法かつ責任ある形で扱うための法律と規格を学ぶ。何を保護し、どんな行為を規制するかを事例から区別する。","studyGroups":[{"title":"知的財産","body":"保護対象、権利の成立、利用許諾を区別する。","ids":["23-1","23-Y01","23-Z03"]},{"title":"情報と社会","body":"個人情報、安全性、情報流通と倫理を考える。","ids":["23-2","23-Y02","23-C01","23-C02","23-Z02"]},{"title":"労働・取引・契約", 9×2/(2×10^9)=1秒。"},{"id":"D03-02","chapter":3,"kind":"applied","q":"キャッシュヒット率95%、ヒット5ns、ミスした場合の総時間105nsでの平均アクセス時間はどれか。","options":["5ns","10ns","15ns","100ns"],"correct":1,"explain":"0.95×5＋0.05×105＝10ns。ミス時間が追加ペナルティなのか総時間なのかに注意する。"},{"id":"D03-03","chapter":3,"kind":"applied","q":"4TBのディスクを5台使うRAID 6の単純な利用可能容量はどれか。","options":["8TB","12TB","16TB","20TB"],"correct":1,"explain":"RAID 6は二重パリティ分の2台相当が必要で(5−2)×4=12TB。管理領域などは無視。"},{"id":"D04-01","chapter":4,"kind":"applied","q":"並列化できる部分が80%、4台並列で追加コストを無視した理論的な速度向上比はどれか。","options":["1.25倍","2.5倍","3.2倍","4倍"],"correct":1,"explain":"Amdahlの法則1/(0.2＋0.8/4)=2.5倍。直列部分が高速化を制限する。"},{"id":"D04-02","chapter":4,"kind":"applied","q":"故障が独立で、装置Aの稼働率0.90、Bの稼働率0.80の並列冗長構成の稼働率はどれか。","options":["0.72","0.80","0.90","0.98"],"correct":3,"explain":"どちらかが稼働すればよいので1−(1−0.9)(1−0.8)=0.98。"},{"id":"D04-03","chapter":4,"kind":"applied","q":"RPOが15分、RTOが2時間のシステムで目標としているものはどれか。","options":["最大2時間前のデータに戻し15分以内に復旧","最大15分前のデータに戻し2時間以内に復旧","必ずデータ損失ゼロで2時間以内に復旧","停止が2時間以内ならデータ損失は任意"],"correct":1,"explain":"RPOは目標復旧時点（許容するデータ損失の時間幅）、RTOは目標復旧時間。"},{"id":"D05-01","chapter":5,"kind":"applied","q":"タスクAがXロックを保持してYを待ち、BがYを保持してXを待つときの問題はどれか。","options":["スラッシング","デッドロック","ページフォールト","キャッシュミス"],"correct":1,"explain":"循環待ちが形成され互いに進めない。ロック獲得順を統一するなどで防止する。"},{"id":"D05-02","chapter":5,"kind":"applied","q":"ページ枠が3つあり、参照列1,2,3,1,4をLRU方式で処理するとき、4の到着時に追い出すページはどれか。","options":["1","2","3","4"],"correct":1,"explain":"1を再参照したため最も長く参照されていないのは2。FIFO方式なら1を追い出す。"},{"id":"D05-03","chapter":5,"kind":"applied","q":"スレッドとプロセスの説明として適切なものはどれか。","options":["異なるプロセスは常に同じ仮想アドレス空間を共有する","同一プロセスのスレッドは通常アドレス空間を共有する","スレッドはCPU資源を消費しない","プロセス間通信は不要である"],"correct":1,"explain":"同一プロセス内のスレッドは通常アドレス空間を共有し、共有変数の競合に注意する。"},{"id":"D06-01","chapter":6,"kind":"applied","q":"8ビットADCで0～5Vを256段階に量子化する理想的な1段階の電圧幅に最も近い値はどれか。","options":["0.002V","0.020V","0.20V","0.50V"],"correct":1,"explain":"5/256≈0.0195V。分解能は量子化段数で決まるが実測精度は雑音等にも左右される。"},{"id":"D06-02","chapter":6,"kind":"applied","q":"周期20msで実行5msのタスクAと周期10msで実行3msのタスクBの合計CPU利用率はどれか。","options":["25%","30%","55%","80%"],"correct":2,"explain":"5/20＋3/10=0.25+0.30=0.55。これだけで期限を守ることを証明できるわけではない。"},{"id":"D06-03","chapter":6,"kind":"applied","q":"ハードリアルタイムシステムの特徴として最も適切なものはどれか。","options":["平均処理時間の短さだけを保証すればよい","一定の期限超過が重大な失敗になり得る","全タスクを必ず同時実行する","CPU周波数が高いことが定義である"],"correct":1,"explain":"重要なのは締切までの確実な応答。平均速度が速いだけでは保証できない。"},{"id":"D07-01","chapter":7,"kind":"applied","q":"フォームの入力誤りを赤色の枠線だけで示したときの改善策として適切なものはどれか。","options":["赤色をさらに濃くする","入力欄をすべて無効化する","エラー文を入力欄と関連付けて表示する","確認をすべて省略する"],"correct":2,"explain":"色だけに依存せず、文章・スクリーンリーダー対応等で伝える。"},{"id":"D07-02","chapter":7,"kind":"applied","q":"使いやすさの評価で操作時間が短くなったが入力誤りが増えた場合、何を検討すべきか。","options":["速度だけで優劣を決める","エラー率や完了率も合わせて評価する","テスト参加者を減らす","利用者の意見は無視する"],"correct":1,"explain":"ユーザビリティは有効さ・効率・満足度など複数尺度で評価する。"},{"id":"D07-03","chapter":7,"kind":"applied","q":"ユーザビリティテストの説明として適切なものはどれか。","options":["利用者による実際の操作を観察する","必ずプログラムのソースコードを読む","利用者の操作を調べない","監査証跡をすべて破棄する"],"correct":0,"explain":"タスク実施時の迷い・誤操作・達成状況を観察して課題を見つける。"},{"id":"D08-01","chapter":8,"kind":"applied","q":"1920×1080画素で24ビットの非圧縮RGB画像の画素データ量に最も近いものはどれか。","options":["約0.6MB","約2.1MB","約6.2MB","約24MB"],"correct":2,"explain":"1920×1080×24/8=6,220,800バイト。ヘッダや行パディングは除く。"},{"id":"D08-02","chapter":8,"kind":"applied","q":"44.1kHz、16ビット、ステレオの非圧縮PCMを60秒記録した容量に最も近いものはどれか。","options":["約1.3MB","約5.3MB","約10.6MB","約21.2MB"],"correct":2,"explain":"44,100×16×2×60/8=10,584,000バイト。圧縮コーデックの容量とは異なる。"},{"id":"D08-03","chapter":8,"kind":"applied","q":"ビットレート2Mbpsの映像を10分送る場合の映像データ量の理論値はどれか（付加情報は無視）。","options":["15MB","75MB","150MB","1200MB"],"correct":2,"explain":"2×10^6bit/秒×600秒÷8=150,000,000バイト=150MB。bitとByteを区別。"},{"id":"D09-01","chapter":9,"kind":"applied","q":"受注が0件の顧客も含む集計で顧客ごとの受注件数を数えるとき、LEFT JOIN後に適切なのはどれか。","options":["COUNT(*)","COUNT(受注.受注ID)","SUM(顧客.ID)","GROUP BYは使えない"],"correct":1,"explain":"LEFT JOINは受注0件でも顧客行が1行残る。COUNT(*)では1と数えるので、NULLになった右側キーをCOUNTする。"},{"id":"D09-02","chapter":9,"kind":"applied","q":"社員
