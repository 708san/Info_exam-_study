correct":2,"explain":"Normingはチームの規範・協力関係が安定する段階。"},{"id":"U-14-Z02","chapter":14,"kind":"applied","q":"3人が2か月離脱、直前0.5か月引継ぎ。新規4人が2.5か月雇用される。単価50万円なら元計画からの費用増は？","options":["100万円","150万円","200万円","500万円"],"correct":2,"explain":"新規4×2.5−旧3×2=4人月、4×50=200万円。"},{"id":"U-14-Z03","chapter":14,"kind":"applied","q":"成功時利益80万円が25%、失敗時損失20万円が75%ならEMVは？","options":["−5万円","5万円","15万円","65万円"],"correct":1,"explain":"0.25×80−0.75×20=5。"},{"id":"U-15-Z01","chapter":15,"kind":"applied","q":"重大な停止事象から原因を論理ゲートで分解して発生確率を評価するのは？","options":["FMEA","FTA","WBS","CFIA"],"correct":1,"explain":"FTAは頂上事象を原因へ分解する。"},{"id":"U-15-Z02","chapter":15,"kind":"applied","q":"液浸冷却の二相方式が利用する主な熱移動は？","options":["電磁誘導だけ","冷媒の蒸発・凝縮","無線通信","抵抗の発熱"],"correct":1,"explain":"相変化の潜熱を使う。"},{"id":"U-16-Z01","chapter":16,"kind":"applied","q":"監査人が改善提案後に行う適切な活動は？","options":["改善プロジェクトを直接指揮","自らすべて設定を変更","改善状況をモニタリング","担当者の代わりに承認"],"correct":2,"explain":"独立した立場で改善状況を確認する。"},{"id":"U-17-Z01","chapter":17,"kind":"applied","q":"業務機能を独立サービスに分け組み合わせる設計思想は？","options":["ERP","SOA","BPM","WBS"],"correct":1,"explain":"SOAはサービスの再利用・連携を重視。"},{"id":"U-17-Z02","chapter":17,"kind":"applied","q":"DX推進の成果として最も直接的な評価は？","options":["端末の台数のみ","クラウド契約数のみ","業務時間短縮や顧客価値向上","使用言語の種類"],"correct":2,"explain":"経営・事業・業務の成果を評価する。"},{"id":"U-17-Z03","chapter":17,"kind":"applied","q":"企業IT全体のガバナンスと管理を支援する枠組みは？","options":["COBIT","TCP","CAD","MRP"],"correct":0,"explain":"COBITは企業ITの統治・管理を支援する。"},{"id":"U-22-Z05","chapter":22,"kind":"applied","q":"D=20000、S=1000、H=100のときEOQは約何個？","options":["63","200","632","2000"],"correct":2,"explain":"√(2×20000×1000/100)=√400000≈632。"},{"id":"U-22-Z06","chapter":22,"kind":"applied","q":"2x+y≤10、x+2y≤8、x,y≥0でx+y最大値は？","options":["4","5","6","8"],"correct":2,"explain":"交点x=4,y=2で6。軸上の最大5、4を上回る。"},{"id":"U-22-Z07","chapter":22,"kind":"applied","q":"価格10000円、変動費6000円、2時間/個。200時間を全部使い固定費10万円なら利益は？","options":["10万円","20万円","30万円","40万円"],"correct":2,"explain":"100個×4000円−10万円=30万円。"},{"id":"U-23-Z04","chapter":23,"kind":"applied","q":"職場のパワーハラスメント防止に必要な雇用管理措置を事業主に義務づける法律は？","options":["意匠法","労働施策総合推進法","電子署名法","電波法"],"correct":1,"explain":"労働施策総合推進法は相談体制等の整備を求める。"},{"id":"U-01-C01","chapter":1,"kind":"applied","q":"系列内の他のトークンを重み付けして表現を作る仕組みは？","options":["自己注意","ハフマン符号","パリティ","差分法"],"correct":0,"explain":"正解は「自己注意」。自己注意（Self-Attention）：各トークンの表現から質問（Q）、鍵（K）、値（V）を作る。質問と鍵の類似度を重みにして値を加重和することで、同じ系列の他の要素を参照する。Transformerはこの仕組みを中心に構成する。例えば「彼は本を買った。それを読んだ」の「それ」が本に関係することを表現に反映できる。"},{"id":"U-01-C02","chapter":1,"kind":"applied","q":"文字ごとにスタート・ストップビットを付ける方式は？","options":["フレーム同期のみ","調歩同期","周波数分割多重","CRC"],"correct":1,"explain":"正解は「調歩同期」。調歩同期：文字ごとに開始ビット・停止ビットを付け、受信側が読み始める位置を判断する。"},{"id":"U-02-C01","chapter":2,"kind":"applied","q":"3と10が同じハッシュ値になるときの現象は？","options":["整列","正規化","衝突","再帰"],"correct":2,"explain":"正解は「衝突」。シノニム：異なるキーが同じハッシュ値（格納候補）になることがある。これを衝突といい、同じハッシュ値になるキーをシノニムと呼ぶ。"},{"id":"U-03-C01","chapter":3,"kind":"applied","q":"乗算結果を累積する演算を効率化する装置は？","options":["割込み制御器","キーボード","ルータ","積和演算器"],"correct":3,"explain":"正解は「積和演算器」。積和演算器：a×b+cのように乗算と加算を組み合わせる演算を効率化する。DSP（デジタル信号処理プロセッサ）やAI向け演算器で多用する。"},{"id":"U-05-C01","chapter":5,"kind":"applied","q":"利用者ごとのディスク使用量を制限する仕組みは？","options":["ディスククオータ","セマフォ","ページフォールト","BIOS"],"correct":0,"explain":"正解は「ディスククオータ」。ディスククオータ：ユーザーやグループごとにディスク使用量を制限する。ある利用者が全容量を消費するのを防ぎ、共有資源を管理する。"},{"id":"U-07-C01","chapter":7,"kind":"applied","q":"視線で項目を選ぶ操作は？","options":["文字コード","非言語インタフェース","正規化","ルーティング"],"correct":1,"explain":"正解は「非言語インタフェース」。地図上の施設を押して動画や説明へ移る教材はハイパーメディアの例。"},{"id":"U-09-C01","chapter":9,"kind":"applied","q":"単語をキーに出現文書を引ける索引は？","options":["BOM","WAL","転置インデックス","外部キー"],"correct":2,"explain":"正解は「転置インデックス」。転置インデックス：文書ごとの単語一覧を逆にして、単語から出現文書IDや位置を検索できる索引。例えばA文書に犬と猫、B文書に猫と鳥があれば猫→A,B。"},{"id":"U-10-C01","chapter":10,"kind":"applied","q":"複数利用者にネットワーク上のファイル共有・認証を提供するのは？","options":["画像圧縮","CRC","表計算","ネットワークOS"],"correct":3,"explain":"正解は「ネットワークOS」。ネットワークOS：ネットワーク経由のファイル・プリンタ共有、ユーザー認証、アクセス制御などを提供するOSまたはOS機能。クライアント側の通信設定だけではない。"},{"id":"U-11-C01","chapter":11,"kind":"applied","q":"サイバー保険により事故時の資金負担に備える活動は？","options":["リスクファイナンシング","ハッシュ化","負荷分散","リファクタリング"],"correct":0,"explain":"正解は「リスクファイナンシング」。リスクファイナンシング：事故後の損失に備え保険や資金を用意する方法。リスクコントロールは事故の発生・損失を抑える。need-to-know（知る必要性）の原則で業務上必要な情報のみへのアクセスを認める。"},{"id":"U-12-C01","chapter":12,"kind":"applied","q":"下流障害時に呼出しを一時停止して連鎖障害を防ぐ設計は？","options":["連鎖法","サーキットブレーカー","全数調査","正規化"],"correct":1,"explain":"正解は「サーキットブレーカー」。サーキットブレーカー：下流サービスへの失敗が続くと呼出しを一時停止し、代替応答などを行う。復旧を試験する半開状態を設けることがある。役割及び特権は責務とアクセス権を対応付けて最小権限にする。"},{"id":"U-13-C01","chapter":13,"kind":"applied","q":"残作業量を日ごとに可視化するものは？","options":["クラス図","リスクマトリックス","バーンダウンチャート","損益計算書"],"correct":2,"explain":"正解は「バーンダウンチャート」。見積りと進捗：プランニングポーカーは各人が見積りを同時提示し差を議論する。ベロシティは反復期間内に完了した見積り量の実績。バーンダウンチャートは残作業量の推移を示す。タイムボックスは活動時間の上限を固定する。"},{"id":"U-13-C02","chapter":13,"kind":"applied","q":"単一製品のスクラムを複数チームに拡張する枠組みは？","options":["FMEA","BPR","ISO 9001","LeSS"],"correct":3,"explain":"正解は「LeSS」。SAFe・LeSS：SAFe（Scaled Agile Framework：大規模アジャイルの枠組み）は複数チームやポートフォリオの計画・連携を体系化する。LeSS（Large-Scale Scrum：大規模スクラム）は単一製品に対してスクラムを複数チームへ拡張する。"},{"id":"U-13-C03","chapter":13,"kind":"applied","q":"機械学習モデルの配備後の劣化監視と再学習を含む仕組みは？","options":["MLOps","EVM","RAID","EOQ"],"correct":0,"explain":"正解は「MLOps」。MLOps：機械学習のデータ、モデル、コード、実験、配備、監視、再学習を管理する。データ分布の変化（データドリフト）、性能低下を検知し、承認済みモデルへ切戻せるようにする。"},{"id":"U-13-C04","chapter":13,"kind":"applied","q":"変更20件中2件が障害を引き起こした場合の変更障害率は？","options":["2%","10%","20%","90%"],"correct":1,"explain":"正解は「10%」。Four Keys：シラバスではデプロイの頻度、変更のリードタイム、変更障害率、平均修復時間（MTTR）を扱う。変更20件中2件が障害なら10%。公開件数だけで速度と安定性の双方を評価しない。"},{"id":"U-13-C05","chapter":13,"kind":"applied","q":"関数AがBとCを呼ぶ関係を可視化する図は？","options":["パレート図","散布図","コールグラフ","貸借対照表"],"correct":2,"explain":"正解は「コールグラフ」。部品とリバースエンジニアリング：パラメトリック部品は設定値で振舞いを変えられる。リバースエンジニアリングは既存実装を解析して仕様等を明らかにする。コールグラフは関数等の呼出し関係を示す。契約や知財に注意する。"},{"id":"U-14-C01","chapter":14,"kind":"applied","q":"プロジェクト規模に合わせ管理方法を調整することは？","options":["スワッピング","量子化","デッドロック","テーラリング"],"correct":3,"explain":"正解は「テーラリング」。PMO・テーラリング：PMOは管理方法、教育、情報集約、調整を支援する。テーラリングは規模・リスク・契約に応じて方法を適合させる。"},{"id":"U-15-C01","chapter":15,"kind":"applied","q":"低リスクで手順と承認があらかじめ定められた変更は？","options":["標準変更","緊急変更","問題管理","監査調書"],"correct":0,"explain":"正解は「標準変更」。標準変更・緊急変更・PIR：標準変更は低リスクで事前承認された定型変更、通常変更は個別評価、緊急変更は迅速な承認が必要な変更。PIR（Post Implementation Review：実施後レビュー）は結果や予期せぬ影響を評価する。緊急でも記録と事後評価は必要。"},{"id":"U-16-C01","chapter":16,"kind":"applied","q":"監査手続・証拠・結論を記録する文書は？","options":["RFP","監査調書","株主名簿","WBS"],"correct":1,"explain":"正解は「監査調書」。監査調書：監査手続、証拠、判断、結論を記録し、監査結果の根拠とする。証拠は十分性・適切性を評価し、改善実施は被監査部門が担う。"},{"id":"U-17-C01","chapter":17,"kind":"applied","q":"個別開発より先に全社的なシステム化の方向を定めるものは？","options":["単体試験仕様書","障害ログ","情報システム化基本計画","ソースコード"],"correct":2,"explain":"正解は「情報システム化基本計画」。情報システム化基本計画：経営戦略からシステム化の方向、対象範囲、優先度、アーキテクチャ、投資計画、推進体制を定める。個別プロジェクトの設計仕様書とは粒度が異なる。"},{"id":"U-18-C01","chapter":18,"kind":"applied","q":"標準パッケージの業務に自社業務を合わせる考え方は？","options":["フォールトトレランス","ハッシュ法","ブルウィップ効果","Fit to Standard"],"correct":3,"explain":"正解は「Fit to Standard」。Fit to Standard・OOTB：Fit to Standardはパッケージ標準業務に業務プロセスを適合させ、独自改修を減らす考え方。OOTB（Out Of The Box）は製品が初めから持つ機能。法令・競争優位上の必要な差異は個別に評価する。"},{"id":"U-19-C01","chapter":19,"kind":"applied","q":"知財と市場情報を分析し経営戦略に生かす手法は？","options":["IPランドスケープ","CRC","FIFO","SJF"],"correct":0,"explain":"正解は「IPランドスケープ」。コ・クリエーション・IPランドスケープ：コ・クリエーション（共創）は顧客・取引先等と価値を作る。IPランドスケープは知財情報と市場・経営情報を分析して事業・研究開発戦略に生かす。"},{"id":"U-19-C02","chapter":19,"kind":"applied","q":"複数グループ企業の共通業務を集約する仕組みは？","options":["市場浸透","シェアードサービス","公開鍵基盤","標本化"],"correct":1,"explain":"正解は「シェアードサービス」。M&A・TOB・協業：M&A（合併・買収）、TOB（Take Over Bid：公開買付け）、アライアンス（提携）は外部資源活用の手段。シェアードサービスはグループ共通業務を集約する。インキュベーターは起業支援、クラウドファンディングは多数の人から資金を募る。"},{"id":"U-19-C03","chapter":19,"kind":"applied","q":"機能と価格の組合せに対する選好から各属性の寄与を推定する手法は？","options":["FTA","EVM","コンジョイント分析","CRC"],"correct":2,"explain":"正解は「コンジョイント分析」。調査・分析：コンジョイント分析は複数属性の組合せの選好から属性の寄与を推定する。価格感度測定法は価格に対する許容範囲を調査する。エスノグラフィー調査は生活・行動を観察し文脈を理解する。クロス集計はカテゴリ間の関係を表で見る。"},{"id":"U-19-C04","chapter":19,"kind":"applied","q":"企業内システムへの共通入口を提供するものは？","options":["EOQ","TCP","FDD","EIP"],"correct":3,"explain":"正解は「EIP」。EIP：Enterprise Information Portal（企業内情報ポータル）は分散した業務情報やアプリへの共通入口を提供する。権限に応じて表示し検索を支援する。"},{"id":"U-20-C01","chapter":20,"kind":"applied","q":"市場・機能・技術を関連付ける枠組みは？","options":["MFT","SLA","SJF","MAC"],"correct":0,"explain":"正解は「MFT」。MFTフレームワーク：Market（市場）、Function（機能）、Technology（技術）の関係を整理し、顧客課題から必要機能と技術を結び付ける。市場創生、市場価値、R&D（研究開発）を経営戦略と連携する。"},{"id":"U-20-C02","chapter":20,"kind":"applied","q":"技術の動作ではなく事業成立性を検証するのは？","options":["PoC","PoB","CRC","WBS"],"correct":1,"explain":"正解は「PoB」。検証と品質：PoC（概念実証）は実現可能性、PoV（価値実証）は顧客価値、PoB（事業実証）は事業としての成立性を調べる。QCDE（品質・価格・納期・環境）は評価観点。バックキャスティングは望ましい将来から必要施策を逆算する。"},{"id":"U-20-C03","chapter":20,"kind":"applied","q":"当事者が互いの特許利用を許諾する契約は？","options":["SLA","NDAのみ","クロスライセンス","EOQ"],"correct":2,"explain":"正解は「クロスライセンス」。特許の活用：パテントプールは複数の特許をまとめてライセンスする仕組み。クロスライセンスは当事者間で相互に利用許諾する。防衛特許は競合からの権利主張への交渉力や事業自由度確保などの目的を持つ。早期審査制度は一定要件で審査を早める。"},{"id":"U-21-C01","chapter":21,"kind":"applied","q":"財務報告の機械可読なデータ形式は？","options":["CAN","PWM","JPEG","XBRL"],"correct":3,"explain":"正解は「XBRL」。会計・人事・業務支援：XBRL（eXtensible Business Reporting Language：拡張可能な事業報告言語）は財務報告等のデータを機械可読にする。人事給与は雇用・給与、グループウェアは情報共有、ワークフローシステムは申請・承認を管理する。"},{"id":"U-21-C02","chapter":21,"kind":"applied","q":"地方公共団体を結ぶ行政ネットワークは？","options":["LGWAN","EDINET","GEPS","VICS"],"correct":0,"explain":"正解は「LGWAN」。行政ネットワーク・開示：LGWAN（Local Government Wide Area Network：総合行政ネットワーク）は地方公共団体の行政ネットワーク。EDINET（Electronic Disclosure for Investors' NETwork：電子開示システム）は有価証券報告書等の電子提出・閲覧。出入国管理、登記情報、社会保険オンラインシステムはそれぞれ行政目的が異なる。"},{"id":"U-21-C03","chapter":21,"kind":"applied","q":"道路の渋滞・規制情報を車載機器等へ提供するシステムは？","options":["GEPS","VICS","XBRL","EOS"],"correct":1,"explain":"正解は「VICS」。交通：ITS（Intelligent Transport Systems：高度道路交通システム）は情報通信で交通の安全・効率を高める総称。VICS（道路交通情報通信システム）は渋滞・規制などの道路交通情報を提供、ETC（自動料金支払システム）は通行料金を無線で処理する。GPS（全地球測位システム）は位置取得を支援する。"},{"id":"U-21-C04","chapter":21,"kind":"applied","q":"製品モデルデータを交換する標準は？","options":["DKIM","ETC","STEP","SLA"],"correct":2,"explain":"正解は「STEP」。EDI・データ交換標準：EDI（電子データ交換）は取引データを標準形式で交換する。STEPは製品モデルデータ交換、流通BMSは流通ビジネスメッセージ標準、XML-EDIはXMLを利用する。UN/CEFACTは貿易円滑化・電子ビジネス標準を扱う。CMSはコンテンツ管理、CGMは消費者生成メディア。"},{"id":"U-21-C05","chapter":21,"kind":"applied","q":"対応機器間でアクセスポイントを介さず接続する技術は？","options":["EDINET","BEMS","XBRL","Wi-Fi Direct"],"correct":3,"explain":"正解は「Wi-Fi Direct」。無線接続：WPS（Wi-Fi Protected Setup：無線LAN接続設定支援）は対応機器の接続設定を簡便にする仕組み。安全性を評価し必要な方式を選ぶ。Wi-Fi Directはアクセスポイントなしで対応機器間の直接通信を可能にする。Wi-Fi中継器は電波到達範囲を広げる。"},{"id":"U-21-C06","chapter":21,"kind":"applied","q":"分散電源や蓄電池を統合制御する仕組みは？","options":["VPP","MaaS","EDINET","RFM"],"correct":0,"explain":"正解は「VPP」。エネルギー・移動：MaaS（Mobility as a Service：移動サービスの統合）は複数交通手段の検索・予約・決済などを一体化する。VPP（Virtual Power Plant：仮想発電所）は分散電源・蓄電池等を統合制御して一つの発電所のように活用する。スマート農業はセンサ・ロボット等で生産を支援する。"},{"id":"U-22-C01","chapter":22,"kind":"applied","q":"企業の財務と非財務情報を関連付け価値創造を説明する報告は？","options":["監査調書","統合報告書","CRC","部品表"],"correct":1,"explain":"正解は「統合報告書」。統治と開示：コーポレートガバナンスは経営の監督・規律づけ。IR（投資家向け情報提供）、統合報告書は財務・非財務情報を結び付け長期価値創造を説明する。コーポレートアイデンティティは企業の理念・行動・表現による一貫した企業像。"},{"id":"U-22-C02","chapter":22,"kind":"applied","q":"限定合理性・満足化を論じた人物は？","options":["テイラー","マズロ","サイモン","ポーター"],"correct":2,"explain":"正解は「サイモン」。管理理論：科学的管理法（テイラー）は作業を測定・標準化する。経営過程論は計画・組織化・指揮・統制等を捉える。バーナードは組織を協働システムとして捉え、サイモンは限定合理性と満足化による意思決定を論じた。一般システム理論は要素と相互関係から全体を捉える。"},{"id":"U-22-C03","chapter":22,"kind":"applied","q":"組織内に専門知識を集め横断支援する拠点は？","options":["CRC","VICS","FIFO","CoE"],"correct":3,"explain":"正解は「CoE」。勤務・組織：裁量労働制は法定要件を満たす業務でみなし労働時間等を扱う制度。フラット型、ラインアンドスタッフ、カンパニー制、プロジェクト組織、DAO（分散型自律組織）など、意思決定と責任の所在が異なる。CEOは最高経営責任者、CFOは最高財務責任者、COOは最高執行責任者、CPOは最高プライバシー責任者、CoEは専門知識を集約する組織。"},{"id":"U-23-C01","chapter":23,"kind":"applied","q":"官民データ活用と情報利用機会の格差是正を推進する基本法は？","options":["官民データ活用推進基本法","著作権法","労働組合法","特許法"],"correct":0,"explain":"正解は「官民データ活用推進基本法」。官民データ活用推進基本法：官民データの活用を総合的に推進するための基本法。行政手続のオンライン利用の原則化、データ活用促進、利用機会の格差是正等に関係する。個人情報を無条件に公開する制度ではない。"},{"id":"U-23-C02","chapter":23,"kind":"applied","q":"個人化によって異なる意見に触れにくくなる現象は？","options":["CRC","フィルターバブル","ページング","回帰分析"],"correct":1,"explain":"正解は「フィルターバブル」。情報環境：エコーチェンバーは同じ意見が反復・増幅される環境、フィルターバブルは個人化された情報選択で異なる情報に接しにくくなる状態。デジタルタトゥーは公開情報が長期間残り得ること。フィルタリング・ペアレンタルコントロールは有害情報へのアクセス制限に使う。"},{"id":"U-23-C03","chapter":23,"kind":"applied","q":"適格請求書等保存方式は主にどの税の仕入税額控除に関係する？","options":["所得税","固定資産税","消費税","相続税"],"correct":2,"explain":"正解は「消費税」。税・電子保存：法人税法は法人所得等への課税、消費税法は消費税。インボイス制度（適格請求書等保存方式）は仕入税額控除に関する請求書等の保存要件を定める。e-文書法は法令による保存義務のある文書の電子保存を可能とする枠組み。電子帳簿保存法は国税関係帳簿書類・電子取引データの保存等。具体的要件は税務当局で確認する。"},{"id":"U-23-C04","chapter":23,"kind":"applied","q":"欠陥のある製造物による損害について製造業者等の責任を定める法は？","options":["電波法","独占禁止法","特定電子メール法","PL法"],"correct":3,"explain":"正解は「PL法」。PL法（製造物責任法）：製造物の欠陥によって生命・身体・他の財産等に損害が生じた場合、製造業者等の責任を定める。ソフトウェア単体と、欠陥あるソフトを組み込んだ製造物は区別する。契約責任や他法令も関係する。"},{"id":"U-23-C05","chapter":23,"kind":"applied","q":"電気電子機器の特定有害物質を制限するEUの指令は？","options":["RoHS指令","SLA","CVE","WBS"],"correct":0,"explain":"正解は「RoHS指令」。国際適合：CEマークは対象製品が適用されるEU法令の要求に適合することを表示する仕組み。RoHS指令は電気電子機器に含まれる特定有害物質を制限する。適用範囲や例外は製品ごとに確認する。"},{"id":"U-23-C06","chapter":23,"kind":"applied","q":"環境マネジメントシステムの要求事項の規格は？","options":["ISO 9001","ISO 14001","ISO/IEC 15408","ISO/IEC 20000-1"],"correct":1,"explain":"正解は「ISO 14001」。開発・環境・評価規格：JIS X 0160はソフトウェアライフサイクルプロセス、JIS X 0170はシステムライフサイクルプロセスの規格。ISO 14000は環境管理規格群、JIS Q 14001（ISO 14001）は環境マネジメント要求事項。ISO/IEC 15408はIT製品等のセキュリティ評価基準。CORBAは分散オブジェクトの相互運用、EJBはJavaの企業向けコンポーネント技術。"}],"cases":[{"id":"B01","title":"外部ライブラリの改ざんと初動対応","domain":"情報セキュリティ","required":true,"passage":"医療機関向け予約システムA社は外部ライブラリLを利用している。開発端末で依存ライブラリを更新した翌日、外部の未知のドメインへの通信が急増した。更新に使ったパッケージ配布元では管理者アカウントの侵害が報告された。端末には接続先情報を含む認証トークンが保管されている。A社は本番環境への配布を一時停止したが、影響範囲と情報漏えいの有無は未確定である。","items":[{"q":"本事象で想定される攻撃の種類を答えよ。","answer":"ソフトウェアサプライチェーン攻撃","reason":"侵害された配布元を通じて正規の更新に悪意あるコードを混入できる。","keywords":["サプライチェーン攻撃"]},{"q":"初動で本番配布停止以外に実施すべきことを2つ挙げよ。","answer":"該当端末を適切に隔離し、通信ログ・更新履歴・端末状態などの証拠を保全する。","reason":"原因未確定の段階で証拠の消失を防ぎながら被害拡大を抑える。","keywords":["隔離","証拠保全"]},{"q":"漏えいの可能性がある認証トークンに対して何をするか。","answer":"影響するトークンを無効化・再発行し、権限と利用履歴を確認する。","reason":"侵害された認証情報の悪用継続を防ぐ。","keywords":["無効化","再発行"]}],"tips":"初動では「封じ込め」と「証拠保全」を両立させる。断定できない漏えいを発生済みと書かない。"},{"id":"B02","title":"経営戦略：EC導入と効果測定","domain":"情報戦略","required":false,"passage":"食品卸B社は電話注文をWeb注文へ移行したい。現在は月1万件の受注があり、1件の入力作業に平均6分かかる。新システムでは2分となる見込み。人件費は1時間当たり2,400円、年間維持費は600万円、初期費用は1,000万円とする。その他の費用と需要変動は無視する。顧客の利用率は導入前に確定しておらず、注文データの形式も顧客ごとに異なる。","items":[{"q":"月間で削減できる作業時間は何時間か。","answer":"約667時間","reason":"1万件×(6−2)分÷60=666.7時間。","keywords":["667","時間"]},{"q":"年間の人件費削減額と年間純効果を計算せよ。","answer":"削減額1,920万円、維持費を差し引く年間純効果1,320万円。","reason":"年間1万件×12×4/60×2,400=19,200,000円。","keywords":["1920","1320"]},{"q":"上記の試算に対する実務上の留意点を一つ挙げよ。","answer":"Web注文の利用率が100%とは限らないため、移行率を測定して削減効果を再試算する。","reason":"前提が実際と異なると投資効果は過大評価される。","keywords":["利用率","移行率"]}],"tips":"計算条件と未確認前提を分離し、問われた範囲だけを数値で回答。"},{"id":"B03","title":"性能設計：Web/API基盤のボトルネック","domain":"システムアーキテクチャ","required":false,"passage":"WebシステムCの処理は、Web層・業務API層・DB層を順に通る。1秒当たりの最大処理件数はWeb層100、API層80、DB層50である。1件の要求は各層を1回ずつ使用する。今後の利用者増加に備え、最初に1つの層だけを増強する方針である。可用性の要件は99.9%、既存実測値は99.7%とする。","items":[{"q":"現状の理論的な最大スループットを答えよ。","answer":"毎秒50件","reason":"直列の処理では最小能力の層が全体の上限。","keywords":["50"]},{"q":"最初に増強すべき層とその理由を答えよ。","answer":"DB層。1秒当たり50件で最も処理能力が低いため。","reason":"ボトルネックから改善すると全体上限を押し上げやすい。","keywords":["DB","ボトルネック"]},{"q":"稼働率99.7%から99.9%に引き上げるため、原因調査と並行して検討する手段を一つ述べよ。","answer":"単一障害点を特定して冗長化や自動フェイルオーバーを検討する。","reason":"可用性の改善には障害発生率低減または修復時間短縮が有効。","keywords":["冗長化","フェイルオーバー"]}],"tips":"性能と可用性は別要件。処理能力の改善だけでは稼働率要件を満たせない。"},{"id":"B04","title":"ネットワーク：名前解決不具合の切り分け","domain":"ネットワーク","required":false,"passage":"企業Dの社内端末から業務サーバー192.0.2.20へIPアドレス指定でHTTPS接続は成功する。一方、https://sales.example.test では名前解決エラーとなる。端末のDNSサーバーは192.0.2.53に設定されている。管理者がDNSサーバーを確認すると、sales.example.test のAレコードは誤って192.0.2.25を指していた。別の端末では正しいアドレスが表示されるため、キャッシュの影響も疑われる。","items":[{"q":"IPアドレス指定で接続できる事実から、優先的に疑う機能は何か。","answer":"DNSによる名前解決","reason":"IP接続が成功しており、名前を解決する過程でエラーが発生する。","keywords":["DNS","名前解決"]},{"q":"管理者が最初に修正する設定は何か。","answer":"sales.example.testのAレコードを192.0.2.20に修正する。","reason":"AレコードはIPv4アドレスを指定する。","keywords":["Aレコード","192.0.2.20"]},{"q":"修正直後も端末によって結果が異なる原因を挙げよ。","answer":"DNSキャッシュのTTLが残って古い解決結果を使うため。","reason":"DNS情報はTTLにより一定期間キャッシュされる。","keywords":["キャッシュ","TTL"]}],"tips":"疎通／DNS／TLS／アプリのどの層の異常か、与えられた証拠から絞る。"},{"id":"B05","title":"データベース：在庫更新の競合","domain":"データベース","required":false,"passage":"オンライン販売E社の在庫表は 商品ID と 在庫数 を保持する。商品Xの在庫は1個である。購入処理は「在庫数をSELECTで読む→1以上なら注文確定→在庫数を1減らす」の順に実行している。ほぼ同時に2つの購入処理が在庫数1を読み、両方が注文確定した。E社はトランザクション処理で再発を防ぎたい。","items":[{"q":"発生したデータ不整合の原因を説明せよ。","answer":"在庫の確認と更新が排他制御されず、複数処理が同じ在庫1を読んで注文確定したため。","reason":"読取りと更新を一体で制御していない。","keywords":["排他制御","同時"]},{"q":"防止するSQLの設計方針を一つ述べよ。","answer":"在庫数が1以上の行だけを原子的にUPDATEで減算し、更新件数が1のときだけ注文を確定する。","reason":"条件付き更新と影響行数の確認で同時購入競合を防げる。","keywords":["UPDATE","更新件数"]},{"q":"トランザクションに求められるACIDのうち、途中で失敗した更新を全体的に取り消す性質は。","answer":"原子性（Atomicity）","reason":"全部実行か全部取消しかを保証する。","keywords":["原子性"]}],"tips":"ロックを使う案も有効だが、読み取り・更新・確定をどの範囲でまとめるかまで書く。"},{"id":"B06","title":"組込み：周期タスクの実行可能性","domain":"組込みシステム開発","required":false,"passage":"制御装置Fは単一CPUで三つの周期タスクを動かす。タスクAは実行時間2ms・周期10ms、Bは実行時間3ms・周期20ms、Cは実行時間5ms・周期50ms。処理切替のオーバーヘッドは無視できるとする。各タスクは期限内完了が必要だが、現時点では優先度割当てや最悪実行時間の変動を十分評価していない。","items":[{"q":"タスクAのCPU利用率を求めよ。","answer":"20%","reason":"2/10=0.2。","keywords":["20"]},{"q":"全タスクのCPU利用率の合計を求めよ。","answer":"45%","reason":"2/10+3/20+5/50=0.20+0.15+0.10=0.45。","keywords":["45"]},{"q":"利用率が100%未満であることだけで締切を保証できるか。理由とともに答えよ。","answer":"保証できない。優先度・割込み・切替・実行時間の最悪値・スケジューリング方式が影響するため。","reason":"総利用率だけでは各タスクの応答時間が保証されない。","keywords":["保証できない","優先度"]}],"tips":"数値を計算した後、期限保証は別の検証が要ることを忘れない。"},{"id":"B07","title":"開発：受入れ試験と境界値","domain":"情報システム開発","required":false,"passage":"新規会員登録Gでは年齢を18〜65歳（両端含む）に制限する。テスト担当は25,35,45歳のみを試したが、開発後に17歳の登録が成功する欠陥が見つかった。さらに要件定義書には「ピーク時1000人が同時利用しても95パーセンタイル応答時間を2秒以内」と記載されている。","items":[{"q":"年齢入力について境界値を4つ挙げよ。","answer":"17、18、65、66","reason":"上限・下限の直前と境界そのものが重要。","keywords":["17","18","65","66"]},{"q":"上記の年齢バグを発見するのに適したテスト設計技法は何か。","answer":"境界値分析","reason":"有効範囲の境界前後に欠陥が集まりやすい。","keywords":["境界値分析"]},{"q":"応答時間に関する要件は機能要件と非機能要件のどちらか。","answer":"非機能要件","reason":"性能効率性に関する品質要件。","keywords":["非機能要件"]}],"tips":"テスト値の選び方を説明できると、単なる暗記より得点が安定する。"},{"id":"B08","title":"プログラミング：二分探索の追跡","domain":"プログラミング","required":false,"passage":"昇順配列A=[2,5,9,12,18,23,27,31,40]の添字は0〜8。値23を探すため、low=0、high=8から開始する。繰返しでmid=(low+high)//2（切捨て除算）とし、A[mid]が目標より小さければlow=mid+1、大きければhigh=mid−1、等しければ終了する。","items":[{"q":"最初のmidとA[mid]を答えよ。","answer":"mid=4、A[mid]=18","reason":"(0+8)//2=4。","keywords":["4","18"]},{"q":"1回目の比較後のlowとhighを答えよ。","answer":"low=5、high=8","reason":"18は23より小さいので左側を捨てる。","keywords":["5","8"]},{"q":"何回目の比較で23が見つかるか。","answer":"3回目","reason":"1回目mid4=18、2回目mid6=27、3回目mid5=23。","keywords":["3"]}],"tips":"トレース表にlow / high / mid / A[mid]を毎回書く。配列添字の基点を間違えない。"},{"id":"B09","title":"プロジェクト：EVMによる遅延判断","domain":"プロジェクトマネジメント","required":false,"passage":"案件Hの月末時点の計画価値PVは600万円、出来高EVは480万円、実コストACは540万円である。全体予算BACは1,200万円。品質に関する未完了作業は現時点のEVには算入していない。プロジェクトマネージャは進捗遅延とコスト超過を数値で説明する必要がある。","items":[{"q":"コスト差異CVを求め、その意味を答えよ。","answer":"CV=−60万円。出来高より実コストが60万円大きくコスト超過。","reason":"CV=EV−AC=480−540。","keywords":["−60","超過"]},{"q":"スケジュール差異SVとSPIを求めよ。","answer":"SV=−120万円、SPI=0.8。計画より進捗が遅れている。","reason":"SV=480−600、SPI=480/600。","keywords":["−120","0.8"]},{"q":"担当者の努力不足だけを原因として即断できるか。理由を述べよ。","answer":"できない。要件変更、作業見積り、待ち時間、未完了の検収条件など要因を調査する必要がある。","reason":"EVMは状態指標であって原因の特定まではしない。","keywords":["できない","原因"]}],"tips":"計算→進捗・費用の解釈→原因を断定しない、の順で書く。"},{"id":"B10","title":"サービス管理：復旧目標と再発防止","domain":"サービスマネジメント","required":false,"passage":"小売I社の基幹システムはバックアップを毎日深夜0時に取得する。木曜14時にDB破損が発生し、当日0時のバックアップから18時に復旧した。重要業務のRTOは3時間、RPOは2時間である。復旧後は同様の事象の原因究明が求められている。","items":[{"q":"実際の復旧時間とRTO達成状況を答えよ。","answer":"復旧時間4時間。RTO3時間を1時間超過して未達。","reason":"14時から18時まで4時間。","keywords":["4","未達"]},{"q":"実際のデータ損失時間とRPO達成状況を答えよ。","answer":"データ損失14時間。RPO2時間を超過して未達。","reason":"0時から14時までの更新が失われた。","keywords":["14","未達"]},{"q":"再発防止に向けてインシデント管理とは別に重視する活動は。","answer":"問題管理。根本原因を調査して恒久対策を立案する。","reason":"暫定的な復旧と原因除去は別。","keywords":["問題管理","根本原因"]}],"tips":"時間は同じ日の時計で計算し、復旧（RTO）とデータ喪失（RPO）を分ける。"},{"id":"B11","title":"システム監査：承認権限の不備","domain":"システム監査","required":false,"passage":"企業Jの購買システムでは、同一担当者が仕入先を登録し、支払先口座を変更し、支払承認まで実施できる。監査人は複数の口座変更履歴に承認記録がないことを確認した。管理者は「これまで不正が報告されていないので問題ない」と説明したが、監査人は内部統制上のリスクを評価する。","items":[{"q":"最も重要な統制上の不備を答えよ。","answer":"仕入先登録・口座変更・支払承認の職務が分離されていない。","reason":"一人で不正な支払先に変更・承認できてしまう。","keywords":["職務分掌","分離"]},{"q":"監査人が追加収集すべき客観的な証拠を一つ挙げよ。","answer":"権限設定一覧・変更ログ・承認履歴と実際の取引記録など。","reason":"説明だけでなく実際の運用証拠を確認する。","keywords":["ログ","権限"]},{"q":"監査報告で提示すべき改善案を一つ述べよ。","answer":"口座変更者と承認者を分離し、変更時の二重承認・定期的権限棚卸しを導入する。","reason":"不正の機会を抑える統制を設計・運用する。","keywords":["分離","承認"]}],"tips":"観察した事実・潜在的リスク・改善案を分けて書く。"},{"id":"BX01","title":"外部委託先経由の侵入とログの検証","domain":"情報セキュリティ","required":true,"passage":"製造業A社は業務システムを本社データセンターで運用する。委託先B社の保守担当者はVPNでA社ネットワークに接続し、踏み台サーバを経由して保守対象へアクセスする。B社の保守担当者のアカウントは長期固定パスワードで、MFAは導入していない。管理者権限は保守の利便性から本番DBサーバを含む複数台へ広く付与されていた。\n月曜9:10、海外IPからB社アカウントの認証成功が記録された。9:14、踏み台サーバへの接続が開始され、9:21、本番DBサーバに対する普段ないクエリが実行された。9:25、外部クラウドストレージへ大容量の通信が発生した。一方、A社の業務は継続して稼働し、監視装置は9:40に通信量の異常を検知した。現在、認証情報の漏えい経路、データ持出しの有無・範囲は調査中である。\nA社はVPNアカウントの停止と通信の遮断を決めた。B社の管理者は「パスワードは強力だったから漏えいはない」と述べている。なお、踏み台サーバとDBの操作ログ、VPN認証ログ、外部通信ログには時刻が記録され、全機器は時刻同期されている。","items":[{"q":"攻撃者が本番DBへ到達した可能性を説明する上で、本文から読み取れる経路を順に示せ。","answer":"B社のVPNアカウントで接続し、踏み台サーバ経由で本番DBサーバへアクセスした可能性がある。","reason":"9:10の認証成功、9:14の踏み台、9:21のDB操作の時系列を接続する。実際に同一主体かはログ相関で要検証。","keywords":["VPN","踏み台","DB"]},{"q":"認証情報を不正利用されるリスクを下げる対策と、侵入後の被害拡大を抑える対策を各1つ述べよ。","answer":"委託先VPNアカウントに多要素認証を必須とし、保守先ごとに最小権限へ絞って本番DBへの管理権限を分離する。","reason":"MFAは認証情報だけの盗用対策、最小権限・分離は横展開を抑える対策。","keywords":["多要素認証","最小権限"]},{"q":"データ持出しの有無・範囲を確認するため、どの記録を照合するか。","answer":"DB操作ログで参照された表・行と実行主体を確認し、外部通信ログの宛先・容量・時刻と突き合わせる。","reason":"大容量通信は疑いを示すが、データ漏えいの確定には操作内容と通信内容の証拠が必要。","keywords":["DB操作ログ","外部通信ログ"]},{"q":"時刻同期が調査に役立つ理由を述べよ。","answer":"複数機器の認証・接続・DB操作・外部通信イベントを正しい順序で相関できるため。","reason":"時刻がずれていると因果関係とアクセス経路の推定を誤る。","keywords":["時系列","相関"]},{"q":"「パスワードが強力なので漏えいはない」と断定できない理由を述べよ。","answer":"強度が高くてもフィッシングや端末侵害などで認証情報が窃取され得るうえ、本文では漏えい経路が未確定だから。","reason":"認証成功は不正利用の可能性を示すが、手口確定の証拠ではない。","keywords":["窃取","未確定"]}],"tips":"解答には本文の時刻・装置名・権限情報を使う。「可能性」と「確認済み」を分けて記述する。"},{"id":"BX02","title":"注文集計の二重計上とSQLの改善","domain":"データベース","required":false,"passage":"ECサービスC社には顧客表(customer_id, name)、注文表(order_id, customer_id, ordered_at)、明細表(order_id, product_id, qty, unit_price)、商品表(product_id, product_name)がある。顧客表の主キーはcustomer_id、注文表はorder_id、明細表は(order_id, product_id)を主キーとしており、order_idは注文表への外部キーである。注文がない顧客も報告書に表示したい。\n担当者は「顧客ごとの注文件数」を出すため、顧客→注文→明細をLEFT JOINし、COUNT(*)で件数を集計した。明細が3行ある注文は3件と表示され、注文がない顧客も1件と表示された。修正案としてCOUNT(DISTINCT 注文.order_id)を使用する案が出ている。\nまた商品表にはunit_price列もあるが、注文時の価格は明細表に保管する。商品表の価格が改定された後でも過去の注文金額が変わらないようにする目的である。深夜帯に注文一覧画面が遅くなることがあり、注文表のデータは数千万行、ordered_atへの絞込みが頻繁に使われる。\n注文確定処理は「注文ヘッダ登録」「明細登録」「在庫減算」を1件の処理として実行する。途中で在庫減算が失敗した場合、ヘッダと明細の登録だけが残ってはならない。","items":[{"q":"COUNT(*)で注文件数を求めると誤った理由を2つ述べよ。","answer":"明細と結合して注文が明細行数だけ重複し、注文なし顧客も外部結合で1行残るため。","reason":"集計対象の行が「注文」ではなく「結合後の行」になっている。","keywords":["重複","外部結合"]},{"q":"注文がない顧客も0件と表示するため、件数の集計式として適切なものを示せ。","answer":"COUNT(DISTINCT 注文.order_id)を用いる。","reason":"NULLを数えず、明細による注文IDの重複を除外できる。","keywords":["COUNT","DISTINCT"]},{"q":"商品表の現在価格で過去の注文金額を集計することが不適切な理由を述べよ。","answer":"商品の価格改定によって過去の取引金額が変わってしまうため、注文時に確定した明細単価と数量を使う。","reason":"販売時点の履歴属性とマスタの現在値を分ける。","keywords":["注文時単価","履歴"]},{"q":"注文確定処理に必要なトランザクション性と失敗時動作を述べよ。","answer":"ヘッダ・明細登録と在庫減算を同一トランザクションとし、途中失敗なら全変更をロールバックする。","reason":"ACIDの原子性を守り、片方だけの更新を防ぐ。","keywords":["原子性","ロールバック"]},{"q":"注文日時による一覧抽出の遅延に対し検討する索引と検証手順を述べよ。","answer":"ordered_atの索引や必要な複合索引を検討し、実行計画と代表的な条件で処理時間を比較する。","reason":"索引は更新コストもあるため無条件に追加せず実測する。","keywords":["索引","実行計画"]}],"tips":"SQLは結合前後の行数を小さな例で書き出す。データの時点とトランザクション境界を区別する。"},{"id":"BX03","title":"拠点間通信とDNS・ルーティングの障害切分け","domain":"ネットワーク","required":false,"passage":"企業D社の本社に新たにWebサーバを導入した。Webサーバは172.16.20.10/24、デフォルトゲートウェイは172.16.20.1、DNSサーバは172.16.10.53である。支店の端末は10.10.30.0/24に所属し、支店と本社はルータ間のVPNで接続している。支店から本社の別サービス172.16.10.20への通信は正常であり、WebサーバへはIPアドレスを直接指定しても接続できない。\n本社ルータの経路表には172.16.10.0/24への経路があるが、Webサーバの新しい172.16.20.0/24への経路は登録されていない。一方、支店のDNS問い合わせは成功し、intra.exampleのAレコードは172.16.20.10を返している。WebサーバのTCP/443待受けと本社LAN内からの接続は正常である。\n担当者は「DNSのTTLを短くすれば直る」「HTTPS証明書を再発行すれば直る」「ルータの経路表を見直すべき」という3案を出した。セキュリティ担当は、拠点間通信を許可する場合でも本社内の全ネットワークを無条件で公開しない方針である。","items":[{"q":"支店からWebサーバへ接続できない第一の原因として最も疑うべき設定は何か。","answer":"本社の新しい172.16.20.0/24への経路が適切に設定されていない点。","reason":"DNSは正しいAレコード、Webサーバの待受けも本社内から確認済み。IP宛通信が失敗している。","keywords":["経路","172.16.20.0/24"]},{"q":"DNSのTTL変更だけでは改善しない理由を述べよ。","answer":"名前解決は既に正しく行われており、宛先IPへのパケット配送の経路が問題だから。","reason":"アプリ・名前解決・ネットワーク経路を層別に切り分ける。","keywords":["名前解決","経路"]},{"q":"HTTPS証明書が第一原因とは考えにくい理由を述べよ。","answer":"IPアドレス直接指定でも接続できず、通信経路の不備が先に確認されているから。","reason":"証明書検証は通常TCP接続確立後のTLSの段階。","keywords":["TCP","TLS"]},{"q":"支店端末に/24マスクが与えられているとき、同一ネットワーク内のIPとして適切な範囲はどれか。","answer":"10.10.30.1〜10.10.30.254（通常のホスト利用時）。","reason":"10.10.30.0はネットワークアドレス、10.10.30.255はブロードキャストアドレス。","keywords":["10.10.30","254"]},{"q":"ルーティング追加に加えてセキュリティ上検討すべき制御を1つ示せ。","answer":"支店から172.16.20.10の必要なTCP/443への通信だけを許可するACLやファイアウォール規則を設計する。","reason":"到達できる経路を作ることと、必要最小限のアクセス許可をすることは別。","keywords":["ACL","最小限"]}],"tips":"「名前解決できるか」「IPへ届くか」「TCPが接続できるか」「TLS/HTTPが正しいか」を順に切り分ける。"},{"id":"BX04","title":"動的計画法で最小料金を求める","domain":"プログラミング","required":false,"passage":"交通事業E社は停留所0から停留所nまでの移動に必要な最小料金を計算する。停留所iからはi+1へ料金a[i]、i+2へ料金b[i]で進める。ただし範囲外の移動はできない。どちらも料金は0以上の整数とする。0からnへの最小料金をdp[n]とする。\n担当者は次の擬似コードを示した。添字は0から始まり、配列は十分な長さを持つ。INFはどの実現可能な料金よりも大きい整数である。\n(1) dp[0]←0\n(2) i=1からnまで dp[i]←INF\n(3) i=0からn−1まで繰り返す\n(4) 　dp[i+1]←min(dp[i+1],dp[i]+a[i])\n(5) 　もしi+2<=nなら dp[i+2]←min(dp[i+2],dp[i]+b[i])\n入力例はn=3、a[0..2]=[4,5,4]、b[0..1]=[7,3]である。0→1→2→3なら料金13、0→2→3なら11、0→1→3なら7である。","items":[{"q":"この擬似コードのdp[i]が表す値を説明せよ。","answer":"停留所0から停留所iへ到達する最小の合計料金。","reason":"部分問題の意味を定めると初期値と遷移式の妥当性が理解できる。","keywords":["最小","料金"]},{"q":"dp[0]を0、他をINFで初期化する理由を述べよ。","answer":"出発地点の料金は0と確定し、未到達の他地点は十分大きな値として最小値更新の対象にするため。","reason":"計算の不変条件がdpの意味に一致する。","keywords":["出発","未到達"]},{"q":"入力例のdp[1]、dp[2]、dp[3]の値を順に示せ。","answer":"dp[1]=4、dp[2]=7、dp[3]=7。","reason":"i=0でdp1=4、dp2=7。i=1でdp2=min(7,4+5)=7、dp3=4+3=7。i=2でdp3=min(7,7+4)=7。","keywords":["4","7"]},{"q":"i+2<=nの条件が必要な理由を述べよ。","answer":"存在しない停留所の配列要素への書込みを防ぐため。","reason":"境界条件のない配列アクセスは範囲外参照を生じる。","keywords":["範囲外","境界"]},{"q":"このアルゴリズムの時間計算量と、dp配列の追加空間量を示せ。","answer":"時間O(n)、dp配列の追加空間O(n)。","reason":"iを0からn−1まで1回走査し、各回の更新は定数回。","keywords":["O(n)"]}],"tips":"配列dpの意味、初期条件、遷移、処理順、境界条件を明示してトレース表を作る。"},{"id":"BX05","title":"EVMと工期短縮案の評価","domain":"プロジェクトマネジメント","required":false,"passage":"SI企業F社は業務システムを開発している。承認済みの総予算BACは1,200万円、計画工期は12週間である。6週終了時点の計画価値PVは600万円、完了した作業に対応する出来高EVは480万円、実コストACは640万円だった。プロジェクトは機能要求が増えたため一部の作業が遅れ、追加要員投入の提案がある。\n工程ネットワークは、A(2週)→C(4週)→E(2週)と、B(3週)→D(4週)→E(2週)の2経路で構成される。A,Bは同時開始、CはAの後、DはBの後、EはCとDの両方が完了してから着手する。資源制約と追加コストは一旦無視して計算する。短縮案1は作業Cを1週短縮、短縮案2は作業Dを1週短縮する。","items":[{"q":"6週終了時点のスケジュール差異SVと費用差異CVを算出せよ。","answer":"SV=EV−PV=−120万円、CV=EV−AC=−160万円。","reason":"どちらも負なので進捗遅れ・費用超過を示す。","keywords":["−120","−160"]},{"q":"SPIとCPIを求め、その意味を説明せよ。","answer":"SPI=480/600=0.8、CPI=480/640=0.75。どちらも1未満で計画より進捗効率・費用効率が悪い。","reason":"分母はSPIがPV、CPIがAC。","keywords":["0.8","0.75"]},{"q":"費用効率が今後も一定と仮定する場合のEACを求めよ。","answer":"EAC≈BAC/CPI=1,200/0.75=1,600万円。","reason":"同じ効率が続くという仮定の単純モデル。","keywords":["1600","万円"]},{"q":"工程ネットワークのクリティカルパスと最短完了週数を答えよ。","answer":"B→D→Eで3＋4＋2=9週。","reason":"A→C→Eは2＋4＋2=8週。最長の経路が全体完了を制限する。","keywords":["B","D","E","9"]},{"q":"短縮案1と短縮案2のうち、全体工期を1週短縮できるのはどちらか。","answer":"短縮案2（Dを1週短縮）。ただし両経路が8週で並ぶ。","reason":"非クリティカルなCを短縮してもB→D→Eの9週が残る。Dを1週短縮すると両経路8週。","keywords":["案2","D"]}],"tips":"PV、EV、ACを混同しない。工程図では合流点の開始時刻は先行作業完了の最大値になる。"},{"id":"BX06","title":"アクセス権監査と監査証拠","domain":"システム監査","required":false,"passage":"流通業G社では購買部門の担当者が仕入先マスタを登録し、購買部長が登録を承認するという業務規程がある。昨年のシステム更改で旧担当者の権限が一部残存し、元購買担当のHさんは現在営業部門へ異動したが、仕入先マスタの登録・承認の両方を実行できる管理者権限を持っている。\n内部監査部門が監査したところ、部門長は「権限棚卸しは四半期に一度行っている」と説明した。しかし棚卸しリストには承認者の署名・実施日時がなく、権限変更依頼票の処理履歴との照合もしていなかった。監査対象期間における不正な登録や支払いは、現在確認できていない。監査人は権限管理の統制が機能しているか評価し、改善提案を行う。","items":[{"q":"Hさんの権限が引き起こす主要な統制上の問題を述べよ。","answer":"異動後も不要な権限が残り、同一人物が仕入先登録と承認をできるため職務分掌が機能していない。","reason":"最小権限の原則と申請・承認の相互牽制が崩れている。","keywords":["職務分掌","不要権限"]},{"q":"四半期棚卸しの実施を確認するための適切な監査証拠を2つ挙げよ。","answer":"承認者・日時を記録した棚卸し結果、権限変更依頼票・実際の権限設定ログとの照合記録。","reason":"口頭説明のみでは十分な監査証拠とはいえない。","keywords":["棚卸し結果","変更履歴"]},{"q":"不正支払いが確認されていないことから「統制に問題なし」と結論できるか。理由も述べよ。","answer":"結論できない。不正が未確認でも予防統制の不備と証跡欠落があるから。","reason":"結果としての不正有無と統制の設計・運用の適切さは区別する。","keywords":["結論できない","不備"]},{"q":"再発防止のため、権限付与と異動時の統制に必要な改善を述べよ。","answer":"権限を業務役割ごとに分け、異動・退職時に不要権限を速やかに削除し、棚卸しの承認・日時・変更結果を記録する。","reason":"RBACと定期レビュー・証跡によって不要権限の残存を検知・解消する。","keywords":["異動","権限削除","記録"]},{"q":"監査人と被監査部門の責任分担を説明せよ。","answer":"監査人は独立・客観的に評価し改善を提案する。改善策の実装・運用責任は被監査部門にある。","reason":"監査人が自分で実装して監査すると独立性を損ない得る。","keywords":["独立","実装責任"]}],"tips":"指摘は「基準・事実・原因・影響・改善提案」を分けて書く。統制不備と不正発生を同一視しない。"},{"id":"BX07","title":"店舗在庫の統合と事業効果の検証","domain":"情報戦略","required":false,"passage":"小売企業K社は40店舗とECサイトを運営する。各店舗は独自の在庫表を使い、ECサイトは毎日閉店後に店舗別在庫を取り込む。店舗で商品が売れた後もECサイトに在庫ありと表示されることがあり、購入者からの注文を取り消す事例が増えた。一方、人気商品を過剰に発注した店舗では売れ残りが生じる。経営会議では「欠品による注文取消しの減少」と「在庫保有費用の削減」を目標とした。\n\n企画部は、全チャネルの在庫データを統合する案を提示した。現状では商品コードの採番ルールが店舗ごとに異なる。例えば同じ商品でも本店はA001、支店はX100として管理している。また、店舗で取り置きした商品をシステム上で即時引き当てる機能がないため、販売可能数と実在庫数を区別できていない。店舗担当者は、統合システムが導入されればこれらの問題も自動的に解消すると考えている。\n\n【表1：2案の経済性（単位：万円）】\n案A　初期投資600、年間削減効果300、年間追加運用費100\n案B　初期投資900、年間削減効果500、年間追加運用費150\n削減効果と運用費は毎年一定と仮定し、割引率・税金・残存価値は考慮しない。\n\nK社ではEC注文1万件のうち400件が欠品で取り消されている。導入後の目標は欠品による取消率を1%以下にすることとする。企画部は一部の店舗で試行し、そこでの取消率、在庫データ更新遅延、店舗担当者の利用率を毎週測定する計画を立てた。ただし、試行店舗は現在最も売上が大きくITに習熟した店舗のみを選んでおり、他店舗でも同じ効果が得られるか懸念がある。","items":[{"q":"在庫統合前に解決すべきデータ管理上の課題を一つ述べよ。","answer":"商品コードの採番ルールを統一し、既存コードと共通商品IDの対応を整備する。","reason":"異なるコードのままでは同一商品として集計できない。","keywords":["商品コード","統一"]},{"q":"店舗の取り置きによる注文取消しを防ぐため、どの在庫情報をどのように管理するか。","answer":"販売可能数を実在庫数から引当済み数量を差し引いて管理し、取り置き時に即時更新する。","reason":"実在庫と他の顧客に販売可能な在庫は異なる。","keywords":["引当","販売可能数","即時更新"]},{"q":"案Aと案Bの単純投資回収期間を求め、短い案を答えよ。","answer":"Aは3年、Bは約2.57年。Bが短い。","reason":"A=600/(300−100)、B=900/(500−150)。","keywords":["3年","2.57年","B"]},{"q":"注文取消率の現状と目標の差をパーセントポイントで答えよ。","answer":"現状4%、目標1%以下、少なくとも3パーセントポイント削減。","reason":"400/10000=4%。率の差は割合そのものの差。","keywords":["4%","3ポイント"]},{"q":"試行店舗の選定による評価上の問題と改善方法を述べよ。","answer":"IT習熟度の高い大規模店に偏っているため、規模・習熟度が異なる店舗も選び効果を比較する。","reason":"代表性の不足により全店への一般化が難しい。","keywords":["選択バイアス","異なる店舗"]}],"tips":"経営目標→業務上の原因→施策→成果指標を対応付ける。単なるシステム導入を目的にしない。"},{"id":"BX08","title":"予約サービスの性能・可用性と容量設計","domain":"システムアーキテクチャ","required":false,"passage":"旅行予約サービスを運営するT社では、利用者端末からロードバランサを介してWebサーバ2台へ要求を分配し、両サーバが同じDBサーバにアクセスする。Webサーバ1台当たりの最大処理能力は毎秒90件、DBサーバは毎秒140件である。通常は毎秒80件だが、新サービス開始時には毎秒160件の要求が予想される。処理の途中で必ずDBに1回アクセスし、キャッシュは利用していないものとする。\n\n担当者はWebサーバを3台に増設すれば毎秒270件を処理できると考えた。しかし性能試験では、Webサーバ2台のCPU使用率は約55%にとどまり、DBサーバでは処理待ちが生じていた。担当者は人気商品の検索結果を一定時間キャッシュする対策を提案した。ただし、予約確定時の空き状況は最新でなければならず、検索結果のキャッシュをそのまま予約の可否判定には使えない。\n\n【表1：可用性の設計条件】\nロードバランサ単体　0.999\nWebサーバ単体　0.98（2台のどちらかが稼働すればサービス可能）\nDBサーバ単体　0.99\n全装置の故障は独立と仮定し、切替失敗などは考慮しない。ロードバランサ、Webサーバ群、DBサーバはすべて必要である。\n\nバックアップは毎日0時に取得し、翌日まで別媒体に保存する。DBの更新ログは5分ごとに別拠点に転送される。サービスの復旧時点目標（RPO）は15分、復旧時間目標（RTO）は60分である。復旧試験ではバックアップからの復元に45分、更新ログの適用に20分、サービス動作確認に10分を要した。試験の各作業は順次実施される。担当者はログを別拠点に保存しているため、復旧目標は両方達成されると報告した。","items":[{"q":"現構成の最大処理能力とボトルネックを答えよ。","answer":"毎秒140件、DBサーバ。","reason":"Web群180件/秒とDB140件/秒の小さい方。","keywords":["140","DB"]},{"q":"Webサーバを3台に増設するだけでは予測需要に対応できない理由を述べよ。","answer":"DBの処理能力が140件/秒のままなので160件/秒の需要を処理できない。","reason":"直列工程の全体能力は最小能力で制約される。","keywords":["DB","140","160"]},{"q":"Webサーバ群の稼働率を求めよ。","answer":"1−(1−0.98)²＝0.9996。","reason":"2台が同時に停止する確率を1から引く。","keywords":["0.9996"]},{"q":"システム全体の稼働率を小数第5位で四捨五入し、小数第4位まで求めよ。","answer":"0.9886。","reason":"0.999×0.9996×0.99=0.988614396。","keywords":["0.9886"]},{"q":"RPOとRTOの達成可能性をそれぞれ述べよ。","answer":"ログが正常に保存・復元できればRPOは5分以内で目標を満たす見込み。RTOは75分で目標60分を超える。","reason":"復旧時点と復旧所要時間を別々に評価する。","keywords":["RPO","5分","RTO","75分"]},{"q":"検索結果をキャッシュしても予約の過剰販売を防ぐために必要な処理を述べよ。","answer":"予約確定時はDBの最新在庫をトランザクション内で確認し、引当・更新する。","reason":"古いキャッシュを確定判断に使うと競合や在庫不足を見逃す。","keywords":["最新在庫","トランザクション","引当"]}],"tips":"性能・可用性・復旧は異なる指標。計算では独立性、直列・並列、作業の重複可否を確認する。"},{"id":"BX09","title":"温度監視装置の周期制御とフェイルセーフ","domain":"組込みシステム開発","required":false,"passage":"工場の恒温槽には温度センサ、マイコン、ヒータ、警報ランプがある。マイコンは温度を取得し、設定値との差に応じてヒータを制御する。温度センサのアナログ出力は0～5Vで、10ビットのA/D変換器によって0～1023の整数として取得される。設計上、0Vは0℃、5Vは100℃に対応する。温度の換算ではセンサ誤差を無視し、0～1023が0～100℃に線形対応すると仮定する。\n\n【表1：周期タスク（処理時間・周期・期限、単位ms）】\n安全監視 S　1、10、10\n温度制御 C　3、20、20\nログ送信 L　8、40、40\n全タスクは単一CPUで動作する。切替のオーバーヘッドを無視し、処理時間は最悪値とする。レートモノトニック方式を使い、周期の短いタスクが長いタスクをプリエンプト（割込み実行）できる。タスク間の資源競合は表1の計算には考慮しない。\n\n制御担当はログ送信処理を改善しようとして、通信ライブラリの呼出し中に共有バッファのロックを保持する設計を採用した。通信が不安定な場合、ログ送信は最大30msロックを保持する。安全監視も同じバッファのロックを取得してから異常状態を記録する仕様となっているため、優先度の高い安全監視が実行可能状態でもロックの解放を待つ場合がある。\n\nさらに、温度センサの配線断線時に0Vを出力する故障モードが見つかった。現在のソフトウェアでは低温と判断し、ヒータへの電力を増やす。担当者はセンサの妥当性判定を行い、異常時にはヒータを停止し警報を出す仕様を提案した。マイコンが応答不能になる故障に備え、ウォッチドッグタイマの追加も検討している。","items":[{"q":"A/D変換結果が512の場合、温度を概算せよ。","answer":"約50℃。","reason":"512÷1023×100≒50.05。","keywords":["50"]},{"q":"3タスクのCPU利用率を求めよ。","answer":"45%。","reason":"1/10＋3/20＋8/40=0.45。","keywords":["45%"]},{"q":"レートモノトニック方式の優先順位を高い順に答えよ。","answer":"S、C、L。","reason":"周期が10、20、40msの順。","keywords":["S","C","L"]},{"q":"安全監視が最高優先度でも期限を守れない可能性がある理由を述べよ。","answer":"低優先度のログ送信が共有バッファのロックを長時間保持し、安全監視がブロックされるから。","reason":"優先度だけでは共有資源による待ち時間を解消できない。","keywords":["ロック","ブロック"]},{"q":"期限を守るために共有バッファの使い方をどう変更するか。","answer":"通信中はロックを保持せず、共有データのコピーなど短時間の更新処理だけを排他区間にする。","reason":"時間のかかる入出力を排他区間外に移してブロック時間を短縮する。","keywords":["排他区間","通信","短縮"]},{"q":"断線時に安全側へ移行する対策の名称と動作を答えよ。","answer":"フェイルセーフ。異常を検知したらヒータを停止し警報を出す。","reason":"故障時に危険な加熱を継続しない。","keywords":["フェイルセーフ","停止","警報"]}],"tips":"周期・期限・実行時間を区別する。CPU利用率だけで締切保証とは断定できない。"},{"id":"BX10","title":"受発注システムの要件・移行・試験設計","domain":"情報システム開発","required":false,"passage":"製造業M社は20年前に導入した受発注システムを刷新する。旧システムでは担当者が電話注文を受け、在庫を画面で確認した後に注文情報を登録する。繁忙時には複数の担当者が同じ在庫を確認して注文を確定するため、在庫数を超えて受注することがある。新システムではWeb画面からも注文できるようにし、在庫の引当てと注文登録を一つのトランザクションとして行う。\n\n要件定義書には「システムは十分に高速で使いやすいこと」とだけ記載されていた。利用部門は検索結果を2秒以内に表示することを希望し、開発部門はピーク時に同時利用者200人を想定する。担当者は、95%の検索応答が2秒以内であることを受入基準とする案を提示した。\n\n【表1：注文数量の入力仕様】\n1～100の整数を許可する。ただし、販売可能在庫を超える注文は拒否する。数量の形式チェックは在庫確認前に行う。エラー時は理由を画面に表示し、在庫・注文の更新を行わない。\n\n開発では注文処理モジュールの下位に在庫確認モジュールとDB更新モジュールがある。在庫確認モジュールは完成したが、DB更新モジュールはまだ未完成である。開発担当は上位の注文処理を先にテストするため、DB更新を模擬する部品を作る計画を立てた。\n\nデータ移行では商品マスタ、顧客マスタ、未完了注文を新システムに移す。旧システムの商品コードには先頭0が含まれるが、試行移行で新システムの数値型カラムに格納した結果、00123が123になり、別の商品コード123と区別できなくなった。移行計画では、新旧件数の一致だけを確認すれば十分とされている。移行作業に失敗したときの切戻し方法はまだ決めていない。","items":[{"q":"在庫超過受注を防ぐため、注文登録と在庫更新を一つのトランザクションとする理由を述べよ。","answer":"途中失敗時に両方を取り消し、並行注文時も在庫確認・引当ての整合性を保つため。","reason":"原子性だけでなく、並行制御を適切に設計する必要がある。","keywords":["原子性","並行制御","整合性"]},{"q":"性能の受入基準を具体的に記述せよ。","answer":"同時利用者200人の想定負荷で、検索応答時間の95%が2秒以内であること。","reason":"負荷条件と測定指標を明示する。","keywords":["200人","95%","2秒"]},{"q":"注文数量の上下限の直前・境界・直後を確認する入力値を列挙せよ。","answer":"0、1、2、99、100、101。","reason":"境界値分析で上下限の前後を確認する。在庫は100以上など十分に確保した条件とする。","keywords":["0","1","2","99","100","101"]},{"q":"未完成の下位DB更新モジュールを模擬する部品を何というか。","answer":"スタブ。","reason":"トップダウン結合テストで下位の機能を代替する。","keywords":["スタブ"]},{"q":"商品コードの衝突の原因と改善方法を述べよ。","answer":"数値型への変換で先頭0が消えた。文字列型で元のコードを保持する。","reason":"識別子は数値演算の対象とは限らない。","keywords":["先頭0","文字列型"]},{"q":"件数照合以外に必要な移行確認を二つ述べよ。","answer":"商品コードの一意性・対応関係の確認と、注文・在庫・顧客間の参照整合性の確認。","reason":"件数一致だけでは値の誤りや関連の破損を検出できない。","keywords":["一意性","参照整合性"]}],"tips":"曖昧な要求は試験可能な条件へ変換し、異常時の更新禁止・データ照合・切戻しまで設計する。"},{"id":"BX11","title":"サービス停止の分析と継続的改善","domain":"サービスマネジメント","required":false,"passage":"法人向けクラウドサービスP社は、月間稼働率99.9%以上を顧客とサービスレベル合意（SLA）で定めている。対象時間は月30日間の全時間であり、今回の停止はすべて計測対象とする。サービスデスクは障害発生時に受付番号を発行し、インシデント管理担当へ連絡する。\n\n【表1：今月のサービス停止】\n障害1　12分　DB接続数の上限到達\n障害2　18分　同じDB接続数の上限到達\n障害3　24分　新バージョン配布時の設定誤り\nいずれの停止時間にも重複はない。\n\n障害1と2では、DB接続を再起動するとサービスが回復した。調査の結果、特定処理で終了後も接続が解放されない不具合が見つかった。運用担当は「毎晩自動再起動するようにすれば解決する」と提案した。開発担当は接続解放処理の修正を提案したが、変更の影響範囲や切戻し手順はまだ確認されていない。\n\n障害3では配布手順書に記載された設定値が旧版のままだった。構成管理台帳（CMDB）には本番のソフトウェア版と設定の対応が記録されておらず、障害時に正しい設定を特定するまで時間を要した。P社は配布手順に本番設定の事前確認と自動テストを追加し、失敗時に以前の版へ戻す手順を整備する計画である。\n\n今後、サービス管理責任者は毎月のSLA達成率、平均復旧時間、同一原因による再発件数、変更失敗率を測定し、改善施策を評価したいと考えている。ただし、現状は停止していない苦情や問い合わせもすべて障害として集計しているため、停止時間の算定方法を見直す必要がある。","items":[{"q":"SLA上の許容停止時間を分で求めよ。","answer":"43.2分。","reason":"30×24×60×(1−0.999)=43.2。","keywords":["43.2"]},{"q":"今月の停止時間と稼働率を求め、SLA達成可否を答えよ。","answer":"54分、99.875%、未達。","reason":"1−54/43200=0.99875。","keywords":["54分","99.875%","未達"]},{"q":"再起動によるサービス回復と接続解放不具合の恒久修正は、それぞれどの管理に対応するか。","answer":"前者はインシデント管理、後者の根本原因の調査・再発防止は問題管理。","reason":"早期復旧と根本原因の解消を区別する。","keywords":["インシデント管理","問題管理"]},{"q":"恒久修正を本番に適用する前に変更管理で確認すべき事項を二つ述べよ。","answer":"影響・リスクを評価して承認し、テスト結果と切戻し手順を確認する。","reason":"再発防止の変更自体が新たな障害を起こす可能性がある。","keywords":["影響評価","承認","切戻し"]},{"q":"CMDBに追加すべき構成情報を述べよ。","answer":"本番のソフトウェア版、設定値、関連する構成項目間の関係と変更履歴。","reason":"障害時に正しい構成と差分を特定できるようにする。","keywords":["版","設定","変更履歴"]},{"q":"不具合の恒久対策の有効性を判断する指標を一つ挙げ、理由を述べよ。","answer":"同一原因による再発件数。根本原因の修正により同じ停止が減ったか確認できる。","reason":"総問い合わせ数だけでは当該対策の効果を評価できない。","keywords":["再発件数","同一原因"]}],"tips":"復旧、原因分析、変更、構成管理、評価を区別し、それぞれの目的に合う指標を選ぶ。"},{"id":"BY01","title":"部門別売上の集計と更新競合","domain":"データベース","required":false,"passage":"小売会社E社は店舗別の商品売上を集計する。商品表 Product(pid, name, category)、店舗表 Store(sid, area)、売上表 Sale(sale_id, sid, pid, qty, price, sold_at) を用いる。Saleのsid、pidはそれぞれ店舗、商品を参照する外部キーであり、priceは販売時点の単価である。日次集計の対象は当日売上のある店舗と売上がない店舗の全てである。\n当日売上は店舗S1の売上番号1（数量2、単価100円）、番号2（数量1、単価300円）、店舗S2の売上番号3（数量4、単価50円）の3行で、店舗S3には売上がない。担当者はStoreとSaleを左外部結合して店舗ごとにSUM(qty*price)を求めようとしている。売上日時の条件を結合後のWHERE句に記述すると、売上がない店舗が表示されないことが判明した。\n別の分析では売上明細の各行を残し、同じ店舗の合計売上額を各行に付けたい。また、販売処理では注文登録と在庫数の減算を一つの取引として扱う。在庫数が1のとき二つの端末が同時に読み取って両方が販売を確定する問題が発生した。担当者はロック方式、条件付き更新、索引の設計を見直す。","items":[{"q":"店舗S1、S2、S3の日次売上額を求めよ。売上なしは0とする。","answer":"S1：500円、S2：200円、S3：0円。","reason":"S1は2×100＋1×300、S2は4×50。S3は該当する売上がない。","keywords":["500","200","0"]},{"q":"売上がない店舗も残すため、日付条件を記述する場所と、NULLの集計値を0にする関数を答えよ。","answer":"左外部結合のON句に日付条件を加え、COALESCE(SUM(qty*price),0)を用いる。","reason":"WHERE句で右表の日付を絞るとNULLの行が除かれる。COALESCEでNULLを0に置き換える。","keywords":["ON","COALESCE"]},{"q":"売上明細の各行を残し、店舗合計を各行に付けるSQL式を示せ。対象日で抽出済みとする。","answer":"SUM(qty*price) OVER (PARTITION BY sid)","reason":"GROUP BYでは店舗ごとに行が集約されるがウィンドウ関数は明細の行を保持できる。","keywords":["SUM","OVER","PARTITION BY"]},{"q":"在庫の二重販売を防ぐための更新方式を一つ述べよ。","answer":"在庫行を専有ロックしてから在庫を確認し、在庫が十分な場合のみ減算と注文登録を同一トランザクションで確定する。","reason":"読み取りと更新の間に他の取引が同じ在庫を消費することを防ぐ。条件付きの原子的更新も候補。","keywords":["ロック","トランザクション"]},{"q":"日付で絞る集計の高速化を検討するとき、索引の候補と評価方法を答えよ。","answer":"sold_atの索引や日付・店舗の複合索引を検討し、実行計画と実データに近い負荷で検索・更新性能を比較する。","reason":"索引は読み取りを速める可能性があるが更新コストが増えるため、実際の検索条件と負荷で評価する。","keywords":["sold_at","実行計画"]}],"tips":"集計前後の行数を必ず確認する。NULL、0、行の消失は別の現象。ロックの目的は業務上の在庫制約を守ること。"},{"id":"BY02","title":"拠点ネットワークの回線容量と監視","domain":"ネットワーク","required":false,"passage":"F社の本社と支社は100Mbit/sの拠点間回線で接続される。業務データ送信と映像会議が同じ回線を利用する。回線の実効速度は、他の負荷や制御情報を考慮して理論速度の60%と仮定する。毎日、支社から本社へ900MBのファイルを送信する。MBは十進単位であり、追加の遅延は無視する。\n支社のネットワーク管理装置はSNMPでルータの送信バイト数を60秒ごとに取得する。ある区間のカウンタ差は450MBであった。カウンタの巻戻りと再起動はない。映像会議では音声の遅延と途切れが問題になっているため、管理者は通信の優先制御を検討する。\n支社には二台のL2スイッチがあり、各スイッチから上位スイッチへの経路に加えて相互接続もある。冗長性を高めるために経路を増やしたが、設定不備によりフレームが循環する危険がある。さらに社員向けと来客向けの無線LANを同じアクセスポイントで提供し、来客は社内業務システムへ接続できないようにする。","items":[{"q":"900MBのファイル転送にかかる理論的な実効時間を秒で求めよ。","answer":"120秒。","reason":"実効60Mbit/s、900MB＝7200Mbit。7200÷60＝120。","keywords":["120"]},{"q":"60秒区間の平均送信速度をMbit/sで求めよ。","answer":"60Mbit/s。","reason":"450×8÷60＝60。バイトをビットに換算する。","keywords":["60"]},{"q":"音声の遅延を減らすために検討する機能とその限界を述べよ。","answer":"QoSで音声通信に優先度を与える。ただし回線容量そのものは増えないので総負荷や他通信への影響を評価する。","reason":"遅延に敏感な通信を優先することと物理帯域の増強は別。","keywords":["QoS","優先"]},{"q":"L2スイッチの冗長経路でフレームの循環を防ぐ代表的な仕組みは何か。","answer":"スパニングツリープロトコル（STP）。","reason":"一部の転送経路を制御してループのない論理構造を形成する。","keywords":["スパニングツリー"]},{"q":"来客向け無線LANから業務システムへのアクセスを防ぐ構成を述べよ。","answer":"社員用と来客用を別VLAN等に分離し、ルータやファイアウォールで来客用から業務網への通信を拒否する。","reason":"SSID名を分けるだけでは経路やアクセス権の分離を保証しない。","keywords":["VLAN","拒否"]}],"tips":"通信速度の単位を揃え、測定値と理論値を区別する。可用性を高める冗長化にもループ防止が必要。"},{"id":"BY03","title":"メール認証と委託先アカウント・バックアップ管理","domain":"情報セキュリティ","required":true,"passage":"G社では経理担当者が取引先からの請求書をメールで受け取り、振込処理を行う。最近、表示上の送信元が取引先のドメインである振込先変更メールを受信した。メール受信時の検査記録ではSPFは通過したが、SPFで認証されたエンベロープ送信元ドメインは表示上のFromと異なっていた。DKIM署名も検証に失敗しており、表示Fromのドメインに整合する認証結果はない。経理担当者は振込先を変更せず、既に登録してある取引先の電話番号で確認した。\n一方、委託先担当者は保守システムにパスワードだけでログインし、担当外の顧客データも閲覧できる。G社はフィッシング耐性のある認証方式と役割単位のアクセス制御を検討している。\nG社は日次バックアップを同じ管理者アカウントで操作できる別ディスクに保存している。ランサムウェアへの備えとして、バックアップの変更・削除を一定期間制限する方式と独立した保管先を検討している。さらに外部ライブラリの脆弱性情報を受け取ったが、製品内で当該ライブラリのどの版を使っているかすぐに把握できない。","items":[{"q":"SPFの通過だけでは表示Fromの取引先が真正であると判断できない理由を述べよ。","answer":"SPFが確認したエンベロープ送信元のドメインが表示Fromのドメインと異なるため。","reason":"SPFは許可された送信元IP等を確認するが、表示Fromとの整合性はそれだけでは保証しない。","keywords":["ドメイン","異なる"]},{"q":"表示Fromと認証ドメインの整合性を検証し、失敗時の扱いを指定する仕組みは？","answer":"DMARC。","reason":"SPFまたはDKIMの認証結果と表示Fromのドメイン整合性を確認する。","keywords":["DMARC"]},{"q":"委託先の認証と認可を改善する対策をそれぞれ一つ挙げよ。","answer":"認証にはFIDO2/WebAuthn等のフィッシング耐性のある方式を検討し、認可は保守担当の役割に必要な顧客・操作の最小権限だけを付与する。","reason":"本人性を確かめる対策と、ログイン後の操作範囲を制限する対策は別。","keywords":["認証","最小権限"]},{"q":"バックアップがランサムウェアにより同時に削除されるリスクを抑える対策を述べよ。","answer":"独立した権限・保管先のバックアップを用意し、イミュータブル保存等で所定期間の変更・削除を制限し、復元試験を行う。","reason":"同じ管理権限でアクセスできる複製は同時に影響を受け得る。復元可能性も確認する。","keywords":["独立","復元"]},{"q":"外部ライブラリの脆弱性情報を製品の構成と照合するために整備する資料は？","answer":"SBOM（ソフトウェア部品表）。","reason":"構成部品と版を把握して対象製品や修正範囲を特定する。","keywords":["SBOM"]}],"tips":"認証、認可、通信の保護、バックアップは異なる目的を持つ。メールの技術的認証に加え業務上の別経路確認も重要。"}],"sources":[{"title":"IPA 2026年度後期の試験日程","url":"https://www.ipa.go.jp/shiken/mousikomi/moushikomi.html"},{"title":"IPA 応用情報技術者試験 公式概要","url":"https://www.ipa.go.jp/shiken/kubun/ap.html"},{"title":"IPA 応用情報技術者試験シラバス Ver.7.2","url":"https://www.ipa.go.jp/shiken/syllabus/omgdg50000005kq5-att/syllabus_ap_ver7_2.pdf"},{"title":"IPA 試験要綱 Ver.5.6・最新版シラバス掲載ページ","url":"https://www.ipa.go.jp/shiken/syllabus/gaiyou.html"},{"title":"IPA 2025年度 公式過去問題・解答例","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html"},{"title":"公正取引委員会：中小受託取引適正化法（取適法）","url":"https://www.jftc.go.jp/toriteki/"},{"title":"IPA 2023年12月25日改訂（Ver.7.0）","url":"https://www.ipa.go.jp/shiken/syllabus/henkou/2023/20231225.html"},{"title":"公正取引委員会：取適法施行時の留意事項","url":"https://www.jftc.go.jp/toriteki/toriteki_ryuijiko/"},{"title":"e-Gov：情報流通プラットフォーム対処法","url":"https://laws.e-gov.go.jp/law/413AC0000000137"},{"title":"文化庁：著作者人格権等のFAQ","url":"https://www.bunka.go.jp/seisaku/bunka_gyosei/kibankyoka/faq/index.html"},{"title":"特許庁：画像等の意匠登録事例","url":"https://www.jpo.go.jp/system/laws/rule/guideline/design/kaisei_hogo.html"},{"title":"厚生労働省：職場のハラスメント防止","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyoukintou/seisaku06/"}]}</script>

ITなどの方式もある。"},"06-1":{"type":"flow","title":"温度制御のフィードバック","items":["目標温度を設定","センサが現在温度を測定","制御器が差を計算","ヒータの出力を調整","再度温度を測定"],"note":"結果を測り直して制御に反映するのが閉ループ制御。センサは入力、ヒータは出力を担う。"},"06-2":{"type":"table","title":"リアルタイム処理の優先順位例","items":[["タスク","周期","期限"],["安全制御","10ms","10ms"],["表示更新","100ms","100ms"],["ログ保存","1000ms","1000ms"]],"note":"レートモノトニック方式では周期の短いものを高優先度にする。期限を守れるかは実行時間も必要。"},"06-3":{"type":"flow","title":"省電力センサの動作例","items":["待機（スリープ）","タイマで起床","センサ計測・送信","再び待機"],"note":"常時動作せず必要時だけ起床させると消費電力を抑えられる。応答遅延とのトレードオフがある。"},"07-1":{"type":"flow","title":"利用者中心の設計サイクル","items":["利用状況を観察","要求を定義","試作品を作成","利用者テスト","改善して再評価"],"note":"見た目の好みだけでなく、目的達成率や操作時間を測って改善する。"},"07-2":{"type":"table","title":"わかりやすい操作の比較","items":[["操作","避けたい例","改善例"],["削除","即時実行","確認・取消し"],["入力","送信後だけエラー","項目ごとに理由表示"],["保存","結果が不明","保存完了を表示"]],"note":"ユーザーが今の状態と次にできる行動を理解できるようにする。"},"07-3":{"type":"table","title":"アクセシビリティの対策","items":[["困り事","対策"],["色の識別が難しい","色＋文字や形"],["画像を見られない","代替テキスト"],["タップが難しい","十分な操作領域"],["外国語表示","文字コード・日付形式の対応"]],"note":"色だけで正誤を表示しないなど、複数の手段で情報を伝える。"},"08-1":{"type":"table","title":"非圧縮画像のデータ量","items":[["画像","計算","容量"],["100×100・8bit","10000×8/8","10,000B"],["100×100・24bit","10000×24/8","30,000B"],["200×200・24bit","40000×24/8","120,000B"]],"note":"縦横を2倍にすると画素数は4倍。ファイルヘッダや圧縮を含まない計算。"},"08-2":{"type":"flow","title":"アナログ音声をデジタル化","items":["連続した音の波形","一定間隔で標本化","振幅を段階に量子化","各値をビット列に符号化"],"note":"44.1kHz・16bit・2チャネルなら44,100×16×2/8＝176,400B/秒（非圧縮）。"},"08-3":{"type":"flow","title":"動画のストリーミング再生","items":["動画を圧縮し区間に分割","ネットワークで区間を受信","バッファに一時保存","復号して順次再生"],"note":"通信が不安定なら画質を下げる適応ビットレートで途切れを抑えることがある。"},"09-1":{"type":"table","title":"注文データの正規化","items":[["表","主キー","その他の列"],["顧客","顧客ID","顧客名"],["注文","注文ID","顧客ID（外部キー）"],["注文明細","注文ID＋行番号","商品ID・数量"]],"note":"顧客名を注文行に繰返し保存しなければ、改名時に一か所更新すればよい。"},"09-2":{"type":"flow","title":"SQLで部門別の売上を求める概念順序","items":["FROM・JOIN：表を組み合わせる","WHERE：集計前の行を絞る","GROUP BY：部門ごとに分類","HAVING：集計結果を絞る","SELECT：必要列を表示"],"note":"実際の実行計画とは異なる論理処理順序。WHE ,"note":"各手法を具体的な問題と対応させて説明できるようにする。"},"13-Y05":{"type":"table","title":"考え方の比較","items":[["対象","例"],["ベースライン","承認済み構成"],["SBOM","部品と版"],["変更記録","理由・承認・履歴"],["リリース","実物と試験版の対応"]],"note":"各手法を具体的な問題と対応させて説明できるようにする。"},"14-Y01":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","店舗の予約アプリを3か月で開発する。公開後の日常運用とは管理の目的が異なる。"],["判断例","予約アプリと会員基盤の開発を共通の顧客体験改善のため統合するならプログラム。複数の投資案件から優先するものを選ぶのはポートフォリオ管理。"],["注意","プロジェクトの完了とサービス運用の終了は同じではない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"14-Y02":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","開発途中に顧客が新機能を求めた。納期と予算も影響するため担当者だけで約束できない。"],["判断例","追加機能に10人日必要なら、納期延長、別機能削減、追加資源などを比較して承認を得る。"],["注意","顧客の希望が出た時点で無条件に計画変更しない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"14-Y03":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","病院の予約システムでは患者、医師、事務、経営者が異なる希望を持つ。"],["判断例","経営者には費用対効果、事務担当には業務フロー、患者には操作性の評価を求める。"],["注意","役職が高い人だけがステークホルダーではない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"14-Y04":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","ECサイトの改修を依頼され、決済だけでなく在庫連携も含むかを明確にする。"],["判断例","決済機能を設計、実装、試験に分解し、試験完了条件を正常・異常系の合格とする。"],["注意","WBSは作業の階層構造であり、それだけでは日付や依存関係を表さない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"14-Y05":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","設計と試験が同じ担当者に集中して納期に間に合わない。"],["判断例","同じ技術者が同時に二作業を担当する場合、一方を遅らせるか別の技術者を確保する。"],["注意","人を増やせば工期が必ず反比例して短くなるわけではない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"14-Y06":{"type":"table","title":"Aの後にBとCが並行し、両方の後にDが続く","items":[["経路","計算","日数"],["A→B→D","3＋4＋2","9"],["A→C→D","3＋6＋2","11"]],"note":"A→B→Dの9日よりA→C→Dの11日が長い。Dは両方の完了を待つので最短完了は11日。"},"14-Y07":{"type":"bar","title":"計画・出来高・実支出（万円）","items":[["PV",100],["EV",80],["AC",120]],"note":"出来高が計画を下回り、実支出をも下回るので、日程と費用の両方に問題がある。"},"14-Y08":{"type":"table","title":"対策の前後で期待費用を比較","items":[["状態","発生確率","期待損失","対策費","合計"],["対策前","20%","20万円","0万円","20万円"],["対策後","5%","5万円","8万円","13万円"]],"note":"損失100万円の例。期待値の差は7万円。"},"14-Y09":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","納品されたアプリに不具合が多い。検査を増やすだけでなく作り方も見直す。"],["判断例","不具合の60％が入力検証に集中していれば、その原因を分析して設計レビューとテストを改善する。"],["注意","品質保証と最後の動作試験は同義ではない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"14-Y10":{"type":"table","title":"提案の重み付き採点","items":[["評価項目","重み","A社","B社"],["価格","30%","90","70"],["技術","40%","60","95"],["運用","30%","80","80"],["総合","100%","75","83"]],"note":"A社 27+24+24=75、B社 21+38+24=83。"},"14-Y11":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","10人のチームで全員が全員と直接連絡すると情報の重複や漏れが生じる。"],["判断例","5人なら5×4÷2=10経路、6人なら15経路。人数増加に合わせ連絡経路を整理する。"],["注意","メール送信だけでは相手の理解を保証しない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"15-Y01":{"type":"table","title":"合意・目標・測定値の関係","items":[["用語","役割","例"],["SLA","顧客と合意","契約に記載"],["SLO","達成目標","99.9%"],["SLI","観測指標","99.8%"]],"note":"SLAの合否は対象・除外条件も含めて判断する。"},"15-Y02":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","社内IT部門が新しいチャットとファイル共有サービスを提供する。"],["判断例","障害時、構成管理情報で停止したDBを使うサービスを特定し、カタログで利用部門を調べる。"],["注意","資産台帳と構成管理情報は目的が異なる。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"15-Y03":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","SLOの達成率が3か月連続で低下した。管理者は結果と改善策を確認する。"],["判断例","応答時間悪化の原因がDB索引の不足なら、索引を改善して同一条件で応答時間を再測定する。"],["注意","改善策を実施しただけでは効果が確認されたことにならない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"15-Y04":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","毎夜、売上集計を行う。前段の注文データ取込が失敗すると集計を実行してはいけない。"],["判断例","取込ジョブが失敗したら集計を保留し、担当へ通知して原因解消後に再実行する。二重登録を防ぐ仕組みも確認する。"],["注意","バックアップ成功ログだけで復旧可能性を証明できない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"15-Y05":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","サーバ室では停電だけでなく冷却停止による過熱にも備える。"],["判断例","施設全体150kW、IT機器100kWならPUE=1.5。残り50kWは冷却などの設備負荷。"],["注意","UPSだけで無期限に運転できるわけではない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"16-Y01":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","会計システムのアクセス権が退職者から削除されているか独立した立場で確かめる。"],["判断例","退職者一覧とアカウント一覧を突合し、残存アカウントの権限・無効化日時を確認する。"],["注意","監査人が被監査部門の管理責任を引き受けると独立性を損なう。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"16-Y02":{"type":"table","title":"統制の種類","items":[["種類","例"],["予防","別担当者の支払承認"],["発見","日次照合で差異を発見"],["是正","誤記録を承認の下で修正"]],"note":"発見しただけでは是正したことにならない。"},"17-Y01":{"type":"table","title":"EAの四領域","items":[["領域","対象","例"],["BA","業務","受注処理"],["DA","データ","顧客番号"],["AA","アプリ","受注・物流連携"],["TA","技術","実行・通信基盤"]],"note":"業務から技術基盤までの整合性を取る。"},"17-Y02":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","紙の申請書を電子化したが、承認が5段階のままなので処理が遅い。"],["判断例","低額申請は規則に基づいて自動判定し、高額のみ追加承認することで待ち時間を減らす。"],["注意","既存の紙を画面に変えるだけでは抜本改革とはいえない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"17-Y03":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","会社が自社サーバ、クラウド、業務委託から新しい勤怠管理の構成を選ぶ。"],["判断例","SaaS勤怠を利用しても従業員アカウントや権限、利用データの管理は利用組織側に残る。"],["注意","クラウドに移せばすべての安全管理責任が提供者に移るわけではない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"17-Y04":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","新しい顧客管理システムを導入したが、営業担当が入力せず経営に使えない。"],["判断例","売上向上をKGI、案件情報の入力率や商談化率をKPIとし、入力負担を調べて改善する。"],["注意","導入台数が増えたことだけで経営効果が出たとはいえない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"18-Y01":{"type":"table","title":"現在価値の計算（万円）","items":[["時点","現金","現在価値"],["開始","−100","−100"],["1年後","60","57.14"],["2年後","60","54.42"],["合計","20","11.56"]],"note":"割引率5%。途中の値は小数第2位に丸めた。"},"18-Y02":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","倉庫担当は在庫入力を簡単にしたいが、経理は正確な履歴が必要だと考える。"],["判断例","在庫更新は一操作で行えるようにしつつ、更新者・時刻・旧値・新値を自動記録して監査要件を満たす。"],["注意","実装方式を先に決めると本来の要求を見失うことがある。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"18-Y03":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","複数事業者から販売管理システムの導入提案を募る。"],["判断例","初期200万円・年運用100万円のAと初期350万円・年運用30万円のBでは3年の単純合計はA500万円、B440万円。"],["注意","RFIとRFPを同じものと考えない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"19-Y01":{"type":"table","title":"アンゾフの成長マトリクス","items":[["市場＼製品","既存","新規"],["既存市場","市場浸透","製品開発"],["新規市場","市場開拓","多角化"]],"note":"市場と製品の新規性を別々に判定する。"},"19-Y02":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","新製品を高価格から始めるか、低価格で普及させるかを検討する。"],["判断例","訪問2000件、購入40件ならCVR=2％。ページA/B比較では対象を適切に割り付け、購入率などを評価する。"],["注意","閲覧数が増えても購入率や利益が増えるとは限らない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"19-Y03":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","売上を伸ばしたい企業が、短期の利益だけでなく顧客満足や従業員の技能も管理する。"],["判断例","従業員教育→対応品質向上→顧客満足→継続利用・利益向上という仮説を各視点の指標で検証する。"],["注意","KPIを達成してもKGIが達成されるとは限らない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"19-Y04":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","営業が見込み客情報を管理し、経営者が事業全体を分析したい。"],["判断例","熟練担当者の判断基準を手順書に書き出すのは表出化。手順書を実践して技能を身につけるのは内面化。"],["注意","ERPとCRMは対象が異なり、相互連携して使う場合もある。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"20-Y01":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","研究室で新しいセンサを開発したが、量産と販売までには別の課題がある。"],["判断例","センサの測定精度はPoC、現場での損失削減はPoV、最低限の販売可能製品はMVPで確かめる。"],["注意","技術が動くことと事業が成立することは別。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"20-Y02":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","3年後に省電力端末を発売するため、必要な技術と開発時期を逆算する。"],["判断例","3年後発売→2年後量産試験→1年後試作→半年後基盤技術の選定という順で必要な期限を考える。"],["注意","ロードマップは単なる日程表ではなく技術と製品の関係も示す。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"21-Y01":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","製造会社が納期遅延と過剰在庫を減らしたい。"],["判断例","製品100個に部品Aが3個ずつ必要、在庫50個なら追加所要量は250個（他の入荷・安全在庫なし）。"],["注意","在庫ゼロが常に最適とは限らず、欠品リスクも考慮する。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"21-Y02":{"type":"flow","title":"設計から製造への流れ","items":["CAD：部品を設計","CAE：強度などを解析","CAM：加工データ作成","MES：製造実績・品質管理"],"note":"各ツールの主目的を区別する。"},"21-Y03":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","ネットショップで顧客が注文し、店舗と卸売業者が電子的に発注情報を交換する。"],["判断例","小売から卸へ注文データを標準形式で送るのはB2BのEDI。個人間の中古品取引はC2C。"],["注意","B2BとB2Cは利用技術ではなく取引主体の違い。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"21-Y04":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","スマート家電が温度を読み取り、設定温度に達したら加熱を停止する。"],["判断例","温度センサ→マイコンで設定値と比較→ヒータの制御→再測定という流れ。"],["注意","リアルタイム制御は単に平均処理速度が速いことではなく期限内の応答が重要。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"21-Y05":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","工場で部品を自動搬送し、センサ信号に応じて装置を制御する。"],["判断例","振動センサの値を監視し、故障兆候がある設備を計画停止して整備するのは予知保全の例。"],["注意","工場機器では通信便利性だけでなく安全停止や制御期限も重要。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"22-Y01":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","機能別部門が専門性を持つ一方、新製品の部門間調整に時間がかかる。"],["判断例","製品AとBに独立した売上・利益責任を持たせるのは事業部制。専門部門と製品責任者の双方から調整を受けるのはマトリクス型。"],["注意","組織構造に万能な方式はない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"22-Y02":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","生産設備と人員の制約内で利益を最大にし、不良原因も特定したい。"],["判断例","A製品利益3、B製品利益5、制約A+B≤4、A,B≥0なら全てBで利益20（他の制約なし）。制約が増えれば候補点を比較する。"],["注意","相関があるだけで原因と結果の関係は証明できない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"22-Y03":{"type":"table","title":"流動比率の計算","items":[["項目","金額"],["流動資産","180万円"],["流動負債","120万円"],["流動比率","150%"]],"note":"180÷120×100。支払能力を評価する一指標。"},"23-Y01":{"type":"table","title":"知的財産の保護対象","items":[["制度","主な対象"],["特許","発明"],["実用新案","物品の形状等の考案"],["意匠","デザイン"],["商標","識別標識"],["著作権","創作的表現"],["営業秘密","要件を満たす秘密情報"]],"note":"同じ商品に複数の制度が関係することがある。"},"23-Y02":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","顧客情報を管理するWebサービスで、他人の認証情報を使ったアクセスと広告メールの苦情が発生した。"],["判断例","本人同意なく他人のID・パスワードを用いて制限されたサービスへログインする行為は不正アクセス禁止法の対象となり得る。"],["注意","電子署名は暗号化による機密性保護と同じではない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"23-Y03":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","発注企業が外部の開発者へ日常的に直接作業を指示する契約を検討する。"],["判断例","派遣の場合は派遣先が指揮命令するが、請負の作業者への指示は原則として請負側の管理者が行う。"],["注意","契約書の名称だけで適法な契約形態は決まらない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"23-Y04":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","会計記録を電子保存し、生成AIを業務に導入する企業が法令と社内規則を整備する。"],["判断例","AIが採用候補を選ぶ場合、偏り、個人情報、評価根拠、異議申立て、人による確認を設計する。"],["注意","技術的に可能であることは法的・倫理的に許容されることと同じではない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"23-Y05":{"type":"table","title":"事例から判断へ","items":[["観点","内容"],["課題","委託先が情報セキュリティ管理の認証を取得したと言っている。何が保証されるのか確認する。"],["判断例","委託先の27001認証の範囲に対象業務・拠点が含まれるかを確認し、契約・運用の個別リスクは別途評価する。"],["注意","認証取得は全製品の無欠陥・無事故を保証しない。"]],"note":"本文の考え方を使って、判断の根拠を自分の言葉で説明する。"},"01-Z01": て動画や説明へ移る教材はハイパーメディアの例。"},"09-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["転置インデックス","文書ごとの単語一覧を逆にして、単語から出現文書IDや位置を検索できる索引。"],["検索の処理","文書を分割・正規化して索引を作成し、問い合わせの語に対応する文書集合を取得する。"],["更新と順位付け","新しい文書の索引追加、削除や変更への反映が必要。"]],"note":"犬→A、猫→A,Bなら犬 AND 猫はA。"},"10-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["ネットワークOS","ネットワーク経由のファイル・プリンタ共有、ユーザー認証、アクセス制御などを提供するOSまたはOS機能。"],["MHTML","MIME HTMLはHTMLと関連画像等をMIME形式の一つの文書にまとめる方式。"],["関連する方式","MIME（多目的インターネットメール拡張）は複数種類のデータを扱う形式。"]],"note":"Webページを画像と一緒に一つのアーカイブとして保存する例がMHTML。"},"11-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["ペリルとハザード","ペリルは損失を直接もたらす事故・原因、ハザードは事故の発生や損失を増やす条件。"],["得点法・リスク選好","得点法は発生可能性と影響などを尺度で採点し比較する。"],["リスクファイナンシング","事故後の損失に備え保険や資金を用意する方法。"]],"note":"防火設備は損失低減、保険は資金面の備え。"},"12-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["SysML","Systems Modeling Language（システムモデリング言語）はハードウェア・ソフトウェア等を含むシステムの要求・構造・振舞い・関係をモデル化する。"],["サービスメッシュ","サービス間の通信を共通基盤で管理する。"],["サーキットブレーカー","下流サービスへの失敗が続くと呼出しを一時停止し、代替応答などを行う。"]],"note":"決済障害時に繰返し呼出しで負荷を増やさず一時停止する。"},"13-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["FDD・ユーザーストーリー・INVEST","FDD（Feature Driven Development：機能駆動開発）は顧客価値のある機能単位で計画・設計・構築する。"],["見積りと進捗","プランニングポーカーは各人が見積りを同時提示し差を議論する。"],["改善と開発原則","モブプログラミングは複数人が一つの課題を同時に扱う。"]],"note":"3反復の完了ポイントが20,22,18なら平均20。見積りの参考にするが別チームの生産性比較には使わない。"},"13-C02":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["SAFe・LeSS","SAFe（Scaled Agile Framework：大規模アジャイルの枠組み）は複数チームやポートフォリオの計画・連携を体系化する。"],["Scrum of Scrums・DA","Scrum of Scrumsはチーム代表等が依存関係や統合課題を調整する会合。"],["開発モデル","段階的モデルは機能を分割して順次提供、進展的モデルは理解や要件を更新しながら製品を進化させる。"]],"note":"複数チーム間でAPI仕様の依存を調整する会合はScrum of Scrumsの例。"},"13-C03":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["CALMSとDevOps","開発と運用の協調をCulture（文化）、Automation（自動化）、Lean（無駄の削減）、Measurement（測定）、Sharing（共有）で捉える。"],["MLOps","機械学習のデータ、モデル、コード、実験、配備、監視、再学習を管理する。"],["DevSecOps","セキュリティを最後の検査だけでなく設計・実装・ビルド・運用に組み込む。"]],"note":"モデルの入力分布を監視して性能低下時に再評価するのはMLOpsの活動。"},"13-C04":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["SRE","Site Reliability Engineering（サイト信頼性エンジニアリング）は運用をソフトウェア工学で改善する。"],["Four Keys","シラバスではデプロイの頻度、変更のリードタイム、変更障害率、平均修復時間（MTTR）を扱う。"],["オブザーバビリティ・OpenTelemetry","オブザーバビリティ（可観測性）は外部出力から内部状態を理解できる性質。"]],"note":"99.9%のSLOで30日全時間を対象なら許容停止は43.2分。"},"13-C05":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["ローコード・ノーコード","画面操作や設定で実装量を減らす。"],["部品とリバースエンジニアリング","パラメトリック部品は設定値で振舞いを変えられる。"],["マッシュアップの分類","プレゼンテーションマッシュアップは画面で複数情報を統合、データマッシュアップは情報を結合、ロジックマッシュアップは処理機能を組み合わせる。"]],"note":"地図データと店舗データを結合するのはデータマッシュアップ。"},"14-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["JIS Q 21500","プロジェクトマネジメント等の概念や指針に関する規格系列。"],["プロセスの区別","プロジェクトの立上げ、計画、実行、管理、終結を行う。"],["PMO・テーラリング","PMOは管理方法、教育、情報集約、調整を支援する。"]],"note":"小規模開発でも承認と引渡しの確認は残し、不要な重複文書を整理する。"},"15-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["需要管理・費用配賦","需要管理は利用状況や将来需要を把握し能力・供給計画に反映する。"],["RFC・CAB","RFC（Request for Change：変更要求）に理由、影響、リスク、試験、切戻しを記載する。"],["標準変更・緊急変更・PIR","標準変更は低リスクで事前承認された定型変更、通常変更は個別評価、緊急変更は迅速な承認が必要な変更。"]],"note":"定期的な低リスクの証明書更新を事前承認した手順で行うのは標準変更の例。"},"16-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["監査の種類","会計監査は財務諸表等の適正性を評価、システム監査は情報システムに関するリスク・管理策を評価する。"],["監査規程・計画","監査規程は目的、権限、責任、報告経路等を定める。"],["監査調書","監査手続、証拠、判断、結論を記録し、監査結果の根拠とする。"]],"note":"権限一覧と申請・承認記録のサンプルを比較し調書に記録する。"},"17-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["情報システム化基本計画","経営戦略からシステム化の方向、対象範囲、優先度、アーキテクチャ、投資計画、推進体制を定める。"],["情報システム戦略委員会","経営・業務・IT部門が全社の方針、投資優先順位、リスク、成果を協議する体制の例。"],["IT経営力指標・DX推進指標","IT経営力指標はITを経営に生かす能力の評価に使われる考え方。"]],"note":"部門の要望を全社データ共通化方針と比較して投資を優先する。"},"18-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["システム化構想書","現行業務の課題、将来の業務・ビジネスモデル、システム方式の候補、期待効果、概算費用、制約をまとめ、戦略との整合と承認を得る。"],["SoR・SoE・SoI","SoR（Systems of Record：記録管理システム）は取引・会計など正式記録、SoE（Systems of Engagement：顧客接点システム）は顧客等との関係・体験、SoI（Systems of Insight：洞察獲得システム）はデータ分析による意思決定支援。"],["Fit to Standard・OOTB","Fit to Standardはパッケージ標準業務に業務プロセスを適合させ、独自改修を減らす考え方。"]],"note":"会計の正式記録はSoR、顧客アプリはSoE、購買予測はSoI。"},"19-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["ADKAR・ダイナミックケイパビリティ","ADKARは認知、欲求、知識、能力、定着という個人の変革の観点。"],["コ・クリエーション・IPランドスケープ","コ・クリエーション（共創）は顧客・取引先等と価値を作る。"],["VUCA・循環経済・TCFD","VUCAは変動性、不確実性、複雑性、曖昧性の高い環境。"]],"note":"従業員が変革の必要性を知るだけでなく実行能力・定着を支援するのがADKARの考え方。"},"19-C02":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["全社の範囲と資源","ドメインは事業領域。"],["M&A・TOB・協業","M&A（合併・買収）、TOB（Take Over Bid：公開買付け）、アライアンス（提携）は外部資源活用の手段。"],["競争とバリューチェーン","同質化戦略は競合の強みと同等の価値を提供して差を縮める。"]],"note":"グループ各社の給与計算を一つの共通部門へ集約する。"},"19-C03":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["調査・分析","コンジョイント分析は複数属性の組合せの選好から属性の寄与を推定する。"],["購買・顧客行動","RFM（Recency, Frequency, Monetary：最終購買時期・頻度・金額）分析は顧客を購買実績で分類する。"],["ブランド・価値","バリュープロポジションは顧客へ提供する価値、ブランドポジショニングは競合に対する認知上の位置、ブランドアイデンティティは企業が表現したいブランド像。"]],"note":"直近購入が新しく購入回数・金額が多い層をRFMで抽出する。"},"19-C04":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["ECR","Efficient Consumer Response（効率的消費者対応）は小売とメーカー等が販売情報・補充・物流を連携して消費者への対応を効率化する。"],["EIP","Enterprise Information Portal（企業内情報ポータル）は分散した業務情報やアプリへの共通入口を提供する。"],["TOC・SECIとの違い","TOC（制約条件理論）はボトルネック改善、SECIは暗黙知・形式知の変換による知識創造。"]],"note":"小売の販売実績を製造側が共有し補充計画を改善するのはECR。"},"20-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["イノベーションの分類","プロダクトは製品・サービスの革新、プロセスは作り方や提供方法の革新、ラディカルイノベーションは大きな非連続的変化。"],["外部との価値創出","メイカームーブメントは個人等のデジタル工作・試作活動の広がり。"],["MFTフレームワーク","Market（市場）、Function（機能）、Technology（技術）の関係を整理し、顧客課題から必要機能と技術を結び付ける。"]],"note":"高価格の既存品の改善に集中し低価格新市場を見落とす場合がジレンマの例。"},"20-C02":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["価値の三段階","Value Creationは価値創造、Value Deliveryは価値実現・提供、Value Capture（価値利益化）は提供した価値を対価・利益として回収する。"],["普及と障壁","技術のSカーブは性能向上が初期緩慢・中期急速・成熟期鈍化する傾向。"],["検証と品質","PoC（概念実証）は実現可能性、PoV（価値実証）は顧客価値、PoB（事業実証）は事業としての成立性を調べる。"]],"note":"試作品が動くのはPoC、顧客が対価を払う継続事業を検証するのはPoB。"},"20-C03":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["技術移転・外部資源","TLO（Technology Licensing Organization：技術移転機関）は大学等の成果の実用化・ライセンスを支援する。"],["特許の活用","パテントプールは複数の特許をまとめてライセンスする仕組み。"],["ロードマップ","技術ロードマップは技術性能・開発時期、製品応用ロードマップは製品への適用、特許取得ロードマップは出願・権利化計画を時間軸で結び付ける。"]],"note":"標準準拠に必要な複数企業の特許をまとめて許諾する仕組みはパテントプール。"},"21-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["会計・人事・業務支援","XBRL（eXtensible Business Reporting Language：拡張可能な事業報告言語）は財務報告等のデータを機械可読にする。"],["流通・医療","EOS（Electronic Ordering System：電子補充発注システム）は補充発注情報を電子化する。"],["CPS・ブロックチェーン","CPS（Cyber-Physical System：サイバーフィジカルシステム）は現実のセンサ情報をデジタル空間で分析し現実へ制御を戻す。"]],"note":"在庫不足に応じて取引先に補充を電子発注するのはEOS。"},"21-C02":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["電子行政・調達","デジタルガバメントは行政サービス・業務のデジタル化と改革。"],["行政ネットワーク・開示","LGWAN（Local Government Wide Area Network：総合行政ネットワーク）は地方公共団体の行政ネットワーク。"],["住民・防災・包摂","住民基本台帳ネットワークは本人確認情報を連携する仕組み。"]],"note":"国の電子調達はGEPS、自治体間行政通信はLGWAN、企業の法定開示はEDINET。"},"21-C03":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["交通","ITS（Intelligent Transport Systems：高度道路交通システム）は情報通信で交通の安全・効率を高める総称。"],["電力","スマートグリッドは通信・計測によって電力の需給を効率的に管理する電力網。"],["需要に応じたサービス","AIオンデマンド交通は予約・需要に応じて運行経路等を調整する。"]],"note":"高速道路の料金決済はETC、渋滞情報提供はVICS。"},"21-C04":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["ビジネス形態","DtoC（Direct to Consumer：消費者直接販売）はメーカー等が顧客へ直接販売する。"],["電子取引の安全","eKYC（電子本人確認）はオンラインで本人確認を行う。"],["EDI・データ交換標準","EDI（電子データ交換）は取引データを標準形式で交換する。"]],"note":"ネット注文と店舗受取り・返品を統合する例はOMO。"},"21-C05":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["無線接続","WPS（Wi-Fi Protected Setup：無線LAN接続設定支援）は対応機器の接続設定を簡便にする仕組み。"],["ワイヤレス給電・測位","ワイヤレス給電は電磁誘導などで接点なしに電力を伝える。"],["民生機器","スマートスピーカー、ウェアラブル、AR（拡張現実）グラス、MR（複合現実）グラス、VR（仮想現実）ゴーグル、セットトップボックス、HEMS等がある。"]],"note":"ルータを経由せず対応する機器同士で直接通信する方式はWi-Fi Direct。"},"21-C06":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["SoS・都市サービス","SoS（System of Systems：システムの集合体）は独立したシステムが連携して新しい全体機能を実現する。"],["エネルギー・移動","MaaS（Mobility as a Service：移動サービスの統合）は複数交通手段の検索・予約・決済などを一体化する。"],["機器制御・ソフトウェアファースト","ソフトウェアファーストはソフトウェアを中心に製品設計・価値向上を考える。"]],"note":"複数家庭の蓄電池を統合制御して需給調整する例はVPP。"},"22-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["経営資源と理念","人的資本経営は人材の能力を資本として捉え価値向上への投資を重視する。"],["企業形態","株式会社は株主が出資し原則出資額を限度とする有限責任。"],["統治と開示","コーポレートガバナンスは経営の監督・規律づけ。"]],"note":"人材教育・技能形成の投資と成果を事業戦略と結び付ける。"},"22-C02":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["管理理論","科学的管理法（テイラー）は作業を測定・標準化する。"],["意思決定","OODA（Observe, Orient, Decide, Act：観察・状況判断・決定・行動）ループは変化に応じ素早く判断を更新する。"],["動機・リーダーシップ","マズロは欲求段階、ハーズバーグの動機づけ・衛生理論は満足を生む要因と不満を防ぐ要因、XY理論は人間観の違い、期待理論は努力・成果・報酬の期待、PM理論は目標達成と集団維持、SL理論は部下の状況に応じた指導を扱う。"]],"note":"情報や時間が限られる中で十分な選択肢を選ぶのはサイモンの満足化。"},"22-C03":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["人材管理","OJT（職場内訓練）、リスキリング（新しい技能の習得）、コンピテンシー（成果に結び付く行動特性）、タレントマネジメント（人材の能力・配置・育成管理）、MBO（目標管理）、エンパワーメント（権限付与）、CDP（キャリア開発プログラム）を使い分ける。"],["勤務・組織","裁量労働制は法定要件を満たす業務でみなし労働時間等を扱う制度。"],["働き方と社会","DE&I（多様性・公平性・包摂）、ウェルビーイング、ワークエンゲージメント、EAP（従業員支援プログラム）、テレワーク、ワークシェアリング等は働く環境・能力活用に関係する。"]],"note":"従業員の新技術習得を支援するのはリスキリング。"},"23-C01":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["デジタル社会形成基本法","デジタル社会形成の基本理念・施策等を定める。"],["官民データ活用推進基本法","官民データの活用を総合的に推進するための基本法。"],["情報公開法","国の行政機関が保有する行政文書の開示請求制度を定める。"]],"note":"行政のオープンデータ活用と個人情報保護を両立する。"},"23-C02":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["情報の分類","ミスインフォメーションは誤情報（悪意を必ずしも伴わない）、ディスインフォメーションは意図的な偽情報、マルインフォメーションは真実の情報を害する目的で利用する情報。"],["情報環境","エコーチェンバーは同じ意見が反復・増幅される環境、フィルターバブルは個人化された情報選択で異なる情報に接しにくくなる状態。"],["ELSI・職業倫理","ELSI（Ethical, Legal and Social Issues：倫理的・法的・社会的課題）は新技術の社会的影響を検討する。"]],"note":"事実の一部を意図的に害する目的で公開する例はマルインフォメーション。"},"23-C03":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["会社法・金融商品取引法","会社法は会社の設立・機関・運営・組織再編等。"],["税・電子保存","法人税法は法人所得等への課税、消費税法は消費税。"],["通信傍受法","犯罪捜査のための通信傍受について対象犯罪や手続などを定める。"]],"note":"税務関連の電子取引記録の保存ルールを確認するには電子帳簿保存法。"},"23-C04":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["車両・航空","道路運送車両法は車両の保安基準や登録・検査等を規律する。"],["労働安全衛生法","職場での労働者の安全・健康確保を目的とする。"],["PL法（製造物責任法）","製造物の欠陥によって生命・身体・他の財産等に損害が生じた場合、製造業者等の責任を定める。"]],"note":"制御ソフトの欠陥が組込み機器の事故を生じさせた場合、製造物の欠陥を検討する。"},"23-C05":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["環境関連法","廃棄物処理法は廃棄物の適正処理、リサイクル法と呼ばれる各制度は再資源化等を促す。"],["国際適合","CEマークは対象製品が適用されるEU法令の要求に適合することを表示する仕組み。"],["輸出管理","外国為替及び外国貿易法（外為法）は安全保障貿易管理等を含む。"]],"note":"電子部品の有害物質含有を確認するときはRoHSの適用を検討する。"},"23-C06":{"type":"table","title":"目的と使い分け","items":[["観点","説明"],["標準化団体","JISC（日本産業標準調査会）はJIS等を審議し、JSA（日本規格協会）は標準化支援・普及などを行う。"],["開発・環境・評価規格","JIS X 0160はソフトウェアライフサイクルプロセス、JIS X 0170はシステムライフサイクルプロセスの規格。"],["データ標準と認証","EBCDIC（拡張2進化10進符号）はIBM系で使われてきた文字コード。"]],"note":"インターネットプロトコルの標準化を行う団体はIETF。"}};
const TEXTBOOK_ILLUSTRATIONS={"08-2":{"label":"標本化と量子化の模式図","content":"<svg class=\"figure-svg\" viewBox=\"0 0 340 208\" role=\"img\" aria-label=\"連続波形から一定間隔で値を取り出し、段階的な値に丸める図\"><g stroke=\"#cbd9de\" stroke-dasharray=\"4 4\"><path d=\"M34 35H322 M34 65H322 M34 95H322 M34 125H322 M34 155H322\"/></g><path d=\"M34 20V171H322\" fill=\"none\" stroke=\"#566d79\"/><text x=\"10\" y=\"15\" font-size=\"11\" fill=\"#435968\">振幅</text><text x=\"297\" y=\"184\" font-size=\"11\" fill=\"#435968\">時間</text><path d=\"M34 95 C55 26 80 26 104 95 S154 164 174 95 S220 26 244 95 S292 164 322 95\" fill=\"none\" stroke=\"#3b7391\" stroke-width=\"2.4\"/><g stroke=\"#73999f\" stroke-dasharray=\"3 3\"><path d=\"M34 95V171 M69 43V171 M104 95V171 M139 147V171 M174 95V171 M209 43V171 M244 95V171 M279 147V171\"/></g><g fill=\"#3b7391\"><circle cx=\"34\" cy=\"95\" r=\"3.4\"/><circle cx=\"69\" cy=\"43\" r=\"3.4\"/><circle cx=\"104\" cy=\"95\" r=\"3.4\"/><circle cx=\"139\" cy=\"147\" r=\"3.4\"/><circle cx=\"174\" cy=\"95\" r=\"3.4\"/><circle cx=\"209\" cy=\"43\" r=\"3.4\"/><circle cx=\"244\" cy=\"95\" r=\"3.4\"/><circle cx=\"279\" cy=\"147\" r=\"3.4\"/></g><path d=\"M34 95H69V35H104V95H139V155H174V95H209V35H244V95H279V155H314\" stroke=\"#b46c2b\" stroke-width=\"2\" fill=\"none\"/><text x=\"37\" y=\"201\" font-size=\"11\" fill=\"#3b7391\">● 標本（一定間隔）</text><text x=\"174\" y=\"201\" font-size=\"11\" fill=\"#96561f\">━ 量子化値の保持例</text></svg>","caption":"青い曲線がアナログ波形、点が標本化した値、橙色は量子化後の値を次の標本まで保持した模式図。標本化は時間を、量子化は振幅を離散化する。"},"14-1":{"label":"作業の依存関係（アローダイアグラム）","content":"<svg class=\"figure-svg\" viewBox=\"0 0 340 168\" role=\"img\" aria-label=\"AのあとBとCが並行し、両方が終わるとDへ。A、B、Dがクリティカルパス。\"><g fill=\"none\" stroke-width=\"2.5\"><path d=\"M75 83 L127 37 M207 37 L262 83\" stroke=\"#aa5930\"/><path d=\"M75 83 L127 127 M207 127 L262 83\" stroke=\"#7997a2\"/></g><g stroke=\"#aa5930\" fill=\"#fff5e9\"><rect x=\"5\" y=\"63\" width=\"70\" height=\"40\" rx=\"5\"/><rect x=\"127\" y=\"17\" width=\"80\" height=\"40\" rx=\"5\"/><rect x=\"262\" y=\"63\" width=\"73\" height=\"40\" rx=\"5\"/></g><rect x=\"127\" y=\"107\" width=\"80\" height=\"40\" rx=\"5\" fill=\"#f0f6f8\" stroke=\"#7997a2\"/><g font-size=\"13\" fill=\"#253a48\" text-anchor=\"middle\"><text x=\"40\" y=\"87\">A：2日</text><text x=\"167\" y=\"41\">B：5日</text><text x=\"167\" y=\"131\">C：2日</text><text x=\"298\" y=\"87\">D：3日</text></g><text x=\"167\" y=\"9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#9a542e\">クリティカルパス</text></svg>","caption":"作業DはBとCの両方の完了を待つので、先にCが終わっても全体工期は短くならない。"},"02-2":{"label":"スタックとキューの取り出し方向","content":"<svg class=\"figure-svg\" viewBox=\"0 0 340 177\" role=\"img\" aria-label=\"スタックはCから取り出す。キューはAから取り出す。\"><g font-size=\"14\" font-weight=\"bold\" fill=\"#24485a\"><text x=\"13\" y=\"16\">スタック（後入れ先出し）</text><text x=\"13\" y=\"102\">キュー（先入れ先出し）</text></g><g stroke=\"#7598a4\" fill=\"#fff\"><rect x=\"33\" y=\"32\" width=\"58\" height=\"40\"/><rect x=\"91\" y=\"32\" width=\"58\" height=\"40\"/><rect x=\"149\" y=\"32\" width=\"58\" height=\"40\" fill=\"#d7eee8\"/><rect x=\"33\" y=\"118\" width=\"58\" height=\"40\" fill=\"#d7eee8\"/><rect x=\"91\" y=\"118\" width=\"58\" height=\"40\"/><rect x=\"149\" y=\"118\" width=\"58\" height=\"40\"/></g><g font-size=\"17\" text-anchor=\"middle\" fill=\"#24485a\"><text x=\"62\" y=\"58\">A</text><text x=\"120\" y=\"58\">B</text><text x=\"178\" y=\"58\">C</text><text x=\"62\" y=\"144\">A</text><text x=\"120\" y=\"144\">B</text><text x=\"178\" y=\"144\">C</text></g><g stroke=\"#087575\" stroke-width=\"2.4\" fill=\"none\"><path d=\"M212 52H270 l-8 -6 M270 52 l-8 6\"/><path d=\"M32 138H7 l7 -6 M7 138 l7 6\"/></g><g fill=\"#087575\" font-size=\"12\"><text x=\"214\" y=\"38\">Cを取り出す</text><text x=\"35\" y=\"172\">Aを取り出す</text></g></svg>","caption":"同じA、B、Cの順で格納しても、スタックは最後に入れた側、キューは最初に入れた側から取り出す。"},"04-3":{"label":"直列と並列冗長構成","content":"<svg class=\"figure-svg\" viewBox=\"0 0 340 194\" role=\"img\" aria-label=\"直列は装置AとB両方、並列冗長はどちらか一方が動作すればよい。\"><g fill=\"#24485a\" font-size=\" function textbookFigure(id){
 const f=TEXTBOOK_FIGURES[id];if(!f)return '';
 let visual='';
 if(f.type==='table'){
  const [header,...body]=f.items;
  visual='<div class="figure-scroll"><table class="figure-table"><thead><tr>'+header.map(x=>'<th scope="col">'+E(x)+'</th>').join('')+'</tr></thead><tbody>'+body.map(row=>'<tr>'+row.map((x,i)=>i===0?'<th scope="row">'+E(x)+'</th>':'<td>'+E(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
 }else if(f.type==='bar'){
  const max=Math.max(...f.items.map(x=>Number(x[1])));
  visual='<div class="figure-bars">'+f.items.map(([label,value])=>'<div class="figure-bar-row"><span>'+E(label)+'</span><div class="figure-bar-track" aria-hidden="true"><div class="figure-bar-fill" style="width:'+Number(value)/max*100+'%"></div></div><b>'+E(value)+'</b></div>').join('')+'</div>';
 }else{
  const W=340,step=64,h=f.items.length*step-12;
  const node=f.items.map((item,i)=>{
   const y=i*step+2, chars=Array.from(item),lines=chars.length>22?[chars.slice(0,22).join(''),chars.slice(22).join('')]:[item];
   return '<rect x="12" y="'+y+'" width="316" height="43" rx="6" fill="'+(i===0?'#dcecee':i===f.items.length-1?'#e4f0eb':'#fff')+'" stroke="#89a8af"/>'+
    lines.map((line,k)=>'<text x="170" y="'+(y+(lines.length===1?26:18)+k*16)+'" text-anchor="middle" font-size="13" fill="#193c50">'+E(line)+'</text>').join('')+
    (i<f.items.length-1?'<path d="M170 '+(y+44)+' V'+(y+59)+' M165 '+(y+54)+' L170 '+(y+59)+' L175 '+(y+54)+'" fill="none" stroke="#477880" stroke-width="1.6" stroke-linecap="round"/>':'');
  }).join('');
  visual='<svg class="figure-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+E(f.items.join('、次に'))+'" viewBox="0 0 '+W+' '+h+'">'+node+'</svg>';
 }
 const illustration=TEXTBOOK_ILLUSTRATIONS[id];
 const extra=illustration?'<figure class="textbook-figure"><div class="figure-heading">模式図　'+E(illustration.label)+'</div>'+illustration.content+'<figcaption>'+E(illustration.caption)+'</figcaption></figure>':'';
 return extra+'<figure class="textbook-figure"><div class="figure-heading">図表 '+E(id)+'　'+E(f.title)+'</div>'+visual+'<figcaption>'+E(f.note)+'</figcaption></figure>';
}
