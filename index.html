urce Code Management：ソースコード管理）は変更履歴を追跡します。計算資源の稼働状況や不足も管理し、ツールの脆弱性にも対応します。"},{"heading":"利用実態の管理","body":"設計書や試験データの版、更新者、権限、持出し、変更履歴を記録します。ライセンスは利用者、機器、同時利用など契約単位に応じて使用状況を棚卸しします。構築の自動化に使う秘密鍵やトークンは公開せず安全に管理します。"}]},{"id":"13-Y02","title":"再利用・マッシュアップ・モバイル開発","explain":"<p>再利用の種類・サービス連携・モバイル開発を区別する。</p>","worked":"<p>店舗情報APIの障害時にも地図画面は表示し、店舗一覧が取得できないと通知する。</p>","prompt":"PWAなら全端末機能に無条件でアクセスできるか？","answer":"<p>できない。OS・ブラウザ対応や権限による。</p>","beginner":{"scenario":"地図と店舗情報のサービスを組み合わせてアプリを開発する。","trap":"再利用でも品質と権利の確認が必要。","quizId":"U-13-Y02"},"textbook":[{"heading":"再利用の種類","body":"ブラックボックス部品は内部を知らず公開仕様で利用し、ホワイトボックス部品は内部を理解・修正して利用します。ライブラリ、クラス、データ、業務処理の再利用は工数を減らせますが、仕様適合性、品質、保守期限、ライセンスの確認は必要です。"},{"heading":"サービス連携","body":"マッシュアップは複数提供元のAPI（Application Programming Interface：機能やデータを外部から利用する接点）を組み合わせ新しいサービスを作る方法です。呼出し回数制限、応答遅延、契約変更、外部障害に備えます。"},{"heading":"モバイル開発","body":"ネイティブアプリは端末OS向け、Webアプリはブラウザで動き、ハイブリッドアプリはWeb技術とネイティブ機能を組み合わせます。PWA（Progressive Web Apps：プログレッシブWebアプリ）は対応環境でホーム画面追加やオフライン機能を提供できます。画面サイズ、通信断、権限、配布条件も考慮します。"}]},{"id":"13-C05","title":"低コード・再利用・リバースエンジニアリング","explain":"<p>既存のアプリと外部サービスから新サービスを作る。</p><p>シラバスVer.7.2 本文75–76頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>地図データと店舗データを結合するのはデータマッシュアップ。</p>","prompt":"既存サービスの検索処理を組み合わせる方法と、既存プログラムの呼出し関係を調べる方法を区別せよ。","answer":"<p>前者はロジックマッシュアップで機能を組み合わせる。後者はコールグラフで既存実装の構造や変更影響を理解する。</p>","beginner":{"scenario":"既存のアプリと外部サービスから新サービスを作る。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-13-C05"},"textbook":[{"heading":"開発資産の再利用は何を減らすか","body":"ソフトウェア開発では、毎回同じ画面・処理を作ると費用や欠陥が増えます。既存の部品やサービスを利用し、必要な部分に集中することで開発効率を上げます。一方、部品の仕様、依存関係、権限、知財、更新責任を理解する必要があります。"},{"heading":"ローコード・ノーコードとパラメトリック部品","body":"ローコード・ノーコードは画面操作や設定などで実装する量を減らします。パラメトリック部品は設定値に応じて振舞いを変えられる再利用部品です。利用者がすばやく機能を作る場面に有効ですが、製品依存、拡張性、性能、アクセス制御、テスト、変更履歴の管理が課題になります。"},{"heading":"既存システムを理解する","body":"リバースエンジニアリングは既存実装を解析して構造や仕様などを明らかにする活動です。設計書が不足したシステムの改修等に役立ちます。コールグラフは関数などの呼出し関係を示し、どの部分に影響が及ぶかを調べる手掛かりになります。第三者の成果物を解析する場合は契約や知的財産上の制約を確認します。"},{"heading":"マッシュアップの統合対象","body":"マッシュアップは既存の複数資源を組み合わせて新しい価値を作る方法です。プレゼンテーションマッシュアップは画面上で情報を統合し、データマッシュアップは異なるデータを結合し、ロジックマッシュアップは処理機能を組み合わせます。API（Application Programming Interface: プログラム間の接続仕様）などを利用することがあり、統合する対象を区別します。"},{"heading":"モバイルで使うときの追加条件","body":"モバイルアプリでは端末の画面・操作・OSの違い、User-Agent（クライアント識別情報）、位置やカメラなどの権限、通信断、着信等による中断、配布・審査条件を考慮します。再利用部品が動くことだけでなく、実際の利用環境での動作と安全性を確かめます。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"13-Y03","title":"ソフトウェア知財とライセンス・技術的保護","explain":"<p>著作権と特許権・ライセンス管理・技術的保護を区別する。</p>","worked":"<p>外注プログラムの納品を受けただけでは著作権を当然に取得したとはいえない。</p>","prompt":"無料ライブラリの著作権表示は自由に削除できるか？","answer":"<p>ライセンスによる。</p>","beginner":{"scenario":"外注したプログラムと外部ライブラリを商品へ組み込む。","trap":"無償利用と無条件利用は異なる。","quizId":"U-13-Y03"},"textbook":[{"heading":"著作権と特許権","body":"プログラムの具体的表現は著作権の保護対象になり得ます。職務著作は法定要件を満たすと法人等が著作者になります。外注では権利帰属、譲渡範囲、利用許諾を契約で確認します。特許は技術的発明の登録による権利で、自社で独立に実装しても他人の特許を侵害し得ます。"},{"heading":"ライセンス管理","body":"ライセンサーは許諾する側、ライセンシーは受ける側です。用途、再配布、改変、利用人数、期間、表示義務などを調べます。OSS（Open Source Software：オープンソースソフトウェア）も条件があります。MITライセンスは所定の著作権・許諾表示を維持し、GPL系は配布形態に応じソース提供などの義務が生じる場合があります。"},{"heading":"技術的保護","body":"DRM（Digital Rights Management：デジタル著作権管理）は暗号化や利用権確認で複製・再生等を制御します。アクティベーションは正規利用の登録・確認、コピーガードは無断複製の抑制を目的とします。技術的保護と権利・契約の管理は別です。"}]},{"id":"13-Y05","title":"構成管理・SBOM・リリースの完全性","explain":"<p>構成識別とベースライン・SBOMの目的・完全性とリリースを区別する。</p>","worked":"<p>部品X2.0に問題があり、部品表でアプリv1.4がX2.0を使うと分かった。v1.4を優先調査する。</p>","prompt":"試験済みコードと配布されたコードの版が違うとき何を確認する？","answer":"<p>構成の物理的完全性とリリースの版の一致。</p>","beginner":{"scenario":"ライブラリの脆弱性が発覚した。配布中のどの版が影響を受けるか確認する。","trap":"SBOMは自動修正機能ではない。","quizId":"U-13-Y05"},"textbook":[{"heading":"構成識別とベースライン","body":"構成品目は管理対象として識別されたソース、設定、設計書、試験結果などです。ベースラインはレビューや承認を経て変更管理の基準として確立した構成です。品目の版、対応関係、変更理由、承認者、配布先を記録します。バージョン管理は履歴、構成管理は製品全体の組合せを扱います。"},{"heading":"SBOMの目的","body":"SBOM（Software Bill of Materials：ソフトウェア部品表）は製品に含まれる部品と版などを一覧化したものです。間接依存関係も追跡すれば脆弱性公表時に影響を絞れます。ただし部品表だけで脆弱性は解消されません。影響分析、更新、試験が別途必要です。"},{"heading":"完全性とリリース","body":"変更要求を登録、影響分析、承認、実装、試験し構成を更新します。機能的完全性は要求された機能等を満たすか、物理的完全性は必要なファイル・版・文書が揃い実物と記録が一致するかです。配布成果物を試験済みの版と対応づけ、切戻し可能にします。"}]},{"id":"13-Z01","title":"PWA：Webアプリを端末に近づける","explain":"<p>PWA（Progressive Web App：プログレッシブWebアプリ）はWeb技術を使い、対応するブラウザでインストール可能性やオフライン動作などを提供する設計。Web App Manifestはアプリ名・アイコン・表示方法等を宣言する。</p>","worked":"<p>通信なしで既に取得した教材を表示するにはサービスワーカーとキャッシュが候補。</p>","prompt":"Webページの要求を処理しオフライン時にキャッシュを返せる仕組みは？","answer":"<p>サービスワーカーが通信要求を扱い、キャッシュを使える。</p>","beginner":{"scenario":"学習サイトをスマホのホーム画面から使い、通信がなくても講義を読みたい。","trap":"PWAはすべてのブラウザでネイティブアプリと同一機能を保証しない。","quizId":"U-13-Z01"},"textbook":[{"heading":"基本原理","body":"PWA（Progressive Web App：プログレッシブWebアプリ）はWeb技術を使い、対応するブラウザでインストール可能性やオフライン動作などを提供する設計。Web App Manifestはアプリ名・アイコン・表示方法等を宣言する。"},{"heading":"仕組み・判断","body":"サービスワーカーはページと別の実行コンテキストで通信要求等を扱い、キャッシュした講義を返せる。ネットワーク優先とキャッシュ優先を用途で選ぶ。HTTPS等の安全なコンテキストが必要。バックグラウンド同期等はブラウザ対応に依存する。"},{"heading":"応用と注意点","body":"学習アプリなら静的教材をキャッシュし、学習記録を端末内保存する。新版でキャッシュ名を更新し、既存の記録キーは維持する。キャッシュ更新はアプリのデータ同期とは異なる。"}]},{"id":"13-3","title":"開発見積り・品質・リスク","explain":"<p>工数見積りには類推、専門家判断、ファンクションポイント法、モデルによる推定などがある。ファンクションポイントは入力、出力、照会、内部論理ファイル、外部インタフェースファイル等を数え、機能規模の目安を算出する。COCOMO系のモデルは規模などから工数を推定する。どの方法も前提・不確実性を明示することが大切。</p>\n<p>不具合密度は件数/規模などで示すが、検査条件の異なるチーム間で機械的に比較しない。リスクは発生可能性と影響度で評価し、優先順位に応じて予防・検知・回避策を計画する。</p>\n","worked":"<p>作業量が40人日なら2人で20日とは限らない。タスクの並列化可能性、作業者の調整コスト、手戻りを加味する。短縮可能な工程とクリティカルパスを分ける。</p>\n","prompt":"ファンクションポイントの大きさはプログラミング言語と行数で決まるか。","answer":"<p>主に利用者から見た機能の規模を測る。言語・コード行数とは異なる。</p>\n","beginner":{"scenario":"画面10個を1個2人日で作るなら実装見積り20人日。設計、試験、レビュー、調整などの作業も見積りに含める。","trap":"過去の生産性は条件が違うと使えない。見積りの前提と不確実性を明記する。","quizId":"U-13-3"},"textbook":[{"heading":"何を見積もるか","body":"規模は成果物の大きさ、工数は人が作業する量、期間は開始から終了までの時間、費用は人件費や設備等の支出です。40人日を4人で作業しても必ず10日で終わるわけではなく、作業依存関係や調整時間があります。"},{"heading":"見積りの方法","body":"類推見積りは似た過去案件を参考にし、積上げ見積りは作業ごとに見積って合計します。ファンクションポイント法は入力・出力・照会・論理ファイル等の機能量を数え、複雑さなどで重み付けして規模を推定します。COCOMOはソフトウェア規模等を使う経験的な工数推定モデルです。"},{"heading":"不確実性への対応","body":"楽観値、最頻値、悲観値など複数の想定で見積り、前提条件を記録します。リスクの高い技術を先に試し、実績から計画を更新します。見積りを確定値と扱わず、進捗や品質指標とともに管理します。"}]},{"id":"13-C03","title":"DevOps・MLOps・DevSecOps","explain":"<p>頻繁な変更を安全に公開し運用データを改善に生かす。</p><p>シラバスVer.7.2 本文74–75頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>モデルの入力分布を監視して性能低下時に再評価するのはMLOpsの活動。</p>","prompt":"Webアプリの運用と比較して、機械学習モデルの運用に追加で必要な管理を二つ説明せよ。","answer":"<p>データ・学習条件・モデルの版と評価結果の追跡、入力分布や性能の変化の監視、再学習と再評価、承認済みモデルへの切戻し等。MLOpsはコードに加えデータとモデルの品質を管理する。</p>","beginner":{"scenario":"頻繁な変更を安全に公開し運用データを改善に生かす。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-13-C03"},"textbook":[{"heading":"開発後も価値を届け続ける","body":"ソフトウェアは完成した時点で終わりではありません。実際の利用状況から障害や改善点が分かり、修正を安全に提供する必要があります。開発側が変更速度だけを、運用側が安定性だけを追求すると対立が生じます。DevOps（Development and Operations: 開発と運用の協働）はその分断を減らす考え方です。"},{"heading":"DevOpsの循環","body":"コードの変更を共有し、CI（Continuous Integration: 継続的インテグレーション）で自動ビルド・試験を行い、CD（Continuous Delivery: 継続的デリバリー）でいつでも安全にリリースできる状態にします。継続的デプロイメントは条件を満たした変更を自動で本番へ配置する方式です。運用監視から改善点を開発へ戻して循環させます。"},{"heading":"CALMSで組織を整理する","body":"CALMSはCulture（文化）、Automation（自動化）、Lean（無駄削減）、Measurement（測定）、Sharing（共有）です。自動化だけでは、部署間の協力や改善の判断基準がなければ効果は限定的です。DevOpsの実践に必要な観点をまとめた枠組みと理解します。"},{"heading":"DevSecOpsで安全性を組み込む","body":"DevSecOps（Development, Security and Operations）はセキュリティを最後の一括検査にせず、設計から運用まで組み込む考え方です。依存部品の脆弱性検査、自動テスト、アクセス制限、本番監視を各工程に配置します。速く提供することと安全性の確保を両立させます。"},{"heading":"MLOpsでモデルの劣化に対処する","body":"MLOps（Machine Learning Operations: 機械学習の運用管理）は、コードだけでなくデータ、学習条件、モデルの版と評価結果も管理します。運用中に入力分布や予測性能が変化すれば、監視して原因を調べ、必要に応じ再学習・評価して新モデルを配布します。DevOpsを土台としつつ、データとモデルの品質管理が追加される点が特徴です。"},{"heading":"データの変化を監視する","body":"データドリフトは運用中に入力データの分布が変化する現象です。分布が変化しても性能が必ず低下するわけではないため、可能な範囲で実際の性能も評価します。再学習モデルは従来版と比較・承認してから配備し、性能が悪化したら承認済みの版へ切り戻せるようにします。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"13-C04","title":"SRE・Four Keys・可観測性","explain":"<p>障害が少なく変更も速いサービスを作る。</p><p>シラバスVer.7.2 本文75頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>99.9%のSLOで30日全時間を対象なら許容停止は43.2分。</p>","prompt":"成功率目標99.5%、2万件の要求中120件が失敗した。許容失敗件数、実績成功率と判断を答えよ。","answer":"<p>許容は20000×0.005=100件。実績は19880/20000=99.4%。20件超過しSLO未達なので合意された方針に従い安定化を優先する判断が考えられる。</p>","beginner":{"scenario":"障害が少なく変更も速いサービスを作る。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-13-C04"},"textbook":[{"heading":"信頼性をどう管理するか","body":"SRE（Site Reliability Engineering: サイト信頼性エンジニアリング）は、ソフトウェア工学の手法でサービス運用の信頼性を管理する考え方です。変更を完全に止めることも、障害を無視して変更を続けることも事業に不利益です。どの程度の失敗を許容するかを数値で合意します。"},{"heading":"SLI・SLO・エラーバジェット","body":"SLI（Service Level Indicator: サービス水準指標）は観測値、SLO（Service Level Objective: サービス水準目標）は目標です。成功率99.9%を目標に10万要求を評価するなら、許容失敗は100件です。この余裕をエラーバジェットと呼び、超過状況に応じて新機能より安定化を優先するなどの判断を行います。SLA（Service Level Agreement: サービス水準合意）は顧客等との合意で、SLOと同じとは限りません。"},{"heading":"観測から原因を推定する","body":"オブザーバビリティ（可観測性）は、外部から得られる情報で内部状態を理解できる性質です。メトリクスは数値の推移、ログは個別の出来事、分散トレースは一つの要求が複数のサービスを通過した経路と時間を把握します。OpenTelemetryはこれらの観測データの計装・収集を標準化する枠組みであり、単独の監視画面ではありません。"},{"heading":"障害への備えを検証する","body":"カオスエンジニアリングは制御された条件で障害を注入し、設計した耐障害性が実際に働くかを検証する実践です。正常状態の仮説と中止条件を設け、影響範囲を制限します。無計画に本番を破壊することではありません。観測可能な状態で実験し、得られた問題を修正します。"},{"heading":"変更の速度と安定性を測る","body":"Four Keysは従来の代表的な四指標で、デプロイ頻度、変更のリードタイム、変更失敗率、サービス復旧時間を扱います。前二者は提供速度、後二者は安定性の観点です。DORA（DevOps Research and Assessment: 開発運用の研究・評価）の指標体系は更新され得ますが、試験では用語と測定対象を対応付けましょう。SREのサービス水準指標とは目的が異なり、開発・提供プロセスの改善に用います。"},{"heading":"復旧時間を測る","body":"MTTR（Mean Time to Repair または Mean Time to Restore等: 平均修復・復旧時間）は復旧等に要した時間の平均です。復旧に30分、60分、90分かかった3障害なら平均60分。測定の開始・終了時点や対象障害は定義に従います。従来のFour Keysでは変更に伴う障害の復旧時間を扱います。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}}],"beginnerIntro":"ソフトウェアをどの手順・体制で開発するかを学ぶ。開発手法、構成の識別、変更の承認を区別する。","studyGroups":[{"title":"開発モデルとチーム","body":"要求の不確実性に合わせた開発の進め方を選ぶ。","ids":["13-1","13-Y01","13-C01","13-C02","13-X01"]},{"title":"環境・部品・構成","body":"再利用、知財、変更履歴、依存関係、配布を管理する。","ids":["13-2","13-Y04","13-Y02","13-C05","13-Y03","13-Y05","13-Z01"]},{"title":"見積り・継続的改善","body":"品質・費用を測り、開発と運用を継続的に改善する。","ids":["13-3","13-C03","13-C04"]}]},{"id":14,"title":"プロジェクトマネジメント","group":"マネジメント","priority":"B選択候補","summary":"WBS、PERT、クリティカルパス、EVM、リスク・品質・調達。","lessons":[{"title":"スコープとWBS","body":"WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を管理可能な単位に分解する。完了条件・責任分担・依存関係を明確にする。","check":"工数表とWBSは同一ではない。"},{"title":"工程とクリティカルパス","body":"PERT（Program Evaluation and Review Technique：工程計画・評価技法）のネットワーク図で最長の所要経路がクリティカルパス。この経路の遅延は余裕がなければ全体遅延につながる。","check":"並行タスクの所要時間は単純な合計ではない。"},{"title":"進捗の定量評価","body":"EVM（Earned Value Management：出来高管理）でPV（計画価値）、EV（出来高）、AC（実コスト）を比較。CV=EV−AC、SV=EV−PV、CPI=EV/AC、SPI=EV/PV。","check":"符号の意味と、値が1より大きいか小さいかを解釈。"},{"title":"リスクと調達","body":"リスクは発生確率×影響度などで優先付け。対応は回避・低減・移転・受容。契約形態が変わると発注者と受注者のリスク負担が変わる。","check":"問題が起きてからの対応と事前リスク対応を分ける。"},{"title":"ステークホルダ","body":"関係者の権限、関心、コミュニケーション要件を把握する。変更要求の影響分析では費用・日程・品質・セキュリティに波及する部分を検討。","check":"単に全員に同じ資料を配るだけでは不十分。"}],"terms":[{"term":"WBS","definition":"成果物や作業を小さな単位へ階層的に分解する図"},{"term":"クリティカルパス","definition":"工程ネットワーク上で全体期間を決める最長経路"},{"term":"フロート","definition":"作業が遅れても全体完了を遅らせない余裕時間"},{"term":"PV","definition":"計画時点までに完了予定の作業に対応する予算価値"},{"term":"EV","definition":"実際に完了した作業を予算で評価した出来高"},{"term":"AC","definition":"実際に発生したコスト"},{"term":"CPI","definition":"コスト効率指数。EV÷AC"},{"term":"SPI","definition":"スケジュール効率指数。EV÷PV"},{"term":"リスク低減","definition":"起こる確率や被害の大きさを抑える対応"},{"term":"ステークホルダ","definition":"プロジェクトに影響する・影響を受ける利害関係者"}],"questions":[{"id":"Q14-01","chapter":14,"kind":"applied","q":"EV=80、AC=100、PV=90のときCPIは。","options":["0.8","0.9","1.1","1.25"],"correct":0,"explain":"CPI=EV/AC=0.8。予算超過方向。"},{"id":"Q14-02","chapter":14,"kind":"applied","q":"クリティカルパスの説明で正しいのは。","options":["作業数が最少の経路","遅延が全体日程に直結する経路","費用が最多の経路","人員数が最多の経路"],"correct":1,"explain":"全体工期を規定する経路は余裕時間がゼロになる。"},{"id":"Q14-03","chapter":14,"kind":"applied","q":"リスクに備えて保険へ加入することは主に。","options":["回避","低減","移転","受容"],"correct":2,"explain":"被害の金銭的負担を保険会社へ移す。"},{"id":"D14-01","chapter":14,"kind":"applied","q":"PV=100万円、EV=80万円、AC=120万円のとき、費用差異CVはいくらか。","options":["−40万円","−20万円","20万円","40万円"],"correct":0,"explain":"CV=EV−AC=80−120=−40万円。負の値は費用超過を示す。"},{"id":"D14-02","chapter":14,"kind":"applied","q":"並行経路A→C→Eが9日、B→D→Eが10日なら、資源制約を無視した最低完了日数はどれか。","options":["8日","9日","10日","19日"],"correct":2,"explain":"最長経路が完了を支配するので10日。短縮対象はクリティカルパス。"},{"id":"D14-03","chapter":14,"kind":"applied","q":"クリティカルパス以外の余裕のある作業を1日短縮した場合、通常どうなるか。","options":["必ず1日早く終わる","全体工期が変わらないことがある","品質が必ず向上する","工数は必ず2倍になる"],"correct":1,"explain":"工期は余裕ゼロの経路に依存するため、非クリティカル作業の短縮は工期に影響しない場合がある。"},{"id":"Q-14-X01","chapter":14,"kind":"applied","q":"変更要求の費用・納期・品質への影響を全体として調整する管理は？","options":["統合管理","時間管理のみ","調達管理のみ","構成管理のみ"],"correct":0,"explain":"統合管理。"},{"id":"Q-14-X02","chapter":14,"kind":"applied","q":"リスクを保険により外部に移す対応は？","options":["回避","低減","移転","受容"],"correct":2,"explain":"リスク移転。"},{"id":"U-14-1","chapter":14,"kind":"applied","q":"A-B-Dが10日、A-C-Dが7日で他制約なし。Cの総余裕は？","options":["3日","7日","10日","0日"],"correct":0,"explain":"Cを3日遅らせてもDの開始は変わらない。"},{"id":"U-14-2","chapter":14,"kind":"applied","q":"PV100、EV80、AC90万円のSPI（スケジュール効率指数）は？","options":["0.89","0.8","1.25","1.125"],"correct":1,"explain":"SPI=EV/PV=0.8。0.89はCPI（コスト効率指数）に近い。"},{"id":"U-14-3","chapter":14,"kind":"applied","q":"作業ごとに実行・説明責任・相談・報告先を整理する表は？","options":["RAID","BSC（バランストスコアカード）","RACI（役割分担表）","ER図"],"correct":2,"explain":"RACIはResponsible、Accountable、Consulted、Informedの役割を整理する。"},{"id":"U-14-X01","chapter":14,"kind":"applied","q":"費用・期間・範囲・品質を横断して変更を調整する管理は？","options":["時間管理のみ","資源管理のみ","調達管理のみ","統合管理"],"correct":3,"explain":"統合管理は複数領域の計画や変更を整合させる。"},{"id":"U-14-X02","chapter":14,"kind":"applied","q":"6人全員が互いに直接連絡する組合せは？","options":["15","6","12","36"],"correct":0,"explain":"n(n−1)/2=6×5/2=15。方向を区別しない経路数。"}],"deepIntro":"計画を立てることだけが管理ではない。進捗・費用・品質・リスクを測り、変化が起きたときの意思決定まで行う。","deep":[{"id":"14-Y01","title":"プロジェクト・プログラム・ポートフォリオ","explain":"<p>プロジェクトは期限と独自の成果を持つ活動です。プログラムは関連プロジェクトを協調して管理し、ポートフォリオは戦略に沿って投資対象を選び資源を配分する仕組みです。定常業務は繰り返し行います。</p>","worked":"<p>予約アプリと会員基盤の開発を共通の顧客体験改善のため統合するならプログラム。複数の投資案件から優先するものを選ぶのはポートフォリオ管理。</p>","prompt":"関連する複数のプロジェクトを一体管理し共通の便益を得る管理は？","answer":"<p>プログラムマネジメント。個別成果ではなく関連案件の協調による便益を目的とする。</p>","beginner":{"scenario":"店舗の予約アプリを3か月で開発する。公開後の日常運用とは管理の目的が異なる。","trap":"プロジェクトの完了とサービス運用の終了は同じではない。","quizId":"U-14-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"プロジェクトは期限と独自の成果を持つ活動です。プログラムは関連プロジェクトを協調して管理し、ポートフォリオは戦略に沿って投資対象を選び資源を配分する仕組みです。定常業務は繰り返し行います。"},{"heading":"仕組みと使い分け","body":"立上げ、計画、実行、監視・管理、終結という活動を通じて目標、制約、役割を調整します。スポンサーは資源や重要な意思決定を支援し、プロジェクト管理者は計画と実績を調整します。テーラリングは案件に応じ管理方法を調整することです。"},{"heading":"具体的な判断と手順","body":"予約アプリと会員基盤の開発を共通の顧客体験改善のため統合するならプログラム。複数の投資案件から優先するものを選ぶのはポートフォリオ管理。"},{"heading":"戦略とプログラム","body":"関連プロジェクトの相互依存を調整し、単独では得られない便益を実現するのがプログラム管理。PMO（プロジェクト又はプログラム管理支援組織）は方法・調整・支援等を提供するが、プログラム管理そのものと同義ではない。"}]},{"id":"14-X01","title":"プロジェクト管理の体系と統合","explain":"<p>プロジェクトは期限と独自の成果を持つ活動。PMBOK（プロジェクトマネジメント知識体系ガイド）は代表的な知識体系で、PMO（プロジェクト管理支援組織）は標準化や進捗支援を担う。立上げ・計画・実行・監視管理・終結を通じ、統合、ステークホルダ、スコープ、資源、時間、コスト、リスク、品質、調達、コミュニケーションを管理する。</p><p>統合管理は複数領域の計画・変更を整合させる。スコープは成果物と作業の範囲で、WBS（作業分解構成図）で作業を階層化する。資源管理では人材・設備の必要量・利用可能性を把握し平準化する。ステークホルダには関心と影響力に応じ情報共有や参画を調整する。</p>","worked":"<p>納期短縮要求があれば人員費・品質・他プロジェクトへの影響を評価し、承認された変更を統合計画に反映する。</p>","prompt":"変更要求の費用・納期・品質への影響を全体として調整する管理は？","answer":"<p>統合管理。</p>","beginner":{"scenario":"納期を1か月短縮すると追加費用や品質低下のリスクが生じる。変更要求を受けたら関連する計画を同時に見直す。","trap":"一つの指標だけ最適化してもプロジェクト全体が改善するとは限らない。","quizId":"U-14-X01"},"textbook":[{"heading":"プロジェクトと定常業務","body":"プロジェクトは期限を持ち独自の成果を作る活動、定常業務は継続的に繰返される活動です。立上げで目的・責任者・権限を明確にし、計画で範囲、日程、費用、品質等を決めます。実行・監視で実績と計画を比較し、終結で成果の受入・記録・教訓を整理します。"},{"heading":"管理体系","body":"PMBOKはプロジェクトマネジメントの知識体系ガイド、PMOは組織内で標準化・支援・監視等を担うプロジェクト管理支援組織です。統合管理は個別計画と変更を整合させます。スコープ管理では成果物・作業の範囲を決め、承認されない範囲拡大を防ぎます。"},{"heading":"変更の判断","body":"利用者から機能追加の要求が来たら、必要性だけでなく期間、費用、品質、リスク、資源への影響を評価します。承認された場合は計画・設計・テストを更新します。要求の受付と実施決定を区別することで無計画な追加を防ぎます。"}]},{"id":"14-C01","title":"プロジェクト管理規格とプロセス","explain":"<p>プロジェクトの管理手順と納品後の引継ぎを整理する。</p><p>シラバスVer.7.2 本文79頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>小規模開発でも承認と引渡しの確認は残し、不要な重複文書を整理する。</p>","prompt":"小規模開発で大規模プロジェクト用の手順が過剰になった。どの考え方で調整するか。全手順を省略してよいか。","answer":"<p>テーラリング。規模・リスク・契約に合わせ、必要な承認、安全性、リスク管理などの目的を維持しつつ手順を適合させる。PMOは調整を支援できる。</p>","beginner":{"scenario":"プロジェクトの管理手順と納品後の引継ぎを整理する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-14-C01"},"textbook":[{"heading":"プロジェクト管理の共通言語","body":"プロジェクトは決められた目的のために一時的に行う活動です。複数の担当者が異なる理解で計画・管理すると、範囲や責任、完了条件に認識差が生じます。管理規格や知識体系は共通の概念と管理活動の整理に役立ちます。"},{"heading":"規格と知識体系の違い","body":"JIS Q 21500はプロジェクトマネジメント等に関する概念・指針の規格系列です。版により対象が異なるため、特定の版の用語を別の版へ無条件に当てはめません。PMBOK（Project Management Body of Knowledge: プロジェクトマネジメント知識体系）は管理の知識・実践を体系化したものです。規格や知識体系を採用すれば自動で成功するわけではありません。"},{"heading":"開始から終了までの管理","body":"開始時に目的と権限を明確にし、計画で範囲・日程・費用・リスク等を整理します。実行中は成果と計画の差を監視・管理し、必要な変更を判断します。終結時には受入条件の達成、成果の引渡し、残課題、学んだ知識の記録を確認します。引渡しのプロセスは成果を受け手へ移す活動、支援のプロセスは管理や専門的支援などを提供する活動として整理できます。"},{"heading":"PMOとテーラリング","body":"PMO（Project Management Office: プロジェクト管理を支援する組織）は標準方法、教育、情報の集約、横断的な調整を支援する体制の例です。テーラリングは規模、複雑性、リスク、契約等に応じて管理方法を適合させることです。必要な管理をなくすのではなく、目的に対して過不足のない手順にすることです。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"14-Y02","title":"プロジェクト憲章・統合変更管理","explain":"<p>プロジェクト憲章はプロジェクトを正式に認め、目的、主要制約、管理者の権限等を明確にします。全体計画は範囲・日程・費用・品質などの計画を整合させます。</p>","worked":"<p>追加機能に10人日必要なら、納期延長、別機能削減、追加資源などを比較して承認を得る。</p>","prompt":"承認済み計画に影響する要求を受けた直後の適切な対応は？","answer":"<p>要求を記録し影響を分析する。変更の影響を評価してから権限者の承認を受ける。</p>","beginner":{"scenario":"開発途中に顧客が新機能を求めた。納期と予算も影響するため担当者だけで約束できない。","trap":"顧客の希望が出た時点で無条件に計画変更しない。","quizId":"U-14-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"プロジェクト憲章はプロジェクトを正式に認め、目的、主要制約、管理者の権限等を明確にします。全体計画は範囲・日程・費用・品質などの計画を整合させます。"},{"heading":"仕組みと使い分け","body":"変更要求は記録し、費用・納期・品質・リスクへの影響を評価します。CCB（Change Control Board：変更管理委員会）など所定の権限者が判断し、承認後に計画、ベースライン（承認済み基準）、要件、試験を更新します。終結時には教訓を記録します。"},{"heading":"具体的な判断と手順","body":"追加機能に10人日必要なら、納期延長、別機能削減、追加資源などを比較して承認を得る。"},{"heading":"変更を受け入れるかの比較","body":"予算100万円、納期30日の計画に10万円・3日分の追加機能が要求された場合、予算と納期を増やす、既存範囲を縮小する、追加要求を次期に回す等の選択肢を比較します。承認後は変更前の基準も記録し、誰がどの根拠で承認したかを追跡できるようにします。"}]},{"id":"14-Y03","title":"ステークホルダーの分析と関与","explain":"<p>ステークホルダーは成果や活動に影響を及ぼす、または影響を受ける人・組織です。要求、影響力、関心、期待、反対理由を特定します。</p>","worked":"<p>経営者には費用対効果、事務担当には業務フロー、患者には操作性の評価を求める。</p>","prompt":"関係者の関心と影響力を整理する主な目的は？","answer":"<p>関与方法を適切に設計する。必要な関与、協議、情報提供を相手に合わせるため。</p>","beginner":{"scenario":"病院の予約システムでは患者、医師、事務、経営者が異なる希望を持つ。","trap":"役職が高い人だけがステークホルダーではない。","quizId":"U-14-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ステークホルダーは成果や活動に影響を及ぼす、または影響を受ける人・組織です。要求、影響力、関心、期待、反対理由を特定します。"},{"heading":"仕組みと使い分け","body":"登録簿に役割・関心・影響を記録し、影響力と関心が高い人には密な協議を行います。影響力が低くても利用者の要求や権利を無視しません。関与の状態は計画中にも変化するため更新します。"},{"heading":"具体的な判断と手順","body":"経営者には費用対効果、事務担当には業務フロー、患者には操作性の評価を求める。"},{"heading":"関与状況の変化をどう管理するか","body":"関係者を未認識・抵抗・中立・支持・主導などの状態で整理し、現在と望ましい関与の差を考えます。例えば現場職員がシステム導入に反対している場合は、反対の原因が操作負担か、職務の変化への不安かを聴き取ります。単に説明回数を増やすのではなく、試作品で業務負担を計測し、要求を調整します。"}]},{"id":"14-Y04","title":"スコープ・WBS・受入基準","explain":"<p>プロダクトスコープは成果物の機能や特性、プロジェクトスコープは成果を作るための作業範囲です。WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を階層的に分解します。</p>","worked":"<p>決済機能を設計、実装、試験に分解し、試験完了条件を正常・異常系の合格とする。</p>","prompt":"作業範囲を漏れなく階層的に整理する道具は？","answer":"<p>WBS。WBSは成果物・作業の分解。日程や依存は別途管理する。</p>","beginner":{"scenario":"ECサイトの改修を依頼され、決済だけでなく在庫連携も含むかを明確にする。","trap":"WBSは作業の階層構造であり、それだけでは日付や依存関係を表さない。","quizId":"U-14-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"プロダクトスコープは成果物の機能や特性、プロジェクトスコープは成果を作るための作業範囲です。WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を階層的に分解します。"},{"heading":"仕組みと使い分け","body":"最下位の管理単位であるワークパッケージに担当、費用、完了条件を設定します。WBS辞書に詳細を記録し、受入基準で成果を確認します。追加要求が正式承認なく増えることをスコープクリープといいます。"},{"heading":"具体的な判断と手順","body":"決済機能を設計、実装、試験に分解し、試験完了条件を正常・異常系の合格とする。"},{"heading":"WBSと受入れのつながり","body":"注文機能という成果物を注文登録、取消、確認メールに分解し、各機能の設計・実装・試験の作業を定義します。WBS辞書には範囲と完了基準、担当を記載します。作業が終わったことと、顧客が成果物を受け入れたことは別に確認します。"},{"heading":"対象群と成果物","body":"スコープ管理は範囲定義・WBS（Work Breakdown Structure：作業分解構成図）作成等。活動期間の見積りは時間管理、コスト見積り・予算作成はコスト管理。WBSは日程表そのものではない。"}]},{"id":"14-1","title":"WBS・スケジュール・クリティカルパス","explain":"<p>WBS（Work Breakdown Structure：作業分解構成図）は成果物や作業を管理可能な単位に分解する。見積り、担当、実績を対応付ける基礎となる。ガントチャートは日程、アローダイアグラム（PERT）は作業の先行関係と所要時間を示す。最早開始時刻ESと最遅開始時刻LSの差が余裕（フロート）。プロジェクト完了までの所要時間を決める余裕ゼロの経路をクリティカルパスという。</p>\n","worked":"<p>A(3日)→C(4日)→E(2日)で9日、B(5日)→D(3日)→E(2日)で10日の2経路があるとき、両経路のEが共通の作業なら最長経路10日が完了日を決める。短縮するなら原則クリティカルパス上の作業を対象にする。資源制約がある場合は単純な最長経路だけでは決まらない。</p>\n","prompt":"クリティカルパス以外の作業を1日短縮すると、必ず完成が1日早まるか。","answer":"<p>ならない。余裕のある作業を短縮しても全体完了時間は変わらない場合がある。</p>\n","beginner":{"scenario":"Aが2日、A後にBが5日とCが2日を並行実施、両方終了後にDが3日。A-B-Dは10日、A-C-Dは7日。最長経路が全体工期を決める。","trap":"クリティカルパスは最短経路ではなく、依存関係上最長の所要時間の経路。","quizId":"U-14-1"},"textbook":[{"heading":"作業を分けて依存関係を描く","body":"WBS（Work Breakdown Structure：作業分解構成図）は成果物や必要な作業を階層的に分け、担当と見積りを具体化するためのものです。作業間の開始・終了条件はネットワーク図で表し、ガントチャートは横棒で期間を示します。"},{"heading":"クリティカルパスを計算する","body":"Aの終了後にBとCを並行し、両方の終了後にDを実施する場合、各経路の期間を足します。A=2日、B=5日、C=2日、D=3日ならA-B-Dは10日、A-C-Dは7日。全体工期は最長の10日です。Cを3日遅らせてもDの開始は変わらないので余裕があります。"},{"heading":"工期を短縮する","body":"クリティカルパス上の作業を短縮することが基本です。クラッシングは追加資源で作業を短縮、ファストトラッキングは本来順次の作業を一部並行化する方法です。費用増加や手戻りのリスクを評価し、短縮後はクリティカルパスを再計算します。"}],"walkthrough":{"heading":"最早時刻と最遅時刻を計算する","body":"Aは2日、A後にB（5日）とC（2日）、BとCの両方が終わってからD（3日）を実施します。時刻0から始め、最早開始はA=0、B=C=2、D=max(7,4)=7、終了10です。終了時刻10を固定して後ろから戻るとDは7開始、Bは2開始、Cは5開始まで許容されます。AはBとCの両方に間に合わせる必要があるので最遅開始0です。最遅開始と最早開始の差が総余裕時間です。Cは3日、それ以外は0日なのでA-B-Dがクリティカルパスです。","cols":["作業","所要日数","最早開始","最遅開始","総余裕"],"rows":[["A","2","0","0","0"],["B","5","2","2","0"],["C","2","2","5","3"],["D","3","7","7","0"]]}},{"id":"14-Y05","title":"資源計画・責任分担・チーム形成","explain":"<p>資源には人材、機器、設備、予算などがあります。必要量、時期、能力、利用可能量を照合し、確保と配分を行います。</p>","worked":"<p>同じ技術者が同時に二作業を担当する場合、一方を遅らせるか別の技術者を確保する。</p>","prompt":"RACIのAが示すものは？","answer":"<p>最終説明責任を負う者。AはAccountable、RはResponsible。責任と作業を分ける。</p>","beginner":{"scenario":"設計と試験が同じ担当者に集中して納期に間に合わない。","trap":"人を増やせば工期が必ず反比例して短くなるわけではない。","quizId":"U-14-Y05"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"資源には人材、機器、設備、予算などがあります。必要量、時期、能力、利用可能量を照合し、確保と配分を行います。"},{"heading":"仕組みと使い分け","body":"RACIは実行責任（Responsible）、最終説明責任（Accountable）、相談先（Consulted）、報告先（Informed）を区別する責任分担表です。資源平準化は資源制約に合わせて日程を調整するため、終了日が変わる場合もあります。"},{"heading":"具体的な判断と手順","body":"同じ技術者が同時に二作業を担当する場合、一方を遅らせるか別の技術者を確保する。"},{"heading":"資源配分の計算","body":"A作業が3日、B作業が2日で両方とも同じ担当者を必要とすると、作業間依存がなくても担当者が一人なら5日必要です。二人目を確保できれば並行作業で3日に短縮できる場合があります。ただし引継ぎ、教育、作業の分割可能性を考えます。"}]},{"id":"14-Z01","title":"チーム形成・タックマンモデル","explain":"<p>タックマンモデルはチームの発展を成立期（Forming）、動乱期（Storming）、安定期（Norming）、遂行期（Performing）、散会期（Adjourning）に整理する。全チームが必ず同じ順に進むという法則ではない。</p>","worked":"<p>価値観の違いが明らかになり意見を主張し合う段階は動乱期。</p>","prompt":"新しいメンバーの加入後、既に成果を出していたチームで作業方針の衝突が増えた。タックマンモデルではどの段階に戻った可能性があり、管理者はどう支援すべきか。","answer":"<p>動乱期の可能性がある。共通目標や役割、意思決定の基準を再確認し、対立の理由を調整する。遂行期から戻ることはあり、対立だけで失敗と断定しない。</p>","beginner":{"scenario":"新しい開発チームで担当者間の意見が衝突している。","trap":"対立がある段階を必ず失敗と判断しない。","quizId":"U-14-Z01"},"textbook":[{"heading":"チームは集まっただけでは機能しない","body":"プロジェクトでは専門性や経験が異なる人が同じ目標に向けて協力します。初めは目的・役割・意思決定方法が十分共有されていないため、意見の衝突が起こり得ます。タックマンモデルはチームが協働できる状態へ発展する過程を整理したモデルです。"},{"heading":"成立期と動乱期","body":"成立期（Forming）では互いを知り、目標や役割を理解する段階です。管理者は目的と進め方を明確にします。動乱期（Storming）では意見・価値観・役割の違いが表面化します。対立を隠すだけでは解決しないため、共通目標と判断基準を確認し、議論を調整します。"},{"heading":"安定期と遂行期","body":"安定期（Norming）では規範や役割、協力方法への合意が形成されます。遂行期（Performing）ではメンバーが自律的に協力し成果を出せます。遂行期では細かな指示を増やすより、障害の除去や必要な資源の提供が有効な場合があります。"},{"heading":"散会期とモデルの限界","body":"散会期（Adjourning）は活動が終わりチームが解散する段階です。成果の引渡しや知識移転、振返りを行います。タックマンモデルは全チームが必ずこの順で進むという法則ではありません。人員交代や目標変更で以前の段階へ戻ることもあるため、状態を観察して支援方法を選びます。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"段階の名称ではなく観察・支援の対応関係。"}},{"id":"14-Y06","title":"PERT・余裕時間・日程短縮","explain":"<p>依存関係をネットワーク図にし、開始から終了までの各経路の所要時間を合計します。最長経路がクリティカルパスで、標準的な前提ではその遅れが全体の遅れにつながります。</p>","worked":"<p>A→B→Dは9日、A→C→Dは11日。Bには2日の余裕がある。Cを2日短縮すると両経路が9日で並ぶ。</p>","prompt":"Aが2日、その後Bが5日とCが3日で並行し、両方完了後にDが4日かかる。最短完了日数とCの総余裕を求めよ。","answer":"<p>2+max(5,3)+4=11日。Cは5日目に終えられるがDの開始は7日目なので総余裕は2日。A→B→Dがクリティカルパス。</p>","beginner":{"scenario":"Aが3日、その後Bが4日またはCが6日で、両方が終わるとDが2日かかる。","trap":"最短経路がクリティカルパスではない。","quizId":"U-14-Y06"},"textbook":[{"heading":"作業には順序の制約がある","body":"プロジェクトの作業時間を全て足すと、同時に進められる作業まで直列に扱ってしまいます。反対に、最も長い一作業の時間だけを使うと、前後に必要な作業を無視します。依存関係をネットワーク図にして、どの作業が終われば次を始められるかを整理します。"},{"heading":"最早時刻とクリティカルパス","body":"A（3日）の後にB（4日）とC（6日）が並行し、両方の完了後にD（2日）を実施するとします。Aは3日目に終わり、Bは7日目、Cは9日目に終わります。Dは遅い方を待つので9日目に始まり11日目に終わります。最長経路A→C→Dがクリティカルパスです。資源の追加制約がない前提で、ここが遅れると全体完了も遅れます。"},{"heading":"余裕時間を逆算する","body":"最遅時刻は完了期限から逆向きに計算します。Dを9日目に始める必要があるので、Bは9日目までに終えればよく、最早完了7日目との差2日が余裕です。Cは余裕0です。総余裕時間は最遅開始−最早開始（または最遅終了−最早終了）で求められます。複数作業が同じ余裕を共有する場合もあるので自由に足さないようにします。"},{"heading":"PERTで不確実な時間を見積もる","body":"PERT（Program Evaluation and Review Technique: 計画評価技法）は作業時間の不確実性を考慮する方法です。楽観時間a、最頻時間m、悲観時間bの三点見積りでは期待時間(a+4m+b)/6を使う代表的な方式があります。期待時間は必ず達成できる時間ではありません。"},{"heading":"日程短縮は最長経路から","body":"クラッシングは資源追加などで作業時間を縮め、ファストトラッキングは本来順次の作業を一部重ねます。前者は費用増、後者は手戻りリスクを伴います。Cを2日短縮すると二つの経路がともに9日になり、以後Cだけ短くしても全体は短くなりません。短縮のたびにクリティカルパスを再計算します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"単独出題の参照切れと最早・最遅の導出。"}},{"id":"14-2","title":"EVM・進捗と費用の統合管理","explain":"<p>EVM（Earned Value Management：出来高管理）は、計画価値PV（Planned Value：計画した作業の予算価値）、出来高EV（Earned Value：実際に完了した作業の予算価値）、実コストAC（Actual Cost：実際の支出）で管理する。進捗差異SV＝EV−PV、費用差異CV＝EV−AC。進捗効率SPI＝EV/PV、費用効率CPI＝EV/AC。負の差異や1未満の指数は予定超過・費用超過を示す。</p>\n<p>BAC（Budget at Completion：完成時総予算）、EAC（Estimate at Completion：完成時総費用見積り）を使い、現在の効率が続くという<strong>仮定</strong>のもとでEAC≈BAC/CPIと予測することがある。</p>\n","worked":"<p>PV=100万円、EV=80万円、AC=120万円ならSV=−20万円（計画に対し作業遅れ）、CV=−40万円（出来高に対し費用超過）。SPI=0.8、CPI≈0.667。ACとPVを直接比べて進捗を判断しない。</p>\n","prompt":"EV=PVであればコストは必ず予定どおりか。","answer":"<p>違う。EVは出来高の予算価値。ACがEVより大きければ費用超過。</p>\n","beginner":{"scenario":"予算100万円分の作業を予定し、実際に80万円分を完成、費用90万円。計画との差EV−PV=−20万円、費用差EV−AC=−10万円。","trap":"EVは実際に使った金額ではなく、完成した作業の予算上の価値。","quizId":"U-14-2","lab":{"title":"EVMの値を一つずつ解釈する","problem":"PV（計画価値）120万円、EV（出来高）90万円、AC（実コスト）100万円。進捗・コストの差と効率を求める。","steps":["PVは現在までに予定した作業の予算価値、EVは実際に完了した作業の予算価値、ACは実際に支払った費用。","SV=EV−PV=90−120=−30万円。進捗が計画より遅れている。","CV=EV−AC=90−100=−10万円。費用効率が悪い。","SPI=EV/PV=0.75、CPI=EV/AC=0.9。どちらも1未満。"],"answer":"SV−30万円、CV−10万円、SPI0.75、CPI0.9","check":"EVを実費と取り違えない。SVは金額で表したスケジュール差であり遅延日数ではない。"}},"textbook":[{"heading":"出来高を金額で表す理由","body":"作業ごとに規模と予算が違うため、単に作業数で進捗を測ると正確ではないことがあります。EVM（Earned Value Management：出来高管理）は計画・実績を予算上の価値で比較します。PVは現在までに予定した作業の予算価値、EVは完了した作業の予算価値、ACは実際に掛かった費用です。"},{"heading":"差と効率を計算する","body":"SV=EV−PVはスケジュール差、CV=EV−ACはコスト差です。SPI=EV/PV、CPI=EV/ACは効率指数で、1未満は計画に対する遅れ・コスト効率悪化を示します。PV100、EV80、AC90ならSV−20、CV−10、SPI0.8、CPI約0.89。SVは金額単位で日数ではありません。"},{"heading":"将来の費用を見積もる","body":"BACは完了時の予算総額、EACは完了時の見積り総費用、ETCは残作業の見積り費用です。現在の費用効率が続くと仮定する場合、EAC=BAC/CPIなどで予測します。残作業の条件が変わる場合は別の見積り方法を使います。式の前提を問題文で確認します。"}]},{"id":"14-Y07","title":"コスト予測・EVMの計算","explain":"<p>EVM（Earned Value Management：出来高管理）ではPV（計画価値）、EV（出来高）、AC（実コスト）を比較します。SV=EV−PVは日程差異、CV=EV−ACはコスト差異です。</p>","worked":"<p>PV=100、EV=80、AC=120万円ならSV=−20、CV=−40、SPI=0.8、CPI=約0.67。遅延かつ予算超過傾向。</p>","prompt":"PV=120万円、EV=100万円、AC=80万円。今後も現在の費用効率が続く場合のSPI、CPI、BAC=500万円に対するEACを求めよ。","answer":"<p>SPI=100/120≈0.83で日程不利、CPI=100/80=1.25で費用効率は良い。EAC=500/1.25=400万円。日程と費用は別の基準で判定する。</p>","beginner":{"scenario":"計画では100万円分の作業を終える時点だが、実際に完了した作業の予算価値は80万円、支出は120万円だった。","trap":"ACが小さいだけでは順調とはいえない。出来高との比較が必要。","quizId":"U-14-Y07"},"textbook":[{"heading":"予定・成果・支出を同じ尺度で比較する","body":"プロジェクトで予算をいくら使ったかだけを見ても順調か分かりません。予定していた作業量と実際に終えた作業量を予算額に換算して比較し、進捗と費用を同時に管理するのがEVM（Earned Value Management: 出来高管理）です。"},{"heading":"三つの値を定義する","body":"PV（Planned Value: 計画価値）はその時点までに終える予定の作業の予算額です。EV（Earned Value: 出来高）は実際に終えた作業に割り当てられていた予算額です。AC（Actual Cost: 実コスト）はその作業に実際にかかった金額です。EVは売上や実支出ではありません。"},{"heading":"日程差異と費用差異","body":"SV（Schedule Variance: 日程差異）=EV−PV。負なら予定の作業量より少ないことを示します。CV（Cost Variance: 費用差異）=EV−AC。負なら成果に割り当てられた予算以上の費用を使ったことを示します。SVの単位は時間ではなく金額です。"},{"heading":"比率で効率を見る","body":"SPI（Schedule Performance Index: 日程効率指数）=EV/PV、CPI（Cost Performance Index: 費用効率指数）=EV/ACです。1を基準に比較し、1未満なら不利です。例えばPV100万円、EV80万円、AC120万円ならSPI=0.8、CPI=約0.67。日程も費用も不利です。"},{"heading":"完了時の費用を予測する","body":"BAC（Budget at Completion: 完了時総予算）を総予算、EAC（Estimate at Completion: 完了時総費用見積り）を最終費用の予測とします。今までの費用効率が今後も続くならEAC=BAC/CPIと推定できます。今後は予算どおりと仮定するならAC+(BAC−EV)です。どの仮定が与えられたかを確認し、式を使い分けます。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"14-Z02","title":"工数・引継ぎ・増員時の費用計算","explain":"<p>人月は1人が1か月作業する工数の単位。開発に使える工数と、給与が発生する工数を分ける。引継ぎ中は費用が発生しても開発の進捗に寄与しないという条件なら、開発工数から除く。</p>","worked":"<p>単価80万円/人月なら4.5×80=360万円増。</p>","prompt":"旧2人が残り2か月で離脱し、直前0.5か月を引継ぎに使う。新規人員は引継ぎ中に開発せず、その後2か月開発する。必要人数と、全員同単価60万円/人月のとき費用増を求めよ。","answer":"<p>失う工数は2×2+2×0.5=5人月。必要人数は5÷2を切り上げ3人。費用増は(3×2.5−2×2)×60=210万円。引継ぎ中の新規人員の費用も含める。</p>","beginner":{"scenario":"途中で人員が離脱するが、納期を守る必要がある。","trap":"引継ぎは開発工数に含めないが人件費には含める場合がある。","quizId":"U-14-Z02"},"textbook":[{"heading":"工数と期間を区別する","body":"工数は作業量を人月などで表したものです。1人が1か月作業する量を1人月とする前提では、3人が2か月なら6人月です。しかし人を増やしても必ず同じ割合で日程が短縮されるわけではありません。試験で作業効率が一定とされている場合のみ、人月の単純計算を使います。"},{"heading":"失われる開発工数を整理する","body":"元の計画で2人が残り3か月働く予定だったのに離脱し、直前0.5か月も開発をせず引継ぎに使うなら、失う工数は2×3+2×0.5=7人月です。新規人員が引継ぎ後の3か月だけ開発するなら、7÷3=2.33…なので人数を切り上げ3人必要です。"},{"heading":"費用は雇用期間から求める","body":"開発に寄与しない引継ぎ期間でも人件費は発生します。新規3人を3.5か月雇う費用は10.5人月分です。元計画と比べ旧2人の離脱後3か月分（6人月分）の費用が減るので、増分は10.5−6=4.5人月分となります。旧人員の引継ぎ期間はもともとの支払期間に含まれるため、増分として二重に数えません。"},{"heading":"問題の条件を表にして確かめる","body":"期間を引継ぎ前・引継ぎ中・離脱後に分け、各期間の人数、開発への寄与、費用負担を元計画と変更後で比較します。必要人数の計算は開発工数、追加費用の計算は支払工数を用います。単価が異なるときは人月を先に合算せず、それぞれ金額にして比較します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"実働と支払工数の混同を防ぐ。"}},{"id":"14-Y08","title":"リスク登録簿・定量評価・対応","explain":"<p>リスクは不確実な出来事が目標に影響する可能性です。発生確率、影響、担当、対応策、兆候をリスク登録簿に記録します。すでに起きた事象は課題として扱います。</p>","worked":"<p>10％×200万円=20万円の期待損失。代替APIの準備は停止リスクの軽減策になる。</p>","prompt":"外部委託契約で一部の損失負担を相手へ移す対応は？","answer":"<p>リスク移転。損失負担の一部を他者へ移す。残留リスクは残り得る。</p>","beginner":{"scenario":"外部API停止の可能性が10％あり、そのときの追加費用は200万円と見積もられた。","trap":"保険への加入はリスクの原因自体をなくすわけではない。","quizId":"U-14-Y08"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"リスクは不確実な出来事が目標に影響する可能性です。発生確率、影響、担当、対応策、兆候をリスク登録簿に記録します。すでに起きた事象は課題として扱います。"},{"heading":"仕組みと使い分け","body":"負のリスクへの代表的な対応は回避、軽減、移転、受容です。期待金額は確率×影響額で比較できますが、重大事故などは期待値だけで判断しません。対策後に残る残留リスクも追跡します。"},{"heading":"具体的な判断と手順","body":"10％×200万円=20万円の期待損失。代替APIの準備は停止リスクの軽減策になる。"},{"heading":"期待値で選択肢を比較する","body":"発生確率20％、損失100万円なら期待損失は20万円。対策費8万円で確率が5％へ低下すると、対策後の期待費用は8＋5＝13万円で、期待値の差は7万円です。ただし個人情報漏えいや人命への影響のように低確率でも重大な事象は、法令・安全制約などを別の判断基準とします。"}]},{"id":"14-Z03","title":"デシジョンツリーと期待金額評価","explain":"<p>EMV（Expected Monetary Value：期待金額価値）は各結果の金額とその発生確率を掛けて合計する。決定ノードは選択肢、機会ノードは不確かな結果を表す。各機会ノードからの確率の合計は1。</p>","worked":"<p>確率0.7で利益50万円、0.3で損失10万円なら期待値32万円。</p>","prompt":"確実に10万円の利益を得る案Aと、60%で30万円の利益、40%で10万円の損失となる案Bがある。期待利益が最大の案を選ぶならどちらか。期待値と実現値の違いも説明せよ。","answer":"<p>Aは10万円、Bは0.6×30−0.4×10=14万円なのでB。14万円は確率を重みとする平均であり、一回の結果は30万円または−10万円。損失許容度を別に評価する。</p>","beginner":{"scenario":"需要が不確かな事業について複数の投資案を比較する。","trap":"収益と純利益を混同せず、投資額を二重に引かない。","quizId":"U-14-Z03"},"textbook":[{"heading":"不確実な結果を比較する","body":"意思決定では、選べる行動と、その後に確率的に起こる結果を区別します。デシジョンツリー（決定木）では、決定ノードに行動の選択肢、機会ノードに不確かな結果を枝として描きます。各結果に確率と金額を対応付け、末端から計算します。"},{"heading":"期待金額価値の定義","body":"EMV（Expected Monetary Value: 期待金額価値）は、各結果の純利益に発生確率を掛けて合計した金額です。式はEMV=Σpᵢvᵢ。一つの機会ノードから分岐する結果が相互排他的で全結果を含むなら、確率の合計は1です。期待値は一回の取引で実際に得られる金額とは限りません。"},{"heading":"収益と利益の違いを整理する","body":"投資40万円、成功時収益100万円（確率0.6）、失敗時収益20万円（0.4）なら、純利益は60万円と−20万円です。期待利益は0.6×60+0.4×(−20)=28万円です。収益の期待値68万円から共通の投資40万円を一度だけ引いても同じになります。問題の数値が既に利益なら投資を再度引いてはいけません。"},{"heading":"木を末端から評価する","body":"選択後に新しい意思決定がある場合、末端に近い機会ノードの期待値を計算し、決定ノードでは目的に合う最良の枝を選び、上流へ戻ります。リスク中立で金額最大化という前提なら期待利益の最大値を選びます。資金制約、最大損失、リスク回避、安全要件は期待値とは別に確認する必要があります。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"確率の意味、収益と純利益、条件付き判断。"}},{"id":"14-3","title":"人的資源・コミュニケーション・ステークホルダー","explain":"<p>プロジェクトには発注者、利用者、開発者、運用担当、監督官庁など立場の違う関係者がいる。利害・意思決定権限・期待・必要情報を整理し、コミュニケーション計画を定める。変更要求をそのまま実装するとスコープクリープ（範囲の無秩序な拡大）が起きるため、影響分析と承認を通す。</p>\n<p>リスク登録簿には原因、発生確率、影響、兆候、責任者、対応策を記録する。品質・納期・予算のトレードオフで、何を守るべきか合意する。メンバー増員で必ず工期短縮するわけではなく、教育・調整・並列化の限界がある。</p>\n","worked":"<p>開発終盤に追加帳票を要求された場合、工数・運用・受入試験への影響を見積り、変更管理で承認し、基準計画を更新する。担当者判断で納期を維持すると品質低下を招く可能性がある。</p>\n","prompt":"リスクが発生した後に記録するものだけをリスク登録簿と呼ぶか。","answer":"<p>違う。未発生のリスクを先に特定し対策を計画する。</p>\n","beginner":{"scenario":"開発者と利用部門で要求の解釈が違えば手戻りが生じる。誰が実行・承認し、誰に相談・報告するかを明確にする。","trap":"関係者全員に全情報を送るだけでは適切なコミュニケーション管理にならない。","quizId":"U-14-3"},"textbook":[{"heading":"誰が何をするか","body":"プロジェクトには開発者、利用部門、責任者、委託先など多くのステークホルダ（利害関係者）がいます。必要な技能・人数・時期を計画し、過負荷や待ち時間を調整します。作業の実行者、最終責任者、相談先、報告先をRACI（役割分担表）などで明確にします。"},{"heading":"情報共有の設計","body":"全員に全情報を送るのではなく、相手ごとに必要な情報・頻度・方法を決めます。問題や変更要求を早期に記録し、責任者が判断できる形で報告します。n人の全組合せの通信経路はn(n−1)/2なので人数増加に伴い調整の負担も増えます。"},{"heading":"対立を解決する","body":"期限、費用、品質などに関する利害の違いを整理し、目的と判断基準を共有します。要求変更時には承認と影響評価を行い、決定事項と未決事項を区別します。人的資源の追加が必ず工期短縮になるわけではありません。"}]},{"id":"14-X02","title":"リスク・品質・調達・コミュニケーション管理","explain":"<p>リスクは発生可能性と影響を評価し、回避・低減・移転・受容などの対応を決め、担当・期限をリスク登録簿に記録する。品質管理では要求品質、品質保証、検査、改善を区別し、欠陥密度や管理図で異常を調べる。品質コストには予防・評価・内部失敗・外部失敗の費用がある。</p><p>調達管理では内製か外注か、契約方式、選定基準、検収、契約変更を扱う。固定価格契約では範囲変更の管理が重要、実費精算型はコストの監視が重要。コミュニケーション管理は誰に何をいつどの媒体で伝えるか決める。n人が全員相互通信する経路はn(n−1)/2。</p>","worked":"<p>6人のチームの相互通信経路は15。1人追加すると21となり6経路増える。</p>","prompt":"リスクを保険により外部に移す対応は？","answer":"<p>リスク移転。</p>","beginner":{"scenario":"外注先の遅延リスクに対し別業者を確保するのは低減、危険な機能を中止するのは回避、保険は移転の例。","trap":"リスクを受容する場合も判断者、条件、監視方法を決める。","quizId":"U-14-X02"},"textbook":[{"heading":"リスクを扱う","body":"リスクは将来の不確実な事象で、発生可能性と影響から優先度を決めます。回避は原因となる活動をやめ、低減は可能性・影響を抑え、移転は保険や契約等で分担し、受容は対策費との比較などから認める判断です。リスク登録簿に担当者・対応・監視条件を記録します。"},{"heading":"品質の計画と評価","body":"品質管理では要求する品質基準と測定方法を定め、プロセスの妥当性を確認し、成果物を検査します。品質コストは予防、評価、内部失敗、外部失敗に分けられます。早期のレビューや試験で後工程の修正費用を抑えられる場合があります。"},{"heading":"調達と連絡","body":"外部調達では内製との比較、契約方式、選定基準、成果物の受入、変更手続を決めます。固定価格契約は費用を予測しやすい一方、範囲変更の管理が重要です。実費精算型では費用実績の監視が重要です。関係者との連絡では責任・頻度・伝達内容を明示します。"}]},{"id":"14-Y09","title":"品質計画・品質保証・品質管理","explain":"<p>品質計画は目標と評価方法を決める活動です。品質保証は適切なプロセスや基準が整い実施されるよう確かめ、品質管理は成果物の測定と不適合への処置を行います。</p>","worked":"<p>不具合の60％が入力検証に集中していれば、その原因を分析して設計レビューとテストを改善する。</p>","prompt":"原因別の不良件数を降順で表示し優先対策を選ぶ図は？","answer":"<p>パレート図。頻度の大きい原因を可視化し、優先的に対策する。</p>","beginner":{"scenario":"納品されたアプリに不具合が多い。検査を増やすだけでなく作り方も見直す。","trap":"品質保証と最後の動作試験は同義ではない。","quizId":"U-14-Y09"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"品質計画は目標と評価方法を決める活動です。品質保証は適切なプロセスや基準が整い実施されるよう確かめ、品質管理は成果物の測定と不適合への処置を行います。"},{"heading":"仕組みと使い分け","body":"特性要因図は原因候補、パレート図は重要な原因の優先順位、管理図は工程の異常を調べます。品質コストは予防・評価・内部失敗・外部失敗に区分できます。検査のみでなく再発防止を行います。"},{"heading":"具体的な判断と手順","body":"不具合の60％が入力検証に集中していれば、その原因を分析して設計レビューとテストを改善する。"},{"heading":"検査と予防を区別する","body":"設計レビューや教育は不具合の予防に役立ち、テストは不具合を発見する評価活動です。出荷前の修正は内部失敗コスト、出荷後の障害対応は外部失敗コストです。出荷後の費用が大きい工程では、単に試験数を増やすだけでなく、不具合を作り込む原因を除く施策を検討します。"}]},{"id":"14-Y10","title":"調達判断・契約形態・供給者評価","explain":"<p>自製・購入分析では自社の能力、費用、納期、機密性、保守を比較します。調達計画では仕様書、選定基準、契約条件、受入条件、供給者管理を定めます。</p>","worked":"<p>価格だけでなく技術適合性、保守体制、実績、セキュリティ、撤退時の対応を点数化して選ぶ。</p>","prompt":"外部調達の評価で最も適切な方法は？","answer":"<p>事前に定めた複数の基準で比較する。価格・品質・保守等を合意した基準で比較する。</p>","beginner":{"scenario":"開発の一部を委託する。仕様の確実性と費用の予測可能性から契約を選ぶ。","trap":"最安値を選べば必ず総費用が最低になるとは限らない。","quizId":"U-14-Y10"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"自製・購入分析では自社の能力、費用、納期、機密性、保守を比較します。調達計画では仕様書、選定基準、契約条件、受入条件、供給者管理を定めます。"},{"heading":"仕組みと使い分け","body":"固定価格契約は範囲が明確なら費用を見通しやすい一方、変更時の調整が必要です。実費精算型は不確実な仕事に対応しやすいが支出の監視が必要です。契約の価格方式と日本法上の請負・準委任は別の分類です。"},{"heading":"具体的な判断と手順","body":"価格だけでなく技術適合性、保守体制、実績、セキュリティ、撤退時の対応を点数化して選ぶ。"},{"heading":"選定表の作り方","body":"価格・技術・運用の重みを30％・40％・30％とし、各項目を100点満点で評価します。A社が90・60・80点なら75点、B社が70・95・80点なら83点です。価格だけならA社でも総合ではB社が上回ります。情報セキュリティ等の必須要件は加点とは分け、満たさなければ候補外とする方法もあります。"},{"heading":"契約方式とリスク負担","body":"範囲が明確で変更なしの定額契約では、受託側の見積り誤差や人員不足による追加原価は一般に受託側負担となる。実費精算契約では合意した適格費用を発注側が負担する。実際の責任は契約条項・原因・法令による。"}]},{"id":"14-Y11","title":"コミュニケーション計画と伝達経路","explain":"<p>誰に、何を、いつ、どの手段で、誰が提供するかを決めるのがコミュニケーション計画です。進捗、問題、決定事項を記録し、重要な問題を権限者へ報告します。</p>","worked":"<p>5人なら5×4÷2=10経路、6人なら15経路。人数増加に合わせ連絡経路を整理する。</p>","prompt":"8人の全員同士の通信経路数は？","answer":"<p>28。8×7÷2=28。組を二重計上しない。</p>","beginner":{"scenario":"10人のチームで全員が全員と直接連絡すると情報の重複や漏れが生じる。","trap":"メール送信だけでは相手の理解を保証しない。","quizId":"U-14-Y11"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"誰に、何を、いつ、どの手段で、誰が提供するかを決めるのがコミュニケーション計画です。進捗、問題、決定事項を記録し、重要な問題を権限者へ報告します。"},{"heading":"仕組みと使い分け","body":"双方向型は会議などで相互確認、プッシュ型はメール等で送信、プル型は共有サイト等から必要な人が取得します。全員同士の双方向経路数はn(n−1)/2です。"},{"heading":"具体的な判断と手順","body":"5人なら5×4÷2=10経路、6人なら15経路。人数増加に合わせ連絡経路を整理する。"},{"heading":"連絡手段とエスカレーションの設計","body":"障害など急いで合意が必要な場合は双方向の連絡を行い、後で決定事項を書面に残します。進捗報告はプッシュ型で配信し、設計書など長期参照する情報はプル型の共有場所で版管理します。重大な問題は報告の閾値、相手、期限を先に決めると担当者の判断待ちを減らせます。"}]}],"beginnerIntro":"決められた範囲・期限・費用で成果を出すための管理を学ぶ。工程図と出来高管理では数値の意味を明確にする。","studyGroups":[{"title":"目的と統合","body":"プロジェクトの目的と関係者を定義し、変更を統合管理する。","ids":["14-Y01","14-X01","14-C01","14-Y02","14-Y03"]},{"title":"範囲・体制・日程","body":"作業範囲を分解し、責任と依存関係から日程を計画する。","ids":["14-Y04","14-1","14-Y05","14-Z01","14-Y06"]},{"title":"費用とリスク","body":"進捗・費用の差と不確実性を数値で判断する。","ids":["14-2","14-Y07","14-Z02","14-Y08","14-Z03"]},{"title":"品質・調達・意思疎通","body":"計画の実行を支える管理手法を選ぶ。","ids":["14-3","14-X02","14-Y09","14-Y10","14-Y11"]}]},{"id":15,"title":"サービスマネジメント","group":"マネジメント","priority":"B選択候補","summary":"SLA、インシデントと問題管理、変更・構成管理、BCP。","lessons":[{"title":"サービスレベル","body":"SLA（Service Level Agreement：サービス水準合意）は提供者と利用者が稼働率・応答時間などの目標を合意した文書。SLM（Service Level Management：サービスレベル管理）は監視・評価・改善する活動。","check":"SLAの数値は測定条件まで定める。"},{"title":"インシデントと問題","body":"インシデント管理は早期のサービス復旧を目標とし、問題管理は根本原因を特定して再発を防止する。回避策による暫定復旧と恒久対策を区別。","check":"原因不明でも暫定復旧してよい場合がある。"},{"title":"変更とリリース","body":"変更管理はリスクと影響を評価し承認する。リリース管理は変更内容を適切な時期・手順で展開する。CMDB（Configuration Management Database：構成管理データベース）は関連資産・構成の把握を支援。","check":"資産管理と構成管理は対象の関係性の扱いが異なる。"},{"title":"継続性","body":"BCP（Business Continuity Plan：事業継続計画）にはRTO（Recovery Time Objective：目標復旧時間）とRPO（Recovery Point Objective：目標復旧時点）が重要。RPOを短くするとデータ損失を小さくできる。","check":"RTOは時間、RPOはデータがどの時点まで戻るか。"}],"terms":[{"term":"SLA","definition":"サービス提供者と利用者が合意するサービス水準"},{"term":"SLM","definition":"サービスレベルを定義・測定・改善する管理活動"},{"term":"インシデント管理","definition":"障害等の影響を抑えサービスを早く復旧させる活動"},{"term":"問題管理","definition":"インシデントの根本原因を特定し再発を防ぐ活動"},{"term":"変更管理","definition":"システム変更の影響・リスク・承認を管理すること"},{"term":"CMDB","definition":"ITサービスの構成品目とそれらの関係を管理するデータベース"},{"term":"BCP","definition":"災害等でも重要業務を継続・早期再開する計画"},{"term":"RTO","definition":"重要業務を復旧すべき目標時間"},{"term":"RPO","definition":"データの復旧で許容する過去への戻り時点の目標"},{"term":"可用性管理","definition":"サービスを必要時に利用できるよう目標と実績を管理する活動"}],"questions":[{"id":"Q15-01","chapter":15,"kind":"applied","q":"障害直後、暫定回避策でサービスを早期復旧する活動は。","options":["問題管理","インシデント管理","調達管理","企業統治"],"correct":1,"explain":"まずサービスを復旧させるのはインシデント管理。"},{"id":"Q15-02","chapter":15,"kind":"applied","q":"毎日0時にバックアップし午後15時の障害で前日0時のデータまでしか戻せない。データ損失時間は。","options":["9時間","15時間","24時間","39時間"],"correct":3,"explain":"前日0時から当日15時なので39時間。最終バックアップ時刻を確認する。"},{"id":"Q15-03","chapter":15,"kind":"applied","q":"RTO=4時間の意味として適切なのは。","options":["データを4時間前まで戻す","目標として4時間以内に復旧する","障害は4時間に一回起こる","平均修理時間が常に4時間"],"correct":1,"explain":"RTOは復旧するまでの目標時間。"},{"id":"D15-01","chapter":15,"kind":"applied","q":"30日間のSLA稼働率99.9%で、計画停止等を除外しない単純計算の許容停止時間はどれか。","options":["4.32分","43.2分","72分","432分"],"correct":1,"explain":"30×24×60×(1−0.999)=43.2分。測定定義により実際のSLAの扱いは変わる。"},{"id":"D15-02","chapter":15,"kind":"applied","q":"DB接続枯渇でサービス停止中、接続プール拡張で暫定復旧する活動は何に近いか。","options":["インシデント管理","特許調査","研究開発","商標登録"],"correct":0,"explain":"早期のサービス復旧がインシデント管理の主目的。接続リークの根本原因調査は問題管理。"},{"id":"D15-03","chapter":15,"kind":"applied","q":"SLOとSLIの関係として適切なものはどれか。","options":["両方とも請求書","SLOは目標値、SLIは測定指標","SLOは測定値、SLIは目標値","両者は常に一致する"],"correct":1,"explain":"目標と観測値を区別し、SLA等で合意内容と測定方式を管理する。"},{"id":"Q-15-X01","chapter":15,"kind":"applied","q":"停電時に瞬時の電力供給を維持する設備は？","options":["DNS","UPS","WAF","CMDB"],"correct":1,"explain":"UPS。長時間運転には別途発電設備などを組み合わせる。"},{"id":"U-15-1","chapter":15,"kind":"applied","q":"サービス提供者と利用者の間でサービス水準を合意するものは？","options":["SLM","SLA","CMDB","WBS"],"correct":1,"explain":"SLAはService Level Agreement（サービスレベル合意）。SLMは水準管理。"},{"id":"U-15-2","chapter":15,"kind":"applied","q":"同一原因による障害再発を減らすため原因を分析する管理は？","options":["インシデント管理のみ","サービス要求管理","問題管理","容量管理"],"correct":2,"explain":"問題管理は根本原因の特定と再発防止を担う。"},{"id":"U-15-3","chapter":15,"kind":"applied","q":"利用者の問合せや障害報告を受け付ける一元窓口は？","options":["構成管理台帳","監査部門","DBMS","サービスデスク"],"correct":3,"explain":"サービスデスクは利用者との接点として問合せや要求を扱う。"},{"id":"U-15-X01","chapter":15,"kind":"applied","q":"電源、空調、入退室など施設設備を管理する活動は？","options":["ファシリティマネジメント","問題管理のみ","構成管理のみ","データ正規化"],"correct":0,"explain":"施設・設備を管理し、サービス運用の基盤を支える。"}],"deepIntro":"サービス管理は障害を直すだけでなく、利用者へ約束した価値を継続的に提供する営み。","deep":[{"id":"15-1","title":"ITIL・サービス価値・SLA","explain":"<p>ITIL（Information Technology Infrastructure Library：ITサービス管理の実践指針）はサービスの価値共創、継続的改善、インシデント管理などを整理する。SLA（Service Level Agreement：サービス水準合意）は顧客と提供者の間で利用できる時間、応答時間、サポート範囲、測定方法などを定める合意。SLO（Service Level Objective：サービス目標値）は具体的な目標、SLI（Service Level Indicator：サービス指標）は実際の測定値。</p>\n<p>合意値が99.9%なら、月30日で許容停止時間は30×24×60×0.001＝43.2分。ただし計画停止を含むかなどはSLA定義に依存する。「何を分母とするか」が重要。</p>\n","worked":"<p>30日間で無停止を要求するなら99.9%のSLAは不十分。実稼働時間の定義、監視地点、計画停止除外の規則を確認し、現実的な合意にする。</p>\n","prompt":"SLOとSLIは同じか。","answer":"<p>違う。SLOが目標、SLIが観測された指標。</p>\n","beginner":{"scenario":"月30日で稼働率99.9%の合意なら許容停止時間は30×24×60×0.001＝43.2分。対象外時間の条件があれば別途考える。","trap":"SLAは合意、SLMはその合意を管理する活動。測定条件も重要。","quizId":"U-15-1"},"textbook":[{"heading":"サービスの価値とは","body":"ITサービスは利用者が目的を達成できるよう機能や運用を提供するものです。システムを納品するだけでなく、使える状態を維持し利用者に価値を届けることが重要です。ITIL（ITサービスマネジメントの実践体系）はサービス価値と継続的改善を重視します。"},{"heading":"サービス水準を測る","body":"SLA（サービスレベル合意）は提供者と利用者が合意する水準、SLO（サービスレベル目標）は具体的な目標値、SLI（サービスレベル指標）は実測する指標です。稼働率99.9%なら30日全時間を対象として許容停止43.2分です。計画停止を含むかなど測定条件を合意します。"},{"heading":"継続的に管理する","body":"SLM（サービスレベル管理）は合意した水準を監視・報告・改善する活動です。サービスカタログは利用可能なサービスや条件を示します。顧客への報告では目標未達の事実、原因、対応、改善計画を区別し、単に平均値だけで品質を評価しません。"}],"walkthrough":{"heading":"稼働率を停止時間に変換する","body":"月30日の全時間を対象とし、障害が12分、18分、24分発生し重複しなかったとします。対象時間は30×24×60＝43200分、停止は54分なので稼働率は(43200−54)/43200＝0.99875、99.875%です。目標99.9%は許容停止時間43.2分で、実績54分は超過しています。複数障害の停止時間が重なるときは二重に数えないこと、計画停止を除外する契約なら分母・分子をその条件に合わせることが重要です。","cols":["項目","計算結果"],"rows":[["対象時間","43200分"],["許容停止時間","43.2分"],["実際の停止時間","54分"],["稼働率","99.875%"],["目標達成","未達"]]}},{"id":"15-Y01","title":"サービス価値・SLA/SLO/SLI","explain":"<p>サービスマネジメントは利用者の成果を支援するため、人・技術・手順を管理する活動です。ITIL（IT Infrastructure Library：ITサービス管理の実践体系）は価値の共創や改善を扱い、ISO/IEC 20000はサービス管理システムの規格群です。</p>","worked":"<p>月間の成功応答率を指標として測り99.9％を目標にし、顧客との契約に条件を定める。</p>","prompt":"サービスの実際の成功応答率を表すものは？","answer":"<p>SLI。SLIは観測する指標。SLOは目標、SLAは合意。</p>","beginner":{"scenario":"予約サービスが稼働していても検索が30秒かかれば利用者は困る。","trap":"SLAは測定値そのものではない。","quizId":"U-15-Y01"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"サービスマネジメントは利用者の成果を支援するため、人・技術・手順を管理する活動です。ITIL（IT Infrastructure Library：ITサービス管理の実践体系）は価値の共創や改善を扱い、ISO/IEC 20000はサービス管理システムの規格群です。"},{"heading":"仕組みと使い分け","body":"SLA（Service Level Agreement：サービスレベル合意）は合意内容、SLO（Service Level Objective：目標）は達成目標、SLI（Service Level Indicator：指標）は測定値・測定方法です。対象、時間帯、測定点、除外条件も定めます。"},{"heading":"具体的な判断と手順","body":"月間の成功応答率を指標として測り99.9％を目標にし、顧客との契約に条件を定める。"}]},{"id":"15-Y02","title":"サービス計画・資産・構成・供給者管理","explain":"<p>サービスポートフォリオは計画中、運用中、廃止などのサービス全体を管理し、サービスカタログは利用可能なサービス、条件、依存関係を示します。資産管理は所有・費用・契約などを扱います。</p>","worked":"<p>障害時、構成管理情報で停止したDBを使うサービスを特定し、カタログで利用部門を調べる。</p>","prompt":"利用者が使えるサービスを調べる資料と、あるサーバ停止時に影響するサービスを調べる資料をそれぞれ答え、違いを説明せよ。","answer":"<p>前者はサービスカタログ、後者はCMDB等にある構成品目の依存関係情報。カタログはサービスの内容・利用条件、構成管理は技術的な構造と依存関係を管理する。</p>","beginner":{"scenario":"社内IT部門が新しいチャットとファイル共有サービスを提供する。","trap":"資産台帳と構成管理情報は目的が異なる。","quizId":"U-15-Y02"},"textbook":[{"heading":"サービスを継続的に提供するための管理","body":"サービス管理は個々のサーバだけでなく、利用者が必要な成果を得られるようにサービス全体を計画・設計・運用・改善する活動です。計画中、運用中、廃止するサービスを把握し、費用、品質、資源、供給者、変更、リスクを関連付けます。"},{"heading":"ポートフォリオとカタログ","body":"サービスポートフォリオは組織が提供または計画するサービス全体を管理するための情報です。サービスカタログは利用者などに提供可能なサービスの内容、利用条件、窓口等を示します。投資の優先順位を決めるための情報と、利用者がサービスを選ぶための情報は同じではありません。"},{"heading":"資産管理と構成管理","body":"資産管理は機器やライセンス等の所有、契約、費用、ライフサイクルを管理します。構成管理はCI（Configuration Item: 構成品目）とその依存関係を管理します。CMDB（Configuration Management Database: 構成管理データベース）などに、どのサービスがどのサーバ・ソフトウェア・ネットワークに依存するかを記録します。資産の価格だけでは障害の影響を判断できません。"},{"heading":"管理活動をサービスの流れで整理する","body":"需要と予算、供給者、サービス水準、容量・可用性・継続性・セキュリティを計画し、変更・リリース管理で新規サービスの設計・移行を統制します。運用中はインシデント対応で復旧し、サービス要求を処理し、問題管理で根本原因を調べます。各活動で共通の構成情報を使い、変更後は情報も更新します。"},{"heading":"影響分析の考え方","body":"故障したデータベースがどのサービスに使われるかは構成情報から追跡し、影響を受ける利用者・部門はサービスカタログ等の関連情報から特定します。復旧優先度はサービス水準と業務影響を基に決めます。構成情報が古い場合は正しい判断ができないので、変更との連動が必要です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"用語の羅列をサービスライフサイクルに再構成。"}},{"id":"15-C01","title":"サービス需要・費用・変更承認","explain":"<p>サービスの利用量が増加し設定変更が必要になる。</p><p>シラバスVer.7.2 本文86–90頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>定期的な低リスクの証明書更新を事前承認した手順で行うのは標準変更の例。</p>","prompt":"低リスクで手順と承認があらかじめ定められた変更は？","answer":"<p>正解は「標準変更」。標準変更・緊急変更・PIR：標準変更は低リスクで事前承認された定型変更、通常変更は個別評価、緊急変更は迅速な承認が必要な変更。PIR（Post Implementation Review：実施後レビュー）は結果や予期せぬ影響を評価する。緊急でも記録と事後評価は必要。</p>","beginner":{"scenario":"サービスの利用量が増加し設定変更が必要になる。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-15-C01"},"textbook":[{"heading":"需要管理・費用配賦","body":"需要管理は利用状況や将来需要を把握し能力・供給計画に反映する。費用配賦は共通費を利用量など合理的な基準で部門へ割り当てる。予算・会計・供給者管理と連携する。"},{"heading":"RFC・CAB","body":"RFC（Request for Change：変更要求）に理由、影響、リスク、試験、切戻しを記載する。CAB（Change Advisory Board：変更諮問委員会）は変更の評価・助言を行う。承認権限は変更の種類に応じて定める。"},{"heading":"標準変更・緊急変更・PIR","body":"標準変更は低リスクで事前承認された定型変更、通常変更は個別評価、緊急変更は迅速な承認が必要な変更。PIR（Post Implementation Review：実施後レビュー）は結果や予期せぬ影響を評価する。緊急でも記録と事後評価は必要。"}]},{"id":"15-X01","title":"サービス管理システム・評価・設備","explain":"<p>ITIL（ITサービス管理の実践体系）はサービス価値を重視する。ISO/IEC 20000-1はサービスマネジメントシステムの要求事項。サービスカタログは利用可能なサービスを示し、SLA（サービスレベル合意）は提供条件、SLO（サービスレベル目標）は測定目標を表す。サービス要求、構成、リリース、変更、インシデント、問題、供給者、可用性、容量、継続性を管理する。</p><p>PDCA（計画・実行・評価・改善）で運用を改善する。サービスデスクは利用者窓口、監視は異常を検知する。ファシリティマネジメントは電源・空調・設備・入退室・防災などを管理する。UPS（無停電電源装置）は停電直後の電力を一時供給し、自家発電への切替や安全停止を支援する。</p>","worked":"<p>月30日の稼働率目標99.9%なら許容停止時間は43.2分（全時間が対象の場合）。</p>","prompt":"停電時に瞬時の電力供給を維持する設備は？","answer":"<p>UPS。長時間運転には別途発電設備などを組み合わせる。</p>","beginner":{"scenario":"停電時にUPSがすぐ給電し、長期停電では発電機へ切替えるか安全に停止する。空調停止でもサーバ温度上昇に注意する。","trap":"UPSは通常、無期限に電力を供給する装置ではない。","quizId":"U-15-X01"},"textbook":[{"heading":"サービス管理を仕組みにする","body":"ISO/IEC 20000-1はサービスマネジメントシステムの要求事項を定めます。組織の方針と目標を設定し、計画・運用・評価・改善を繰返すことで一貫したサービス管理を行います。PDCA（計画・実行・評価・改善）は改善の考え方の一つです。"},{"heading":"設備の管理","body":"ファシリティマネジメントは施設・設備・環境を管理します。サーバ室では電源、空調、入退室管理、火災対策などが重要です。UPS（無停電電源装置）は停電直後の給電を支援し、発電機へ切替えるまでの時間や安全停止に必要な時間を確保します。"},{"heading":"改善を評価する","body":"稼働率、復旧時間、同一原因の再発件数、変更失敗率などを測り改善を確認します。問い合わせ数の増減だけでは障害の増減を判断できないため、何を数えるかを明確にします。監視データを使って設備容量・運用手順を見直します。"}]},{"id":"15-2","title":"インシデント・問題・変更管理","explain":"<p>インシデントはサービスの中断や品質低下など、通常運用からの逸脱。最優先は早期のサービス復旧で、原因が未解明でも暫定回避策を使うことがある。問題管理は繰り返す障害等の根本原因を調査し、再発防止を図る。インシデント解決と根本原因除去は別の活動。</p>\n<p>変更管理は本番変更のリスク・影響を評価し、承認・実施・結果を記録する。構成管理データベース（CMDB：Configuration Management Database）は構成アイテムと依存関係を管理し、障害影響や変更範囲の把握に役立つ。</p>\n","worked":"<p>DB接続が枯渇し応答不能になった際、接続プールを一時拡張してサービス復旧するのはインシデント対応。接続リークをコード修正して再発を防ぐのは問題管理・変更管理にも関わる。</p>\n","prompt":"障害の原因が分かるまでサービス復旧を待つべきか。","answer":"<p>必ずしもそうではない。影響・証拠保全を考慮しつつ暫定復旧と原因調査を並行する。</p>\n","beginner":{"scenario":"ネット通販が停止したらまず復旧し、繰返す障害なら原因を調べ、恒久修正は影響評価・承認してから配布する。","trap":"インシデント管理の主目的は早期復旧。原因究明は問題管理。","quizId":"U-15-2"},"textbook":[{"heading":"障害時にまずすべきこと","body":"インシデントはサービスの中断や品質低下などです。インシデント管理は利用者への影響を抑え正常なサービスを速やかに回復する活動です。受付、分類、優先度決定、担当への割当て、復旧、記録を行います。"},{"heading":"同じ障害を繰り返さない","body":"問題管理はインシデントの原因を分析し再発を防ぎます。例えばメモリ不足で停止するアプリを再起動するのは復旧、メモリが解放されない欠陥を調査・修正するのは根本原因への対応です。既知のエラーや回避策を記録して復旧を速めます。"},{"heading":"変更の失敗を防ぐ","body":"変更管理では変更理由、影響、リスク、試験、承認、切戻しを確認します。リリース管理は提供する新しい版や機能を計画し、展開管理は実際に環境へ配置します。CMDB（構成管理データベース）は機器、ソフトウェア、設定や関係を管理し、変更・障害の影響分析を助けます。"},{"heading":"問題管理の目的","body":"インシデント管理は迅速なサービス復旧、問題管理は根本原因や潜在原因の特定と再発・影響の低減。サービス要求管理、変更管理、リリース管理の目的と区別する。"}]},{"id":"15-3","title":"キャパシティ・可用性・継続性・サービスデスク","explain":"<p>キャパシティ管理は現在と将来の需要に対し資源が不足しないよう容量を計画する。可用性管理は単一障害点の分析や冗長化、保守計画で利用可能性を高める。サービス継続性管理は大規模障害・災害でも重要業務を再開するための計画・訓練。RTO・RPOは業務要件と技術的制約をつなぐ指標。</p>\n<p>サービスデスクは利用者からの問合せやインシデント報告の窓口となり、優先度を付け、進捗と利用者への通知を管理する。優先度は一般に影響度と緊急度を組み合わせて決める。件数だけでなく復旧時間、一次解決率、満足度も計測する。</p>\n","worked":"<p>1人の管理者にだけ影響する表示崩れより、全社の決済停止の方が影響度が大きい。緊急度と合わせて優先度を判定する。</p>\n","prompt":"障害対応の件数が少なくなれば品質が必ず改善したか。","answer":"<p>判断できない。報告の欠落やユーザー数の変化を考える。</p>\n","beginner":{"scenario":"現在のCPU使用率が低くても来月の利用者増加で容量不足になるかもしれない。需要予測・監視で必要資源を計画する。","trap":"可用性管理と災害時のサービス継続管理は関連するが目的が異なる。","quizId":"U-15-3"},"textbook":[{"heading":"現在と将来の負荷","body":"キャパシティ管理は現在・将来の利用需要に対して必要な処理能力を確保します。利用率や応答時間、データ増加を測り、需要予測と増強計画を作ります。可用性管理はサービスが合意した時間に利用可能になるよう冗長化・保守・復旧などを計画します。"},{"heading":"災害時の継続","body":"サービス継続管理は大きな障害や災害が発生しても重要なサービスを継続・復旧できるよう備えます。事業影響分析から重要業務を特定し、RTO（復旧時間目標）とRPO（復旧時点目標）を設定し、代替拠点やバックアップを用意して訓練します。"},{"heading":"窓口と運用","body":"サービスデスクは利用者からの問合せ、サービス要求、障害報告を一元的に受け付けます。運用監視で異常を検知し、定めた連絡経路に沿って対応します。利用者への情報提供と技術的な障害復旧は両方必要です。"}]},{"id":"15-Y04","title":"運用監視・ジョブ・バックアップ・サービスデスク","explain":"<p>ジョブ管理では処理の順序、実行時刻、依存、異常終了時の対応を定めます。運用監視は稼働状態、ログ、資源、応答時間を観測し、異常を検知して対応します。</p>","worked":"<p>取込ジョブが失敗したら集計を保留し、担当へ通知して原因解消後に再実行する。二重登録を防ぐ仕組みも確認する。</p>","prompt":"バックアップの有効性を直接確かめる方法は？","answer":"<p>実際に復元し整合性を確認する。復元試験で利用可能なデータか確認する。</p>","beginner":{"scenario":"毎夜、売上集計を行う。前段の注文データ取込が失敗すると集計を実行してはいけない。","trap":"バックアップ成功ログだけで復旧可能性を証明できない。","quizId":"U-15-Y04"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ジョブ管理では処理の順序、実行時刻、依存、異常終了時の対応を定めます。運用監視は稼働状態、ログ、資源、応答時間を観測し、異常を検知して対応します。"},{"heading":"仕組みと使い分け","body":"サービスデスクは利用者との単一窓口となり、問合せやサービス要求、障害を記録・分類・優先付けします。バックアップは取得だけでなく復元試験、保存期間、別障害領域への保管が必要です。"},{"heading":"具体的な判断と手順","body":"取込ジョブが失敗したら集計を保留し、担当へ通知して原因解消後に再実行する。二重登録を防ぐ仕組みも確認する。"},{"heading":"障害対応の優先順位","body":"インシデントは通常のサービスを妨げる事象で、優先度は業務への影響と緊急度を基に決めます。利用者全員が決済不能なら通常は優先度が高く、個人の操作問合せより先に対応します。手順に従って復旧し、繰返し障害は問題管理に渡して根本原因を分析します。"}]},{"id":"15-Z01","title":"障害原因分析：FTA・FMEA・CFIA・SPOF","explain":"<p>FTA（Fault Tree Analysis：故障の木解析）は最上位の望ましくない事象から原因をANDやORで展開するトップダウンの分析。独立故障ならANDは確率の積、ORは1−両方起きない確率で計算できる。</p>","worked":"<p>両方の装置の故障が必要なAND条件は独立なら0.01×0.02=0.0002。</p>","prompt":"重大な停止事象から原因を論理ゲートで分解して発生確率を評価するのは？","answer":"<p>FTAは頂上事象を原因へ分解する。</p>","beginner":{"scenario":"サービスの停止原因と障害発生時の影響を分析する。","trap":"FMEAとFTAは分析の向きが異なる。","quizId":"U-15-Z01"},"textbook":[{"heading":"基本原理","body":"FTA（Fault Tree Analysis：故障の木解析）は最上位の望ましくない事象から原因をANDやORで展開するトップダウンの分析。独立故障ならANDは確率の積、ORは1−両方起きない確率で計算できる。"},{"heading":"仕組み・判断","body":"FMEA（Failure Mode and Effects Analysis：故障モード・影響解析）は部品等の故障モードから影響を検討するボトムアップ分析。CFIA（Component Failure Impact Analysis：コンポーネント障害影響分析）は各構成要素の故障がサービスに与える影響を整理する。SPOF（Single Point of Failure：単一障害点）は一つの故障でサービス全体が停止する箇所。"},{"heading":"応用と注意点","body":"独立の冗長装置2台の故障確率が0.01、0.02で両方故障すると停止するなら停止確率0.0002。共通電源障害があるなら独立モデルだけでは評価不足。故障の木には共通原因も含める。"}]},{"id":"15-Y03","title":"サービス評価・是正措置・継続的改善","explain":"<p>サービス管理では測定、分析、評価、内部監査、マネジメントレビューを通して、目標と実績の差や管理の有効性を判断します。</p>","worked":"<p>応答時間悪化の原因がDB索引の不足なら、索引を改善して同一条件で応答時間を再測定する。</p>","prompt":"是正措置の実施後に必要な活動は？","answer":"<p>測定して効果を評価する。原因への対策が有効か、測定結果で検証する。</p>","beginner":{"scenario":"SLOの達成率が3か月連続で低下した。管理者は結果と改善策を確認する。","trap":"改善策を実施しただけでは効果が確認されたことにならない。","quizId":"U-15-Y03"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"サービス管理では測定、分析、評価、内部監査、マネジメントレビューを通して、目標と実績の差や管理の有効性を判断します。"},{"heading":"仕組みと使い分け","body":"PDCA（Plan-Do-Check-Act：計画・実行・評価・改善）で不適合を記録し、原因分析、是正措置、効果確認を行います。改善は優先順位と担当、期限、期待効果を管理します。応急復旧と再発防止を区別します。"},{"heading":"具体的な判断と手順","body":"応答時間悪化の原因がDB索引の不足なら、索引を改善して同一条件で応答時間を再測定する。"},{"heading":"指標の悪化から改善へ","body":"平均応答時間が1秒でも、5％の利用者が10秒以上待つなら平均だけでは問題を捉えにくいです。95パーセンタイルやエラー率を併用し、比較する期間と負荷をそろえます。原因分析、対策、実施前後の比較、再発有無の確認までを改善記録に残します。"}]},{"id":"15-Y05","title":"設備管理・電源・データセンター効率","explain":"<p>ファシリティマネジメントは建物、電源、空調、入退室などの設備を効率的・安全に管理します。UPS（Uninterruptible Power Supply：無停電電源装置）は短時間の電源確保や安全停止を支援し、発電機はより長期の供給に利用できます。</p>","worked":"<p>施設全体150kW、IT機器100kWならPUE=1.5。残り50kWは冷却などの設備負荷。</p>","prompt":"施設200kW、IT機器125kWのPUEは？","answer":"<p>1.6。200÷125=1.6。</p>","beginner":{"scenario":"サーバ室では停電だけでなく冷却停止による過熱にも備える。","trap":"UPSだけで無期限に運転できるわけではない。","quizId":"U-15-Y05"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"ファシリティマネジメントは建物、電源、空調、入退室などの設備を効率的・安全に管理します。UPS（Uninterruptible Power Supply：無停電電源装置）は短時間の電源確保や安全停止を支援し、発電機はより長期の供給に利用できます。"},{"heading":"仕組みと使い分け","body":"PUE（Power Usage Effectiveness：電力使用効率）は施設全体の電力使用量÷IT機器の電力使用量です。1に近いほどIT機器以外に使う比率が小さいですが、計測境界やIT機器自体の効率にも注意します。"},{"heading":"具体的な判断と手順","body":"施設全体150kW、IT機器100kWならPUE=1.5。残り50kWは冷却などの設備負荷。"},{"heading":"停電に対する多層の備え","body":"商用電源が停止した直後にUPSで電力を供給し、その間に発電機を起動する構成があります。発電機の燃料供給が途絶える場合に備え、供給可能時間、負荷、停止手順を試験します。冷却停止で機器が故障する場合もあるので、電源と空調を一体で評価します。"}]},{"id":"15-Z02","title":"データセンター冷却：空冷・液冷・液浸","explain":"<p>空冷は空気を循環させ熱を運ぶ。液冷のコールドプレート方式は発熱部に取り付けた板と冷却液の流路で熱交換する。液浸冷却は機器を電気絶縁性の液体に浸して熱を除く。通常の水に電子回路を直接浸す方式ではない。</p>","worked":"<p>筐体ごと絶縁性冷媒に浸す方式は液浸冷却。</p>","prompt":"液浸冷却の二相方式が利用する主な熱移動は？","answer":"<p>相変化の潜熱を使う。</p>","beginner":{"scenario":"高性能GPU（画像・並列演算用プロセッサ）を多数設置したサーバを冷却する。","trap":"コールドプレート式と液浸を混同しない。","quizId":"U-15-Z02"},"textbook":[{"heading":"基本原理","body":"空冷は空気を循環させ熱を運ぶ。液冷のコールドプレート方式は発熱部に取り付けた板と冷却液の流路で熱交換する。液浸冷却は機器を電気絶縁性の液体に浸して熱を除く。通常の水に電子回路を直接浸す方式ではない。"},{"heading":"仕組み・判断","body":"単相液浸は冷媒が液体のまま循環し熱交換器で放熱する。二相液浸は冷媒の蒸発・凝縮に伴う潜熱を使う。冷媒の性質、安全性、保守、ポンプ等の電力、廃熱利用を検討する。"},{"heading":"応用と注意点","body":"PUE（Power Usage Effectiveness：電力使用効率）=施設総電力÷IT機器電力。IT200kW、施設280kWなら1.4。冷却を40kW削減してIT負荷が同じなら1.2。PUEの改善は絶対消費電力減少を単独では保証しない。"}]}],"beginnerIntro":"完成したシステムを安定提供する仕事を学ぶ。サービス水準、復旧、原因分析、変更、設備を目的別に整理する。","studyGroups":[{"title":"サービスの価値と計画","body":"顧客とサービスの合意から資源・変更計画へ進む。","ids":["15-1","15-Y01","15-Y02","15-C01","15-X01"]},{"title":"障害と改善","body":"障害復旧と原因除去を区別し、再発防止と評価へつなぐ。","ids":["15-2","15-3","15-Y04","15-Z01","15-Y03"]},{"title":"設備と継続性","body":"物理設備、電源、冷却とサービス継続の関係を学ぶ。","ids":["15-Y05","15-Z02"]}]},{"id":16,"title":"システム監査・内部統制","group":"マネジメント","priority":"B選択候補","summary":"独立した評価、監査証拠、職務分掌、内部統制、改善提案。","lessons":[{"title":"監査の目的","body":"システム監査は情報システムのリスクに対する管理状況等を独立・客観的に評価し、保証や助言を提供する。監査人は業務執行そのものを代行しない。","check":"監査対象を自分で運用し自分で評価すると独立性が損なわれる。"},{"title":"監査手続","body":"リスク評価→監査計画→証拠収集（文書閲覧・インタビュー・観察・再実施など）→評価→報告→フォローアップ。証拠は十分性・適切性を判断する。","check":"担当者の口頭説明だけでは弱い場合がある。"},{"title":"内部統制","body":"業務の有効性・効率性、財務報告の信頼性、法令遵守、資産保全などを支える仕組み。職務分掌は申請・承認・実行などの権限を分離し不正リスクを減らす。","check":"統制目的に対して設計・運用が機能しているか検証。"},{"title":"監査意見","body":"発見事項には事実・基準・原因・影響・改善提案を示す。経営層が受け入れたリスクも明確に記録する。","check":"監査報告は命令ではなく、改善の実施責任は基本的に被監査側。"}],"terms":[{"term":"システム監査","definition":"情報システムのリスク管理などを独立して検証・評価する活動"},{"term":"監査証拠","definition":"監査人の判断や結論を裏付ける情報"},{"term":"独立性","definition":"監査対象から不当な影響を受けずに判断できる性質"},{"term":"客観性","definition":"先入観や利益相反に左右されず公平に評価する性質"},{"term":"職務分掌","definition":"申請・承認・実行等の業務権限を分ける統制"},{"term":"内部統制","definition":"組織の目標達成を支える方針・手続・仕組み"},{"term":"監査調書","definition":"監査手続・証拠・判断を記録した文書"},{"term":"フォローアップ","definition":"指摘に対する改善状況を後から確認する活動"},{"term":"リスクアプローチ","definition":"重要なリスクに監査資源を重点配分する方法"}],"questions":[{"id":"Q16-01","chapter":16,"kind":"applied","q":"監査人の独立性に問題があるのは。","options":["アクセス記録を調べる","自ら構築・運用した統制をそのまま独立評価する","資料を閲覧する","経営者へ意見を述べる"],"correct":1,"explain":"自己監査となり客観的な評価が難しい。"},{"id":"Q16-02","chapter":16,"kind":"applied","q":"不正送金の抑止として最も直接的な内部統制は。","options":["送金申請と承認を別人にする","送金データを毎年削除する","送金担当のみに全権限を渡す","ログを取得しない"],"correct":0,"explain":"職務分掌で一人の権限集中を避ける。"},{"id":"Q16-03","chapter":16,"kind":"applied","q":"監査後に改善実施状況を確認する活動は。","options":["スコープ定義","フォローアップ","プログラム開発","容量計画"],"correct":1,"explain":"指摘への対応結果を後から確認する。"},{"id":"D16-01","chapter":16,"kind":"applied","q":"監査対象部門の管理者が「権限を毎月見直している」と述べたとき、監査人が最優先で確認するものはどれか。","options":["管理者の役職名だけ","第三者の噂","実施記録・承認履歴等の証拠","監査人の気分"],"correct":2,"explain":"主張だけでなく、十分かつ適切な監査証拠を収集する。"},{"id":"D16-02","chapter":16,"kind":"applied","q":"申請・承認・支払実行を別担当にする内部統制は何か。","options":["職務分掌","暗号化","キャッシュ制御","標本化"],"correct":0,"explain":"複数役割で牽制することで単独の不正・誤りを抑える。"},{"id":"D16-03","chapter":16,"kind":"applied","q":"高リスクな管理者アカウント10件を重点抽出して問題がなかった場合に妥当な結論はどれか。","options":["全社の全権限が完全に適正","抽出対象では問題が見られなかったが全件には一般化できない","監査手続が不要","ログが不要"],"correct":1,"explain":"重点抽出は高リスク対象に有効だが、全母集団を代表するとは限らない。"},{"id":"Q-16-X01","chapter":16,"kind":"applied","q":"本番プログラム変更の承認手続は主にどちらか。","options":["IT全般統制","業務処理統制","財務分析","マーケティング"],"correct":0,"explain":"IT全般統制。"},{"id":"U-16-1","chapter":16,"kind":"applied","q":"監査人が評価の対象となる業務の実施責任を兼ねない主な理由は？","options":["監査費用を増やすため","独立性を確保するため","開発速度を上げるため","監査範囲を狭めるため"],"correct":1,"explain":"自己の業務を自分で評価する利害関係を避け、客観性を保つ。"},{"id":"U-16-2","chapter":16,"kind":"applied","q":"同じ担当者が申請・承認・支払をすべて行える問題への直接的対策は？","options":["圧縮率向上","バックアップの頻度増加のみ","職務分掌","業務処理速度向上"],"correct":2,"explain":"担当と権限を分離し、一人で不正を完結しにくくする。"},{"id":"U-16-3","chapter":16,"kind":"applied","q":"監査指摘に対する改善措置が実施されたか後日確認する手続は？","options":["要件定義","単体テスト","投資評価","フォローアップ"],"correct":3,"explain":"監査後の改善状況を確認する。"},{"id":"U-16-X01","chapter":16,"kind":"applied","q":"取引入力時の必須項目や金額の妥当性チェックは主に何に当たるか？","options":["業務処理統制","IT全般統制のみ","監査人の独立性","財務分析"],"correct":0,"explain":"個別業務で入力・処理の正確性を確保する統制。"}],"deepIntro":"監査で求めるのは「適切に管理されたという証拠」であり、担当者の主張だけではない。","deep":[{"id":"16-1","title":"監査の目的・独立性・監査証拠","explain":"<p>システム監査は情報システムに関するリスクと管理状況を独立・客観的に評価し、改善を助言する活動。監査人は対象部門から独立して判断し、経営者や担当部門の管理責任を肩代わりしない。監査計画では目的・対象・範囲・基準・手続・時期を明確にし、重要性とリスクを考えて優先度を決める。</p>\n<p>監査証拠は十分かつ適切である必要がある。口頭説明だけでなく、承認記録、ログ、操作証跡、設定、実地観察、サンプル抽出、再実施結果などを照合する。発見事項は基準・事実・原因・影響・改善提案を分けて記載する。</p>\n","worked":"<p>「全従業員のアクセス権を毎月見直している」と担当者が述べても、実施証拠としてレビュー一覧・承認履歴・権限変更記録を確認する。記録の欠落を見つけたら影響範囲を調べる。</p>\n","prompt":"監査人が改善策を自ら実装し、その実装を自ら監査してよいか。","answer":"<p>独立性・客観性を損なう恐れがあるため不適切。実装責任は被監査側にある。</p>\n","beginner":{"scenario":"監査人は「退職者IDを即日削除する」という規程と、実際の退職者一覧・ID無効化ログを照合する。","trap":"規程があるだけでは統制が運用されている証拠にならない。","quizId":"U-16-1"},"textbook":[{"heading":"監査は何をする活動か","body":"システム監査は情報システムに関わるリスクと管理の仕組みを、独立した立場から検証・評価する活動です。監査対象の業務を行う人が自分で評価すると利害の影響を受けるため、監査人は独立性・客観性を確保します。"},{"heading":"監査証拠を集める","body":"規程に「退職時にIDを停止する」と書いてあることは設計の証拠になりますが、実際に実施した証拠ではありません。退職者一覧、ID停止記録、承認記録を照合し運用実態を調べます。質問、観察、文書閲覧、再実施などの手続を使います。"},{"heading":"監査結果の伝え方","body":"評価基準と観測された事実を比較し、問題点、リスク、改善の必要性を報告します。改善の実施責任は監査対象組織にあり、監査人は改善状況を確認します。監査報告と日常の業務管理を区別します。"}]},{"id":"16-C01","title":"監査の種類・監査規程・監査調書","explain":"<p>組織の業務・財務・IT管理をそれぞれ評価する。</p><p>シラバスVer.7.2 本文94–96頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>権限一覧と申請・承認記録のサンプルを比較し調書に記録する。</p>","prompt":"監査人が現地で情報システムの権限管理を評価した。目的と方法の二軸で分類し、結論の根拠をどこに残すか答えよ。","answer":"<p>目的はシステム監査、方法は立入監査・実地確認。法定か任意かは根拠が不明なので判定できない。手続・証拠・判断は監査調書に記録する。</p>","beginner":{"scenario":"組織の業務・財務・IT管理をそれぞれ評価する。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-16-C01"},"textbook":[{"heading":"監査は何を調べる活動か","body":"監査は定められた目的・基準に照らして実態を独立した立場で評価し、結論を伝える活動です。監査対象と監査目的によって基準や証拠が変わります。単に不具合を探したり、監査人が自分で修正したりする活動とは異なります。"},{"heading":"監査の種類を目的と根拠で分ける","body":"会計監査は財務諸表等の適正性を評価します。システム監査は情報システムに関するリスクや管理策を評価します。一方、法定監査は法令に基づく監査、任意監査は法令による義務とは別に実施する監査です。立入監査は対象場所へ赴いて実地確認する方法を指します。対象・法的根拠・実施方法は別の分類軸です。"},{"heading":"監査規程と監査計画","body":"監査規程は監査の目的、権限、責任、報告経路などを組織として定めます。監査計画はその枠組みのもとで今回の対象、評価基準、手続、担当や時期を定めます。リスクアプローチでは、影響や発生可能性の大きいリスクを重視し、限られた監査資源を配分します。"},{"heading":"監査調書で結論を裏づける","body":"監査人は実施した手続、取得した証拠、評価、判断理由を監査調書に記録します。十分性は証拠の量、適切性は関連性や信頼性などの質です。証拠を確認できないまま適正と結論づけることは避けます。監査報告は調書に裏づけられた結論と指摘を伝え、改善の実施責任は被監査部門等が負います。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"16-Y01","title":"監査手続・証拠・保証と助言","explain":"<p>システム監査はリスクと統制を独立かつ客観的に評価し、保証や助言を行います。監査計画、予備調査、本調査、証拠評価、報告、フォローアップの流れです。</p>","worked":"<p>退職者一覧とアカウント一覧を突合し、残存アカウントの権限・無効化日時を確認する。</p>","prompt":"全ての退職者のアカウントを当日無効化したと管理者が説明した。監査人はどの資料を突合し、何を判定するべきか。","answer":"<p>退職者一覧・退職日とアカウント一覧・無効化日時の記録を照合し、規程で定めた期限内の無効化が実際に行われたか判定する。元データの完全性も検証し、例外の影響を記録する。口頭説明のみでは不十分。</p>","beginner":{"scenario":"会計システムのアクセス権が退職者から削除されているか独立した立場で確かめる。","trap":"監査人が被監査部門の管理責任を引き受けると独立性を損なう。","quizId":"U-16-Y01"},"textbook":[{"heading":"監査が保証する対象","body":"システム監査は、システムに関するリスクが適切に管理されているか、定めた基準に照らして独立かつ客観的に評価する活動です。保証は評価結果に基づく結論を伝えること、助言は改善の提案を行うことです。監査人が実際の管理策を運用することとは区別します。"},{"heading":"監査手続の流れ","body":"監査計画で目的・範囲・基準を定め、予備調査で業務の概要やリスクを把握します。本調査では監査手続により証拠を集め、基準との違いと原因・影響を評価します。報告後に被監査部門が改善を行い、監査側はフォローアップで実施状況を確認します。"},{"heading":"手続は何を確かめるかで選ぶ","body":"ウォークスルーは一つの取引を開始から記録まで追い、業務の流れと統制を把握します。突合は独立した記録の一致や不一致を調べます。閲覧、質問、観察、再実施なども目的に応じて使います。規程があることと、その規程どおりに全期間運用されたことは別の検証対象です。"},{"heading":"証拠の量と質","body":"十分性は結論を支える証拠の量、適切性は関連性や信頼性などの質です。担当者の口頭説明だけでは操作が実際に行われたことを十分に確認できない場合があります。CAAT（Computer Assisted Audit Techniques: コンピュータ支援監査技法）は大量データの突合や異常抽出、テストデータ法などに役立ちますが、元データの完全性や正確性も検証します。"},{"heading":"退職者の権限を監査する","body":"人事記録から退職日を取得し、アカウント一覧と照合して退職後も有効なIDを抽出します。さらに無効化ログと権限変更記録を確認すると、例外の発生期間と影響を評価できます。監査人が直接アカウントを削除するのではなく、根拠を示して改善を求めるのが独立性の観点から重要です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"監査基準と証拠、運用実態を区別。"}},{"id":"16-Z01","title":"監査基準・独立性・フォローアップ","explain":"<p>監査人の独立性は不当な影響や圧力から離れて評価できる状態。客観性は偏りなく判断すること、正当な懐疑心は証拠の信頼性に注意を払い疑問を持って評価する姿勢、正当な注意は専門家として適切な慎重さをもって監査すること。</p>","worked":"<p>監査人はアクセス権の改善記録を確認し、実際の変更は業務部門が行う。</p>","prompt":"監査人が改善提案後に行う適切な活動は？","answer":"<p>独立した立場で改善状況を確認する。</p>","beginner":{"scenario":"監査で権限管理の問題を発見し改善提案を行う。","trap":"監査人は改善の実施責任を引き受けない。","quizId":"U-16-Z01"},"textbook":[{"heading":"基本原理","body":"監査人の独立性は不当な影響や圧力から離れて評価できる状態。客観性は偏りなく判断すること、正当な懐疑心は証拠の信頼性に注意を払い疑問を持って評価する姿勢、正当な注意は専門家として適切な慎重さをもって監査すること。"},{"heading":"仕組み・判断","body":"所見は監査で発見した事実等に基づく考えや意見。フォローアップは改善状況をモニタリングし、実施結果を確認する。改善計画の策定・実施・管理は被監査部門が担い、監査人が指揮して独立性を損なわない。"},{"heading":"応用と注意点","body":"ガバナンスはIT投資が経営目標に資するかなどの統治、マネジメントは計画・実行・評価・改善の仕組み、コントロールは具体的なリスクへの管理策。異常アクセス検知後に報告・対処が適時に行われたかはコントロールの評価。"}]},{"id":"16-2","title":"内部統制・職務分掌・リスク対応","explain":"<p>内部統制は業務の有効性・効率性、財務報告等の信頼性、法令遵守、資産保全を支える仕組み。職務分掌は「申請・承認・実行・検証」を複数の役割に分け、不正や誤りの見逃しを減らす。アクセス権の定期棚卸し、変更承認、ログ保存、バックアップテストは代表的な統制。</p>\n<p>予防的統制は不正を起こしにくくし、発見的統制は発生した異常を検知する。両方を設計することで制御の欠陥を補い合う。内部統制には人的誤り・共謀・権限濫用・費用対効果など限界があり、完全な保証ではない。</p>\n","worked":"<p>仕入先登録と支払承認を同じ担当者ができると架空取引を承認できるリスクがある。担当を分け、支払先変更の承認・記録を残すことで低減する。</p>\n","prompt":"購買担当者が自分で申請・承認・支払できる場合、予防的統制と発見的統制を一つずつ提案し、なぜ必要か説明せよ。","answer":"<p>予防は申請者と承認者・支払担当者の分離。発見は発注・検収・支払の記録を独立した担当者が突合すること。前者は不正を一人で完結しにくくし、後者は発生した不一致を検出する。</p>","beginner":{"scenario":"購入申請、承認、支払、照合を別担当にすれば、一人が架空請求を作り支払って隠すことを難しくできる。","trap":"職務分掌だけでは共謀や権限悪用を完全には防げない。","quizId":"U-16-2"},"textbook":[{"heading":"内部統制は監査とどう違うか","body":"内部統制は組織が目的を達成するために、自ら業務の中に設けて運用する仕組みです。業務の有効性・効率性、報告の信頼性、法令等の遵守、資産の保全などを目的とします。監査はその仕組みが適切に設計され実際に機能しているかを独立した立場で評価する活動です。内部統制の運用責任は監査人ではなく経営者や担当部門にあります。"},{"heading":"リスクから必要な統制を考える","body":"業務の流れを分解し、誤りや不正がどの段階で発生し得るかを検討します。購入申請、承認、発注、検収、支払、記録を一人が行えると、自分で架空の取引を承認して隠せる可能性があります。リスクは統制の目的を考える出発点です。"},{"heading":"予防・発見・是正を組み合わせる","body":"予防的統制は承認や権限分離などで不正や誤りの発生を防ぎます。発見的統制はログの監視、記録の突合、棚卸し等で発生済みの問題を見つけます。是正的統制は発見した問題を修正します。全ての不正を予防できるとは限らないため、これらを組み合わせます。"},{"heading":"職務分掌と運用の確認","body":"職務分掌は互いに牽制する必要のある申請、承認、実行、記録などの役割を分離することです。担当を分けても同じアカウントを共有していれば実効性が低くなります。少人数の組織では独立した事後確認等の代替策を検討します。金額やデータの重要性に応じた承認基準、例外処理の記録、継続的な運用確認も必要です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-3","focus":"比較軸、因果、実務適用を明示"}},{"id":"16-Y02","title":"内部統制の六要素とIT統制","explain":"<p>内部統制は組織が業務の有効性・効率性、報告の信頼性、法令等の遵守、資産保全を図る仕組みです。基本要素は統制環境、リスク評価と対応、統制活動、情報と伝達、モニタリング、ITへの対応です。</p>","worked":"<p>支払承認を別人にするのは予防統制、日次の不一致照合は発見統制、誤記録を修正するのは是正統制。</p>","prompt":"本番プログラムの変更承認を管理する統制は主にどれ？","answer":"<p>IT全般統制。複数業務に共通するシステム変更管理は全般統制。</p>","beginner":{"scenario":"支払担当者が自分で発注・検収・支払いを完結できると不正の危険が増える。","trap":"内部統制は共謀や経営者による無効化などの限界を持つ。","quizId":"U-16-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"内部統制は組織が業務の有効性・効率性、報告の信頼性、法令等の遵守、資産保全を図る仕組みです。基本要素は統制環境、リスク評価と対応、統制活動、情報と伝達、モニタリング、ITへの対応です。"},{"heading":"仕組みと使い分け","body":"IT全般統制はアクセス管理、変更管理、運用管理など広いシステム基盤を支えます。IT業務処理統制は入力の正確性、処理の完全性、出力確認など個々の業務処理を対象にします。予防・発見・是正統制も区別します。"},{"heading":"具体的な判断と手順","body":"支払承認を別人にするのは予防統制、日次の不一致照合は発見統制、誤記録を修正するのは是正統制。"},{"heading":"統制の設計と運用を検証する","body":"承認が必要という規則が存在しても、実際に承認を飛ばせるなら運用上の問題が残ります。設計評価では権限分離や承認条件がリスクに対応しているか、運用評価ではログや記録から規則が守られたかを確かめます。例外を調べて原因と是正を確認します。"}]},{"id":"16-X01","title":"内部統制と具体的な監査手続","explain":"<p>IT全般統制は開発・変更・アクセス・運用など、複数業務システムの信頼性を支える共通統制。業務処理統制は個別業務の入力・処理・出力の正確性、完全性、承認を確保する。内部統制には業務の有効性・効率性、報告の信頼性、法令遵守、資産保全などの目的がある。</p><p>監査では質問、観察、閲覧、再実施、サンプリング、監査ツールによるデータ分析を使い、統制が設計されているか、実際に運用されているかを分けて評価する。監査人は独立性を保ち、改善の実施責任は監査対象側にある。</p>","worked":"<p>退職者IDの無効化手続はIT全般統制、販売伝票の金額自動照合は業務処理統制。</p>","prompt":"本番プログラム変更の承認手続は主にどちらか。","answer":"<p>IT全般統制。</p>","beginner":{"scenario":"本番変更の承認手続は複数システム共通のIT全般統制。注文金額が数量×単価と一致する自動確認は個別業務の処理統制。","trap":"共通基盤の統制と個別処理の統制は目的が異なるが互いに関係する。","quizId":"U-16-X01"},"textbook":[{"heading":"IT全般統制と業務処理統制","body":"IT全般統制は複数のシステムを支える共通の管理で、アクセス管理、変更管理、運用管理などが含まれます。業務処理統制は個々の業務処理で入力・処理・出力の正確性、完全性、承認を確保します。例えば本番プログラム変更の承認は全般統制、注文金額の自動照合は業務処理統制です。"},{"heading":"統制が機能するか確認する","body":"設計の有効性は統制手続が目的に合っているか、運用の有効性は実際にその手続が実施されているかです。無効なIDを定期的に調べる手続が適切でも、実施されていなければリスクが残ります。"},{"heading":"具体的な監査手続","body":"質問だけで判断せず、承認記録の閲覧、実際の処理の観察、テスト用取引の再実施、ログの分析などを組み合わせます。監査証拠は十分な量と適切な質を備える必要があり、監査人自身の推測だけを根拠にしません。"}]},{"id":"16-3","title":"監査計画・サンプリング・フォローアップ","explain":"<p>全件を調べられないとき、監査では標本抽出により対象を検証する。無作為抽出は代表性を重視し、重点抽出は高リスク項目を集中的に調べるが、結果の一般化には制限がある。リスク評価に応じて対象システムと監査手続を選び、検出できなかったリスクも含めて結論を検討する。</p>\n<p>監査後の改善提案は被監査部門が対応計画を立て、監査側がフォローアップを行い改善状況を確認する。監査報告では証拠に裏付けられた事実と推測を区別し、改善要請の優先度を示す。</p>\n","worked":"<p>高リスクな本番管理者アカウントだけ10件を重点抽出して全件適切でも、「全ユーザー権限が適正」とは結論できない。抽出範囲に見合う表現にする。</p>\n","prompt":"1000件の取引から20件を無作為抽出し、例外が1件見つかった。監査人はどのように判断し、次に何を行うべきか。","answer":"<p>例外の原因、重要性、他の取引への影響を調べ、必要に応じ追加抽出や全件分析を行う。20件中1件という観測だけで母集団の正確な例外数は断定できない。判断根拠を調書に残し、改善後にフォローアップする。</p>","beginner":{"scenario":"1000件の変更申請からサンプルを抽出し、承認記録・本番反映時刻を照合する。例外があれば母集団への影響も検討する。","trap":"少数の正常サンプルだけで全件正常と断定しない。","quizId":"U-16-3"},"textbook":[{"heading":"監査は評価基準を先に決める","body":"監査人が証拠を集めても、何を適正と判断するかが曖昧では結論を出せません。監査計画では目的、範囲、対象期間、評価基準、担当者、手続を定めます。例えば退職者アカウントの管理なら、対象期間中に退職した全従業員と、無効化期限に関する規程が必要です。"},{"heading":"限られた資源をリスクに配分する","body":"リスクアプローチは影響・発生可能性、過去の監査指摘、障害、システム変更などを考慮し、重要なリスクのある領域に監査資源を配分する方法です。リスクの高い領域を多く調べることと、抽出結果を全体に無条件に一般化することは別です。"},{"heading":"母集団とサンプル","body":"母集団は評価したい対象全体、サンプルはその中から調べる一部です。全件検査が難しい場合にサンプリングを用います。無作為抽出などで抽出の偏りを抑え、目的と必要な証拠に応じた件数や方法を選びます。例外が見つかったら原因や母集団への影響を評価し、追加手続を検討します。サンプルで問題が見つからなくても全件が適正とは断定できません。"},{"heading":"報告・改善・フォローアップ","body":"監査調書に証拠と判断の経緯を記録し、報告では基準、観察した事実、差異、リスク、改善の提案等を示します。十分な証拠を得られない場合はその制約を記録します。改善を実施するのは被監査部門等であり、監査側は後日、実施状況と改善効果を確認します。これがフォローアップです。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-3","focus":"比較軸、因果、実務適用を明示"}}],"beginnerIntro":"組織が定めた仕組みが実際に機能するかを独立した立場から検証する。規程・証拠・実態を区別する。","studyGroups":[{"title":"監査の目的と規程","body":"独立性・保証・監査証拠の関係を理解する。","ids":["16-1","16-C01","16-Y01","16-Z01"]},{"title":"内部統制の設計","body":"組織のリスクに対する統制と職務分掌を考える。","ids":["16-2","16-Y02","16-X01"]},{"title":"監査の実施","body":"計画、証拠の取得、評価、報告、改善確認を学ぶ。","ids":["16-3"]}]},{"id":17,"title":"システム戦略","group":"ストラテジ","priority":"A重要","summary":"業務改革、IT戦略、EA、クラウド・外部委託の効果とリスク。","lessons":[{"title":"経営とITの整合","body":"情報システム戦略は経営目標から逆算し、何をITで変えるか、どの指標で成果を測るかを定める。導入技術自体を目的にしない。","check":"IT投資効果は売上だけでなく品質・時間・リスクも含める。"},{"title":"業務プロセス改革","body":"BPR（Business Process Re-engineering：業務プロセス再設計）は既存の業務を抜本的に見直す。BPM（Business Process Management：業務プロセス管理）は継続的な測定・改善を重視。","check":"現行の非効率な業務をそのままシステム化しない。"},{"title":"EAと全体最適","body":"EA（Enterprise Architecture：エンタープライズアーキテクチャ）は業務、データ、アプリ、技術を組織全体で整合させる枠組み。部分最適によるデータの分断を回避する。","check":"各部門で指標が異なれば共通データ定義が必要。"},{"title":"サービス調達","body":"SaaS（Software as a Service：ソフトウェア提供サービス）、PaaS（Platform as a Service：開発実行基盤提供サービス）、IaaS（Infrastructure as a Service：基盤提供サービス）の責任分担を理解する。","check":"クラウド事業者がすべてのセキュリティ責任を負うわけではない。"}],"terms":[{"term":"情報システム戦略","definition":"経営目的を実現する情報システムの方針と計画"},{"term":"BPR","definition":"業務プロセスを抜本的に見直し再設計すること"},{"term":"BPM","definition":"業務プロセスを継続的に把握・改善する管理手法"},{"term":"EA","definition":"業務・データ・アプリ・技術を全社横断で設計する枠組み"},{"term":"SaaS","definition":"完成したアプリケーションをサービスとして利用する形態"},{"term":"PaaS","definition":"アプリケーションの開発・実行基盤をサービスとして利用する形態"},{"term":"IaaS","definition":"仮想サーバー・ストレージ等のIT基盤を利用する形態"},{"term":"TCO","definition":"導入費用に加え運用・保守・廃棄まで含む総保有費用"},{"term":"アウトソーシング","definition":"業務や機能の一部を外部事業者に委託すること"}],"questions":[{"id":"Q17-01","chapter":17,"kind":"applied","q":"全社の業務・データ・アプリ・技術を整理して整合させる枠組みは。","options":["EA","MFA","TCP","RAID"],"correct":0,"explain":"EAは全社最適を図る構造化アプローチ。"},{"id":"Q17-02","chapter":17,"kind":"applied","q":"SaaS利用で利用者側に通常残る責任は。","options":["基盤の物理的な電源保守のみ","利用者アカウント・権限の適切な管理","クラウド事業者内部のディスク交換","通信回線の全物理設備修繕"],"correct":1,"explain":"責任共有モデルで利用者の設定・データ保護も重要。"},{"id":"Q17-03","chapter":17,"kind":"applied","q":"既存手順の微修正ではなく業務を根本から再設計するのは。","options":["BPR","バックアップ","単体テスト","容量計画"],"correct":0,"explain":"BPRは抜本的業務改革。"},{"id":"D17-01","chapter":17,"kind":"applied","q":"初期投資100万円、翌年と翌々年に各60万円のCF、割引率10%の場合のNPVに最も近いものはどれか。","options":["−20万円","0万円","4.1万円","20万円"],"correct":2,"explain":"−100＋60/1.1＋60/1.1²≈4.13万円。将来収入の現在価値を計算してから投資額を引く。"},{"id":"D17-02","chapter":17,"kind":"applied","q":"紙の申請書をPDF化するだけで業務の承認手順を変えない場合、最も近い説明はどれか。","options":["業務プロセスの根本再設計","アナログ情報のデジタル化","完全なDXの達成","必ず生産性が2倍"],"correct":1,"explain":"紙から電子データへの変換に近く、業務改革や事業変革の成否は別途評価が必要。"},{"id":"D17-03","chapter":17,"kind":"applied","q":"KGIとKPIの説明として適切なのはどれか。","options":["KGIは最終目標指標、KPIはプロセス等の重要指標","両者は測定できない","KPIは常に売上だけ","KGIは必ずシステムの処理時間"],"correct":0,"explain":"最終成果と、その達成に関係する活動指標を区別する。"},{"id":"Q-17-X01","chapter":17,"kind":"applied","q":"既存業務の流れを抜本的に再設計する手法は？","options":["BPR","DNS","RACI","CVSS"],"correct":0,"explain":"BPR。"},{"id":"U-17-1","chapter":17,"kind":"applied","q":"業務や事業モデルをデジタル技術で変革する考え方は？","options":["紙の電子化のみ","DX（デジタルトランスフォーメーション）","ファイル圧縮","単体テスト"],"correct":1,"explain":"DXはデジタル技術による業務・組織・事業等の変革を重視する。"},{"id":"U-17-2","chapter":17,"kind":"applied","q":"初期投資200万円、年間純便益50万円の単純回収期間は？","options":["0.25年","2年","4年","5年"],"correct":2,"explain":"初期投資÷年間純便益=200/50=4年。"},{"id":"U-17-3","chapter":17,"kind":"applied","q":"業務・データ・アプリ・技術の全体構造を整理する手法は？","options":["EVM（出来高管理）","RAID","CRC","EA（エンタープライズアーキテクチャ）"],"correct":3,"explain":"EAは組織全体の構造を整理し、戦略との整合を図る。"},{"id":"U-17-X01","chapter":17,"kind":"applied","q":"業務プロセスを抜本的に再設計する活動は？","options":["BPR","BPMのみ","DNS","CVSS"],"correct":0,"explain":"BPR（Business Process Reengineering：業務プロセス再設計）は抜本改革を指す。"}],"deepIntro":"IT投資の判断は「技術が新しいか」ではなく、経営目標と業務課題をどう改善するかを評価する。","deep":[{"id":"17-1","title":"経営戦略・IT戦略・DX","explain":"<p>IT戦略は企業の経営目的を支えるため、システム投資、データ活用、体制、ガバナンス、リスク対処の方向性を定める。DX（Digital Transformation：デジタル変革）は単なる紙の電子化にとどまらず、データと技術による業務・顧客体験・ビジネスモデルの変革を指す。デジタイゼーションはアナログのデジタル化、デジタライゼーションは業務工程のデジタル化と区別することがある。</p>\n<p>EA（Enterprise Architecture：エンタープライズアーキテクチャ）は業務・データ・アプリ・技術基盤などの全体構造を可視化し、重複・連携・改善方向を整理する。BPR（Business Process Re-engineering：業務プロセス再設計）は既存の仕事の流れを根本から見直す。</p>\n","worked":"<p>紙の申請書をPDFにするだけでは申請・承認が遅い問題が残る。入力重複をなくし承認権限・順路を設計し直し、処理日数を測定するのが業務改革に近い。</p>\n","prompt":"DX施策の成果を導入したソフトウェア数だけで評価できるか。","answer":"<p>できない。業務時間、品質、顧客価値、収益等の指標が必要。</p>\n","beginner":{"scenario":"在庫の過剰が経営課題なら、販売・在庫データを統合して発注精度を改善する。導入前後の在庫回転率と欠品率を比較する。","trap":"IT導入や紙の電子化自体が経営成果とは限らない。","quizId":"U-17-1"},"textbook":[{"heading":"経営とITをつなぐ","body":"経営戦略が「在庫削減と欠品防止」を目指すなら、IT戦略は在庫情報の共有や需要予測など、目標達成に必要な仕組みを考えます。ITを導入すること自体が目的ではなく、現行業務の課題と施策、成果指標を対応させます。"},{"heading":"DXとは何か","body":"既存の紙文書をデータ化するデジタイゼーション、デジタル技術で業務を改善するデジタライゼーション、業務・組織・事業モデルを変革するDX（デジタルトランスフォーメーション）という区別が使われます。単なる電子化でも価値がある場合はありますが、変革とは目的が異なります。"},{"heading":"成果を検証する","body":"施策前の欠品率や処理時間を測定し、導入後と比較します。売上の増加がシステムの効果か市場の変化か区別するため比較対象や条件を考えます。経営方針が変われば情報システム計画も見直します。"}]},{"id":"17-C01","title":"情報システム戦略の計画・体制","explain":"<p>部門別システムを全社戦略と整合させる。</p><p>シラバスVer.7.2 本文99–101頁を中心とした範囲補強（関連知識を含む）。</p>","worked":"<p>部門の要望を全社データ共通化方針と比較して投資を優先する。</p>","prompt":"部門ごとの独立した導入で重複投資が生じた。個別設計前に定める文書と全社優先順位を協議する体制の役割を答えよ。","answer":"<p>情報システム化基本計画で経営目標とシステム化範囲・優先順位・構成・投資を定め、情報システム戦略委員会等が部門横断で協議する。個別設計は方針の具体化。</p>","beginner":{"scenario":"部門別システムを全社戦略と整合させる。","trap":"用語の名称だけでなく、対象・目的・他の方式との違いを確認する。","quizId":"U-17-C01"},"textbook":[{"heading":"経営の目的から情報システムを考える","body":"経営戦略が事業の方向を定めても、そのままではどの業務やシステムに投資するべきか決まりません。情報システム戦略は経営目標を実現するため、業務とデータ、システムの構成や投資の方針に変換するものです。各部署が独立して最適化すると全社として重複や不整合が生じるため全社の方針が必要です。"},{"heading":"情報システム化基本計画","body":"基本計画では、経営課題に対して何をシステム化するか、優先順位、対象範囲、アーキテクチャ（全体構造）、投資計画、推進体制を整理します。複数のプロジェクトに共通する方向性を定める文書であり、個別の画面仕様やプログラム設計書ではありません。経営目標から評価指標までのつながりを明確にします。"},{"heading":"情報システム戦略委員会","body":"経営、業務、IT部門が全社の方針、投資優先順位、リスクと成果を協議する体制の例です。経営層は事業上の優先順位、業務部門は現場の課題、IT部門は実現性や技術上の制約を提供します。委員会による全社調整は、個々のシステム開発を実行するプロジェクトチームとは役割が異なります。"},{"heading":"経営に生かせているかを評価する","body":"IT経営力指標はITを経営に生かす能力を評価する考え方です。DX（Digital Transformation: デジタル技術による変革）推進指標は企業の変革の現状や課題を自己診断し、関係者間で共有するための枠組みです。機器の台数やシステム数だけでは、業務改善や事業変革の成果を測れません。評価結果を次の戦略や投資判断に戻すことが重要です。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-2","focus":"前回改訂本文を用いた別条件への適用・比較"}},{"id":"17-Y01","title":"全社アーキテクチャ・IT戦略とデータ統合","explain":"<p>EA（Enterprise Architecture：全社アーキテクチャ）は業務、データ、アプリケーション、技術基盤の四つの視点で現状（As-is）と目標（To-be）を整理します。経営目標に従って全体最適を図ります。</p>","worked":"<p>顧客番号の共通化はDA、部門横断の受注処理はBA、連携するアプリ構成はAA、通信・実行基盤はTAで整理する。</p>","prompt":"全社の顧客番号を統一し、営業と物流の受注処理を共通化し、アプリ間の連携を実現する。EAのどの視点でそれぞれを設計するか。","answer":"<p>顧客番号とデータ定義はDA、共通受注処理の流れはBA、アプリの責任と連携はAA。通信・実行基盤の選択はTA。四視点を対応付けることで業務目的と実装がつながる。</p>","beginner":{"scenario":"営業と物流が別々の顧客番号を使用し、同じ顧客の状況をまとめられない。","trap":"各部門の個別最適を足しても全社最適になるとは限らない。","quizId":"U-17-Y01"},"textbook":[{"heading":"部門別の最適化だけでは足りない","body":"各部門が個別にシステムを作ると、同じ顧客を別の番号で管理したり、同じデータを重複入力したりすることがあります。EA（Enterprise Architecture: 全社アーキテクチャ）は組織全体の業務、データ、アプリケーション、技術基盤の関係を記述し、経営目標に沿った全体最適を考える枠組みです。"},{"heading":"四つの視点を区別する","body":"BA（Business Architecture: 業務アーキテクチャ）は業務の機能・流れ・責任、DA（Data Architecture: データアーキテクチャ）はデータの構造・意味・関係、AA（Application Architecture: アプリケーションアーキテクチャ）は業務を支えるアプリと連携、TA（Technology Architecture: 技術アーキテクチャ）は通信・実行環境などの技術基盤を扱います。"},{"heading":"上位の要求を下位の仕組みへ結び付ける","body":"営業と物流で受注を共通処理したいなら、まずBAで業務の流れを決め、DAで顧客・注文の共通定義を定め、AAでどのアプリが何を担当するか整理し、TAで動作に必要な基盤を選びます。逆に技術制約から業務設計を見直す場合もあります。各視点は独立の一覧ではなく、互いに制約を与える関係です。"},{"heading":"現状と目標の差から移行計画を作る","body":"As-is（現状）とTo-be（目標状態）を四視点で記述し、差を埋めるためのシステム投資や業務改革を段階化します。共通マスタ、標準インタフェース、EAI（Enterprise Application Integration: 企業内アプリ統合）などは目標実現の手段です。技術の導入そのものではなく、重複削減、データ品質、業務時間等の成果で評価します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"EAの層間関係と略語を明示。"}},{"id":"17-Z01","title":"SOA・業務機能の連携・全社設計","explain":"<p>SOA（Service Oriented Architecture：サービス指向アーキテクチャ）は業務機能を明確なインタフェースを持つサービスとして分け、組み合わせて業務を実現する考え方。疎結合により内部の実装変更の影響を小さくできる。</p>","worked":"<p>受注と決済を独立した業務サービスとして連携する。</p>","prompt":"業務機能を独立サービスに分け組み合わせる設計思想は？","answer":"<p>SOAはサービスの再利用・連携を重視。</p>","beginner":{"scenario":"受注、決済、在庫の機能を別々のシステムで再利用したい。","trap":"SOAは特定製品や単にサーバを分割する方式ではない。","quizId":"U-17-Z01"},"textbook":[{"heading":"基本原理","body":"SOA（Service Oriented Architecture：サービス指向アーキテクチャ）は業務機能を明確なインタフェースを持つサービスとして分け、組み合わせて業務を実現する考え方。疎結合により内部の実装変更の影響を小さくできる。"},{"heading":"仕組み・判断","body":"API（Application Programming Interface：アプリ間の接続仕様）やメッセージを用いて機能を呼び出す。ERPは基幹業務の統合管理、BPMは業務プロセスの継続管理、フィット＆ギャップ分析は業務要求とパッケージ機能の差を調べる。"},{"heading":"応用と注意点","body":"受注サービスから決済サービスを呼び出す場合、決済内部の処理を変更しても公開インタフェースを保てば呼出し側への変更を抑えられる。ただし通信障害やタイムアウト、データ整合性、認証・認可の設計が必要。"}]},{"id":"17-Z02","title":"DX推進・情報システム戦略と経営の評価","explain":"<p>DX（Digital Transformation：デジタル変革）は技術導入だけでなく製品・サービス、業務、組織、ビジネスモデルを変革すること。デジタイゼーションは情報のデジタル化、デジタライゼーションは業務等へのデジタル活用。現状As-isと目標To-beの差を把握する。</p>","worked":"<p>紙申請の電子化だけでなく承認手順を改革し処理日数を測る。</p>","prompt":"DX推進の成果として最も直接的な評価は？","answer":"<p>経営・事業・業務の成果を評価する。</p>","beginner":{"scenario":"新システム導入を進めているが、経営上の成果が測れていない。","trap":"IT導入数は最終的な価値創出の指標とは限らない。","quizId":"U-17-Z02"},"textbook":[{"heading":"基本原理","body":"DX（Digital Transformation：デジタル変革）は技術導入だけでなく製品・サービス、業務、組織、ビジネスモデルを変革すること。デジタイゼーションは情報のデジタル化、デジタライゼーションは業務等へのデジタル活用。現状As-isと目標To-beの差を把握する。"},{"heading":"仕組み・判断","body":"経営課題を定義し業務・システムの現状、技術動向、必要な変革、投資の優先度、成果指標を整理する。DX推進指標は経営者や関係者が現状や課題を共有し、取り組みを改善するための自己診断に使われる。導入件数だけでなく顧客価値や業務成果を評価する。"},{"heading":"応用と注意点","body":"CIO（Chief Information Officer：最高情報責任者）は情報システム戦略等、CDOは文脈によりChief Digital Officer（デジタル変革責任者）又はChief Data Officer（データ責任者）を指す。システムオーナーはシステム、データオーナーはデータに関する責任を担う。"}]},{"id":"17-X01","title":"システム戦略・業務プロセス・活用評価","explain":"<p>EA（エンタープライズアーキテクチャ）は業務・データ・アプリケーション・技術の全体像を整理する。BPR（業務プロセス再設計）は抜本的改革、BPM（業務プロセス管理）は継続的に可視化・改善する。SOA（サービス指向アーキテクチャ）は機能を疎結合のサービスとして組み合わせる。</p><p>ソリューションビジネスは顧客課題に対し製品・サービス・運用を組み合わせる。アウトソーシングやクラウド利用では責任分界・コスト・情報管理を評価する。システム活用促進には教育、マニュアル、デジタルリテラシー、利用率や満足度の計測が必要。導入自体ではなく経営成果を検証する。</p>","worked":"<p>在庫システム導入後に利用率80%でも欠品が改善しないなら、入力精度や発注業務などを再評価する。</p>","prompt":"既存業務の流れを抜本的に再設計する手法は？","answer":"<p>BPR。</p>","beginner":{"scenario":"申請を紙からWebに変えるだけでなく、不要な承認を廃止しデータを再入力しないよう業務自体を見直す。","trap":"BPRは抜本的再設計、BPMは継続的な業務プロセス管理。","quizId":"U-17-X01"},"textbook":[{"heading":"業務の流れから見直す","body":"申請書をWeb化しても不要な承認や重複入力が残れば大きな改善にはなりません。BPR（業務プロセス再設計）は既存業務を抜本的に見直す活動、BPM（業務プロセス管理）は業務を可視化し継続的に測定・改善する活動です。"},{"heading":"機能をサービスとして組み合わせる","body":"SOA（サービス指向アーキテクチャ）は機能を明確な接続仕様を持つサービスとして疎結合に組み合わせます。例えば顧客情報照会を複数業務から利用できるようにします。ソリューションビジネスは顧客課題に応じ技術・製品・運用を組み合わせて解決策を提供します。"},{"heading":"導入後の活用を促進する","body":"利用者教育、操作手順、支援窓口、業務ルールを整備し、利用率や成果を測ります。導入したシステムが使われない場合は機能不足、業務との不整合、教育不足など原因を分析します。クラウドや外部委託では責任分界と費用・リスクを確認します。"}]},{"id":"17-Y02","title":"BPR・BPM・業務プロセスの可視化","explain":"<p>BPR（Business Process Reengineering：業務プロセス抜本改革）は業務の目的から流程や役割を再設計します。BPM（Business Process Management：業務プロセス管理）は業務を可視化・測定・継続改善する活動です。</p>","worked":"<p>低額申請は規則に基づいて自動判定し、高額のみ追加承認することで待ち時間を減らす。</p>","prompt":"業務そのものを抜本的に再設計する手法は？","answer":"<p>BPR。既存業務を前提とせず成果から再設計する。</p>","beginner":{"scenario":"紙の申請書を電子化したが、承認が5段階のままなので処理が遅い。","trap":"既存の紙を画面に変えるだけでは抜本改革とはいえない。","quizId":"U-17-Y02"},"textbook":[{"heading":"なぜ必要なのか・基本原理","body":"BPR（Business Process Reengineering：業務プロセス抜本改革）は業務の目的から手順や役割を再設計します。BPM（Business Process Management：業務プロセス管理）は業務を可視化・測定・継続改善する活動です。"},{"heading":"仕組みと使い分け","body":"現状フローで待ち時間、重複入力、不要な承認を特定します。目標フローでは統制を維持しつつ不要手順を削減します。BPMN（Business Process Model and Notation：業務プロセス表記法）は作業、イベント、分岐等を図示します。"},{"heading":"具体的な判断と手順","body":"低額申請は規則に基づいて自動判定し、高額のみ追加承認することで待ち時間を減らす。"},{"heading":"処理時間と待ち時間を区別する","body":"申請書入力に10分、承認待ちに3日、承認操作に5分かかる場合、入力を半分に短縮しても全体の期間はほとんど変わりません。待ち時間の原因である承認順序、担当者の不在、過剰な確認を見直す方が効果的なことがあります。フローに時間を付記するとボトルネックを発見できます。"}]},{"id":"17-Y03","title":"ソリューションサービスとクラウドの責任分界","explain":"<p>ソリューションビジネスは製品を売るだけでなく顧客課題を調査して解決策を提供します。SI（System Integration：システム統合）、業務パッケージ、BPO（Business Process Outsourcing：業務委託）などがあります。</p>","worked":"<p>SaaS勤怠を利用しても従業員アカウントや権限、利用データの管理は利用組織側に残る。</p>","prompt":"自社で開発したアプリを運用したいがOSや実行環境の管理は外部に任せたい。IaaS、PaaS、SaaSのどれが目的に最も近いか。アプリの安全管理責任はなくなるか。","answer":"<p>一般にPaaSが最も近い。実行基盤を提供者が管理し、自社はアプリを開発・配置する。アプリの脆弱性やデータ・権限管理など利用者の責任は残る。実際の分界は契約で確認する。</p>","beginner":{"scenario":"会社が自社サーバ、クラウド、業務委託から新しい勤怠管理の構成を選ぶ。","trap":"クラウドに移せばすべての安全管理責任が提供者に移るわけではない。","quizId":"U-17-Y03"},"textbook":[{"heading":"何を自社に残し、何を外部に任せるか","body":"企業の課題を情報技術で解決するには、既製品を選ぶ、システムを統合する、業務自体を外部へ委託するなど複数の方式があります。SI（System Integration: システム統合）は複数のシステムの設計・構築・統合、BPO（Business Process Outsourcing: 業務プロセスの外部委託）は業務の遂行自体を外部へ任せることです。利用するITサービスと業務責任は別に考えます。"},{"heading":"クラウドの三つの提供範囲","body":"IaaS（Infrastructure as a Service: インフラ提供）は仮想サーバ、記憶、ネットワーク等の基盤を提供します。PaaS（Platform as a Service: 実行基盤提供）はアプリの実行環境までを提供し、SaaS（Software as a Service: ソフトウェア提供）は完成したアプリを利用できます。一般に提供範囲が広いほど利用者側が管理する技術層は少なくなります。"},{"heading":"ハウジングとホスティング","body":"ハウジングは自社の機器を事業者の施設に設置し、電源・空調・通信等を利用する形態です。ホスティングは事業者側のサーバ等を借りて利用します。クラウドの提供モデルと完全に同じ分類ではありません。自社が所有する物、管理する物、利用する機能を分けて理解します。"},{"heading":"責任分界と導入判断","body":"クラウドでは提供者と利用者の責任範囲を契約やサービス仕様で明確にします。SaaSでもアカウントの権限付与やデータの適切な利用は利用組織に責任が残ります。IaaSでは一般に利用者がゲストOSやアプリを管理しますが、具体的な分界は契約・構成によります。費用、可用性、データ所在、移行可能性、解約時のデータ取出しも確認して選択します。"}],"pedagogyReviewed":true,"personaQC":{"round":"7.4-1","focus":"サービス提供範囲・責任分界の体系化。"}},{"id":"17-2","title":"投資評価・ポートフォリオ・KPI","explain":"<p>ROI（Return On Investment：投資利益率）は投資額に対する利益の比率。NPV（Net Present Value：正味現在価値）は将来キャッシュフローを割引率で現在価値に換算し、初期投資を差し引く。IRR（Internal Rate of Return：内部収益率）はNPVを0にする割引率。いずれも将来予測・割引率・リスクの仮定が評価結果を左右する。</p>\n<p>KGI（Key Goal Indicator：重要目標達成指標）は最終目標、KPI（Key Performance Indicator：重要業績評価指標）は目標に向かうプロセス指標。先行指標と結果指標を混同せず、測定可能で施策に結び付く値を使う。IT投資ポートフォリオでは効果・緊急度・依存関係・リスクを比較する。</p>\n","worked":"<p>初期投資100万円、翌年と翌々年にそれぞれ60万円の正味CF、割引率10%ならNPV＝−100＋60/1.1＋60/1.1²≈4.13万円。割引せず単純に20万円の利益とするのは誤り。</p>\n","prompt":"KPIが良ければKGIは必ず達成されるか。","answer":"<p>必ずではない。因果関係の妥当性、外部環境、指標の偏りを検証する。</p>\n","beginner":{"scenario":"初期投資300万円、年間純便益100万円なら単純回収3年。将来のお金の価値を考慮したいなら割引現在価値を計算す
