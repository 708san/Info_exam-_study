tion":"完成したアプリケーションをサービスとして利用する形態"},{"term":"PaaS","definition":"アプリケーションの開発・実行基盤をサービスとして利用する形態"},{"term":"IaaS","definition":"仮想サーバー・ストレージ等のIT基盤を利用する形態"},{"term":"TCO","definition":"導入費用に加え運用・保守・廃棄まで含む総保有費用"},{"term":"アウトソーシング","definition":"業務や機能の一部を外部事業者に委託すること"}],"questions":[{"id":"Q17-01","chapter":17,"kind":"applied","q":"全社の業務・データ・アプリ・技術を整理して整合させる枠組みは。","options":["EA","MFA","TCP","RAID"],"correct":0,"explain":"EAは全社最適を図る構造化アプローチ。"},{"id":"Q17-02","chapter":17,"kind":"applied","q":"SaaS利用で利用者側に通常残る責任は。","options":["基盤の物理的な電源保守のみ","利用者アカウント・権限の適切な管理","クラウド事業者内部のディスク交換","通信回線の全物理設備修繕"],"correct":1,"explain":"責任共有モデルで利用者の設定・データ保護も重要。"},{"id":"Q17-03","chapter":17,"kind":"applied","q":"既存手順の微修正ではなく業務を根本から再設計するのは。","options":["BPR","バックアップ","単体テスト","容量計画"],"correct":0,"explain":"BPRは抜本的業務改革。"},{"id":"D17-01","chapter":17,"kind":"applied","q":"初期投資100万円、翌年と翌々年に各60万円のCF、割引率10%の場合のNPVに最も近いものはどれか。","options":["−20万円","0万円","4.1万円","20万円"],"correct":2,"explain":"−100＋60/1.1＋60/1.1²≈4.13万円。将来収入の現在価値を計算してから投資額を引く。"},{"id":"D17-02","chapter":17,"kind":"applied","q":"紙の申請書をPDF化するだけで業務の承認手順を変えない場合、最も近い説明はどれか。","options":["業務プロセスの根本再設計","アナログ情報のデジタル化","完全なDXの達成","必ず生産性が2倍"],"correct":1,"explain":"紙から電子データへの変換に近く、業務改革や事業変革の成否は別途評価が必要。"},{"id":"D17-03","chapter":17,"kind":"applied","q":"KGIとKPIの説明として適切なのはどれか。","options":["KGIは最終目標指標、KPIはプロセス等の重要指標","両者は測定できない","KPIは常に売上だけ","KGIは必ずシステムの処理時間"],"correct":0,"explain":"最終成果と、その達成に関係する活動指標を区別する。"},{"id":"Q-17-X01","chapter":17,"kind":"applied","q":"既存業務の流れを抜本的に再設計する手法は？","options":["BPR","DNS","RACI","CVSS"],"correct":0,"explain":"BPR。"},{"id":"U-17-1","chapter":17,"kind":"applied","q":"業務や事業モデルをデジタル技術で変革する考え方は？","options":["紙の電子化のみ","DX（デジタルトランスフォーメーション）","ファイル圧縮","単体テスト"],"correct":1,"explain":"DXはデジタル技術による業務・組織・事業等の変革を重視する。"},{"id":"U-17-2","chapter":17,"kind":"applied","q":"初期投資200万円、年間純便益50万円の単純回収期間は？","options":["0.25年","2年","4年","5年"],"correct":2,"explain":"初期投資÷年間純便益=200/50=4年。"},{"id":"U-17-3","chapter":17,"kind":"applied","q":"業務・データ・アプリ・技術の全体構造を整理する手法は？","options":["EVM（出来高管理）","RAID","CRC","EA（エンタープライズアーキテクチャ）"],"correct":3,"explain":"EAは組織全体の構造を整理し、戦略との整合を図る。"},{"id":"U-17-X01","chapter":17,"kind":"applied","q":"業務プロセスを抜本的に再設計する活動は？","options":["BPR","BPMのみ","DNS","CVSS"],"correct":0,"explain":"BPR（Business Process Reengineering：業務プロセス再設計）は抜本改革を指す。"}],"deepIntro":"IT投資の判断は「技術が新しいか」ではなく、経営目標と業務課題をどう改善するかを評価する。","deep":[{"id":"17-1","title":"経営戦略・IT戦略・DX","explain":"\u003cp>IT戦略は企業の経営目的を支えるため、システム投資、データ活用、体制、ガバナンス、リスク対処の方向性を定める。DX（Digital Transformation：デジタル変革）は単なる紙の電子化にとどまらず、データと技術による業務・顧客体験・ビジネスモデルの変革を指す。デジタイゼーションはアナログのデジタル化、デジタライゼーションは業務工程のデジタル化と区別することがある。\u003c/p>\n\u003cp>EA（Enterprise Architecture：エンタープライズアーキテクチャ）は業務・データ・アプリ・技術基盤などの全体構造を可視化し、重複・連携・改善方向を整理する。BPR（Business Process Re-engineering：業務プロセス再設計）は既存の仕事の流れを根本から見直す。\u003c/p>\n","worked":"\u003cp>紙の申請書をPDFにするだけでは申請・承認が遅い問題が残る。入力重複をなくし承認権限・順路を設計し直し、処理日数を測定するのが業務改革に近い。\u003c/p>\n","prompt":"DX施策の成果を導入したソフトウェア数だけで評価できるか。","answer":"\u003cp>できない。業務時間、品質、顧客価値、収益等の指標が必要。\u003c/p>\n","beginner":{"scenario":"在庫の過剰が経営課題なら、販売・在庫データを統合して発注精度を改善する。導入前後の在庫回転率と欠品率を比較する。","trap":"IT導入や紙の電子化自体が経営成果とは限らない。","quizId":"U-17-1"}},{"id":"17-2","title":"投資評価・ポートフォリオ・KPI","explain":"\u003cp>ROI（Return On Investment：投資利益率）は投資額に対する利益の比率。NPV（Net Present Value：正味現在価値）は将来キャッシュフローを割引率で現在価値に換算し、初期投資を差し引く。IRR（Internal Rate of Return：内部収益率）はNPVを0にする割引率。いずれも将来予測・割引率・リスクの仮定が評価結果を左右する。\u003c/p>\n\u003cp>KGI（Key Goal Indicator：重要目標達成指標）は最終目標、KPI（Key Performance Indicator：重要業績評価指標）は目標に向かうプロセス指標。先行指標と結果指標を混同せず、測定可能で施策に結び付く値を使う。IT投資ポートフォリオでは効果・緊急度・依存関係・リスクを比較する。\u003c/p>\n","worked":"\u003cp>初期投資100万円、翌年と翌々年にそれぞれ60万円の正味CF、割引率10%ならNPV＝−100＋60/1.1＋60/1.1²≈4.13万円。割引せず単純に20万円の利益とするのは誤り。\u003c/p>\n","prompt":"KPIが良ければKGIは必ず達成されるか。","answer":"\u003cp>必ずではない。因果関係の妥当性、外部環境、指標の偏りを検証する。\u003c/p>\n","beginner":{"scenario":"初期投資300万円、年間純便益100万円なら単純回収3年。将来のお金の価値を考慮したいなら割引現在価値を計算する。","trap":"回収期間だけでは回収後の収益やリスクを評価できない。","quizId":"U-17-2"}},{"id":"17-3","title":"ITガバナンス・全体最適・データ戦略","explain":"\u003cp>ITガバナンスは経営の責任のもとでITの価値・リスク・資源を方向付け、評価・監視する仕組み。現場最適で各部門が個別にシステムを購入すると、データ形式の不統一、セキュリティ水準の差、費用重複が生じ得る。標準化、共通基盤、データ品質管理、責任分担で全体最適を目指す。\u003c/p>\n\u003cp>データ戦略では主データ（顧客・商品等）、取引データ、メタデータ、品質（正確性・完全性・適時性）を整理する。データを集めるだけでなく、利用目的、アクセス権、保持期限、プライバシー、責任者を決める。\u003c/p>\n","worked":"\u003cp>営業部と経理部で「顧客ID」の定義が異なると売上集計が一致しない。共通マスタとデータ定義を整えることが経営指標の信頼性に直結する。\u003c/p>\n","prompt":"全てのシステムを1つに統合すれば常に最適か。","answer":"\u003cp>そうとは限らない。柔軟性、事業ごとの要件、障害の波及範囲も評価する。\u003c/p>\n","beginner":{"scenario":"各部署が異なる顧客管理システムを導入すると重複・矛盾が生じる。全体のデータ定義やシステム配置を整理し共通化する。","trap":"全体最適は全機能を一つに集約することとは限らない。","quizId":"U-17-3"}},{"id":"17-X01","title":"システム戦略・業務プロセス・活用評価","explain":"\u003cp>EA（エンタープライズアーキテクチャ）は業務・データ・アプリケーション・技術の全体像を整理する。BPR（業務プロセス再設計）は抜本的改革、BPM（業務プロセス管理）は継続的に可視化・改善する。SOA（サービス指向アーキテクチャ）は機能を疎結合のサービスとして組み合わせる。\u003c/p>\u003cp>ソリューションビジネスは顧客課題に対し製品・サービス・運用を組み合わせる。アウトソーシングやクラウド利用では責任分界・コスト・情報管理を評価する。システム活用促進には教育、マニュアル、デジタルリテラシー、利用率や満足度の計測が必要。導入自体ではなく経営成果を検証する。\u003c/p>","worked":"\u003cp>在庫システム導入後に利用率80%でも欠品が改善しないなら、入力精度や発注業務などを再評価する。\u003c/p>","prompt":"既存業務の流れを抜本的に再設計する手法は？","answer":"\u003cp>BPR。\u003c/p>","beginner":{"scenario":"申請を紙からWebに変えるだけでなく、不要な承認を廃止しデータを再入力しないよう業務自体を見直す。","trap":"BPRは抜本的再設計、BPMは継続的な業務プロセス管理。","quizId":"U-17-X01"}}],"beginnerIntro":"経営上の課題を業務・ITの施策に変え、導入後の成果を測る。IT自体を目的にしない。"},{"id":18,"title":"システム企画・調達","group":"ストラテジ","priority":"A重要","summary":"RFP、ROI、要求、見積り、契約、ベンダー評価。","lessons":[{"title":"企画の流れ","body":"現状課題を可視化し、将来像・実現方法・費用対効果・リスクを比較する。定量的な効果と測りにくい定性的な効果を区別。","check":"導入前後の比較条件を揃える。"},{"title":"RFPと提案評価","body":"RFP（Request for Proposal：提案依頼書）は目的・要求・制約・評価基準等を示しベンダー提案を募る。選定では価格以外に品質・体制・実績・保守を評価。","check":"RFPと要件定義書・契約書は同じ役割ではない。"},{"title":"投資判断","body":"ROI（Return on Investment：投資利益率）は投資額に対する利益の比率。NPV（Net Present Value：正味現在価値）は将来キャッシュフローを割り引いて比較。","check":"ROIの利益と収益の定義を問題文で確かめる。"},{"title":"契約と受入れ","body":"準委任契約は一定の業務遂行を目的とし、請負契約は仕事の完成を目的とする。実際の契約内容・法令で責任は変わるため一律に決めつけない。","check":"検収基準と成果物責任を明確化する。"}],"terms":[{"term":"RFP","definition":"要求・条件を示して提案を依頼する文書"},{"term":"ROI","definition":"投資額に対する利益の比率"},{"term":"NPV","definition":"将来の現金収支を現在価値へ割り引いた純額"},{"term":"IRR","definition":"投資の正味現在価値がゼロとなる割引率"},{"term":"TCO","definition":"取得から運用・廃棄までの総費用"},{"term":"ベンダー評価","definition":"提供企業を価格・品質・体制などで比較すること"},{"term":"請負","definition":"原則として仕事の完成を目的とする契約"},{"term":"準委任","definition":"事務処理などの遂行を委託する契約"},{"term":"検収","definition":"納品物が契約や要件に適合するか受入れ確認すること"}],"questions":[{"id":"Q18-01","chapter":18,"kind":"applied","q":"投資額200万円、投資による正味利益50万円のROIは。","options":["10%","20%","25%","50%"],"correct":2,"explain":"50÷200×100=25%。"},{"id":"Q18-02","chapter":18,"kind":"applied","q":"RFPで最も重要なのは。","options":["自社の要求と制約を伝える","必ず最安値を指示する","受入れテストを不要とする","提案者に要件を無制限に追加させる"],"correct":0,"explain":"目的・要求・評価条件を明示する文書。"},{"id":"Q18-03","chapter":18,"kind":"applied","q":"将来の資金流入を割引率で現在価値に直す指標は。","options":["MTTR","CPI","NPV","RPO"],"correct":2,"explain":"NPVは時間価値を考慮する。"},{"id":"D18-01","chapter":18,"kind":"applied","q":"RFIとRFPの目的の組合せとして適切なものはどれか。","options":["RFIは提案取得、RFPは情報収集","両方は請求書","RFIは情報収集、RFPは具体的提案依頼","RFIは契約締結、RFPは検収"],"correct":2,"explain":"情報収集で候補や技術を把握したうえで、要件を明記した提案依頼を行う。"},{"id":"D18-02","chapter":18,"kind":"applied","q":"SaaSを導入するとき利用企業が引き続き負う可能性の高い責任はどれか。","options":["利用者の権限設定とデータの適切な取扱い","提供者のデータセンター建設","提供者のOSカーネル保守のすべて","提供者の営業活動"],"correct":0,"explain":"クラウドでも責任分界がある。利用側の権限やデータ管理責任は通常残る。"},{"id":"D18-03","chapter":18,"kind":"applied","q":"システム導入のTCO比較に含めるべき費用はどれか。","options":["初期費用のみ","導入・運用・教育・移行・撤退等の総費用","月額ライセンス料だけ","営業担当者の感想"],"correct":1,"explain":"TCOは総保有コスト。長期の運用と終了時費用まで考える。"},{"id":"Q-18-X01","chapter":18,"kind":"applied","q":"複数の事業者に具体的な解決案と費用の提示を求める文書は？","options":["RFI","RFP","SLA","NDA"],"correct":1,"explain":"RFP。"},{"id":"U-18-1","chapter":18,"kind":"applied","q":"市場にある製品や技術の情報を得る目的で送る文書は？","options":["RFP","RFI","SLA","NDA"],"correct":1,"explain":"RFI（Request for Information）は情報提供依頼書。"},{"id":"U-18-2","chapter":18,"kind":"applied","q":"納品された成果物が契約の条件を満たすか確認する行為は？","options":["構成管理","脆弱性評価のみ","検収","資本予算"],"correct":2,"explain":"検収では受入条件に照らして成果物を確認する。"},{"id":"U-18-3","chapter":18,"kind":"applied","q":"完成済みのアプリ機能をネット経由で利用するクラウドサービス分類は？","options":["PaaS","IaaS","オンプレミス","SaaS"],"correct":3,"explain":"SaaSはSoftware as a Service。PaaSは開発実行基盤、IaaSはインフラ資源。"},{"id":"U-18-X01","chapter":18,"kind":"applied","q":"計画の技術・経済・運用上の実現可能性を事前に調べる活動は？","options":["フィージビリティスタディ","回帰テスト","フォローアップ監査","パレート分析"],"correct":0,"explain":"実行可能性を複数観点から調べ、投資・計画判断に使う。"}],"deepIntro":"企画・調達の要点は、発注側が目的・要件・検収基準・責任分担を曖昧にしないこと。","deep":[{"id":"18-1","title":"企画書・RFI・RFP","explain":"\u003cp>システム企画は現状業務の課題、期待効果、対象範囲、予算、期限、制約を整理する。RFI（Request For Information：情報提供依頼書）は候補技術・製品・業者の情報収集に用い、RFP（Request For Proposal：提案依頼書）は要件・評価条件等を示して具体的な提案を求める。要件が不明確なら比較・契約・検収に問題が生じる。\u003c/p>\n\u003cp>提案評価では価格だけでなく、機能、セキュリティ、保守体制、納期、実績、移行計画、契約条件、運用コストを重み付けする。評価基準と必須条件を事前に決め、恣意的判断を抑える。\u003c/p>\n","worked":"\u003cp>「安いCRMを導入したい」だけでは提案を比較できない。利用者数、顧客データ量、既存連携、権限、障害時のRTO、運用費をRFPで明確にする。\u003c/p>\n","prompt":"RFIとRFPは同じ目的か。","answer":"\u003cp>違う。RFIは情報収集、RFPは具体的な提案取得を目的とする。\u003c/p>\n","beginner":{"scenario":"市販システムで何が可能か不明ならRFIで情報収集し、要求を整理してからRFPで費用・構成・導入方法の提案を求める。","trap":"RFIは情報提供依頼、RFPは提案依頼。見積り依頼だけとは異なる。","quizId":"U-18-1"}},{"id":"18-2","title":"契約・SLA・検収・委託管理","explain":"\u003cp>請負契約は仕事の完成を目的とし、準委任は事務処理などを委託する契約形態で、成果完成義務や責任の考え方が異なる。実際の権利義務は契約内容と適用法令に依存する。契約では成果物、知的財産、検収条件、変更時の手続、欠陥時対応、秘密保持、再委託、終了時のデータ返還などを定義する。\u003c/p>\n\u003cp>検収は決めた受入基準に照らして成果物が要件を満たすか判断する。委託先の管理を完全に丸投げせず、アクセス権・再委託先・脆弱性対応・ログなどの管理を継続する。\u003c/p>\n","worked":"\u003cp>発注側が口頭で機能追加を指示すると、追加費用や納期の認識がずれる。変更依頼と見積り、承認記録を残して契約上の扱いを確認する。\u003c/p>\n","prompt":"ベンダに委託したから個人情報保護やセキュリティの責任をすべて免れるか。","answer":"\u003cp>免れない。委託元としての監督などの義務が残る。\u003c/p>\n","beginner":{"scenario":"委託したシステムの受入条件を契約前に決め、納品時に試験して成果物が条件を満たすか検収する。","trap":"委託しても委託元のリスク・成果管理責任が消えるわけではない。","quizId":"U-18-2"}},{"id":"18-3","title":"サービス選定・クラウド・移行計画","explain":"\u003cp>SaaS（Software as a Service：サービスとしてのソフトウェア）はアプリ利用、PaaS（Platform as a Service：サービスとしてのプラットフォーム）は実行基盤、IaaS（Infrastructure as a Service：サービスとしてのインフラ）は仮想機器等を提供する典型的な区分。いずれも利用者と提供者の責任分界点を確認する。クラウドでもデータ分類・アクセス権・利用者設定は利用側の責任が残る。\u003c/p>\n\u003cp>移行はデータ変換、並行稼働、切替条件、ロールバック、利用者教育、運用引継ぎを計画する。TCO（Total Cost of Ownership：総保有コスト）は初期費用だけでなく運用、保守、教育、移行・撤退費用を含めた総額。\u003c/p>\n","worked":"\u003cp>低料金のSaaSを導入しても、既存データの移行費が高く、エクスポート制約が強ければ5年間のTCOが大きくなる。初期費用だけで比較しない。\u003c/p>\n","prompt":"SaaSならユーザー権限の設定は全て提供事業者が責任を持つか。","answer":"\u003cp>通常、利用企業側にも設定・利用管理の責任がある。\u003c/p>\n","beginner":{"scenario":"IaaSでは利用者がOSやアプリを管理する場合が多く、SaaSでは提供者がアプリを提供・運用する。利用者権限やデータ管理は利用者にも残る。","trap":"具体的な責任分界はサービス・契約に依存する。","quizId":"U-18-3"}},{"id":"18-X01","title":"システム化計画・要件・調達の実現性","explain":"\u003cp>システム化計画は経営課題、現行業務、対象範囲、目標、費用、スケジュール、移行・運用を整理する。フィージビリティスタディ（実現可能性調査）は技術・経済・法務・運用などの観点で実行可能かを検討する。グリーンITはエネルギーや資源消費を抑える観点。\u003c/p>\u003cp>要件定義では機能・非機能、優先順位、制約、受入条件を明確にし関係者と合意する。RFI（情報提供依頼）で候補を調査し、RFP（提案依頼）で具体的提案を求める。評価表で必須条件と評価項目を区別し、ベンダの実績、費用、リスク、運用体制を比較する。\u003c/p>","worked":"\u003cp>導入費100万円、年の純便益40万円なら単純回収期間2.5年。経済性だけでなく移行リスクも確認する。\u003c/p>","prompt":"複数の事業者に具体的な解決案と費用の提示を求める文書は？","answer":"\u003cp>RFP。\u003c/p>","beginner":{"scenario":"導入予定の技術が既存機器で動くか、予算内か、法令・運用に適合するか調べる。必要なら試行して不確実性を減らす。","trap":"実現可能性調査は技術だけでなく経済性・運用・法務も含む。","quizId":"U-18-X01"}}],"beginnerIntro":"投資判断、要件、調達、契約、移行を計画する。誰が何を提供し、何を満たせば受入れるかを明確にする。"},{"id":19,"title":"経営戦略・マーケティング","group":"ストラテジ","priority":"A重要","summary":"SWOT、PPM、4P、競争戦略、KPI、財務の基礎。","lessons":[{"title":"経営分析","body":"SWOT分析はStrengths（強み）・Weaknesses（弱み）の内部要因とOpportunities（機会）・Threats（脅威）の外部要因を整理する。クロスSWOTで施策候補を考える。","check":"機会と強みを混同しない。"},{"title":"事業ポートフォリオ","body":"PPM（Product Portfolio Management：製品ポートフォリオ管理）は市場成長率と相対市場占有率で事業を分類する代表的枠組み。資金配分の議論に使うがそれだけで投資判断はできない。","check":"問題文の軸を見失わない。"},{"title":"マーケティングとKPI","body":"4PはProduct（製品）・Price（価格）・Place（流通）・Promotion（販売促進）。KGI（Key Goal Indicator：重要目標達成指標）を達成するための途中指標がKPI（Key Performance Indicator：重要業績評価指標）。","check":"成果指標と活動指標を使い分ける。"},{"title":"収益モデル","body":"売上高−変動費＝限界利益。損益分岐点売上高＝固定費÷限界利益率。価格・数量・単位変動費を変えて感度分析する。","check":"売上高ではなく限界利益が固定費を回収する。"}],"terms":[{"term":"SWOT分析","definition":"内部の強み・弱みと外部の機会・脅威を整理する手法"},{"term":"PPM","definition":"市場成長率と相対市場占有率で事業を分類する枠組み"},{"term":"4P","definition":"製品・価格・流通・販売促進の施策を組み合わせる考え方"},{"term":"STP","definition":"市場細分化・対象選択・位置付けを行うマーケティング手法"},{"term":"KGI","definition":"最終的な目標達成を測定する指標"},{"term":"KPI","definition":"目標達成に向けた途中の活動・成果を測る指標"},{"term":"限界利益","definition":"売上高から変動費を差し引いた利益"},{"term":"損益分岐点","definition":"売上と費用が一致し利益がゼロになる水準"},{"term":"ファイブフォース","definition":"業界の競争要因を五つの力で分析する枠組み"},{"term":"バランストスコアカード","definition":"財務・顧客・業務プロセス・学習と成長を多面的に評価する仕組み"}],"questions":[{"id":"Q19-01","chapter":19,"kind":"applied","q":"固定費300万円、限界利益率30%のとき損益分岐点売上高は。","options":["100万円","300万円","900万円","1000万円"],"correct":3,"explain":"300÷0.3=1000万円。"},{"id":"Q19-02","chapter":19,"kind":"applied","q":"SWOTの「新規規制で市場需要が減る」は。","options":["強み","弱み","機会","脅威"],"correct":3,"explain":"自社外部のマイナス要因なので脅威。"},{"id":"Q19-03","chapter":19,"kind":"applied","q":"最終目標「年間売上10億円」に対し商談数を週次管理する指標は主に。","options":["KGI","KPI","IRR","RPO"],"correct":1,"explain":"商談数は最終目標の先行・中間指標。"},{"id":"D19-01","chapter":19,"kind":"applied","q":"SWOT分析で「競合大手の低価格参入」はどの区分に当たるか。","options":["自社の強み","自社の弱み","外部の機会","外部の脅威"],"correct":3,"explain":"競合参入は外部環境に由来する脅威（Threat）。"},{"id":"D19-02","chapter":19,"kind":"applied","q":"STP分析の正しい順番はどれか。","options":["対象選択→細分化→位置付け","市場細分化→対象選択→位置付け","製品→価格→流通","販売→調達→製造"],"correct":1,"explain":"Segmentation→Targeting→Positioning。誰にどんな価値を提供するか決める。"},{"id":"D19-03","chapter":19,"kind":"applied","q":"ファイブフォース分析が主に扱う対象はどれか。","options":["企業会計の帳簿","ソフトウェアのテストケース","業界の競争構造と収益圧力","人的資源の勤怠"],"correct":2,"explain":"競合、新規参入、代替品、買い手、売り手の5つの競争圧力を分析する。"},{"id":"Q-19-X01","chapter":19,"kind":"applied","q":"暗黙知を言語化して形式知にするSECIの過程は？","options":["共同化","表出化","連結化","内面化"],"correct":1,"explain":"表出化。"},{"id":"U-19-1","chapter":19,"kind":"applied","q":"SWOT分析で新たな競合参入は通常どれに当たるか？","options":["強み（S）","脅威（T）","弱み（W）","機会（O）"],"correct":1,"explain":"外部環境の不利な要因は脅威。"},{"id":"U-19-2","chapter":19,"kind":"applied","q":"4Pで販売経路を表す要素は？","options":["Product（製品）","Price（価格）","Place（流通）","Promotion（販売促進）"],"correct":2,"explain":"Placeは商品・サービスを顧客へ届ける経路。"},{"id":"U-19-3","chapter":19,"kind":"applied","q":"PPMで低成長かつ相対シェアが高い事業は？","options":["花形","問題児","負け犬","金のなる木"],"correct":3,"explain":"低成長でも高シェアなら資金創出が期待される分類。"},{"id":"U-19-X01","chapter":19,"kind":"applied","q":"BSCの4視点に含まれないものは？","options":["競合企業の株価のみ","財務","顧客","学習と成長"],"correct":0,"explain":"BSCの4視点は財務、顧客、内部業務プロセス、学習と成長。"}],"deepIntro":"経営指標や分析フレームワークは名前を覚えるだけでなく、どんな意思決定に使えるかを考える。","deep":[{"id":"19-1","title":"3C・SWOT・ファイブフォース","explain":"\u003cp>3C分析はCustomer（顧客）、Competitor（競合）、Company（自社）。SWOT分析はStrength（強み）、Weakness（弱み）、Opportunity（機会）、Threat（脅威）を整理し、内部要因と外部要因を分ける。ファイブフォース分析は競合間の敵対、売り手・買い手の交渉力、新規参入、代替品の脅威による業界の収益構造を分析する。\u003c/p>\n\u003cp>PEST分析はPolitical（政治）、Economic（経済）、Social（社会）、Technological（技術）の外部環境。各フレームワークは答えを自動で出すものではなく、仮説整理と追加調査に使う。市場データや顧客調査で裏付ける。\u003c/p>\n","worked":"\u003cp>「大手が低価格で参入」は自社の弱みではなく外部の脅威。「自社独自の技術者集団」は内部の強み。分類した上で、技術力をどの顧客課題へ使うかを考える。\u003c/p>\n","prompt":"SWOTのOpportunityは自社の能力そのものか。","answer":"\u003cp>違う。市場拡大・規制変更など外部の機会。\u003c/p>\n","beginner":{"scenario":"自社の強い技術と弱い営業力は内部要因、市場の成長と競合参入は外部要因。内部と外部、好ましいか不利かを区別する。","trap":"SWOTの分類は自社との関係で考える。市場全体の成長は通常外部の機会。","quizId":"U-19-1"}},{"id":"19-2","title":"STP・4P・製品ライフサイクル","explain":"\u003cp>STPはSegmentation（市場細分化）、Targeting（対象市場選択）、Positioning（選ばれる位置付け）の順に考える。4PはProduct（製品）、Price（価格）、Place（流通）、Promotion（販促）。顧客側からは4C（顧客価値・顧客コスト・利便性・コミュニケーション）で考える方法がある。\u003c/p>\n\u003cp>製品ライフサイクルは導入・成長・成熟・衰退で、需要、競争、価格戦略が変わるというモデル。実際の製品は一律の曲線をたどるわけではない。LTV（Life Time Value：顧客生涯価値）は一定期間にわたる顧客からの価値、CAC（Customer Acquisition Cost：顧客獲得費用）は獲得コスト。計算の範囲を統一する。\u003c/p>\n","worked":"\u003cp>開発者向け高機能ツールを学生のライト層へそのまま宣伝しても訴求がずれる。STPで対象を分け、重要価値（手間削減・カスタマイズ等）を選ぶ。\u003c/p>\n","prompt":"4PのPlaceは製品を置く物理的な棚だけを意味するか。","answer":"\u003cp>違う。販売チャネル・流通・提供経路全体を含む。\u003c/p>\n","beginner":{"scenario":"学生向けに安価で使いやすいアプリを位置づけたら、月額、機能、販売経路、広告を決める。対象と提供価値から販売施策を組み立てる。","trap":"STPは市場選択と位置づけ、4Pは具体的なマーケティング施策。","quizId":"U-19-2"}},{"id":"19-3","title":"競争戦略・製品ポートフォリオ","explain":"\u003cp>コストリーダーシップは低コスト構造、差別化は独自価値、集中戦略は特定市場へ資源を絞る考え方。PPM（Product Portfolio Management：製品ポートフォリオ管理）では市場成長率と相対市場シェア等の軸で「花形・金のなる木・問題児・負け犬」に分類する。ただし分類で投資の可否が自動決定されるわけではない。\u003c/p>\n\u003cp>バリューチェーンは調達・製造・物流・販売・サービス等を活動単位で分析し、競争優位の源泉を探る。VRIO分析はValue（価値）、Rarity（希少性）、Imitability（模倣困難性）、Organization（組織）を検討する。\u003c/p>\n","worked":"\u003cp>高い顧客継続率が強みでも、競合も同じ仕組みを容易に導入できるなら持続的優位とは限らない。模倣困難性と組織的活用を確認する。\u003c/p>\n","prompt":"PPMで成長率が高い事業は必ず利益が高いか。","answer":"\u003cp>そうとは限らない。獲得投資で赤字の場合もある。\u003c/p>\n","beginner":{"scenario":"高成長・高シェア事業は花形、低成長・高シェアは金のなる木。収益を成長事業へ配分する判断材料にする。","trap":"PPMの分類だけで事業撤退を決めず、利益・相乗効果・将来性も見る。","quizId":"U-19-3"}},{"id":"19-X01","title":"経営管理システム・目標・知識管理","explain":"\u003cp>BSC（バランストスコアカード）は財務、顧客、内部業務プロセス、学習と成長の4視点から戦略を指標に落とし込む。KGI（重要目標達成指標）は最終成果、KPI（重要業績評価指標）は途中の達成状況を測る。\u003c/p>\u003cp>ERPは企業資源計画、SFAは営業支援、CRMは顧客関係管理、SCMは供給連鎖管理、KMSは知識管理システム。SECIモデルは共同化・表出化・連結化・内面化で暗黙知と形式知が循環する。TOC（制約条件理論）は全体成果を制限する制約に注目する。\u003c/p>","worked":"\u003cp>営業担当の訪問履歴と案件の進捗をSFAで共有し、顧客対応履歴をCRMで活用する。\u003c/p>","prompt":"暗黙知を言語化して形式知にするSECIの過程は？","answer":"\u003cp>表出化。\u003c/p>","beginner":{"scenario":"営業利益を伸ばす戦略なら、顧客満足、処理時間、社員の技能などを先行指標として追い、最終的な財務成果との関係を検証する。","trap":"KPIは最終成果に結び付く指標を選ぶ。活動量だけを増やしても成果とは限らない。","quizId":"U-19-X01"}}],"beginnerIntro":"市場と自社の立場を分析し、誰にどんな価値をどう届けるか考える。経営目標と施策・指標をつなげる。"},{"id":20,"title":"技術戦略マネジメント","group":"ストラテジ","priority":"A標準","summary":"技術ロードマップ、研究開発、イノベーション、標準化と知財。","lessons":[{"title":"技術ロードマップ","body":"市場ニーズ、製品開発、基盤技術、研究開発の時間軸を結び付けて投資の優先順位を決める。技術が新しいだけでは顧客価値にならない。","check":"技術の成熟度と市場投入時期を分けて検討。"},{"title":"イノベーション","body":"破壊的イノベーションは既存市場の主流顧客だけでなく、当初は周縁の用途から競争構造を変え得る。オープンイノベーションは社外の知識や資源も活用する。","check":"単なる大型改良を必ず破壊的と呼ばない。"},{"title":"標準化とIP","body":"標準必須特許やライセンスを意識し、製品差別化と相互運用性のバランスを取る。知財ポートフォリオでは特許だけでなく営業秘密やノウハウも考える。","check":"標準化＝すべて無償提供ではない。"},{"title":"研究開発管理","body":"技術リスク、事業リスク、規制リスクを分け、ステージゲートで継続・中止を判断。学習に基づく仮説更新が必要。","check":"埋没費用を理由に赤字事業を無条件継続しない。"}],"terms":[{"term":"技術ロードマップ","definition":"技術・製品・市場の発展計画を時間軸で関連付けた図"},{"term":"オープンイノベーション","definition":"社内外の知識・技術を組み合わせて革新を目指すこと"},{"term":"破壊的イノベーション","definition":"既存の競争構造を周辺市場などから変化させ得る革新"},{"term":"ステージゲート","definition":"開発段階ごとに評価し継続・中止などを判断する方式"},{"term":"研究開発ポートフォリオ","definition":"リスク・収益・時間軸が異なる研究開発の組合せ"},{"term":"デファクトスタンダード","definition":"市場で広く普及し事実上の標準となった仕様"},{"term":"デジュールスタンダード","definition":"公的・正式な標準化手続で定められた規格"},{"term":"標準必須特許","definition":"ある標準規格の実装に不可欠とされる特許"}],"questions":[{"id":"Q20-01","chapter":20,"kind":"applied","q":"製品・技術・市場の時間軸を対応付ける図は。","options":["ER図","技術ロードマップ","ガントチャートだけ","DFD"],"correct":1,"explain":"研究開発投資と市場投入時期を整合させる。"},{"id":"Q20-02","chapter":20,"kind":"applied","q":"社外の研究成果を取り込んで事業化する考え方は。","options":["オープンイノベーション","密結合","デッドロック","バックアップ"],"correct":0,"explain":"組織外の知識と資源を活かす。"},{"id":"Q20-03","chapter":20,"kind":"applied","q":"開発段階ごとに成果を評価して次段階への進行を判断するのは。","options":["データ正規化","ステージゲート","サブネット分割","多要素認証"],"correct":1,"explain":"段階的な投資判断を行う。"},{"id":"D20-01","chapter":20,"kind":"applied","q":"技術的実現可能性を小規模で確認する段階として最も近いものはどれか。","options":["PoC","SLA","RPO","CMDB"],"correct":0,"explain":"PoCは概念実証。顧客価値・商用運用の成立は別の検証が必要。"},{"id":"D20-02","chapter":20,"kind":"applied","q":"AI分類器の全体正解率95%だけで商用化を判断できない理由はどれか。","options":["入力データは常に同じ","重要な誤判定の種類や実運用データ分布が不明だから","保守費は必ずゼロ","精度は定義できない"],"correct":1,"explain":"誤分類の影響、偽陰性・偽陽性、分布変化、人手運用などを検証する。"},{"id":"D20-03","chapter":20,"kind":"applied","q":"特許を出願したことと「他社の特許を侵害せず販売できること」の関係はどれか。","options":["出願時点で販売の自由が保証される","出願すれば競合の技術を自由に使用できる","別途実施の自由（FTO）の検討が必要","海外販売は常に無制限"],"correct":2,"explain":"自分の特許取得・出願は、他者権利の非侵害を保証しない。"},{"id":"Q-20-X01","chapter":20,"kind":"applied","q":"製品設計と生産工程設計を並行して進める方法は？","options":["ウォーターフォール","コンカレントエンジニアリング","正規化","デュプレックス"],"correct":1,"explain":"コンカレントエンジニアリング。"},{"id":"U-20-1","chapter":20,"kind":"applied","q":"技術・製品・市場の目標を時間軸で関連付けるものは？","options":["監査調書","技術ロードマップ","ER図","真理値表"],"correct":1,"explain":"技術ロードマップは将来目標と技術開発の時期を可視化する。"},{"id":"U-20-2","chapter":20,"kind":"applied","q":"新技術の実現可能性を小規模に確認する活動は？","options":["SLA（サービスレベル合意）","RPO（復旧時点目標）","PoC（概念実証）","MRP（資材所要量計画）"],"correct":2,"explain":"PoCは技術やアイデアが実現可能か検証する。"},{"id":"U-20-3","chapter":20,"kind":"applied","q":"市場で広く普及した結果として事実上の標準となるものは？","options":["デジュールスタンダード","特許査定","商標登録","デファクトスタンダード"],"correct":3,"explain":"デファクトは市場での普及、デジュールは公的な標準化手続による標準。"},{"id":"U-20-X01","chapter":20,"kind":"applied","q":"外部研究機関や企業の技術も取り込んで研究開発する考え方は？","options":["オープンイノベーション","クローズドイノベーション","ウォーターフォールのみ","データ正規化"],"correct":0,"explain":"外部の知識や技術を活用して革新を進める。"}],"deepIntro":"技術を開発することと、事業価値に結び付けることは異なる。研究開発投資や技術選択のリスクを管理する。","deep":[{"id":"20-1","title":"技術ロードマップ・研究開発管理","explain":"\u003cp>技術ロードマップは市場・製品・技術・資源の時間的な関係を整理し、実用化に必要な技術課題や開発時期を見える化する。技術ポートフォリオでは将来性、成熟度、差別化、必要投資、依存関係を評価する。技術の不確実性と市場の不確実性は別に評価する。\u003c/p>\n\u003cp>オープンイノベーションは外部企業・大学・顧客などの知識や技術を組み合わせて価値創出を図る。共同研究では知的財産の帰属、成果物の利用範囲、秘密保持、公開の可否を最初に検討する。\u003c/p>\n","worked":"\u003cp>将来の製品を2年後に投入するには、半年前に量産評価、その前に技術実証が必要と逆算する。ロードマップは希望の日付を並べるだけでなく、依存関係と検証条件を定義する。\u003c/p>\n","prompt":"技術の成熟度が高ければ顧客ニーズも必ずあるか。","answer":"\u003cp>ない場合がある。技術検証と市場検証を分ける。\u003c/p>\n","beginner":{"scenario":"3年後に省電力製品を出す計画なら、必要なセンサ、半導体、試作時期、性能目標を逆算して並べる。","trap":"ロードマップは時間軸のある目標・技術計画であり、単なる技術一覧ではない。","quizId":"U-20-1"}},{"id":"20-2","title":"事業化・価値検証・プロトタイプ","explain":"\u003cp>PoC（Proof of Concept：概念実証）は技術的実現可能性等を確かめる試験、MVP（Minimum Viable Product：実用最小限の製品）は顧客へ価値を届けて仮説検証する最小の製品。PoCが成功しても業務導入コスト・法規制・顧客獲得等が成立するとは限らない。事業化では市場性、技術性、競争優位、収益性、実行体制を総合評価する。\u003c/p>\n\u003cp>技術採用は試験環境での動作だけでなく、品質管理、保守、性能、セキュリティ、量産可能性まで検証する。撤退条件や次段階への移行基準を事前に定める。\u003c/p>\n","worked":"\u003cp>AIで画像を分類できたPoCが成功しても、実運用ではデータ取得、誤判定時の人手確認、法令、計算費用が必要。顧客の業務時間削減を測るMVP検証が別に必要。\u003c/p>\n","prompt":"PoCの精度が95%ならそのまま商用化してよいか。","answer":"\u003cp>断定できない。誤りの種類、重要度、実際のデータ分布、運用費や安全性を評価する。\u003c/p>\n","beginner":{"scenario":"音声で注文できる試作を顧客に使ってもらう。認識精度が高くても既存操作より時間がかかるなら事業価値は弱い。","trap":"技術的に動くことと顧客が使い続け購入することは別。","quizId":"U-20-2"}},{"id":"20-3","title":"標準化・技術移転・知財戦略","explain":"\u003cp>技術を守る手段には特許権、営業秘密、著作権、契約、先行者利益などがある。特許公開は技術情報の公開と引換えに一定期間の独占的権利を得る仕組みで、営業秘密は秘密管理・有用性・非公知性などが要件。すべての技術が特許化に適するとは限らない。\u003c/p>\n\u003cp>標準化は互換性や市場拡大を助けるが、標準必須特許やライセンス、競争政策も考慮する。技術移転では権利範囲、地域、用途、改良成果、再許諾、対価などを定める。\u003c/p>\n","worked":"\u003cp>製造ノウハウを公開すると模倣が容易になるが、秘密のまま運用で守れる場合もある。特許の新規性・進歩性と秘密管理可能性を比較して判断する。\u003c/p>\n","prompt":"特許を出願した時点で、他社の権利を侵害せず製造販売できるか。","answer":"\u003cp>保証されない。実施の自由（FTO：Freedom To Operate）は別途調査が必要。\u003c/p>\n","beginner":{"scenario":"機器間の接続仕様を標準化して周辺製品を増やし、独自の性能改善技術は特許・秘密管理で保護する戦略を考えられる。","trap":"標準化はすべての技術を無償で公開することを意味しない。","quizId":"U-20-3"}},{"id":"20-X01","title":"技術開発戦略・投資計画","explain":"\u003cp>MOT（技術経営）は技術を経営成果に結び付ける。技術開発戦略では市場ニーズと技術シーズ、競争優位、知財、投資資源を評価する。オープンイノベーションは外部の知識・技術も利用し、技術移転や共同開発を行う。\u003c/p>\u003cp>技術開発計画は人材・資金・設備・拠点・製品化時期を具体化し、技術ロードマップに技術・製品・市場の時間的な関係を表す。コンカレントエンジニアリングは設計・製造等を並行検討し手戻りを減らす。パイロット生産は本格量産前に工程や品質を検証する。\u003c/p>","worked":"\u003cp>製造部門が設計初期から参加し部品組立性を評価すると、量産段階での設計変更を減らせる。\u003c/p>","prompt":"製品設計と生産工程設計を並行して進める方法は？","answer":"\u003cp>コンカレントエンジニアリング。\u003c/p>","beginner":{"scenario":"製品設計の初期に生産部門が組立てやすさを確認することで、試作後に部品形状を大きく変更する手戻りを減らせる。","trap":"並行開発は情報共有なしに別々に作業することではない。","quizId":"U-20-X01"}}],"beginnerIntro":"技術を研究するだけでなく製品・事業として価値に変える方法を学ぶ。市場ニーズ、技術開発、標準化、知財を関連づける。"},{"id":21,"title":"ビジネスインダストリ","group":"ストラテジ","priority":"A標準","summary":"EC、SCM、ERP、IoT、製造管理、電子決済など産業別ITの基本。","lessons":[{"title":"企業内・企業間システム","body":"ERP（Enterprise Resource Planning：統合基幹業務システム）は会計・人事・販売等を統合、SCM（Supply Chain Management：供給連鎖管理）は調達から販売までの流れを最適化する。","check":"ERPは社内統合、SCMは企業間連携まで視野。"},{"title":"顧客とデータ","body":"CRM（Customer Relationship Management：顧客関係管理）は顧客情報や接点を統合。POS（Point of Sales：販売時点情報管理）は売上・商品データを蓄積し需要分析等へ活用。","check":"個人情報の利用目的と最小限の管理が必要。"},{"title":"製造と物流","body":"CAD（Computer-Aided Design：コンピュータ支援設計）で設計、CAM（Computer-Aided Manufacturing：コンピュータ支援製造）で製造指示。IoT（Internet of Things：モノのインターネット）はセンサや機器のデータを活用。","check":"設計・製造・制御が異なる段階。"},{"title":"ECと決済","body":"EC（Electronic Commerce：電子商取引）では決済・注文・在庫・配送が連動する。EDI（Electronic Data Interchange：電子データ交換）は企業間取引データを標準形式でやり取りする。","check":"電子化はなりすましや改ざん対策も必要。"}],"terms":[{"term":"ERP","definition":"会計・人事・販売などの基幹業務を統合するシステム"},{"term":"SCM","definition":"調達・生産・物流・販売の供給連鎖を最適化する管理"},{"term":"CRM","definition":"顧客情報と接点を管理し関係を改善する仕組み"},{"term":"POS","definition":"販売時点で商品・数量・価格等の情報を取得する仕組み"},{"term":"CAD","definition":"コンピュータを用いた設計支援"},{"term":"CAM","definition":"コンピュータによる製造支援"},{"term":"IoT","definition":"モノをネットワークにつないでデータを収集・活用する仕組み"},{"term":"EDI","definition":"企業間の受発注などのデータを標準化して電子交換する仕組み"},{"term":"電子商取引","definition":"ネットワーク上で商品・サービス等を取引すること"},{"term":"デジタルツイン","definition":"実世界の対象の状態をデジタル空間に再現し分析等に活用する仕組み"}],"questions":[{"id":"Q21-01","chapter":21,"kind":"applied","q":"取引先を含む調達・生産・物流全体の最適化は。","options":["SCM","CRM","CAD","SLA"],"correct":0,"explain":"SCMは供給連鎖全体を扱う。"},{"id":"Q21-02","chapter":21,"kind":"applied","q":"販売時に商品別の売上を記録する仕組みは。","options":["CMDB","POS","VPN","PKI"],"correct":1,"explain":"POSは販売時点で取引情報を収集する。"},{"id":"Q21-03","chapter":21,"kind":"applied","q":"コンピュータ上の設計を支援する技術は。","options":["CAD","CAM","NAT","DNS"],"correct":0,"explain":"CADは設計、CAMは製造。"},{"id":"D21-01","chapter":21,"kind":"applied","q":"完成品100個に部品Aが各3個必要で、部品在庫50個の単純な正味所要量はどれか。","options":["50個","150個","250個","350個"],"correct":2,"explain":"100×3−50=250個。実務では発注残、安全在庫、リードタイムなども考慮する。"},{"id":"D21-02","chapter":21,"kind":"applied","q":"顧客データを部門横断で統合し関係維持を支援する仕組みはどれか。","options":["RAID","CRM","CRC","ADC"],"correct":1,"explain":"CRMは顧客関係管理。購買・問い合わせ等を統合して顧客接点を改善する。"},{"id":"D21-03","chapter":21,"kind":"applied","q":"工場AIの異常検知で重大異常の見逃しを測るとき、全体正解率より適切な指標はどれか。","options":["重大異常クラスの再現率","ソフトウェアの行数","端末の画面サイズ","平均社員年齢"],"correct":0,"explain":"見逃しは偽陰性。重大異常の再現率（感度）などを確認する。"},{"id":"Q-21-X01","chapter":21,"kind":"applied","q":"構造物の応力解析に主に使うシステムは？","options":["CAD","CAE","CAM","POS"],"correct":1,"explain":"CAE。"},{"id":"Q-21-X02","chapter":21,"kind":"applied","q":"消費者同士が取引するフリーマーケットアプリの分類は？","options":["BtoB","BtoC","CtoC","GtoB"],"correct":2,"explain":"CtoC。"},{"id":"U-21-1","chapter":21,"kind":"applied","q":"供給連鎖の上流ほど発注変動が増幅する現象は？","options":["ネットワーク効果","ブルウィップ効果","規模の経済","桁落ち"],"correct":1,"explain":"需要変化の予測・在庫調整などが連鎖し上流の発注変動を増幅する。"},{"id":"U-21-2","chapter":21,"kind":"applied","q":"企業間で注文書や請求書を電子データとして交換する仕組みは？","options":["CRM","POS","EDI","CAD"],"correct":2,"explain":"EDI（Electronic Data Interchange：電子データ交換）は企業間の取引情報交換。"},{"id":"U-21-3","chapter":21,"kind":"applied","q":"収集データを機器の近くで処理して通信遅延を抑える方式は？","options":["バッチ処理のみ","データ正規化","RAID","エッジコンピューティング"],"correct":3,"explain":"エッジ処理はデータ発生源の近くで処理する。"},{"id":"U-21-X01","chapter":21,"kind":"applied","q":"製品計画、部品表、在庫から部品の必要数量を求める方式は？","options":["MRP","CRM","SFA","BSC"],"correct":0,"explain":"MRP（Material Requirements Planning：資材所要量計画）は部品の必要量・時期を算出する。"},{"id":"U-21-X02","chapter":21,"kind":"applied","q":"企業が一般消費者に直接商品を販売するECの分類は？","options":["BtoB","BtoC","CtoC","GtoG"],"correct":1,"explain":"BtoCは企業対消費者、BtoBは企業間、CtoCは消費者間。"}],"deepIntro":"ITが実際の業務・産業に入るとき、データの流れ・取引の流れ・責任の所在を理解する。","deep":[{"id":"21-1","title":"製造・生産管理・サプライチェーン","explain":"\u003cp>ERP（Enterprise Resource Planning：企業資源計画）は会計・販売・購買・生産などの企業資源を横断して管理する。MRP（Material Requirements Planning：資材所要量計画）は生産計画・部品表（BOM）・在庫から必要な材料量と時期を算出する。SCM（Supply Chain Management：供給連鎖管理）は仕入れから生産・物流・販売までを全体最適する。\u003c/p>\n\u003cp>JIT（Just In Time：必要なものを必要なときに必要なだけ供給）は在庫削減を目指すが、需要変動・供給途絶に弱くなる可能性もある。トレーサビリティはロット・取引履歴を追跡し、不良品回収等で役立つ。\u003c/p>\n","worked":"\u003cp>製品1個に部品Aが3個必要で100個生産、部品在庫が50個なら単純な正味所要量は300−50＝250個。実際のMRPではリードタイム、安全在庫、既発注残を加味する。\u003c/p>\n","prompt":"ERPを導入すると部門間のデータ定義の統一が不要か。","answer":"\u003cp>むしろ導入時に統一・標準化の検討が必要。\u003c/p>\n","beginner":{"scenario":"店舗が需要増に備え余分に発注し、卸もさらに余分に発注すると、上流に行くほど実際の需要変動より大きな注文変動が生じる。","trap":"在庫を減らせば必ず全体の利益が増えるわけではない。欠品・調達期間も考慮する。","quizId":"U-21-1"}},{"id":"21-2","title":"電子商取引・決済・顧客管理","explain":"\u003cp>EC（Electronic Commerce：電子商取引）はBtoB（企業間）、BtoC（企業・消費者間）、CtoC（個人間）などの形態がある。EDI（Electronic Data Interchange：電子データ交換）は注文書・請求書等の取引データを標準的な形式で交換する仕組み。決済では本人認証、カード情報の保護、不正検知、返金・チャージバックなどの業務も考える。\u003c/p>\n\u003cp>CRM（Customer Relationship Management：顧客関係管理）は顧客情報・接点・継続利用を統合して管理する。顧客データを集めるときは同意・利用目的・アクセス権・品質を考慮する。電子署名・電子契約・電子帳簿の適法要件は契約種別と制度に依存する。\u003c/p>\n","worked":"\u003cp>注文が成功しても在庫更新に失敗した場合、顧客への通知・決済取消し・補償など例外処理が必要。システム図と業務フローを対応させる。\u003c/p>\n","prompt":"購買履歴を集めれば目的外利用に制限はないか。","answer":"\u003cp>ないわけではない。個人情報保護や契約に基づく目的・同意・安全管理が必要。\u003c/p>\n","beginner":{"scenario":"Web注文の受付、決済承認、在庫引当、出荷は別の処理。途中失敗時は二重請求や過剰販売を防ぐ必要がある。","trap":"決済承認と売上確定は必ずしも同じではない。","quizId":"U-21-2"}},{"id":"21-3","title":"IoT・AI・業務適用","explain":"\u003cp>IoTは現実の装置をネットワークにつなぎ、収集したデータで監視・予測・制御を行う。エッジ処理は機器近くで処理して遅延・通信量を減らし、クラウド処理は大規模集約・分析などに向く。AI（Artificial Intelligence：人工知能）を業務へ導入するときは入力データ、学習と推論の分布差、説明可能性、人の確認、誤判定の責任を検討する。\u003c/p>\n\u003cp>機械学習では教師あり学習が正解ラベルを使い、教師なし学習はデータ構造を発見し、強化学習は報酬に基づいて行動方針を学ぶ。学習データ上の精度が高くても未見の環境で性能が保たれるとは限らない（過学習・分布シフト）。\u003c/p>\n","worked":"\u003cp>工場センサの異常検知を自動停止に直結する場合、偽陽性による停止損失・偽陰性による事故リスクがある。人手確認、しきい値、フェイルセーフ、ログを設計する。\u003c/p>\n","prompt":"AI分類器の全体正解率が99%なら、重大異常を99%見逃さないか。","answer":"\u003cp>そうとは限らない。重大異常の再現率や偽陰性率を別に評価する。\u003c/p>\n","beginner":{"scenario":"工場の振動センサで値を取得し、エッジで異常を検出して保全担当に通知する。クラウドに全データを送らず遅延を抑える場合もある。","trap":"IoTは機器の接続・データ取得、AIはデータ分析の方法。両方が必須とは限らない。","quizId":"U-21-3"}},{"id":"21-X01","title":"製造・エンジニアリングシステム","explain":"\u003cp>MRP（資材所要量計画）は生産計画、部品表、在庫、調達期間から必要な資材と発注時期を計算する。JIT（ジャストインタイム）は必要なものを必要な時に必要量供給する。生産管理では需要予測、在庫、工程、品質、納期を調整する。\u003c/p>\u003cp>CAD（コンピュータ支援設計）は図面・モデル作成、CAE（コンピュータ支援工学）はシミュレーションや解析、CAM（コンピュータ支援製造）は加工データ作成、CIM（コンピュータ統合生産）は設計・生産等の統合を指す。デジタルツインは実物とデジタルモデルを対応させる。\u003c/p>","worked":"\u003cp>製品10個に部品Bを3個ずつ使用し在庫8個なら、他の入荷や安全在庫を無視した純所要量は22個。\u003c/p>","prompt":"構造物の応力解析に主に使うシステムは？","answer":"\u003cp>CAE。\u003c/p>","beginner":{"scenario":"製品10個に部品を3個ずつ使い、在庫8個、他の入荷や安全在庫なしなら純所要量は10×3−8＝22個。納期に合わせ発注時期も考える。","trap":"MRPは必要量・時期の計画。JITは必要なものを必要な時に必要量供給する考え方。","quizId":"U-21-X01"}},{"id":"21-X02","title":"民生機器・産業機器と電子ビジネス","explain":"\u003cp>民生機器は家電、スマートフォン、ゲーム機、ウェアラブルなど。産業機器は工場ロボット、工作機械、プラント制御、医療・交通等の機器を含む。組込みシステムではリアルタイム性、消費電力、安全性、保守性、ネット接続のリスクが重要となる。\u003c/p>\u003cp>IoT（モノのインターネット）では端末、通信、クラウド・エッジ処理を組み合わせる。電子商取引（EC）にはBtoB（企業間）、BtoC（企業対消費者）、CtoC（消費者間）がある。EDIは企業間の電子データ交換、POSは販売時点情報管理。決済では認証、改ざん防止、個人情報保護、取引記録が必要。\u003c/p>","worked":"\u003cp>工場設備の振動データから故障兆候を検出し点検を指示する予知保全は、産業機器におけるIoT活用例。\u003c/p>","prompt":"消費者同士が取引するフリーマーケットアプリの分類は？","answer":"\u003cp>CtoC。\u003c/p>","beginner":{"scenario":"家電の温度制御では安全性や消費電力が重要。工場ロボットでは正確な位置制御に加え、停止時の安全・稼働率も重要。","trap":"民生と産業機器は用途が異なるが、共通の組込み技術を利用することもある。","quizId":"U-21-X02"}}],"beginnerIntro":"実際の企業や製造・流通・電子商取引がどうITを使うか学ぶ。略語を役割と業務の流れで整理する。"},{"id":22,"title":"企業活動・会計・データ分析","group":"ストラテジ","priority":"A重要","summary":"会計財務、財務諸表、在庫、意思決定、統計、組織。","lessons":[{"title":"財務諸表","body":"貸借対照表（BS：Balance Sheet）は一時点の資産・負債・純資産。損益計算書（PL：Profit and Loss Statement）は期間の収益・費用・利益。キャッシュフロー計算書は現金の動きを表す。","check":"利益が出ても資金繰りは悪化し得る。"},{"title":"財務分析","body":"流動比率=流動資産÷流動負債×100%、自己資本比率=自己資本÷総資産×100%、ROE（Return on Equity：自己資本利益率）=当期純利益÷自己資本。","check":"期末残高と平均残高のどちらを用いるかを確認。"},{"title":"統計","body":"平均・中央値・分散・標準偏差は分布の特徴を表す。相関係数は−1〜1だが因果関係は示さない。回帰は目的変数と説明変数の関係をモデル化する。","check":"相関があっても因果とは限らない。"},{"title":"在庫管理","body":"経済的発注量EOQ（Economic Order Quantity）は発注費用と在庫保管費用を均衡させる発注数量。一般形は√(2DS/H)（D需要量、S発注1回費用、H単位期間の1個当たり保管費用）。","check":"需要の変動や欠品費用など前提に注意。"}],"terms":[{"term":"貸借対照表","definition":"ある時点の資産・負債・純資産を表す財務諸表"},{"term":"損益計算書","definition":"一定期間の収益・費用・利益を表す財務諸表"},{"term":"キャッシュフロー","definition":"一定期間の現金の流入と流出"},{"term":"流動比率","definition":"流動資産を流動負債で割る短期支払能力の指標"},{"term":"自己資本比率","definition":"総資産に対する自己資本の割合"},{"term":"ROE","definition":"当期純利益を自己資本で割った利益率"},{"term":"標準偏差","definition":"分布の値のばらつきを元と同じ単位で示す統計量"},{"term":"相関係数","definition":"二変数の線形関係の向き・強さを示す−1〜1の指標"},{"term":"回帰分析","definition":"一方の変数を別の変数で説明・予測する手法"},{"term":"EOQ","definition":"発注費と在庫保管費の合計が小さくなる発注数量"}],"questions":[{"id":"Q22-01","chapter":22,"kind":"applied","q":"流動資産600、流動負債400の企業の流動比率は。","options":["67%","100%","150%","200%"],"correct":2,"explain":"600÷400×100=150%。"},{"id":"Q22-02","chapter":22,"kind":"applied","q":"「売上増加と広告費の相関が高い」から直ちに結論できるのは。","options":["広告費が売上増を必ず引き起こす","売上が広告費を必ず引き起こす","両者に線形関係が観測された","第三要因は存在しない"],"correct":2,"explain":"相関だけでは因果関係は確定しない。"},{"id":"Q22-03","chapter":22,"kind":"applied","q":"資産1000、負債600の場合の自己資本比率は。","options":["20%","40%","60%","100%"],"correct":1,"explain":"自己資本=1000−600=400、400÷1000=40%。"},{"id":"D22-01","chapter":22,"kind":"applied","q":"売上1,000万円、売上原価600万円、販管費250万円の場合の営業利益はどれか。","options":["150万円","250万円","400万円","750万円"],"correct":0,"explain":"売上総利益=1000−600=400万円、営業利益=400−250=150万円。"},{"id":"D22-02","chapter":22,"kind":"applied","q":"商品単価2,000円、変動費1,200円、固定費80万円の損益分岐点数量はどれか。","options":["400個","800個","1,000個","1,600個"],"correct":2,"explain":"限界利益=2,000−1,200=800円/個。800,000/800＝1,000個。"},{"id":"D22-03","chapter":22,"kind":"applied","q":"相関係数0.9の分析から判断できることはどれか。","options":["AがBの原因であることが証明された","線形の正の関連が強いが因果は確定しない","関係が一切ない","必ず外れ値が存在しない"],"correct":1,"explain":"相関は直線的関連の強さ。交絡・逆因果・非線形性を考慮する。"},{"id":"Q-22-X01","chapter":22,"kind":"applied","q":"多数の不良原因から優先改善対象を選ぶのに適した図は？","options":["散布図","パレート図","ER図","状態遷移図"],"correct":1,"explain":"パレート図。"},{"id":"Q-22-X02","chapter":22,"kind":"applied","q":"総資産500万円、利益25万円ならROAは？","options":["2%","5%","10%","20%"],"correct":1,"explain":"25/500×100＝5%。"},{"id":"U-22-1","chapter":22,"kind":"applied","q":"ある時点の資産・負債・純資産を示す財務諸表は？","options":["損益計算書","キャッシュフロー計算書","貸借対照表","売上予算表"],"correct":2,"explain":"貸借対照表は時点の財政状態、損益計算書は期間の経営成績。"},{"id":"U-22-2","chapter":22,"kind":"applied","q":"固定費30万円、限界利益率0.4の損益分岐点売上高は？","options":["12万円","120万円","30万円","75万円"],"correct":3,"explain":"固定費÷限界利益率=30/0.4=75万円。"},{"id":"U-22-3","chapter":22,"kind":"applied","q":"2変数の線形な関連の方向と強さを表す代表的指標は？","options":["相関係数","平均値","分散","中央値"],"correct":0,"explain":"相関係数は線形関係の方向・強さを示す。因果を保証しない。"},{"id":"U-22-4","chapter":22,"kind":"applied","q":"成功利益80万円が確率0.75、失敗損失40万円が0.25の期待値は？","options":["60万円","50万円","70万円","20万円"],"correct":1,"explain":"80×0.75＋(−40)×0.25＝60−10＝50万円。"},{"id":"U-22-X01","chapter":22,"kind":"applied","q":"原因候補を魚の骨のような形で整理するQC手法は？","options":["パレート図","散布図","特性要因図","ヒストグラム"],"correct":2,"explain":"特性要因図は結果と原因候補を分類して図示する。"},{"id":"U-22-X02","chapter":22,"kind":"applied","q":"自己資本200万円、純利益20万円のROEは？","options":["5%","20%","100%","10%"],"correct":3,"explain":"ROE（自己資本利益率）は純利益÷自己資本×100。"}],"deepIntro":"利益・現金・投資効率はそれぞれ違う尺度。データ分析は「数式が合っているか」と「結論が妥当か」を分けて考える。","deep":[{"id":"22-1","title":"財務三表・損益・キャッシュフロー","explain":"\u003cp>PL（Profit and Loss Statement：損益計算書）は一定期間の収益と費用、BS（Balance Sheet：貸借対照表）は一定時点の資産・負債・純資産、CF（Cash Flow Statement：キャッシュフロー計算書）は現金の増減を示す。売上が増えても売掛金が増えれば現金はすぐ増えない。減価償却費は資産取得費用を利用期間へ配分する会計上の費用で、計上時に毎回現金が流出するわけではない。\u003c/p>\n\u003cp>売上総利益＝売上高−売上原価、営業利益＝売上総利益−販売費及び一般管理費。流動比率＝流動資産/流動負債×100%、自己資本比率＝自己資本/総資本×100%などは比率の分母を確認する。\u003c/p>\n","worked":"\u003cp>売上1,000万円、売上原価600万円、販管費250万円なら売上総利益400万円、営業利益150万円。ここから営業外損益や税金を考えて最終利益へ進む。\u003c/p>\n","prompt":"利益が出ている企業は資金繰りで倒産しないか。","answer":"\u003cp>倒産し得る。支払タイミングと現金残高が重要。\u003c/p>\n","beginner":{"scenario":"商品を掛売り100万円で販売し費用60万円を現金で払うと、利益40万円でも現金は60万円減少する。売掛金100万円が資産になる。","trap":"利益と現金増減は別。損益計算書は一定期間、貸借対照表は一時点。","quizId":"U-22-1"}},{"id":"22-2","title":"損益分岐点・原価計算・利益計画","explain":"\u003cp>固定費は生産数量に関わらず一定範囲では変わりにくい費用、変動費は販売・生産量に伴って変わる費用。販売単価p、1個当たり変動費v、固定費Fなら損益分岐点数量Q＝F/(p−v)。限界利益率は(売上−変動費)/売上。売上高で計算するなら損益分岐点売上高＝固定費/限界利益率。\u003c/p>\n\u003cp>原価には直接材料費・直接労務費・製造間接費などがあり、活動基準原価計算（ABC：Activity-Based Costing）は活動を通じた原価配賦を考える。短期の意思決定と長期の費用管理では見るべき原価が異なる。\u003c/p>\n","worked":"\u003cp>商品単価2,000円、変動費1,200円、固定費80万円なら限界利益800円、損益分岐点数量800,000/800＝1,000個。900個では固定費を回収できない。\u003c/p>\n","prompt":"売上単価と変動費が同額なら、販売数量を増やしても固定費を回収できるか。","answer":"\u003cp>できない。限界利益が0だから。\u003c/p>\n","beginner":{"scenario":"販売価格1000円、変動費600円、固定費20万円。1個当たり限界利益400円なので500個で固定費を回収し利益が0になる。","trap":"固定費は販売量に比例しないと仮定する。限界利益と最終利益を区別する。","quizId":"U-22-2","lab":{"title":"利益計画から必要販売数を逆算","problem":"販売単価2000円、1個当たり変動費1200円、固定費40万円。利益20万円にする販売数は？","steps":["売上から変動費を引いた1個当たり限界利益は2000−1200＝800円。","全体利益=800×販売数−400000。","目標200000を代入すると800×販売数=600000。","販売数=600000÷800＝750個。損益分岐点は400000÷800＝500個。"],"answer":"750個","check":"損益分岐点は利益0、目標利益が指定されたら固定費に目標利益を足す。"}}},{"id":"22-3","title":"統計・相関・検定・データの読み方","explain":"\u003cp>平均は合計/個数、中央値は順序中央、最頻値は最も頻繁な値。極端な値が含まれると平均は大きく影響される。分散は値が平均からどれだけ散らばるかの尺度で、標準偏差は分散の平方根。相関係数は線形関係の強さを−1～1で表すが、\u003cstrong>相関は因果を意味しない\u003c/strong>。散布図で外れ値、非線形の関係、群の混合を確認する。\u003c/p>\n\u003cp>仮説検定では帰無仮説と対立仮説を設け、データが帰無仮説の下でどれほど珍しいかをp値で考える。p値は「帰無仮説が正しい確率」ではない。標本抽出の偏り、検出力、多重比較を考慮して結論を出す。\u003c/p>\n","worked":"\u003cp>商品購入者だけに満足度調査をすると非購入者の不満が欠落し、潜在顧客全体へ一般化できない。高い平均点でも標本の選び方を確認する。\u003c/p>\n","prompt":"相関係数0.9なら、Aを増やせばBが必ず増えるといえるか。","answer":"\u003cp>いえない。交絡要因や逆方向の因果があり得る。\u003c/p>\n","beginner":{"scenario":"データ1、2、3、4、100では平均22、中央値3。極端な値が平均を押し上げるので目的に応じ代表値を選ぶ。","trap":"相関があっても因果関係を示すとは限らない。標本の偏りも考える。","quizId":"U-22-3"}},{"id":"22-4","title":"業務分析・意思決定・最適化","explain":"\u003cp>問題解決では現状を測り、目標との差を構造化し、原因仮説と検証指標を設定する。パレート図は頻度や影響の大きい項目を優先する手掛かり、特性要因図は原因候補の整理、管理図は時系列の変動や異常を監視する。ABC分析は売上・在庫金額等の寄与度に応じて重点管理する方法。\u003c/p>\n\u003cp>線形計画法は目的関数を制約条件の下で最大・最小にする手法。例えば製品A/Bの利益と材料・作業時間から最適な生産量を求める。決定木や期待値による意思決定では、選択肢ごとの結果と確率を明示する。\u003c/p>\n","worked":"\u003cp>商品100種類のうち売上上位10種類が全体売上の70%なら、発注管理や欠品対策を重点化する根拠になる。ただし利益率・戦略的重要性なども評価する。\u003c/p>\n","prompt":"管理図で工程が管理限界内なら製品仕様をすべて満たすか。","answer":"\u003cp>必ずではない。統計的な安定性と仕様適合は別。\u003c/p>\n","beginner":{"scenario":"商品Aの利益100が確率0.6、損失20が0.4なら期待値52。Bの利益60が0.9、損失10が0.1なら期待値53。","trap":"期待値が高くても最大損失や実行制約が許容できるとは限らない。","quizId":"U-22-4"}},{"id":"22-X01","title":"経営・組織論と品質管理","explain":"\u003cp>機能別組織は専門機能別、事業部制は製品や市場別、マトリックス組織は複数の指揮系統を組み合わせる。権限委譲は判断を現場に近づけるが責任範囲を明確にする。経営理念・目標、企業の社会的責任（CSR）、利害関係者との関係を理解する。\u003c/p>\u003cp>QC七つ道具（品質管理の基本手法）にはパレート図、特性要因図、ヒストグラム、散布図、チェックシート、管理図、層別（分類には流儀あり）がある。パレート図は頻度順と累積比率で重点を選ぶ。特性要因図は原因候補を分類し、管理図は時系列変動と管理限界を比較する。PDCAで改善する。\u003c/p>","worked":"\u003cp>不良100件のうち傷60、寸法30、その他10なら傷と寸法の改善で90%の不良件数に対応できる。\u003c/p>","prompt":"多数の不良原因から優先改善対象を選ぶのに適した図は？","answer":"\u003cp>パレート図。\u003c/p>","beginner":{"scenario":"不良100件の内訳が傷60、寸法30、その他10なら、頻度の大きい項目から改善を考える。パレート図は件数と累積比率を示す。","trap":"件数が多い原因が最も重大とは限らない。影響の大きさも評価する。","quizId":"U-22-X01"}},{"id":"22-X02","title":"財務分析・投資評価・データ活用","explain":"\u003cp>ROA（総資産利益率）は利益を総資産で割り、ROE（自己資本利益率）は利益を自己資本で割る。流動比率は流動資産÷流動負債で短期支払能力の目安。総資産回転率は売上高÷総資産。売上高利益率との積は同じ利益定義ならROAとなる。\u003c/p>\u003cp>NPV（正味現在価値）は将来キャッシュフローを割引き初期投資を差し引く。IRR（内部収益率）はNPVを0にする割引率。損益分岐点、直接・間接費、固定・変動費、標準原価差異も理解する。データ分析では名義・順序・間隔・比例尺度を区別し、外れ値、欠測、選択バイアス、相関と因果に注意する。\u003c/p>","worked":"\u003cp>初期投資100万円、1年後110万円の回収、割引率10%ならNPV=110/1.1−100＝0万円。\u003c/p>","prompt":"総資産500万円、利益25万円ならROAは？","answer":"\u003cp>25/500×100＝5%。\u003c/p>","beginner":{"scenario":"1年後110万円を得る投資を割引率10%で評価すると現在価値100万円。初期投資90万円ならNPV=10万円。","trap":"割引率・キャッシュフローの仮定が変わると投資評価も変わる。","quizId":"U-22-X02","lab":{"title":"現在価値で投資判断する","problem":"初期投資100万円。1年後55万円、2年後60.5万円の純キャッシュフロー。割引率10%。NPVは？","steps":["1年後の55万円の現在価値は55/1.1=50万円。","2年後の60.5万円は60.5/(1.1²)=50万円。","現在価値合計100万円。初期投資100万円を引く。","NPV=0万円。仮定した割引率では経済的価値の増加が0。"],"answer":"0万円","check":"将来の現金をそのまま足さず、年数に応じ割引く。"}}}],"beginnerIntro":"企業の数字と組織・業務の改善方法を学ぶ。会計は時点・期間、利益・現金、固定費・変動費を区別する。"},{"id":23,"title":"法務・標準化・知的財産","group":"ストラテジ","priority":"A重要","summary":"著作権・特許・個人情報・契約・労務・不正アクセスと標準。","lessons":[{"title":"著作権と特許","body":"著作権は原則として創作時に発生し、表現を保護する。特許は出願・審査・登録を経て技術的思想の創作を一定期間保護する。アイデアそのものと表現を混同しない。","check":"ソフトウェアのソースコードは著作権の対象となり得る。"},{"title":"個人情報","body":"個人情報保護法では利用目的の特定・安全管理措置・第三者提供の規律等を理解する。匿名加工情報と仮名加工情報では本人識別や取扱いのルールが異なる。","check":"匿名化したつもりでも再識別可能性を考える。"},{"title":"情報セキュリティ法規","body":"不正アクセス禁止法は他人の識別符号の無断入力などを規制。電子署名、営業秘密、サイバー犯罪への対応も把握する。","check":"単なる規約違反と法律違反は区別。"},{"title":"標準と契約","body":"JIS（Japanese Industrial Standards：日本産業規格）やISO（International Organization for Standardization：国際標準化機構）の規格は品質・安全・互換性等の共通基準。契約では秘密保持・成果物権利・再委託・責任範囲を確認。","check":"最新の法改正や規格の版は直前に一次情報で確認。"}],"terms":[{"term":"著作権","definition":"文章・プログラムなどの創作的な表現を保護する権利"},{"term":"特許権","definition":"一定の要件を満たす発明を出願・審査・登録によって保護する権利"},{"term":"商標権","definition":"商品・サービスの出所を識別する標識を保護する権利"},{"term":"営業秘密","definition":"秘密管理性・有用性・非公知性などを満たす事業上の情報"},{"term":"個人情報","definition":"生存する個人に関する情報で特定個人を識別できるもの等"},{"term":"仮名加工情報","definition":"他の情報と照合しない限り特定個人を識別できないよう加工した個人情報等"},{"term":"匿名加工情報","definition":"特定個人の識別や復元ができないよう法定基準で加工した情報"},{"term":"不正アクセス禁止法","definition":"他人のIDやパスワードの不正利用などを規制する法律"},{"term":"JIS","definition":"日本の産業分野に関する国家規格"},{"term":"ISO","definition":"国際的な規格を制定する標準化団体"},{"term":"NDA","definition":"秘密保持契約。Non-Disclosure Agreementの略"}],"questions":[{"id":"Q23-01","chapter":23,"kind":"applied","q":"一般に著作権が発生するタイミングは。","options":["創作時","特許庁への登録時","公開から10年後","販売開始時のみ"],"correct":0,"explain":"著作権は原則創作と同時に発生する。"},{"id":"Q23-02","chapter":23,"kind":"applied","q":"特許権と著作権の説明として正しいのは。","options":["著作権はアイデア自体を保護する","特許は出願・審査・登録を要する","特許は創作時に自動成立する","プログラムには著作権が生じない"],"correct":1,"explain":"特許は方式・審査を経て登録される。"},{"id":"Q23-03","chapter":23,"kind":"applied","q":"営業秘密の代表的な要件の組は。","options":["秘密管理性・有用性・非公知性","公開性・無料性・巨大性","即時性・配布性・広告性","計算性・確率性・可用性"],"correct":0,"explain":"不正競争防止法上の営業秘密の三要件。"},{"id":"D23-01","chapter":23,"kind":"applied","q":"他人が作ったWeb画像を自社サイトへ転載する際の原則的な考え方として適切なものはどれか。","options":["閲覧可能なら常に転載自由","画像には著作権がない","利用許諾や法定の例外等を確認する","出典を隠せばよい"],"correct":2,"explain":"閲覧可能性と転載許諾は別。権利者・条件・適用される例外を確認する。"},{"id":"D23-02","chapter":23,"kind":"applied","q":"営業秘密としての保護に一般に必要な条件の組合せはどれか。","options":["知名度・資本金・社員数","秘密管理性・有用性・非公知性","登録日・商標区分・発行部数","売上・広告費・生産量"],"correct":1,"explain":"不正競争防止法上の営業秘密の3要件を区別する。"},{"id":"D23-03","chapter":23,"kind":"applied","q":"請負契約と書かれていても、現場で発注者が請負先作業者に直接指揮命令する場合の懸念はどれか。","options":["必ず正当な請負になる","契約名で全ての実態が決まる","偽装請負等の問題につながる可能性がある","システム監査が不要になる"],"correct":2,"explain":"契約の名称だけでなく実際の指揮命令関係等が判断上重要になる。"},{"id":"Q-23-X01","chapter":23,"kind":"applied","q":"2026年1月施行の取適法で新たに禁止された支払方法は？","options":["期日内の現金振込","手形払い","事前合意した現金払い","期日内の口座振込"],"correct":1,"explain":"手形払い。適用対象取引では禁止される。"},{"id":"Q-23-X02","chapter":23,"kind":"applied","q":"一定の要件を満たす電子署名による電子文書の真正な成立の推定を定める法律は？","options":["電子署名法","労働基準法","独占禁止法","不正アクセス禁止法"],"correct":0,"explain":"電子署名法。"},{"id":"U-23-1","chapter":23,"kind":"applied","q":"商品やサービスの出所を識別する標識を登録により保護する権利は？","options":["商標権","特許権","著作権","実用新案権"],"correct":0,"explain":"商標権は商品・役務を識別する標識の保護。著作権は創作的表現を保護する。"},{"id":"U-23-2","chapter":23,"kind":"applied","q":"営業秘密の保護要件の組合せとして適切なのは？","options":["登録・売上・公開性","秘密管理性・有用性・非公知性","独自性・広告・知名度","特許査定・創作性・公知性"],"correct":1,"explain":"不正競争防止法上の営業秘密は3要件を満たす情報。"},{"id":"U-23-3","chapter":23,"kind":"applied","q":"派遣労働者に就業上の指揮命令を行うのは原則誰か？","options":["派遣元の顧客全員","取引先の監査人","派遣先","派遣労働者自身のみ"],"correct":2,"explain":"労働者派遣では派遣元が雇用し、派遣先の指揮命令下で就業する。"},{"id":"U-23-4","chapter":23,"kind":"applied","q":"情報セキュリティマネジメントシステムの要求事項を定める規格は？","options":["ISO 9001","ISO 22301","ISO/IEC 20000-1","ISO/IEC 27001"],"correct":3,"explain":"27001は情報セキュリティ、9001は品質、22301は事業継続、20000-1はITサービス管理。"},{"id":"U-23-X01","chapter":23,"kind":"applied","q":"取適法（2026年1月施行）で追加された事業者規模の判断基準は？","options":["従業員数基準","Webサイト閲覧数","広告費基準","商標登録件数"],"correct":0,"explain":"資本金基準に加え、取引類型に応じた従業員数基準が追加された。"},{"id":"U-23-X02","chapter":23,"kind":"applied","q":"電子署名法が一定の電子署名について定める効果は？","options":["全内容の真実性保証","電子文書の真正な成立の推定","特許権の自動発生","著作権の自動消滅"],"correct":1,"explain":"一定の本人による電子署名がある場合、文書の真正な成立が推定される。内容の真実性までは保証しない。"}],"deepIntro":"名称を覚えるだけでなく、どの対象に、何を、誰が、どの条件でしてよいかを区別する。","deep":[{"id":"23-1","title":"知的財産権・特許・著作権・商標","explain":"\u003cp>特許権は発明を一定期間保護する権利で、新規性・進歩性等の要件を満たして特許査定・登録等の手続を経る。著作権は思想・感情を創作的に表現した著作物を保護し、原則として創作時に発生する。商標権は商品・役務を識別する標識を登録等により保護する。意匠権は物品等のデザインに関する権利。保護対象、発生要件、期間、権利行使が異なる。\u003c/p>\n\u003cp>プログラムのソースコードは著作権の対象になり得るが、アルゴリズムやアイデアそのものが表現と同じように保護されるわけではない。ソフトウェアライセンスでは複製、改変、再配布、ソース開示義務を確認する。\u003c/p>\n","worked":"\u003cp>他社が作った画像をWebサイトに掲載する場合、インターネット上で閲覧できるだけでは自由利用の許諾にならない。権利者、許諾範囲、例外規定を確認する。\u003c/p>\n","prompt":"OSSなら必ず著作権を放棄しているか。","answer":"\u003cp>違う。著作権を前提に利用・改変・再配布の条件を許諾するライセンスが多い。\u003c/p>\n","beginner":{"scenario":"ゲームのプログラムの具体的表現は著作権、技術的な発明は要件を満たして登録されれば特許権、商品を識別するロゴは商標権で保護できる場合がある。","trap":"著作権は原則創作時に発生する。特許権は出願だけで発生するわけではない。","quizId":"U-23-1"}},{"id":"23-2","title":"個人情報保護・情報セキュリティ法制","explain":"\u003cp>日本の個人情報保護法は個人情報・個人データ・保有個人データ等を区別し、利用目的、安全管理措置、第三者提供、本人の権利などを定める。仮名加工情報と匿名加工情報は加工方法、再識別、取扱い規律が異なる。特定個人情報（マイナンバー関係）には別途厳格な規律がある。対象事業・例外・最新法令の適用は必ず確認する。\u003c/p>\n\u003cp>不正アクセス禁止法は他人の識別符号の不正利用等によるアクセス行為などを規制する。不正競争防止法の営業秘密は秘密管理性・有用性・非公知性を満たす情報。不正取得・使用・開示に関する規律がある。情報の流出を防ぐ技術対策だけでなく、契約・教育・物理管理も必要。\u003c/p>\n","worked":"\u003cp>顧客データを外注先に渡す場合、「外注だから第三者提供は自由」と即断せず、委託先の監督、安全管理、利用目的の範囲、提供区分を確認する。\u003c/p>\n","prompt":"住所が含まれなければ個人情報ではないか。","answer":"\u003cp>そうとは限らない。氏名・識別子・容易に照合できる情報などにより特定個人を識別できる場合がある。\u003c/p>\n","beginner":{"scenario":"顧客データを外部の集計事業者に委託する場合、利用目的の範囲・委託先の監督・安全管理を確認する。","trap":"委託と第三者提供は同一の扱いではない。法的要件は具体的状況で確認する。","quizId":"U-23-2"}},{"id":"23-3","title":"労働・取引・契約・コンプライアンス","explain":"\u003cp>労働基準法は労働時間等の最低基準、労働者派遣法は派遣事業・派遣先の適正な運用に関する規律を含む。請負・準委任・労働者派遣は契約書の名称だけで決まるものではなく、実際の指揮命令関係等を踏まえる。発注者が請負先作業者に直接労務指揮することは偽装請負等の問題につながり得る。\u003c/p>\n\u003cp>下請取引の規律、独占禁止法、景品表示法、消費者保護などは取引類型と当事者の規模等で適用が異なる。コンプライアンスは「法律違反だけしなければよい」ではなく、倫理・契約・社内規程・説明責任を含む仕組みである。改正法があるため細かな適用条件は最新情報を確認する。\u003c/p>\n","worked":"\u003cp>委託契約なのに発注元が作業者へ日々直接指示し勤怠を管理していれば、契約実態に基づき問題となる可能性がある。職務分担と指揮命令系統を整理する。\u003c/p>\n","prompt":"契約書に「請負」と書けば常に請負になるか。","answer":"\u003cp>ならない。実態が重要。\u003c/p>\n","beginner":{"scenario":"請負契約で成果物の完成を求めても、発注者が受託側作業者へ日々直接指揮命令する場合は偽装請負等の問題につながり得る。","trap":"契約の名称だけで法的な実態は決まらない。","quizId":"U-23-3"}},{"id":"23-4","title":"標準化・品質・監査関連の規格","explain":"\u003cp>標準化は仕様の共通化により互換性、品質、調達のしやすさを高める。ISO（International Organization for Standardization：国際標準化機構）、IEC（International Electrotechnical Commission：国際電気標準会議）、JIS（Japanese Industrial Standards：日本産業規格）などがある。ISO 9001は品質マネジメント、ISO/IEC 27001は情報セキュリティマネジメントの要求事項、ISO/IEC 20000-1はITサービスマネジメントの要求事項を扱う。\u003c/p>\n\u003cp>規格への認証取得はシステムの全ての脆弱性が解消されたことを意味しない。適用範囲、審査時点、継続的な改善を確認する。監査証拠は規格・ポリシー・手順と実際の運用記録を照合する。\u003c/p>\n","worked":"\u003cp>「ISO/IEC 27001の認証を取得している」だけでは、特定WebアプリのSQLインジェクションが存在しないとはいえない。別途脆弱性診断と修正が必要。\u003c/p>\n","prompt":"JISとISOは同じ組織か。","answer":"\u003cp>違う。JISは日本の国家規格、ISOは国際的な標準化機関。\u003c/p>\n","beginner":{"scenario":"会社が情報セキュリティ管理の規格に認証されても、個別アプリに脆弱性がないとは限らない。個々のリスク評価や診断を続ける。","trap":"マネジメントシステム認証と製品の性能保証を混同しない。","quizId":"U-23-4"}},{"id":"23-X01","title":"取適法・労働取引法規の改正","explain":"\u003cp>2026年1月1日施行の中小受託取引適正化法（取適法）は旧下請法を改正したもの。委託事業者と中小受託事業者の間の対象取引を適正化し、代金支払遅延や不当な減額等を防ぐ。適用対象は委託内容、資本金、従業員数などの基準で判断される。情報成果物作成委託も対象となり得る。\u003c/p>\u003cp>改正では従業員数基準の追加、一定の運送委託の追加、協議に応じない一方的な代金決定の禁止、手形払い等の禁止が重要。対象取引では受領日から原則60日以内でできる限り短い支払期日を定める。労働基準法、労働者派遣法、独占禁止法、フリーランス法は別の法規であり、適用条件を混同しない。出典：公正取引委員会 https://www.jftc.go.jp/toriteki/\u003c/p>","worked":"\u003cp>対象となるソフトウェア委託で、受託側が費用上昇を理由に協議を求めたのに発注側が協議せず一方的に価格を据え置く行為は問題となり得る。\u003c/p>","prompt":"2026年1月施行の取適法で新たに禁止された支払方法は？","answer":"\u003cp>手形払い。適用対象取引では禁止される。\u003c/p>","beginner":{"scenario":"対象となるソフトウェア委託で受託側が原材料・人件費上昇を理由に価格協議を申し出たとき、発注側が協議せず一方的に価格を決めることは規制対象となり得る。","trap":"取適法の適用は取引類型・規模等の法定基準で判断する。すべての委託契約に一律適用されない。","quizId":"U-23-X01"}},{"id":"23-X02","title":"その他の法令・ガイドライン・技術者倫理","explain":"\u003cp>電子署名法は一定の電子署名がなされた電子文書の真正な成立の推定等を定める。公益通報者保護法は法令違反の通報者保護等を扱う。個人情報保護法、不正アクセス禁止法、不正競争防止法、特定商取引法、景品表示法などの目的と適用場面を区別する。\u003c/p>\u003cp>技術者倫理は法令遵守だけでなく安全性、公平性、プライバシー、説明責任、利益相反、社会的影響を考慮すること。AIのバイアス、個人情報の目的外利用、秘密情報の漏えい、著作権侵害、生成内容の誤りを評価する。標準化では国際規格、国家規格、業界標準、事実上の標準を区別する。\u003c/p>","worked":"\u003cp>自動採用システムが特定集団に不利な判定をしていると分かったら、精度だけでなく公平性を評価し是正する。\u003c/p>","prompt":"一定の要件を満たす電子署名による電子文書の真正な成立の推定を定める法律は？","answer":"\u003cp>電子署名法。\u003c/p>","beginner":{"scenario":"採用AIが特定集団を不当に不利に扱う場合、精度だけでなくデータの偏り・公平性・説明可能性を確認し是正する。","trap":"法令遵守だけで技術者の責任を果たしたとは限らない。","quizId":"U-23-X02"}}],"beginnerIntro":"技術を適法かつ責任ある形で扱うための法律と規格を学ぶ。何を保護し、どんな行為を規制するかを事例から区別する。"}],"questions":[{"id":"Q01-01","chapter":1,"kind":"applied","q":"8ビットの2の補数で表せる最大整数はどれか。","options":["127","128","255","256"],"correct":0,"explain":"符号ビット1個を除く7ビットで正の最大は2^7−1=127。"},{"id":"Q01-02","chapter":1,"kind":"applied","q":"独立な装置AとBの稼働確率が0.9と0.8のとき、両方稼働する確率は。","options":["0.72","0.80","0.90","0.98"],"correct":0,"explain":"独立なら積を取るので0.9×0.8=0.72。"},{"id":"Q01-03","chapter":1,"kind":"applied","q":"毎秒8件到着し毎秒10件処理できるM/M/1の平均系内滞在時間は。","options":["0.1秒","0.2秒","0.5秒","2秒"],"correct":2,"explain":"1/(μ− ","オンプレミス","SaaS"],"correct":3,"explain":"SaaSはSoftware as a Service。PaaSは開発実行基盤、IaaSはインフラ資源。"},{"id":"U-18-X01","chapter":18,"kind":"applied","q":"計画の技術・経済・運用上の実現可能性を事前に調べる活動は？","options":["フィージビリティスタディ","回帰テスト","フォローアップ監査","パレート分析"],"correct":0,"explain":"実行可能性を複数観点から調べ、投資・計画判断に使う。"},{"id":"U-19-1","chapter":19,"kind":"applied","q":"SWOT分析で新たな競合参入は通常どれに当たるか？","options":["強み（S）","脅威（T）","弱み（W）","機会（O）"],"correct":1,"explain":"外部環境の不利な要因は脅威。"},{"id":"U-19-2","chapter":19,"kind":"applied","q":"4Pで販売経路を表す要素は？","options":["Product（製品）","Price（価格）","Place（流通）","Promotion（販売促進）"],"correct":2,"explain":"Placeは商品・サービスを顧客へ届ける経路。"},{"id":"U-19-3","chapter":19,"kind":"applied","q":"PPMで低成長かつ相対シェアが高い事業は？","options":["花形","問題児","負け犬","金のなる木"],"correct":3,"explain":"低成長でも高シェアなら資金創出が期待される分類。"},{"id":"U-19-X01","chapter":19,"kind":"applied","q":"BSCの4視点に含まれないものは？","options":["競合企業の株価のみ","財務","顧客","学習と成長"],"correct":0,"explain":"BSCの4視点は財務、顧客、内部業務プロセス、学習と成長。"},{"id":"U-20-1","chapter":20,"kind":"applied","q":"技術・製品・市場の目標を時間軸で関連付けるものは？","options":["監査調書","技術ロードマップ","ER図","真理値表"],"correct":1,"explain":"技術ロードマップは将来目標と技術開発の時期を可視化する。"},{"id":"U-20-2","chapter":20,"kind":"applied","q":"新技術の実現可能性を小規模に確認する活動は？","options":["SLA（サービスレベル合意）","RPO（復旧時点目標）","PoC（概念実証）","MRP（資材所要量計画）"],"correct":2,"explain":"PoCは技術やアイデアが実現可能か検証する。"},{"id":"U-20-3","chapter":20,"kind":"applied","q":"市場で広く普及した結果として事実上の標準となるものは？","options":["デジュールスタンダード","特許査定","商標登録","デファクトスタンダード"],"correct":3,"explain":"デファクトは市場での普及、デジュールは公的な標準化手続による標準。"},{"id":"U-20-X01","chapter":20,"kind":"applied","q":"外部研究機関や企業の技術も取り込んで研究開発する考え方は？","options":["オープンイノベーション","クローズドイノベーション","ウォーターフォールのみ","データ正規化"],"correct":0,"explain":"外部の知識や技術を活用して革新を進める。"},{"id":"U-21-1","chapter":21,"kind":"applied","q":"供給連鎖の上流ほど発注変動が増幅する現象は？","options":["ネットワーク効果","ブルウィップ効果","規模の経済","桁落ち"],"correct":1,"explain":"需要変化の予測・在庫調整などが連鎖し上流の発注変動を増幅する。"},{"id":"U-21-2","chapter":21,"kind":"applied","q":"企業間で注文書や請求書を電子データとして交換する仕組みは？","options":["CRM","POS","EDI"," "correct":1,"explain":"不正競争防止法上の営業秘密は3要件を満たす情報。"},{"id":"U-23-3","chapter":23,"kind":"applied","q":"派遣労働者に就業上の指揮命令を行うのは原則誰か？","options":["派遣元の顧客全員","取引先の監査人","派遣先","派遣労働者自身のみ"],"correct":2,"explain":"労働者派遣では派遣元が雇用し、派遣先の指揮命令下で就業する。"},{"id":"U-23-4","chapter":23,"kind":"applied","q":"情報セキュリティマネジメントシステムの要求事項を定める規格は？","options":["ISO 9001","ISO 22301","ISO/IEC 20000-1","ISO/IEC 27001"],"correct":3,"explain":"27001は情報セキュリティ、9001は品質、22301は事業継続、20000-1はITサービス管理。"},{"id":"U-23-X01","chapter":23,"kind":"applied","q":"取適法（2026年1月施行）で追加された事業者規模の判断基準は？","options":["従業員数基準","Webサイト閲覧数","広告費基準","商標登録件数"],"correct":0,"explain":"資本金基準に加え、取引類型に応じた従業員数基準が追加された。"},{"id":"U-23-X02","chapter":23,"kind":"applied","q":"電子署名法が一定の電子署名について定める効果は？","options":["全内容の真実性保証","電子文書の真正な成立の推定","特許権の自動発生","著作権の自動消滅"],"correct":1,"explain":"一定の本人による電子署名がある場合、文書の真正な成立が推定される。内容の真実性までは保証しない。"}],"cases":[{"id":"B01","title":"外部ライブラリの改ざんと初動対応","domain":"情報セキュリティ","required":true,"passage":"医療機関向け予約システムA社は外部ライブラリLを利用している。開発端末で依存ライブラリを更新した翌日、外部の未知のドメインへの通信が急増した。更新に使ったパッケージ配布元では管理者アカウントの侵害が報告された。端末には接続先情報を含む認証トークンが保管されている。A社は本番環境への配布を一時停止したが、影響範囲と情報漏えいの有無は未確定である。","items":[{"q":"本事象で想定される攻撃の種類を答えよ。","answer":"ソフトウェアサプライチェーン攻撃","reason":"侵害された配布元を通じて正規の更新に悪意あるコードを混入できる。","keywords":["サプライチェーン攻撃"]},{"q":"初動で本番配布停止以外に実施すべきことを2つ挙げよ。","answer":"該当端末を適切に隔離し、通信ログ・更新履歴・端末状態などの証拠を保全する。","reason":"原因未確定の段階で証拠の消失を防ぎながら被害拡大を抑える。","keywords":["隔離","証拠保全"]},{"q":"漏えいの可能性がある認証トークンに対して何をするか。","answer":"影響するトークンを無効化・再発行し、権限と利用履歴を確認する。","reason":"侵害された認証情報の悪用継続を防ぐ。","keywords":["無効化","再発行"]}],"tips":"初動では「封じ込め」と「証拠保全」を両立させる。断定できない漏えいを発生済みと書かない。"},{"id":"B02","title":"経営戦略：EC導入と効果測定","domain":"情報戦略","required":false,"passage":"食品卸B社は電話注文をWeb注文へ移行したい。現在は月1万件の受注があり、1件の入力作業に平均6分かかる。新システムでは2分となる見込み。人件費は1時間当たり2,400円、年間維持費は600万円、初期費用は1,000万円とする。その他の費用と需要変動は無視する。顧客の利用率は導入前に確定しておらず、注文データの形式も顧客ごとに異なる。","items":[{"q":"月間で削減できる作業時間は何時間か。","answer":"約667時間","reason":"1万件×(6−2)分÷60=666.7時間。","keywords":["667","時間"]},{"q":"年間の人件費削減額と年間純効果を計算せよ。","answer":"削減額1,920万円、維持費を差し引く年間純効果1,320万円。","reason":"年間1万件×12×4/60×2,400=19,200,000円。","keywords":["1920","1320"]},{"q":"上記の試算に対する実務上の留意点を一つ挙げよ。","answer":"Web注文の利用率が100%とは限らないため、移行率を測定して削減効果を再試算する。","reason":"前提が実際と異なると投資効果は過大評価される。","keywords":["利用率","移行率"]}],"tips":"計算条件と未確認前提を分離し、問われた範囲だけを数値で回答。"},{"id":"B03","title":"性能設計：Web/API基盤のボトルネック","domain":"システムアーキテクチャ","required":false,"passage":"WebシステムCの処理は、Web層・業務API層・DB層を順に通る。1秒当たりの最大処理件数はWeb層100、API層80、DB層50である。1件の要求は各層を1回ずつ使用する。今後の利用者増加に備え、最初に1つの層だけを増強する方針である。可用性の要件は99.9%、既存実測値は99.7%とする。","items":[{"q":"現状の理論的な最大スループットを答えよ。","answer":"毎秒50件","reason":"直列の処理では最小能力の層が全体の上限。","keywords":["50"]},{"q":"最初に増強すべき層とその理由を答えよ。","answer":"DB層。1秒当たり50件で最も処理能力が低いため。","reason":"ボトルネックから改善すると全体上限を押し上げやすい。","keywords":["DB","ボトルネック"]},{"q":"稼働率99.7%から99.9%に引き上げるため、原因調査と並行して検討する手段を一つ述べよ。","answer":"単一障害点を特定して冗長化や自動フェイルオーバーを検討する。","reason":"可用性の改善には障害発生率低減または修復時間短縮が有効。","keywords":["冗長化","フェイルオーバー"]}],"tips":"性能と可用性は別要件。処理能力の改善だけでは稼働率要件を満たせない。"},{"id":"B04","title":"ネットワーク：名前解決不具合の切り分け","domain":"ネットワーク","required":false,"passage":"企業Dの社内端末から業務サーバー192.0.2.20へIPアドレス指定でHTTPS接続は成功する。一方、https://sales.example.test では名前解決エラーとなる。端末のDNSサーバーは192.0.2.53に設定されている。管理者がDNSサーバーを確認すると、sales.example.test のAレコードは誤って192.0.2.25を指していた。別の端末では正しいアドレスが表示されるため、キャッシュの影響も疑われる。","items":[{"q":"IPアドレス指定で接続できる事実から、優先的に疑う機能は何か。","answer":"DNSによる名前解決","reason":"IP接続が成功しており、名前を解決する過程でエラーが発生する。","keywords":["DNS","名前解決"]},{"q":"管理者が最初に修正する設定は何か。","answer":"sales.example.testのAレコードを192.0.2.20に修正する。","reason":"AレコードはIPv4アドレスを指定する。","keywords":["Aレコード","192.0.2.20"]},{"q":"修正直後も端末によって結果が異なる原因を挙げよ。","answer":"DNSキャッシュのTTLが残って古い解決結果を使うため。","reason":"DNS情報はTTLにより一定期間キャッシュされる。","keywords":["キャッシュ","TTL"]}],"tips":"疎通／DNS／TLS／アプリのどの層の異常か、与えられた証拠から絞る。"},{"id":"B05","title":"データベース：在庫更新の競合","domain":"データベース","required":false,"passage":"オンライン販売E社の在庫表は 商品ID と 在庫数 を保持する。商品Xの在庫は1個である。購入処理は「在庫数をSELECTで読む→1以上なら注文確定→在庫数を1減らす」の順に実行している。ほぼ同時に2つの購入処理が在庫数1を読み、両方が注文確定した。E社はトランザクション処理で再発を防ぎたい。","items":[{"q":"発生したデータ不整合の原因を説明せよ。","answer":"在庫の確認と更新が排他制御されず、複数処理が同じ在庫1を読んで注文確定したため。","reason":"読取りと更新を一体で制御していない。","keywords":["排他制御","同時"]},{"q":"防止するSQLの設計方針を一つ述べよ。","answer":"在庫数が1以上の行だけを原子的にUPDATEで減算し、更新件数が1のときだけ注文を確定する。","reason":"条件付き更新と影響行数の確認で同時購入競合を防げる。","keywords":["UPDATE","更新件数"]},{"q":"トランザクションに求められるACIDのうち、途中で失敗した更新を全体的に取り消す性質は。","answer":"原子性（Atomicity）","reason":"全部実行か全部取消しかを保証する。","keywords":["原子性"]}],"tips":"ロックを使う案も有効だが、読み取り・更新・確定をどの範囲でまとめるかまで書く。"},{"id":"B06","title":"組込み：周期タスクの実行可能性","domain":"組込みシステム開発","required":false,"passage":"制御装置Fは単一CPUで三つの周期タスクを動かす。タスクAは実行時間2ms・周期10ms、Bは実行時間3ms・周期20ms、Cは実行時間5ms・周期50ms。処理切替のオーバーヘッドは無視できるとする。各タスクは期限内完了が必要だが、現時点では優先度割当てや最悪実行時間の変動を十分評価していない。","items":[{"q":"タスクAのCPU利用率を求めよ。","answer":"20%","reason":"2/10=0.2。","keywords":["20"]},{"q":"全タスクのCPU利用率の合計を求めよ。","answer":"45%","reason":"2/10+3/20+5/50=0.20+0.15+0.10=0.45。","keywords":["45"]},{"q":"利用率が100%未満であることだけで締切を保証できるか。理由とともに答えよ。","answer":"保証できない。優先度・割込み・切替・実行時間の最悪値・スケジューリング方式が影響するため。","reason":"総利用率だけでは各タスクの応答時間が保証されない。","keywords":["保証できない","優先度"]}],"tips":"数値を計算した後、期限保証は別の検証が要ることを忘れない。"},{"id":"B07","title":"開発：受入れ試験と境界値","domain":"情報システム開発","required":false,"passage":"新規会員登録Gでは年齢を18〜65歳（両端含む）に制限する。テスト担当は25,35,45歳のみを試したが、開発後に17歳の登録が成功する欠陥が見つかった。さらに要件定義書には「ピーク時1000人が同時利用しても95パーセンタイル応答時間を2秒以内」と記載されている。","items":[{"q":"年齢入力について境界値を4つ挙げよ。","answer":"17、18、65、66","reason":"上限・下限の直前と境界そのものが重要。","keywords":["17","18","65","66"]},{"q":"上記の年齢バグを発見するのに適したテスト設計技法は何か。","answer":"境界値分析","reason":"有効範囲の境界前後に欠陥が集まりやすい。","keywords":["境界値分析"]},{"q":"応答時間に関する要件は機能要件と非機能要件のどちらか。","answer":"非機能要件","reason":"性能効率性に関する品質要件。","keywords":["非機能要件"]}],"tips":"テスト値の選び方を説明できると、単なる暗記より得点が安定する。"},{"id":"B08","title":"プログラミング：二分探索の追跡","domain":"プログラミング","required":false,"passage":"昇順配列A=[2,5,9,12,18,23,27,31,40]の添字は0〜8。値23を探すため、low=0、high=8から開始する。繰返しでmid=(low+high)//2（切捨て除算）とし、A[mid]が目標より小さければlow=mid+1、大きければhigh=mid−1、等しければ終了する。","items":[{"q":"最初のmidとA[mid]を答えよ。","answer":"mid=4、A[mid]=18","reason":"(0+8)//2=4。","keywords":["4","18"]},{"q":"1回目の比較後のlowとhighを答えよ。","answer":"low=5、high=8","reason":"18は23より小さいので左側を捨てる。","keywords":["5","8"]},{"q":"何回目の比較で23が見つかるか。","answer":"3回目","reason":"1回目mid4=18、2回目mid6=27、3回目mid5=23。","keywords":["3"]}],"tips":"トレース表にlow / high / mid / A[mid]を毎回書く。配列添字の基点を間違えない。"},{"id":"B09","title":"プロジェクト：EVMによる遅延判断","domain":"プロジェクトマネジメント","required":false,"passage":"案件Hの月末時点の計画価値PVは600万円、出来高EVは480万円、実コストACは540万円である。全体予算BACは1,200万円。品質に関する未完了作業は現時点のEVには算入していない。プロジェクトマネージャは進捗遅延とコスト超過を数値で説明する必要がある。","items":[{"q":"コスト差異CVを求め、その意味を答えよ。","answer":"CV=−60万円。出来高より実コストが60万円大きくコスト超過。","reason":"CV=EV−AC=480−540。","keywords":["−60","超過"]},{"q":"スケジュール差異SVとSPIを求めよ。","answer":"SV=−120万円、SPI=0.8。計画より進捗が遅れている。","reason":"SV=480−600、SPI=480/600。","keywords":["−120","0.8"]},{"q":"担当者の努力不足だけを原因として即断できるか。理由を述べよ。","answer":"できない。要件変更、作業見積り、待ち時間、未完了の検収条件など要因を調査する必要がある。","reason":"EVMは状態指標であって原因の特定まではしない。","keywords":["できない","原因"]}],"tips":"計算→進捗・費用の解釈→原因を断定しない、の順で書く。"},{"id":"B10","title":"サービス管理：復旧目標と再発防止","domain":"サービスマネジメント","required":false,"passage":"小売I社の基幹システムはバックアップを毎日深夜0時に取得する。木曜14時にDB破損が発生し、当日0時のバックアップから18時に復旧した。重要業務のRTOは3時間、RPOは2時間である。復旧後は同様の事象の原因究明が求められている。","items":[{"q":"実際の復旧時間とRTO達成状況を答えよ。","answer":"復旧時間4時間。RTO3時間を1時間超過して未達。","reason":"14時から18時まで4時間。","keywords":["4","未達"]},{"q":"実際のデータ損失時間とRPO達成状況を答えよ。","answer":"データ損失14時間。RPO2時間を超過して未達。","reason":"0時から14時までの更新が失われた。","keywords":["14","未達"]},{"q":"再発防止に向けてインシデント管理とは別に重視する活動は。","answer":"問題管理。根本原因を調査して恒久対策を立案する。","reason":"暫定的な復旧と原因除去は別。","keywords":["問題管理","根本原因"]}],"tips":"時間は同じ日の時計で計算し、復旧（RTO）とデータ喪失（RPO）を分ける。"},{"id":"B11","title":"システム監査：承認権限の不備","domain":"システム監査","required":false,"passage":"企業Jの購買システムでは、同一担当者が仕入先を登録し、支払先口座を変更し、支払承認まで実施できる。監査人は複数の口座変更履歴に承認記録がないことを確認した。管理者は「これまで不正が報告されていないので問題ない」と説明したが、監査人は内部統制上のリスクを評価する。","items":[{"q":"最も重要な統制上の不備を答えよ。","answer":"仕入先登録・口座変更・支払承認の職務が分離されていない。","reason":"一人で不正な支払先に変更・承認できてしまう。","keywords":["職務分掌","分離"]},{"q":"監査人が追加収集すべき客観的な証拠を一つ挙げよ。","answer":"権限設定一覧・変更ログ・承認履歴と実際の取引記録など。","reason":"説明だけでなく実際の運用証拠を確認する。","keywords":["ログ","権限"]},{"q":"監査報告で提示すべき改善案を一つ述べよ。","answer":"口座変更者と承認者を分離し、変更時の二重承認・定期的権限棚卸しを導入する。","reason":"不正の機会を抑える統制を設計・運用する。","keywords":["分離","承認"]}],"tips":"観察した事実・潜在的リスク・改善案を分けて書く。"},{"id":"BX01","title":"外部委託先経由の侵入とログの検証","domain":"情報セキュリティ","required":true,"passage":"製造業A社は業務システムを本社データセンターで運用する。委託先B社の保守担当者はVPNでA社ネットワークに接続し、踏み台サーバを経由して保守対象へアクセスする。B社の保守担当者のアカウントは長期固定パスワードで、MFAは導入していない。管理者権限は保守の利便性から本番DBサーバを含む複数台へ広く付与されていた。\n月曜9:10、海外IPからB社アカウントの認証成功が記録された。9:14、踏み台サーバへの接続が開始され、9:21、本番DBサーバに対する普段ないクエリが実行された。9:25、外部クラウドストレージへ大容量の通信が発生した。一方、A社の業務は継続して稼働し、監視装置は9:40に通信量の異常を検知した。現在、認証情報の漏えい経路、データ持出しの有無・範囲は調査中である。\nA社はVPNアカウントの停止と通信の遮断を決めた。B社の管理者は「パスワードは強力だったから漏えいはない」と述べている。なお、踏み台サーバとDBの操作ログ、VPN認証ログ、外部通信ログには時刻が記録され、全機器は時刻同期されている。","items":[{"q":"攻撃者が本番DBへ到達した可能性を説明する上で、本文から読み取れる経路を順に示せ。","answer":"B社のVPNアカウントで接続し、踏み台サーバ経由で本番DBサーバへアクセスした可能性がある。","reason":"9:10の認証成功、9:14の踏み台、9:21のDB操作の時系列を接続する。実際に同一主体かはログ相関で要検証。","keywords":["VPN","踏み台","DB"]},{"q":"認証情報を不正利用されるリスクを下げる対策と、侵入後の被害拡大を抑える対策を各1つ述べよ。","answer":"委託先VPNアカウントに多要素認証を必須とし、保守先ごとに最小権限へ絞って本番DBへの管理権限を分離する。","reason":"MFAは認証情報だけの盗用対策、最小権限・分離は横展開を抑える対策。","keywords":["多要素認証","最小権限"]},{"q":"データ持出しの有無・範囲を確認するため、どの記録を照合するか。","answer":"DB操作ログで参照された表・行と実行主体を確認し、外部通信ログの宛先・容量・時刻と突き合わせる。","reason":"大容量通信は疑いを示すが、データ漏えいの確定には操作内容と通信内容の証拠が必要。","keywords":["DB操作ログ","外部通信ログ"]},{"q":"時刻同期が調査に役立つ理由を述べよ。","answer":"複数機器の認証・接続・DB操作・外部通信イベントを正しい順序で相関できるため。","reason":"時刻がずれていると因果関係とアクセス経路の推定を誤る。","keywords":["時系列","相関"]},{"q":"「パスワードが強力なので漏えいはない」と断定できない理由を述べよ。","answer":"強度が高くてもフィッシングや端末侵害などで認証情報が窃取され得るうえ、本文では漏えい経路が未確定だから。","reason":"認証成功は不正利用の可能性を示すが、手口確定の証拠ではない。","keywords":["窃取","未確定"]}],"tips":"解答には本文の時刻・装置名・権限情報を使う。「可能性」と「確認済み」を分けて記述する。"},{"id":"BX02","title":"注文集計の二重計上とSQLの改善","domain":"データベース","required":false,"passage":"ECサービスC社には顧客表(customer_id, name)、注文表(order_id, customer_id, ordered_at)、明細表(order_id, product_id, qty, unit_price)、商品表(product_id, product_name)がある。顧客表の主キーはcustomer_id、注文表はorder_id、明細表は(order_id, product_id)を主キーとしており、order_idは注文表への外部キーである。注文がない顧客も報告書に表示したい。\n担当者は「顧客ごとの注文件数」を出すため、顧客→注文→明細をLEFT JOINし、COUNT(*)で件数を集計した。明細が3行ある注文は3件と表示され、注文がない顧客も1件と表示された。修正案としてCOUNT(DISTINCT 注文.order_id)を使用する案が出ている。\nまた商品表にはunit_price列もあるが、注文時の価格は明細表に保管する。商品表の価格が改定された後でも過去の注文金額が変わらないようにする目的である。深夜帯に注文一覧画面が遅くなることがあり、注文表のデータは数千万行、ordered_atへの絞込みが頻繁に使われる。\n注文確定処理は「注文ヘッダ登録」「明細登録」「在庫減算」を1件の処理として実行する。途中で在庫減算が失敗した場合、ヘッダと明細の登録だけが残ってはならない。","items":[{"q":"COUNT(*)で注文件数を求めると誤った理由を2つ述べよ。","answer":"明細と結合して注文が明細行数だけ重複し、注文なし顧客も外部結合で1行残るため。","reason":"集計対象の行が「注文」ではなく「結合後の行」になっている。","keywords":["重複","外部結合"]},{"q":"注文がない顧客も0件と表示するため、件数の集計式として適切なものを示せ。","answer":"COUNT(DISTINCT 注文.order_id)を用いる。","reason":"NULLを数えず、明細による注文IDの重複を除外できる。","keywords":["COUNT","DISTINCT"]},{"q":"商品表の現在価格で過去の注文金額を集計することが不適切な理由を述べよ。","answer":"商品の価格改定によって過去の取引金額が変わってしまうため、注文時に確定した明細単価と数量を使う。","reason":"販売時点の履歴属性とマスタの現在値を分ける。","keywords":["注文時単価","履歴"]},{"q":"注文確定処理に必要なトランザクション性と失敗時動作を述べよ。","answer":"ヘッダ・明細登録と在庫減算を同一トランザクションとし、途中失敗なら全変更をロールバックする。","reason":"ACIDの原子性を守り、片方だけの更新を防ぐ。","keywords":["原子性","ロールバック"]},{"q":"注文日時による一覧抽出の遅延に対し検討する索引と検証手順を述べよ。","answer":"ordered_atの索引や必要な複合索引を検討し、実行計画と代表的な条件で処理時間を比較する。","reason":"索引は更新コストもあるため無条件に追加せず実測する。","keywords":["索引","実行計画"]}],"tips":"SQLは結合前後の行数を小さな例で書き出す。データの時点とトランザクション境界を区別する。"},{"id":"BX03","title":"拠点間通信とDNS・ルーティングの障害切分け","domain":"ネットワーク","required":false,"passage":"企業D社の本社に新たにWebサーバを導入した。Webサーバは172.16.20.10/24、デフォルトゲートウェイは172.16.20.1、DNSサーバは172.16.10.53である。支店の端末は10.10.30.0/24に所属し、支店と本社はルータ間のVPNで接続している。支店から本社の別サービス172.16.10.20への通信は正常であり、WebサーバへはIPアドレスを直接指定しても接続できない。\n本社ルータの経路表には172.16.10.0/24への経路があるが、Webサーバの新しい172.16.20.0/24への経路は登録されていない。一方、支店のDNS問い合わせは成功し、intra.exampleのAレコードは172.16.20.10を返している。WebサーバのTCP/443待受けと本社LAN内からの接続は正常である。\n担当者は「DNSのTTLを短くすれば直る」「HTTPS証明書を再発行すれば直る」「ルータの経路表を見直すべき」という3案を出した。セキュリティ担当は、拠点間通信を許可する場合でも本社内の全ネットワークを無条件で公開しない方針である。","items":[{"q":"支店からWebサーバへ接続できない第一の原因として最も疑うべき設定は何か。","answer":"本社の新しい172.16.20.0/24への経路が適切に設定されていない点。","reason":"DNSは正しいAレコード、Webサーバの待受けも本社内から確認済み。IP宛通信が失敗している。","keywords":["経路","172.16.20.0/24"]},{"q":"DNSのTTL変更だけでは改善しない理由を述べよ。","answer":"名前解決は既に正しく行われており、宛先IPへのパケット配送の経路が問題だから。","reason":"アプリ・名前解決・ネットワーク経路を層別に切り分ける。","keywords":["名前解決","経路"]},{"q":"HTTPS証明書が第一原因とは考えにくい理由を述べよ。","answer":"IPアドレス直接指定でも接続できず、通信経路の不備が先に確認されているから。","reason":"証明書検証は通常TCP接続確立後のTLSの段階。","keywords":["TCP","TLS"]},{"q":"支店端末に/24マスクが与えられているとき、同一ネットワーク内のIPとして適切な範囲はどれか。","answer":"10.10.30.1〜10.10.30.254（通常のホスト利用時）。","reason":"10.10.30.0はネットワークアドレス、10.10.30.255はブロードキャストアドレス。","keywords":["10.10.30","254"]},{"q":"ルーティング追加に加えてセキュリティ上検討すべき制御を1つ示せ。","answer":"支店から172.16.20.10の必要なTCP/443への通信だけを許可するACLやファイアウォール規則を設計する。","reason":"到達できる経路を作ることと、必要最小限のアクセス許可をすることは別。","keywords":["ACL","最小限"]}],"tips":"「名前解決できるか」「IPへ届くか」「TCPが接続できるか」「TLS/HTTPが正しいか」を順に切り分ける。"},{"id":"BX04","title":"動的計画法で最小料金を求める","domain":"プログラミング","required":false,"passage":"交通事業E社は停留所0から停留所nまでの移動に必要な最小料金を計算する。停留所iからはi+1へ料金a[i]、i+2へ料金b[i]で進める。ただし範囲外の移動はできない。どちらも料金は0以上の整数とする。0からnへの最小料金をdp[n]とする。\n担当者は次の擬似コードを示した。添字は0から始まり、配列は十分な長さを持つ。INFはどの実現可能な料金よりも大きい整数である。\n(1) dp[0]←0\n(2) i=1からnまで dp[i]←INF\n(3) i=0からn−1まで繰り返す\n(4) 　dp[i+1]←min(dp[i+1],dp[i]+a[i])\n(5) 　もしi+2\u003c=nなら dp[i+2]←min(dp[i+2],dp[i]+b[i])\n入力例はn=3、a[0..2]=[4,5,4]、b[0..1]=[7,3]である。0→1→2→3なら料金13、0→2→3なら11、0→1→3なら7である。","items":[{"q":"この擬似コードのdp[i]が表す値を説明せよ。","answer":"停留所0から停留所iへ到達する最小の合計料金。","reason":"部分問題の意味を定めると初期値と遷移式の妥当性が理解できる。","keywords":["最小","料金"]},{"q":"dp[0]を0、他をINFで初期化する理由を述べよ。","answer":"出発地点の料金は0と確定し、未到達の他地点は十分大きな値として最小値更新の対象にするため。","reason":"計算の不変条件がdpの意味に一致する。","keywords":["出発","未到達"]},{"q":"入力例のdp[1]、dp[2]、dp[3]の値を順に示せ。","answer":"dp[1]=4、dp[2]=7、dp[3]=7。","reason":"i=0でdp1=4、dp2=7。i=1でdp2=min(7,4+5)=7、dp3=4+3=7。i=2でdp3=min(7,7+4)=7。","keywords":["4","7"]},{"q":"i+2\u003c=nの条件が必要な理由を述べよ。","answer":"存在しない停留所の配列要素への書込みを防ぐため。","reason":"境界条件のない配列アクセスは範囲外参照を生じる。","keywords":["範囲外","境界"]},{"q":"このアルゴリズムの時間計算量と、dp配列の追加空間量を示せ。","answer":"時間O(n)、dp配列の追加空間O(n)。","reason":"iを0からn−1まで1回走査し、各回の更新は定数回。","keywords":["O(n)"]}],"tips":"配列dpの意味、初期条件、遷移、処理順、境界条件を明示してトレース表を作る。"},{"id":"BX05","title":"EVMと工期短縮案の評価","domain":"プロジェクトマネジメント","required":false,"passage":"SI企業F社は業務システムを開発している。承認済みの総予算BACは1,200万円、計画工期は12週間である。6週終了時点の計画価値PVは600万円、完了した作業に対応する出来高EVは480万円、実コストACは640万円だった。プロジェクトは機能要求が増えたため一部の作業が遅れ、追加要員投入の提案がある。\n工程ネットワークは、A(2週)→C(4週)→E(2週)と、B(3週)→D(4週)→E(2週)の2経路で構成される。A,Bは同時開始、CはAの後、DはBの後、EはCとDの両方が完了してから着手する。資源制約と追加コストは一旦無視して計算する。短縮案1は作業Cを1週短縮、短縮案2は作業Dを1週短縮する。","items":[{"q":"6週終了時点のスケジュール差異SVと費用差異CVを算出せよ。","answer":"SV=EV−PV=−120万円、CV=EV−AC=−160万円。","reason":"どちらも負なので進捗遅れ・費用超過を示す。","keywords":["−120","−160"]},{"q":"SPIとCPIを求め、その意味を説明せよ。","answer":"SPI=480/600=0.8、CPI=480/640=0.75。どちらも1未満で計画より進捗効率・費用効率が悪い。","reason":"分母はSPIがPV、CPIがAC。","keywords":["0.8","0.75"]},{"q":"費用効率が今後も一定と仮定する場合のEACを求めよ。","answer":"EAC≈BAC/CPI=1,200/0.75=1,600万円。","reason":"同じ効率が続くという仮定の単純モデル。","keywords":["1600","万円"]},{"q":"工程ネットワークのクリティカルパスと最短完了週数を答えよ。","answer":"B→D→Eで3＋4＋2=9週。","reason":"A→C→Eは2＋4＋2=8週。最長の経路が全体完了を制限する。","keywords":["B","D","E","9"]},{"q":"短縮案1と短縮案2のうち、全体工期を1週短縮できるのはどちらか。","answer":"短縮案2（Dを1週短縮）。ただし両経路が8週で並ぶ。","reason":"非クリティカルなCを短縮してもB→D→Eの9週が残る。Dを1週短縮すると両経路8週。","keywords":["案2","D"]}],"tips":"PV、EV、ACを混同しない。工程図では合流点の開始時刻は先行作業完了の最大値になる。"},{"id":"BX06","title":"アクセス権監査と監査証拠","domain":"システム監査","required":false,"passage":"流通業G社では購買部門の担当者が仕入先マスタを登録し、購買部長が登録を承認するという業務規程がある。昨年のシステム更改で旧担当者の権限が一部残存し、元購買担当のHさんは現在営業部門へ異動したが、仕入先マスタの登録・承認の両方を実行できる管理者権限を持っている。\n内部監査部門が監査したところ、部門長は「権限棚卸しは四半期に一度行っている」と説明した。しかし棚卸しリストには承認者の署名・実施日時がなく、権限変更依頼票の処理履歴との照合もしていなかった。監査対象期間における不正な登録や支払いは、現在確認できていない。監査人は権限管理の統制が機能しているか評価し、改善提案を行う。","items":[{"q":"Hさんの権限が引き起こす主要な統制上の問題を述べよ。","answer":"異動後も不要な権限が残り、同一人物が仕入先登録と承認をできるため職務分掌が機能していない。","reason":"最小権限の原則と申請・承認の相互牽制が崩れている。","keywords":["職務分掌","不要権限"]},{"q":"四半期棚卸しの実施を確認するための適切な監査証拠を2つ挙げよ。","answer":"承認者・日時を記録した棚卸し結果、権限変更依頼票・実際の権限設定ログとの照合記録。","reason":"口頭説明のみでは十分な監査証拠とはいえない。","keywords":["棚卸し結果","変更履歴"]},{"q":"不正支払いが確認されていないことから「統制に問題なし」と結論できるか。理由も述べよ。","answer":"結論できない。不正が未確認でも予防統制の不備と証跡欠落があるから。","reason":"結果としての不正有無と統制の設計・運用の適切さは区別する。","keywords":["結論できない","不備"]},{"q":"再発防止のため、権限付与と異動時の統制に必要な改善を述べよ。","answer":"権限を業務役割ごとに分け、異動・退職時に不要権限を速やかに削除し、棚卸しの承認・日時・変更結果を記録する。","reason":"RBACと定期レビュー・証跡によって不要権限の残存を検知・解消する。","keywords":["異動","権限削除","記録"]},{"q":"監査人と被監査部門の責任分担を説明せよ。","answer":"監査人は独立・客観的に評価し改善を提案する。改善策の実装・運用責任は被監査部門にある。","reason":"監査人が自分で実装して監査すると独立性を損ない得る。","keywords":["独立","実装責任"]}],"tips":"指摘は「基準・事実・原因・影響・改善提案」を分けて書く。統制不備と不正発生を同一視しない。"},{"id":"BX07","title":"店舗在庫の統合と事業効果の検証","domain":"情報戦略","required":false,"passage":"小売企業K社は40店舗とECサイトを運営する。各店舗は独自の在庫表を使い、ECサイトは毎日閉店後に店舗別在庫を取り込む。店舗で商品が売れた後もECサイトに在庫ありと表示されることがあり、購入者からの注文を取り消す事例が増えた。一方、人気商品を過剰に発注した店舗では売れ残りが生じる。経営会議では「欠品による注文取消しの減少」と「在庫保有費用の削減」を目標とした。\n\n企画部は、全チャネルの在庫データを統合する案を提示した。現状では商品コードの採番ルールが店舗ごとに異なる。例えば同じ商品でも本店はA001、支店はX100として管理している。また、店舗で取り置きした商品をシステム上で即時引き当てる機能がないため、販売可能数と実在庫数を区別できていない。店舗担当者は、統合システムが導入されればこれらの問題も自動的に解消すると考えている。\n\n【表1：2案の経済性（単位：万円）】\n案A　初期投資600、年間削減効果300、年間追加運用費100\n案B　初期投資900、年間削減効果500、年間追加運用費150\n削減効果と運用費は毎年一定と仮定し、割引率・税金・残存価値は考慮しない。\n\nK社ではEC注文1万件のうち400件が欠品で取り消されている。導入後の目標は欠品による取消率を1%以下にすることとする。企画部は一部の店舗で試行し、そこでの取消率、在庫データ更新遅延、店舗担当者の利用率を毎週測定する計画を立てた。ただし、試行店舗は現在最も売上が大きくITに習熟した店舗のみを選んでおり、他店舗でも同じ効果が得られるか懸念がある。","items":[{"q":"在庫統合前に解決すべきデータ管理上の課題を一つ述べよ。","answer":"商品コードの採番ルールを統一し、既存コードと共通商品IDの対応を整備する。","reason":"異なるコードのままでは同一商品として集計できない。","keywords":["商品コード","統一"]},{"q":"店舗の取り置きによる注文取消しを防ぐため、どの在庫情報をどのように管理するか。","answer":"販売可能数を実在庫数から引当済み数量を差し引いて管理し、取り置き時に即時更新する。","reason":"実在庫と他の顧客に販売可能な在庫は異なる。","keywords":["引当","販売可能数","即時更新"]},{"q":"案Aと案Bの単純投資回収期間を求め、短い案を答えよ。","answer":"Aは3年、Bは約2.57年。Bが短い。","reason":"A=600/(300−100)、B=900/(500−150)。","keywords":["3年","2.57年","B"]},{"q":"注文取消率の現状と目標の差をパーセントポイントで答えよ。","answer":"現状4%、目標1%以下、少なくとも3パーセントポイント削減。","reason":"400/10000=4%。率の差は割合そのものの差。","keywords":["4%","3ポイント"]},{"q":"試行店舗の選定による評価上の問題と改善方法を述べよ。","answer":"IT習熟度の高い大規模店に偏っているため、規模・習熟度が異なる店舗も選び効果を比較する。","reason":"代表性の不足により全店への一般化が難しい。","keywords":["選択バイアス","異なる店舗"]}],"tips":"経営目標→業務上の原因→施策→成果指標を対応付ける。単なるシステム導入を目的にしない。"},{"id":"BX08","title":"予約サービスの性能・可用性と容量設計","domain":"システムアーキテクチャ","required":false,"passage":"旅行予約サービスを運営するT社では、利用者端末からロードバランサを介してWebサーバ2台へ要求を分配し、両サーバが同じDBサーバにアクセスする。Webサーバ1台当たりの最大処理能力は毎秒90件、DBサーバは毎秒140件である。通常は毎秒80件だが、新サービス開始時には毎秒160件の要求が予想される。処理の途中で必ずDBに1回アクセスし、キャッシュは利用していないものとする。\n\n担当者はWebサーバを3台に増設すれば毎秒270件を処理できると考えた。しかし性能試験では、Webサーバ2台のCPU使用率は約55%にとどまり、DBサーバでは処理待ちが生じていた。担当者は人気商品の検索結果を一定時間キャッシュする対策を提案した。ただし、予約確定時の空き状況は最新でなければならず、検索結果のキャッシュをそのまま予約の可否判定には使えない。\n\n【表1：可用性の設計条件】\nロードバランサ単体　0.999\nWebサーバ単体　0.98（2台のどちらかが稼働すればサービス可能）\nDBサーバ単体　0.99\n全装置の故障は独立と仮定し、切替失敗などは考慮しない。ロードバランサ、Webサーバ群、DBサーバはすべて必要である。\n\nバックアップは毎日0時に取得し、翌日まで別媒体に保存する。DBの更新ログは5分ごとに別拠点に転送される。サービスの復旧時点目標（RPO）は15分、復旧時間目標（RTO）は60分である。復旧試験ではバックアップからの復元に45分、更新ログの適用に20分、サービス動作確認に10分を要した。試験の各作業は順次実施される。担当者はログを別拠点に保存しているため、復旧目標は両方達成されると報告した。","items":[{"q":"現構成の最大処理能力とボトルネックを答えよ。","answer":"毎秒140件、DBサーバ。","reason":"Web群180件/秒とDB140件/秒の小さい方。","keywords":["140","DB"]},{"q":"Webサーバを3台に増設するだけでは予測需要に対応できない理由を述べよ。","answer":"DBの処理能力が140件/秒のままなので160件/秒の需要を処理できない。","reason":"直列工程の全体能力は最小能力で制約される。","keywords":["DB","140","160"]},{"q":"Webサーバ群の稼働率を求めよ。","answer":"1−(1−0.98)²＝0.9996。","reason":"2台が同時に停止する確率を1から引く。","keywords":["0.9996"]},{"q":"システム全体の稼働率を小数第5位で四捨五入し、小数第4位まで求めよ。","answer":"0.9886。","reason":"0.999×0.9996×0.99=0.988614396。","keywords":["0.9886"]},{"q":"RPOとRTOの達成可能性をそれぞれ述べよ。","answer":"ログが正常に保存・復元できればRPOは5分以内で目標を満たす見込み。RTOは75分で目標60分を超える。","reason":"復旧時点と復旧所要時間を別々に評価する。","keywords":["RPO","5分","RTO","75分"]},{"q":"検索結果をキャッシュしても予約の過剰販売を防ぐために必要な処理を述べよ。","answer":"予約確定時はDBの最新在庫をトランザクション内で確認し、引当・更新する。","reason":"古いキャッシュを確定判断に使うと競合や在庫不足を見逃す。","keywords":["最新在庫","トランザクション","引当"]}],"tips":"性能・可用性・復旧は異なる指標。計算では独立性、直列・並列、作業の重複可否を確認する。"},{"id":"BX09","title":"温度監視装置の周期制御とフェイルセーフ","domain":"組込みシステム開発","required":false,"passage":"工場の恒温槽には温度センサ、マイコン、ヒータ、警報ランプがある。マイコンは温度を取得し、設定値との差に応じてヒータを制御する。温度センサのアナログ出力は0～5Vで、10ビットのA/D変換器によって0～1023の整数として取得される。設計上、0Vは0℃、5Vは100℃に対応する。温度の換算ではセンサ誤差を無視し、0～1023が0～100℃に線形対応すると仮定する。\n\n【表1：周期タスク（処理時間・周期・期限、単位ms）】\n安全監視 S　1、10、10\n温度制御 C　3、20、20\nログ送信 L　8、40、40\n全タスクは単一CPUで動作する。切替のオーバーヘッドを無視し、処理時間は最悪値とする。レートモノトニック方式を使い、周期の短いタスクが長いタスクをプリエンプト（割込み実行）できる。タスク間の資源競合は表1の計算には考慮しない。\n\n制御担当はログ送信処理を改善しようとして、通信ライブラリの呼出し中に共有バッファのロックを保持する設計を採用した。通信が不安定な場合、ログ送信は最大30msロックを保持する。安全監視も同じバッファのロックを取得してから異常状態を記録する仕様となっているため、優先度の高い安全監視が実行可能状態でもロックの解放を待つ場合がある。\n\nさらに、温度センサの配線断線時に0Vを出力する故障モードが見つかった。現在のソフトウェアでは低温と判断し、ヒータへの電力を増やす。担当者はセンサの妥当性判定を行い、異常時にはヒータを停止し警報を出す仕様を提案した。マイコンが応答不能になる故障に備え、ウォッチドッグタイマの追加も検討している。","items":[{"q":"A/D変換結果が512の場合、温度を概算せよ。","answer":"約50℃。","reason":"512÷1023×100≒50.05。","keywords":["50"]},{"q":"3タスクのCPU利用率を求めよ。","answer":"45%。","reason":"1/10＋3/20＋8/40=0.45。","keywords":["45%"]},{"q":"レートモノトニック方式の優先順位を高い順に答えよ。","answer":"S、C、L。","reason":"周期が10、20、40msの順。","keywords":["S","C","L"]},{"q":"安全監視が最高優先度でも期限を守れない可能性がある理由を述べよ。","answer":"低優先度のログ送信が共有バッファのロックを長時間保持し、安全監視がブロックされるから。","reason":"優先度だけでは共有資源による待ち時間を解消できない。","keywords":["ロック","ブロック"]},{"q":"期限を守るために共有バッファの使い方をどう変更するか。","answer":"通信中はロックを保持せず、共有データのコピーなど短時間の更新処理だけを排他区間にする。","reason":"時間のかかる入出力を排他区間外に移してブロック時間を短縮する。","keywords":["排他区間","通信","短縮"]},{"q":"断線時に安全側へ移行する対策の名称と動作を答えよ。","answer":"フェイルセーフ。異常を検知したらヒータを停止し警報を出す。","reason":"故障時に危険な加熱を継続しない。","keywords":["フェイルセーフ","停止","警報"]}],"tips":"周期・期限・実行時間を区別する。CPU利用率だけで締切保証とは断定できない。"},{"id":"BX10","title":"受発注システムの要件・移行・試験設計","domain":"情報システム開発","required":false,"passage":"製造業M社は20年前に導入した受発注システムを刷新する。旧システムでは担当者が電話注文を受け、在庫を画面で確認した後に注文情報を登録する。繁忙時には複数の担当者が同じ在庫を確認して注文を確定するため、在庫数を超えて受注することがある。新システムではWeb画面からも注文できるようにし、在庫の引当てと注文登録を一つのトランザクションとして行う。\n\n要件定義書には「システムは十分に高速で使いやすいこと」とだけ記載されていた。利用部門は検索結果を2秒以内に表示することを希望し、開発部門はピーク時に同時利用者200人を想定する。担当者は、95%の検索応答が2秒以内であることを受入基準とする案を提示した。\n\n【表1：注文数量の入力仕様】\n1～100の整数を許可する。ただし、販売可能在庫を超える注文は拒否する。数量の形式チェックは在庫確認前に行う。エラー時は理由を画面に表示し、在庫・注文の更新を行わない。\n\n開発では注文処理モジュールの下位に在庫確認モジュールとDB更新モジュールがある。在庫確認モジュールは完成したが、DB更新モジュールはまだ未完成である。開発担当は上位の注文処理を先にテストするため、DB更新を模擬する部品を作る計画を立てた。\n\nデータ移行では商品マスタ、顧客マスタ、未完了注文を新システムに移す。旧システムの商品コードには先頭0が含まれるが、試行移行で新システムの数値型カラムに格納した結果、00123が123になり、別の商品コード123と区別できなくなった。移行計画では、新旧件数の一致だけを確認すれば十分とされている。移行作業に失敗したときの切戻し方法はまだ決めていない。","items":[{"q":"在庫超過受注を防ぐため、注文登録と在庫更新を一つのトランザクションとする理由を述べよ。","answer":"途中失敗時に両方を取り消し、並行注文時も在庫確認・引当ての整合性を保つため。","reason":"原子性だけでなく、並行制御を適切に設計する必要がある。","keywords":["原子性","並行制御","整合性"]},{"q":"性能の受入基準を具体的に記述せよ。","answer":"同時利用者200人の想定負荷で、検索応答時間の95%が2秒以内であること。","reason":"負荷条件と測定指標を明示する。","keywords":["200人","95%","2秒"]},{"q":"注文数量の上下限の直前・境界・直後を確認する入力値を列挙せよ。","answer":"0、1、2、99、100、101。","reason":"境界値分析で上下限の前後を確認する。在庫は100以上など十分に確保した条件とする。","keywords":["0","1","2","99","100","101"]},{"q":"未完成の下位DB更新モジュールを模擬する部品を何というか。","answer":"スタブ。","reason":"トップダウン結合テストで下位の機能を代替する。","keywords":["スタブ"]},{"q":"商品コードの衝突の原因と改善方法を述べよ。","answer":"数値型への変換で先頭0が消えた。文字列型で元のコードを保持する。","reason":"識別子は数値演算の対象とは限らない。","keywords":["先頭0","文字列型"]},{"q":"件数照合以外に必要な移行確認を二つ述べよ。","answer":"商品コードの一意性・対応関係の確認と、注文・在庫・顧客間の参照整合性の確認。","reason":"件数一致だけでは値の誤りや関連の破損を検出できない。","keywords":["一意性","参照整合性"]}],"tips":"曖昧な要求は試験可能な条件へ変換し、異常時の更新禁止・データ照合・切戻しまで設計する。"},{"id":"BX11","title":"サービス停止の分析と継続的改善","domain":"サービスマネジメント","required":false,"passage":"法人向けクラウドサービスP社は、月間稼働率99.9%以上を顧客とサービスレベル合意（SLA）で定めている。対象時間は月30日間の全時間であり、今回の停止はすべて計測対象とする。サービスデスクは障害発生時に受付番号を発行し、インシデント管理担当へ連絡する。\n\n【表1：今月のサービス停止】\n障害1　12分　DB接続数の上限到達\n障害2　18分　同じDB接続数の上限到達\n障害3　24分　新バージョン配布時の設定誤り\nいずれの停止時間にも重複はない。\n\n障害1と2では、DB接続を再起動するとサービスが回復した。調査の結果、特定処理で終了後も接続が解放されない不具合が見つかった。運用担当は「毎晩自動再起動するようにすれば解決する」と提案した。開発担当は接続解放処理の修正を提案したが、変更の影響範囲や切戻し手順はまだ確認されていない。\n\n障害3では配布手順書に記載された設定値が旧版のままだった。構成管理台帳（CMDB）には本番のソフトウェア版と設定の対応が記録されておらず、障害時に正しい設定を特定するまで時間を要した。P社は配布手順に本番設定の事前確認と自動テストを追加し、失敗時に以前の版へ戻す手順を整備する計画である。\n\n今後、サービス管理責任者は毎月のSLA達成率、平均復旧時間、同一原因による再発件数、変更失敗率を測定し、改善施策を評価したいと考えている。ただし、現状は停止していない苦情や問い合わせもすべて障害として集計しているため、停止時間の算定方法を見直す必要がある。","items":[{"q":"SLA上の許容停止時間を分で求めよ。","answer":"43.2分。","reason":"30×24×60×(1−0.999)=43.2。","keywords":["43.2"]},{"q":"今月の停止時間と稼働率を求め、SLA達成可否を答えよ。","answer":"54分、99.875%、未達。","reason":"1−54/43200=0.99875。","keywords":["54分","99.875%","未達"]},{"q":"再起動によるサービス回復と接続解放不具合の恒久修正は、それぞれどの管理に対応するか。","answer":"前者はインシデント管理、後者の根本原因の調査・再発防止は問題管理。","reason":"早期復旧と根本原因の解消を区別する。","keywords":["インシデント管理","問題管理"]},{"q":"恒久修正を本番に適用する前に変更管理で確認すべき事項を二つ述べよ。","answer":"影響・リスクを評価して承認し、テスト結果と切戻し手順を確認する。","reason":"再発防止の変更自体が新たな障害を起こす可能性がある。","keywords":["影響評価","承認","切戻し"]},{"q":"CMDBに追加すべき構成情報を述べよ。","answer":"本番のソフトウェア版、設定値、関連する構成項目間の関係と変更履歴。","reason":"障害時に正しい構成と差分を特定できるようにする。","keywords":["版","設定","変更履歴"]},{"q":"不具合の恒久対策の有効性を判断する指標を一つ挙げ、理由を述べよ。","answer":"同一原因による再発件数。根本原因の修正により同じ停止が減ったか確認できる。","reason":"総問い合わせ数だけでは当該対策の効果を評価できない。","keywords":["再発件数","同一原因"]}],"tips":"復旧、原因分析、変更、構成管理、評価を区別し、それぞれの目的に合う指標を選ぶ。"}],"sources":[{"title":"IPA 2026年度後期の試験日程","url":"https://www.ipa.go.jp/shiken/mousikomi/moushikomi.html"},{"title":"IPA 応用情報技術者試験 公式概要","url":"https://www.ipa.go.jp/shiken/kubun/ap.html"},{"title":"IPA 応用情報技術者試験シラバス Ver.7.2","url":"https://www.ipa.go.jp/shiken/syllabus/omgdg50000005kq5-att/syllabus_ap_ver7_2.pdf"},{"title":"IPA 試験要綱 Ver.5.5","url":"https://www.ipa.go.jp/shiken/syllabus/omgdg50000005kle-att/youkou_ver5_5.pdf"},{"title":"IPA 2025年度 公式過去問題・解答例","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html"},{"title":"公正取引委員会：中小受託取引適正化法（取適法）","url":"https://www.jftc.go.jp/toriteki/"}]}</script>

エウアウエ","question":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_am_qs.pdf","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_am_ans.pdf","bQuestion":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_pm_qs.pdf","bAnswer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_pm_ans.pdf","bReview":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_pm_cmnt.pdf"}];
const APP=document.getElementById('app'), NAV=document.getElementById('nav');
const KEY='ap-study-2027-v1'; const EMPTY=()=>({topicRead:{},topicNotes:{},seen:{},stats:{},wrong:{},bookmarks:{},notes:{},self:{},log:[],visited:{},pastAnswers:{},pastResults:{},pastB:{},pastTimes:{},dailyTarget:20,dailyNotes:{},reviewSchedule:{}});
let activeUnit=null; let S=load(), view='home', chapterId=1, quiz={type:'',ids:[],answers:{},index:0,finished:false,started:0}, chapterTestN=10, flashIndex=0, flashOpen=false, flashFilter='all', caseIndex=0, revealed={};
const qById=Object.fromEntries(D.questions.map(q=>[q.id,q]));

function accuracy(){let a=Object.values(S.stats),n=a.reduce((v,x)=>v+x.total,0),r=a.reduce((v,x)=>v+x.right,0);return {n,r,pct:n?Math.round(100*r/n):0}}
function nav(){let items=[['home','⌂','ダッシュボード'],['guide','▧','初学者ガイド'],['manage','▥','学習管理'],['chapters','▤','講義・用語'],['syllabus','≡','出題範囲'],['quiz','✎','科目A 演習'],['mock','◷','科目A 80問模試'],['past','▣','IPA公式過去問'],['flash','◇','暗記カード'],['cases','☷','科目B 記述演習'],['review','↻','弱点・公式・計画'],['settings','⚙','データ・出典']]; NAV.innerHTML='<div class="side-label">学習メニュー</div>'+items.map(([v,s,n])=>`<button class="nav ${view===v?'active':''}" data-nav="${v}"><span class="symbol">${s}</span>${n}</button>`).join('')+'<div class="aside-note">2027年2月：科目A<br>2027年3月：科目B<br>科目Bは情報セキュリティ必須＋選択4問。<br>本教材の問題は独自作成で、公式過去問題ではありません。</div>'}

function stats(){let done=D.chapters.filter(c=>chapterComplete(c.id)).length,a=accuracy(),rev=Object.keys(S.wrong).filter(k=>S.wrong[k]).length;return `<div class="stats"><div class="stat"><span>章の修了</span><strong>${done}<small style="font-size:14px;color:#687989">/ ${D.chapters.length}</small></strong><div class="progress"><div class="bar" style="width:${Math.round(done/D.chapters.length*100)}%"></div></div></div><div class="stat"><span>演習通算正答率</span><strong>${a.pct}%</strong><span>${a.r}/${a.n} 回</span></div><div class="stat"><span>要復習の問題</span><strong>${rev}問</strong><span>不正解・未習得</span></div></div>`}
function home(){let recent=[...S.log].slice(-6).reverse(),unfinished=D.chapters.find(c=>!chapterComplete(c.id))||D.chapters[0];return `<div class="page"><div class="summary"><div class="eyebrow" style="color:#90e3d8">2027 FEB–MAR / 2026年度後期</div><h1>理解する。解く。<br>間違いから仕上げる。</h1><p class="sub">23分野の講義、${D.chapters.reduce((n,c)=>n+c.deep.length,0)}詳解単元、${D.chapters.reduce((n,c)=>n+c.terms.length,0)}重要用語、科目A独自問題${D.questions.length}問、科目Bケース${D.cases.length}題。</p><div class="buttons"><button class="action" data-nav="guide">初めての方：学習ガイド</button><button class="action secondary" data-nav="chapters">講義一覧</button><button class="action secondary" data-nav="syllabus">出題範囲を確認</button><button class="action secondary" data-nav="past">公式過去問に挑戦</button><button class="action secondary" data-nav="manage">学習の進捗を見る</button><button class="action secondary" data-start="wrong">弱点を解く</button></div></div>${stats()}<div class="grid"><div class="card"><div class="eyebrow">次の一歩</div><h3>第${unfinished.id}章　${E(unfinished.title)}</h3><p class="muted">${E(unfinished.summary)}</p><button class="action soft" data-ch="${unfinished.id}">この章を学ぶ</button></div><div class="card"><div class="eyebrow">科目Bの攻略</div><h3>セキュリティ必須 + 得意な4分野</h3><p class="muted">科目A対策と並行して、自分の得意・不得意を記述演習で確認。3月に5問分を本番形式で練習します。</p><button class="action soft" data-nav="cases">記述問題へ</button></div></div><h2>試験までの学習ロードマップ</h2>${schedule()}<div class="card"><h3>科目A / Bの区別と合格目標</h3><p>科目A：四肢択一80問 / 150分。科目B：記述式11問から5問 / 150分。両科目とも100点満点で基準点60点。安全圏を狙い、科目Aの演習は独自問題で80%以上、公式過去問で75%以上を自主目標に設定。</p><p class="notice">注意：本教材の短い独自問題だけで公式試験の難易度を完全には再現できません。最終的に必ずIPAの公式過去問を時間を測って解いてください。</p></div></div>`}

  const now=byDay[today]||{count:0,right:0};const last7=Array.from({length:7},(_,i)=>{let d=addDays(today,i-6);return {date:d,count:byDay[d]?.count||0}});
  const scheduled=Object.entries(S.reviewSchedule||{}).filter(([id,item])=>qById[id]&&item?.due).sort((a,b)=>a[1].due.localeCompare(b[1].due));
  const due=scheduled.filter(([id,item])=>item.due<=today);
