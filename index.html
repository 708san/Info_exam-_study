<script id="course-data" type="application/json">{"title":"応用情報技術者 2027年3月対策｜学習＆演習","version":"5.0 / 2026-11-26 — 原理から学ぶ教科書（第1～5章増補）","chapters":[{"id":1,"title":"基礎理論・数学","group":"テクノロジ","priority":"A重要","summary":"2進数、論理演算、確率、待ち行列、符号化、情報量など、計算問題の共通土台。","lessons":[{"title":"数の表現","body":"2進数の各桁は2の累乗。整数13は1101₂。負の整数は通常2の補数で表し、8ビットの−5は00000101を反転して1を足すので11111011。nビットの符号付き整数の範囲は−2^(n−1)〜2^(n−1)−1。","check":"符号付きと符号なしで範囲が違う。"},{"title":"論理と集合","body":"AND（論理積）は両方真のときだけ真、OR（論理和）はどちらかが真、XOR（排他的論理和）は異なるとき真。ド・モルガンの法則は NOT(A AND B) = (NOT A) OR (NOT B)。","check":"論理式は真理値表で必ず照合。"},{"title":"確率と期待値","body":"独立な事象がともに起きる確率は積。排反事象の「いずれか」は和。期待値は結果×確率の総和。条件付き確率はP(A|B)=P(A∩B)/P(B)。","check":"独立と排反を混同しない。"},{"title":"情報量と誤り検出","body":"同じ確率のN通りを識別するにはlog₂Nビット。パリティビットは奇数個の誤りを検出できるが単独で訂正はできない。ハミング距離dなら最大d−1個の誤りを検出し、⌊(d−1)/2⌋個を訂正。","check":"検出できる数と訂正できる数は異なる。"},{"title":"待ち行列","body":"平均到着率λ、平均サービス率μの安定なM/M/1では利用率ρ=λ/μ\u003c1、平均系内滞在時間W=1/(μ−λ)。リトルの法則L=λWは一般的な定常系で成立。","check":"待ち時間（待機だけ）と滞在時間（処理を含む）を区別。"}],"terms":[{"term":"2の補数","definition":"負数をビット反転して1を足した形で表す方式"},{"term":"オーバーフロー","definition":"計算結果が表現可能な範囲からはみ出すこと"},{"term":"排他的論理和","definition":"入力の真偽が異なる場合だけ真となる演算"},{"term":"ド・モルガンの法則","definition":"論理積や論理和の否定を相互に変換する法則"},{"term":"条件付き確率","definition":"別の事象が起きた条件での確率"},{"term":"期待値","definition":"各結果に発生確率を乗じた値の総和"},{"term":"エントロピー","definition":"情報の不確実性の平均量"},{"term":"ハミング距離","definition":"二つの符号語で異なるビット位置の数"},{"term":"リトルの法則","definition":"平均系内数は平均到着率と平均滞在時間の積"},{"term":"M/M/1","definition":"到着と処理が指数分布で一つの処理窓口を持つ待ち行列モデル"}],"questions":[{"id":"Q01-01","chapter":1,"kind":"applied","q":"8ビットの2の補数で表せる最大整数はどれか。","options":["127","128","255","256"],"correct":0,"explain":"符号ビット1個を除く7ビットで正の最大は2^7−1=127。"},{"id":"Q01-02","chapter":1,"kind":"applied","q":"独立な装置AとBの稼働確率が0.9と0.8のとき、両方稼働する確率は。","options":["0.72","0.80","0.90","0.98"],"correct":0,"explain":"独立なら積を取るので0.9×0.8=0.72。"},{"id":"Q01-03","chapter":1,"kind":"applied","q":"毎秒8件到着し毎秒10件処理できるM/M/1の平均系内滞在時間は。","options":["0.1秒","0.2秒","0.5秒","2秒"],"correct":2,"explain":"1/(μ−λ)=1/(10−8)=0.5秒。"},{"id":"D01-01","chapter":1,"kind":"applied","q":"8ビットの2の補数11110110を10進数の符号付き整数として解釈した値はどれか。","options":["−10","−9","246","−118"],"correct":0,"explain":"最上位が1なので負数。反転すると00001001、1を加えて00001010＝10。よって−10。246は符号なしの場合の値。"},{"id":"D01-02","chapter":1,"kind":"applied","q":"故障率1%、故障時の警報率90%、正常時の誤警報率5%のとき、警報が出て実際に故障している確率に最も近いものはどれか。","options":["90%","1%","15%","50%"],"correct":2,"explain":"ベイズの定理で0.01×0.9/(0.01×0.9+0.99×0.05)=0.009/0.0585≈0.154。"},{"id":"D01-03","chapter":1,"kind":"applied","q":"M/M/1モデルで到着率18件/分、サービス率20件/分のとき、平均系内滞在時間はどれか。","options":["3秒","6秒","30秒","60秒"],"correct":2,"explain":"W=1/(μ−λ)=1/2分=30秒。サービス時間だけではなく待ち時間を含む。"},{"id":"Q-01-X01","chapter":1,"kind":"applied","q":"BCDで27を表すと？","options":["00011011","00100111","00111000","11100100"],"correct":1,"explain":"0010 0111。10進数字ごとに符号化する。"},{"id":"Q-01-X02","chapter":1,"kind":"applied","q":"6人から順不同で2人を選ぶ方法は何通りか。","options":["6","12","15","30"],"correct":2,"explain":"6×5÷2＝15通り。"},{"id":"Q-01-X03","chapter":1,"kind":"applied","q":"f(x)=x²−2で初期値2のニュートン法の次の値は？","options":["1","1.25","1.5","2.5"],"correct":2,"explain":"2−(4−2)/4＝1.5。"},{"id":"Q-01-X04","chapter":1,"kind":"applied","q":"停止すれば正しいことだけを保証する性質は？","options":["全正当性","部分正当性","NP完全性","可逆性"],"correct":1,"explain":"部分正当性。全正当性には停止性も必要。"},{"id":"Q-01-X05","chapter":1,"kind":"applied","q":"64種類のシンボルが毎秒2000回なら理論ビット速度は？","options":["2000","6000","12000","128000"],"correct":2,"explain":"log₂64＝6なので12000bit/s。"},{"id":"Q-01-X06","chapter":1,"kind":"applied","q":"目標温度との差を測らずヒータを一定時間だけ動かす制御は？","options":["閉ループ制御","開ループ制御","PID制御","誤り訂正"],"correct":1,"explain":"開ループ制御。測定結果を戻して調整しない。"},{"id":"Q-01-X07","chapter":1,"kind":"applied","q":"陽性の見逃しを減らすとき重視する指標は？","options":["適合率","再現率","学習率","平均二乗誤差"],"correct":1,"explain":"再現率。実際の陽性のうち検出できた割合。"},{"id":"Q-01-X08","chapter":1,"kind":"applied","q":"既存モデルを小規模な対象データで追加学習する方法は？","options":["量子化","ファインチューニング","プルーニング","ランダムサーチ"],"correct":1,"explain":"ファインチューニング。"},{"id":"U-01-1","chapter":1,"kind":"applied","q":"8ビット符号なし整数の最大値は？","options":["255","127","256","128"],"correct":0,"explain":"全ビット1なら2⁸−1＝255。127は符号付き8ビットの上限。"},{"id":"U-01-2","chapter":1,"kind":"applied","q":"NOT(A OR B)と同値なのは？","options":["NOT A OR NOT B","NOT A AND NOT B","A AND B","A XOR B"],"correct":1,"explain":"両方が偽の場合だけ真。ド・モルガンの法則。"},{"id":"U-01-3","chapter":1,"kind":"applied","q":"独立な2部品の各故障率0.1。少なくとも1個故障する確率は？","options":["0.01","0.20","0.19","0.81"],"correct":2,"explain":"両方正常の0.9²を1から引く。0.20は同時故障を二重計上する。"},{"id":"U-01-4","chapter":1,"kind":"applied","q":"等確率の16種類の結果の情報量は？","options":["2ビット","8ビット","16ビット","4ビット"],"correct":3,"explain":"log₂16＝4。2⁴個を区別できる。"},{"id":"U-01-5","chapter":1,"kind":"applied","q":"到着8件/秒、処理10件/秒のM/M/1の平均系内時間は？","options":["0.5秒","0.1秒","0.4秒","2秒"],"correct":0,"explain":"1/(10−8)＝0.5秒。0.1秒は平均サービス時間。"},{"id":"U-01-X01","chapter":1,"kind":"applied","q":"近い値を引いて有効桁が減る現象は？","options":["情報落ち","桁落ち","オーバーフロー","アンダーフロー"],"correct":1,"explain":"近い値の差で有効桁が減るのが桁落ち。"},{"id":"U-01-X02","chapter":1,"kind":"applied","q":"一定区間内のまれな発生件数をモデル化する代表的分布は？","options":["指数分布","正規分布","ポアソン分布","一様分布"],"correct":2,"explain":"一定率のポアソン過程なら件数はポアソン分布、次までの時間は指数分布。"},{"id":"U-01-X03","chapter":1,"kind":"applied","q":"線形制約下で線形の利益関数を最大化する手法は？","options":["二分探索","ハフマン符号化","最小二乗法","線形計画法"],"correct":3,"explain":"線形の目的関数・制約を持つ最適化は線形計画法。"},{"id":"U-01-X04","chapter":1,"kind":"applied","q":"出現頻度の高い記号を短い符号にする方法は？","options":["ハフマン符号","CRC","パリティ","公開鍵暗号"],"correct":0,"explain":"ハフマン符号は可変長の情報源符号。CRCは誤り検出。"},{"id":"U-01-X05","chapter":1,"kind":"applied","q":"誤り検出後に再送を求める方式は？","options":["FEC（前方誤り訂正）","ARQ（自動再送要求）","QAM（直交振幅変調）","TDM（時分割多重）"],"correct":1,"explain":"ARQは再送、FECは冗長情報による訂正。"},{"id":"U-01-X06","chapter":1,"kind":"applied","q":"最高周波数4kHzの帯域制限信号に適した標本化周波数は？","options":["2kHz","4kHz","10kHz","6kHz"],"correct":2,"explain":"最高周波数の2倍より高い周波数が必要。"},{"id":"U-01-X07","chapter":1,"kind":"applied","q":"正解ラベルなしで顧客をグループ化する学習は？","options":["教師あり学習","強化学習","教師あり回帰","教師なし学習"],"correct":3,"explain":"クラスタリングはラベルなしで構造を探す。"},{"id":"U-01-X08","chapter":1,"kind":"applied","q":"画像の局所的な特徴抽出に典型的なネットワークは？","options":["CNN（畳み込みニューラルネットワーク）","RNN（再帰型ニューラルネットワーク）","決定木","線形回帰"],"correct":0,"explain":"畳み込みは局所領域の共通パターンの抽出に適する。"}],"deepIntro":"基数変換や確率は公式暗記だけでは解けない。情報を「ビットで表す」「条件を数える」「処理の混み具合を測る」という3つの視点から理解する。","deep":[{"id":"01-1","title":"2進数・固定長整数・浮動小数点","explain":"\u003cp>コンピュータは電気的な状態を0と1に対応させて情報を表す。2進数1101は右から1×2⁰＋0×2¹＋1×2²＋1×2³＝13。16進数は4ビットずつを1桁にまとめる表現なので、2進数1111 0010はF2₁₆である。文字列としての「13」と数値13は内部表現が違う。画像・文字・数値をすべてビット列で扱えるのは「符号化規則」を定めているからだ。\u003c/p>\n\u003cp>nビットの符号なし整数の範囲は0～2ⁿ−1。通常の2の補数で表す符号付き整数は−2ⁿ⁻¹～2ⁿ⁻¹−1。負数を求めるときは「正の値をnビットにする→0と1を反転→1を加える」。例：8ビットの−5は00000101→11111010→11111011。逆に11111011は最上位が1なので負数と判断し、反転して1を足して5を得る。\u003cstrong>ビット幅を明記しない2の補数の計算は曖昧\u003c/strong>になる。\u003c/p>\n\u003cp>固定小数点は小数点の位置を決めて整数のように扱う。一方、浮動小数点は「符号×仮数×基数^指数」で広い範囲を表せるが、桁数が有限なので丸め誤差がある。0.1のような10進小数が2進数では無限に続く場合があり、0.1＋0.2が厳密な0.3と一致しない言語処理系がある。金融計算などでは十進固定小数点や整数換算を検討する。\u003c/p>\n","worked":"\u003cp>8ビットの2の補数11110110を10進に直す。最上位が1なので負数。全ビット反転すると00001001、さらに1で00001010＝10。したがって−10。ここで8ビット「符号なし」と指定された場合は246となる点が重要。\u003c/p>\n","prompt":"8ビット符号付きで127＋1を計算したとき、どんな問題が起こるか。","answer":"\u003cp>表せる最大値を超えるオーバーフローが生じ、8ビットに切り詰める2の補数の加算では10000000（−128）となる。算術結果128が保存されるわけではない。\u003c/p>\n","beginner":{"scenario":"ビットは0か1の1桁、1バイトは8ビット。25を16＋8＋1に分解すると11001になる。右端から1、2、4、8、16の重みを持つ。","trap":"同じビット列でも符号付きかどうかで意味が変わる。","quizId":"U-01-1","lab":{"title":"10進整数から2進数、負数へ変換","problem":"8ビットの2の補数で−18を表せ。","steps":["18を2の累乗に分解すると16＋2。8ビットで00010010となる。","各ビットを反転すると11101101。","1を足すと11101110。これが8ビットの−18。","検算：最上位の重みは−128、残りは64＋32＋8＋4＋2＝110。合計−18。"],"answer":"11101110","check":"符号付き8ビットの範囲は−128〜127。ビット幅を先に固定する。"}},"textbook":[{"heading":"まず、数の表し方とは何か","body":"10進数の「305」は3×100＋0×10＋5×1という意味です。桁が左に一つずれるたび重みが10倍になります。2進数ではその倍率が2になり、使える数字も0と1だけです。右から順に1,2,4,8,16,32…の重みがあります。例えば10110は16＋4＋2＝22です。コンピュータが2進数を使うのは電子回路で二つの状態を安定して区別しやすいためです。"},{"heading":"10進数を2進数に変換する","body":"22を2で割ると商11余り0、11÷2は商5余り1、5÷2は商2余り1、2÷2は商1余り0、1÷2は商0余り1。余りを逆に読むと10110です。16進数は0〜9,A〜F（10〜15）を使い、2進数4桁を1桁にまとめます。1011 0110はB6です。小数では小数点の右が1/2,1/4,1/8…になるので0.101₂＝0.5＋0.125＝0.625です。"},{"heading":"なぜ負数に2の補数を使うのか","body":"4ビットなら16通りしかありません。0〜15と解釈することも、−8〜7と解釈することもできます。後者では最上位ビットの重みを−8とし、1110は−8＋4＋2＝−2。3＋(−2)を0011＋1110として加えると10001になり、4ビットに切り詰めて0001（1）になります。負数も同じ加算回路で処理できるのが利点です。"},{"heading":"小数の記憶と誤差","body":"固定小数点は例えば金額を円ではなく銭単位の整数として保持するように小数点位置を固定します。浮動小数点は科学表記3.14×10²のように有効数字と指数を分けます。広い範囲を表せますが有限桁のため丸めが必要です。2進数で0.1は循環小数になるので、有限桁では近似になります。オーバーフローは範囲超過、アンダーフローは小さすぎて正規の精度で表せなくなることです。浮動小数点の等値比較では用途に合った許容誤差を検討します。"}]},{"id":"01-2","title":"論理演算・集合・命題","explain":"\u003cp>AND（論理積）は両方真のときだけ真、OR（論理和）はいずれかが真なら真、XOR（排他的論理和）は真偽が異なるとき真。NOT（否定）は真偽を反転する。AND、OR、NOTの組合せで複雑な条件を表せる。例えば「管理者であり、かつ多要素認証を通過」は A AND M。「AまたはBのいずれでもない」は NOT(A OR B)で、ド・モルガンの法則により(NOT A) AND (NOT B)と同じ。\u003c/p>\n\u003cp>真理値表は、条件が2個なら00・01・10・11の4通りをすべて列挙する手法。論理式の同値性や回路の簡単化を確実に検証できる。集合ではA∪Bが和集合、A∩Bが共通部分、補集合は「全体集合に含まれるがAに含まれないもの」。集合の個数の式 |A∪B|＝|A|＋|B|−|A∩B| は重複を引き戻している。\u003c/p>\n","worked":"\u003cp>100人のうちPython経験者60人、SQL経験者45人、両方経験者20人。「少なくともどちらか」は60＋45−20＝85人。「どちらも経験なし」は100−85＝15人。「Pythonのみ」は60−20＝40人。条件文に「のみ」「少なくとも」「両方」が現れたら図を書いて整理する。\u003c/p>\n","prompt":"NOT(A AND B) と (NOT A) AND (NOT B) は同値か。","answer":"\u003cp>同値ではない。正しいのは NOT(A AND B)＝(NOT A) OR (NOT B)。Aが真、Bが偽のとき前者は真、後者は偽になる。\u003c/p>\n","beginner":{"scenario":"ログイン許可を考える。学生S、職員T、利用停止Dとすると(S OR T) AND NOT D。S=1、T=0、D=1なら不許可。","trap":"ORは両方真でも真。XORは両方真なら偽。","quizId":"U-01-2","lab":{"title":"カルノー図で論理式を簡単にする","problem":"A,Bが(0,1),(1,0),(1,1)のとき出力1、(0,0)で0となる論理式を求める。","steps":["2行2列の表を描き、行A=0,1、列B=0,1として出力を入れる。","右列の2個の1をまとめるとAは変化してBは1のまま。したがってB。","下行の2個の1をまとめるとBは変化してAは1のまま。したがってA。","これらのグループのいずれかが真ならよいのでA OR B。重なってまとめてもよい。"],"answer":"A OR B","check":"隣接する1を2の累乗個でまとめ、変化する変数を消す。表の端同士も隣接する。"}},"textbook":[{"heading":"論理値は何を表すか","body":"コンピュータは「在庫がある」「利用者がログイン済み」といった条件を真（true）・偽（false）として扱います。ANDは両条件が真、ORは少なくとも一方が真、NOTは真偽の反転、XORはちょうど一方が真のときに真です。ANDは直列のスイッチ、ORは並列のスイッチと考えると理解しやすくなります。"},{"heading":"真理値表を作る","body":"AとBがそれぞれ0か1なら組合せは00,01,10,11の4通り。各行で出力を計算して表にします。複雑な式も括弧の内側から計算すれば比較できます。例えばNOT(A AND B)は00,01,10で1、11で0。これはNOT A OR NOT Bと同じです。ド・モルガンの法則は否定を括弧内に移すとANDとORが交換されることを示します。"},{"heading":"集合と論理を対応させる","body":"学生の集合Aと教職員の集合Bを考えると、積集合A∩Bは両方に属す人、和集合A∪Bは少なくとも一方に属す人、補集合は対象全体のうちAでない人です。人数を合計する場合は重複を引くため|A∪B|=|A|+|B|−|A∩B|となります。命題A⇒BはAが真でBが偽の場合にだけ偽になります。対偶NOT B⇒NOT Aは元の命題と同値ですが、逆B⇒Aは一般に同値ではありません。"}]},{"id":"01-3","title":"確率・条件付き確率・期待値・ベイズ","explain":"\u003cp>確率で最初に確認するのは事象が\u003cstrong>独立\u003c/strong>か\u003cstrong>排反\u003c/strong>か。独立ならP(A∩B)＝P(A)P(B)。排反ならP(A∩B)＝0。P(A∪B)＝P(A)＋P(B)−P(A∩B)はいつでも使える。条件付き確率P(A|B)は「Bが起きたと分かっている集合」に母集団を狭めるので、P(A∩B)/P(B)で計算する。\u003c/p>\n\u003cp>ベイズの定理はP(原因|結果)＝P(結果|原因)P(原因)/P(結果)。「陽性なら病気か」「異常ログが出たら攻撃か」のように、結果から原因を逆推定するときに使う。感度が高くてもまれな事象なら偽陽性が多くなり得る。期待値は各結果の数値×確率の総和で、収益・故障コスト・遅延の平均的な見積りに利用する。\u003c/p>\n","worked":"\u003cp>障害率1%、障害時の警報検出率90%、正常時の誤警報率5%。警報が出たときに本当に障害である確率は、0.01×0.90 / (0.01×0.90＋0.99×0.05)＝0.009/0.0585≒15.4%。「検出率90%」を「警報の9割が障害」と誤読してはならない。\u003c/p>\n","prompt":"A・Bが排反でP(A)=0.3、P(B)=0.4のとき、P(A∩B)とP(A∪B)はいくつか。","answer":"\u003cp>共通部分0、和集合0.7。排反とは同時に起きないという意味で、独立とは異なる。\u003c/p>\n","beginner":{"scenario":"赤3青2の袋から戻さず2個引く。両方赤は3/5×2/4＝3/10。戻すなら3/5×3/5。","trap":"独立は片方の結果で他方の確率が変わらないこと。排反は同時に起きないこと。","quizId":"U-01-3","lab":{"title":"ベイズ推定を人数で理解する","problem":"1万人中100人がある状態。検査は状態ありの90%を陽性、状態なしの5%も陽性とする。陽性の人が状態ありの確率は？","steps":["状態あり100人のうち90人陽性、10人陰性。","状態なし9900人のうち495人陽性、9405人陰性。","陽性者は90＋495＝585人。この中で状態ありは90人。","90/585≒0.1538。感度90%でも陽性的中率は約15.4%。"],"answer":"約15.4%","check":"条件付き確率は条件を満たす集団を分母にする。発生率が低い場合は偽陽性が多くなり得る。"}},"textbook":[{"heading":"確率を数える","body":"サイコロの各面が同じ確率なら、偶数の出る確率は該当する2,4,6の3通りを全6通りで割って1/2です。条件付き確率P(A|B)はBが起きたことが分かった後のAの確率で、P(A∩B)/P(B)です。例えば偶数だったと分かっているとき4以上の確率は4,6の2通り÷偶数3通り＝2/3になります。"},{"heading":"独立と排反の違い","body":"コインを2回投げる場合、1回目の表が2回目の表の確率を変えないなら独立であり、両方表は1/2×1/2です。一つのコインで表と裏は排反で同時に起きません。少なくとも一つが起こる確率は「何も起こらない確率」を1から引くと簡単になることがあります。"},{"heading":"期待値を意思決定に使う","body":"当たれば100円、外れれば−20円、当たる確率1/4なら期待値は100×1/4−20×3/4＝10円です。これは長期間繰り返した平均的な利益で、1回の結果が10円になるという意味ではありません。"},{"heading":"ベイズ推定とは","body":"検査の感度が高くても、対象となる状態がまれなら陽性者の大半が偽陽性ということがあります。事前確率（検査前の割合）と検査結果の出やすさから事後確率を計算するのがベイズ推定です。式を暗記するより、全体を1000人などに置き換え、実際の陽性と偽陽性の人数を数えてから、陽性者を分母にする方法が確実です。"}]},{"id":"01-4","title":"情報量・符号化・誤り制御","explain":"\u003cp>等確率でN通りの候補がある場合、候補を区別するために必要な最小ビット数の考え方はlog₂N。16通りなら4ビットで表せる。異なる確率の結果を扱うエントロピーH＝−Σpᵢ log₂pᵢは平均情報量を示す。めったに起きない出来事ほど情報量−log₂pが大きい。圧縮には可逆圧縮（元に完全復元）と非可逆圧縮（知覚品質との交換で情報を捨てる）がある。\u003c/p>\n\u003cp>誤り検出の基本はパリティビット。偶数パリティなら送信データ中の1の総数が偶数になるよう1ビットを付ける。1ビット誤りは検出できるが、2ビット同時に反転すると検出できない。ハミング距離dの符号は最大d−1ビットの誤りを検出でき、最大⌊(d−1)/2⌋ビットを訂正できる。CRC（巡回冗長検査）は多項式除算の余りを付加して誤りを検出するが、暗号学的な改ざん防止・認証の代わりにはならない。\u003c/p>\n","worked":"\u003cp>最小ハミング距離5の符号が訂正可能な誤り数は⌊(5−1)/2⌋＝2。検出は最大4ビット。両者の違いは、訂正時は「どの符号語に近いか」を一意に決める必要があるため。\u003c/p>\n","prompt":"パリティが一致すればデータに誤りがないと断定できるか。","answer":"\u003cp>できない。偶数個のビット反転など、検出できない誤りがある。\u003c/p>\n","beginner":{"scenario":"等確率の4種類は00、01、10、11の2ビットで区別できる。頻出記号に短い符号を与えれば平均符号長を減らせる。","trap":"圧縮は冗長性を減らす。誤り制御は冗長情報を追加する。","quizId":"U-01-4"},"textbook":[{"heading":"情報をビット数で測る理由","body":"公平なコインは2通りなので結果を1ビットで伝えられます。公平な8択なら3ビット（000〜111）です。N通りを同じ確率で区別する情報量はlog₂N。確率pの事象の自己情報量は−log₂pで、珍しい事象ほど大きくなります。エントロピーは各事象の情報量を確率で重み付けした平均です。"},{"heading":"圧縮の仕組み","body":"Aが80%、BとCが各10%出現するならAを0、Bを10、Cを11と表せます。平均は0.8×1＋0.1×2＋0.1×2＝1.2ビット。どの符号も他の符号の先頭部分にならないので、連結しても区切りを判断できます。ハフマン符号は低頻度の記号を順に結合する木を作り、平均符号長を小さくする方式です。"},{"heading":"誤り検出と訂正","body":"圧縮は冗長性を減らす一方、通信路符号化では誤りに備えて情報を増やします。偶数パリティは1の個数が偶数になるビットを追加し、受信側で偶数か確認します。CRC（巡回冗長検査）はビット列を多項式とみなして余りを使い誤りを検出します。ハミング距離は二つのビット列で異なる桁の数です。符号語間の最小距離dなら、最大d−1個の誤りを検出、床((d−1)/2)個まで訂正できる設計が可能です。"}]},{"id":"01-5","title":"待ち行列・数値解析・グラフ","explain":"\u003cp>窓口やサーバで「到着速度」が「処理速度」に近付くと、混雑により待ち時間が急増する。M/M/1待ち行列は到着がポアソン過程、サービス時間が指数分布、窓口1つという\u003cstrong>特定の仮定\u003c/strong>がある。平均到着率λ、サービス率μ、λ＜μなら利用率ρ＝λ/μ、系内滞在時間W＝1/(μ−λ)、系内平均件数L＝λW。待機だけの平均時間はWq＝λ/[μ(μ−λ)]。リトルの法則L＝λWは安定した系で広く使える。\u003c/p>\n\u003cp>グラフは点（頂点）と辺で関係を表す。最短経路問題は距離や費用の最小化、最小全域木は全頂点を接続する辺のコスト最小化。Dijkstra法は負の辺重みがない最短経路で使われる。数値解析では二分法（区間を半分にしながら根を絞る）、ニュートン法（接線を使う）などの収束条件や誤差を考える。\u003c/p>\n","worked":"\u003cp>λ＝18件/分、μ＝20件/分ならρ＝0.9。平均滞在時間W＝1/(20−18)＝0.5分＝30秒、平均系内件数L＝18×0.5＝9件。単純に処理時間3秒と答えると待機時間を見落とす。\u003c/p>\n","prompt":"μ＝λのときW＝1/(μ−λ)にどんなことが起きるか。","answer":"\u003cp>分母が0になり定常状態が成立しない。このモデルでは安定条件λ＜μが必要。\u003c/p>\n","beginner":{"scenario":"処理能力に余裕があっても客の到着や処理時間にばらつきがあると行列ができる。M/M/1で到着6件/分、処理10件/分なら系内時間は1/(10−6)＝0.25分。","trap":"系内時間には処理時間を含む。到着率が処理率以上なら安定状態の公式は使えない。","quizId":"U-01-5","lab":{"title":"待ち時間と処理時間を分ける","problem":"M/M/1で1分に12件到着し、窓口は1分に15件処理できる。平均系内時間・待ち時間・系内件数は？","steps":["利用率は12/15＝0.8。1未満なので定常状態を考えられる。","平均系内時間W=1/(15−12)=1/3分＝20秒。","平均処理時間は1/15分＝4秒。平均待ち時間は20−4＝16秒。","リトルの法則L=λW=12×1/3=4件。"],"answer":"系内20秒、待ち16秒、系内4件","check":"λとμの時間単位をそろえる。Wは処理中も含む。"}},"textbook":[{"heading":"処理能力に余裕があっても待つ理由","body":"コンビニで平均1分に8人来てレジが平均1分に10人を処理できても、来店が集中すれば行列ができます。待ち行列は到着・処理・待機の仕組みを確率でモデル化したものです。M/M/1はポアソン到着、指数分布の処理時間、窓口1つを仮定した基本モデルです。"},{"heading":"記号を現実の量に戻す","body":"到着率λは単位時間に来る平均件数、サービス率μは忙しい窓口が単位時間に処理できる平均件数、利用率ρ=λ/μです。λ\u003cμの場合に平均系内時間W=1/(μ−λ)、平均サービス時間1/μ、平均待ち時間Wq=W−1/μ。リトルの法則L=λWは平均系内件数を求めます。利用率が1に近付くほど待ち時間が急増します。"},{"heading":"グラフと計算モデル","body":"グラフは対象を頂点、接続を辺で表現し、道路網や通信網をモデル化できます。有向辺は方向を持ち、重みは距離や費用です。数値解析では解析的に解きにくい式を近似し、誤差や収束を確認します。例えば方程式の根は符号の違う区間を半分ずつ狭める二分法で求められます。"}]},{"id":"01-X01","title":"離散数学：シフト・誤差・カルノー図","explain":"\u003cp>BCD（2進化10進）は各10進数字を4ビットで表すので59は0101 1001となり、通常の2進数111011とは違う。パック10進数は1バイトに2桁などを詰める。論理シフトは空いた桁を0で埋める。算術シフトは符号付き整数の演算を意識したシフトで、負数の算術右シフトでは最上位の符号ビットを複製する。左シフトは表現範囲を超えるとオーバーフローに注意する。桁落ちは近い数を引いたとき有効桁が失われる現象、情報落ちは大きさの異なる値を加えて小さい方が消える現象である。\u003c/p>\u003cp>カルノー図は真理値を隣接セルに並べ、1を2の累乗個ずつまとめて論理式を簡単にする。A,Bの真理値表でA=1の2セルが1なら、Bは結果に影響しないため式はAでよい。\u003c/p>","worked":"\u003cp>8ビットの11111000（−8）を算術右シフト1回すると11111100（−4）。論理右シフトなら01111100（124）。\u003c/p>","prompt":"BCDで27を表すと？","answer":"\u003cp>0010 0111。10進数字ごとに符号化する。\u003c/p>","beginner":{"scenario":"8ビット00000110を左に1桁ずらすと00001100＝12。右にずらすと00000011＝3。上位ビットが失われる場合は単純な倍増にならない。","trap":"桁落ちは近い数の差、情報落ちは大きさの異なる値の加減算。","quizId":"U-01-X01"},"textbook":[{"heading":"桁ごとの10進表現","body":"BCD（Binary Coded Decimal：2進化10進数）は10進数字を一つずつ4ビットで表します。例えば57は0101 0111。通常の2進数57は00111001なので、同じ値でも規則が異なります。4ビットで0〜9以外は数字として使わないため効率は落ちますが、10進桁の処理に便利です。"},{"heading":"シフトと誤差","body":"論理左シフトは左へ移動して右端に0を入れ、はみ出したビットは捨てます。符号なしで範囲内なら2倍です。論理右シフトは左端を0、算術右シフトは符号ビットで埋めます。負数の算術右シフトは符号を保ちますが端数の扱いに注意します。丸め誤差は有限桁の近似、桁落ちは近い値の引算、情報落ちは非常に小さな数を大きな数に加えたとき失われることです。"},{"heading":"カルノー図の作り方","body":"真理値表を行と列に並べ、隣り合う1を1,2,4,8個などで囲みます。複数変数なら隣接セルは一変数だけが変わる順（00,01,11,10）に並べます。囲んだ中で変化しない変数だけが残ります。例えばABとA NOT BをまとめるとA。最終的に各グループの論理積をORで結びます。端同士も隣接し、グループは重なってよいです。"}]},{"id":"01-X02","title":"応用数学：確率分布・統計的推論","explain":"\u003cp>n個からr個を順序付きで選ぶ順列はn!/(n−r)!、順序なしの組合せはさらにr!で割る。ベルヌーイ分布は1回の成功失敗、二項分布は独立なn回の成功回数、ポアソン分布は一定区間の発生数、指数分布は一定発生率での次の事象までの時間、正規分布は平均を中心とした連続分布。マルコフ過程では次状態の条件付き分布が現在状態で決まる。\u003c/p>\u003cp>標本の統計量から母集団を推測するのが推定。帰無仮説の下で観測以上に極端な結果が出る確率がp値であり、帰無仮説が真である確率ではない。第1種の誤りは真の帰無仮説を棄却、第2種は偽の帰無仮説を棄却できないこと。主成分分析は分散を保ちながら次元を減らす。因子分析は背後の共通因子を推定する。\u003c/p>","worked":"\u003cp>成功確率0.2の独立試行を3回行い1回だけ成功する確率は3×0.2×0.8²＝0.384。\u003c/p>","prompt":"6人から順不同で2人を選ぶ方法は何通りか。","answer":"\u003cp>6×5÷2＝15通り。\u003c/p>","beginner":{"scenario":"不良率10%の独立な製品を2個検査する。0個不良0.81、1個不良2×0.1×0.9＝0.18、2個不良0.01。","trap":"p値は帰無仮説が正しい確率ではない。","quizId":"U-01-X02"},"textbook":[{"heading":"分布とは何か","body":"確率分布は「どの値がどれだけ出やすいか」を示す規則です。成功・失敗1回ならベルヌーイ分布、独立な同確率試行n回の成功数なら二項分布です。n回中k回成功の確率は組合せnCk×p^k×(1−p)^(n−k)。順列では順番を区別し、組合せでは順番を区別しません。"},{"heading":"件数と間隔の違い","body":"一定率で独立に発生するポアソン過程では、一定時間内の件数はポアソン分布、発生間隔は指数分布になります。正規分布は平均を中心とする左右対称の連続分布で、標準偏差が大きいほど広がります。マルコフ過程は現在状態が与えられたとき次状態の確率がそれより過去に依存しないモデルです。"},{"heading":"推定と検定","body":"母集団すべてを調べる代わりに標本から平均などを推定します。標本平均は母平均の推定値、信頼区間は繰返し標本抽出した場合に一定割合で真値を含む方法による区間です。仮説検定は帰無仮説のもとで観測以上に極端な結果が出る確率（p値）を求め、有意水準と比較します。第1種の誤りは真の帰無仮説の棄却、第2種の誤りは偽の帰無仮説を棄却できないことです。"}]},{"id":"01-X03","title":"線形代数・数値解析・最適化","explain":"\u003cp>ベクトルは数の並び、行列は数の表、テンソルは多次元の配列として扱える。行列積は左の行と右の列の積和。固有値λはAv=λvとなる倍率で、固有ベクトルvは0でない。逆行列があればAx=bをx=A⁻¹bと解ける。掃出法は行基本変形で連立方程式を解く。\u003c/p>\u003cp>二分法は符号が異なる区間を半減し根を探す。ニュートン法は接線を利用してxをx−f(x)/f&#39;(x)へ更新する。オイラー法は微分方程式を小刻みに近似する。数値積分は台形法やシンプソン法で面積を近似する。線形計画法は線形の目的関数と制約の下で最大・最小を求める。数式処理は式の因数分解・微分などを記号として扱う。\u003c/p>","worked":"\u003cp>行列[[2,0],[0,3]]をベクトル(4,5)に掛けると(8,15)。固有値は2と3。\u003c/p>","prompt":"f(x)=x²−2で初期値2のニュートン法の次の値は？","answer":"\u003cp>2−(4−2)/4＝1.5。\u003c/p>","beginner":{"scenario":"商品A・Bの利益が3・5、時間制約が2A＋B≦10なら3A＋5Bを最大化する問題として表現する。目的関数、変数、制約を区別する。","trap":"数値解は近似。ニュートン法は必ず収束するとは限らない。","quizId":"U-01-X03"},"textbook":[{"heading":"ベクトルと行列の見方","body":"複数の特徴（年齢、身長、体重など）の並びがベクトル、複数のベクトルを表に並べたものが行列です。行列とベクトルの積は各行とベクトルの対応要素を掛けて足します。例えば行(2,3)とベクトル(4,5)の積は8＋15＝23。行列は回転・拡大などの線形変換としても理解できます。固有ベクトルは変換後も方向が変わらない非零ベクトル（負の倍率では反対向き）、固有値はその倍率です。"},{"heading":"近似計算の基本","body":"二分法は連続関数で符号が異なる区間を半分に分け、根を含む区間を狭めます。ニュートン法は曲線上の接線がx軸と交わる点を次の近似値にし、x←x−f(x)/f'(x)と更新します。微分は変化率、積分は小さな量の累積です。台形法は小区間の面積を台形で近似します。"},{"heading":"最適化の問題を作る","body":"線形計画法では変数x,y、目的関数3x＋5y、制約2x＋y≤10などを明示します。制約を満たす領域の中で最大・最小を探します。最小二乗法は観測値と予測値の差の二乗和を最小にするパラメータを求めます。最適化は目的関数と制約の設定が重要で、数値上の最適解が現実の最善策とは限りません。"}]},{"id":"01-X04","title":"情報理論：文字コード・形式言語・計算可能性","explain":"\u003cp>ASCIIは英数字などの基本文字、JIS・シフトJIS・EUCは日本語を含む符号化、Unicodeは文字を統一的に識別する体系でUTF-8は可変長の符号化方式である。情報源符号化は圧縮、通信路符号化は冗長性を加え誤り訂正・検出を可能にする。ハフマン符号は頻出記号を短く表す。\u003c/p>\u003cp>形式言語は文字列の集合を文法で定義する。BNF（バッカス・ナウア記法）は生成規則、正規表現は文字列パターン、有限オートマトンは入力で状態を遷移する機械である。プッシュダウンオートマトンはスタックを利用できる。チューリング機械は一般の計算モデル。述語論理は変数や全称・存在を扱い、演繹は規則から結論を導く一方、帰納は事例から一般化する。部分正当性は停止すれば正しいこと、全正当性は停止も保証すること。停止問題には一般解が存在しない。Pは多項式時間で解ける判定問題、NPは解の証明を多項式時間で検証できる判定問題、NP完全はNPに属し全NP問題から多項式時間還元できる問題である。\u003c/p>","worked":"\u003cp>自動販売機で0円・100円・200円を状態とし、100円投入で次の状態へ進める。状態遷移表を作れば入力に対する動作を明確にできる。\u003c/p>","prompt":"停止すれば正しいことだけを保証する性質は？","answer":"\u003cp>部分正当性。全正当性には停止性も必要。\u003c/p>","beginner":{"scenario":"0と1の列で最後が1なら受理する機械を考える。最後が0か未入力の状態と最後が1の状態を用意し、入力ごとに遷移する。","trap":"Unicodeは文字を識別する体系、UTF-8は符号化方式。","quizId":"U-01-X04"},"textbook":[{"heading":"文字の番号と保存形式","body":"文字を数値として識別する規則を文字コードと呼びます。ASCIIは英数字などを7ビットで扱い、Unicodeは多言語の文字を統一的に識別する符号位置を定めます。UTF-8はその符号位置を1〜4バイトで表現する符号化方式です。規則が異なるバイト列を誤った方式で読むと文字化けします。"},{"heading":"文法と状態機械","body":"言語は文字列の集合です。例えば3桁の数字という規則は正規表現で表現できます。BNF（バッカス・ナウア記法）は生成規則で文法を記述します。有限オートマトンは現在状態と入力から次状態を決め、最終状態で受理・不受理を判断します。括弧の任意の深さの対応などにはスタックを持つプッシュダウンオートマトンが利用できます。"},{"heading":"計算にできることとできないこと","body":"チューリング機械はテープを読み書きして状態を変える抽象的な計算モデルです。停止問題は任意のプログラムが停止するかを常に正しく判断する一般的手法がないことを示します。Pは多項式時間で解ける判定問題、NPは解候補を多項式時間で検証できる判定問題、NP完全はNPに属しNPのすべての問題が多項式時間で還元できるものです。P=NPかは未解決で、NP完全だから解けないと断定はできません。"}]},{"id":"01-X05","title":"通信理論：変調・多重化・誤り制御","explain":"\u003cp>単方向、半二重、全二重は通信方向と同時送受信の可否が異なる。ASK（振幅偏移変調）は振幅、FSK（周波数偏移変調）は周波数、PSK（位相偏移変調）は位相、QAM（直交振幅変調）は振幅と位相を変えて情報を伝える。1シンボルでM種類を区別するなら理想的にlog₂Mビットを表せる。\u003c/p>\u003cp>周波数分割多重は帯域を分け、時分割多重は時間を分ける。CRC（巡回冗長検査）は多項式演算で誤りを検出する。ARQ（自動再送要求）は検出後に再送、FEC（前方誤り訂正）は受信側で冗長情報を利用して訂正する。同期方式、ビット誤り率、伝送速度と実効速度の差も押さえる。\u003c/p>","worked":"\u003cp>16QAMは1シンボル4ビット。毎秒1000シンボルなら符号化などの損失を除く理論速度は4000bit/s。\u003c/p>","prompt":"64種類のシンボルが毎秒2000回なら理論ビット速度は？","answer":"\u003cp>log₂64＝6なので12000bit/s。\u003c/p>","beginner":{"scenario":"4種類の位相を区別すれば1シンボルで2ビット。毎秒1000シンボルなら理論2000bit/s。","trap":"シンボル毎秒とビット毎秒は同じとは限らない。","quizId":"U-01-X05"},"textbook":[{"heading":"情報を電波に乗せる","body":"0と1のデータを離れた場所へ送るには電圧や電波など物理的な状態に対応付けます。搬送波の振幅を変えるASK、周波数を変えるFSK、位相を変えるPSK、振幅と位相を組み合わせるQAMが代表的です。1回の信号状態（シンボル）で4種類を区別できれば2ビット、16種類なら4ビットを運べます。"},{"heading":"多重化と通信方向","body":"周波数分割多重（FDM）は周波数帯を分け、時分割多重（TDM）は送信時間を分けます。波長分割多重（WDM）は光の波長を分けます。単方向は一方向のみ、半二重は双方向だが同時不可、全二重は同時送受信可能です。"},{"heading":"誤りが起きたら","body":"送信側で検査情報を追加し、受信側で検査します。ARQ（自動再送要求）は誤りを検出して再送する方法、FEC（前方誤り訂正）は余分な情報で受信側が訂正する方法です。再送が難しい通信では訂正が重要になります。理論ビット速度と実際に利用者のデータが届く実効速度は、制御情報や再送のために異なります。"}]},{"id":"01-X06","title":"信号処理・計測・制御","explain":"\u003cp>フーリエ変換は時間波形を周波数成分で表す。低域通過フィルタは高周波雑音を抑える。標本化は時間、量子化は振幅を離散化し、A/D変換はアナログ信号を数値化する。標本化定理では帯域制限された信号を最高周波数の2倍より高い周波数で標本化する。\u003c/p>\u003cp>フィードバック制御は出力を測り目標との差を戻して調整する。比例・積分・微分を用いるPID制御は現在の偏差、偏差の累積、変化速度を利用する。加速度センサ、ジャイロ、温度センサ、LiDAR（レーザによる距離測定）などは物理量を取得し、モータやソレノイドなどアクチュエータは動作を起こす。GPS（衛星測位システム）は衛星からの信号を利用して位置を推定する。\u003c/p>","worked":"\u003cp>最高周波数3kHzの音声なら標本化周波数を8kHzとする設計は理論上の条件を満たす。\u003c/p>","prompt":"目標温度との差を測らずヒータを一定時間だけ動かす制御は？","answer":"\u003cp>開ループ制御。測定結果を戻して調整しない。\u003c/p>","beginner":{"scenario":"目標25℃・実測23℃なら偏差2℃。比例制御では偏差に応じ出力を調整し、積分項は長く残る偏差の解消に役立つ。","trap":"サンプリングが遅すぎるとエイリアシングが生じる。","quizId":"U-01-X06"},"textbook":[{"heading":"連続信号をコンピュータで扱う","body":"温度、音、光の強さは連続的に変化します。センサが物理量を電気信号に変え、A/D変換器が一定時刻ごとの振幅を有限の数値にします。時間を離散化するのが標本化、振幅を離散化するのが量子化です。帯域制限された信号を復元するには最高周波数の2倍を超える標本化周波数が必要です。低すぎると高い周波数が別の低い周波数に見えるエイリアシングが生じます。"},{"heading":"周波数で信号を見る","body":"音の波形には複数の周期成分が含まれます。フーリエ変換は時間の波形を周波数成分として表し、フィルタで不要な周波数を弱めると雑音除去に使えます。例えば低域通過フィルタは低い周波数を通し、高い周波数を抑えます。"},{"heading":"制御のループ","body":"ヒータを一定時間動かすだけなら開ループ制御、測定した温度を目標と比較し出力を調整するなら閉ループ（フィードバック）制御です。PID制御ではPが現在の偏差、Iが偏差の累積、Dが偏差の変化率に対応します。制御器が計算し、モータなどのアクチュエータが動き、センサが結果を測定します。"}]},{"id":"01-X07","title":"人工知能：機械学習と評価","explain":"\u003cp>AI（人工知能）の方法には知識ベースと推論エンジンを組み合わせるエキスパートシステム、データから規則を学ぶ機械学習などがある。教師あり学習は正解付きの分類・回帰、教師なし学習はクラスタリングや次元削減、強化学習は報酬を最大化する方策の学習。半教師あり学習は少数のラベル付きデータとラベルなしデータを利用する。\u003c/p>\u003cp>線形回帰は連続値、ロジスティック回帰は分類確率、決定木は条件で分岐、ランダムフォレストは複数の木を統合、SVM（サポートベクトルマシン）は分類境界の余裕を大きくする。k-means法は重心に基づいて分類する。学習・検証・テストデータを分離し、交差検証や正則化で過学習を抑える。適合率=TP/(TP+FP)、再現率=TP/(TP+FN)、F値は両者の調和平均。ROC曲線は偽陽性率と真陽性率、AUCはその曲線下面積。PR曲線は適合率と再現率の関係。\u003c/p>","worked":"\u003cp>真陽性30、偽陽性10、偽陰性20なら適合率75%、再現率60%、F値約66.7%。\u003c/p>","prompt":"陽性の見逃しを減らすとき重視する指標は？","answer":"\u003cp>再現率。実際の陽性のうち検出できた割合。\u003c/p>","beginner":{"scenario":"迷惑メール100通中80通を検出し普通のメール20通を誤検出すると、適合率80/(80＋20)＝80%、再現率80/100＝80%。","trap":"陽性が1%なら全部陰性と予測しても正答率99%。","quizId":"U-01-X07","lab":{"title":"分類モデルの精度を計算する","problem":"100件中陽性20件。モデルは15件を正しく陽性、10件を誤って陽性とした。正答率・適合率・再現率を求める。","steps":["真陽性TP=15。実際の陽性20件なので偽陰性FN=5。","偽陽性FP=10。実際の陰性80件なので真陰性TN=70。","正答率=(15＋70)/100＝85%。","適合率=15/(15＋10)=60%、再現率=15/(15＋5)=75%。","F値=2×0.6×0.75/(0.6＋0.75)≒0.667。"],"answer":"正答率85%、適合率60%、再現率75%、F値約66.7%","check":"適合率の分母は予測陽性、再現率の分母は実際の陽性。"}},"textbook":[{"heading":"機械学習が何を学ぶのか","body":"通常のプログラムは人がルールを記述します。機械学習では入力と正解などのデータから予測規則のパラメータを決めます。教師あり学習は正解付きのデータを用い、分類は種類、回帰は連続値を予測します。教師なし学習は正解ラベルを使わずクラスタや低次元構造を発見します。強化学習は行動の結果として得る報酬を最大にする方策を学習します。"},{"heading":"代表的なモデル","body":"線形回帰は説明変数の重み付き和で数値を予測し、ロジスティック回帰は確率を用いて分類します。決定木は条件分岐、ランダムフォレストは複数の木の結果の統合、SVM（サポートベクトルマシン）は境界の余裕を大きくする分類法です。k-meansは重心への割当てと重心更新を繰り返すクラスタリングです。"},{"heading":"評価の手順","body":"学習データで重みを学び、検証データで設定を選び、独立のテストデータで最終評価します。学習データだけ高精度なら過学習を疑います。分類では実際と予測の陽性・陰性を4通りに数え、適合率（予測陽性の正確さ）、再現率（実際の陽性の検出割合）、F値（両者の調和平均）を求めます。閾値を変えた評価にはROC曲線やPR曲線があり、データの偏りと評価目的を確認します。"}]},{"id":"01-X08","title":"深層学習・生成AIの仕組み","explain":"\u003cp>ニューラルネットワークは重み付き和と活性化関数を層ごとに計算する。多層パーセプトロンの重みは誤差逆伝播法で勾配を求め更新する。ReLUは正の領域で値を通し、ソフトマックスは複数クラスの出力を確率分布にする。学習率は更新幅、ドロップアウトは学習中に一部のユニットを無効化して過学習を抑える。事前学習したモデルを転移学習・ファインチューニングで適応する。\u003c/p>\u003cp>CNN（畳み込みニューラルネットワーク）は局所パターン、RNN（再帰型ニューラルネットワーク）やLSTM（長短期記憶）は系列、Transformerは注意機構で要素間関係を扱う。GAN（敵対的生成ネットワーク）は生成器と識別器、拡散モデルはノイズからの復元を学ぶ。LLM（大規模言語モデル）は大量の文章などから学習しトークンを生成する。自己教師あり学習、ゼロショット・フューショット、指示調整、RLHF（人間のフィードバックによる強化学習）、蒸留・量子化・プルーニングも理解する。\u003c/p>","worked":"\u003cp>学習データでは99%正解、未知のデータでは70%なら過学習を疑う。生成AIのもっともらしい誤りはハルシネーションと呼ばれ、出典確認や検証が必要。\u003c/p>","prompt":"既存モデルを小規模な対象データで追加学習する方法は？","answer":"\u003cp>ファインチューニング。\u003c/p>","beginner":{"scenario":"入力2と3、重み0.5と−1、バイアス1なら重み付き和は1−3＋1＝−1。ReLUは負の値を0にする。これを多数のユニットで繰り返す。","trap":"生成AIの自然な文章は事実確認を保証しない。","quizId":"U-01-X08"},"textbook":[{"heading":"ニューラルネットワークの最小単位","body":"入力xに重みwを掛けて足し、バイアスbを加えた値を活性化関数に通す計算が基本です。活性化関数がなければ線形計算を何層重ねても線形変換にまとめられます。ReLUは負の値を0にする非線形関数です。多数のユニットを層状につなぐと複雑な関係を表現できます。"},{"heading":"どうやって重みを決めるか","body":"入力から出力を計算し、予測と正解の差を損失関数で測り、損失を減らす方向に重みを更新します。誤差逆伝播法は後ろの層から連鎖律で勾配を計算し、勾配降下法は学習率に応じて更新します。過学習を抑えるには正則化、ドロップアウトなどを使います。"},{"heading":"モデルの違いと生成AI","body":"CNNは畳み込みで画像の局所特徴を共有し、RNNやLSTMは系列の過去の状態を利用します。Transformerは注意機構で系列中の要素の関係を扱います。大規模言語モデルは大量の文章などからトークンの関係を学習し、次のトークンを予測しながら文章を生成します。GANは生成器と識別器、拡散モデルはノイズ除去による生成を学びます。事前学習、追加学習、検索拡張生成（RAG）、量子化などの役割を区別します。生成結果は事実や権利処理を自動保証しないため、根拠確認と入力データの管理が必要です。"}]}],"beginnerIntro":"数と論理から、情報の表現・不確実性・AIまでを扱う。ビットの重み、確率の分母、入力と出力を紙に書いて理解しよう。"},{"id":2,"title":"アルゴリズム・プログラミング","group":"テクノロジ","priority":"B選択候補","summary":"データ構造・計算量・再帰・探索・整列・擬似言語を「手を動かして追う」。","lessons":[{"title":"計算量の考え方","body":"入力サイズnを増やしたときの処理の増加をO記法で表す。1回のループは概ねO(n)、二重ループはO(n²)、半分ずつ絞る二分探索はO(log n)。ただしループの範囲と条件を実際に確認する。","check":"表面上の二重ループでも常にO(n²)とは限らない。"},{"title":"主要なデータ構造","body":"スタックはLIFO（Last In First Out：後入れ先出し）、キューはFIFO（First In First Out：先入れ先出し）。連結リストは挿入・削除しやすいが位置への直接アクセスは苦手。","check":"ランダムアクセス、先頭操作、検索の計算量を区別。"},{"title":"探索とソート","body":"線形探索は順に見る。二分探索は整列済み配列の中央と比較して範囲を半分にする。マージソートはO(n log n)、クイックソートは平均O(n log n)でも最悪O(n²)の実装がある。","check":"二分探索の前提は整列済み。"},{"title":"再帰と動的計画法","body":"再帰は自分自身を呼ぶ処理で終了条件が必須。動的計画法は重複する部分問題の答えを保存して再利用し計算量を減らす。","check":"再帰の呼び出し順・戻り順を紙に書く。"},{"title":"擬似言語の追跡","body":"変数の更新順、添字の始点、ループ条件、整数除算を明記したトレース表を作る。短いコードを暗算しない。配列の範囲外アクセスや条件の境界値を確認。","check":"科目Bでは表の値を丁寧に追うことが得点に直結。"}],"terms":[{"term":"スタック","definition":"最後に追加した要素を最初に取り出すデータ構造"},{"term":"キュー","definition":"最初に追加した要素を最初に取り出すデータ構造"},{"term":"ハッシュ表","definition":"キーから計算した位置を用いて高速に検索する構造"},{"term":"二分探索","definition":"整列したデータの探索区間を半分ずつ狭める方法"},{"term":"計算量O記法","definition":"入力サイズ増加に対する計算資源増加の上限の尺度"},{"term":"安定ソート","definition":"等しいキーの要素の前後関係を保存する整列"},{"term":"再帰","definition":"処理の中で同じ処理を呼び出す構造"},{"term":"動的計画法","definition":"部分問題の結果を保存し再利用するアルゴリズム設計法"},{"term":"幅優先探索","definition":"近い階層から順に頂点を調べるグラフ探索"},{"term":"深さ優先探索","definition":"可能な限り深く進んでから戻るグラフ探索"}],"questions":[{"id":"Q02-01","chapter":2,"kind":"applied","q":"整列済みの1000件を二分探索したとき最大比較回数の目安は。","options":["約10回","約100回","約500回","約1000回"],"correct":0,"explain":"2^10=1024なので、おおむね10回程度の比較で絞れる（実装上の境界で±1程度）。"},{"id":"Q02-02","chapter":2,"kind":"applied","q":"キューに3,5,7を順に追加し、2回取り出すと順番は。","options":["7,5","3,5","5,7","3,7"],"correct":1,"explain":"FIFOなので最初に入れた3、次に5。"},{"id":"Q02-03","chapter":2,"kind":"applied","q":"平均O(n log n)でも分割の偏りで最悪O(n²)となり得る整列法は。","options":["マージソート","ヒープソート","クイックソート","バブルソート"],"correct":2,"explain":"典型的なクイックソートはピボットの選び方によって極端に偏る。"},{"id":"D02-01","chapter":2,"kind":"applied","q":"要素数1024の整列済み配列に二分探索を行うとき、区間の半減回数の目安はどれか。","options":["5回","10回","32回","512回"],"correct":1,"explain":"1024=2^10なので約10回半減できる。未整列配列にはこの前提が適用できない。"},{"id":"D02-02","chapter":2,"kind":"applied","q":"外側のループをn回、内側でjを1から毎回2倍にしj\u003c=nの間反復する場合の時間計算量はどれか。","options":["O(log n)","O(n)","O(n log n)","O(n²)"],"correct":2,"explain":"外側n回×内側約log₂n回。二重ループでも内側が倍増ならn²ではない。"},{"id":"D02-03","chapter":2,"kind":"applied","q":"最大値を求める処理で初期値を0にすると誤る入力はどれか。","options":["すべて正の数","すべて負の数","0を含む数列","昇順の数列"],"correct":1,"explain":"負の数だけの配列では初期値0より大きい値がなく0を返してしまう。先頭要素で初期化する。"},{"id":"Q-02-X01","chapter":2,"kind":"applied","q":"重みのないグラフで辺数が最小の経路を得る探索は？","options":["深さ優先探索","幅優先探索","選択ソート","ハッシュ探索"],"correct":1,"explain":"幅優先探索。"},{"id":"Q-02-X02","chapter":2,"kind":"applied","q":"変数の型が演算に適しているかをコンパイラが確認する段階は？","options":["字句解析","構文解析","意味解析","リンク"],"correct":2,"explain":"意味解析。字句解析はトークン化、構文解析は文法構造の確認。"},{"id":"U-02-1","chapter":2,"kind":"applied","q":"n回の外側ループと毎回n回の内側ループの計算量は？","options":["O(n)","O(n²)","O(log n)","O(1)"],"correct":1,"explain":"n×nの処理。入力2倍で主要項は約4倍。"},{"id":"U-02-2","chapter":2,"kind":"applied","q":"依頼を到着順に取り出すデータ構造は？","options":["スタック","優先度ヒープ","キュー","二分探索木"],"correct":2,"explain":"キューは先入れ先出し。スタックは後入れ先出し。"},{"id":"U-02-3","chapter":2,"kind":"applied","q":"同じ部分問題の解を保存して再利用する手法は？","options":["単純再帰","逐次探索","バブルソート","動的計画法"],"correct":3,"explain":"部分問題の重複計算を避けるのが動的計画法。"},{"id":"U-02-4","chapter":2,"kind":"applied","q":"x=3、x←x×2、x←x+1の実行後のxは？","options":["7","6","8","9"],"correct":0,"explain":"最初6、次に7。各代入で値が更新される。"},{"id":"U-02-5","chapter":2,"kind":"applied","q":"内部データを隠し定められた操作で利用させる考え方は？","options":["継承","カプセル化","ポリモーフィズム","コンパイル"],"correct":1,"explain":"内部状態を保護し実装変更を局所化する。"},{"id":"U-02-X01","chapter":2,"kind":"applied","q":"辺が非負のグラフの単一始点最短経路を求める手法は？","options":["バブルソート","ハフマン符号化","ダイクストラ法","二分探索"],"correct":2,"explain":"最小距離の未確定頂点から確定し辺を緩和する。"},{"id":"U-02-X02","chapter":2,"kind":"applied","q":"ソースをトークン列へ分割する段階は？","options":["構文解析","意味解析","リンク","字句解析"],"correct":3,"explain":"字句解析で識別子などに分割する。構文解析は並びの文法を確認する。"}],"deepIntro":"プログラミング問題はコードを丸暗記せず、「データの状態」「ループ不変条件」「処理回数」を追う。","deep":[{"id":"02-1","title":"計算量と漸近評価","explain":"\u003cp>アルゴリズムは入力nに対しどれだけ時間・メモリが必要かを分析する。Big O（オーダ記法）は増え方の上限を示す指標で、定数倍や小さな項を省いて比較する。順次探索は最悪O(n)、整列済み配列の二分探索はO(log n)、典型的な二重ループはO(n²)、マージソートはO(n log n)。ただし「二重ループなら必ずn²」とは限らない。内側の反復がnではなくlog nならO(n log n)になる。\u003c/p>\n\u003cp>時間計算量に加え、追加メモリ（空間計算量）も重要。再帰は呼出しスタックを消費し、動的計画法はメモリを使って重複計算を削減する。平均と最悪では特性が違うため、問題文の条件を確認する。\u003c/p>\n","worked":"\u003cp>for i=1..n の内側で jを1から倍々にしてnまで増やすなら、外側n回×内側約log₂n回でO(n log n)。一方、jが1ずつ増えるならO(n²)。コード上の更新式を確認する。\u003c/p>\n","prompt":"1024件の整列済み配列を二分探索すると、探索区間を半減する回数はおよそ何回か。","answer":"\u003cp>log₂1024＝10回程度。未整列配列には原則そのまま適用できない。\u003c/p>\n","beginner":{"scenario":"100万件を順に探索すると最悪100万回程度。整列済みなら二分探索で半分ずつ絞り約20回になる。","trap":"O記法は実時間ではなく入力増加に対する増え方。","quizId":"U-02-1","lab":{"title":"二分探索の手順を紙で追う","problem":"整列済み配列[3,8,12,17,21,30,42]から30を探す。添字は0始まり。","steps":["探索範囲は左0、右6。中央は(0＋6)÷2＝3で値17。30の方が大きいので左を4にする。","次の中央は(4＋6)÷2＝5で値30。目的値と一致する。","したがって添字5が答え。値を探すたびに範囲がほぼ半分になる。"],"answer":"添字5、比較2回","check":"整列済みという条件と、中央要素の大小による範囲更新が必要。"}},"textbook":[{"heading":"計算量は何を比べるか","body":"100件を順に探す処理は最大100件、1000件なら最大1000件を調べます。入力サイズnにほぼ比例するのでO(n)と表します。Oは厳密な実行時間ではなく十分大きいnでの増加の上限の尺度です。定数回の処理はO(1)、毎回半分に減る処理はO(log n)、二重ループで各n回ならO(n²)です。"},{"heading":"式の導き方","body":"for i=1..nの中で固定3回処理するなら3nでO(n)。内側が1..iなら合計1＋2＋…＋n=n(n＋1)/2でO(n²)。最も大きい次数の項が増加を支配します。探索やソートでは最良・平均・最悪の場合を区別し、時間だけでなく追加メモリ量も比較します。"},{"heading":"二分探索の前提","body":"昇順の配列なら中央と目的値を比較し、小さければ左半分、大きければ右半分に候補を絞ります。n個からn/2、n/4…と減るので約log₂n回です。ただし未整列データでは正しい半分を選べず、連結リストでは中央要素への移動が高コストになることがあります。"}]},{"id":"02-2","title":"データ構造と探索","explain":"\u003cp>配列は添字で要素にO(1)アクセスしやすいが、中央への挿入は要素移動が必要。連結リストは参照位置が既知なら接続変更で挿入しやすいが、目的位置までの探索はO(n)。スタックはLIFO（Last In First Out：後入れ先出し）で関数呼出しや括弧判定、キューはFIFO（First In First Out：先入れ先出し）で処理待ち、ヒープは優先度の最大・最小を取り出す。\u003c/p>\n\u003cp>ハッシュ表はキーをハッシュ関数で配列位置に変換する。平均的に高速でも衝突（コリジョン）が発生するため、連鎖法やオープンアドレス法が必要。木構造では二分探索木は左右の大小関係を保ち、平衡を保つ木は探索時間の悪化を抑える。\u003c/p>\n","worked":"\u003cp>スタックにA→B→Cの順でpushして、2回popした結果はC、B。キューならdequeueの結果はA、B。操作の方向を図に描く。\u003c/p>\n","prompt":"ハッシュ表の検索時間は必ずO(1)か。","answer":"\u003cp>平均的にはO(1)を期待するが、衝突が集中すると悪化する。負荷率や実装に依存する。\u003c/p>\n","beginner":{"scenario":"ブラウザの戻る操作は最後のページから取り出すスタック、印刷の待ち行列は先に受けた要求を処理するキューに似る。","trap":"ハッシュ表は順序を保証しない場合がある。","quizId":"U-02-2"},"textbook":[{"heading":"データ構造は置き方と取出し方","body":"配列は添字から要素へ直接アクセスでき、連結リストは要素が次の要素への参照を持ちます。配列の途中へ挿入すると後続をずらすことがあります。連結リストは挿入位置が分かっていれば参照のつなぎ替えで挿入できますが、位置の検索には順にたどる必要があります。"},{"heading":"取り出す順番の違い","body":"スタックは後入れ先出し（LIFO）で、関数呼出しや取消し操作に使えます。キューは先入れ先出し（FIFO）で、印刷待ちなどに使います。優先度付きキューは優先度で取り出し、ヒープで効率よく実装できます。"},{"heading":"木とハッシュ","body":"木は根から子へ枝が伸びる構造で、二分木は各節の子が最大2つです。二分探索木は左側のキーが小さく右側が大きい規則で検索します。偏ると性能が悪化するため平衡化します。ハッシュ表はキーをハッシュ関数で位置に変換します。同じ位置になる衝突を連鎖法などで処理する必要があります。適切な設計では平均的な等値探索が速いですが順序を保つとは限りません。"}]},{"id":"02-3","title":"整列・再帰・動的計画法","explain":"\u003cp>挿入ソートは整列済み部分に次の要素を挿入し、ほぼ整列済みなら速い。選択ソートは未整列部分の最小値を選ぶ。クイックソートは基準値（pivot）で分割して再帰的に処理する。平均O(n log n)でも偏った分割ではO(n²)。マージソートは分割して整列済み列を統合し、O(n log n)を保証するが追加領域を要することが多い。安定ソートとは、キーが同じ要素の相対順序を保つ整列である。\u003c/p>\n\u003cp>再帰では「終了条件」「1段階の処理」「次の呼出し」を分けて追う。動的計画法（DP: Dynamic Programming）は同じ部分問題を繰り返し計算する代わりに結果を保存する手法。最適部分構造と部分問題の重複があるかを考える。\u003c/p>\n","worked":"\u003cp>fib(n)=fib(n−1)+fib(n−2)の単純再帰は同じfib(3)を何度も計算する。配列F[0]=0,F[1]=1から順にF[i]=F[i−1]+F[i−2]を更新すれば計算時間O(n)、記憶は全表ならO(n)、直前2値だけならO(1)。\u003c/p>\n","prompt":"最悪計算量を重視し、追加メモリを許容するならマージソートとクイックソートのどちらが予測しやすいか。","answer":"\u003cp>マージソート。クイックソートは最悪O(n²)の入力がある。\u003c/p>\n","beginner":{"scenario":"階段を1段または2段ずつ上る方法数をf(n)とするとf(0)=1、f(1)=1、f(n)=f(n−1)+f(n−2)。表に保存するとf(4)=5を再計算なしで求められる。","trap":"再帰だけで高速化されるわけではない。終了条件も必要。","quizId":"U-02-3"},"textbook":[{"heading":"整列の目的と手順","body":"整列は検索・集計を効率化するため順序を揃える処理です。選択ソートは最小を選んで先頭と交換、挿入ソートは既に整列した部分へ挿入、バブルソートは隣接要素を比較交換します。いずれも単純な実装の最悪計算量はO(n²)。マージソートは半分に分けて整列し併合、クイックソートは基準値で分割して各部分を整列します。"},{"heading":"再帰の考え方","body":"階乗n!はn×(n−1)!と表現でき、0!=1で停止します。再帰呼出しごとに戻り先や局所変数が保存されるので、終了条件を欠くと無限呼出しやスタック不足になります。"},{"heading":"動的計画法との違い","body":"フィボナッチ数列を単純な再帰で求めると同じ小さい項を繰り返し計算します。結果を表に保存して再利用すると計算を減らせます。動的計画法は部分問題の最適解から全体の最適解を構成する場合にも使います。貪欲法は各段階で局所的に最善の選択をする方法ですが、常に全体最適になるとは限りません。"}]},{"id":"02-4","title":"擬似言語・トレース・境界値","explain":"\u003cp>科目Bのプログラミングは「問題文の変数定義」を基準に追跡する。配列の添字開始（0か1か）、上端が含まれるか、ループ変数の更新順、整数除算の切捨て、参照渡しと値渡しを明示する。特にwhileの条件は反復前に評価され、do-whileは少なくとも1回実行される。再帰は呼出し時点の局所変数をスタックに記録して追う。\u003c/p>\n\u003cp>トレース表には反復番号・条件判定・変数更新・配列変更を列で並べる。最大値や件数を数える処理では、初期値0でよいか、負数だけの入力でも正しいかを検証する。テスト入力は空配列、1要素、最小値、最大値、重複、既整列、逆順を優先する。\u003c/p>\n","worked":"\u003cp>\u003ccode>s=0; for i=1..4: s=s+i;\u003c/code> ではiが1,2,3,4、sが1,3,6,10と変化する。ループ後のiの値は言語仕様に依存するため、問題で定義されていない場合は勝手に仮定しない。\u003c/p>\n","prompt":"`max=0`から負数だけの配列を走査して最大値を求めるコードの欠陥は何か。","answer":"\u003cp>実際の最大値が負でも0を返す。最初の配列要素で初期化するなどの対応が必要。\u003c/p>\n","beginner":{"scenario":"変数を箱として考える。x=2、y=5からx←x+y、y←x−yを順に実行するとx=7、y=2。更新後のxを使う。","trap":"代入と比較を区別し、配列の添字開始値を確認する。","quizId":"U-02-4","lab":{"title":"擬似言語の入れ子をトレースする","problem":"s←0。iを1から3まで繰返し、各iについてjを1からiまで繰返しs←s+jとする。最後のsは？","steps":["i=1ではj=1のみ。s=1。","i=2ではj=1,2なのでs=1＋1＋2＝4。","i=3ではj=1,2,3なのでs=4＋1＋2＋3＝10。","内側の総反復回数は1＋2＋3＝6回。加算する値はすべて1ではない。"],"answer":"s=10","check":"外側の変数によって内側の回数が変わる。処理回数と変数の値を分ける。"}},"textbook":[{"heading":"擬似言語を読む準備","body":"変数は値を覚えておく名前付きの箱です。x←x＋1は現在のxを1増やして上書きする命令で、数学の等式ではありません。配列は複数の箱を添字で区別し、添字が0から始まるか1から始まるか問題文を確認します。"},{"heading":"条件と繰返し","body":"if文では条件が真の枝だけ実行し、elseがあれば偽の枝を実行します。forは範囲や回数、whileは条件で繰返します。whileは条件が偽なら一度も実行されません。ループのたびに変数の値、添字、条件結果を表に書きます。"},{"heading":"境界を確認する","body":"空配列、要素1個、最初と最後の添字、最大値・最小値などは誤りが出やすい点です。例えば0始まりの長さnの配列は添字0〜n−1であり、nは範囲外。処理を読む問題では初期値→条件→本体→更新の順序を実際に書いて確認します。"}]},{"id":"02-5","title":"プログラム設計・オブジェクト指向","explain":"\u003cp>関数は1つの責務にまとめ、入力・出力・副作用を明示する。モジュール結合度は低いほど変更が波及しにくく、モジュール強度（凝集度）は高いほど役割が明確。オブジェクト指向はデータと操作を1つのまとまりに捉え、カプセル化で内部状態への不正な操作を防ぐ。継承は共通性を表すが過度な継承は依存を強める。多態性（ポリモーフィズム）は同じ操作でも対象型に応じて実装を切り替えられる性質。\u003c/p>\n\u003cp>例外処理は正常経路と異常経路を分け、エラー原因と回復可能性を判断する。排他・トランザクションの境界はオブジェクトより外側の設計論点になる場合がある。プログラムが「正しそう」に見えても、仕様・境界値・異常入力で裏付ける。\u003c/p>\n","worked":"\u003cp>料金計算を画面描画と同じ関数に直接書くと画面変更時に計算ロジックも影響される。料金計算を入力と戻り値が明確な関数に分離すると、画面なしで単体テストできる。\u003c/p>\n","prompt":"同じ型の呼出し操作が異なるクラスで別の動作をする性質は何か。","answer":"\u003cp>多態性。継承そのものと混同しない。\u003c/p>\n","beginner":{"scenario":"口座クラスが残高と引落し操作を持ち、外から残高を直接変更できないようにすれば、引落し時に残高不足を必ず検査できる。","trap":"継承は再利用の一方法で、必ずしも結合度を下げない。","quizId":"U-02-5"},"textbook":[{"heading":"プログラムを分ける理由","body":"大きなプログラムで全ての処理が相互に依存すると一箇所の変更が全体に波及します。役割ごとに関数やモジュールに分け、入力と出力を明確にすることで、個別にテストし変更できるようになります。引数は関数へ渡す値、戻り値は処理結果です。"},{"heading":"オブジェクト指向の基本","body":"クラスはデータと操作の設計図、インスタンスはその具体物です。例えば口座クラスから残高の異なる口座を複数作れます。カプセル化は内部状態を外から直接変更させず操作を通すこと。継承は既存クラスの性質を受け継ぐこと。ポリモーフィズム（多態性）は同じ操作名で対象に応じた実装を呼べる性質です。"},{"heading":"設計の比較","body":"凝集度は一つのモジュール内部の目的のまとまり、結合度はモジュール間の依存の強さです。一般に高凝集・低結合を目指します。例外処理は異常時の処理を通常処理と区別し、失敗を隠さず適切に通知します。再利用や継承だけを目的にして不必要な依存を作らないことが重要です。"}]},{"id":"02-X01","title":"探索・整列・グラフアルゴリズム","explain":"\u003cp>選択ソートは未整列部分の最小を選び、バブルソートは隣接要素を交換、挿入ソートは整列済み部分へ挿入する。シェルソートは間隔を縮めながら挿入、クイックソートは基準値で分割、ヒープソートはヒープから最大などを取り出す。安定ソートは同じキーの元の順序を保つ。\u003c/p>\u003cp>幅優先探索はキューで近い頂点から訪問し、深さ優先探索はスタックや再帰で奥まで進む。ダイクストラ法は辺の重みが非負の場合に最短経路を求める。文字列探索、数値計算、ハフマン圧縮、ランレングス圧縮、自然言語の形態素解析・n-gram、Zバッファ法による奥行き判定も代表例。\u003c/p>","worked":"\u003cp>A→B=3、A→C=10、B→C=2ならAからCへの最短距離は5。ダイクストラ法では確定済み最短距離から隣接辺を緩和する。\u003c/p>","prompt":"重みのないグラフで辺数が最小の経路を得る探索は？","answer":"\u003cp>幅優先探索。\u003c/p>","beginner":{"scenario":"選択ソートでは[4,2,3,1]の最小1を先頭4と交換する。次は未整列部分だけで最小を探す。","trap":"クイックソートの最悪はO(n²)。ダイクストラ法は負の辺に一般には使えない。","quizId":"U-02-X01","lab":{"title":"最短経路を確定していく","problem":"A→B=4、A→C=1、C→B=2、C→D=7、B→D=1の有向グラフでAからDへの最短距離を求める。","steps":["初期距離A=0、他は無限大。Aから更新するとB=4、C=1。","最小の未確定C=1を確定。C→BでB=3に改善、C→DでD=8。","次にB=3を確定。B→DでD=4に改善。","D=4を確定。経路はA→C→B→D。"],"answer":"最短距離4","check":"目先の辺の長さだけでなく始点からの累積距離で確定する。負辺がない前提。"}},"textbook":[{"heading":"ソートを手で動かす","body":"配列[5,2,4,1]を挿入ソートするなら、最初の5を整列済みとし、2を5の前へ、4を2と5の間へ、1を先頭へ入れます。シェルソートは離れた要素を先に整列して間隔を縮めます。ヒープソートは最大・最小を効率よく取り出せるヒープを利用します。安定ソートは同じキーを持つ要素の相対順序を保ちます。"},{"heading":"グラフ探索の仕組み","body":"幅優先探索はキューに次の候補を入れて始点に近い頂点から訪れ、辺数を距離とする最短経路を求められます。深さ優先探索はスタックなどで一つの枝を深く探索して戻ります。ダイクストラ法は非負の重み付きグラフで暫定距離の最小頂点を確定し、その頂点経由で短くなる距離を更新します。"},{"heading":"応用アルゴリズム","body":"文字列探索はパターンが現れる位置を探す処理、ランレングス符号は同じ記号の連続を長さで圧縮する方法です。自然言語では形態素解析が文を意味のある最小単位などへ分け、n-gramは連続するn個の要素の出現を扱います。目的と入力条件によってアルゴリズムを選びます。"}]},{"id":"02-X02","title":"プログラム言語・翻訳・データ記述","explain":"\u003cp>手続型言語は処理手順、関数型言語は関数の適用、論理型言語は事実と規則、オブジェクト指向言語は状態と操作をまとめた対象を中心にする。コンパイラは字句解析→構文解析→意味解析→最適化・コード生成と進む。インタプリタは実行時に解釈する方式。BNF（バッカス・ナウア記法）は文法を記述する。\u003c/p>\u003cp>マークアップ言語はタグなどで文書やデータの構造を記述する。HTMLは文書の構造、CSSは見た目、XMLは独自タグを使う構造化データを記述する。JSONはキーと値などによるデータ交換形式であり、一般にマークアップ言語とは区別する。DOM（文書オブジェクトモデル）は文書を木構造として操作し、XML Schemaは文書構造を検証する。正規表現は文字列の形式を指定する。SQLはデータ操作の宣言型言語。\u003c/p>","worked":"\u003cp>正規表現 ^[0-9]{3}$ は3桁の数字だけに一致する。123は一致、12Aは不一致。\u003c/p>","prompt":"変数の型が演算に適しているかをコンパイラが確認する段階は？","answer":"\u003cp>意味解析。字句解析はトークン化、構文解析は文法構造の確認。\u003c/p>","beginner":{"scenario":"x=3+5を識別子、代入記号、数値、演算子に分割し、構造と型を確認して命令へ変換する。HTMLは文書の構造、CSSは見た目を記述する。","trap":"JSONはデータ表現。HTML・CSS・JSONは目的が異なる。","quizId":"U-02-X02"},"textbook":[{"heading":"人の言葉から機械の命令へ","body":"プログラム言語は実行させたい処理を定めた文法で書く方法です。手続型は命令の順序、関数型は関数の適用、論理型は事実と推論規則、オブジェクト指向はデータと操作をまとめた対象を中心とします。コンパイラはソースを別形式へ翻訳し、インタプリタはプログラムを解釈して実行します。両者を組み合わせる処理系もあります。"},{"heading":"翻訳の各段階","body":"「x=3+5」をx,=,3,+,5に分けるのが字句解析。代入の右側が加算式だと構造を認識するのが構文解析。型や変数の宣言等を調べるのが意味解析。最適化で等価な効率的表現へ変え、コード生成で実行命令等に変換します。リンカは外部参照を解決し目的コードを結合します。"},{"heading":"データ記述言語","body":"HTMLは見出しや段落などの構造、CSSは表示スタイル、XMLは独自タグでデータ構造を記述するマークアップ言語、JSONはオブジェクト・配列・値を表現する交換形式です。正規表現は入力パターンを指定し、XML SchemaはXMLの構造を検証します。処理の命令を表す言語と、文書・データを表す形式を区別します。"}]}],"beginnerIntro":"プログラムは処理手順、データ構造は情報の置き方。変数や配列を紙に書き、1行ずつ追跡しよう。"},{"id":3,"title":"コンピュータ構成要素","group":"テクノロジ","priority":"A重要","summary":"CPU・メモリ・キャッシュ・入出力の性能を数値と構造で理解。","lessons":[{"title":"CPUの性能","body":"CPU（Central Processing Unit：中央処理装置）の実行時間は命令数×平均CPI÷クロック周波数。CPI（Cycles Per Instruction：命令当たりの平均クロック数）が小さいほど同条件では速い。","check":"クロック周波数だけでCPUの優劣を決めない。"},{"title":"パイプライン","body":"命令を取得・解読・実行などに分割し重ねて処理する。分岐やデータ依存で停止が起きる。分岐予測・アウトオブオーダ実行はその影響を緩和。","check":"1命令の遅延と処理量を区別。"},{"title":"メモリ階層","body":"レジスタ→キャッシュ→主記憶→補助記憶の順に一般に遅く大容量。局所性を利用してよく使うデータを高速な階層に置く。キャッシュ平均アクセス時間はヒット率とミス時の時間から求める。","check":"ヒット率が上がってもミスの費用が大きいと影響する。"},{"title":"入出力と割込み","body":"DMA（Direct Memory Access：直接メモリアクセス）はCPUが全データを逐次転送せずに入出力を行う仕組み。割込みは実行中の処理を一時中断し、優先すべき事象に対応。","check":"DMAと割込みは別の機構。"},{"title":"記憶装置","body":"SSD（Solid State Drive：半導体記憶装置）は機械的なシークが不要。RAIDは冗長化や性能向上のため複数ディスクを組み合わせるが、バックアップの代替ではない。","check":"RAID 0は冗長性なし。"}],"terms":[{"term":"CPI","definition":"1命令を実行するのに必要な平均クロック数"},{"term":"クロック周波数","definition":"1秒間に発生するクロック周期の数"},{"term":"パイプライン","definition":"命令実行の段階を重ねて処理量を増やす方式"},{"term":"キャッシュメモリ","definition":"主記憶より高速で頻用データを置く小容量の記憶"},{"term":"局所性","definition":"近い時間やアドレスの情報が繰り返し使われやすい性質"},{"term":"DMA","definition":"CPUを介さず機器と主記憶の間でデータ転送する仕組み"},{"term":"割込み","definition":"事象発生時に現在の処理を中断して別処理を行うこと"},{"term":"仮想記憶","definition":"補助記憶を用いて大きな論理アドレス空間を提供する仕組み"},{"term":"RAID 0","definition":"データを分散して読み書き性能を狙うが冗長性を持たない構成"},{"term":"RAID 1","definition":"同じ内容を複数のディスクに複製するミラーリング"}],"questions":[{"id":"Q03-01","chapter":3,"kind":"applied","q":"命令数10億、CPI=2、動作周波数2GHzのCPUの実行時間は。","options":["0.5秒","1秒","2秒","4秒"],"correct":1,"explain":"10^9×2/(2×10^9)=1秒。"},{"id":"Q03-02","chapter":3,"kind":"applied","q":"ヒット率90%、ヒット時1ns、ミス時101nsの平均アクセス時間は。","options":["1.1ns","10ns","11ns","91ns"],"correct":2,"explain":"0.9×1+0.1×101=11ns。なおミス時時間は合計時間という設定。"},{"id":"Q03-03","chapter":3,"kind":"applied","q":"RAIDに関する説明として正しいものは。","options":["RAID 0は耐障害性が高い","RAID 1は複製する","RAIDはバックアップ不要にする","RAID 5はディスク1台で構成する"],"correct":1,"explain":"RAID 1はミラーリング。誤削除などには別途バックアップが必要。"},{"id":"D03-01","chapter":3,"kind":"applied","q":"命令数10^9、平均CPI=2、クロック周波数2GHzのCPUの実行時間はどれか。","options":["0.25秒","0.5秒","1秒","2秒"],"correct":2,"explain":"実行時間=命令数×CPI/周波数=10^9×2/(2×10^9)=1秒。"},{"id":"D03-02","chapter":3,"kind":"applied","q":"キャッシュヒット率95%、ヒット5ns、ミスした場合の総時間105nsでの平均アクセス時間はどれか。","options":["5ns","10ns","15ns","100ns"],"correct":1,"explain":"0.95×5＋0.05×105＝10ns。ミス時間が追加ペナルティなのか総時間なのかに注意する。"},{"id":"D03-03","chapter":3,"kind":"applied","q":"4TBのディスクを5台使うRAID 6の単純な利用可能容量はどれか。","options":["8TB","12TB","16TB","20TB"],"correct":1,"explain":"RAID 6は二重パリティ分の2台相当が必要で(5−2)×4=12TB。管理領域などは無視。"},{"id":"Q-03-X01","chapter":3,"kind":"applied","q":"キャッシュから追い出す際に変更内容を書き戻す方式は？","options":["ライトスルー","ライトバック","FIFO","DMA"],"correct":1,"explain":"ライトバック。"},{"id":"Q-03-X02","chapter":3,"kind":"applied","q":"CPUが各バイトを転送せず周辺装置と主記憶の間で転送する機構は？","options":["DMA","RAID","GPU","NAT"],"correct":0,"explain":"DMA。"},{"id":"U-03-1","chapter":3,"kind":"applied","q":"2億命令、平均CPI=3、3GHzのCPU時間は？","options":["0.2秒","2秒","0.02秒","0.6秒"],"correct":0,"explain":"2×10⁸×3/(3×10⁹)=0.2秒。"},{"id":"U-03-2","chapter":3,"kind":"applied","q":"ヒット率0.8、ヒット5ns、ミス時総時間55nsの平均は？","options":["5ns","15ns","11ns","55ns"],"correct":1,"explain":"0.8×5＋0.2×55＝15ns。総時間を二重加算しない。"},{"id":"U-03-3","chapter":3,"kind":"applied","q":"2TBディスク5台のRAID6の理論容量は？","options":["10TB","8TB","6TB","4TB"],"correct":2,"explain":"RAID6は2台分の冗長情報なので(5−2)×2。"},{"id":"U-03-4","chapter":3,"kind":"applied","q":"CPUが装置状態を一定間隔で確認する方式は？","options":["割込み","DMA","ライトバック","ポーリング"],"correct":3,"explain":"ポーリングは繰り返し問い合わせる方式。"},{"id":"U-03-X01","chapter":3,"kind":"applied","q":"同じ演算を複数の画素へ同時適用する命令方式は？","options":["SIMD","SISD","DMA","RAID"],"correct":0,"explain":"SIMDは単一命令・複数データ。画像処理などに適する。"},{"id":"U-03-X02","chapter":3,"kind":"applied","q":"16ビット幅で毎秒100万回転送する理論速度は？","options":["16MB/s","2MB/s","8MB/s","1MB/s"],"correct":1,"explain":"16ビット＝2バイト、2×10⁶バイト/秒。"}],"deepIntro":"CPU・メモリ・入出力は「何が高速で、何がボトルネックか」を数量で理解する。","deep":[{"id":"03-1","title":"CPU・命令実行・性能指標","explain":"\u003cp>CPU（Central Processing Unit：中央処理装置）は命令を取り出し、解読し、演算し、結果を書き戻す。制御装置、演算装置、レジスタなどを使う。クロック周波数が高いだけではCPU性能を比べられない。命令数IC、命令当たり平均クロックCPI（Cycles Per Instruction）、周波数fなら実行時間はIC×CPI/f。命令パイプラインでは各段階を重ねてスループット（単位時間当たりの処理量）を上げるが、分岐予測ミスやデータ依存で停止する。\u003c/p>\n","worked":"\u003cp>10⁹命令、平均CPI=2、2GHzなら実行時間10⁹×2/(2×10⁹)=1秒。同じクロックでもCPIが1なら0.5秒。周波数だけで比較しない。\u003c/p>\n","prompt":"パイプライン段数を2倍にすると個々の命令の処理時間は必ず半分か。","answer":"\u003cp>ならない。目標は同時処理によるスループット改善であり、ハザードや段間処理コストもある。\u003c/p>\n","beginner":{"scenario":"CPUは命令を読み、解釈し、演算する。1億命令・平均CPI=2・2GHzなら1億×2÷20億＝0.1秒。","trap":"クロック周波数だけでは速度は決まらない。命令数とCPIも必要。","quizId":"U-03-1","lab":{"title":"クロックと命令実行時間","problem":"CPU Aは2GHz、平均CPI=2。CPU Bは3GHz、平均CPI=4。どちらも6億命令を実行する。","steps":["GHzを10⁹Hzへ変換。Aは2×10⁹クロック/秒。","Aの必要クロックは6×10⁸×2=1.2×10⁹、時間0.6秒。","Bの必要クロックは6×10⁸×4=2.4×10⁹、時間0.8秒。","周波数の高いBよりCPIの低いAが速い。"],"answer":"Aは0.6秒、Bは0.8秒、Aが速い","check":"性能＝周波数だけではない。CPI（Cycles Per Instruction）は1命令当たりクロック数。"}},"textbook":[{"heading":"CPUは何を繰り返すか","body":"CPU（中央処理装置）は主記憶から命令を取り出し、解読し、演算して結果を保存する装置です。プログラムカウンタは次に実行する命令の位置、レジスタはCPU内部の高速な小容量記憶、演算装置は加算や論理演算などを担います。命令には演算の種類と対象の指定が含まれます。"},{"heading":"時間を計算する","body":"クロック周波数2GHzは1秒に20億回の基準信号です。平均CPI（Cycles Per Instruction：命令当たりクロック数）が2なら平均2クロックで1命令を処理します。CPU時間＝命令数×CPI÷周波数。命令数1億・CPI2・2GHzなら0.1秒です。MIPSは毎秒百万命令単位ですが、異なる命令体系の単純比較には注意します。"},{"heading":"パイプラインの意味","body":"洗濯・乾燥・畳む作業を別々に担当すれば、一着目を乾燥中に二着目を洗えます。CPUでも命令の取り出し、解読、実行などを重ねて全体の処理件数を増やします。ただしデータ依存や分岐、資源競合によって停止が生じることがあります。1命令の時間が段数分だけ短くなるという意味ではありません。"}]},{"id":"03-2","title":"キャッシュ・主記憶・仮想記憶","explain":"\u003cp>レジスタ、キャッシュ、主記憶、SSDは速度・容量・コストが異なる階層。キャッシュは時間的局所性（同じデータを再利用）と空間的局所性（近くのデータも使う）を利用する。キャッシュヒット率h、ヒット時のアクセス時間t₁、ミス時の追加ペナルティpなら平均時間はt₁＋(1−h)p（\u003cstrong>ペナルティが追加時間\u003c/strong>のとき）。表現によってはh×t₁＋(1−h)×t₂（ミス時の総時間）を用いる。\u003c/p>\n\u003cp>仮想記憶はプロセスごとに仮想アドレス空間を与え、ページ表で物理メモリへ変換する。TLB（Translation Lookaside Buffer：アドレス変換キャッシュ）が変換を高速化する。ページフォールトが多く、ページの退避・読み込みに時間を奪われる状態がスラッシング。主記憶の不足を単なるCPU増強で解決できない。\u003c/p>\n","worked":"\u003cp>ヒット率95%、ヒット5ns、ミス時の\u003cstrong>総\u003c/strong>アクセス105nsなら平均は0.95×5＋0.05×105＝10ns。105nsが追加ペナルティなら式が変わる点に注意。\u003c/p>\n","prompt":"TLBはデータ本体をキャッシュするか。","answer":"\u003cp>基本的に仮想ページと物理フレームの変換情報を保持する。一般のCPUデータキャッシュとは役割が違う。\u003c/p>\n","beginner":{"scenario":"配列を順に読むと近くのデータがキャッシュに入っている場合がある（空間的局所性）。同じ変数を反復利用するのは時間的局所性。","trap":"キャッシュミスとページフォールトは別。前者で必ずディスクを読むわけではない。","quizId":"U-03-2","lab":{"title":"キャッシュのミス時の定義を読む","problem":"ヒット率95%、キャッシュ参照10ns。ミス時はキャッシュ参照の後、主記憶から100nsで取得する。平均アクセス時間は？","steps":["ヒット時は10ns。ミス時総時間は10＋100＝110ns。","ミス率は1−0.95＝0.05。","加重平均は0.95×10＋0.05×110＝9.5＋5.5＝15ns。","または常に10nsかかり、ミス時だけ100ns追加として10＋0.05×100＝15ns。"],"answer":"15ns","check":"ミス時の時間が総時間なのか追加時間なのか確認する。"}},"textbook":[{"heading":"なぜメモリに階層があるのか","body":"CPU内部のレジスタは速いが少量、キャッシュはその次、主記憶はより大容量、SSDやHDDはさらに大容量で電源を切っても保持できます。高速・大容量・低価格をすべて同時に満たしにくいため組み合わせます。主記憶のDRAMは定期的な再充電が必要で高密度、キャッシュのSRAMは高速ですが面積当たりの容量が小さくなりやすいです。"},{"heading":"キャッシュの仕組み","body":"必要なデータがキャッシュにあればヒット、なければミスで下位から取得します。時間的局所性は最近使ったデータをまた使う傾向、空間的局所性は近いアドレスを使う傾向です。キャッシュは近いデータをまとめて取り込みます。平均アクセス時間はヒット時時間とミス時総時間を確率で重み付けします。"},{"heading":"仮想記憶の仕組み","body":"プログラムが使う仮想アドレスをページ単位で物理メモリへ対応付けます。ページ表がその対応を記録し、TLB（アドレス変換キャッシュ）が変換を高速化します。必要なページが未配置ならページフォールトが起こりOSが処理します。ページを頻繁に入れ替えるスラッシングは性能を悪化させます。キャッシュはデータアクセス高速化、仮想記憶はアドレス空間と資源管理が主目的です。"}]},{"id":"03-3","title":"ディスク・RAID・記憶装置","explain":"\u003cp>HDD（Hard Disk Drive：磁気ディスク）は機械的なシーク時間と回転待ち時間が効く。平均回転待ち時間は1回転時間の約半分。7200rpmなら1回転8.33ms、平均回転待ち約4.17ms。さらにシーク・転送時間を加算する。SSD（Solid State Drive：半導体ドライブ）は機械的回転を伴わず、ランダムアクセスで有利なことが多いが、書込み寿命やコントローラ設計にも依存する。\u003c/p>\n\u003cp>RAID（Redundant Array of Independent Disks：独立ディスクの冗長配列）は性能・冗長性を組み合わせる。RAID 0はストライピングで冗長性なし、RAID 1はミラーリング、RAID 5は分散パリティで最低3台、RAID 6は二重パリティで最低4台。RAIDはバックアップの代替ではなく、誤削除やランサムウェアへの復旧を保証しない。\u003c/p>\n","worked":"\u003cp>4TB×5台のRAID5の単純な利用可能容量は(5−1)×4＝16TB（管理領域などは除く）。同容量RAID6なら(5−2)×4＝12TB。\u003c/p>\n","prompt":"RAID1だけで別拠点バックアップは不要か。","answer":"\u003cp>不要とはいえない。論理削除・同時破損・災害・不正暗号化に備える別系統のバックアップが必要。\u003c/p>\n","beginner":{"scenario":"2TBディスク4台をRAID5にすると理論容量は(4−1)×2＝6TB。故障1台分の冗長性がある。","trap":"RAIDは誤削除やランサムウェアから復元するバックアップの代わりにならない。","quizId":"U-03-3"},"textbook":[{"heading":"記憶装置の違い","body":"HDD（磁気ディスク装置）は回転する円盤の位置にヘッドを移動して読み書きするため、シーク時間、回転待ち時間、データ転送時間がかかります。SSD（半導体記憶装置）は主にフラッシュメモリを利用し機械的移動がありません。書込み寿命や消去単位などの特性もあります。"},{"heading":"RAIDの仕組み","body":"RAIDは複数ディスクを一つの論理記憶装置のように使います。RAID0は分散書込み（ストライピング）で容量と並列性を得ますが冗長性なし。RAID1は同じ内容を複製（ミラーリング）。RAID5は分散パリティで1台、RAID6は二重パリティで2台の故障に耐える構成です。同容量n台ならRAID5の容量は(n−1)台分、RAID6は(n−2)台分です。"},{"heading":"バックアップとの違い","body":"ディスク故障からの継続・再構築を目的とするRAIDでも、利用者の誤削除や悪意ある暗号化は全体に反映され得ます。別の場所・媒体・時点のバックアップを作り、実際に復元できるか試します。容量の計算では十進TBと二進TiB、冗長化や管理領域を区別します。"}]},{"id":"03-4","title":"割込み・入出力・バス","explain":"\u003cp>割込みはCPUが実行中の処理を一時中断して、優先度の高い事象に対応する仕組み。ハードウェア割込みは装置から、ソフトウェア割込みは命令や例外から起こる。DMA（Direct Memory Access：直接メモリアクセス）はCPUを介さず装置と主記憶間のデータ転送を助け、CPU負荷を軽減する。\u003c/p>\n\u003cp>バスはCPU・メモリ・周辺機器の通信路。帯域幅とレイテンシ（処理開始から応答までの遅延）は別の性能指標。例えば帯域1GB/sでも1回の小さな転送が1nsで終わるとは限らない。GPU（Graphics Processing Unit：画像処理装置）は多数の演算を並列処理するのに適するが、データ転送や分岐の多い処理では必ずしも有利ではない。\u003c/p>\n","worked":"\u003cp>100MBの連続転送を理論上200MB/sで行うなら転送時間0.5秒。実際には初期待ち・プロトコル処理・共有資源などが追加される。\u003c/p>\n","prompt":"DMAを使えばCPUはまったく関与しなくなるか。","answer":"\u003cp>ならない。通常は転送設定や完了通知などでCPUが関与する。\u003c/p>\n","beginner":{"scenario":"CPUが印刷完了を何度も尋ねるのはポーリング、機器が完了時に通知するのは割込み。大量転送にはDMAを利用できる。","trap":"割込みは通知、DMAは転送方法。併用できる。","quizId":"U-03-4"},"textbook":[{"heading":"CPUと周辺機器の速度差","body":"キーボードやディスクの処理はCPUに比べ遅い場合があります。CPUが常に機器の完了を待っていては無駄です。ポーリングはCPUが定期的に装置の状態を確認し、割込みは装置やタイマなどがCPUへイベントを通知します。"},{"heading":"割込みの流れ","body":"CPUが通常処理中に割込み要求を受けると、必要な実行状態を保存し、割込み処理ルーチンを実行してから元の処理へ戻ります。優先度やマスクで通知の扱いを調整できます。例外は実行命令に起因する内部イベントなどを含みます。"},{"heading":"データを転送する方法","body":"プログラム制御入出力ではCPUが転送に関与し、DMA（Direct Memory Access：直接メモリアクセス）では制御器が主記憶と装置間のデータ転送を担当します。CPUは条件設定と完了処理などを行います。バスはデータ・アドレス・制御情報の経路で、幅と転送回数から理論帯域を求められます。割込みとDMAは競合する概念ではなく併用できます。"}]},{"id":"03-X01","title":"プロセッサ方式・キャッシュ書込み","explain":"\u003cp>RISC（縮小命令セットコンピュータ）は比較的単純な命令体系、CISC（複合命令セットコンピュータ）は複雑な命令も備える。スーパースカラは複数命令を同時発行し、VLIW（超長命令語）は並列実行する操作を長い命令語にまとめる。SIMD（単一命令・複数データ）は同一演算を複数データに適用する。\u003c/p>\u003cp>ライトスルー方式はキャッシュ更新と主記憶更新を同時に行う。ライトバック方式は変更をキャッシュに保持し、必要時に主記憶へ書く。直接マップ・セットアソシアティブ・フルアソシアティブは配置候補の違い。SRAMは高速でキャッシュ、DRAMは高密度で主記憶に適する。フラッシュは不揮発性。\u003c/p>","worked":"\u003cp>ヒット率90%、キャッシュ10ns、ミス時総時間100nsなら平均10×0.9＋100×0.1＝19ns。\u003c/p>","prompt":"キャッシュから追い出す際に変更内容を書き戻す方式は？","answer":"\u003cp>ライトバック。\u003c/p>","beginner":{"scenario":"キャッシュのxを5から7に変えるとき、ライトスルーは主記憶も更新、ライトバックは変更を保持して後で書き戻す。","trap":"RISCとCISCの区別だけで実機の速度は決まらない。","quizId":"U-03-X01"},"textbook":[{"heading":"命令体系と実行並列性","body":"RISC（縮小命令セットコンピュータ）は比較的単純な命令体系を用い、CISC（複合命令セットコンピュータ）は複雑な操作を表す命令も持ちます。現代の実装は単純な二分では説明できません。スーパースカラは同じサイクルに複数命令を発行する仕組み、VLIW（超長命令語）は並列操作を長い命令語にまとめる方式、SIMD（単一命令・複数データ）は一命令で複数データを処理する方式です。"},{"heading":"キャッシュの配置","body":"直接マップはメモリブロックの格納候補が1箇所、セットアソシアティブは候補が複数、フルアソシアティブは任意の枠へ格納できます。候補が多いほど競合ミスを減らせる場合がありますが、検索回路は複雑になります。"},{"heading":"書込みの方式","body":"ライトスルーはキャッシュに書くとき主記憶も更新し、ライトバックは変更済みを記録して必要時にまとめて書き戻します。前者は主記憶との整合を保ちやすく、後者は書込み回数を減らせることがあります。複数CPUのキャッシュ間でデータの一貫性を保つ仕組みも必要です。"}]},{"id":"03-X02","title":"バス・入出力デバイスと装置","explain":"\u003cp>バスはデータ、アドレス、制御情報を伝える共通経路。バス幅と転送周波数から理論帯域を計算できる。PCI Expressは高速なシリアル接続、USBは周辺機器の接続、SATAは記憶装置接続の規格。DMA（直接メモリアクセス）はCPUが各データを逐次転送する負担を減らす。\u003c/p>\u003cp>入出力装置のうち入力装置にはキーボード、光学式文字読取装置（OCR）、バーコードリーダ、タッチパネルなど、出力装置には表示装置、プリンタなどがある。SSDは半導体記憶、HDDは磁気ディスクであり、ディスクにはシーク時間・回転待ち・転送時間が生じる。\u003c/p>","worked":"\u003cp>32bit幅で毎秒100万回転送なら理論上4MB/s。\u003c/p>","prompt":"CPUが各バイトを転送せず周辺装置と主記憶の間で転送する機構は？","answer":"\u003cp>DMA。\u003c/p>","beginner":{"scenario":"64ビット幅は8バイト。毎秒1億回転送なら理論800MB/s。制御情報や待ち時間で実効値は下がる。","trap":"ビットとバイトを混同しない。接続規格の最大値と実効値は別。","quizId":"U-03-X02"},"textbook":[{"heading":"装置を接続する規格","body":"PCI Expressは内部機器の高速シリアル接続、USBは周辺機器の汎用接続、SATAは記憶装置の接続規格です。シリアル転送は信号線で順次送る方式、パラレル転送は複数ビットを並行して送る方式です。規格ごとに最大帯域や接続の条件が異なります。"},{"heading":"転送量を求める","body":"32ビットを毎回転送し毎秒5000万回なら32×5000万＝16億bit/s。8で割ると2億バイト/秒＝200MB/s（十進）。制御情報や符号化、待ち時間で実際のデータ量は減ります。周波数と毎秒転送回数は方式によって一致しないため問題の条件に従います。"},{"heading":"入出力の役割","body":"キーボード、タッチパネル、画像センサなどは情報を入力し、ディスプレイやプリンタは人に出力します。OCR（光学式文字認識）は画像中の文字を認識してテキストにする技術です。GPU（画像処理装置）は並列計算に利用されます。機器の特性を用途に合わせて選びます。"}]}],"beginnerIntro":"CPU・メモリ・入出力装置がどう協力するかを学ぶ。速度計算では秒、Hz、ビットとバイトをそろえる。"},{"id":4,"title":"システム構成・性能評価","group":"テクノロジ","priority":"A重要","summary":"可用性、冗長構成、稼働率、処理能力・信頼性を定量評価。","lessons":[{"title":"性能の3指標","body":"スループットは単位時間の処理件数、レスポンスタイムは要求から応答まで、ターンアラウンドタイムは投入から完了まで。ボトルネックは最も制約の強い資源。","check":"それぞれの時間の始点と終点を図にする。"},{"title":"可用性の算出","body":"稼働率A=MTBF/(MTBF+MTTR)。MTBF（Mean Time Between Failures：平均故障間隔）が大きくMTTR（Mean Time To Repair：平均修復時間）が小さいほど高い。","check":"MTBFと平均故障時間を混同しない。"},{"title":"直列と並列の冗長化","body":"独立した機器の直列システムは全台稼働が必要なので稼働率の積。並列冗長でどれか1台動けばよい場合は1−故障率の積。","check":"冗長化は故障が独立という前提に依存。"},{"title":"システム構成","body":"負荷分散は複数装置に仕事を分配し、フェイルオーバーは故障時に待機側へ切り替える。ホットスタンバイは迅速に切り替えやすいが費用がかかる。","check":"負荷分散と冗長化は関連するが同じではない。"},{"title":"容量計画","body":"最大負荷に余裕を持たせたサイジングを行い、実測値で予測を修正する。CPU使用率が高まると待ち時間が非線形に増える場合がある。","check":"ピーク時と平均時の両方を試算。"}],"terms":[{"term":"スループット","definition":"単位時間に処理できる仕事量"},{"term":"レスポンスタイム","definition":"要求を出してから応答が得られるまでの時間"},{"term":"ターンアラウンドタイム","definition":"処理依頼から結果全体が完了するまでの時間"},{"term":"MTBF","definition":"修理可能な装置の故障と故障の間の平均動作時間"},{"term":"MTTR","definition":"故障後の修理に要する平均時間"},{"term":"可用性","definition":"必要なときにシステムが利用できる度合い"},{"term":"フェイルオーバー","definition":"障害発生時に待機系へ自動・手動で切り替えること"},{"term":"ロードバランサ","definition":"複数のサーバーに処理負荷を振り分ける装置・機能"},{"term":"ホットスタンバイ","definition":"待機系を稼働状態で準備し迅速に切り替える構成"},{"term":"スケールアウト","definition":"サーバーなどの台数を増やして能力を拡張する方法"}],"questions":[{"id":"Q04-01","chapter":4,"kind":"applied","q":"MTBF=990時間、MTTR=10時間の稼働率は。","options":["90%","95%","99%","99.9%"],"correct":2,"explain":"990/(990+10)=0.99。"},{"id":"Q04-02","chapter":4,"kind":"applied","q":"独立して稼働率0.9の装置2台を並列にし1台動けばよい場合の稼働率は。","options":["0.81","0.90","0.95","0.99"],"correct":3,"explain":"両方停止する確率0.1×0.1=0.01を1から引く。"},{"id":"Q04-03","chapter":4,"kind":"applied","q":"応答時間は変わらず1秒間の処理完了数が増えたとき改善した指標は。","options":["稼働率","スループット","故障率","平均修復時間"],"correct":1,"explain":"単位時間の処理件数はスループット。"},{"id":"D04-01","chapter":4,"kind":"applied","q":"並列化できる部分が80%、4台並列で追加コストを無視した理論的な速度向上比はどれか。","options":["1.25倍","2.5倍","3.2倍","4倍"],"correct":1,"explain":"Amdahlの法則1/(0.2＋0.8/4)=2.5倍。直列部分が高速化を制限する。"},{"id":"D04-02","chapter":4,"kind":"applied","q":"故障が独立で、装置Aの稼働率0.90、Bの稼働率0.80の並列冗長構成の稼働率はどれか。","options":["0.72","0.80","0.90","0.98"],"correct":3,"explain":"どちらかが稼働すればよいので1−(1−0.9)(1−0.8)=0.98。"},{"id":"D04-03","chapter":4,"kind":"applied","q":"RPOが15分、RTOが2時間のシステムで目標としているものはどれか。","options":["最大2時間前のデータに戻し15分以内に復旧","最大15分前のデータに戻し2時間以内に復旧","必ずデータ損失ゼロで2時間以内に復旧","停止が2時間以内ならデータ損失は任意"],"correct":1,"explain":"RPOは目標復旧時点（許容するデータ損失の時間幅）、RTOは目標復旧時間。"},{"id":"Q-04-X01","chapter":4,"kind":"applied","q":"サーバを追加するのではなく既存機のメモリを増やすことは？","options":["スケールアウト","スケールアップ","フェイルオーバー","バックアップ"],"correct":1,"explain":"スケールアップ。"},{"id":"U-04-1","chapter":4,"kind":"applied","q":"単位時間当たりの処理完了件数は？","options":["レスポンスタイム","MTTR","スループット","稼働率"],"correct":2,"explain":"スループットは処理件数/時間、応答時間は一要求の所要時間。"},{"id":"U-04-2","chapter":4,"kind":"applied","q":"直列部分25%の処理を無限に並列化した場合の理論最大高速化率は？","options":["25倍","0.25倍","無限倍","4倍"],"correct":3,"explain":"残る時間比0.25の逆数は4。"},{"id":"U-04-3","chapter":4,"kind":"applied","q":"独立で稼働率0.8の2台が両方必要なシステムの稼働率は？","options":["0.64","0.96","0.8","0.4"],"correct":0,"explain":"直列は両方正常なので0.8×0.8。0.96は並列。"},{"id":"U-04-4","chapter":4,"kind":"applied","q":"復元40分、ログ適用15分、確認10分を順次実施。RTO60分は達成できるか？","options":["達成（40分）","未達（65分）","達成（55分）","達成（15分）"],"correct":1,"explain":"作業時間を合計すると65分で目標を超える。"},{"id":"U-04-X01","chapter":4,"kind":"applied","q":"複数の仮想マシンを実行・管理する基盤は？","options":["コンパイラ","デバッガ","ハイパーバイザ","ロードバランサ"],"correct":2,"explain":"ハイパーバイザは物理資源を仮想機へ割り当てる。"}],"deepIntro":"システム性能は「処理能力」「待ち」「壊れたときの振る舞い」を分けて評価する。","deep":[{"id":"04-1","title":"性能指標とボトルネック","explain":"\u003cp>応答時間は要求から結果を受け取るまでの時間、スループットは単位時間の処理件数、ターンアラウンドタイムは投入から完了までの時間。利用率が上がれば処理能力が上がったように見えるが、待ち行列による応答時間悪化がある。ボトルネックはCPU、メモリ、ディスク、ネットワーク、ロック、外部APIなど複数候補を測って特定する。\u003c/p>\n\u003cp>ベンチマークでは同じ負荷条件、データ量、測定時間、ウォームアップ条件を揃える。ピーク性能だけでなくp95（95パーセンタイル）応答時間を見れば「大多数は速いが一部は極端に遅い」状態も見つかる。\u003c/p>\n","worked":"\u003cp>毎秒100件到着し、平均滞在時間が0.2秒の定常システムなら、リトルの法則L＝λW＝100×0.2＝平均20件が処理中または待機中。CPUが20個という意味ではない。\u003c/p>\n","prompt":"CPU使用率30%なのに応答時間が長い場合、CPU増設だけで改善するか。","answer":"\u003cp>断定できない。I/O待ち、ロック、下流システムの遅延を調べる。\u003c/p>\n","beginner":{"scenario":"受付100件/秒、決済30件/秒、発送80件/秒の直列工程は最大30件/秒。受付を増強しても全体の能力は改善しない。","trap":"応答時間の短さとスループットの高さは別。","quizId":"U-04-1"},"textbook":[{"heading":"性能指標を分けて考える","body":"レストランで一人が入店から料理を受け取る時間と、1時間に提供できる料理数は別です。レスポンスタイムは要求から応答まで、ターンアラウンドタイムは処理依頼から全処理完了まで、スループットは単位時間に完了する件数です。バッチ処理はまとめて処理し、オンライン処理は個別要求に応答します。"},{"heading":"ボトルネックを探す","body":"受付毎秒100件、処理毎秒40件、保存毎秒80件なら、直列の全体能力は毎秒40件です。受付を200件にしても改善しません。各工程の利用率や待ち時間、CPU・メモリ・ディスク・ネットワークの測定から制約を探します。"},{"heading":"測定条件を確認する","body":"ベンチマークは一定の負荷条件で性能を測ることです。平均応答時間だけでは遅い一部の要求を見落とすため、95パーセンタイルなどの指標も使います。負荷試験では想定利用者数や要求パターンを再現し、性能が不足する箇所を確認します。"}]},{"id":"04-2","title":"直列・並列・Amdahlの法則","explain":"\u003cp>並列化できる割合p、プロセッサ数n、並列化以外の追加コストを無視すると、速度向上比はS(n)=1/[(1−p)+p/n]。直列部分(1−p)が並列化による改善を制限する（Amdahlの法則）。スケールアップは単体装置の増強、スケールアウトは装置の台数増。分散システムでは通信コスト・同期・障害処理があるので理論式は上限の目安である。\u003c/p>\n","worked":"\u003cp>80%が並列化可能で4台使うならS=1/(0.2+0.8/4)=2.5倍。100台にしても極限は1/0.2=5倍。80%×4=3.2倍と単純計算しない。\u003c/p>\n","prompt":"並列可能率が50%の場合、台数を無限に増やした理論上限は。","answer":"\u003cp>2倍。\u003c/p>\n","beginner":{"scenario":"10秒の処理のうち直列2秒、並列8秒。4台なら2＋8/4＝4秒、速度向上10/4＝2.5倍。","trap":"台数を増やしても直列部分は残る。","quizId":"U-04-2"},"textbook":[{"heading":"並列化できる仕事とできない仕事","body":"料理を4人で作ってもオーブンが一つで順にしか焼けなければ、焼く時間は減りません。プログラムでもデータ依存や順次処理のため並列化できない部分があります。元の処理時間を1、並列化できる割合をp、並列数をNとすると新しい処理時間比は(1−p)＋p/Nです。"},{"heading":"高速化率の計算","body":"元の処理10秒のうち8秒を4台に均等分割すると、並列部分2秒＋直列部分2秒＝4秒。高速化率は10/4＝2.5倍。一般式はS=1/((1−p)＋p/N)です。無限に台数を増やしても直列部分が残るので、最大値は1/(1−p)です。"},{"heading":"現実との差","body":"通信、同期、分割の偏り、資源競合には時間がかかります。Amdahlの法則は問題の規模を一定にして理想的な並列化を考えるモデルなので、現実の速度を保証しません。台数を増やすより直列部分そのものを改善する方が有効な場合があります。"}]},{"id":"04-3","title":"可用性・直列並列冗長化・信頼性","explain":"\u003cp>稼働率Aは利用可能時間/全時間の割合。平均故障間隔MTBF（Mean Time Between Failures）と平均修復時間MTTR（Mean Time To Repair）を用いる単純モデルではA＝MTBF/(MTBF+MTTR)。部品が独立して故障するなら、全て必要な直列構成はA全体＝A₁×A₂、いずれか稼働すれば動く並列冗長構成はA全体＝1−(1−A₁)(1−A₂)。共通原因故障があると独立の仮定は崩れる。\u003c/p>\n\u003cp>フェイルオーバーは障害発生時に待機系へ切り替えること。ホットスタンバイは待機系を動作状態に近く保ち、切替時間を短くできる。負荷分散装置が単一障害点にならないよう設計する。\u003c/p>\n","worked":"\u003cp>独立した装置A=0.9、B=0.8の並列稼働率は1−0.1×0.2=0.98。直列なら0.9×0.8＝0.72。「並列＝掛け算」と誤らない。\u003c/p>\n","prompt":"99.9%稼働率なら年間停止許容時間は約何時間か。","answer":"\u003cp>365×24×0.001＝8.76時間（単純計算）。\u003c/p>\n","beginner":{"scenario":"平均90時間稼働し10時間修復する機器の稼働率は90/(90＋10)＝0.9。独立な2台のどちらかが動けば0.99。","trap":"共通電源の故障などで独立性が成り立たない場合がある。","quizId":"U-04-3","lab":{"title":"直列・並列が混ざるシステム","problem":"ルータ稼働率0.99、その先のWebサーバ2台は各0.9で少なくとも1台必要。DB稼働率0.98。独立故障を仮定。全体稼働率は？","steps":["Web群は両方停止が0.1×0.1＝0.01なので稼働率0.99。","ルータ、Web群、DBのすべてが稼働する必要があるため直列。","0.99×0.99×0.98＝0.960498。","約96.05%。サーバ群だけ冗長化しても他の単一障害点が残る。"],"answer":"約96.05%","check":"並列部分を一つの装置として先に計算し、直列部分と掛け合わせる。"}},"textbook":[{"heading":"故障と修復を時間で考える","body":"機器は正常稼働と停止・修復を繰り返します。MTBF（平均故障間隔）は修理可能な機器の平均稼働時間の指標、MTTR（平均修復時間）は復旧までの平均時間です。定常的な基本モデルの稼働率はMTBF/(MTBF＋MTTR)。故障を減らすか修復を速くすると稼働率が上がります。"},{"heading":"直列・並列の違い","body":"二つとも正常でないと動かない直列構成では独立なら稼働率A×B。どちらか動けばよい並列構成では両方停止する確率(1−A)(1−B)を1から引きます。稼働率0.9の2台なら直列0.81、並列0.99です。"},{"heading":"冗長化の設計","body":"ホットスタンバイは待機系を稼働状態に近く保ち、コールドスタンバイは必要時に起動します。フェイルオーバーは故障時の切替、フェイルバックは復旧後の戻しです。共通の電源やネットワークが単一障害点なら独立故障の計算は成立しません。切替時間・失敗の可能性も評価します。"}]},{"id":"04-4","title":"バックアップ・復旧目標・容量設計","explain":"\u003cp>RTO（Recovery Time Objective：目標復旧時間）は事故から業務を再開するまでの目標時間。RPO（Recovery Point Objective：目標復旧時点）は何分・何時間前までのデータ損失を許容するかを示す。例：RTO=2時間、RPO=15分なら、2時間以内の再開と最大15分前までへのデータ復旧を設計する。RPOを短くするには同期・非同期レプリケーションやログ転送、RTOを短くするには待機環境や復旧手順の自動化が効く。\u003c/p>\n\u003cp>容量計画は平均負荷だけでなくピーク、成長率、冗長化時の片系運転、バックアップ容量を考える。バックアップは復旧訓練で実際に読めるかを確かめる。障害対応の「稼働率」と「データ損失量」は別の軸である。\u003c/p>\n","worked":"\u003cp>1日10GB増えるDBを60日保持し、日次差分と週次フルを併用する場合、必要容量は単純な10×60だけでは求められない。フルの時点・変更量・圧縮・世代数を明示して合計する。\u003c/p>\n","prompt":"RTOを1時間から15分に改善したらRPOも改善するか。","answer":"\u003cp>別指標なので必ずしも改善しない。\u003c/p>\n","beginner":{"scenario":"12時に障害、最終保全11時50分、復旧12時40分なら失う更新は最大10分、復旧時間40分。","trap":"RPOは許容するデータ損失時間、RTOは許容復旧時間。","quizId":"U-04-4"},"textbook":[{"heading":"障害から何を取り戻すか","body":"RTO（Recovery Time Objective：復旧時間目標）は停止から何時間以内に戻すか、RPO（Recovery Point Objective：復旧時点目標）はどの時点までのデータを回復するかです。1日1回のバックアップだけなら最悪約1日分の変更を失う可能性があります。ログを頻繁に保全すればRPOを短くできる場合があります。"},{"heading":"バックアップの方式","body":"フルは全データ、差分は直近フル以降の変更、増分は直近バックアップ以降の変更を保存します。差分復元はフルと最新差分、増分復元はフルと必要なすべての増分が基本です。取得時間・容量・復元時間が異なります。"},{"heading":"容量と事業継続","body":"毎日20GB増え30日保持するなら変更量だけで600GBを見込み、圧縮率、冗長化、世代数、増加傾向を追加します。遠隔地への保全、アクセス権分離、復元試験も必要です。BCP（事業継続計画）は災害などで重要業務を継続・復旧する計画で、ITの復旧はその一部です。"}]},{"id":"04-X01","title":"システム方式・分散処理・仮想化","explain":"\u003cp>集中処理は一つの計算機に処理を集め、クライアントサーバ方式は要求側と提供側に分ける。シンクライアントは端末の処理・保存機能を抑え、サーバ側に集約する。クラスタは複数の計算機を協調させ、負荷分散や可用性向上を狙う。デュアルシステムは結果の照合など、デュプレックスシステムは主系と待機系の切替などを利用する。\u003c/p>\u003cp>ハイパーバイザは仮想マシンを実行し、コンテナは一般にホストOSのカーネルを共有する。スケールアップは一台の能力向上、スケールアウトは台数追加。RASISは信頼性・可用性・保守性・完全性・安全性を示す。ベンチマークで性能を測り、TCO（総保有費用）では導入から運用・廃棄までの費用を考える。\u003c/p>","worked":"\u003cp>アクセス急増に対し同一Webサーバを3台から5台に増やし負荷分散するのはスケールアウト。DBが限界ならWebサーバ増加だけでは改善しない。\u003c/p>","prompt":"サーバを追加するのではなく既存機のメモリを増やすことは？","answer":"\u003cp>スケールアップ。\u003c/p>","beginner":{"scenario":"Web画面は端末、業務処理はサーバ、データはDBサーバに分担できる。Webの負荷が増えればサーバを追加して振り分ける。","trap":"同一物理機上の仮想機は物理機の共通故障に弱い。","quizId":"U-04-X01"},"textbook":[{"heading":"機能をどこに置くか","body":"集中処理は中心計算機へ処理を集めます。クライアントサーバ方式は利用側と提供側を分離し、3層構成では表示・業務処理・データ管理を分けます。シンクライアントは端末の処理・保存を抑え、中心側で管理する方式です。分散処理は複数機器へ仕事を分けます。"},{"heading":"可用性と性能のための構成","body":"クラスタは複数計算機の協調で性能や可用性を向上させます。ロードバランサは要求を複数サーバへ分配。スケールアップは一台を強化、スケールアウトは台数追加です。デュアルシステムは同じ処理の結果照合など、デュプレックスは主系・待機系の切替などを利用します。"},{"heading":"仮想化と費用","body":"ハイパーバイザは物理機上で複数の仮想マシンを動かし、それぞれに資源を割り当てます。コンテナは一般にOSのカーネルを共有し実行環境を分離します。仮想化しても物理故障は共通になり得ます。TCO（総保有費用）は購入・導入・運用・保守・廃棄の費用を合計します。RASISは信頼性・可用性・保守性・完全性・安全性の評価観点です。"}]}],"beginnerIntro":"複数機器でサービスを実現する構成を学ぶ。処理能力、可用性、復旧時間を区別して全体を図にする。"},{"id":5,"title":"オペレーティングシステム・ソフトウェア","group":"テクノロジ","priority":"A重要","summary":"プロセス、スレッド、排他制御、仮想記憶、ファイルシステム、OSS。","lessons":[{"title":"プロセスとスレッド","body":"プロセスは実行中のプログラムの資源単位。スレッドは同一プロセスでメモリ空間などを共有する実行単位で、共有状態に競合が起きる。","check":"スレッド間共有とプロセス間分離を区別。"},{"title":"排他制御とデッドロック","body":"排他制御は共有資源を同時に不整合な形で変更しないための仕組み。デッドロックは互いに資源の解放を待ち永久に進まない状態。資源獲得順序の統一が予防に有効。","check":"ロックの取得順序を具体例で追う。"},{"title":"スケジューリング","body":"ラウンドロビンは一定のタイムスライスごとにCPU利用を交代する。優先度方式では低優先度タスクの飢餓に注意。","check":"応答性とスループットはトレードオフ。"},{"title":"仮想記憶","body":"ページ単位に主記憶と補助記憶を入れ替える。ページフォールトは必要ページが主記憶にない状態。頻発するとスラッシングで性能が大きく下がる。","check":"ページングは容量拡張のため、キャッシュは速度改善のためという違いも押さえる。"},{"title":"OSSとライセンス","body":"OSS（Open Source Software：オープンソースソフトウェア）はライセンスに基づき利用・改変・再配布ができる。GPLは条件次第で派生作品のソース公開義務が生じる一方、MITは比較的緩やかなライセンス。","check":"OSSだから著作権がないわけではない。"}],"terms":[{"term":"プロセス","definition":"実行中プログラムの資源管理単位"},{"term":"スレッド","definition":"同一プロセス内で動く軽量な実行単位"},{"term":"セマフォ","definition":"共有資源にアクセスできる数を制御する同期手段"},{"term":"ミューテックス","definition":"相互排他のためのロック"},{"term":"デッドロック","definition":"複数処理が互いの資源解放を待ち停止する状態"},{"term":"ラウンドロビン","definition":"一定時間ごとに実行中タスクを切り替える方式"},{"term":"ページフォールト","definition":"必要な仮想記憶ページが主記憶上にない事象"},{"term":"スラッシング","definition":"ページの入替えが多発して処理性能が著しく落ちる状態"},{"term":"GPL","definition":"改変や再配布に一定のソース提供等の条件を付す自由ソフトウェアライセンス"},{"term":"ミドルウェア","definition":"OSとアプリケーションの間で共通機能を提供するソフトウェア"}],"questions":[{"id":"Q05-01","chapter":5,"kind":"applied","q":"デッドロックを予防する方法として適切なのは。","options":["資源取得順を全処理で統一する","ロック時間を無制限に延ばす","全処理の優先度を同じにする","スレッドを増やす"],"correct":0,"explain":"循環待ちが起こらない順序を定義する。"},{"id":"Q05-02","chapter":5,"kind":"applied","q":"ページフォールトが頻発しディスク交換ばかり行う現象は。","options":["キャッシュヒット","スラッシング","スプーリング","ポーリング"],"correct":1,"explain":"ページングが過度に発生すると処理が進まなくなる。"},{"id":"Q05-03","chapter":5,"kind":"applied","q":"スレッドに関して正しいのは。","options":["常に別の主記憶空間を持つ","同一プロセスで資源を共有し得る","スレッド間では競合しない","独立した実行単位ではない"],"correct":1,"explain":"同一プロセスのスレッドは共有メモリの競合に注意。"},{"id":"D05-01","chapter":5,"kind":"applied","q":"タスクAがXロックを保持してYを待ち、BがYを保持してXを待つときの問題はどれか。","options":["スラッシング","デッドロック","ページフォールト","キャッシュミス"],"correct":1,"explain":"循環待ちが形成され互いに進めない。ロック獲得順を統一するなどで防止する。"},{"id":"D05-02","chapter":5,"kind":"applied","q":"ページ枠が3つあり、参照列1,2,3,1,4をLRU方式で処理するとき、4の到着時に追い出すページはどれか。","options":["1","2","3","4"],"correct":1,"explain":"1を再参照したため最も長く参照されていないのは2。FIFO方式なら1を追い出す。"},{"id":"D05-03","chapter":5,"kind":"applied","q":"スレッドとプロセスの説明として適切なものはどれか。","options":["異なるプロセスは常に同じ仮想アドレス空間を共有する","同一プロセスのスレッドは通常アドレス空間を共有する","スレッドはCPU資源を消費しない","プロセス間通信は不要である"],"correct":1,"explain":"同一プロセス内のスレッドは通常アドレス空間を共有し、共有変数の競合に注意する。"},{"id":"Q-05-X01","chapter":5,"kind":"applied","q":"ブレークポイントでプログラムを止めて変数を調べるツールは？","options":["リンカ","デバッガ","ローダ","スプーラ"],"correct":1,"explain":"デバッガ。"},{"id":"U-05-1","chapter":5,"kind":"applied","q":"一定時間ずつ順番にCPUを割り当てる方式は？","options":["最短経路法","LRU","ライトバック","ラウンドロビン"],"correct":3,"explain":"タイムスライスごとに実行を切り替える方式。"},{"id":"U-05-2","chapter":5,"kind":"applied","q":"AはX保持でY待ち、BはY保持でX待ち。現象は？","options":["デッドロック","スラッシング","ページフォールト","オーバーフロー"],"correct":0,"explain":"互いに相手の資源解放を待ち進行不能になる。"},{"id":"U-05-3","chapter":5,"kind":"applied","q":"最も以前に読み込んだページを追い出す方式は？","options":["LRU","FIFO","ラウンドロビン","二分探索"],"correct":1,"explain":"FIFOは読込順、LRUは最後の参照時刻で決める。"},{"id":"U-05-4","chapter":5,"kind":"applied","q":"目的コードの外部参照を解決して結合するツールは？","options":["エディタ","デバッガ","リンカ","シェル"],"correct":2,"explain":"リンカは目的コードやライブラリを結合する。"},{"id":"U-05-X01","chapter":5,"kind":"applied","q":"ファイルシステム変更の記録を障害回復に利用する機能は？","options":["スプーリング","コンパイル","スケジューリング","ジャーナリング"],"correct":3,"explain":"変更の記録から整合性回復を支援する。スプーリングは入出力要求の蓄積。"}],"deepIntro":"OSはアプリとハードウェアの間で、CPU・メモリ・ファイル・入出力資源を安全に分配する。","deep":[{"id":"05-1","title":"プロセス・スレッド・スケジューリング","explain":"\u003cp>プロセスは実行中プログラムの独立した資源管理単位で、仮想メモリ空間などを持つ。スレッドはプロセス内の実行単位で、アドレス空間を共有するため通信しやすい反面、共有データの競合が起きる。コンテキストスイッチは実行状態を保存・復元する切替で、時間を消費する。\u003c/p>\n\u003cp>CPUスケジューリングは先着順（FCFS）、短いジョブ優先、ラウンドロビン、優先度方式など。ラウンドロビンは各タスクにタイムクォンタムを割り当て、応答性と切替オーバーヘッドのバランスを取る。高優先度に待たされ続ける低優先度タスクは飢餓状態（starvation）になる。\u003c/p>\n","worked":"\u003cp>到着時刻が同じでCPU時間が2,5,3のタスクをFCFSで2→5→3の順に処理すると完了時刻は2,7,10、平均待ち時間は(0+2+7)/3=3。処理時間を待ち時間に含めない。\u003c/p>\n","prompt":"スレッドを増やすとCPUバウンド処理が必ず速くなるか。","answer":"\u003cp>CPUコア数、同期、実行環境、切替負荷で制約される。\u003c/p>\n","beginner":{"scenario":"1台のCPUでAとBを交互に短時間実行すると同時に動くように見える。Aが入出力を待つ間にBを動かせばCPUを活用できる。","trap":"実行可能はCPU待ち、待ち状態は入出力・イベント待ち。","quizId":"U-05-1"},"textbook":[{"heading":"OSがないと何が困るか","body":"複数アプリが直接CPUやメモリ、画面、ディスクを使えば互いの処理を邪魔する可能性があります。OS（Operating System：基本ソフトウェア）は資源の割当てと保護、ファイル管理、入出力などを共通提供します。プロセスは実行中のプログラムの管理単位、スレッドはその内部の実行の流れです。同一プロセスのスレッドは通常アドレス空間を共有します。"},{"heading":"状態の移り変わり","body":"実行可能状態はCPUの割当てを待つ状態、実行状態はCPU上で動作中、待ち状態は入出力やイベントの完了を待つ状態です。実行中に入出力を要求すると待ち状態へ、完了通知で実行可能状態へ、スケジューラの割当てで実行へ移ります。"},{"heading":"スケジューリングの比較","body":"先着順は到着順で単純ですが長い処理が後続を待たせます。ラウンドロビンは短い時間ずつ交代し応答性を確保します。優先度方式は重要な処理を先に実行しますが、低優先度が長く待つ飢餓状態に注意します。プリエンプションはOSが実行中の処理を中断し別処理へ切り替えることです。"}]},{"id":"05-2","title":"排他制御・デッドロック・同期","explain":"\u003cp>共有変数への読み書きが同時に行われ結果が実行順に依存する競合状態（race condition）には、ロック、セマフォ、メッセージパッシング、原子的操作などで対応する。ミューテックスは共有資源に1主体ずつアクセスするための排他、セマフォは許可数をカウントする同期機構。クリティカルセクションは排他的に実行すべき区間を指す。\u003c/p>\n\u003cp>デッドロックは互いが保持資源を解放せず、相手の資源を待ち続ける状態。典型的な成立条件は相互排除・保持と待機・横取り不可・循環待ち。全てのロックを一定順に獲得する設計で循環待ちを防げる。ライブロックは互いに動いているのに仕事が進まない状態。\u003c/p>\n","worked":"\u003cp>タスクAがロックXを取得後Yを待ち、タスクBがYを取得後Xを待てばデッドロックの可能性がある。両方が必ずX→Yの順で取る規約なら循環待ちを減らせる。\u003c/p>\n","prompt":"`x=x+1`は常に原子的か。","answer":"\u003cp>保証されない。読み取り・加算・書込みに分かれ得るため、環境に応じて同期が必要。\u003c/p>\n","beginner":{"scenario":"残高100をAが30、Bが20減らす。両者が先に100を読むとAが70、Bが80を書き、正しい50にならない。読取から書込まで保護する。","trap":"ロックは取得順序や保持時間を考える。増やせばよいわけではない。","quizId":"U-05-2"},"textbook":[{"heading":"なぜ排他制御が必要か","body":"共有変数の更新は読取り・計算・書込みの複数段階になることがあります。二つの処理が同じ古い値を読んで別々に書くと変更が失われます。クリティカルセクション（排他区間）を一度に一処理だけが実行できるようにします。ミューテックスは排他ロック、セマフォは利用可能な資源数などを管理する仕組みです。"},{"heading":"デッドロックが起こる条件","body":"資源を排他的に使い、保持したまま別資源を待ち、強制的に奪えず、循環待ちがあるとデッドロックが成立し得ます。例えばAが鍵Xを持ちYを待ち、BがYを持ちXを待つ場合です。全処理で資源の取得順を統一するなど循環待ちを防ぎます。"},{"heading":"同期と性能","body":"処理間の順序を調整する同期と、同時アクセスを防ぐ排他は関連しますが目的が異なります。ロックを長く持つと待ち時間が増え、優先度逆転が起きることもあります。保持範囲を必要最小限にし、例外時にも解放される設計にします。"}]},{"id":"05-3","title":"仮想記憶・ページ置換・ファイル","explain":"\u003cp>仮想記憶はページ単位で主記憶に割り当て、アクセス先ページが主記憶にないとページフォールトが発生する。FIFO（先入れ先出し）ページ置換は古いページを追い出す。LRU（Least Recently Used：最近最も使用されていない）方式は直近の参照履歴を使う。局所性の高いアクセスではキャッシュ効果が得られる。スラッシングは必要なページ入替えが頻発し、実際の計算が進まない現象。\u003c/p>\n\u003cp>ファイルシステムはディレクトリ、権限、メタデータ、空き領域を管理する。ジャーナリングはファイルシステムの更新操作の記録を保持し、障害後の整合性回復を助けるが、ユーザーデータの完全な保護を意味しない。\u003c/p>\n","worked":"\u003cp>ページ枠3つ、参照列1,2,3,1,4の場合、LRUでは最初の1,2,3で枠が埋まり、再参照1で最近使用が更新される。4が来たら最も古い2を置換する。FIFOなら最初に入った1を置換する。\u003c/p>\n","prompt":"仮想記憶を使う目的は単にHDDをRAMとして追加することか。","answer":"\u003cp>それだけではない。プロセスの独立したアドレス空間、保護、効率的なメモリ割当ても重要。\u003c/p>\n","beginner":{"scenario":"メモリをページという一定サイズに分け、必要なページを読み込む。A→B→Aと参照した場合、LRUで次に追い出すのはB。","trap":"スラッシングはページ入替えが頻発し処理が進まない状態。","quizId":"U-05-3","lab":{"title":"ページ置換を手で追う","problem":"ページ枠3個、初期空。参照列A,B,C,A,D,BをLRUで処理する。ページフォールト回数を求める。","steps":["A,B,Cを順に読み込み、3回フォールト。枠は[A,B,C]。","次のAはヒット。最終参照が最も古いのはBになる。","D参照でBを追い出してDを読み込む。4回目。枠[A,D,C]。","B参照で最終参照が最も古いCを追い出す。5回目。"],"answer":"5回","check":"LRUは最終使用時刻を更新する。ヒットしたページも順序が変わる。"}},"textbook":[{"heading":"仮想記憶を図として考える","body":"各プロセスは自分専用に見える仮想アドレス空間を持ちます。ページ単位で物理メモリに割り当て、ページ表で対応付けます。必要なページが現在使える状態にないとページフォールトが起き、OSが割当てや読込みを行います。"},{"heading":"ページ置換の違い","body":"空き枠がなければ置換対象を選びます。FIFO（先入れ先出し）は最初に読み込んだページ、LRU（最近最少使用）は最終参照が最も古いページ、LFU（最少頻度使用）は利用回数が少ないページを選ぶ考え方です。参照列と枠の状態を1回ずつ表に書けばフォールト数を計算できます。"},{"heading":"ファイル管理","body":"ファイルは名前を持つ永続データ、ディレクトリはファイルを階層的に整理する構造です。絶対パスはルートから、相対パスは現在位置からの指定です。アクセス権は読取り・書込み・実行等を管理します。ジャーナリングは変更記録で障害回復を支援します。仮想記憶は実行中のアドレス管理、ファイルは永続データ管理です。"}]},{"id":"05-4","title":"システムソフトウェア・言語処理・ライセンス","explain":"\u003cp>コンパイラはソースコードを解析して機械語などへ変換する。字句解析でトークンを抽出し、構文解析で文法構造を作り、意味解析で型・宣言の整合性を調べ、最適化やコード生成を行う。インタプリタは実行時に命令を逐次解釈する方式の総称だが、仮想機械・JIT（Just In Time：実行時コンパイル）などを組み合わせる実装もある。\u003c/p>\n\u003cp>OSS（Open Source Software：オープンソースソフトウェア）は利用許諾条件に従って使用・改変・再配布する。ソース開示などの条件はライセンスごとに違い、無条件で自由に使えるわけではない。パッケージ管理では依存バージョン固定・脆弱性確認・来歴の検証が重要。\u003c/p>\n","worked":"\u003cp>型が不一致な関数呼出しを静的に検出するのは意味解析の仕事。「括弧が閉じていない」は構文解析の問題。\u003c/p>\n","prompt":"コンパイルを通過すれば仕様どおり動くか。","answer":"\u003cp>保証されない。実行時例外、論理バグ、性能やセキュリティの問題が残る。\u003c/p>\n","beginner":{"scenario":"Cのソースをコンパイルして目的コードを作り、ライブラリ等とリンクして実行形式を得る。ローダが実行時にメモリへ読み込む。","trap":"OSSでも著作権があり、ライセンス条件を守る。","quizId":"U-05-4"},"textbook":[{"heading":"実行までの道筋","body":"人が書いたソースコードはコンパイルで目的コード等になり、リンカがライブラリと結合し、ローダが実行に必要な内容をメモリへ配置します。インタプリタは解釈しながら実行する方式です。デバッガではブレークポイントで実行を止め、変数の値や呼出しの順序を確認します。"},{"heading":"共通ソフトウェア","body":"ミドルウェアはOSと業務アプリの間の共通機能で、データベース管理、メッセージ交換、アプリケーション実行基盤などを提供します。API（アプリケーションプログラミングインタフェース）は機能の呼出し方法を定めます。シェルはコマンドを解釈してOS機能を利用するインタフェースです。"},{"heading":"ライセンスの考え方","body":"OSS（オープンソースソフトウェア）はソース利用・改変・再配布などをライセンス条件で認めるソフトウェアです。無条件で著作権が消えるわけではありません。GPLなどでは配布形態に応じソース提供等の義務が生じ得ます。許諾条件、著作権表示、他ライセンスとの互換性を確認します。"}]},{"id":"05-X01","title":"ミドルウェア・ファイル・開発環境","explain":"\u003cp>ミドルウェアはOSとアプリの間で共通機能を提供する。DBMSはデータ管理、アプリケーションサーバは業務処理実行、メッセージキューは非同期連携、TPモニタはトランザクション処理を支援する。API（アプリケーション間の接続仕様）は呼出し方法を定める。\u003c/p>\u003cp>ファイルシステムはディレクトリ、ファイル属性、アクセス権、領域割当てを管理する。ジャーナリングは変更の記録を使って障害回復を支援する。シェルはコマンド実行環境、デバッガは実行停止・変数確認、リンカは目的コードを結合、ローダは実行可能な形でメモリへ読み込む。OSS（オープンソースソフトウェア）でもライセンス遵守が必要。GPLは一定の再配布にソース提供等の条件がある。\u003c/p>","worked":"\u003cp>印刷要求を補助記憶に一時蓄積し順に出力するスプーリングで、CPUは印刷の完了を待たず次の処理ができる。\u003c/p>","prompt":"ブレークポイントでプログラムを止めて変数を調べるツールは？","answer":"\u003cp>デバッガ。\u003c/p>","beginner":{"scenario":"注文受付がメッセージキューに依頼を積み、発送処理が後から受け取る設計なら、発送の一時停止と注文受付を分離できる。","trap":"再配信・順序・消失への対策は別途必要。","quizId":"U-05-X01"},"textbook":[{"heading":"ミドルウェアを使う理由","body":"アプリが毎回データ保存、通信、ログ、実行環境を作り直すと重複が増えます。DBMS（データベース管理システム）は保存・検索・整合性、アプリケーションサーバは業務処理の実行基盤、メッセージキューは非同期の依頼受渡し、TPモニタは取引処理の管理を支援します。"},{"heading":"ファイルの内部管理","body":"ファイルシステムはデータの保存位置、名前、属性、アクセス権を管理します。連続領域への配置は順次読込みが効率的ですが拡張が難しい場合があり、分散配置には管理情報が必要です。ジャーナリングは変更を記録して障害時の整合性回復を支援します。"},{"heading":"開発・入出力支援","body":"エディタはソース編集、コンパイラは翻訳、デバッガは実行状態調査、ビルドツールは生成手順自動化、バージョン管理は変更履歴を管理します。スプーリングは印刷など低速機器への要求を補助記憶に一時保存して順に処理する仕組みです。ファイル管理・実行管理・開発支援は目的が異なります。"}]}],"beginnerIntro":"アプリを同時に動かす資源管理と共通ソフトウェアを学ぶ。プロセスの状態とロックを図にして考える。"},{"id":6,"title":"ハードウェア・組込み基礎","group":"テクノロジ","priority":"A標準","summary":"論理回路・半導体・センサ・割込み・組込み制御を理解。","lessons":[{"title":"論理回路","body":"AND/OR/NOTに加えてNANDとNORは任意の論理回路を構成可能。フリップフロップは1ビットの状態を保持する基本回路。","check":"組合せ回路と順序回路を区別。"},{"title":"マイコンとリアルタイム性","body":"組込み機器のマイコンはセンサ入力を読み、計算し、アクチュエータを制御する。リアルタイムシステムでは正しい計算結果だけでなく期限内の結果が必要。","check":"速さだけでなく締切保証が重要。"},{"title":"電源・通信・省電力","body":"割込みでイベントを処理し、不要なときは省電力状態へ遷移。低消費電力の設計では通信頻度やセンサ計測周期も検討する。","check":"電力とエネルギーは別単位。"},{"title":"故障安全の設計","body":"フェイルセーフは故障時に安全側へ倒す考え方。フォールトトレラントは一部故障しても機能継続できるようにする設計。","check":"安全性とサービス継続性の目的差。"}],"terms":[{"term":"フリップフロップ","definition":"1ビットの状態を保持する順序回路"},{"term":"NAND","definition":"ANDの結果を否定した論理演算"},{"term":"組込みシステム","definition":"機器の特定用途に組み込まれた制御用システム"},{"term":"リアルタイムOS","definition":"処理の応答期限を意識したOS"},{"term":"センサ","definition":"温度・位置などの物理量を信号として取得する素子"},{"term":"アクチュエータ","definition":"電気信号などを動作・力に変える装置"},{"term":"フェイルセーフ","definition":"故障した際に危険を避ける側へ状態を移す設計思想"},{"term":"フォールトトレラント","definition":"部分的な故障があっても機能を継続できる性質"},{"term":"ウォッチドッグタイマ","definition":"処理の異常停止を検出し再起動等を行う監視機構"}],"questions":[{"id":"Q06-01","chapter":6,"kind":"applied","q":"制御プログラムが正しくても期限を超過すると失敗になる特性は。","options":["可搬性","リアルタイム性","保守性","移植性"],"correct":1,"explain":"時間制約の遵守が機能の一部。"},{"id":"Q06-02","chapter":6,"kind":"applied","q":"故障時にエレベータを停止させて安全を確保する設計は。","options":["フェイルセーフ","ロードバランシング","多重化","スケールアップ"],"correct":0,"explain":"不具合時に安全側に遷移する。"},{"id":"Q06-03","chapter":6,"kind":"applied","q":"1ビットの状態記憶に使う回路は。","options":["加算器","デコーダ","フリップフロップ","マルチプレクサ"],"correct":2,"explain":"順序回路の代表。"},{"id":"D06-01","chapter":6,"kind":"applied","q":"8ビットADCで0～5Vを256段階に量子化する理想的な1段階の電圧幅に最も近い値はどれか。","options":["0.002V","0.020V","0.20V","0.50V"],"correct":1,"explain":"5/256≈0.0195V。分解能は量子化段数で決まるが実測精度は雑音等にも左右される。"},{"id":"D06-02","chapter":6,"kind":"applied","q":"周期20msで実行5msのタスクAと周期10msで実行3msのタスクBの合計CPU利用率はどれか。","options":["25%","30%","55%","80%"],"correct":2,"explain":"5/20＋3/10=0.25+0.30=0.55。これだけで期限を守ることを証明できるわけではない。"},{"id":"D06-03","chapter":6,"kind":"applied","q":"ハードリアルタイムシステムの特徴として最も適切なものはどれか。","options":["平均処理時間の短さだけを保証すればよい","一定の期限超過が重大な失敗になり得る","全タスクを必ず同時実行する","CPU周波数が高いことが定義である"],"correct":1,"explain":"重要なのは締切までの確実な応答。平均速度が速いだけでは保証できない。"},{"id":"Q-06-X01","chapter":6,"kind":"applied","q":"出荷後に論理回路を再構成できるデバイスは？","options":["ASIC","DRAM","FPGA","HDD"],"correct":2,"explain":"FPGA。"},{"id":"U-06-1","chapter":6,"kind":"applied","q":"現在入力に加え過去の状態に依存する回路は？","options":["順序回路","組合せ回路","整流回路","増幅回路"],"correct":0,"explain":"順序回路には記憶要素がある。"},{"id":"U-06-2","chapter":6,"kind":"applied","q":"2ms/10msと5ms/25msの2タスクのCPU利用率合計は？","options":["20%","40%","70%","7%"],"correct":1,"explain":"2/10＋5/25＝0.4。"},{"id":"U-06-3","chapter":6,"kind":"applied","q":"応答が途絶えた装置を監視し異常処理を促すタイマは？","options":["リトルの法則","パリティビット","ウォッチドッグタイマ","ロードバランサ"],"correct":2,"explain":"正常動作の通知が途絶えるとタイムアウトして異常処理を行う。"},{"id":"U-06-X01","chapter":6,"kind":"applied","q":"PWM周期20ms、ON時間5msのデューティ比は？","options":["5%","20%","75%","25%"],"correct":3,"explain":"ON時間÷周期＝5/20。"}],"deepIntro":"組込みは限られた電力・容量と、現実世界のタイミング制約の中で動くシステム。","deep":[{"id":"06-1","title":"ディジタル回路・半導体・制御","explain":"\u003cp>論理回路はAND/OR/NOTをトランジスタ等で実現する。組合せ回路は現在の入力だけで出力が決まり、順序回路はフリップフロップなどで過去の状態を保持する。加算器、デコーダ、マルチプレクサは組合せ回路の例。発振回路・クロックは同期処理の基準となる。\u003c/p>\n\u003cp>センサが温度や加速度などを測定し、ADC（Analog-to-Digital Converter：アナログ・ディジタル変換器）で離散値に変換する。アクチュエータは制御信号を物理的な動きに変える。フィードバック制御は出力を測って目標との差を補正し、外乱に対処する。\u003c/p>\n","worked":"\u003cp>8ビットADCで0～5Vを256段階に量子化する単純モデルでは1段階約5/256＝0.0195V。精度は量子化段数だけでなくノイズ、基準電圧にも左右される。\u003c/p>\n","prompt":"センサの生データを細かくサンプリングすれば必ず正しい物理量になるか。","answer":"\u003cp>ならない。校正、雑音、分解能、サンプリング周波数、エイリアシングを考える。\u003c/p>\n","beginner":{"scenario":"非常停止解除と安全扉閉鎖が両方確認されたときだけモータを許可する条件はANDで表せる。センサが入力、モータが出力。","trap":"論理条件だけでは故障時の安全性は保証できない。","quizId":"U-06-1"}},{"id":"06-2","title":"リアルタイムOS・スケジューリング","explain":"\u003cp>リアルタイム性は「処理速度が高いこと」ではなく「決められた期限までに確実に結果が出ること」。ハードリアルタイムは締切超過が重大な失敗となり、ソフトリアルタイムは品質低下として扱う。優先度ベースのスケジューラでは、高優先度タスクが低優先度タスクの持つロックを待つ優先度逆転が起こり得る。優先度継承などで緩和する。\u003c/p>\n\u003cp>周期タスクは処理時間C、周期T、期限Dを考慮する。単純な単一プロセッサ・独立周期タスクでCPU利用率Σ(Cᵢ/Tᵢ)を概算し、1を超えればスケジュール不可能。ただし1以下でも割込みや優先度条件で期限を守れるとは限らない。\u003c/p>\n","worked":"\u003cp>タスクAが5ms/20ms、Bが3ms/10msを必要とするとCPU利用率は5/20＋3/10＝0.55（55%）。残り45%に割込み・OS処理等を見込む必要がある。\u003c/p>\n","prompt":"処理平均が5msで期限10msならリアルタイム要件を満たすか。","answer":"\u003cp>平均だけでは判断できず、最悪実行時間や実測遅延が必要。\u003c/p>\n","beginner":{"scenario":"10msごとに1ms処理するタスクのCPU利用率10%、20msごとに4msなら20%、合計30%。","trap":"周期、期限、CPU実行時間は別。利用率だけでは期限保証にならない。","quizId":"U-06-2"}},{"id":"06-3","title":"通信・電力・信頼性","explain":"\u003cp>組込み装置の通信にはI²C、SPI、UART、CAN、Ethernetなどがあり、距離、速度、ノイズ耐性、配線、リアルタイム性で使い分ける。車載CANは複数ノード間でフレームを共有し、優先順位による調停を行う。無線IoT（Internet of Things：モノのインターネット）では省電力と通信頻度のトレードオフが大きい。\u003c/p>\n\u003cp>機器の故障は物理故障、ソフトウェア欠陥、誤操作や通信不調など多岐にわたる。ウォッチドッグタイマは応答がないソフトウェアを検知して再起動などを促す。二重化は可用性を改善するが、同一不具合で同時故障する可能性も評価する。\u003c/p>\n","worked":"\u003cp>10mAで1時間、1mAで23時間動く装置なら1日平均電流は(10×1＋1×23)/24＝1.375mA。電池容量を平均電流で割ると理想的な稼働時間の目安が出るが、電池の実効容量や温度を考慮する。\u003c/p>\n","prompt":"ウォッチドッグで必ず障害原因が解消するか。","answer":"\u003cp>再起動で一時回復する場合があるが、根本原因の修正やログ保全は別途必要。\u003c/p>\n","beginner":{"scenario":"電池式センサを1秒起動・9秒休止にすると起動時間割合は10%。休止時の電力が小さければ平均消費電力を減らせる。","trap":"安全に停止するフェイルセーフと機能を維持するフォールトトレランスは別。","quizId":"U-06-3"}},{"id":"06-X01","title":"回路・半導体・組込みハードウェア","explain":"\u003cp>AND、OR、NOTを組み合わせた組合せ回路は現在入力で出力が決まり、フリップフロップを含む順序回路は状態を記憶する。半加算器は和と桁上がりを生成し、全加算器は下位からの桁上がりも扱う。ASICは特定用途向けに設計した集積回路、FPGAは製造後に回路構成を変更可能なデバイス。マイコンはCPU、メモリ、周辺回路を統合する。\u003c/p>\u003cp>センサからのアナログ出力をA/D変換（AD変換）し、D/A変換で数値をアナログ信号へ戻す。PWM（パルス幅変調）はON時間の比率で平均出力を制御する。ウォッチドッグタイマは異常停止を検知し再起動等を行う。フェイルセーフは故障時に安全な状態へ、フォールトトレランスは故障しても機能継続を目指す。\u003c/p>","worked":"\u003cp>周期10msでONが3msならデューティ比30%。理想的な5V出力の平均は1.5V。\u003c/p>","prompt":"出荷後に論理回路を再構成できるデバイスは？","answer":"\u003cp>FPGA。\u003c/p>","beginner":{"scenario":"8ビットA/D変換で0〜255が0〜5Vに対応すると仮定すると127は127/255×5≒2.49V。","trap":"A/Dは数値化、D/Aはアナログ化、PWMはON時間比を変える。","quizId":"U-06-X01"}}],"beginnerIntro":"物理世界の計測と制御を扱う。センサ→変換→演算→出力の流れと故障時の安全を理解する。"},{"id":7,"title":"ユーザーインタフェース・UX","group":"テクノロジ","priority":"A標準","summary":"使いやすさと利用者体験を要求・設計・評価に落とし込む。","lessons":[{"title":"UIとUX","body":"UI（User Interface：利用者との接点）は表示や操作系、UX（User Experience：利用者体験）は利用の前後を含む体験全体。見た目が美しくても目的を達成できなければUXは低い。","check":"似た言葉を同義扱いしない。"},{"title":"人間中心設計","body":"利用状況を理解→利用者要求を明確化→設計案→評価を反復する。ペルソナとユーザージャーニーで対象者と利用文脈を可視化。","check":"作り手の好みより実ユーザーの観察が重要。"},{"title":"評価方法","body":"ユーザビリティテストは代表利用者に操作してもらう。A/Bテストは条件を比較するが標本・割付・指標設計が必要。","check":"主観的な感想だけで定量性能を断定しない。"},{"title":"アクセシビリティ","body":"キーボード操作、読み上げ、色のみに依存しない表示、適切な文字コントラストなどで多様な利用者を支援する。","check":"色覚・身体条件だけでなく利用環境の違いにも配慮。"}],"terms":[{"term":"UI","definition":"画面や操作部などシステムと利用者の接点"},{"term":"UX","definition":"利用中だけでなく前後を含めた利用者の体験"},{"term":"ペルソナ","definition":"典型的な利用者像を具体化したモデル"},{"term":"ユーザージャーニー","definition":"利用者の行動や感情を時間順に可視化したもの"},{"term":"プロトタイプ","definition":"設計案を早期に検証するための試作品"},{"term":"アクセシビリティ","definition":"多様な利用者が利用可能であること"},{"term":"ユーザビリティ","definition":"目的を有効・効率的・満足して達成できる程度"},{"term":"ヒューリスティック評価","definition":"経験則に照らして画面などの問題を専門家が点検する方法"},{"term":"A/Bテスト","definition":"異なる二案を割り付けて成果指標を比較する実験"}],"questions":[{"id":"Q07-01","chapter":7,"kind":"applied","q":"画面の操作性だけでなく利用前後の期待や感情まで含む概念は。","options":["UI","UX","API","CPU"],"correct":1,"explain":"UXは利用体験全体を扱う。"},{"id":"Q07-02","chapter":7,"kind":"applied","q":"操作を色だけで区別させないのは主に何のためか。","options":["暗号強度を上げる","可用性を上げる","アクセシビリティを高める","帯域を増やす"],"correct":2,"explain":"色覚などに依存しない操作を支援する。"},{"id":"Q07-03","chapter":7,"kind":"applied","q":"ユーザビリティテストとして最も適切なのは。","options":["画面を開発者だけで確認する","代表利用者が課題を操作する様子を観察する","サーバー稼働率を測る","コードの静的解析をする"],"correct":1,"explain":"実利用者の課題達成状況を観察する。"},{"id":"D07-01","chapter":7,"kind":"applied","q":"フォームの入力誤りを赤色の枠線だけで示したときの改善策として適切なものはどれか。","options":["赤色をさらに濃くする","入力欄をすべて無効化する","エラー文を入力欄と関連付けて表示する","確認をすべて省略する"],"correct":2,"explain":"色だけに依存せず、文章・スクリーンリーダー対応等で伝える。"},{"id":"D07-02","chapter":7,"kind":"applied","q":"使いやすさの評価で操作時間が短くなったが入力誤りが増えた場合、何を検討すべきか。","options":["速度だけで優劣を決める","エラー率や完了率も合わせて評価する","テスト参加者を減らす","利用者の意見は無視する"],"correct":1,"explain":"ユーザビリティは有効さ・効率・満足度など複数尺度で評価する。"},{"id":"D07-03","chapter":7,"kind":"applied","q":"ユーザビリティテストの説明として適切なものはどれか。","options":["利用者による実際の操作を観察する","必ずプログラムのソースコードを読む","利用者の操作を調べない","
